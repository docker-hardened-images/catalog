# syntax=dhi.io/build:2-debian13

name: Firecrawl MCP Server 3.x
image: dhi.io/firecrawl-mcp
variant: runtime
tags:
  - "3"
  - "3.2"
  - 3.2.1
  - latest
  - 3-debian
  - 3-debian13
  - 3.2-debian
  - 3.2-debian13
  - 3.2.1-debian
  - 3.2.1-debian13
platforms:
  - linux/amd64
  - linux/arm64
dates:
  release: "2025-09-26"
vars:
  SEMVER_MAJOR_MINOR_VERSION: "3.2"
  SEMVER_MAJOR_VERSION: "3"
  SEMVER_VERSION: 3.2.1
  VERSION: 3.2.1-2
contents:
  repositories:
    - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
  keyring:
    - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
  packages:
    - base-files
    - ca-certificates-bundle
    - firecrawl-mcp=3.2.1-2
    - libc6
    - libgomp1
    - libstdc++6
    - netbase
    - nodejs-24
    - tzdata
accounts:
  run-as: node
  users:
    - name: node
      uid: 1000
      gid: 1000
  groups:
    - name: node
      gid: 1000
      members:
        - node
os-release:
  name: Docker Hardened Images (Debian)
  id: debian
  version-id: "13"
  version-codename: trixie
  pretty-name: Docker Hardened Images/Debian GNU/Linux 13 (trixie)
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
environment:
  FIRECRAWL_API_KEY: ""
paths:
  - type: symlink
    path: /app
    uid: 0
    gid: 0
    source: /usr/lib/firecrawl-mcp
annotations:
  org.opencontainers.image.description: A minimal Firecrawl MCP Server image
  org.opencontainers.image.licenses: MIT
labels:
  io.modelcontextprotocol.server.name: io.firecrawl/firecrawl-mcp
entrypoint:
  - node
  - /app/dist/index.js
