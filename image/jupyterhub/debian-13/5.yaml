# syntax=dhi.io/build:2-debian13

name: JupyterHub 5.5.x
image: dhi.io/jupyterhub
variant: runtime
tags:
  - "5"
  - "5.5"
  - 5.5.5
  - 5-debian
  - 5-debian13
  - 5.5-debian
  - 5.5-debian13
  - 5.5.5-debian
  - 5.5.5-debian13
platforms:
  - linux/amd64
  - linux/arm64
dates:
  release: "2024-05-24"
vars:
  CONFIGURABLE_HTTP_PROXY_VERSION: 5.4.0-1
  SEMVER_MAJOR_MINOR_VERSION: "5.5"
  SEMVER_MAJOR_VERSION: "5"
  SEMVER_VERSION: 5.5.5
  VERSION: 5.5.5-3
contents:
  repositories:
    - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
  keyring:
    - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
  packages:
    - base-files
    - ca-certificates
    - ca-certificates-bundle
    - configurable-http-proxy=5.4.0-1
    - jupyterhub=5.5.5-3
    - libc6
    - libffi8
    - libstdc++6
    - netbase
    - nodejs-24
    - python-3.14
    - sqlite3
    - tini
    - tzdata
accounts:
  run-as: nonroot
  users:
    - name: nonroot
      uid: 65532
      gid: 65532
  groups:
    - name: nonroot
      gid: 65532
      members:
        - nonroot
os-release:
  name: Docker Hardened Images (Debian)
  id: debian
  version-id: "13"
  version-codename: trixie
  pretty-name: Docker Hardened Images/Debian GNU/Linux 13 (trixie)
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
work-dir: /srv/jupyterhub
environment:
  JUPYTERHUB_VERSION: 5.5.5
  LANG: C.UTF-8
  LC_ALL: C.UTF-8
  PATH: /opt/jupyterhub/.venv/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
  PYTHONUNBUFFERED: "1"
paths:
  - type: directory
    path: /srv/jupyterhub
    uid: 65532
    gid: 65532
    mode: "0755"
  - type: directory
    path: /opt/jupyterhub
    uid: 65532
    gid: 65532
    mode: "0755"
  - type: symlink
    path: /opt/jupyterhub/.venv
    uid: 0
    gid: 0
    source: /usr/lib/jupyterhub
  - type: directory
    path: /srv
    uid: 65532
    gid: 65532
    mode: "0755"
  - type: symlink
    path: /srv/configurable-http-proxy
    uid: 0
    gid: 0
    source: /usr/lib/configurable-http-proxy
  - type: file
    path: /usr/local/bin/configurable-http-proxy
    uid: 0
    gid: 0
    mode: "0755"
    source: image/jupyterhub/files/configurable-http-proxy
annotations:
  org.opencontainers.image.description: A minimal JupyterHub image
  org.opencontainers.image.licenses: BSD-3-Clause
entrypoint:
  - /usr/bin/tini
  - --
cmd:
  - jupyterhub
ports:
  - 8000/tcp
  - 8081/tcp
