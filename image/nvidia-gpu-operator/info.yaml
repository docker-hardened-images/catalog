metadata:
  display-name: NVIDIA GPU Operator
  short-description: |-
    The NVIDIA GPU Operator automates the management of the NVIDIA software
    components needed to provision GPUs in Kubernetes clusters. This image ships
    the operator controller, the nvidia-validator, the vectorAdd CUDA validation
    sample, and kubectl, together with the operand manifests the controller
    renders at runtime and the operator CRDs.
  featured: false
  home-url: https://docs.nvidia.com/datacenter/cloud-native/gpu-operator/overview.html
  categories:
    - machine-learning-and-ai
  included-tools:
    - name: gpu-operator
      description: GPU Operator controller that reconciles the ClusterPolicy and NVIDIADriver custom resources
    - name: nvidia-validator
      description: Validates driver, container toolkit, device plugin, and CUDA workload readiness on GPU nodes
    - name: kubectl
      description: Kubernetes CLI the operator shells out to for operand management
