    - nvidia-validator-26.7-dev=26.7.1-0
    - perl-base
    - sed
    - tzdata
    - util-linux
  builds:
    - name: vectoradd
      uses: dhi.io/nvidia-cuda:13.2.1-debian13-dev@sha256:1317c6558cb554582a8221a140bb5760cdf24ee617e1151399ca98ea0d2ae928
      work-dir: /build
      contents:
        files:
          - url: git+https://github.com/NVIDIA/cuda-samples.git#v12.9
            checksum: cab7c66b4fcf35b09ea8fbc4c3c1a9272e92d997
            path: /build/cuda-samples
            spdx:
              name: cuda-samples
              version: "12.9"
              packages:
                - name: cuda-samples
                  purl: pkg:github/NVIDIA/cuda-samples@v12.9
                  license: BSD-3-Clause
            uid: 0
            gid: 0
      pipeline:
        - name: compile vectorAdd sample
          runs: |
            set -eux -o pipefail

            mkdir -p "${target.dir}/usr/bin"
            nvcc -arch=all-major \
              -I /build/cuda-samples/Common \
              /build/cuda-samples/Samples/0_Introduction/vectorAdd/vectorAdd.cu \
              -o "${target.dir}/usr/bin/vectorAdd"
      outputs:
        - source: ${target.dir}/usr/bin/vectorAdd
          target: /usr/bin/vectorAdd
          uid: 0
          gid: 0
        - source: /opt/docker/sbom/cuda-samples
          target: /opt/docker/sbom/cuda-samples
          uid: 0
          gid: 0
