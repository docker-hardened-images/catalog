# syntax=dhi.io/build:2-debian13

name: NVIDIA GPU Operator 26.3.x
image: dhi.io/nvidia-gpu-operator
variant: runtime
tags:
  - "26"
  - "26.3"
  - 26.3.3
  - 26-debian
  - 26-debian13
  - 26.3-debian
  - 26.3-debian13
  - 26.3.3-debian
  - 26.3.3-debian13
platforms:
  - linux/amd64
  - linux/arm64
dates:
  release: "2026-03-18"
vars:
  CUDA_SAMPLES_VERSION: "12.9"
  FLAVORED_SUFFIX: ""
  KUBECTL_VERSION: 1.34.10-1
  NVIDIA_CUDA_REFERENCE: dhi/nvidia-cuda:13.2.1-debian13-dev@sha256:6f181a6263d2d95d54bfe182bd3061a6690b39366d65b924dccf28e693ae73a3
  SEMVER_MAJOR_MINOR_VERSION: "26.3"
  SEMVER_MAJOR_VERSION: "26"
  SEMVER_VERSION: 26.3.3
  SUFFIX: ""
  VERSION: 26.3.3-1
contents:
  repositories:
    - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
  keyring:
    - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
  packages:
    - '!libelogind0'
    - '!mawk'
    - '!original-awk'
    - base-files
    - ca-certificates-bundle
    - dash
    - kubectl-1.34=1.34.10-1
    - libc6
    - libgcc-s1
    - libstdc++6
    - nvidia-gpu-operator=26.3.3-1
    - nvidia-validator-26.3=26.3.3-1
    - tzdata
  builds:
    - name: vectoradd
      uses: dhi.io/nvidia-cuda:13.2.1-debian13-dev@sha256:6f181a6263d2d95d54bfe182bd3061a6690b39366d65b924dccf28e693ae73a3
      work-dir: /build
      contents:
        packages:
          - gzip
          - tar
        files:
          - url: https://github.com/NVIDIA/cuda-samples/archive/refs/tags/v12.9.tar.gz
            checksum: sha256:2e67e1f6bdb15bf11b21e07e988e2f9f60fb054eff51ef01cebdd47229788015
            path: /build/cuda-samples.tar.gz
            spdx:
              name: cuda-samples
              version: "12.9"
              packages:
                - name: cuda-samples
                  purl: pkg:github/NVIDIA/cuda-samples@v12.9
                  license: BSD-3-Clause
            uid: 0
            gid: 0
      pipeline:
        - name: compile vectorAdd sample
          runs: |
            set -eux -o pipefail

            tar xzf /build/cuda-samples.tar.gz -C /build --strip-components=1
            mkdir -p "${target.dir}/usr/bin"
            nvcc -arch=all-major \
              -I /build/Common \
              /build/Samples/0_Introduction/vectorAdd/vectorAdd.cu \
              -o "${target.dir}/usr/bin/vectorAdd"
      outputs:
        - source: ${target.dir}/usr/bin/vectorAdd
          target: /usr/bin/vectorAdd
          uid: 0
          gid: 0
        - source: /opt/docker/sbom/cuda-samples
          target: /opt/docker/sbom/cuda-samples
          uid: 0
          gid: 0
accounts:
  run-as: nonroot
  users:
    - name: nonroot
      uid: 65532
      gid: 65532
  groups:
    - name: nonroot
      gid: 65532
      members:
        - nonroot
os-release:
  name: Docker Hardened Images (Debian)
  id: debian
  version-id: "13"
  version-codename: trixie
  pretty-name: Docker Hardened Images/Debian GNU/Linux 13 (trixie)
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
environment:
  NVIDIA_VISIBLE_DEVICES: void
annotations:
  org.opencontainers.image.description: A minimal NVIDIA GPU Operator image
  org.opencontainers.image.licenses: Apache-2.0
entrypoint:
  - /usr/bin/gpu-operator
ports:
  - 8080/tcp
  - 8081/tcp
  - 9443/tcp
