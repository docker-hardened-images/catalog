# syntax=dhi.io/build:2-debian13

name: Karma 0.x (dev)
image: dhi.io/karma
variant: dev
tags:
  - 0-dev
  - 0.132-dev
  - 0-debian-dev
  - 0-debian13-dev
  - 0.132-debian-dev
  - 0.132-debian13-dev
platforms:
  - linux/amd64
  - linux/arm64
dates:
  release: "2026-05-18"
vars:
  FLAVORED_SUFFIX: -dev
  SEMVER_MAJOR_MINOR_VERSION: "0.132"
  SEMVER_MAJOR_VERSION: "0"
  SEMVER_VERSION: "0.132"
  SUFFIX: -dev
  VERSION: 0.132-1
contents:
  repositories:
    - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
  keyring:
    - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
  packages:
    - '!gawk'
    - '!libelogind0'
    - '!original-awk'
    - apt
    - base-files
    - bash
    - ca-certificates
    - ca-certificates-bundle
    - coreutils
    - diffutils
    - dpkg
    - findutils
    - grep
    - karma-dev=0.132-1
    - libc-bin
    - mawk
    - perl-base
    - sed
    - tzdata
    - util-linux
accounts:
  root: true
  run-as: root
  users:
    - name: nonroot
      uid: 65532
      gid: 65532
    - name: _apt
      uid: 42
      gid: 65532
  groups:
    - name: nonroot
      gid: 65532
      members:
        - nonroot
os-release:
  name: Docker Hardened Images (Debian)
  id: debian
  version-id: "13"
  version-codename: trixie
  pretty-name: Docker Hardened Images/Debian GNU/Linux 13 (trixie)
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
environment:
  DEBIAN_FRONTEND: noninteractive
paths:
  - type: directory
    path: /usr/local/bin
    uid: 0
    gid: 0
  - type: symlink
    path: /usr/local/bin/karma
    uid: 0
    gid: 0
    source: /usr/bin/karma
  - type: symlink
    path: /karma
    uid: 0
    gid: 0
    source: /usr/bin/karma
annotations:
  org.opencontainers.image.description: A minimal Karma image
  org.opencontainers.image.licenses: Apache-2.0
entrypoint:
  - /usr/local/bin/karma
ports:
  - 8080/tcp
