    path: /usr/local/bin/karma
    uid: 0
    gid: 0
    source: /usr/bin/karma
  - type: symlink
    path: /karma
    uid: 0
    gid: 0
    source: /usr/bin/karma
annotations:
  org.opencontainers.image.description: A minimal Karma image
  org.opencontainers.image.licenses: Apache-2.0
entrypoint:
  - /usr/local/bin/karma
ports:
  - 8080/tcp
