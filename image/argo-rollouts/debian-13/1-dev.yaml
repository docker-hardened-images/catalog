# syntax=dhi.io/build:2-debian13

name: Argo Rollouts 1.9.x (dev)
image: dhi.io/argo-rollouts
variant: dev
tags:
  - 1-dev
  - 1.9-dev
  - 1.9.1-dev
  - 1-debian-dev
  - 1-debian13-dev
  - 1.9-debian-dev
  - 1.9-debian13-dev
  - 1.9.1-debian-dev
  - 1.9.1-debian13-dev
platforms:
  - linux/amd64
  - linux/arm64
dates:
  release: "2025-06-05"
vars:
  COMMIT_SHA: b6bd3bcf8f60d717a98763d26acc983db7f97cb0
  FLAVORED_SUFFIX: -dev
  SEMVER_MAJOR_MINOR_VERSION: "1.9"
  SEMVER_MAJOR_VERSION: "1"
  SEMVER_VERSION: 1.9.1
  SUFFIX: -dev
  VERSION: 1.9.1-1
contents:
  repositories:
    - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
  keyring:
    - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
  packages:
    - '!gawk'
    - '!libelogind0'
    - '!original-awk'
    - apt
    - argo-rollouts-dev=1.9.1-1
    - base-files
    - bash
    - ca-certificates
    - ca-certificates-bundle
    - coreutils
    - diffutils
    - dpkg
    - findutils
    - grep
    - libc-bin
    - mawk
    - perl-base
    - sed
    - tzdata
    - util-linux
accounts:
  root: true
  run-as: root
  users:
    - name: nonroot
      uid: 65532
      gid: 65532
    - name: _apt
      uid: 42
      gid: 65532
  groups:
    - name: nonroot
      gid: 65532
      members:
        - nonroot
os-release:
  name: Docker Hardened Images (Debian)
  id: debian
  version-id: "13"
  version-codename: trixie
  pretty-name: Docker Hardened Images/Debian GNU/Linux 13 (trixie)
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
work-dir: /home/argo-rollouts
environment:
  DEBIAN_FRONTEND: noninteractive
paths:
  - type: directory
    path: /usr/local/bin
    uid: 0
    gid: 0
  - type: symlink
    path: /usr/local/bin/rollouts-controller
    uid: 0
    gid: 0
    source: /usr/bin/rollouts-controller
  - type: directory
    path: /home/argo-rollouts
    uid: 0
    gid: 0
annotations:
  org.opencontainers.image.description: A minimal Argo Rollouts image
  org.opencontainers.image.licenses: Apache-2.0
entrypoint:
  - /bin/rollouts-controller
