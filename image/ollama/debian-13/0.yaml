# syntax=dhi.io/build:2-debian13

name: Ollama 0.x
image: dhi.io/ollama
variant: runtime
tags:
  - "0"
  - "0.40"
  - 0.40.2
  - 0-debian
  - 0-debian13
  - 0.40-debian
  - 0.40-debian13
  - 0.40.2-debian
  - 0.40.2-debian13
platforms:
  - linux/amd64
  - linux/arm64
dates:
  release: "2026-09-15"
vars:
  FLAVORED_SUFFIX: ""
  SEMVER_MAJOR_MINOR_VERSION: "0.40"
  SEMVER_MAJOR_VERSION: "0"
  SEMVER_VERSION: 0.40.2
  SUFFIX: ""
  VERSION: 0.40.2-0
contents:
  repositories:
    - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
  keyring:
    - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
  packages:
    - base-files
    - ca-certificates-bundle
    - libc6
    - libgcc-s1
    - libstdc++6
    - ollama=0.40.2-0
    - tzdata
accounts:
  run-as: nonroot
  users:
    - name: nonroot
      uid: 65532
      gid: 65532
    - name: ollama
      uid: 65532
      gid: 65532
  groups:
    - name: nonroot
      gid: 65532
      members:
        - nonroot
os-release:
  name: Docker Hardened Images (Debian)
  id: debian
  version-id: "13"
  version-codename: trixie
  pretty-name: Docker Hardened Images/Debian GNU/Linux 13 (trixie)
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
environment:
  HOME: /home/ollama
  OLLAMA_HOST: 0.0.0.0:11434
annotations:
  org.opencontainers.image.description: A minimal Ollama image
  org.opencontainers.image.licenses: MIT
entrypoint:
  - /usr/bin/ollama
cmd:
  - serve
ports:
  - 11434/tcp
