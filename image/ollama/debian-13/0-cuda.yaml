# syntax=dhi.io/build:2-debian13

name: Ollama 0.x (cuda)
image: dhi.io/ollama
variant: runtime
flavor: cuda
tags:
  - 0-cuda
  - 0.40-cuda
  - 0.40.2-cuda
  - 0-debian-cuda
  - 0-debian13-cuda
  - 0.40-debian-cuda
  - 0.40-debian13-cuda
  - 0.40.2-debian-cuda
  - 0.40.2-debian13-cuda
platforms:
  - linux/amd64
  - linux/arm64
dates:
  release: "2026-09-15"
vars:
  CUBLAS_RUNTIME_VERSION: 13.4.1.3-1
  CUDA_RUNTIME_VERSION: 13.2.86-1
  FLAVORED_SUFFIX: -cuda
  NVIDIA_ARCH: '#{ target.arch == "amd64" ? "x86_64" : "sbsa" }'
  SEMVER_MAJOR_MINOR_VERSION: "0.40"
  SEMVER_MAJOR_VERSION: "0"
  SEMVER_VERSION: 0.40.2
  SUFFIX: ""
  VERSION: 0.40.2-1
contents:
  repositories:
    - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
    - deb [signed-by=/usr/share/keyrings/8793F200.gpg] https://developer.download.nvidia.com/compute/cuda/repos/debian13/${NVIDIA_ARCH}/ /
  keyring:
    - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
    - https://developer.download.nvidia.com/compute/cuda/repos/debian13/${NVIDIA_ARCH}/8793F200.pub
  packages:
    - base-files
    - ca-certificates-bundle
    - cuda-cudart-13-2
    - libc6
    - libcublas-13-2
    - libgcc-s1
    - libstdc++6
    - ollama-cuda-backend=0.40.2-1
    - ollama=0.40.2-1
    - tzdata
  mappings:
    cuda-cudart-13-2: pkg:deb/nvidia/cuda-cudart-13-2@13.2.86-1?os_name=debian&os_version=13
    libcublas-13-2: pkg:deb/nvidia/libcublas-13-2@13.4.1.3-1?os_name=debian&os_version=13
accounts:
  run-as: nonroot
  users:
    - name: nonroot
      uid: 65532
      gid: 65532
    - name: ollama
      uid: 65532
      gid: 65532
  groups:
    - name: nonroot
      gid: 65532
      members:
        - nonroot
os-release:
  name: Docker Hardened Images (Debian)
  id: debian
  version-id: "13"
  version-codename: trixie
  pretty-name: Docker Hardened Images/Debian GNU/Linux 13 (trixie)
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
environment:
  HOME: /home/ollama
  LD_LIBRARY_PATH: /usr/local/nvidia/lib:/usr/local/nvidia/lib64:/usr/local/cuda/lib64
  NVIDIA_DRIVER_CAPABILITIES: compute,utility
  NVIDIA_REQUIRE_CUDA: cuda>=13.2
  NVIDIA_VISIBLE_DEVICES: all
  OLLAMA_HOST: 0.0.0.0:11434
paths:
  - type: symlink
    path: /usr/local/cuda
    uid: 0
    gid: 0
    source: /usr/local/cuda-13.2
annotations:
  com.nvidia.volumes.needed: nvidia_driver
  org.opencontainers.image.description: A minimal Ollama image
  org.opencontainers.image.licenses: MIT AND LicenseRef-NVIDIA-CUDA-EULA
entrypoint:
  - /usr/bin/ollama
cmd:
  - serve
ports:
  - 11434/tcp
