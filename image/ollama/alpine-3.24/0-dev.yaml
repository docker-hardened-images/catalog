  - 0.40-alpine-dev
  - 0-alpine3.24-dev
  - 0.40.2-alpine-dev
  - 0.40-alpine3.24-dev
  - 0.40.2-alpine3.24-dev
platforms:
  - linux/amd64
  - linux/arm64
dates:
