# syntax=dhi.io/build:2-debian13

name: OpenCost UI 1.x
image: dhi.io/opencost-ui
variant: runtime
tags:
  - "1"
  - "1.121"
  - 1.121.1
  - 1-debian
  - 1-debian13
  - 1.121-debian
  - 1.121-debian13
  - 1.121.1-debian
  - 1.121.1-debian13
platforms:
  - linux/amd64
  - linux/arm64
dates:
  release: "2026-02-09"
vars:
  SEMVER_MAJOR_MINOR_VERSION: "1.121"
  SEMVER_MAJOR_VERSION: "1"
  SEMVER_VERSION: 1.121.1
  VERSION: 1.121.1-2
contents:
  repositories:
    - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
  keyring:
    - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
  packages:
    - base-files
    - bash
    - ca-certificates-bundle
    - coreutils
    - findutils
    - gettext-base
    - libc6
    - libcrypt1
    - libpcre2-8-0
    - libssl3t64
    - nginx-mainline
    - opencost-ui=1.121.1-2
    - sed
    - tzdata
    - zlib1g
  builds:
    - name: opencost-ui-www
      contents:
        repositories:
          - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
        keyring:
          - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
        packages:
          - base-files
          - bash
          - coreutils
          - opencost-ui=1.121.1-2
      pipeline:
        - name: stage www root
          runs: |
            set -eux -o pipefail

            mkdir -p /var/www
            cp -a /usr/share/opencost-ui/. /var/www/
            chown -R 65532:65532 /var/www
      outputs:
        - source: /
          target: /
          uid: 0
          gid: 0
          diff: true
accounts:
  run-as: nginx
  users:
    - name: nginx
      uid: 65532
      gid: 65532
  groups:
    - name: nginx
      gid: 65532
      members:
        - nginx
    - name: www-data
      gid: 82
os-release:
  name: Docker Hardened Images (Debian)
  id: debian
  version-id: "13"
  version-codename: trixie
  pretty-name: Docker Hardened Images/Debian GNU/Linux 13 (trixie)
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
environment:
  API_PORT: "9003"
  API_SERVER: 0.0.0.0
  BASE_URL: /model
  LEGACY_MODE: "false"
  PROXY_CONNECT_TIMEOUT: 60s
  PROXY_READ_TIMEOUT: 60s
  PROXY_SEND_TIMEOUT: 60s
  UI_PATH: /
  UI_PORT: "9090"
  VERSION: 1.121.1
paths:
  - type: directory
    path: /run/nginx
    uid: 65532
    gid: 65532
    mode: "0777"
  - type: directory
    path: /var/cache/nginx
    uid: 65532
    gid: 65532
    mode: "0777"
  - type: directory
    path: /etc/nginx/conf.d
    uid: 65532
    gid: 65532
    mode: "0755"
  - type: file
    path: /etc/nginx/nginx.conf
    uid: 65532
    gid: 65532
    mode: "0644"
    source: image/opencost-ui/config/nginx.conf
  - type: file
    path: /etc/nginx/default.nginx.conf.template
    uid: 65532
    gid: 65532
    mode: "0644"
    source: image/opencost-ui/config/default.nginx.conf.template
  - type: symlink
    path: /var/log/nginx/access.log
    uid: 0
    gid: 0
    source: /dev/stdout
  - type: symlink
    path: /var/log/nginx/error.log
    uid: 0
    gid: 0
    source: /dev/stderr
  - type: file
    path: /usr/local/bin/docker-entrypoint.sh
    uid: 65532
    gid: 65532
    mode: "0755"
    source: image/opencost-ui/entrypoint/docker-entrypoint.sh
annotations:
  org.opencontainers.image.description: A minimal OpenCost UI image
  org.opencontainers.image.licenses: Apache-2.0
entrypoint:
  - /usr/local/bin/docker-entrypoint.sh
cmd:
  - nginx
  - -g
  - daemon off;
ports:
  - 9090/tcp
