# syntax=dhi.io/build:2-alpine3.24

name: Confluent Schema Registry 8.4.x (dev)
image: dhi.io/schema-registry
variant: dev
tags:
  - 8-alpine-dev
  - 8.4-alpine-dev
  - 8-alpine3.24-dev
  - 8.4.1-alpine-dev
  - 8.4-alpine3.24-dev
  - 8.4.1-alpine3.24-dev
platforms:
  - linux/amd64
  - linux/arm64
dates:
  release: "2026-10-27"
vars:
  CP_BASE_DIR: cp-base-java-micro
  JAVA_FIPS_SUFFIX: ""
  JAVA_VERSION: 25.0.5.8.1.2-r0
  JDK_MAJOR_VERSION: "25"
  PACKAGE_FIPS_SUFFIX: ""
  SEMVER_MAJOR_MINOR_VERSION: "8.4"
  SEMVER_MAJOR_VERSION: "8"
  SEMVER_VERSION: 8.4.1
  UB_VERSION: 1.0.18-r2
  VERSION: 8.4.1-r0
contents:
  repositories:
    - https://dhi.io/apk/alpine/v3.24/main
    - https://dl-cdn.alpinelinux.org/alpine/v3.24/main
    - https://dl-cdn.alpinelinux.org/alpine/v3.24/community
  keyring:
    - https://dhi.io/keyring/dhi-apk@docker-0F81AD7700D99184.rsa.pub
  packages:
    - alpine-baselayout-data
    - apk-tools
    - bash
    - busybox
    - ca-certificates
    - ca-certificates-bundle
    - coreutils
    - cp-docker-utils-1=1.0.18-r2
    - eclipse-temurin-25-jre-oci-config=25.0.5.8.1.2-r0
    - eclipse-temurin-25-jre=25.0.5.8.1.2-r0
    - findutils
    - gawk
    - gcompat
    - grep
    - procps
    - schema-registry-8.4=8.4.1-r0
    - sed
    - tzdata
  builds:
    - name: group-writable-directories
      contents:
        packages:
          - bash
          - busybox
      pipeline:
        - name: create the group-writable directories
          runs: |
            set -eux -o pipefail

            install -d -o 1000 -g 0 -m 0775 \
              ${target.dir}/etc/schema-registry \
              ${target.dir}/etc/schema-registry/secrets \
              ${target.dir}/var/log/confluent
            install -d -o 1000 -g 0 -m 0755 ${target.dir}/usr/logs
            install -o 1000 -g 0 -m 0664 /dev/null ${target.dir}/etc/schema-registry/schema-registry.properties
            install -o 1000 -g 0 -m 0664 /dev/null ${target.dir}/etc/schema-registry/log4j2.yaml
      outputs:
        - source: ${target.dir}
          target: /
          uid: 0
          gid: 0
accounts:
  root: true
  run-as: root
  users:
    - name: appuser
      uid: 1000
      gid: 1000
  groups:
    - name: appuser
      gid: 1000
      members:
        - appuser
os-release:
  name: Docker Hardened Images (Alpine)
  id: alpine
  version-id: "3.24"
  pretty-name: Docker Hardened Images/Alpine Linux v3.24
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
work-dir: /home/appuser
environment:
  APP_GID: "1000"
  APP_UID: "1000"
  COMPONENT: schema-registry
  JAVA_HOME: /usr/lib/jvm/temurin-25
  LANG: en_US.UTF-8
  LANGUAGE: en_US:en
  LC_ALL: en_US.UTF-8
  UB_DEFAULT_CLASSPATH: /usr/share/java/cp-base-java-micro/*
  USE_LOG4J_2: "True"
paths:
  - type: symlink
    path: /usr/share/java/cp-base-new
    uid: 0
    gid: 0
    source: /usr/share/java/utility-belt
  - type: symlink
    path: /usr/share/java/cp-base-java-micro
    uid: 0
    gid: 0
    source: /usr/share/java/utility-belt
  - type: directory
    path: /home/appuser
    uid: 1000
    gid: 1000
    mode: "0700"
annotations:
  org.opencontainers.image.description: Confluent Schema Registry - a RESTful schema store for Kafka, started by the Confluent container launch scripts
  org.opencontainers.image.licenses: LicenseRef-Confluent-Community-1.0 AND Apache-2.0
cmd:
  - /etc/confluent/docker/run
ports:
  - 8081/tcp
