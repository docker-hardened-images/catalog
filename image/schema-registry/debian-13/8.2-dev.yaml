# syntax=dhi.io/build:2-debian13

name: Confluent Schema Registry 8.2.x (dev)
image: dhi.io/schema-registry
variant: dev
tags:
  - 8.2-dev
  - 8.2.5-dev
  - 8.2-debian-dev
  - 8.2-debian13-dev
  - 8.2.5-debian-dev
  - 8.2.5-debian13-dev
platforms:
  - linux/amd64
  - linux/arm64
dates:
  release: "2026-03-04"
vars:
  CP_BASE_DIR: cp-base-java
  JAVA_FIPS_SUFFIX: ""
  JAVA_VERSION: 1:21.0.13+9-3
  JDK_MAJOR_VERSION: "21"
  PACKAGE_FIPS_SUFFIX: ""
  SEMVER_MAJOR_MINOR_VERSION: "8.2"
  SEMVER_MAJOR_VERSION: "8"
  SEMVER_VERSION: 8.2.5
  UB_VERSION: 1.0.18-2
  VERSION: 8.2.5-1
contents:
  repositories:
    - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
  keyring:
    - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
  packages:
    - '!gawk'
    - '!libelogind0'
    - '!mawk'
    - '!original-awk'
    - apt
    - base-files
    - bash
    - ca-certificates
    - ca-certificates-bundle
    - coreutils
    - cp-docker-utils-1=1.0.18-2
    - diffutils
    - dpkg
    - eclipse-temurin-21-jre-oci-config=1:21.0.13+9-3
    - eclipse-temurin-21-jre=1:21.0.13+9-3
    - findutils
    - gawk
    - grep
    - hostname
    - libasound2t64
    - libc-bin
    - libgcc-s1
    - libstdc++6
    - mawk
    - perl-base
    - procps
    - schema-registry-8.2=8.2.5-1
    - sed
    - tzdata
    - util-linux
  builds:
    - name: group-writable-directories
      contents:
        repositories:
          - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
        keyring:
          - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
        packages:
          - bash
          - coreutils
      pipeline:
        - name: create the group-writable directories
          runs: |
            set -eux -o pipefail

            install -d -o 1000 -g 0 -m 0775 \
              ${target.dir}/etc/schema-registry \
              ${target.dir}/etc/schema-registry/secrets \
              ${target.dir}/var/log/confluent
            install -d -o 1000 -g 0 -m 0755 ${target.dir}/usr/logs
            install -o 1000 -g 0 -m 0664 /dev/null ${target.dir}/etc/schema-registry/schema-registry.properties
            install -o 1000 -g 0 -m 0664 /dev/null ${target.dir}/etc/schema-registry/log4j2.yaml
      outputs:
        - source: ${target.dir}
          target: /
          uid: 0
          gid: 0
    - name: locale
      contents:
        packages:
          - bash
          - locales
          - coreutils
          - gzip
      pipeline:
        - name: install locales
          runs: |
            set -eux -o pipefail

            ln -s /etc/locale.alias /usr/share/locale/locale.alias

            echo "en_US.UTF-8 UTF-8" >> /etc/locale.gen
            locale-gen en_US.UTF-8
      outputs:
        - source: /usr/share/locale
          target: /usr/share/locale
          uid: 0
          gid: 0
        - source: /usr/lib/locale
          target: /usr/lib/locale
          uid: 0
          gid: 0
accounts:
  root: true
  run-as: root
  users:
    - name: appuser
      uid: 1000
      gid: 1000
    - name: _apt
      uid: 42
      gid: 65532
  groups:
    - name: appuser
      gid: 1000
      members:
        - appuser
os-release:
  name: Docker Hardened Images (Debian)
  id: debian
  version-id: "13"
  version-codename: trixie
  pretty-name: Docker Hardened Images/Debian GNU/Linux 13 (trixie)
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
work-dir: /home/appuser
environment:
  COMPONENT: schema-registry
  DEBIAN_FRONTEND: noninteractive
  JAVA_HOME: /usr/lib/jvm/temurin-21
  LANG: en_US.UTF-8
  LANGUAGE: en_US:en
  LC_ALL: en_US.UTF-8
  USE_LOG4J_2: "True"
paths:
  - type: symlink
    path: /usr/share/java/cp-base-new
    uid: 0
    gid: 0
    source: /usr/share/java/utility-belt
  - type: symlink
    path: /usr/share/java/cp-base-java
    uid: 0
    gid: 0
    source: /usr/share/java/utility-belt
  - type: directory
    path: /home/appuser
    uid: 1000
    gid: 1000
    mode: "0700"
annotations:
  org.opencontainers.image.description: Confluent Schema Registry - a RESTful schema store for Kafka, started by the Confluent container launch scripts
  org.opencontainers.image.licenses: LicenseRef-Confluent-Community-1.0 AND Apache-2.0
cmd:
  - /etc/confluent/docker/run
ports:
  - 8081/tcp
