# syntax=dhi.io/build:2-debian13

name: Ruby 4.0.x
image: dhi.io/ruby
variant: runtime
tags:
  - "4"
  - "4.0"
  - 4.0.6
  - 4-debian
  - 4-debian13
  - 4.0-debian
  - 4.0-debian13
  - 4.0.6-debian
  - 4.0.6-debian13
platforms:
  - linux/amd64
  - linux/arm64
vars:
  GEM_HOME: /usr/local/bundle
  SEMVER_MAJOR_MINOR_VERSION: "4.0"
  SEMVER_MAJOR_VERSION: "4"
  SEMVER_VERSION: 4.0.6
  VERSION: 4.0.6-32
contents:
  repositories:
    - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
  keyring:
    - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
  packages:
    - '!libelogind0'
    - '!mawk'
    - '!original-awk'
    - base-files
    - ca-certificates
    - libc6
    - libcrypt1
    - libexpat1
    - libffi8
    - libgcc-s1
    - libgmp10
    - libjemalloc2
    - libssl3t64
    - libyaml-0-2
    - ruby-4.0
    - ruby-4.0=4.0.6-32
    - zlib1g
accounts:
  run-as: nonroot
  users:
    - name: nonroot
      uid: 65532
      gid: 65532
  groups:
    - name: nonroot
      gid: 65532
      members:
        - nonroot
os-release:
  name: Docker Hardened Images (Debian)
  id: debian
  version-id: "13"
  version-codename: trixie
  pretty-name: Docker Hardened Images/Debian GNU/Linux 13 (trixie)
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
environment:
  BUNDLE_APP_CONFIG: /usr/local/bundle
  BUNDLE_SILENCE_ROOT_WARNING: "true"
  GEM_HOME: /usr/local/bundle
  LD_LIBRARY_PATH: /usr/local/lib:${LD_LIBRARY_PATH}
  PATH: /usr/local/bin:/usr/local/bundle/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
  RUBY_VERSION: 4.0.6-32
  SSL_CERT_FILE: /etc/ssl/certs/ca-certificates.crt
paths:
  - type: directory
    path: /usr/local/bin
    uid: 0
    gid: 0
  - type: symlink
    path: /usr/local/bin/ruby
    uid: 0
    gid: 0
    source: /usr/bin/ruby
annotations:
  org.opencontainers.image.description: A minimal Ruby image
  org.opencontainers.image.licenses: BSD-2-Clause
cmd:
  - ruby
