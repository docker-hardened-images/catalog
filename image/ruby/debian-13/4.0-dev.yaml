# syntax=dhi.io/build:2-debian13

name: Ruby 4.0.x (dev)
image: dhi.io/ruby
variant: dev
tags:
  - 4-dev
  - 4.0-dev
  - 4.0.6-dev
  - 4-debian-dev
  - 4-debian13-dev
  - 4.0-debian-dev
  - 4.0-debian13-dev
  - 4.0.6-debian-dev
  - 4.0.6-debian13-dev
platforms:
  - linux/amd64
  - linux/arm64
vars:
  BINUTILS_ARCH: '#{ target.arch == "amd64" ? "x86-64" : "aarch64" }'
  GEM_HOME: /usr/local/bundle
  SEMVER_MAJOR_MINOR_VERSION: "4.0"
  SEMVER_MAJOR_VERSION: "4"
  SEMVER_VERSION: 4.0.6
  VERSION: 4.0.6-26
contents:
  repositories:
    - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
  keyring:
    - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
  packages:
    - '!binutils'
    - '!binutils-aarch64-linux-gnu'
    - '!binutils-common'
    - '!binutils-x86-64-linux-gnu'
    - '!gawk'
    - '!libbinutils'
    - '!libctf-nobfd0'
    - '!libctf0'
    - '!libelogind0'
    - '!libgprofng0'
    - '!libsframe1'
    - '!mawk'
    - '!original-awk'
    - apt
    - base-files
    - bash
    - binutils-latest
    - binutils-latest-${BINUTILS_ARCH}-linux-gnu
    - build-essential
    - ca-certificates
    - coreutils
    - diffutils
    - dpkg
    - findutils
    - git
    - grep
    - libc-bin
    - libc6
    - libcrypt1
    - libctf-nobfd0-latest
    - libctf0-latest
    - libexpat1
    - libffi-dev
    - libffi8
    - libgcc-s1
    - libgmp-dev
    - libgmp10
    - libgprofng0-latest
    - libjemalloc-dev
    - libjemalloc2
    - libssl-dev
    - libssl3t64
    - libyaml-0-2
    - libyaml-dev
    - make
    - mawk
    - perl-base
    - ruby-4.0
    - ruby-4.0-dev
    - ruby-4.0-dev=4.0.6-26
    - ruby-4.0=4.0.6-26
    - sed
    - tzdata
    - util-linux
    - zlib1g
accounts:
  root: true
  run-as: root
  users:
    - name: nonroot
      uid: 65532
      gid: 65532
    - name: _apt
      uid: 42
      gid: 65532
  groups:
    - name: nonroot
      gid: 65532
      members:
        - nonroot
os-release:
  name: Docker Hardened Images (Debian)
  id: debian
  version-id: "13"
  version-codename: trixie
  pretty-name: Docker Hardened Images/Debian GNU/Linux 13 (trixie)
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
environment:
  BUNDLE_APP_CONFIG: /usr/local/bundle
  BUNDLE_SILENCE_ROOT_WARNING: "true"
  DEBIAN_FRONTEND: noninteractive
  GEM_HOME: /usr/local/bundle
  LD_LIBRARY_PATH: /usr/local/lib:${LD_LIBRARY_PATH}
  PATH: /usr/local/bin:/usr/local/bundle/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
  RUBY_VERSION: 4.0.6-26
  SSL_CERT_FILE: /etc/ssl/certs/ca-certificates.crt
paths:
  - type: directory
    path: /usr/local/bundle
    uid: 65532
    gid: 65532
    mode: "0755"
annotations:
  org.opencontainers.image.description: A minimal Ruby image
  org.opencontainers.image.licenses: BSD-2-Clause
cmd:
  - /bin/bash
