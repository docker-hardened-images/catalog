# syntax=dhi.io/build:2-debian13

name: Argo Workflow Controller 4.x
image: dhi.io/argo-workflow-controller
variant: runtime
tags:
  - "4"
  - "4.0"
  - 4.0.8
  - 4-debian
  - 4-debian13
  - 4.0-debian
  - 4.0-debian13
  - 4.0.8-debian
  - 4.0.8-debian13
platforms:
  - linux/amd64
  - linux/arm64
vars:
  FLAVORED_SUFFIX: ""
  SEMVER_MAJOR_MINOR_VERSION: "4.0"
  SEMVER_MAJOR_VERSION: "4"
  SEMVER_VERSION: 4.0.8
  SUFFIX: ""
  VERSION: 4.0.8-2
contents:
  repositories:
    - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
  keyring:
    - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
  packages:
    - argo-workflows-4=4.0.8-2
    - base-files
    - ca-certificates-bundle
    - tzdata
accounts:
  run-as: argocd
  users:
    - name: argocd
      uid: 8737
      gid: 8737
  groups:
    - name: argocd
      gid: 8737
      members:
        - argocd
os-release:
  name: Docker Hardened Images (Debian)
  id: debian
  version-id: "13"
  version-codename: trixie
  pretty-name: Docker Hardened Images/Debian GNU/Linux 13 (trixie)
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
paths:
  - type: directory
    path: /usr/local/bin
    uid: 0
    gid: 0
  - type: symlink
    path: /usr/local/bin/workflow-controller
    uid: 0
    gid: 0
    source: /usr/bin/workflow-controller
annotations:
  org.opencontainers.image.description: A minimal Argo Workflow Controller image
  org.opencontainers.image.licenses: Apache-2.0
entrypoint:
  - workflow-controller
