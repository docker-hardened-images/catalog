# syntax=dhi.io/build:2-debian13

name: Argo Workflow Controller 3.x (dev)
image: dhi.io/argo-workflow-controller
variant: dev
tags:
  - 3-dev
  - 3.7-dev
  - 3.7.18-dev
  - 3-debian-dev
  - 3-debian13-dev
  - 3.7-debian-dev
  - 3.7-debian13-dev
  - 3.7.18-debian-dev
  - 3.7.18-debian13-dev
platforms:
  - linux/amd64
  - linux/arm64
vars:
  FLAVORED_SUFFIX: -dev
  SEMVER_MAJOR_MINOR_VERSION: "3.7"
  SEMVER_MAJOR_VERSION: "3"
  SEMVER_VERSION: 3.7.18
  SUFFIX: -dev
  VERSION: 3.7.18-0
contents:
  repositories:
    - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
  keyring:
    - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
  packages:
    - '!gawk'
    - '!libelogind0'
    - '!original-awk'
    - apt
    - argo-workflows-3-dev=3.7.18-0
    - base-files
    - bash
    - ca-certificates
    - ca-certificates-bundle
    - coreutils
    - diffutils
    - dpkg
    - findutils
    - grep
    - libc-bin
    - mawk
    - perl-base
    - sed
    - tzdata
    - util-linux
accounts:
  root: true
  run-as: root
  users:
    - name: argocd
      uid: 8737
      gid: 8737
    - name: _apt
      uid: 42
      gid: 65532
  groups:
    - name: argocd
      gid: 8737
      members:
        - argocd
os-release:
  name: Docker Hardened Images (Debian)
  id: debian
  version-id: "13"
  version-codename: trixie
  pretty-name: Docker Hardened Images/Debian GNU/Linux 13 (trixie)
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
environment:
  DEBIAN_FRONTEND: noninteractive
paths:
  - type: directory
    path: /usr/local/bin
    uid: 0
    gid: 0
  - type: symlink
    path: /usr/local/bin/workflow-controller
    uid: 0
    gid: 0
    source: /usr/bin/workflow-controller
annotations:
  org.opencontainers.image.description: A minimal Argo Workflow Controller image
  org.opencontainers.image.licenses: Apache-2.0
entrypoint:
  - workflow-controller
