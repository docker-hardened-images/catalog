# syntax=dhi.io/build:2-debian13

name: redis-exporter 1.90.x (compat)
image: dhi.io/redis-exporter
variant: runtime
flavor: compat
tags:
  - 1-compat
  - 1.90-compat
  - 1.90.0-compat
  - 1-debian-compat
  - 1-debian13-compat
  - 1.90-debian-compat
  - 1.90-debian13-compat
  - 1.90.0-debian-compat
  - 1.90.0-debian13-compat
platforms:
  - linux/amd64
  - linux/arm64
dates:
  release: "2026-05-21"
vars:
  DEBIAN_VERSION: 1.90.0-2
  FLAVORED_SUFFIX: -compat
  SEMVER_MAJOR_MINOR_VERSION: "1.90"
  SEMVER_MAJOR_VERSION: "1"
  SEMVER_VERSION: 1.90.0
  SUFFIX: ""
  VERSION: 1.90.0
contents:
  repositories:
    - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
  keyring:
    - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
  packages:
    - base-files
    - bash
    - ca-certificates
    - ca-certificates-bundle
    - coreutils
    - findutils
    - redis-exporter=1.90.0-2
    - tzdata
accounts:
  run-as: nonroot
  users:
    - name: nonroot
      uid: 65532
      gid: 65532
  groups:
    - name: nonroot
      gid: 65532
      members:
        - nonroot
os-release:
  name: Docker Hardened Images (Debian)
  id: debian
  version-id: "13"
  version-codename: trixie
  pretty-name: Docker Hardened Images/Debian GNU/Linux 13 (trixie)
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
paths:
  - type: directory
    path: /usr/local/bin
    uid: 0
    gid: 0
    mode: "0755"
  - type: symlink
    path: /usr/local/bin/redis-exporter
    uid: 0
    gid: 0
    source: /usr/bin/redis-exporter
annotations:
  org.opencontainers.image.description: A minimal redis-exporter image
  org.opencontainers.image.licenses: MIT
entrypoint:
  - /usr/local/bin/redis-exporter
ports:
  - 9121/tcp
