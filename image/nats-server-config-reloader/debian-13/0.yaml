name: NATS Server Config Reloader 0.x
image: dhi.io/nats-server-config-reloader
variant: runtime
tags:
  - "0"
  - "0.24"
  - 0.24.0
  - 0-debian
  - 0-debian13
  - 0.24-debian
  - 0.24-debian13
  - 0.24.0-debian
  - 0.24.0-debian13
platforms:
  - linux/amd64
  - linux/arm64
dates:
  release: "2025-12-05"
vars:
  COMMIT_SHA: e700bc2f5b8a4a9429fdcea39be32c13390c22f3
  SEMVER_MAJOR_MINOR_VERSION: "0.24"
  SEMVER_MAJOR_VERSION: "0"
  SEMVER_VERSION: 0.24.0
  VERSION: 0.24.0
contents:
  repositories:
    - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
  keyring:
    - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
  packages:
    - base-files
    - ca-certificates-bundle
    - tzdata
  builds:
    - name: nats-server-config-reloader
      work-dir: /go/src/github.com/nats-io/nack
      caches:
        - path: /go/pkg/mod
      contents:
        packages:
          - bash
          - ca-certificates-bundle
          - coreutils
          - golang-1.26
          - findutils
          - mawk
          - sed
        files:
          - url: git+https://github.com/nats-io/nack.git#v0.24.0
            checksum: e700bc2f5b8a4a9429fdcea39be32c13390c22f3
            path: /go/src/github.com/nats-io/nack
            spdx:
              name: nats-server-config-reloader
              version: 0.24.0
              packages:
                - name: nats-server-config-reloader
                  purl: pkg:golang/github.com/nats-io/nack@v0.24.0
                  license: Apache-2.0
            uid: 0
            gid: 0
      pipeline:
        - name: update go dependencies
          uses: go/bump@v1
          with:
            deps: []
            download: true
        - name: test
          runs: |
            set -eux -o pipefail

            # Also skips boot config and tests requiring etcd
            CGO_ENABLED=0 go test -v ./pkg/natsreloader/... ./controllers/... ./internal/... -skip 'TestControllers' --failfast -p=1
        - name: build
          uses: go/build@v1
          with:
            ldflags:
              - -s -w
              - -X main.Version=0.24.0
              - -X main.GitInfo=e700bc2f5b8a4a9429fdcea39be32c13390c22f3
              - -X main.BuildTime=${SOURCE_DATE_EPOCH}
            output: ${target.dir}/usr/local/bin/nats-server-config-reloader
            packages: ./cmd/nats-server-config-reloader/
      outputs:
        - source: ${target.dir}/usr/local/bin/nats-server-config-reloader
          target: /usr/local/bin/nats-server-config-reloader
          uid: 0
          gid: 0
        - source: /opt/docker/sbom/nats-server-config-reloader
          target: /opt/docker/sbom/nats-server-config-reloader
          uid: 0
          gid: 0
accounts:
  run-as: nonroot
  users:
    - name: nonroot
      uid: 65532
      gid: 65532
  groups:
    - name: nonroot
      gid: 65532
      members:
        - nonroot
os-release:
  name: Docker Hardened Images (Debian)
  id: debian
  version-id: "13"
  version-codename: trixie
  pretty-name: Docker Hardened Images/Debian GNU/Linux 13 (trixie)
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
annotations:
  org.opencontainers.image.description: A minimal nats-server-config-reloader image
  org.opencontainers.image.licenses: Apache-2.0
entrypoint:
  - /usr/local/bin/nats-server-config-reloader
