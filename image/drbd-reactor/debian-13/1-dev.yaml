# syntax=dhi.io/build:2-debian13

name: drbd-reactor 1.x (dev)
image: dhi.io/drbd-reactor
variant: dev
tags:
  - 1-dev
  - 1.12-dev
  - 1.12.0-dev
  - 1-debian-dev
  - 1-debian13-dev
  - 1.12-debian-dev
  - 1.12-debian13-dev
  - 1.12.0-debian-dev
  - 1.12.0-debian13-dev
platforms:
  - linux/amd64
  - linux/arm64
vars:
  DRBD_UTILS_VERSION: 9.35.0-0
  SEMVER_MAJOR_MINOR_VERSION: "1.12"
  SEMVER_MAJOR_VERSION: "1"
  SEMVER_VERSION: 1.12.0
  VERSION: 1.12.0-0
contents:
  repositories:
    - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
  keyring:
    - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
  packages:
    - '!gawk'
    - '!libelogind0'
    - '!original-awk'
    - apt
    - base-files
    - bash
    - ca-certificates
    - ca-certificates-bundle
    - coreutils
    - diffutils
    - dpkg
    - drbd-reactor=1.12.0-0
    - drbd-utils=9.35.0-0
    - findutils
    - grep
    - libc-bin
    - libkeyutils1
    - mawk
    - mount
    - perl-base
    - sed
    - tzdata
    - util-linux
accounts:
  root: true
  run-as: root
  users:
    - name: nonroot
      uid: 65532
      gid: 65532
    - name: _apt
      uid: 42
      gid: 65532
  groups:
    - name: nonroot
      gid: 65532
      members:
        - nonroot
os-release:
  name: Docker Hardened Images (Debian)
  id: debian
  version-id: "13"
  version-codename: trixie
  pretty-name: Docker Hardened Images/Debian GNU/Linux 13 (trixie)
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
environment:
  DEBIAN_FRONTEND: noninteractive
paths:
  - type: directory
    path: /usr/local/bin
    uid: 0
    gid: 0
  - type: symlink
    path: /usr/local/bin/drbd-reactor
    uid: 0
    gid: 0
    source: /usr/sbin/drbd-reactor
annotations:
  org.opencontainers.image.description: A minimal drbd-reactor image
  org.opencontainers.image.licenses: GPL-2.0
cmd:
  - /usr/sbin/drbd-reactor
