# syntax=dhi.io/build:2-debian13

name: Varnish Cache 8.0.x (dev)
image: dhi.io/varnish
variant: dev
tags:
  - 8-dev
  - 8.0-dev
  - 8.0.0-dev
  - 8-debian-dev
  - 8-debian13-dev
  - 8.0-debian-dev
  - 8.0-debian13-dev
  - 8.0.0-debian-dev
  - 8.0.0-debian13-dev
platforms:
  - linux/amd64
  - linux/arm64
dates:
  release: "2025-09-15"
  end-of-life: "2026-09-15"
vars:
  BINUTILS_ARCH: '#{ target.arch == "amd64" ? "x86-64" : "aarch64" }'
  PACKAGE_NAME: varnish-8.0
  SEMVER_MAJOR_MINOR_VERSION: "8.0"
  SEMVER_MAJOR_VERSION: "8"
  SEMVER_VERSION: 8.0.0
  VERSION: 8.0.0-0
contents:
  repositories:
    - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
  keyring:
    - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
  packages:
    - '!binutils'
    - '!binutils-aarch64-linux-gnu'
    - '!binutils-common'
    - '!binutils-x86-64-linux-gnu'
    - '!gawk'
    - '!libbinutils'
    - '!libctf-nobfd0'
    - '!libctf0'
    - '!libelogind0'
    - '!libgprofng0'
    - '!libsframe1'
    - '!original-awk'
    - apt
    - base-files
    - bash
    - binutils-latest
    - binutils-latest-${BINUTILS_ARCH}-linux-gnu
    - ca-certificates
    - ca-certificates-bundle
    - coreutils
    - dash
    - diffutils
    - dpkg
    - findutils
    - gcc
    - gcc-14-base
    - grep
    - libc-bin
    - libc6
    - libc6-dev
    - libctf-nobfd0-latest
    - libctf0-latest
    - libedit2
    - libgcc-s1
    - libgprofng0-latest
    - libjemalloc2
    - libncursesw6
    - libpcre2-8-0
    - libssl3t64
    - libtinfo6
    - libunwind8
    - mawk
    - perl-base
    - sed
    - tzdata
    - util-linux
    - varnish-8.0=8.0.0-0
  builds:
    - name: legacy usr-local lib symlinks
      contents:
        repositories:
          - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
        keyring:
          - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
        packages:
          - bash
          - coreutils
          - varnish-8.0=8.0.0-0
      pipeline:
        - runs: |
            set -eux -o pipefail

            mkdir -p /usr/local/lib
            for lib in /usr/lib/libvarnish*.so* /usr/lib/libvcc*.so*; do
              if [ -e "$lib" ]; then
                ln -sfn "$lib" "/usr/local/lib/$(basename "$lib")"
              fi
            done
      outputs:
        - source: /usr/local/lib
          target: /usr/local/lib
          uid: 0
          gid: 0
accounts:
  root: true
  run-as: root
  users:
    - name: nonroot
      uid: 65532
      gid: 65532
    - name: _apt
      uid: 42
      gid: 65532
  groups:
    - name: nonroot
      gid: 65532
      members:
        - nonroot
os-release:
  name: Docker Hardened Images (Debian)
  id: debian
  version-id: "13"
  version-codename: trixie
  pretty-name: Docker Hardened Images/Debian GNU/Linux 13 (trixie)
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
work-dir: /var/lib/varnish
environment:
  DEBIAN_FRONTEND: noninteractive
paths:
  - type: directory
    path: /etc/varnish
    uid: 65532
    gid: 65532
    mode: "0755"
  - type: directory
    path: /var/lib/varnish
    uid: 65532
    gid: 65532
    mode: "0755"
  - type: directory
    path: /usr/local/bin
    uid: 0
    gid: 0
  - type: symlink
    path: /usr/local/bin/varnishd
    uid: 0
    gid: 0
    source: /usr/sbin/varnishd
  - type: symlink
    path: /usr/local/bin/varnishadm
    uid: 0
    gid: 0
    source: /usr/bin/varnishadm
  - type: symlink
    path: /usr/local/bin/varnishlog
    uid: 0
    gid: 0
    source: /usr/bin/varnishlog
  - type: symlink
    path: /usr/local/bin/varnishstat
    uid: 0
    gid: 0
    source: /usr/bin/varnishstat
  - type: symlink
    path: /usr/local/bin/varnishhist
    uid: 0
    gid: 0
    source: /usr/bin/varnishhist
  - type: symlink
    path: /usr/local/bin/varnishncsa
    uid: 0
    gid: 0
    source: /usr/bin/varnishncsa
  - type: symlink
    path: /usr/local/bin/varnishtop
    uid: 0
    gid: 0
    source: /usr/bin/varnishtop
  - type: symlink
    path: /usr/local/bin/varnishtest
    uid: 0
    gid: 0
    source: /usr/bin/varnishtest
  - type: directory
    path: /usr/local/include
    uid: 0
    gid: 0
  - type: symlink
    path: /usr/local/include/varnish
    uid: 0
    gid: 0
    source: /usr/include/varnish
  - type: directory
    path: /usr/local/share
    uid: 0
    gid: 0
  - type: symlink
    path: /usr/local/share/varnish
    uid: 0
    gid: 0
    source: /usr/share/varnish
annotations:
  org.opencontainers.image.description: A minimal Varnish Cache image
  org.opencontainers.image.licenses: BSD-2-Clause
entrypoint:
  - /usr/local/bin/varnishd
cmd:
  - -F
  - -f
  - /etc/varnish/default.vcl
  - -a
  - http=:8080,HTTP
  - -a
  - proxy=:8443,PROXY
  - -p
  - feature=+http2
  - -s
  - malloc,100M
ports:
  - 8080/tcp
  - 8443/tcp
