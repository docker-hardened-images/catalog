# syntax=dhi.io/build:2-debian13

name: Istio Pilot 1.29.x (dev)
image: dhi.io/istio-pilot
variant: dev
tags:
  - 1.29-dev
  - 1.29.10-dev
  - 1.29-debian-dev
  - 1.29-debian13-dev
  - 1.29.10-debian-dev
  - 1.29.10-debian13-dev
platforms:
  - linux/amd64
  - linux/arm64
dates:
  release: "2026-02-16"
  end-of-life: "2026-10-12"
vars:
  PACKAGE_SUFFIX: -dev
  SEMVER_MAJOR_MINOR_VERSION: "1.29"
  SEMVER_MAJOR_VERSION: "1"
  SEMVER_VERSION: 1.29.10
  VERSION: 1.29.10-1
contents:
  repositories:
    - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
  keyring:
    - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
  packages:
    - '!gawk'
    - '!libelogind0'
    - '!original-awk'
    - apt
    - base-files
    - bash
    - ca-certificates
    - ca-certificates-bundle
    - coreutils
    - diffutils
    - dpkg
    - findutils
    - grep
    - istio-pilot-1.29-dev=1.29.10-1
    - libc-bin
    - mawk
    - perl-base
    - sed
    - tzdata
    - util-linux
  builds:
    - name: istio-pilot-sbom
      contents:
        packages:
          - bash
          - coreutils
      pipeline:
        - uses: spdx@v1
          with:
            license: Apache-2.0
            name: istio-pilot
            purl: pkg:golang/istio.io/istio@1.29.10
            version: 1.29.10
      outputs:
        - source: /opt/docker/sbom/istio-pilot
          target: /opt/docker/sbom/istio-pilot
          uid: 0
          gid: 0
accounts:
  root: true
  run-as: root
  users:
    - name: istio-proxy
      uid: 1337
      gid: 1337
    - name: _apt
      uid: 42
      gid: 65532
  groups:
    - name: istio-proxy
      gid: 1337
      members:
        - istio-proxy
os-release:
  name: Docker Hardened Images (Debian)
  id: debian
  version-id: "13"
  version-codename: trixie
  pretty-name: Docker Hardened Images/Debian GNU/Linux 13 (trixie)
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
environment:
  DEBIAN_FRONTEND: noninteractive
paths:
  - type: directory
    path: /usr/local/bin
    uid: 0
    gid: 0
  - type: symlink
    path: /usr/local/bin/pilot-discovery
    uid: 0
    gid: 0
    source: /usr/bin/pilot-discovery
annotations:
  org.opencontainers.image.description: A minimal Istio Pilot image
  org.opencontainers.image.licenses: Apache-2.0
entrypoint:
  - /usr/local/bin/pilot-discovery
