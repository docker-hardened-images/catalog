# syntax=dhi.io/build:2-debian13

name: Istio Pilot 1.30.x
image: dhi.io/istio-pilot
variant: runtime
tags:
  - "1"
  - "1.30"
  - 1.30.3
  - 1-debian
  - 1-debian13
  - 1.30-debian
  - 1.30-debian13
  - 1.30.3-debian
  - 1.30.3-debian13
platforms:
  - linux/amd64
  - linux/arm64
dates:
  release: "2026-05-18"
vars:
  PACKAGE_SUFFIX: ""
  SEMVER_MAJOR_MINOR_VERSION: "1.30"
  SEMVER_MAJOR_VERSION: "1"
  SEMVER_VERSION: 1.30.3
  VERSION: 1.30.3-1
contents:
  repositories:
    - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
  keyring:
    - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
  packages:
    - base-files
    - ca-certificates-bundle
    - istio-pilot=1.30.3-1
    - tzdata
accounts:
  run-as: "1337"
  users:
    - name: istio-proxy
      uid: 1337
      gid: 1337
  groups:
    - name: istio-proxy
      gid: 1337
      members:
        - istio-proxy
os-release:
  name: Docker Hardened Images (Debian)
  id: debian
  version-id: "13"
  version-codename: trixie
  pretty-name: Docker Hardened Images/Debian GNU/Linux 13 (trixie)
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
paths:
  - type: directory
    path: /usr/local/bin
    uid: 0
    gid: 0
  - type: symlink
    path: /usr/local/bin/pilot-discovery
    uid: 0
    gid: 0
    source: /usr/bin/pilot-discovery
annotations:
  org.opencontainers.image.description: A minimal Istio Pilot image
  org.opencontainers.image.licenses: Apache-2.0
entrypoint:
  - /usr/local/bin/pilot-discovery
