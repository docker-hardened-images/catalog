# syntax=dhi.io/build:2-alpine3.23

name: PHP 8.3.x
image: dhi.io/php
variant: runtime
tags:
  - 8.3-alpine3.23
  - 8.3.36-alpine3.23
platforms:
  - linux/amd64
  - linux/arm64
dates:
  release: "2023-11-23"
  end-of-life: "2027-12-31"
vars:
  PHP_PREFIX: /opt/php-8.3
  PHP_SYSCONFDIR: /etc/php-8.3
  SEMVER_MAJOR_MINOR_VERSION: "8.3"
  SEMVER_MAJOR_VERSION: "8"
  SEMVER_VERSION: 8.3.36
  VERSION: 8.3.36-r0
contents:
  repositories:
    - https://dhi.io/apk/alpine/v3.23/main
    - https://dl-cdn.alpinelinux.org/alpine/v3.23/main
    - https://dl-cdn.alpinelinux.org/alpine/v3.23/community
  keyring:
    - https://dhi.io/keyring/dhi-apk@docker-0F81AD7700D99184.rsa.pub
  packages:
    - alpine-baselayout-data
    - argon2-libs
    - ca-certificates-bundle
    - icu-data-full
    - icu-libs
    - libcrypto3
    - libcurl
    - libsodium
    - libssl3
    - libxml2
    - oniguruma
    - pcre2
    - php-8.3=8.3.36-r0
    - readline
    - sqlite-libs
    - tzdata
    - zlib
accounts:
  run-as: nonroot
  users:
    - name: nonroot
      uid: 65532
      gid: 65532
  groups:
    - name: nonroot
      gid: 65532
      members:
        - nonroot
os-release:
  name: Docker Hardened Images (Alpine)
  id: alpine
  version-id: "3.23"
  pretty-name: Docker Hardened Images/Alpine Linux v3.23
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
environment:
  PATH: /opt/php-8.3/bin:/opt/php-8.3/sbin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
  PHP_INI_DIR: /usr/local/etc/php
  PHP_PREFIX: /opt/php-8.3
  PHP_VERSION: 8.3.36-r0
paths:
  - type: directory
    path: /opt
    uid: 0
    gid: 0
  - type: directory
    path: /opt/php-8.3
    uid: 0
    gid: 0
  - type: directory
    path: /opt/php-8.3/bin
    uid: 0
    gid: 0
  - type: directory
    path: /opt/php-8.3/sbin
    uid: 0
    gid: 0
  - type: directory
    path: /opt/php-8.3/lib
    uid: 0
    gid: 0
  - type: directory
    path: /opt/php-8.3/etc
    uid: 0
    gid: 0
  - type: symlink
    path: /opt/php-8.3/bin/php
    uid: 0
    gid: 0
    source: /usr/bin/php
  - type: symlink
    path: /opt/php-8.3/bin/phar
    uid: 0
    gid: 0
    source: /usr/bin/phar
  - type: symlink
    path: /opt/php-8.3/lib/php
    uid: 0
    gid: 0
    source: /usr/lib/php
  - type: symlink
    path: /opt/php-8.3/etc/php
    uid: 0
    gid: 0
    source: /etc/php-8.3
  - type: symlink
    path: /opt/php
    uid: 0
    gid: 0
    source: /opt/php-8.3
  - type: directory
    path: /usr/local/etc
    uid: 0
    gid: 0
  - type: symlink
    path: /usr/local/etc/php
    uid: 0
    gid: 0
    source: /etc/php-8.3
  - type: directory
    path: /var/www/html
    uid: 65532
    gid: 65532
    mode: "0755"
annotations:
