# syntax=dhi.io/build:2-debian13

name: PHP 8.2.x
image: dhi.io/php
variant: runtime
tags:
  - "8.2"
  - 8.2.35
  - 8.2-debian
  - 8.2-debian13
  - 8.2.35-debian
  - 8.2.35-debian13
platforms:
  - linux/amd64
  - linux/arm64
dates:
  release: "2022-12-08"
  end-of-life: "2026-12-31"
vars:
  CFLAGS: -fstack-protector-strong -fpic -fpie -O2 -D_LARGEFILE_SOURCE -D_FILE_OFFSET_BITS=64
  CHECKSUM: 5737b98601fe5ab1b8c5db0c82ed3158acb9283ed3081ffe2faffb9ac81455e6
  CPPFLAGS: -fstack-protector-strong -fpic -fpie -O2 -D_LARGEFILE_SOURCE -D_FILE_OFFSET_BITS=64
  LDFLAGS: -Wl,-O1 -pie
  PHP_PREFIX: /opt/php-8.2
  PHP_SYSCONFDIR: /etc/php-8.2
  SEMVER_MAJOR_MINOR_VERSION: "8.2"
  SEMVER_MAJOR_VERSION: "8"
  SEMVER_VERSION: 8.2.35
  VERSION: 8.2.35-0
contents:
  repositories:
    - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
  keyring:
    - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
  packages:
    - '!libelogind0'
    - '!mawk'
    - '!original-awk'
    - base-files
    - ca-certificates
    - libargon2-1
    - libcurl4t64
    - libicu76
    - libonig5
    - libpcre2-8-0
    - libreadline8t64
    - libsodium23
    - libsqlite3-0
    - libssl3t64
    - libxml2
    - php-8.2=8.2.35-0
    - zlib1g
accounts:
  run-as: nonroot
  users:
    - name: nonroot
      uid: 65532
      gid: 65532
  groups:
    - name: nonroot
      gid: 65532
      members:
        - nonroot
os-release:
  name: Docker Hardened Images (Debian)
  id: debian
  version-id: "13"
  version-codename: trixie
  pretty-name: Docker Hardened Images/Debian GNU/Linux 13 (trixie)
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
environment:
  PATH: /opt/php-8.2/bin:/opt/php-8.2/sbin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
  PHP_INI_DIR: /usr/local/etc/php
  PHP_PREFIX: /opt/php-8.2
  PHP_VERSION: 8.2.35
paths:
  - type: directory
    path: /opt/php-8.2/bin
    uid: 0
    gid: 0
    mode: "0755"
  - type: symlink
    path: /opt/php-8.2/bin/php
    uid: 0
    gid: 0
    source: /usr/bin/php-8.2
  - type: symlink
    path: /opt/php-8.2/bin/phar
    uid: 0
    gid: 0
    source: /usr/bin/phar-8.2
  - type: directory
    path: /opt/php-8.2/lib/php
    uid: 0
    gid: 0
    mode: "0755"
  - type: symlink
    path: /opt/php-8.2/lib/php/extensions
    uid: 0
    gid: 0
    source: /usr/lib/php/extensions
  - type: symlink
    path: /opt/php
    uid: 0
    gid: 0
    source: /opt/php-8.2
  - type: directory
    path: /usr/local/etc
    uid: 0
    gid: 0
    mode: "0755"
  - type: symlink
    path: /usr/local/etc/php
    uid: 0
    gid: 0
    source: /etc/php-8.2
  - type: directory
    path: /var/www/html
    uid: 65532
    gid: 65532
    mode: "0755"
annotations:
  org.opencontainers.image.description: A minimal PHP image
  org.opencontainers.image.licenses: PHP-3.01
entrypoint:
  - /opt/php-8.2/bin/php
