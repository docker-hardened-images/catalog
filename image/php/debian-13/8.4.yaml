# syntax=dhi.io/build:2-debian13

name: PHP 8.4.x
image: dhi.io/php
variant: runtime
tags:
  - "8.4"
  - 8.4.27
  - 8.4-debian
  - 8.4-debian13
  - 8.4.27-debian
  - 8.4.27-debian13
platforms:
  - linux/amd64
  - linux/arm64
dates:
  release: "2024-11-21"
  end-of-life: "2028-12-31"
vars:
  CFLAGS: -fstack-protector-strong -fpic -fpie -O2 -D_LARGEFILE_SOURCE -D_FILE_OFFSET_BITS=64
  CHECKSUM: dcf93923b0e38e0d5252b25b796520b5a47761a08b3488b6d0b5d1115764d3f0
  CPPFLAGS: -fstack-protector-strong -fpic -fpie -O2 -D_LARGEFILE_SOURCE -D_FILE_OFFSET_BITS=64
  LDFLAGS: -Wl,-O1 -pie
  PHP_PREFIX: /opt/php-8.4
  PHP_SYSCONFDIR: /etc/php-8.4
  SEMVER_MAJOR_MINOR_VERSION: "8.4"
  SEMVER_MAJOR_VERSION: "8"
  SEMVER_VERSION: 8.4.27
  VERSION: 8.4.27-0
contents:
  repositories:
    - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
  keyring:
    - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
  packages:
    - '!libelogind0'
    - '!mawk'
    - '!original-awk'
    - base-files
    - ca-certificates
    - libargon2-1
    - libcurl4t64
    - libicu76
    - libonig5
    - libpcre2-8-0
    - libreadline8t64
    - libsodium23
    - libsqlite3-0
    - libssl3t64
    - libxml2
    - php-8.4=8.4.27-0
    - zlib1g
accounts:
  run-as: nonroot
  users:
    - name: nonroot
      uid: 65532
      gid: 65532
  groups:
    - name: nonroot
      gid: 65532
      members:
        - nonroot
os-release:
  name: Docker Hardened Images (Debian)
  id: debian
  version-id: "13"
  version-codename: trixie
  pretty-name: Docker Hardened Images/Debian GNU/Linux 13 (trixie)
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
environment:
  PATH: /opt/php-8.4/bin:/opt/php-8.4/sbin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
  PHP_INI_DIR: /usr/local/etc/php
  PHP_PREFIX: /opt/php-8.4
  PHP_VERSION: 8.4.27
paths:
  - type: directory
    path: /opt/php-8.4/bin
    uid: 0
    gid: 0
    mode: "0755"
  - type: symlink
    path: /opt/php-8.4/bin/php
    uid: 0
    gid: 0
    source: /usr/bin/php-8.4
  - type: symlink
    path: /opt/php-8.4/bin/phar
    uid: 0
    gid: 0
    source: /usr/bin/phar-8.4
  - type: directory
    path: /opt/php-8.4/lib/php
    uid: 0
    gid: 0
    mode: "0755"
  - type: symlink
    path: /opt/php-8.4/lib/php/extensions
    uid: 0
    gid: 0
    source: /usr/lib/php/extensions
  - type: symlink
    path: /opt/php
    uid: 0
    gid: 0
    source: /opt/php-8.4
  - type: directory
    path: /usr/local/etc
    uid: 0
    gid: 0
    mode: "0755"
  - type: symlink
    path: /usr/local/etc/php
    uid: 0
    gid: 0
    source: /etc/php-8.4
  - type: directory
    path: /var/www/html
    uid: 65532
    gid: 65532
    mode: "0755"
annotations:
  org.opencontainers.image.description: A minimal PHP image
  org.opencontainers.image.licenses: PHP-3.01
entrypoint:
  - /opt/php-8.4/bin/php
