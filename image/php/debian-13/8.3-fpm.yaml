# syntax=dhi.io/build:2-debian13

name: PHP 8.3.x (fpm)
image: dhi.io/php
variant: runtime
flavor: fpm
tags:
  - 8.3-fpm
  - 8.3.36-fpm
  - 8.3-debian-fpm
  - 8.3-debian13-fpm
  - 8.3.36-debian-fpm
  - 8.3.36-debian13-fpm
platforms:
  - linux/amd64
  - linux/arm64
dates:
  release: "2023-11-23"
  end-of-life: "2027-12-31"
vars:
  CFLAGS: -fstack-protector-strong -fpic -fpie -O2 -D_LARGEFILE_SOURCE -D_FILE_OFFSET_BITS=64
  CHECKSUM: dd54693aa334c5c4d72e9aee96b082c2473750a18a6c1d105789c93a3b1692fd
  CPPFLAGS: -fstack-protector-strong -fpic -fpie -O2 -D_LARGEFILE_SOURCE -D_FILE_OFFSET_BITS=64
  LDFLAGS: -Wl,-O1 -pie
  PHP_PREFIX: /opt/php-8.3
  PHP_SYSCONFDIR: /etc/php-8.3
  SEMVER_MAJOR_MINOR_VERSION: "8.3"
  SEMVER_MAJOR_VERSION: "8"
  SEMVER_VERSION: 8.3.36
  VERSION: 8.3.36-0
contents:
  repositories:
    - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
  keyring:
    - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
  packages:
    - '!libelogind0'
    - '!mawk'
    - '!original-awk'
    - base-files
    - ca-certificates
    - libargon2-1
    - libcurl4t64
    - libicu76
    - libonig5
    - libpcre2-8-0
    - libreadline8t64
    - libsodium23
    - libsqlite3-0
    - libssl3t64
    - libxml2
    - php-8.3-fpm=8.3.36-0
    - php-8.3=8.3.36-0
    - zlib1g
accounts:
  run-as: nonroot
  users:
    - name: nonroot
      uid: 65532
      gid: 65532
  groups:
    - name: nonroot
      gid: 65532
      members:
        - nonroot
os-release:
  name: Docker Hardened Images (Debian)
  id: debian
  version-id: "13"
  version-codename: trixie
  pretty-name: Docker Hardened Images/Debian GNU/Linux 13 (trixie)
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
work-dir: /var/www/html
stop-signal: SIGQUIT
environment:
  PATH: /opt/php-8.3/bin:/opt/php-8.3/sbin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
  PHP_INI_DIR: /usr/local/etc/php
  PHP_PREFIX: /opt/php-8.3
  PHP_VERSION: 8.3.36
paths:
  - type: directory
    path: /opt/php-8.3/bin
    uid: 0
    gid: 0
    mode: "0755"
  - type: symlink
    path: /opt/php-8.3/bin/php
    uid: 0
    gid: 0
    source: /usr/bin/php-8.3
  - type: symlink
    path: /opt/php-8.3/bin/phar
    uid: 0
    gid: 0
    source: /usr/bin/phar-8.3
  - type: directory
    path: /opt/php-8.3/sbin
    uid: 0
    gid: 0
    mode: "0755"
  - type: symlink
    path: /opt/php-8.3/sbin/php-fpm
    uid: 0
    gid: 0
    source: /usr/sbin/php-fpm-8.3
  - type: directory
    path: /opt/php-8.3/lib/php
    uid: 0
    gid: 0
    mode: "0755"
  - type: symlink
    path: /opt/php-8.3/lib/php/extensions
    uid: 0
    gid: 0
    source: /usr/lib/php/extensions
  - type: symlink
    path: /opt/php
    uid: 0
    gid: 0
    source: /opt/php-8.3
  - type: directory
    path: /usr/local/etc
    uid: 0
    gid: 0
    mode: "0755"
  - type: symlink
    path: /usr/local/etc/php
    uid: 0
    gid: 0
    source: /etc/php-8.3
  - type: directory
    path: /var/www/html
    uid: 65532
    gid: 65532
    mode: "0755"
  - type: file
    path: /etc/php-8.3/conf.d/fpm.ini
    content: |
      ; https://github.com/docker-library/php/issues/878#issuecomment-938595965
      fastcgi.logging = Off
    uid: 0
    gid: 0
    mode: "0644"
  - type: file
    path: /etc/php-8.3/php-fpm.d/docker.conf
    content: |
      [global]
      error_log = /proc/self/fd/2

      ; https://github.com/docker-library/php/pull/725#issuecomment-443540114
      log_limit = 8192

      [www]
      ; php-fpm closes STDOUT on startup, so sending logs to /proc/self/fd/1 does not work.
      ; https://bugs.php.net/bug.php?id=73886
      access.log = /proc/self/fd/2

      clear_env = no

      ; Ensure worker stdout and stderr are sent to the main error log.
      catch_workers_output = yes
      decorate_workers_output = no

      ; default listen adddress for easy override in later php-fpm.d/*.conf files
      listen = 9000
    uid: 0
    gid: 0
    mode: "0644"
  - type: file
    path: /etc/php-8.3/php-fpm.d/zz-docker.conf
    content: |
      [global]
      daemonize = no

      [www]
    uid: 0
    gid: 0
    mode: "0644"
annotations:
  org.opencontainers.image.description: A minimal PHP image
  org.opencontainers.image.licenses: PHP-3.01
entrypoint:
  - /opt/php-8.3/sbin/php-fpm
ports:
  - 9000/tcp
