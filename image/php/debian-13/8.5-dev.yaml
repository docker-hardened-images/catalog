    - zlib1g
    - zlib1g-dev
  builds:
    - name: locale
      contents:
        packages:
          - bash
          - locales
          - coreutils
          - gzip
      pipeline:
        - name: install locales
          runs: |
            set -eux -o pipefail

            ln -s /etc/locale.alias /usr/share/locale/locale.alias

            echo "en_US.UTF-8 UTF-8" >> /etc/locale.gen
            locale-gen en_US.UTF-8
      outputs:
        - source: /usr/share/locale
          target: /usr/share/locale
          uid: 0
          gid: 0
        - source: /usr/lib/locale
          target: /usr/lib/locale
          uid: 0
          gid: 0
    - name: php source
      work-dir: ${source.dir}
      shell: bash
      contents:
        packages:
          - bash
          - coreutils
          - debianutils
          - tar
          - xz-utils
        files:
          - url: https://www.php.net/distributions/php-8.5.12.tar.xz.asc
            path: ${source.dir}/php-8.5.12.tar.xz.asc
            uid: 0
            gid: 0
          - url: https://www.php.net/distributions/php-8.5.12.tar.xz
            checksum: sha256:08bc2eba2a588654ade1357174aa646b761556c862dda0678345ee29ed481209
            path: ${source.dir}/php-8.5.12.tar.xz
            spdx:
              name: php
              version: 8.5.12
              packages:
                - name: php
                  purl: pkg:dhi/php@8.5.12
                  license: PHP-3.01
            uid: 0
            gid: 0
      pipeline:
        - name: verify php source
          uses: gpg/verify@v1
          with:
            file: ${source.dir}/php-8.5.12.tar.xz
            keys: ${source.dir}/keyring.asc
            signature: ${source.dir}/php-8.5.12.tar.xz.asc
        - name: extract php source
          runs: |
            set -eux -o pipefail

            tar -xJf "php-8.5.12.tar.xz"
            mkdir -p "${target.dir}/opt/php-8.5/src"
            cp -a "php-8.5.12/." "${target.dir}/opt/php-8.5/src"
      paths:
        - type: file
          path: ${source.dir}/keyring.asc
          uid: 0
          gid: 0
          source: image/php/key/php8.5.keyring.asc
      outputs:
        - source: ${target.dir}/opt/php-8.5/src
          target: /opt/php-8.5/src
          uid: 0
          gid: 0
