# syntax=dhi.io/build:2-alpine3.24

name: Kubeflow Central Dashboard 2.x (dev)
image: dhi.io/kubeflow-central-dashboard
variant: dev
tags:
  - 2-alpine-dev
  - 2.0-alpine-dev
  - 2-alpine3.24-dev
  - 2.0.1-alpine-dev
  - 2.0-alpine3.24-dev
  - 2.0.1-alpine3.24-dev
platforms:
  - linux/amd64
  - linux/arm64
dates:
  release: "2026-06-02"
vars:
  APK_MAJOR_MINOR_VERSION: "2.0"
  APK_MAJOR_VERSION: "2"
  APK_VERSION: 2.0.1
  VERSION: 2.0.1-r1
contents:
  repositories:
    - https://dhi.io/apk/alpine/v3.24/main
    - https://dl-cdn.alpinelinux.org/alpine/v3.24/main
    - https://dl-cdn.alpinelinux.org/alpine/v3.24/community
  keyring:
    - https://dhi.io/keyring/dhi-apk@docker-0F81AD7700D99184.rsa.pub
  packages:
    - alpine-baselayout-data
    - apk-tools
    - bash
    - busybox
    - ca-certificates
    - ca-certificates-bundle
    - coreutils
    - findutils
    - kubeflow-central-dashboard-2=2.0.1-r1
    - nodejs-22
    - npm-12
    - tini
    - tzdata
accounts:
  root: true
  run-as: root
  users:
    - name: node
      uid: 1000
      gid: 1000
  groups:
    - name: node
      gid: 1000
      members:
        - node
os-release:
  name: Docker Hardened Images (Alpine)
  id: alpine
  version-id: "3.24"
  pretty-name: Docker Hardened Images/Alpine Linux v3.24
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
work-dir: /usr/src/app
environment:
  NODE_ENV: production
  NPM_CONFIG_UPDATE_NOTIFIER: "false"
paths:
  - type: directory
    path: /usr/src
    uid: 0
    gid: 0
    mode: "0755"
  - type: symlink
    path: /usr/src/app
    uid: 0
    gid: 0
    source: /usr/lib/kubeflow-central-dashboard
  - type: symlink
    path: /usr/bin/tini
    uid: 0
    gid: 0
    source: /sbin/tini
  - type: directory
    path: /usr/local/bin
    uid: 0
    gid: 0
    mode: "0755"
  - type: symlink
    path: /usr/local/bin/node
    uid: 0
    gid: 0
    source: /usr/bin/node
annotations:
  org.opencontainers.image.description: A minimal Kubeflow Central Dashboard image
  org.opencontainers.image.licenses: Apache-2.0
entrypoint:
  - /usr/bin/tini
  - --
  - node
  - dist/server.js
ports:
  - 8082/tcp
