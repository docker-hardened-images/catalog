# syntax=dhi.io/build:2-debian13

name: Kubeflow Central Dashboard 2.x (dev)
image: dhi.io/kubeflow-central-dashboard
variant: dev
tags:
  - 2-dev
  - 2.0-dev
  - 2.0.1-dev
  - 2-debian-dev
  - 2-debian13-dev
  - 2.0-debian-dev
  - 2.0-debian13-dev
  - 2.0.1-debian-dev
  - 2.0.1-debian13-dev
platforms:
  - linux/amd64
  - linux/arm64
dates:
  release: "2026-06-02"
vars:
  DEBIAN_EPOCH_MAJOR_MINOR_VERSION: "2.0"
  DEBIAN_EPOCH_MAJOR_VERSION: "2"
  DEBIAN_EPOCH_VERSION: 2.0.1
  VERSION: 2.0.1-0
contents:
  repositories:
    - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
  keyring:
    - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
  packages:
    - '!gawk'
    - '!libelogind0'
    - '!mawk'
    - '!original-awk'
    - apt
    - base-files
    - bash
    - ca-certificates
    - ca-certificates-bundle
    - coreutils
    - diffutils
    - dpkg
    - findutils
    - grep
    - kubeflow-central-dashboard-2=2.0.1-0
    - libc-bin
    - mawk
    - nodejs-22
    - npm-12
    - perl-base
    - sed
    - tini
    - tzdata
    - util-linux
  builds:
    - name: locale
      contents:
        packages:
          - bash
          - locales
          - coreutils
          - gzip
      pipeline:
        - name: install locales
          runs: |
            set -eux -o pipefail

            ln -s /etc/locale.alias /usr/share/locale/locale.alias

            echo "en_US.UTF-8 UTF-8" >> /etc/locale.gen
            locale-gen en_US.UTF-8
      outputs:
        - source: /usr/share/locale
          target: /usr/share/locale
          uid: 0
          gid: 0
        - source: /usr/lib/locale
          target: /usr/lib/locale
          uid: 0
          gid: 0
accounts:
  root: true
  run-as: root
  users:
    - name: node
      uid: 1000
      gid: 1000
    - name: _apt
      uid: 42
      gid: 65532
  groups:
    - name: node
      gid: 1000
      members:
        - node
os-release:
  name: Docker Hardened Images (Debian)
  id: debian
  version-id: "13"
  version-codename: trixie
  pretty-name: Docker Hardened Images/Debian GNU/Linux 13 (trixie)
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
work-dir: /usr/src/app
environment:
  DEBIAN_FRONTEND: noninteractive
  LANG: en_US.UTF-8
  LANGUAGE: en_US:en
  LC_ALL: en_US.UTF-8
  NODE_ENV: production
  NPM_CONFIG_UPDATE_NOTIFIER: "false"
paths:
  - type: directory
    path: /usr/src
    uid: 0
    gid: 0
    mode: "0755"
  - type: symlink
    path: /usr/src/app
    uid: 0
    gid: 0
    source: /usr/lib/kubeflow-central-dashboard
  - type: directory
    path: /usr/local/bin
    uid: 0
    gid: 0
    mode: "0755"
  - type: symlink
    path: /usr/local/bin/node
    uid: 0
    gid: 0
    source: /usr/bin/node
annotations:
  org.opencontainers.image.description: A minimal Kubeflow Central Dashboard image
  org.opencontainers.image.licenses: Apache-2.0
entrypoint:
  - /usr/bin/tini
  - --
  - node
  - dist/server.js
ports:
  - 8082/tcp
