# syntax=dhi.io/build:2-debian13

name: Kubeflow Central Dashboard 2.x
image: dhi.io/kubeflow-central-dashboard
variant: runtime
tags:
  - "2"
  - "2.0"
  - 2.0.1
  - 2-debian
  - 2-debian13
  - 2.0-debian
  - 2.0-debian13
  - 2.0.1-debian
  - 2.0.1-debian13
platforms:
  - linux/amd64
  - linux/arm64
dates:
  release: "2026-06-02"
vars:
  DEBIAN_EPOCH_MAJOR_MINOR_VERSION: "2.0"
  DEBIAN_EPOCH_MAJOR_VERSION: "2"
  DEBIAN_EPOCH_VERSION: 2.0.1
  VERSION: 2.0.1-1
contents:
  repositories:
    - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
  keyring:
    - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
  packages:
    - '!libelogind0'
    - '!mawk'
    - '!original-awk'
    - base-files
    - ca-certificates-bundle
    - kubeflow-central-dashboard-2=2.0.1-1
    - nodejs-22
    - tini
    - tzdata
accounts:
  run-as: node
  users:
    - name: node
      uid: 1000
      gid: 1000
  groups:
    - name: node
      gid: 1000
      members:
        - node
os-release:
  name: Docker Hardened Images (Debian)
  id: debian
  version-id: "13"
  version-codename: trixie
  pretty-name: Docker Hardened Images/Debian GNU/Linux 13 (trixie)
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
work-dir: /usr/src/app
environment:
  NODE_ENV: production
paths:
  - type: directory
    path: /usr/src
    uid: 0
    gid: 0
    mode: "0755"
  - type: symlink
    path: /usr/src/app
    uid: 0
    gid: 0
    source: /usr/lib/kubeflow-central-dashboard
  - type: directory
    path: /usr/local/bin
    uid: 0
    gid: 0
    mode: "0755"
  - type: symlink
    path: /usr/local/bin/node
    uid: 0
    gid: 0
    source: /usr/bin/node
annotations:
  org.opencontainers.image.description: A minimal Kubeflow Central Dashboard image
  org.opencontainers.image.licenses: Apache-2.0
entrypoint:
  - /usr/bin/tini
  - --
  - node
  - dist/server.js
ports:
  - 8082/tcp
