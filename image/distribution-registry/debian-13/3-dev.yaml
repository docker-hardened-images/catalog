# syntax=dhi.io/build:2-debian13

name: Distribution Registry 3.x (dev)
image: dhi.io/distribution-registry
variant: dev
tags:
  - 3-dev
  - 3.1-dev
  - 3.1.1-dev
  - 3-debian-dev
  - 3-debian13-dev
  - 3.1-debian-dev
  - 3.1-debian13-dev
  - 3.1.1-debian-dev
  - 3.1.1-debian13-dev
platforms:
  - linux/amd64
  - linux/arm64
dates:
  release: "2025-04-03"
vars:
  FLAVORED_SUFFIX: -dev
  SEMVER_MAJOR_MINOR_VERSION: "3.1"
  SEMVER_MAJOR_VERSION: "3"
  SEMVER_VERSION: 3.1.1
  SUFFIX: -dev
  VERSION: 3.1.1-2
contents:
  repositories:
    - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
  keyring:
    - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
  packages:
    - '!gawk'
    - '!libelogind0'
    - '!original-awk'
    - apt
    - base-files
    - bash
    - ca-certificates
    - ca-certificates-bundle
    - coreutils
    - diffutils
    - distribution-registry-dev=3.1.1-2
    - dpkg
    - findutils
    - grep
    - libc-bin
    - mawk
    - perl-base
    - sed
    - tzdata
    - util-linux
  files:
    - url: https://raw.githubusercontent.com/distribution/distribution/v3.1.1/cmd/registry/config-dev.yml
      checksum: sha256:21f5a34a6652d0ddac0977901d318b44164966af98ea83c76b9269057fc26189
      path: /etc/distribution/config.yml
      uid: 0
      gid: 0
accounts:
  root: true
  run-as: root
  users:
    - name: nonroot
      uid: 65532
      gid: 65532
    - name: _apt
      uid: 42
      gid: 65532
  groups:
    - name: nonroot
      gid: 65532
      members:
        - nonroot
os-release:
  name: Docker Hardened Images (Debian)
  id: debian
  version-id: "13"
  version-codename: trixie
  pretty-name: Docker Hardened Images/Debian GNU/Linux 13 (trixie)
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
environment:
  DEBIAN_FRONTEND: noninteractive
  OTEL_TRACES_EXPORTER: none
paths:
  - type: directory
    path: /var/lib/registry
    uid: 65532
    gid: 65532
    mode: "0770"
  - type: directory
    path: /usr/local/bin
    uid: 0
    gid: 0
  - type: symlink
    path: /usr/local/bin/registry
    uid: 0
    gid: 0
    source: /usr/bin/registry
annotations:
  org.opencontainers.image.description: A minimal Distribution Registry image
  org.opencontainers.image.licenses: Apache-2.0
entrypoint:
  - /bin/registry
cmd:
  - serve
  - /etc/distribution/config.yml
ports:
  - 5000/tcp
