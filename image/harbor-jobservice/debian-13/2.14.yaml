# syntax=dhi.io/build:2-debian13

name: Harbor Job Service 2.x
image: dhi.io/harbor-jobservice
variant: runtime
tags:
  - "2.14"
  - 2.14.6
  - 2.14-debian
  - 2.14-debian13
  - 2.14.6-debian
  - 2.14.6-debian13
platforms:
  - linux/amd64
  - linux/arm64
dates:
  release: "2025-09-17"
vars:
  FLAVORED_SUFFIX: ""
  SEMVER_MAJOR_MINOR_VERSION: "2.14"
  SEMVER_MAJOR_VERSION: "2"
  SEMVER_VERSION: 2.14.6
  SUFFIX: ""
  VERSION: 2.14.6-1
contents:
  repositories:
    - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
  keyring:
    - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
  packages:
    - base-files
    - ca-certificates-bundle
    - harbor-jobservice-2.14=2.14.6-1
    - tzdata
accounts:
  run-as: nonroot
  users:
    - name: nonroot
      uid: 65532
      gid: 65532
  groups:
    - name: nonroot
      gid: 65532
      members:
        - nonroot
os-release:
  name: Docker Hardened Images (Debian)
  id: debian
  version-id: "13"
  version-codename: trixie
  pretty-name: Docker Hardened Images/Debian GNU/Linux 13 (trixie)
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
paths:
  - type: directory
    path: /usr/local/bin
    uid: 0
    gid: 0
  - type: symlink
    path: /usr/local/bin/harbor-jobservice
    uid: 0
    gid: 0
    source: /usr/bin/harbor-jobservice
annotations:
  org.opencontainers.image.description: A minimal Harbor Job Service image
  org.opencontainers.image.licenses: Apache-2.0
entrypoint:
  - /usr/local/bin/harbor-jobservice
cmd:
  - -c
  - /etc/jobservice/config.yml
ports:
  - 8080/tcp
  - 8443/tcp
