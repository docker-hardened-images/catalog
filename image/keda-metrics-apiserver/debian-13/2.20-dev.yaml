# syntax=dhi.io/build:2-debian13

name: KEDA Metrics API Server 2.20.x (dev)
image: dhi.io/keda-metrics-apiserver
variant: dev
tags:
  - 2-dev
  - 2.20-dev
  - 2.20.2-dev
  - 2-debian-dev
  - 2-debian13-dev
  - 2.20-debian-dev
  - 2.20-debian13-dev
  - 2.20.2-debian-dev
  - 2.20.2-debian13-dev
platforms:
  - linux/amd64
  - linux/arm64
dates:
  release: "2026-06-01"
vars:
  COMMIT_SHA: 68a5b5028f35b22d50597c69819ab32c4e92f21a
  SEMVER_MAJOR_MINOR_VERSION: "2.20"
  SEMVER_MAJOR_VERSION: "2"
  SEMVER_VERSION: 2.20.2
  VERSION: 2.20.2
contents:
  repositories:
    - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
  keyring:
    - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
  packages:
    - '!gawk'
    - '!libelogind0'
    - '!original-awk'
    - apt
    - base-files
    - bash
    - ca-certificates
    - ca-certificates-bundle
    - coreutils
    - diffutils
    - dpkg
    - findutils
    - grep
    - libc-bin
    - mawk
    - perl-base
    - sed
    - tzdata
    - util-linux
  builds:
    - name: keda-go
      work-dir: /go/src/github.com/kedacore/keda
      caches:
        - path: /go/pkg/mod
      contents:
        packages:
          - bash
          - ca-certificates-bundle
          - coreutils
          - golang-1.26
          - findutils
          - mawk
          - sed
        files:
          - url: git+https://github.com/kedacore/keda.git#v2.20.2
            checksum: 68a5b5028f35b22d50597c69819ab32c4e92f21a
            path: /go/src/github.com/kedacore/keda
            spdx:
              name: keda-metrics-apiserver
              version: 2.20.2
              packages:
                - name: keda-metrics-apiserver
                  purl: pkg:dhi/keda-metrics-apiserver@2.20.2
                  license: Apache-2.0
            uid: 0
            gid: 0
      pipeline:
        - name: remove vendor directory
          work-dir: /go/src/github.com/kedacore/keda
          runs: |
            set -eux -o pipefail

            rm -rf vendor
        - name: update go dependencies (2.20 only)
          uses: go/bump@v1
          work-dir: /go/src/github.com/kedacore/keda
          with:
            deps:
              - golang.org/x/text@v0.39.0
              - golang.org/x/net@v0.56.0
              - github.com/google/cel-go@v0.29.0
              - github.com/klauspost/compress@v1.18.7
              - go.opentelemetry.io/otel@v1.44.0
              - google.golang.org/grpc@v1.82.1
            download: true
            replaces:
              - github.com/google/cel-go=github.com/google/cel-go@v0.29.0
            tidy: true
        - name: sync vendor directory
          work-dir: /go/src/github.com/kedacore/keda
          runs: |
            set -eux -o pipefail

            go mod vendor
        - name: build
          uses: go/build@v1
          with:
            ldflags:
              - -X=github.com/kedacore/keda/v2/version.GitCommit=68a5b5028f35b22d50597c69819ab32c4e92f21a
              - -X=github.com/kedacore/keda/v2/version.Version=2.20.2
            output: ${target.dir}/keda-adapter
            packages: ./cmd/adapter/main.go
      outputs:
        - source: ${target.dir}/keda-adapter
          target: /keda-adapter
          uid: 0
          gid: 0
          mode: "0755"
        - source: /opt/docker/sbom/keda-metrics-apiserver
          target: /opt/docker/sbom/keda-metrics-apiserver
          uid: 0
          gid: 0
accounts:
  root: true
  run-as: root
  users:
    - name: nonroot
      uid: 65532
      gid: 65532
    - name: _apt
      uid: 42
      gid: 65532
  groups:
    - name: nonroot
      gid: 65532
      members:
        - nonroot
os-release:
  name: Docker Hardened Images (Debian)
  id: debian
  version-id: "13"
  version-codename: trixie
  pretty-name: Docker Hardened Images/Debian GNU/Linux 13 (trixie)
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
environment:
  DEBIAN_FRONTEND: noninteractive
annotations:
  org.opencontainers.image.description: A minimal KEDA Admission Webhooks image
  org.opencontainers.image.licenses: Apache-2.0
entrypoint:
  - /keda-adapter
cmd:
  - --secure-port=6443
  - --logtostderr=true
  - --v=0
