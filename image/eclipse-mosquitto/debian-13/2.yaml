# syntax=dhi.io/build:2-debian13

name: Eclipse Mosquitto 2.x
image: dhi.io/eclipse-mosquitto
variant: runtime
tags:
  - "2"
  - "2.1"
  - 2.1.2
  - 2-debian
  - 2-debian13
  - 2.1-debian
  - 2.1-debian13
  - 2.1.2-debian
  - 2.1.2-debian13
platforms:
  - linux/amd64
  - linux/arm64
dates:
  release: "2020-12-03"
vars:
  SEMVER_MAJOR_MINOR_VERSION: "2.1"
  SEMVER_MAJOR_VERSION: "2"
  SEMVER_VERSION: 2.1.2
  VERSION: 2.1.2-0
contents:
  repositories:
    - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
  keyring:
    - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
  packages:
    - '!libelogind0'
    - '!mawk'
    - '!original-awk'
    - base-files
    - ca-certificates-bundle
    - eclipse-mosquitto=2.1.2-0
    - libcap2
    - libcjson1
    - libedit2
    - libmicrohttpd12t64
    - libsqlite3-0
    - libssl3t64
    - libwebsockets19t64
    - tzdata
accounts:
  run-as: nonroot
  users:
    - name: nonroot
      uid: 65532
      gid: 65532
  groups:
    - name: nonroot
      gid: 65532
      members:
        - nonroot
os-release:
  name: Docker Hardened Images (Debian)
  id: debian
  version-id: "13"
  version-codename: trixie
  pretty-name: Docker Hardened Images/Debian GNU/Linux 13 (trixie)
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
paths:
  - type: directory
    path: /mosquitto
    uid: 0
    gid: 0
  - type: symlink
    path: /mosquitto/config
    uid: 0
    gid: 0
    source: /etc/mosquitto
  - type: directory
    path: /mosquitto/data
    uid: 65532
    gid: 65532
    mode: "0755"
  - type: directory
    path: /mosquitto/log
    uid: 65532
    gid: 65532
    mode: "0755"
annotations:
  org.opencontainers.image.description: A minimal Eclipse Mosquitto image
  org.opencontainers.image.licenses: EPL-2.0 & EDL-1.0
entrypoint:
  - /usr/sbin/mosquitto
cmd:
  - -c
  - /mosquitto/config/mosquitto.conf
