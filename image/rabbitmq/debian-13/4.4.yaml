# syntax=dhi.io/build:2-debian13

name: RabbitMQ 4.4.x
image: dhi.io/rabbitmq
variant: runtime
tags:
  - "4"
  - "4.4"
  - 4.4.1
  - 4-debian
  - 4-debian13
  - 4.4-debian
  - 4.4-debian13
  - 4.4.1-debian
  - 4.4.1-debian13
platforms:
  - linux/amd64
  - linux/arm64
dates:
  release: "2026-10-17"
vars:
  DEBIAN_EPOCH_MAJOR_MINOR_VERSION: "4.4"
  DEBIAN_EPOCH_MAJOR_VERSION: "4"
  DEBIAN_EPOCH_VERSION: 4.4.1
  ERLANG_VERSION: 27.3.4.20
  RABBITMQ_PACKAGE: rabbitmq-4.4
  RABBITMQ_PACKAGE_SUFFIX: ""
  VERSION: 4.4.1-3
contents:
  repositories:
    - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
  keyring:
    - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
  packages:
    - '!libelogind0'
    - '!mawk'
    - '!original-awk'
    - base-files
    - bash
    - ca-certificates
    - ca-certificates-bundle
    - coreutils
    - libssl3t64
    - libtinfo6
    - openssl
    - rabbitmq-4.4=4.4.1-3
    - sed
    - tzdata
  builds:
    - name: rabbitmq-sbom
      contents:
        packages:
          - bash
          - coreutils
          - rabbitmq-4.4=4.4.1-3
      pipeline:
        - name: verify bundled versions
          runs: |
            set -eux -o pipefail

            test "$(cat /usr/lib/erlang/releases/*/OTP_VERSION)" = "27.3.4.20"
            test -d "/usr/lib/rabbitmq/plugins/rabbit-4.4.1"
        - name: erlang sbom
          uses: spdx@v1
          with:
            license: Apache-2.0
            name: erlang
            purl: pkg:dhi/erlang@27.3.4.20
            version: 27.3.4.20
        - name: rabbitmq sbom
          uses: spdx@v1
          with:
            license: MPL-2.0
            name: rabbitmq
            purl: pkg:dhi/rabbitmq@4.4.1
            version: 4.4.1
      outputs:
        - source: /opt/docker/sbom/erlang
          target: /opt/docker/sbom/erlang
          uid: 0
          gid: 0
        - source: /opt/docker/sbom/rabbitmq
          target: /opt/docker/sbom/rabbitmq
          uid: 0
          gid: 0
    - name: locale
      contents:
        packages:
          - bash
          - locales
          - coreutils
          - gzip
      pipeline:
        - name: install locales
          runs: |
            set -eux -o pipefail

            ln -s /etc/locale.alias /usr/share/locale/locale.alias

            echo "en_US.UTF-8 UTF-8" >> /etc/locale.gen
            locale-gen en_US.UTF-8
      outputs:
        - source: /usr/share/locale
          target: /usr/share/locale
          uid: 0
          gid: 0
        - source: /usr/lib/locale
          target: /usr/lib/locale
          uid: 0
          gid: 0
accounts:
  run-as: rabbitmq
  users:
    - name: rabbitmq
      uid: 65532
      gid: 65532
  groups:
    - name: rabbitmq
      gid: 65532
      members:
        - rabbitmq
os-release:
  name: Docker Hardened Images (Debian)
  id: debian
  version-id: "13"
  version-codename: trixie
  pretty-name: Docker Hardened Images/Debian GNU/Linux 13 (trixie)
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
environment:
  HOME: /var/lib/rabbitmq
  LANG: en_US.UTF-8
  LANGUAGE: en_US:en
  LC_ALL: en_US.UTF-8
  PATH: /usr/local/rabbitmq_server-4.4.1/sbin:/usr/sbin:/sbin:/usr/bin:/bin:/usr/local/bin:/usr/local/sbin
  RABBITMQ_DATA_DIR: /var/lib/rabbitmq
  RUNNING_UNDER_SYSTEMD: "true"
paths:
  - type: directory
    path: /var/lib/rabbitmq
    uid: 65532
    gid: 65532
    mode: "0755"
  - type: directory
    path: /var/log/rabbitmq
    uid: 65532
    gid: 65532
    mode: "0755"
  - type: directory
    path: /usr/local
    uid: 0
    gid: 0
  - type: symlink
    path: /usr/local/rabbitmq_server-4.4.1
    uid: 0
    gid: 0
    source: /usr/lib/rabbitmq
  - type: directory
    path: /usr/local/lib
    uid: 0
    gid: 0
  - type: symlink
    path: /usr/local/lib/erlang
    uid: 0
    gid: 0
    source: /usr/lib/erlang
  - type: directory
    path: /usr/local/bin
    uid: 0
    gid: 0
  - type: symlink
    path: /usr/local/bin/ct_run
    uid: 0
    gid: 0
    source: /usr/bin/ct_run
  - type: symlink
    path: /usr/local/bin/dialyzer
    uid: 0
    gid: 0
    source: /usr/bin/dialyzer
  - type: symlink
    path: /usr/local/bin/epmd
    uid: 0
    gid: 0
    source: /usr/bin/epmd
  - type: symlink
    path: /usr/local/bin/erl
    uid: 0
    gid: 0
    source: /usr/bin/erl
  - type: symlink
    path: /usr/local/bin/erlc
    uid: 0
    gid: 0
    source: /usr/bin/erlc
  - type: symlink
    path: /usr/local/bin/escript
    uid: 0
    gid: 0
    source: /usr/bin/escript
  - type: symlink
    path: /usr/local/bin/run_erl
    uid: 0
    gid: 0
    source: /usr/bin/run_erl
  - type: symlink
    path: /usr/local/bin/to_erl
    uid: 0
    gid: 0
    source: /usr/bin/to_erl
  - type: symlink
    path: /usr/local/bin/typer
    uid: 0
    gid: 0
    source: /usr/bin/typer
annotations:
  org.opencontainers.image.description: A minimal RabbitMQ image
  org.opencontainers.image.licenses: MPL-2.0
entrypoint:
  - rabbitmq-server
ports:
  - 4369/tcp
  - 5671/tcp
  - 5672/tcp
  - 15691/tcp
  - 15692/tcp
  - 25672/tcp
