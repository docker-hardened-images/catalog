# syntax=dhi.io/build:2-debian13

name: Trino 484 (dev)
image: dhi.io/trino
variant: dev
tags:
  - 484-dev
  - 484-debian-dev
  - 484-debian13-dev
platforms:
  - linux/amd64
  - linux/arm64
dates:
  release: "2025-10-29"
vars:
  ARCH: '#{ target.arch == "amd64" ? "amd64" : "arm64" }'
  COMMIT_SHA: e2d50bb733e193607c44be84ad80ce2430ba1d01
  JAVA_FIPS_SUFFIX: ""
  JAVA_VARIANT: jdk
  JDK_MAJOR_VERSION: "25"
  JVM_KILL_COMMIT: 8a6ae95b38905f98ce6b7b727efb2dc75da16e11
  LAUNCHER_COMMIT_SHA: 8ba11944b3953246ce0060ce4efca9878fae5b84
  LAUNCHER_VERSION: "322"
  MAVEN_REFERENCE: dhi/maven:3.10.0-jdk25-debian13-dev@sha256:579f4af700575c864c63903397eb284a786c61837235fbede3fa23852cfe88a4
  MAVEN_VERSION: 3.10.0
  VERSION: "484"
contents:
  repositories:
    - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
  keyring:
    - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
  packages:
    - '!gawk'
    - '!libelogind0'
    - '!mawk'
    - '!original-awk'
    - apt
    - base-files
    - bash
    - ca-certificates
    - coreutils
    - curl
    - diffutils
    - dpkg
    - eclipse-temurin-25-jdk
    - eclipse-temurin-25-jdk-oci-config
    - findutils
    - grep
    - libc-bin
    - libstdc++6
    - mawk
    - perl-base
    - sed
    - util-linux
  builds:
    - name: jvmkill
      environment:
        JAVA_HOME: /usr/lib/jvm/temurin-25
      contents:
        packages:
          - bash
          - coreutils
          - eclipse-temurin-25-jdk
          - gcc
          - libc6-dev
        files:
          - url: git+https://github.com/airlift/jvmkill.git#8a6ae95b38905f98ce6b7b727efb2dc75da16e11
            checksum: 8a6ae95b38905f98ce6b7b727efb2dc75da16e11
            path: ${source.dir}/jvmkill
            spdx:
              name: jvmkill
              packages:
                - name: jvmkill
                  purl: pkg:generic/airlift/jvmkill
                  license: Apache-2.0
            uid: 0
            gid: 0
      pipeline:
        - name: build jvmkill
          work-dir: ${source.dir}/jvmkill
          runs: |
            set -eux -o pipefail

            INCLUDE="-I${JAVA_HOME}/include -I${JAVA_HOME}/include/linux"
            CFLAGS="-Wall -Werror -fPIC -shared ${INCLUDE}"
            gcc ${CFLAGS} -o libjvmkill.so jvmkill.c
      outputs:
        - source: ${source.dir}/jvmkill/libjvmkill.so
          target: /usr/lib/trino/bin/libjvmkill.so
          uid: 1000
          gid: 1000
          mode: "0644"
        - source: /opt/docker/sbom/jvmkill
          target: /opt/docker/sbom/jvmkill
          uid: 0
          gid: 0
    - name: trino
      work-dir: ${source.dir}/trino
      environment:
        JAVA_HOME: /usr/lib/jvm/temurin-25
        MAVEN_ARGS: --batch-mode --no-transfer-progress
        MAVEN_HOME: /opt/java/apache-maven-3.10.0
      caches:
        - path: /root/.m2/repository
      contents:
        packages:
          - gzip
          - base-files
          - bash
          - ca-certificates
          - coreutils
          - eclipse-temurin-25-jdk
          - findutils
          - git
          - grep
          - libc6
          - libstdc++6
          - mawk
          - nodejs-24
          - node-corepack
          - npm
          - sed
          - yarn-classic
        files:
          - url: git+https://github.com/trinodb/trino.git#484
            checksum: e2d50bb733e193607c44be84ad80ce2430ba1d01
            path: ${source.dir}/trino
            spdx:
              name: trino
              version: "484"
              packages:
                - name: trino
                  purl: pkg:dhi/trino@484
                  license: Apache-2.0
            uid: 0
            gid: 0
          - url: https://repo1.maven.org/maven2/com/fasterxml/jackson/core/jackson-core/2.22.3/jackson-core-2.22.3.jar
            checksum: sha256:8a501126a385b25841915d839508f8a66e2a0dbc8a6709d055ef3b3e852b094c
            path: ${source.dir}/patch/deps/jackson-core-2.22.3.jar
            uid: 0
            gid: 0
          - url: https://repo1.maven.org/maven2/com/fasterxml/jackson/core/jackson-databind/2.22.3/jackson-databind-2.22.3.jar
            checksum: sha256:556db5439e206114346043f68d200497dc96a0bca62a360a81784092ebd0e0a9
            path: ${source.dir}/patch/deps/jackson-databind-2.22.3.jar
            uid: 0
            gid: 0
          - url: https://repo1.maven.org/maven2/com/fasterxml/jackson/core/jackson-annotations/2.22/jackson-annotations-2.22.jar
            checksum: sha256:21ddb598807d3a51a876704eb979d9296e1c6a6f47ab1826ff88c6d6a127a2d0
            path: ${source.dir}/patch/deps/jackson-annotations-2.22.jar
            uid: 0
            gid: 0
          - url: https://repo1.maven.org/maven2/com/eed3si9n/jarjar/jarjar-assembly/1.14.1/jarjar-assembly-1.14.1.jar
            checksum: sha256:270fe285e399e298fb08c5daf1486648203a5bd5e90eaba4a6466097be7dd50f
            path: ${source.dir}/patch/deps/jarjar-assembly-1.14.1.jar
            uid: 0
            gid: 0
        artifacts:
          - name: dhi.io/maven:3.10.0-jdk25-debian13-dev@sha256:579f4af700575c864c63903397eb284a786c61837235fbede3fa23852cfe88a4
            includes:
              - opt/**
              - usr/local/bin/**
            uid: 0
            gid: 0
      pipeline:
        - uses: mvn/mirror@v1
        - name: maven patch
          uses: mvn/patch@v1
          with:
            dependencies: ${source.dir}/patch/mvn-deps.json
            dependencies-key: dependencyManagement.dependencies
            downgrade: false
            mvn-root: ${source.dir}/trino
            properties: ${source.dir}/patch/mvn-properties.json
        - name: build
          privileged: true
          secrets:
            - id: maven_user
              env: MAVEN_USER
              optional: true
            - id: maven_password
              env: MAVEN_PASSWORD
              optional: true
          runs: |
            set -eux -o pipefail

            mvn sortpom:sort
            mvn package -q -DskipTests -Dair.check.skip-all -Dmaven.enforcer.skip=true -Dmaven.test.failure.ignore=true -pl '!:trino-docs' -am

            # The launcher binary is specifically excluded here as we build it in a later step.
            tar -C "${target.dir}" -xzf "${source.dir}/trino/core/trino-server/target/trino-server-484.tar.gz" --wildcards \
              "trino-server-484/lib" \
              "trino-server-484/plugin" \
              "trino-server-484/secrets-plugin" \
              "trino-server-484/bin/launcher"{,.properties} \
              "trino-server-484/bin/linux-${ARCH}/libprocname.so"
        - name: patch keystore secrets plugin guava
          runs: |
            set -eux -o pipefail

            SECRETS_PLUGIN="${target.dir}/trino-server-484/secrets-plugin/keystore-secrets-plugin"

            rm "${SECRETS_PLUGIN}"/com.google.guava_guava-*.jar
            cp /root/.m2/repository/com/google/guava/guava/33.7.2-jre/guava-33.7.2-jre.jar "${SECRETS_PLUGIN}/com.google.guava_guava-33.7.2-jre.jar"
        - name: remove optional plugins
          work-dir: ${target.dir}/trino-server-484/plugin
          runs: |
            set -eux -o pipefail

            PLUGINS_TO_REMOVE=$(ls | jq -R -r -n --slurpfile allowlist ${source.dir}/patch/minimal-plugins.json '[inputs] - $allowlist[0] | .[]')

            echo "Removing all plugins that aren't in essential list..."

            for plugin_folder in $PLUGINS_TO_REMOVE; do
              rm -r "${plugin_folder}"
            done
      paths:
        - type: file
          path: /src/patch/bc-fips-hkdf.diff
          uid: 0
          gid: 0
          source: image/trino/patch/bc-fips-hkdf.diff
        - type: file
          path: /src/patch/remediate-parquet-jackson.sh
          uid: 0
          gid: 0
          source: image/trino/patch/remediate-parquet-jackson.sh
        - type: file
          path: /src/patch/minimal-plugins.json
          uid: 0
          gid: 0
          source: image/trino/patch/minimal-plugins.json
        - type: file
          path: /src/patch/mvn-deps.json
          uid: 0
          gid: 0
          source: image/trino/patch/mvn-deps.json
        - type: file
          path: /src/patch/mvn-properties.json
          uid: 0
          gid: 0
          source: image/trino/patch/mvn-properties.json
      outputs:
        - source: ${source.dir}/trino/client/trino-cli/target/trino-cli-484-executable.jar
          target: /usr/bin/trino
          uid: 1000
          gid: 1000
        - source: ${target.dir}/trino-server-484
          target: /usr/lib/trino
          uid: 1000
          gid: 1000
        - source: ${source.dir}/trino/core/docker/bin
          target: /usr/lib/trino/bin
          uid: 1000
          gid: 1000
        - source: ${source.dir}/trino/core/docker/default/etc
          target: /etc/trino
          uid: 1000
          gid: 1000
        - source: /opt/docker/sbom/trino
          target: /opt/docker/sbom/trino
          uid: 0
          gid: 0
    - name: launcher
      work-dir: /go/src/github.com/airlift/launcher/src/main/go
      caches:
        - path: /go/pkg/mod
      contents:
        packages:
          - bash
          - ca-certificates-bundle
          - coreutils
          - golang-1.27
          - findutils
          - mawk
          - sed
        files:
          - url: git+https://github.com/airlift/launcher.git#322
            checksum: 8ba11944b3953246ce0060ce4efca9878fae5b84
            path: /go/src/github.com/airlift/launcher
            spdx:
              name: launcher
              version: "322"
              packages:
                - name: launcher
                  purl: pkg:golang/launcher@322
            uid: 0
            gid: 0
      pipeline:
        - name: bump go dependencies
          uses: go/bump@v1
          with:
            deps: []
            download: true
        - name: build
          uses: go/build@v1
          work-dir: /go/src/github.com/airlift/launcher/src/main/go
          with:
            ldflags:
              - -extldflags=-static
              - -X launcher/args.Version=322
            output: ${target.dir}/launcher
      paths:
        - type: directory
          path: ""
          uid: 0
          gid: 0
      outputs:
        - source: ${target.dir}/launcher
          target: /usr/lib/trino/bin/linux-${ARCH}/launcher
          uid: 1000
          gid: 1000
    - name: locale
      contents:
        packages:
          - bash
          - locales
          - coreutils
          - gzip
      pipeline:
        - name: install locales
          runs: |
            set -eux -o pipefail

            ln -s /etc/locale.alias /usr/share/locale/locale.alias

            echo "en_US.UTF-8 UTF-8" >> /etc/locale.gen
            locale-gen en_US.UTF-8
      outputs:
        - source: /usr/share/locale
          target: /usr/share/locale
          uid: 0
          gid: 0
        - source: /usr/lib/locale
          target: /usr/lib/locale
          uid: 0
          gid: 0
accounts:
  root: true
  run-as: root
  users:
    - name: trino
      uid: 1000
      gid: 1000
    - name: _apt
      uid: 42
      gid: 65532
  groups:
    - name: trino
      gid: 1000
      members:
        - trino
os-release:
  name: Docker Hardened Images (Debian)
  id: debian
  version-id: "13"
  version-codename: trixie
  pretty-name: Docker Hardened Images/Debian GNU/Linux 13 (trixie)
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
environment:
  CATALOG_MANAGEMENT: static
  DEBIAN_FRONTEND: noninteractive
  LANG: en_US.UTF-8
  LANGUAGE: en_US:en
  LC_ALL: en_US.UTF-8
  PATH: /usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin:/usr/lib/jvm/temurin-25/bin
paths:
  - type: directory
    path: /data/trino
    uid: 1000
    gid: 1000
annotations:
  org.opencontainers.image.description: A minimal Trino image
  org.opencontainers.image.licenses: Apache-2.0
cmd:
  - /usr/lib/trino/bin/launcher
  - run
  - --etc-dir
  - /etc/trino
ports:
  - 8080/tcp
