# syntax=dhi.io/build:2-debian13

name: Google CAS Issuer for cert-manager 0.x (dev)
image: dhi.io/cert-manager-google-cas-issuer
variant: dev
tags:
  - 0-dev
  - 0.14-dev
  - 0.14.0-dev
  - 0-debian-dev
  - 0-debian13-dev
  - 0.14-debian-dev
  - 0.14-debian13-dev
  - 0.14.0-debian-dev
  - 0.14.0-debian13-dev
platforms:
  - linux/amd64
  - linux/arm64
dates:
  release: "2021-01-29"
vars:
  DEBIAN_EPOCH_MAJOR_MINOR_VERSION: "0.14"
  DEBIAN_EPOCH_MAJOR_VERSION: "0"
  DEBIAN_EPOCH_VERSION: 0.14.0
  FLAVORED_SUFFIX: -dev
  SUFFIX: -dev
  VERSION: 0.14.0-1
contents:
  repositories:
    - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
  keyring:
    - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
  packages:
    - '!gawk'
    - '!libelogind0'
    - '!mawk'
    - '!original-awk'
    - apt
    - base-files
    - bash
    - ca-certificates
    - ca-certificates-bundle
    - cert-manager-google-cas-issuer-0-dev=0.14.0-1
    - coreutils
    - diffutils
    - dpkg
    - findutils
    - grep
    - libc-bin
    - mawk
    - perl-base
    - sed
    - tzdata
    - util-linux
  builds:
    - name: locale
      contents:
        packages:
          - bash
          - locales
          - coreutils
          - gzip
      pipeline:
        - name: install locales
          runs: |
            set -eux -o pipefail

            ln -s /etc/locale.alias /usr/share/locale/locale.alias

            echo "en_US.UTF-8 UTF-8" >> /etc/locale.gen
            locale-gen en_US.UTF-8
      outputs:
        - source: /usr/share/locale
          target: /usr/share/locale
          uid: 0
          gid: 0
        - source: /usr/lib/locale
          target: /usr/lib/locale
          uid: 0
          gid: 0
accounts:
  root: true
  run-as: root
  users:
    - name: nonroot
      uid: 65532
      gid: 65532
    - name: _apt
      uid: 42
      gid: 65532
  groups:
    - name: nonroot
      gid: 65532
      members:
        - nonroot
os-release:
  name: Docker Hardened Images (Debian)
  id: debian
  version-id: "13"
  version-codename: trixie
  pretty-name: Docker Hardened Images/Debian GNU/Linux 13 (trixie)
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
work-dir: /
environment:
  DEBIAN_FRONTEND: noninteractive
  LANG: en_US.UTF-8
  LANGUAGE: en_US:en
  LC_ALL: en_US.UTF-8
  SSL_CERT_FILE: /etc/ssl/certs/ca-certificates.crt
paths:
  - type: directory
    path: /usr/local/bin
    uid: 0
    gid: 0
    mode: "0755"
  - type: symlink
    path: /usr/local/bin/google-cas-issuer
    uid: 0
    gid: 0
    source: /usr/bin/google-cas-issuer
  - type: directory
    path: /ko-app
    uid: 0
    gid: 0
    mode: "0755"
  - type: symlink
    path: /ko-app/google-cas-issuer
    uid: 0
    gid: 0
    source: /usr/local/bin/google-cas-issuer
annotations:
  org.opencontainers.image.description: A minimal Google CAS Issuer image
  org.opencontainers.image.licenses: Apache-2.0
entrypoint:
  - /usr/local/bin/google-cas-issuer
