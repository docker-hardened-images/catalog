      path: /usr/local/bin/healthcheck.sh
      spdx:
        name: mariadb-docker
        version: 4ef487565005c1acf62dcfaa87110a39262b8150
        packages:
          - name: mariadb-docker
            purl: pkg:github/mariadb/mariadb-docker@4ef487565005c1acf62dcfaa87110a39262b8150
            license: GPL-2.0-only
      uid: 0
      gid: 0
      mode: "0755"
accounts:
  root: true
  run-as: root
  users:
    - name: mysql
      uid: 65532
      gid: 65532
    - name: _apt
      uid: 42
      gid: 65532
  groups:
