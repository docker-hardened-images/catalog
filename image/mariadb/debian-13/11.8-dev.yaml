      gid: 65532
      members:
        - mysql
os-release:
  name: Docker Hardened Images (Debian)
  id: debian
  version-id: "13"
  version-codename: trixie
  pretty-name: Docker Hardened Images/Debian GNU/Linux 13 (trixie)
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
environment:
  DEBIAN_FRONTEND: noninteractive
  MARIADB_DATA_DIR: /var/lib/mysql
  PATH: /opt/mariadb/bin:/opt/mariadb/scripts:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
paths:
  - type: file
    path: /usr/local/bin/docker-entrypoint.sh
    uid: 0
    gid: 0
    mode: "0755"
    source: image/mariadb/bin/docker-entrypoint.sh
  - type: directory
    path: /usr/local/sbin
    uid: 0
    gid: 0
  - type: symlink
    path: /usr/local/sbin/gosu
    uid: 0
    gid: 0
    source: /usr/bin/gosu
  - type: directory
    path: /opt
    uid: 0
    gid: 0
  - type: directory
    path: /opt/mariadb
    uid: 0
    gid: 0
  - type: symlink
    path: /opt/mariadb/bin
    uid: 0
    gid: 0
    source: /usr/bin
  - type: symlink
    path: /opt/mariadb/scripts
    uid: 0
    gid: 0
    source: /usr/scripts
  - type: symlink
    path: /opt/mariadb/lib
    uid: 0
    gid: 0
    source: /usr/lib
  - type: symlink
    path: /opt/mariadb/share
    uid: 0
    gid: 0
    source: /usr/share
  - type: symlink
    path: /opt/mariadb/man
    uid: 0
    gid: 0
    source: /usr/man
  - type: symlink
    path: /opt/mariadb/support-files
    uid: 0
    gid: 0
    source: /usr/support-files
  - type: directory
    path: /var/lib/mysql
    uid: 65532
    gid: 65532
    mode: "0755"
  - type: directory
    path: /run/mysqld
    uid: 65532
    gid: 65532
    mode: "0755"
  - type: directory
    path: /run/mariadb
    uid: 65532
    gid: 65532
    mode: "0755"
  - type: file
    path: /etc/mysql/mariadb.conf.d/99-docker.cnf
    content: |
      [mariadb]
      host-cache-size=0
      skip-name-resolve
      bind-address=0.0.0.0
      datadir=/var/lib/mysql
      basedir=/opt/mariadb

      expire_logs_days=10
      character-set-server=utf8mb4

      character-set-collations=utf8mb4=uca1400_ai_ci # 11.3, 11.4
      collation-server=utf8mb4_general_ci # 10*

      [client-server]
      socket=/run/mariadb/mariadb.sock
    uid: 65532
    gid: 65532
    mode: "0644"
  - type: symlink
    path: /opt/mariadb/include
    uid: 0
    gid: 0
    source: /usr/include
annotations:
  org.opencontainers.image.description: A minimal MariaDB image
  org.opencontainers.image.licenses: GPL-2.0
entrypoint:
