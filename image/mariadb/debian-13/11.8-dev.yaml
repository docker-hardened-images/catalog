    - apt
    - base-files
    - bash
    - ca-certificates
    - ca-certificates-bundle
    - coreutils
    - curl
    - dash
    - diffutils
    - dpkg
    - findutils
    - gawk
    - gosu
    - grep
    - hostname
    - libaio1t64
    - libc-bin
    - libcrypt1
    - libfmt10
    - libjemalloc2
    - libncurses6
    - libnuma1
    - libpcre2-8-0
    - libssl3t64
    - libstdc++6
    - libtinfo6
    - mariadb-11.8-dev=11.8.9-2
