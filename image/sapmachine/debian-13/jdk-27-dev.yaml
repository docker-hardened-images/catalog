# syntax=dhi.io/build:2-debian13

name: SapMachine 27.x JDK (dev)
image: dhi.io/sapmachine
variant: dev
tags:
  - 27-jdk-dev
  - 27.0-jdk-dev
  - 27.0.1-jdk-dev
  - 27-jdk-debian-dev
  - 27-jdk-debian13-dev
  - 27.0-jdk-debian-dev
  - 27.0-jdk-debian13-dev
  - 27.0.1-jdk-debian-dev
  - 27.0.1-jdk-debian13-dev
platforms:
  - linux/amd64
  - linux/arm64
dates:
  release: "2026-09-15"
  end-of-life: "2027-03-31"
vars:
  ARCH: '#{ target.arch == "amd64" ? "x64" : "aarch64" }'
  JAVA_JDK_CHECKSUM: https://github.com/sap/sapmachine/releases/download/sapmachine-27.0.1/sapmachine-jdk-27.0.1_linux-${ARCH}_bin.sha256.txt
  JAVA_JDK_DOWNLOAD: https://github.com/sap/sapmachine/releases/download/sapmachine-27.0.1/sapmachine-jdk-27.0.1_linux-${ARCH}_bin.tar.gz
  JAVA_JRE_CHECKSUM: https://github.com/sap/sapmachine/releases/download/sapmachine-27.0.1/sapmachine-jre-27.0.1_linux-${ARCH}_bin.sha256.txt
  JAVA_JRE_DOWNLOAD: https://github.com/sap/sapmachine/releases/download/sapmachine-27.0.1/sapmachine-jre-27.0.1_linux-${ARCH}_bin.tar.gz
  JAVA_MAJOR_MINOR_VERSION: "27.0"
  JAVA_MAJOR_VERSION: "27"
  JAVA_VERSION: 27.0.1
  LIBC6_VERSION: 2.41-12+deb13u4+dhi1
  SEMVER_MAJOR_VERSION: "27"
  VERSION: 27.0.1
  ZLIB1G_VERSION: 1:1.3.dfsg+really1.3.1-1+deb13u0+dhi4
contents:
  repositories:
    - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
  keyring:
    - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
  packages:
    - '!gawk'
    - '!libelogind0'
    - '!mawk'
    - '!original-awk'
    - apt
    - base-files
    - bash
    - ca-certificates
    - coreutils
    - diffutils
    - dpkg
    - findutils
    - gnu-which
    - grep
    - libc-bin
    - libc6=2.41-12+deb13u4+dhi1
    - libstdc++6
    - mawk
    - perl-base
    - sed
    - util-linux
    - zlib1g=1:1.3.dfsg+really1.3.1-1+deb13u0+dhi4
  builds:
    - name: sapmachine
      contents:
        packages:
          - base-files
          - bash
          - coreutils
          - findutils
        files:
          - url: https://github.com/sap/sapmachine/releases/download/sapmachine-27.0.1/sapmachine-jdk-27.0.1_linux-${ARCH}_bin.tar.gz
            checksum: https://github.com/sap/sapmachine/releases/download/sapmachine-27.0.1/sapmachine-jdk-27.0.1_linux-${ARCH}_bin.sha256.txt
            path: ${target.dir}/opt/java/openjdk
            spdx:
              name: sapmachine
              version: 27.0.1.${JAVA_VERSION_SUFFIX}
              packages:
                - name: sapmachine
                  purl: pkg:dhi/sap/sapmachine-jdk@27.0.1.${JAVA_VERSION_SUFFIX}
                  license: GPL-2.0-with-classpath-exception
            uid: 0
            gid: 0
      pipeline:
        - name: create symlinks
          runs: |
            set -eux -o pipefail

            mv ${target.dir}/opt/java/openjdk/* ${target.dir}/opt/java/openjdk/27

            # Delete src.zip from the distribution, as most consumers of a container image have no use for the source code.
            rm -rf ${target.dir}/opt/java/openjdk/27/lib/src.zip

            mkdir -p ${target.dir}/usr/local/bin
            find ${target.dir}/opt/java/openjdk/27/bin -type f -executable -o -type l | while read -r file; do
              filename=$(basename "$file")
              ln -s /opt/java/openjdk/27/bin/$filename ${target.dir}/usr/local/bin/$filename
            done
        - name: remove compromised CA roots
          runs: |
            set -eux -o pipefail

            JAVA_HOME="${target.dir}/opt/java/openjdk/27"
            KEYTOOL="$JAVA_HOME/bin/keytool"
            CACERTS="$JAVA_HOME/lib/security/cacerts"
            if [ "27" = "8" ]; then
              CACERTS="$JAVA_HOME/jre/lib/security/cacerts"
            fi

            "$KEYTOOL" -list -keystore "$CACERTS" -storepass changeit > /dev/null
            for alias in \
              "comodoaaaca [jdk]" \
              "emsigneccrootcag3 [jdk]" \
              "emsignrootcag1 [jdk]" \
              "emsignrootcag2 [jdk]" \
              "cn_aaa_certificate_services,o_comodo_ca_limited,l_salford,st_greater_manchester,c_gb [jdk]" \
              "cn_emsign_ecc_root_ca__g3,o_emudhra_technologies_limited,ou_emsign_pki,c_in [jdk]" \
              "cn_emsign_root_ca__g1,o_emudhra_technologies_limited,ou_emsign_pki,c_in [jdk]" \
              "cn_emsign_root_ca__g2,o_emudhra_technologies_limited,ou_emsign_pki,c_in [jdk]"; do
              if "$KEYTOOL" -list -keystore "$CACERTS" -storepass changeit -alias "$alias" > /dev/null 2>&1; then
                "$KEYTOOL" -delete -keystore "$CACERTS" -storepass changeit -alias "$alias"
              fi
            done
      outputs:
        - source: ${target.dir}/opt/java
          target: /opt/java
          uid: 0
          gid: 0
        - source: ${target.dir}/usr/local/bin
          target: /usr/local/bin
          uid: 0
          gid: 0
        - source: /opt/docker/sbom
          target: /opt/docker/sbom
          uid: 0
          gid: 0
    - name: locale
      contents:
        packages:
          - bash
          - locales
          - coreutils
          - gzip
      pipeline:
        - name: install locales
          runs: |
            set -eux -o pipefail

            ln -s /etc/locale.alias /usr/share/locale/locale.alias

            echo "en_US.UTF-8 UTF-8" >> /etc/locale.gen
            locale-gen en_US.UTF-8
      outputs:
        - source: /usr/share/locale
          target: /usr/share/locale
          uid: 0
          gid: 0
        - source: /usr/lib/locale
          target: /usr/lib/locale
          uid: 0
          gid: 0
accounts:
  root: true
  run-as: root
  users:
    - name: nonroot
      uid: 65532
      gid: 65532
    - name: _apt
      uid: 42
      gid: 65532
  groups:
    - name: nonroot
      gid: 65532
      members:
        - nonroot
os-release:
  name: Docker Hardened Images (Debian)
  id: debian
  version-id: "13"
  version-codename: trixie
  pretty-name: Docker Hardened Images/Debian GNU/Linux 13 (trixie)
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
environment:
  DEBIAN_FRONTEND: noninteractive
  JAVA_HOME: /opt/java/openjdk/27
  JAVA_VERSION: 27.0.1
  LANG: en_US.UTF-8
  LANGUAGE: en_US:en
  LC_ALL: en_US.UTF-8
annotations:
  org.opencontainers.image.description: A minimal SapMachine image
  org.opencontainers.image.licenses: GPL-2.0-only WITH Classpath-exception-2.0
cmd:
  - /bin/bash
