# syntax=dhi.io/build:2-debian13

name: Falco 0.x (dev)
image: dhi.io/falco
variant: dev
tags:
  - 0-dev
  - 0.44-dev
  - 0.44.1-dev
  - 0-debian-dev
  - 0-debian13-dev
  - 0.44-debian-dev
  - 0.44-debian13-dev
  - 0.44.1-debian-dev
  - 0.44.1-debian13-dev
platforms:
  - linux/amd64
  - linux/arm64
dates:
  release: "2026-07-24"
vars:
  FLAVORED_SUFFIX: -dev
  SEMVER_MAJOR_MINOR_VERSION: "0.44"
  SEMVER_MAJOR_VERSION: "0"
  SEMVER_VERSION: 0.44.1
  SUFFIX: -dev
  VERSION: 0.44.1-4
contents:
  repositories:
    - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
  keyring:
    - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
  packages:
    - '!gawk'
    - '!libelogind0'
    - '!original-awk'
    - apt
    - base-files
    - bash
    - ca-certificates
    - ca-certificates-bundle
    - coreutils
    - diffutils
    - dpkg
    - falco=0.44.1-4
    - findutils
    - grep
    - libc-bin
    - libssl3t64
    - libstdc++6
    - libzstd1
    - mawk
    - perl-base
    - sed
    - tzdata
    - util-linux
    - zlib1g
accounts:
  root: true
  run-as: root
  users:
    - name: nonroot
      uid: 65532
      gid: 65532
    - name: _apt
      uid: 42
      gid: 65532
  groups:
    - name: nonroot
      gid: 65532
      members:
        - nonroot
os-release:
  name: Docker Hardened Images (Debian)
  id: debian
  version-id: "13"
  version-codename: trixie
  pretty-name: Docker Hardened Images/Debian GNU/Linux 13 (trixie)
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
environment:
  DEBIAN_FRONTEND: noninteractive
annotations:
  org.opencontainers.image.description: A minimal Falco cloud-native runtime security image
  org.opencontainers.image.licenses: Apache-2.0
cmd:
  - /usr/bin/falco
ports:
  - 8765/tcp
