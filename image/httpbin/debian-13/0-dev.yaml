# syntax=dhi.io/build:2-debian13

name: httpbin 0.x (dev)
image: dhi.io/httpbin
variant: dev
tags:
  - 0-dev
  - 0.2-dev
  - 0.2.3-dev
  - 0-debian-dev
  - 0-debian13-dev
  - 0.2-debian-dev
  - 0.2-debian13-dev
  - 0.2.3-debian-dev
  - 0.2.3-debian13-dev
platforms:
  - linux/amd64
  - linux/arm64
dates:
  release: "2022-06-23"
vars:
  SEMVER_MAJOR_MINOR_VERSION: "0.2"
  SEMVER_MAJOR_VERSION: "0"
  SEMVER_VERSION: 0.2.3
  VERSION: 0.2.3-3
contents:
  repositories:
    - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
  keyring:
    - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
  packages:
    - '!gawk'
    - '!libelogind0'
    - '!mawk'
    - '!original-awk'
    - apt
    - base-files
    - bash
    - ca-certificates
    - ca-certificates-bundle
    - coreutils
    - diffutils
    - dpkg
    - findutils
    - grep
    - httpbin=0.2.3-3
    - libc-bin
    - libffi8
    - libgcc-s1
    - libstdc++6
    - mawk
    - perl-base
    - python-3.13
    - sed
    - tzdata
    - util-linux
accounts:
  root: true
  run-as: root
  users:
    - name: nonroot
      uid: 65532
      gid: 65532
    - name: _apt
      uid: 42
      gid: 65532
  groups:
    - name: nonroot
      gid: 65532
      members:
        - nonroot
os-release:
  name: Docker Hardened Images (Debian)
  id: debian
  version-id: "13"
  version-codename: trixie
  pretty-name: Docker Hardened Images/Debian GNU/Linux 13 (trixie)
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
environment:
  DEBIAN_FRONTEND: noninteractive
paths:
  - type: directory
    path: /usr/local/bin
    uid: 0
    gid: 0
  - type: symlink
    path: /usr/local/bin/httpbin
    uid: 0
    gid: 0
    source: /usr/lib/httpbin/bin/httpbin
annotations:
  org.opencontainers.image.description: A minimal httpbin image
  org.opencontainers.image.licenses: ISC
entrypoint:
  - /usr/local/bin/httpbin
cmd:
  - --bind
  - 0.0.0.0:8080
  - --worker-class
  - gevent
  - httpbin:app
ports:
  - 8080/tcp
