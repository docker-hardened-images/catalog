metadata:
  display-name: Script Exporter
  short-description: Prometheus exporter to execute scripts and collect metrics from the output or the exit status.
  featured: false
  home-url: https://github.com/ricoberger/script_exporter
  categories:
    - monitoring-and-observability
  included-tools:
    - name: script_exporter
      description: Prometheus exporter that runs the configured scripts and serves their results as metrics.
    - name: bash
      description: Shell that runs the probe scripts.
    - name: curl
      description: HTTP client for scripts that probe web endpoints.
    - name: jq
      description: JSON processor for scripts that parse API responses.
    - name: python3
      description: Python 3.14 interpreter for Python probe scripts.
    - name: ping
      description: ICMP echo client for reachability probes.
    - name: tini
      description: Init process that forwards signals and reaps the processes scripts leave behind.
