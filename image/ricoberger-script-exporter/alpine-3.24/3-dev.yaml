# syntax=dhi.io/build:2-alpine3.24

name: Script Exporter 3.x (dev)
image: dhi.io/ricoberger-script-exporter
variant: dev
tags:
  - 3-alpine-dev
  - 3.3-alpine-dev
  - 3-alpine3.24-dev
  - 3.3.0-alpine-dev
  - 3.3-alpine3.24-dev
  - 3.3.0-alpine3.24-dev
platforms:
  - linux/amd64
  - linux/arm64
dates:
  release: "2025-04-07"
vars:
  FLAVORED_SUFFIX: -dev
  SEMVER_MAJOR_MINOR_VERSION: "3.3"
  SEMVER_MAJOR_VERSION: "3"
  SEMVER_VERSION: 3.3.0
  SUFFIX: -dev
  VERSION: 3.3.0-r2
contents:
  repositories:
    - https://dhi.io/apk/alpine/v3.24/main
    - https://dl-cdn.alpinelinux.org/alpine/v3.24/main
    - https://dl-cdn.alpinelinux.org/alpine/v3.24/community
  keyring:
    - https://dhi.io/keyring/dhi-apk@docker-0F81AD7700D99184.rsa.pub
  packages:
    - alpine-baselayout-data
    - apk-tools
    - bash
    - busybox
    - ca-certificates
    - ca-certificates-bundle
    - curl
    - jq
    - python-3.14
    - ricoberger-script-exporter-3-dev=3.3.0-r2
    - tini
    - tzdata
accounts:
  root: true
  run-as: root
  users:
    - name: nonroot
      uid: 65532
      gid: 65532
  groups:
    - name: nonroot
      gid: 65532
      members:
        - nonroot
os-release:
  name: Docker Hardened Images (Alpine)
  id: alpine
  version-id: "3.24"
  pretty-name: Docker Hardened Images/Alpine Linux v3.24
