    uid: 0
    gid: 0
    source: /usr/bin/script_exporter
annotations:
  org.opencontainers.image.description: A minimal Script Exporter image
  org.opencontainers.image.licenses: MIT
entrypoint:
  - /sbin/tini
  - --
  - /script_exporter/script_exporter
ports:
  - 9469/tcp
