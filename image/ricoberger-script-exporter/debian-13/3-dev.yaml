# syntax=dhi.io/build:2-debian13

name: Script Exporter 3.x (dev)
image: dhi.io/ricoberger-script-exporter
variant: dev
tags:
  - 3-dev
  - 3.3-dev
  - 3.3.0-dev
  - 3-debian-dev
  - 3-debian13-dev
  - 3.3-debian-dev
  - 3.3-debian13-dev
  - 3.3.0-debian-dev
  - 3.3.0-debian13-dev
platforms:
  - linux/amd64
  - linux/arm64
dates:
  release: "2025-04-07"
vars:
  FLAVORED_SUFFIX: -dev
  SEMVER_MAJOR_MINOR_VERSION: "3.3"
  SEMVER_MAJOR_VERSION: "3"
  SEMVER_VERSION: 3.3.0
  SUFFIX: -dev
  VERSION: 3.3.0-2
contents:
  repositories:
    - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
  keyring:
    - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
  packages:
    - '!gawk'
    - '!libelogind0'
    - '!original-awk'
    - apt
    - base-files
    - bash
    - ca-certificates
    - ca-certificates-bundle
    - coreutils
    - curl
    - diffutils
    - dpkg
    - findutils
    - grep
    - iputils-ping
    - jq
    - libc-bin
    - mawk
    - perl-base
    - python-3.14
    - ricoberger-script-exporter-3-dev=3.3.0-2
    - sed
    - tini
    - tzdata
    - util-linux
accounts:
  root: true
  run-as: root
  users:
    - name: nonroot
      uid: 65532
      gid: 65532
    - name: _apt
      uid: 42
      gid: 65532
  groups:
    - name: nonroot
      gid: 65532
      members:
        - nonroot
os-release:
  name: Docker Hardened Images (Debian)
  id: debian
  version-id: "13"
  version-codename: trixie
  pretty-name: Docker Hardened Images/Debian GNU/Linux 13 (trixie)
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
work-dir: /script_exporter
environment:
  DEBIAN_FRONTEND: noninteractive
paths:
  - type: symlink
    path: /usr/sbin/tini
    uid: 0
    gid: 0
    source: /usr/bin/tini
  - type: directory
    path: /script_exporter
    uid: 0
    gid: 0
    mode: "0755"
  - type: symlink
    path: /script_exporter/script_exporter
    uid: 0
    gid: 0
    source: /usr/bin/script_exporter
annotations:
  org.opencontainers.image.description: A minimal Script Exporter image
  org.opencontainers.image.licenses: MIT
entrypoint:
  - /sbin/tini
  - --
  - /script_exporter/script_exporter
ports:
  - 9469/tcp
