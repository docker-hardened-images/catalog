# syntax=dhi.io/build:2-debian13

name: Fluentd 1.19.x (dev)
image: dhi.io/fluentd
variant: dev
tags:
  - 1.19-dev
  - 1.19.4-dev
  - 1.19-debian-dev
  - 1.19-debian13-dev
  - 1.19.4-debian-dev
  - 1.19.4-debian13-dev
platforms:
  - linux/amd64
  - linux/arm64
dates:
  release: "2026-06-25"
vars:
  BINUTILS_ARCH: '#{ target.arch == "amd64" ? "x86-64" : "aarch64" }'
  GEM_HOME: /usr/local/bundle
  RUBY_MAJOR_MINOR_VERSION: "3.4"
  RUBY_VERSION: 3.4.12-1
  SEMVER_MAJOR_MINOR_VERSION: "1.19"
  SEMVER_MAJOR_VERSION: "1"
  SEMVER_VERSION: 1.19.4
  VERSION: 1.19.4-9
contents:
  repositories:
    - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
  keyring:
    - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
  packages:
    - '!binutils'
    - '!binutils-aarch64-linux-gnu'
    - '!binutils-common'
    - '!binutils-x86-64-linux-gnu'
    - '!gawk'
    - '!libbinutils'
    - '!libctf-nobfd0'
    - '!libctf0'
    - '!libelogind0'
    - '!libgprofng0'
    - '!libsframe1'
    - '!original-awk'
    - apt
    - base-files
    - bash
    - binutils-latest
    - binutils-latest-${BINUTILS_ARCH}-linux-gnu
    - build-essential
    - ca-certificates
    - coreutils
    - curl
    - diffutils
    - dpkg
    - findutils
    - fluentd-1.19-dev=1.19.4-9
    - fluentd-1.19=1.19.4-9
    - git
    - grep
    - libc-bin
    - libc6
    - libcrypt1
    - libctf-nobfd0-latest
    - libctf0-latest
    - libffi8
    - libgcc-s1
    - libgmp10
    - libgprofng0-latest
    - libjemalloc2
    - libssl3t64
    - libstdc++6
    - libyaml-0-2
    - libyaml-dev
    - make
    - mawk
    - perl-base
    - ruby-3.4-dev=3.4.12-1
    - ruby-3.4=3.4.12-1
    - sed
    - tini
    - tzdata
    - util-linux
    - zlib1g
accounts:
  root: true
  run-as: root
  users:
    - name: nonroot
      uid: 65532
      gid: 65532
    - name: _apt
      uid: 42
      gid: 65532
  groups:
    - name: nonroot
      gid: 65532
      members:
        - nonroot
os-release:
  name: Docker Hardened Images (Debian)
  id: debian
  version-id: "13"
  version-codename: trixie
  pretty-name: Docker Hardened Images/Debian GNU/Linux 13 (trixie)
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
environment:
  BUNDLE_APP_CONFIG: /usr/local/bundle
  BUNDLE_SILENCE_ROOT_WARNING: "true"
  DEBIAN_FRONTEND: noninteractive
  GEM_HOME: /usr/local/bundle
  PATH: /usr/local/bundle/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
  SSL_CERT_FILE: /etc/ssl/certs/ca-certificates.crt
paths:
  - type: directory
    path: /usr/local/bin
    uid: 0
    gid: 0
  - type: symlink
    path: /usr/local/bundle
    uid: 0
    gid: 0
    source: /usr/lib/fluentd/bundle
  - type: directory
    path: /etc/fluent
    uid: 0
    gid: 0
  - type: directory
    path: /etc/fluent/plugins
    uid: 0
    gid: 0
  - type: directory
    path: /var/log/fluent
    uid: 65532
    gid: 65532
    mode: "0755"
  - type: file
    path: /usr/local/bin/docker-entrypoint.sh
    uid: 0
    gid: 0
    mode: "0755"
    source: image/fluentd/bin/docker-entrypoint.sh
  - type: file
    path: /etc/fluent/fluent.conf
    uid: 0
    gid: 0
    mode: "0755"
    source: image/fluentd/config/fluent.conf
  - type: symlink
    path: /usr/local/bundle/bin/fluent-binlog-reader
    uid: 0
    gid: 0
    source: /usr/lib/fluentd-dev/bundle/bin/fluent-binlog-reader
  - type: symlink
    path: /usr/local/bundle/bin/fluent-ca-generate
    uid: 0
    gid: 0
    source: /usr/lib/fluentd-dev/bundle/bin/fluent-ca-generate
  - type: symlink
    path: /usr/local/bundle/bin/fluent-cap-ctl
    uid: 0
    gid: 0
    source: /usr/lib/fluentd-dev/bundle/bin/fluent-cap-ctl
  - type: symlink
    path: /usr/local/bundle/bin/fluent-cat
    uid: 0
    gid: 0
    source: /usr/lib/fluentd-dev/bundle/bin/fluent-cat
  - type: symlink
    path: /usr/local/bundle/bin/fluent-ctl
    uid: 0
    gid: 0
    source: /usr/lib/fluentd-dev/bundle/bin/fluent-ctl
  - type: symlink
    path: /usr/local/bundle/bin/fluent-debug
    uid: 0
    gid: 0
    source: /usr/lib/fluentd-dev/bundle/bin/fluent-debug
  - type: symlink
    path: /usr/local/bundle/bin/fluent-gem
    uid: 0
    gid: 0
    source: /usr/lib/fluentd-dev/bundle/bin/fluent-gem
  - type: symlink
    path: /usr/local/bundle/bin/fluent-plugin-config-format
    uid: 0
    gid: 0
    source: /usr/lib/fluentd-dev/bundle/bin/fluent-plugin-config-format
  - type: symlink
    path: /usr/local/bundle/bin/fluent-plugin-generate
    uid: 0
    gid: 0
    source: /usr/lib/fluentd-dev/bundle/bin/fluent-plugin-generate
annotations:
  org.opencontainers.image.description: A minimal Fluentd image
  org.opencontainers.image.licenses: Apache-2.0
entrypoint:
  - /usr/bin/tini
  - --
  - /usr/local/bin/docker-entrypoint.sh
cmd:
  - fluentd
ports:
  - 24224/tcp
  - 5140/tcp
