# syntax=dhi.io/build:2-debian13

name: Fluentd 1.19.x
image: dhi.io/fluentd
variant: runtime
tags:
  - "1.19"
  - 1.19.4
  - 1.19-debian
  - 1.19-debian13
  - 1.19.4-debian
  - 1.19.4-debian13
platforms:
  - linux/amd64
  - linux/arm64
dates:
  release: "2026-06-25"
vars:
  GEM_HOME: /usr/local/bundle
  RUBY_MAJOR_MINOR_VERSION: "3.4"
  RUBY_VERSION: 3.4.12-1
  SEMVER_MAJOR_MINOR_VERSION: "1.19"
  SEMVER_MAJOR_VERSION: "1"
  SEMVER_VERSION: 1.19.4
  VERSION: 1.19.4-9
contents:
  repositories:
    - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
  keyring:
    - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
  packages:
    - base-files
    - bash
    - ca-certificates
    - coreutils
    - fluentd-1.19=1.19.4-9
    - libc6
    - libcrypt1
    - libffi8
    - libgcc-s1
    - libgmp10
    - libjemalloc2
    - libssl3t64
    - libstdc++6
    - libyaml-0-2
    - ruby-3.4=3.4.12-1
    - tini
    - tzdata
    - zlib1g
accounts:
  run-as: nonroot
  users:
    - name: nonroot
      uid: 65532
      gid: 65532
  groups:
    - name: nonroot
      gid: 65532
      members:
        - nonroot
os-release:
  name: Docker Hardened Images (Debian)
  id: debian
  version-id: "13"
  version-codename: trixie
  pretty-name: Docker Hardened Images/Debian GNU/Linux 13 (trixie)
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
environment:
  BUNDLE_APP_CONFIG: /usr/local/bundle
  BUNDLE_SILENCE_ROOT_WARNING: "true"
  GEM_HOME: /usr/local/bundle
  PATH: /usr/local/bundle/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
  SSL_CERT_FILE: /etc/ssl/certs/ca-certificates.crt
paths:
  - type: directory
    path: /usr/local/bin
    uid: 0
    gid: 0
  - type: symlink
    path: /usr/local/bundle
    uid: 0
    gid: 0
    source: /usr/lib/fluentd/bundle
  - type: directory
    path: /etc/fluent
    uid: 0
    gid: 0
  - type: directory
    path: /etc/fluent/plugins
    uid: 0
    gid: 0
  - type: directory
    path: /var/log/fluent
    uid: 65532
    gid: 65532
    mode: "0755"
  - type: file
    path: /usr/local/bin/docker-entrypoint.sh
    uid: 0
    gid: 0
    mode: "0755"
    source: image/fluentd/bin/docker-entrypoint.sh
  - type: file
    path: /etc/fluent/fluent.conf
    uid: 0
    gid: 0
    mode: "0755"
    source: image/fluentd/config/fluent.conf
annotations:
  org.opencontainers.image.description: A minimal Fluentd image
  org.opencontainers.image.licenses: Apache-2.0
entrypoint:
  - /usr/bin/tini
  - --
  - /usr/local/bin/docker-entrypoint.sh
cmd:
  - fluentd
ports:
  - 24224/tcp
  - 5140/tcp
