# syntax=dhi.io/build:2-alpine3.24

name: Grafana Synthetic Monitoring Agent 0.x
image: dhi.io/grafana-synthetic-monitoring-agent
variant: runtime
tags:
  - 0-alpine
  - 0.71-alpine
  - 0-alpine3.24
  - 0.71.1-alpine
  - 0.71-alpine3.24
  - 0.71.1-alpine3.24
platforms:
  - linux/amd64
  - linux/arm64
dates:
  release: "2020-06-24"
vars:
  FLAVORED_SUFFIX: ""
  SEMVER_MAJOR_MINOR_VERSION: "0.71"
  SEMVER_MAJOR_VERSION: "0"
  SEMVER_VERSION: 0.71.1
  SUFFIX: ""
  VERSION: 0.71.1-r1
contents:
  repositories:
    - https://dhi.io/apk/alpine/v3.24/main
    - https://dl-cdn.alpinelinux.org/alpine/v3.24/main
    - https://dl-cdn.alpinelinux.org/alpine/v3.24/community
  keyring:
    - https://dhi.io/keyring/dhi-apk@docker-0F81AD7700D99184.rsa.pub
  packages:
    - alpine-baselayout-data
    - ca-certificates-bundle
    - grafana-synthetic-monitoring-agent-0=0.71.1-r1
    - tzdata
  builds:
    - name: setcap synthetic-monitoring-agent
      shell: /bin/bash
      contents:
        packages:
          - bash
          - ca-certificates-bundle
          - libcap-setcap
          - grafana-synthetic-monitoring-agent-0=0.71.1-r1
      pipeline:
        - name: setcap
          runs: |
            set -eux -o pipefail

            setcap cap_net_raw+ep /usr/bin/synthetic-monitoring-agent
            setcap -v cap_net_raw+ep /usr/bin/synthetic-monitoring-agent
      outputs:
        - source: /usr/bin/synthetic-monitoring-agent
          target: /usr/bin/synthetic-monitoring-agent
          uid: 0
          gid: 0
accounts:
  run-as: nonroot
  users:
    - name: nonroot
      uid: 65532
      gid: 65532
  groups:
    - name: nonroot
      gid: 65532
      members:
        - nonroot
os-release:
  name: Docker Hardened Images (Alpine)
  id: alpine
  version-id: "3.24"
  pretty-name: Docker Hardened Images/Alpine Linux v3.24
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
work-dir: /
environment:
  HOME: /home/sm
paths:
  - type: directory
    path: /usr/local/bin
    uid: 0
    gid: 0
  - type: directory
    path: /home/sm
    uid: 65532
    gid: 65532
    mode: "0755"
  - type: symlink
    path: /usr/local/bin/synthetic-monitoring-agent
    uid: 0
    gid: 0
    source: /usr/bin/synthetic-monitoring-agent
annotations:
  org.opencontainers.image.description: A minimal Grafana Synthetic Monitoring agent image
  org.opencontainers.image.licenses: Apache-2.0 AND AGPL-3.0-only
entrypoint:
  - /usr/local/bin/synthetic-monitoring-agent
