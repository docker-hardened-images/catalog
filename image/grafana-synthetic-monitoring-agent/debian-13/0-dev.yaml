# syntax=dhi.io/build:2-debian13

name: Grafana Synthetic Monitoring Agent 0.x (dev)
image: dhi.io/grafana-synthetic-monitoring-agent
variant: dev
tags:
  - 0-dev
  - 0.71-dev
  - 0.71.1-dev
  - 0-debian-dev
  - 0-debian13-dev
  - 0.71-debian-dev
  - 0.71-debian13-dev
  - 0.71.1-debian-dev
  - 0.71.1-debian13-dev
platforms:
  - linux/amd64
  - linux/arm64
dates:
  release: "2020-06-24"
vars:
  FLAVORED_SUFFIX: -dev
  SEMVER_MAJOR_MINOR_VERSION: "0.71"
  SEMVER_MAJOR_VERSION: "0"
  SEMVER_VERSION: 0.71.1
  SUFFIX: -dev
  VERSION: 0.71.1-0
contents:
  repositories:
    - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
  keyring:
    - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
  packages:
    - '!gawk'
    - '!libelogind0'
    - '!mawk'
    - '!original-awk'
    - apt
    - base-files
    - bash
    - ca-certificates
    - ca-certificates-bundle
    - coreutils
    - diffutils
    - dpkg
    - findutils
    - grafana-synthetic-monitoring-agent-0-dev=0.71.1-0
    - grep
    - libc-bin
    - mawk
    - perl-base
    - sed
    - tzdata
    - util-linux
  builds:
    - name: setcap synthetic-monitoring-agent
      shell: /bin/bash
      contents:
        packages:
          - bash
          - ca-certificates-bundle
          - libcap2-bin
          - grafana-synthetic-monitoring-agent-0-dev=0.71.1-0
      pipeline:
        - name: setcap
          runs: |
            set -eux -o pipefail

            setcap cap_net_raw+ep /usr/bin/synthetic-monitoring-agent
            setcap -v cap_net_raw+ep /usr/bin/synthetic-monitoring-agent
      outputs:
        - source: /usr/bin/synthetic-monitoring-agent
          target: /usr/bin/synthetic-monitoring-agent
          uid: 0
          gid: 0
accounts:
  root: true
  run-as: root
  users:
    - name: nonroot
      uid: 65532
      gid: 65532
    - name: _apt
      uid: 42
      gid: 65532
    - name: _apt
      uid: 42
      gid: 65532
  groups:
    - name: nonroot
      gid: 65532
      members:
        - nonroot
os-release:
  name: Docker Hardened Images (Debian)
  id: debian
  version-id: "13"
  version-codename: trixie
  pretty-name: Docker Hardened Images/Debian GNU/Linux 13 (trixie)
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
work-dir: /
environment:
  DEBIAN_FRONTEND: noninteractive
  HOME: /home/sm
paths:
  - type: directory
    path: /usr/local/bin
    uid: 0
    gid: 0
  - type: directory
    path: /home/sm
    uid: 65532
    gid: 65532
    mode: "0755"
  - type: symlink
    path: /usr/local/bin/synthetic-monitoring-agent
    uid: 0
    gid: 0
    source: /usr/bin/synthetic-monitoring-agent
annotations:
  org.opencontainers.image.description: A minimal Grafana Synthetic Monitoring agent image
  org.opencontainers.image.licenses: Apache-2.0 AND AGPL-3.0-only
entrypoint:
  - /usr/local/bin/synthetic-monitoring-agent
