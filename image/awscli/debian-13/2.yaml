# syntax=dhi.io/build:2-debian13

name: AWS CLI 2.x
image: dhi.io/awscli
variant: runtime
tags:
  - "2"
  - "2.36"
  - 2.36.38
  - 2-debian
  - 2-debian13
  - 2.36-debian
  - 2.36-debian13
  - 2.36.38-debian
  - 2.36.38-debian13
platforms:
  - linux/amd64
  - linux/arm64
vars:
  ARCH: '#{ target.arch == "amd64" ? "x86_64" : "aarch64" }'
  SEMVER_MAJOR_MINOR_VERSION: "2.36"
  SEMVER_MAJOR_VERSION: "2"
  SEMVER_VERSION: 2.36.38
  VERSION: 2.36.38-0
contents:
  repositories:
    - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
  keyring:
    - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
  packages:
    - '!libelogind0'
    - '!mawk'
    - '!original-awk'
    - awscli-2=2.36.38-0
    - base-files
    - groff-base
    - less
    - libffi8
    - ncurses-base
    - zlib1g
accounts:
  run-as: nonroot
  users:
    - name: nonroot
      uid: 65532
      gid: 65532
  groups:
    - name: nonroot
      gid: 65532
      members:
        - nonroot
os-release:
  name: Docker Hardened Images (Debian)
  id: debian
  version-id: "13"
  version-codename: trixie
  pretty-name: Docker Hardened Images/Debian GNU/Linux 13 (trixie)
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
environment:
  AWS_CLI_VERSION: 2.36.38
  PATH: /opt/aws-cli/bin:/usr/sbin:/sbin:/usr/bin:/bin
paths:
  - type: directory
    path: /opt
    uid: 0
    gid: 0
  - type: symlink
    path: /opt/aws-cli
    uid: 0
    gid: 0
    source: /usr/lib/awscli-2
annotations:
  org.opencontainers.image.description: A minimal AWS CLI image
cmd:
  - aws
  - help
