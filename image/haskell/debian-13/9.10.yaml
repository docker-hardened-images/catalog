# syntax=dhi.io/build:2-debian13

name: Haskell 9.10.x
image: dhi.io/haskell
variant: runtime
tags:
  - "9.10"
  - 9.10.3
  - 9.10-debian
  - 9.10-debian13
  - 9.10.3-debian
  - 9.10.3-debian13
platforms:
  - linux/amd64
  - linux/arm64
dates:
  release: "2024-05-10"
vars:
  BINUTILS_ARCH: '#{ target.arch == "amd64" ? "x86-64" : "aarch64" }'
  CABAL_VERSION: 3.18.1.0-0
  GHC_SERIES: "9.10"
  SEMVER_MAJOR_MINOR_VERSION: "9.10"
  SEMVER_MAJOR_VERSION: "9"
  SEMVER_VERSION: 9.10.3
  STACK_VERSION: 3.11.1-0
  VERSION: 9.10.3-1
contents:
  repositories:
    - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
  keyring:
    - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
  packages:
    - '!binutils'
    - '!binutils-aarch64-linux-gnu'
    - '!binutils-common'
    - '!binutils-x86-64-linux-gnu'
    - '!libbinutils'
    - '!libctf-nobfd0'
    - '!libctf0'
    - '!libelogind0'
    - '!libgprofng0'
    - '!libsframe1'
    - '!mawk'
    - '!original-awk'
    - base-files
    - bash
    - binutils-latest
    - binutils-latest-${BINUTILS_ARCH}-linux-gnu
    - ca-certificates
    - ca-certificates-bundle
    - cabal-install=3.18.1.0-0
    - coreutils
    - curl
    - findutils
    - g++
    - gcc
    - ghc-9.10=9.10.3-1
    - git
    - gnupg
    - grep
    - libc6-dev
    - libctf-nobfd0-latest
    - libctf0-latest
    - libexpat1
    - libffi-dev
    - libgmp-dev
    - libgprofng0-latest
    - libncurses-dev
    - libnuma-dev
    - make
    - netbase
    - sed
    - stack=3.11.1-0
    - tar
    - tzdata
    - xz-utils
    - zlib1g-dev
accounts:
  run-as: nonroot
  users:
    - name: nonroot
      uid: 65532
      gid: 65532
  groups:
    - name: nonroot
      gid: 65532
      members:
        - nonroot
os-release:
  name: Docker Hardened Images (Debian)
  id: debian
  version-id: "13"
  version-codename: trixie
  pretty-name: Docker Hardened Images/Debian GNU/Linux 13 (trixie)
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
environment:
  HOME: /home/nonroot
  LANG: C.UTF-8
  PATH: /home/nonroot/.cabal/bin:/home/nonroot/.local/bin:/opt/ghc/9.10.3/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
paths:
  - type: directory
    path: /home/nonroot
    uid: 65532
    gid: 65532
    mode: "0755"
  - type: directory
    path: /etc/stack
    uid: 0
    gid: 0
    mode: "0755"
  - type: file
    path: /etc/stack/config.yaml
    content: |
      system-ghc: true
      install-ghc: false
    uid: 0
    gid: 0
    mode: "0644"
  - type: directory
    path: /opt/ghc
    uid: 0
    gid: 0
    mode: "0755"
  - type: symlink
    path: /opt/ghc/9.10.3
    uid: 0
    gid: 0
    source: /usr/lib/ghc-9.10
  - type: directory
    path: /usr/local/bin
    uid: 0
    gid: 0
    mode: "0755"
  - type: symlink
    path: /usr/local/bin/cabal
    uid: 0
    gid: 0
    source: /usr/bin/cabal
  - type: symlink
    path: /usr/local/bin/stack
    uid: 0
    gid: 0
    source: /usr/bin/stack
annotations:
  org.opencontainers.image.description: A minimal Haskell (GHC) toolchain image
  org.opencontainers.image.licenses: BSD-3-Clause
cmd:
  - ghc
  - --version
