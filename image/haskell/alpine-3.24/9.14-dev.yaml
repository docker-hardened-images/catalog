# syntax=dhi.io/build:2-alpine3.24

name: Haskell 9.14.x (dev)
image: dhi.io/haskell
variant: dev
tags:
  - 9-alpine-dev
  - 9.14-alpine-dev
  - 9-alpine3.24-dev
  - 9.14.1-alpine-dev
  - 9.14-alpine3.24-dev
  - 9.14.1-alpine3.24-dev
platforms:
  - linux/amd64
  - linux/arm64
dates:
  release: "2025-12-19"
vars:
  CABAL_VERSION: 3.18.2.0-r3
  GHC_SERIES: "9.14"
  SEMVER_MAJOR_MINOR_VERSION: "9.14"
  SEMVER_MAJOR_VERSION: "9"
  SEMVER_VERSION: 9.14.1
  STACK_VERSION: 3.11.1-r6
  VERSION: 9.14.1-r4
contents:
  repositories:
    - https://dhi.io/apk/alpine/v3.24/main
    - https://dl-cdn.alpinelinux.org/alpine/v3.24/main
    - https://dl-cdn.alpinelinux.org/alpine/v3.24/community
  keyring:
    - https://dhi.io/keyring/dhi-apk@docker-0F81AD7700D99184.rsa.pub
  packages:
    - alpine-baselayout-data
    - apk-tools
    - bash
    - binutils
    - busybox
    - ca-certificates-bundle
    - cabal-install=3.18.2.0-r3
    - coreutils
    - curl
    - findutils
    - g++
    - gcc
    - ghc-9.14=9.14.1-r4
    - git
    - gmp-dev
    - gnupg
    - grep
    - libffi-dev
    - make
    - musl-dev
    - ncurses-dev
    - numactl-dev
    - sed
    - stack=3.11.1-r6
    - tar
    - tzdata
    - xz
    - zlib-dev
accounts:
  root: true
  run-as: root
  users:
    - name: nonroot
      uid: 65532
      gid: 65532
  groups:
    - name: nonroot
      gid: 65532
      members:
        - nonroot
os-release:
  name: Docker Hardened Images (Alpine)
  id: alpine
  version-id: "3.24"
  pretty-name: Docker Hardened Images/Alpine Linux v3.24
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
environment:
  HOME: /root
  LANG: C.UTF-8
  PATH: /root/.cabal/bin:/root/.local/bin:/opt/ghc/9.14.1/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
paths:
  - type: directory
    path: /home/nonroot
    uid: 65532
    gid: 65532
    mode: "0755"
  - type: directory
    path: /etc/stack
    uid: 0
    gid: 0
    mode: "0755"
  - type: file
    path: /etc/stack/config.yaml
    content: |
      system-ghc: true
      install-ghc: false
    uid: 0
    gid: 0
    mode: "0644"
  - type: directory
    path: /opt/ghc
    uid: 0
    gid: 0
    mode: "0755"
  - type: symlink
    path: /opt/ghc/9.14.1
    uid: 0
    gid: 0
    source: /usr/lib/ghc-9.14
  - type: directory
    path: /usr/local/bin
    uid: 0
    gid: 0
    mode: "0755"
  - type: symlink
    path: /usr/local/bin/cabal
    uid: 0
    gid: 0
    source: /usr/bin/cabal
  - type: symlink
    path: /usr/local/bin/stack
    uid: 0
    gid: 0
    source: /usr/bin/stack
annotations:
  org.opencontainers.image.description: A minimal Haskell (GHC) toolchain image
  org.opencontainers.image.licenses: BSD-3-Clause
cmd:
  - ghc
  - --version
