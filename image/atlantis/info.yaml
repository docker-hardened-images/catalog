metadata:
  display-name: Atlantis
  short-description: Atlantis is a self-hosted application for automating Terraform pull request workflows.
  featured: false
  home-url: https://www.runatlantis.io
  categories:
    - integration-and-delivery
  included-tools:
    - name: terraform
      description: Infrastructure-as-code tool that Atlantis invokes to run plan and apply operations for pull requests.
    - name: git-lfs
      description: Git Large File Storage extension, used by Atlantis when cloning repositories that store large files.
