# syntax=dhi.io/build:2-alpine3.24

name: Atlantis 0.x (dev)
image: dhi.io/atlantis
variant: dev
tags:
  - 0-alpine-dev
  - 0.48-alpine-dev
  - 0-alpine3.24-dev
  - 0.48.1-alpine-dev
  - 0.48-alpine3.24-dev
  - 0.48.1-alpine3.24-dev
platforms:
  - linux/amd64
  - linux/arm64
dates:
  release: "2018-02-06"
vars:
  FLAVORED_SUFFIX: -dev
  SEMVER_MAJOR_MINOR_VERSION: "0.48"
  SEMVER_MAJOR_VERSION: "0"
  SEMVER_VERSION: 0.48.1
  SUFFIX: -dev
  TERRAFORM_VERSION: 1.16.5-r1
  VERSION: 0.48.1-r0
contents:
  repositories:
    - https://dhi.io/apk/alpine/v3.24/main
    - https://dl-cdn.alpinelinux.org/alpine/v3.24/main
    - https://dl-cdn.alpinelinux.org/alpine/v3.24/community
  keyring:
    - https://dhi.io/keyring/dhi-apk@docker-0F81AD7700D99184.rsa.pub
  packages:
    - apk-tools
    - atlantis-dev=0.48.1-r0
    - bash
    - busybox
    - ca-certificates
    - ca-certificates-bundle
    - coreutils
    - dumb-init
    - findutils
    - git
    - git-lfs-dev
    - gnupg
    - openssh-client
    - terraform-1.16-dev=1.16.5-r1
    - tzdata
accounts:
  root: true
  run-as: root
  users:
    - name: nonroot
      uid: 65532
      gid: 65532
  groups:
    - name: nonroot
      gid: 65532
      members:
        - nonroot
os-release:
  name: Docker Hardened Images (Alpine)
  id: alpine
  version-id: "3.24"
  pretty-name: Docker Hardened Images/Alpine Linux v3.24
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
environment:
  ATLANTIS_TF_DOWNLOAD: "false"
  HOME: /home/nonroot
paths:
  - type: directory
    path: /usr/local/bin
    uid: 0
    gid: 0
  - type: symlink
    path: /usr/local/bin/atlantis
    uid: 0
    gid: 0
    source: /usr/bin/atlantis
  - type: symlink
    path: /usr/local/bin/terraform
    uid: 0
    gid: 0
    source: /usr/bin/terraform
  - type: directory
    path: /home/nonroot
    uid: 65532
    gid: 65532
    mode: "0770"
  - type: directory
    path: /home/nonroot/.atlantis
    uid: 65532
    gid: 65532
    mode: "0770"
annotations:
  org.opencontainers.image.description: A minimal Atlantis image
  org.opencontainers.image.licenses: Apache-2.0
entrypoint:
  - /usr/bin/dumb-init
  - --single-child
  - --
  - /usr/local/bin/atlantis
cmd:
  - server
ports:
  - 4141/tcp
