# syntax=dhi.io/build:2-debian13

name: Atlantis 0.x
image: dhi.io/atlantis
variant: runtime
tags:
  - "0"
  - "0.48"
  - 0.48.1
  - 0-debian
  - 0-debian13
  - 0.48-debian
  - 0.48-debian13
  - 0.48.1-debian
  - 0.48.1-debian13
platforms:
  - linux/amd64
  - linux/arm64
dates:
  release: "2018-02-06"
vars:
  FLAVORED_SUFFIX: ""
  SEMVER_MAJOR_MINOR_VERSION: "0.48"
  SEMVER_MAJOR_VERSION: "0"
  SEMVER_VERSION: 0.48.1
  SUFFIX: ""
  TERRAFORM_VERSION: 1.16.5-1
  VERSION: 0.48.1-0
contents:
  repositories:
    - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
  keyring:
    - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
  packages:
    - atlantis=0.48.1-0
    - base-files
    - ca-certificates-bundle
    - coreutils
    - dash
    - dirmngr
    - dumb-init
    - git
    - git-lfs
    - gpg
    - gpg-agent
    - openssh-client
    - pinentry-tty
    - terraform-1.16=1.16.5-1
    - tzdata
accounts:
  run-as: nonroot
  users:
    - name: nonroot
      uid: 65532
      gid: 65532
  groups:
    - name: nonroot
      gid: 65532
      members:
        - nonroot
os-release:
  name: Docker Hardened Images (Debian)
  id: debian
  version-id: "13"
  version-codename: trixie
  pretty-name: Docker Hardened Images/Debian GNU/Linux 13 (trixie)
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
environment:
  ATLANTIS_TF_DOWNLOAD: "false"
  HOME: /home/nonroot
paths:
  - type: directory
    path: /usr/local/bin
    uid: 0
    gid: 0
  - type: symlink
    path: /usr/local/bin/atlantis
    uid: 0
    gid: 0
    source: /usr/bin/atlantis
  - type: symlink
    path: /usr/local/bin/terraform
    uid: 0
    gid: 0
    source: /usr/bin/terraform
  - type: directory
    path: /home/nonroot
    uid: 65532
    gid: 65532
    mode: "0770"
  - type: directory
    path: /home/nonroot/.atlantis
    uid: 65532
    gid: 65532
    mode: "0770"
annotations:
  org.opencontainers.image.description: A minimal Atlantis image
  org.opencontainers.image.licenses: Apache-2.0
entrypoint:
  - /usr/bin/dumb-init
  - --single-child
  - --
  - /usr/local/bin/atlantis
cmd:
  - server
ports:
  - 4141/tcp
