# syntax=dhi.io/build:2-debian13

name: Atlantis 0.x (dev)
image: dhi.io/atlantis
variant: dev
tags:
  - 0-dev
  - 0.48-dev
  - 0.48.1-dev
  - 0-debian-dev
  - 0-debian13-dev
  - 0.48-debian-dev
  - 0.48-debian13-dev
  - 0.48.1-debian-dev
  - 0.48.1-debian13-dev
platforms:
  - linux/amd64
  - linux/arm64
dates:
  release: "2018-02-06"
vars:
  FLAVORED_SUFFIX: -dev
  SEMVER_MAJOR_MINOR_VERSION: "0.48"
  SEMVER_MAJOR_VERSION: "0"
  SEMVER_VERSION: 0.48.1
  SUFFIX: -dev
  TERRAFORM_VERSION: 1.16.5-1
  VERSION: 0.48.1-1
contents:
  repositories:
    - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
  keyring:
    - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
  packages:
    - '!gawk'
    - '!libelogind0'
    - '!original-awk'
    - apt
    - atlantis-dev=0.48.1-1
    - base-files
    - bash
    - ca-certificates
    - ca-certificates-bundle
    - coreutils
    - dash
    - diffutils
    - dirmngr
    - dpkg
    - dumb-init
    - findutils
    - git
    - git-lfs-dev
    - gpg
    - gpg-agent
    - grep
    - libc-bin
    - mawk
    - openssh-client
    - perl-base
    - pinentry-tty
    - sed
    - terraform-1.16-dev=1.16.5-1
    - tzdata
    - util-linux
accounts:
  root: true
  run-as: root
  users:
    - name: nonroot
      uid: 65532
      gid: 65532
    - name: _apt
      uid: 42
      gid: 65532
  groups:
    - name: nonroot
      gid: 65532
      members:
        - nonroot
os-release:
  name: Docker Hardened Images (Debian)
  id: debian
  version-id: "13"
  version-codename: trixie
  pretty-name: Docker Hardened Images/Debian GNU/Linux 13 (trixie)
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
environment:
  ATLANTIS_TF_DOWNLOAD: "false"
  DEBIAN_FRONTEND: noninteractive
  HOME: /home/nonroot
paths:
  - type: directory
    path: /usr/local/bin
    uid: 0
    gid: 0
  - type: symlink
    path: /usr/local/bin/atlantis
    uid: 0
    gid: 0
    source: /usr/bin/atlantis
  - type: symlink
    path: /usr/local/bin/terraform
    uid: 0
    gid: 0
    source: /usr/bin/terraform
  - type: directory
    path: /home/nonroot
    uid: 65532
    gid: 65532
    mode: "0770"
  - type: directory
    path: /home/nonroot/.atlantis
    uid: 65532
    gid: 65532
    mode: "0770"
annotations:
  org.opencontainers.image.description: A minimal Atlantis image
  org.opencontainers.image.licenses: Apache-2.0
entrypoint:
  - /usr/bin/dumb-init
  - --single-child
  - --
  - /usr/local/bin/atlantis
cmd:
  - server
ports:
  - 4141/tcp
