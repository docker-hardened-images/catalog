# syntax=dhi.io/build:2-debian13

name: RabbitMQ Messaging Topology Operator 1.x (dev)
image: dhi.io/rabbitmq-messaging-topology-operator
variant: dev
tags:
  - 1-dev
  - 1.20-dev
  - 1.20.5-dev
  - 1-debian-dev
  - 1-debian13-dev
  - 1.20-debian-dev
  - 1.20-debian13-dev
  - 1.20.5-debian-dev
  - 1.20.5-debian13-dev
platforms:
  - linux/amd64
  - linux/arm64
dates:
  release: "2021-09-02"
vars:
  FLAVORED_SUFFIX: -dev
  SEMVER_MAJOR_MINOR_VERSION: "1.20"
  SEMVER_MAJOR_VERSION: "1"
  SEMVER_VERSION: 1.20.5
  SUFFIX: -dev
  VERSION: 1.20.5-1
contents:
  repositories:
    - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
  keyring:
    - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
  packages:
    - '!gawk'
    - '!libelogind0'
    - '!original-awk'
    - apt
    - base-files
    - bash
    - ca-certificates
    - ca-certificates-bundle
    - coreutils
    - diffutils
    - dpkg
    - findutils
    - grep
    - libc-bin
    - mawk
    - perl-base
    - rabbitmq-messaging-topology-operator-1-dev=1.20.5-1
    - sed
    - tzdata
    - util-linux
  builds:
    - name: locale
      contents:
        packages:
          - bash
          - locales
          - coreutils
          - gzip
      pipeline:
        - name: install locales
          runs: |
            set -eux -o pipefail

            ln -s /etc/locale.alias /usr/share/locale/locale.alias

            echo "en_US.UTF-8 UTF-8" >> /etc/locale.gen
            locale-gen en_US.UTF-8
      outputs:
        - source: /usr/share/locale
          target: /usr/share/locale
          uid: 0
          gid: 0
        - source: /usr/lib/locale
          target: /usr/lib/locale
          uid: 0
          gid: 0
accounts:
  root: true
  run-as: root
  users:
    - name: nonroot
      uid: 65532
      gid: 65532
    - name: _apt
      uid: 42
      gid: 65532
  groups:
    - name: nonroot
      gid: 65532
      members:
        - nonroot
os-release:
  name: Docker Hardened Images (Debian)
  id: debian
  version-id: "13"
  version-codename: trixie
  pretty-name: Docker Hardened Images/Debian GNU/Linux 13 (trixie)
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
work-dir: /
environment:
  DEBIAN_FRONTEND: noninteractive
  LANG: en_US.UTF-8
  LANGUAGE: en_US:en
  LC_ALL: en_US.UTF-8
paths:
  - type: symlink
    path: /manager
    uid: 0
    gid: 0
    source: /usr/bin/manager
annotations:
  org.opencontainers.image.description: A minimal RabbitMQ Messaging Topology Operator image
  org.opencontainers.image.licenses: MPL-2.0
entrypoint:
  - /manager
ports:
  - 8081/tcp
  - 9443/tcp
