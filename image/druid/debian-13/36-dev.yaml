# syntax=dhi.io/build:2-debian13

name: Apache Druid 36.x (dev)
image: dhi.io/druid
variant: dev
tags:
  - 36-dev
  - 36.0-dev
  - 36.0.0-dev
  - 36-debian-dev
  - 36-debian13-dev
  - 36.0-debian-dev
  - 36.0-debian13-dev
  - 36.0.0-debian-dev
  - 36.0.0-debian13-dev
platforms:
  - linux/amd64
  - linux/arm64
dates:
  release: "2026-02-09"
vars:
  DRUID_HOME: /opt/druid
  DRUID_PACKAGE_SUFFIX: ""
  JAVA_FIPS_SUFFIX: ""
  JAVA_HOME: /usr/lib/jvm/temurin-21
  JAVA_VARIANT: jdk
  JDK_MAJOR_VERSION: "21"
  SEMVER_MAJOR_MINOR_VERSION: "36.0"
  SEMVER_MAJOR_VERSION: "36"
  SEMVER_VERSION: 36.0.0
  VERSION: 36.0.0-31
contents:
  repositories:
    - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
  keyring:
    - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
  packages:
    - '!gawk'
    - '!libelogind0'
    - '!mawk'
    - '!original-awk'
    - apt
    - base-files
    - bash
    - ca-certificates
    - ca-certificates-bundle
    - coreutils
    - diffutils
    - dpkg
    - druid-36=36.0.0-31
    - eclipse-temurin-21-jdk
    - eclipse-temurin-21-jdk-oci-config
    - findutils
    - grep
    - iproute2
    - libc-bin
    - mawk
    - perl-base
    - procps
    - sed
    - tzdata
    - util-linux
  builds:
    - name: druid package ownership
      contents:
        packages:
          - bash
          - coreutils
          - druid-36=36.0.0-31
      pipeline:
        - name: set druid ownership
          runs: |
            set -eux -o pipefail

            chown -R 1000:1000 /usr/share/druid
            if [ -f /usr/share/druid/bin/run-java ]; then
              chmod 744 /usr/share/druid/bin/run-java
            fi
      outputs:
        - source: /usr/share/druid
          target: /usr/share/druid
          uid: 0
          gid: 0
    - name: locale
      contents:
        packages:
          - bash
          - locales
          - coreutils
          - gzip
      pipeline:
        - name: install locales
          runs: |
            set -eux -o pipefail

            ln -s /etc/locale.alias /usr/share/locale/locale.alias

            echo "en_US.UTF-8 UTF-8" >> /etc/locale.gen
            locale-gen en_US.UTF-8
      outputs:
        - source: /usr/share/locale
          target: /usr/share/locale
          uid: 0
          gid: 0
        - source: /usr/lib/locale
          target: /usr/lib/locale
          uid: 0
          gid: 0
accounts:
  root: true
  run-as: root
  users:
    - name: druid
      uid: 1000
      gid: 1000
    - name: _apt
      uid: 42
      gid: 65532
  groups:
    - name: druid
      gid: 1000
      members:
        - druid
os-release:
  name: Docker Hardened Images (Debian)
  id: debian
  version-id: "13"
  version-codename: trixie
  pretty-name: Docker Hardened Images/Debian GNU/Linux 13 (trixie)
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
work-dir: /opt/druid
environment:
  DEBIAN_FRONTEND: noninteractive
  DRUID_HOME: /opt/druid
  JAVA_HOME: /usr/lib/jvm/temurin-21
  LANG: en_US.UTF-8
  LANGUAGE: en_US:en
  LC_ALL: en_US.UTF-8
  PATH: /usr/lib/jvm/temurin-21/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
paths:
  - type: directory
    path: /opt
    uid: 0
    gid: 0
  - type: symlink
    path: /opt/druid
    uid: 0
    gid: 0
    source: /usr/share/druid
  - type: directory
    path: /usr/share/druid/var
    uid: 1000
    gid: 1000
    mode: "0755"
  - type: directory
    path: /opt/shared
    uid: 1000
    gid: 1000
    mode: "0775"
  - type: directory
    path: /usr/local/bin
    uid: 0
    gid: 0
  - type: symlink
    path: /usr/local/bin/druid.sh
    uid: 0
    gid: 0
    source: /usr/bin/druid.sh
  - type: symlink
    path: /usr/local/bin/peon.sh
    uid: 0
    gid: 0
    source: /usr/bin/peon.sh
  - type: symlink
    path: /druid.sh
    uid: 0
    gid: 0
    source: /usr/local/bin/druid.sh
  - type: symlink
    path: /peon.sh
    uid: 0
    gid: 0
    source: /usr/local/bin/peon.sh
annotations:
  org.opencontainers.image.description: A minimal Apache Druid image
  org.opencontainers.image.licenses: Apache-2.0
entrypoint:
  - /druid.sh
ports:
  - "8081"
  - "8082"
  - "8083"
  - "8090"
  - "8091"
  - "8888"
