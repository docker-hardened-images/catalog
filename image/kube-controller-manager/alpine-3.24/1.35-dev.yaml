    - apk-tools
    - bash
    - busybox
    - ca-certificates
    - ca-certificates-bundle
    - coreutils
    - findutils
    - kube-controller-manager-1.35-dev=1.35.8-r2
    - tzdata
accounts:
  root: true
  run-as: root
