# syntax=dhi.io/build:2-alpine3.24

name: Kubernetes Controller Manager 1.35.x (dev)
image: dhi.io/kube-controller-manager
variant: dev
tags:
  - 1.35-alpine-dev
  - 1.35.8-alpine-dev
  - 1.35-alpine3.24-dev
  - 1.35.8-alpine3.24-dev
platforms:
  - linux/amd64
  - linux/arm64
dates:
  release: "2025-12-17"
