# syntax=dhi.io/build:2-debian13

name: Kubernetes Controller Manager 1.36.x (dev)
image: dhi.io/kube-controller-manager
variant: dev
tags:
  - 1-dev
  - 1.36-dev
  - 1.36.3-dev
  - v1.36.3-dev
  - 1-debian-dev
  - 1-debian13-dev
  - 1.36-debian-dev
  - 1.36-debian13-dev
  - 1.36.3-debian-dev
  - 1.36.3-debian13-dev
platforms:
  - linux/amd64
  - linux/arm64
dates:
  release: "2026-04-22"
  end-of-life: "2027-06-28"
vars:
  FLAVORED_SUFFIX: -dev
  SEMVER_MAJOR_MINOR_VERSION: "1.36"
  SEMVER_MAJOR_VERSION: "1"
  SEMVER_VERSION: 1.36.3
  SUFFIX: -dev
  VERSION: 1.36.3-4
contents:
  repositories:
    - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
  keyring:
    - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
  packages:
    - '!gawk'
    - '!libelogind0'
    - '!original-awk'
    - apt
    - base-files
    - bash
    - ca-certificates
    - ca-certificates-bundle
    - coreutils
    - diffutils
    - dpkg
    - findutils
    - grep
    - kube-controller-manager-1.36-dev=1.36.3-4
    - libc-bin
    - mawk
    - perl-base
    - sed
    - tzdata
    - util-linux
accounts:
  root: true
  run-as: root
  users:
    - name: nonroot
      uid: 65532
      gid: 65532
    - name: _apt
      uid: 42
      gid: 65532
  groups:
    - name: nonroot
      gid: 65532
      members:
        - nonroot
os-release:
  name: Docker Hardened Images (Debian)
  id: debian
  version-id: "13"
  version-codename: trixie
  pretty-name: Docker Hardened Images/Debian GNU/Linux 13 (trixie)
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
environment:
  DEBIAN_FRONTEND: noninteractive
paths:
  - type: directory
    path: /usr/local/bin
    uid: 0
    gid: 0
  - type: symlink
    path: /usr/local/bin/kube-controller-manager
    uid: 0
    gid: 0
    source: /usr/bin/kube-controller-manager
  - type: directory
    path: /run/kubernetes
    uid: 65532
    gid: 65532
    mode: "0755"
annotations:
  org.opencontainers.image.description: A minimal Kubernetes controller manager image
  org.opencontainers.image.licenses: Apache-2.0
entrypoint:
  - kube-controller-manager
