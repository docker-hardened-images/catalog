# syntax=dhi.io/build:2-debian13

name: Typesense 29.x (dev)
image: dhi.io/typesense
variant: dev
tags:
  - 29-dev
  - 29.1-dev
  - 29-debian-dev
  - 29-debian13-dev
  - 29.1-debian-dev
  - 29.1-debian13-dev
platforms:
  - linux/amd64
  - linux/arm64
dates:
  release: "2025-06-30"
vars:
  SEMVER_MAJOR_MINOR_VERSION: "29.1"
  SEMVER_MAJOR_VERSION: "29"
  SEMVER_VERSION: "29.1"
  VERSION: 29.1-5
contents:
  repositories:
    - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
  keyring:
    - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
  packages:
    - '!gawk'
    - '!libelogind0'
    - '!original-awk'
    - apt
    - base-files
    - bash
    - ca-certificates
    - ca-certificates-bundle
    - coreutils
    - diffutils
    - dpkg
    - findutils
    - grep
    - libc-bin
    - libc6
    - mawk
    - perl-base
    - sed
    - typesense-29=29.1-5
    - tzdata
    - util-linux
  builds:
    - name: locale
      contents:
        packages:
          - bash
          - locales
          - coreutils
          - gzip
      pipeline:
        - name: install locales
          runs: |
            set -eux -o pipefail

            ln -s /etc/locale.alias /usr/share/locale/locale.alias

            echo "en_US.UTF-8 UTF-8" >> /etc/locale.gen
            locale-gen en_US.UTF-8
      outputs:
        - source: /usr/share/locale
          target: /usr/share/locale
          uid: 0
          gid: 0
        - source: /usr/lib/locale
          target: /usr/lib/locale
          uid: 0
          gid: 0
accounts:
  root: true
  run-as: root
  users:
    - name: nonroot
      uid: 65532
      gid: 65532
    - name: _apt
      uid: 42
      gid: 65532
  groups:
    - name: nonroot
      gid: 65532
      members:
        - nonroot
os-release:
  name: Docker Hardened Images (Debian)
  id: debian
  version-id: "13"
  version-codename: trixie
  pretty-name: Docker Hardened Images/Debian GNU/Linux 13 (trixie)
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
environment:
  DEBIAN_FRONTEND: noninteractive
  LANG: en_US.UTF-8
  LANGUAGE: en_US:en
  LC_ALL: en_US.UTF-8
paths:
  - type: directory
    path: /opt
    uid: 0
    gid: 0
  - type: symlink
    path: /opt/typesense-server
    uid: 0
    gid: 0
    source: /usr/bin/typesense-server
  - type: directory
    path: /data
    uid: 65532
    gid: 65532
    mode: "0770"
annotations:
  org.opencontainers.image.description: A minimal Typesense image
  org.opencontainers.image.licenses: GPL-3.0
entrypoint:
  - /opt/typesense-server
ports:
  - 8108/tcp
  - 8107/tcp
