# syntax=dhi.io/build:2-debian13

name: Typesense 30.x
image: dhi.io/typesense
variant: runtime
tags:
  - "30"
  - "30.2"
  - 30-debian
  - 30-debian13
  - 30.2-debian
  - 30.2-debian13
platforms:
  - linux/amd64
  - linux/arm64
dates:
  release: "2026-01-27"
vars:
  SEMVER_MAJOR_MINOR_VERSION: "30.2"
  SEMVER_MAJOR_VERSION: "30"
  SEMVER_VERSION: "30.2"
  VERSION: 30.2-5
contents:
  repositories:
    - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
  keyring:
    - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
  packages:
    - base-files
    - ca-certificates-bundle
    - libc6
    - typesense-30=30.2-5
    - tzdata
accounts:
  run-as: nonroot
  users:
    - name: nonroot
      uid: 65532
      gid: 65532
  groups:
    - name: nonroot
      gid: 65532
      members:
        - nonroot
os-release:
  name: Docker Hardened Images (Debian)
  id: debian
  version-id: "13"
  version-codename: trixie
  pretty-name: Docker Hardened Images/Debian GNU/Linux 13 (trixie)
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
stop-signal: SIGINT
paths:
  - type: directory
    path: /opt
    uid: 0
    gid: 0
  - type: symlink
    path: /opt/typesense-server
    uid: 0
    gid: 0
    source: /usr/bin/typesense-server
  - type: directory
    path: /data
    uid: 65532
    gid: 65532
    mode: "0770"
annotations:
  org.opencontainers.image.description: A minimal Typesense image
  org.opencontainers.image.licenses: GPL-3.0
entrypoint:
  - /opt/typesense-server
ports:
  - 8108/tcp
  - 8107/tcp
