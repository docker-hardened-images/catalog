# syntax=dhi.io/build:2-alpine3.24

name: Percona Operator for MongoDB 1.x
image: dhi.io/percona-server-mongodb-operator
variant: runtime
tags:
  - 1-alpine
  - 1.23-alpine
  - 1-alpine3.24
  - 1.23.1-alpine
  - 1.23-alpine3.24
  - 1.23.1-alpine3.24
platforms:
  - linux/amd64
  - linux/arm64
dates:
  release: "2026-07-23"
vars:
  FLAVORED_SUFFIX: ""
  SEMVER_MAJOR_MINOR_VERSION: "1.23"
  SEMVER_MAJOR_VERSION: "1"
  SEMVER_VERSION: 1.23.1
  SUFFIX: ""
  VERSION: 1.23.1-r0
contents:
  repositories:
    - https://dhi.io/apk/alpine/v3.24/main
    - https://dl-cdn.alpinelinux.org/alpine/v3.24/main
    - https://dl-cdn.alpinelinux.org/alpine/v3.24/community
  keyring:
    - https://dhi.io/keyring/dhi-apk@docker-0F81AD7700D99184.rsa.pub
  packages:
    - alpine-baselayout-data
    - bash
    - ca-certificates-bundle
    - coreutils
    - percona-server-mongodb-operator=1.23.1-r0
    - tzdata
  builds:
    - name: init-payload
      contents:
        packages:
          - bash
          - percona-server-mongodb-operator=1.23.1-r0
      pipeline:
        - name: check init scripts
          runs: |
            set -eux -o pipefail

            bash -n /usr/share/percona-server-mongodb-operator/*.sh /usr/share/percona-server-mongodb-operator/logcollector/entrypoint.sh
      outputs:
        - source: /usr/share/percona-server-mongodb-operator/init-entrypoint.sh
          target: /init-entrypoint.sh
          uid: 0
          gid: 0
        - source: /usr/share/percona-server-mongodb-operator/ps-entry.sh
          target: /ps-entry.sh
          uid: 0
          gid: 0
        - source: /usr/share/percona-server-mongodb-operator/physical-restore-ps-entry.sh
          target: /physical-restore-ps-entry.sh
          uid: 0
          gid: 0
        - source: /usr/share/percona-server-mongodb-operator/pbm-entry.sh
          target: /pbm-entry.sh
          uid: 0
          gid: 0
        - source: /usr/share/percona-server-mongodb-operator/mongot-entrypoint.sh
          target: /mongot-entrypoint.sh
          uid: 0
          gid: 0
        - source: /usr/share/percona-server-mongodb-operator/logcollector
          target: /logcollector
          uid: 0
          gid: 0
accounts:
  run-as: nonroot
  users:
    - name: nonroot
      uid: 65532
      gid: 65532
  groups:
    - name: nonroot
      gid: 65532
      members:
        - nonroot
os-release:
  name: Docker Hardened Images (Alpine)
  id: alpine
  version-id: "3.24"
  pretty-name: Docker Hardened Images/Alpine Linux v3.24
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
paths:
  - type: directory
    path: /usr/local/bin
    uid: 0
    gid: 0
  - type: symlink
    path: /usr/local/bin/percona-server-mongodb-operator
    uid: 0
    gid: 0
    source: /usr/bin/percona-server-mongodb-operator
  - type: symlink
    path: /mongodb-healthcheck
    uid: 0
    gid: 0
    source: /usr/bin/mongodb-healthcheck
annotations:
  org.opencontainers.image.description: A minimal Percona Operator for MongoDB image
  org.opencontainers.image.licenses: Apache-2.0
entrypoint:
  - /usr/local/bin/percona-server-mongodb-operator
ports:
  - 8080/tcp
