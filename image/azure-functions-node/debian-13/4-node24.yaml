# syntax=dhi.io/build:2-debian13

name: Azure Functions 4.x for Node 24.x (node24.19)
image: dhi.io/azure-functions-node
variant: runtime
flavor: node24.19
tags:
  - 4-node24.19
  - 4.1053-node24.19
  - 4-debian-node24.19
  - 4-debian13-node24.19
  - 4.1053.100-node24.19
  - 4.1053-debian-node24.19
  - 4.1053-debian13-node24.19
  - 4.1053.100-debian-node24.19
  - 4.1053.100-debian13-node24.19
platforms:
  - linux/amd64
vars:
  BUILD_NUMBER: "100"
  COMMIT_SHA: baf6bf1e422858bfd4a46f5553b8f22feceb0937
  DOTNET_8_VERSION: 8.0.423-1
  DOTNET_10_VERSION: 10.0.302-1
  EXT_BUNDLE_COMMIT_SHA: 3c791acc9fa04ccd0979a697f8a8dd25ad3d22b6
  EXT_BUNDLE_VERSION: 4.38.1
  FUNCTIONS_WORKER: node
  NODE_DEB_VERSION: 24.19.0-0
  NODE_MAJOR_MINOR_VERSION: "24.19"
  NODE_MAJOR_VERSION: "24"
  NODE_VERSION: 24.19.0
  SEMVER_MAJOR_MINOR_VERSION: "4.1053"
  SEMVER_MAJOR_VERSION: "4"
  SEMVER_VERSION: 4.1053.100
  TEMPLATES_BUILDID: "296433"
  TEMPLATES_DOWNLOADURL: https://artprodwus21.artifacts.visualstudio.com/Ad1c51fbc-4477-4a0f-b99f-fc9013009a58/ae7e3bf3-d41a-4480-9ac0-b6cf9df9ac24/_apis/artifact/cGlwZWxpbmVhcnRpZmFjdDovL2F6ZnVuYy9wcm9qZWN0SWQvYWU3ZTNiZjMtZDQxYS00NDgwLTlhYzAtYjZjZjlkZjlhYzI0L2J1aWxkSWQvMjk2NDMzL2FydGlmYWN0TmFtZS9kcm9w0/content?format=zip
  VERSION: 4.1053.100
contents:
  repositories:
    - deb [signed-by=/usr/share/keyrings/microsoft-signing-key.gpg] https://packages.microsoft.com/debian/13/prod trixie main
    - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
  keyring:
    - https://packages.microsoft.com/keys/microsoft-2025.asc
    - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
  packages:
    - '!libelogind0'
    - '!mawk'
    - '!original-awk'
    - base-files
    - bash
    - libglib2.0-0t64
    - libicu76
    - libsm6
    - libstdc++6
    - libxext6
    - libxrender-dev
    - msodbcsql18
    - mssql-tools18
    - nodejs-24=24.19.0-0
    - unixodbc
  builds:
    - name: azure-functions-host
      contents:
        packages:
          - bash
          - ca-certificates
          - coreutils
          - findutils
          - grep
          - sed
          - libc6
          - libgcc-s1
          - libgssapi-krb5-2
          - libicu76
          - libssl3t64
          - libstdc++6
          - tzdata
          - zlib1g
          - dotnet-sdk-10=10.0.302-1
        files:
          - url: git+https://github.com/Azure/azure-functions-host.git#v4.1053.100
            checksum: baf6bf1e422858bfd4a46f5553b8f22feceb0937
            path: ${source.dir}/azure-functions-host
            spdx:
              name: azure-functions-host
              version: 4.1053.100
              packages:
                - name: azure-functions-host
                  purl: pkg:github/Azure/azure-functions-host@4.1053.100
                  license: MIT
            uid: 0
            gid: 0
      pipeline:
        - name: bump nuget dependencies
          work-dir: ${source.dir}/azure-functions-host
          runs: |
            set -eux -o pipefail

            # CVE-2026-40182, CVE-2026-40891, CVE-2026-42191: OpenTelemetry.Exporter.OpenTelemetryProtocol 1.14.0 -> 1.15.3
            find . -name "*.csproj" -o -name "*.props" | xargs sed -i 's/OpenTelemetry\.Exporter\.OpenTelemetryProtocol" Version="1\.14\.0"/OpenTelemetry.Exporter.OpenTelemetryProtocol" Version="1.15.3"/g'
            # CVE-2026-40894: OpenTelemetry.Api 1.14.0 -> 1.15.3
            find . -name "*.csproj" -o -name "*.props" | xargs sed -i 's/OpenTelemetry\.Api" Version="1\.14\.0"/OpenTelemetry.Api" Version="1.15.3"/g'
            # GHSA-g4vj-cjjj-v7hg: NuGet.Packaging 5.11.6 -> 5.11.7
            find . -name "*.csproj" -o -name "*.props" | xargs sed -i 's/NuGet\.Packaging" Version="5\.11\.6"/NuGet.Packaging" Version="5.11.7"/g'
            # GHSA-g4vj-cjjj-v7hg: NuGet.Protocol 5.11.6 -> 5.11.7
            find . -name "*.csproj" -o -name "*.props" | xargs sed -i 's/NuGet\.Protocol" Version="5\.11\.6"/NuGet.Protocol" Version="5.11.7"/g'
            # GHSA-g4vj-cjjj-v7hg: Ensure NuGet packages are in Directory.Packages.props for CPM
            if [ -f "Directory.Packages.props" ]; then
              if ! grep -q 'Include="NuGet.Packaging"' Directory.Packages.props; then
                sed -i 's|</ItemGroup>|  <PackageVersion Include="NuGet.Packaging" Version="5.11.7" />\n  </ItemGroup>|' Directory.Packages.props
              fi
              if ! grep -q 'Include="NuGet.Protocol"' Directory.Packages.props; then
                sed -i 's|</ItemGroup>|  <PackageVersion Include="NuGet.Protocol" Version="5.11.7" />\n  </ItemGroup>|' Directory.Packages.props
              fi
            fi
        - name: build
          work-dir: ${source.dir}/azure-functions-host
          privileged: true
          runs: |
            set -eux -o pipefail

            export DOTNET_ROOT=/usr/lib/dotnet
            export DOTNET_CLI_HOME=/tmp/dotnet
            export DOTNET_CLI_TELEMETRY_OPTOUT=1
            mkdir -p "${DOTNET_CLI_HOME}"

            dotnet publish -v q \
              /p:BuildNumber='100' /p:CommitHash='baf6bf1e422858bfd4a46f5553b8f22feceb0937' \
              src/WebJobs.Script.WebHost/WebJobs.Script.WebHost.csproj \
              -c Release \
              --output '${target.dir}/azure-functions-host' \
              --runtime linux-x64 --self-contained
        - name: install
          runs: |
            set -eux -o pipefail

            find '${target.dir}/azure-functions-host/workers' -type d -mindepth 1 -maxdepth 1 -not -name 'node' -exec rm -rf '{}' \;
      outputs:
        - source: ${target.dir}/azure-functions-host
          target: /azure-functions-host
          uid: 0
          gid: 0
        - source: /opt/docker/sbom/azure-functions-host
          target: /opt/docker/sbom/azure-functions-host
          uid: 0
          gid: 0
    - name: azure-functions-extension-bundles
      contents:
        packages:
          - bash
          - ca-certificates
          - coreutils
          - findutils
          - grep
          - sed
          - unzip
          - libc6
          - libgcc-s1
          - libgssapi-krb5-2
          - libicu76
          - libssl3t64
          - libstdc++6
          - tzdata
          - zlib1g
          - dotnet-sdk-8=8.0.423-1
        files:
          - url: git+https://github.com/Azure/azure-functions-extension-bundles.git#4.38.1
            checksum: 3c791acc9fa04ccd0979a697f8a8dd25ad3d22b6
            path: ${source.dir}/azure-functions-extension-bundles
            spdx:
              name: azure-functions-extension-bundles
              version: 4.38.1
              packages:
                - name: azure-functions-extension-bundles
                  purl: pkg:github/Azure/azure-functions-extension-bundles@4.38.1
                  license: MIT
            uid: 0
            gid: 0
          - url: https://artprodwus21.artifacts.visualstudio.com/Ad1c51fbc-4477-4a0f-b99f-fc9013009a58/ae7e3bf3-d41a-4480-9ac0-b6cf9df9ac24/_apis/artifact/cGlwZWxpbmVhcnRpZmFjdDovL2F6ZnVuYy9wcm9qZWN0SWQvYWU3ZTNiZjMtZDQxYS00NDgwLTlhYzAtYjZjZjlkZjlhYzI0L2J1aWxkSWQvMjk2NDMzL2FydGlmYWN0TmFtZS9kcm9w0/content?format=zip
            path: ${source.dir}/templatesArtifacts.zip
            uid: 0
            gid: 0
      pipeline:
        - name: extract templates
          work-dir: ${source.dir}/azure-functions-extension-bundles
          runs: |
            set -eux -o pipefail

            unzip ${source.dir}/templatesArtifacts.zip
            mv drop templatesArtifacts
        - name: patch source
          uses: patch@v1
          with:
            dir: ${source.dir}/azure-functions-extension-bundles
            options: -p1
            patches:
              - ${source.dir}/patch/linux_bundles.patch
              - ${source.dir}/patch/message_pack.patch
        - name: build
          work-dir: ${source.dir}/azure-functions-extension-bundles/build
          privileged: true
          runs: |
            set -eux -o pipefail

            export DOTNET_ROOT=/usr/lib/dotnet
            export DOTNET_CLI_HOME=/tmp/dotnet
            export DOTNET_CLI_TELEMETRY_OPTOUT=1
            mkdir -p "${DOTNET_CLI_HOME}"

            sed -E -i '${source.dir}/azure-functions-extension-bundles/src/Microsoft.Azure.Functions.ExtensionBundle/NuGet.Config' \
              -e 's|azure-functions-extension-bundles|nuget.org|' \
              -e 's|https://pkgs.dev.azure.com/[^"]+|https://api.nuget.org/v3/index.json|'

            TEMPLATES_ARTIFACTS_DIRECTORY=1 dotnet run \
              skip:GenerateVulnerabilityReport,PackageNetCoreV3BundlesWindows,CreateRUPackage,CreateCDNStoragePackage,CreateCDNStoragePackageWindows,BuildBundleBinariesForWindows
        - name: install
          work-dir: ${source.dir}/azure-functions-extension-bundles/artifacts
          runs: |
            set -eux -o pipefail

            mkdir -p ${target.dir}/FuncExtensionBundles/Microsoft.Azure.Functions.ExtensionBundle/4.38.1
            unzip Microsoft.Azure.Functions.ExtensionBundle.4.38.1_linux-x64.zip \
              -d ${target.dir}/FuncExtensionBundles/Microsoft.Azure.Functions.ExtensionBundle/4.38.1
      paths:
        - type: directory
          path: ${source.dir}/patch
          uid: 0
          gid: 0
          source: ecosystem/azure-functions/patch
      outputs:
        - source: ${target.dir}/FuncExtensionBundles
          target: /FuncExtensionBundles
          uid: 0
          gid: 0
        - source: /opt/docker/sbom/azure-functions-extension-bundles
          target: /opt/docker/sbom/azure-functions-extension-bundles
          uid: 0
          gid: 0
accounts:
  run-as: nonroot
  users:
    - name: nonroot
      uid: 65532
      gid: 65532
  groups:
    - name: nonroot
      gid: 65532
      members:
        - nonroot
os-release:
  name: Docker Hardened Images (Debian)
  id: debian
  version-id: "13"
  version-codename: trixie
  pretty-name: Docker Hardened Images/Debian GNU/Linux 13 (trixie)
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
environment:
  ASPNETCORE_CONTENTROOT: /azure-functions-host
  ASPNETCORE_URLS: http://+:80
  AzureFunctionsJobHost__Logging__Console__IsEnabled: "true"
  AzureWebJobsScriptRoot: /home/site/wwwroot
  DOTNET_RUNNING_IN_CONTAINER: "true"
  DOTNET_USE_POLLING_FILE_WATCHER: "true"
  FUNCTIONS_WORKER_RUNTIME: node
  FUNCTIONS_WORKER_RUNTIME_VERSION: 24.19.0
paths:
  - type: file
    path: /usr/share/keyrings/microsoft-signing-key.gpg
    uid: 0
    gid: 0
    mode: "0644"
    source: ecosystem/azure-functions/keys/microsoft-signing-key.gpg
annotations:
  org.opencontainers.image.description: A minimal Azure Functions Node image
  org.opencontainers.image.licenses: MIT
entrypoint:
