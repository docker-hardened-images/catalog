# syntax=dhi.io/build:2-debian13

name: Azure Functions 4.x for Node 24.x (node24.22)
image: dhi.io/azure-functions-node
variant: runtime
flavor: node24.22
tags:
  - 4-node24.22
  - 4.1056-node24.22
  - 4-debian-node24.22
  - 4-debian13-node24.22
  - 4.1056.200-node24.22
  - 4.1056-debian-node24.22
  - 4.1056-debian13-node24.22
  - 4.1056.200-debian-node24.22
  - 4.1056.200-debian13-node24.22
platforms:
  - linux/amd64
vars:
  EXT_BUNDLE_VERSION: 4.42.1
  FUNCTIONS_WORKER: node
  HOST_VERSION: 4.1056.200
  NODE_DEB_VERSION: 24.22.3-0
  NODE_MAJOR_MINOR_VERSION: "24.22"
  NODE_MAJOR_VERSION: "24"
  NODE_VERSION: 24.22.3
  SEMVER_MAJOR_MINOR_VERSION: "4.1056"
  SEMVER_MAJOR_VERSION: "4"
  SEMVER_VERSION: 4.1056.200
  VERSION: 4.1056.200-22
contents:
  repositories:
    - deb [signed-by=/usr/share/keyrings/microsoft-signing-key.asc] https://packages.microsoft.com/debian/13/prod trixie main
    - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
  keyring:
    - https://packages.microsoft.com/keys/microsoft-2025.asc
    - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
  packages:
    - '!libelogind0'
    - '!mawk'
    - '!original-awk'
    - azure-functions-node=4.1056.200-22
    - base-files
    - bash
    - libc6
    - libgcc-s1
    - libglib2.0-0t64
    - libgssapi-krb5-2
    - libicu76
    - libsm6
    - libssl3t64
    - libstdc++6
    - libxext6
    - libxrender-dev
    - msodbcsql18
    - mssql-tools18
    - nodejs-24=24.22.3-0
    - unixodbc
    - zlib1g
  builds:
    - name: azure-functions-host-sbom
      contents:
        packages:
          - bash
          - coreutils
      pipeline:
        - name: spdx azure-functions-host
          uses: spdx@v1
          with:
            license: MIT
            name: azure-functions-host
            purl: pkg:github/Azure/azure-functions-host@4.1056.200
            version: 4.1056.200
      outputs:
        - source: /opt/docker/sbom/azure-functions-host
          target: /opt/docker/sbom/azure-functions-host
          uid: 0
          gid: 0
    - name: azure-functions-extension-bundles-sbom
      contents:
        packages:
          - bash
          - coreutils
      pipeline:
        - name: spdx azure-functions-extension-bundles
          uses: spdx@v1
          with:
            license: MIT
            name: azure-functions-extension-bundles
            purl: pkg:github/Azure/azure-functions-extension-bundles@4.42.1
            version: 4.42.1
      outputs:
        - source: /opt/docker/sbom/azure-functions-extension-bundles
          target: /opt/docker/sbom/azure-functions-extension-bundles
          uid: 0
          gid: 0
accounts:
  run-as: nonroot
  users:
    - name: nonroot
      uid: 65532
      gid: 65532
  groups:
    - name: nonroot
      gid: 65532
      members:
        - nonroot
os-release:
  name: Docker Hardened Images (Debian)
  id: debian
  version-id: "13"
  version-codename: trixie
  pretty-name: Docker Hardened Images/Debian GNU/Linux 13 (trixie)
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
environment:
  ASPNETCORE_CONTENTROOT: /azure-functions-host
  ASPNETCORE_URLS: http://+:80
  AzureFunctionsJobHost__Logging__Console__IsEnabled: "true"
  AzureWebJobsScriptRoot: /home/site/wwwroot
  DOTNET_RUNNING_IN_CONTAINER: "true"
  DOTNET_USE_POLLING_FILE_WATCHER: "true"
  FUNCTIONS_WORKER_RUNTIME: node
  FUNCTIONS_WORKER_RUNTIME_VERSION: 24.22.3
paths:
  - type: file
    path: /usr/share/keyrings/microsoft-signing-key.gpg
    uid: 0
    gid: 0
    mode: "0644"
    source: ecosystem/azure-functions/keys/microsoft-signing-key.gpg
  - type: symlink
    path: /azure-functions-host
    uid: 0
    gid: 0
    source: /usr/share/azure-functions-host
  - type: symlink
    path: /FuncExtensionBundles
    uid: 0
    gid: 0
    source: /usr/share/FuncExtensionBundles
annotations:
  org.opencontainers.image.description: A minimal Azure Functions Node image
  org.opencontainers.image.licenses: MIT
entrypoint:
  - /azure-functions-host/Microsoft.Azure.WebJobs.Script.WebHost
