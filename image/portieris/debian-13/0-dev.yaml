# syntax=dhi.io/build:2-debian13

name: Portieris 0.x (dev)
image: dhi.io/portieris
variant: dev
tags:
  - 0-dev
  - 0.16-dev
  - 0.16.2-dev
  - 0-debian-dev
  - 0-debian13-dev
  - 0.16-debian-dev
  - 0.16-debian13-dev
  - 0.16.2-debian-dev
  - 0.16.2-debian13-dev
platforms:
  - linux/amd64
  - linux/arm64
dates:
  release: "2018-11-27"
vars:
  FLAVORED_SUFFIX: -dev
  SEMVER_MAJOR_MINOR_VERSION: "0.16"
  SEMVER_MAJOR_VERSION: "0"
  SEMVER_VERSION: 0.16.2
  SUFFIX: -dev
  VERSION: 0.16.2-0
contents:
  repositories:
    - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
  keyring:
    - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
  packages:
    - '!gawk'
    - '!libelogind0'
    - '!original-awk'
    - apt
    - base-files
    - bash
    - ca-certificates
    - ca-certificates-bundle
    - coreutils
    - diffutils
    - dpkg
    - findutils
    - grep
    - libc-bin
    - mawk
    - perl-base
    - portieris-0-dev=0.16.2-0
    - sed
    - tzdata
    - util-linux
accounts:
  root: true
  run-as: root
  users:
    - name: nonroot
      uid: 65532
      gid: 65532
    - name: _apt
      uid: 42
      gid: 65532
  groups:
    - name: nonroot
      gid: 65532
      members:
        - nonroot
os-release:
  name: Docker Hardened Images (Debian)
  id: debian
  version-id: "13"
  version-codename: trixie
  pretty-name: Docker Hardened Images/Debian GNU/Linux 13 (trixie)
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
work-dir: /run
environment:
  DEBIAN_FRONTEND: noninteractive
paths:
  - type: directory
    path: /usr/local/bin
    uid: 0
    gid: 0
  - type: symlink
    path: /usr/local/bin/portieris
    uid: 0
    gid: 0
    source: /usr/bin/portieris
  - type: symlink
    path: /portieris
    uid: 0
    gid: 0
    source: /usr/bin/portieris
  - type: directory
    path: /run
    uid: 65532
    gid: 65532
    mode: "0770"
annotations:
  org.opencontainers.image.description: A minimal Portieris image
  org.opencontainers.image.licenses: Apache-2.0
entrypoint:
  - /usr/local/bin/portieris
cmd:
  - --alsologtostderr
  - -v=4
ports:
  - 8000/tcp
  - 8080/tcp
