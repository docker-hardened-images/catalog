# syntax=dhi.io/build:2-alpine3.24

name: Portieris 0.x (dev)
image: dhi.io/portieris
variant: dev
tags:
  - 0-alpine-dev
  - 0.16-alpine-dev
  - 0-alpine3.24-dev
  - 0.16.2-alpine-dev
  - 0.16-alpine3.24-dev
  - 0.16.2-alpine3.24-dev
platforms:
  - linux/amd64
  - linux/arm64
dates:
  release: "2018-11-27"
vars:
  FLAVORED_SUFFIX: -dev
  SEMVER_MAJOR_MINOR_VERSION: "0.16"
  SEMVER_MAJOR_VERSION: "0"
