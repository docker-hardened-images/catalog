# syntax=dhi.io/build:2-debian13

name: KubeVirt Velero Plugin 0.8.x
image: dhi.io/kubevirt-velero-plugin
variant: runtime
tags:
  - "0.8"
  - 0.8.1
  - 0.8-debian
  - 0.8-debian13
  - 0.8.1-debian
  - 0.8.1-debian13
platforms:
  - linux/amd64
  - linux/arm64
dates:
  release: "2025-04-29"
vars:
  CP_PLUGIN_VERSION: 1.14.4-9
  PLUGIN_SUFFIX: ""
  SEMVER_MAJOR_MINOR_VERSION: "0.8"
  SEMVER_MAJOR_VERSION: "0"
  SEMVER_VERSION: 0.8.1
  VERSION: 0.8.1-0
contents:
  repositories:
    - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
  keyring:
    - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
  packages:
    - '!libelogind0'
    - '!mawk'
    - '!original-awk'
    - base-files
    - ca-certificates-bundle
    - cp-plugin=1.14.4-9
    - kubevirt-velero-plugin-0.8=0.8.1-0
    - tzdata
accounts:
  run-as: nonroot
  users:
    - name: nonroot
      uid: 65532
      gid: 65532
  groups:
    - name: nonroot
      gid: 65532
      members:
        - nonroot
os-release:
  name: Docker Hardened Images (Debian)
  id: debian
  version-id: "13"
  version-codename: trixie
  pretty-name: Docker Hardened Images/Debian GNU/Linux 13 (trixie)
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
paths:
  - type: symlink
    path: /plugins
    uid: 0
    gid: 0
    source: /usr/lib/kubevirt-velero-plugin
annotations:
  org.opencontainers.image.description: A minimal KubeVirt Velero Plugin image
  org.opencontainers.image.licenses: Apache-2.0
entrypoint:
  - cp-plugin
  - /plugins/kubevirt-velero-plugin
  - /target/kubevirt-velero-plugin
