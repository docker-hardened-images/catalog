# syntax=dhi.io/build:2-debian13

name: Tigera Operator 1.43.x
image: dhi.io/tigera-operator
variant: runtime
tags:
  - "1.43"
  - 1.43.1
  - 1.43-debian
  - 1.43-debian13
  - 1.43.1-debian
  - 1.43.1-debian13
platforms:
  - linux/amd64
  - linux/arm64
dates:
  release: "2026-07-30"
vars:
  FLAVORED_SUFFIX: ""
  SEMVER_MAJOR_MINOR_VERSION: "1.43"
  SEMVER_MAJOR_VERSION: "1"
  SEMVER_VERSION: 1.43.1
  SUFFIX: ""
  VERSION: 1.43.1-4
contents:
  repositories:
    - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
  keyring:
    - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
  packages:
    - base-files
    - ca-certificates-bundle
    - tigera-operator-1.43=1.43.1-4
    - tzdata
accounts:
  run-as: nonroot
  users:
    - name: nonroot
      uid: 65532
      gid: 65532
  groups:
    - name: nonroot
      gid: 65532
      members:
        - nonroot
os-release:
  name: Docker Hardened Images (Debian)
  id: debian
  version-id: "13"
  version-codename: trixie
  pretty-name: Docker Hardened Images/Debian GNU/Linux 13 (trixie)
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
paths:
  - type: directory
    path: /usr/local/bin
    uid: 0
    gid: 0
  - type: symlink
    path: /usr/local/bin/operator
    uid: 0
    gid: 0
    source: /usr/bin/operator
annotations:
  org.opencontainers.image.description: A minimal tigera-operator image for managing Calico installations
  org.opencontainers.image.licenses: Apache-2.0
entrypoint:
  - /usr/local/bin/operator
