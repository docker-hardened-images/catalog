# syntax=dhi.io/build:2-debian13

name: Kubeflow Access Management 2.x
image: dhi.io/kubeflow-access-management
variant: runtime
tags:
  - "2"
  - "2.0"
  - 2.0.1
  - 2-debian
  - 2-debian13
  - 2.0-debian
  - 2.0-debian13
  - 2.0.1-debian
  - 2.0.1-debian13
platforms:
  - linux/amd64
  - linux/arm64
dates:
  release: "2026-06-02"
vars:
  DEBIAN_EPOCH_MAJOR_MINOR_VERSION: "2.0"
  DEBIAN_EPOCH_MAJOR_VERSION: "2"
  DEBIAN_EPOCH_VERSION: 2.0.1
  FLAVORED_SUFFIX: ""
  SUFFIX: ""
  VERSION: 2.0.1-1
contents:
  repositories:
    - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
  keyring:
    - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
  packages:
    - '!libelogind0'
    - '!mawk'
    - '!original-awk'
    - base-files
    - ca-certificates-bundle
    - kubeflow-access-management-2=2.0.1-1
    - tzdata
accounts:
  run-as: "65532"
  users:
    - name: nonroot
      uid: 65532
      gid: 65532
  groups:
    - name: nonroot
      gid: 65532
      members:
        - nonroot
os-release:
  name: Docker Hardened Images (Debian)
  id: debian
  version-id: "13"
  version-codename: trixie
  pretty-name: Docker Hardened Images/Debian GNU/Linux 13 (trixie)
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
work-dir: /
environment:
  SSL_CERT_FILE: /etc/ssl/certs/ca-certificates.crt
paths:
  - type: symlink
    path: /access-management
    uid: 0
    gid: 0
    source: /usr/bin/access-management
annotations:
  org.opencontainers.image.description: A minimal Kubeflow Access Management image
  org.opencontainers.image.licenses: Apache-2.0
cmd:
  - /access-management
ports:
  - 8081/tcp
