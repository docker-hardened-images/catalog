# syntax=dhi.io/build:2-alpine3.24

name: Kubeflow Access Management 2.x
image: dhi.io/kubeflow-access-management
variant: runtime
tags:
  - 2-alpine
  - 2.0-alpine
  - 2-alpine3.24
  - 2.0.1-alpine
  - 2.0-alpine3.24
  - 2.0.1-alpine3.24
platforms:
  - linux/amd64
  - linux/arm64
dates:
