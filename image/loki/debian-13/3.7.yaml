# syntax=dhi.io/build:2-debian13

name: Loki 3.7.x
image: dhi.io/loki
variant: runtime
tags:
  - "3"
  - "3.7"
  - 3.7.4
  - 3-debian
  - 3-debian13
  - 3.7-debian
  - 3.7-debian13
  - 3.7.4-debian
  - 3.7.4-debian13
platforms:
  - linux/amd64
  - linux/arm64
dates:
  release: "2026-03-26"
vars:
  COMMIT_SHA: b318f2829f0ae2094ab3a1e90780450e9e4b03be
  SEMVER_MAJOR_MINOR_VERSION: "3.7"
  SEMVER_MAJOR_VERSION: "3"
  SEMVER_VERSION: 3.7.4
  VERSION: 3.7.4
contents:
  repositories:
    - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
  keyring:
    - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
  packages:
    - base-files
    - ca-certificates-bundle
    - tzdata
  builds:
    - name: loki
      caches:
        - path: /go/pkg/mod
      contents:
        packages:
          - make
          - bash
          - sed
          - hostname
          - ca-certificates-bundle
          - coreutils
          - golang-1.26
          - findutils
          - mawk
        files:
          - url: git+https://github.com/grafana/loki.git#v3.7.4
            checksum: b318f2829f0ae2094ab3a1e90780450e9e4b03be
            path: ${source.dir}/loki
            spdx:
              name: loki
              version: 3.7.4
              packages:
                - name: loki
                  purl: pkg:dhi/loki@3.7.4
                  license: AGPL-3.0
            uid: 0
            gid: 0
      pipeline:
        - name: update go dependencies and vendor (3.7 only)
          uses: go/bump@v2
          work-dir: ${source.dir}/loki
          with:
            deps:
              - golang.org/x/crypto@v0.52.0
              - github.com/aws/aws-sdk-go-v2/service/s3@v1.97.3
              - github.com/buger/jsonparser@v1.1.2
              - github.com/go-jose/go-jose/v4@v4.1.4
              - github.com/klauspost/compress@v1.18.7
              - google.golang.org/grpc@v1.82.1
            download: true
        - name: bump thrift and testify (3.7 only)
          work-dir: ${source.dir}/loki
          privileged: true
          runs: |
            set -eux -o pipefail

            go get github.com/apache/thrift@v0.23.0
            go get github.com/go-openapi/testify/v2@v2.5.1
            go get github.com/go-openapi/testify/enable/yaml/v2@v2.5.1
            go mod tidy
            go mod vendor
        - name: build
          uses: go/build@v1
          work-dir: ${source.dir}/loki
          environment:
            GOFLAGS: -buildvcs=false
          with:
            ldflags:
              - -extldflags "-static"
              - -X github.com/grafana/loki/v3/pkg/util/build.Branch=3.7.4
              - -X github.com/grafana/loki/v3/pkg/util/build.Version=3.7.4
              - -X github.com/grafana/loki/v3/pkg/util/build.Revision=b318f2829f0ae2094ab3a1e90780450e9e4b03be
              - -X github.com/grafana/loki/v3/pkg/util/build.BuildUser=dhi@build
              - -X github.com/grafana/loki/v3/pkg/util/build.BuildDate=$(date -ud @${SOURCE_DATE_EPOCH} +'%Y-%m-%dT%H:%M:%SZ')
            output: ${target.dir}/usr/local/bin/loki
            packages: ./cmd/loki
            tags: netgo
        - name: install
          runs: |
            set -eux -o pipefail

            mkdir -p "${target.dir}/etc/loki"
            cp -a "${source.dir}/loki/cmd/loki/loki-docker-config.yaml" "${target.dir}/etc/loki/local-config.yaml"
      outputs:
        - source: ${target.dir}/usr/local/bin/loki
          target: /usr/local/bin/loki
          uid: 0
          gid: 0
        - source: ${target.dir}/etc/loki/local-config.yaml
          target: /etc/loki/local-config.yaml
          uid: 0
          gid: 0
        - source: /opt/docker/sbom/loki
          target: /opt/docker/sbom/loki
          uid: 0
          gid: 0
accounts:
  run-as: nonroot
  users:
    - name: nonroot
      uid: 65532
      gid: 65532
  groups:
    - name: nonroot
      gid: 65532
      members:
        - nonroot
os-release:
  name: Docker Hardened Images (Debian)
  id: debian
  version-id: "13"
  version-codename: trixie
  pretty-name: Docker Hardened Images/Debian GNU/Linux 13 (trixie)
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
paths:
  - type: directory
    path: /loki
    uid: 65532
    gid: 65532
    mode: "0755"
  - type: directory
    path: /loki/rules
    uid: 65532
    gid: 65532
    mode: "0755"
  - type: directory
    path: /loki/rules-temp
    uid: 65532
    gid: 65532
    mode: "0755"
annotations:
  org.opencontainers.image.description: A minimal Loki image
  org.opencontainers.image.licenses: AGPL-3.0
entrypoint:
  - /usr/local/bin/loki
cmd:
  - -config.file=/etc/loki/local-config.yaml
ports:
  - 3100/tcp
