# syntax=dhi.io/build:2-debian13

name: Loki 2.9.x
image: dhi.io/loki
variant: runtime
tags:
  - "2"
  - "2.9"
  - 2.9.17
  - 2-debian
  - 2-debian13
  - 2.9-debian
  - 2.9-debian13
  - 2.9.17-debian
  - 2.9.17-debian13
platforms:
  - linux/amd64
  - linux/arm64
dates:
  release: "2023-09-06"
vars:
  FLAVORED_SUFFIX: ""
  PACKAGE_NAME: loki-2.9
  SEMVER_MAJOR_MINOR_VERSION: "2.9"
  SEMVER_MAJOR_VERSION: "2"
  SEMVER_VERSION: 2.9.17
  SUFFIX: ""
  VERSION: 2.9.17-0
contents:
  repositories:
    - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
  keyring:
    - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
  packages:
    - base-files
    - ca-certificates-bundle
    - loki-2.9=2.9.17-0
    - tzdata
  builds:
    - name: loki-sbom
      contents:
        packages:
          - bash
          - coreutils
      pipeline:
        - name: spdx loki
          uses: spdx@v1
          with:
            license: AGPL-3.0
            name: loki
            purl: pkg:dhi/loki@2.9.17
            version: 2.9.17
      outputs:
        - source: /opt/docker/sbom/loki
          target: /opt/docker/sbom/loki
          uid: 0
          gid: 0
accounts:
  run-as: nonroot
  users:
    - name: nonroot
      uid: 65532
      gid: 65532
  groups:
    - name: nonroot
      gid: 65532
      members:
        - nonroot
os-release:
  name: Docker Hardened Images (Debian)
  id: debian
  version-id: "13"
  version-codename: trixie
  pretty-name: Docker Hardened Images/Debian GNU/Linux 13 (trixie)
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
paths:
  - type: directory
    path: /usr/local/bin
    uid: 0
    gid: 0
  - type: symlink
    path: /usr/local/bin/loki
    uid: 0
    gid: 0
    source: /usr/bin/loki
  - type: directory
    path: /loki
    uid: 65532
    gid: 65532
    mode: "0755"
  - type: directory
    path: /loki/rules
    uid: 65532
    gid: 65532
    mode: "0755"
  - type: directory
    path: /loki/rules-temp
    uid: 65532
    gid: 65532
    mode: "0755"
annotations:
  org.opencontainers.image.description: A minimal Loki image
  org.opencontainers.image.licenses: AGPL-3.0
entrypoint:
  - /usr/local/bin/loki
cmd:
  - -config.file=/etc/loki/local-config.yaml
ports:
  - 3100/tcp
