          target: /home/agent/.local
          uid: 1000
          gid: 1000
        - source: /opt/docker/sbom/devin
          target: /opt/docker/sbom/devin
          uid: 0
          gid: 0
    - name: filesystem
      contents:
        packages:
          - bash
          - gzip
          - findutils
          - coreutils
      pipeline:
        - name: verify
          runs: |
            set -eux -o pipefail
      paths:
