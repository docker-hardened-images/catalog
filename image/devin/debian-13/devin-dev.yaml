    - name: install-devin
      environment:
        HOME: /home/agent
        PATH: /home/agent/.local/bin:${PATH}
      contents:
        packages:
          - bash
          - ca-certificates
          - coreutils
          - curl
          - grep
          - tar
          - gzip
      pipeline:
        - name: install
          privileged: true
          runs: |
            set -eux -o pipefail

            curl -fsSL "https://static.devin.ai/cli/3000.14.30821/devin-3000.14.30821-${ARCH}-unknown-linux.tar.gz" -o /tmp/devin.tar.gz
            echo "${SHA256}  /tmp/devin.tar.gz" | sha256sum -c -
            version_dir="/home/agent/.local/share/devin/cli/_versions/3000.14.30821"
            mkdir -p "$version_dir" /home/agent/.local/bin
            tar -xzf /tmp/devin.tar.gz -C "$version_dir"
            "$version_dir/bin/devin" --version | grep -Fw "3000.14.30821"
            printf 'curl-bash\n' > "$version_dir/distribution"
            ln -s "3000.14.30821" /home/agent/.local/share/devin/cli/_versions/current
            ln -s /home/agent/.local/share/devin/cli/_versions/current/bin/devin /home/agent/.local/bin/devin-cli
        - name: devin sbom
          uses: sbom@v1
          with:
            prefix: devin
            source: /home/agent/.local
