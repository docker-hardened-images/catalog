metadata:
  display-name: GitLab Shell
  short-description: GitLab Shell handles Git SSH sessions for GitLab — SSH authentication and authorization for Git operations, including the gitlab-sshd server used by cloud-native deployments.
  featured: false
  home-url: https://docs.gitlab.com/development/gitlab_shell/
  categories:
    - integration-and-delivery
  included-tools:
    - name: gitlab-sshd
      description: Standalone Go SSH server that handles Git-over-SSH sessions for GitLab (the cloud-native SSH daemon).
    - name: gitlab-shell
      description: Git-over-SSH command handler invoked per SSH session to authorize and route Git operations.
    - name: gitlab-shell-authorized-keys-check
      description: Looks up a user's SSH key in GitLab to authorize access (OpenSSH AuthorizedKeysCommand helper).
    - name: gitlab-shell-authorized-principals-check
      description: Resolves SSH certificate principals to a GitLab user for authorization.
    - name: gitlab-shell-check
      description: Diagnostic that verifies connectivity to the GitLab internal API.
