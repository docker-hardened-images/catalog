# syntax=dhi.io/build:2-debian13

name: GitLab Shell 14.57.x (dev)
image: dhi.io/gitlab-shell
variant: dev
tags:
  - 14-dev
  - 14.57-dev
  - 14.57.0-dev
  - 14-debian-dev
  - 14-debian13-dev
  - 14.57-debian-dev
  - 14.57-debian13-dev
  - 14.57.0-debian-dev
  - 14.57.0-debian13-dev
platforms:
  - linux/amd64
  - linux/arm64
dates:
  release: "2022-05-04"
vars:
  GS_FIPS: ""
  SEMVER_MAJOR_MINOR_VERSION: "14.57"
  SEMVER_MAJOR_VERSION: "14"
  SEMVER_VERSION: 14.57.0
  VERSION: 14.57.0-1
contents:
  repositories:
    - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
  keyring:
    - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
  packages:
    - '!gawk'
    - '!libelogind0'
    - '!mawk'
    - '!original-awk'
    - apt
    - base-files
    - bash
    - ca-certificates
    - ca-certificates-bundle
    - coreutils
    - diffutils
    - dpkg
    - findutils
    - gitlab-shell
    - grep
    - libc-bin
    - mawk
    - openssh-client
    - perl-base
    - sed
    - tzdata
    - util-linux
accounts:
  root: true
  run-as: root
  users:
    - name: git
      uid: 1000
      gid: 1000
    - name: _apt
      uid: 42
      gid: 65532
  groups:
    - name: git
      gid: 1000
      members:
        - git
os-release:
  name: Docker Hardened Images (Debian)
  id: debian
  version-id: "13"
  version-codename: trixie
  pretty-name: Docker Hardened Images/Debian GNU/Linux 13 (trixie)
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
environment:
  DEBIAN_FRONTEND: noninteractive
paths:
  - type: directory
    path: /srv/gitlab-shell
    uid: 1000
    gid: 1000
    mode: "0755"
  - type: directory
    path: /srv/gitlab-shell/hostkeys
    uid: 1000
    gid: 1000
    mode: "0700"
  - type: directory
    path: /srv/gitlab-shell/bin
    uid: 1000
    gid: 1000
    mode: "0755"
  - type: file
    path: /scripts/start-gitlab-sshd
    uid: 0
    gid: 0
    mode: "0755"
    source: image/gitlab-shell/scripts/start-gitlab-sshd
  - type: file
    path: /scripts/healthcheck
    uid: 0
    gid: 0
    mode: "0755"
    source: image/gitlab-shell/scripts/healthcheck
  - type: file
    path: /srv/gitlab-shell/config.yml
    uid: 1000
    gid: 1000
    mode: "0644"
    source: image/gitlab-shell/config/config.yml
  - type: symlink
    path: /srv/gitlab-shell/bin/gitlab-shell
    uid: 0
    gid: 0
    source: /usr/bin/gitlab-shell
  - type: symlink
    path: /srv/gitlab-shell/bin/gitlab-sshd
    uid: 0
    gid: 0
    source: /usr/bin/gitlab-sshd
  - type: symlink
    path: /srv/gitlab-shell/bin/gitlab-shell-authorized-keys-check
    uid: 0
    gid: 0
    source: /usr/bin/gitlab-shell-authorized-keys-check
  - type: symlink
    path: /srv/gitlab-shell/bin/gitlab-shell-authorized-principals-check
    uid: 0
    gid: 0
    source: /usr/bin/gitlab-shell-authorized-principals-check
  - type: symlink
    path: /srv/gitlab-shell/bin/gitlab-shell-check
    uid: 0
    gid: 0
    source: /usr/bin/gitlab-shell-check
annotations:
  org.opencontainers.image.description: A minimal GitLab Shell image
  org.opencontainers.image.licenses: MIT
entrypoint:
  - /scripts/start-gitlab-sshd
ports:
  - 2222/tcp
  - 9122/tcp
