# syntax=dhi.io/build:2-debian13

name: GitLab Shell 14.56.x
image: dhi.io/gitlab-shell
variant: runtime
tags:
  - "14"
  - "14.56"
  - 14.56.1
  - 14-debian
  - 14-debian13
  - 14.56-debian
  - 14.56-debian13
  - 14.56.1-debian
  - 14.56.1-debian13
platforms:
  - linux/amd64
  - linux/arm64
dates:
  release: "2022-05-04"
vars:
  GS_FIPS: ""
  SEMVER_MAJOR_MINOR_VERSION: "14.56"
  SEMVER_MAJOR_VERSION: "14"
  SEMVER_VERSION: 14.56.1
  VERSION: 14.56.1-3
contents:
  repositories:
    - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
  keyring:
    - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
  packages:
    - '!libelogind0'
    - '!mawk'
    - '!original-awk'
    - base-files
    - bash
    - ca-certificates-bundle
    - coreutils
    - gitlab-shell
    - openssh-client
    - tzdata
accounts:
  run-as: git
  users:
    - name: git
      uid: 1000
      gid: 1000
  groups:
    - name: git
      gid: 1000
      members:
        - git
os-release:
  name: Docker Hardened Images (Debian)
  id: debian
  version-id: "13"
  version-codename: trixie
  pretty-name: Docker Hardened Images/Debian GNU/Linux 13 (trixie)
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
paths:
  - type: directory
    path: /srv/gitlab-shell
    uid: 1000
    gid: 1000
    mode: "0755"
  - type: directory
    path: /srv/gitlab-shell/hostkeys
    uid: 1000
    gid: 1000
    mode: "0700"
  - type: directory
    path: /srv/gitlab-shell/bin
    uid: 1000
    gid: 1000
    mode: "0755"
  - type: file
    path: /scripts/start-gitlab-sshd
    uid: 0
    gid: 0
    mode: "0755"
    source: image/gitlab-shell/scripts/start-gitlab-sshd
  - type: file
    path: /scripts/healthcheck
    uid: 0
    gid: 0
    mode: "0755"
    source: image/gitlab-shell/scripts/healthcheck
  - type: file
    path: /srv/gitlab-shell/config.yml
    uid: 1000
    gid: 1000
    mode: "0644"
    source: image/gitlab-shell/config/config.yml
  - type: symlink
    path: /srv/gitlab-shell/bin/gitlab-shell
    uid: 0
    gid: 0
    source: /usr/bin/gitlab-shell
  - type: symlink
    path: /srv/gitlab-shell/bin/gitlab-sshd
    uid: 0
    gid: 0
    source: /usr/bin/gitlab-sshd
  - type: symlink
    path: /srv/gitlab-shell/bin/gitlab-shell-authorized-keys-check
    uid: 0
    gid: 0
    source: /usr/bin/gitlab-shell-authorized-keys-check
  - type: symlink
    path: /srv/gitlab-shell/bin/gitlab-shell-authorized-principals-check
    uid: 0
    gid: 0
    source: /usr/bin/gitlab-shell-authorized-principals-check
  - type: symlink
    path: /srv/gitlab-shell/bin/gitlab-shell-check
    uid: 0
    gid: 0
    source: /usr/bin/gitlab-shell-check
annotations:
  org.opencontainers.image.description: A minimal GitLab Shell image
  org.opencontainers.image.licenses: MIT
entrypoint:
  - /scripts/start-gitlab-sshd
ports:
  - 2222/tcp
  - 9122/tcp
