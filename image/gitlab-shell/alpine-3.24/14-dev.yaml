# syntax=dhi.io/build:2-alpine3.24

name: GitLab Shell 14.56.x (dev)
image: dhi.io/gitlab-shell
variant: dev
tags:
  - 14-alpine-dev
  - 14.56-alpine-dev
  - 14-alpine3.24-dev
  - 14.56.1-alpine-dev
  - 14.56-alpine3.24-dev
  - 14.56.1-alpine3.24-dev
platforms:
  - linux/amd64
  - linux/arm64
dates:
  release: "2022-05-04"
vars:
  SEMVER_MAJOR_MINOR_VERSION: "14.56"
  SEMVER_MAJOR_VERSION: "14"
  SEMVER_VERSION: 14.56.1
  VERSION: 14.56.1-r4
contents:
  repositories:
    - https://dhi.io/apk/alpine/v3.24/main
    - https://dl-cdn.alpinelinux.org/alpine/v3.24/main
    - https://dl-cdn.alpinelinux.org/alpine/v3.24/community
  keyring:
    - https://dhi.io/keyring/dhi-apk@docker-0F81AD7700D99184.rsa.pub
  packages:
    - alpine-baselayout-data
    - apk-tools
    - bash
    - busybox
    - ca-certificates
    - ca-certificates-bundle
    - gitlab-shell
    - openssh-keygen
    - tzdata
accounts:
  root: true
  run-as: root
  users:
    - name: git
      uid: 1000
      gid: 1000
  groups:
    - name: git
      gid: 1000
      members:
        - git
os-release:
  name: Docker Hardened Images (Alpine)
  id: alpine
  version-id: "3.24"
  pretty-name: Docker Hardened Images/Alpine Linux v3.24
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
paths:
  - type: directory
    path: /srv/gitlab-shell
    uid: 1000
    gid: 1000
    mode: "0755"
  - type: directory
    path: /srv/gitlab-shell/hostkeys
    uid: 1000
    gid: 1000
    mode: "0700"
  - type: directory
    path: /srv/gitlab-shell/bin
    uid: 1000
    gid: 1000
    mode: "0755"
  - type: file
    path: /scripts/start-gitlab-sshd
    uid: 0
    gid: 0
    mode: "0755"
    source: image/gitlab-shell/scripts/start-gitlab-sshd
  - type: file
    path: /scripts/healthcheck
    uid: 0
    gid: 0
    mode: "0755"
    source: image/gitlab-shell/scripts/healthcheck
  - type: file
    path: /srv/gitlab-shell/config.yml
    uid: 1000
    gid: 1000
    mode: "0644"
    source: image/gitlab-shell/config/config.yml
  - type: symlink
    path: /srv/gitlab-shell/bin/gitlab-shell
    uid: 0
    gid: 0
    source: /usr/bin/gitlab-shell
  - type: symlink
    path: /srv/gitlab-shell/bin/gitlab-sshd
    uid: 0
    gid: 0
    source: /usr/bin/gitlab-sshd
  - type: symlink
    path: /srv/gitlab-shell/bin/gitlab-shell-authorized-keys-check
    uid: 0
    gid: 0
    source: /usr/bin/gitlab-shell-authorized-keys-check
  - type: symlink
    path: /srv/gitlab-shell/bin/gitlab-shell-authorized-principals-check
    uid: 0
    gid: 0
    source: /usr/bin/gitlab-shell-authorized-principals-check
  - type: symlink
    path: /srv/gitlab-shell/bin/gitlab-shell-check
    uid: 0
    gid: 0
    source: /usr/bin/gitlab-shell-check
annotations:
  org.opencontainers.image.description: A minimal GitLab Shell image
  org.opencontainers.image.licenses: MIT
entrypoint:
  - /scripts/start-gitlab-sshd
ports:
  - 2222/tcp
  - 9122/tcp
