# Default configuration for the hardened gitlab-sshd image.
#
# Override for your GitLab instance by mounting your own config.yml at
# /srv/gitlab-shell/config.yml (at minimum set gitlab_url and a real
# secret/secret_file). Full reference:
# https://gitlab.com/gitlab-org/gitlab-shell/-/blob/main/config.yml.example
gitlab_url: "http://localhost:8080"
secret_file: "/srv/gitlab-shell/.gitlab_shell_secret"
# Log to the container's stdout so `docker logs` / `kubectl logs` work out of the
# box (unset, gitlab-sshd would write to a file under /srv/gitlab-shell).
log_file: "/dev/stdout"
log_format: json
sshd:
  listen: "[::]:2222"
  web_listen: "0.0.0.0:9122"
  host_key_files:
    - /srv/gitlab-shell/hostkeys/ssh_host_ed25519_key
    - /srv/gitlab-shell/hostkeys/ssh_host_rsa_key
    - /srv/gitlab-shell/hostkeys/ssh_host_ecdsa_key
