# syntax=dhi.io/build:2-alpine3.24

name: ChartMuseum 0.x (dev)
image: dhi.io/chartmuseum
variant: dev
tags:
  - 0-alpine-dev
  - 0.16-alpine-dev
  - 0-alpine3.24-dev
  - 0.16.5-alpine-dev
  - 0.16-alpine3.24-dev
  - 0.16.5-alpine3.24-dev
platforms:
  - linux/amd64
  - linux/arm64
dates:
  release: "2023-06-14"
vars:
  FLAVORED_SUFFIX: -dev
  SEMVER_MAJOR_MINOR_VERSION: "0.16"
  SEMVER_MAJOR_VERSION: "0"
  SEMVER_VERSION: 0.16.5
  SUFFIX: -dev
  VERSION: 0.16.5-r2
contents:
  repositories:
    - https://dhi.io/apk/alpine/v3.24/main
    - https://dl-cdn.alpinelinux.org/alpine/v3.24/main
    - https://dl-cdn.alpinelinux.org/alpine/v3.24/community
  keyring:
    - https://dhi.io/keyring/dhi-apk@docker-0F81AD7700D99184.rsa.pub
  packages:
    - alpine-baselayout-data
    - apk-tools
    - busybox
    - ca-certificates
    - ca-certificates-bundle
    - chartmuseum-dev=0.16.5-r2
    - tzdata
accounts:
  root: true
  run-as: root
  users:
    - name: chartmuseum
      uid: 1000
      gid: 1000
  groups:
    - name: chartmuseum
      gid: 1000
      members:
        - chartmuseum
os-release:
  name: Docker Hardened Images (Alpine)
  id: alpine
  version-id: "3.24"
  pretty-name: Docker Hardened Images/Alpine Linux v3.24
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
paths:
  - type: directory
    path: /usr/local/bin
    uid: 0
    gid: 0
  - type: symlink
    path: /usr/local/bin/chartmuseum
    uid: 0
    gid: 0
    source: /usr/bin/chartmuseum
  - type: symlink
    path: /chartmuseum
    uid: 0
    gid: 0
    source: /usr/bin/chartmuseum
  - type: directory
    path: /chartstorage
    uid: 1000
    gid: 1000
    mode: "0770"
annotations:
  org.opencontainers.image.description: A minimal ChartMuseum image
  org.opencontainers.image.licenses: Apache-2.0
entrypoint:
  - /chartmuseum
ports:
  - 8080/tcp
