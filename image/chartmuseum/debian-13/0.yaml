# syntax=dhi.io/build:2-debian13

name: ChartMuseum 0.x
image: dhi.io/chartmuseum
variant: runtime
tags:
  - "0"
  - "0.16"
  - 0.16.5
  - 0-debian
  - 0-debian13
  - 0.16-debian
  - 0.16-debian13
  - 0.16.5-debian
  - 0.16.5-debian13
platforms:
  - linux/amd64
  - linux/arm64
dates:
  release: "2023-06-14"
vars:
  FLAVORED_SUFFIX: ""
  SEMVER_MAJOR_MINOR_VERSION: "0.16"
  SEMVER_MAJOR_VERSION: "0"
  SEMVER_VERSION: 0.16.5
  SUFFIX: ""
  VERSION: 0.16.5-2
contents:
  repositories:
    - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
  keyring:
    - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
  packages:
    - base-files
    - ca-certificates-bundle
    - chartmuseum=0.16.5-2
    - tzdata
accounts:
  run-as: "1000"
  users:
    - name: chartmuseum
      uid: 1000
      gid: 1000
  groups:
    - name: chartmuseum
      gid: 1000
      members:
        - chartmuseum
os-release:
  name: Docker Hardened Images (Debian)
  id: debian
  version-id: "13"
  version-codename: trixie
  pretty-name: Docker Hardened Images/Debian GNU/Linux 13 (trixie)
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
paths:
  - type: directory
    path: /usr/local/bin
    uid: 0
    gid: 0
  - type: symlink
    path: /usr/local/bin/chartmuseum
    uid: 0
    gid: 0
    source: /usr/bin/chartmuseum
  - type: symlink
    path: /chartmuseum
    uid: 0
    gid: 0
    source: /usr/bin/chartmuseum
  - type: directory
    path: /chartstorage
    uid: 1000
    gid: 1000
    mode: "0770"
annotations:
  org.opencontainers.image.description: A minimal ChartMuseum image
  org.opencontainers.image.licenses: Apache-2.0
entrypoint:
  - /chartmuseum
ports:
  - 8080/tcp
