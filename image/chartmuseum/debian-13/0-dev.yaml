# syntax=dhi.io/build:2-debian13

name: ChartMuseum 0.x (dev)
image: dhi.io/chartmuseum
variant: dev
tags:
  - 0-dev
  - 0.16-dev
  - 0.16.5-dev
  - 0-debian-dev
  - 0-debian13-dev
  - 0.16-debian-dev
  - 0.16-debian13-dev
  - 0.16.5-debian-dev
  - 0.16.5-debian13-dev
platforms:
  - linux/amd64
  - linux/arm64
dates:
  release: "2023-06-14"
vars:
  FLAVORED_SUFFIX: -dev
  SEMVER_MAJOR_MINOR_VERSION: "0.16"
  SEMVER_MAJOR_VERSION: "0"
  SEMVER_VERSION: 0.16.5
  SUFFIX: -dev
  VERSION: 0.16.5-2
contents:
  repositories:
    - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
  keyring:
    - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
  packages:
    - '!gawk'
    - '!libelogind0'
    - '!original-awk'
    - apt
    - base-files
    - bash
    - ca-certificates
    - ca-certificates-bundle
    - chartmuseum-dev=0.16.5-2
    - coreutils
    - diffutils
    - dpkg
    - findutils
    - grep
    - libc-bin
    - mawk
    - perl-base
    - sed
    - tzdata
    - util-linux
accounts:
  root: true
  run-as: root
  users:
    - name: chartmuseum
      uid: 1000
      gid: 1000
    - name: _apt
      uid: 42
      gid: 65532
  groups:
    - name: chartmuseum
      gid: 1000
      members:
        - chartmuseum
os-release:
  name: Docker Hardened Images (Debian)
  id: debian
  version-id: "13"
  version-codename: trixie
  pretty-name: Docker Hardened Images/Debian GNU/Linux 13 (trixie)
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
environment:
  DEBIAN_FRONTEND: noninteractive
paths:
  - type: directory
    path: /usr/local/bin
    uid: 0
    gid: 0
  - type: symlink
    path: /usr/local/bin/chartmuseum
    uid: 0
    gid: 0
    source: /usr/bin/chartmuseum
  - type: symlink
    path: /chartmuseum
    uid: 0
    gid: 0
    source: /usr/bin/chartmuseum
  - type: directory
    path: /chartstorage
    uid: 1000
    gid: 1000
    mode: "0770"
annotations:
  org.opencontainers.image.description: A minimal ChartMuseum image
  org.opencontainers.image.licenses: Apache-2.0
entrypoint:
  - /chartmuseum
ports:
  - 8080/tcp
