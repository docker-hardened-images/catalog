# syntax=dhi.io/build:2-alpine3.24

name: SMB CSI Driver 1.x
image: dhi.io/smbplugin
variant: runtime
tags:
  - 1-alpine
  - 1.20-alpine
  - 1-alpine3.24
  - 1.20.4-alpine
  - 1.20-alpine3.24
  - 1.20.4-alpine3.24
platforms:
  - linux/amd64
  - linux/arm64
dates:
  release: "2021-06-03"
vars:
  DHI_TAGS_OVERWRITE: "true"
  FLAVORED_SUFFIX: ""
  PACKAGE_NAME: csi-driver-smb-1
  SEMVER_MAJOR_MINOR_VERSION: "1.20"
  SEMVER_MAJOR_VERSION: "1"
  SEMVER_VERSION: 1.20.4
  SUFFIX: ""
  VERSION: 1.20.4-r1
contents:
  repositories:
    - https://dhi.io/apk/alpine/v3.24/main
    - https://dl-cdn.alpinelinux.org/alpine/v3.24/main
    - https://dl-cdn.alpinelinux.org/alpine/v3.24/community
  keyring:
    - https://dhi.io/keyring/dhi-apk@docker-0F81AD7700D99184.rsa.pub
  packages:
    - alpine-baselayout-data
    - ca-certificates-bundle
    - cifs-utils
    - coreutils
    - csi-driver-smb-1=1.20.4-r1
    - mount
    - tzdata
    - umount
accounts:
  run-as: nonroot
  users:
    - name: nonroot
      uid: 65532
      gid: 65532
  groups:
    - name: nonroot
      gid: 65532
      members:
        - nonroot
os-release:
  name: Docker Hardened Images (Alpine)
  id: alpine
  version-id: "3.24"
  pretty-name: Docker Hardened Images/Alpine Linux v3.24
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
paths:
  - type: symlink
    path: /smbplugin
    uid: 0
    gid: 0
    source: /usr/bin/smbplugin
  - type: file
    path: /etc/krb5.conf
    uid: 0
    gid: 0
    mode: "0644"
    source: image/smbplugin/krb5.conf
annotations:
  org.opencontainers.image.description: A minimal SMB CSI Driver image
  org.opencontainers.image.licenses: Apache-2.0
entrypoint:
  - /smbplugin
