# syntax=dhi.io/build:2-debian13

name: SMB CSI Driver 1.x
image: dhi.io/smbplugin
variant: runtime
tags:
  - "1"
  - "1.20"
  - 1.20.4
  - 1-debian
  - 1-debian13
  - 1.20-debian
  - 1.20-debian13
  - 1.20.4-debian
  - 1.20.4-debian13
platforms:
  - linux/amd64
  - linux/arm64
dates:
  release: "2021-06-03"
vars:
  FLAVORED_SUFFIX: ""
  PACKAGE_NAME: csi-driver-smb-1
  SEMVER_MAJOR_MINOR_VERSION: "1.20"
  SEMVER_MAJOR_VERSION: "1"
  SEMVER_VERSION: 1.20.4
  SUFFIX: ""
  VERSION: 1.20.4-1
contents:
  repositories:
    - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
  keyring:
    - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
  packages:
    - '!dpkg'
    - '!libpython3-stdlib'
    - '!libpython3.13-minimal'
    - '!libpython3.13-stdlib'
    - '!python3'
    - '!python3-minimal'
    - '!python3.13'
    - '!python3.13-minimal'
    - '!tar'
    - base-files
    - ca-certificates-bundle
    - cifs-utils
    - coreutils
    - csi-driver-smb-1=1.20.4-1
    - mount
    - tzdata
accounts:
  run-as: nonroot
  users:
    - name: nonroot
      uid: 65532
      gid: 65532
  groups:
    - name: nonroot
      gid: 65532
      members:
        - nonroot
os-release:
  name: Docker Hardened Images (Debian)
  id: debian
  version-id: "13"
  version-codename: trixie
  pretty-name: Docker Hardened Images/Debian GNU/Linux 13 (trixie)
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
paths:
  - type: symlink
    path: /smbplugin
    uid: 0
    gid: 0
    source: /usr/bin/smbplugin
  - type: file
    path: /etc/krb5.conf
    uid: 0
    gid: 0
    mode: "0644"
    source: image/smbplugin/krb5.conf
annotations:
  org.opencontainers.image.description: A minimal SMB CSI Driver image
  org.opencontainers.image.licenses: Apache-2.0
entrypoint:
  - /smbplugin
