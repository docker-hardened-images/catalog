# syntax=dhi.io/build:2-debian13

name: Cassandra 5.0.x (dev)
image: dhi.io/cassandra
variant: dev
tags:
  - 5-dev
  - 5.0-dev
  - 5.0.9-dev
  - 5-debian-dev
  - 5-debian13-dev
  - 5.0-debian-dev
  - 5.0-debian13-dev
  - 5.0.9-debian-dev
  - 5.0.9-debian13-dev
platforms:
  - linux/amd64
  - linux/arm64
dates:
  release: "2024-09-05"
vars:
  CASSANDRA_PACKAGE_VARIANT: -dev
  JAVA_FIPS_SUFFIX: ""
  JAVA_VARIANT: jdk
  JDK_MAJOR_VERSION: "17"
  JRE_PATH: /usr/lib/jvm/temurin-17
  SEMVER_MAJOR_MINOR_VERSION: "5.0"
  SEMVER_MAJOR_VERSION: "5"
  SEMVER_VERSION: 5.0.9
  VERSION: 5.0.9-17
contents:
  repositories:
    - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
  keyring:
    - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
  packages:
    - '!gawk'
    - '!libelogind0'
    - '!libpython3-stdlib'
    - '!libpython3.13-minimal'
    - '!libpython3.13-stdlib'
    - '!original-awk'
    - '!python3'
    - '!python3-minimal'
    - '!python3.13'
    - '!python3.13-minimal'
    - apt
    - base-files
    - bash
    - ca-certificates
    - cassandra-5.0-dev=5.0.9-17
    - coreutils
    - diffutils
    - dpkg
    - eclipse-temurin-17-jdk
    - eclipse-temurin-17-jdk-oci-config
    - findutils
    - gawk
    - grep
    - libc-bin
    - mawk
    - numactl
    - perl-base
    - procps
    - python-3.13
    - python3-cassandra
    - python3-wcwidth
    - sed
    - tzdata
    - util-linux
  builds:
    - name: locale
      contents:
        packages:
          - bash
          - locales
          - coreutils
          - gzip
      pipeline:
        - name: install locales
          runs: |
            set -eux -o pipefail

            ln -s /etc/locale.alias /usr/share/locale/locale.alias

            echo "en_US.UTF-8 UTF-8" >> /etc/locale.gen
            locale-gen en_US.UTF-8
      outputs:
        - source: /usr/share/locale
          target: /usr/share/locale
          uid: 0
          gid: 0
        - source: /usr/lib/locale
          target: /usr/lib/locale
          uid: 0
          gid: 0
accounts:
  root: true
  run-as: root
  users:
    - name: cassandra
      uid: 999
      gid: 999
    - name: _apt
      uid: 42
      gid: 65532
  groups:
    - name: cassandra
      gid: 999
os-release:
  name: Docker Hardened Images (Debian)
  id: debian
  version-id: "13"
  version-codename: trixie
  pretty-name: Docker Hardened Images/Debian GNU/Linux 13 (trixie)
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
environment:
  CASSANDRA_CONF: /etc/cassandra
  CASSANDRA_HOME: /opt/cassandra
  DEBIAN_FRONTEND: noninteractive
  JAVA_HOME: /usr/lib/jvm/temurin-17
  LANG: en_US.UTF-8
  LANGUAGE: en_US:en
  LC_ALL: en_US.UTF-8
  PATH: /usr/lib/jvm/temurin-17/bin:/opt/cassandra/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
paths:
  - type: directory
    path: /var/lib/cassandra
    uid: 999
    gid: 999
    mode: "0755"
  - type: directory
    path: /var/log/cassandra
    uid: 999
    gid: 999
    mode: "0755"
  - type: directory
    path: /opt/cassandra
    uid: 0
    gid: 0
    mode: "0755"
  - type: symlink
    path: /opt/cassandra/bin
    uid: 0
    gid: 0
    source: /usr/share/cassandra/bin
  - type: symlink
    path: /opt/cassandra/conf
    uid: 0
    gid: 0
    source: /usr/share/cassandra/conf
  - type: symlink
    path: /opt/cassandra/doc
    uid: 0
    gid: 0
    source: /usr/share/cassandra/doc
  - type: symlink
    path: /opt/cassandra/lib
    uid: 0
    gid: 0
    source: /usr/share/cassandra/lib
  - type: symlink
    path: /opt/cassandra/pylib
    uid: 0
    gid: 0
    source: /usr/share/cassandra/pylib
  - type: symlink
    path: /opt/cassandra/tools
    uid: 0
    gid: 0
    source: /usr/share/cassandra/tools
  - type: symlink
    path: /etc/cassandra
    uid: 0
    gid: 0
    source: /opt/cassandra/conf
  - type: symlink
    path: /opt/cassandra/data
    uid: 0
    gid: 0
    source: /var/lib/cassandra
  - type: symlink
    path: /opt/cassandra/logs
    uid: 0
    gid: 0
    source: /var/log/cassandra
annotations:
  org.opencontainers.image.description: A minimal Cassandra image
  org.opencontainers.image.licenses: Apache-2.0
entrypoint:
  - /opt/cassandra/bin/cassandra
cmd:
  - -f
  - -R
ports:
  - 7000/tcp
  - 7001/tcp
  - 7199/tcp
  - 9042/tcp
  - 9160/tcp
