# syntax=dhi.io/build:2-debian13

name: Cassandra 4.0.x
image: dhi.io/cassandra
variant: runtime
tags:
  - "4.0"
  - 4.0.21
  - 4.0-debian
  - 4.0-debian13
  - 4.0.21-debian
  - 4.0.21-debian13
platforms:
  - linux/amd64
  - linux/arm64
dates:
  release: "2021-07-26"
vars:
  CASSANDRA_PACKAGE_VARIANT: ""
  JAVA_FIPS_SUFFIX: ""
  JAVA_VARIANT: jre
  JDK_MAJOR_VERSION: "11"
  JRE_PATH: /usr/lib/jvm/temurin-11
  SEMVER_MAJOR_MINOR_VERSION: "4.0"
  SEMVER_MAJOR_VERSION: "4"
  SEMVER_VERSION: 4.0.21
  VERSION: 4.0.21-17
contents:
  repositories:
    - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
  keyring:
    - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
  packages:
    - base-files
    - bash
    - ca-certificates
    - cassandra-4.0=4.0.21-17
    - coreutils
    - eclipse-temurin-11-jre
    - eclipse-temurin-11-jre-oci-config
    - gawk
    - grep
    - numactl
    - procps
    - sed
    - tzdata
    - util-linux
  builds:
    - name: locale
      contents:
        packages:
          - bash
          - locales
          - coreutils
          - gzip
      pipeline:
        - name: install locales
          runs: |
            set -eux -o pipefail

            ln -s /etc/locale.alias /usr/share/locale/locale.alias

            echo "en_US.UTF-8 UTF-8" >> /etc/locale.gen
            locale-gen en_US.UTF-8
      outputs:
        - source: /usr/share/locale
          target: /usr/share/locale
          uid: 0
          gid: 0
        - source: /usr/lib/locale
          target: /usr/lib/locale
          uid: 0
          gid: 0
accounts:
  run-as: cassandra
  users:
    - name: cassandra
      uid: 999
      gid: 999
  groups:
    - name: cassandra
      gid: 999
os-release:
  name: Docker Hardened Images (Debian)
  id: debian
  version-id: "13"
  version-codename: trixie
  pretty-name: Docker Hardened Images/Debian GNU/Linux 13 (trixie)
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
environment:
  CASSANDRA_CONF: /etc/cassandra
  CASSANDRA_HOME: /opt/cassandra
  JAVA_HOME: /usr/lib/jvm/temurin-11
  LANG: en_US.UTF-8
  LANGUAGE: en_US:en
  LC_ALL: en_US.UTF-8
  PATH: /usr/lib/jvm/temurin-11/bin:/opt/cassandra/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
paths:
  - type: directory
    path: /var/lib/cassandra
    uid: 999
    gid: 999
    mode: "0755"
  - type: directory
    path: /var/log/cassandra
    uid: 999
    gid: 999
    mode: "0755"
  - type: directory
    path: /opt/cassandra
    uid: 0
    gid: 0
    mode: "0755"
  - type: symlink
    path: /opt/cassandra/bin
    uid: 0
    gid: 0
    source: /usr/share/cassandra/bin
  - type: symlink
    path: /opt/cassandra/conf
    uid: 0
    gid: 0
    source: /usr/share/cassandra/conf
  - type: symlink
    path: /opt/cassandra/doc
    uid: 0
    gid: 0
    source: /usr/share/cassandra/doc
  - type: symlink
    path: /opt/cassandra/lib
    uid: 0
    gid: 0
    source: /usr/share/cassandra/lib
  - type: symlink
    path: /opt/cassandra/pylib
    uid: 0
    gid: 0
    source: /usr/share/cassandra/pylib
  - type: symlink
    path: /opt/cassandra/tools
    uid: 0
    gid: 0
    source: /usr/share/cassandra/tools
  - type: symlink
    path: /etc/cassandra
    uid: 0
    gid: 0
    source: /opt/cassandra/conf
  - type: symlink
    path: /opt/cassandra/data
    uid: 0
    gid: 0
    source: /var/lib/cassandra
  - type: symlink
    path: /opt/cassandra/logs
    uid: 0
    gid: 0
    source: /var/log/cassandra
annotations:
  org.opencontainers.image.description: A minimal Cassandra image
  org.opencontainers.image.licenses: Apache-2.0
entrypoint:
  - /opt/cassandra/bin/cassandra
cmd:
  - -f
ports:
  - 7000/tcp
  - 7001/tcp
  - 7199/tcp
  - 9042/tcp
  - 9160/tcp
