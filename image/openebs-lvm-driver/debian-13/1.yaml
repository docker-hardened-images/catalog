# syntax=dhi.io/build:2-debian13

name: openebs-lvm-driver 1.x
image: dhi.io/openebs-lvm-driver
variant: runtime
tags:
  - "1"
  - "1.10"
  - 1.10.0
  - 1-debian
  - 1-debian13
  - 1.10-debian
  - 1.10-debian13
  - 1.10.0-debian
  - 1.10.0-debian13
platforms:
  - linux/amd64
  - linux/arm64
dates:
  release: "2026-08-19"
vars:
  FLAVORED_SUFFIX: ""
  SEMVER_MAJOR_MINOR_VERSION: "1.10"
  SEMVER_MAJOR_VERSION: "1"
  SEMVER_VERSION: 1.10.0
  SUFFIX: ""
  VERSION: 1.10.0-2
contents:
  repositories:
    - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
  keyring:
    - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
  packages:
    - '!libpython3-stdlib'
    - '!libpython3.13-minimal'
    - '!libpython3.13-stdlib'
    - '!python3'
    - '!python3-minimal'
    - '!python3.13'
    - '!python3.13-minimal'
    - base-files
    - btrfs-progs
    - ca-certificates-bundle
    - e2fsprogs
    - lvm-driver=1.10.0-2
    - lvm2
    - python-3.13
    - tzdata
    - util-linux
    - xfsprogs
accounts:
  run-as: nonroot
  users:
    - name: nonroot
      uid: 65532
      gid: 65532
  groups:
    - name: nonroot
      gid: 65532
      members:
        - nonroot
os-release:
  name: Docker Hardened Images (Debian)
  id: debian
  version-id: "13"
  version-codename: trixie
  pretty-name: Docker Hardened Images/Debian GNU/Linux 13 (trixie)
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
paths:
  - type: directory
    path: /usr/local/bin
    uid: 0
    gid: 0
  - type: symlink
    path: /usr/local/bin/lvm-driver
    uid: 0
    gid: 0
    source: /usr/bin/lvm-driver
annotations:
  org.opencontainers.image.description: A minimal OpenEBS LVM LocalPV Driver image
  org.opencontainers.image.licenses: Apache-2.0
entrypoint:
  - /usr/local/bin/lvm-driver
ports:
  - 7676/tcp
