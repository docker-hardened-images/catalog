  - 3.8-alpine-dev
  - 3-alpine3.24-dev
  - 3.8.0-alpine-dev
  - 3.8-alpine3.24-dev
  - 3.8.0-alpine3.24-dev
platforms:
  - linux/amd64
  - linux/arm64
dates:
