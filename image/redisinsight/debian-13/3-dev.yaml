# syntax=dhi.io/build:2-debian13

name: Redis Insight 3.x (dev)
image: dhi.io/redisinsight
variant: dev
tags:
  - 3-dev
  - 3.8-dev
  - 3.8.0-dev
  - 3-debian-dev
  - 3-debian13-dev
  - 3.8-debian-dev
  - 3.8-debian13-dev
  - 3.8.0-debian-dev
  - 3.8.0-debian13-dev
platforms:
  - linux/amd64
  - linux/arm64
dates:
  release: "2025-12-04"
vars:
  COMMIT_SHA: bdbb6eca1fcca1bb8a79ac28dc26a7a27fa30541
  SEMVER_MAJOR_MINOR_VERSION: "3.8"
  SEMVER_MAJOR_VERSION: "3"
  SEMVER_VERSION: 3.8.0
  VERSION: 3.8.0-2
contents:
  repositories:
    - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
  keyring:
    - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
  packages:
    - '!gawk'
    - '!libelogind0'
    - '!mawk'
    - '!original-awk'
    - apt
    - base-files
    - bash
    - ca-certificates
    - ca-certificates-bundle
    - coreutils
    - dash
    - diffutils
    - dpkg
    - findutils
    - grep
    - libc-bin
    - libc6
    - libstdc++6
    - mawk
    - nodejs-24
    - perl-base
    - redisinsight-3=3.8.0-2
    - sed
    - tzdata
    - util-linux
  builds:
    - name: locale
      contents:
        packages:
          - bash
          - locales
          - coreutils
          - gzip
      pipeline:
        - name: install locales
          runs: |
            set -eux -o pipefail

            ln -s /etc/locale.alias /usr/share/locale/locale.alias

            echo "en_US.UTF-8 UTF-8" >> /etc/locale.gen
            locale-gen en_US.UTF-8
      outputs:
        - source: /usr/share/locale
          target: /usr/share/locale
          uid: 0
          gid: 0
        - source: /usr/lib/locale
          target: /usr/lib/locale
          uid: 0
          gid: 0
accounts:
  root: true
  run-as: root
  users:
    - name: nonroot
      uid: 65532
      gid: 65532
    - name: _apt
      uid: 42
      gid: 65532
  groups:
    - name: nonroot
      gid: 65532
      members:
        - nonroot
os-release:
  name: Docker Hardened Images (Debian)
  id: debian
  version-id: "13"
  version-codename: trixie
  pretty-name: Docker Hardened Images/Debian GNU/Linux 13 (trixie)
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
work-dir: /usr/src/app
environment:
  DEBIAN_FRONTEND: noninteractive
  LANG: en_US.UTF-8
  LANGUAGE: en_US:en
  LC_ALL: en_US.UTF-8
  NODE_ENV: production
  RI_APP_BUILD_COMMIT_SHA: bdbb6eca1fcca1bb8a79ac28dc26a7a27fa30541
  RI_APP_FOLDER_ABSOLUTE_PATH: /data
  RI_BUILD_TYPE: DOCKER_ON_PREMISE
  RI_SERVE_STATICS: "true"
paths:
  - type: directory
    path: /usr/src
    uid: 0
    gid: 0
    mode: "0755"
  - type: symlink
    path: /usr/src/app
    uid: 0
    gid: 0
    source: /usr/lib/redisinsight-3
  - type: directory
    path: /data
    uid: 65532
    gid: 65532
    mode: "0770"
annotations:
  org.opencontainers.image.description: A minimal Redis Insight image
  org.opencontainers.image.licenses: SSPL-1.0
entrypoint:
  - ./docker-entry.sh
  - node
  - redisinsight/api/dist/src/main
ports:
  - 5540/tcp
