# syntax=dhi.io/build:2-debian13

name: Redis Insight 3.x
image: dhi.io/redisinsight
variant: runtime
tags:
  - "3"
  - "3.8"
  - 3.8.0
  - 3-debian
  - 3-debian13
  - 3.8-debian
  - 3.8-debian13
  - 3.8.0-debian
  - 3.8.0-debian13
platforms:
  - linux/amd64
  - linux/arm64
dates:
  release: "2025-12-04"
vars:
  COMMIT_SHA: bdbb6eca1fcca1bb8a79ac28dc26a7a27fa30541
  SEMVER_MAJOR_MINOR_VERSION: "3.8"
  SEMVER_MAJOR_VERSION: "3"
  SEMVER_VERSION: 3.8.0
  VERSION: 3.8.0-2
contents:
  repositories:
    - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
  keyring:
    - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
  packages:
    - '!libelogind0'
    - '!mawk'
    - '!original-awk'
    - base-files
    - ca-certificates-bundle
    - dash
    - libc6
    - libstdc++6
    - nodejs-24
    - redisinsight-3=3.8.0-2
    - tzdata
accounts:
  root: true
  run-as: nonroot
  users:
    - name: nonroot
      uid: 65532
      gid: 65532
  groups:
    - name: nonroot
      gid: 65532
      members:
        - nonroot
os-release:
  name: Docker Hardened Images (Debian)
  id: debian
  version-id: "13"
  version-codename: trixie
  pretty-name: Docker Hardened Images/Debian GNU/Linux 13 (trixie)
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
work-dir: /usr/src/app
environment:
  NODE_ENV: production
  RI_APP_BUILD_COMMIT_SHA: bdbb6eca1fcca1bb8a79ac28dc26a7a27fa30541
  RI_APP_FOLDER_ABSOLUTE_PATH: /data
  RI_BUILD_TYPE: DOCKER_ON_PREMISE
  RI_SERVE_STATICS: "true"
paths:
  - type: directory
    path: /usr/src
    uid: 0
    gid: 0
    mode: "0755"
  - type: symlink
    path: /usr/src/app
    uid: 0
    gid: 0
    source: /usr/lib/redisinsight-3
  - type: directory
    path: /data
    uid: 65532
    gid: 65532
    mode: "0770"
annotations:
  org.opencontainers.image.description: A minimal Redis Insight image
  org.opencontainers.image.licenses: SSPL-1.0
entrypoint:
  - ./docker-entry.sh
  - node
  - redisinsight/api/dist/src/main
ports:
  - 5540/tcp
