# syntax=dhi.io/build:2-debian13

name: Istio Ztunnel 1.32.x
image: dhi.io/ztunnel
variant: runtime
tags:
  - "1"
  - "1.32"
  - 1.32.0
  - 1-debian
  - 1-debian13
  - 1.32-debian
  - 1.32-debian13
  - 1.32.0-debian
  - 1.32.0-debian13
platforms:
  - linux/amd64
  - linux/arm64
dates:
  release: "2026-11-09"
vars:
  PACKAGE_NAME: ztunnel-1.32
  PACKAGE_SUFFIX: ""
  SEMVER_MAJOR_MINOR_VERSION: "1.32"
  SEMVER_MAJOR_VERSION: "1"
  SEMVER_VERSION: 1.32.0
  VERSION: 1.32.0-7
contents:
  repositories:
    - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
  keyring:
    - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
  packages:
    - base-files
    - ca-certificates-bundle
    - libc6
    - libgcc-s1
    - libstdc++6
    - tzdata
    - ztunnel-1.32=1.32.0-7
accounts:
  run-as: nonroot
  users:
    - name: nonroot
      uid: 65532
      gid: 65532
  groups:
    - name: nonroot
      gid: 65532
      members:
        - nonroot
os-release:
  name: Docker Hardened Images (Debian)
  id: debian
  version-id: "13"
  version-codename: trixie
  pretty-name: Docker Hardened Images/Debian GNU/Linux 13 (trixie)
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
paths:
  - type: directory
    path: /usr/local/bin
    uid: 0
    gid: 0
    mode: "0755"
  - type: symlink
    path: /usr/local/bin/ztunnel
    uid: 0
    gid: 0
    source: /usr/bin/ztunnel
annotations:
  org.opencontainers.image.description: Istio Ztunnel - Rust L4 proxy for Istio ambient mesh
  org.opencontainers.image.licenses: Apache-2.0
entrypoint:
  - ztunnel
