metadata:
  display-name: GraalVM Community Edition JDK
  short-description: |
    GraalVM Community Edition JDK is the community build of the GraalVM JDK,
    including the java launcher, javac, and the native-image utility. This image
    replaces ghcr.io/graalvm/jdk-community.
  featured: false
  home-url: https://www.graalvm.org/
  categories:
    - languages-and-frameworks
  included-tools:
    - name: java
      description: Java launcher for the GraalVM Community Edition JDK
    - name: javac
      description: Java compiler included with the GraalVM Community Edition JDK
    - name: native-image
      description: GraalVM native-image utility that ahead-of-time compiles Java programs
