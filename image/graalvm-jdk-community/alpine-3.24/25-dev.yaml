    path: /home/nonroot
    uid: 65532
    gid: 65532
    mode: "0755"
  - type: directory
    path: /usr/lib64/graalvm
    uid: 0
    gid: 0
    mode: "0755"
  - type: symlink
    path: /usr/lib64/graalvm/graalvm-community-java25i6
    uid: 0
    gid: 0
    source: /usr/lib/graalvm-jdk-community-25
