    - bash
    - build-base
    - busybox
    - ca-certificates
    - ca-certificates-bundle
    - coreutils
    - findutils
    - gcompat
    - graalvm-jdk-community-25=25.6.5.1-r0
    - tzdata
    - zlib
    - zlib-dev
accounts:
  root: true
  run-as: root
