# syntax=dhi.io/build:2-alpine3.24

name: GraalVM Community Edition JDK 25.x (dev)
image: dhi.io/graalvm-jdk-community
variant: dev
tags:
  - 25-alpine-dev
  - 25.6-alpine-dev
  - 25-alpine3.24-dev
  - 25.6-alpine3.24-dev
  - 25.6.5.1-alpine-dev
  - 25.6.5.1-alpine3.24-dev
platforms:
