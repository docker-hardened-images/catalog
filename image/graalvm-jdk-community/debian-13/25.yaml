# syntax=dhi.io/build:2-debian13

name: GraalVM Community Edition JDK 25.x
image: dhi.io/graalvm-jdk-community
variant: runtime
tags:
  - "25"
  - "25.6"
  - 25.6.5.1
  - 25-debian
  - 25-debian13
  - 25.6-debian
  - 25.6-debian13
  - 25.6.5.1-debian
  - 25.6.5.1-debian13
platforms:
  - linux/amd64
  - linux/arm64
dates:
  release: "2026-06-30"
vars:
  GRAAL_VERSION: 25.6.5.1
  INNOVATION: "6"
  SEMVER_MAJOR_MINOR_VERSION: "25.6"
  SEMVER_MAJOR_VERSION: "25"
  VERSION: 25.6.5.1-0
contents:
  repositories:
    - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
  keyring:
    - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
  packages:
    - '!libelogind0'
    - '!mawk'
    - '!original-awk'
    - base-files
    - bash
    - ca-certificates-bundle
    - coreutils
    - graalvm-jdk-community-25=25.6.5.1-0
    - libc6
    - tzdata
    - zlib1g
accounts:
  run-as: nonroot
  users:
    - name: nonroot
      uid: 65532
      gid: 65532
  groups:
    - name: nonroot
      gid: 65532
      members:
        - nonroot
os-release:
  name: Docker Hardened Images (Debian)
  id: debian
  version-id: "13"
  version-codename: trixie
  pretty-name: Docker Hardened Images/Debian GNU/Linux 13 (trixie)
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
work-dir: /app
environment:
  JAVA_HOME: /usr/lib64/graalvm/graalvm-community-java25i6
  LANG: en_US.UTF-8
paths:
  - type: directory
    path: /app
    uid: 65532
    gid: 65532
    mode: "0755"
  - type: directory
    path: /home/nonroot
    uid: 65532
    gid: 65532
    mode: "0755"
  - type: directory
    path: /usr/lib64/graalvm
    uid: 0
    gid: 0
    mode: "0755"
  - type: symlink
    path: /usr/lib64/graalvm/graalvm-community-java25i6
    uid: 0
    gid: 0
    source: /usr/lib/graalvm-jdk-community-25
annotations:
  org.opencontainers.image.description: A minimal GraalVM Community Edition JDK image
  org.opencontainers.image.licenses: GPL-2.0-only WITH Classpath-exception-2.0
cmd:
  - java
  - --version
