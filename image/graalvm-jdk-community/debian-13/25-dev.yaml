# syntax=dhi.io/build:2-debian13

name: GraalVM Community Edition JDK 25.x (dev)
image: dhi.io/graalvm-jdk-community
variant: dev
tags:
  - 25-dev
  - 25.6-dev
  - 25.6.5.1-dev
  - 25-debian-dev
  - 25-debian13-dev
  - 25.6-debian-dev
  - 25.6-debian13-dev
  - 25.6.5.1-debian-dev
  - 25.6.5.1-debian13-dev
platforms:
  - linux/amd64
  - linux/arm64
dates:
  release: "2026-06-30"
vars:
  GRAAL_VERSION: 25.6.5.1
  INNOVATION: "6"
  SEMVER_MAJOR_MINOR_VERSION: "25.6"
  SEMVER_MAJOR_VERSION: "25"
  VERSION: 25.6.5.1-0
contents:
  repositories:
    - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
  keyring:
    - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
  packages:
    - '!gawk'
    - '!libelogind0'
    - '!mawk'
    - '!original-awk'
    - apt
    - base-files
    - bash
    - build-essential
    - ca-certificates
    - ca-certificates-bundle
    - coreutils
    - diffutils
    - dpkg
    - findutils
    - graalvm-jdk-community-25=25.6.5.1-0
    - grep
    - libc-bin
    - libc6
    - mawk
    - perl-base
    - sed
    - tzdata
    - util-linux
    - zlib1g
    - zlib1g-dev
  builds:
    - name: locale
      contents:
        packages:
          - bash
          - locales
          - coreutils
          - gzip
      pipeline:
        - name: install locales
          runs: |
            set -eux -o pipefail

            ln -s /etc/locale.alias /usr/share/locale/locale.alias

            echo "en_US.UTF-8 UTF-8" >> /etc/locale.gen
            locale-gen en_US.UTF-8
      outputs:
        - source: /usr/share/locale
          target: /usr/share/locale
          uid: 0
          gid: 0
        - source: /usr/lib/locale
          target: /usr/lib/locale
          uid: 0
          gid: 0
accounts:
  root: true
  run-as: root
  users:
    - name: nonroot
      uid: 65532
      gid: 65532
    - name: _apt
      uid: 42
      gid: 65532
  groups:
    - name: nonroot
      gid: 65532
      members:
        - nonroot
os-release:
  name: Docker Hardened Images (Debian)
  id: debian
  version-id: "13"
  version-codename: trixie
  pretty-name: Docker Hardened Images/Debian GNU/Linux 13 (trixie)
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
work-dir: /app
environment:
  DEBIAN_FRONTEND: noninteractive
  JAVA_HOME: /usr/lib64/graalvm/graalvm-community-java25i6
  LANG: en_US.UTF-8
  LANGUAGE: en_US:en
  LC_ALL: en_US.UTF-8
paths:
  - type: directory
    path: /app
    uid: 65532
    gid: 65532
    mode: "0755"
  - type: directory
    path: /home/nonroot
    uid: 65532
    gid: 65532
    mode: "0755"
  - type: directory
    path: /usr/lib64/graalvm
    uid: 0
    gid: 0
    mode: "0755"
  - type: symlink
    path: /usr/lib64/graalvm/graalvm-community-java25i6
    uid: 0
    gid: 0
    source: /usr/lib/graalvm-jdk-community-25
annotations:
  org.opencontainers.image.description: A minimal GraalVM Community Edition JDK image
  org.opencontainers.image.licenses: GPL-2.0-only WITH Classpath-exception-2.0
cmd:
  - /bin/bash
