# syntax=dhi.io/build:2-debian13

name: Headlamp 0.x (dev)
image: dhi.io/headlamp
variant: dev
tags:
  - 0-dev
  - 0.45-dev
  - 0.45.0-dev
  - 0-debian-dev
  - 0-debian13-dev
  - 0.45-debian-dev
  - 0.45-debian13-dev
  - 0.45.0-debian-dev
  - 0.45.0-debian13-dev
platforms:
  - linux/amd64
  - linux/arm64
dates:
  release: "2026-05-07"
vars:
  HEADLAMP_SUFFIX: ""
  SEMVER_MAJOR_MINOR_VERSION: "0.45"
  SEMVER_MAJOR_VERSION: "0"
  SEMVER_VERSION: 0.45.0
  VERSION: 0.45.0-5
contents:
  repositories:
    - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
  keyring:
    - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
  packages:
    - '!gawk'
    - '!libelogind0'
    - '!original-awk'
    - apt
    - base-files
    - bash
    - ca-certificates
    - ca-certificates-bundle
    - coreutils
    - diffutils
    - dpkg
    - findutils
    - grep
    - headlamp=0.45.0-5
    - libc-bin
    - mawk
    - perl-base
    - sed
    - tzdata
    - util-linux
accounts:
  root: true
  run-as: root
  users:
    - name: nonroot
      uid: 65532
      gid: 65532
    - name: _apt
      uid: 42
      gid: 65532
  groups:
    - name: nonroot
      gid: 65532
      members:
        - nonroot
os-release:
  name: Docker Hardened Images (Debian)
  id: debian
  version-id: "13"
  version-codename: trixie
  pretty-name: Docker Hardened Images/Debian GNU/Linux 13 (trixie)
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
work-dir: /headlamp
environment:
  DEBIAN_FRONTEND: noninteractive
  HEADLAMP_STATIC_PLUGINS_DIR: /headlamp/static-plugins
paths:
  - type: directory
    path: /headlamp/plugins
    uid: 65532
    gid: 65532
    mode: "0770"
  - type: directory
    path: /headlamp/static-plugins
    uid: 65532
    gid: 65532
    mode: "0755"
  - type: symlink
    path: /headlamp/headlamp-server
    uid: 0
    gid: 0
    source: /usr/bin/headlamp-server
  - type: symlink
    path: /headlamp/frontend
    uid: 0
    gid: 0
    source: /usr/share/headlamp/frontend
annotations:
  org.opencontainers.image.description: Headlamp - a fully-featured Kubernetes web UI
  org.opencontainers.image.licenses: Apache-2.0
entrypoint:
  - /usr/bin/headlamp-server
cmd:
  - -html-static-dir
  - /usr/share/headlamp/frontend
  - -plugins-dir
  - /headlamp/plugins
ports:
  - 4466/tcp
