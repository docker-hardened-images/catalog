# syntax=dhi.io/build:2-debian13

name: Telepresence 2.x
image: dhi.io/telepresence
variant: runtime
tags:
  - "2"
  - "2.32"
  - 2.32.3
  - 2-debian
  - 2-debian13
  - 2.32-debian
  - 2.32-debian13
  - 2.32.3-debian
  - 2.32.3-debian13
platforms:
  - linux/amd64
  - linux/arm64
dates:
  release: "2021-01-25"
vars:
  FLAVORED_SUFFIX: ""
  SEMVER_MAJOR_MINOR_VERSION: "2.32"
  SEMVER_MAJOR_VERSION: "2"
  SEMVER_VERSION: 2.32.3
  SUFFIX: ""
  VERSION: 2.32.3-1
contents:
  repositories:
    - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
  keyring:
    - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
  packages:
    - base-files
    - ca-certificates-bundle
    - iptables
    - telepresence-2=2.32.3-1
    - tzdata
accounts:
  root: true
  run-as: root
  users:
    - name: nonroot
      uid: 65532
      gid: 65532
  groups:
    - name: nonroot
      gid: 65532
      members:
        - nonroot
os-release:
  name: Docker Hardened Images (Debian)
  id: debian
  version-id: "13"
  version-codename: trixie
  pretty-name: Docker Hardened Images/Debian GNU/Linux 13 (trixie)
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
environment:
  HOME: /root
paths:
  - type: directory
    path: /usr/local/bin
    uid: 0
    gid: 0
  - type: symlink
    path: /usr/local/bin/telepresence
    uid: 0
    gid: 0
    source: /usr/bin/telepresence
  - type: directory
    path: /root
    uid: 0
    gid: 0
    mode: "0700"
  - type: delete
    path: /usr/sbin/iptables-restore
    uid: 0
    gid: 0
  - type: symlink
    path: /usr/sbin/iptables-restore
    uid: 0
    gid: 0
    source: xtables-nft-multi
  - type: delete
    path: /usr/sbin/iptables-save
    uid: 0
    gid: 0
  - type: symlink
    path: /usr/sbin/iptables-save
    uid: 0
    gid: 0
    source: xtables-nft-multi
  - type: delete
    path: /usr/sbin/ip6tables-restore
    uid: 0
    gid: 0
  - type: symlink
    path: /usr/sbin/ip6tables-restore
    uid: 0
    gid: 0
    source: xtables-nft-multi
  - type: delete
    path: /usr/sbin/ip6tables-save
    uid: 0
    gid: 0
  - type: symlink
    path: /usr/sbin/ip6tables-save
    uid: 0
    gid: 0
    source: xtables-nft-multi
annotations:
  com.docker.dhi.runtime-root-required: "true"
  org.opencontainers.image.description: A minimal Telepresence image
  org.opencontainers.image.licenses: Apache-2.0
entrypoint:
  - telepresence
