# syntax=dhi.io/build:2-alpine3.24

name: Telepresence 2.x
image: dhi.io/telepresence
variant: runtime
tags:
  - 2-alpine
  - 2.32-alpine
  - 2-alpine3.24
  - 2.32.3-alpine
  - 2.32-alpine3.24
  - 2.32.3-alpine3.24
platforms:
  - linux/amd64
  - linux/arm64
dates:
  release: "2021-01-25"
vars:
  FLAVORED_SUFFIX: ""
  SEMVER_MAJOR_MINOR_VERSION: "2.32"
  SEMVER_MAJOR_VERSION: "2"
  SEMVER_VERSION: 2.32.3
  SUFFIX: ""
  VERSION: 2.32.3-r1
contents:
  repositories:
    - https://dhi.io/apk/alpine/v3.24/main
    - https://dl-cdn.alpinelinux.org/alpine/v3.24/main
    - https://dl-cdn.alpinelinux.org/alpine/v3.24/community
  keyring:
    - https://dhi.io/keyring/dhi-apk@docker-0F81AD7700D99184.rsa.pub
  packages:
    - alpine-baselayout-data
    - ca-certificates-bundle
    - iptables
    - telepresence-2=2.32.3-r1
    - tzdata
accounts:
  root: true
  run-as: root
  users:
    - name: nonroot
      uid: 65532
      gid: 65532
  groups:
    - name: nonroot
      gid: 65532
      members:
        - nonroot
os-release:
  name: Docker Hardened Images (Alpine)
  id: alpine
  version-id: "3.24"
  pretty-name: Docker Hardened Images/Alpine Linux v3.24
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
environment:
  HOME: /root
paths:
  - type: directory
    path: /usr/local/bin
    uid: 0
    gid: 0
  - type: symlink
    path: /usr/local/bin/telepresence
    uid: 0
    gid: 0
    source: /usr/bin/telepresence
  - type: directory
    path: /root
    uid: 0
    gid: 0
    mode: "0700"
annotations:
  com.docker.dhi.runtime-root-required: "true"
  org.opencontainers.image.description: A minimal Telepresence image
  org.opencontainers.image.licenses: Apache-2.0
entrypoint:
  - telepresence
