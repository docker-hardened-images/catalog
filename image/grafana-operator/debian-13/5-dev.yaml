# syntax=dhi.io/build:2-debian13

name: Grafana Operator 5.x (dev)
image: dhi.io/grafana-operator
variant: dev
tags:
  - 5-dev
  - 5.25-dev
  - 5.25.0-dev
  - 5-debian-dev
  - 5-debian13-dev
  - 5.25-debian-dev
  - 5.25-debian13-dev
  - 5.25.0-debian-dev
  - 5.25.0-debian13-dev
platforms:
  - linux/amd64
  - linux/arm64
dates:
  release: "2026-01-05"
vars:
  FLAVORED_SUFFIX: -dev
  SEMVER_MAJOR_MINOR_VERSION: "5.25"
  SEMVER_MAJOR_VERSION: "5"
  SEMVER_VERSION: 5.25.0
  SUFFIX: -dev
  VERSION: 5.25.0-3
contents:
  repositories:
    - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
  keyring:
    - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
  packages:
    - '!gawk'
    - '!libelogind0'
    - '!original-awk'
    - apt
    - base-files
    - bash
    - ca-certificates
    - ca-certificates-bundle
    - coreutils
    - diffutils
    - dpkg
    - findutils
    - grafana-operator-dev=5.25.0-3
    - grep
    - libc-bin
    - mawk
    - perl-base
    - sed
    - tzdata
    - util-linux
accounts:
  root: true
  run-as: root
  users:
    - name: "65532"
      uid: 65532
      gid: 65532
    - name: _apt
      uid: 42
      gid: 65532
  groups:
    - name: nonroot
      gid: 65532
      members:
        - "65532"
os-release:
  name: Docker Hardened Images (Debian)
  id: debian
  version-id: "13"
  version-codename: trixie
  pretty-name: Docker Hardened Images/Debian GNU/Linux 13 (trixie)
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
environment:
  DEBIAN_FRONTEND: noninteractive
paths:
  - type: directory
    path: /usr/local/bin
    uid: 0
    gid: 0
  - type: symlink
    path: /usr/local/bin/grafana-operator
    uid: 0
    gid: 0
    source: /usr/bin/grafana-operator
annotations:
  org.opencontainers.image.description: A minimal Grafana Operator image
  org.opencontainers.image.licenses: Apache-2.0
entrypoint:
  - /usr/local/bin/grafana-operator
ports:
  - 8080/tcp
  - 8081/tcp
