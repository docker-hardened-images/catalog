# syntax=dhi.io/build:2-debian13

name: Grafana Operator 5.x
image: dhi.io/grafana-operator
variant: runtime
tags:
  - "5"
  - "5.25"
  - 5.25.0
  - 5-debian
  - 5-debian13
  - 5.25-debian
  - 5.25-debian13
  - 5.25.0-debian
  - 5.25.0-debian13
platforms:
  - linux/amd64
  - linux/arm64
dates:
  release: "2026-01-05"
vars:
  FLAVORED_SUFFIX: ""
  SEMVER_MAJOR_MINOR_VERSION: "5.25"
  SEMVER_MAJOR_VERSION: "5"
  SEMVER_VERSION: 5.25.0
  SUFFIX: ""
  VERSION: 5.25.0-3
contents:
  repositories:
    - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
  keyring:
    - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
  packages:
    - base-files
    - ca-certificates-bundle
    - grafana-operator=5.25.0-3
    - tzdata
accounts:
  run-as: "65532"
  users:
    - name: "65532"
      uid: 65532
      gid: 65532
  groups:
    - name: nonroot
      gid: 65532
      members:
        - "65532"
os-release:
  name: Docker Hardened Images (Debian)
  id: debian
  version-id: "13"
  version-codename: trixie
  pretty-name: Docker Hardened Images/Debian GNU/Linux 13 (trixie)
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
paths:
  - type: directory
    path: /usr/local/bin
    uid: 0
    gid: 0
  - type: symlink
    path: /usr/local/bin/grafana-operator
    uid: 0
    gid: 0
    source: /usr/bin/grafana-operator
annotations:
  org.opencontainers.image.description: A minimal Grafana Operator image
  org.opencontainers.image.licenses: Apache-2.0
entrypoint:
  - /usr/local/bin/grafana-operator
ports:
  - 8080/tcp
  - 8081/tcp
