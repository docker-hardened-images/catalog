# syntax=dhi.io/build:2-debian13

name: Contour 1.x
image: dhi.io/contour
variant: runtime
tags:
  - "1.32"
  - 1.32.5
  - 1.32-debian
  - 1.32-debian13
  - 1.32.5-debian
  - 1.32.5-debian13
platforms:
  - linux/amd64
  - linux/arm64
dates:
  release: "2025-05-15"
vars:
  FLAVORED_SUFFIX: ""
  PKG_SUFFIX: ""
  SEMVER_MAJOR_MINOR_VERSION: "1.32"
  SEMVER_MAJOR_VERSION: "1"
  SEMVER_VERSION: 1.32.5
  SUFFIX: ""
  VERSION: 1.32.5-11
contents:
  repositories:
    - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
  keyring:
    - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
  packages:
    - base-files
    - ca-certificates-bundle
    - contour-1.32=1.32.5-11
    - tzdata
accounts:
  run-as: nonroot
  users:
    - name: nonroot
      uid: 65532
      gid: 65532
  groups:
    - name: nonroot
      gid: 65532
      members:
        - nonroot
os-release:
  name: Docker Hardened Images (Debian)
  id: debian
  version-id: "13"
  version-codename: trixie
  pretty-name: Docker Hardened Images/Debian GNU/Linux 13 (trixie)
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
paths:
  - type: directory
    path: /usr/local/bin
    uid: 0
    gid: 0
  - type: symlink
    path: /usr/local/bin/contour
    uid: 0
    gid: 0
    source: /usr/bin/contour
annotations:
  org.opencontainers.image.description: A minimal contour image
  org.opencontainers.image.licenses: Apache-2.0
entrypoint:
  - /usr/local/bin/contour
