# syntax=dhi.io/build:2-debian13

name: vSphere CSI Driver 3.3.x
image: dhi.io/vsphere-csi-driver
variant: runtime
tags:
  - "3.3"
  - 3.3.1
  - 3.3-debian
  - 3.3-debian13
  - 3.3.1-debian
  - 3.3.1-debian13
platforms:
  - linux/amd64
  - linux/arm64
dates:
  release: "2024-06-25"
  end-of-life: "2025-04-16"
vars:
  FLAVORED_SUFFIX: ""
  SEMVER_MAJOR_MINOR_VERSION: "3.3"
  SEMVER_MAJOR_VERSION: "3"
  SEMVER_VERSION: 3.3.1
  SUFFIX: ""
  VERSION: 3.3.1-2
contents:
  repositories:
    - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
  keyring:
    - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
  packages:
    - '!libpython3-stdlib'
    - '!libpython3.13-minimal'
    - '!libpython3.13-stdlib'
    - '!python3'
    - '!python3-minimal'
    - '!python3.13'
    - '!python3.13-minimal'
    - base-files
    - ca-certificates-bundle
    - e2fsprogs
    - libc6
    - mount
    - nfs-common
    - python-3.13
    - tzdata
    - util-linux
    - vsphere-csi-driver-3.3=3.3.1-2
    - xfsprogs
accounts:
  run-as: "65532"
  users:
    - name: nonroot
      uid: 65532
      gid: 65532
  groups:
    - name: nonroot
      gid: 65532
      members:
        - nonroot
os-release:
  name: Docker Hardened Images (Debian)
  id: debian
  version-id: "13"
  version-codename: trixie
  pretty-name: Docker Hardened Images/Debian GNU/Linux 13 (trixie)
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
annotations:
  org.opencontainers.image.description: A minimal vSphere CSI driver image
  org.opencontainers.image.licenses: Apache-2.0
entrypoint:
  - /bin/vsphere-csi
ports:
  - 9808/tcp
  - 2112/tcp
