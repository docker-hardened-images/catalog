metadata:
  display-name: GitLab Toolbox
  short-description: GitLab Toolbox provides the backup, restore, and Rails maintenance tooling (backup-utility, gitlab-rake, gitlab-rails) for a GitLab installation.
  featured: false
  home-url: https://about.gitlab.com/
  categories:
    - integration-and-delivery
  included-tools:
    - name: backup-utility
      description: Creates, restores, and prunes full GitLab backups, uploading archives to S3, Google Cloud Storage, or Azure Blob Storage.
    - name: gitlab-rake
      description: Runs rake tasks against the installed GitLab application, including the gitlab:backup task tree and database migrations.
    - name: gitlab-rails
      description: Runs the Rails CLI against the installed GitLab application, including the console and runner.
    - name: gitlab-backup-cli
      description: GitLab's newer backup command-line interface, an alternative to the rake-based backup tasks.
    - name: gitaly-backup
      description: Streams repository backups to and from Gitaly over gRPC; invoked by the gitlab:backup:repo rake tasks. Pinned to the same GitLab minor as the image.
    - name: object-storage-backup
      description: Copies a GitLab object storage bucket into a compressed tar archive for inclusion in a backup.
    - name: object-storage-restore
      description: Restores a GitLab object storage bucket from a compressed tar archive taken from a backup.
    - name: aws
      description: AWS CLI, used by backup-utility when the S3 tool is set to awscli.
    - name: s3cmd
      description: Default S3 client used by backup-utility for the s3 backup backend.
    - name: gsutil
      description: Google Cloud Storage client used by backup-utility for the gcs backup backend.
    - name: azcopy
      description: Azure Blob Storage client used by backup-utility for the azure backup backend.
    - name: pg_dump
      description: PostgreSQL 17 dump utility invoked by the gitlab:backup:db:create rake task.
    - name: psql
      description: PostgreSQL 17 client invoked by the gitlab:backup:db:restore rake task.
    - name: redis-cli
      description: Redis client for inspecting GitLab's cache and queues during maintenance.
