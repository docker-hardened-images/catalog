# syntax=dhi.io/build:2-debian13

name: GitLab Toolbox 19.1.x
image: dhi.io/gitlab-toolbox
variant: runtime
tags:
  - "19"
  - "19.1"
  - 19.1.8
  - 19-debian
  - 19-debian13
  - 19.1-debian
  - 19.1-debian13
  - 19.1.8-debian
  - 19.1.8-debian13
platforms:
  - linux/amd64
  - linux/arm64
dates:
  release: "2026-06-17"
vars:
  AWSCLI_VERSION: 1.44.59
  CARGO_VERSION: 1.96.1-0
  CNG_COMMIT: 72f58b74e7c177111176abb10e61d00735ceacb1
  CNG_VERSION: 19.1.8
  CRCMOD_VERSION: "1.7"
  DEVFILE_COMMIT_SHA: 1f25dab8010cea3a8e23a498616efe654312e1cf
  DEVFILE_VERSION: 0.5.2
  FIPS_TAG: ""
  GEM_ADVISORY_FLOORS: activestorage:7.2.3.2,addressable:2.9.0,concurrent-ruby:1.3.7,doorkeeper-openid_connect:1.10.0,excon:1.5.0,faraday:2.14.3,json:2.19.9,loofah:2.25.2,mail:2.9.1,msgpack:1.8.2,net-imap:0.6.4.1,nokogiri:1.19.4,oauth2:2.0.22,puma:8.0.2,rails-html-sanitizer:1.7.1,sidekiq-cron:2.4.0,websocket-driver:0.8.2
  GOLANG_VERSION: 1.26.8-0
  GSUTIL_VERSION: "5.37"
  NODEJS_VERSION: 22.23.3-0
  PYCA_CRYPTOGRAPHY_VERSION: 46.0.7
