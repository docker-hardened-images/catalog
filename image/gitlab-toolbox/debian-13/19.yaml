    - python3-setuptools-whl
    - redis-tools
    - ruby-3.3=3.3.12-63
    - sed
    - tar
    - tini
    - tzdata
    - zlib1g
  builds:
    - name: toolbox scripts
      work-dir: /cng-src
      contents:
        packages:
          - bash
          - coreutils
          - findutils
          - grep
          - sed
        files:
          - url: git+https://gitlab.com/gitlab-org/build/CNG.git#v19.1.8
            checksum: 72f58b74e7c177111176abb10e61d00735ceacb1
            path: /cng-src
            spdx:
              name: gitlab-toolbox-scripts
              version: 19.1.8
              packages:
                - name: gitlab-toolbox-scripts
                  purl: pkg:gitlab/gitlab-org/build/CNG@v19.1.8
                  license: MIT
            uid: 0
            gid: 0
      pipeline:
        - name: verify toolbox script source parity
          runs: |
            set -eux -o pipefail

            if [ "19.1.8" != "19.1.8" ]; then
              echo "CNG tag v19.1.8 does not match gitlab-foss tag v19.1.8" >&2
              exit 1
            fi
        - name: verify object storage pins match CNG
          environment:
            AWSCLI_VERSION: 1.44.59
            GSUTIL_VERSION: "5.37"
            PYCA_CRYPTOGRAPHY_VERSION: 46.0.7
            PYOPENSSL_VERSION: 25.3.0
            S3CMD_VERSION: 2.4.0
          runs: |
            set -eux -o pipefail

            DF=/cng-src/gitlab-toolbox/Dockerfile
            VY=/cng-src/ci_files/variables.yml
            test -s "${DF}"
            test -s "${VY}"

            fail=0
            check() {
              if [ -z "$2" ]; then
                echo "extraction failed: could not read $1 out of the CNG tree; the comparison was not performed" >&2
                fail=1
                return
              fi
              if [ "$2" != "$3" ]; then
                echo "pin drift: $1 is $3 in this definition but $2 in CNG v19.1.8" >&2
                fail=1
              fi
            }

            arg() { grep "^ARG $1=" "${DF}" | head -1 | sed -E 's/^[^=]+="?([^"]+)"?$/\1/'; }
            yml() { grep "^  $1:" "${VY}" | head -1 | sed -E "s/^  $1:[[:space:]]*'?([^']+)'?[[:space:]]*$/\\1/"; }

            check AWSCLI_VERSION "$(arg AWSCLI_VERSION)" "1.44.59"
            check S3CMD_VERSION "$(arg S3CMD_VERSION)" "2.4.0"
            check GSUTIL_VERSION "$(arg GSUTIL_VERSION)" "5.37"
            check PYOPENSSL_VERSION "$(yml PYOPENSSL_VERSION)" "25.3.0"
            check PYCA_CRYPTOGRAPHY_VERSION "$(yml PYCA_CRYPTOGRAPHY_VERSION)" "46.0.7"

            test "${fail}" -eq 0
            echo "object storage pins match CNG v19.1.8"
        - name: install wrapper scripts
          runs: |
            set -eux -o pipefail

            expected_bin="backup-utility gitlab-backup-cli gitlab-rails gitlab-rake
            object-storage-azure-env object-storage-azure-url object-storage-backup
            object-storage-restore process-wrapper.sh"

            for script in ${expected_bin}; do
              test -f "/cng-src/gitlab-toolbox/scripts/bin/${script}" \
                || {
                  echo "missing upstream script: ${script}" >&2
                  exit 1
                }
            done

            mkdir -p ${target.dir}/usr/local/bin
            mkdir -p ${target.dir}/usr/lib/ruby/vendor_ruby

            install -m 0755 /cng-src/gitlab-toolbox/scripts/bin/* \
              ${target.dir}/usr/local/bin/
            install -m 0644 /cng-src/gitlab-toolbox/scripts/lib/*.rb \
              ${target.dir}/usr/lib/ruby/vendor_ruby/

            bash -n ${target.dir}/usr/local/bin/backup-utility
            bash -n ${target.dir}/usr/local/bin/process-wrapper.sh
      paths:
        - type: file
          path: /scripts-src/entrypoint.sh
          uid: 0
          gid: 0
          mode: "0755"
          source: image/gitlab-toolbox/scripts/entrypoint.sh
        - type: file
          path: /scripts-src/set-config
          uid: 0
          gid: 0
          mode: "0755"
          source: image/gitlab-toolbox/scripts/set-config
      outputs:
        - source: ${target.dir}/usr/local/bin
          target: /usr/local/bin
          uid: 0
          gid: 0
        - source: ${target.dir}/usr/lib/ruby/vendor_ruby
          target: /usr/lib/ruby/vendor_ruby
          uid: 0
          gid: 0
        - source: /scripts-src
          target: /scripts
          uid: 0
          gid: 0
    - name: rails app
      work-dir: /srv/gitlab
      shell: /bin/bash
      caches:
        - path: /root/.bundle/cache
        - path: /root/.cache/yarn
        - path: /usr/local/cargo/registry
        - path: /usr/local/share/.cache/yarn
      contents:
        repositories:
          - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
        keyring:
          - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
        packages:
          - bash
          - base-files
          - ca-certificates
          - ca-certificates-bundle
          - coreutils
          - findutils
          - gawk
          - git
          - grep
          - gzip
          - sed
          - libc6
          - libc-bin
          - ruby-3.3=3.3.12-63
          - ruby-3.3-dev=3.3.12-63
          - libjemalloc-dev
          - libjemalloc2
          - nodejs-22=22.23.3-0
          - yarn-classic
          - cargo-1.96=1.96.1-0
          - rustc-1.96=1.96.0-0
          - binutils
          - libcrypt1
          - libcurl4t64
          - libffi8
          - libgcc-s1
          - libgmp10
          - libsqlite3-0
          - libssl3t64
          - libstdc++6
          - libyaml-0-2
          - zlib1g
          - build-essential
          - clang
          - cmake
          - dpkg-dev
          - gnu-which
          - musl-dev
          - gcc
          - libclang-dev
          - libedit-dev
          - libffi-dev
          - libicu-dev
          - libkrb5-3
          - libkrb5-dev
          - libpq-dev
          - libre2-dev
          - libssh2-1-dev
          - libssl-dev
          - libxml2-dev
          - libyaml-dev
          - libzstd-dev
          - llvm-dev
          - passwd
          - patch
          - pkg-config
          - sudo
          - zlib1g-dev
        files:
          - url: git+https://gitlab.com/gitlab-org/gitlab-foss.git#v19.1.8
            checksum: 25601e798604a50f025102e4598a6884305802c4
            path: /srv/gitlab
            spdx:
              name: gitlab-ce
              version: 19.1.8
              packages:
                - name: gitlab-ce
                  purl: pkg:gitlab/gitlab-org/gitlab-foss@v19.1.8
                  license: MIT
            uid: 0
            gid: 0
      pipeline:
        - name: widen GitLab 19 gem constraints for security fixes
          uses: patch@v1
          work-dir: /srv/gitlab
          with:
            options: -p1
            patch: ${source.dir}/patch/gem-constraints-19.patch
        - name: bump vulnerable gem versions in lockfile
          privileged: true
          environment:
            GEM_ADVISORY_FLOORS: activestorage:7.2.3.2,addressable:2.9.0,concurrent-ruby:1.3.7,doorkeeper-openid_connect:1.10.0,excon:1.5.0,faraday:2.14.3,json:2.19.9,loofah:2.25.2,mail:2.9.1,msgpack:1.8.2,net-imap:0.6.4.1,nokogiri:1.19.4,oauth2:2.0.22,puma:8.0.2,rails-html-sanitizer:1.7.1,sidekiq-cron:2.4.0,websocket-driver:0.8.2
          runs: |
            set -eux -o pipefail

            bundle lock --update \
              activestorage activesupport actionview actionpack railties \
              addressable concurrent-ruby faraday oauth2 puma websocket-driver \
              doorkeeper-openid_connect excon json loofah mail msgpack net-imap \
              nokogiri rails-html-sanitizer sidekiq-cron \
              --conservative

            ruby -rbundler -e '
              specs = Bundler::LockfileParser.new(File.read("Gemfile.lock")).specs.to_h { |s| [s.name, s.version] }
              floors = ENV.fetch("GEM_ADVISORY_FLOORS").split(",").map { |e| e.split(":", 2) }.to_h
              abort "GEM_ADVISORY_FLOORS is empty" if floors.empty?
              missing = floors.reject { |name, _| specs.key?(name) }
              abort "gems absent from lockfile: #{missing.keys.join(", ")}" unless missing.empty?
              floors.each do |name, version|
                actual = specs.fetch(name)
                abort "#{name} resolved to #{actual}, expected >= #{version}" if actual < Gem::Version.new(version)
              end
              puts "lockfile advisory floors satisfied for #{floors.size} gems"
            '
        - name: install node dependencies
          privileged: true
          runs: |
            set -eux -o pipefail

            yarn global add node-gyp
            yarn install --frozen-lockfile
        - name: bundle install
          privileged: true
          environment:
            CARGO_HOME: /usr/local/cargo
            RUSTUP_HOME: /usr/local/rustup
          runs: |
            set -eux -o pipefail

            bundle config set --local version system
            bundle config set --local clean 'true'
            bundle config set --local deployment 'true'
            bundle config set --local without 'development test mysql aws'

            bundle install --jobs 4 --retry 5

            bundle exec ruby -e 'require "pg"; require "grpc"; require "nokogiri"; require "google/protobuf"; require "re2"; puts "native gems load"'
        - name: configure application
          runs: |
            set -eux -o pipefail

            cp config/gitlab.yml.example config/gitlab.yml
            cp config/resque.yml.example config/resque.yml
            cp config/secrets.yml.example config/secrets.yml
            cp config/database.yml.postgresql config/database.yml

            sed --in-place "/geo:/,/^$/d" config/database.yml
            grep -q '^\s*geo:' config/database.yml \
              && {
                echo "geo: block still present in database.yml" >&2
                exit 1
              }

            sed --in-place "/embedding:/,/^$/d" config/database.yml
            grep -q '^\s*embedding:' config/database.yml \
              && {
                echo "embedding: block still present in database.yml" >&2
                exit 1
              }

            sed --in-place "/host: localhost/d" config/gitlab.yml
            grep -q 'host: localhost' config/gitlab.yml \
              && {
                echo "host: localhost still present in gitlab.yml" >&2
                exit 1
              }

            sed --in-place "/port: 80/d" config/gitlab.yml
            sed --in-place "s/# user:.*/user: git/" config/gitlab.yml
            grep -q '^\s*user: git' config/gitlab.yml \
              || {
                echo "user: git not set in gitlab.yml" >&2
                exit 1
              }

            echo 'gitlab-cloud-native-image' > INSTALLATION_TYPE

            ruby -ryaml -e 'YAML.unsafe_load_file("config/gitlab.yml"); YAML.unsafe_load_file("config/database.yml"); puts "config templates parse"'
        - name: compile assets
          environment:
            CI: "true"
            NO_COMPRESSION: "true"
            NO_SOURCEMAPS: "true"
            NODE_ENV: production
            PGCONNECT_TIMEOUT: "1"
            RAILS_ENV: production
            SKIP_STORAGE_VALIDATION: "true"
            USE_DB: "false"
            WEBPACK_COMPILE_LOG_PATH: /tmp/webpack-compile.log
          runs: |
            set -eux -o pipefail

            mkdir -p tmp

            node scripts/frontend/infection_scanner/infection_scanner.mjs
            bundle exec rake gitlab:assets:compile --trace
        - name: prune build artifacts
          runs: |
            set -eux -o pipefail

            rm -rf node_modules/ tmp/ spec/ ee/spec/ storybook/
            rm -rf qa/ rubocop/ tooling/ .gitlab/ .github/ docker/
            rm -rf changelogs/ danger/ Dangerfile
            rm -rf .agents/ .claude/

            rm -rf doc/

            find vendor/bundle -type d -path '*/rouge-*/lib/rouge/demos' \
              -prune -exec rm -rf {} +
            rm -f package.json yarn.lock

            rm -rf public/assets/webpack
            RUBY_DIR="vendor/bundle/ruby"
            test -d "${RUBY_DIR}"

            rm -rf ${RUBY_DIR}/*/cache

            rm -rf ${RUBY_DIR}/*/gems/*/spec \
              ${RUBY_DIR}/*/gems/*/test \
              ${RUBY_DIR}/*/gems/*/tests

            rm -rf ${RUBY_DIR}/*/gems/libyajl2*/**/vendor

            rm -rf ${RUBY_DIR}/*/gems/grpc-*/include \
              ${RUBY_DIR}/*/gems/grpc-*/src/core \
              ${RUBY_DIR}/*/gems/grpc-*/src/ruby/ext \
              ${RUBY_DIR}/*/gems/grpc-*/src/ruby/spec \
              ${RUBY_DIR}/*/gems/grpc-*/third_party

            rm -rf ${RUBY_DIR}/*/extensions/*/*/*/mkmf.log \
              ${RUBY_DIR}/*/extensions/*/*/*/gem_make.out

            rm -rf ${RUBY_DIR}/*/gems/*/ext/*.c \
              ${RUBY_DIR}/*/gems/*/ext/*/*.c \
              ${RUBY_DIR}/*/gems/*/ext/*.o \
              ${RUBY_DIR}/*/gems/*/ext/*/*.o

            find ${RUBY_DIR} -name '*.gem' -type f -delete 2> /dev/null || true

            bundle exec ruby -e 'require "pg"; require "grpc"; require "nokogiri"; require "google/protobuf"; require "re2"; puts "native gems still load after prune"'
        - name: generate bootsnap cache
          runs: |
            set -eux -o pipefail

            cp config/secrets.yml.example config/secrets.yml

            mkdir -p /srv/gitlab/bootsnap
            ENABLE_BOOTSNAP=1 BOOTSNAP_CACHE_DIR=/srv/gitlab/bootsnap \
              bundle exec bootsnap precompile --gemfile \
              --exclude '/srv/gitlab/config/.*\.yml|/srv/gitlab/public' .

            test -n "$(find /srv/gitlab/bootsnap -type f -print -quit)"
        - name: prepare outputs
          runs: |
            set -eux -o pipefail

            mkdir -p /var/opt/gitlab/data /var/opt/gitlab/repo \
              /var/opt/gitlab/config /var/opt/gitlab/.upgrade-status
            mkdir -p /srv/gitlab/tmp/backups /srv/gitlab/tmp/backup_tars \
              /srv/gitlab/tmp/sockets /srv/gitlab/tmp/pids
            mkdir -p /srv/gitlab/public/uploads

            mv /srv/gitlab/log /var/log/gitlab
            ln -s /var/log/gitlab /srv/gitlab/log

            cp config/secrets.yml.example config/secrets.yml
            chmod 0600 config/secrets.yml
            chmod o-rwx config/database.yml

            rm -rf /srv/gitlab/.git

            chown -R 0:0 /srv/gitlab

            for d in config tmp public/uploads builds shared; do
              chown -R 1000:1000 "/srv/gitlab/${d}"
            done

            find /srv/gitlab -maxdepth 1 \
              '(' -name '.gitlab_*secret*' -o -name '.gitlab_*token*' ')' -delete

            test "$(stat -c %u /srv/gitlab/app)" = 0
            test "$(stat -c %u /srv/gitlab/bootsnap)" = 0
            test "$(stat -c %u /srv/gitlab/config)" = 1000
            test "$(stat -c %u /srv/gitlab/tmp)" = 1000

            rm -f /srv/gitlab/vendor/bundle/ruby/3.3.0/gems/devfile-0.5.2-*-linux/out/devfile-*-linux

            mkdir -p ${target.dir}/srv ${target.dir}/var/log ${target.dir}/var/opt
            cp -a /srv/gitlab ${target.dir}/srv/
            cp -a /var/log/gitlab ${target.dir}/var/log/
            cp -a /var/opt/gitlab ${target.dir}/var/opt/

            mkdir -p ${target.dir}/home/git/gitlab-shell
            cp /srv/gitlab/GITLAB_SHELL_VERSION ${target.dir}/home/git/gitlab-shell/VERSION
      paths:
        - type: file
          path: ${source.dir}/patch/gem-constraints-19.patch
          uid: 0
          gid: 0
          mode: "0644"
          source: image/gitlab-toolbox/patch/gem-constraints-19.patch
      outputs:
        - source: ${target.dir}/srv/gitlab
          target: /srv/gitlab
          uid: 0
          gid: 0
        - source: ${target.dir}/var/log/gitlab
          target: /var/log/gitlab
          uid: 1000
          gid: 1000
        - source: ${target.dir}/var/opt/gitlab
          target: /var/opt/gitlab
          uid: 1000
          gid: 1000
        - source: ${target.dir}/home/git
          target: /home/git
          uid: 1000
          gid: 1000
    - name: python object storage tools
      work-dir: /opt/gitlab-toolbox
      caches:
        - path: /root/.cache/pip
        - path: /root/.cache/uv
      contents:
        packages:
          - bash
          - base-files
          - ca-certificates
          - ca-certificates-bundle
          - coreutils
          - findutils
          - grep
          - libc6
          - sed
          - python-3.13=3.13.15-2
          - python-3.13-dev=3.13.15-2
          - python-3.13-minimal=3.13.15-2
          - libpython-3.13=3.13.15-2
          - libpython-3.13-dev=3.13.15-2
          - libpython-3.13-minimal=3.13.15-2
          - libpython-3.13-stdlib=3.13.15-2
          - python3-pip
          - python3-pip-whl
          - python3-setuptools
          - python3-setuptools-whl
          - python3-wheel
          - uv
          - libbz2-1.0
          - libc6-dev
          - libcrypt1
          - libdb5.3t64
          - libexpat1
          - libexpat1-dev
          - libffi8
          - libgdbm-compat4t64
          - libgdbm6t64
          - liblzma5
          - libncursesw6
          - libreadline8t64
          - libsqlite3-0
          - libssl3t64
          - libstdc++6
          - libtinfo6
          - libuuid1
          - libzstd1
          - zlib1g
          - binutils
          - build-essential
          - cargo-1.96=1.96.1-0
          - gcc
          - libcurl4t64
          - libffi-dev
          - libgcc-s1
          - libssl-dev
          - libzstd-dev
          - pkg-config
          - rustc-1.96=1.96.0-0
          - zlib1g-dev
      pipeline:
        - name: create virtualenv
          runs: |
            set -eux -o pipefail

            uv venv --python python3.13 /opt/gitlab-toolbox/venv

            /opt/gitlab-toolbox/venv/bin/python --version
        - name: install object storage clients
          privileged: true
          environment:
            VIRTUAL_ENV: /opt/gitlab-toolbox/venv
          runs: |
            set -eux -o pipefail

            uv pip install \
              "awscli==1.44.59" \
              "s3cmd==2.4.0" \
              "gsutil==5.37" \
              "crcmod==1.7"
        - name: install cryptography against system openssl
          privileged: true
          environment:
            OPENSSL_NO_VENDOR: "1"
            OPENSSL_STATIC: "0"
            VIRTUAL_ENV: /opt/gitlab-toolbox/venv
          runs: |
            set -eux -o pipefail

            uv pip install --no-binary cryptography --reinstall-package cryptography \
              "cryptography==46.0.7"
            uv pip install "pyOpenSSL==25.3.0"

            SO="$(find /opt/gitlab-toolbox/venv -path '*/cryptography/hazmat/bindings/_rust*.so' | head -1)"
            test -n "${SO}"
            readelf -d "${SO}" | grep -q 'NEEDED.*libssl'
            readelf -d "${SO}" | grep -q 'NEEDED.*libcrypto'
        - name: expose console scripts
          runs: |
            set -eux -o pipefail

            mkdir -p ${target.dir}/usr/local/bin ${target.dir}/opt/gitlab-toolbox
            cp -a /opt/gitlab-toolbox/venv ${target.dir}/opt/gitlab-toolbox/venv

            for cli in aws s3cmd gsutil; do
              ln -s /opt/gitlab-toolbox/venv/bin/${cli} \
                ${target.dir}/usr/local/bin/${cli}
            done
        - uses: spdx@v1
          with:
            license: Apache-2.0
            name: gitlab-toolbox-object-storage-clients
            purl: pkg:pypi/awscli@1.44.59
            version: 1.44.59
        - uses: spdx@v1
          with:
            license: GPL-2.0-or-later
            name: gitlab-toolbox-s3cmd
