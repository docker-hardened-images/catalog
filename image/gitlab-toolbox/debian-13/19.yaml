  RUBY_VERSION: 3.3.12-63
  RUSTC_VERSION: 1.96.0-0
  S3CMD_VERSION: 2.4.0
  SEMVER_MAJOR_MINOR_VERSION: "19.1"
  SEMVER_MAJOR_VERSION: "19"
  SEMVER_VERSION: 19.1.8
  SOURCE_COMMIT: 25601e798604a50f025102e4598a6884305802c4
  VERSION: 19.1.8
contents:
  repositories:
    - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
  keyring:
    - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
  packages:
    - '!libelogind0'
    - '!mawk'
    - '!original-awk'
