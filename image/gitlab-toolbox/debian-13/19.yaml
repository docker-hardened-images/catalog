    - name: devfile
      work-dir: /go/src/devfile-gem/ext
      caches:
        - path: /go/pkg/mod
      contents:
        packages:
          - bash
          - binutils
          - ca-certificates-bundle
          - coreutils
          - findutils
          - gawk
          - gcc
          - golang-1.26=1.26.8-0
          - libc6-dev
          - sed
        files:
          - url: git+https://gitlab.com/gitlab-org/ruby/gems/devfile-gem.git#0.5.2
            checksum: 1f25dab8010cea3a8e23a498616efe654312e1cf
            path: /go/src/devfile-gem
            spdx:
              name: devfile-gem
              version: 0.5.2
              packages:
                - name: devfile-gem
                  purl: pkg:golang/gitlab-org/ruby/gems/devfile-gem@0.5.2
                  license: MIT
            uid: 0
            gid: 0
      pipeline:
        - name: update go dependencies (19 only)
          uses: go/bump@v2
          with:
            deps:
              - golang.org/x/crypto@v0.53.0
              - github.com/cloudflare/circl@v1.6.4
              - github.com/go-git/go-git/v5@v5.19.2
              - go.opentelemetry.io/otel/sdk@v1.45.0
              - google.golang.org/grpc@v1.85.0-dev.0.20260825072537-93e31b48545e
              - github.com/containerd/containerd@v1.7.36
            download: true
        - name: test
          runs: |
            set -eux -o pipefail

            export GOTOOLCHAIN=local
            CGO_ENABLED=0 go test -short ./... -count=1
        - name: build
          uses: go/build@v1
          with:
            cgo_enabled: 0
            output: ${target.dir}/devfile-binary
            packages: .
        - name: install into gem directory
          runs: |
            set -eux -o pipefail

            MACHINE_ARCH=$(uname -m)
            case "$MACHINE_ARCH" in
              aarch64) GOARCH=arm64 ;;
              x86_64) GOARCH=amd64 ;;
              *)
                echo "Unsupported arch: $MACHINE_ARCH" >&2
                exit 1
                ;;
            esac

            GEM_DIR="${target.dir}/srv/gitlab/vendor/bundle/ruby/3.3.0/gems/devfile-0.5.2-${MACHINE_ARCH}-linux/out"
            mkdir -p "$GEM_DIR"
            mv "${target.dir}/devfile-binary" "$GEM_DIR/devfile-${GOARCH}-linux"

            test -x "$GEM_DIR/devfile-${GOARCH}-linux"
      outputs:
        - source: ${target.dir}/srv/gitlab/vendor/bundle/ruby/3.3.0/gems
          target: /srv/gitlab/vendor/bundle/ruby/3.3.0/gems
          uid: 0
          gid: 0
