    path: /usr/local/bin/scanner-trivy
    uid: 0
    gid: 0
    source: /usr/bin/scanner-trivy
  - type: directory
    path: /home/scanner/.cache
    uid: 65532
    gid: 65532
    mode: "0755"
annotations:
  org.opencontainers.image.description: A minimal Harbor Trivy Adapter image
  org.opencontainers.image.licenses: Apache-2.0
entrypoint:
  - /usr/local/bin/scanner-trivy
ports:
  - 8080/tcp
