# syntax=dhi.io/build:2-debian13

name: Harbor Trivy Adapter 2.12.x
image: dhi.io/harbor-trivy-adapter
variant: runtime
tags:
  - "2.12"
  - 2.12.4
  - 2.12-debian
  - 2.12-debian13
  - 2.12.4-debian
  - 2.12.4-debian13
platforms:
  - linux/amd64
  - linux/arm64
vars:
  COMMIT_SHA: 6b4981d4dd46a20481be5a3a7cdf435bc20f4dcb
  FLAVORED_SUFFIX: ""
  PACKAGE_NAME: harbor-trivy-adapter-2.12
  SCANNER_TRIVY_ADAPTER_SEMVER: 0.32.4
  SCANNER_TRIVY_ADAPTER_VERSION: v0.32.4
  SEMVER_MAJOR_MINOR_VERSION: "2.12"
  SEMVER_MAJOR_VERSION: "2"
  SEMVER_VERSION: 2.12.4
  SUFFIX: ""
  VERSION: 2.12.4-4
contents:
  repositories:
    - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
  keyring:
    - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
  packages:
    - base-files
    - ca-certificates
    - ca-certificates-bundle
    - harbor-trivy-adapter-2.12=2.12.4-4
    - trivy
    - tzdata
accounts:
  run-as: nonroot
  users:
    - name: nonroot
      uid: 65532
      gid: 65532
  groups:
    - name: nonroot
      gid: 65532
      members:
        - nonroot
os-release:
  name: Docker Hardened Images (Debian)
  id: debian
  version-id: "13"
  version-codename: trixie
  pretty-name: Docker Hardened Images/Debian GNU/Linux 13 (trixie)
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
paths:
