# syntax=dhi.io/build:2-debian13

name: Harbor Trivy Adapter 2.13.x (dev)
image: dhi.io/harbor-trivy-adapter
variant: dev
tags:
  - 2.13-dev
  - 2.13.5-dev
  - 2.13-debian-dev
  - 2.13-debian13-dev
  - 2.13.5-debian-dev
  - 2.13.5-debian13-dev
platforms:
  - linux/amd64
  - linux/arm64
vars:
  COMMIT_SHA: ffae54219c89f7f486f17694681232dd70787db1
  FLAVORED_SUFFIX: -dev
  PACKAGE_NAME: harbor-trivy-adapter-2.13
  SCANNER_TRIVY_ADAPTER_SEMVER: 0.35.1
  SCANNER_TRIVY_ADAPTER_VERSION: v0.35.1
  SEMVER_MAJOR_MINOR_VERSION: "2.13"
  SEMVER_MAJOR_VERSION: "2"
  SEMVER_VERSION: 2.13.5
  SUFFIX: -dev
  VERSION: 2.13.5-4
contents:
  repositories:
    - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
  keyring:
    - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
  packages:
    - '!gawk'
    - '!libelogind0'
    - '!original-awk'
    - apt
    - base-files
    - bash
    - ca-certificates
    - ca-certificates-bundle
    - coreutils
    - diffutils
    - dpkg
    - findutils
    - grep
    - harbor-trivy-adapter-2.13-dev=2.13.5-4
    - libc-bin
    - mawk
    - perl-base
    - sed
    - trivy
    - tzdata
    - util-linux
accounts:
  root: true
  run-as: root
  users:
    - name: nonroot
      uid: 65532
      gid: 65532
    - name: _apt
      uid: 42
      gid: 65532
  groups:
    - name: nonroot
      gid: 65532
      members:
        - nonroot
os-release:
  name: Docker Hardened Images (Debian)
  id: debian
  version-id: "13"
  version-codename: trixie
  pretty-name: Docker Hardened Images/Debian GNU/Linux 13 (trixie)
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
environment:
  DEBIAN_FRONTEND: noninteractive
paths:
  - type: directory
    path: /usr/local/bin
    uid: 0
    gid: 0
  - type: symlink
    path: /usr/local/bin/scanner-trivy
    uid: 0
    gid: 0
    source: /usr/bin/scanner-trivy
  - type: directory
    path: /home/scanner/.cache
    uid: 65532
    gid: 65532
    mode: "0755"
annotations:
  org.opencontainers.image.description: A minimal Harbor Trivy Adapter image
  org.opencontainers.image.licenses: Apache-2.0
entrypoint:
  - /usr/local/bin/scanner-trivy
ports:
  - 8080/tcp
