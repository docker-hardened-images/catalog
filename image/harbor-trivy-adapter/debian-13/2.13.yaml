# syntax=dhi.io/build:2-debian13

name: Harbor Trivy Adapter 2.13.x
image: dhi.io/harbor-trivy-adapter
variant: runtime
tags:
  - "2.13"
  - 2.13.6
  - 2.13-debian
  - 2.13-debian13
  - 2.13.6-debian
  - 2.13.6-debian13
platforms:
  - linux/amd64
  - linux/arm64
vars:
  COMMIT_SHA: 4efe985802ed60dfb2813a19ec89c9ce49e5f169
  FLAVORED_SUFFIX: ""
  PACKAGE_NAME: harbor-trivy-adapter-2.13
  SCANNER_TRIVY_ADAPTER_SEMVER: 0.35.1
  SCANNER_TRIVY_ADAPTER_VERSION: v0.35.1
  SEMVER_MAJOR_MINOR_VERSION: "2.13"
  SEMVER_MAJOR_VERSION: "2"
  SEMVER_VERSION: 2.13.6
