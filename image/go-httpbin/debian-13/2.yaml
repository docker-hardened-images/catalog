# syntax=dhi.io/build:2-debian13

name: go-httpbin 2.x
image: dhi.io/go-httpbin
variant: runtime
tags:
  - "2"
  - "2.26"
  - 2.26.0
  - 2-debian
  - 2-debian13
  - 2.26-debian
  - 2.26-debian13
  - 2.26.0-debian
  - 2.26.0-debian13
platforms:
  - linux/amd64
  - linux/arm64
dates:
  release: "2019-01-15"
vars:
  FLAVORED_SUFFIX: ""
  SEMVER_MAJOR_MINOR_VERSION: "2.26"
  SEMVER_MAJOR_VERSION: "2"
  SEMVER_VERSION: 2.26.0
  SUFFIX: ""
  VERSION: 2.26.0-1
contents:
  repositories:
    - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
  keyring:
    - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
  packages:
    - base-files
    - ca-certificates-bundle
    - go-httpbin-2=2.26.0-1
    - tzdata
accounts:
  run-as: nonroot
  users:
    - name: nonroot
      uid: 65532
      gid: 65532
  groups:
    - name: nonroot
      gid: 65532
      members:
        - nonroot
os-release:
  name: Docker Hardened Images (Debian)
  id: debian
  version-id: "13"
  version-codename: trixie
  pretty-name: Docker Hardened Images/Debian GNU/Linux 13 (trixie)
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
paths:
  - type: directory
    path: /usr/local/bin
    uid: 0
    gid: 0
  - type: symlink
    path: /usr/local/bin/go-httpbin
    uid: 0
    gid: 0
    source: /usr/bin/go-httpbin
annotations:
  org.opencontainers.image.description: A minimal go-httpbin HTTP request and response testing service image
  org.opencontainers.image.licenses: MIT
entrypoint:
  - /usr/local/bin/go-httpbin
ports:
  - 8080/tcp
