metadata:
  display-name: Linkerd Controller
  short-description: The Linkerd control plane controller, with its destination, identity, proxy injector and policy controller.
  featured: false
  home-url: https://linkerd.io
  categories:
    - networking
  included-tools:
    - name: linkerd2-controller
      description: Control plane binary with the destination, identity, heartbeat, proxy-injector, sp-validator and service-mirror subcommands.
