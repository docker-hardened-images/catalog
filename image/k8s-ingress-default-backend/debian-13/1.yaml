# syntax=dhi.io/build:2-debian13

name: Kubernetes Ingress Default Backend 1.42.x
image: dhi.io/k8s-ingress-default-backend
variant: runtime
tags:
  - "1"
  - "1.42"
  - 1.42.1
  - 1-debian
  - 1-debian13
  - 1.42-debian
  - 1.42-debian13
  - 1.42.1-debian
  - 1.42.1-debian13
platforms:
  - linux/amd64
  - linux/arm64
dates:
  release: "2026-07-14"
vars:
  FLAVORED_SUFFIX: ""
  SEMVER_MAJOR_MINOR_VERSION: "1.42"
  SEMVER_MAJOR_VERSION: "1"
  SEMVER_VERSION: 1.42.1
  SUFFIX: ""
  VERSION: 1.42.1-1
contents:
  repositories:
    - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
  keyring:
    - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
  packages:
    - base-files
    - ca-certificates-bundle
    - k8s-ingress-default-backend=1.42.1-1
    - tzdata
accounts:
  run-as: "65534"
  users:
    - name: nobody
      uid: 65534
      gid: 65534
  groups:
    - name: nogroup
      gid: 65534
os-release:
  name: Docker Hardened Images (Debian)
  id: debian
  version-id: "13"
  version-codename: trixie
  pretty-name: Docker Hardened Images/Debian GNU/Linux 13 (trixie)
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
paths:
  - type: symlink
    path: /server
    uid: 0
    gid: 0
    source: /usr/bin/k8s-ingress-default-backend
annotations:
  org.opencontainers.image.description: A minimal Kubernetes default backend image
  org.opencontainers.image.licenses: Apache-2.0
entrypoint:
  - /server
