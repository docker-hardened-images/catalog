# syntax=dhi.io/build:2-debian13

name: Kubernetes Ingress Default Backend 1.42.x (dev)
image: dhi.io/k8s-ingress-default-backend
variant: dev
tags:
  - 1-dev
  - 1.42-dev
  - 1.42.1-dev
  - 1-debian-dev
  - 1-debian13-dev
  - 1.42-debian-dev
  - 1.42-debian13-dev
  - 1.42.1-debian-dev
  - 1.42.1-debian13-dev
platforms:
  - linux/amd64
  - linux/arm64
dates:
  release: "2026-07-14"
vars:
  FLAVORED_SUFFIX: -dev
  SEMVER_MAJOR_MINOR_VERSION: "1.42"
  SEMVER_MAJOR_VERSION: "1"
  SEMVER_VERSION: 1.42.1
  SUFFIX: -dev
  VERSION: 1.42.1-1
contents:
  repositories:
    - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
  keyring:
    - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
  packages:
    - '!gawk'
    - '!libelogind0'
    - '!original-awk'
    - apt
    - base-files
    - bash
    - ca-certificates
    - ca-certificates-bundle
    - coreutils
    - diffutils
    - dpkg
    - findutils
    - grep
    - k8s-ingress-default-backend-dev=1.42.1-1
    - libc-bin
    - mawk
    - perl-base
    - sed
    - tzdata
    - util-linux
accounts:
  root: true
  run-as: root
  users:
    - name: nobody
      uid: 65534
      gid: 65534
    - name: _apt
      uid: 42
      gid: 65532
  groups:
    - name: nogroup
      gid: 65534
os-release:
  name: Docker Hardened Images (Debian)
  id: debian
  version-id: "13"
  version-codename: trixie
  pretty-name: Docker Hardened Images/Debian GNU/Linux 13 (trixie)
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
environment:
  DEBIAN_FRONTEND: noninteractive
paths:
  - type: symlink
    path: /server
    uid: 0
    gid: 0
    source: /usr/bin/k8s-ingress-default-backend
annotations:
  org.opencontainers.image.description: A minimal Kubernetes default backend image
  org.opencontainers.image.licenses: Apache-2.0
entrypoint:
  - /server
