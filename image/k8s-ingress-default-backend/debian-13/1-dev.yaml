# syntax=dhi.io/build:2-debian13

name: Kubernetes Ingress Default Backend 1.41.x (dev)
image: dhi.io/k8s-ingress-default-backend
variant: dev
tags:
  - 1-dev
  - 1.41-dev
  - 1.41.1-dev
  - 1-debian-dev
  - 1-debian13-dev
  - 1.41-debian-dev
  - 1.41-debian13-dev
  - 1.41.1-debian-dev
  - 1.41.1-debian13-dev
platforms:
  - linux/amd64
  - linux/arm64
dates:
  release: "2026-07-14"
vars:
  COMMIT_SHA: 361e4187eb3accef6b4182076d67c04c0a6d46c9
  SEMVER_MAJOR_MINOR_VERSION: "1.41"
  SEMVER_MAJOR_VERSION: "1"
  SEMVER_VERSION: 1.41.1
  VERSION: 1.41.1
contents:
  repositories:
    - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
  keyring:
    - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
  packages:
    - '!gawk'
    - '!libelogind0'
    - '!original-awk'
    - apt
    - base-files
    - bash
    - ca-certificates
    - ca-certificates-bundle
    - coreutils
    - diffutils
    - dpkg
    - findutils
    - grep
    - libc-bin
    - mawk
    - perl-base
    - sed
    - tzdata
    - util-linux
  builds:
    - name: k8s-ingress-default-backend
      work-dir: /go/src/k8s.io/ingress-gce
      caches:
        - path: /go/pkg/mod
        - path: /root/.cache/go-build
      contents:
        packages:
          - bash
          - ca-certificates-bundle
          - coreutils
          - golang-1.26
          - findutils
          - mawk
          - sed
        files:
          - url: git+https://github.com/kubernetes/ingress-gce.git#v1.41.1
            checksum: 361e4187eb3accef6b4182076d67c04c0a6d46c9
            path: /go/src/k8s.io/ingress-gce
            spdx:
              name: k8s-ingress-default-backend
              version: 1.41.1
              packages:
                - name: k8s-ingress-default-backend
                  purl: pkg:golang/k8s.io/ingress-gce/cmd/404-server@1.41.1
                  license: Apache-2.0
            uid: 0
            gid: 0
      pipeline:
        - name: update go dependencies
          uses: go/bump@v2
          with:
            deps: []
            download: true
        - name: test
          runs: |
            set -eux -o pipefail

            if [ "${target.fips}" = "true" ]; then
              export GODEBUG=fips140=on
            fi

            CGO_ENABLED=0 go test ./cmd/404-server/...
        - name: build
          uses: go/build@v1
          with:
            cgo_enabled: 0
            ldflags:
              - -s
              - -w
            output: ${target.dir}/server
            packages: ./cmd/404-server
      outputs:
        - source: ${target.dir}/server
          target: /server
          uid: 0
          gid: 0
        - source: /opt/docker/sbom/k8s-ingress-default-backend
          target: /opt/docker/sbom/k8s-ingress-default-backend
          uid: 0
          gid: 0
accounts:
  root: true
  run-as: root
  users:
    - name: nobody
      uid: 65534
      gid: 65534
    - name: _apt
      uid: 42
      gid: 65532
  groups:
    - name: nogroup
      gid: 65534
os-release:
  name: Docker Hardened Images (Debian)
  id: debian
  version-id: "13"
  version-codename: trixie
  pretty-name: Docker Hardened Images/Debian GNU/Linux 13 (trixie)
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
environment:
  DEBIAN_FRONTEND: noninteractive
annotations:
  org.opencontainers.image.description: A minimal Kubernetes default backend image
  org.opencontainers.image.licenses: Apache-2.0
entrypoint:
  - /server
