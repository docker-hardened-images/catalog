# syntax=dhi.io/build:2-debian13

name: Linkerd Web 26.x (dev)
image: dhi.io/linkerd-web
variant: dev
tags:
  - 26-dev
  - 26.11-dev
  - 26.11.2-dev
  - 26-debian-dev
  - 26-debian13-dev
  - 26.11-debian-dev
  - edge-26.11.2-dev
  - 26.11-debian13-dev
  - 26.11.2-debian-dev
  - 26.11.2-debian13-dev
  - edge-26.11.2-debian-dev
  - edge-26.11.2-debian13-dev
platforms:
  - linux/amd64
  - linux/arm64
dates:
  release: "2018-09-18"
vars:
  EDGE_VERSION: 26.11.2
  FLAVORED_SUFFIX: -dev
  SEMVER_MAJOR_MINOR_VERSION: "26.11"
  SEMVER_MAJOR_VERSION: "26"
  SEMVER_VERSION: 26.11.2
  SUFFIX: -dev
  VERSION: 26.11.2-0
contents:
  repositories:
    - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
  keyring:
    - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
  packages:
    - '!gawk'
    - '!libelogind0'
    - '!original-awk'
    - apt
    - base-files
    - bash
    - ca-certificates
    - ca-certificates-bundle
    - coreutils
    - diffutils
    - dpkg
    - findutils
    - grep
    - libc-bin
    - linkerd-web-dev=26.11.2-0
    - mawk
    - perl-base
    - sed
    - tzdata
    - util-linux
accounts:
  root: true
  run-as: root
  users:
    - name: nonroot
      uid: 65532
      gid: 65532
    - name: _apt
      uid: 42
      gid: 65532
  groups:
    - name: nonroot
      gid: 65532
      members:
        - nonroot
os-release:
  name: Docker Hardened Images (Debian)
  id: debian
  version-id: "13"
  version-codename: trixie
  pretty-name: Docker Hardened Images/Debian GNU/Linux 13 (trixie)
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
work-dir: /linkerd
environment:
  DEBIAN_FRONTEND: noninteractive
  LINKERD_CONTAINER_VERSION_OVERRIDE: edge-26.11.2
paths:
  - type: directory
    path: /linkerd
    uid: 0
    gid: 0
    mode: "0755"
  - type: symlink
    path: /linkerd/web
    uid: 0
    gid: 0
    source: /usr/bin/linkerd-web
  - type: symlink
    path: /linkerd/templates
    uid: 0
    gid: 0
    source: /usr/share/linkerd-web/templates
  - type: symlink
    path: /linkerd/app
    uid: 0
    gid: 0
    source: /usr/share/linkerd-web/app
  - type: symlink
    path: /linkerd/LICENSE
    uid: 0
    gid: 0
    source: /usr/share/linkerd-web/LICENSE
annotations:
  org.opencontainers.image.description: A minimal Linkerd web image
  org.opencontainers.image.licenses: Apache-2.0
entrypoint:
  - ./web
ports:
  - 8084/tcp
  - 9994/tcp
