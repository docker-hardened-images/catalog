  - 26.11-alpine-dev
  - 26-alpine3.24-dev
  - 26.11.2-alpine-dev
  - 26.11-alpine3.24-dev
  - 26.11.2-alpine3.24-dev
  - edge-26.11.2-alpine-dev
  - edge-26.11.2-alpine3.24-dev
platforms:
  - linux/amd64
  - linux/arm64
dates:
