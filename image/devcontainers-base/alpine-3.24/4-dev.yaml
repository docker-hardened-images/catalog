accounts:
  root: true
  run-as: root
  users:
    - name: nonroot
      uid: 65532
      gid: 65532
    - name: vscode
      uid: 1000
      gid: 1000
  groups:
    - name: nonroot
      gid: 65532
      members:
        - nonroot
    - name: vscode
      gid: 1000
      members:
        - vscode
