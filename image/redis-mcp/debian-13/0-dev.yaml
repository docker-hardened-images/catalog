# syntax=dhi.io/build:2-debian13

name: Redis MCP Server 0.x (dev)
image: dhi.io/redis-mcp
variant: dev
tags:
  - 0-dev
  - 0.5-dev
  - 0.5.1-dev
  - 0-debian-dev
  - 0-debian13-dev
  - 0.5-debian-dev
  - 0.5-debian13-dev
  - 0.5.1-debian-dev
  - 0.5.1-debian13-dev
platforms:
  - linux/amd64
  - linux/arm64
dates:
  release: "2026-06-23"
vars:
  COMMIT_SHA: 11e67e44358cd6410d5a7e615a29539ccd71a045
  SEMVER_MAJOR_MINOR_VERSION: "0.5"
  SEMVER_MAJOR_VERSION: "0"
  SEMVER_VERSION: 0.5.1
  VERSION: 0.5.1-3
contents:
  repositories:
    - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
  keyring:
    - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
  packages:
    - '!gawk'
    - '!libelogind0'
    - '!original-awk'
    - apt
    - base-files
    - bash
    - ca-certificates-bundle
    - coreutils
    - diffutils
    - dpkg
    - findutils
    - grep
    - libc-bin
    - mawk
    - perl-base
    - python-3.14
    - redis-mcp=0.5.1-3
    - sed
    - tzdata
    - util-linux
  builds:
    - name: server.json
      contents:
        packages:
          - bash
          - sed
      pipeline:
        - runs: |
            set -eux -o pipefail

            sed -i "s/_VERSION_/0.5.1/g" "${source.dir}/config/server.json"
      paths:
        - type: file
          path: ${source.dir}/config/server.json
          uid: 0
          gid: 0
          source: image/redis-mcp/config/server.json
      attestations:
        - predicate-type: https://modelcontextprotocol.io/server.json/v1
          source: ${source.dir}/config/server.json
accounts:
  root: true
  run-as: root
  users:
    - name: nonroot
      uid: 65532
      gid: 65532
    - name: _apt
      uid: 42
      gid: 65532
  groups:
    - name: nonroot
      gid: 65532
      members:
        - nonroot
os-release:
  name: Docker Hardened Images (Debian)
  id: debian
  version-id: "13"
  version-codename: trixie
  pretty-name: Docker Hardened Images/Debian GNU/Linux 13 (trixie)
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
environment:
  DEBIAN_FRONTEND: noninteractive
  PATH: /app/.venv/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
paths:
  - type: directory
    path: /app
    uid: 0
    gid: 0
  - type: symlink
    path: /app/.venv
    uid: 0
    gid: 0
    source: /usr/lib/redis-mcp
annotations:
  org.opencontainers.image.description: A minimal Redis MCP Server image
  org.opencontainers.image.licenses: MIT
labels:
  io.modelcontextprotocol.server.name: io.github.redis/mcp-redis
entrypoint:
  - redis-mcp-server
