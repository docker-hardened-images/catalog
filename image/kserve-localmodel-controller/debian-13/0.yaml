name: KServe LocalModel Controller 0.x
image: dhi.io/kserve-localmodel-controller
variant: runtime
tags:
  - "0"
  - "0.20"
  - 0.20.0
  - 0-debian
  - 0-debian13
  - 0.20-debian
  - 0.20-debian13
  - 0.20.0-debian
  - 0.20.0-debian13
platforms:
  - linux/amd64
  - linux/arm64
dates:
  release: "2026-06-14"
vars:
  COMMIT_SHA: 1fb781055dd1567164358233e1125142ca6ef1fe
  SEMVER_MAJOR_MINOR_VERSION: "0.20"
  SEMVER_MAJOR_VERSION: "0"
  SEMVER_VERSION: 0.20.0
  VERSION: 0.20.0
contents:
  repositories:
    - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
  keyring:
    - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
  packages:
    - base-files
    - ca-certificates-bundle
    - tzdata
  builds:
    - name: kserve-localmodel-controller
      work-dir: /go/src/github.com/kserve/kserve
      caches:
        - path: /go/pkg/mod
      contents:
        packages:
          - bash
          - ca-certificates-bundle
          - coreutils
          - golang-1.26
          - findutils
          - mawk
          - sed
        files:
          - url: git+https://github.com/kserve/kserve.git#v0.20.0
            checksum: 1fb781055dd1567164358233e1125142ca6ef1fe
            path: /go/src/github.com/kserve/kserve
            spdx:
              name: kserve-localmodel-controller
              version: 0.20.0
              packages:
                - name: kserve
                  purl: pkg:golang/github.com/kserve/kserve@0.20.0
                  license: Apache-2.0
            uid: 0
            gid: 0
      pipeline:
        - name: go dependencies
          uses: go/bump@v1
          work-dir: /go/src/github.com/kserve/kserve
          with:
            deps:
              - golang.org/x/crypto@v0.52.0
              - golang.org/x/net@v0.55.0
              - github.com/go-jose/go-jose/v4@v4.1.4
              - github.com/kedacore/keda/v2@v2.18.3
              - go.opentelemetry.io/otel@v1.44.0
              - go.opentelemetry.io/otel/sdk@v1.44.0
              - google.golang.org/grpc@v1.82.1
            download: true
            replaces:
              - google.golang.org/grpc=google.golang.org/grpc@v1.82.1
        - name: test
          privileged: true
          runs: |
            set -eux -o pipefail

            CGO_ENABLED=0 go test -C ./cmd/localmodel ./...
        - name: build
          uses: go/build@v1
          work-dir: /go/src/github.com/kserve/kserve
          with:
            output: ${target.dir}/usr/local/bin/localmodel
            packages: ./cmd/localmodel
      outputs:
        - source: ${target.dir}/usr/local/bin/localmodel
          target: /usr/local/bin/localmodel
          uid: 0
          gid: 0
          mode: "0755"
        - source: /opt/docker/sbom/kserve-localmodel-controller
          target: /opt/docker/sbom/kserve-localmodel-controller
          uid: 0
          gid: 0
accounts:
  run-as: nonroot
  users:
    - name: nonroot
      uid: 65532
      gid: 65532
  groups:
    - name: nonroot
      gid: 65532
      members:
        - nonroot
os-release:
  name: Docker Hardened Images (Debian)
  id: debian
  version-id: "13"
  version-codename: trixie
  pretty-name: Docker Hardened Images/Debian GNU/Linux 13 (trixie)
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
paths:
  - type: symlink
    path: /manager
    uid: 0
    gid: 0
    source: /usr/local/bin/localmodel
annotations:
  org.opencontainers.image.description: A minimal KServe LocalModel Controller image
  org.opencontainers.image.licenses: Apache-2.0
entrypoint:
