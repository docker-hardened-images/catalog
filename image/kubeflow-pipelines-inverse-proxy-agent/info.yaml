metadata:
  display-name: Kubeflow Pipelines - Inverse Proxy Agent
  short-description: The Kubeflow Pipelines inverse proxy agent connects the Pipelines UI in a Kubernetes cluster to a Google Cloud inverting proxy, so the UI can be reached without exposing a public endpoint.
  featured: false
  home-url: https://www.kubeflow.org/docs/components/pipelines/
  categories:
    - machine-learning-and-ai
  included-tools:
    - name: proxy-forwarding-agent
      description: The inverting-proxy agent, which polls the proxy for requests and forwards them to the Pipelines UI service.
    - name: gcloud
      description: Google Cloud CLI, used by the launcher to activate a service account and mint access tokens.
    - name: kubectl
      description: Kubernetes CLI, used by the launcher to read and update the inverse-proxy-config ConfigMap.
