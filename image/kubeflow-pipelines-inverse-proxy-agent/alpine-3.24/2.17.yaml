# syntax=dhi.io/build:2-alpine3.24

name: Kubeflow Pipelines - Inverse Proxy Agent 2.x
image: dhi.io/kubeflow-pipelines-inverse-proxy-agent
variant: runtime
tags:
  - 2.17-alpine
  - 2.17.3-alpine
  - 2.17-alpine3.24
  - 2.17.3-alpine3.24
platforms:
  - linux/amd64
  - linux/arm64
dates:
  release: "2026-07-09"
vars:
  KUBECTL_MAJOR_MINOR_VERSION: "1.36"
  PKG_SUFFIX: ""
  SEMVER_MAJOR_MINOR_VERSION: "2.17"
  SEMVER_MAJOR_VERSION: "2"
  SEMVER_VERSION: 2.17.3
  VERSION: 2.17.3-r0
contents:
  repositories:
    - https://dhi.io/apk/alpine/v3.24/main
    - https://dl-cdn.alpinelinux.org/alpine/v3.24/main
    - https://dl-cdn.alpinelinux.org/alpine/v3.24/community
  keyring:
    - https://dhi.io/keyring/dhi-apk@docker-0F81AD7700D99184.rsa.pub
  packages:
    - alpine-baselayout-data
    - bash
    - busybox
    - ca-certificates-bundle
    - cloud-sdk
    - coreutils
    - curl
    - jq
    - kubectl-1.36
    - kubeflow-pipelines-inverse-proxy-agent-2.17=2.17.3-r0
    - py3.13-requests
    - python-3.13
    - tzdata
    - wget
accounts:
  run-as: nonroot
  users:
    - name: nonroot
      uid: 65532
      gid: 65532
  groups:
    - name: nonroot
      gid: 65532
      members:
        - nonroot
os-release:
  name: Docker Hardened Images (Alpine)
  id: alpine
  version-id: "3.24"
  pretty-name: Docker Hardened Images/Alpine Linux v3.24
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
work-dir: /opt/proxy
environment:
  CLOUDSDK_PYTHON: /usr/bin/python3
  DEBUG: "false"
  HEALTH_CHECK_INTERVAL_SECONDS: "0"
  HEALTH_CHECK_PATH: /
  HEALTH_CHECK_UNHEALTHY_THRESHOLD: "2"
  PATH: /opt/proxy-venv/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin:/usr/local/gcloud/google-cloud-sdk/bin
  PROXY_TIMEOUT: 60s
  VIRTUAL_ENV: /opt/proxy-venv
paths:
  - type: directory
    path: /opt
    uid: 0
    gid: 0
  - type: directory
    path: /opt/bin
    uid: 0
    gid: 0
  - type: directory
    path: /opt/proxy
    uid: 0
    gid: 0
  - type: emptyfile
    path: /opt/proxy/proxy-agent-config.json
    uid: 65532
    gid: 65532
    mode: "0644"
  - type: symlink
    path: /opt/proxy/attempt-register-vm-on-proxy.sh
    uid: 0
    gid: 0
    source: /usr/lib/kubeflow-pipelines-inverse-proxy-agent/attempt-register-vm-on-proxy.sh
  - type: symlink
    path: /opt/proxy/get_proxy_url.py
    uid: 0
    gid: 0
    source: /usr/lib/kubeflow-pipelines-inverse-proxy-agent/get_proxy_url.py
  - type: symlink
    path: /opt/proxy-venv
    uid: 0
    gid: 0
    source: /usr/lib/kubeflow-pipelines-inverse-proxy-agent/venv
  - type: symlink
    path: /opt/bin/proxy-forwarding-agent
    uid: 0
    gid: 0
    source: /usr/bin/proxy-forwarding-agent
  - type: directory
    path: /usr/local/bin
    uid: 0
    gid: 0
  - type: symlink
    path: /usr/local/bin/kubectl
    uid: 0
    gid: 0
    source: /usr/bin/kubectl
  - type: directory
    path: /usr/local/gcloud
    uid: 0
    gid: 0
  - type: symlink
    path: /usr/local/gcloud/google-cloud-sdk
    uid: 0
    gid: 0
    source: /usr/lib/google-cloud-sdk
  - type: directory
    path: /home/nonroot/.config/gcloud
    uid: 65532
    gid: 65532
    mode: "0755"
annotations:
  org.opencontainers.image.description: A minimal Kubeflow Pipelines inverse proxy agent image
  org.opencontainers.image.licenses: Apache-2.0
cmd:
  - /bin/sh
  - -c
  - /opt/proxy/attempt-register-vm-on-proxy.sh
