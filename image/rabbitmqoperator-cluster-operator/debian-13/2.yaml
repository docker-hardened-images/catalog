# syntax=dhi.io/build:2-debian13

name: RabbitMQ Cluster Operator 2.x
image: dhi.io/rabbitmqoperator-cluster-operator
variant: runtime
tags:
  - "2"
  - "2.23"
  - 2.23.3
  - 2-debian
  - 2-debian13
  - 2.23-debian
  - 2.23-debian13
  - 2.23.3-debian
  - 2.23.3-debian13
platforms:
  - linux/amd64
  - linux/arm64
dates:
  release: "2022-09-22"
vars:
  FLAVORED_SUFFIX: ""
  SEMVER_MAJOR_MINOR_VERSION: "2.23"
  SEMVER_MAJOR_VERSION: "2"
  SEMVER_VERSION: 2.23.3
  SUFFIX: ""
  VERSION: 2.23.3-0
contents:
  repositories:
    - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
  keyring:
    - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
  packages:
    - base-files
    - ca-certificates-bundle
    - rabbitmqoperator-cluster-operator-2=2.23.3-0
    - tzdata
accounts:
  run-as: "65532"
  users:
    - name: "65532"
      uid: 65532
      gid: 65532
  groups:
    - name: nonroot
      gid: 65532
      members:
        - "65532"
os-release:
  name: Docker Hardened Images (Debian)
  id: debian
  version-id: "13"
  version-codename: trixie
  pretty-name: Docker Hardened Images/Debian GNU/Linux 13 (trixie)
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
work-dir: /
paths:
  - type: symlink
    path: /manager
    uid: 0
    gid: 0
    source: /usr/bin/manager
annotations:
  org.opencontainers.image.description: A minimal RabbitMQ Cluster Operator image
  org.opencontainers.image.licenses: MPL-2.0
entrypoint:
  - /manager
ports:
  - 8080/tcp
  - 8081/tcp
  - 9443/tcp
