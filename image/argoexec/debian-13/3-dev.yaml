# syntax=dhi.io/build:2-debian13

name: Argo executor 3.7.x (dev)
image: dhi.io/argoexec
variant: dev
tags:
  - 3-dev
  - 3.7-dev
  - 3.7.18-dev
  - 3-debian-dev
  - 3-debian13-dev
  - 3.7-debian-dev
  - 3.7-debian13-dev
  - 3.7.18-debian-dev
  - 3.7.18-debian13-dev
platforms:
  - linux/amd64
  - linux/arm64
dates:
  release: "2025-10-15"
vars:
  FLAVORED_SUFFIX: -dev
  SEMVER_MAJOR_MINOR_VERSION: "3.7"
  SEMVER_MAJOR_VERSION: "3"
  SEMVER_VERSION: 3.7.18
  SUFFIX: -dev
  VERSION: 3.7.18-2
contents:
  repositories:
    - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
  keyring:
    - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
  packages:
    - '!gawk'
    - '!libelogind0'
    - '!original-awk'
    - apt
    - argoexec-3-dev=3.7.18-2
    - base-files
    - bash
    - ca-certificates
    - ca-certificates-bundle
    - coreutils
    - diffutils
    - dpkg
    - findutils
    - grep
    - libc-bin
    - mawk
    - perl-base
    - sed
    - tzdata
    - util-linux
  builds:
    - name: argoexec-sbom
      contents:
        packages:
          - bash
          - coreutils
      pipeline:
        - uses: spdx@v1
          with:
            license: Apache-2.0
            name: argoexec
            purl: pkg:golang/github.com/argoproj/argo-workflows@3.7.18
            version: 3.7.18
      outputs:
        - source: /opt/docker/sbom/argoexec
          target: /opt/docker/sbom/argoexec
          uid: 0
          gid: 0
accounts:
  root: true
  run-as: root
  users:
    - name: argoexec
      uid: 8737
      gid: 8737
    - name: _apt
      uid: 42
      gid: 65532
  groups:
    - name: argoexec
      gid: 8737
      members:
        - argoexec
os-release:
  name: Docker Hardened Images (Debian)
  id: debian
  version-id: "13"
  version-codename: trixie
  pretty-name: Docker Hardened Images/Debian GNU/Linux 13 (trixie)
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
environment:
  DEBIAN_FRONTEND: noninteractive
paths:
  - type: directory
    path: /usr/local/bin
    uid: 0
    gid: 0
  - type: symlink
    path: /usr/local/bin/argoexec
    uid: 0
    gid: 0
    source: /usr/bin/argoexec
annotations:
  org.opencontainers.image.description: A minimal Argo executor image
  org.opencontainers.image.licenses: Apache-2.0
entrypoint:
  - argoexec
