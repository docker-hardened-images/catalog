# syntax=dhi.io/build:2-debian13

name: Apache Solr 10.0.x (dev)
image: dhi.io/solr
variant: dev
tags:
  - 10-dev
  - 10.0-dev
  - 10.0.0-dev
  - 10-debian-dev
  - 10-debian13-dev
  - 10.0-debian-dev
  - 10.0-debian13-dev
  - 10.0.0-debian-dev
  - 10.0.0-debian13-dev
platforms:
  - linux/amd64
  - linux/arm64
dates:
  release: "2026-03-03"
vars:
  COMMIT_SHA: 6c6c48a6f78486130682ea9c1f7a2723af5a87be
  GRADLE_REFERENCE: dhi/gradle:8.14.5-jdk21-debian13-dev@sha256:0fd5d22470c43e169040576c1b5b8e7c51f59a3ee1a1ae9055f2220975fdd460
  GRADLE_VERSION: 8.14.5
  JAVA_REFERENCE: dhi/eclipse-temurin:21.0.12.8-debian13@sha256:0f8d869a57951cbd51a9e346b7c57decde437f365faab227c818232f7a44045d
  JAVA_VERSION: 21.0.12.8
  SEMVER_MAJOR_MINOR_VERSION: "10.0"
  SEMVER_MAJOR_VERSION: "10"
  SEMVER_VERSION: 10.0.0
  SOLR_MAJOR_VERSION: "10"
  VERSION: 10.0.0
contents:
  packages:
    - '!gawk'
    - '!libelogind0'
    - '!mawk'
    - '!original-awk'
    - apt
    - base-files
    - bash
    - ca-certificates
    - coreutils
    - diffutils
    - dpkg
    - findutils
    - grep
    - libc-bin
    - mawk
    - perl-base
    - procps
    - sed
    - tini
    - tzdata
    - util-linux
  builds:
    - name: solr
      uses: dhi.io/gradle:8.14.5-jdk21-debian13-dev@sha256:0fd5d22470c43e169040576c1b5b8e7c51f59a3ee1a1ae9055f2220975fdd460
      work-dir: ${source.dir}/solr
      contents:
        packages:
          - bash
          - coreutils
          - findutils
          - grep
          - gzip
          - libstdc++6
          - patch
          - sed
          - tar
        files:
          - url: git+https://github.com/apache/solr.git#releases/solr/10.0.0
            checksum: 6c6c48a6f78486130682ea9c1f7a2723af5a87be
            path: ${source.dir}/solr
            spdx:
              name: solr
              version: 10.0.0
              packages:
                - name: solr
                  purl: pkg:github/apache/solr@10.0.0
                  license: Apache-2.0
            uid: 0
            gid: 0
      pipeline:
        - name: strip develocity
          runs: |
            set -eux -o pipefail

            sed -i \
              -e "/id 'com\.gradle\.develocity'/d" \
              -e "/id 'com\.gradle\.common-custom-user-data-gradle-plugin'/d" \
              -e "/apply from: file('gradle\/develocity\.gradle')/d" \
              settings.gradle
            sed -i \
              -e "/apply from: file('gradle\/testing\/retry-test\.gradle')/d" \
              build.gradle
        - name: mirror maven central
          runs: |
            set -eux -o pipefail

            MIRROR='https://maven-central.storage-download.googleapis.com/maven2/'
            find . -type f -name '*.gradle' -print0 | xargs -0 sed -i \
              -e "s|mavenCentral()|maven { url '${MIRROR}' }|g" \
              -e "s|gradlePluginPortal()|maven { url '${MIRROR}' }; gradlePluginPortal()|g"
        - name: inject pluginManagement for included builds
          runs: |
            set -eux -o pipefail

            MIRROR='https://maven-central.storage-download.googleapis.com/maven2/'
            PM_BLOCK="pluginManagement { repositories { maven { url '${MIRROR}' }; gradlePluginPortal() } }"
            for s in build-tools/missing-doclet/settings.gradle build-tools/build-infra/settings.gradle; do
              if [ -f "$s" ]; then sed -i "1i ${PM_BLOCK}" "$s"; fi
            done
        - name: pin cve-remediated dependency versions (10.x)
          runs: |
            set -eux -o pipefail

            expect() {
              local file="$1" pattern="$2" desc="$3"
              if ! grep -qE "$pattern" "$file"; then
                echo "ERROR: ${desc} not found in ${file}; refresh the pin step." >&2
                exit 1
              fi
            }

            expect gradle/libs.versions.toml '^netty = ' 'netty alias'
            sed -i 's|^netty = ".*"$|netty = "4.2.15.Final"|' gradle/libs.versions.toml
            expect gradle/libs.versions.toml '^netty-tcnative = ' 'netty-tcnative alias'
            sed -i 's|^netty-tcnative = ".*"$|netty-tcnative = "2.0.74.Final"|' gradle/libs.versions.toml
            expect gradle/libs.versions.toml '^apache-zookeeper = ' 'apache-zookeeper alias'
            sed -i 's|^apache-zookeeper = ".*"$|apache-zookeeper = "3.9.5"|' gradle/libs.versions.toml
            expect gradle/libs.versions.toml '^eclipse-jetty = ' 'eclipse-jetty alias'
            sed -i 's|^eclipse-jetty = ".*"$|eclipse-jetty = "12.0.36"|' gradle/libs.versions.toml
            expect gradle/libs.versions.toml '^fasterxml = ' 'fasterxml alias'
            sed -i 's|^fasterxml = ".*"$|fasterxml = "2.21.6"|' gradle/libs.versions.toml
            expect gradle/libs.versions.toml '^apache-log4j = ' 'apache-log4j alias'
            sed -i 's|^apache-log4j = ".*"$|apache-log4j = "2.25.5"|' gradle/libs.versions.toml
            expect gradle/libs.versions.toml '^opentelemetry = ' 'opentelemetry alias'
            sed -i 's|^opentelemetry = ".*"$|opentelemetry = "1.62.0"|' gradle/libs.versions.toml
            expect gradle/libs.versions.toml '^opentelemetry-prometheus = ' 'opentelemetry-prometheus alias'
            sed -i 's|^opentelemetry-prometheus = ".*"$|opentelemetry-prometheus = "1.62.0-alpha"|' gradle/libs.versions.toml

            LOCKS=$(find . -name 'gradle.lockfile')
            test -n "$LOCKS"
            grep -qE '^io\.netty:netty-buffer:4\.2\.6\.Final=' $LOCKS \
              || {
                echo "ERROR: io.netty:netty-* at 4.2.6.Final not found in any gradle.lockfile" >&2
                exit 1
              }
            grep -qE '^io\.netty:netty-tcnative-classes:2\.0\.70\.Final=' $LOCKS \
              || {
                echo "ERROR: io.netty:netty-tcnative-* at 2.0.70.Final not found in any gradle.lockfile" >&2
                exit 1
              }
            grep -qE '^org\.apache\.zookeeper:zookeeper:3\.9\.4=' $LOCKS \
              || {
                echo "ERROR: org.apache.zookeeper:zookeeper at 3.9.4 not found in any gradle.lockfile" >&2
                exit 1
              }
            grep -qE '^org\.eclipse\.jetty:jetty-http:12\.0\.27=' $LOCKS \
              || {
                echo "ERROR: org.eclipse.jetty:jetty-http at 12.0.27 not found in any gradle.lockfile" >&2
                exit 1
              }
            grep -qE '^com\.fasterxml\.jackson\.core:jackson-databind:2\.20\.0=' $LOCKS \
              || {
                echo "ERROR: com.fasterxml.jackson.core:jackson-databind at 2.20.0 not found in any gradle.lockfile" >&2
                exit 1
              }
            grep -qE '^com\.fasterxml\.jackson\.core:jackson-annotations:2\.20=' $LOCKS \
              || {
                echo "ERROR: com.fasterxml.jackson.core:jackson-annotations at 2.20 (bare) not found in any gradle.lockfile" >&2
                exit 1
              }
            grep -qE '^org\.apache\.logging\.log4j:log4j-core:2\.25\.3=' $LOCKS \
              || {
                echo "ERROR: org.apache.logging.log4j:log4j-core at 2.25.3 not found in any gradle.lockfile" >&2
                exit 1
              }
            grep -qE '^io\.opentelemetry:opentelemetry-api:1\.56\.0=' $LOCKS \
              || {
                echo "ERROR: io.opentelemetry:opentelemetry-api at 1.56.0 not found in any gradle.lockfile" >&2
                exit 1
              }
            find . -name 'gradle.lockfile' -print0 | xargs -0 sed -i \
              -e 's|^\(io\.netty:netty[a-z0-9-]*:\)4\.2\.6\.Final\(=\)|\14.2.15.Final\2|' \
              -e 's|^\(io\.netty:netty-tcnative[a-z0-9-]*:\)2\.0\.70\.Final\(=\)|\12.0.74.Final\2|' \
              -e 's|^\(org\.apache\.zookeeper:zookeeper[a-z-]*:\)3\.9\.4\(=\)|\13.9.5\2|' \
              -e 's|^\(org\.eclipse\.jetty[a-z0-9.]*:[a-z][a-z0-9-]*:\)12\.0\.27\(=\)|\112.0.36\2|' \
              -e 's|^\(com\.fasterxml\.jackson[^:]*:[^:]*:\)2\.20\.0\(=\)|\12.21.6\2|' \
              -e 's|^\(com\.fasterxml\.jackson[^:]*:[^:]*:\)2\.20\(=\)|\12.21\2|' \
              -e 's|^\(org\.apache\.logging\.log4j:[^:]*:\)2\.25\.3\(=\)|\12.25.5\2|' \
              -e 's|^\(io\.opentelemetry:[^:]*:\)1\.56\.0-alpha\(=\)|\11.62.0-alpha\2|' \
              -e 's|^\(io\.opentelemetry:[^:]*:\)1\.56\.0\(=\)|\11.62.0\2|'
        - name: build solr distribution
          privileged: true
          runs: |
            set -eux -o pipefail

            ./gradlew \
              -Pversion.release=10.0.0 \
              :solr:packaging:assemble \
              --no-daemon \
              --console=plain \
              --warning-mode=summary
        - name: extract distribution
          runs: |
            set -eux -o pipefail

            mkdir -p "${target.dir}/opt/solr"
            tarball=$(find solr/packaging/build/distributions -maxdepth 1 -name "solr-*.tgz" ! -name "*-src.tgz" ! -name "*-slim.tgz" -print -quit)
            test -n "$tarball"
            tar -xzf "$tarball" --strip-components=1 -C "${target.dir}/opt/solr"
            rm -rf \
              "${target.dir}/opt/solr/modules" \
              "${target.dir}/opt/solr/prometheus-exporter" \
              "${target.dir}/opt/solr/cross-dc-manager"

            mkdir -p "${target.dir}/etc/default"
            cp "${target.dir}/opt/solr/bin/solr.in.sh" "${target.dir}/etc/default/solr.in.sh"
      outputs:
        - source: ${target.dir}/opt/solr
          target: /opt/solr
          uid: 0
          gid: 0
        - source: ${target.dir}/etc/default/solr.in.sh
          target: /etc/default/solr.in.sh
          uid: 0
          gid: 0
        - source: /opt/docker/sbom/solr
          target: /opt/docker/sbom/solr
          uid: 0
          gid: 0
    - name: locale
      contents:
        packages:
          - bash
          - locales
          - coreutils
          - gzip
      pipeline:
        - name: install locales
          runs: |
            set -eux -o pipefail

            ln -s /etc/locale.alias /usr/share/locale/locale.alias

            echo "en_US.UTF-8 UTF-8" >> /etc/locale.gen
            locale-gen en_US.UTF-8
      outputs:
        - source: /usr/share/locale
          target: /usr/share/locale
          uid: 0
          gid: 0
        - source: /usr/lib/locale
          target: /usr/lib/locale
          uid: 0
          gid: 0
  artifacts:
    - name: dhi.io/eclipse-temurin:21.0.12.8-debian13@sha256:0f8d869a57951cbd51a9e346b7c57decde437f365faab227c818232f7a44045d
      includes:
        - opt/**
        - usr/local/bin/**
      uid: 0
      gid: 0
accounts:
  root: true
  run-as: root
  users:
    - name: solr
      uid: 65532
      gid: 65532
    - name: _apt
      uid: 42
      gid: 65532
  groups:
    - name: solr
      gid: 65532
      members:
        - solr
os-release:
  name: Docker Hardened Images (Debian)
  id: debian
  version-id: "13"
  version-codename: trixie
  pretty-name: Docker Hardened Images/Debian GNU/Linux 13 (trixie)
