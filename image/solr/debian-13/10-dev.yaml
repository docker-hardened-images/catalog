# syntax=dhi.io/build:2-debian13

name: Apache Solr 10.1.x (dev)
image: dhi.io/solr
variant: dev
tags:
  - 10-dev
  - 10.1-dev
  - 10.1.0-dev
  - 10-debian-dev
  - 10-debian13-dev
  - 10.1-debian-dev
  - 10.1-debian13-dev
  - 10.1.0-debian-dev
  - 10.1.0-debian13-dev
platforms:
  - linux/amd64
  - linux/arm64
dates:
  release: "2026-03-03"
vars:
  JAVA_HOME_PATH: /usr/lib/jvm/temurin-21
  JDK_MAJOR_VERSION: "21"
  PACKAGE_NAME: solr-10
  PACKAGE_SUFFIX: ""
  SEMVER_MAJOR_MINOR_VERSION: "10.1"
  SEMVER_MAJOR_VERSION: "10"
  SEMVER_VERSION: 10.1.0
  SOLR_MAJOR_VERSION: "10"
  VERSION: 10.1.0-3
contents:
  repositories:
    - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
  keyring:
    - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
  packages:
    - '!gawk'
    - '!libelogind0'
    - '!mawk'
    - '!original-awk'
    - apt
    - base-files
    - bash
    - ca-certificates
    - ca-certificates-bundle
    - coreutils
    - diffutils
    - dpkg
    - eclipse-temurin-21-jre
    - eclipse-temurin-21-jre-oci-config
    - findutils
    - gawk
    - grep
    - libc-bin
    - mawk
    - perl-base
    - procps
    - sed
    - solr-10=10.1.0-3
    - tini
    - tzdata
    - util-linux
  builds:
    - name: locale
      contents:
        packages:
          - bash
          - locales
          - coreutils
          - gzip
      pipeline:
        - name: install locales
          runs: |
            set -eux -o pipefail

            ln -s /etc/locale.alias /usr/share/locale/locale.alias

            echo "en_US.UTF-8 UTF-8" >> /etc/locale.gen
            locale-gen en_US.UTF-8
      outputs:
        - source: /usr/share/locale
          target: /usr/share/locale
          uid: 0
          gid: 0
        - source: /usr/lib/locale
          target: /usr/lib/locale
          uid: 0
          gid: 0
accounts:
  root: true
  run-as: root
  users:
    - name: solr
      uid: 65532
      gid: 65532
    - name: _apt
      uid: 42
      gid: 65532
  groups:
    - name: solr
      gid: 65532
      members:
        - solr
os-release:
  name: Docker Hardened Images (Debian)
  id: debian
  version-id: "13"
  version-codename: trixie
  pretty-name: Docker Hardened Images/Debian GNU/Linux 13 (trixie)
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
environment:
  DEBIAN_FRONTEND: noninteractive
  JAVA_HOME: /usr/lib/jvm/temurin-21
  LANG: en_US.UTF-8
  LANGUAGE: en_US:en
  LC_ALL: en_US.UTF-8
  LOG4J_PROPS: /var/solr/log4j2.xml
  PATH: /opt/solr/bin:/opt/solr/docker/scripts:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
  SOLR_HOME: /var/solr/data
  SOLR_INCLUDE: /etc/default/solr.in.sh
  SOLR_JETTY_HOST: 0.0.0.0
  SOLR_LOGS_DIR: /var/solr/logs
  SOLR_PID_DIR: /var/solr
  SOLR_ZK_EMBEDDED_HOST: 0.0.0.0
paths:
  - type: directory
    path: /opt
    uid: 0
    gid: 0
  - type: symlink
    path: /opt/solr
    uid: 0
    gid: 0
    source: /usr/share/solr
  - type: directory
    path: /var/solr
    uid: 65532
    gid: 65532
    mode: "0770"
  - type: directory
    path: /var/solr/data
    uid: 65532
    gid: 65532
    mode: "0770"
  - type: directory
    path: /var/solr/logs
    uid: 65532
    gid: 65532
    mode: "0770"
  - type: directory
    path: /docker-entrypoint-initdb.d
    uid: 65532
    gid: 65532
    mode: "0755"
  - type: file
    path: /usr/local/bin/docker-entrypoint.sh
    uid: 0
    gid: 0
    mode: "0755"
    source: image/solr/bin/docker-entrypoint.sh
annotations:
  org.opencontainers.image.description: A minimal Apache Solr image
  org.opencontainers.image.licenses: Apache-2.0
entrypoint:
  - /usr/local/bin/docker-entrypoint.sh
cmd:
  - solr-foreground
ports:
  - 8983/tcp
