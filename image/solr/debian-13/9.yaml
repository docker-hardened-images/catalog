# syntax=dhi.io/build:2-debian13

name: Apache Solr 9.11.x
image: dhi.io/solr
variant: runtime
tags:
  - "9"
  - "9.11"
  - 9.11.0
  - 9-debian
  - 9-debian13
  - 9.11-debian
  - 9.11-debian13
  - 9.11.0-debian
  - 9.11.0-debian13
platforms:
  - linux/amd64
  - linux/arm64
dates:
  release: "2026-01-14"
vars:
  COMMIT_SHA: e62cb3b65f979f17ad988a11542e7a21d42244bc
  GRADLE_REFERENCE: dhi/gradle:8.14.6-jdk21-debian13-dev@sha256:8623e23158c6be329942d791a6d475c289fbb251bd853a7e1c0aee85c540beb0
  GRADLE_VERSION: 8.14.6
  JAVA_REFERENCE: dhi/eclipse-temurin:21.0.13.9-debian13@sha256:31452f600f695aa68471e46538098b6022b63f932c36e9bec66e37a3dfbc6f47
  JAVA_VERSION: 21.0.13.9
  SEMVER_MAJOR_MINOR_VERSION: "9.11"
  SEMVER_MAJOR_VERSION: "9"
  SEMVER_VERSION: 9.11.0
  SOLR_MAJOR_VERSION: "9"
  VERSION: 9.11.0
contents:
  packages:
    - '!libelogind0'
    - '!mawk'
    - '!original-awk'
    - base-files
    - bash
    - ca-certificates
    - coreutils
    - findutils
    - grep
    - procps
    - sed
    - tini
    - tzdata
  builds:
    - name: solr
      work-dir: ${source.dir}/solr
      contents:
        packages:
          - bash
          - coreutils
          - findutils
          - grep
          - gzip
          - libstdc++6
          - patch
          - sed
          - tar
        files:
          - url: git+https://github.com/apache/solr.git#releases/solr/9.11.0
            checksum: e62cb3b65f979f17ad988a11542e7a21d42244bc
            path: ${source.dir}/solr
            spdx:
              name: solr
              version: 9.11.0
              packages:
                - name: solr
                  purl: pkg:github/apache/solr@9.11.0
                  license: Apache-2.0
            uid: 0
            gid: 0
        artifacts:
          - name: dhi.io/gradle:8.14.6-jdk21-debian13-dev@sha256:8623e23158c6be329942d791a6d475c289fbb251bd853a7e1c0aee85c540beb0
            includes:
              - opt/**
              - usr/local/bin/**
            excludes:
              - var/lock
            uid: 0
            gid: 0
      pipeline:
        - name: strip develocity
          runs: |
            set -eux -o pipefail

            sed -i \
              -e "/id 'com\.gradle\.develocity'/d" \
              -e "/id 'com\.gradle\.common-custom-user-data-gradle-plugin'/d" \
              -e "/apply from: file('gradle\/develocity\.gradle')/d" \
              settings.gradle
            sed -i \
              -e "/apply from: file('gradle\/testing\/retry-test\.gradle')/d" \
              build.gradle
        - name: mirror maven central
          runs: |
            set -eux -o pipefail

            MIRROR='https://maven-central.storage-download.googleapis.com/maven2/'
            find . -type f -name '*.gradle' -print0 | xargs -0 sed -i \
              -e "s|mavenCentral()|maven { url '${MIRROR}' }|g" \
              -e "s|gradlePluginPortal()|maven { url '${MIRROR}' }; gradlePluginPortal()|g"
        - name: pin cve-remediated dependency versions (9.x)
          runs: |
            set -eux -o pipefail

            expect() {
              local file="$1" pattern="$2" desc="$3"
              if ! grep -qE "$pattern" "$file"; then
                echo "ERROR: ${desc} not found in ${file}; refresh the pin step." >&2
                exit 1
              fi
            }

            expect versions.props '^io\.netty:netty\*=4\.2\.15\.Final$' 'io.netty:netty*=4.2.15.Final'
            sed -i 's|^io\.netty:netty\*=4\.2\.15\.Final$|io.netty:netty*=4.2.17.Final|' versions.props
            expect versions.lock '^io\.netty:netty-buffer:4\.2\.15\.Final ' 'io.netty:netty-* at 4.2.15.Final'
            sed -i 's|^\(io\.netty:netty[a-z0-9-]*:\)4\.2\.15\.Final |\14.2.17.Final |' versions.lock

            expect versions.props '^com\.fasterxml\.jackson:jackson-bom=2\.22\.2$' 'com.fasterxml.jackson:jackson-bom=2.22.2'
            sed -i 's|^com\.fasterxml\.jackson:jackson-bom=2\.22\.2$|com.fasterxml.jackson:jackson-bom=2.22.3|' versions.props
            expect versions.lock '^com\.fasterxml\.jackson\.core:jackson-databind:2\.22\.2 ' 'com.fasterxml.jackson.core:jackson-databind:2.22.2'
            sed -i 's|^\(com\.fasterxml\.jackson[^:]*:[^:]*:\)2\.22\.2 |\12.22.3 |' versions.lock

            expect versions.props '^com\.google\.guava:guava=33\.6\.0-jre$' 'com.google.guava:guava=33.6.0-jre'
            sed -i 's|^com\.google\.guava:guava=33\.6\.0-jre$|com.google.guava:guava=33.7.2-jre|' versions.props
            expect versions.lock '^com\.google\.guava:guava:33\.6\.0-jre ' 'com.google.guava:guava:33.6.0-jre'
            sed -i 's|^\(com\.google\.guava:guava:\)33\.6\.0-jre |\133.7.2-jre |' versions.lock
            expect versions.lock '^org\.jspecify:jspecify:1\.0\.0 ' 'org.jspecify:jspecify:1.0.0'
            sed -i 's|^\(org\.jspecify:jspecify:\)1\.0\.0 |\11.0.1 |' versions.lock

            expect versions.props '^org\.xerial\.snappy:snappy-java=1\.1\.10\.8$' 'org.xerial.snappy:snappy-java=1.1.10.8'
            sed -i 's|^org\.xerial\.snappy:snappy-java=1\.1\.10\.8$|org.xerial.snappy:snappy-java=1.1.10.9|' versions.props
            expect versions.lock '^org\.xerial\.snappy:snappy-java:1\.1\.10\.8 ' 'org.xerial.snappy:snappy-java:1.1.10.8'
            sed -i 's|^\(org\.xerial\.snappy:snappy-java:\)1\.1\.10\.8 |\11.1.10.9 |' versions.lock
        - name: build solr distribution
          privileged: true
          runs: |
            set -eux -o pipefail

            ./gradlew \
              -Pversion.release=9.11.0 \
              :solr:packaging:assemble \
              --no-daemon \
              --console=plain \
              --warning-mode=summary
        - name: extract distribution
          runs: |
            set -eux -o pipefail

            mkdir -p "${target.dir}/opt/solr"
            tarball=$(find solr/packaging/build/distributions -maxdepth 1 -name "solr-*.tgz" ! -name "*-src.tgz" ! -name "*-slim.tgz" -print -quit)
            test -n "$tarball"
            tar -xzf "$tarball" --strip-components=1 -C "${target.dir}/opt/solr"
            rm -rf \
              "${target.dir}/opt/solr/modules" \
              "${target.dir}/opt/solr/prometheus-exporter" \
              "${target.dir}/opt/solr/cross-dc-manager"

            mkdir -p "${target.dir}/etc/default"
            cp "${target.dir}/opt/solr/bin/solr.in.sh" "${target.dir}/etc/default/solr.in.sh"
      outputs:
        - source: ${target.dir}/opt/solr
          target: /opt/solr
          uid: 0
          gid: 0
        - source: ${target.dir}/etc/default/solr.in.sh
          target: /etc/default/solr.in.sh
          uid: 0
          gid: 0
        - source: /opt/docker/sbom/solr
          target: /opt/docker/sbom/solr
          uid: 0
          gid: 0
    - name: locale
      contents:
        packages:
          - bash
          - locales
          - coreutils
          - gzip
      pipeline:
        - name: install locales
          runs: |
            set -eux -o pipefail

            ln -s /etc/locale.alias /usr/share/locale/locale.alias

            echo "en_US.UTF-8 UTF-8" >> /etc/locale.gen
            locale-gen en_US.UTF-8
      outputs:
        - source: /usr/share/locale
          target: /usr/share/locale
          uid: 0
          gid: 0
        - source: /usr/lib/locale
          target: /usr/lib/locale
          uid: 0
          gid: 0
  artifacts:
    - name: dhi.io/eclipse-temurin:21.0.13.9-debian13@sha256:31452f600f695aa68471e46538098b6022b63f932c36e9bec66e37a3dfbc6f47
      includes:
        - opt/**
        - usr/local/bin/**
      uid: 0
      gid: 0
accounts:
  run-as: solr
  users:
    - name: solr
      uid: 65532
      gid: 65532
  groups:
    - name: solr
      gid: 65532
      members:
        - solr
os-release:
  name: Docker Hardened Images (Debian)
  id: debian
  version-id: "13"
  version-codename: trixie
  pretty-name: Docker Hardened Images/Debian GNU/Linux 13 (trixie)
  home-url: https://docker.com/products/hardened-images/
