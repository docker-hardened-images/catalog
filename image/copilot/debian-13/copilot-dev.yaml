          gid: 1000
          mode: "0644"
        - type: file
          path: /home/agent/.bash_profile
          content: |
            if [ -f ~/.bashrc ]; then . ~/.bashrc; fi
          uid: 1000
          gid: 1000
          mode: "0644"
