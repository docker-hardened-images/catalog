  - type: delete
    path: /etc/profile.d/01-dhi.sh
    uid: 0
    gid: 0
  - type: file
    path: /etc/profile.d/01-dhi.sh
    content: |
      #!/bin/sh
      # For each interactive shell a person opens. A command run through a
      # login shell must not find the banner in its output, and a shell started
      # from one that showed it inherits DHI_BANNER_SHOWN and stays quiet.
      case "$-" in
        *i*) ;;
        *) return 0 2>/dev/null || exit 0 ;;
      esac
      [ -n "${DHI_BANNER_SHOWN:-}" ] && { return 0 2>/dev/null || exit 0; }
      # A function, so its set -- leaves the sourcing shell's arguments alone.
      _dhi_banner() {
        # No escapes for NO_COLOR or a dumb terminal, 24-bit color where the
        # terminal says it takes it. The mark is braille, which a terminal
        # that may lack UTF-8 does not get.
        _dhi_e=$(printf '\033')
        _dhi_mode=16
        [ -n "${NO_COLOR:-}" ] && _dhi_mode=0
        case "${TERM:-dumb}" in dumb) _dhi_mode=0 ;; esac
        if [ "$_dhi_mode" = 16 ]; then
          case "${COLORTERM:-}" in truecolor|24bit) _dhi_mode=24 ;; esac
        fi
        _dhi_bold="" _dhi_dim="" _dhi_off="" _dhi_acc=""
        case "$_dhi_mode" in
          24)
            _dhi_bold="$_dhi_e[1m" _dhi_dim="$_dhi_e[2m" _dhi_off="$_dhi_e[0m"
            ;;
          16)
            _dhi_bold="$_dhi_e[1m" _dhi_dim="$_dhi_e[2m" _dhi_off="$_dhi_e[0m"
            _dhi_acc="$_dhi_e[94m"
            ;;
        esac
        _dhi_mark=1
        case "${TERM:-dumb}" in dumb|linux) _dhi_mark=0 ;; esac

        # The kits staged in the sandbox: the workload, then every mixin sbx
        # composed onto it at create, which the build cannot know. A kit's
        # name is its directory; its kind and version are top-level keys of
        # its kit.yaml, which some kits quote.
        _dhi_workload=""
        _dhi_mixins=""
        for _dhi_kit in /usr/share/sandbox/kit/*/kit.yaml; do
          [ -r "$_dhi_kit" ] || continue
          _dhi_name=${_dhi_kit%/kit.yaml}
          _dhi_name=${_dhi_name##*/}
          _dhi_kind=""
          _dhi_ver=""
          while IFS= read -r _dhi_line || [ -n "$_dhi_line" ]; do
            case "$_dhi_line" in
              kind:*) _dhi_kind=$(printf '%s' "${_dhi_line#kind:}" | tr -d " \"'") ;;
              version:*) _dhi_ver=$(printf '%s' "${_dhi_line#version:}" | tr -d " \"'") ;;
            esac
          done < "$_dhi_kit"
          if [ "$_dhi_kind" = workload ]; then
            _dhi_workload="$_dhi_workload$_dhi_name $_dhi_ver;"
          else
            _dhi_mixins="$_dhi_mixins$_dhi_name $_dhi_ver;"
          fi
        done
        _dhi_rest="$_dhi_workload$_dhi_mixins"
        [ -n "$_dhi_rest" ] || _dhi_rest="copilot docker 1.0.117;"

        # The palette: the one the image pins, else one of the six picked by
        # a hash of the first kit's name, so a kit keeps its colors from one
        # sandbox to the next and kits differ from each other.
        _dhi_pal=""
        if [ -z "$_dhi_pal" ]; then
          _dhi_item=${_dhi_rest%% *}
          _dhi_n=0
          while [ -n "$_dhi_item" ]; do
            _dhi_line=${_dhi_item%"${_dhi_item#?}"}
            _dhi_item=${_dhi_item#?}
            _dhi_n=$(( (_dhi_n * 31 + $(printf '%d' "'$_dhi_line")) % 65521 ))
          done
          case $((_dhi_n % 6)) in
            0) _dhi_pal=blue ;;
            1) _dhi_pal=flux ;;
            2) _dhi_pal=violet ;;
            3) _dhi_pal=launch ;;
            4) _dhi_pal=ember ;;
            5) _dhi_pal=sandflux ;;
          esac
        fi
        # A palette is three colors for the mark, at its top left, on a
        # diagonal between and at its bottom right, then the kit names'
        # color, then that diagonal.
        case "$_dhi_pal" in
          flux) set -- 0 228 118 0 228 118 97 114 255 "0;228;118" 11 ;;
          violet) set -- 51 69 214 97 114 255 160 112 232 "160;112;232" 17 ;;
          launch) set -- 255 106 61 225 108 116 160 112 232 "255;106;61" 8 ;;
          ember) set -- 255 206 165 255 106 61 255 61 64 "255;106;61" 8 ;;
          sandflux) set -- 255 206 165 173 213 150 0 228 118 "0;228;118" 8 ;;
          *)
            _dhi_pal=blue
            set -- 209 228 255 97 114 255 51 69 214 "97;114;255" 8
            ;;
        esac
        _dhi_r0=$1 _dhi_g0=$2 _dhi_b0=$3 _dhi_r1=$4 _dhi_g1=$5 _dhi_b1=$6 _dhi_r2=$7 _dhi_g2=$8 _dhi_b2=$9
        _dhi_mid=${11}
        [ "$_dhi_mode" = 24 ] && _dhi_acc="$_dhi_e[38;2;${10}m"

        # The text, a row per positional argument: the title, the sandbox's
        # name where sbx provides one, then a kit per row. _dhi_pw tracks the
        # widest row, which escapes would overcount if measured from the rows.
        set -- "${_dhi_bold}Docker Sandbox Kit$_dhi_off$_dhi_dim by DHI$_dhi_off"
        _dhi_pw=25
        if [ -n "${SANDBOX_VM_ID:-}" ]; then
          set -- "$@" "$SANDBOX_VM_ID"
          [ "${#SANDBOX_VM_ID}" -gt "$_dhi_pw" ] && _dhi_pw=${#SANDBOX_VM_ID}
        fi
        while [ -n "$_dhi_rest" ]; do
          _dhi_item=${_dhi_rest%%;*}
          _dhi_rest=${_dhi_rest#*;}
          set -- "$@" "$_dhi_acc${_dhi_item% *}$_dhi_off $_dhi_dim${_dhi_item##* }$_dhi_off"
          [ "${#_dhi_item}" -gt "$_dhi_pw" ] && _dhi_pw=${#_dhi_item}
        done

        # The text starts at column 40, beside the mark. A terminal too narrow
        # for both, or one that gets no mark, gets the text alone; a terminal
        # of unknown width gets both.
        _dhi_cols=$( { stty size </dev/tty; } 2>/dev/null )
        _dhi_cols=${_dhi_cols#* }
        case "$_dhi_cols" in ''|0|*[!0-9]*) _dhi_cols=${COLUMNS:-0} ;; esac
        case "$_dhi_cols" in ''|*[!0-9]*) _dhi_cols=0 ;; esac
        printf '\n'
        if [ "$_dhi_mark" = 0 ] || { [ "$_dhi_cols" -gt 0 ] && [ "$_dhi_cols" -lt $((39 + _dhi_pw)) ]; }; then
          for _dhi_item in "$@"; do
            printf '  %s\n' "$_dhi_item"
          done
          printf '\n'
          return 0
        fi

        # The mark is 10 rows of 34 cells, each row cut at every | into 17
        # pairs of cells. In 24-bit color a pair takes its shade from its
        # diagonal, row plus pair: the palette's first color at the top left,
        # its second by the palette's own diagonal, its third at the bottom
        # right, diagonal 25. The text is centered against the mark; rows it
        # has beyond the mark's run on below it.
        _dhi_start=$(( (10 - $#) / 2 ))
        [ "$_dhi_start" -ge 0 ] || _dhi_start=0
        _dhi_row=0
        while IFS= read -r _dhi_line; do
          _dhi_out=""
          _dhi_n=$_dhi_row
          while [ -n "$_dhi_line" ]; do
            if [ "$_dhi_mode" = 24 ]; then
              if [ "$_dhi_n" -le "$_dhi_mid" ]; then
                _dhi_out="$_dhi_out$_dhi_e[38;2;$((_dhi_r0 + (_dhi_r1 - _dhi_r0) * _dhi_n / _dhi_mid));$((_dhi_g0 + (_dhi_g1 - _dhi_g0) * _dhi_n / _dhi_mid));$((_dhi_b0 + (_dhi_b1 - _dhi_b0) * _dhi_n / _dhi_mid))m"
              else
                _dhi_out="$_dhi_out$_dhi_e[38;2;$((_dhi_r1 + (_dhi_r2 - _dhi_r1) * (_dhi_n - _dhi_mid) / (25 - _dhi_mid)));$((_dhi_g1 + (_dhi_g2 - _dhi_g1) * (_dhi_n - _dhi_mid) / (25 - _dhi_mid)));$((_dhi_b1 + (_dhi_b2 - _dhi_b1) * (_dhi_n - _dhi_mid) / (25 - _dhi_mid)))m"
              fi
            fi
            _dhi_out="$_dhi_out${_dhi_line%%"|"*}"
            case "$_dhi_line" in
              *"|"*) _dhi_line=${_dhi_line#*"|"} ;;
              *) _dhi_line="" ;;
            esac
            _dhi_n=$((_dhi_n + 1))
          done
          [ "$_dhi_mode" = 16 ] && _dhi_out="$_dhi_acc$_dhi_out"
          if [ "$_dhi_row" -ge "$_dhi_start" ] && [ $# -gt 0 ]; then
            printf '  %s%s   %s\n' "$_dhi_out" "$_dhi_off" "$1"
            shift
          else
            printf '  %s%s\n' "$_dhi_out" "$_dhi_off"
          fi
          _dhi_row=$((_dhi_row + 1))
        done <<'EOF'
      ⠀⢀|⣤⣶|⣿⣿|⣿⣿|⣿⣿|⣿⣿|⣿⣿|⣿⠀|⠀⣿|⣿⣿|⣿⣿|⣿⣶|⣄⠀|⣠⣶|⣿⣿|⣿⣿|⣿⣿
      ⢠⣿|⣿⣿|⣿⣿|⣿⣿|⣿⣿|⣿⣿|⣿⣿|⣿⠀|⠀⣿|⣿⣿|⣿⣿|⣿⣿|⣿⣷|⣿⣿|⣿⣿|⣿⣿|⣿⣿
      ⣿⣿|⣿⣿|⣿⣿|⣿⣿|⣿⣿|⣿⣿|⣿⣿|⣿⡄|⠀⠘|⢿⣿|⣿⣿|⣿⣿|⣿⣿|⣿⣿|⣿⣿|⣿⣿|⣿⠏
      ⣿⣿|⣿⣿|⣿⣿|⣿⣿|⣿⣿|⣿⣿|⣿⣿|⣿⣿|⣄⠀|⠀⠉|⠛⠛|⠛⢻|⣿⣿|⣿⡟|⠛⠛|⠛⠋|⠁⠀
      ⣿⣿|⣿⣿|⣿⣿|⣿⣿|⣿⣿|⣿⣿|⣿⣿|⣿⣿|⣿⣿|⣶⣤|⣤⣤|⣤⣼|⣿⣿|⣿⡇|⠀⠀|⠀⠀|⠀⠀
      ⣿⣿|⣿⣿|⣿⣿|⣿⣿|⣿⣿|⣿⣿|⣿⣿|⣿⣿|⣿⣿|⣿⣿|⣿⣿|⣿⣿|⣿⣿|⣿⡇|⠀⠀|⠀⠀|⠀⠀
      ⣿⣿|⣿⣿|⣿⣿|⣿⣿|⣿⣿|⣿⣿|⣿⣿|⣿⣿|⣿⣿|⣿⣿|⣿⣿|⣿⣿|⣿⣿|⣿⡇|⠀⠀|⠀⠀|⠀⠀
      ⣿⣿|⣿⣿|⣿⣿|⣿⣿|⣿⣿|⣿⣿|⣿⣿|⣿⣿|⣿⣿|⣿⣿|⣿⣿|⣿⣿|⣿⣿|⣿⡇|⠀⠀|⠀⠀|⠀⠀
      ⠘⣿|⣿⣿|⣿⣿|⣿⣿|⣿⣿|⣿⣿|⣿⣿|⣿⣿|⣿⣿|⣿⣿|⣿⣿|⣿⣿|⣿⣿|⡟⠀|⠀⠀|⠀⠀|⠀⠀
      ⠀⠈|⠛⠿|⣿⣿|⣿⣿|⣿⣿|⣿⣿|⣿⣿|⣿⣿|⣿⣿|⣿⣿|⣿⣿|⣿⡿|⠟⠋|⠀⠀|⠀⠀|⠀⠀|⠀⠀
      EOF
        for _dhi_item in "$@"; do
          printf '%39s%s\n' "" "$_dhi_item"
        done
        printf '\n'
      }
      _dhi_banner
      # The prompt in ~/.bashrc takes its colors from the palette named here.
      export DHI_BANNER_SHOWN=1 DHI_BANNER_PALETTE="$_dhi_pal"
      unset -f _dhi_banner
      unset _dhi_e _dhi_mode _dhi_bold _dhi_dim _dhi_off _dhi_acc _dhi_mark \
        _dhi_workload _dhi_mixins _dhi_kit _dhi_name _dhi_kind _dhi_ver _dhi_line \
        _dhi_rest _dhi_item _dhi_pw _dhi_cols _dhi_start _dhi_row _dhi_out _dhi_n \
        _dhi_pal _dhi_r0 _dhi_g0 _dhi_b0 _dhi_r1 _dhi_g1 _dhi_b1 _dhi_r2 _dhi_g2 _dhi_b2 \
        _dhi_mid
    uid: 0
    gid: 0
    mode: "0755"
  - type: delete
    path: /home/agent/.bashrc
    uid: 0
    gid: 0
  - type: file
    path: /home/agent/.bashrc
    content: |
      if [ -f /etc/sandbox-persistent.sh ]; then
          . /etc/sandbox-persistent.sh
      fi
      export BASH_ENV=/etc/sandbox-persistent.sh
      # The prompt is a status glyph for the last command (✓, or ✗ with its
      # exit code), user@host and the working directory. The glyph is computed
      # in a PROMPT_COMMAND hook because $? must be captured before the prompt
      # is rebuilt. Color escapes are wrapped in \[ \] so bash tracks the
      # prompt width correctly. A dumb terminal gets a plain prompt with a +/-
      # indicator.
      case "$TERM" in
          ""|dumb)
              __dhi_set_prompt() {
                  local rc=$?
                  local mark='+'
                  [ "$rc" -eq 0 ] || mark="-:$rc"
                  PS1="$mark \u@\h:\w\$ "
              }
              ;;
          *)
              __dhi_ok='\[\e[1;32m\]'
              __dhi_err='\[\e[1;31m\]'
              __dhi_who='\[\e[1;36m\]\u@\h'
              # A terminal that says it takes 24-bit color gets the banner's
              # colors: Flux and Trigger for the glyph, and user@host shaded a
              # character at a time through the three colors of the palette
              # the banner picked for this sandbox's kit and named in
              # DHI_BANNER_PALETTE. They are the mark's, with a first color too
              # pale for text taken halfway to the second and Console lifted.
              # The shading needs the text itself, so it is expanded here,
              # once, and kept in the second color alone if it holds a
              # character the prompt would expand again. The directory is bold
              # in the terminal's own foreground either way, which reads on a
              # dark or a light theme.
              case "${COLORTERM:-}" in
                  truecolor|24bit)
                      __dhi_ok='\[\e[1;38;2;0;228;118m\]'
                      __dhi_err='\[\e[1;38;2;255;61;64m\]'
                      case "${DHI_BANNER_PALETTE:-}" in
                          flux) __dhi_g=(0 228 118 0 228 118 97 114 255) ;;
                          violet) __dhi_g=(74 92 235 97 114 255 160 112 232) ;;
                          launch) __dhi_g=(255 106 61 208 109 146 160 112 232) ;;
                          ember) __dhi_g=(255 156 113 255 106 61 255 61 64) ;;
                          sandflux) __dhi_g=(127 217 141 63 222 129 0 228 118) ;;
                          *) __dhi_g=(153 171 255 97 114 255 74 92 235) ;;
                      esac
                      __dhi_who='\[\e[1;38;2;'"${__dhi_g[3]};${__dhi_g[4]};${__dhi_g[5]}"'m\]\u@\h'
                      __dhi_s='\u@\h'
                      __dhi_s=${__dhi_s@P}
                      case "$__dhi_s" in
                          ""|*[!A-Za-z0-9@._-]*) ;;
                          *)
                              __dhi_who=''
                              __dhi_n=$(( ${#__dhi_s} > 1 ? ${#__dhi_s} - 1 : 1 ))
                              for (( __dhi_i = 0; __dhi_i < ${#__dhi_s}; __dhi_i++ )); do
                                  __dhi_t=$(( __dhi_i * 200 / __dhi_n ))
                                  if [ "$__dhi_t" -le 100 ]; then
                                      __dhi_k=0
                                  else
                                      __dhi_k=3
                                      __dhi_t=$(( __dhi_t - 100 ))
                                  fi
                                  __dhi_c="$(( __dhi_g[__dhi_k] + (__dhi_g[__dhi_k + 3] - __dhi_g[__dhi_k]) * __dhi_t / 100 ))"
                                  __dhi_c="$__dhi_c;$(( __dhi_g[__dhi_k + 1] + (__dhi_g[__dhi_k + 4] - __dhi_g[__dhi_k + 1]) * __dhi_t / 100 ))"
                                  __dhi_c="$__dhi_c;$(( __dhi_g[__dhi_k + 2] + (__dhi_g[__dhi_k + 5] - __dhi_g[__dhi_k + 2]) * __dhi_t / 100 ))"
                                  __dhi_who="$__dhi_who"'\[\e[1;38;2;'"$__dhi_c"'m\]'"${__dhi_s:__dhi_i:1}"
                              done
                              ;;
                      esac
                      unset __dhi_s __dhi_n __dhi_i __dhi_t __dhi_c __dhi_k __dhi_g
                      ;;
              esac
              __dhi_set_prompt() {
                  local rc=$?
                  local mark
                  if [ "$rc" -eq 0 ]; then
                      mark="$__dhi_ok"'✓\[\e[0m\]'
                  else
                      mark="$__dhi_err"'✗ '"$rc"'\[\e[0m\]'
                  fi
                  PS1="$mark $__dhi_who"'\[\e[0m\]:\[\e[1m\]\w\[\e[0m\]$ '
              }
              ;;
      esac
      PROMPT_COMMAND=__dhi_set_prompt
    uid: 1000
    gid: 1000
    mode: "0644"
