# syntax=dhi.io/build:2-debian13

name: Hyperledger Fabric Tools 3.x
image: dhi.io/hyperledger-fabric-tools
variant: runtime
tags:
  - "3"
  - "3.1"
  - 3.1.5
  - 3-debian
  - 3-debian13
  - 3.1-debian
  - 3.1-debian13
  - 3.1.5-debian
  - 3.1.5-debian13
platforms:
  - linux/amd64
  - linux/arm64
dates:
  release: "2024-09-20"
vars:
  FLAVORED_SUFFIX: ""
  SEMVER_MAJOR_MINOR_VERSION: "3.1"
  SEMVER_MAJOR_VERSION: "3"
  SEMVER_VERSION: 3.1.5
  SUFFIX: ""
  VERSION: 3.1.5-13
contents:
  repositories:
    - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
  keyring:
    - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
  packages:
    - base-files
    - ca-certificates-bundle
    - peer-3=3.1.5-13
    - tools-3=3.1.5-13
    - tzdata
accounts:
  run-as: nonroot
  users:
    - name: nonroot
      uid: 65532
      gid: 65532
  groups:
    - name: nonroot
      gid: 65532
      members:
        - nonroot
os-release:
  name: Docker Hardened Images (Debian)
  id: debian
  version-id: "13"
  version-codename: trixie
  pretty-name: Docker Hardened Images/Debian GNU/Linux 13 (trixie)
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
environment:
  FABRIC_CFG_PATH: /etc/hyperledger/fabric
  FABRIC_VER: v3.1.5
paths:
  - type: directory
    path: /etc/hyperledger/fabric
    uid: 0
    gid: 0
    mode: "0755"
  - type: directory
    path: /usr/local/bin
    uid: 0
    gid: 0
    mode: "0755"
  - type: symlink
    path: /usr/local/bin/configtxgen
    uid: 0
    gid: 0
    source: /usr/bin/configtxgen
  - type: symlink
    path: /usr/local/bin/configtxlator
    uid: 0
    gid: 0
    source: /usr/bin/configtxlator
  - type: symlink
    path: /usr/local/bin/cryptogen
    uid: 0
    gid: 0
    source: /usr/bin/cryptogen
  - type: symlink
    path: /usr/local/bin/discover
    uid: 0
    gid: 0
    source: /usr/bin/discover
  - type: symlink
    path: /usr/local/bin/ledgerutil
    uid: 0
    gid: 0
    source: /usr/bin/ledgerutil
  - type: symlink
    path: /usr/local/bin/osnadmin
    uid: 0
    gid: 0
    source: /usr/bin/osnadmin
  - type: symlink
    path: /usr/local/bin/peer
    uid: 0
    gid: 0
    source: /usr/bin/peer
annotations:
  org.opencontainers.image.description: A minimal Hyperledger Fabric Tools image
  org.opencontainers.image.licenses: Apache-2.0
cmd:
  - configtxgen
  - --help
