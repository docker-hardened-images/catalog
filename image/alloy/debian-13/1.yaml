# syntax=dhi.io/build:2-debian13

name: Grafana Alloy 1.x
image: dhi.io/alloy
variant: runtime
tags:
  - "1"
  - "1.19"
  - 1.19.2
  - 1-debian
  - 1-debian13
  - 1.19-debian
  - 1.19-debian13
  - 1.19.2-debian
  - 1.19.2-debian13
platforms:
  - linux/amd64
  - linux/arm64
vars:
  FLAVORED_SUFFIX: ""
  SEMVER_MAJOR_MINOR_VERSION: "1.19"
  SEMVER_MAJOR_VERSION: "1"
  SEMVER_VERSION: 1.19.2
  SUFFIX: ""
  VERSION: 1.19.2-3
contents:
  repositories:
    - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
  keyring:
    - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
  packages:
    - alloy=1.19.2-3
    - base-files
    - ca-certificates-bundle
    - libc6
    - libsystemd0
    - tzdata
accounts:
  run-as: alloy
  users:
    - name: alloy
      uid: 473
      gid: 473
  groups:
    - name: alloy
      gid: 473
      members:
        - alloy
os-release:
  name: Docker Hardened Images (Debian)
  id: debian
  version-id: "13"
  version-codename: trixie
  pretty-name: Docker Hardened Images/Debian GNU/Linux 13 (trixie)
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
environment:
  ALLOY_DEPLOY_MODE: docker
paths:
  - type: directory
    path: /usr/local/bin
    uid: 0
    gid: 0
  - type: symlink
    path: /usr/local/bin/alloy
    uid: 0
    gid: 0
    source: /usr/bin/alloy
  - type: directory
    path: /var/lib/alloy
    uid: 473
    gid: 473
    mode: "0770"
  - type: directory
    path: /var/lib/alloy/data
    uid: 473
    gid: 473
    mode: "0770"
annotations:
  org.opencontainers.image.description: A minimal Grafana Alloy image
  org.opencontainers.image.licenses: Apache-2.0
entrypoint:
  - /usr/local/bin/alloy
cmd:
  - run
  - /etc/alloy/config.alloy
  - --storage.path=/var/lib/alloy/data
ports:
  - 12345/tcp
