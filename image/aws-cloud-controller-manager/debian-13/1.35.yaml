# syntax=dhi.io/build:2-debian13

name: AWS Cloud Controller Manager 1.35.x
image: dhi.io/aws-cloud-controller-manager
variant: runtime
tags:
  - "1.35"
  - 1.35.3
  - 1.35-debian
  - 1.35-debian13
  - 1.35.3-debian
  - 1.35.3-debian13
platforms:
  - linux/amd64
  - linux/arm64
dates:
  release: "2025-12-22"
vars:
  FLAVORED_SUFFIX: ""
  SEMVER_MAJOR_MINOR_VERSION: "1.35"
  SEMVER_MAJOR_VERSION: "1"
  SEMVER_VERSION: 1.35.3
  SUFFIX: ""
  VERSION: 1.35.3-1
contents:
  repositories:
    - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
  keyring:
    - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
  packages:
    - aws-cloud-controller-manager-1.35=1.35.3-1
    - base-files
    - ca-certificates-bundle
    - tzdata
accounts:
  run-as: nonroot
  users:
    - name: nonroot
      uid: 65532
      gid: 65532
  groups:
    - name: nonroot
      gid: 65532
      members:
        - nonroot
os-release:
  name: Docker Hardened Images (Debian)
  id: debian
  version-id: "13"
  version-codename: trixie
  pretty-name: Docker Hardened Images/Debian GNU/Linux 13 (trixie)
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
work-dir: /
environment:
  SSL_CERT_FILE: /etc/ssl/certs/ca-certificates.crt
paths:
  - type: directory
    path: /run/kubernetes
    uid: 65532
    gid: 65532
    mode: "0770"
annotations:
  org.opencontainers.image.description: A minimal AWS Cloud Controller Manager image
  org.opencontainers.image.licenses: Apache-2.0
entrypoint:
  - /bin/aws-cloud-controller-manager
