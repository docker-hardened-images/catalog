# syntax=dhi.io/build:2-debian13

name: Moby Buildkit 0.x
image: dhi.io/buildkit
variant: runtime
tags:
  - "0"
  - "0.35"
  - 0.35.0
  - 0-debian
  - 0-debian13
  - 0.35-debian
  - 0.35-debian13
  - 0.35.0-debian
  - 0.35.0-debian13
platforms:
  - linux/amd64
  - linux/arm64
dates: {}
vars:
  BUILDKIT_PKG_VERSION: 0.35.0-0
  FLAVORED_SUFFIX: ""
  RUNC_PKG_VERSION: 1.5.2-1
  RUNC_VERSION: 1.5.2
  SEMVER_MAJOR_MINOR_VERSION: "0.35"
  SEMVER_MAJOR_VERSION: "0"
  SEMVER_VERSION: 0.35.0
  SUFFIX: ""
  VERSION: 0.35.0
contents:
  repositories:
    - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
  keyring:
    - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
  packages:
    - base-files
    - buildctl-0=0.35.0-0
    - buildkit-0=0.35.0-0
    - ca-certificates-bundle
    - fuse-overlayfs
    - fuse3
    - git
    - isal
    - libc6
    - libgcc-s1
    - libstdc++6
    - openssh-client
    - openssl
    - rootlesskit-3
    - runc-1.5=1.5.2-1
    - tzdata
    - uidmap
    - xz-utils
  builds:
    - name: fix uidmap caps
      contents:
        packages:
          - bash
          - uidmap
          - libcap2-bin
      pipeline:
        - name: setcap
          runs: |
            set -eux -o pipefail

            setcap cap_setuid+eip /usr/bin/newuidmap
            setcap cap_setgid+eip /usr/bin/newgidmap
      outputs:
        - source: /usr/bin/newuidmap
          target: /usr/bin/newuidmap
          uid: 0
          gid: 0
        - source: /usr/bin/newgidmap
          target: /usr/bin/newgidmap
          uid: 0
          gid: 0
accounts:
  run-as: nonroot
  users:
    - name: nonroot
      uid: 1000
      gid: 1000
  groups:
    - name: nonroot
      gid: 1000
      members:
        - nonroot
os-release:
  name: Docker Hardened Images (Debian)
  id: debian
  version-id: "13"
  version-codename: trixie
  pretty-name: Docker Hardened Images/Debian GNU/Linux 13 (trixie)
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
environment:
  BUILDKIT_HOST: unix:///run/user/1000/buildkit/buildkitd.sock
  HOME: /home/nonroot
  USER: nonroot
  XDG_RUNTIME_DIR: /run/user/1000
paths:
  - type: directory
    path: /usr/local/bin
    uid: 0
    gid: 0
  - type: symlink
    path: /usr/local/bin/buildkitd
    uid: 0
    gid: 0
    source: /usr/bin/buildkitd
  - type: symlink
    path: /usr/local/bin/buildctl
    uid: 0
    gid: 0
    source: /usr/bin/buildctl
  - type: symlink
    path: /usr/local/bin/runc
    uid: 0
    gid: 0
    source: /usr/bin/runc
  - type: file
    path: /etc/subuid
    content: nonroot:100000:65536
    uid: 0
    gid: 0
  - type: file
    path: /etc/subgid
    content: nonroot:100000:65536
    uid: 0
    gid: 0
  - type: directory
    path: /run/user/1000
    uid: 1000
    gid: 1000
  - type: directory
    path: /home/nonroot
    uid: 1000
    gid: 1000
  - type: directory
    path: /home/nonroot/.local/share/buildkit
    uid: 1000
    gid: 1000
  - type: directory
    path: /etc/cdi
    uid: 1000
    gid: 1000
  - type: directory
    path: /run/cdi
    uid: 1000
    gid: 1000
  - type: directory
    path: /etc/buildkit/cdi
    uid: 1000
    gid: 1000
  - type: directory
    path: /var/lib/buildkit
    uid: 1000
    gid: 1000
  - type: directory
    path: /var/lib/containerd
    uid: 1000
    gid: 1000
annotations:
  org.opencontainers.image.description: A minimal buildkit builder toolkit image
  org.opencontainers.image.licenses: Apache-2.0
entrypoint:
  - rootlesskit
  - buildkitd
  - --root=/var/lib/buildkit
