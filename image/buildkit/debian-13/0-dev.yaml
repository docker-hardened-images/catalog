# syntax=dhi.io/build:2-debian13

name: Moby Buildkit 0.x (dev)
image: dhi.io/buildkit
variant: dev
tags:
  - 0-dev
  - 0.34-dev
  - 0.34.2-dev
  - 0-debian-dev
  - 0-debian13-dev
  - 0.34-debian-dev
  - 0.34-debian13-dev
  - 0.34.2-debian-dev
  - 0.34.2-debian13-dev
platforms:
  - linux/amd64
  - linux/arm64
dates: {}
vars:
  BUILDKIT_PKG_VERSION: 0.34.2-1
  FLAVORED_SUFFIX: -dev
  RUNC_PKG_VERSION: 1.5.2-1
  RUNC_VERSION: 1.5.2
  SEMVER_MAJOR_MINOR_VERSION: "0.34"
  SEMVER_MAJOR_VERSION: "0"
  SEMVER_VERSION: 0.34.2
  SUFFIX: -dev
  VERSION: 0.34.2
contents:
  repositories:
    - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
  keyring:
    - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
  packages:
    - '!gawk'
    - '!libelogind0'
    - '!original-awk'
    - apt
    - base-files
    - bash
    - buildctl-0-dev=0.34.2-1
    - buildkit-0-dev=0.34.2-1
    - ca-certificates-bundle
    - coreutils
    - diffutils
    - dpkg
    - findutils
    - git
    - grep
    - isal
    - libc-bin
    - libc6
    - libgcc-s1
    - libstdc++6
    - mawk
    - openssh-client
    - openssl
    - perl-base
    - runc-1.5-dev=1.5.2-1
    - sed
    - tzdata
    - util-linux
    - xz-utils
accounts:
  root: true
  run-as: root
  users:
    - name: nonroot
      uid: 65532
      gid: 65532
    - name: _apt
      uid: 42
      gid: 65532
  groups:
    - name: nonroot
      gid: 65532
      members:
        - nonroot
os-release:
  name: Docker Hardened Images (Debian)
  id: debian
  version-id: "13"
  version-codename: trixie
  pretty-name: Docker Hardened Images/Debian GNU/Linux 13 (trixie)
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
environment:
  DEBIAN_FRONTEND: noninteractive
paths:
  - type: directory
    path: /usr/local/bin
    uid: 0
    gid: 0
  - type: symlink
    path: /usr/local/bin/buildkitd
    uid: 0
    gid: 0
    source: /usr/bin/buildkitd
  - type: symlink
    path: /usr/local/bin/buildctl
    uid: 0
    gid: 0
    source: /usr/bin/buildctl
  - type: symlink
    path: /usr/local/bin/runc
    uid: 0
    gid: 0
    source: /usr/bin/runc
  - type: directory
    path: /etc/cdi
    uid: 0
    gid: 0
  - type: directory
    path: /run/cdi
    uid: 0
    gid: 0
  - type: directory
    path: /etc/buildkit/cdi
    uid: 0
    gid: 0
  - type: directory
    path: /var/lib/buildkit
    uid: 0
    gid: 0
  - type: directory
    path: /var/lib/containerd
    uid: 0
    gid: 0
annotations:
  org.opencontainers.image.description: A minimal buildkit builder toolkit image
  org.opencontainers.image.licenses: Apache-2.0
entrypoint:
  - buildkitd
