# syntax=dhi.io/build:2-debian13

name: Consul K8s Control Plane 1.7.x (dev)
image: dhi.io/consul-k8s-control-plane
variant: dev
tags:
  - 1.7-dev
  - 1.7.13-dev
  - 1.7-debian-dev
  - 1.7-debian13-dev
  - 1.7.13-debian-dev
  - 1.7.13-debian13-dev
platforms:
  - linux/amd64
  - linux/arm64
dates:
  release: "2025-05-07"
  end-of-life: "2027-04-30"
vars:
  FLAVORED_SUFFIX: -dev
  PACKAGE_NAME: consul-k8s-control-plane-1.7
  SEMVER_MAJOR_MINOR_VERSION: "1.7"
  SEMVER_MAJOR_VERSION: "1"
  SEMVER_VERSION: 1.7.13
  SUFFIX: -dev
  TPROXY_PACKAGE: iptables
  VERSION: 1.7.13-1
contents:
  repositories:
    - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
  keyring:
    - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
  packages:
    - '!gawk'
    - '!libelogind0'
    - '!original-awk'
    - apt
    - base-files
    - bash
    - busybox
    - ca-certificates
    - ca-certificates-bundle
    - consul-k8s-control-plane-1.7-dev=1.7.13-1
    - coreutils
    - diffutils
    - dpkg
    - findutils
    - grep
    - iptables
    - libc-bin
    - mawk
    - perl-base
    - sed
    - tzdata
    - util-linux
accounts:
  root: true
  run-as: root
  users:
    - name: "100"
      uid: 100
      gid: 1000
    - name: _apt
      uid: 42
      gid: 65532
  groups:
    - name: consul-k8s-control-plane
      gid: 1000
      members:
        - "100"
os-release:
  name: Docker Hardened Images (Debian)
  id: debian
  version-id: "13"
  version-codename: trixie
  pretty-name: Docker Hardened Images/Debian GNU/Linux 13 (trixie)
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
environment:
  DEBIAN_FRONTEND: noninteractive
annotations:
  org.opencontainers.image.description: A minimal Consul on Kubernetes control plane image
  org.opencontainers.image.licenses: MPL-2.0
cmd:
  - /usr/bin/consul-k8s-control-plane
