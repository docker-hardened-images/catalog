  - linux/arm64
dates:
  release: "2012-02-21"
vars:
  SEMVER_MAJOR_MINOR_VERSION: "2.4"
  SEMVER_MAJOR_VERSION: "2"
  SEMVER_VERSION: 2.4.68
  VERSION: 2.4.68-0
contents:
  repositories:
    - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
  keyring:
    - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
  packages:
    - '!libelogind0'
    - '!mawk'
    - '!original-awk'
    - base-files
    - ca-certificates-bundle
    - coreutils
    - dash
    - httpd=2.4.68-0
    - libbrotli1
    - libcrypt1
    - libexpat1
    - libnghttp2-14
    - libpcre2-8-0
    - libssl3t64
    - tzdata
    - zlib1g
accounts:
  run-as: www-data
  users:
    - name: www-data
      uid: 65532
      gid: 65532
  groups:
    - name: www-data
      gid: 65532
      members:
        - www-data
os-release:
