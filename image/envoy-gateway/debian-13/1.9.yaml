# syntax=dhi.io/build:2-debian13

name: Envoy Gateway 1.x
image: dhi.io/envoy-gateway
variant: runtime
tags:
  - "1"
  - "1.9"
  - 1.9.1
  - 1-debian
  - 1-debian13
  - 1.9-debian
  - 1.9-debian13
  - 1.9.1-debian
  - 1.9.1-debian13
platforms:
  - linux/amd64
  - linux/arm64
dates:
  release: "2026-08-15"
vars:
  FLAVORED_SUFFIX: ""
  SEMVER_MAJOR_MINOR_VERSION: "1.9"
  SEMVER_MAJOR_VERSION: "1"
  SEMVER_VERSION: 1.9.1
  SUFFIX: ""
  VERSION: 1.9.1-1
contents:
  repositories:
    - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
  keyring:
    - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
  packages:
    - base-files
    - ca-certificates-bundle
    - envoy-gateway=1.9.1-1
    - tzdata
accounts:
  run-as: nonroot
  users:
    - name: nonroot
      uid: 65532
      gid: 65532
  groups:
    - name: nonroot
      gid: 65532
os-release:
  name: Docker Hardened Images (Debian)
  id: debian
  version-id: "13"
  version-codename: trixie
  pretty-name: Docker Hardened Images/Debian GNU/Linux 13 (trixie)
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
work-dir: /home/nonroot
paths:
  - type: directory
    path: /usr/local/bin
    uid: 0
    gid: 0
  - type: symlink
    path: /usr/local/bin/envoy-gateway
    uid: 0
    gid: 0
    source: /usr/bin/envoy-gateway
  - type: directory
    path: /var/lib/eg
    uid: 65532
    gid: 65532
    mode: "0770"
annotations:
  org.opencontainers.image.description: A minimal Envoy Gateway image
  org.opencontainers.image.licenses: Apache-2.0
entrypoint:
  - /usr/local/bin/envoy-gateway
