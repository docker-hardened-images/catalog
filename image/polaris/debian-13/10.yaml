# syntax=dhi.io/build:2-debian13

name: Polaris 10.x
image: dhi.io/polaris
variant: runtime
tags:
  - "10"
  - "10.1"
  - 10.1.8
  - 10-debian
  - 10-debian13
  - 10.1-debian
  - 10.1-debian13
  - 10.1.8-debian
  - 10.1.8-debian13
platforms:
  - linux/amd64
  - linux/arm64
vars:
  FLAVORED_SUFFIX: ""
  SEMVER_MAJOR_MINOR_VERSION: "10.1"
  SEMVER_MAJOR_VERSION: "10"
  SEMVER_VERSION: 10.1.8
  SUFFIX: ""
  VERSION: 10.1.8-1
contents:
  repositories:
    - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
  keyring:
    - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
  packages:
    - base-files
    - ca-certificates-bundle
    - polaris=10.1.8-1
    - tzdata
accounts:
  run-as: "1200"
  users:
    - name: polaris
      uid: 1200
      gid: 101
  groups:
    - name: polaris
      gid: 101
      members:
        - polaris
os-release:
  name: Docker Hardened Images (Debian)
  id: debian
  version-id: "13"
  version-codename: trixie
  pretty-name: Docker Hardened Images/Debian GNU/Linux 13 (trixie)
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
paths:
  - type: directory
    path: /usr/local/bin
    uid: 0
    gid: 0
  - type: symlink
    path: /usr/local/bin/polaris
    uid: 0
    gid: 0
    source: /usr/bin/polaris
annotations:
  org.opencontainers.image.description: A minimal Polaris image
  org.opencontainers.image.licenses: Apache-2.0
entrypoint:
  - polaris
