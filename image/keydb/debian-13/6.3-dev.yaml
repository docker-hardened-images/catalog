# syntax=dhi.io/build:2-debian13

name: KeyDB 6.3.x (dev)
image: dhi.io/keydb
variant: dev
tags:
  - 6-dev
  - 6.3-dev
  - 6.3.4-dev
  - 6-debian-dev
  - 6-debian13-dev
  - 6.3-debian-dev
  - 6.3-debian13-dev
  - 6.3.4-debian-dev
  - 6.3.4-debian13-dev
platforms:
  - linux/amd64
  - linux/arm64
dates:
  release: "2022-05-12"
vars:
  PACKAGE_NAME: keydb-6.3
  SEMVER_MAJOR_MINOR_VERSION: "6.3"
  SEMVER_MAJOR_VERSION: "6"
  SEMVER_VERSION: 6.3.4
  VERSION: 6.3.4-0
contents:
  repositories:
    - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
  keyring:
    - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
  packages:
    - '!gawk'
    - '!libelogind0'
    - '!mawk'
    - '!original-awk'
    - apt
    - base-files
    - bash
    - ca-certificates
    - ca-certificates-bundle
    - coreutils
    - diffutils
    - dpkg
    - findutils
    - grep
    - keydb-6.3-sentinel=6.3.4-0
    - keydb-6.3-server=6.3.4-0
    - keydb-6.3-tools=6.3.4-0
    - libbz2-1.0
    - libc-bin
    - libc6
    - libcurl4t64
    - libgcc-s1
    - liblz4-1
    - libsnappy1v5
    - libssl3t64
    - libstdc++6
    - libuuid1
    - libzstd1
    - mawk
    - perl-base
    - sed
    - tini
    - tzdata
    - util-linux
    - zlib1g
accounts:
  root: true
  run-as: root
  users:
    - name: nonroot
      uid: 65532
      gid: 65532
    - name: _apt
      uid: 42
      gid: 65532
  groups:
    - name: nonroot
      gid: 65532
      members:
        - nonroot
os-release:
  name: Docker Hardened Images (Debian)
  id: debian
  version-id: "13"
  version-codename: trixie
  pretty-name: Docker Hardened Images/Debian GNU/Linux 13 (trixie)
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
work-dir: /data
environment:
  DEBIAN_FRONTEND: noninteractive
paths:
  - type: directory
    path: /usr/local/bin
    uid: 0
    gid: 0
    mode: "0755"
  - type: symlink
    path: /usr/local/bin/keydb-server
    uid: 0
    gid: 0
    source: /usr/bin/keydb-server
  - type: symlink
    path: /usr/local/bin/keydb-cli
    uid: 0
    gid: 0
    source: /usr/bin/keydb-cli
  - type: symlink
    path: /usr/local/bin/keydb-benchmark
    uid: 0
    gid: 0
    source: /usr/bin/keydb-benchmark
  - type: symlink
    path: /usr/local/bin/keydb-check-rdb
    uid: 0
    gid: 0
    source: /usr/bin/keydb-check-rdb
  - type: symlink
    path: /usr/local/bin/keydb-check-aof
    uid: 0
    gid: 0
    source: /usr/bin/keydb-check-aof
  - type: symlink
    path: /usr/local/bin/keydb-sentinel
    uid: 0
    gid: 0
    source: /usr/bin/keydb-sentinel
  - type: symlink
    path: /usr/local/bin/keydb-diagnostic-tool
    uid: 0
    gid: 0
    source: /usr/bin/keydb-diagnostic-tool
  - type: symlink
    path: /usr/local/bin/redis-cli
    uid: 0
    gid: 0
    source: /usr/bin/keydb-cli
  - type: symlink
    path: /etc/keydb/redis.conf
    uid: 0
    gid: 0
    source: /etc/keydb/keydb.conf
  - type: file
    path: /etc/keydb/conf.d/local.conf
    content: |
      bind * -::*
      protected-mode no
      dir /data
      enable-motd no
    uid: 0
    gid: 0
    mode: "0644"
  - type: directory
    path: /data
    uid: 65532
    gid: 65532
    mode: "0770"
  - type: directory
    path: /flash
    uid: 65532
    gid: 65532
    mode: "0770"
annotations:
  org.opencontainers.image.description: A minimal KeyDB image
  org.opencontainers.image.licenses: BSD-3-Clause
entrypoint:
  - /usr/bin/tini
  - --
cmd:
  - keydb-server
  - /etc/keydb/keydb.conf
ports:
  - 6379/tcp
