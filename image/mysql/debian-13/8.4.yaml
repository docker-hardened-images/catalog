# syntax=dhi.io/build:2-debian13

name: MySQL 8.4.x
image: dhi.io/mysql
variant: runtime
tags:
  - "8"
  - "8.4"
  - 8.4.13
  - 8-debian
  - 8-debian13
  - 8.4-debian
  - 8.4-debian13
  - 8.4.13-debian
  - 8.4.13-debian13
platforms:
  - linux/amd64
  - linux/arm64
dates:
  release: "2024-04-10"
  end-of-life: "2032-04-30"
vars:
  ARCH: '#{ target.arch == "amd64" ? "x86_64" : "aarch64" }'
  PACKAGE_NAME: mysql-8.4
  SEMVER_MAJOR_MINOR_VERSION: "8.4"
  SEMVER_MAJOR_VERSION: "8"
  SEMVER_VERSION: 8.4.13
  VERSION: 8.4.13-1
contents:
  repositories:
    - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
  keyring:
    - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
  packages:
    - '!libelogind0'
    - '!mawk'
    - '!original-awk'
    - base-files
    - bash
    - coreutils
    - findutils
    - libaio1t64
    - libcurl4t64
    - libncurses6
    - libnuma1
    - libssl3t64
    - libstdc++6
    - libtirpc3t64
    - mysql-8.4=8.4.13-1
    - zlib1g
accounts:
  run-as: mysql
  users:
    - name: mysql
      uid: 65532
      gid: 65532
  groups:
    - name: mysql
      gid: 65532
      members:
        - mysql
os-release:
  name: Docker Hardened Images (Debian)
  id: debian
  version-id: "13"
  version-codename: trixie
  pretty-name: Docker Hardened Images/Debian GNU/Linux 13 (trixie)
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
environment:
  MYSQLDATA: /var/lib/mysql
  PATH: /opt/mysql/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
paths:
  - type: directory
    path: /var/lib/mysql-files
    uid: 65532
    gid: 65532
    mode: "0755"
  - type: directory
    path: /var/lib/mysql
    uid: 65532
    gid: 65532
    mode: "0755"
