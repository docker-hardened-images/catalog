# syntax=dhi.io/build:2-debian13

name: Gitleaks 8.x
image: dhi.io/gitleaks
variant: runtime
tags:
  - "8"
  - "8.30"
  - 8.30.1
  - 8-debian
  - 8-debian13
  - 8.30-debian
  - 8.30-debian13
  - 8.30.1-debian
  - 8.30.1-debian13
platforms:
  - linux/amd64
  - linux/arm64
vars:
  FLAVORED_SUFFIX: ""
  GITLEAKS_PKG_SUFFIX: ""
  SEMVER_MAJOR_MINOR_VERSION: "8.30"
  SEMVER_MAJOR_VERSION: "8"
  SEMVER_VERSION: 8.30.1
  SUFFIX: ""
  VERSION: 8.30.1-0
contents:
  repositories:
    - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
  keyring:
    - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
  packages:
    - base-files
    - bash
    - ca-certificates-bundle
    - git
    - gitleaks=8.30.1-0
    - openssh-client
    - tzdata
accounts:
  run-as: nonroot
  users:
    - name: nonroot
      uid: 65532
      gid: 65532
  groups:
    - name: nonroot
      gid: 65532
      members:
        - nonroot
os-release:
  name: Docker Hardened Images (Debian)
  id: debian
  version-id: "13"
  version-codename: trixie
  pretty-name: Docker Hardened Images/Debian GNU/Linux 13 (trixie)
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
paths:
  - type: file
    path: /home/nonroot/.git/config
    content: |
      [safe]
          directory = *
    uid: 65532
    gid: 65532
    mode: "0644"
annotations:
  org.opencontainers.image.description: A minimal Gitleaks image for detecting secrets in git repositories
  org.opencontainers.image.licenses: MIT
entrypoint:
  - gitleaks
