# syntax=dhi.io/build:2-debian13

name: VictoriaMetrics Agent (dev)
image: dhi.io/victoriametrics-vmagent
variant: dev
tags:
  - 1-dev
  - 1.156-dev
  - 1.156.0-dev
  - 1-debian-dev
  - 1-debian13-dev
  - 1.156-debian-dev
  - 1.156-debian13-dev
  - 1.156.0-debian-dev
  - 1.156.0-debian13-dev
platforms:
  - linux/amd64
  - linux/arm64
vars:
  DEBIAN_EPOCH_MAJOR_MINOR_VERSION: "1.156"
  DEBIAN_EPOCH_MAJOR_VERSION: "1"
  DEBIAN_EPOCH_VERSION: 1.156.0
  FLAVORED_SUFFIX: -dev
  SEMVER_MAJOR_MINOR_VERSION: "1.156"
  SEMVER_MAJOR_VERSION: "1"
  SEMVER_VERSION: 1.156.0
  SUFFIX: -dev
  VERSION: 1.156.0-2
contents:
  repositories:
    - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
  keyring:
    - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
  packages:
    - '!gawk'
    - '!libelogind0'
    - '!original-awk'
    - apt
    - base-files
    - bash
    - ca-certificates
    - ca-certificates-bundle
    - coreutils
    - diffutils
    - dpkg
    - findutils
    - grep
    - libc-bin
    - mawk
    - perl-base
    - sed
    - tzdata
    - util-linux
    - victoriametrics-dev=1.156.0-2
accounts:
  root: true
  run-as: root
  users:
    - name: nonroot
      uid: 65532
      gid: 65532
    - name: _apt
      uid: 42
      gid: 65532
  groups:
    - name: nonroot
      gid: 65532
      members:
        - nonroot
os-release:
  name: Docker Hardened Images (Debian)
  id: debian
  version-id: "13"
  version-codename: trixie
  pretty-name: Docker Hardened Images/Debian GNU/Linux 13 (trixie)
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
environment:
  DEBIAN_FRONTEND: noninteractive
paths:
  - type: directory
    path: /usr/local/bin
    uid: 0
    gid: 0
  - type: symlink
    path: /usr/local/bin/vmagent
    uid: 0
    gid: 0
    source: /usr/bin/vmagent
annotations:
  org.opencontainers.image.description: A minimal VictoriaMetrics vmagent image
  org.opencontainers.image.licenses: Apache-2.0
entrypoint:
  - /usr/local/bin/vmagent
