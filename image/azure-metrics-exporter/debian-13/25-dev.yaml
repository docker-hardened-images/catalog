# syntax=dhi.io/build:2-debian13

name: Azure Metrics Exporter 25.12.x (dev)
image: dhi.io/azure-metrics-exporter
variant: dev
tags:
  - 25-dev
  - 25.12-dev
  - 25.12.0-dev
  - 25-debian-dev
  - 25-debian13-dev
  - 25.12-debian-dev
  - 25.12-debian13-dev
  - 25.12.0-debian-dev
  - 25.12.0-debian13-dev
platforms:
  - linux/amd64
  - linux/arm64
vars:
  FLAVORED_SUFFIX: -dev
  SEMVER_MAJOR_MINOR_VERSION: "25.12"
  SEMVER_MAJOR_VERSION: "25"
  SEMVER_VERSION: 25.12.0
  SUFFIX: -dev
  VERSION: 25.12.0-5
contents:
  repositories:
    - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
  keyring:
    - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
  packages:
    - '!gawk'
    - '!libelogind0'
    - '!original-awk'
    - apt
    - azure-metrics-exporter-dev=25.12.0-5
    - base-files
    - bash
    - ca-certificates
    - ca-certificates-bundle
    - coreutils
    - diffutils
    - dpkg
    - findutils
    - grep
    - libc-bin
    - mawk
    - perl-base
    - sed
    - tzdata
    - util-linux
accounts:
  root: true
  run-as: root
  users:
    - name: nonroot
      uid: 65532
      gid: 65532
    - name: _apt
      uid: 42
      gid: 65532
  groups:
    - name: nonroot
      gid: 65532
      members:
        - nonroot
os-release:
  name: Docker Hardened Images (Debian)
  id: debian
  version-id: "13"
  version-codename: trixie
  pretty-name: Docker Hardened Images/Debian GNU/Linux 13 (trixie)
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
environment:
  DEBIAN_FRONTEND: noninteractive
paths:
  - type: directory
    path: /usr/local/bin
    uid: 0
    gid: 0
  - type: symlink
    path: /usr/local/bin/azure-metrics-exporter
    uid: 0
    gid: 0
    source: /usr/bin/azure-metrics-exporter
  - type: directory
    path: /tmp
    uid: 0
    gid: 0
    mode: "1777"
annotations:
  org.opencontainers.image.description: A minimal Azure Metrics Exporter image
  org.opencontainers.image.licenses: MIT
entrypoint:
  - /usr/local/bin/azure-metrics-exporter
ports:
  - 8080/tcp
