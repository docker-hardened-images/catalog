# syntax=dhi.io/build:2-debian13

name: Grafana Mimir 3.x
image: dhi.io/mimir
variant: runtime
tags:
  - "3"
  - "3.2"
  - 3.2.0
  - 3-debian
  - 3-debian13
  - 3.2-debian
  - 3.2-debian13
  - 3.2.0-debian
  - 3.2.0-debian13
platforms:
  - linux/amd64
  - linux/arm64
dates:
  release: "2026-07-01"
vars:
  FLAVORED_SUFFIX: ""
  SEMVER_MAJOR_MINOR_VERSION: "3.2"
  SEMVER_MAJOR_VERSION: "3"
  SEMVER_VERSION: 3.2.0
  SUFFIX: ""
  VERSION: 3.2.0-3
contents:
  repositories:
    - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
  keyring:
    - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
  packages:
    - base-files
    - ca-certificates-bundle
    - mimir=3.2.0-3
    - tzdata
accounts:
  run-as: nonroot
  users:
    - name: nonroot
      uid: 65532
      gid: 65532
  groups:
    - name: nonroot
      gid: 65532
      members:
        - nonroot
os-release:
  name: Docker Hardened Images (Debian)
  id: debian
  version-id: "13"
  version-codename: trixie
  pretty-name: Docker Hardened Images/Debian GNU/Linux 13 (trixie)
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
work-dir: /var/mimir
paths:
  - type: directory
    path: /var/mimir
    uid: 65532
    gid: 65532
    mode: "0755"
annotations:
  org.opencontainers.image.description: A minimal Grafana Mimir image
  org.opencontainers.image.licenses: AGPL-3.0-only
entrypoint:
  - /usr/bin/mimir
ports:
  - 8080/tcp
  - 9095/tcp
