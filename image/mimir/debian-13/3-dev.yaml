# syntax=dhi.io/build:2-debian13

name: Grafana Mimir 3.x (dev)
image: dhi.io/mimir
variant: dev
tags:
  - 3-dev
  - 3.2-dev
  - 3.2.0-dev
  - 3-debian-dev
  - 3-debian13-dev
  - 3.2-debian-dev
  - 3.2-debian13-dev
  - 3.2.0-debian-dev
  - 3.2.0-debian13-dev
platforms:
  - linux/amd64
  - linux/arm64
dates:
  release: "2026-07-01"
vars:
  FLAVORED_SUFFIX: -dev
  SEMVER_MAJOR_MINOR_VERSION: "3.2"
  SEMVER_MAJOR_VERSION: "3"
  SEMVER_VERSION: 3.2.0
  SUFFIX: -dev
  VERSION: 3.2.0-3
contents:
  repositories:
    - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
  keyring:
    - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
  packages:
    - '!gawk'
    - '!libelogind0'
    - '!original-awk'
    - apt
    - base-files
    - bash
    - ca-certificates
    - ca-certificates-bundle
    - coreutils
    - diffutils
    - dpkg
    - findutils
    - grep
    - libc-bin
    - mawk
    - mimir-dev=3.2.0-3
    - perl-base
    - sed
    - tzdata
    - util-linux
accounts:
  root: true
  run-as: root
  users:
    - name: nonroot
      uid: 65532
      gid: 65532
    - name: _apt
      uid: 42
      gid: 65532
  groups:
    - name: nonroot
      gid: 65532
      members:
        - nonroot
os-release:
  name: Docker Hardened Images (Debian)
  id: debian
  version-id: "13"
  version-codename: trixie
  pretty-name: Docker Hardened Images/Debian GNU/Linux 13 (trixie)
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
work-dir: /var/mimir
environment:
  DEBIAN_FRONTEND: noninteractive
paths:
  - type: directory
    path: /var/mimir
    uid: 65532
    gid: 65532
    mode: "0755"
annotations:
  org.opencontainers.image.description: A minimal Grafana Mimir image
  org.opencontainers.image.licenses: AGPL-3.0-only
entrypoint:
  - /usr/bin/mimir
ports:
  - 8080/tcp
  - 9095/tcp
