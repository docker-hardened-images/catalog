# syntax=dhi.io/build:2-debian13

name: Calico Whisker Backend 3.32.x
image: dhi.io/calico-whisker-backend
variant: runtime
tags:
  - "3"
  - "3.32"
  - 3.32.4
  - v3.32.4
  - 3-debian
  - 3-debian13
  - 3.32-debian
  - 3.32-debian13
  - 3.32.4-debian
  - 3.32.4-debian13
platforms:
  - linux/amd64
  - linux/arm64
dates:
  release: "2026-04-30"
vars:
  COMMIT_SHA: edf78704a2c852da907d38bca19de94e5b69893a
  FLAVORED_SUFFIX: ""
  PACKAGE_VERSION: 3.32.4-4
  SEMVER_MAJOR_MINOR_VERSION: "3.32"
  SEMVER_MAJOR_VERSION: "3"
  SEMVER_VERSION: 3.32.4
  SUFFIX: ""
  VERSION: 3.32.4
contents:
  repositories:
    - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
  keyring:
    - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
  packages:
    - base-files
    - ca-certificates-bundle
    - calico-whisker-backend-3.32=3.32.4-4
    - tzdata
  builds:
    - name: sbom
      contents:
        packages:
          - bash
          - coreutils
        files:
          - url: git+https://github.com/projectcalico/calico.git#v3.32.4
            checksum: edf78704a2c852da907d38bca19de94e5b69893a
            path: ${source.dir}/calico
            spdx:
              name: calico-whisker-backend
              version: 3.32.4
              packages:
                - name: calico-whisker-backend
                  purl: pkg:golang/github.com/projectcalico/calico/whisker-backend@3.32.4
                  license: Apache-2.0
            uid: 0
            gid: 0
      pipeline:
        - name: check sbom record
          runs: |
            set -eux -o pipefail

            test -s /opt/docker/sbom/calico-whisker-backend/.spdx.calico-whisker-backend.json
      outputs:
        - source: /opt/docker/sbom/calico-whisker-backend
          target: /opt/docker/sbom/calico-whisker-backend
          uid: 0
          gid: 0
accounts:
  run-as: "10001"
  users:
    - name: whisker-backend
      uid: 10001
      gid: 10001
  groups:
    - name: whisker-backend
      gid: 10001
      members:
        - whisker-backend
os-release:
  name: Docker Hardened Images (Debian)
  id: debian
  version-id: "13"
  version-codename: trixie
  pretty-name: Docker Hardened Images/Debian GNU/Linux 13 (trixie)
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
paths:
  - type: symlink
    path: /whisker-backend
    uid: 0
    gid: 0
    source: /usr/local/bin/whisker-backend
  - type: directory
    path: /usr/local/bin
    uid: 0
    gid: 0
    mode: "0755"
  - type: symlink
    path: /usr/local/bin/whisker-backend
    uid: 0
    gid: 0
    source: /usr/bin/whisker-backend
  - type: directory
    path: /licenses
    uid: 0
    gid: 0
    mode: "0755"
  - type: file
    path: /licenses/LICENSE
    uid: 0
    gid: 0
    mode: "0644"
    source: image/calico-whisker-backend/config/LICENSE
annotations:
  org.opencontainers.image.description: A minimal Calico Whisker Backend image
  org.opencontainers.image.licenses: Apache-2.0
entrypoint:
  - /whisker-backend
ports:
  - 8080/tcp
