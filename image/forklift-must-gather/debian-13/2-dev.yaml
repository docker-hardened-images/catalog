# syntax=dhi.io/build:2-debian13

name: Forklift Must-Gather 2.x (dev)
image: dhi.io/forklift-must-gather
variant: dev
tags:
  - 2-dev
  - 2.12-dev
  - 2.12.8-dev
  - 2-debian-dev
  - 2-debian13-dev
  - 2.12-debian-dev
  - 2.12-debian13-dev
  - 2.12.8-debian-dev
  - 2.12.8-debian13-dev
platforms:
  - linux/amd64
  - linux/arm64
dates:
  release: "2024-09-20"
vars:
  FLAVORED_SUFFIX: -dev
  OPENSHIFT_CLIENT_VERSION: 4.21.30-1
  SEMVER_MAJOR_MINOR_VERSION: "2.12"
  SEMVER_MAJOR_VERSION: "2"
  SEMVER_VERSION: 2.12.8
  SUFFIX: -dev
  VERSION: 2.12.8-1
contents:
  repositories:
    - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
  keyring:
    - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
  packages:
    - '!gawk'
    - '!libelogind0'
    - '!original-awk'
    - apt
    - base-files
    - bash
    - ca-certificates
    - ca-certificates-bundle
    - coreutils
    - diffutils
    - dpkg
    - findutils
    - forklift-must-gather=2.12.8-1
    - gawk
    - grep
    - gzip
    - jq
    - libc-bin
    - mawk
    - openshift-client-4.21-dev=4.21.30-1
    - perl-base
    - sed
    - tar
    - tzdata
    - util-linux
accounts:
  root: true
  run-as: root
  users:
    - name: nonroot
      uid: 65532
      gid: 65532
    - name: _apt
      uid: 42
      gid: 65532
  groups:
    - name: nonroot
      gid: 65532
      members:
        - nonroot
os-release:
  name: Docker Hardened Images (Debian)
  id: debian
  version-id: "13"
  version-codename: trixie
  pretty-name: Docker Hardened Images/Debian GNU/Linux 13 (trixie)
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
environment:
  DEBIAN_FRONTEND: noninteractive
paths:
  - type: directory
    path: /must-gather
    uid: 65532
    gid: 65532
    mode: "0775"
annotations:
  org.opencontainers.image.description: A minimal Forklift must-gather image
  org.opencontainers.image.licenses: Apache-2.0
entrypoint:
  - /usr/bin/gather
