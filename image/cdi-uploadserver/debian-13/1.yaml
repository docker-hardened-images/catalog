name: CDI Upload Server 1.x
image: dhi.io/cdi-uploadserver
variant: runtime
tags:
  - "1"
  - "1.66"
  - 1.66.1
  - 1-debian
  - 1-debian13
  - 1.66-debian
  - 1.66-debian13
  - 1.66.1-debian
  - 1.66.1-debian13
platforms:
  - linux/amd64
  - linux/arm64
dates:
  release: "2025-12-11"
vars:
  COMMIT_SHA: c8129be0728afa1a2c49b69b1c0847a42730a732
  SEMVER_MAJOR_MINOR_VERSION: "1.66"
  SEMVER_MAJOR_VERSION: "1"
  SEMVER_VERSION: 1.66.1
  VERSION: 1.66.1
contents:
  repositories:
    - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
  keyring:
    - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
  packages:
    - base-files
    - ca-certificates-bundle
    - libc6
    - libnbd-bin
    - libnbd0
    - qemu-utils
    - tar
    - tzdata
    - util-linux
  builds:
    - name: cdi-uploadserver
      caches:
        - path: /go/pkg/mod
      contents:
        packages:
          - pkg-config
          - libnbd-dev
          - bash
          - ca-certificates-bundle
          - coreutils
          - golang-1.26
          - findutils
          - mawk
          - sed
        files:
          - url: git+https://github.com/kubevirt/containerized-data-importer.git#v1.66.1
            checksum: c8129be0728afa1a2c49b69b1c0847a42730a732
            path: /go/src/kubevirt.io/containerized-data-importer
            spdx:
              name: cdi-uploadserver
              version: 1.66.1
              packages:
                - name: cdi-uploadserver
                  purl: pkg:golang/kubevirt.io/containerized-data-importer@1.66.1
                  license: Apache-2.0
            uid: 0
            gid: 0
      pipeline:
        - name: update go dependencies
          uses: go/bump@v2
          work-dir: /go/src/kubevirt.io/containerized-data-importer
          environment:
            GOWORK: "off"
          with:
            deps:
              - golang.org/x/crypto@v0.58.0
              - golang.org/x/net@v0.62.0
              - golang.org/x/sys@v0.45.0
              - golang.org/x/text@v0.39.0
              - github.com/klauspost/compress@v1.18.7
              - github.com/moby/sys/user@v0.4.1
              - github.com/ulikunitz/xz@v0.5.15
              - go.opentelemetry.io/otel@v1.45.0
              - go.opentelemetry.io/otel/sdk@v1.45.0
              - google.golang.org/grpc@v1.83.2
              - github.com/go-jose/go-jose/v4@v4.1.6
            downgrade: true
            tidy: true
        - name: test
          work-dir: /go/src/kubevirt.io/containerized-data-importer
          environment:
            GOWORK: "off"
          runs: |
            set -eux -o pipefail

            go test ./pkg/uploadserver/...
        - name: build
          uses: go/build@v1
          work-dir: /go/src/kubevirt.io/containerized-data-importer/cmd/cdi-uploadserver
          environment:
            GOWORK: "off"
          with:
            cgo_enabled: 1
            ldflags:
              - -X kubevirt.io/containerized-data-importer/pkg/version.gitVersion=v1.66.1
              - -X kubevirt.io/containerized-data-importer/pkg/version.gitCommit=c8129be0728afa1a2c49b69b1c0847a42730a732
            output: ${target.dir}/usr/local/bin/cdi-uploadserver
      outputs:
        - source: ${target.dir}/usr/local/bin/cdi-uploadserver
          target: /usr/local/bin/cdi-uploadserver
          uid: 0
          gid: 0
        - source: /opt/docker/sbom/cdi-uploadserver
          target: /opt/docker/sbom/cdi-uploadserver
          uid: 0
          gid: 0
accounts:
  run-as: "65532"
  users:
    - name: nonroot
      uid: 65532
      gid: 65532
  groups:
    - name: nonroot
      gid: 65532
      members:
        - nonroot
os-release:
  name: Docker Hardened Images (Debian)
  id: debian
  version-id: "13"
  version-codename: trixie
  pretty-name: Docker Hardened Images/Debian GNU/Linux 13 (trixie)
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
annotations:
  org.opencontainers.image.description: A minimal CDI Upload Server image
  org.opencontainers.image.licenses: Apache-2.0
entrypoint:
  - /usr/local/bin/cdi-uploadserver
  - -alsologtostderr
ports:
