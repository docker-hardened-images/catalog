metadata:
  display-name: Spilo
  short-description: HA PostgreSQL appliance with Patroni, a multi-major PostgreSQL bundle, and WAL-G backups.
  featured: false
  home-url: https://github.com/zalando/spilo
  categories:
    - databases-and-storage
  included-tools:
    - name: patroni
      description: PostgreSQL high-availability manager supervising the bundled servers.
    - name: patronictl
      description: Cluster management CLI for Patroni.
    - name: postgres
      description: PostgreSQL servers for majors 14 through 17 under /usr/lib/postgresql.
    - name: psql
      description: PostgreSQL interactive client.
    - name: pg_upgrade
      description: In-place major upgrade driver used by /scripts/inplace_upgrade.py.
    - name: wal-g
      description: WAL archiving, base backup, and restore tool.
    - name: pgbouncer
      description: Connection pooler, enabled through configure_spilo.
    - name: pgqd
      description: PgQ ticker daemon for the bundled pgq extension.
