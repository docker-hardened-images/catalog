          runs: |
            set -eux -o pipefail

            TRIPLET="$(gcc -print-multiarch)"
            install -d "${target.dir}/usr/lib/$TRIPLET"
            ln -s blas/libblas.so.3 "${target.dir}/usr/lib/$TRIPLET/libblas.so.3"
            ln -s lapack/liblapack.so.3 "${target.dir}/usr/lib/$TRIPLET/liblapack.so.3"
