    - name: spilo-python
      caches:
        - path: /root/.cache/pip
      contents:
        repositories:
          - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
        keyring:
          - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
        packages:
          - bash
          - build-essential
          - coreutils
          - findutils
          - libpq-dev
          - libpython-3.13-dev=3.13.16-0
          - python-3.13-dev=3.13.16-0
          - libpython-3.13-dev
          - python-3.13-dev
          - libpython-3.13-minimal=3.13.16-0
          - libpython-3.13-stdlib=3.13.16-0
          - libpython-3.13=3.13.16-0
          - python-3.13=3.13.16-0
          - python-3.13-minimal=3.13.16-0
          - libpython-3.13-minimal
          - libpython-3.13-stdlib
          - libpython-3.13
          - python-3.13
          - python-3.13-minimal
          - libbz2-1.0
          - libc6
          - libcrypt1
          - libdb5.3t64
          - libffi8
          - libgcc-s1
          - libgdbm-compat4t64
          - liblzma5
          - libncursesw6
          - libreadline8t64
          - libsqlite3-0
          - libstdc++6
          - libtinfo6
          - libuuid1
          - libzstd1
          - zlib1g
          - grep
          - python3-pip-whl
          - python3-setuptools-whl
          - sed
      pipeline:
        - name: install patroni stack
          privileged: true
          runs: |
            set -eux -o pipefail

            python3 -m venv '${target.dir}/opt/spilo'
            '${target.dir}/opt/spilo/bin/pip' install \
              "patroni[kubernetes,etcd,consul,zookeeper,aws]==4.1.0" \
              psycopg2 \
              pystache \
              psutil \
              python-dateutil \
              six \
              requests

            '${target.dir}/opt/spilo/bin/python3' -m pip uninstall -y pip setuptools wheel
            rm -rf '${target.dir}'/opt/spilo/lib/python*/site-packages/pip '${target.dir}'/opt/spilo/lib/python*/site-packages/pip-*.dist-info
            find ${target.dir}/opt/spilo -depth \
              \( -name tests -o -name test -o -name __pycache__ -o -name '*.pyc' \) \
              -exec rm -rf {} +
            rm -f '${target.dir}'/opt/spilo/bin/activate* '${target.dir}'/opt/spilo/bin/Activate.ps1 '${target.dir}'/opt/spilo/bin/pip*
            test ! -e '${target.dir}/opt/spilo/lib/python3.13/site-packages/pip'
            for f in '${target.dir}'/opt/spilo/bin/*; do
              [ -f "$f" ] && [ ! -L "$f" ] || continue
              head -c 2 "$f" | grep -q '^#!' || continue
              sed -i '1s|^#!${target.dir}/opt/spilo/bin/|#!/opt/spilo/bin/|' "$f"
            done
            sed -i 's|${target.dir}/opt/spilo|/opt/spilo|' '${target.dir}/opt/spilo/pyvenv.cfg'
            grep -q '^#!/opt/spilo/bin/python' '${target.dir}/opt/spilo/bin/patroni'

            install -d ${target.dir}/pth
            echo "/opt/spilo/lib/python3.13/site-packages" > ${target.dir}/pth/spilo.pth
        - name: python dependencies sbom
          uses: sbom@v1
          with:
            extra-scanners: python-package-cataloger
            prefix: spilo-python
            source: ${target.dir}/opt/spilo
      outputs:
        - source: ${target.dir}/opt/spilo
          target: /opt/spilo
          uid: 0
          gid: 0
        - source: ${target.dir}/pth/spilo.pth
          target: /usr/lib/python3.13/site-packages/spilo.pth
          uid: 0
          gid: 0
        - source: /opt/docker/sbom/spilo-python
          target: /opt/docker/sbom/spilo-python
          uid: 0
          gid: 0
