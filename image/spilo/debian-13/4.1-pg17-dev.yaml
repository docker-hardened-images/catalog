            uid: 0
            gid: 0
          - url: git+https://github.com/libusual/libusual.git#4927766bcf9b9eb0b6785e77b1c0255fdf248eb1
            checksum: 4927766bcf9b9eb0b6785e77b1c0255fdf248eb1
            path: ${source.dir}/libusual
            spdx:
