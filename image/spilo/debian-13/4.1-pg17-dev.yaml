          - build-essential
          - coreutils
          - diffutils
          - findutils
          - gawk
          - grep
          - libcurl4-openssl-dev
          - libevent-dev
          - libpam0g-dev
          - libssl-dev
          - libtool
          - perl
          - pkgconf
          - postgresql-17=17.11-1
          - libcurl4t64
          - libgssapi-krb5-2
          - libicu76
          - libldap2
          - liblz4-1
          - libnuma1
          - libpam0g
          - libreadline8t64
          - libselinux1
          - libssl3t64
          - liburing2
          - libuuid1
          - libxml2
          - libxslt1.1
          - libzstd1
          - llvm
          - tzdata
          - zlib1g
          - sed
        files:
          - url: git+https://github.com/pgq/pgqd.git#v3.5
            checksum: 3edb5c00959c5be2f91f63d90457281b0999e902
            path: ${source.dir}/pgqd
