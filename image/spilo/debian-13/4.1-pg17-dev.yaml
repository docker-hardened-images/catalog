        - name: build pgqd
          work-dir: ${source.dir}/pgqd
          runs: |
            set -eux -o pipefail

            rm -rf lib
            cp -a '${source.dir}/libusual' lib
            ./autogen.sh
            ./configure --prefix=/usr/local \
              --with-pgconfig=/usr/bin/pg_config
            make -j"$(nproc)" pgqd
            install -D -s -m 0755 pgqd '${target.dir}/usr/local/bin/pgqd'
