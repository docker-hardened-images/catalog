      pipeline:
        - name: patch pglogical_ticker
          uses: patch@v1
          work-dir: ${source.dir}/pglogical_ticker
          with:
            options: -p1
            patches:
              - ${source.dir}/patch/pglogical-ticker-procnumber.patch
        - name: build extensions
          runs: |
            set -eux -o pipefail

            export PG_CONFIG=/usr/bin/pg_config
            STAGE='${target.dir}/stage'

            LIBDIR="/usr/lib/$(gcc -print-multiarch)"
            ln -sf blas/libblas.so.3 "$LIBDIR/libblas.so.3"
            ln -sf lapack/liblapack.so.3 "$LIBDIR/liblapack.so.3"

            build_pgxs() {
              d="$1"
              shift
              make -C "$d" USE_PGXS=1 PG_CONFIG="$PG_CONFIG" OPTFLAGS="" "$@" -j"$(nproc)"
              make -C "$d" USE_PGXS=1 PG_CONFIG="$PG_CONFIG" OPTFLAGS="" "$@" install DESTDIR="$STAGE"
            }

            for d in pg_cron pgextwlist pgq pgq_node pg_stat_kcache set_user pg_permissions pg_dirtyread hll hypopg pg_partman plproxy pgaudit pldebugger pglogical_ticker plpgsql_check pgl_ddl_deploy pg_repack wal2json decoderbufs pgvector roaringbitmap pgfaceting bg_mon pg_auth_mon pg_mon pg_profile plprofiler extra_window_functions first_last_agg; do
              build_pgxs '${source.dir}'/"$d"
            done

            build_pgxs '${source.dir}'/pglogical-REL2_4_8

            build_pgxs '${source.dir}'/pllua LUAV=5.4 LUA=/usr/bin/lua5.4 LUAC=/usr/bin/luac5.4 LUA_INCDIR=/usr/include/lua5.4 LUALIB=-llua5.4

            build_pgxs '${source.dir}'/pg_checksums

            cd '${source.dir}'/timescaledb
            cmake -B build -S . -DAPACHE_ONLY=1 -DCMAKE_BUILD_TYPE=RelWithDebInfo \
              -DREGRESS_CHECKS=OFF -DTAP_CHECKS=OFF -DWARNINGS_AS_ERRORS=OFF \
              -DSEND_TELEMETRY_DEFAULT=OFF -DPG_CONFIG="$PG_CONFIG"
            make -C build -j"$(nproc)"
            DESTDIR="$STAGE" make -C build install

            install -d /usr/local/bin
            {
              echo '#!/bin/sh'
              echo 'command -v "$@"'
            } > /usr/local/bin/which
            chmod 0755 /usr/local/bin/which

            cd '${source.dir}'/postgis
            ./autogen.sh
            ./configure --with-pgconfig="$PG_CONFIG" --with-raster --with-topology \
              --with-address-standardizer --with-sfcgal
            make -j"$(nproc)"
            make install DESTDIR="$STAGE"
            ln -s postgis-3.so "$STAGE"/usr/lib/postgresql/16/lib/postgis-2.5.so

            find "$STAGE" -name '*.so' -exec strip --strip-unneeded {} +
            rm -rf "$STAGE"/usr/lib/postgresql/16/include
            find "$STAGE" -name '*.a' -delete

            install -d "$STAGE/usr/lib/postgresql/16/bin"
            for f in "$STAGE"/usr/bin/*; do
              ln -s '/opt/postgresql/16/usr/bin/'"$(basename "$f")" "$STAGE/usr/lib/postgresql/16/bin/$(basename "$f")"
            done
      paths:
        - type: file
          path: ${source.dir}/patch/pglogical-ticker-procnumber.patch
          uid: 0
          gid: 0
          source: image/spilo/patch/pglogical-ticker-procnumber.patch
      outputs:
        - source: ${target.dir}/stage/usr/lib/postgresql/16
          target: /opt/postgresql/16/usr/lib/postgresql/16
          uid: 0
          gid: 0
        - source: ${target.dir}/stage/usr/bin
          target: /opt/postgresql/16/usr/bin
          uid: 0
          gid: 0
        - source: /opt/docker/sbom/pgaudit-16
          target: /opt/docker/sbom/pgaudit-16
          uid: 0
          gid: 0
