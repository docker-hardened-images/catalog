    - name: spilo-runtime-tree
      work-dir: ${source.dir}/spilo
      contents:
        packages:
          - bash
          - build-essential
          - coreutils
          - findutils
          - patch
        files:
          - url: git+https://github.com/zalando/spilo.git#4.1-p2
            checksum: 550c5d8c183340ccd98b19098f53f1261b71539a
            path: ${source.dir}/spilo
            spdx:
              name: spilo
              version: 4.1-p2
              packages:
                - name: spilo
                  purl: pkg:github/zalando/spilo@4.1-p2
                  license: Apache-2.0
            uid: 0
            gid: 0
      pipeline:
        - name: patch runtime scripts
          uses: patch@v1
          with:
            options: -p1
            patches:
              - ${source.dir}/patch/launch-drop-compress-and-locale-archive.patch
              - ${source.dir}/patch/configure-spilo-no-embedded-etcd.patch
              - ${source.dir}/patch/configure-spilo-socket-dir.patch
        - name: assemble runtime tree
          work-dir: ${source.dir}/spilo/postgres-appliance
          runs: |
            set -eux -o pipefail

            D='${target.dir}'
            install -d "$D/scripts" "$D/etc/runit/runsvdir/default" "$D/home/postgres" "$D/usr/local/lib" "$D/etc"

            cp -a scripts/. "$D/scripts/"
            cp -a bootstrap/. "$D/scripts/"
            cp -a major_upgrade/. "$D/scripts/"
            install -m 0755 launch.sh "$D/launch.sh"
            install -m 0644 motd "$D/etc/motd"

            for svc in cron patroni pgbouncer pgqd; do
              cp -a "runit/$svc" "$D/etc/runit/runsvdir/default/"
              chmod 755 "$D/etc/runit/runsvdir/default/$svc"/*
              ln -s "/run/supervise/$svc" "$D/etc/runit/runsvdir/default/$svc/supervise"
            done

            gcc -s -shared -fPIC cron_unprivileged.c -o "$D/usr/local/lib/cron_unprivileged.so"

            install -d "$D/usr/local/bin"
            {
              echo '#!/bin/sh'
              echo 'command -v "$@"'
            } > "$D/usr/local/bin/which"
            chmod 0755 "$D/usr/local/bin/which"

            install -d "$D/root/.config/patroni"
            ln -s /home/postgres/postgres.yml "$D/root/.config/patroni/patronictl.yaml"
            printf 'source /etc/motd\n' > "$D/root/.bashrc"

            install -m 0644 pgq_ticker.ini "$D/home/postgres/pgq_ticker.ini"
            ln -s /run/postgres.yml "$D/home/postgres/postgres.yml"
            ln -s /run/etc "$D/home/postgres/etc"
            ln -s /run/postgresql/.bash_history "$D/home/postgres/.bash_history"
            ln -s /run/postgresql/.psql_history "$D/home/postgres/.psql_history"
            ln -s /etc/skel/.bashrc "$D/home/postgres/.bashrc"
            install -d "$D/home/postgres/.config/patroni"
            ln -s /home/postgres/postgres.yml "$D/home/postgres/.config/patroni/patronictl.yaml"

            install -d "$D/home/postgres/pgdata"

            chown -R 70:0 "$D/home/postgres"
            chmod -R g=u "$D/home/postgres"
