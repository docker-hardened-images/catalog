  builds:
    - name: postgresql-17-bin-links
      contents:
        repositories:
          - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
        keyring:
          - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
        packages:
          - bash
          - coreutils
          - postgresql-17=17.11-1
      pipeline:
        - name: link binaries
          runs: |
            set -eux -o pipefail

            install -d '${target.dir}/usr/lib/postgresql/17/bin'
            while IFS= read -r path; do
              case "$path" in
                /usr/bin/?*)
                  test -f "$path"
                  ln -s "$path" '${target.dir}/usr/lib/postgresql/17/bin/'"$(basename "$path")"
                  ;;
              esac
            done < /var/lib/dpkg/info/postgresql-17.list
            test -x '${target.dir}/usr/lib/postgresql/17/bin/postgres'
      outputs:
        - source: ${target.dir}/usr/lib/postgresql/17/bin
          target: /usr/lib/postgresql/17/bin
          uid: 0
          gid: 0
    - name: postgresql-14-relocate
      contents:
        repositories:
          - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
        keyring:
          - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
        packages:
          - bash
          - coreutils
          - postgresql-14=14.24-1
          - libcurl4t64
          - libgssapi-krb5-2
          - libicu76
          - libldap2
          - liblz4-1
          - libnuma1
          - libpam0g
          - libreadline8t64
          - libselinux1
          - libssl3t64
          - liburing2
          - libuuid1
          - libxml2
          - libxslt1.1
          - libzstd1
          - llvm
          - tzdata
          - zlib1g
      pipeline:
        - name: relocate
          runs: |
            set -eux -o pipefail

            P='${target.dir}/opt/postgresql/14/usr'
            install -d "$P/bin" "$P/lib/postgresql/14/bin"
            cp -a /usr/lib/postgresql/14/. "$P/lib/postgresql/14/"
            rm -rf "$P/lib/postgresql/14/include"
            while IFS= read -r path; do
              case "$path" in
                /usr/bin/?*)
                  test -f "$path"
                  cp -a "$path" "$P/bin/"
                  ln -s '/opt/postgresql/14/usr/bin/'"$(basename "$path")" "$P/lib/postgresql/14/bin/$(basename "$path")"
                  ;;
              esac
            done < /var/lib/dpkg/info/postgresql-14.list
            "$P/bin/postgres" --version
            test "$("$P/bin/pg_config" --sharedir)" = "$P/lib/postgresql/14/share"
      outputs:
        - source: ${target.dir}/opt/postgresql/14/usr/bin
          target: /opt/postgresql/14/usr/bin
          uid: 0
          gid: 0
        - source: ${target.dir}/opt/postgresql/14/usr/lib/postgresql/14
          target: /opt/postgresql/14/usr/lib/postgresql/14
          uid: 0
          gid: 0
