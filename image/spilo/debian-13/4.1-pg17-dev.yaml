                  license: MIT
            uid: 0
            gid: 0
          - url: git+https://github.com/zserge/jsmn.git#85695f3d5903b1cd5b4030efe50db3b4f5f3c928
            checksum: 85695f3d5903b1cd5b4030efe50db3b4f5f3c928
            path: ${source.dir}/jsmn
            spdx:
              name: jsmn
              version: 85695f3d5903b1cd5b4030efe50db3b4f5f3c928
              packages:
                - name: jsmn
                  purl: pkg:github/zserge/jsmn@85695f3d5903b1cd5b4030efe50db3b4f5f3c928
                  license: MIT
            uid: 0
            gid: 0
