# syntax=dhi.io/build:2-debian13

name: Virt Export Server 1.x
image: dhi.io/virt-exportserver
variant: runtime
tags:
  - "1"
  - "1.9"
  - 1.9.0
  - 1-debian
  - 1-debian13
  - 1.9-debian
  - 1.9-debian13
  - 1.9.0-debian
  - 1.9.0-debian13
platforms:
  - linux/amd64
  - linux/arm64
dates:
  release: "2026-07-27"
vars:
  COMMIT_SHA: 79d34c1762169e5b0370ec491cef5ca12e6b504c
  SEMVER_MAJOR_MINOR_VERSION: "1.9"
  SEMVER_MAJOR_VERSION: "1"
  SEMVER_VERSION: 1.9.0
  VERSION: 1.9.0
contents:
  repositories:
    - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
  keyring:
    - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
  packages:
    - base-files
    - ca-certificates-bundle
    - tar
    - tzdata
  builds:
    - name: virt-exportserver
      work-dir: /go/src/kubevirt.io/kubevirt
      caches:
        - path: /go/pkg/mod
      contents:
        packages:
          - bash
          - ca-certificates-bundle
          - coreutils
          - golang-1.26
          - findutils
          - mawk
          - sed
        files:
          - url: git+https://github.com/kubevirt/kubevirt.git#v1.9.0
            checksum: 79d34c1762169e5b0370ec491cef5ca12e6b504c
            path: /go/src/kubevirt.io/kubevirt
            spdx:
              name: virt-exportserver
              version: 1.9.0
              packages:
                - name: virt-exportserver
                  purl: pkg:golang/kubevirt.io/kubevirt@1.9.0
                  license: Apache-2.0
            uid: 0
            gid: 0
      pipeline:
        - name: patch go dependencies (1.9 only)
          uses: go/bump@v2
          with:
            deps:
              - github.com/containernetworking/plugins@v1.9.0
              - github.com/google/cel-go@v0.29.0
              - github.com/klauspost/compress@v1.18.7
              - go.mongodb.org/mongo-driver@v1.17.7
              - golang.org/x/net@v0.56.0
              - golang.org/x/text@v0.39.0
              - google.golang.org/grpc@v1.82.1
            download: true
        - name: test
          runs: |
            set -eux -o pipefail

            CGO_ENABLED=0 go test ./cmd/virt-exportserver/...
        - name: build
          uses: go/build@v1
          environment:
            GOFLAGS: -buildvcs=false
          with:
            ldflags:
              - -X kubevirt.io/client-go/version.gitVersion=v1.9.0
              - -X kubevirt.io/client-go/version.gitCommit=79d34c1762169e5b0370ec491cef5ca12e6b504c
            output: ${target.dir}/usr/local/bin/virt-exportserver
            packages: ./cmd/virt-exportserver
      paths:
        - type: directory
          path: ${source.dir}/patch
          uid: 0
          gid: 0
          source: image/virt-exportserver/patch
      outputs:
        - source: ${target.dir}/usr/local/bin/virt-exportserver
          target: /usr/local/bin/virt-exportserver
          uid: 0
          gid: 0
        - source: /opt/docker/sbom/virt-exportserver
          target: /opt/docker/sbom/virt-exportserver
          uid: 0
          gid: 0
accounts:
  run-as: "65532"
  users:
    - name: nonroot
      uid: 65532
      gid: 65532
  groups:
    - name: nonroot
      gid: 65532
      members:
        - nonroot
os-release:
  name: Docker Hardened Images (Debian)
  id: debian
  version-id: "13"
  version-codename: trixie
  pretty-name: Docker Hardened Images/Debian GNU/Linux 13 (trixie)
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
paths:
  - type: symlink
    path: /usr/bin/virt-exportserver
    uid: 0
    gid: 0
    source: /usr/local/bin/virt-exportserver
annotations:
  org.opencontainers.image.description: A minimal Virt Export Server image
  org.opencontainers.image.licenses: Apache-2.0
entrypoint:
  - /usr/local/bin/virt-exportserver
