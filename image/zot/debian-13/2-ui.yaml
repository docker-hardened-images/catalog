# syntax=dhi.io/build:2-debian13

name: Zot 2.x (ui)
image: dhi.io/zot
variant: runtime
flavor: ui
tags:
  - 2-ui
  - 2.1-ui
  - 2.1.20-ui
  - 2-debian-ui
  - 2-debian13-ui
  - 2.1-debian-ui
  - 2.1-debian13-ui
  - 2.1.20-debian-ui
  - 2.1.20-debian13-ui
platforms:
  - linux/amd64
  - linux/arm64
dates:
  release: "2026-03-08"
vars:
  COMMIT_SHA: 3b5796d834e8661ea661a5fcc47add8d4405aebf
  FLAVORED_SUFFIX: -ui
  SEMVER_MAJOR_MINOR_VERSION: "2.1"
  SEMVER_MAJOR_VERSION: "2"
  SEMVER_VERSION: 2.1.20
  SUFFIX: ""
  VERSION: 2.1.20-7
contents:
  repositories:
    - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
  keyring:
    - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
  packages:
    - base-files
    - ca-certificates-bundle
    - tzdata
    - zot-ui=2.1.20-7
accounts:
  run-as: nonroot
  users:
    - name: nonroot
      uid: 65532
      gid: 65532
  groups:
    - name: nonroot
      gid: 65532
      members:
        - nonroot
os-release:
  name: Docker Hardened Images (Debian)
  id: debian
  version-id: "13"
  version-codename: trixie
  pretty-name: Docker Hardened Images/Debian GNU/Linux 13 (trixie)
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
paths:
  - type: directory
    path: /usr/local/bin
    uid: 0
    gid: 0
  - type: symlink
    path: /usr/local/bin/zot
    uid: 0
    gid: 0
    source: /usr/bin/zot
  - type: directory
    path: /var/lib/registry
    uid: 65532
    gid: 65532
    mode: "0755"
  - type: directory
    path: /etc/zot
    uid: 0
    gid: 0
    mode: "0755"
  - type: file
    path: /etc/zot/config.json
    uid: 0
    gid: 0
    mode: "0644"
    source: image/zot/config/config.json
annotations:
  org.opencontainers.image.description: A minimal Zot image
  org.opencontainers.image.licenses: Apache-2.0
entrypoint:
  - /usr/local/bin/zot
cmd:
  - serve
  - /etc/zot/config.json
ports:
  - 5000/tcp
