# syntax=dhi.io/build:2-debian13

name: Fluent Bit 5.1.x
image: dhi.io/fluent-bit
variant: runtime
tags:
  - "5"
  - "5.1"
  - 5.1.2
  - 5-debian
  - 5-debian13
  - 5.1-debian
  - 5.1-debian13
  - 5.1.2-debian
  - 5.1.2-debian13
platforms:
  - linux/amd64
  - linux/arm64
dates:
  release: "2026-03-24"
vars:
  SEMVER_MAJOR_MINOR_VERSION: "5.1"
  SEMVER_MAJOR_VERSION: "5"
  SEMVER_VERSION: 5.1.2
  VERSION: 5.1.2-0
contents:
  repositories:
    - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
  keyring:
    - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
  packages:
    - '!libelogind0'
    - '!mawk'
    - '!original-awk'
    - base-files
    - ca-certificates-bundle
    - fluent-bit=5.1.2-0
    - libpq5
    - libssl3t64
    - libstdc++6
    - libsystemd0
    - libyaml-0-2
    - tzdata
    - zlib1g
accounts:
  run-as: nonroot
  users:
    - name: nonroot
      uid: 65532
      gid: 65532
  groups:
    - name: nonroot
      gid: 65532
      members:
        - nonroot
os-release:
  name: Docker Hardened Images (Debian)
  id: debian
  version-id: "13"
  version-codename: trixie
  pretty-name: Docker Hardened Images/Debian GNU/Linux 13 (trixie)
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
environment:
  FLUENT_BIT_VERSION: 5.1.2
paths:
  - type: directory
    path: /usr/local/bin
    uid: 0
    gid: 0
  - type: symlink
    path: /usr/local/bin/fluent-bit
    uid: 0
    gid: 0
    source: /usr/bin/fluent-bit
  - type: directory
    path: /fluent-bit
    uid: 0
    gid: 0
  - type: directory
    path: /fluent-bit/bin
    uid: 0
    gid: 0
  - type: symlink
    path: /fluent-bit/bin/fluent-bit
    uid: 0
    gid: 0
    source: /usr/local/bin/fluent-bit
  - type: symlink
    path: /fluent-bit/etc
    uid: 0
    gid: 0
    source: /etc/fluent-bit
annotations:
  org.opencontainers.image.description: A minimal Fluent Bit image
  org.opencontainers.image.licenses: Apache-2.0
entrypoint:
  - /usr/local/bin/fluent-bit
ports:
  - 2020/tcp
  - 9880/tcp
  - 24224/tcp
