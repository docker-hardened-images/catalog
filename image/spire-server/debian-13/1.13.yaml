# syntax=dhi.io/build:2-debian13

name: Spiffe Spire Server 1.13.x
image: dhi.io/spire-server
variant: runtime
tags:
  - "1.13"
  - 1.13.6
  - 1.13-debian
  - 1.13-debian13
  - 1.13.6-debian
  - 1.13.6-debian13
platforms:
  - linux/amd64
  - linux/arm64
vars:
  FLAVORED_SUFFIX: ""
  PACKAGE_NAME: spire-server-1.13
  SEMVER_MAJOR_MINOR_VERSION: "1.13"
  SEMVER_MAJOR_VERSION: "1"
  SEMVER_VERSION: 1.13.6
  SUFFIX: ""
  VERSION: 1.13.6-2
contents:
  repositories:
    - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
  keyring:
    - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
  packages:
    - base-files
    - ca-certificates-bundle
    - libc6
    - libsqlite3-0
    - spire-server-1.13=1.13.6-2
    - tzdata
accounts:
  run-as: nonroot
  users:
    - name: nonroot
      uid: 65532
      gid: 65532
  groups:
    - name: nonroot
      gid: 65532
      members:
        - nonroot
os-release:
  name: Docker Hardened Images (Debian)
  id: debian
  version-id: "13"
  version-codename: trixie
  pretty-name: Docker Hardened Images/Debian GNU/Linux 13 (trixie)
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
paths:
  - type: directory
    path: /usr/local/bin
    uid: 0
    gid: 0
  - type: symlink
    path: /usr/local/bin/spire-server
    uid: 0
    gid: 0
    source: /usr/bin/spire-server
  - type: directory
    path: /opt/spire/bin
    uid: 0
    gid: 0
  - type: symlink
    path: /opt/spire/bin/spire-server
    uid: 0
    gid: 0
    source: /usr/local/bin/spire-server
  - type: directory
    path: /etc/spire/server
    uid: 65532
    gid: 65532
    mode: "0755"
  - type: directory
    path: /run/spire/server/private
    uid: 65532
    gid: 65532
    mode: "0755"
    recursive: true
  - type: directory
    path: /tmp/spire-server/private
    uid: 65532
    gid: 65532
    mode: "0755"
    recursive: true
  - type: directory
    path: /tmp
    uid: 0
    gid: 0
    mode: "1777"
  - type: directory
    path: /var/lib/spire/server
    uid: 65532
    gid: 65532
    mode: "0755"
annotations:
  org.opencontainers.image.description: A minimal Spiffe Spire Server image
  org.opencontainers.image.licenses: Apache-2.0
entrypoint:
  - /usr/local/bin/spire-server
  - run
