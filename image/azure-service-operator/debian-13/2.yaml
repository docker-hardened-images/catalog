# syntax=dhi.io/build:2-debian13

name: Azure Service Operator 2.x
image: dhi.io/azure-service-operator
variant: runtime
tags:
  - "2"
  - "2.21"
  - 2.21.0
  - 2-debian
  - 2-debian13
  - 2.21-debian
  - 2.21-debian13
  - 2.21.0-debian
  - 2.21.0-debian13
platforms:
  - linux/amd64
  - linux/arm64
vars:
  FLAVORED_SUFFIX: ""
  SEMVER_MAJOR_MINOR_VERSION: "2.21"
  SEMVER_MAJOR_VERSION: "2"
  SEMVER_VERSION: 2.21.0
  SUFFIX: ""
  VERSION: 2.21.0-1
contents:
  repositories:
    - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
  keyring:
    - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
  packages:
    - azure-service-operator=2.21.0-1
    - base-files
    - ca-certificates-bundle
    - tzdata
accounts:
  run-as: nonroot
  users:
    - name: nonroot
      uid: 65532
      gid: 65532
  groups:
    - name: nonroot
      gid: 65532
      members:
        - nonroot
os-release:
  name: Docker Hardened Images (Debian)
  id: debian
  version-id: "13"
  version-codename: trixie
  pretty-name: Docker Hardened Images/Debian GNU/Linux 13 (trixie)
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
paths:
  - type: directory
    path: /usr/local/bin
    uid: 0
    gid: 0
  - type: symlink
    path: /usr/local/bin/aso-controller
    uid: 0
    gid: 0
    source: /usr/bin/aso-controller
  - type: symlink
    path: /crds
    uid: 0
    gid: 0
    source: /usr/share/azure-service-operator/crds
annotations:
  org.opencontainers.image.description: A minimal Azure Service Operator image
  org.opencontainers.image.licenses: MIT
entrypoint:
  - aso-controller
