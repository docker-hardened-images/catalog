        - name: patch bundled ognl in sonar-application
          runs: |
            set -eux -o pipefail

            app_jar=$(find "${target.dir}/sonarqube/lib" -maxdepth 1 -name 'sonar-application-*.jar' -type f -print -quit)
            if [[ -z "${app_jar}" ]]; then
              echo "ERROR: sonar-application jar not found" >&2
              exit 1
            fi

            metadata_dir="META-INF/maven/ognl/ognl"
            vulnerable_ognl_runtime_sha="e6d4ecfc7035d62e562091bf8480efea8c9c5affa753e3deee6b24fa0149cfc5"
            patch_dir="$(mktemp -d)"
            repack_dir="${patch_dir}/repack"
            overlay_dir="${patch_dir}/overlay"
            relocated_dir="${patch_dir}/relocated"
            trap 'rm -rf "${patch_dir}"' EXIT
            mkdir -p "${repack_dir}" "${overlay_dir}" "${relocated_dir}"

            (cd "${repack_dir}" && jar xf "${app_jar}")

            if [[ ! -f "${repack_dir}/${metadata_dir}/pom.properties" ]]; then
              echo "ERROR: ognl:ognl not found in $(basename "${app_jar}")" >&2
              exit 1
            fi
            active_class="${repack_dir}/org/apache/ibatis/ognl/OgnlRuntime.class"
            if [[ ! -f "${active_class}" ]]; then
              echo "ERROR: org/apache/ibatis/ognl/OgnlRuntime.class not found in $(basename "${app_jar}")" >&2
              exit 1
            fi

            active_sha="$(sha256sum "${active_class}" | cut -d' ' -f1)"
            if grep -q "version=3.4.13" "${repack_dir}/${metadata_dir}/pom.properties" \
              && [[ ! -e "${repack_dir}/ognl/OgnlRuntime.class" ]] \
              && grep -a -q isLikelyAccessible "${active_class}" \
              && [[ "${active_sha}" != "${vulnerable_ognl_runtime_sha}" ]]; then
              echo "ognl already relocated at 3.4.13 in $(basename "${app_jar}")"
              exit 0
            fi

            reloc_cp="${source.dir}/patch/deps/asm-9.7.1.jar:${source.dir}/patch/deps/asm-commons-9.7.1.jar"
            javac --release 17 -cp "${reloc_cp}" -d "${patch_dir}/reloc-classes" "${source.dir}/patch/RelocateOgnl.java"
            java -cp "${patch_dir}/reloc-classes:${reloc_cp}" RelocateOgnl \
              "${source.dir}/patch/deps/ognl-3.4.13.jar" \
              "${relocated_dir}"
            (cd "${overlay_dir}" && jar xf "${source.dir}/patch/deps/ognl-3.4.13.jar")

            upstream_count="$(jar tf "${source.dir}/patch/deps/ognl-3.4.13.jar" | grep -c '\.class$' || true)"
            relocated_count="$(find "${relocated_dir}" -type f -name '*.class' -printf x | wc -c | tr -d '[:space:]')"
            if [[ "${upstream_count}" != "${relocated_count}" ]]; then
              echo "ERROR: relocated class count ${relocated_count} != upstream ${upstream_count}" >&2
              exit 1
            fi

            rm -rf "${repack_dir:?}/ognl" \
              "${repack_dir:?}/org/apache/ibatis/ognl" \
              "${repack_dir:?}/${metadata_dir}"
            mkdir -p "${repack_dir}/org/apache/ibatis" "${repack_dir}/META-INF/maven/ognl"
            cp -a "${relocated_dir}/org/apache/ibatis/ognl" "${repack_dir}/org/apache/ibatis/ognl"
            cp -a "${overlay_dir}/${metadata_dir}" "${repack_dir}/${metadata_dir}"

            test ! -e "${repack_dir}/ognl/OgnlRuntime.class"
            test -f "${repack_dir}/org/apache/ibatis/ognl/OgnlRuntime.class"
            test -f "${repack_dir}/org/apache/ibatis/ognl/enhance/ExpressionCompiler.class"
            grep -q "version=3.4.13" "${repack_dir}/${metadata_dir}/pom.properties"
            grep -a -q isLikelyAccessible "${repack_dir}/org/apache/ibatis/ognl/OgnlRuntime.class"
            new_sha="$(sha256sum "${repack_dir}/org/apache/ibatis/ognl/OgnlRuntime.class" | cut -d' ' -f1)"
            if [[ "${new_sha}" == "${vulnerable_ognl_runtime_sha}" ]]; then
              echo "ERROR: relocated OgnlRuntime.class still matches the published vulnerable bytes" >&2
              exit 1
            fi
            javap -p "${repack_dir}/org/apache/ibatis/ognl/OgnlRuntime.class" | grep -q 'class org.apache.ibatis.ognl.OgnlRuntime'
            javap -v -p "${repack_dir}/org/apache/ibatis/ognl/enhance/ExpressionCompiler.class" | grep -q 'org/apache/ibatis/javassist/ClassPool'
            if javap -v -p "${repack_dir}/org/apache/ibatis/ognl/enhance/ExpressionCompiler.class" | grep 'javassist/' | grep -v 'org/apache/ibatis/javassist/'; then
              echo "ERROR: ExpressionCompiler still references unrelocated javassist" >&2
              exit 1
            fi

            app_new="${patch_dir}/app-repacked.jar"
            (cd "${repack_dir}" && jar --create --file "${app_new}" --manifest META-INF/MANIFEST.MF .)
            mv "${app_new}" "${app_jar}"

            unzip -p "${app_jar}" "${metadata_dir}/pom.properties" | grep -q "version=3.4.13"
            unzip -p "${app_jar}" org/apache/ibatis/ognl/OgnlRuntime.class | grep -a -q isLikelyAccessible
            if jar tf "${app_jar}" | grep -qx 'ognl/OgnlRuntime.class'; then
              echo "ERROR: unrelocated ognl tree still in $(basename "${app_jar}")" >&2
              exit 1
            fi
