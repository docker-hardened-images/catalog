      pipeline:
        - name: extract distribution
          work-dir: ${source.dir}
          runs: |
            set -eux -o pipefail

            unzip -q "${source.dir}/sonarqube-26.10.0.133078.zip" -d "${target.dir}"
            mv "${target.dir}/sonarqube-26.10.0.133078" "${target.dir}/sonarqube"
        - name: patch vulnerable JARs
          runs: |
            set -eux -o pipefail

            echo "Apply patches"
            # Apply runtime vulnerability patches using generic DHI patcher
            chmod +x "${source.dir}/patch/dhi-runtime-patch.sh"
            "${source.dir}/patch/dhi-runtime-patch.sh" \
              --app-root "${target.dir}/sonarqube" \
              --patch-dir "${source.dir}/patch/deps" \
              --config "${source.dir}/patch/dhi-patch-config.json"
        - name: patch bundled jline in elasticsearch-sql-cli
          runs: |
            set -eux -o pipefail

            sql_cli_jar=$(find "${target.dir}/sonarqube/elasticsearch/bin" -name 'elasticsearch-sql-cli-*.jar' -type f | head -1)
            if [[ -z "${sql_cli_jar}" ]]; then
              echo "ERROR: elasticsearch-sql-cli jar not found" >&2
              exit 1
            fi

            patch_dir="$(mktemp -d)"
            repack_dir="${patch_dir}/repack"
            overlay_dir="${patch_dir}/overlay"
            trap 'rm -rf "${patch_dir}"' EXIT
            mkdir -p "${repack_dir}" "${overlay_dir}"

            (cd "${repack_dir}" && jar xf "${sql_cli_jar}")
            rm -rf "${repack_dir}/org/jline" "${repack_dir}/META-INF/maven/org.jline"
            rm -f "${repack_dir}/META-INF/services/org.jline.terminal.spi.JnaSupport"

            for dep in jline-reader jline-style jline-terminal jline-terminal-jna; do
              (cd "${overlay_dir}" && jar xf "${source.dir}/patch/deps/${dep}-3.30.15.jar")
            done

            mkdir -p "${repack_dir}/META-INF/maven" "${repack_dir}/META-INF/jline" "${repack_dir}/META-INF/services"
            cp -a "${overlay_dir}/org/jline" "${repack_dir}/org/jline"
            cp -a "${overlay_dir}/META-INF/maven/org.jline" "${repack_dir}/META-INF/maven/org.jline"
            cp -a "${overlay_dir}/META-INF/jline/." "${repack_dir}/META-INF/jline/"
            if [[ -d "${overlay_dir}/META-INF/services/org" ]]; then
              cp -a "${overlay_dir}/META-INF/services/org" "${repack_dir}/META-INF/services/org"
            fi
            if [[ -f "${overlay_dir}/META-INF/services/org.jline.terminal.spi.TerminalProvider" ]]; then
              cp -a "${overlay_dir}/META-INF/services/org.jline.terminal.spi.TerminalProvider" \
                "${repack_dir}/META-INF/services/org.jline.terminal.spi.TerminalProvider"
            fi

            jna_desc="${overlay_dir}/META-INF/services/org/jline/terminal/provider/jna"
            jna_class=$(sed -n 's/^class[[:space:]]*=[[:space:]]*//p' "${jna_desc}")
            if [[ -z "${jna_class}" ]]; then
              echo "ERROR: jline-terminal-jna provider class not found" >&2
              exit 1
            fi
            printf '%s\n' "${jna_class}" > "${repack_dir}/META-INF/jline/providers/jna"

            for dep in jline-reader jline-style jline-terminal jline-terminal-jna; do
              grep -q "version=3.30.15" "${repack_dir}/META-INF/maven/org.jline/${dep}/pom.properties"
            done
            grep -q 'org.jline.terminal.impl.DumbTerminalProvider' "${repack_dir}/META-INF/jline/providers/dumb"
            grep -q 'org.jline.terminal.impl.exec.ExecTerminalProvider' "${repack_dir}/META-INF/jline/providers/exec"
            grep -q 'org.jline.terminal.impl.jna.JnaTerminalProvider' "${repack_dir}/META-INF/jline/providers/jna"
            grep -q 'org.jline.terminal.impl.jna.JnaTerminalProvider' "${repack_dir}/META-INF/services/org/jline/terminal/provider/jna"
            if [[ -e "${repack_dir}/META-INF/services/org.jline.terminal.spi.JnaSupport" ]]; then
              echo "ERROR: stale JnaSupport service file remains" >&2
              exit 1
            fi

            sql_cli_new="${patch_dir}/sql-cli-repacked.jar"
            (cd "${repack_dir}" && jar --create --file "${sql_cli_new}" --manifest META-INF/MANIFEST.MF .)
            mv "${sql_cli_new}" "${sql_cli_jar}"

            unzip -p "${sql_cli_jar}" META-INF/maven/org.jline/jline-reader/pom.properties | grep -q "version=3.30.15"
            unzip -p "${sql_cli_jar}" META-INF/jline/providers/dumb | grep -q 'org.jline.terminal.impl.DumbTerminalProvider'
            unzip -p "${sql_cli_jar}" META-INF/jline/providers/exec | grep -q 'org.jline.terminal.impl.exec.ExecTerminalProvider'
            unzip -p "${sql_cli_jar}" META-INF/jline/providers/jna | grep -q 'org.jline.terminal.impl.jna.JnaTerminalProvider'
            unzip -p "${sql_cli_jar}" META-INF/services/org/jline/terminal/provider/jna | grep -q 'org.jline.terminal.impl.jna.JnaTerminalProvider'
        - name: patch bundled sshd in scanner engine
          runs: |
            set -eux -o pipefail

            scanner_jar=$(find "${target.dir}/sonarqube/lib/scanner" -name 'sonar-scanner-engine-community-*.jar' -type f | head -1)
            if [[ -z "${scanner_jar}" ]]; then
              echo "ERROR: sonar-scanner-engine-community jar not found" >&2
              exit 1
            fi

            patch_dir="$(mktemp -d)"
            repack_dir="${patch_dir}/repack"
            overlay_dir="${patch_dir}/overlay"
            trap 'rm -rf "${patch_dir}"' EXIT
            mkdir -p "${repack_dir}" "${overlay_dir}"

            (cd "${repack_dir}" && jar xf "${scanner_jar}")
            rm -rf "${repack_dir}/org/apache/sshd" "${repack_dir}/META-INF/maven/org.apache.sshd"

            for dep in sshd-common sshd-core; do
              (cd "${overlay_dir}" && jar xf "${source.dir}/patch/deps/${dep}-2.12.0.jar")
            done
            cp -a "${overlay_dir}/org/apache/sshd" "${repack_dir}/org/apache/sshd"
            mkdir -p "${repack_dir}/META-INF/maven"
            cp -a "${overlay_dir}/META-INF/maven/org.apache.sshd" "${repack_dir}/META-INF/maven/org.apache.sshd"

            scanner_new="${patch_dir}/scanner-repacked.jar"
            (cd "${repack_dir}" && jar --create --file "${scanner_new}" --manifest META-INF/MANIFEST.MF .)
            mv "${scanner_new}" "${scanner_jar}"

