            (cd "${repack_dir}" && jar --create --file "${app_new}" --manifest META-INF/MANIFEST.MF .)
            mv "${app_new}" "${app_jar}"

            unzip -p "${app_jar}" "${metadata_dir}/pom.properties" | grep -q "version=5.6.3"
        - name: patch bundled log4j-api in sonar-application
          runs: |
            set -eux -o pipefail

            app_jar=$(find "${target.dir}/sonarqube/lib" -maxdepth 1 -name 'sonar-application-*.jar' -type f | head -1)
            if [[ -z "${app_jar}" ]]; then
              echo "ERROR: sonar-application jar not found" >&2
              exit 1
            fi

            metadata_dir="META-INF/maven/org.apache.logging.log4j/log4j-api"
            patch_dir="$(mktemp -d)"
            repack_dir="${patch_dir}/repack"
            overlay_dir="${patch_dir}/overlay"
            trap 'rm -rf "${patch_dir}"' EXIT
            mkdir -p "${repack_dir}" "${overlay_dir}"

            (cd "${repack_dir}" && jar xf "${app_jar}")

            if [[ ! -f "${repack_dir}/${metadata_dir}/pom.properties" ]]; then
              echo "ERROR: org.apache.logging.log4j:log4j-api not found in $(basename "${app_jar}")" >&2
              exit 1
            fi

            if grep -q "version=2.26.1" "${repack_dir}/${metadata_dir}/pom.properties"; then
              echo "log4j-api already at 2.26.1 in $(basename "${app_jar}")"
              exit 0
            fi

            rm -rf "${overlay_dir:?}"/*
            (cd "${overlay_dir}" && jar xf "${source.dir}/patch/deps/log4j-api-2.26.1.jar")

            rm -rf "${repack_dir:?}/org/apache/logging/log4j" "${repack_dir:?}/${metadata_dir}"
            for vdir in "${repack_dir}"/META-INF/versions/*/org/apache/logging/log4j; do
              rm -rf "${vdir}"
            done

            mkdir -p "${repack_dir}/org/apache/logging" "${repack_dir}/META-INF/maven/org.apache.logging.log4j"
            cp -a "${overlay_dir}/org/apache/logging/log4j" "${repack_dir}/org/apache/logging/log4j"
            cp -a "${overlay_dir}/${metadata_dir}" "${repack_dir}/${metadata_dir}"
            for vdir in "${overlay_dir}"/META-INF/versions/*/org/apache/logging/log4j; do
              rel="${vdir#${overlay_dir}/}"
              mkdir -p "${repack_dir}/$(dirname "${rel}")"
              cp -a "${vdir}" "${repack_dir}/${rel}"
            done

            grep -q "version=2.26.1" "${repack_dir}/${metadata_dir}/pom.properties"

            app_new="${patch_dir}/app-repacked.jar"
            (cd "${repack_dir}" && jar --create --file "${app_new}" --manifest META-INF/MANIFEST.MF .)
            mv "${app_new}" "${app_jar}"

            unzip -p "${app_jar}" "${metadata_dir}/pom.properties" | grep -q "version=2.26.1"
        - name: patch bundled log4j-api in elastic apm agent
          runs: |
            set -eux -o pipefail

            apm_jar=$(find "${target.dir}/sonarqube/elasticsearch/modules/apm" -name 'elastic-apm-agent-java8-*.jar' -type f | head -1)
            if [[ -z "${apm_jar}" ]]; then
              echo "ERROR: elastic-apm-agent-java8 jar not found" >&2
              exit 1
            fi

            metadata_dir="agent/META-INF/maven/org.apache.logging.log4j/log4j-api"
            class_dir="agent/org/apache/logging/log4j"
            patch_dir="$(mktemp -d)"
            repack_dir="${patch_dir}/repack"
            overlay_dir="${patch_dir}/overlay"
            trap 'rm -rf "${patch_dir}"' EXIT
            mkdir -p "${repack_dir}" "${overlay_dir}"

            (cd "${repack_dir}" && jar xf "${apm_jar}")

            if [[ ! -f "${repack_dir}/${metadata_dir}/pom.properties" ]]; then
              echo "ERROR: org.apache.logging.log4j:log4j-api not found in $(basename "${apm_jar}")" >&2
              exit 1
            fi

            if grep -q "version=2.25.5" "${repack_dir}/${metadata_dir}/pom.properties"; then
              echo "log4j-api already at 2.25.5 in $(basename "${apm_jar}")"
              exit 0
            fi

            rm -rf "${overlay_dir:?}"/*
            (cd "${overlay_dir}" && jar xf "${source.dir}/patch/deps/log4j-api-2.25.5.jar")

            rm -rf "${repack_dir:?}/${class_dir}" "${repack_dir:?}/${metadata_dir}"
            for vdir in "${repack_dir}"/agent/META-INF/versions/*/org/apache/logging/log4j; do
              rm -rf "${vdir}"
            done

            mkdir -p "${repack_dir}/agent/org/apache/logging" "${repack_dir}/agent/META-INF/maven/org.apache.logging.log4j"
            cp -a "${overlay_dir}/org/apache/logging/log4j" "${repack_dir}/${class_dir}"
            cp -a "${overlay_dir}/META-INF/maven/org.apache.logging.log4j/log4j-api" "${repack_dir}/${metadata_dir}"
            for vdir in "${overlay_dir}"/META-INF/versions/*/org/apache/logging/log4j; do
              rel="agent/${vdir#${overlay_dir}/META-INF/}"
              mkdir -p "${repack_dir}/$(dirname "${rel}")"
              cp -a "${vdir}" "${repack_dir}/${rel}"
            done

            grep -q "version=2.25.5" "${repack_dir}/${metadata_dir}/pom.properties"

            apm_new="${patch_dir}/apm-repacked.jar"
            (cd "${repack_dir}" && jar --create --file "${apm_new}" --manifest META-INF/MANIFEST.MF .)
            mv "${apm_new}" "${apm_jar}"

            unzip -p "${apm_jar}" "${metadata_dir}/pom.properties" | grep -q "version=2.25.5"
      paths:
        - type: file
          path: ${source.dir}/patch/dhi-patch-config.json
          uid: 0
          gid: 0
          source: image/sonarqube/patch/dhi-patch-config.json
        - type: file
          path: ${source.dir}/patch/dhi-runtime-patch.sh
          uid: 0
          gid: 0
          source: image/sonarqube/patch/dhi-runtime-patch.sh
        - type: file
          path: ${source.dir}/patch/RelocateOgnl.java
          uid: 0
          gid: 0
          source: image/sonarqube/patch/RelocateOgnl.java
      outputs:
        - source: ${target.dir}/sonarqube
          target: /opt/sonarqube
          uid: 0
          gid: 0
        - source: ${source.dir}/entrypoint.sh
          target: /opt/sonarqube/docker/entrypoint.sh
          uid: 0
          gid: 0
          mode: "0755"
        - source: /opt/docker/sbom
          target: /opt/docker/sbom
          uid: 0
          gid: 0
    - name: locale
      contents:
        packages:
          - bash
          - locales
          - coreutils
          - gzip
      pipeline:
        - name: install locales
          runs: |
            set -eux -o pipefail

            ln -s /etc/locale.alias /usr/share/locale/locale.alias

            echo "en_US.UTF-8 UTF-8" >> /etc/locale.gen
            locale-gen en_US.UTF-8
      outputs:
        - source: /usr/share/locale
          target: /usr/share/locale
          uid: 0
          gid: 0
        - source: /usr/lib/locale
          target: /usr/lib/locale
          uid: 0
          gid: 0
