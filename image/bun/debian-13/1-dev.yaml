# syntax=dhi.io/build:2-debian13

name: Bun 1.x (dev)
image: dhi.io/bun
variant: dev
tags:
  - 1-dev
  - 1.4-dev
  - 1.4.5-dev
  - 1-debian-dev
  - 1-debian13-dev
  - 1.4-debian-dev
  - 1.4-debian13-dev
  - 1.4.5-debian-dev
  - 1.4.5-debian13-dev
platforms:
  - linux/amd64
  - linux/arm64
dates:
  release: "2023-09-07"
vars:
  SEMVER_MAJOR_MINOR_VERSION: "1.4"
  SEMVER_MAJOR_VERSION: "1"
  SEMVER_VERSION: 1.4.5
  VERSION: 1.4.5-0
contents:
  repositories:
    - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
  keyring:
    - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
  packages:
    - '!gawk'
    - '!libelogind0'
    - '!mawk'
    - '!original-awk'
    - apt
    - base-files
    - bash
    - bun=1.4.5-0
    - ca-certificates
    - coreutils
    - diffutils
    - dpkg
    - findutils
    - grep
    - libc-bin
    - libc6
    - libstdc++6
    - mawk
    - perl-base
    - sed
    - util-linux
accounts:
  root: true
  run-as: root
  users:
    - name: nonroot
      uid: 65532
      gid: 65532
    - name: _apt
      uid: 42
      gid: 65532
  groups:
    - name: nonroot
      gid: 65532
      members:
        - nonroot
os-release:
  name: Docker Hardened Images (Debian)
  id: debian
  version-id: "13"
  version-codename: trixie
  pretty-name: Docker Hardened Images/Debian GNU/Linux 13 (trixie)
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
work-dir: /build
environment:
  BUN_RUNTIME_TRANSPILER_CACHE_PATH: "0"
  BUN_VERSION: 1.4.5
  DEBIAN_FRONTEND: noninteractive
  PATH: /usr/local/bun-node-fallback-bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
paths:
  - type: directory
    path: /usr/local/bin
    uid: 0
    gid: 0
  - type: symlink
    path: /usr/local/bin/bun
    uid: 0
    gid: 0
    source: /usr/bin/bun
  - type: symlink
    path: /usr/local/bin/bunx
    uid: 0
    gid: 0
    source: /usr/bin/bunx
  - type: directory
    path: /usr/local/bun-node-fallback-bin
    uid: 0
    gid: 0
  - type: symlink
    path: /usr/local/bun-node-fallback-bin/node
    uid: 0
    gid: 0
    source: /usr/bin/bun
annotations:
  org.opencontainers.image.description: A minimal Bun image
  org.opencontainers.image.licenses: MIT
cmd:
  - /bin/bash
