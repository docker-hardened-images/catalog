# syntax=dhi.io/build:2-alpine3.24

name: Bun 1.x
image: dhi.io/bun
variant: runtime
tags:
  - 1-alpine
  - 1.4-alpine
  - 1-alpine3.24
  - 1.4.2-alpine
  - 1.4-alpine3.24
  - 1.4.2-alpine3.24
platforms:
  - linux/amd64
  - linux/arm64
dates:
  release: "2023-09-07"
vars:
  SEMVER_MAJOR_MINOR_VERSION: "1.4"
  SEMVER_MAJOR_VERSION: "1"
  SEMVER_VERSION: 1.4.2
  VERSION: 1.4.2-r0
contents:
  repositories:
    - https://dhi.io/apk/alpine/v3.24/main
    - https://dl-cdn.alpinelinux.org/alpine/v3.24/main
    - https://dl-cdn.alpinelinux.org/alpine/v3.24/community
  keyring:
    - https://dhi.io/keyring/dhi-apk@docker-0F81AD7700D99184.rsa.pub
  packages:
    - alpine-baselayout-data
    - bun=1.4.2-r0
    - ca-certificates-bundle
    - libgcc
    - libstdc++
    - musl-utils
accounts:
  run-as: nonroot
  users:
    - name: nonroot
      uid: 65532
      gid: 65532
  groups:
    - name: nonroot
      gid: 65532
      members:
        - nonroot
os-release:
  name: Docker Hardened Images (Alpine)
  id: alpine
  version-id: "3.24"
  pretty-name: Docker Hardened Images/Alpine Linux v3.24
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
work-dir: /build
environment:
  BUN_RUNTIME_TRANSPILER_CACHE_PATH: "0"
  BUN_VERSION: 1.4.2
  PATH: /usr/local/bun-node-fallback-bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
paths:
  - type: directory
    path: /usr/local/bin
    uid: 0
    gid: 0
  - type: symlink
    path: /usr/local/bin/bun
    uid: 0
    gid: 0
    source: /usr/bin/bun
  - type: symlink
    path: /usr/local/bin/bunx
    uid: 0
    gid: 0
    source: /usr/bin/bunx
  - type: directory
    path: /usr/local/bun-node-fallback-bin
    uid: 0
    gid: 0
  - type: symlink
    path: /usr/local/bun-node-fallback-bin/node
    uid: 0
    gid: 0
    source: /usr/bin/node
annotations:
  org.opencontainers.image.description: A minimal Bun image
  org.opencontainers.image.licenses: MIT
cmd:
  - /usr/local/bin/bun
  - repl
