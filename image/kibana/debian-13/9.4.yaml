# syntax=dhi.io/build:2-debian13

name: Kibana 9.4.x
image: dhi.io/kibana
variant: runtime
tags:
  - "9.4"
  - 9.4.8
  - 9.4-debian
  - 9.4-debian13
  - 9.4.8-debian
  - 9.4.8-debian13
platforms:
  - linux/amd64
  - linux/arm64
dates:
  release: "2026-05-05"
vars:
  ARCH: '#{ target.arch == "amd64" ? "amd64" : "arm64" }'
  GO_ARCH: '#{ target.arch == "amd64" ? "x86_64" : "aarch64" }'
  NODE_MAJOR_VERSION: "24"
  NODE_VERSION: 24.22.1-1
  SEMVER_MAJOR_MINOR_VERSION: "9.4"
  SEMVER_MAJOR_VERSION: "9"
  SEMVER_VERSION: 9.4.8
  VERSION: 9.4.8-7
contents:
  repositories:
    - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
  keyring:
    - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
  packages:
    - '!libelogind0'
    - '!mawk'
    - '!original-awk'
    - base-files
    - bash
    - ca-certificates-bundle
    - coreutils
    - findutils
    - grep
    - kibana-9.4=9.4.8-7
    - libstdc++6
    - nodejs-24=24.22.1-1
    - tini
    - tzdata
accounts:
  run-as: nonroot
  users:
    - name: nonroot
      uid: 65532
      gid: 65532
  groups:
    - name: nonroot
      gid: 65532
      members:
        - nonroot
os-release:
  name: Docker Hardened Images (Debian)
  id: debian
  version-id: "13"
  version-codename: trixie
  pretty-name: Docker Hardened Images/Debian GNU/Linux 13 (trixie)
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
environment:
  ELASTIC_CONTAINER: "true"
  KIBANA_VERSION: 9.4.8
paths:
  - type: directory
    path: /usr/share/kibana/data
    uid: 65532
    gid: 65532
    mode: "0755"
  - type: file
    path: /usr/share/kibana/config/kibana.yml
    uid: 65532
    gid: 65532
    mode: "0644"
    source: image/kibana/config/kibana.yml
  - type: file
    path: /usr/local/bin/kibana-docker
    uid: 0
    gid: 0
    mode: "0755"
    source: image/kibana/bin/kibana-docker
  - type: symlink
    path: /usr/local/bin/tini
    uid: 0
    gid: 0
    source: /usr/bin/tini
annotations:
  org.opencontainers.image.description: A minimal Kibana image
  org.opencontainers.image.licenses: Elastic-License-2.0
entrypoint:
  - /usr/local/bin/tini
  - --
cmd:
  - /usr/local/bin/kibana-docker
ports:
  - 5601/tcp
