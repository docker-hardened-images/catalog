# syntax=dhi.io/build:2-debian13

name: Google Cloud CLI 583.x (emulators)
image: dhi.io/cloud-sdk
variant: runtime
flavor: emulators
tags:
  - 583-emulators
  - 583.0-emulators
  - 583.0.0-emulators
  - 583-debian-emulators
  - 583-debian13-emulators
  - 583.0-debian-emulators
  - 583.0-debian13-emulators
  - 583.0.0-debian-emulators
  - 583.0.0-debian13-emulators
platforms:
  - linux/amd64
  - linux/arm64
dates:
  release: "2026-07-24"
vars:
  SEMVER_MAJOR_MINOR_VERSION: "583.0"
  SEMVER_MAJOR_VERSION: "583"
  SEMVER_VERSION: 583.0.0
  VERSION: 583.0.0-2
contents:
  repositories:
    - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
  keyring:
    - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
  packages:
    - base-files
    - bash
    - ca-certificates-bundle
    - cloud-sdk-emulators=583.0.0-2
    - coreutils
    - eclipse-temurin-21-jre
    - eclipse-temurin-21-jre-oci-config
    - git
    - grep
    - openssh-client
    - python-3.13
    - sed
    - tzdata
accounts:
  run-as: nonroot
  users:
    - name: nonroot
      uid: 65532
      gid: 65532
  groups:
    - name: nonroot
      gid: 65532
      members:
        - nonroot
os-release:
  name: Docker Hardened Images (Debian)
  id: debian
  version-id: "13"
  version-codename: trixie
  pretty-name: Docker Hardened Images/Debian GNU/Linux 13 (trixie)
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
environment:
  CLOUDSDK_CORE_DISABLE_USAGE_REPORTING: "true"
  CLOUDSDK_PYTHON: /usr/bin/python3
  JAVA_HOME: /usr/lib/jvm/temurin-21
  PATH: /usr/lib/google-cloud-sdk/bin:/usr/lib/jvm/temurin-21/bin:/usr/bin:/bin:/usr/sbin:/sbin
paths:
  - type: file
    path: /usr/local/bin/docker-entrypoint.sh
    uid: 0
    gid: 0
    mode: "0755"
    source: image/cloud-sdk/bin/entrypoint.sh
  - type: directory
    path: /home/nonroot/.config/gcloud
    uid: 65532
    gid: 65532
    mode: "0755"
annotations:
  org.opencontainers.image.description: Google Cloud CLI - local GCP service emulators (Datastore, Firestore, Pub/Sub, Bigtable, Spanner)
  org.opencontainers.image.licenses: Apache-2.0
entrypoint:
  - /usr/local/bin/docker-entrypoint.sh
cmd:
  - gcloud
  - version
ports:
  - 8080/tcp
  - 8081/tcp
  - 8085/tcp
  - 8086/tcp
  - 9010/tcp
  - 9020/tcp
