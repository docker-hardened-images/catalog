metadata:
  display-name: Google Cloud CLI
  short-description: The Google Cloud CLI (gcloud, bq, gsutil) for managing Google Cloud Platform resources. The -emulators flavor additionally bundles Google's local service emulators for Cloud Datastore, Cloud Firestore, Pub/Sub, Cloud Bigtable, and Cloud Spanner (linux/amd64 only), for developing and testing against Google Cloud APIs entirely offline.
  featured: false
  home-url: https://cloud.google.com/sdk
  categories:
    - developer-tools
  included-tools:
    - name: gcloud
      description: Primary Google Cloud CLI for authenticating and managing Google Cloud Platform resources; in the -emulators flavor it also launches the bundled local emulators via `gcloud beta emulators`.
    - name: bq
      description: Command-line tool for creating and managing BigQuery datasets, tables, and jobs.
    - name: gsutil
      description: Command-line tool for creating and managing Cloud Storage buckets and objects.
    - name: Datastore emulator (-emulators flavor)
      description: Local emulator for Cloud Datastore.
    - name: Firestore emulator (-emulators flavor)
      description: Local emulator for Cloud Firestore.
    - name: Pub/Sub emulator (-emulators flavor)
      description: Local emulator for Pub/Sub topics and subscriptions.
    - name: Bigtable emulator (-emulators flavor)
      description: Local emulator for Cloud Bigtable, built from the google-cloud-go source.
    - name: Spanner emulator (-emulators flavor)
      description: Local emulator for Cloud Spanner (linux/amd64 only; Google publishes no arm64 build).
