# syntax=dhi.io/build:2-debian13

name: Supabase Storage 1.x
image: dhi.io/supabase-storage
variant: runtime
tags:
  - "1"
  - "1.79"
  - 1.79.30
  - 1-debian
  - 1-debian13
  - 1.79-debian
  - 1.79-debian13
  - 1.79.30-debian
  - 1.79.30-debian13
platforms:
  - linux/amd64
  - linux/arm64
dates:
  release: "2024-04-11"
vars:
  SEMVER_MAJOR_MINOR_VERSION: "1.79"
  SEMVER_MAJOR_VERSION: "1"
  SEMVER_VERSION: 1.79.30
  VERSION: 1.79.30-0
contents:
  repositories:
    - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
  keyring:
    - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
  packages:
    - base-files
    - ca-certificates
    - ca-certificates-bundle
    - libc6
    - libgcc-s1
    - libstdc++6
    - netbase
    - nodejs-24
    - supabase-storage=1.79.30-0
    - tzdata
accounts:
  run-as: nonroot
  users:
    - name: nonroot
      uid: 65532
      gid: 65532
  groups:
    - name: nonroot
      gid: 65532
      members:
        - nonroot
os-release:
  name: Docker Hardened Images (Debian)
  id: debian
  version-id: "13"
  version-codename: trixie
  pretty-name: Docker Hardened Images/Debian GNU/Linux 13 (trixie)
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
work-dir: /app
environment:
  NODE_ENV: production
  VERSION: 1.79.30
paths:
  - type: symlink
    path: /app
    uid: 0
    gid: 0
    source: /usr/lib/supabase-storage
annotations:
  org.opencontainers.image.description: A minimal Supabase Storage image
  org.opencontainers.image.licenses: Apache-2.0
entrypoint:
  - node
cmd:
  - dist/start/server.js
ports:
  - 5000/tcp
