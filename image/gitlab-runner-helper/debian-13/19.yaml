# syntax=dhi.io/build:2-debian13

name: GitLab Runner Helper 19.x
image: dhi.io/gitlab-runner-helper
variant: runtime
tags:
  - "19"
  - "19.3"
  - 19.3.1
  - 19-debian
  - 19-debian13
  - 19.3-debian
  - 19.3-debian13
  - 19.3.1-debian
  - 19.3.1-debian13
platforms:
  - linux/amd64
  - linux/arm64
dates:
  release: "2026-07-16"
  end-of-life: "2026-10-20"
vars:
  FLAVORED_SUFFIX: ""
  PACKAGE_NAME: gitlab-runner-helper-19
  SEMVER_MAJOR_MINOR_VERSION: "19.3"
  SEMVER_MAJOR_VERSION: "19"
  SEMVER_VERSION: 19.3.1
  SUFFIX: ""
  VERSION: 19.3.1-1
contents:
  repositories:
    - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
  keyring:
    - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
  packages:
    - base-files
    - bash
    - ca-certificates-bundle
    - coreutils
    - findutils
    - git
    - git-lfs
    - gitlab-runner-helper-19=19.3.1-1
    - grep
    - tzdata
accounts:
  root: true
  run-as: root
  users:
    - name: nonroot
      uid: 65532
      gid: 65532
  groups:
    - name: nonroot
      gid: 65532
      members:
        - nonroot
os-release:
  name: Docker Hardened Images (Debian)
  id: debian
  version-id: "13"
  version-codename: trixie
  pretty-name: Docker Hardened Images/Debian GNU/Linux 13 (trixie)
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
paths:
  - type: directory
    path: /usr/local/bin
    uid: 0
    gid: 0
  - type: symlink
    path: /usr/local/bin/gitlab-runner-helper
    uid: 0
    gid: 0
    source: /usr/bin/gitlab-runner-helper
  - type: symlink
    path: /usr/local/bin/git-lfs
    uid: 0
    gid: 0
    source: /usr/bin/git-lfs
annotations:
  org.opencontainers.image.description: A minimal GitLab Runner Helper image
  org.opencontainers.image.licenses: MIT
cmd:
  - /usr/local/bin/gitlab-runner-helper
