# syntax=dhi.io/build:2-debian13

name: Forklift Operator Index 2.x
image: dhi.io/forklift-operator-index
variant: runtime
tags:
  - "2"
  - "2.12"
  - 2.12.9
  - 2-debian
  - 2-debian13
  - 2.12-debian
  - 2.12-debian13
  - 2.12.9-debian
  - 2.12.9-debian13
platforms:
  - linux/amd64
  - linux/arm64
dates:
  release: "2026-08-26"
vars:
  COMMIT_SHA: 869ab59cb994994764ba42a6bd3e828a93f1d2f1
  FLAVORED_SUFFIX: ""
  GRPC_HEALTH_PROBE_FIPS_VERSION: 0.4.59-0
  GRPC_HEALTH_PROBE_PIN_VERSION: 0.4.59-0
  GRPC_HEALTH_PROBE_VERSION: 0.4.59-0
  OCP_VERSION: v4.22
  OPM_FIPS_VERSION: 1.74.0-8
  OPM_PIN_VERSION: 1.74.0-8
  OPM_VERSION: 1.74.0-8
  SEMVER_MAJOR_MINOR_VERSION: "2.12"
  SEMVER_MAJOR_VERSION: "2"
  SEMVER_VERSION: 2.12.9
  SUFFIX: ""
  VERSION: 2.12.9
contents:
  repositories:
    - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
  keyring:
    - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
  packages:
    - base-files
    - ca-certificates-bundle
    - grpc-health-probe=0.4.59-0
    - opm=1.74.0-8
    - tzdata
  builds:
    - name: catalog
      contents:
        repositories:
          - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
        keyring:
          - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
        packages:
          - bash
          - coreutils
          - opm=1.74.0-8
        files:
          - url: git+https://github.com/kubev2v/mtv-fbc.git#869ab59cb994994764ba42a6bd3e828a93f1d2f1
            checksum: 869ab59cb994994764ba42a6bd3e828a93f1d2f1
            path: ${source.dir}/mtv-fbc
            spdx:
              name: mtv-fbc
              version: 2.12.9
              packages:
                - name: mtv-fbc
                  purl: pkg:github/kubev2v/mtv-fbc@869ab59cb994994764ba42a6bd3e828a93f1d2f1
                  license: Apache-2.0
            uid: 0
            gid: 0
      pipeline:
        - name: stage catalog and pre-populate opm cache
          runs: |
            set -eux -o pipefail

            mkdir -p /configs /tmp/cache
            cp -a "${source.dir}/mtv-fbc/v4.22/catalog/." /configs/

            opm serve /configs --cache-dir=/tmp/cache --cache-only
      outputs:
        - source: /configs
          target: /configs
          uid: 0
          gid: 0
        - source: /tmp/cache
          target: /tmp/cache
          uid: 65532
          gid: 65532
accounts:
  run-as: nonroot
  users:
    - name: nonroot
      uid: 65532
      gid: 65532
  groups:
    - name: nonroot
      gid: 65532
      members:
        - nonroot
os-release:
  name: Docker Hardened Images (Debian)
  id: debian
  version-id: "13"
  version-codename: trixie
  pretty-name: Docker Hardened Images/Debian GNU/Linux 13 (trixie)
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
paths:
  - type: directory
    path: /tmp
    uid: 0
    gid: 0
    mode: "1777"
annotations:
  org.opencontainers.image.description: A minimal Forklift (Migration Toolkit for Virtualization) operator index image
  org.opencontainers.image.licenses: Apache-2.0
labels:
  operators.operatorframework.io.index.configs.v1: /configs
entrypoint:
  - /bin/opm
cmd:
  - serve
  - /configs
  - --cache-dir=/tmp/cache
ports:
  - 50051/tcp
