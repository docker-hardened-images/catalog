  - linux/arm64
dates:
  release: "2026-08-26"
vars:
  COMMIT_SHA: d508f8c70f061534c2611aeea3fb2f9bdb1bad43
  FLAVORED_SUFFIX: -dev
  GRPC_HEALTH_PROBE_FIPS_VERSION: 0.4.57-0
  GRPC_HEALTH_PROBE_PIN_VERSION: 0.4.57-0
  GRPC_HEALTH_PROBE_VERSION: 0.4.57-0
  OCP_VERSION: v4.22
  OPM_FIPS_VERSION: 1.74.0-3
  OPM_PIN_VERSION: 1.74.0-3
  OPM_VERSION: 1.74.0-3
  SEMVER_MAJOR_MINOR_VERSION: "2.12"
  SEMVER_MAJOR_VERSION: "2"
  SEMVER_VERSION: 2.12.8
  SUFFIX: -dev
  VERSION: 2.12.8
contents:
  repositories:
    - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
  keyring:
    - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
  packages:
    - '!gawk'
    - '!libelogind0'
    - '!original-awk'
    - apt
    - base-files
    - bash
    - ca-certificates
    - ca-certificates-bundle
    - coreutils
    - diffutils
    - dpkg
    - findutils
    - gpgv
    - grep
    - grpc-health-probe-dev=0.4.57-0
    - libc-bin
    - mawk
    - opm-dev=1.74.0-3
    - perl-base
    - sed
    - tzdata
    - util-linux
  builds:
    - name: catalog
      contents:
        repositories:
          - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
        keyring:
          - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
        packages:
          - bash
          - coreutils
          - opm-dev=1.74.0-3
        files:
          - url: git+https://github.com/kubev2v/mtv-fbc.git#d508f8c70f061534c2611aeea3fb2f9bdb1bad43
            checksum: d508f8c70f061534c2611aeea3fb2f9bdb1bad43
            path: ${source.dir}/mtv-fbc
            spdx:
              name: mtv-fbc
              version: 2.12.8
              packages:
                - name: mtv-fbc
                  purl: pkg:github/kubev2v/mtv-fbc@d508f8c70f061534c2611aeea3fb2f9bdb1bad43
                  license: Apache-2.0
            uid: 0
            gid: 0
      pipeline:
        - name: stage catalog and pre-populate opm cache
          runs: |
            set -eux -o pipefail

            mkdir -p /configs /tmp/cache
            cp -a "${source.dir}/mtv-fbc/v4.22/catalog/." /configs/

            opm serve /configs --cache-dir=/tmp/cache --cache-only
      outputs:
        - source: /configs
          target: /configs
          uid: 0
          gid: 0
        - source: /tmp/cache
          target: /tmp/cache
          uid: 65532
          gid: 65532
accounts:
  root: true
  run-as: root
  users:
    - name: nonroot
      uid: 65532
      gid: 65532
    - name: _apt
      uid: 42
      gid: 65532
  groups:
    - name: nonroot
      gid: 65532
      members:
        - nonroot
os-release:
  name: Docker Hardened Images (Debian)
  id: debian
  version-id: "13"
  version-codename: trixie
  pretty-name: Docker Hardened Images/Debian GNU/Linux 13 (trixie)
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
environment:
  DEBIAN_FRONTEND: noninteractive
paths:
