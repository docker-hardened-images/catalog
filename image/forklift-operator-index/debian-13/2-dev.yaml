  - 2.12-dev
  - 2.12.8-dev
  - 2-debian-dev
  - 2-debian13-dev
  - 2.12-debian-dev
  - 2.12-debian13-dev
  - 2.12.8-debian-dev
  - 2.12.8-debian13-dev
platforms:
