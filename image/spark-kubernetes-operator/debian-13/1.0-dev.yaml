# syntax=dhi.io/build:2-debian13

name: Spark Kubernetes Operator 1.0.x (dev)
image: dhi.io/spark-kubernetes-operator
variant: dev
tags:
  - 1-dev
  - 1.0-dev
  - 1.0.0-dev
  - 1-debian-dev
  - 1-debian13-dev
  - 1.0-debian-dev
  - 1.0-debian13-dev
  - 1.0.0-debian-dev
  - 1.0.0-debian13-dev
platforms:
  - linux/amd64
  - linux/arm64
dates:
  release: "2026-07-26"
vars:
  JAVA_FIPS_SUFFIX: ""
  JAVA_MAJOR_VERSION: "26"
  JDK_MAJOR_VERSION: "26"
  OPERATOR_HOME: /opt/spark-operator
  OPERATOR_WORK_DIR: /opt/spark-operator/operator
  PACKAGE_NAME: spark-kubernetes-operator-1.0
  SEMVER_MAJOR_MINOR_VERSION: "1.0"
  SEMVER_MAJOR_VERSION: "1"
  SEMVER_VERSION: 1.0.0
  VERSION: 1.0.0-2
contents:
  repositories:
    - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
  keyring:
    - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
  packages:
    - '!gawk'
    - '!libelogind0'
    - '!mawk'
    - '!original-awk'
    - apt
    - base-files
    - bash
    - ca-certificates
    - ca-certificates-bundle
    - coreutils
    - diffutils
    - dpkg
    - eclipse-temurin-26-jre
    - eclipse-temurin-26-jre-oci-config
    - findutils
    - grep
    - libc-bin
    - libc6
    - libstdc++6
    - lsb-base
    - mawk
    - perl-base
    - sed
    - spark-kubernetes-operator-1.0=1.0.0-2
    - tzdata
    - util-linux
  builds:
    - name: locale
      contents:
        packages:
          - bash
          - locales
          - coreutils
          - gzip
      pipeline:
        - name: install locales
          runs: |
            set -eux -o pipefail

            ln -s /etc/locale.alias /usr/share/locale/locale.alias

            echo "en_US.UTF-8 UTF-8" >> /etc/locale.gen
            locale-gen en_US.UTF-8
      outputs:
        - source: /usr/share/locale
          target: /usr/share/locale
          uid: 0
          gid: 0
        - source: /usr/lib/locale
          target: /usr/lib/locale
          uid: 0
          gid: 0
accounts:
  root: true
  run-as: root
  users:
    - name: spark
      uid: 185
      gid: 185
    - name: _apt
      uid: 42
      gid: 65532
  groups:
    - name: spark
      gid: 185
os-release:
  name: Docker Hardened Images (Debian)
  id: debian
  version-id: "13"
  version-codename: trixie
  pretty-name: Docker Hardened Images/Debian GNU/Linux 13 (trixie)
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
work-dir: /opt/spark-operator/operator
environment:
  DEBIAN_FRONTEND: noninteractive
  JAVA_HOME: /usr/lib/jvm/temurin-26
  LANG: en_US.UTF-8
  LANGUAGE: en_US:en
  LC_ALL: en_US.UTF-8
  PATH: /usr/lib/jvm/temurin-26/bin:/usr/local/bin:/usr/local/sbin:/usr/sbin:/usr/bin:/sbin:/bin
  SPARK_OPERATOR_HOME: /opt/spark-operator
  SPARK_OPERATOR_JAR: spark-kubernetes-operator.jar
  SPARK_OPERATOR_WORK_DIR: /opt/spark-operator/operator
  SPARK_USER: spark
paths:
  - type: directory
    path: /opt/spark-operator
    uid: 185
    gid: 185
    mode: "0755"
  - type: directory
    path: /opt/spark-operator/operator
    uid: 185
    gid: 185
    mode: "0755"
  - type: symlink
    path: /opt/spark-operator/operator/spark-kubernetes-operator.jar
    uid: 185
    gid: 185
    source: /usr/share/spark-kubernetes-operator/spark-kubernetes-operator.jar
annotations:
  org.opencontainers.image.description: A minimal Apache Spark Kubernetes Operator image
  org.opencontainers.image.licenses: Apache-2.0
entrypoint:
  - java
cmd:
  - -cp
  - ./spark-kubernetes-operator.jar
  - org.apache.spark.k8s.operator.SparkOperator
