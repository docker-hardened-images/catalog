# syntax=dhi.io/build:2-debian13

name: JupyterHub K8s Hub 4.4.x (dev)
image: dhi.io/jupyterhub-k8s-hub
variant: dev
tags:
  - 4-dev
  - 4.4-dev
  - 4.4.2-dev
  - 4-debian-dev
  - 4-debian13-dev
  - 4.4-debian-dev
  - 4.4-debian13-dev
  - 4.4.2-debian-dev
  - 4.4.2-debian13-dev
platforms:
  - linux/amd64
  - linux/arm64
dates:
  release: "2026-03-26"
vars:
  JUPYTERHUB_VERSION: 5.5.2
  SEMVER_MAJOR_MINOR_VERSION: "4.4"
  SEMVER_MAJOR_VERSION: "4"
  SEMVER_VERSION: 4.4.2
  VERSION: 4.4.2-1
contents:
  repositories:
    - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
  keyring:
    - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
  packages:
    - '!gawk'
    - '!libelogind0'
    - '!original-awk'
    - apt
    - base-files
    - bash
    - ca-certificates
    - ca-certificates-bundle
    - coreutils
    - diffutils
    - dpkg
    - findutils
    - grep
    - jupyterhub-k8s-hub=4.4.2-1
    - libc-bin
    - libcurl4t64
    - libffi8
    - libpq5
    - libstdc++6
    - mawk
    - perl-base
    - python-3.14
    - sed
    - sqlite3
    - tini
    - tzdata
    - util-linux
accounts:
  root: true
  run-as: root
  users:
    - name: nonroot
      uid: 65532
      gid: 65532
    - name: _apt
      uid: 42
      gid: 65532
  groups:
    - name: nonroot
      gid: 65532
      members:
        - nonroot
os-release:
  name: Docker Hardened Images (Debian)
  id: debian
  version-id: "13"
  version-codename: trixie
  pretty-name: Docker Hardened Images/Debian GNU/Linux 13 (trixie)
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
work-dir: /srv/jupyterhub
environment:
  DEBIAN_FRONTEND: noninteractive
  JUPYTERHUB_VERSION: 5.5.2
  PATH: /opt/jupyterhub/.venv/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
  PYTHONUNBUFFERED: "1"
paths:
  - type: directory
    path: /srv/jupyterhub
    uid: 65532
    gid: 65532
    mode: "0755"
  - type: directory
    path: /opt/jupyterhub
    uid: 65532
    gid: 65532
    mode: "0755"
  - type: symlink
    path: /opt/jupyterhub/.venv
    uid: 0
    gid: 0
    source: /usr/lib/jupyterhub-k8s-hub
  - type: directory
    path: /usr/local/etc/jupyterhub
    uid: 65532
    gid: 65532
    mode: "0755"
  - type: file
    path: /usr/local/etc/jupyterhub/jupyterhub_config.py
    uid: 65532
    gid: 65532
    mode: "0644"
    source: image/jupyterhub-k8s-hub/files/jupyterhub_config.py
annotations:
  org.opencontainers.image.description: A minimal jupyterhub-k8s-hub image
  org.opencontainers.image.licenses: BSD-3-Clause
entrypoint:
  - /usr/bin/tini
  - --
cmd:
  - jupyterhub
  - --config
  - /usr/local/etc/jupyterhub/jupyterhub_config.py
ports:
  - 8081/tcp
