# syntax=dhi.io/build:2-debian13

name: JupyterHub K8s Hub 4.4.x
image: dhi.io/jupyterhub-k8s-hub
variant: runtime
tags:
  - "4"
  - "4.4"
  - 4.4.2
  - 4-debian
  - 4-debian13
  - 4.4-debian
  - 4.4-debian13
  - 4.4.2-debian
  - 4.4.2-debian13
platforms:
  - linux/amd64
  - linux/arm64
dates:
  release: "2024-11-07"
vars:
  JUPYTERHUB_VERSION: 5.5.2
  SEMVER_MAJOR_MINOR_VERSION: "4.4"
  SEMVER_MAJOR_VERSION: "4"
  SEMVER_VERSION: 4.4.2
  VERSION: 4.4.2-1
contents:
  repositories:
    - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
  keyring:
    - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
  packages:
    - base-files
    - ca-certificates
    - ca-certificates-bundle
    - jupyterhub-k8s-hub=4.4.2-1
    - libcurl4t64
    - libffi8
    - libpq5
    - libstdc++6
    - python-3.14
    - sqlite3
    - tini
    - tzdata
accounts:
  run-as: nonroot
  users:
    - name: nonroot
      uid: 65532
      gid: 65532
  groups:
    - name: nonroot
      gid: 65532
      members:
        - nonroot
os-release:
  name: Docker Hardened Images (Debian)
  id: debian
  version-id: "13"
  version-codename: trixie
  pretty-name: Docker Hardened Images/Debian GNU/Linux 13 (trixie)
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
work-dir: /srv/jupyterhub
environment:
  JUPYTERHUB_VERSION: 5.5.2
  PATH: /opt/jupyterhub/.venv/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
  PYTHONUNBUFFERED: "1"
paths:
  - type: directory
    path: /srv/jupyterhub
    uid: 65532
    gid: 65532
    mode: "0755"
  - type: directory
    path: /opt/jupyterhub
    uid: 65532
    gid: 65532
    mode: "0755"
  - type: symlink
    path: /opt/jupyterhub/.venv
    uid: 0
    gid: 0
    source: /usr/lib/jupyterhub-k8s-hub
  - type: directory
    path: /usr/local/etc/jupyterhub
    uid: 65532
    gid: 65532
    mode: "0755"
  - type: file
    path: /usr/local/etc/jupyterhub/jupyterhub_config.py
    uid: 65532
    gid: 65532
    mode: "0644"
    source: image/jupyterhub-k8s-hub/files/jupyterhub_config.py
annotations:
  org.opencontainers.image.description: A minimal jupyterhub-k8s-hub image
  org.opencontainers.image.licenses: BSD-3-Clause
entrypoint:
  - /usr/bin/tini
  - --
cmd:
  - jupyterhub
  - --config
  - /usr/local/etc/jupyterhub/jupyterhub_config.py
ports:
  - 8081/tcp
