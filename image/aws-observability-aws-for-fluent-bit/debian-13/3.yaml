# syntax=dhi.io/build:2-debian13

name: AWS for Fluent Bit 3.x
image: dhi.io/aws-observability-aws-for-fluent-bit
variant: runtime
tags:
  - "3"
  - "3.5"
  - 3.5.5
  - 3-debian
  - 3-debian13
  - 3.5-debian
  - 3.5-debian13
  - 3.5.5-debian
  - 3.5.5-debian13
platforms:
  - linux/amd64
  - linux/arm64
dates:
  release: "2025-10-13"
vars:
  APP_PACKAGE: aws-for-fluent-bit-3
  SEMVER_MAJOR_MINOR_VERSION: "3.5"
  SEMVER_MAJOR_VERSION: "3"
  SEMVER_VERSION: 3.5.5
  VERSION: 3.5.5-0
contents:
  repositories:
    - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
  keyring:
    - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
  packages:
    - '!libelogind0'
    - '!mawk'
    - '!original-awk'
    - aws-for-fluent-bit-3=3.5.5-0
    - base-files
    - bash
    - ca-certificates
    - ca-certificates-bundle
    - coreutils
    - curl
    - dash
    - libc-ares2
    - libc6
    - libcurl4t64
    - libjemalloc2
    - liblz4-1
    - libnghttp2-14
    - librdkafka1
    - libsasl2-2
    - libsqlite3-0
    - libssl3t64
    - libstdc++6
    - libsystemd0
    - libyaml-0-2
    - libzstd1
    - tzdata
    - zlib1g
accounts:
  run-as: nonroot
  users:
    - name: nonroot
      uid: 65532
      gid: 65532
  groups:
    - name: nonroot
      gid: 65532
      members:
        - nonroot
os-release:
  name: Docker Hardened Images (Debian)
  id: debian
  version-id: "13"
  version-codename: trixie
  pretty-name: Docker Hardened Images/Debian GNU/Linux 13 (trixie)
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
paths:
  - type: directory
    path: /fluent-bit
    uid: 0
    gid: 0
    mode: "0755"
  - type: directory
    path: /fluent-bit/bin
    uid: 0
    gid: 0
    mode: "0755"
  - type: symlink
    path: /fluent-bit/bin/fluent-bit
    uid: 0
    gid: 0
    source: /usr/bin/fluent-bit
  - type: symlink
    path: /fluent-bit/kinesis.so
    uid: 0
    gid: 0
    source: /usr/lib/aws-for-fluent-bit/kinesis.so
  - type: symlink
    path: /fluent-bit/firehose.so
    uid: 0
    gid: 0
    source: /usr/lib/aws-for-fluent-bit/firehose.so
  - type: symlink
    path: /fluent-bit/cloudwatch.so
    uid: 0
    gid: 0
    source: /usr/lib/aws-for-fluent-bit/cloudwatch.so
  - type: symlink
    path: /fluent-bit/etc
    uid: 0
    gid: 0
    source: /etc/aws-for-fluent-bit
  - type: symlink
    path: /fluent-bit/parsers
    uid: 0
    gid: 0
    source: /usr/share/aws-for-fluent-bit/parsers
  - type: symlink
    path: /fluent-bit/configs
    uid: 0
    gid: 0
    source: /usr/share/aws-for-fluent-bit/configs
  - type: symlink
    path: /fluent-bit/filters
    uid: 0
    gid: 0
    source: /usr/share/aws-for-fluent-bit/filters
  - type: symlink
    path: /fluent-bit/licenses
    uid: 0
    gid: 0
    source: /usr/share/aws-for-fluent-bit/licenses
  - type: directory
    path: /fluent-bit/log
    uid: 65532
    gid: 65532
    mode: "0770"
  - type: symlink
    path: /entrypoint.sh
    uid: 0
    gid: 0
    source: /usr/lib/aws-for-fluent-bit/entrypoint.sh
  - type: symlink
    path: /AWS_FOR_FLUENT_BIT_VERSION
    uid: 0
    gid: 0
    source: /usr/share/aws-for-fluent-bit/AWS_FOR_FLUENT_BIT_VERSION
  - type: symlink
    path: /ecs
    uid: 0
    gid: 0
    source: /usr/share/aws-for-fluent-bit/ecs
annotations:
  org.opencontainers.image.description: A minimal AWS for Fluent Bit image
  org.opencontainers.image.licenses: Apache-2.0
cmd:
  - /entrypoint.sh
ports:
  - 24224/tcp
