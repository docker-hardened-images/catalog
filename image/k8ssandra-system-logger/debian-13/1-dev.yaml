# syntax=dhi.io/build:2-debian13

name: K8ssandra System Logger 1.32.x (dev)
image: dhi.io/k8ssandra-system-logger
variant: dev
tags:
  - 1-dev
  - 1.32-dev
  - 1.32.0-dev
  - 1-debian-dev
  - 1-debian13-dev
  - 1.32-debian-dev
  - 1.32-debian13-dev
  - 1.32.0-debian-dev
  - 1.32.0-debian13-dev
platforms:
  - linux/amd64
  - linux/arm64
dates:
  release: "2024-06-17"
vars:
  SEMVER_MAJOR_MINOR_VERSION: "1.32"
  SEMVER_MAJOR_VERSION: "1"
  SEMVER_VERSION: 1.32.0
  VERSION: 1.32.0-9
contents:
  repositories:
    - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
  keyring:
    - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
  packages:
    - '!gawk'
    - '!libelogind0'
    - '!mawk'
    - '!original-awk'
    - apt
    - base-files
    - bash
    - ca-certificates
    - ca-certificates-bundle
    - coreutils
    - diffutils
    - dpkg
    - findutils
    - grep
    - k8ssandra-system-logger=1.32.0-9
    - libc-bin
    - libstdc++6
    - mawk
    - perl-base
    - sed
    - tzdata
    - util-linux
accounts:
  root: true
  run-as: root
  users:
    - name: cassandra
      uid: 999
      gid: 999
    - name: _apt
      uid: 42
      gid: 65532
  groups:
    - name: cassandra
      gid: 999
      members:
        - cassandra
os-release:
  name: Docker Hardened Images (Debian)
  id: debian
  version-id: "13"
  version-codename: trixie
  pretty-name: Docker Hardened Images/Debian GNU/Linux 13 (trixie)
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
environment:
  DEBIAN_FRONTEND: noninteractive
paths:
  - type: directory
    path: /var/log/cassandra
    uid: 999
    gid: 999
    mode: "0755"
  - type: directory
    path: /var/lib/vector
    uid: 999
    gid: 999
    mode: "0755"
annotations:
  org.opencontainers.image.description: A minimal k8ssandra-system-logger image
  org.opencontainers.image.licenses: Apache-2.0
entrypoint:
  - /usr/bin/vector
cmd:
  - --config
  - /etc/vector/vector.toml
