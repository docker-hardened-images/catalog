# syntax=dhi.io/build:2-debian13

name: K8ssandra System Logger 1.33.x
image: dhi.io/k8ssandra-system-logger
variant: runtime
tags:
  - "1"
  - "1.33"
  - 1.33.1
  - 1-debian
  - 1-debian13
  - 1.33-debian
  - 1.33-debian13
  - 1.33.1-debian
  - 1.33.1-debian13
platforms:
  - linux/amd64
  - linux/arm64
dates:
  release: "2024-06-17"
vars:
  SEMVER_MAJOR_MINOR_VERSION: "1.33"
  SEMVER_MAJOR_VERSION: "1"
  SEMVER_VERSION: 1.33.1
  VERSION: 1.33.1-0
contents:
  repositories:
    - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
  keyring:
    - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
  packages:
    - '!libelogind0'
    - '!mawk'
    - '!original-awk'
    - base-files
    - ca-certificates-bundle
    - k8ssandra-system-logger=1.33.1-0
    - libstdc++6
    - tzdata
    - zlib1g
accounts:
  run-as: "999"
  users:
    - name: cassandra
      uid: 999
      gid: 999
  groups:
    - name: cassandra
      gid: 999
      members:
        - cassandra
os-release:
  name: Docker Hardened Images (Debian)
  id: debian
  version-id: "13"
  version-codename: trixie
  pretty-name: Docker Hardened Images/Debian GNU/Linux 13 (trixie)
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
paths:
  - type: directory
    path: /var/log/cassandra
    uid: 999
    gid: 999
    mode: "0755"
  - type: directory
    path: /var/lib/vector
    uid: 999
    gid: 999
    mode: "0755"
annotations:
  org.opencontainers.image.description: A minimal k8ssandra-system-logger image
  org.opencontainers.image.licenses: Apache-2.0
entrypoint:
  - /usr/bin/vector
cmd:
  - --config
  - /etc/vector/vector.toml
