# syntax=dhi.io/build:2-debian13

name: Argo CD Image Updater 1.x
image: dhi.io/argocd-image-updater
variant: runtime
tags:
  - "1"
  - "1.3"
  - 1.3.0
  - 1-debian
  - 1-debian13
  - 1.3-debian
  - 1.3-debian13
  - 1.3.0-debian
  - 1.3.0-debian13
platforms:
  - linux/amd64
  - linux/arm64
dates:
  release: "2025-12-15"
vars:
  AWSCLI_REFERENCE: dhi/awscli:2.36.24-debian13@sha256:f7bc04bde07a202c58e81dd18a873f98f6a15eb8e7f328c00779d827882c44fd
  AWSCLI_VERSION: 2.36.24
  FLAVORED_SUFFIX: ""
  SEMVER_MAJOR_MINOR_VERSION: "1.3"
  SEMVER_MAJOR_VERSION: "1"
  SEMVER_VERSION: 1.3.0
  SUFFIX: ""
  VERSION: 1.3.0-1
contents:
  repositories:
    - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
  keyring:
    - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
  packages:
    - argocd-image-updater=1.3.0-1
    - base-files
    - ca-certificates
    - ca-certificates-bundle
    - git
    - gpg
    - gpg-agent
    - libcurl4t64
    - openssh-client
    - tini
    - tzdata
  artifacts:
    - name: dhi.io/awscli:2.36.24-debian13@sha256:f7bc04bde07a202c58e81dd18a873f98f6a15eb8e7f328c00779d827882c44fd
      includes:
        - opt/aws-cli
        - opt/docker/sbom/awscli
      uid: 0
      gid: 0
accounts:
  run-as: "1000"
  users:
    - name: argocd
      uid: 1000
      gid: 1000
  groups:
    - name: argocd
      gid: 1000
      members:
        - argocd
os-release:
  name: Docker Hardened Images (Debian)
  id: debian
  version-id: "13"
  version-codename: trixie
  pretty-name: Docker Hardened Images/Debian GNU/Linux 13 (trixie)
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
work-dir: /app
environment:
  AWS_CLI_VERSION: 2.36.24
  PATH: /opt/aws-cli/bin:/usr/sbin:/sbin:/usr/bin:/bin
paths:
  - type: directory
    path: /app/config
    uid: 1000
    gid: 1000
    mode: "0755"
  - type: directory
    path: /usr/local/bin
    uid: 0
    gid: 0
  - type: symlink
    path: /usr/local/bin/argocd-image-updater
    uid: 0
    gid: 0
    source: /usr/bin/argocd-image-updater
  - type: symlink
    path: /manager
    uid: 0
    gid: 0
    source: /usr/local/bin/argocd-image-updater
annotations:
  org.opencontainers.image.description: A minimal Argo CD Image Updater image
  org.opencontainers.image.licenses: Apache-2.0
entrypoint:
  - /usr/bin/tini
  - --
  - /manager
ports:
  - 8081/tcp
