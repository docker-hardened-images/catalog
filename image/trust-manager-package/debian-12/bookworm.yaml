# syntax=dhi.io/build:2-debian12

name: Trust Manager Package for Debian 12 (bookworm)
image: dhi.io/trust-manager-package
variant: runtime
tags:
  - bookworm-debian12
  - bookworm-20250419-debian12
  - bookworm-20250419-deb12u2-debian12
platforms:
  - linux/amd64
  - linux/arm64
dates:
  release: "2023-06-10"
  end-of-life: "2026-06-10"
vars:
  BASE_DIGEST: sha256:bb39f7fa6cd4400348f0a38807bdf864087970fcc2c49f78cdfb85f9e2b9ffdf
  BASE_TAG: 20250419-debian12
  CA_CERTIFICATES_VERSION: 20250419~deb12u2
  CA_CERTIFICATES_VERSION_DATE: "20250419"
  CA_CERTIFICATES_VERSION_DEB: deb12u2
  CODENAME: bookworm
  DISTRO_PRETTY_VERSION: Debian 12 (bookworm)
  DISTRO_VERSION: "12"
  GOLANG_REFERENCE: dhi/golang:1.26.10-debian12-dev@sha256:c64a192a4a0d7acb7d2cfb39581bf06340c609bd42c2c04e2925f150b3609e0f
  TRUST_MANAGER_COMMIT_SHA: d2b8e492c7a99bc69a85fb6ca666ea960c60cecf
  TRUST_MANAGER_VERSION: 0.26.0
contents:
  packages:
    - '!base-files'
  builds:
    - name: trust-pkg-debian-bookworm
      uses: dhi.io/golang:1.26.10-debian12-dev@sha256:c64a192a4a0d7acb7d2cfb39581bf06340c609bd42c2c04e2925f150b3609e0f
      contents:
        packages:
          - ca-certificates=20250419~deb12u2
        files:
          - url: git+https://github.com/cert-manager/trust-manager.git#v0.26.0
            checksum: d2b8e492c7a99bc69a85fb6ca666ea960c60cecf
            path: /go/src/github.com/cert-manager/trust-manager
            spdx:
              name: trust-manager
              version: 0.26.0
              packages:
                - name: trust-manager-debian-bundle-static
                  purl: pkg:golang/github.com/cert-manager/trust-manager@0.26.0#trust-packages/debian
                  license: Apache-2.0
            uid: 0
            gid: 0
      pipeline:
        - name: patch
          uses: go/bump@v1
          work-dir: /go/src/github.com/cert-manager/trust-manager/trust-packages/debian
          with:
            deps: []
            download: true
        - name: build debian-bundle-static binary
          uses: go/build@v1
          work-dir: /go/src/github.com/cert-manager/trust-manager/trust-packages/debian
          with:
            output: ${target.dir}/usr/local/bin/debian-bundle-static
            packages: .
        - name: create trust bundle JSON
          runs: |
            set -eux -o pipefail

            mkdir -p ${target.dir}/debian-package

            # ca-certificates from contents.packages; jq is pre-installed in the golang builder
            jq -n \
              --rawfile bundle /etc/ssl/certs/ca-certificates.crt \
              --arg name "cert-manager-debian-bookworm" \
              --arg version "20250419~deb12u2" \
              '.name = $name | .bundle = $bundle | .version = $version' \
              > ${target.dir}/debian-package/cert-manager-package-debian.json
      outputs:
        - source: ${target.dir}/usr/local/bin/debian-bundle-static
          target: /usr/local/bin/debian-bundle-static
          uid: 0
          gid: 0
        - source: ${target.dir}/debian-package/cert-manager-package-debian.json
          target: /debian-package/cert-manager-package-debian.json
          uid: 0
          gid: 0
        - source: /opt/docker/sbom/trust-manager
          target: /opt/docker/sbom/trust-manager
          uid: 0
          gid: 0
  artifacts:
    - name: dhi.io/static:20250419-debian12@sha256:bb39f7fa6cd4400348f0a38807bdf864087970fcc2c49f78cdfb85f9e2b9ffdf
      includes:
        - bin
        - etc
        - home
        - lib
        - lib64
        - opt
        - sbin
        - tmp
        - usr
        - var
      excludes:
        - etc/group
        - etc/os-release
        - etc/passwd
        - var/lib/dpkg/status
      uid: 0
      gid: 0
accounts:
  run-as: "65532"
  users:
    - name: nonroot
      uid: 65532
      gid: 65532
  groups:
    - name: nonroot
      gid: 65532
      members:
        - nonroot
os-release:
  name: Docker Hardened Images (Debian)
  id: debian
  version-id: "12"
  version-codename: bookworm
  pretty-name: Docker Hardened Images/Debian GNU/Linux 12 (bookworm)
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
paths:
  - type: directory
    path: /ko-app
    uid: 0
    gid: 0
    mode: "0755"
  - type: symlink
    path: /ko-app/debian-bundle-static
    uid: 0
    gid: 0
    source: /usr/local/bin/debian-bundle-static
annotations:
  org.opencontainers.image.description: A minimal trust package image providing CA certificates for cert-manager trust-manager
  org.opencontainers.image.licenses: Apache-2.0
entrypoint:
  - /usr/local/bin/debian-bundle-static
