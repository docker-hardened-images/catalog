          with:
            bumps: ${source.dir}/patches/dashboards-investigation-bumps.json
            yarn-root: ${source.dir}/opensearch-dashboards/plugins/investigationDashboards
        - name: Bootstrap opensearch-dashboards with plugins
          run-as: opensearch-dashboards
          work-dir: ${source.dir}/opensearch-dashboards
          privileged: true
          runs: |
            set -eux -o pipefail

            # yarn/bump@v2 installs with --ignore-scripts which breaks some dependencies.
            # Clean before bootstrapping/building so that everything is build properly.
            yarn osd clean
            yarn osd bootstrap --single-version 'ignore'
        - name: patch build script to allow lockfile updates
          run-as: opensearch-dashboards
          work-dir: ${source.dir}/opensearch-dashboards
          runs: |
            set -eux -o pipefail

            sed -i "/'--frozen-lockfile',/d" src/dev/build/tasks/install_dependencies_task.ts
            if grep -q -- '--frozen-lockfile' src/dev/build/tasks/install_dependencies_task.ts; then
              echo "ERROR: --frozen-lockfile still present in install_dependencies_task.ts" >&2
              exit 1
            fi
        - name: build all plugins
          run-as: opensearch-dashboards
          work-dir: ${source.dir}/opensearch-dashboards/plugins
          privileged: true
          runs: |
            set -eux -o pipefail

            plugin_dirs=$(ls -1d */ | sed 's:/$::')
            for dir_name in $plugin_dirs; do
              echo "Building plugin: ${dir_name}"
              cd "${dir_name}"
              yarn build
              cd ..
            done
        - name: patch source
          uses: git/patch@v1
          work-dir: ${source.dir}/opensearch-dashboards
          with:
            patch: ${source.dir}/patches/no_node_download.patch
        - name: build opensearch-dashboards
          run-as: opensearch-dashboards
          work-dir: ${source.dir}/opensearch-dashboards
          runs: |
            set -eux -o pipefail

            yarn run build-platform --${OPENSEARCH_BUILD_ARCH} --skip-os-packages --release
        - name: extract opensearch-dashboards
          work-dir: ${source.dir}/opensearch-dashboards
          runs: |
            set -eux -o pipefail

            # take the tarball in the build directory and extract it to the target directory
            ls -la ${source.dir}/opensearch-dashboards/build
            ls -la ${source.dir}/opensearch-dashboards/build/opensearch-dashboards
            ls -la ${source.dir}/opensearch-dashboards/build/opensearch-dashboards-3.10.0-${OPENSEARCH_DIST_ARCH}
            cp -r ${source.dir}/opensearch-dashboards/build/opensearch-dashboards ${target.dir}/opensearch-dashboards
        - name: extract plugin builds to target
          work-dir: ${source.dir}/opensearch-dashboards/plugins
          runs: |
            set -eux -o pipefail

            # Create plugins directory in target
            mkdir -p ${target.dir}/opensearch-dashboards/plugins

            # For each plugin directory, find a zip containing 3.10.0 (handles optional ".0") and extract it
            plugin_dirs=$(ls -1d */ | sed 's:/$::')
            for dir_name in $plugin_dirs; do
              build_dir="${dir_name}/build"
              echo "Processing plugin: ${dir_name}"
              if [ ! -d "${build_dir}" ]; then
                echo "Error: build directory not found for ${dir_name}, skipping"
                exit 1
              fi

              # Use find to locate a zip file that contains the VERSION in its name.
              # This handles names like plugin-3.10.0.zip and plugin-3.10.0.0.zip
              found_zip=$(find "${build_dir}" -maxdepth 1 -type f -iname "*3.10.0*.zip" | head -n 1 || true)

              if [ -z "${found_zip}" ]; then
                echo "Error: No zip found for plugin ${dir_name} containing version 3.10.0"
                exit 1
              fi

              echo "Found artifact: ${found_zip}, extracting to ${target.dir}/opensearch-dashboards/plugins/"
              unzip -q "${found_zip}" -d "${target.dir}/opensearch-dashboards/plugins/"
            done
        - name: copy over plugins to final dir inside opensearch-dashboards plugins dir
          runs: |
            set -eux -o pipefail

            mkdir -p ${source.dir}/tmp/plugins
            cp -r ${target.dir}/opensearch-dashboards/plugins/opensearch-dashboards/* ${source.dir}/tmp/plugins
            rm -rf ${target.dir}/opensearch-dashboards/plugins
            rm -rf ${source.dir}/tmp/plugins/opensearch-dashboards
            cp -r ${source.dir}/tmp/plugins ${target.dir}/opensearch-dashboards/plugins
      paths:
        - type: file
          path: /src/patches/dashboards-alerting-bumps.json
          uid: 1000
          gid: 1000
          mode: "0600"
          source: image/opensearch-dashboards/patch/dashboards-alerting-bumps.json
