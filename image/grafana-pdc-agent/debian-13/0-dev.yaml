# syntax=dhi.io/build:2-debian13

name: Grafana PDC Agent 0.x (dev)
image: dhi.io/grafana-pdc-agent
variant: dev
tags:
  - 0-dev
  - 0.0-dev
  - 0.0.68-dev
  - 0-debian-dev
  - 0-debian13-dev
  - 0.0-debian-dev
  - 0.0-debian13-dev
  - 0.0.68-debian-dev
  - 0.0.68-debian13-dev
platforms:
  - linux/amd64
  - linux/arm64
dates:
  release: "2023-02-01"
vars:
  FLAVORED_SUFFIX: -dev
  PDC_FIPS: ""
  SEMVER_MAJOR_MINOR_VERSION: "0.0"
  SEMVER_MAJOR_VERSION: "0"
  SEMVER_VERSION: 0.0.68
  SUFFIX: -dev
  VERSION: 0.0.68-1
contents:
  repositories:
    - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
  keyring:
    - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
  packages:
    - '!gawk'
    - '!libelogind0'
    - '!mawk'
    - '!original-awk'
    - apt
    - base-files
    - bash
    - ca-certificates
    - ca-certificates-bundle
    - coreutils
    - diffutils
    - dpkg
    - findutils
    - grafana-pdc-agent-0=0.0.68-1
    - grep
    - libc-bin
    - mawk
    - openssh-client
    - perl-base
    - sed
    - tzdata
    - util-linux
  builds:
    - name: home directory
      shell: /bin/bash
      contents:
        packages:
          - bash
          - coreutils
      pipeline:
        - name: create home
          runs: |
            set -eux -o pipefail

            mkdir -p /out/home/pdc
            chmod 2755 /out/home/pdc
            chown 30000:30000 /out/home/pdc
            ls -ldn /out/home/pdc
      outputs:
        - source: /out
          target: /
          uid: 0
          gid: 0
accounts:
  root: true
  run-as: root
  users:
    - name: nonroot
      uid: 65532
      gid: 65532
    - name: _apt
      uid: 42
      gid: 65532
    - name: _apt
      uid: 42
      gid: 65532
  groups:
    - name: pdc
      gid: 30000
      members:
        - pdc
os-release:
  name: Docker Hardened Images (Debian)
  id: debian
  version-id: "13"
  version-codename: trixie
  pretty-name: Docker Hardened Images/Debian GNU/Linux 13 (trixie)
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
work-dir: /
environment:
  DEBIAN_FRONTEND: noninteractive
paths:
  - type: delete
    path: /home/nonroot
    uid: 0
    gid: 0
  - type: file
    path: /etc/passwd
    content: |
      pdc:x:30000:30000:pdc:/home/pdc:/bin/sh
      nobody:x:65534:65534:nobody:/nonexistent:/bin/sh
    uid: 0
    gid: 0
  - type: file
    path: /etc/shadow
    content: |
      pdc:!::0:99999:7:::
      nobody:*::0:99999:7:::
    uid: 0
    gid: 42
    mode: "0640"
  - type: file
    path: /etc/passwd
    content: |
      root:x:0:0:root:/root:/bin/sh
      pdc:x:30000:30000:pdc:/home/pdc:/bin/sh
      _apt:x:42:65532:_apt:/home/_apt:/bin/sh
      nobody:x:65534:65534:nobody:/nonexistent:/bin/sh
    uid: 0
    gid: 0
  - type: file
    path: /etc/shadow
    content: |
      root:*::0:99999:7:::
      pdc:!::0:99999:7:::
      _apt:!::0:99999:7:::
      nobody:*::0:99999:7:::
    uid: 0
    gid: 42
    mode: "0640"
annotations:
  org.opencontainers.image.description: A minimal Grafana PDC Agent image
  org.opencontainers.image.licenses: Apache-2.0
entrypoint:
  - /usr/bin/pdc
ports:
  - 8090/tcp
