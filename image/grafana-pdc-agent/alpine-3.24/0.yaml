# syntax=dhi.io/build:2-alpine3.24

name: Grafana PDC Agent 0.x
image: dhi.io/grafana-pdc-agent
variant: runtime
tags:
  - 0-alpine
  - 0.0-alpine
  - 0-alpine3.24
  - 0.0.68-alpine
  - 0.0-alpine3.24
  - 0.0.68-alpine3.24
platforms:
  - linux/amd64
  - linux/arm64
dates:
  release: "2023-02-01"
vars:
  FLAVORED_SUFFIX: ""
  SEMVER_MAJOR_MINOR_VERSION: "0.0"
  SEMVER_MAJOR_VERSION: "0"
  SEMVER_VERSION: 0.0.68
  SUFFIX: ""
  VERSION: 0.0.68-r1
contents:
  repositories:
    - https://dhi.io/apk/alpine/v3.24/main
    - https://dl-cdn.alpinelinux.org/alpine/v3.24/main
    - https://dl-cdn.alpinelinux.org/alpine/v3.24/community
  keyring:
    - https://dhi.io/keyring/dhi-apk@docker-0F81AD7700D99184.rsa.pub
  packages:
    - alpine-baselayout-data
    - ca-certificates-bundle
    - grafana-pdc-agent-0=0.0.68-r1
    - openssh-client-default
    - tzdata
  builds:
    - name: home directory
      shell: /bin/bash
      contents:
        packages:
          - bash
          - coreutils
      pipeline:
        - name: create home
          runs: |
            set -eux -o pipefail

            mkdir -p /out/home/pdc
            chmod 2755 /out/home/pdc
            chown 30000:30000 /out/home/pdc
            ls -ldn /out/home/pdc
      outputs:
        - source: /out
          target: /
          uid: 0
          gid: 0
accounts:
  run-as: "30000"
  users:
    - name: nonroot
      uid: 65532
      gid: 65532
  groups:
    - name: pdc
      gid: 30000
      members:
        - pdc
os-release:
  name: Docker Hardened Images (Alpine)
  id: alpine
  version-id: "3.24"
  pretty-name: Docker Hardened Images/Alpine Linux v3.24
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
work-dir: /
paths:
  - type: delete
    path: /home/nonroot
    uid: 0
    gid: 0
  - type: file
    path: /etc/passwd
    content: |
      pdc:x:30000:30000:pdc:/home/pdc:/bin/sh
      nobody:x:65534:65534:nobody:/nonexistent:/bin/sh
    uid: 0
    gid: 0
  - type: file
    path: /etc/shadow
    content: |
      pdc:!::0:99999:7:::
      nobody:*::0:99999:7:::
    uid: 0
    gid: 42
    mode: "0640"
annotations:
  org.opencontainers.image.description: A minimal Grafana PDC Agent image
  org.opencontainers.image.licenses: Apache-2.0
entrypoint:
  - /usr/bin/pdc
ports:
  - 8090/tcp
