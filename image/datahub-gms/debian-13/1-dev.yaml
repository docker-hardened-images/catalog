                  license: Apache-2.0
            uid: 0
            gid: 0
          - url: https://repo1.maven.org/maven2/com/fasterxml/jackson/core/jackson-databind/2.21.5/jackson-databind-2.21.5.jar
            checksum: sha256:507418c0fafd38b2b2cfb704521630da613a8e4cc8381195a6f418017883e2c0
            path: ${source.dir}/patch/deps/jackson-databind-2.21.5.jar
            spdx:
              name: jackson-databind
              version: 2.21.5
              packages:
                - name: jackson-databind
                  purl: pkg:maven/com.fasterxml.jackson.core/jackson-databind@2.21.5
                  license: Apache-2.0
            uid: 0
            gid: 0
          - url: https://repo1.maven.org/maven2/tools/jackson/core/jackson-core/3.1.4/jackson-core-3.1.4.jar
            checksum: sha256:3bda1cd6eff0a8d47bdfcaeae7c2bd5311d6c8ed494ef5f3e51029bb44aa9bdf
            path: ${source.dir}/patch/deps/tools-jackson-core-3.1.4.jar
            spdx:
              name: jackson-core
              version: 3.1.4
              packages:
                - name: jackson-core
                  purl: pkg:maven/tools.jackson.core/jackson-core@3.1.4
                  license: Apache-2.0
            uid: 0
            gid: 0
          - url: https://repo1.maven.org/maven2/tools/jackson/core/jackson-databind/3.1.5/jackson-databind-3.1.5.jar
            checksum: sha256:3a2338d996fd3056791df8d335fa9ba8a62a706ed4245ecf81b3e583df37d08a
            path: ${source.dir}/patch/deps/tools-jackson-databind-3.1.5.jar
            spdx:
              name: jackson-databind
              version: 3.1.5
              packages:
                - name: jackson-databind
                  purl: pkg:maven/tools.jackson.core/jackson-databind@3.1.5
                  license: Apache-2.0
            uid: 0
            gid: 0
      pipeline:
        - name: install gradle init scripts
          runs: |
            set -eux -o pipefail

            # GHSA-72hv-8253-57qq + jackson-databind PTV bypass family + new jackson
            # CVEs: force jackson 2.x to 2.21.5 at resolution time via init script
            # and the inline build.gradle block below. jackson-annotations is excluded.
            install -D -m 0644 \
              ${source.dir}/patch/force-cve-deps.gradle \
              /root/.gradle/init.d/force-cve-deps.gradle
        - name: patch maven central for build cloud rate limits
          runs: |
            set -eux -o pipefail

            # Maven Central rate-limits Docker Build Cloud egress IPs (HTTP 429).
            #
            # Replace `mavenCentral()` with Google's CDN mirror of Maven Central.
            #
            # Replace `gradlePluginPortal()` with an inline Maven repository
            # at plugins.gradle.org/m2/ that restricts metadataSources to
            # mavenPom() + artifact() only. The default Plugin Portal config
            # also asks for `.module` (Gradle Module Metadata) files; Plugin
            # Portal 303-redirects .module requests to repo.maven.apache.org
            # which 429s. Skipping that lookup is the difference between
            # success and a 429 failure on every plugin artifact lookup.
            MIRROR='maven { url "https://maven-central.storage-download.googleapis.com/maven2/" }'
            PORTAL=$'maven {\\n    url "https://plugins.gradle.org/m2/"\\n    metadataSources { mavenPom(); artifact(); ignoreGradleMetadataRedirection() }\\n}'
            find . \( -name "*.gradle" -o -name "*.gradle.kts" \) -print0 \
              | xargs -0 sed -i \
                -e "s|mavenCentral()|${MIRROR}|g" \
                -e "s|gradlePluginPortal()|${PORTAL}|g"

            # DataHub 1.6+ centralizes repos in gradle.properties +
            # dependencyResolutionManagement (settings.gradle) instead of
            # mavenCentral() calls — point the property at Google's mirror too.
            sed -i \
              -e 's|datahub.dependencies.maven.central=https://repo1.maven.org/maven2|datahub.dependencies.maven.central=https://maven-central.storage-download.googleapis.com/maven2|g' \
              -e 's|apacheMavenRepositoryUrl=https://repo1.maven.org/maven2|apacheMavenRepositoryUrl=https://maven-central.storage-download.googleapis.com/maven2|g' \
              gradle.properties
        - name: bump vulnerable dependency versions
          runs: |
            set -eux -o pipefail

            # Upstream DataHub pins at.yawk.lz4:lz4-java:1.10.1 via
            # resolutionStrategy.force and eachDependency useTarget in
            # build.gradle (and gradle.lockfile). Appending another force
            # does not override that pin — rewrite it to 1.11.1 for
            # CVE-2026-59949 before Gradle resolves.
            find . \( -name '*.gradle' -o -name '*.gradle.kts' -o -name 'gradle.lockfile' \) -print0 \
              | xargs -0 sed -i \
                -e 's|at\.yawk\.lz4:lz4-java:1\.10\.1|at.yawk.lz4:lz4-java:1.11.1|g'

            # Force versions of transitive deps the upstream BOM does not
            # cover. These ride in via Pegasus/Kafka/etc., not via Spring
            # Boot, so bumping springBootVersion alone is not enough.
            #
            # netty 4.2.16.Final fixes CVE-2026-44891 and the 4.2.x line
            #   (CVE-2026-55831, -55833, -56745, -55851, -56816, -56817,
            #   -56820, -56821, -56822, -59901, plus prior 4.1.x/4.2.x CVEs).
            # aircompressor 2.0.3 fixes CVE-2025-67721.
            # spring-webmvc 7.0.8 fixes CVE-2026-41841, -41842, -41843,
            #   -41844, -41845, -41846, -41853 (and prior: CVE-2026-22737,
            #   -22745, -22735, -22741). Must match upstream Spring Boot 4 /
            #   Spring Framework 7 — forcing 6.2.x breaks resolution.
            # spring-kafka 4.0.6 fixes CVE-2026-41726, CVE-2026-41731 and
            #   aligns with Spring Boot 4 (3.3.x is incompatible).
            # jackson-core / jackson-databind 2.21.5 fix GHSA-72hv-8253-57qq,
            #   GHSA-r7wm-3cxj-wff9, and the jackson-databind PolymorphicTypeValidator
            #   bypass family (CVE-2026-54512, -54513, -54514, -54516, -54517, -54518)
            #   plus CVE-2026-59889, GHSA-mhm7-754m-9p8w, CVE-2026-54515 for the
            #   unshaded copies via force-cve-deps.gradle (init script). We tried
            #   forcing here with `--update-locks 'com.fasterxml.jackson.core:*'`
            #   but Gradle re-resolves the lock against the Spring Boot BOM and
            #   writes back the BOM-managed version, defeating the force.
            #   Shaded Hazelcast 5.7 jackson copies are patched into war.war after
            #   the Gradle build (patch/patch-hazelcast-jackson.sh).
            # log4j 2.25.5 fixes CVE-2026-34477, -34478, -34480, CVE-2026-49844.
            # commons-lang3 3.18.0 fixes CVE-2025-48924.
            # avro 1.11.5 fixes CVE-2025-33042 (avro-compiler).
            # jakarta.mail 1.6.8 fixes CVE-2025-7962.
            # opentelemetry 1.62.0 fixes CVE-2026-45292.
            # logback 1.5.35 fixes CVE-2026-1225, CVE-2026-9828, CVE-2026-10532.
            # rhino 1.7.15.1 fixes CVE-2025-66453 while staying on the 1.7.x
            #   line used by upstream DataHub.
            # postgresql 42.7.12 fixes CVE-2026-54291.
            # jetty 12.1.10 fixes CVE-2026-10050, -10051, -6790, -8384.
            # lz4-java 1.11.1 fixes CVE-2026-59949 (also sed-rewrites upstream
            #   1.10.1 force/useTarget/lockfile pins above).
            # micrometer-core 1.16.6 fixes CVE-2026-40983, CVE-2026-40984.
            #   Only force micrometer-core and micrometer-registry-* artifacts;
            #   micrometer-tracing-* artifacts are on a different version line (1.x).
            # httpcore5 5.4.3 fixes CVE-2026-54399.
            # httpclient5 5.6.3 fixes CVE-2026-64607.
            cat >> build.gradle << 'GRADLE'

            // ===== DHI CVE remediation: force minimum versions =====
            // Added by the DHI build pipeline (image/datahub-gms/...inc.yaml).
            // Forces minimum versions for transitive deps not pinned by the
            // upstream Spring Boot BOM, to remediate HIGH/CRITICAL CVEs.
            allprojects {
                configurations.configureEach {
                    resolutionStrategy {
                        // Belt-and-suspenders with the sed rewrite of upstream's
                        // hardcoded 1.10.1 pin (CVE-2026-59949).
                        force 'at.yawk.lz4:lz4-java:1.11.1'
                        eachDependency { details ->
                        def req = details.requested
                        if (req.group == 'io.netty'
                                && req.name.startsWith('netty-')
                                && !req.name.startsWith('netty-tcnative')) {
                            // netty-tcnative-* tracks its own version line
                            // (2.0.x) — only force core netty-*.
                            details.useVersion '4.2.16.Final'
                            details.because 'DHI CVE remediation: CVE-2026-44891, CVE-2026-55831, CVE-2026-55833, CVE-2026-56745, CVE-2026-55851, CVE-2026-56816, CVE-2026-56817, CVE-2026-56820, CVE-2026-56821, CVE-2026-56822, CVE-2026-59901'
                        }
                        if (req.group == 'io.airlift' && req.name == 'aircompressor') {
                            details.useVersion '2.0.3'
                            details.because 'DHI CVE remediation: CVE-2025-67721'
                        }
                        if (req.group == 'org.springframework'
                                && req.name == 'spring-webmvc') {
                            details.useVersion '7.0.8'
                            details.because 'DHI CVE remediation: CVE-2026-41841, CVE-2026-41842, CVE-2026-41843, CVE-2026-41844, CVE-2026-41845, CVE-2026-41846, CVE-2026-41853'
                        }
                        if (req.group == 'org.springframework.kafka'
                                && req.name.startsWith('spring-kafka')) {
                            details.useVersion '4.0.6'
                            details.because 'DHI CVE remediation: CVE-2026-41726, CVE-2026-41731'
                        }
                        if (req.group != null && req.group.startsWith('com.fasterxml.jackson')
                                && req.name != 'jackson-annotations') {
                            details.useVersion '2.21.5'
                            details.because 'DHI CVE remediation: GHSA-72hv-8253-57qq, GHSA-r7wm-3cxj-wff9, CVE-2026-54512, CVE-2026-54513, CVE-2026-54514, CVE-2026-54516, CVE-2026-54517, CVE-2026-54518, CVE-2026-59889, GHSA-mhm7-754m-9p8w, CVE-2026-54515'
                        }
                        if (req.group == 'org.apache.logging.log4j'
                                && req.name.startsWith('log4j-')) {
                            details.useVersion '2.25.5'
                            details.because 'DHI CVE remediation: CVE-2026-34477, CVE-2026-34478, CVE-2026-34480, CVE-2026-49844'
                        }
                        if (req.group == 'org.apache.commons'
                                && req.name == 'commons-lang3') {
                            details.useVersion '3.18.0'
                            details.because 'DHI CVE remediation: CVE-2025-48924'
                        }
                        if (req.group == 'org.apache.avro'
                                && req.name.startsWith('avro')) {
                            details.useVersion '1.11.5'
                            details.because 'DHI CVE remediation: CVE-2025-33042'
                        }
                        if (req.group == 'com.sun.mail'
                                && req.name == 'jakarta.mail') {
                            details.useVersion '1.6.8'
                            details.because 'DHI CVE remediation: CVE-2025-7962'
                        }
                        if (req.group == 'io.opentelemetry'
                                && req.name.startsWith('opentelemetry-')) {
                            details.useVersion '1.62.0'
                            details.because 'DHI CVE remediation: CVE-2026-45292'
                        }
                        if (req.group == 'ch.qos.logback'
                                && req.name.startsWith('logback-')) {
                            details.useVersion '1.5.35'
                            details.because 'DHI CVE remediation: CVE-2026-1225, CVE-2026-9828, CVE-2026-10532'
                        }
                        if (req.group == 'org.mozilla'
                                && req.name == 'rhino') {
                            details.useVersion '1.7.15.1'
                            details.because 'DHI CVE remediation: CVE-2025-66453'
                        }
                        if (req.group == 'org.postgresql'
                                && req.name == 'postgresql') {
                            details.useVersion '42.7.12'
                            details.because 'DHI CVE remediation: CVE-2026-54291'
                        }
                        if (req.group == 'org.eclipse.jetty'
                                && req.name.startsWith('jetty-')) {
                            details.useVersion '12.1.10'
                            details.because 'DHI CVE remediation: CVE-2026-10050, CVE-2026-10051, CVE-2026-6790, CVE-2026-8384'
                        }
                        if (req.group == 'at.yawk.lz4'
                                && req.name == 'lz4-java') {
                            details.useVersion '1.11.1'
                            details.because 'DHI CVE remediation: CVE-2026-59949'
                        }
                        if (req.group == 'io.micrometer'
                                && (req.name == 'micrometer-core'
                                    || req.name.startsWith('micrometer-registry-'))) {
                            details.useVersion '1.16.6'
                            details.because 'DHI CVE remediation: CVE-2026-40983, CVE-2026-40984'
                        }
                        if (req.group == 'org.apache.httpcomponents.core5'
                                && req.name.startsWith('httpcore5')) {
                            details.useVersion '5.4.3'
                            details.because 'DHI CVE remediation: CVE-2026-54399'
                        }
                        if (req.group == 'org.apache.httpcomponents.client5'
                                && req.name == 'httpclient5') {
                            details.useVersion '5.6.3'
                            details.because 'DHI CVE remediation: CVE-2026-64607'
                        }
                        }
                    }
                }
            }
            GRADLE
        - name: build war
          privileged: true
          runs: |
            set -eux -o pipefail

            export GRADLE_HOME="/usr/share/java/gradle"
            export JAVA_HOME="/usr/lib/jvm/temurin-21"
            export PATH="${GRADLE_HOME}/bin:${JAVA_HOME}/bin:${PATH}"

            # Remove any existing Gradle lockfiles to ensure --update-locks
            # can refresh all pinned versions, including lz4-java 1.11.1
            # for CVE-2026-59949.
            find . -name 'gradle.lockfile' -delete || true

            # `:assemble` (vs `:build`) skips the `:check` task graph entirely
            # — no Spotless, no static analysis. Combined with --parallel +
            # --max-workers=4 this trims ~30 min off the cold build and
            # keeps us under the Docker Build Cloud 90-min cap.
            #
            # `--update-locks` refreshes lockfile entries for modules we bump.
            # Jackson groups are included so stale lock pins are rewritten
            # while the inline force above (and force-cve-deps.gradle init script)
            # hold resolution at 2.21.5.
            ./gradlew --init-script ${source.dir}/files/init.gradle \
              :metadata-service:war:assemble \
              -x test \
              --parallel --max-workers=4 \
              --update-locks 'com.fasterxml.jackson.core:*,com.fasterxml.jackson.dataformat:*,com.fasterxml.jackson.datatype:*,com.fasterxml.jackson.module:*,org.apache.zookeeper:*,org.eclipse.jetty:*,org.postgresql:*,org.springframework.boot:*,org.springframework:*,org.springframework.kafka:*,io.netty:*,io.airlift:*,org.apache.logging.log4j:*,org.apache.commons:*,org.apache.avro:*,com.sun.mail:*,io.opentelemetry:*,ch.qos.logback:*,org.mozilla:*,at.yawk.lz4:*,io.micrometer:*,org.apache.httpcomponents.core5:*,org.apache.httpcomponents.client5:*' \
              --no-daemon --console=plain
        - name: stage runtime files
          runs: |
            set -eux -o pipefail

            mkdir -p "${target.dir}/datahub/datahub-gms/bin"
            mkdir -p "${target.dir}/datahub/datahub-gms/scripts"
            mkdir -p "${target.dir}/datahub/datahub-gms/resources"
            mkdir -p "${target.dir}/datahub/datahub-gms/lib"

            cp metadata-service/war/build/libs/war.war \
              "${target.dir}/datahub/datahub-gms/bin/war.war"

            bash "${source.dir}/patch/patch-hazelcast-jackson.sh" \
              "${target.dir}/datahub/datahub-gms/bin/war.war" \
              "${source.dir}/patch/deps"
            cp metadata-models/src/main/resources/entity-registry.yml \
              "${target.dir}/datahub/datahub-gms/resources/entity-registry.yml"
            cp docker/monitoring/client-prometheus-config.yaml \
              "${target.dir}/datahub/datahub-gms/scripts/prometheus-config.yaml"

            # Patched start.sh (absolute paths for bundled Java agents under DHI).
            cp "${source.dir}/files/start.sh" \
              "${target.dir}/datahub/datahub-gms/scripts/start.sh"
            chmod 0755 "${target.dir}/datahub/datahub-gms/scripts/start.sh"
        - name: fetch otel javaagent
          privileged: true
          runs: |
            set -eux -o pipefail

            curl -fsSL -o /tmp/opentelemetry-javaagent.jar \
              "https://github.com/open-telemetry/opentelemetry-java-instrumentation/releases/download/v2.28.0/opentelemetry-javaagent.jar"
            echo "130606aed07f101458fe42b8f453ef3a2536f6bce8a7ae64f222f5688ada2500  /tmp/opentelemetry-javaagent.jar" | sha256sum -c -
            mv /tmp/opentelemetry-javaagent.jar \
              "${target.dir}/datahub/datahub-gms/lib/opentelemetry-javaagent.jar"
        - name: fetch jmx prometheus javaagent
          privileged: true
          runs: |
            set -eux -o pipefail

            # Use Google's Maven Central mirror — repo1.maven.org rate-limits
            # the Docker Build Cloud egress IPs (HTTP 429).
            curl -fsSL -o /tmp/jmx_prometheus_javaagent.jar \
              "https://maven-central.storage-download.googleapis.com/maven2/io/prometheus/jmx/jmx_prometheus_javaagent/0.20.0/jmx_prometheus_javaagent-0.20.0.jar"
            echo "8b67ed40485d475648c36d11d21464b484406f85faf912b3363f71a6a7861320  /tmp/jmx_prometheus_javaagent.jar" | sha256sum -c -
            mv /tmp/jmx_prometheus_javaagent.jar \
              "${target.dir}/datahub/datahub-gms/lib/jmx_prometheus_javaagent.jar"
      paths:
        - type: file
          path: ${source.dir}/files/start.sh
          uid: 0
          gid: 0
          source: image/datahub-gms/files/start.sh
        - type: file
          path: ${source.dir}/files/init.gradle
          uid: 0
          gid: 0
          source: image/datahub-gms/files/init.gradle
        - type: file
          path: ${source.dir}/patch/force-cve-deps.gradle
          uid: 0
          gid: 0
          source: image/datahub-gms/patch/force-cve-deps.gradle
