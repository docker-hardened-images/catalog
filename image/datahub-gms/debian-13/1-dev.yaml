# syntax=dhi.io/build:2-debian13

name: DataHub GMS 1.x (dev)
image: dhi.io/datahub-gms
variant: dev
tags:
  - 1-dev
  - 1.6-dev
  - 1.6.0-dev
  - 1.6.0.2-dev
  - 1-debian-dev
  - 1-debian13-dev
  - 1.6-debian-dev
  - 1.6-debian13-dev
  - 1.6.0-debian-dev
  - 1.6.0-debian13-dev
  - 1.6.0.2-debian-dev
  - 1.6.0.2-debian13-dev
platforms:
  - linux/amd64
  - linux/arm64
dates:
  release: "2025-08-22"
vars:
  JAVA_FIPS_SUFFIX: ""
  JAVA_VARIANT: jdk
  JDK_MAJOR_VERSION: "21"
  SEMVER_MAJOR_MINOR_VERSION: "1.6"
  SEMVER_MAJOR_VERSION: "1"
  SEMVER_VERSION: 1.6.0.2
  VERSION: 1.6.0.2-1
  VERSION_MAJOR_MINOR_PATCH: 1.6.0
contents:
  repositories:
    - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
  keyring:
    - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
  packages:
    - '!gawk'
    - '!libelogind0'
    - '!mawk'
    - '!original-awk'
    - apt
    - base-files
    - bash
    - ca-certificates
    - ca-certificates-bundle
    - coreutils
    - curl
    - datahub-gms=1.6.0.2-1
    - diffutils
    - dpkg
    - eclipse-temurin-21-jdk
    - eclipse-temurin-21-jdk-oci-config
    - findutils
    - grep
    - libc-bin
    - libsnappy1v5
    - libsqlite3-0
    - mawk
    - perl-base
    - sed
    - tzdata
    - util-linux
    - wget
accounts:
  root: true
  run-as: root
  users:
    - name: nonroot
      uid: 65532
      gid: 65532
    - name: _apt
      uid: 42
      gid: 65532
  groups:
    - name: nonroot
      gid: 65532
      members:
        - nonroot
os-release:
  name: Docker Hardened Images (Debian)
  id: debian
  version-id: "13"
  version-codename: trixie
  pretty-name: Docker Hardened Images/Debian GNU/Linux 13 (trixie)
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
environment:
  DEBIAN_FRONTEND: noninteractive
  JAVA_OPTS: ""
  JMX_OPTS: ""
  LD_LIBRARY_PATH: /lib:/lib64
  OTEL_EXPORTER_OTLP_HTTP_COMPRESSION: gzip
  OTEL_EXPORTER_OTLP_HTTP_HTTP2_MAX_FRAME_SIZE: "8388608"
  OTEL_EXPORTER_OTLP_MAX_PAYLOAD_SIZE: "4194304"
  OTEL_EXPORTER_OTLP_TRACES_COMPRESSION: gzip
  PATH: /usr/lib/jvm/temurin-21/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
paths:
  - type: directory
    path: /datahub
    uid: 65532
    gid: 65532
    mode: "0750"
  - type: directory
    path: /etc/datahub/plugins/auth/resources
    uid: 65532
    gid: 65532
    mode: "0750"
  - type: symlink
    path: /datahub/datahub-gms
    uid: 0
    gid: 0
    source: /usr/share/datahub-gms
  - type: directory
    path: /usr/local/bin
    uid: 0
    gid: 0
  - type: symlink
    path: /usr/local/bin/dockerize
    uid: 0
    gid: 0
    source: /usr/bin/dockerize
annotations:
  org.opencontainers.image.description: DataHub General Metadata Service (GMS) - the core metadata service backend for the DataHub data discovery and governance platform.
  org.opencontainers.image.licenses: Apache-2.0
entrypoint:
  - /datahub/datahub-gms/scripts/start.sh
ports:
  - 8080/tcp
  - 4318/tcp
