# Intentionally empty.
#
# The nginx package ships a welcome vhost at this path with `server_name
# localhost`, and nginx.conf includes conf.d/*.conf. Left in place it wins name
# resolution for any request whose Host header is `localhost` -- the common case
# for `docker run -p` and kubectl port-forward -- so the site rendered into
# vhost.conf by the entrypoint would never be reached.
#
# It is overwritten here rather than deleted in a build pipeline: the build
# exports its layer with `diff: true`, which captures added and changed files
# but not removals, and the top-level contents.packages install reinstates it.
#
# conf.d/*.conf is still honoured, so users can drop in their own server blocks.
