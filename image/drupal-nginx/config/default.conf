# Intentionally empty.
#
# The nginx package ships a welcome vhost at this path on debian-13 with
# `server_name localhost`, and nginx.conf includes conf.d/*.conf. Left in place
# it wins name resolution for any request whose Host header is `localhost` --
# the common case for `docker run -p` and kubectl port-forward -- so the site
# rendered into vhost.conf by the entrypoint would never be reached.
#
# It is overwritten here rather than deleted: the `paths:` entry for this file
# in debian-13/.drupal-nginx.inc.yaml replaces the package's welcome vhost in the
# final image. Removals do not survive a build layer export (`diff: true` captures
# added and changed files only), so a delete in a build step would not reach it.
#
# conf.d/*.conf is still honoured, so users can drop in their own server blocks.
