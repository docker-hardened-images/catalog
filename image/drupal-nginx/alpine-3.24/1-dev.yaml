# syntax=dhi.io/build:2-alpine3.24

name: Drupal Nginx 1.x (dev)
image: dhi.io/drupal-nginx
variant: dev
tags:
  - 1-alpine-dev
  - 1.30-alpine-dev
  - 1-alpine3.24-dev
  - 1.30.5-alpine-dev
  - 1.30-alpine3.24-dev
  - 1.30.5-alpine3.24-dev
platforms:
  - linux/amd64
  - linux/arm64
dates:
  release: "2026-04-14"
vars:
  APK_MAJOR_MINOR_VERSION: "1.30"
  APK_MAJOR_VERSION: "1"
  APK_VERSION: 1.30.5
  GOLANG_MAJOR_MINOR_VERSION: "1.27"
  GOLANG_VERSION: 1.27.2-r0
  GOTPL_COMMIT_SHA: 5611a46fb0482613b8b88175fd8ed92e5243c3fe
  GOTPL_VERSION: 0.6.10
  NGINX_PACKAGE: nginx-stable
  NGINX_VERSION: 1.30.5
  PKG_RELEASE: "4"
  SEMVER_MAJOR_MINOR_VERSION: "1.30"
  SEMVER_MAJOR_VERSION: "1"
  SEMVER_VERSION: 1.30.5
  VERSION: 1.30.5-r4
contents:
  repositories:
    - https://dhi.io/apk/alpine/v3.24/main
    - https://dl-cdn.alpinelinux.org/alpine/v3.24/main
    - https://dl-cdn.alpinelinux.org/alpine/v3.24/community
  keyring:
    - https://dhi.io/keyring/dhi-apk@docker-0F81AD7700D99184.rsa.pub
  packages:
    - alpine-baselayout-data
    - apk-tools
    - bash
    - busybox
    - ca-certificates
    - ca-certificates-bundle
    - nginx-stable-mod-http-brotli=1.30.5-r4
    - nginx-stable-mod-http-upload-progress=1.30.5-r4
    - nginx-stable-mod-http-vts=1.30.5-r4
    - nginx-stable=1.30.5-r4
    - tzdata
  builds:
    - name: gotpl
      work-dir: /go/src/github.com/wodby/gotpl
      caches:
        - path: /go/pkg/mod
      contents:
        packages:
          - bash
          - busybox
          - ca-certificates-bundle
          - golang-1.27=1.27.2-r0
        files:
          - url: git+https://github.com/wodby/gotpl.git#0.6.10
            checksum: 5611a46fb0482613b8b88175fd8ed92e5243c3fe
            path: /go/src/github.com/wodby/gotpl
            spdx:
              name: gotpl
              version: 0.6.10
              packages:
                - name: gotpl
                  purl: pkg:golang/github.com/wodby/gotpl@0.6.10
                  license: MIT
            uid: 0
            gid: 0
      pipeline:
        - name: update go dependencies
          uses: go/bump@v2
          with:
            deps: []
        - name: test
          runs: |
            set -eux -o pipefail

            CGO_ENABLED=0 go test -short ./... -count=1
        - name: build
          uses: go/build@v1
          with:
            output: ${target.dir}/usr/local/bin/gotpl
            packages: .
      outputs:
        - source: ${target.dir}/usr/local/bin
          target: /usr/local/bin
          uid: 0
          gid: 0
        - source: /opt/docker/sbom/gotpl
          target: /opt/docker/sbom/gotpl
          uid: 0
          gid: 0
    - name: nginx
      contents:
        repositories:
          - https://dhi.io/apk/alpine/v3.24/main
          - https://dl-cdn.alpinelinux.org/alpine/v3.24/main
          - https://dl-cdn.alpinelinux.org/alpine/v3.24/community
        keyring:
          - https://dhi.io/keyring/dhi-apk@docker-0F81AD7700D99184.rsa.pub
        packages:
          - alpine-baselayout-data
          - nginx-stable=1.30.5-r4
          - nginx-stable-mod-http-brotli=1.30.5-r4
          - nginx-stable-mod-http-upload-progress=1.30.5-r4
          - nginx-stable-mod-http-vts=1.30.5-r4
          - bash
          - busybox
      pipeline:
        - name: install
          runs: |
            set -eux -o pipefail

            ln -sf /dev/stdout /var/log/nginx/access.log
            ln -sf /dev/stderr /var/log/nginx/error.log

            touch /etc/nginx/upstream.conf

            mkdir -p /etc/nginx/conf.d /run/nginx /usr/share/nginx/html
            cp -a /var/lib/nginx/html/. /usr/share/nginx/html/

            chown -R 65532:65532 /var/lib/nginx
            chmod -R g+w /var/lib/nginx
            chown -R 65532:65532 /etc/nginx
            chmod -R g+w /etc/nginx
            chown -R 65532:65532 /run/nginx
            chown -R 65532:65532 /var/log/nginx
            chown -R 65532:65532 /usr/share/nginx/html
      outputs:
        - source: /
          target: /
          uid: 0
          gid: 0
          diff: true
accounts:
  root: true
  run-as: root
  users:
    - name: nginx
      uid: 65532
      gid: 65532
  groups:
    - name: nginx
      gid: 65532
      members:
        - nginx
    - name: www-data
      gid: 82
os-release:
  name: Docker Hardened Images (Alpine)
  id: alpine
  version-id: "3.24"
  pretty-name: Docker Hardened Images/Alpine Linux v3.24
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
work-dir: /var/www/html
environment:
  APP_ROOT: /var/www/html
  FILES_DIR: /mnt/files
  NGINX_VER: 1.30.5
  NGINX_VERSION: 1.30.5
  NGINX_VHOST_PRESET: html
  PKG_RELEASE: "4"
paths:
  - type: file
    path: /docker-entrypoint.sh
    uid: 0
    gid: 0
    mode: "0755"
    source: image/drupal-nginx/bin/docker-entrypoint.sh
  - type: file
    path: /usr/local/bin/init
    uid: 0
    gid: 0
    mode: "0755"
    source: image/drupal-nginx/bin/init
  - type: file
    path: /usr/local/bin/files_link
    uid: 0
    gid: 0
    mode: "0755"
    source: image/drupal-nginx/bin/files_link
  - type: file
    path: /etc/nginx/conf.d/default.conf
    uid: 0
    gid: 0
    mode: "0644"
    source: image/drupal-nginx/config/default.conf
  - type: directory
    path: /etc/gotpl
    uid: 0
    gid: 0
    mode: "0755"
    source: image/drupal-nginx/templates
  - type: directory
    path: /var/www/html
    uid: 65532
    gid: 65532
    mode: "0770"
  - type: directory
    path: /mnt/files
    uid: 65532
    gid: 65532
    mode: "0770"
  - type: directory
    path: /mnt/files/public
    uid: 65532
    gid: 65532
    mode: "0770"
annotations:
  org.opencontainers.image.description: Drupal Nginx - Nginx web server with Drupal virtual host presets
  org.opencontainers.image.licenses: BSD-2-Clause AND MIT
entrypoint:
  - /docker-entrypoint.sh
cmd:
  - nginx
ports:
  - 8080/tcp
