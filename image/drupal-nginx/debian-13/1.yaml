# syntax=dhi.io/build:2-debian13

name: Drupal Nginx 1.x
image: dhi.io/drupal-nginx
variant: runtime
tags:
  - "1"
  - "1.30"
  - 1.30.6
  - 1-debian
  - 1-debian13
  - 1.30-debian
  - 1.30-debian13
  - 1.30.6-debian
  - 1.30.6-debian13
platforms:
  - linux/amd64
  - linux/arm64
dates:
  release: "2026-04-14"
vars:
  DEBIAN_EPOCH_MAJOR_MINOR_VERSION: "1.30"
  DEBIAN_EPOCH_MAJOR_VERSION: "1"
  DEBIAN_EPOCH_VERSION: 1.30.6
  DRUPAL_NGINX_PACKAGE: drupal-nginx-1
  DRUPAL_NGINX_PACKAGE_VERSION: 1.30.6-1-2
  NGINX_PACKAGE: nginx-stable
  NGINX_VERSION: 1.30.6
  PKG_RELEASE: "1"
  SEMVER_MAJOR_MINOR_VERSION: "1.30"
  SEMVER_MAJOR_VERSION: "1"
  SEMVER_VERSION: 1.30.6
  VERSION: 1.30.6-1
contents:
  repositories:
    - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
  keyring:
    - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
  packages:
    - '!libelogind0'
    - '!mawk'
    - '!original-awk'
    - base-files
    - bash
    - ca-certificates-bundle
    - coreutils
    - drupal-nginx-1=1.30.6-1-2
    - grep
    - libbrotli1
    - libc6
    - libcrypt1
    - libpcre2-8-0
    - libssl3t64
    - nginx-stable-module-brotli=1.30.6-1
    - nginx-stable-module-upload-progress=1.30.6-1
    - nginx-stable-module-vts=1.30.6-1
    - nginx-stable=1.30.6-1
    - tzdata
    - zlib1g
accounts:
  run-as: nginx
  users:
    - name: nginx
      uid: 65532
      gid: 65532
  groups:
    - name: nginx
      gid: 65532
      members:
        - nginx
    - name: www-data
      gid: 82
os-release:
  name: Docker Hardened Images (Debian)
  id: debian
  version-id: "13"
  version-codename: trixie
  pretty-name: Docker Hardened Images/Debian GNU/Linux 13 (trixie)
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
work-dir: /var/www/html
environment:
  APP_ROOT: /var/www/html
  FILES_DIR: /mnt/files
  NGINX_VER: 1.30.6
  NGINX_VERSION: 1.30.6
  NGINX_VHOST_PRESET: html
  PKG_RELEASE: "1"
paths:
  - type: file
    path: /docker-entrypoint.sh
    uid: 0
    gid: 0
    mode: "0755"
    source: image/drupal-nginx/bin/docker-entrypoint.sh
