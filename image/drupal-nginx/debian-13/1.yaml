# syntax=dhi.io/build:2-debian13

name: Drupal Nginx 1.x
image: dhi.io/drupal-nginx
variant: runtime
tags:
  - "1"
  - "1.30"
  - 1.30.5
  - 1-debian
  - 1-debian13
  - 1.30-debian
  - 1.30-debian13
  - 1.30.5-debian
  - 1.30.5-debian13
platforms:
  - linux/amd64
  - linux/arm64
dates:
  release: "2026-04-14"
vars:
  DEBIAN_EPOCH_MAJOR_MINOR_VERSION: "1.30"
  DEBIAN_EPOCH_MAJOR_VERSION: "1"
  DEBIAN_EPOCH_VERSION: 1.30.5
  GOLANG_MAJOR_MINOR_VERSION: "1.27"
  GOLANG_VERSION: 1.27.1-1
  GOTPL_COMMIT_SHA: c86af17490f7566d58ef4355f8473bc081ecb655
  GOTPL_VERSION: 0.6.9
  NGINX_PACKAGE: nginx-stable
  NGINX_VERSION: 1.30.5
  PKG_RELEASE: "0"
  SEMVER_MAJOR_MINOR_VERSION: "1.30"
  SEMVER_MAJOR_VERSION: "1"
  SEMVER_VERSION: 1.30.5
  VERSION: 1.30.5-0
contents:
  repositories:
    - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
  keyring:
    - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
  packages:
    - '!libelogind0'
    - '!mawk'
    - '!original-awk'
    - base-files
    - bash
    - ca-certificates-bundle
    - coreutils
    - grep
    - libbrotli1
    - libc6
    - libcrypt1
    - libpcre2-8-0
    - libssl3t64
    - nginx-stable-module-brotli=1.30.5-0
    - nginx-stable-module-upload-progress=1.30.5-0
    - nginx-stable-module-vts=1.30.5-0
    - nginx-stable=1.30.5-0
    - tzdata
    - zlib1g
  builds:
    - name: gotpl
      work-dir: /go/src/github.com/wodby/gotpl
      caches:
        - path: /go/pkg/mod
      contents:
        packages:
          - bash
          - ca-certificates-bundle
          - coreutils
          - findutils
          - golang-1.27=1.27.1-1
          - mawk
          - sed
        files:
          - url: git+https://github.com/wodby/gotpl.git#0.6.9
            checksum: c86af17490f7566d58ef4355f8473bc081ecb655
            path: /go/src/github.com/wodby/gotpl
            spdx:
              name: gotpl
              version: 0.6.9
              packages:
                - name: gotpl
                  purl: pkg:golang/github.com/wodby/gotpl@0.6.9
                  license: MIT
            uid: 0
            gid: 0
      pipeline:
        - name: update go dependencies
          uses: go/bump@v2
          with:
            deps: []
        - name: test
          runs: |
            set -eux -o pipefail

            CGO_ENABLED=0 go test -short ./... -count=1
        - name: build
          uses: go/build@v1
          with:
            output: ${target.dir}/usr/local/bin/gotpl
            packages: .
      outputs:
        - source: ${target.dir}/usr/local/bin
          target: /usr/local/bin
          uid: 0
          gid: 0
        - source: /opt/docker/sbom/gotpl
          target: /opt/docker/sbom/gotpl
          uid: 0
          gid: 0
    - name: nginx
      contents:
        repositories:
          - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
        keyring:
          - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
        packages:
          - base-files
          - nginx-stable=1.30.5-0
          - nginx-stable-module-brotli=1.30.5-0
          - nginx-stable-module-upload-progress=1.30.5-0
          - nginx-stable-module-vts=1.30.5-0
          - bash
          - coreutils
      pipeline:
        - name: install
          runs: |
            set -eux -o pipefail

            ln -sf /dev/stdout /var/log/nginx/access.log
            ln -sf /dev/stderr /var/log/nginx/error.log

            touch /etc/nginx/upstream.conf

            mkdir -p /run/nginx

            chown -R 65532:65532 /var/cache/nginx
            chmod -R g+w /var/cache/nginx
            chown -R 65532:65532 /etc/nginx
            chmod -R g+w /etc/nginx
            chown -R 65532:65532 /run/nginx
            chown -R 65532:65532 /var/log/nginx
            chown -R 65532:65532 /usr/share/nginx/html
      outputs:
        - source: /
          target: /
          uid: 0
          gid: 0
          diff: true
accounts:
  run-as: nginx
  users:
    - name: nginx
      uid: 65532
      gid: 65532
  groups:
    - name: nginx
      gid: 65532
      members:
        - nginx
    - name: www-data
      gid: 82
os-release:
  name: Docker Hardened Images (Debian)
  id: debian
  version-id: "13"
  version-codename: trixie
  pretty-name: Docker Hardened Images/Debian GNU/Linux 13 (trixie)
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
work-dir: /var/www/html
environment:
  APP_ROOT: /var/www/html
  FILES_DIR: /mnt/files
  NGINX_VER: 1.30.5
  NGINX_VERSION: 1.30.5
  NGINX_VHOST_PRESET: html
  PKG_RELEASE: "0"
paths:
  - type: file
    path: /docker-entrypoint.sh
    uid: 0
    gid: 0
    mode: "0755"
    source: image/drupal-nginx/bin/docker-entrypoint.sh
  - type: file
    path: /usr/local/bin/init
    uid: 0
    gid: 0
    mode: "0755"
    source: image/drupal-nginx/bin/init
  - type: file
    path: /usr/local/bin/files_link
    uid: 0
    gid: 0
    mode: "0755"
    source: image/drupal-nginx/bin/files_link
  - type: file
    path: /etc/nginx/conf.d/default.conf
    uid: 0
    gid: 0
    mode: "0644"
    source: image/drupal-nginx/config/default.conf
  - type: directory
    path: /etc/gotpl
    uid: 0
    gid: 0
    mode: "0755"
    source: image/drupal-nginx/templates
  - type: directory
    path: /var/www/html
    uid: 65532
    gid: 65532
    mode: "0770"
  - type: directory
    path: /mnt/files
    uid: 65532
    gid: 65532
    mode: "0770"
  - type: directory
    path: /mnt/files/public
    uid: 65532
    gid: 65532
    mode: "0770"
annotations:
  org.opencontainers.image.description: Drupal Nginx - Nginx web server with Drupal virtual host presets
  org.opencontainers.image.licenses: BSD-2-Clause AND MIT
entrypoint:
  - /docker-entrypoint.sh
cmd:
  - nginx
ports:
  - 8080/tcp
