server {
    listen 8443 ssl;
    listen [::]:8443 ssl;
    server_name localhost;

    ssl_certificate /var/cli-serving-cert/tls.crt;
    ssl_certificate_key /var/cli-serving-cert/tls.key;

    root /opt/app-root/src;

    location /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 'ok';
    }

    location / {
        autoindex on;
    }
}
