# syntax=dhi.io/build:2-debian13

name: HTTP Echo 1.0.x
image: dhi.io/http-echo
variant: runtime
tags:
  - "1"
  - "1.0"
  - 1.0.0
  - 1-debian
  - 1-debian13
  - 1.0-debian
  - 1.0-debian13
  - 1.0.0-debian
  - 1.0.0-debian13
platforms:
  - linux/amd64
  - linux/arm64
dates:
  release: "2023-10-10"
vars:
  FLAVORED_SUFFIX: ""
  SEMVER_MAJOR_MINOR_VERSION: "1.0"
  SEMVER_MAJOR_VERSION: "1"
  SEMVER_VERSION: 1.0.0
  SUFFIX: ""
  VERSION: 1.0.0-1
contents:
  repositories:
    - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
  keyring:
    - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
  packages:
    - base-files
    - ca-certificates-bundle
    - http-echo=1.0.0-1
    - tzdata
accounts:
  run-as: nonroot
  users:
    - name: nonroot
      uid: 65532
      gid: 65532
  groups:
    - name: nonroot
      gid: 65532
      members:
        - nonroot
os-release:
  name: Docker Hardened Images (Debian)
  id: debian
  version-id: "13"
  version-codename: trixie
  pretty-name: Docker Hardened Images/Debian GNU/Linux 13 (trixie)
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
environment:
  ECHO_TEXT: hello-world
paths:
  - type: directory
    path: /usr/local/bin
    uid: 0
    gid: 0
  - type: symlink
    path: /usr/local/bin/http-echo
    uid: 0
    gid: 0
    source: /usr/bin/http-echo
  - type: symlink
    path: /http-echo
    uid: 0
    gid: 0
    source: /usr/local/bin/http-echo
annotations:
  org.opencontainers.image.description: A minimal HTTP Echo image
  org.opencontainers.image.licenses: MPL-2.0
entrypoint:
  - /usr/local/bin/http-echo
ports:
  - 5678/tcp
