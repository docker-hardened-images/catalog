# syntax=dhi.io/build:2-debian13

name: HTTP Echo 1.0.x (dev)
image: dhi.io/http-echo
variant: dev
tags:
  - 1-dev
  - 1.0-dev
  - 1.0.0-dev
  - 1-debian-dev
  - 1-debian13-dev
  - 1.0-debian-dev
  - 1.0-debian13-dev
  - 1.0.0-debian-dev
  - 1.0.0-debian13-dev
platforms:
  - linux/amd64
  - linux/arm64
dates:
  release: "2023-10-10"
vars:
  FLAVORED_SUFFIX: -dev
  SEMVER_MAJOR_MINOR_VERSION: "1.0"
  SEMVER_MAJOR_VERSION: "1"
  SEMVER_VERSION: 1.0.0
  SUFFIX: -dev
  VERSION: 1.0.0-0
contents:
  repositories:
    - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
  keyring:
    - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
  packages:
    - '!gawk'
    - '!libelogind0'
    - '!original-awk'
    - apt
    - base-files
    - bash
    - ca-certificates
    - ca-certificates-bundle
    - coreutils
    - diffutils
    - dpkg
    - findutils
    - grep
    - http-echo-dev=1.0.0-0
    - libc-bin
    - mawk
    - perl-base
    - sed
    - tzdata
    - util-linux
accounts:
  root: true
  run-as: root
  users:
    - name: nonroot
      uid: 65532
      gid: 65532
    - name: _apt
      uid: 42
      gid: 65532
  groups:
    - name: nonroot
      gid: 65532
      members:
        - nonroot
os-release:
  name: Docker Hardened Images (Debian)
  id: debian
  version-id: "13"
  version-codename: trixie
  pretty-name: Docker Hardened Images/Debian GNU/Linux 13 (trixie)
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
environment:
  DEBIAN_FRONTEND: noninteractive
  ECHO_TEXT: hello-world
paths:
  - type: directory
    path: /tmp
    uid: 0
    gid: 0
    mode: "1777"
  - type: directory
    path: /usr/local/bin
    uid: 0
    gid: 0
  - type: symlink
    path: /usr/local/bin/http-echo
    uid: 0
    gid: 0
    source: /usr/bin/http-echo
  - type: symlink
    path: /http-echo
    uid: 0
    gid: 0
    source: /usr/local/bin/http-echo
annotations:
  org.opencontainers.image.description: A minimal HTTP Echo image
  org.opencontainers.image.licenses: MPL-2.0
entrypoint:
  - /usr/local/bin/http-echo
ports:
  - 5678/tcp
