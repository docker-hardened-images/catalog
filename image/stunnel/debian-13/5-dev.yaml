# syntax=dhi.io/build:2-debian13

name: stunnel 5.x (dev)
image: dhi.io/stunnel
variant: dev
tags:
  - 5-dev
  - 5.80-dev
  - 5-debian-dev
  - 5-debian13-dev
  - 5.80-debian-dev
  - 5.80-debian13-dev
platforms:
  - linux/amd64
  - linux/arm64
dates:
  release: "2026-04-09"
vars:
  DEBIAN_VERSION: 5.80.0-0
  MAJOR_VERSION: "5"
  VERSION: "5.80"
contents:
  repositories:
    - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
  keyring:
    - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
  packages:
    - '!gawk'
    - '!libelogind0'
    - '!mawk'
    - '!original-awk'
    - apt
    - base-files
    - bash
    - ca-certificates
    - coreutils
    - diffutils
    - dpkg
    - findutils
    - grep
    - libc-bin
    - libssl3t64
    - mawk
    - perl-base
    - sed
    - stunnel=5.80.0-0
    - tini
    - util-linux
accounts:
  root: true
  run-as: root
  users:
    - name: nonroot
      uid: 65532
      gid: 65532
    - name: _apt
      uid: 42
      gid: 65532
  groups:
    - name: nonroot
      gid: 65532
      members:
        - nonroot
os-release:
  name: Docker Hardened Images (Debian)
  id: debian
  version-id: "13"
  version-codename: trixie
  pretty-name: Docker Hardened Images/Debian GNU/Linux 13 (trixie)
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
environment:
  DEBIAN_FRONTEND: noninteractive
paths:
  - type: directory
    path: /etc/stunnel
    uid: 0
    gid: 0
    mode: "0755"
annotations:
  org.opencontainers.image.description: A minimal stunnel image
  org.opencontainers.image.licenses: GPL-2.0-or-later
entrypoint:
  - /usr/bin/tini
  - -g
  - /usr/bin/stunnel
  - --
cmd:
  - /etc/stunnel/stunnel.conf
