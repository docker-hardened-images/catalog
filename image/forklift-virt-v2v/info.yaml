metadata:
  display-name: Forklift virt-v2v
  short-description: Forklift virt-v2v converts VM guest disks for migration to KubeVirt, wrapping libguestfs's virt-v2v tool
  featured: false
  home-url: https://github.com/kubev2v/forklift
  categories:
    - integration-and-delivery
  included-tools:
    - name: virt-v2v
      description: Converts a VM guest disk image to run on QEMU/KVM
    - name: virt-customize
      description: Customizes a guest disk image (installs packages, sets configuration) without booting it
    - name: guestfish
      description: Interactive shell for inspecting and editing guest disk images
