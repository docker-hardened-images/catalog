# syntax=dhi.io/build:2-debian13

name: Forklift virt-v2v 2.x (dev)
image: dhi.io/forklift-virt-v2v
variant: dev
tags:
  - 2-dev
  - 2.12-dev
  - 2.12.7-dev
  - 2-debian-dev
  - 2-debian13-dev
  - 2.12-debian-dev
  - 2.12-debian13-dev
  - 2.12.7-debian-dev
  - 2.12.7-debian13-dev
platforms:
  - linux/amd64
  - linux/arm64
dates:
  release: "2023-03-16"
vars:
  CATATONIT_VERSION: 0.2.1-2+dhi0
  FLAVORED_SUFFIX: -dev
  GUESTFS_TOOLS_VERSION: 1.52.3-1+dhi0
  KERNEL_IMAGE_PKG: '#{ target.arch == "amd64" ? "linux-image-amd64" : "linux-image-arm64" }'
  LIBGUESTFS_VERSION: 1:1.54.1-2+deb13u1+dhi0
  QEMU_SYSTEM_PKG: '#{ target.arch == "amd64" ? "qemu-system-x86" : "qemu-system-arm" }'
  SEMVER_MAJOR_MINOR_VERSION: "2.12"
  SEMVER_MAJOR_VERSION: "2"
  SEMVER_VERSION: 2.12.7
  SUFFIX: -dev
  VERSION: 2.12.7-0
  VIRT_V2V_VERSION: 2.6.0-1+dhi0
contents:
  repositories:
    - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
  keyring:
    - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
  packages:
    - '!base-files'
    - '!gawk'
    - '!libelogind0'
    - '!original-awk'
    - ${QEMU_SYSTEM_PKG}
    - apt
    - base-files
    - bash
    - ca-certificates
    - ca-certificates-bundle
    - catatonit=0.2.1-2+dhi0
    - coreutils
    - curl
    - diffutils
    - dpkg
    - findutils
    - forklift-image-converter-dev=2.12.7-0
    - forklift-virt-v2v-dev=2.12.7-0
    - forklift-wait-for-reboot-dev=2.12.7-0
    - grep
    - guestfish=1:1.54.1-2+deb13u1+dhi0
    - guestfs-tools=1.52.3-1+dhi0
    - guestmount
    - libc-bin
    - libc6
    - libconfig11
    - libcrypt1
    - libglib2.0-0t64
    - libguestfs-perl
    - libguestfs-tools=1:1.54.1-2+deb13u1+dhi0
    - libguestfs0t64
    - libintl-perl
    - libjansson4
    - liblzma5
    - libnbd-bin
    - libnbd0
    - libosinfo-1.0-0
    - libpcre2-8-0
    - libreadline8t64
    - libstring-shellquote-perl
    - libsys-virt-perl
    - libtinfo6
    - libtirpc3t64
    - libvirt0
    - libwin-hivex-perl
    - libxml2
    - mawk
    - nbdkit
    - perl
    - perl-base
    - qemu-utils
    - sed
    - tzdata
    - util-linux
    - virt-v2v-monitor-dev=2.12.7-0
    - virt-v2v=2.6.0-1+dhi0
    - virtio-win
  builds:
    - name: libguestfs-fixed-appliance
      contents:
        packages:
          - base-files
          - bash
          - coreutils
          - grep
          - gzip
          - kmod
          - util-linux
          - qemu-utils
          - guestfish=1:1.54.1-2+deb13u1+dhi0
          - libguestfs-tools=1:1.54.1-2+deb13u1+dhi0
          - guestfsd=1:1.54.1-2+deb13u1+dhi0
          - libguestfs-xfs=1:1.54.1-2+deb13u1+dhi0
          - supermin
          - ${QEMU_SYSTEM_PKG}
          - ${KERNEL_IMAGE_PKG}
          - libacl1
          - libaugeas0
          - libc6
          - libcap2
          - libconfig11
          - libcrypt1
          - libglib2.0-0t64
          - libguestfs-perl
          - libguestfs0t64
          - libhivex0
          - libintl-perl
          - libjansson4
          - liblzma5
          - libnbd-bin
          - libnbd0
          - libosinfo-1.0-0
          - libpcre2-8-0
          - libreadline8t64
          - librpm10
          - libselinux1
          - libstring-shellquote-perl
          - libsys-virt-perl
          - libsystemd0
          - libtinfo6
          - libtirpc3t64
          - libtsk19t64
          - libwin-hivex-perl
          - libxml2
          - libyara10
          - nbdkit
          - perl
          - binutils
          - bsdextrautils
          - cpio
          - diffutils
          - dosfstools
          - file
          - iproute2
          - lsof
          - net-tools
          - ntfs-3g
          - parted
          - procps
          - scrub
          - strace
          - udev
          - xfsprogs
          - zerofree
      pipeline:
        - runs: |
            set -eux -o pipefail

            export LIBGUESTFS_BACKEND_SETTINGS=force_tcg

            depmod "$(basename /usr/lib/modules/*)"

            cp /usr/sbin/xfs_repair /usr/sbin/xfs_repair.original
            cat > /usr/sbin/xfs_repair << 'EOF'
            #!/bin/bash
            if grep -q 'xfs_repair_ignore=1' /proc/cmdline 2>/dev/null; then
                echo "xfs_repair wrapper: xfs_repair_ignore=1 detected, failures will be suppressed" >&2
                /usr/sbin/xfs_repair.original "$@"
                rc=$?
                echo "xfs_repair wrapper: xfs_repair.original exited with status $rc (ignored)" >&2
                exit 0
            fi
            exec /usr/sbin/xfs_repair.original "$@"
            EOF
            chmod 755 /usr/sbin/xfs_repair

            hostfiles=$(echo /usr/lib/*/guestfs/supermin.d/hostfiles)
            test -f "$hostfiles"
            echo '/usr/sbin/xfs_repair.original' >> "$hostfiles"

            mkdir -p ${target.dir}/appliance
            cd ${target.dir}/appliance
            LIBGUESTFS_BACKEND=direct libguestfs-make-fixed-appliance .
      outputs:
        - source: ${target.dir}/appliance
          target: /usr/lib/guestfs/appliance
          uid: 0
          gid: 0
accounts:
  root: true
  run-as: root
  users:
    - name: nonroot
      uid: 65532
      gid: 65532
    - name: _apt
      uid: 42
      gid: 65532
  groups:
    - name: nonroot
      gid: 65532
      members:
        - nonroot
os-release:
  name: Docker Hardened Images (Debian)
  id: debian
  version-id: "13"
  version-codename: trixie
  pretty-name: Docker Hardened Images/Debian GNU/Linux 13 (trixie)
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
environment:
  DEBIAN_FRONTEND: noninteractive
  HOME: /home/qemu
  LIBGUESTFS_BACKEND: direct
  LIBGUESTFS_PATH: /usr/lib/guestfs/appliance
paths:
  - type: directory
    path: /usr/local/bin
    uid: 0
    gid: 0
  - type: symlink
    path: /usr/local/bin/virt-v2v-wrapper
    uid: 0
    gid: 0
    source: /usr/bin/virt-v2v-wrapper
  - type: symlink
    path: /usr/local/bin/virt-v2v-monitor
    uid: 0
    gid: 0
    source: /usr/bin/virt-v2v-monitor
  - type: symlink
    path: /usr/local/bin/image-converter
    uid: 0
    gid: 0
    source: /usr/bin/image-converter
  - type: symlink
    path: /usr/local/bin/forklift-wait-for-reboot
    uid: 0
    gid: 0
    source: /usr/bin/forklift-wait-for-reboot
  - type: directory
    path: /home/qemu
    uid: 65532
    gid: 65532
    mode: "0700"
annotations:
  org.opencontainers.image.description: Forklift - VM guest disk conversion tool
  org.opencontainers.image.licenses: Apache-2.0
entrypoint:
  - /usr/libexec/podman/catatonit
  - /usr/local/bin/virt-v2v-wrapper
