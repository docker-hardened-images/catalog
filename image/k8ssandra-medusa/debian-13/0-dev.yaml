# syntax=dhi.io/build:2-debian13

name: k8ssandra-medusa 0.30.x (dev)
image: dhi.io/k8ssandra-medusa
variant: dev
tags:
  - 0-dev
  - 0.30-dev
  - 0.30.0-dev
  - 0-debian-dev
  - 0-debian13-dev
  - 0.30-debian-dev
  - 0.30-debian13-dev
  - 0.30.0-debian-dev
  - 0.30.0-debian13-dev
platforms:
  - linux/amd64
  - linux/arm64
dates:
  release: "2026-04-17"
vars:
  GRPC_HEALTH_PROBE_COMMIT_SHA: bf5ea828fa1e069ada39fec39dc2a1bcb0de270e
  GRPC_HEALTH_PROBE_VERSION: 0.4.54
  SEMVER_MAJOR_MINOR_VERSION: "0.30"
  SEMVER_MAJOR_VERSION: "0"
  SEMVER_VERSION: 0.30.0
  VERSION: 0.30.0-0
contents:
  repositories:
    - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
  keyring:
    - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
  packages:
    - '!gawk'
    - '!libelogind0'
    - '!original-awk'
    - apt
    - base-files
    - bash
    - ca-certificates
    - ca-certificates-bundle
    - coreutils
    - curl
    - diffutils
    - dpkg
    - findutils
    - gawk
    - grep
    - jq
    - k8ssandra-medusa=0.30.0-0
    - libc-bin
    - libstdc++6
    - mawk
    - perl-base
    - python-3.12
    - sed
    - tzdata
    - util-linux
    - wget
  builds:
    - name: grpc health probe
      work-dir: /go/src/github.com/grpc-ecosystem/grpc-health-probe
      caches:
        - path: /go/pkg/mod
      contents:
        packages:
          - bash
          - ca-certificates-bundle
          - coreutils
          - golang-1.26
          - findutils
          - mawk
          - sed
        files:
          - url: git+https://github.com/grpc-ecosystem/grpc-health-probe.git#v0.4.54
            checksum: bf5ea828fa1e069ada39fec39dc2a1bcb0de270e
            path: /go/src/github.com/grpc-ecosystem/grpc-health-probe
            spdx:
              name: grpc-health-probe
              version: 0.4.54
              packages:
                - name: grpc-health-probe
                  purl: pkg:golang/github.com/grpc-ecosystem/grpc-health-probe@0.4.54
                  license: Apache-2.0
            uid: 0
            gid: 0
      pipeline:
        - name: update go dependencies
          uses: go/bump@v1
          with:
            deps: []
            download: true
        - name: test
          runs: |
            set -eux -o pipefail

            go test ./...
        - name: compile
          uses: go/build@v1
          with:
            ldflags:
              - -s
              - -w
              - -X main.versionTag=0.4.54
            output: ${target.dir}/usr/bin/grpc_health_probe
            packages: ./main.go
      outputs:
        - source: ${target.dir}/usr/bin/grpc_health_probe
          target: /usr/bin/grpc_health_probe
          uid: 0
          gid: 0
          mode: "0755"
        - source: /opt/docker/sbom/grpc-health-probe
          target: /opt/docker/sbom/grpc-health-probe
          uid: 0
          gid: 0
accounts:
  root: true
  run-as: root
  users:
    - name: cassandra
      uid: 999
      gid: 999
    - name: _apt
      uid: 42
      gid: 65532
  groups:
    - name: cassandra
      gid: 999
os-release:
  name: Docker Hardened Images (Debian)
  id: debian
  version-id: "13"
  version-codename: trixie
  pretty-name: Docker Hardened Images/Debian GNU/Linux 13 (trixie)
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
work-dir: /home/cassandra
environment:
  DEBIAN_FRONTEND: noninteractive
  DEBUG_SLEEP: "0"
  DEBUG_VERSION: "1"
  LANG: C.UTF-8
  LC_ALL: C.UTF-8
  PYTHONPATH: /home/cassandra
paths:
  - type: directory
    path: /home/cassandra
    uid: 999
    gid: 999
    mode: "0755"
  - type: symlink
    path: /home/cassandra/.venv
    uid: 0
    gid: 0
    source: /usr/lib/k8ssandra-medusa/.venv
  - type: symlink
    path: /home/cassandra/docker-entrypoint.sh
    uid: 0
    gid: 0
    source: /usr/lib/k8ssandra-medusa/docker-entrypoint.sh
  - type: symlink
    path: /home/cassandra/medusa
    uid: 0
    gid: 0
    source: /usr/lib/k8ssandra-medusa/medusa
  - type: symlink
    path: /home/cassandra/pyproject.toml
    uid: 0
    gid: 0
    source: /usr/lib/k8ssandra-medusa/pyproject.toml
  - type: directory
    path: /home/cassandra/bin
    uid: 999
    gid: 999
    mode: "0755"
  - type: symlink
    path: /home/cassandra/bin/medusa
    uid: 0
    gid: 0
    source: /usr/lib/k8ssandra-medusa/bin/medusa
annotations:
  org.opencontainers.image.description: A minimal K8ssandra Medusa image
  org.opencontainers.image.licenses: Apache-2.0
entrypoint:
  - /home/cassandra/docker-entrypoint.sh
