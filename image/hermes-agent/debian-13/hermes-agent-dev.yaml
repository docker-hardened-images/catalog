os-release:
  name: Docker Hardened Images (Debian)
  id: debian
  version-id: "13"
  version-codename: trixie
  pretty-name: Docker Hardened Images/Debian GNU/Linux 13 (trixie)
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
work-dir: /home/agent/workspace
environment:
  BASH_ENV: /etc/sandbox-persistent.sh
  DEBIAN_FRONTEND: noninteractive
  HERMES_DISABLE_LAZY_INSTALLS: "1"
  HERMES_HOME: /home/agent/.hermes
  HOME: /home/agent
  NO_PROXY: localhost,127.0.0.1,::1,172.17.0.0/16
  NPM_CONFIG_PREFIX: /usr/local/share/npm-global
  PATH: /home/agent/.local/bin:/opt/python/bin:/go/bin:/usr/local/go/bin:/usr/local/share/npm-global/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
  no_proxy: localhost,127.0.0.1,::1,172.17.0.0/16
paths:
  - type: file
    path: /etc/profile.d/01-dhi.sh
    content: |
      #!/bin/sh
      _dhi_marker="${HOME:-/home/agent}/.local/state/dhi-banner-shown"
      [ -f "$_dhi_marker" ] && { return 0 2>/dev/null || exit 0; }
      # SANDBOX_VM_ID is only known at runtime, so center it here the same way the
      # build-time CENTERED_KIT_NAME var is padded. Its placeholder sits 2 columns
      # right of the kit-name placeholder, hence pad = 18 - len/2 (vs 20) so both
      # labels center on the same column under the banner. Unquoted heredoc below
      # lets the shell expand $_dhi_vmid; the art has no $ or backticks to escape.
      _dhi_vmid="${SANDBOX_VM_ID:-}"
      if [ -n "$_dhi_vmid" ]; then
        _dhi_pad=$(( 18 - ${#_dhi_vmid} / 2 ))
        [ "$_dhi_pad" -lt 0 ] && _dhi_pad=0
        _dhi_vmid="$(printf '%*s' "$_dhi_pad" '')$_dhi_vmid"
      fi
      printf '%b\n' "$(cat <<EOF

                        \033[36m.=****=.\033[0m
                  \033[36m:+*******#******+:\033[0m
              \033[36m.*********\033[0m        \033[36m*********.\033[0m
            \033[36m:******:\033[0m                \033[36m:******:\033[0m
            \033[36m***:\033[0m                        \033[36m:***\033[0m
            \033[36m***\033[0m         \033[34m=******=\033[0m         \033[36m***\033[0m
            \033[36m***\033[0m        \033[34m**********\033[0m        \033[36m*#*\033[0m
            \033[36m**#\033[0m       \033[34m***=\033[0m    \033[34m=***\033[0m       \033[36m***\033[0m
            \033[36m***\033[0m       \033[34m*#*\033[0m      \033[34m*#*\033[0m       \033[36m**#\033[0m
            \033[36m***\033[0m       \033[34m+***\033[0m    \033[34m***+\033[0m       \033[36m***\033[0m
            \033[36m**#\033[0m        \033[34m=***  *#*=\033[0m        \033[36m***\033[0m
            \033[36m***\033[0m        \033[34m**#*  ****\033[0m        \033[36m***\033[0m
            \033[36m****\033[0m       \033[34m***    ***\033[0m        \033[36m=+\033[0m
            \033[36m***=\033[0m     \033[34m**#******#**\033[0m    \033[36m**=\033[0m
              \033[36m****\033[0m     \033[34m**********\033[0m    \033[36m:***\033[0m
              \033[36m****-\033[0m                 \033[36m:***\033[0m
                \033[36m-****\033[0m           \033[96m**************\033[0m      Docker Sandbox / DHI
                  \033[36m*****\033[0m         \033[96m+*****#*******\033[0m
                    \033[36m+****+\033[0m    \033[96m+*\033[0m     \033[96m:***\033[0m  $_dhi_vmid
                      \033[36m.**********\033[0m    \033[96m:***\033[0m
                        \033[36m.****.       \033[96m=+\033[0m             hermes-agent 0.23.1

      EOF
      )"
      echo ""
      mkdir -p "$(dirname "$_dhi_marker")" 2>/dev/null || true
      : > "$_dhi_marker" 2>/dev/null || true
    uid: 0
    gid: 0
    mode: "0755"
  - type: file
    path: /usr/local/bin/hermes
    content: |
      #!/bin/sh
      # Entrypoint. Sources the resolved credential auth state, then execs the
      # binary baked into the image.
      set -u

      AUTH_ENV_FILE="${HERMES_HOME:-$HOME/.hermes}/credential-auth.env"
      # Written by hermes-credential-auth.sh at container start; absent means the
      # injected ANTHROPIC_API_KEY sentinel is the credential to use as-is.
      # shellcheck source=/dev/null
      [ -f "$AUTH_ENV_FILE" ] && . "$AUTH_ENV_FILE"

      exec /opt/hermes-agent/app/.venv/bin/hermes "$@"
    uid: 0
    gid: 0
    mode: "0755"
  - type: file
    path: /opt/hermes-agent/bin/hermes-credential-auth.sh
    content: |
      #!/bin/sh
      # Resolve which Anthropic wire format Hermes should use, and record it in an env
      # file the entrypoint and `sbx exec` shells source. Also decides which
      # *provider* Hermes' own auto-detection should land on, and overrides it in
      # config.yaml for the one case that detection cannot see at all.
      #
      # Anthropic rejects an OAuth token presented as `x-api-key` and an API key
      # presented as `Authorization: Bearer`, so the credential's shape decides the
      # request Hermes has to emit. Hermes picks it from where the token resolves
      # (agent/anthropic_credentials.py, resolve_anthropic_token): ANTHROPIC_TOKEN /
      # CLAUDE_CODE_OAUTH_TOKEN, then ANTHROPIC_API_KEY, then
      # ~/.claude/.credentials.json. The kit's apiKey block sets ANTHROPIC_API_KEY to
      # the proxy-managed sentinel unconditionally -- declared by the kit, not by
      # whether a credential exists -- and a non-empty value there deliberately
      # shadows any discovered OAuth credential ("an explicit API key must not be
      # shadowed by discovered OAuth creds"). So on an OAuth host the sentinel has to
      # go, or Hermes never reads the credential file the engine materialized and
      # every model call 401s on `x-api-key: proxy-managed`.
      #
      # The discriminator is that materialized file, not SBX_CRED_ANTHROPIC_MODE:
      # that variable reports "none" both for an OAuth login and for no credential at
      # all, so it cannot tell the two apart. It does separate apikey from none,
      # which is the second branch below.
      #
      # Provider selection is a separate, second problem. hermes_cli/auth.py's
      # resolve_provider() picks OpenRouter over everything else -- including a
      # logged-in Anthropic OAuth session -- the moment OPENAI_API_KEY or
      # OPENROUTER_API_KEY looks like a usable secret. This kit's openai and
      # openrouter credentials are also proxy-managed and also injected
      # unconditionally, so both sentinels are present whether or not the host
      # actually bound either service, and upstream's placeholder filter does not
      # recognize "proxy-managed" as one to reject. Left alone, an Anthropic-only
      # host is silently routed to OpenRouter with no real key and 401s "Missing
      # Authentication header" -- confirmed against a real sandbox, where the
      # request reached openrouter.ai unauthenticated rather than api.anthropic.com.
      #
      # Two fixes below close it. First, unset whichever of those two sentinels the
      # host did not actually bind (SBX_CRED_OPENAI_MODE / SBX_CRED_OPENROUTER_MODE
      # are the proxy's own signal of that, independent of the sentinel string
      # itself), so upstream's detection can no longer mistake either for a real
      # key. That alone is enough when Anthropic is bound as a plain API key and
      # OpenAI is not -- once the other two sentinels are gone, upstream's
      # provider-specific-env-key tier already recognizes ANTHROPIC_API_KEY
      # correctly. It is NOT enough for an Anthropic OAuth login: upstream's
      # auto-detection has no tier that reads ~/.claude/.credentials.json at all, so
      # a login there is invisible to resolve_provider() no matter how clean the
      # other sentinels are, and it falls through to "no provider configured"
      # instead of Anthropic. Nor is it enough when OpenAI is genuinely bound:
      # upstream treats OPENAI_API_KEY as an OpenRouter credential in auto mode and
      # ranks it first. Those cases need the config.yaml override at the bottom of
      # this script.
      set -eu

      # Startup hooks run with a minimal environment and no $HOME (the same reason
      # the gateway hook in spec.yaml uses absolute paths), while the entrypoint and
      # `sbx exec` shells do have it. This kit's sandbox user is always agent.
      HOME="${HOME:-/home/agent}"

      STATE_DIR="${HERMES_HOME:-$HOME/.hermes}"
      AUTH_ENV_FILE="$STATE_DIR/credential-auth.env"
      HERMES_BIN=/opt/hermes-agent/app/.venv/bin/hermes
      # Must match credentials[].oauth.sentinels.accessToken in spec.yaml.
      OAUTH_SENTINEL=sk-ant-oat01-proxy-managed

      mkdir -p "$STATE_DIR"
      rm -f "$AUTH_ENV_FILE"

      # Three credential states, and conflating them is what makes the sandbox
      # confusing to operate:
      #   oauth         -> drop the sentinel so Hermes falls through to
      #                    ~/.claude/.credentials.json, which it reads natively and
      #                    can refresh, and emits Bearer plus the OAuth betas.
      #   apikey        -> leave the injected ANTHROPIC_API_KEY sentinel alone.
      #   no credential -> drop the sentinel too. Otherwise Hermes treats the
      #                    placeholder as a real key and reports an invalid key for a
      #                    credential that never existed, instead of no key at all.
      if grep -qF "$OAUTH_SENTINEL" "$HOME/.claude/.credentials.json" 2>/dev/null; then
          anthropic_cred=oauth
          printf 'unset ANTHROPIC_API_KEY\n' >> "$AUTH_ENV_FILE"
      elif [ "${SBX_CRED_ANTHROPIC_MODE:-none}" = none ]; then
          anthropic_cred=none
          printf 'unset ANTHROPIC_API_KEY\n' >> "$AUTH_ENV_FILE"
      else
          anthropic_cred=apikey
      fi

      # Same placeholder problem as ANTHROPIC_API_KEY above, for the other two
      # credentials this kit declares -- except neither has an OAuth shape to
      # preserve, so "not genuinely bound" always means "drop the sentinel".
      if [ "${SBX_CRED_OPENAI_MODE:-none}" = none ]; then
          openai_bound=0
          printf 'unset OPENAI_API_KEY\n' >> "$AUTH_ENV_FILE"
      else
          openai_bound=1
      fi
      if [ "${SBX_CRED_OPENROUTER_MODE:-none}" = none ]; then
          openrouter_bound=0
          printf 'unset OPENROUTER_API_KEY\n' >> "$AUTH_ENV_FILE"
      else
          openrouter_bound=1
      fi

      # The generic proxy-managed sentinel fails Hermes' validate_copilot_token()
      # prefix check. When Copilot is bound, replace it with a github_pat_ shaped
      # placeholder so Hermes emits a request the proxy can authenticate. No real
      # token enters the container. Unbound, the generic sentinel and the base
      # template's GH_TOKEN both fail the prefix check, so Hermes finds no token.
      if [ "${SBX_CRED_COPILOT_MODE:-none}" = none ]; then
          copilot_bound=0
      else
          copilot_bound=1
          printf 'export COPILOT_GITHUB_TOKEN=github_pat_proxy_managed\n' >> "$AUTH_ENV_FILE"
      fi

      # `sbx exec` runs a non-login shell, so a scripted call picks this up only when
      # it asks for one (`sbx exec -- sh -lc 'hermes ...'`). The hook stays harmless
      # when the file is absent, which is the case where anthropic/openai/openrouter
      # are all genuinely bound and copilot is not.
      if [ -s "$AUTH_ENV_FILE" ]; then
          if ! grep -qF "$AUTH_ENV_FILE" "$HOME/.profile" 2>/dev/null; then
              printf '[ -f %s ] && . %s\n' "$AUTH_ENV_FILE" "$AUTH_ENV_FILE" >> "$HOME/.profile"
          fi
      else
          rm -f "$AUTH_ENV_FILE"
      fi

      # Provider pin, for the cases the sentinel fix above cannot reach.
      # cli-config.yaml.example -- the template install.sh copies verbatim into
      # config.yaml -- ships `provider: "auto"` and `default:
      # "anthropic/claude-opus-4.6"`. "auto" defers to resolve_provider(), and by
      # this point in the script that can only still land on OpenRouter if the host
      # genuinely bound it or OpenAI (upstream treats OPENAI_API_KEY as an OpenRouter
      # credential in auto mode), so doing nothing is correct only when nothing
      # below applies. First match wins, which is the order the v2 kit uses, plus
      # Copilot:
      #   OpenRouter bound            -> leave the image default; auto reaches it
      #   Anthropic (apikey or oauth) -> anthropic. resolve_provider() has no tier
      #                                  that reads ~/.claude/.credentials.json, and
      #                                  would pick OpenRouter over a bound key when
      #                                  OpenAI is bound too
      #   OpenAI bound                -> openai-api, the direct OpenAI provider
      #   Copilot bound               -> copilot, since upstream never auto-selects
      #                                  it (_NO_AUTO_DETECT_PROVIDERS in
      #                                  hermes_cli/auth.py)
      #   nothing bound               -> leave the image default
      #
      # model.base_url moves with the pin. The template also ships `base_url:
      # "https://openrouter.ai/api/v1"`, and for the provider model.provider names,
      # Hermes' credential-pool and env-key paths (_pool_entry_mode_and_url and
      # _api_key_provider_runtime in hermes_cli/runtime_provider.py) send requests
      # to model.base_url instead of the provider's own endpoint. So:
      #   openai-api -> api.openai.com; left on the template URL, the OpenAI key's
      #                 requests reach OpenRouter, which 401s them
      #   copilot    -> unset, so both Copilot paths use Copilot's own endpoint;
      #                 the env-key path would otherwise send it to OpenRouter
      #   anthropic  -> api.anthropic.com. Hermes would drop the template URL here
      #                 anyway (_anthropic_base_url_override_ok), but an OpenRouter
      #                 URL beside provider: anthropic reads as a bug
      #   default    -> the template's URL
      #
      # Only ever touch the provider/model/base_url triple this script could itself
      # have produced -- the template's original values, or the values it sets
      # below. Anything else is a choice the user made with `hermes model` or
      # `hermes config set` and must survive a credential change or a container
      # restart untouched, so one user-chosen field leaves all three alone.
      if [ -x "$HERMES_BIN" ]; then
          PRISTINE_PROVIDER=auto
          PRISTINE_MODEL='anthropic/claude-opus-4.6'
          PRISTINE_BASE_URL='https://openrouter.ai/api/v1'
          OUR_PROVIDER=anthropic
          OUR_MODEL=claude-opus-4-6
          OUR_BASE_URL='https://api.anthropic.com'
          # gpt-5-mini costs no premium requests and is offered on every Copilot
          # plan, including Free, so the pin works before the user picks a model.
          OUR_COPILOT_PROVIDER=copilot
          OUR_COPILOT_MODEL=gpt-5-mini
          OUR_OPENAI_PROVIDER=openai-api
          OUR_OPENAI_MODEL=gpt-6-sol
          OUR_OPENAI_BASE_URL='https://api.openai.com/v1'

          current_provider=$("$HERMES_BIN" config get model.provider 2>/dev/null) || current_provider=""
          current_model=$("$HERMES_BIN" config get model.default 2>/dev/null) || current_model=""
          current_base_url=$("$HERMES_BIN" config get model.base_url 2>/dev/null) || current_base_url=""

          provider_is_ours=0
          case "$current_provider" in
              "$PRISTINE_PROVIDER" | "$OUR_PROVIDER" | "$OUR_COPILOT_PROVIDER" | "$OUR_OPENAI_PROVIDER" | "") provider_is_ours=1 ;;
          esac
          model_is_ours=0
          case "$current_model" in
              "$PRISTINE_MODEL" | "$OUR_MODEL" | "$OUR_COPILOT_MODEL" | "$OUR_OPENAI_MODEL" | "") model_is_ours=1 ;;
          esac
          base_url_is_ours=0
          case "$current_base_url" in
              "$PRISTINE_BASE_URL" | "$OUR_BASE_URL" | "$OUR_OPENAI_BASE_URL" | "") base_url_is_ours=1 ;;
          esac

          if [ "$provider_is_ours" = 1 ] && [ "$model_is_ours" = 1 ] && [ "$base_url_is_ours" = 1 ]; then
              want_base_url=$PRISTINE_BASE_URL
              if [ "$openrouter_bound" = 1 ]; then
                  want_provider=$PRISTINE_PROVIDER
                  want_model=$PRISTINE_MODEL
              elif [ "$anthropic_cred" != none ]; then
                  want_provider=$OUR_PROVIDER
                  want_model=$OUR_MODEL
                  want_base_url=$OUR_BASE_URL
              elif [ "$openai_bound" = 1 ]; then
                  want_provider=$OUR_OPENAI_PROVIDER
                  want_model=$OUR_OPENAI_MODEL
                  want_base_url=$OUR_OPENAI_BASE_URL
              elif [ "$copilot_bound" = 1 ]; then
                  want_provider=$OUR_COPILOT_PROVIDER
                  want_model=$OUR_COPILOT_MODEL
                  want_base_url=""
              else
                  want_provider=$PRISTINE_PROVIDER
                  want_model=$PRISTINE_MODEL
              fi
              [ "$current_provider" = "$want_provider" ] || "$HERMES_BIN" config set model.provider "$want_provider" >/dev/null 2>&1 || true
              [ "$current_model" = "$want_model" ] || "$HERMES_BIN" config set model.default "$want_model" >/dev/null 2>&1 || true
              if [ "$current_base_url" != "$want_base_url" ]; then
                  if [ -n "$want_base_url" ]; then
                      "$HERMES_BIN" config set model.base_url "$want_base_url" >/dev/null 2>&1 || true
                  else
                      "$HERMES_BIN" config unset model.base_url >/dev/null 2>&1 || true
                  fi
              fi
          fi
      fi
    uid: 0
    gid: 0
    mode: "0755"
  - type: delete
    path: /etc/profile.d/01-dhi.sh
    uid: 0
    gid: 0
  - type: file
    path: /etc/profile.d/01-dhi.sh
    content: |
      #!/bin/sh
      _dhi_marker="${HOME:-/home/agent}/.local/state/dhi-banner-shown"
      [ -f "$_dhi_marker" ] && { return 0 2>/dev/null || exit 0; }
      # Replaces every $2 in $1 with $3, into _dhi_out.
      _dhi_sub() {
        _dhi_out=""
        _dhi_s=$1
        while :; do
          case "$_dhi_s" in
            *"$2"*)
              _dhi_out="$_dhi_out${_dhi_s%%"$2"*}$3"
              _dhi_s=${_dhi_s#*"$2"}
              ;;
            *) break ;;
          esac
        done
        _dhi_out="$_dhi_out$_dhi_s"
      }
      # Value $1 cut from the left to $2 characters, into _dhi_out, and its
      # width, which the ellipsis's bytes would overcount, into _dhi_len. The
      # end of a path says more than its start, so whole leading components
      # go first; the last is cut only when it alone does not fit.
      _dhi_short() {
        _dhi_out=$1
        _dhi_len=${#_dhi_out}
        [ "$_dhi_len" -le "$2" ] && return 0
        while [ $((${#_dhi_out} + _dhi_ellw)) -gt "$2" ]; do
          _dhi_t=${_dhi_out#/}
          case "$_dhi_t" in
            */*) _dhi_out="/${_dhi_t#*/}" ;;
            *) break ;;
          esac
        done
        while [ $((${#_dhi_out} + _dhi_ellw)) -gt "$2" ]; do
          _dhi_out=${_dhi_out#?}
        done
        _dhi_len=$((${#_dhi_out} + _dhi_ellw))
        _dhi_out="$_dhi_ell$_dhi_out"
      }
      # A panel row of label $1 and value $2, into _dhi_out; false without a
      # value, so a fact the sandbox does not provide leaves no row.
      _dhi_fact() {
        [ -n "$2" ] || return 1
        _dhi_short "$2" "$_dhi_vmax"
        _dhi_v=$_dhi_out
        _dhi_out=$(printf '%s%-11s%s%s' "$_dhi_dim" "$1" "$_dhi_off" "$_dhi_v")
        [ $((11 + _dhi_len)) -gt "$_dhi_pw" ] && _dhi_pw=$((11 + _dhi_len))
        return 0
      }
      # The host of URL $1, into _dhi_out.
      _dhi_host() {
        _dhi_out=${1#*://}
        _dhi_out=${_dhi_out%%/*}
        _dhi_out=${_dhi_out##*@}
        case "$_dhi_out" in
          *\]) ;;
          *:*) _dhi_out=${_dhi_out%:*} ;;
        esac
      }
      # A function, so its set -- leaves the sourcing shell's arguments alone.
      _dhi_banner() {
        # No escapes for NO_COLOR or a dumb terminal, 24-bit color where the
        # terminal says it takes it, ASCII glyphs where it may lack UTF-8.
        _dhi_e=$(printf '\033')
        _dhi_mode=16
        [ -n "${NO_COLOR:-}" ] && _dhi_mode=0
        case "${TERM:-dumb}" in dumb) _dhi_mode=0 ;; esac
        if [ "$_dhi_mode" = 16 ]; then
          case "${COLORTERM:-}" in truecolor|24bit) _dhi_mode=24 ;; esac
        fi
        _dhi_bold="" _dhi_dim="" _dhi_off="" _dhi_ring="" _dhi_in="" _dhi_acc=""
        case "$_dhi_mode" in
          24)
            _dhi_bold="$_dhi_e[1m" _dhi_dim="$_dhi_e[2m" _dhi_off="$_dhi_e[0m"
            _dhi_in="$_dhi_e[38;2;29;99;237m" _dhi_acc="$_dhi_e[38;2;0;229;255m"
            ;;
          16)
            _dhi_bold="$_dhi_e[1m" _dhi_dim="$_dhi_e[2m" _dhi_off="$_dhi_e[0m"
            _dhi_ring="$_dhi_e[36m" _dhi_in="$_dhi_e[34m" _dhi_acc="$_dhi_e[96m"
            ;;
        esac
        case "${TERM:-dumb}" in
          dumb|linux)
            _dhi_sep='-' _dhi_ell='...' _dhi_ellw=3 _dhi_hr='-'
            ;;
          *)
            _dhi_sep='·' _dhi_ell='…' _dhi_ellw=1 _dhi_hr='─'
            ;;
        esac

        # The kits staged in the sandbox: the workload, then every mixin sbx
        # composed onto it at create, which the build cannot know. A kit's
        # name is its directory; its kind and version are top-level keys of
        # its kit.yaml, which some kits quote.
        _dhi_workload=""
        _dhi_mixins=""
        _dhi_width=0
        _dhi_vw=0
        for _dhi_kit in /usr/share/sandbox/kit/*/kit.yaml; do
          [ -r "$_dhi_kit" ] || continue
          _dhi_name=${_dhi_kit%/kit.yaml}
          _dhi_name=${_dhi_name##*/}
          _dhi_kind=""
          _dhi_ver=""
          while IFS= read -r _dhi_line || [ -n "$_dhi_line" ]; do
            case "$_dhi_line" in
              kind:*) _dhi_kind=$(printf '%s' "${_dhi_line#kind:}" | tr -d " \"'") ;;
              version:*) _dhi_ver=$(printf '%s' "${_dhi_line#version:}" | tr -d " \"'") ;;
            esac
          done < "$_dhi_kit"
          [ "${#_dhi_name}" -gt "$_dhi_width" ] && _dhi_width=${#_dhi_name}
          [ "${#_dhi_ver}" -gt "$_dhi_vw" ] && _dhi_vw=${#_dhi_ver}
          if [ "$_dhi_kind" = workload ]; then
            _dhi_workload="$_dhi_workload$_dhi_name $_dhi_ver;"
          else
            _dhi_mixins="$_dhi_mixins$_dhi_name $_dhi_ver;"
          fi
        done

        _dhi_ws=${WORKSPACE_DIR:-}
        if [ -n "${HOME:-}" ]; then
          case "$_dhi_ws" in "$HOME"|"$HOME"/*) _dhi_ws="~${_dhi_ws#"$HOME"}" ;; esac
        fi
        _dhi_os=""
        if [ -r /etc/os-release ]; then
          _dhi_id="" _dhi_vid="" _dhi_code=""
          while IFS= read -r _dhi_line || [ -n "$_dhi_line" ]; do
            case "$_dhi_line" in
              ID=*) _dhi_id=$(printf '%s' "${_dhi_line#ID=}" | tr -d "\"'") ;;
              VERSION_ID=*) _dhi_vid=$(printf '%s' "${_dhi_line#VERSION_ID=}" | tr -d "\"'") ;;
              VERSION_CODENAME=*) _dhi_code=$(printf '%s' "${_dhi_line#VERSION_CODENAME=}" | tr -d "\"'") ;;
            esac
          done < /etc/os-release
          if [ -n "$_dhi_id" ]; then
            _dhi_cap=$(printf '%.1s' "$_dhi_id" | tr '[:lower:]' '[:upper:]')
            _dhi_os="$_dhi_cap${_dhi_id#?}"
            [ -n "$_dhi_vid" ] && _dhi_os="$_dhi_os $_dhi_vid"
            [ -n "$_dhi_code" ] && _dhi_os="$_dhi_os ($_dhi_code)"
          fi
        fi
        _dhi_egress=""
        _dhi_proxy=${https_proxy:-}
        [ -n "$_dhi_proxy" ] || _dhi_proxy=${HTTPS_PROXY:-}
        if [ -n "$_dhi_proxy" ]; then
          _dhi_host "$_dhi_proxy"
          case "$_dhi_out" in
            gateway.docker.internal) _dhi_egress="gateway proxy" ;;
            *) _dhi_egress=$_dhi_out ;;
          esac
        fi
        _dhi_mcp=""
        if [ -n "${MCP_GATEWAY_URL:-}" ]; then
          _dhi_host "$MCP_GATEWAY_URL"
          case "$_dhi_out" in
            mcp-gateway.docker.internal) _dhi_mcp=gateway ;;
            *) _dhi_mcp=$_dhi_out ;;
          esac
        fi

        # The panel starts at column 45, beside the art, its last row level
        # with the art's. A fact's value is cut to the room left there, or, on a terminal too
        # narrow for the art beside the shortest panel, to the room left by
        # the panel alone. A terminal of unknown width counts as 80 columns.
        _dhi_cols=$( { stty size </dev/tty; } 2>/dev/null )
        _dhi_cols=${_dhi_cols#* }
        case "$_dhi_cols" in ''|0|*[!0-9]*) _dhi_cols=${COLUMNS:-0} ;; esac
        case "$_dhi_cols" in ''|*[!0-9]*) _dhi_cols=0 ;; esac
        _dhi_vmax=$_dhi_cols
        [ "$_dhi_vmax" -gt 0 ] || _dhi_vmax=80
        if [ "$_dhi_vmax" -ge $((44 + 34)) ]; then
          _dhi_vmax=$((_dhi_vmax - 44 - 11))
        else
          _dhi_vmax=$((_dhi_vmax - 2 - 11))
        fi
        [ "$_dhi_vmax" -ge 12 ] || _dhi_vmax=12
        # A cap keeps the panel compact on a wide terminal.
        [ "$_dhi_vmax" -le 30 ] || _dhi_vmax=30

        # The panel, a row per positional argument; _dhi_pw tracks its widest
        # row, which escapes would overcount if measured from the rows. The
        # title and the rule under it, as wide as that row, go on last.
        set --
        _dhi_pw=34
        _dhi_fact sandbox "${SANDBOX_VM_ID:-}" && set -- "$@" "$_dhi_out"
        _dhi_fact workspace "$_dhi_ws" && set -- "$@" "$_dhi_out"
        _dhi_fact base "$_dhi_os" && set -- "$@" "$_dhi_out"
        _dhi_fact egress "$_dhi_egress" && set -- "$@" "$_dhi_out"
        _dhi_fact mcp "$_dhi_mcp" && set -- "$@" "$_dhi_out"
        set -- "$@" ""
        _dhi_rest="$_dhi_workload$_dhi_mixins"
        if [ -n "$_dhi_rest" ]; then
          set -- "$@" "${_dhi_dim}kits$_dhi_off"
          while [ -n "$_dhi_rest" ]; do
            _dhi_item=${_dhi_rest%%;*}
            _dhi_rest=${_dhi_rest#*;}
            _dhi_out=$(printf '%s%-*s%s  %s%s%s' "$_dhi_acc" "$_dhi_width" "${_dhi_item% *}" "$_dhi_off" "$_dhi_dim" "${_dhi_item##* }" "$_dhi_off")
            set -- "$@" "$_dhi_out"
          done
          [ $((_dhi_width + _dhi_vw + 2)) -gt "$_dhi_pw" ] && _dhi_pw=$((_dhi_width + _dhi_vw + 2))
        else
          _dhi_item="hermes-agent 0.23.1"
          set -- "$@" "$_dhi_acc$_dhi_item$_dhi_off"
          [ "${#_dhi_item}" -gt "$_dhi_pw" ] && _dhi_pw=${#_dhi_item}
        fi
        _dhi_rule=""
        _dhi_n=0
        while [ "$_dhi_n" -lt "$_dhi_pw" ]; do
          _dhi_rule="$_dhi_rule$_dhi_hr"
          _dhi_n=$((_dhi_n + 1))
        done
        set -- "${_dhi_bold}Docker Sandbox$_dhi_off$_dhi_dim  $_dhi_sep  hardened by DHI$_dhi_off" "$_dhi_dim$_dhi_rule$_dhi_off" "$@"

        # A terminal too narrow for both gets the panel alone; one of unknown
        # width gets both.
        printf '\n'
        if [ "$_dhi_cols" -gt 0 ] && [ "$_dhi_cols" -lt $((44 + _dhi_pw)) ]; then
          for _dhi_item in "$@"; do
            printf '  %s\n' "$_dhi_item"
          done
          printf '\n'
          return 0
        fi

        # The art's {o}uter ring, {i}nner mark and {a}ccent, each up to its
        # {r}eset. In 24-bit color the ring shades from aqua at the top to
        # Docker blue at the bottom, over its 21 rows. A panel taller than the
        # art starts at its top and runs on below it.
        _dhi_start=$((22 - $#))
        [ "$_dhi_start" -ge 1 ] || _dhi_start=1
        _dhi_row=0
        while IFS= read -r _dhi_art; do
          if [ "$_dhi_mode" = 24 ]; then
            _dhi_ring="$_dhi_e[38;2;$((94 - 58 * _dhi_row / 20));$((234 - 84 * _dhi_row / 20));$((255 - 18 * _dhi_row / 20))m"
          fi
          _dhi_row=$((_dhi_row + 1))
          _dhi_sub "$_dhi_art" '{o}' "$_dhi_ring"
          _dhi_sub "$_dhi_out" '{i}' "$_dhi_in"
          _dhi_sub "$_dhi_out" '{a}' "$_dhi_acc"
          _dhi_sub "$_dhi_out" '{r}' "$_dhi_off"
          _dhi_paint=$_dhi_out
          _dhi_sub "$_dhi_art" '{o}' ""
          _dhi_sub "$_dhi_out" '{i}' ""
          _dhi_sub "$_dhi_out" '{a}' ""
          _dhi_sub "$_dhi_out" '{r}' ""
          if [ "$_dhi_row" -ge "$_dhi_start" ] && [ $# -gt 0 ]; then
            printf '%s%*s%s\n' "$_dhi_paint" $((44 - ${#_dhi_out})) "" "$1"
            shift
          else
            printf '%s\n' "$_dhi_paint"
          fi
        done <<'EOF'
                      {o}.=****=.{r}
                {o}:+*******#******+:{r}
            {o}.*********{r}        {o}*********.{r}
          {o}:******:{r}                {o}:******:{r}
          {o}***:{r}                        {o}:***{r}
          {o}***{r}         {i}=******={r}         {o}***{r}
          {o}***{r}        {i}**********{r}        {o}*#*{r}
          {o}**#{r}       {i}***={r}    {i}=***{r}       {o}***{r}
          {o}***{r}       {i}*#*{r}      {i}*#*{r}       {o}**#{r}
          {o}***{r}       {i}+***{r}    {i}***+{r}       {o}***{r}
          {o}**#{r}        {i}=***  *#*={r}        {o}***{r}
          {o}***{r}        {i}**#*  ****{r}        {o}***{r}
          {o}****{r}       {i}***    ***{r}        {o}=+{r}
          {o}***={r}     {i}**#******#**{r}    {o}**={r}
            {o}****{r}     {i}**********{r}    {o}:***{r}
            {o}****-{r}                 {o}:***{r}
              {o}-****{r}           {a}**************{r}
                {o}*****{r}         {a}+*****#*******{r}
                  {o}+****+{r}    {a}+*{r}     {a}:***{r}
                    {o}.**********{r}    {a}:***{r}
