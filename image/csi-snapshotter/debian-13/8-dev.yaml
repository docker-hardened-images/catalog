# syntax=dhi.io/build:2-debian13

name: csi-snapshotter 8.7.x (dev)
image: dhi.io/csi-snapshotter
variant: dev
tags:
  - 8-dev
  - 8.7-dev
  - 8.7.0-dev
  - 8-debian-dev
  - 8-debian13-dev
  - 8.7-debian-dev
  - 8.7-debian13-dev
  - 8.7.0-debian-dev
  - 8.7.0-debian13-dev
platforms:
  - linux/amd64
  - linux/arm64
vars:
  COMMIT_SHA: 9cc6050ab00a0c56d84ba0279e518a00367363e7
  SEMVER_MAJOR_MINOR_VERSION: "8.7"
  SEMVER_MAJOR_VERSION: "8"
  SEMVER_VERSION: 8.7.0
  VERSION: 8.7.0
contents:
  repositories:
    - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
  keyring:
    - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
  packages:
    - '!gawk'
    - '!libelogind0'
    - '!original-awk'
    - apt
    - base-files
    - bash
    - ca-certificates
    - ca-certificates-bundle
    - coreutils
    - diffutils
    - dpkg
    - findutils
    - grep
    - libc-bin
    - mawk
    - perl-base
    - sed
    - tzdata
    - util-linux
  builds:
    - name: csi-snapshotter
      work-dir: /go/src/github.com/kubernetes-csi/external-snapshotter
      caches:
        - path: /go/pkg/mod
      contents:
        packages:
          - bash
          - ca-certificates-bundle
          - coreutils
          - golang-1.26
          - findutils
          - mawk
          - sed
        files:
          - url: git+https://github.com/kubernetes-csi/external-snapshotter.git#v8.7.0
            checksum: 9cc6050ab00a0c56d84ba0279e518a00367363e7
            path: /go/src/github.com/kubernetes-csi/external-snapshotter
            spdx:
              name: csi-snapshotter
              version: 8.7.0
              packages:
                - name: csi-snapshotter
                  purl: pkg:golang/github.com/kubernetes-csi/external-snapshotter@8.7.0
                  license: Apache-2.0
            uid: 0
            gid: 0
      pipeline:
        - name: remove vendor directory
          runs: |
            set -eux -o pipefail

            rm -rf vendor
        - name: update go dependencies
          uses: go/bump@v1
          with:
            deps:
              - golang.org/x/crypto@v0.58.0
              - golang.org/x/net@v0.62.0
              - github.com/google/cel-go@v0.30.0
              - google.golang.org/grpc@v1.85.0-dev.0.20260825072537-93e31b48545e
            download: true
        - name: build
          uses: go/build@v1
          with:
            ldflags:
              - -X main.version=8.7.0
            output: ${target.dir}/usr/local/bin/csi-snapshotter
            packages: ./cmd/csi-snapshotter
      outputs:
        - source: ${target.dir}/usr/local/bin/csi-snapshotter
          target: /usr/local/bin/csi-snapshotter
          uid: 0
          gid: 0
          mode: "0755"
        - source: /opt/docker/sbom/csi-snapshotter
          target: /opt/docker/sbom/csi-snapshotter
          uid: 0
          gid: 0
accounts:
  root: true
  run-as: root
  users:
    - name: nonroot
      uid: 65532
      gid: 65532
    - name: _apt
      uid: 42
      gid: 65532
  groups:
    - name: nonroot
      gid: 65532
      members:
        - nonroot
os-release:
  name: Docker Hardened Images (Debian)
  id: debian
  version-id: "13"
  version-codename: trixie
  pretty-name: Docker Hardened Images/Debian GNU/Linux 13 (trixie)
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
environment:
  DEBIAN_FRONTEND: noninteractive
annotations:
  org.opencontainers.image.description: A minimal csi-snapshotter image
  org.opencontainers.image.licenses: Apache-2.0
entrypoint:
  - /usr/local/bin/csi-snapshotter
