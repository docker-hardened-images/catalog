# syntax=dhi.io/build:2-debian13

name: csi-snapshotter 8.7.x
image: dhi.io/csi-snapshotter
variant: runtime
tags:
  - "8"
  - "8.7"
  - 8.7.0
  - 8-debian
  - 8-debian13
  - 8.7-debian
  - 8.7-debian13
  - 8.7.0-debian
  - 8.7.0-debian13
platforms:
  - linux/amd64
  - linux/arm64
dates:
  release: "2026-10-13"
vars:
  FLAVORED_SUFFIX: ""
  SEMVER_MAJOR_MINOR_VERSION: "8.7"
  SEMVER_MAJOR_VERSION: "8"
  SEMVER_VERSION: 8.7.0
  SUFFIX: ""
  VERSION: 8.7.0-3
contents:
  repositories:
    - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
  keyring:
    - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
  packages:
    - base-files
    - ca-certificates-bundle
    - external-snapshotter-8.7=8.7.0-3
    - tzdata
accounts:
  run-as: nonroot
  users:
    - name: nonroot
      uid: 65532
      gid: 65532
  groups:
    - name: nonroot
      gid: 65532
      members:
        - nonroot
os-release:
  name: Docker Hardened Images (Debian)
  id: debian
  version-id: "13"
  version-codename: trixie
  pretty-name: Docker Hardened Images/Debian GNU/Linux 13 (trixie)
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
paths:
  - type: directory
    path: /usr/local/bin
    uid: 0
    gid: 0
  - type: symlink
    path: /usr/local/bin/csi-snapshotter
    uid: 0
    gid: 0
    source: /usr/bin/csi-snapshotter
annotations:
  org.opencontainers.image.description: A minimal csi-snapshotter image
  org.opencontainers.image.licenses: Apache-2.0
entrypoint:
  - /usr/local/bin/csi-snapshotter
