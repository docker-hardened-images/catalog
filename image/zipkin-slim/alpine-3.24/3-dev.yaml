# syntax=dhi.io/build:2-alpine3.24

name: Zipkin Slim 3.x (dev)
image: dhi.io/zipkin-slim
variant: dev
tags:
  - 3-alpine-dev
  - 3.6-alpine-dev
  - 3-alpine3.24-dev
  - 3.6.1-alpine-dev
  - 3.6-alpine3.24-dev
  - 3.6.1-alpine3.24-dev
platforms:
  - linux/amd64
  - linux/arm64
dates:
  release: "2024-01-11"
vars:
  JAVA_FIPS_SUFFIX: ""
  JAVA_VERSION: 25.0.5.8.1.2-r0
  JDK_MAJOR_VERSION: "25"
  SEMVER_MAJOR_MINOR_VERSION: "3.6"
  SEMVER_MAJOR_VERSION: "3"
  SEMVER_VERSION: 3.6.1
  VERSION: 3.6.1-r13
contents:
  repositories:
    - https://dhi.io/apk/alpine/v3.24/main
    - https://dl-cdn.alpinelinux.org/alpine/v3.24/main
    - https://dl-cdn.alpinelinux.org/alpine/v3.24/community
  keyring:
    - https://dhi.io/keyring/dhi-apk@docker-0F81AD7700D99184.rsa.pub
  packages:
    - alpine-baselayout-data
    - apk-tools
    - bash
    - busybox
    - busybox-binsh
    - ca-certificates
    - ca-certificates-bundle
    - coreutils
    - eclipse-temurin-25-jre-oci-config=25.0.5.8.1.2-r0
    - eclipse-temurin-25-jre=25.0.5.8.1.2-r0
    - findutils
    - tzdata
    - zipkin-slim-3=3.6.1-r13
accounts:
  root: true
  run-as: root
  users:
    - name: nonroot
      uid: 65532
      gid: 65532
  groups:
    - name: nonroot
      gid: 65532
      members:
        - nonroot
os-release:
  name: Docker Hardened Images (Alpine)
  id: alpine
  version-id: "3.24"
  pretty-name: Docker Hardened Images/Alpine Linux v3.24
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
work-dir: /zipkin
environment:
  LANG: en_US.UTF-8
  LANGUAGE: en_US:en
  LC_ALL: en_US.UTF-8
paths:
  - type: symlink
    path: /zipkin
    uid: 0
    gid: 0
    source: /usr/share/zipkin-slim
  - type: directory
    path: /usr/local/bin
    uid: 0
    gid: 0
    mode: "0755"
  - type: symlink
    path: /usr/local/bin/start-zipkin
    uid: 0
    gid: 0
    source: /usr/bin/start-zipkin
annotations:
  org.opencontainers.image.description: A minimal Zipkin Slim image
  org.opencontainers.image.licenses: Apache-2.0
entrypoint:
  - start-zipkin
ports:
  - 9411/tcp
