# syntax=dhi.io/build:2-debian13

name: Zipkin Slim 3.x
image: dhi.io/zipkin-slim
variant: runtime
tags:
  - "3"
  - "3.6"
  - 3.6.1
  - 3-debian
  - 3-debian13
  - 3.6-debian
  - 3.6-debian13
  - 3.6.1-debian
  - 3.6.1-debian13
platforms:
  - linux/amd64
  - linux/arm64
dates:
  release: "2024-01-11"
vars:
  JAVA_FIPS_SUFFIX: ""
  JAVA_VERSION: 1:25.0.5.1+2-0
  JDK_MAJOR_VERSION: "25"
  SEMVER_MAJOR_MINOR_VERSION: "3.6"
  SEMVER_MAJOR_VERSION: "3"
  SEMVER_VERSION: 3.6.1
  VERSION: 3.6.1-13
contents:
  repositories:
    - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
  keyring:
    - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
  packages:
    - '!libelogind0'
    - '!mawk'
    - '!original-awk'
    - base-files
    - ca-certificates
    - ca-certificates-bundle
    - dash
    - eclipse-temurin-25-jre-oci-config=1:25.0.5.1+2-0
    - eclipse-temurin-25-jre=1:25.0.5.1+2-0
    - libasound2t64
    - libc6
    - libgcc-s1
    - libstdc++6
    - tzdata
    - zipkin-slim-3=3.6.1-13
  builds:
    - name: locale
      contents:
        packages:
          - bash
          - locales
          - coreutils
          - gzip
      pipeline:
        - name: install locales
          runs: |
            set -eux -o pipefail

            ln -s /etc/locale.alias /usr/share/locale/locale.alias

            echo "en_US.UTF-8 UTF-8" >> /etc/locale.gen
            locale-gen en_US.UTF-8
      outputs:
        - source: /usr/share/locale
          target: /usr/share/locale
          uid: 0
          gid: 0
        - source: /usr/lib/locale
          target: /usr/lib/locale
          uid: 0
          gid: 0
accounts:
  run-as: nonroot
  users:
    - name: nonroot
      uid: 65532
      gid: 65532
  groups:
    - name: nonroot
      gid: 65532
      members:
        - nonroot
os-release:
  name: Docker Hardened Images (Debian)
  id: debian
  version-id: "13"
  version-codename: trixie
  pretty-name: Docker Hardened Images/Debian GNU/Linux 13 (trixie)
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
work-dir: /zipkin
environment:
  LANG: en_US.UTF-8
  LANGUAGE: en_US:en
  LC_ALL: en_US.UTF-8
paths:
  - type: symlink
    path: /zipkin
    uid: 0
    gid: 0
    source: /usr/share/zipkin-slim
  - type: directory
    path: /usr/local/bin
    uid: 0
    gid: 0
    mode: "0755"
  - type: symlink
    path: /usr/local/bin/start-zipkin
    uid: 0
    gid: 0
    source: /usr/bin/start-zipkin
annotations:
  org.opencontainers.image.description: A minimal Zipkin Slim image
  org.opencontainers.image.licenses: Apache-2.0
entrypoint:
  - start-zipkin
ports:
  - 9411/tcp
