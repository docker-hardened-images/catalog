# syntax=dhi.io/build:2-debian13

name: Istio Install CNI 1.30.x
image: dhi.io/istio-install-cni
variant: runtime
tags:
  - "1"
  - "1.30"
  - 1.30.4
  - 1-debian
  - 1-debian13
  - 1.30-debian
  - 1.30-debian13
  - 1.30.4-debian
  - 1.30.4-debian13
platforms:
  - linux/amd64
  - linux/arm64
dates:
  release: "2026-05-18"
vars:
  FLAVORED_SUFFIX: ""
  SEMVER_MAJOR_MINOR_VERSION: "1.30"
  SEMVER_MAJOR_VERSION: "1"
  SEMVER_VERSION: 1.30.4
  SUFFIX: ""
  VERSION: 1.30.4-1
contents:
  repositories:
    - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
  keyring:
    - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
  packages:
    - '!basefiles'
    - ca-certificates
    - iproute2
    - iptables
    - istio-install-cni=1.30.4-1
accounts:
  run-as: nonroot
  users:
    - name: nonroot
      uid: 65532
      gid: 65532
  groups:
    - name: nonroot
      gid: 65532
      members:
        - nonroot
os-release:
  name: Docker Hardened Images (Debian)
  id: debian
  version-id: "13"
  version-codename: trixie
  pretty-name: Docker Hardened Images/Debian GNU/Linux 13 (trixie)
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
environment:
  PATH: /opt/cni/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
paths:
  - type: directory
    path: /usr/local/bin
    uid: 0
    gid: 0
  - type: symlink
    path: /usr/local/bin/install-cni
    uid: 0
    gid: 0
    source: /usr/bin/install-cni
  - type: symlink
    path: /usr/sbin/iptables
    uid: 0
    gid: 0
    source: iptables-nft
  - type: symlink
    path: /usr/sbin/ip6tables
    uid: 0
    gid: 0
    source: ip6tables-nft
annotations:
  org.opencontainers.image.description: A minimal Istio CNI installer image
  org.opencontainers.image.licenses: Apache-2.0
entrypoint:
  - /usr/local/bin/install-cni
