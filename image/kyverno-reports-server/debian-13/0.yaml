# syntax=dhi.io/build:2-debian13

name: Kyverno Reports Server 0.x
image: dhi.io/kyverno-reports-server
variant: runtime
tags:
  - "0"
  - "0.1"
  - 0.1.7
  - 0-debian
  - 0-debian13
  - 0.1-debian
  - 0.1-debian13
  - 0.1.7-debian
  - 0.1.7-debian13
platforms:
  - linux/amd64
  - linux/arm64
dates:
  release: "2025-12-07"
vars:
  FLAVORED_SUFFIX: ""
  SEMVER_MAJOR_MINOR_VERSION: "0.1"
  SEMVER_MAJOR_VERSION: "0"
  SEMVER_VERSION: 0.1.7
  SUFFIX: ""
  VERSION: 0.1.7-4
contents:
  repositories:
    - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
  keyring:
    - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
  packages:
    - base-files
    - ca-certificates-bundle
    - reports-server=0.1.7-4
    - tzdata
accounts:
  run-as: nonroot
  users:
    - name: nonroot
      uid: 65532
      gid: 65532
  groups:
    - name: nonroot
      gid: 65532
      members:
        - nonroot
os-release:
  name: Docker Hardened Images (Debian)
  id: debian
  version-id: "13"
  version-codename: trixie
  pretty-name: Docker Hardened Images/Debian GNU/Linux 13 (trixie)
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
environment:
  KO_DATA_PATH: /kodata
paths:
  - type: directory
    path: /usr/local/bin
    uid: 0
    gid: 0
    mode: "0755"
  - type: symlink
    path: /usr/local/bin/reports-server
    uid: 0
    gid: 0
    source: /usr/bin/reports-server
annotations:
  org.opencontainers.image.description: A minimal Kyverno Reports Server image
  org.opencontainers.image.licenses: Apache-2.0
entrypoint:
  - /usr/local/bin/reports-server
ports:
  - 9443/tcp
  - 8000/tcp
