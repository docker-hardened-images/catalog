# syntax=dhi.io/build:2-debian13

name: ScrapeGraph MCP Server 3.x
image: dhi.io/scrapegraph-mcp
variant: runtime
tags:
  - "3"
  - "3.0"
  - 3.0.0
  - 3-debian
  - 3-debian13
  - 3.0-debian
  - 3.0-debian13
  - 3.0.0-debian
  - 3.0.0-debian13
platforms:
  - linux/amd64
  - linux/arm64
dates:
  release: "2026-06-24"
vars:
  SEMVER_MAJOR_MINOR_VERSION: "3.0"
  SEMVER_MAJOR_VERSION: "3"
  SEMVER_VERSION: 3.0.0
  VERSION: 3.0.0-1
contents:
  repositories:
    - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
  keyring:
    - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
  packages:
    - '!libelogind0'
    - '!mawk'
    - '!original-awk'
    - base-files
    - ca-certificates-bundle
    - libffi8
    - python-3.14
    - scrapegraph-mcp=3.0.0-1
    - tzdata
  builds:
    - name: server.json
      contents:
        packages:
          - bash
          - sed
      pipeline:
        - runs: |
            set -eux -o pipefail

            sed -i "s/_VERSION_/3.0.0/g" "${source.dir}/config/server.json"
      paths:
        - type: file
          path: ${source.dir}/config/server.json
          uid: 0
          gid: 0
          source: image/scrapegraph-mcp/config/server.json
      attestations:
        - predicate-type: https://modelcontextprotocol.io/server.json/v1
          source: ${source.dir}/config/server.json
accounts:
  run-as: nonroot
  users:
    - name: nonroot
      uid: 65532
      gid: 65532
  groups:
    - name: nonroot
      gid: 65532
      members:
        - nonroot
os-release:
  name: Docker Hardened Images (Debian)
  id: debian
  version-id: "13"
  version-codename: trixie
  pretty-name: Docker Hardened Images/Debian GNU/Linux 13 (trixie)
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
work-dir: /app
environment:
  PYTHONDONTWRITEBYTECODE: "1"
  PYTHONUNBUFFERED: "1"
paths:
  - type: symlink
    path: /app
    uid: 0
    gid: 0
    source: /usr/lib/scrapegraph-mcp
  - type: directory
    path: /usr/local/bin
    uid: 0
    gid: 0
  - type: symlink
    path: /usr/local/bin/scrapegraph-mcp
    uid: 0
    gid: 0
    source: /usr/bin/scrapegraph-mcp
annotations:
  org.opencontainers.image.description: A minimal ScrapeGraph MCP Server image
  org.opencontainers.image.licenses: MIT
labels:
  io.modelcontextprotocol.server.name: io.github.ScrapeGraphAI/scrapegraph-mcp
entrypoint:
  - scrapegraph-mcp
