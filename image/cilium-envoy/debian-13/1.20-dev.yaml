# syntax=dhi.io/build:2-debian13

name: Cilium Envoy 1.20.x (dev)
image: dhi.io/cilium-envoy
variant: dev
tags:
  - 1-dev
  - 1.20-dev
  - 1.20.4-dev
  - 1-debian-dev
  - 1-debian13-dev
  - 1.20-debian-dev
  - 1.20-debian13-dev
  - 1.20.4-debian-dev
  - 1.20.4-debian13-dev
platforms:
  - linux/amd64
  - linux/arm64
dates:
  release: "2026-07-29"
vars:
  BAZEL_ARCH: '#{ target.arch == "amd64" ? "x86_64" : "arm64" }'
  CILIUM_ENVOY_VERSION: 1.39.5
  CLANG_VERSION: "18"
  SEMVER_MAJOR_MINOR_VERSION: "1.20"
  SEMVER_MAJOR_VERSION: "1"
  SEMVER_VERSION: 1.20.4
  SUFFIX: ""
  VERSION: 1.20.4-2
contents:
  repositories:
    - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
  keyring:
    - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
  packages:
    - '!gawk'
    - '!libelogind0'
    - '!original-awk'
    - apt
    - base-files
    - bash
    - ca-certificates
    - ca-certificates-bundle
    - cilium-envoy-1.20=1.20.4-2
    - coreutils
    - diffutils
    - dpkg
    - findutils
    - grep
    - libatomic1
    - libc-bin
    - mawk
    - perl-base
    - sed
    - tzdata
    - util-linux
  builds:
    - name: setcap
      contents:
        packages:
          - bash
          - libcap2-bin
          - cilium-envoy-1.20=1.20.4-2
          - util-linux
      pipeline:
        - name: setcap
          runs: |
            set -eux -o pipefail

            setcap 'cap_sys_admin,cap_net_admin+ep' /usr/bin/cilium-envoy-starter
            setcap -v 'cap_sys_admin,cap_net_admin+ep' /usr/bin/cilium-envoy-starter
      outputs:
        - source: /usr/bin/cilium-envoy-starter
          target: /usr/bin/cilium-envoy-starter
          uid: 0
          gid: 0
accounts:
  root: true
  run-as: root
  users:
    - name: nonroot
      uid: 65532
      gid: 65532
    - name: _apt
      uid: 42
      gid: 65532
  groups:
    - name: nonroot
      gid: 65532
      members:
        - nonroot
os-release:
  name: Docker Hardened Images (Debian)
  id: debian
  version-id: "13"
  version-codename: trixie
  pretty-name: Docker Hardened Images/Debian GNU/Linux 13 (trixie)
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
environment:
  DEBIAN_FRONTEND: noninteractive
paths:
  - type: directory
    path: /run/cilium
    uid: 65532
    gid: 65532
  - type: directory
    path: /run/cilium/envoy
    uid: 65532
    gid: 65532
annotations:
  org.opencontainers.image.description: A minimal Cilium Envoy image
  org.opencontainers.image.licenses: Apache-2.0
entrypoint:
  - /usr/bin/cilium-envoy
