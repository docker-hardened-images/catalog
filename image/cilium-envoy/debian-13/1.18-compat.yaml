# syntax=dhi.io/build:2-debian13

name: Cilium Envoy 1.18.x (compat)
image: dhi.io/cilium-envoy
variant: runtime
flavor: compat
tags:
  - 1.18-compat
  - 1.18.12-compat
  - 1.18-debian-compat
  - 1.18-debian13-compat
  - 1.18.12-debian-compat
  - 1.18.12-debian13-compat
platforms:
  - linux/amd64
  - linux/arm64
dates:
  release: "2025-07-29"
vars:
  BAZEL_ARCH: '#{ target.arch == "amd64" ? "x86_64" : "arm64" }'
  CILIUM_ENVOY_VERSION: 1.36.9
  CLANG_VERSION: "18"
  SEMVER_MAJOR_MINOR_VERSION: "1.18"
  SEMVER_MAJOR_VERSION: "1"
  SEMVER_VERSION: 1.18.12
  SUFFIX: ""
  VERSION: 1.18.12-1
contents:
  repositories:
    - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
  keyring:
    - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
  packages:
    - base-files
    - ca-certificates
    - ca-certificates-bundle
    - cilium-envoy-1.18=1.18.12-1
    - libatomic1
    - tzdata
accounts:
  root: true
  run-as: root
  users:
    - name: nonroot
      uid: 65532
      gid: 65532
  groups:
    - name: nonroot
      gid: 65532
      members:
        - nonroot
os-release:
  name: Docker Hardened Images (Debian)
  id: debian
  version-id: "13"
  version-codename: trixie
  pretty-name: Docker Hardened Images/Debian GNU/Linux 13 (trixie)
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
annotations:
  org.opencontainers.image.description: A minimal Cilium Envoy image
  org.opencontainers.image.licenses: Apache-2.0
entrypoint:
  - /usr/bin/cilium-envoy
