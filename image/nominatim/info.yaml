metadata:
  display-name: Nominatim
  short-description: Nominatim is the OpenStreetMap geocoding service for searching and reverse-searching places.
  featured: false
  home-url: https://nominatim.org
  categories:
    - databases-and-storage
  included-tools:
    - name: nominatim
      description: Command-line tool to import, update, query, and administer a Nominatim database.
    - name: osm2pgsql
      description: Loads OpenStreetMap data into PostgreSQL; nominatim import runs it.
    - name: psql
      description: The PostgreSQL interactive terminal for the embedded database.
