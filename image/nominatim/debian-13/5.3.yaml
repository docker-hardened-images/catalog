    uid: 0
    gid: 0
    source: postgis_tiger_geocoder-3.control
  - type: symlink
    path: /usr/share/postgresql/17/extension/postgis_topology.control
    uid: 0
    gid: 0
    source: postgis_topology-3.control
  - type: symlink
    path: /usr/share/postgresql/17/extension/address_standardizer.control
    uid: 0
    gid: 0
    source: address_standardizer-3.control
  - type: symlink
    path: /usr/share/postgresql/17/extension/address_standardizer_data_us.control
    uid: 0
    gid: 0
    source: address_standardizer_data_us-3.control
  - type: symlink
    path: /usr/lib/${ARCH_TRIPLET}/libblas.so.3
    uid: 0
    gid: 0
    source: blas/libblas.so.3
  - type: symlink
    path: /usr/lib/${ARCH_TRIPLET}/liblapack.so.3
    uid: 0
    gid: 0
    source: lapack/liblapack.so.3
  - type: directory
    path: /etc/postgresql/17/main/conf.d
    uid: 65532
    gid: 65532
    mode: "0770"
  - type: file
    path: /etc/postgresql/17/main/conf.d/postgres-tuning.conf
    uid: 65532
    gid: 65532
    mode: "0660"
    source: image/nominatim/conf/postgres-tuning.conf
  - type: file
    path: /app/config.sh
    uid: 0
    gid: 0
    mode: "0755"
    source: image/nominatim/scripts/config.sh
  - type: file
    path: /app/postgres.sh
    uid: 0
    gid: 0
    mode: "0644"
    source: image/nominatim/scripts/postgres.sh
  - type: file
    path: /app/init.sh
    uid: 0
    gid: 0
    mode: "0755"
    source: image/nominatim/scripts/init.sh
  - type: file
    path: /app/start.sh
    uid: 0
    gid: 0
    mode: "0755"
    source: image/nominatim/scripts/start.sh
annotations:
  org.opencontainers.image.description: Nominatim - OpenStreetMap geocoding for searching and reverse-searching places
  org.opencontainers.image.licenses: GPL-3.0-or-later
cmd:
  - /app/start.sh
ports:
  - 8080/tcp
  - 5432/tcp
