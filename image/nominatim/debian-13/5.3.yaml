# syntax=dhi.io/build:2-debian13

name: Nominatim 5.3.x
image: dhi.io/nominatim
variant: runtime
tags:
  - "5"
  - "5.3"
  - 5.3.3
  - 5-debian
  - 5-debian13
  - 5.3-debian
  - 5.3-debian13
  - 5.3.3-debian
  - 5.3.3-debian13
platforms:
  - linux/amd64
  - linux/arm64
dates:
  release: "2026-04-03"
vars:
  ARCH_TRIPLET: '#{ target.arch == "amd64" ? "x86_64-linux-gnu" : "aarch64-linux-gnu" }'
  OSM2PGSQL_VERSION: 2.1.1+ds-1
  POSTGIS_VERSION: 3.5.2+dfsg-1
  POSTGRESQL_VERSION: 17.11-0+deb13u1+dhi1
  PYTHON_VERSION: 3.14.8-0
  SEMVER_MAJOR_MINOR_VERSION: "5.3"
  SEMVER_MAJOR_VERSION: "5"
  SEMVER_VERSION: 5.3.3
  VERSION: 5.3.3-1
contents:
  repositories:
    - deb http://deb.debian.org/debian trixie main
    - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
  keyring:
    - https://ftp-master.debian.org/keys/archive-key-13.asc
    - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
  packages:
    - '!libelogind0'
    - '!libgbm1'
    - '!libgl1-mesa-dri'
    - '!libglx-mesa0'
    - '!libllvm19'
    - '!libz3-4'
    - '!mawk'
    - '!mesa-libgallium'
    - '!original-awk'
    - base-files
    - bash
    - ca-certificates-bundle
    - coreutils
    - curl
    - grep
    - libbz2-1.0
    - libc6
    - libexpat1
    - libgcc-s1
    - libgdal36
    - libgeos-c1t64
    - libgssapi-krb5-2
    - libicu76
    - libjson-c5
    - libldap2
    - liblua5.3-0
    - liblz4-1
    - libopencv-core410
    - libopencv-imgcodecs410
    - libopencv-imgproc410
    - libpam0g
    - libpcre2-8-0
    - libpotrace0
    - libpq5
    - libproj25
    - libprotobuf-c1
    - libpython-3.14-minimal=3.14.8-0
    - libpython-3.14-stdlib=3.14.8-0
    - libpython-3.14=3.14.8-0
    - libreadline8t64
    - libselinux1
    - libsfcgal2
    - libssl3t64
    - libstdc++6
    - libsystemd0
    - libuuid1
    - libxml2
    - libxslt1.1
    - libzstd1
    - nominatim-5.3=5.3.3-1
    - osm2pgsql=2.1.1+ds-1
    - postgresql-17-postgis-3-scripts=3.5.2+dfsg-1
    - postgresql-17-postgis-3=3.5.2+dfsg-1
    - postgresql-17=17.11-0+deb13u1+dhi1
    - postgresql-client-17=17.11-0+deb13u1+dhi1
    - python-3.14-minimal=3.14.8-0
    - python-3.14=3.14.8-0
    - sed
    - tzdata
    - zlib1g
accounts:
  run-as: nonroot
  users:
    - name: nonroot
      uid: 65532
      gid: 65532
  groups:
    - name: nonroot
      gid: 65532
      members:
        - nonroot
os-release:
  name: Docker Hardened Images (Debian)
  id: debian
  version-id: "13"
  version-codename: trixie
  pretty-name: Docker Hardened Images/Debian GNU/Linux 13 (trixie)
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
work-dir: /nominatim
environment:
  PATH: /usr/lib/postgresql/17/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
  PGDATA: /var/lib/postgresql/17/main
  PGUSER: nominatim
  PROJECT_DIR: /nominatim
  USER_AGENT: docker-hardened-images/nominatim:5.3.3
  WARMUP_ON_STARTUP: "false"
paths:
  - type: directory
    path: /nominatim
    uid: 65532
    gid: 65532
    mode: "0770"
  - type: file
    path: /nominatim/.env
    uid: 65532
    gid: 65532
    mode: "0660"
    source: image/nominatim/conf/env
  - type: directory
    path: /var/lib/postgresql/17/main
    uid: 65532
    gid: 65532
    mode: "0700"
  - type: directory
    path: /run/postgresql
    uid: 65532
    gid: 65532
    mode: "0770"
  - type: symlink
    path: /usr/share/postgresql/17/extension/postgis.control
    uid: 0
    gid: 0
    source: postgis-3.control
  - type: symlink
    path: /usr/share/postgresql/17/extension/postgis_raster.control
    uid: 0
    gid: 0
