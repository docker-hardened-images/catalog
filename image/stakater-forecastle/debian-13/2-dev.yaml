# syntax=dhi.io/build:2-debian13

name: Forecastle 2.x (dev)
image: dhi.io/stakater-forecastle
variant: dev
tags:
  - 2-dev
  - 2.0-dev
  - 2.0.3-dev
  - 2-debian-dev
  - 2-debian13-dev
  - 2.0-debian-dev
  - 2.0-debian13-dev
  - 2.0.3-debian-dev
  - 2.0.3-debian13-dev
platforms:
  - linux/amd64
  - linux/arm64
dates:
  release: "2026-01-09"
vars:
  DEBIAN_EPOCH_MAJOR_MINOR_VERSION: "2.0"
  DEBIAN_EPOCH_MAJOR_VERSION: "2"
  DEBIAN_EPOCH_VERSION: 2.0.3
  FLAVORED_SUFFIX: -dev
  SUFFIX: -dev
  VERSION: 2.0.3-0
contents:
  repositories:
    - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
  keyring:
    - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
  packages:
    - '!gawk'
    - '!libelogind0'
    - '!original-awk'
    - apt
    - base-files
    - bash
    - ca-certificates
    - ca-certificates-bundle
    - coreutils
    - diffutils
    - dpkg
    - findutils
    - grep
    - libc-bin
    - mawk
    - perl-base
    - sed
    - sqv
    - stakater-forecastle-2-dev=2.0.3-0
    - tzdata
    - util-linux
accounts:
  root: true
  run-as: root
  users:
    - name: nonroot
      uid: 65532
      gid: 65532
    - name: _apt
      uid: 42
      gid: 65532
  groups:
    - name: nonroot
      gid: 65532
      members:
        - nonroot
os-release:
  name: Docker Hardened Images (Debian)
  id: debian
  version-id: "13"
  version-codename: trixie
  pretty-name: Docker Hardened Images/Debian GNU/Linux 13 (trixie)
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
work-dir: /
environment:
  DEBIAN_FRONTEND: noninteractive
  SSL_CERT_FILE: /etc/ssl/certs/ca-certificates.crt
paths:
  - type: symlink
    path: /forecastle
    uid: 0
    gid: 0
    source: /usr/bin/forecastle
  - type: directory
    path: /etc/forecastle
    uid: 0
    gid: 0
    mode: "0755"
  - type: directory
    path: /home/nonroot
    uid: 65532
    gid: 65532
    mode: "0700"
annotations:
  org.opencontainers.image.description: A minimal Forecastle image
  org.opencontainers.image.licenses: Apache-2.0
entrypoint:
  - /forecastle
ports:
  - 3000/tcp
