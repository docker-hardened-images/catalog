# syntax=dhi.io/build:2-alpine3.24

name: Forecastle 2.x
image: dhi.io/stakater-forecastle
variant: runtime
tags:
  - 2-alpine
  - 2.0-alpine
  - 2-alpine3.24
  - 2.0.3-alpine
  - 2.0-alpine3.24
  - 2.0.3-alpine3.24
platforms:
  - linux/amd64
  - linux/arm64
dates:
  release: "2026-01-09"
vars:
  APK_MAJOR_MINOR_VERSION: "2.0"
  APK_MAJOR_VERSION: "2"
  APK_VERSION: 2.0.3
  FLAVORED_SUFFIX: ""
  SUFFIX: ""
  VERSION: 2.0.3-r0
contents:
  repositories:
    - https://dhi.io/apk/alpine/v3.24/main
    - https://dl-cdn.alpinelinux.org/alpine/v3.24/main
    - https://dl-cdn.alpinelinux.org/alpine/v3.24/community
  keyring:
    - https://dhi.io/keyring/dhi-apk@docker-0F81AD7700D99184.rsa.pub
  packages:
    - alpine-baselayout-data
    - ca-certificates-bundle
    - stakater-forecastle-2=2.0.3-r0
    - tzdata
accounts:
  run-as: nonroot
  users:
    - name: nonroot
      uid: 65532
      gid: 65532
  groups:
    - name: nonroot
      gid: 65532
      members:
        - nonroot
os-release:
  name: Docker Hardened Images (Alpine)
  id: alpine
  version-id: "3.24"
  pretty-name: Docker Hardened Images/Alpine Linux v3.24
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
work-dir: /
environment:
  SSL_CERT_FILE: /etc/ssl/certs/ca-certificates.crt
paths:
  - type: symlink
    path: /forecastle
    uid: 0
    gid: 0
    source: /usr/bin/forecastle
  - type: directory
    path: /etc/forecastle
    uid: 0
    gid: 0
    mode: "0755"
  - type: directory
    path: /home/nonroot
    uid: 65532
    gid: 65532
    mode: "0700"
annotations:
  org.opencontainers.image.description: A minimal Forecastle image
  org.opencontainers.image.licenses: Apache-2.0
entrypoint:
  - /forecastle
ports:
  - 3000/tcp
