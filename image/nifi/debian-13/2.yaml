# syntax=dhi.io/build:2-debian13

name: Apache NiFi 2.x
image: dhi.io/nifi
variant: runtime
tags:
  - "2"
  - "2.12"
  - 2.12.0
  - 2-debian
  - 2-debian13
  - 2.12-debian
  - 2.12-debian13
  - 2.12.0-debian
  - 2.12.0-debian13
platforms:
  - linux/amd64
  - linux/arm64
dates:
  release: "2026-06-18"
vars:
  JAVA_HOME: /usr/lib/jvm/temurin-21
  JAVA_MAJOR_VERSION: "21"
  NIFI_HOME: /opt/nifi/nifi-current
  SEMVER_MAJOR_MINOR_VERSION: "2.12"
  SEMVER_MAJOR_VERSION: "2"
  SEMVER_VERSION: 2.12.0
  UV_VERSION: 0.13.9
  VERSION: 2.12.0-7
contents:
  repositories:
    - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
  keyring:
    - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
  packages:
    - '!libelogind0'
    - '!mawk'
    - '!original-awk'
    - base-files
    - bash
    - coreutils
    - eclipse-temurin-21-jre
    - eclipse-temurin-21-jre-oci-config
    - grep
    - hostname
    - libstdc++6
    - mawk
    - nifi=2.12.0-7
    - procps
    - python-3.13
    - python-3.13-dev
    - python3-setuptools
    - python3-wheel
    - sed
    - xmlstarlet
  builds:
    - name: sbom
      contents:
        packages:
          - bash
          - coreutils
      pipeline:
        - uses: spdx@v1
          with:
            license: Apache-2.0
            name: nifi
            purl: pkg:github/apache/nifi@2.12.0
            version: 2.12.0
        - uses: spdx@v1
          with:
            license: MIT OR Apache-2.0
            name: uv-binary
            purl: pkg:github/astral-sh/uv@0.13.9
            version: 0.13.9
      outputs:
        - source: /opt/docker/sbom/nifi
          target: /opt/docker/sbom/nifi
          uid: 0
          gid: 0
        - source: /opt/docker/sbom/uv-binary
          target: /opt/docker/sbom/uv-binary
          uid: 0
          gid: 0
    - name: nifi conf ownership
      contents:
        packages:
          - bash
          - coreutils
          - nifi=2.12.0-7
      pipeline:
        - name: make conf writable for the nifi user
          runs: |
            set -eux -o pipefail

            chmod -R u+rwX,g+rX,o+rX /usr/share/nifi/nifi-current/conf
            chown -R 1000:1000 /usr/share/nifi/nifi-current/conf
      outputs:
        - source: /usr/share/nifi/nifi-current/conf
          target: /usr/share/nifi/nifi-current/conf
          uid: 0
          gid: 0
    - name: locale
      contents:
        packages:
          - bash
          - locales
          - coreutils
          - gzip
      pipeline:
        - name: install locales
          runs: |
            set -eux -o pipefail

            ln -s /etc/locale.alias /usr/share/locale/locale.alias

            echo "en_US.UTF-8 UTF-8" >> /etc/locale.gen
            locale-gen en_US.UTF-8
      outputs:
        - source: /usr/share/locale
          target: /usr/share/locale
          uid: 0
          gid: 0
        - source: /usr/lib/locale
          target: /usr/lib/locale
          uid: 0
          gid: 0
accounts:
  run-as: nifi
  users:
    - name: nifi
      uid: 1000
      gid: 1000
  groups:
    - name: nifi
      gid: 1000
      members:
        - nifi
os-release:
  name: Docker Hardened Images (Debian)
  id: debian
  version-id: "13"
  version-codename: trixie
  pretty-name: Docker Hardened Images/Debian GNU/Linux 13 (trixie)
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
work-dir: /opt/nifi/nifi-current
environment:
  JAVA_HOME: /usr/lib/jvm/temurin-21
  LANG: en_US.UTF-8
  LANGUAGE: en_US:en
  LC_ALL: en_US.UTF-8
  NIFI_HOME: /opt/nifi/nifi-current
  PATH: /home/nifi/.local/bin:/opt/nifi/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
paths:
  - type: directory
    path: /opt
    uid: 0
    gid: 0
  - type: symlink
    path: /opt/nifi
    uid: 0
    gid: 0
    source: /usr/share/nifi
  - type: directory
