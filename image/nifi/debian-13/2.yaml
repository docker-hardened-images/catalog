    mode: "0755"
  - type: directory
    path: /usr/share/nifi/nifi-current/state
    uid: 1000
    gid: 1000
    mode: "0755"
  - type: directory
    path: /usr/share/nifi/nifi-current/python_extensions
    uid: 1000
