# syntax=dhi.io/build:2-debian13

name: Harbor DB 2.15.x (dev)
image: dhi.io/harbor-db
variant: dev
tags:
  - 2-dev
  - 2.15-dev
  - 2.15.3-dev
  - 2-debian-dev
  - 2-debian13-dev
  - 2.15-debian-dev
  - 2.15-debian13-dev
  - 2.15.3-debian-dev
  - 2.15.3-debian13-dev
platforms:
  - linux/amd64
  - linux/arm64
dates:
  release: "2026-03-20"
vars:
  GOSU_VERSION: 1.19-10
  PACKAGE_NAME: harbor-db-2.15
  POSTGRES_14_REFERENCE: dhi/postgres:14.24-debian13@sha256:65b6516e30abf7ce4868850fdc7be442b131e36d6a8d547aa7767af4f5751262
  POSTGRES_14_VERSION: "14.24"
  POSTGRES_15_REFERENCE: dhi/postgres:15.19-debian13@sha256:88e050c41cabf10df36adf48bb8d820dc45597fcdee67e70a3b2d751ff94c93c
  POSTGRES_15_VERSION: "15.19"
  POSTGRES_18_REFERENCE: dhi/postgres:18.6-debian13@sha256:772852d563ce8916374da57d37a1511ec21878f073b545069c6a45daf872b974
  POSTGRES_18_VERSION: "18.6"
  POSTGRES_NEW_MAJOR: "18"
  POSTGRES_NEW_REFERENCE: dhi/postgres:18.6-debian13@sha256:772852d563ce8916374da57d37a1511ec21878f073b545069c6a45daf872b974
  POSTGRES_NEW_VERSION: "18.6"
  POSTGRES_OLD_MAJOR: "15"
  POSTGRES_OLD_REFERENCE: dhi/postgres:15.19-debian13@sha256:88e050c41cabf10df36adf48bb8d820dc45597fcdee67e70a3b2d751ff94c93c
  POSTGRES_OLD_VERSION: "15.19"
  SEMVER_MAJOR_MINOR_VERSION: "2.15"
  SEMVER_MAJOR_VERSION: "2"
  SEMVER_VERSION: 2.15.3
  VERSION: 2.15.3-0
contents:
  repositories:
    - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
  keyring:
    - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
  packages:
    - '!gawk'
    - '!libelogind0'
    - '!mawk'
    - '!original-awk'
    - apt
    - base-files
    - bash
    - ca-certificates
    - coreutils
    - diffutils
    - dpkg
    - findutils
    - gosu=1.19-10
    - grep
    - gzip
    - harbor-db-2.15=2.15.3-0
    - libc-bin
    - libgssapi-krb5-2
    - libicu76
    - libldap2
    - liblz4-1
    - libnuma1
    - libpam0g
    - libreadline8t64
    - libselinux1
    - libssl3t64
    - liburing2
    - libxml2
    - libzstd1
    - mawk
    - perl-base
    - sed
    - tzdata
    - util-linux
    - zlib1g
  builds:
    - name: materialize postgresql 15 tree
      contents:
        packages:
          - bash
          - coreutils
        artifacts:
          - name: dhi.io/postgres:15.19-debian13@sha256:88e050c41cabf10df36adf48bb8d820dc45597fcdee67e70a3b2d751ff94c93c
            includes:
              - opt/postgresql/15/**
              - usr/bin/**
              - usr/lib/postgresql/15/**
            uid: 0
            gid: 0
      pipeline:
        - name: materialize postgresql 15 symlinks
          runs: |
            set -eux -o pipefail

            major=15
            root="/opt/postgresql/${major}"

            for sub in lib share include; do
              path="${root}/${sub}"
              if [ -L "${path}" ]; then
                target="$(readlink -f "${path}")"
                rm -f "${path}"
                cp -a "${target}" "${path}"
              fi
            done

            bindir="${root}/bin"
            for link in "${bindir}"/*; do
              [ -L "${link}" ] || continue
              name="$(basename "${link}")"
              if [ "${name}" = "bin" ]; then
                rm -f "${link}"
                continue
              fi
              target="$(readlink -f "${link}")"
              rm -f "${link}"
              cp -a "${target}" "${link}"
            done

            mkdir -p "${root}/lib/postgresql/${major}"
            ln -sfn "../../../share" "${root}/lib/postgresql/${major}/share"
            ln -sfn "../../../include" "${root}/lib/postgresql/${major}/include"
            ln -sfn "../.." "${root}/lib/postgresql/${major}/lib"
      outputs:
        - source: /opt/postgresql/15
          target: /opt/postgresql/15
          uid: 0
          gid: 0
        - source: /usr/lib/postgresql/15
          target: /usr/lib/postgresql/15
          uid: 0
          gid: 0
    - name: materialize postgresql 18 tree
      contents:
        packages:
          - bash
          - coreutils
        artifacts:
          - name: dhi.io/postgres:18.6-debian13@sha256:772852d563ce8916374da57d37a1511ec21878f073b545069c6a45daf872b974
            includes:
              - opt/postgresql/18/**
              - usr/bin/**
              - usr/lib/postgresql/18/**
            uid: 0
            gid: 0
      pipeline:
        - name: materialize postgresql 18 symlinks
          runs: |
            set -eux -o pipefail

            major=18
            root="/opt/postgresql/${major}"

            for sub in lib share include; do
              path="${root}/${sub}"
              if [ -L "${path}" ]; then
                target="$(readlink -f "${path}")"
                rm -f "${path}"
                cp -a "${target}" "${path}"
              fi
            done

            bindir="${root}/bin"
            for link in "${bindir}"/*; do
              [ -L "${link}" ] || continue
              name="$(basename "${link}")"
              if [ "${name}" = "bin" ]; then
                rm -f "${link}"
                continue
              fi
              target="$(readlink -f "${link}")"
              rm -f "${link}"
              cp -a "${target}" "${link}"
            done

            mkdir -p "${root}/lib/postgresql/${major}"
            ln -sfn "../../../share" "${root}/lib/postgresql/${major}/share"
            ln -sfn "../../../include" "${root}/lib/postgresql/${major}/include"
            ln -sfn "../.." "${root}/lib/postgresql/${major}/lib"
      outputs:
        - source: /opt/postgresql/18
          target: /opt/postgresql/18
          uid: 0
          gid: 0
        - source: /usr/lib/postgresql/18
          target: /usr/lib/postgresql/18
          uid: 0
          gid: 0
    - name: dhi-postgres-purl
      contents:
        packages:
          - bash
          - coreutils
      pipeline:
        - name: spdx postgres 15
          uses: spdx@v1
          with:
            license: PostgreSQL
            name: postgresql-15
            purl: pkg:dhi/postgresql@15.19
            version: 15.19
        - name: spdx postgres 18
          uses: spdx@v1
          with:
            license: PostgreSQL
            name: postgresql-18
            purl: pkg:dhi/postgresql@18.6
            version: 18.6
      outputs:
        - source: /opt/docker/sbom/postgresql-15
          target: /opt/docker/sbom/postgresql-15
          uid: 0
          gid: 0
        - source: /opt/docker/sbom/postgresql-18
          target: /opt/docker/sbom/postgresql-18
          uid: 0
          gid: 0
    - name: locale
      contents:
        packages:
          - bash
          - locales
          - coreutils
          - gzip
      pipeline:
        - name: install locales
          runs: |
            set -eux -o pipefail

            ln -s /etc/locale.alias /usr/share/locale/locale.alias

            echo "en_US.UTF-8 UTF-8" >> /etc/locale.gen
            locale-gen en_US.UTF-8
      outputs:
        - source: /usr/share/locale
          target: /usr/share/locale
          uid: 0
          gid: 0
        - source: /usr/lib/locale
          target: /usr/lib/locale
          uid: 0
          gid: 0
accounts:
  root: true
  run-as: root
  users:
    - name: postgres
      uid: 70
      gid: 70
    - name: _apt
      uid: 42
      gid: 65532
  groups:
    - name: postgres
      gid: 70
      members:
        - postgres
os-release:
  name: Docker Hardened Images (Debian)
  id: debian
  version-id: "13"
  version-codename: trixie
  pretty-name: Docker Hardened Images/Debian GNU/Linux 13 (trixie)
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
environment:
  DEBIAN_FRONTEND: noninteractive
  LANG: en_US.UTF-8
  LANGUAGE: en_US:en
  LC_ALL: en_US.UTF-8
  PATH: /opt/postgresql/18/bin:/opt/postgresql/15/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
  PGDATA: /var/lib/postgresql/data
paths:
