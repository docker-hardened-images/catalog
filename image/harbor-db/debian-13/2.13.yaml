# syntax=dhi.io/build:2-debian13

name: Harbor DB 2.13.x
image: dhi.io/harbor-db
variant: runtime
tags:
  - "2.13"
  - 2.13.6
  - 2.13-debian
  - 2.13-debian13
  - 2.13.6-debian
  - 2.13.6-debian13
platforms:
  - linux/amd64
  - linux/arm64
dates:
  release: "2025-04-09"
vars:
  PACKAGE_NAME: harbor-db-2.13
  POSTGRES_14_REFERENCE: dhi/postgres:14.24-debian13@sha256:712e71d13e61be981699b2200567f0dbd43e731425d7f87cb62c00c02473a753
  POSTGRES_14_VERSION: "14.24"
  POSTGRES_15_REFERENCE: dhi/postgres:15.19-debian13@sha256:a4f56d3e7342ca4f47e99636ffc5caf7fd41b42c28e542f3c8af84eb31c58010
  POSTGRES_15_VERSION: "15.19"
  POSTGRES_NEW_MAJOR: "15"
  POSTGRES_NEW_REFERENCE: dhi/postgres:15.19-debian13@sha256:a4f56d3e7342ca4f47e99636ffc5caf7fd41b42c28e542f3c8af84eb31c58010
  POSTGRES_NEW_VERSION: "15.19"
  POSTGRES_OLD_MAJOR: "14"
  POSTGRES_OLD_REFERENCE: dhi/postgres:14.24-debian13@sha256:712e71d13e61be981699b2200567f0dbd43e731425d7f87cb62c00c02473a753
  POSTGRES_OLD_VERSION: "14.24"
  SEMVER_MAJOR_MINOR_VERSION: "2.13"
  SEMVER_MAJOR_VERSION: "2"
  SEMVER_VERSION: 2.13.6
  VERSION: 2.13.6-0
contents:
  repositories:
    - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
  keyring:
    - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
  packages:
    - '!libelogind0'
    - '!mawk'
    - '!original-awk'
    - base-files
    - bash
    - coreutils
    - findutils
    - gzip
    - harbor-db-2.13=2.13.6-0
    - libgssapi-krb5-2
    - libicu76
    - libldap2
    - liblz4-1
    - libpam0g
    - libreadline8t64
    - libselinux1
    - libssl3t64
    - libxml2
    - libzstd1
    - tzdata
    - zlib1g
  builds:
    - name: materialize postgresql 14 tree
      contents:
        packages:
          - bash
          - coreutils
        artifacts:
          - name: dhi.io/postgres:14.24-debian13@sha256:712e71d13e61be981699b2200567f0dbd43e731425d7f87cb62c00c02473a753
            includes:
              - opt/postgresql/14/**
              - usr/bin/**
              - usr/lib/postgresql/14/**
            uid: 0
            gid: 0
      pipeline:
        - name: materialize postgresql 14 symlinks
          runs: |
            set -eux -o pipefail

            major=14
            root="/opt/postgresql/${major}"

            for sub in lib share include; do
              path="${root}/${sub}"
              if [ -L "${path}" ]; then
                target="$(readlink -f "${path}")"
                rm -f "${path}"
                cp -a "${target}" "${path}"
              fi
            done

            bindir="${root}/bin"
            for link in "${bindir}"/*; do
              [ -L "${link}" ] || continue
              name="$(basename "${link}")"
              if [ "${name}" = "bin" ]; then
                rm -f "${link}"
                continue
              fi
              target="$(readlink -f "${link}")"
              rm -f "${link}"
              cp -a "${target}" "${link}"
            done

            mkdir -p "${root}/lib/postgresql/${major}"
            ln -sfn "../../../share" "${root}/lib/postgresql/${major}/share"
            ln -sfn "../../../include" "${root}/lib/postgresql/${major}/include"
            ln -sfn "../.." "${root}/lib/postgresql/${major}/lib"
      outputs:
        - source: /opt/postgresql/14
          target: /opt/postgresql/14
          uid: 0
          gid: 0
        - source: /usr/lib/postgresql/14
          target: /usr/lib/postgresql/14
          uid: 0
          gid: 0
    - name: materialize postgresql 15 tree
      contents:
        packages:
          - bash
          - coreutils
        artifacts:
          - name: dhi.io/postgres:15.19-debian13@sha256:a4f56d3e7342ca4f47e99636ffc5caf7fd41b42c28e542f3c8af84eb31c58010
            includes:
              - opt/postgresql/15/**
              - usr/bin/**
              - usr/lib/postgresql/15/**
            uid: 0
            gid: 0
      pipeline:
        - name: materialize postgresql 15 symlinks
          runs: |
            set -eux -o pipefail

            major=15
            root="/opt/postgresql/${major}"

            for sub in lib share include; do
              path="${root}/${sub}"
              if [ -L "${path}" ]; then
                target="$(readlink -f "${path}")"
                rm -f "${path}"
                cp -a "${target}" "${path}"
              fi
            done

            bindir="${root}/bin"
            for link in "${bindir}"/*; do
              [ -L "${link}" ] || continue
              name="$(basename "${link}")"
              if [ "${name}" = "bin" ]; then
                rm -f "${link}"
                continue
              fi
              target="$(readlink -f "${link}")"
              rm -f "${link}"
              cp -a "${target}" "${link}"
            done

            mkdir -p "${root}/lib/postgresql/${major}"
            ln -sfn "../../../share" "${root}/lib/postgresql/${major}/share"
            ln -sfn "../../../include" "${root}/lib/postgresql/${major}/include"
            ln -sfn "../.." "${root}/lib/postgresql/${major}/lib"
      outputs:
        - source: /opt/postgresql/15
          target: /opt/postgresql/15
          uid: 0
          gid: 0
        - source: /usr/lib/postgresql/15
          target: /usr/lib/postgresql/15
          uid: 0
          gid: 0
    - name: dhi-postgres-purl
      contents:
        packages:
          - bash
          - coreutils
      pipeline:
        - name: spdx postgres 14
          uses: spdx@v1
          with:
            license: PostgreSQL
            name: postgresql-14
            purl: pkg:dhi/postgresql@14.24
            version: 14.24
        - name: spdx postgres 15
          uses: spdx@v1
          with:
            license: PostgreSQL
            name: postgresql-15
            purl: pkg:dhi/postgresql@15.19
            version: 15.19
      outputs:
        - source: /opt/docker/sbom/postgresql-14
          target: /opt/docker/sbom/postgresql-14
          uid: 0
          gid: 0
        - source: /opt/docker/sbom/postgresql-15
          target: /opt/docker/sbom/postgresql-15
          uid: 0
          gid: 0
    - name: locale
      contents:
        packages:
          - bash
          - locales
          - coreutils
          - gzip
      pipeline:
        - name: install locales
          runs: |
            set -eux -o pipefail

            ln -s /etc/locale.alias /usr/share/locale/locale.alias

            echo "en_US.UTF-8 UTF-8" >> /etc/locale.gen
            locale-gen en_US.UTF-8
      outputs:
        - source: /usr/share/locale
          target: /usr/share/locale
          uid: 0
          gid: 0
        - source: /usr/lib/locale
          target: /usr/lib/locale
          uid: 0
          gid: 0
accounts:
  run-as: postgres
  users:
    - name: postgres
      uid: 70
      gid: 70
  groups:
    - name: postgres
      gid: 70
      members:
        - postgres
os-release:
  name: Docker Hardened Images (Debian)
  id: debian
  version-id: "13"
  version-codename: trixie
  pretty-name: Docker Hardened Images/Debian GNU/Linux 13 (trixie)
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
environment:
  LANG: en_US.UTF-8
  LANGUAGE: en_US:en
  LC_ALL: en_US.UTF-8
  PATH: /opt/postgresql/15/bin:/opt/postgresql/14/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
  PGDATA: /var/lib/postgresql/data
paths:
  - type: symlink
    path: /docker-entrypoint.sh
    uid: 0
    gid: 0
    source: /usr/share/harbor-db/docker-entrypoint.sh
  - type: symlink
    path: /docker-healthcheck.sh
    uid: 0
    gid: 0
    source: /usr/share/harbor-db/docker-healthcheck.sh
  - type: symlink
    path: /initdb.sh
    uid: 0
    gid: 0
    source: /usr/share/harbor-db/initdb.sh
  - type: symlink
    path: /upgrade.sh
    uid: 0
    gid: 0
    source: /usr/share/harbor-db/upgrade.sh
  - type: symlink
    path: /docker-entrypoint-initdb.d
    uid: 0
    gid: 0
    source: /usr/share/harbor-db/docker-entrypoint-initdb.d
  - type: directory
    path: /var/lib/postgresql/data
    uid: 70
    gid: 70
    mode: "0700"
  - type: directory
    path: /run/postgresql
    uid: 70
    gid: 70
    mode: "0755"
annotations:
  org.opencontainers.image.description: A minimal Harbor DB image
  org.opencontainers.image.licenses: Apache-2.0
entrypoint:
  - /docker-entrypoint.sh
  - "14"
  - "15"
ports:
  - 5432/tcp
