# syntax=dhi.io/build:2-debian13

name: unleash 8.x (dev)
image: dhi.io/unleash
variant: dev
tags:
  - 8-dev
  - 8.1-dev
  - 8.1.0-dev
  - 8-debian-dev
  - 8-debian13-dev
  - 8.1-debian-dev
  - 8.1-debian13-dev
  - 8.1.0-debian-dev
  - 8.1.0-debian13-dev
platforms:
  - linux/amd64
  - linux/arm64
dates:
  release: "2026-06-09"
vars:
  SEMVER_MAJOR_MINOR_VERSION: "8.1"
  SEMVER_MAJOR_VERSION: "8"
  SEMVER_VERSION: 8.1.0
  VERSION: 8.1.0-1
contents:
  repositories:
    - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
  keyring:
    - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
  packages:
    - '!gawk'
    - '!libelogind0'
    - '!mawk'
    - '!original-awk'
    - apt
    - base-files
    - bash
    - ca-certificates
    - ca-certificates-bundle
    - coreutils
    - curl
    - diffutils
    - dpkg
    - findutils
    - grep
    - libc-bin
    - libc6
    - libgomp1
    - libstdc++6
    - mawk
    - netbase
    - nodejs-24
    - perl-base
    - readline-common
    - sed
    - tzdata
    - unleash-8=8.1.0-1
    - util-linux
accounts:
  root: true
  run-as: root
  users:
    - name: nonroot
      uid: 65532
      gid: 65532
    - name: _apt
      uid: 42
      gid: 65532
  groups:
    - name: nonroot
      gid: 65532
      members:
        - nonroot
os-release:
  name: Docker Hardened Images (Debian)
  id: debian
  version-id: "13"
  version-codename: trixie
  pretty-name: Docker Hardened Images/Debian GNU/Linux 13 (trixie)
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
work-dir: /opt/unleash
environment:
  DEBIAN_FRONTEND: noninteractive
  NODE_ENV: production
  TZ: UTC
paths:
  - type: directory
    path: /opt
    uid: 0
    gid: 0
  - type: symlink
    path: /opt/unleash
    uid: 0
    gid: 0
    source: /usr/lib/unleash-8
annotations:
  org.opencontainers.image.description: A minimal Unleash image
  org.opencontainers.image.licenses: Apache-2.0
entrypoint:
  - node
cmd:
  - /opt/unleash/dist/server.js
ports:
  - 4242/tcp
