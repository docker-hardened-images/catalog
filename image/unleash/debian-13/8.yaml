# syntax=dhi.io/build:2-debian13

name: unleash 8.x
image: dhi.io/unleash
variant: runtime
tags:
  - "8"
  - "8.1"
  - 8.1.0
  - 8-debian
  - 8-debian13
  - 8.1-debian
  - 8.1-debian13
  - 8.1.0-debian
  - 8.1.0-debian13
platforms:
  - linux/amd64
  - linux/arm64
dates:
  release: "2026-06-09"
vars:
  SEMVER_MAJOR_MINOR_VERSION: "8.1"
  SEMVER_MAJOR_VERSION: "8"
  SEMVER_VERSION: 8.1.0
  VERSION: 8.1.0-1
contents:
  repositories:
    - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
  keyring:
    - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
  packages:
    - '!libelogind0'
    - '!mawk'
    - '!original-awk'
    - base-files
    - ca-certificates-bundle
    - libc6
    - libgomp1
    - libstdc++6
    - netbase
    - nodejs-24
    - tzdata
    - unleash-8=8.1.0-1
accounts:
  root: true
  run-as: nonroot
  users:
    - name: nonroot
      uid: 65532
      gid: 65532
  groups:
    - name: nonroot
      gid: 65532
      members:
        - nonroot
os-release:
  name: Docker Hardened Images (Debian)
  id: debian
  version-id: "13"
  version-codename: trixie
  pretty-name: Docker Hardened Images/Debian GNU/Linux 13 (trixie)
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
work-dir: /opt/unleash
environment:
  NODE_ENV: production
  TZ: UTC
paths:
  - type: directory
    path: /opt
    uid: 0
    gid: 0
  - type: symlink
    path: /opt/unleash
    uid: 0
    gid: 0
    source: /usr/lib/unleash-8
annotations:
  org.opencontainers.image.description: A minimal Unleash image
  org.opencontainers.image.licenses: Apache-2.0
entrypoint:
  - node
cmd:
  - /opt/unleash/dist/server.js
ports:
  - 4242/tcp
