# syntax=dhi.io/build:2-alpine3.24

name: Icinga DB 1.5.x
image: dhi.io/icingadb
variant: runtime
tags:
  - 1.5-alpine
  - 1.5.1-alpine
  - 1.5-alpine3.24
  - 1.5.1-alpine3.24
platforms:
  - linux/amd64
  - linux/arm64
dates:
  release: "2025-11-19"
vars:
  FLAVORED_SUFFIX: ""
  SEMVER_MAJOR_MINOR_VERSION: "1.5"
  SEMVER_MAJOR_VERSION: "1"
  SEMVER_VERSION: 1.5.1
  SUFFIX: ""
  VERSION: 1.5.1-r0
contents:
  repositories:
    - https://dhi.io/apk/alpine/v3.24/main
    - https://dl-cdn.alpinelinux.org/alpine/v3.24/main
    - https://dl-cdn.alpinelinux.org/alpine/v3.24/community
  keyring:
    - https://dhi.io/keyring/dhi-apk@docker-0F81AD7700D99184.rsa.pub
  packages:
    - alpine-baselayout-data
    - ca-certificates-bundle
    - icingadb-1.5=1.5.1-r0
    - tzdata
accounts:
  run-as: nonroot
  users:
    - name: nonroot
      uid: 65532
      gid: 65532
  groups:
    - name: nonroot
      gid: 65532
      members:
        - nonroot
os-release:
  name: Docker Hardened Images (Alpine)
  id: alpine
  version-id: "3.24"
  pretty-name: Docker Hardened Images/Alpine Linux v3.24
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
work-dir: /
paths:
  - type: symlink
    path: /icingadb
    uid: 0
    gid: 0
    source: /usr/sbin/icingadb
  - type: symlink
    path: /schema
    uid: 0
    gid: 0
    source: /usr/share/icingadb/schema
annotations:
  org.opencontainers.image.description: A minimal Icinga DB image
  org.opencontainers.image.licenses: GPL-2.0-only
cmd:
  - icingadb
  - --database-auto-import
