# syntax=dhi.io/build:2-debian13

name: LINSTOR GUI 2.x
image: dhi.io/linstor-gui
variant: runtime
tags:
  - "2"
  - "2.5"
  - 2.5.0
  - 2-debian
  - 2-debian13
  - 2.5-debian
  - 2.5-debian13
  - 2.5.0-debian
  - 2.5.0-debian13
platforms:
  - linux/amd64
  - linux/arm64
dates:
  release: "2025-11-21"
vars:
  SEMVER_MAJOR_MINOR_VERSION: "2.5"
  SEMVER_MAJOR_VERSION: "2"
  SEMVER_VERSION: 2.5.0
  VERSION: 2.5.0-1
contents:
  repositories:
    - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
  keyring:
    - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
  packages:
    - '!libelogind0'
    - '!mawk'
    - '!original-awk'
    - base-files
    - libc6
    - libcrypt1
    - libpcre2-8-0
    - libssl3t64
    - linstor-gui-2=2.5.0-1
    - nginx-mainline
    - zlib1g
accounts:
  run-as: nginx
  users:
    - name: nginx
      uid: 65532
      gid: 65532
  groups:
    - name: nginx
      gid: 65532
      members:
        - nginx
    - name: www-data
      gid: 82
os-release:
  name: Docker Hardened Images (Debian)
  id: debian
  version-id: "13"
  version-codename: trixie
  pretty-name: Docker Hardened Images/Debian GNU/Linux 13 (trixie)
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
paths:
  - type: delete
    path: /usr/share/nginx/html
    uid: 0
    gid: 0
  - type: symlink
    path: /usr/share/nginx/html
    uid: 0
    gid: 0
    source: /usr/share/linstor-gui
  - type: file
    path: /etc/nginx/nginx.conf
    uid: 0
    gid: 0
    mode: "0644"
    source: image/linstor-gui/config/nginx.conf
  - type: directory
    path: /run
    uid: 65532
    gid: 65532
    mode: "0770"
  - type: directory
    path: /var/cache/nginx
    uid: 65532
    gid: 65532
    mode: "0770"
  - type: symlink
    path: /var/log/nginx/access.log
    uid: 0
    gid: 0
    source: /dev/stdout
  - type: symlink
    path: /var/log/nginx/error.log
    uid: 0
    gid: 0
    source: /dev/stderr
annotations:
  org.opencontainers.image.description: A minimal LINSTOR GUI image
  org.opencontainers.image.licenses: GPL-3.0
entrypoint:
  - nginx
cmd:
  - -g
  - daemon off;
ports:
  - 8000/tcp
