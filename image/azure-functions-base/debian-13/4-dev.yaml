# syntax=dhi.io/build:2-debian13

name: Azure Functions 4.x host (dev)
image: dhi.io/azure-functions-base
variant: dev
tags:
  - 4-dev
  - 4.1055-dev
  - 4-debian-dev
  - 4-debian13-dev
  - 4.1055.100-dev
  - 4.1055-debian-dev
  - 4.1055-debian13-dev
  - 4.1055.100-debian-dev
  - 4.1055.100-debian13-dev
platforms:
  - linux/amd64
dates:
  release: "2021-10-26"
vars:
  DOTNET_10_VERSION: 10.0.403-0
  DOTNET_RUNTIME_VERSION: 10.0.14
  SEMVER_MAJOR_MINOR_VERSION: "4.1055"
  SEMVER_MAJOR_VERSION: "4"
  SEMVER_VERSION: 4.1055.100
  VERSION: 4.1055.100-5
contents:
  repositories:
    - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
  keyring:
    - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
  packages:
    - '!gawk'
    - '!libelogind0'
    - '!original-awk'
    - apt
    - azure-functions-base-4=4.1055.100-5
    - base-files
    - bash
    - ca-certificates
    - ca-certificates-bundle
    - coreutils
    - diffutils
    - dpkg
    - findutils
    - grep
    - libc-bin
    - libc6
    - libgcc-s1
    - libgssapi-krb5-2
    - libicu76
    - libssl3t64
    - libstdc++6
    - mawk
    - perl-base
    - sed
    - tzdata
    - util-linux
    - zlib1g
  builds:
    - name: dotnet-runtime-sbom
      contents:
        packages:
          - bash
          - coreutils
      pipeline:
        - name: spdx netcore runtime
          uses: spdx@v1
          with:
            license: MIT
            name: microsoft.netcore.app.runtime.linux-x64
            purl: pkg:nuget/microsoft.netcore.app.runtime.linux-x64@10.0.14
            version: 10.0.14
        - name: spdx aspnetcore runtime
          uses: spdx@v1
          with:
            license: MIT
            name: microsoft.aspnetcore.app.runtime.linux-x64
            purl: pkg:nuget/microsoft.aspnetcore.app.runtime.linux-x64@10.0.14
            version: 10.0.14
      outputs:
        - source: /opt/docker/sbom/microsoft.netcore.app.runtime.linux-x64
          target: /opt/docker/sbom/microsoft.netcore.app.runtime.linux-x64
          uid: 0
          gid: 0
        - source: /opt/docker/sbom/microsoft.aspnetcore.app.runtime.linux-x64
          target: /opt/docker/sbom/microsoft.aspnetcore.app.runtime.linux-x64
          uid: 0
          gid: 0
    - name: locale
      contents:
        packages:
          - bash
          - locales
          - coreutils
          - gzip
      pipeline:
        - name: install locales
          runs: |
            set -eux -o pipefail

            ln -s /etc/locale.alias /usr/share/locale/locale.alias

            echo "en_US.UTF-8 UTF-8" >> /etc/locale.gen
            locale-gen en_US.UTF-8
      outputs:
        - source: /usr/share/locale
          target: /usr/share/locale
          uid: 0
          gid: 0
        - source: /usr/lib/locale
          target: /usr/lib/locale
          uid: 0
          gid: 0
accounts:
  root: true
  run-as: root
  users:
    - name: nonroot
      uid: 65532
      gid: 65532
    - name: _apt
      uid: 42
      gid: 65532
  groups:
    - name: nonroot
      gid: 65532
      members:
        - nonroot
os-release:
  name: Docker Hardened Images (Debian)
  id: debian
  version-id: "13"
  version-codename: trixie
  pretty-name: Docker Hardened Images/Debian GNU/Linux 13 (trixie)
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
environment:
  ASPNETCORE_CONTENTROOT: /azure-functions-host
  ASPNETCORE_URLS: http://+:80
  AzureFunctionsJobHost__Logging__Console__IsEnabled: "true"
  AzureWebJobsScriptRoot: /home/site/wwwroot
  DEBIAN_FRONTEND: noninteractive
  DOTNET_RUNNING_IN_CONTAINER: "true"
  DOTNET_USE_POLLING_FILE_WATCHER: "true"
  FUNCTIONS_WORKER_RUNTIME: dotnet
  LANG: en_US.UTF-8
  LANGUAGE: en_US:en
  LC_ALL: en_US.UTF-8
paths:
  - type: symlink
    path: /azure-functions-host
    uid: 0
    gid: 0
    source: /usr/share/azure-functions-host
  - type: symlink
    path: /FuncExtensionBundles
    uid: 0
    gid: 0
    source: /usr/share/FuncExtensionBundles
  - type: directory
    path: /home/site/wwwroot
    uid: 0
    gid: 0
    mode: "0755"
  - type: symlink
    path: /home/nonroot/site
    uid: 0
    gid: 0
    source: /home/site
  - type: symlink
    path: /root/site
    uid: 0
    gid: 0
    source: /home/site
annotations:
  org.opencontainers.image.description: A minimal Azure Functions host image
  org.opencontainers.image.licenses: MIT
entrypoint:
  - /azure-functions-host/Microsoft.Azure.WebJobs.Script.WebHost
