# syntax=dhi.io/build:2-debian13

name: KEDA Admission Webhooks 2.21.x (dev)
image: dhi.io/keda-admission-webhooks
variant: dev
tags:
  - 2-dev
  - 2.21-dev
  - 2.21.1-dev
  - 2-debian-dev
  - 2-debian13-dev
  - 2.21-debian-dev
  - 2.21-debian13-dev
  - 2.21.1-debian-dev
  - 2.21.1-debian13-dev
platforms:
  - linux/amd64
  - linux/arm64
dates:
  release: "2026-09-23"
vars:
  DEBIAN_EPOCH_MAJOR_MINOR_VERSION: "2.21"
  DEBIAN_EPOCH_MAJOR_VERSION: "2"
  DEBIAN_EPOCH_VERSION: 2.21.1
  FLAVORED_SUFFIX: -dev
  PACKAGE_NAME: keda-admission-webhooks-2.21
  SEMVER_MAJOR_MINOR_VERSION: "2.21"
  SEMVER_MAJOR_VERSION: "2"
  SEMVER_VERSION: 2.21.1
  SUFFIX: -dev
  VERSION: 2.21.1-2
contents:
  repositories:
    - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
  keyring:
    - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
  packages:
    - '!gawk'
    - '!libelogind0'
    - '!original-awk'
    - apt
    - base-files
    - bash
    - ca-certificates
    - ca-certificates-bundle
    - coreutils
    - diffutils
    - dpkg
    - findutils
    - grep
    - keda-admission-webhooks-2.21-dev=2.21.1-2
    - libc-bin
    - mawk
    - perl-base
    - sed
    - tzdata
    - util-linux
  builds:
    - name: sbom
      contents:
        packages:
          - bash
          - coreutils
      pipeline:
        - uses: spdx@v1
          with:
            license: Apache-2.0
            name: keda-admission-webhooks
            purl: pkg:dhi/keda-admission-webhooks@2.21.1
            version: 2.21.1
      outputs:
        - source: /opt/docker/sbom/keda-admission-webhooks
          target: /opt/docker/sbom/keda-admission-webhooks
          uid: 0
          gid: 0
accounts:
  root: true
  run-as: root
  users:
    - name: nonroot
      uid: 65532
      gid: 65532
    - name: _apt
      uid: 42
      gid: 65532
  groups:
    - name: nonroot
      gid: 65532
      members:
        - nonroot
os-release:
  name: Docker Hardened Images (Debian)
  id: debian
  version-id: "13"
  version-codename: trixie
  pretty-name: Docker Hardened Images/Debian GNU/Linux 13 (trixie)
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
environment:
  DEBIAN_FRONTEND: noninteractive
paths:
  - type: symlink
    path: /keda-admission-webhooks
    uid: 0
    gid: 0
    source: /usr/bin/keda-admission-webhooks
annotations:
  org.opencontainers.image.description: A minimal KEDA Admission Webhooks image
  org.opencontainers.image.licenses: Apache-2.0
entrypoint:
  - /keda-admission-webhooks
  - --zap-log-level=info
  - --zap-encoder=console
