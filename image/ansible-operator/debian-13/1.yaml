# syntax=dhi.io/build:2-debian13

name: Ansible Operator 1.x
image: dhi.io/ansible-operator
variant: runtime
tags:
  - "1"
  - "1.42"
  - 1.42.3
  - 1-debian
  - 1-debian13
  - 1.42-debian
  - 1.42-debian13
  - 1.42.3-debian
  - 1.42.3-debian13
platforms:
  - linux/amd64
  - linux/arm64
dates:
  release: "2023-09-26"
vars:
  ANSIBLE_RUNTIME_VERSION: 1.42.3-3
  FLAVORED_SUFFIX: ""
  PYTHON_MAJOR_MINOR_VERSION: "3.12"
  SEMVER_MAJOR_MINOR_VERSION: "1.42"
  SEMVER_MAJOR_VERSION: "1"
  SEMVER_VERSION: 1.42.3
  SUFFIX: ""
  VERSION: 1.42.3-6
contents:
  repositories:
    - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
  keyring:
    - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
  packages:
    - ansible-operator-runtime=1.42.3-3
    - ansible-operator=1.42.3-6
    - base-files
    - ca-certificates-bundle
    - coreutils
    - dash
    - libc-bin
    - libffi8
    - libpython-3.12-stdlib
    - libssl3t64
    - python-3.12-minimal
    - tini
    - tzdata
  builds:
    - name: ansible-home
      contents:
        packages:
          - bash
          - coreutils
      pipeline:
        - name: create the ansible home
          runs: |
            set -eux -o pipefail

            install -d -o 1001 -g 0 -m 0775 \
              ${target.dir}/opt/ansible \
              ${target.dir}/opt/ansible/.ansible \
              ${target.dir}/opt/ansible/.ansible/tmp
      outputs:
        - source: ${target.dir}/opt
          target: /opt
          uid: 0
          gid: 0
accounts:
  run-as: ansible
  users:
    - name: ansible
      uid: 1001
      gid: 0
  groups:
    - name: nonroot
      gid: 65532
      members:
        - nonroot
os-release:
  name: Docker Hardened Images (Debian)
  id: debian
  version-id: "13"
  version-codename: trixie
  pretty-name: Docker Hardened Images/Debian GNU/Linux 13 (trixie)
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
work-dir: /opt/ansible
environment:
  HOME: /opt/ansible
  LANG: C.UTF-8
  LC_ALL: C.UTF-8
  PYTHONPATH: /usr/lib/ansible-operator-runtime/lib/python3.12/site-packages
  SSL_CERT_FILE: /etc/ssl/certs/ca-certificates.crt
  USER_NAME: ansible
  USER_UID: "1001"
paths:
  - type: file
    path: /etc/ansible/ansible.cfg
    uid: 0
    gid: 0
    mode: "0644"
    source: image/ansible-operator/config/ansible.cfg
  - type: file
    path: /etc/ansible/hosts
    uid: 0
    gid: 0
    mode: "0644"
    source: image/ansible-operator/config/hosts
  - type: directory
    path: /usr/local/bin
    uid: 0
    gid: 0
    mode: "0755"
  - type: symlink
    path: /usr/local/bin/ansible-operator
    uid: 0
    gid: 0
    source: /usr/bin/ansible-operator
  - type: symlink
    path: /usr/local/bin/ansible
    uid: 0
    gid: 0
    source: /usr/bin/ansible
  - type: symlink
    path: /usr/local/bin/ansible-config
    uid: 0
    gid: 0
    source: /usr/bin/ansible-config
  - type: symlink
    path: /usr/local/bin/ansible-console
    uid: 0
    gid: 0
    source: /usr/bin/ansible-console
  - type: symlink
    path: /usr/local/bin/ansible-doc
    uid: 0
    gid: 0
    source: /usr/bin/ansible-doc
  - type: symlink
    path: /usr/local/bin/ansible-galaxy
    uid: 0
    gid: 0
    source: /usr/bin/ansible-galaxy
  - type: symlink
    path: /usr/local/bin/ansible-inventory
    uid: 0
    gid: 0
    source: /usr/bin/ansible-inventory
  - type: symlink
    path: /usr/local/bin/ansible-playbook
    uid: 0
    gid: 0
    source: /usr/bin/ansible-playbook
  - type: symlink
    path: /usr/local/bin/ansible-pull
    uid: 0
    gid: 0
    source: /usr/bin/ansible-pull
  - type: symlink
    path: /usr/local/bin/ansible-vault
    uid: 0
    gid: 0
    source: /usr/bin/ansible-vault
  - type: symlink
    path: /usr/local/bin/ansible-runner
    uid: 0
    gid: 0
    source: /usr/bin/ansible-runner
  - type: symlink
    path: /usr/local/bin/python3
    uid: 0
    gid: 0
    source: /usr/bin/python3.12
  - type: symlink
    path: /tini
    uid: 0
    gid: 0
    source: /usr/bin/tini
annotations:
  org.opencontainers.image.description: A minimal Ansible Operator base image
  org.opencontainers.image.licenses: Apache-2.0
entrypoint:
  - /tini
  - --
  - /usr/local/bin/ansible-operator
  - run
  - --watches-file=./watches.yaml
ports:
  - 6789/tcp
  - 8443/tcp
