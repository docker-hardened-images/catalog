# syntax=dhi.io/build:2-alpine3.24

name: Ansible Operator 1.x
image: dhi.io/ansible-operator
variant: runtime
tags:
  - 1-alpine
  - 1.42-alpine
  - 1-alpine3.24
  - 1.42.3-alpine
  - 1.42-alpine3.24
  - 1.42.3-alpine3.24
platforms:
  - linux/amd64
  - linux/arm64
dates:
  release: "2023-09-26"
vars:
  ANSIBLE_RUNTIME_VERSION: 1.42.3-r3
  FLAVORED_SUFFIX: ""
  PYTHON_MAJOR_MINOR_VERSION: "3.12"
  SEMVER_MAJOR_MINOR_VERSION: "1.42"
  SEMVER_MAJOR_VERSION: "1"
  SEMVER_VERSION: 1.42.3
  SUFFIX: ""
  VERSION: 1.42.3-r6
contents:
  repositories:
    - https://dhi.io/apk/alpine/v3.24/main
    - https://dl-cdn.alpinelinux.org/alpine/v3.24/main
    - https://dl-cdn.alpinelinux.org/alpine/v3.24/community
  keyring:
    - https://dhi.io/keyring/dhi-apk@docker-0F81AD7700D99184.rsa.pub
  packages:
    - alpine-baselayout-data
    - ansible-operator-runtime=1.42.3-r3
    - ansible-operator=1.42.3-r6
    - busybox
    - ca-certificates-bundle
    - libcrypto3
    - libffi
    - libssl3
    - python-3.12
    - tini
    - tzdata
  builds:
    - name: ansible-home
      contents:
        packages:
          - bash
          - busybox
      pipeline:
        - name: create the ansible home
          runs: |
            set -eux -o pipefail

            install -d -o 1001 -g 0 -m 0775 \
              ${target.dir}/opt/ansible \
              ${target.dir}/opt/ansible/.ansible \
              ${target.dir}/opt/ansible/.ansible/tmp
      outputs:
        - source: ${target.dir}/opt
          target: /opt
          uid: 0
          gid: 0
accounts:
  run-as: ansible
  users:
    - name: ansible
      uid: 1001
      gid: 0
  groups:
    - name: nonroot
      gid: 65532
      members:
        - nonroot
os-release:
  name: Docker Hardened Images (Alpine)
  id: alpine
  version-id: "3.24"
  pretty-name: Docker Hardened Images/Alpine Linux v3.24
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
work-dir: /opt/ansible
environment:
  HOME: /opt/ansible
  LANG: C.UTF-8
  LC_ALL: C.UTF-8
  PYTHONPATH: /usr/lib/ansible-operator-runtime/lib/python3.12/site-packages
  SSL_CERT_FILE: /etc/ssl/certs/ca-certificates.crt
  USER_NAME: ansible
  USER_UID: "1001"
paths:
  - type: file
    path: /etc/ansible/ansible.cfg
    uid: 0
    gid: 0
    mode: "0644"
    source: image/ansible-operator/config/ansible.cfg
  - type: file
    path: /etc/ansible/hosts
    uid: 0
    gid: 0
    mode: "0644"
    source: image/ansible-operator/config/hosts
  - type: directory
    path: /usr/local/bin
    uid: 0
    gid: 0
    mode: "0755"
  - type: symlink
    path: /usr/local/bin/ansible-operator
    uid: 0
    gid: 0
    source: /usr/bin/ansible-operator
  - type: symlink
    path: /usr/local/bin/ansible
    uid: 0
    gid: 0
    source: /usr/bin/ansible
  - type: symlink
    path: /usr/local/bin/ansible-config
    uid: 0
    gid: 0
    source: /usr/bin/ansible-config
  - type: symlink
    path: /usr/local/bin/ansible-console
    uid: 0
    gid: 0
    source: /usr/bin/ansible-console
  - type: symlink
    path: /usr/local/bin/ansible-doc
    uid: 0
    gid: 0
    source: /usr/bin/ansible-doc
  - type: symlink
    path: /usr/local/bin/ansible-galaxy
    uid: 0
    gid: 0
    source: /usr/bin/ansible-galaxy
  - type: symlink
    path: /usr/local/bin/ansible-inventory
    uid: 0
    gid: 0
    source: /usr/bin/ansible-inventory
  - type: symlink
    path: /usr/local/bin/ansible-playbook
    uid: 0
    gid: 0
    source: /usr/bin/ansible-playbook
  - type: symlink
    path: /usr/local/bin/ansible-pull
    uid: 0
    gid: 0
    source: /usr/bin/ansible-pull
  - type: symlink
    path: /usr/local/bin/ansible-vault
    uid: 0
    gid: 0
    source: /usr/bin/ansible-vault
  - type: symlink
    path: /usr/local/bin/ansible-runner
    uid: 0
    gid: 0
    source: /usr/bin/ansible-runner
  - type: symlink
    path: /usr/local/bin/python3
    uid: 0
    gid: 0
    source: /usr/bin/python3.12
  - type: symlink
    path: /tini
    uid: 0
    gid: 0
    source: /sbin/tini
annotations:
  org.opencontainers.image.description: A minimal Ansible Operator base image
  org.opencontainers.image.licenses: Apache-2.0
entrypoint:
  - /tini
  - --
  - /usr/local/bin/ansible-operator
  - run
  - --watches-file=./watches.yaml
ports:
  - 6789/tcp
  - 8443/tcp
