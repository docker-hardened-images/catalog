# syntax=dhi.io/build:2-debian13

name: Secrets Store CSI Driver CRDs 1.6.x
image: dhi.io/secrets-store-csi-driver-crds
variant: runtime
tags:
  - "1"
  - "1.6"
  - 1.6.0
  - 1-debian
  - 1-debian13
  - 1.6-debian
  - 1.6-debian13
  - 1.6.0-debian
  - 1.6.0-debian13
platforms:
  - linux/amd64
  - linux/arm64
dates:
  release: "2021-10-14"
vars:
  COMMIT_SHA: 4960f9637c51ad9cb9ef264481bc6d9a98bf1f1c
  FLAVORED_SUFFIX: ""
  KUBECTL_VERSION: 1.36.4-6
  SEMVER_MAJOR_MINOR_VERSION: "1.6"
  SEMVER_MAJOR_VERSION: "1"
  SEMVER_VERSION: 1.6.0
  SUFFIX: ""
  VERSION: 1.6.0
contents:
  repositories:
    - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
  keyring:
    - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
  packages:
    - base-files
    - ca-certificates-bundle
    - kubectl-1.36=1.36.4-6
    - tzdata
  builds:
    - name: secrets-store-csi-driver-crds
      work-dir: ${source.dir}/secrets-store-csi-driver
      contents:
        packages:
          - bash
          - coreutils
        files:
          - url: git+https://github.com/kubernetes-sigs/secrets-store-csi-driver.git#v1.6.0
            checksum: 4960f9637c51ad9cb9ef264481bc6d9a98bf1f1c
            path: ${source.dir}/secrets-store-csi-driver
            spdx:
              name: secrets-store-csi-driver-crds
              version: 1.6.0
              packages:
                - name: secrets-store-csi-driver-crds
                  purl: pkg:github/kubernetes-sigs/secrets-store-csi-driver@1.6.0
                  license: Apache-2.0
            uid: 0
            gid: 0
      pipeline:
        - name: copy crds
          runs: |
            set -eux -o pipefail

            cp -R charts/secrets-store-csi-driver/crds/ ${target.dir}/crds
      outputs:
        - source: ${target.dir}/crds
          target: /crds
          uid: 0
          gid: 0
        - source: /opt/docker/sbom/secrets-store-csi-driver-crds
          target: /opt/docker/sbom/secrets-store-csi-driver-crds
          uid: 0
          gid: 0
accounts:
  run-as: nonroot
  users:
    - name: nonroot
      uid: 65532
      gid: 65532
  groups:
    - name: nonroot
      gid: 65532
      members:
        - nonroot
os-release:
  name: Docker Hardened Images (Debian)
  id: debian
  version-id: "13"
  version-codename: trixie
  pretty-name: Docker Hardened Images/Debian GNU/Linux 13 (trixie)
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
paths:
  - type: symlink
    path: /kubectl
    uid: 0
    gid: 0
    source: /usr/bin/kubectl
annotations:
  org.opencontainers.image.description: A minimal Secrets Store CSI Driver CRDs image
  org.opencontainers.image.licenses: Apache-2.0
entrypoint:
  - kubectl
cmd:
  - --help
