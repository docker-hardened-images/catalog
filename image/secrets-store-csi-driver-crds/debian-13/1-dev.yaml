# syntax=dhi.io/build:2-debian13

name: Secrets Store CSI Driver CRDs 1.6.x (dev)
image: dhi.io/secrets-store-csi-driver-crds
variant: dev
tags:
  - 1-dev
  - 1.6-dev
  - 1.6.1-dev
  - 1-debian-dev
  - 1-debian13-dev
  - 1.6-debian-dev
  - 1.6-debian13-dev
  - 1.6.1-debian-dev
  - 1.6.1-debian13-dev
platforms:
  - linux/amd64
  - linux/arm64
dates:
  release: "2021-10-14"
vars:
  COMMIT_SHA: 0e4ceeb734246e1de5267d8968023a3c8dcff39a
  FLAVORED_SUFFIX: -dev
  KUBECTL_VERSION: 1.36.4-6
  SEMVER_MAJOR_MINOR_VERSION: "1.6"
  SEMVER_MAJOR_VERSION: "1"
  SEMVER_VERSION: 1.6.1
  SUFFIX: -dev
  VERSION: 1.6.1
contents:
  repositories:
    - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
  keyring:
    - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
  packages:
    - '!gawk'
    - '!libelogind0'
    - '!original-awk'
    - apt
    - base-files
    - bash
    - ca-certificates
    - ca-certificates-bundle
    - coreutils
    - diffutils
    - dpkg
    - findutils
    - grep
    - kubectl-1.36-dev=1.36.4-6
    - libc-bin
    - mawk
    - perl-base
    - sed
    - tzdata
    - util-linux
  builds:
    - name: secrets-store-csi-driver-crds
      work-dir: ${source.dir}/secrets-store-csi-driver
      contents:
        packages:
          - bash
          - coreutils
        files:
          - url: git+https://github.com/kubernetes-sigs/secrets-store-csi-driver.git#v1.6.1
            checksum: 0e4ceeb734246e1de5267d8968023a3c8dcff39a
            path: ${source.dir}/secrets-store-csi-driver
            spdx:
              name: secrets-store-csi-driver-crds
              version: 1.6.1
              packages:
                - name: secrets-store-csi-driver-crds
                  purl: pkg:github/kubernetes-sigs/secrets-store-csi-driver@1.6.1
                  license: Apache-2.0
            uid: 0
            gid: 0
      pipeline:
        - name: copy crds
          runs: |
            set -eux -o pipefail

            cp -R charts/secrets-store-csi-driver/crds/ ${target.dir}/crds
      outputs:
        - source: ${target.dir}/crds
          target: /crds
          uid: 0
          gid: 0
        - source: /opt/docker/sbom/secrets-store-csi-driver-crds
          target: /opt/docker/sbom/secrets-store-csi-driver-crds
          uid: 0
          gid: 0
accounts:
  root: true
  run-as: root
  users:
    - name: nonroot
      uid: 65532
      gid: 65532
    - name: _apt
      uid: 42
      gid: 65532
  groups:
    - name: nonroot
      gid: 65532
      members:
        - nonroot
os-release:
  name: Docker Hardened Images (Debian)
  id: debian
  version-id: "13"
  version-codename: trixie
  pretty-name: Docker Hardened Images/Debian GNU/Linux 13 (trixie)
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
environment:
  DEBIAN_FRONTEND: noninteractive
paths:
  - type: symlink
    path: /kubectl
    uid: 0
    gid: 0
    source: /usr/bin/kubectl
annotations:
  org.opencontainers.image.description: A minimal Secrets Store CSI Driver CRDs image
  org.opencontainers.image.licenses: Apache-2.0
entrypoint:
  - kubectl
cmd:
  - --help
