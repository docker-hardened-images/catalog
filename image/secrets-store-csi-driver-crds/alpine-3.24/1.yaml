  FLAVORED_SUFFIX: ""
  KUBECTL_VERSION: 1.36.4-r6
  SEMVER_MAJOR_MINOR_VERSION: "1.6"
  SEMVER_MAJOR_VERSION: "1"
  SEMVER_VERSION: 1.6.1
  SUFFIX: ""
  VERSION: 1.6.1
contents:
  repositories:
    - https://dhi.io/apk/alpine/v3.24/main
    - https://dl-cdn.alpinelinux.org/alpine/v3.24/main
    - https://dl-cdn.alpinelinux.org/alpine/v3.24/community
  keyring:
    - https://dhi.io/keyring/dhi-apk@docker-0F81AD7700D99184.rsa.pub
  packages:
    - alpine-baselayout-data
    - ca-certificates-bundle
    - kubectl-1.36=1.36.4-r6
    - tzdata
  builds:
    - name: secrets-store-csi-driver-crds
      work-dir: ${source.dir}/secrets-store-csi-driver
      contents:
        packages:
          - bash
          - coreutils
        files:
          - url: git+https://github.com/kubernetes-sigs/secrets-store-csi-driver.git#v1.6.1
            checksum: 0e4ceeb734246e1de5267d8968023a3c8dcff39a
            path: ${source.dir}/secrets-store-csi-driver
            spdx:
              name: secrets-store-csi-driver-crds
              version: 1.6.1
              packages:
