# syntax=dhi.io/build:1-alpine3.22-dev

name: DHI Build 2.x (dev)
image: dhi.io/build
variant: dev
tags:
  - 2-alpine3.21
  - 2.26-alpine3.21
  - 2.26.2-alpine3.21
platforms:
  - linux/amd64
  - linux/arm64
vars:
  COMMIT_SHA: f0a50a32ae642a8978cb7c44b98358c917645321
  DHI_TAGS_OVERWRITE: "true"
  GOLANG_REFERENCE: dhi/golang:1.26.10-alpine3.22-dev@sha256:3e24cf39d3f8feb36b21a75b043b9615c37b501110269201a15133f646851c9a
  SEMVER_MAJOR_MINOR_VERSION: "2.26"
  SEMVER_MAJOR_VERSION: "2"
  SEMVER_VERSION: 2.26.2
  VERSION: 2.26.2
  YQ_COMMIT_SHA: c14f446382944492701b16c1ddb48bb9dbe683e3
  YQ_VERSION: 4.53.6
contents:
  repositories:
    - https://dl-cdn.alpinelinux.org/alpine/v3.21/main
    - https://dl-cdn.alpinelinux.org/alpine/v3.21/community
  packages:
    - alpine-baselayout-data
    - alpine-keys
    - apk-tools
    - bash
    - busybox
    - curl
    - gpg
    - jq
    - musl-utils
    - unzip
  builds:
    - name: frontend
      contents:
        repositories:
          - https://dl-cdn.alpinelinux.org/alpine/v3.21/main
          - https://dl-cdn.alpinelinux.org/alpine/v3.21/community
        packages:
          - busybox
          - ca-certificates-bundle
          - git
        files:
          - url: git+https://github.com/docker-hardened-images/frontend.git#v2.26.2
            checksum: f0a50a32ae642a8978cb7c44b98358c917645321
            path: /go/src/github.com/docker-hardened-images/frontend
            spdx:
              name: dhi-build
              version: 2.26.2
              packages:
                - name: dhi-build
                  purl: pkg:golang/github.com/docker-hardened-images/frontend@2.26.2
            uid: 0
            gid: 0
        artifacts:
          - name: dhi.io/golang:1.26.10-alpine3.22-dev@sha256:3e24cf39d3f8feb36b21a75b043b9615c37b501110269201a15133f646851c9a
            includes:
              - usr/local/go
            uid: 0
            gid: 0
      pipeline:
        - name: check out private cli-plugins module
          work-dir: /go/src/github.com/docker-hardened-images/frontend
          privileged: true
          secrets:
            - id: github_token
              env: GITHUB_TOKEN
          runs: |
            set -eux -o pipefail

            git config --system credential."https://github.com".helper \
              '!f() { printf "username=x-access-token\npassword=%s\n" "${GITHUB_TOKEN}"; }; f'

            module=github.com/docker-hardened-images/cli-plugins
            target=/go/src/${module}

            version=$(awk -v m="${module}" '$1 == m { print $2; exit }' go.mod)
            [ -n "${version}" ]

            ref=${version}
            if awk -v v="${version}" 'END { exit(match(v, /[0-9]{14}-[0-9a-f]{12}$/) ? 0 : 1) }'; then
              ref=${version##*-}
            fi

            git clone "https://${module}.git" "${target}"
            git -C "${target}" checkout --detach "${ref}"
            rm -rf "${target}/.git"

            go mod edit -replace "${module}=${target}"
        - name: remediate
          work-dir: /go/src/github.com/docker-hardened-images/frontend
          privileged: true
          environment:
            PATH: /usr/local/go/bin:$PATH
          runs: |
            set -eux -o pipefail

            go get github.com/containerd/containerd/v2@v2.3.6 # CVE-2026-53488 CVE-2026-53489 CVE-2026-53492 CVE-2026-53493 CVE-2026-53495
            go get golang.org/x/net@v0.60.0                   # CVE-2026-78659 CVE-2026-78660 CVE-2026-78663 CVE-2026-78669 CVE-2026-97032

            go mod tidy
            go mod vendor
        - name: compile
          work-dir: /go/src/github.com/docker-hardened-images/frontend
          environment:
            PATH: /usr/local/go/bin:$PATH
          runs: |
            set -eux -o pipefail

            go build --ldflags="-s -w" -o "${target.dir}/bin/dhi-build" ./cmd/dhi-build
      outputs:
        - source: ${target.dir}/bin/dhi-build
          target: /opt/docker/dhi/build
          uid: 0
          gid: 0
          mode: "0744"
        - source: /opt/docker/sbom/dhi-build
          target: /opt/docker/sbom/dhi-build
          uid: 0
          gid: 0
    - name: yq
      contents:
        repositories:
          - https://dl-cdn.alpinelinux.org/alpine/v3.21/main
          - https://dl-cdn.alpinelinux.org/alpine/v3.21/community
        packages:
          - busybox
          - ca-certificates-bundle
          - git
        files:
          - url: git+https://github.com/mikefarah/yq.git#v4.53.6
            checksum: c14f446382944492701b16c1ddb48bb9dbe683e3
            path: /go/src/github.com/mikefarah/yq
            spdx:
              name: yq
              version: 4.53.6
              packages:
                - name: yq
                  purl: pkg:golang/github.com/mikefarah/yq/v4@4.53.6
                  license: MIT
            uid: 0
            gid: 0
        artifacts:
          - name: dhi.io/golang:1.26.10-alpine3.22-dev@sha256:3e24cf39d3f8feb36b21a75b043b9615c37b501110269201a15133f646851c9a
            includes:
              - usr/local/go
            uid: 0
            gid: 0
      pipeline:
        - name: vendor yq modules
          work-dir: /go/src/github.com/mikefarah/yq
          privileged: true
          environment:
            PATH: /usr/local/go/bin:$PATH
          runs: |
            set -eux -o pipefail

            go mod vendor
        - name: compile yq
          work-dir: /go/src/github.com/mikefarah/yq
          environment:
            PATH: /usr/local/go/bin:$PATH
          runs: |
            set -eux -o pipefail

            CGO_ENABLED=0 go build -mod=vendor -trimpath \
              -ldflags="-s -w -X main.Version=4.53.6" \
              -o "${target.dir}/bin/yq" .
      outputs:
        - source: ${target.dir}/bin/yq
          target: /opt/docker/dhi/yq
          uid: 0
          gid: 0
          mode: "0744"
        - source: /opt/docker/sbom/yq
          target: /opt/docker/sbom/yq
          uid: 0
          gid: 0
accounts:
  root: true
  run-as: root
  users:
    - name: nonroot
      uid: 65532
      gid: 65532
  groups:
    - name: nonroot
      gid: 65532
      members:
        - nonroot
os-release:
  name: Docker Hardened Images (Alpine)
  id: alpine
  version-id: "3.21"
  pretty-name: Docker Hardened Images/Alpine Linux v3.21
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
environment:
  DHI_BUILD_TYPE: alpine
annotations:
  org.opencontainers.image.description: DHI Build
labels:
  moby.buildkit.frontend.caps: moby.buildkit.frontend.contexts,moby.buildkit.frontend.inputs
  moby.buildkit.frontend.network.none: "true"
entrypoint:
  - /opt/docker/dhi/build
