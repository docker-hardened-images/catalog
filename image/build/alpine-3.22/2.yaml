# syntax=dhi.io/build:2-alpine3.22

name: DHI Build 2.x (dev)
image: dhi.io/build
variant: dev
tags:
  - 2-alpine3.22
  - 2.25-alpine3.22
  - 2.25.2-alpine3.22
platforms:
  - linux/amd64
  - linux/arm64
vars:
  COMMIT_SHA: e4e4b628397629dbf01fba18e3f408b285b9c6a6
  DHI_TAGS_OVERWRITE: "true"
  GOLANG_REFERENCE: dhi/golang:1.26.8-alpine3.22-dev@sha256:ff89b772369e8a26540d8de16c9c9aba39402daa9c07239c6bb374d382bc6e97
  SEMVER_MAJOR_MINOR_VERSION: "2.25"
  SEMVER_MAJOR_VERSION: "2"
  SEMVER_VERSION: 2.25.2
  VERSION: 2.25.2
contents:
  repositories:
    - https://dl-cdn.alpinelinux.org/alpine/v3.22/main
    - https://dl-cdn.alpinelinux.org/alpine/v3.22/community
  packages:
    - alpine-baselayout-data
    - alpine-keys
    - apk-tools
    - bash
    - busybox
    - curl
    - gpg
    - jq
    - musl-utils
    - unzip
  builds:
    - name: frontend
      contents:
        repositories:
          - https://dl-cdn.alpinelinux.org/alpine/v3.22/main
          - https://dl-cdn.alpinelinux.org/alpine/v3.22/community
        packages:
          - busybox
          - ca-certificates-bundle
          - git
        files:
          - url: git+https://github.com/docker-hardened-images/frontend.git#v2.25.2
            checksum: e4e4b628397629dbf01fba18e3f408b285b9c6a6
            path: /go/src/github.com/docker-hardened-images/frontend
            spdx:
              name: dhi-build
              version: 2.25.2
              packages:
                - name: dhi-build
                  purl: pkg:golang/github.com/docker-hardened-images/frontend@2.25.2
            uid: 0
            gid: 0
        artifacts:
          - name: dhi.io/golang:1.26.8-alpine3.22-dev@sha256:ff89b772369e8a26540d8de16c9c9aba39402daa9c07239c6bb374d382bc6e97
            includes:
              - usr/local/go
            uid: 0
            gid: 0
      pipeline:
        - name: check out private cli-plugins module
          work-dir: /go/src/github.com/docker-hardened-images/frontend
          privileged: true
          secrets:
            - id: github_token
              env: GITHUB_TOKEN
          runs: |
            set -eux -o pipefail

            git config --system credential."https://github.com".helper \
              '!f() { printf "username=x-access-token\npassword=%s\n" "${GITHUB_TOKEN}"; }; f'

            module=github.com/docker-hardened-images/cli-plugins
            target=/go/src/${module}

            version=$(awk -v m="${module}" '$1 == m { print $2; exit }' go.mod)
            [ -n "${version}" ]

            ref=${version}
            if awk -v v="${version}" 'END { exit(match(v, /[0-9]{14}-[0-9a-f]{12}$/) ? 0 : 1) }'; then
              ref=${version##*-}
            fi

            git clone "https://${module}.git" "${target}"
            git -C "${target}" checkout --detach "${ref}"
            rm -rf "${target}/.git"

            go mod edit -replace "${module}=${target}"
        - name: remediate
          work-dir: /go/src/github.com/docker-hardened-images/frontend
          privileged: true
          environment:
            PATH: /usr/local/go/bin:$PATH
          runs: |
            set -eux -o pipefail

            go get github.com/containerd/containerd/v2@v2.3.5 # CVE-2026-53488 CVE-2026-53489 CVE-2026-53492 CVE-2026-53495

            go mod tidy
            go mod vendor
        - name: compile
          work-dir: /go/src/github.com/docker-hardened-images/frontend
          environment:
            PATH: /usr/local/go/bin:$PATH
          runs: |
            set -eux -o pipefail

            go build --ldflags="-s -w" -o "${target.dir}/bin/dhi-build" ./cmd/dhi-build
      outputs:
        - source: ${target.dir}/bin/dhi-build
          target: /opt/docker/dhi/build
          uid: 0
          gid: 0
          mode: "0744"
        - source: /opt/docker/sbom/dhi-build
          target: /opt/docker/sbom/dhi-build
          uid: 0
          gid: 0
accounts:
  root: true
  run-as: root
  users:
    - name: nonroot
      uid: 65532
      gid: 65532
  groups:
    - name: nonroot
      gid: 65532
      members:
        - nonroot
os-release:
  name: Docker Hardened Images (Alpine)
  id: alpine
  version-id: "3.22"
  pretty-name: Docker Hardened Images/Alpine Linux v3.22
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
environment:
  DHI_BUILD_TYPE: alpine
annotations:
  org.opencontainers.image.description: DHI Build
labels:
  moby.buildkit.frontend.caps: moby.buildkit.frontend.contexts,moby.buildkit.frontend.inputs
  moby.buildkit.frontend.network.none: "true"
entrypoint:
  - /opt/docker/dhi/build
