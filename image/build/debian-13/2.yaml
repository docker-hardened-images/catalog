# syntax=dhi.io/build:2-debian13

name: DHI Build 2.x (dev)
image: dhi.io/build
variant: dev
tags:
  - 2-helm3
  - 2-debian13
  - 2.29-helm3
  - 2.29.0-helm3
  - 2.29-debian13
  - 2.29.0-debian13
platforms:
  - linux/amd64
  - linux/arm64
vars:
  BINUTILS_ARCH: '#{ target.arch == "amd64" ? "x86-64" : "aarch64" }'
  DHI_TAGS_OVERWRITE: "true"
  SEMVER_MAJOR_MINOR_VERSION: "2.29"
  SEMVER_MAJOR_VERSION: "2"
  SEMVER_VERSION: 2.29.0
  VERSION: 2.29.0-0
contents:
  repositories:
    - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
  keyring:
    - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
  packages:
    - '!binutils'
    - '!binutils-aarch64-linux-gnu'
    - '!binutils-common'
    - '!binutils-x86-64-linux-gnu'
    - '!gawk'
    - '!libbinutils'
    - '!libctf-nobfd0'
    - '!libctf0'
    - '!libelogind0'
    - '!libgprofng0'
    - '!libsframe1'
    - '!libxml2'
    - '!original-awk'
    - apt
    - base-files
    - bash
    - binutils-latest
    - binutils-latest-${BINUTILS_ARCH}-linux-gnu
    - build=2.29.0-0
    - ca-certificates
    - coreutils
    - curl
    - diffutils
    - dpkg
    - equivs
    - findutils
    - gpg
    - grep
    - jq
    - libc-bin
    - libctf-nobfd0-latest
    - libctf0-latest
    - libgprofng0-latest
    - mawk
    - perl-base
    - sed
    - unzip
    - util-linux
  builds:
    - name: dhi-build sbom
      contents:
        packages:
          - bash
          - coreutils
      pipeline:
        - uses: spdx@v1
          with:
            license: NOASSERTION
            name: dhi-build
            purl: pkg:golang/github.com/docker-hardened-images/frontend@2.29.0
            version: 2.29.0
      outputs:
        - source: /opt/docker/sbom/dhi-build
          target: /opt/docker/sbom/dhi-build
          uid: 0
          gid: 0
    - name: add source to apt
      contents:
        packages:
          - bash
          - sed
      pipeline:
        - name: add source to apt
          runs: |
            set -eux -o pipefail

            sed -i 's/Types: deb/Types: deb deb-src/g' /etc/apt/sources.list.d/debian.sources
      outputs:
        - source: /etc/apt/sources.list.d/debian.sources
          target: /etc/apt/sources.list.d/debian.sources
          uid: 0
          gid: 0
          mode: "0644"
accounts:
  root: true
  run-as: root
  users:
    - name: nonroot
      uid: 65532
      gid: 65532
    - name: _apt
      uid: 42
      gid: 65532
  groups:
    - name: nonroot
      gid: 65532
      members:
        - nonroot
os-release:
  name: Docker Hardened Images (Debian)
  id: debian
  version-id: "13"
  version-codename: trixie
  pretty-name: Docker Hardened Images/Debian GNU/Linux 13 (trixie)
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
environment:
  DEBIAN_FRONTEND: noninteractive
  DHI_BUILD_TYPE: debian
paths:
  - type: directory
    path: /downloads
    uid: 0
    gid: 0
  - type: symlink
    path: /opt/docker/dhi/build
    uid: 0
    gid: 0
    source: /usr/bin/build
  - type: delete
    path: /etc/apt/sources.list.d/dhi.sources
    uid: 0
    gid: 0
  - type: delete
    path: /usr/share/keyrings/dhi-deb-main.gpg
    uid: 0
    gid: 0
annotations:
  org.opencontainers.image.description: DHI Build
labels:
  moby.buildkit.frontend.caps: moby.buildkit.frontend.contexts,moby.buildkit.frontend.inputs
  moby.buildkit.frontend.network.none: "true"
entrypoint:
  - /opt/docker/dhi/build
