# syntax=dhi.io/build:2-alpine3.24

name: Apache Flink 2.x (dev)
image: dhi.io/flink
variant: dev
tags:
  - 2-alpine-dev
  - 2.3-alpine-dev
  - 2-alpine3.24-dev
  - 2.3.0-alpine-dev
  - 2.3-alpine3.24-dev
  - 2.3.0-alpine3.24-dev
platforms:
  - linux/amd64
dates:
  release: "2026-07-10"
vars:
  JAVA_FIPS_SUFFIX: ""
  JAVA_HOME: /usr/lib/jvm/temurin-17
  JAVA_VARIANT: jdk
  JAVA_VERSION: 17.0.20.8.1.1-r2
  JDK_MAJOR_VERSION: "17"
  SEMVER_MAJOR_MINOR_VERSION: "2.3"
  SEMVER_MAJOR_VERSION: "2"
  SEMVER_VERSION: 2.3.0
  VERSION: 2.3.0-r1
contents:
  repositories:
    - https://dhi.io/apk/alpine/v3.24/main
    - https://dl-cdn.alpinelinux.org/alpine/v3.24/main
    - https://dl-cdn.alpinelinux.org/alpine/v3.24/community
  keyring:
    - https://dhi.io/keyring/dhi-apk@docker-0F81AD7700D99184.rsa.pub
  packages:
    - alpine-baselayout-data
    - apk-tools
    - bash
    - busybox
    - ca-certificates
    - ca-certificates-bundle
    - eclipse-temurin-17-jdk-oci-config=17.0.20.8.1.1-r2
    - eclipse-temurin-17-jdk=17.0.20.8.1.1-r2
    - findutils
    - flink=2.3.0-r1
    - gettext
    - grep
    - jemalloc
    - musl
    - procps
    - sed
    - snappy
    - tzdata
    - util-linux
accounts:
  root: true
  run-as: root
  users:
    - name: flink
      uid: 9999
      gid: 9999
  groups:
    - name: flink
      gid: 9999
os-release:
  name: Docker Hardened Images (Alpine)
  id: alpine
  version-id: "3.24"
  pretty-name: Docker Hardened Images/Alpine Linux v3.24
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
work-dir: /opt/flink
environment:
  DISABLE_JEMALLOC: "false"
  FLINK_HOME: /opt/flink
  JAVA_HOME: /usr/lib/jvm/temurin-17
  LANG: en_US.UTF-8
  LANGUAGE: en_US:en
  LC_ALL: en_US.UTF-8
  PATH: /opt/flink/bin:/usr/lib/jvm/temurin-17/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
paths:
  - type: directory
    path: /opt/flink/conf
    uid: 9999
    gid: 9999
    mode: "0755"
    recursive: true
  - type: directory
    path: /opt/flink/log
    uid: 9999
    gid: 9999
    mode: "0755"
    recursive: true
  - type: directory
    path: /opt/flink/plugins
    uid: 9999
    gid: 9999
    mode: "0755"
    recursive: true
  - type: directory
    path: /usr/lib/x86_64-linux-gnu
    uid: 0
    gid: 0
    platforms:
      - linux/amd64
annotations:
  org.opencontainers.image.description: A minimal Apache Flink image
  org.opencontainers.image.licenses: Apache-2.0
entrypoint:
  - /docker-entrypoint.sh
cmd:
  - help
ports:
  - 6123/tcp
  - 8081/tcp
