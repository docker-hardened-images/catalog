# syntax=dhi.io/build:2-debian13

name: Apache Flink 2.x (dev)
image: dhi.io/flink
variant: dev
tags:
  - 2-dev
  - 2.3-dev
  - 2.3.0-dev
  - 2-debian-dev
  - 2-debian13-dev
  - 2.3-debian-dev
  - 2.3-debian13-dev
  - 2.3.0-debian-dev
  - 2.3.0-debian13-dev
platforms:
  - linux/amd64
  - linux/arm64
dates:
  release: "2026-07-10"
vars:
  ARCH_TRIPLET: '#{ target.arch == "amd64" ? "x86_64-linux-gnu" : "aarch64-linux-gnu" }'
  JAVA_FIPS_SUFFIX: ""
  JAVA_HOME: /usr/lib/jvm/temurin-17
  JAVA_VARIANT: jdk
  JDK_MAJOR_VERSION: "17"
  SEMVER_MAJOR_MINOR_VERSION: "2.3"
  SEMVER_MAJOR_VERSION: "2"
  SEMVER_VERSION: 2.3.0
  VERSION: 2.3.0-2
contents:
  repositories:
    - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
  keyring:
    - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
  packages:
    - '!gawk'
    - '!libelogind0'
    - '!mawk'
    - '!original-awk'
    - apt
    - base-files
    - bash
    - ca-certificates
    - ca-certificates-bundle
    - coreutils
    - diffutils
    - dpkg
    - eclipse-temurin-17-jdk
    - eclipse-temurin-17-jdk-oci-config
    - findutils
    - flink=2.3.0-2
    - gawk
    - gettext-base
    - grep
    - hostname
    - libc-bin
    - libc6
    - libjemalloc2
    - libsnappy1v5
    - mawk
    - perl-base
    - procps
    - sed
    - tzdata
    - util-linux
  builds:
    - name: locale
      contents:
        packages:
          - bash
          - locales
          - coreutils
          - gzip
      pipeline:
        - name: install locales
          runs: |
            set -eux -o pipefail

            ln -s /etc/locale.alias /usr/share/locale/locale.alias

            echo "en_US.UTF-8 UTF-8" >> /etc/locale.gen
            locale-gen en_US.UTF-8
      outputs:
        - source: /usr/share/locale
          target: /usr/share/locale
          uid: 0
          gid: 0
        - source: /usr/lib/locale
          target: /usr/lib/locale
          uid: 0
          gid: 0
accounts:
  root: true
  run-as: root
  users:
    - name: flink
      uid: 9999
      gid: 9999
    - name: _apt
      uid: 42
      gid: 65532
  groups:
    - name: flink
      gid: 9999
os-release:
  name: Docker Hardened Images (Debian)
  id: debian
  version-id: "13"
  version-codename: trixie
  pretty-name: Docker Hardened Images/Debian GNU/Linux 13 (trixie)
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
work-dir: /opt/flink
environment:
  DEBIAN_FRONTEND: noninteractive
  DISABLE_JEMALLOC: "false"
  FLINK_HOME: /opt/flink
  JAVA_HOME: /usr/lib/jvm/temurin-17
  LANG: en_US.UTF-8
  LANGUAGE: en_US:en
  LC_ALL: en_US.UTF-8
  PATH: /opt/flink/bin:/usr/lib/jvm/temurin-17/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
paths:
  - type: directory
    path: /opt/flink/conf
    uid: 9999
    gid: 9999
    mode: "0755"
    recursive: true
  - type: directory
    path: /opt/flink/log
    uid: 9999
    gid: 9999
    mode: "0755"
    recursive: true
  - type: directory
    path: /opt/flink/plugins
    uid: 9999
    gid: 9999
    mode: "0755"
    recursive: true
annotations:
  org.opencontainers.image.description: A minimal Apache Flink image
  org.opencontainers.image.licenses: Apache-2.0
entrypoint:
  - /docker-entrypoint.sh
cmd:
  - help
ports:
  - 6123/tcp
  - 8081/tcp
