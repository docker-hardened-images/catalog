# syntax=dhi.io/build:2-debian13

name: Deno 2.x (dev)
image: dhi.io/deno
variant: dev
tags:
  - 2-dev
  - 2.9-dev
  - 2.9.8-dev
  - 2-debian-dev
  - 2-debian13-dev
  - 2.9-debian-dev
  - 2.9-debian13-dev
  - 2.9.8-debian-dev
  - 2.9.8-debian13-dev
platforms:
  - linux/amd64
  - linux/arm64
dates:
  release: "2025-09-10"
vars:
  BINUTILS_ARCH: '#{ target.arch == "amd64" ? "x86-64" : "aarch64" }'
  COMMIT_SHA: fe7ed012d92c642fd8e5607ac5a45d517538b5c5
  SEMVER_MAJOR_MINOR_VERSION: "2.9"
  SEMVER_MAJOR_VERSION: "2"
  SEMVER_VERSION: 2.9.8
  VERSION: 2.9.8-0
contents:
  repositories:
    - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
  keyring:
    - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
  packages:
    - '!binutils'
    - '!binutils-aarch64-linux-gnu'
    - '!binutils-common'
    - '!binutils-x86-64-linux-gnu'
    - '!gawk'
    - '!libbinutils'
    - '!libctf-nobfd0'
    - '!libctf0'
    - '!libelogind0'
    - '!libgprofng0'
    - '!libsframe1'
    - '!original-awk'
    - apt
    - base-files
    - bash
    - binutils-latest
    - binutils-latest-${BINUTILS_ARCH}-linux-gnu
    - ca-certificates
    - ca-certificates-bundle
    - coreutils
    - deno-2=2.9.8-0
    - diffutils
    - dpkg
    - findutils
    - gcc
    - grep
    - libc-bin
    - libc6
    - libctf-nobfd0-latest
    - libctf0-latest
    - libgcc-s1
    - libgprofng0-latest
    - mawk
    - perl-base
    - sed
    - tzdata
    - util-linux
  builds:
    - name: locale
      contents:
        packages:
          - bash
          - locales
          - coreutils
          - gzip
      pipeline:
        - name: install locales
          runs: |
            set -eux -o pipefail

            ln -s /etc/locale.alias /usr/share/locale/locale.alias

            echo "en_US.UTF-8 UTF-8" >> /etc/locale.gen
            locale-gen en_US.UTF-8
      outputs:
        - source: /usr/share/locale
          target: /usr/share/locale
          uid: 0
          gid: 0
        - source: /usr/lib/locale
          target: /usr/lib/locale
          uid: 0
          gid: 0
accounts:
  root: true
  run-as: root
  users:
    - name: deno
      uid: 1993
      gid: 1993
    - name: _apt
      uid: 42
      gid: 65532
  groups:
    - name: deno
      gid: 1993
      members:
        - deno
os-release:
  name: Docker Hardened Images (Debian)
  id: debian
  version-id: "13"
  version-codename: trixie
  pretty-name: Docker Hardened Images/Debian GNU/Linux 13 (trixie)
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
work-dir: /deno-dir
environment:
  DEBIAN_FRONTEND: noninteractive
  DENO_DIR: /deno-dir
  DENO_NO_PROMPT: "1"
  DENO_NO_UPDATE_CHECK: "1"
  DENO_USE_CGROUPS: "1"
  DENO_VERSION: 2.9.8
  LANG: en_US.UTF-8
  LANGUAGE: en_US:en
  LC_ALL: en_US.UTF-8
  SSL_CERT_FILE: /etc/ssl/certs/ca-certificates.crt
paths:
  - type: directory
    path: /deno-dir
    uid: 1993
    gid: 1993
    mode: "0755"
  - type: directory
    path: /usr/local/bin
    uid: 0
    gid: 0
    mode: "0755"
  - type: symlink
    path: /usr/local/bin/deno
    uid: 0
    gid: 0
    source: /usr/bin/deno
annotations:
  org.opencontainers.image.description: A minimal Deno image
  org.opencontainers.image.licenses: MIT
entrypoint:
  - /usr/local/bin/deno
