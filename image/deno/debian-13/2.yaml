# syntax=dhi.io/build:2-debian13

name: Deno 2.x
image: dhi.io/deno
variant: runtime
tags:
  - "2"
  - "2.9"
  - 2.9.8
  - 2-debian
  - 2-debian13
  - 2.9-debian
  - 2.9-debian13
  - 2.9.8-debian
  - 2.9.8-debian13
platforms:
  - linux/amd64
  - linux/arm64
dates:
  release: "2025-09-10"
vars:
  BINUTILS_ARCH: '#{ target.arch == "amd64" ? "x86-64" : "aarch64" }'
  COMMIT_SHA: fe7ed012d92c642fd8e5607ac5a45d517538b5c5
  SEMVER_MAJOR_MINOR_VERSION: "2.9"
  SEMVER_MAJOR_VERSION: "2"
  SEMVER_VERSION: 2.9.8
  VERSION: 2.9.8-0
contents:
  repositories:
    - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
  keyring:
    - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
  packages:
    - '!binutils'
    - '!binutils-aarch64-linux-gnu'
    - '!binutils-common'
    - '!binutils-x86-64-linux-gnu'
    - '!libbinutils'
    - '!libctf-nobfd0'
    - '!libctf0'
    - '!libgprofng0'
    - '!libsframe1'
    - base-files
    - binutils-latest
    - binutils-latest-${BINUTILS_ARCH}-linux-gnu
    - ca-certificates-bundle
    - deno-2=2.9.8-0
    - gcc
    - libc6
    - libctf-nobfd0-latest
    - libctf0-latest
    - libgcc-s1
    - libgprofng0-latest
    - tzdata
accounts:
  run-as: deno
  users:
    - name: deno
      uid: 1993
      gid: 1993
  groups:
    - name: deno
      gid: 1993
      members:
        - deno
os-release:
  name: Docker Hardened Images (Debian)
  id: debian
  version-id: "13"
  version-codename: trixie
  pretty-name: Docker Hardened Images/Debian GNU/Linux 13 (trixie)
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
work-dir: /deno-dir
environment:
  DENO_DIR: /deno-dir
  DENO_NO_PROMPT: "1"
  DENO_NO_UPDATE_CHECK: "1"
  DENO_USE_CGROUPS: "1"
  DENO_VERSION: 2.9.8
  SSL_CERT_FILE: /etc/ssl/certs/ca-certificates.crt
paths:
  - type: directory
    path: /deno-dir
    uid: 1993
    gid: 1993
    mode: "0755"
  - type: directory
    path: /usr/local/bin
    uid: 0
    gid: 0
    mode: "0755"
  - type: symlink
    path: /usr/local/bin/deno
    uid: 0
    gid: 0
    source: /usr/bin/deno
annotations:
  org.opencontainers.image.description: A minimal Deno image
  org.opencontainers.image.licenses: MIT
entrypoint:
  - /usr/local/bin/deno
