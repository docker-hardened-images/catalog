# syntax=dhi.io/build:2-debian13

name: FRRouting 10.x
image: dhi.io/frr
variant: runtime
tags:
  - "10.5"
  - 10.5.5
  - 10.5-debian
  - 10.5-debian13
  - 10.5.5-debian
  - 10.5.5-debian13
platforms:
  - linux/amd64
  - linux/arm64
vars:
  FLAVORED_SUFFIX: ""
  FRR_MAJOR_MINOR: "10.5"
  PACKAGE_NAME: frr-10.5
  PYTHON_MAJOR_MINOR_VERSION: "3.12"
  SEMVER_MAJOR_MINOR_VERSION: "10.5"
  SEMVER_MAJOR_VERSION: "10"
  SEMVER_VERSION: 10.5.5
  SUFFIX: ""
  VERSION: 10.5.5-9
contents:
  repositories:
    - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
  keyring:
    - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
  packages:
    - '!libelogind0'
    - '!mawk'
    - '!original-awk'
    - base-files
    - bash
    - ca-certificates-bundle
    - coreutils
    - frr-10.5=10.5.5-9
    - grep
    - iproute2
    - libc-ares2
    - libelf1t64
    - libjson-c5
    - libpcre2-8-0
    - libpcre2-posix3
    - libreadline8t64
    - librtr0t64
    - libsnmp40t64
    - libssl3t64
    - libstdc++6
    - libyang3
    - lsof
    - python-3.12
    - python-3.12-dev
    - python3-pip
    - python3-setuptools
    - python3-wheel
    - tini
    - tzdata
  builds:
    - name: fix caps
      contents:
        repositories:
          - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
        keyring:
          - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
        packages:
          - bash
          - libcap2-bin
          - frr-10.5=10.5.5-9
      pipeline:
        - name: setcap
          runs: |
            set -eux -o pipefail

            setcap 'cap_net_bind_service,cap_net_raw=+p' /usr/lib/frr/babeld
            setcap 'cap_net_bind_service,cap_net_raw,cap_sys_admin=+p' /usr/lib/frr/bfdd
            setcap 'cap_net_admin,cap_net_bind_service,cap_net_raw,cap_sys_admin=+p' /usr/lib/frr/bgpd
            setcap 'cap_net_admin,cap_net_bind_service,cap_net_raw=+p' /usr/lib/frr/eigrpd
            setcap 'cap_net_bind_service,cap_net_raw,cap_sys_admin=+p' /usr/lib/frr/fabricd
            setcap 'cap_net_bind_service,cap_net_raw,cap_sys_admin=+p' /usr/lib/frr/isisd
            setcap 'cap_net_admin,cap_net_bind_service=+p' /usr/lib/frr/ldpd
            setcap 'cap_net_admin,cap_net_bind_service,cap_net_raw,cap_sys_admin=+p' /usr/lib/frr/mgmtd
            setcap 'cap_net_admin,cap_net_raw,cap_dac_override=+p' /usr/lib/frr/nhrpd
            setcap 'cap_net_bind_service,cap_net_raw,cap_sys_admin=+p' /usr/lib/frr/ospf6d
            setcap 'cap_net_admin,cap_net_bind_service,cap_net_raw,cap_sys_admin=+p' /usr/lib/frr/ospfd
            setcap 'cap_net_admin,cap_net_bind_service,cap_net_raw=+p' /usr/lib/frr/pbrd
            setcap 'cap_net_admin,cap_net_bind_service,cap_net_raw,cap_sys_admin=+p' /usr/lib/frr/pim6d
            setcap 'cap_net_admin,cap_net_bind_service,cap_net_raw,cap_sys_admin=+p' /usr/lib/frr/pimd
            setcap 'cap_net_bind_service,cap_net_raw,cap_sys_admin=+p' /usr/lib/frr/ripd
            setcap 'cap_net_bind_service,cap_net_raw,cap_sys_admin=+p' /usr/lib/frr/ripngd
            setcap 'cap_net_raw=+p' /usr/lib/frr/vrrpd
            setcap 'cap_net_admin,cap_net_raw,cap_sys_admin=+p' /usr/lib/frr/zebra
      outputs:
        - source: /usr/lib/frr
          target: /usr/lib/frr
          uid: 0
          gid: 0
accounts:
  run-as: frr
  users:
    - name: frr
      uid: 1000
      gid: 1000
  groups:
    - name: frr
      gid: 1000
      members:
        - frr
    - name: frrvty
      gid: 1001
      members:
        - frr
os-release:
  name: Docker Hardened Images (Debian)
  id: debian
  version-id: "13"
  version-codename: trixie
  pretty-name: Docker Hardened Images/Debian GNU/Linux 13 (trixie)
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
