# syntax=dhi.io/build:2-debian13

name: Velero Plugin for AWS 1.x
image: dhi.io/velero-plugin-for-aws
variant: runtime
tags:
  - "1"
  - "1.14"
  - 1.14.2
  - 1-debian
  - 1-debian13
  - 1.14-debian
  - 1.14-debian13
  - 1.14.2-debian
  - 1.14.2-debian13
platforms:
  - linux/amd64
  - linux/arm64
vars:
  FLAVORED_SUFFIX: ""
  PLUGIN_SUFFIX: ""
  SEMVER_MAJOR_MINOR_VERSION: "1.14"
  SEMVER_MAJOR_VERSION: "1"
  SEMVER_VERSION: 1.14.2
  SUFFIX: ""
  VERSION: 1.14.2-5
contents:
  repositories:
    - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
  keyring:
    - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
  packages:
    - base-files
    - ca-certificates-bundle
    - cp-plugin=1.14.2-5
    - tzdata
    - velero-plugin-for-aws=1.14.2-5
accounts:
  run-as: nonroot
  users:
    - name: nonroot
      uid: 65532
      gid: 65532
  groups:
    - name: nonroot
      gid: 65532
      members:
        - nonroot
os-release:
  name: Docker Hardened Images (Debian)
  id: debian
  version-id: "13"
  version-codename: trixie
  pretty-name: Docker Hardened Images/Debian GNU/Linux 13 (trixie)
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
paths:
  - type: directory
    path: /usr/local/bin
    uid: 0
    gid: 0
  - type: symlink
    path: /usr/local/bin/cp-plugin
    uid: 0
    gid: 0
    source: /usr/bin/cp-plugin
annotations:
  org.opencontainers.image.description: A minimal Velero Plugin for AWS image
  org.opencontainers.image.licenses: Apache-2.0
entrypoint:
  - cp-plugin
  - /plugins/velero-plugin-for-aws
  - /target/velero-plugin-for-aws
