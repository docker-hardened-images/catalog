# syntax=dhi.io/build:2-debian13

name: Milvus 3.0.x (dev)
image: dhi.io/milvus
variant: dev
tags:
  - 3-dev
  - 3.0-dev
  - 3.0.2-dev
  - 3-debian-dev
  - 3-debian13-dev
  - 3.0-debian-dev
  - 3.0-debian13-dev
  - 3.0.2-debian-dev
  - 3.0.2-debian13-dev
platforms:
  - linux/amd64
  - linux/arm64
dates:
  release: "2026-07-29"
vars:
  FLAVORED_SUFFIX: -dev
  MILVUS_PACKAGE_SUFFIX: ""
  SEMVER_MAJOR_MINOR_VERSION: "3.0"
  SEMVER_MAJOR_VERSION: "3"
  SEMVER_VERSION: 3.0.2
  SUFFIX: -dev
  VERSION: 3.0.2-1
contents:
  repositories:
    - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
  keyring:
    - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
  packages:
    - '!gawk'
    - '!libelogind0'
    - '!original-awk'
    - apt
    - base-files
    - bash
    - ca-certificates
    - ca-certificates-bundle
    - coreutils
    - diffutils
    - dpkg
    - findutils
    - grep
    - libaio1t64
    - libatomic1
    - libc-bin
    - libgomp1
    - libssl3t64
    - libstdc++6
    - libzstd1
    - mawk
    - milvus-3.0-libs=3.0.2-1
    - milvus-3.0=3.0.2-1
    - perl-base
    - sed
    - tini
    - tzdata
    - util-linux
    - zlib1g
accounts:
  root: true
  run-as: root
  users:
    - name: nonroot
      uid: 65532
      gid: 65532
    - name: _apt
      uid: 42
      gid: 65532
  groups:
    - name: nonroot
      gid: 65532
      members:
        - nonroot
os-release:
  name: Docker Hardened Images (Debian)
  id: debian
  version-id: "13"
  version-codename: trixie
  pretty-name: Docker Hardened Images/Debian GNU/Linux 13 (trixie)
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
work-dir: /milvus
environment:
  DEBIAN_FRONTEND: noninteractive
  LD_LIBRARY_PATH: /milvus/lib:/usr/lib
  LD_PRELOAD: /milvus/lib/libjemalloc.so
  MALLOC_CONF: background_thread:true
paths:
  - type: directory
    path: /milvus/bin
    uid: 0
    gid: 0
  - type: symlink
    path: /milvus/bin/milvus
    uid: 0
    gid: 0
    source: /usr/bin/milvus
  - type: symlink
    path: /milvus/lib
    uid: 0
    gid: 0
    source: /usr/lib/milvus
  - type: symlink
    path: /milvus/configs
    uid: 0
    gid: 0
    source: /usr/share/milvus/configs
  - type: symlink
    path: /tini
    uid: 0
    gid: 0
    source: /usr/bin/tini
  - type: directory
    path: /var/lib/milvus
    uid: 65532
    gid: 65532
    mode: "0770"
annotations:
  org.opencontainers.image.description: A minimal Milvus image
  org.opencontainers.image.licenses: Apache-2.0
entrypoint:
  - /usr/bin/tini
  - --
ports:
  - 19530/tcp
  - 9091/tcp
