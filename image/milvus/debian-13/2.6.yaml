# syntax=dhi.io/build:2-debian13

name: Milvus 2.6.x
image: dhi.io/milvus
variant: runtime
tags:
  - "2"
  - "2.6"
  - 2.6.23
  - 2-debian
  - 2-debian13
  - 2.6-debian
  - 2.6-debian13
  - 2.6.23-debian
  - 2.6.23-debian13
platforms:
  - linux/amd64
  - linux/arm64
dates:
  release: "2025-08-05"
vars:
  FLAVORED_SUFFIX: ""
  MILVUS_PACKAGE_SUFFIX: ""
  SEMVER_MAJOR_MINOR_VERSION: "2.6"
  SEMVER_MAJOR_VERSION: "2"
  SEMVER_VERSION: 2.6.23
  SUFFIX: ""
  VERSION: 2.6.23-2
contents:
  repositories:
    - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
  keyring:
    - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
  packages:
    - base-files
    - ca-certificates-bundle
    - libaio1t64
    - libatomic1
    - libgomp1
    - libssl3t64
    - libstdc++6
    - libzstd1
    - milvus-2.6-libs=2.6.23-2
    - milvus-2.6=2.6.23-2
    - tini
    - tzdata
    - zlib1g
accounts:
  run-as: nonroot
  users:
    - name: nonroot
      uid: 65532
      gid: 65532
  groups:
    - name: nonroot
      gid: 65532
      members:
        - nonroot
os-release:
  name: Docker Hardened Images (Debian)
  id: debian
  version-id: "13"
  version-codename: trixie
  pretty-name: Docker Hardened Images/Debian GNU/Linux 13 (trixie)
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
work-dir: /milvus
environment:
  LD_LIBRARY_PATH: /milvus/lib:/usr/lib
  LD_PRELOAD: /milvus/lib/libjemalloc.so
  MALLOC_CONF: background_thread:true
paths:
  - type: directory
    path: /milvus/bin
    uid: 0
    gid: 0
  - type: symlink
    path: /milvus/bin/milvus
    uid: 0
    gid: 0
    source: /usr/bin/milvus
  - type: symlink
    path: /milvus/lib
    uid: 0
    gid: 0
    source: /usr/lib/milvus
  - type: symlink
    path: /milvus/configs
    uid: 0
    gid: 0
    source: /usr/share/milvus/configs
  - type: symlink
    path: /tini
    uid: 0
    gid: 0
    source: /usr/bin/tini
  - type: directory
    path: /var/lib/milvus
    uid: 65532
    gid: 65532
    mode: "0770"
annotations:
  org.opencontainers.image.description: A minimal Milvus image
  org.opencontainers.image.licenses: Apache-2.0
entrypoint:
  - /usr/bin/tini
  - --
ports:
  - 19530/tcp
  - 9091/tcp
