# syntax=dhi.io/build:2-debian13

name: ClickHouse Keeper 26.9.x-stable
image: dhi.io/clickhouse-keeper
variant: runtime
tags:
  - "26.9"
  - 26.9.8
  - 26.9-debian
  - 26.9-debian13
  - 26.9.8-debian
  - 26.9.8-debian13
platforms:
  - linux/amd64
  - linux/arm64
dates:
  release: "2026-09-21"
vars:
  DEBIAN_EPOCH_MAJOR_MINOR_VERSION: "26.9"
  DEBIAN_EPOCH_MAJOR_VERSION: "26"
  DEBIAN_EPOCH_VERSION: 26.9.8
  PACKAGE_NAME: clickhouse-keeper-26.9
  RELEASE_TYPE: stable
  SEMVER_VERSION: 26.9.8.3
  VERSION: 26.9.8.3-0
contents:
  repositories:
    - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
  keyring:
    - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
  packages:
    - '!libelogind0'
    - '!mawk'
    - '!original-awk'
    - '!tar'
    - base-files
    - bash
    - ca-certificates-bundle
    - clickhouse-keeper-26.9=26.9.8.3-0
    - coreutils
    - findutils
    - locales
    - tzdata
  builds:
    - name: clickhouse-keeper
      contents:
        repositories:
          - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
        keyring:
          - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
        packages:
          - base-files
          - clickhouse-keeper-26.9=26.9.8.3-0
          - bash
          - coreutils
          - findutils
          - locales
          - tzdata
      pipeline:
        - name: configure clickhouse-keeper runtime directories
          runs: |
            set -eux -o pipefail

            locale-gen en_US.UTF-8

            mkdir -p \
              "/var/lib/clickhouse-keeper" \
              "/var/log/clickhouse-keeper" \
              "/etc/clickhouse-keeper"

            chmod ugo+Xrw -R /etc/clickhouse-keeper
            chown -R 65532:65532 /var/lib/clickhouse-keeper /var/log/clickhouse-keeper
      outputs:
        - source: /
          target: /
          uid: 0
          gid: 0
          diff: true
    - name: locale
      contents:
        packages:
          - bash
          - locales
          - coreutils
          - gzip
      pipeline:
        - name: install locales
          runs: |
            set -eux -o pipefail

            ln -s /etc/locale.alias /usr/share/locale/locale.alias

            echo "en_US.UTF-8 UTF-8" >> /etc/locale.gen
            locale-gen en_US.UTF-8
      outputs:
        - source: /usr/share/locale
          target: /usr/share/locale
          uid: 0
          gid: 0
        - source: /usr/lib/locale
          target: /usr/lib/locale
          uid: 0
          gid: 0
accounts:
  run-as: nonroot
  users:
    - name: nonroot
      uid: 65532
      gid: 65532
  groups:
    - name: nonroot
      gid: 65532
      members:
        - nonroot
os-release:
  name: Docker Hardened Images (Debian)
  id: debian
  version-id: "13"
  version-codename: trixie
  pretty-name: Docker Hardened Images/Debian GNU/Linux 13 (trixie)
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
work-dir: /var/lib/clickhouse-keeper
environment:
  CLICKHOUSE_VERSION: 26.9.8.3
  LANG: en_US.UTF-8
  LANGUAGE: en_US:en
  LC_ALL: en_US.UTF-8
  TZ: UTC
paths:
  - type: directory
    path: /var/lib/clickhouse-keeper
    uid: 65532
    gid: 65532
    mode: "0755"
  - type: directory
    path: /var/log/clickhouse-keeper
    uid: 65532
    gid: 65532
    mode: "0755"
  - type: directory
    path: /etc/clickhouse-keeper
    uid: 65532
    gid: 65532
    mode: "0755"
  - type: directory
    path: /usr/local/bin
    uid: 0
    gid: 0
  - type: symlink
    path: /usr/local/bin/clickhouse-keeper
    uid: 0
    gid: 0
    source: /usr/bin/clickhouse-keeper
annotations:
  org.opencontainers.image.description: A minimal ClickHouse Keeper image
  org.opencontainers.image.licenses: Apache-2.0
entrypoint:
  - /usr/local/bin/clickhouse-keeper
  - keeper
ports:
  - 2181/tcp
  - 9181/tcp
  - 10181/tcp
  - 44444/tcp
