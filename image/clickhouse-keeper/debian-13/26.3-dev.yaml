# syntax=dhi.io/build:2-debian13

name: ClickHouse Keeper 26.3.x-lts (dev)
image: dhi.io/clickhouse-keeper
variant: dev
tags:
  - 26.3-dev
  - 26.3.46-dev
  - 26.3-debian-dev
  - 26.3-debian13-dev
  - 26.3.46-debian-dev
  - 26.3.46-debian13-dev
platforms:
  - linux/amd64
  - linux/arm64
dates:
  release: "2026-04-14"
vars:
  DEBIAN_EPOCH_MAJOR_MINOR_VERSION: "26.3"
  DEBIAN_EPOCH_MAJOR_VERSION: "26"
  DEBIAN_EPOCH_VERSION: 26.3.46
  PACKAGE_NAME: clickhouse-keeper-26.3
  RELEASE_TYPE: lts
  SEMVER_VERSION: 26.3.46.2
  VERSION: 26.3.46.2-0
contents:
  repositories:
    - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
  keyring:
    - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
  packages:
    - '!gawk'
    - '!libelogind0'
    - '!mawk'
    - '!original-awk'
    - '!tar'
    - apt
    - base-files
    - bash
    - ca-certificates
    - ca-certificates-bundle
    - clickhouse-keeper-26.3=26.3.46.2-0
    - coreutils
    - diffutils
    - dpkg
    - findutils
    - grep
    - libc-bin
    - locales
    - mawk
    - perl-base
    - sed
    - tar
    - tzdata
    - util-linux
  builds:
    - name: clickhouse-keeper
      contents:
        repositories:
          - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
        keyring:
          - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
        packages:
          - base-files
          - clickhouse-keeper-26.3=26.3.46.2-0
          - bash
          - coreutils
          - findutils
          - locales
          - tzdata
      pipeline:
        - name: configure clickhouse-keeper runtime directories
          runs: |
            set -eux -o pipefail

            locale-gen en_US.UTF-8

            mkdir -p \
              "/var/lib/clickhouse-keeper" \
              "/var/log/clickhouse-keeper" \
              "/etc/clickhouse-keeper"

            chmod ugo+Xrw -R /etc/clickhouse-keeper
            chown -R 65532:65532 /var/lib/clickhouse-keeper /var/log/clickhouse-keeper
      outputs:
        - source: /
          target: /
          uid: 0
          gid: 0
          diff: true
    - name: locale
      contents:
        packages:
          - bash
          - locales
          - coreutils
          - gzip
      pipeline:
        - name: install locales
          runs: |
            set -eux -o pipefail

            ln -s /etc/locale.alias /usr/share/locale/locale.alias

            echo "en_US.UTF-8 UTF-8" >> /etc/locale.gen
            locale-gen en_US.UTF-8
      outputs:
        - source: /usr/share/locale
          target: /usr/share/locale
          uid: 0
          gid: 0
        - source: /usr/lib/locale
          target: /usr/lib/locale
          uid: 0
          gid: 0
accounts:
  root: true
  run-as: root
  users:
