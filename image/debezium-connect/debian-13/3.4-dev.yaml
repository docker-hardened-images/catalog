# syntax=dhi.io/build:2-debian13

name: Debezium Connect 3.4.x (dev)
image: dhi.io/debezium-connect
variant: dev
tags:
  - 3-dev
  - 3.4-dev
  - 3.4.3-dev
  - 3-debian-dev
  - 3-debian13-dev
  - 3.4-debian-dev
  - 3.4-debian13-dev
  - 3.4.3-debian-dev
  - 3.4.3-debian13-dev
platforms:
  - linux/amd64
  - linux/arm64
dates:
  release: "2025-12-18"
vars:
  JDK_MAJOR_VERSION: "21"
  SEMVER_MAJOR_MINOR_VERSION: "3.4"
  SEMVER_MAJOR_VERSION: "3"
  SEMVER_VERSION: 3.4.3
  VERSION: 3.4.3-5
contents:
  repositories:
    - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
  keyring:
    - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
  packages:
    - '!gawk'
    - '!libelogind0'
    - '!mawk'
    - '!original-awk'
    - apt
    - base-files
    - bash
    - ca-certificates
    - coreutils
    - debezium-connector-jdbc=3.4.3-5
    - debezium-connector-mariadb=3.4.3-5
    - debezium-connector-mongodb=3.4.3-5
    - debezium-connector-mysql=3.4.3-5
    - debezium-connector-oracle=3.4.3-5
    - debezium-connector-postgres=3.4.3-5
    - debezium-connector-sqlserver=3.4.3-5
    - debezium-scripting=3.4.3-5
    - diffutils
    - dpkg
    - eclipse-temurin-21-jre
    - eclipse-temurin-21-jre-oci-config
    - findutils
    - grep
    - kafka-4.3
    - libaio1t64
    - libc-bin
    - mawk
    - netbase
    - perl-base
    - sed
    - tzdata
    - util-linux
  builds:
    - name: locale
      contents:
        packages:
          - bash
          - locales
          - coreutils
          - gzip
      pipeline:
        - name: install locales
          runs: |
            set -eux -o pipefail

            ln -s /etc/locale.alias /usr/share/locale/locale.alias

            echo "en_US.UTF-8 UTF-8" >> /etc/locale.gen
            locale-gen en_US.UTF-8
      outputs:
        - source: /usr/share/locale
          target: /usr/share/locale
          uid: 0
          gid: 0
        - source: /usr/lib/locale
          target: /usr/lib/locale
          uid: 0
          gid: 0
accounts:
  root: true
  run-as: root
  users:
    - name: nonroot
      uid: 65532
      gid: 65532
    - name: _apt
      uid: 42
      gid: 65532
  groups:
    - name: nonroot
      gid: 65532
      members:
        - nonroot
os-release:
  name: Docker Hardened Images (Debian)
  id: debian
  version-id: "13"
  version-codename: trixie
  pretty-name: Docker Hardened Images/Debian GNU/Linux 13 (trixie)
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
work-dir: /usr/share/kafka
environment:
  DEBIAN_FRONTEND: noninteractive
  JAVA_HOME: /usr/lib/jvm/temurin-21
  LANG: en_US.UTF-8
  LANGUAGE: en_US:en
  LC_ALL: en_US.UTF-8
paths:
  - type: directory
    path: /var/lib/kafka-connect
    uid: 65532
    gid: 65532
    mode: "0770"
  - type: directory
    path: /usr/local/bin
    uid: 0
    gid: 0
  - type: file
    path: /usr/local/bin/docker-entrypoint.sh
    uid: 0
    gid: 0
    mode: "0755"
    source: image/debezium-connect/bin/docker-entrypoint.sh
annotations:
  org.opencontainers.image.description: A minimal Debezium Kafka Connect image
  org.opencontainers.image.licenses: Apache-2.0
entrypoint:
  - /usr/local/bin/docker-entrypoint.sh
ports:
  - 8083/tcp
