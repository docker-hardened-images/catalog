# syntax=dhi.io/build:2-debian13

name: Debezium Connect 3.7.x
image: dhi.io/debezium-connect
variant: runtime
tags:
  - "3"
  - "3.7"
  - 3.7.1
  - 3-debian
  - 3-debian13
  - 3.7-debian
  - 3.7-debian13
  - 3.7.1-debian
  - 3.7.1-debian13
platforms:
  - linux/amd64
  - linux/arm64
dates:
  release: "2026-09-29"
vars:
  JDK_MAJOR_VERSION: "21"
  SEMVER_MAJOR_MINOR_VERSION: "3.7"
  SEMVER_MAJOR_VERSION: "3"
  SEMVER_VERSION: 3.7.1
  VERSION: 3.7.1-0
contents:
  repositories:
    - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
  keyring:
    - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
  packages:
    - '!libelogind0'
    - '!mawk'
    - '!original-awk'
    - base-files
    - bash
    - ca-certificates
    - coreutils
    - debezium-3.7-connector-jdbc=3.7.1-0
    - debezium-3.7-connector-mariadb=3.7.1-0
    - debezium-3.7-connector-mongodb=3.7.1-0
    - debezium-3.7-connector-mysql=3.7.1-0
    - debezium-3.7-connector-oracle=3.7.1-0
    - debezium-3.7-connector-postgres=3.7.1-0
    - debezium-3.7-connector-sqlserver=3.7.1-0
    - debezium-3.7-scripting=3.7.1-0
    - eclipse-temurin-21-jre
    - eclipse-temurin-21-jre-oci-config
    - grep
    - kafka-4.3
    - libaio1t64
    - netbase
    - sed
    - tzdata
  builds:
    - name: locale
      contents:
        packages:
          - bash
          - locales
          - coreutils
          - gzip
      pipeline:
        - name: install locales
          runs: |
            set -eux -o pipefail

            ln -s /etc/locale.alias /usr/share/locale/locale.alias

            echo "en_US.UTF-8 UTF-8" >> /etc/locale.gen
            locale-gen en_US.UTF-8
      outputs:
        - source: /usr/share/locale
          target: /usr/share/locale
          uid: 0
          gid: 0
        - source: /usr/lib/locale
          target: /usr/lib/locale
          uid: 0
          gid: 0
accounts:
  run-as: nonroot
  users:
    - name: nonroot
      uid: 65532
      gid: 65532
  groups:
    - name: nonroot
      gid: 65532
      members:
        - nonroot
os-release:
  name: Docker Hardened Images (Debian)
  id: debian
  version-id: "13"
  version-codename: trixie
  pretty-name: Docker Hardened Images/Debian GNU/Linux 13 (trixie)
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
work-dir: /usr/share/kafka
environment:
  JAVA_HOME: /usr/lib/jvm/temurin-21
  LANG: en_US.UTF-8
  LANGUAGE: en_US:en
  LC_ALL: en_US.UTF-8
paths:
  - type: directory
    path: /var/lib/kafka-connect
    uid: 65532
    gid: 65532
    mode: "0770"
  - type: directory
    path: /usr/local/bin
    uid: 0
    gid: 0
  - type: file
    path: /usr/local/bin/docker-entrypoint.sh
    uid: 0
    gid: 0
    mode: "0755"
    source: image/debezium-connect/bin/docker-entrypoint.sh
  - type: symlink
    path: /docker-entrypoint.sh
    uid: 0
    gid: 0
    source: /usr/local/bin/docker-entrypoint.sh
  - type: directory
    path: /kafka/config
    uid: 65532
    gid: 65532
    mode: "0770"
  - type: directory
    path: /kafka/data
    uid: 65532
    gid: 65532
    mode: "0770"
  - type: directory
    path: /kafka/logs
    uid: 65532
    gid: 65532
    mode: "0770"
annotations:
  org.opencontainers.image.description: A minimal Debezium Kafka Connect image
  org.opencontainers.image.licenses: Apache-2.0
entrypoint:
  - /usr/local/bin/docker-entrypoint.sh
cmd:
  - start
ports:
  - 8083/tcp
