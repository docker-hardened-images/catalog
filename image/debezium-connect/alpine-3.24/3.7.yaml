# syntax=dhi.io/build:2-alpine3.24

name: Debezium Connect 3.7.x
image: dhi.io/debezium-connect
variant: runtime
tags:
  - 3-alpine
  - 3.7-alpine
  - 3-alpine3.24
  - 3.7.1-alpine
  - 3.7-alpine3.24
  - 3.7.1-alpine3.24
platforms:
  - linux/amd64
  - linux/arm64
dates:
  release: "2026-09-29"
vars:
  JDK_MAJOR_VERSION: "21"
  SEMVER_MAJOR_MINOR_VERSION: "3.7"
  SEMVER_MAJOR_VERSION: "3"
  SEMVER_VERSION: 3.7.1
  VERSION: 3.7.1-r0
contents:
  repositories:
    - https://dhi.io/apk/alpine/v3.24/main
    - https://dl-cdn.alpinelinux.org/alpine/v3.24/main
    - https://dl-cdn.alpinelinux.org/alpine/v3.24/community
  keyring:
    - https://dhi.io/keyring/dhi-apk@docker-0F81AD7700D99184.rsa.pub
  packages:
    - alpine-baselayout-data
    - bash
    - ca-certificates-bundle
    - coreutils
    - debezium-3.7-connector-jdbc=3.7.1-r0
    - debezium-3.7-connector-mariadb=3.7.1-r0
    - debezium-3.7-connector-mongodb=3.7.1-r0
    - debezium-3.7-connector-mysql=3.7.1-r0
    - debezium-3.7-connector-oracle=3.7.1-r0
    - debezium-3.7-connector-postgres=3.7.1-r0
    - debezium-3.7-connector-sqlserver=3.7.1-r0
    - debezium-3.7-scripting=3.7.1-r0
    - eclipse-temurin-21-jre
    - eclipse-temurin-21-jre-oci-config
    - grep
    - kafka-4.3
    - libaio
    - libgcc
    - libstdc++
    - musl
    - sed
    - tzdata
accounts:
  run-as: nonroot
  users:
    - name: nonroot
      uid: 65532
      gid: 65532
  groups:
    - name: nonroot
      gid: 65532
      members:
        - nonroot
os-release:
  name: Docker Hardened Images (Alpine)
  id: alpine
  version-id: "3.24"
  pretty-name: Docker Hardened Images/Alpine Linux v3.24
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
work-dir: /usr/share/kafka
environment:
  JAVA_HOME: /usr/lib/jvm/temurin-21
paths:
  - type: directory
    path: /var/lib/kafka-connect
    uid: 65532
    gid: 65532
    mode: "0770"
  - type: directory
    path: /usr/local/bin
    uid: 0
    gid: 0
  - type: file
    path: /usr/local/bin/docker-entrypoint.sh
    uid: 0
    gid: 0
    mode: "0755"
    source: image/debezium-connect/bin/docker-entrypoint.sh
  - type: symlink
    path: /docker-entrypoint.sh
    uid: 0
    gid: 0
    source: /usr/local/bin/docker-entrypoint.sh
  - type: directory
    path: /kafka/config
    uid: 65532
    gid: 65532
    mode: "0770"
  - type: directory
    path: /kafka/data
    uid: 65532
    gid: 65532
    mode: "0770"
  - type: directory
    path: /kafka/logs
    uid: 65532
    gid: 65532
    mode: "0770"
annotations:
  org.opencontainers.image.description: A minimal Debezium Kafka Connect image
  org.opencontainers.image.licenses: Apache-2.0
entrypoint:
  - /usr/local/bin/docker-entrypoint.sh
cmd:
  - start
ports:
  - 8083/tcp
