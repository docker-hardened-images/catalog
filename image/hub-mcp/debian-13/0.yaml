# syntax=dhi.io/build:2-debian13

name: Docker Hub MCP 0.x
image: dhi.io/hub-mcp
variant: runtime
tags:
  - "0"
  - "0.19"
  - 0.19.0
  - 0-debian
  - 0-debian13
  - 0.19-debian
  - 0.19-debian13
  - 0.19.0-debian
  - 0.19.0-debian13
platforms:
  - linux/amd64
  - linux/arm64
vars:
  SEMVER_MAJOR_MINOR_VERSION: "0.19"
  SEMVER_MAJOR_VERSION: "0"
  SEMVER_VERSION: 0.19.0
  VERSION: 0.19.0-5
contents:
  repositories:
    - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
  keyring:
    - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
  packages:
    - base-files
    - ca-certificates-bundle
    - hub-mcp=0.19.0-5
    - libc6
    - libgomp1
    - libstdc++6
    - netbase
    - nodejs-24
    - tzdata
  builds:
    - name: hub-mcp-component-sbom
      contents:
        packages:
          - bash
          - coreutils
      pipeline:
        - uses: spdx@v1
          with:
            license: Apache-2.0
            name: hub-mcp
            purl: pkg:dhi/hub-mcp@0.19.0
            version: 0.19.0
      outputs:
        - source: /opt/docker/sbom/hub-mcp
          target: /opt/docker/sbom/hub-mcp
          uid: 0
          gid: 0
accounts:
  run-as: node
  users:
    - name: node
      uid: 1000
      gid: 1000
  groups:
    - name: node
      gid: 1000
      members:
        - node
os-release:
  name: Docker Hardened Images (Debian)
  id: debian
  version-id: "13"
  version-codename: trixie
  pretty-name: Docker Hardened Images/Debian GNU/Linux 13 (trixie)
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
environment:
  NODE_ENV: production
paths:
  - type: directory
    path: /app
    uid: 0
    gid: 0
    mode: "0755"
  - type: symlink
    path: /app/dist
    uid: 0
    gid: 0
    source: /usr/lib/hub-mcp/dist
  - type: symlink
    path: /app/node_modules
    uid: 0
    gid: 0
    source: /usr/lib/hub-mcp/node_modules
  - type: directory
    path: /app/logs
    uid: 1000
    gid: 1000
    mode: "0755"
annotations:
  org.opencontainers.image.description: Docker Hub MCP Server
  org.opencontainers.image.licenses: Apache-2.0
labels:
  io.modelcontextprotocol.server.name: io.github.docker/hub-mcp
entrypoint:
  - node
  - /app/dist/index.js
