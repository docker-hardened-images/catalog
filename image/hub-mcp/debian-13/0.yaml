# syntax=dhi.io/build:2-debian13

name: Docker Hub MCP 0.x
image: dhi.io/hub-mcp
variant: runtime
tags:
  - "0"
  - "0.19"
  - 0.19.0
  - 0-debian
  - 0-debian13
  - 0.19-debian
  - 0.19-debian13
  - 0.19.0-debian
  - 0.19.0-debian13
platforms:
  - linux/amd64
  - linux/arm64
vars:
  COMMIT_SHA: 68f4c79223f3ac2a5b6732de58ce7ba22aa8f1a8
  SEMVER_MAJOR_MINOR_VERSION: "0.19"
  SEMVER_MAJOR_VERSION: "0"
  SEMVER_VERSION: 0.19.0
  VERSION: 0.19.0
contents:
  repositories:
    - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
  keyring:
    - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
  packages:
    - base-files
    - ca-certificates-bundle
    - libc6
    - libgomp1
    - libstdc++6
    - netbase
    - nodejs-24
    - tzdata
  builds:
    - name: hub-mcp
      contents:
        packages:
          - gzip
          - base-files
          - bash
          - ca-certificates
          - coreutils
          - findutils
          - git
          - libc6
          - libstdc++6
          - mawk
          - nodejs-24
          - node-corepack
          - npm
          - sed
          - yarn-classic
          - tar
        files:
          - url: git+https://github.com/docker/hub-mcp.git#dockerhub-mcp/v0.19.0
            checksum: 68f4c79223f3ac2a5b6732de58ce7ba22aa8f1a8
            path: ${source.dir}/hub-mcp-68f4c79223f3ac2a5b6732de58ce7ba22aa8f1a8
            spdx:
              name: hub-mcp
              version: 0.19.0
              packages:
                - name: hub-mcp
                  purl: pkg:dhi/hub-mcp@0.19.0
                  license: Apache-2.0
            uid: 0
            gid: 0
          - url: https://registry.npmjs.org/minimatch/-/minimatch-11.0.1.tgz
            path: ${source.dir}/minimatch-11.0.1.tgz
            uid: 0
            gid: 0
          - url: https://registry.npmjs.org/@hono/node-server/-/node-server-2.1.5.tgz
            path: ${source.dir}/node-server-2.1.5.tgz
            uid: 0
            gid: 0
      pipeline:
        - name: bump
          uses: npm/bump@v1
          privileged: true
          environment:
            DHI_NO_SFW: "true"
          with:
            bumps: ${source.dir}/patch/npm-bumps.json
            npm-root: ${source.dir}/hub-mcp-68f4c79223f3ac2a5b6732de58ce7ba22aa8f1a8
        - name: zod 4 toolsList typings
          uses: patch@v1
          work-dir: ${source.dir}/hub-mcp-68f4c79223f3ac2a5b6732de58ce7ba22aa8f1a8
          with:
            options: -p1
            patch: ${source.dir}/patch/zod4-toolsList.patch
        - name: install and build
          work-dir: ${source.dir}/hub-mcp-68f4c79223f3ac2a5b6732de58ce7ba22aa8f1a8
          privileged: true
          runs: |
            set -eux -o pipefail

            npm install --package-lock-only
            npm ci
            npm run build

            # prune to production deps only
            rm -rf node_modules
            npm ci --omit=dev --ignore-scripts
        - name: patch nested minimatch packages
          work-dir: ${source.dir}/hub-mcp-68f4c79223f3ac2a5b6732de58ce7ba22aa8f1a8
          runs: |
            set -eux -o pipefail

            mkdir -p /tmp/minimatch-fix
            tar -xzf ${source.dir}/minimatch-11.0.1.tgz -C /tmp/minimatch-fix

            find node_modules -type d -name "minimatch" -exec test -f {}/package.json \; -print0 | while IFS= read -r -d '' minimatch_dir; do
              echo "Replacing ${minimatch_dir}"
              rm -rf "${minimatch_dir}"
              cp -r /tmp/minimatch-fix/package "${minimatch_dir}"
            done

            rm -rf /tmp/minimatch-fix
        - name: patch nested @hono/node-server packages
          work-dir: ${source.dir}/hub-mcp-68f4c79223f3ac2a5b6732de58ce7ba22aa8f1a8
          runs: |
            set -eux -o pipefail

            mkdir -p /tmp/hono-node-server-fix
            tar -xzf ${source.dir}/node-server-2.1.5.tgz -C /tmp/hono-node-server-fix

            find node_modules -type d -path '*/@hono/node-server' -exec test -f {}/package.json \; -print0 | while IFS= read -r -d '' hono_dir; do
              echo "Replacing ${hono_dir}"
              rm -rf "${hono_dir}"
              cp -r /tmp/hono-node-server-fix/package "${hono_dir}"
            done

            rm -rf /tmp/hono-node-server-fix
      paths:
        - type: file
          path: ${source.dir}/patch/npm-bumps.json
          uid: 0
          gid: 0
          source: image/hub-mcp/patch/npm-bumps.json
        - type: file
          path: ${source.dir}/patch/zod4-toolsList.patch
          uid: 0
          gid: 0
          source: image/hub-mcp/patch/zod4-toolsList.patch
      outputs:
        - source: ${source.dir}/hub-mcp-68f4c79223f3ac2a5b6732de58ce7ba22aa8f1a8/node_modules
          target: /app/node_modules
          uid: 0
          gid: 0
        - source: ${source.dir}/hub-mcp-68f4c79223f3ac2a5b6732de58ce7ba22aa8f1a8/dist
          target: /app/dist
          uid: 0
          gid: 0
        - source: /opt/docker/sbom/hub-mcp
          target: /opt/docker/sbom/hub-mcp
          uid: 0
          gid: 0
accounts:
  run-as: node
  users:
    - name: node
      uid: 1000
      gid: 1000
  groups:
    - name: node
      gid: 1000
      members:
        - node
os-release:
  name: Docker Hardened Images (Debian)
  id: debian
  version-id: "13"
  version-codename: trixie
  pretty-name: Docker Hardened Images/Debian GNU/Linux 13 (trixie)
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
environment:
  NODE_ENV: production
paths:
  - type: directory
    path: /app/logs
    uid: 1000
    gid: 1000
    mode: "0755"
annotations:
  org.opencontainers.image.description: Docker Hub MCP Server
  org.opencontainers.image.licenses: Apache-2.0
labels:
  io.modelcontextprotocol.server.name: io.github.docker/hub-mcp
entrypoint:
  - node
  - /app/dist/index.js
