# syntax=dhi.io/build:2-debian13

name: Hubble UI Backend 0.x
image: dhi.io/hubble-ui-backend
variant: runtime
tags:
  - "0"
  - "0.13"
  - 0.13.6
  - 0-debian
  - 0-debian13
  - 0.13-debian
  - 0.13-debian13
  - 0.13.6-debian
  - 0.13.6-debian13
platforms:
  - linux/amd64
  - linux/arm64
vars:
  CILIUM_VERSION: 1.20.1
  FLAVORED_SUFFIX: ""
  GOPS_VERSION: 0.3.29-7
  SEMVER_MAJOR_MINOR_VERSION: "0.13"
  SEMVER_MAJOR_VERSION: "0"
  SEMVER_VERSION: 0.13.6
  SUFFIX: ""
  VERSION: 0.13.6-5
contents:
  repositories:
    - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
  keyring:
    - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
  packages:
    - base-files
    - ca-certificates-bundle
    - gops=0.3.29-7
    - hubble-ui-backend=0.13.6-5
    - tzdata
accounts:
  run-as: nonroot
  users:
    - name: nonroot
      uid: 65532
      gid: 65532
  groups:
    - name: nonroot
      gid: 65532
      members:
        - nonroot
os-release:
  name: Docker Hardened Images (Debian)
  id: debian
  version-id: "13"
  version-codename: trixie
  pretty-name: Docker Hardened Images/Debian GNU/Linux 13 (trixie)
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
environment:
  CILIUM_VERSION: 1.20.1
  GOPS_CONFIG_DIR: /home/gops
paths:
  - type: directory
    path: /usr/local/bin
    uid: 0
    gid: 0
  - type: symlink
    path: /usr/local/bin/backend
    uid: 0
    gid: 0
    source: /usr/bin/hubble-ui-backend
  - type: directory
    path: /home/gops
    uid: 65532
    gid: 65532
    mode: "0777"
annotations:
  org.opencontainers.image.description: A minimal Hubble UI Backend image
  org.opencontainers.image.licenses: Apache-2.0
entrypoint:
  - /usr/local/bin/backend
