# syntax=dhi.io/build:2-alpine3.23

name: Jaeger ES Index Cleaner 2.x
image: dhi.io/jaeger-es-index-cleaner
variant: runtime
tags:
  - 2-alpine
  - 2.22-alpine
  - 2-alpine3.24
  - 2.22.0-alpine
  - 2.22-alpine3.24
  - 2.22.0-alpine3.24
platforms:
  - linux/amd64
  - linux/arm64
dates:
  release: "2024-11-04"
vars:
