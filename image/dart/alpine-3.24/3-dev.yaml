# syntax=dhi.io/build:2-alpine3.24

name: Dart 3.x (dev)
image: dhi.io/dart
variant: dev
tags:
  - 3-alpine-dev
  - 3.14-alpine-dev
  - 3-alpine3.24-dev
  - 3.14.1-alpine-dev
  - 3.14-alpine3.24-dev
  - 3.14.1-alpine3.24-dev
platforms:
  - linux/amd64
  - linux/arm64
vars:
  SEMVER_MAJOR_MINOR_VERSION: "3.14"
  SEMVER_MAJOR_VERSION: "3"
  SEMVER_VERSION: 3.14.1
  VERSION: 3.14.1-r0
contents:
  repositories:
    - https://dhi.io/apk/alpine/v3.24/main
    - https://dl-cdn.alpinelinux.org/alpine/v3.24/main
    - https://dl-cdn.alpinelinux.org/alpine/v3.24/community
  keyring:
    - https://dhi.io/keyring/dhi-apk@docker-0F81AD7700D99184.rsa.pub
  packages:
    - alpine-baselayout-data
    - apk-tools
    - busybox
    - ca-certificates-bundle
    - dart-3=3.14.1-r0
accounts:
  root: true
  run-as: root
  users:
    - name: nonroot
      uid: 65532
      gid: 65532
  groups:
    - name: nonroot
      gid: 65532
      members:
        - nonroot
os-release:
  name: Docker Hardened Images (Alpine)
  id: alpine
  version-id: "3.24"
  pretty-name: Docker Hardened Images/Alpine Linux v3.24
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
work-dir: /app
environment:
  DART_VERSION: 3.14.1
  PATH: /opt/dart-sdk/bin:/home/nonroot/.pub-cache/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
  PUB_CACHE: /home/nonroot/.pub-cache
paths:
  - type: directory
    path: /opt
    uid: 0
    gid: 0
  - type: symlink
    path: /opt/dart-sdk
    uid: 0
    gid: 0
    source: /usr/lib/dart-sdk
  - type: directory
    path: /app
    uid: 65532
    gid: 65532
    mode: "0755"
  - type: directory
    path: /home/nonroot/.pub-cache
    uid: 65532
    gid: 65532
    mode: "0755"
annotations:
  org.opencontainers.image.description: A minimal Dart SDK image
  org.opencontainers.image.licenses: BSD-3-Clause
cmd:
  - /bin/sh
