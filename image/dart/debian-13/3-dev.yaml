# syntax=dhi.io/build:2-debian13

name: Dart 3.x (dev)
image: dhi.io/dart
variant: dev
tags:
  - 3-dev
  - 3.14-dev
  - 3.14.1-dev
  - 3-debian-dev
  - 3-debian13-dev
  - 3.14-debian-dev
  - 3.14-debian13-dev
  - 3.14.1-debian-dev
  - 3.14.1-debian13-dev
platforms:
  - linux/amd64
  - linux/arm64
dates:
  release: "2026-05-18"
vars:
  SEMVER_MAJOR_MINOR_VERSION: "3.14"
  SEMVER_MAJOR_VERSION: "3"
  SEMVER_VERSION: 3.14.1
  VERSION: 3.14.1-0
contents:
  repositories:
    - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
  keyring:
    - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
  packages:
    - '!gawk'
    - '!libelogind0'
    - '!mawk'
    - '!original-awk'
    - apt
    - base-files
    - bash
    - ca-certificates
    - coreutils
    - dart-3=3.14.1-0
    - diffutils
    - dpkg
    - findutils
    - grep
    - libc-bin
    - mawk
    - perl-base
    - sed
    - tzdata
    - util-linux
accounts:
  root: true
  run-as: root
  users:
    - name: nonroot
      uid: 65532
      gid: 65532
    - name: _apt
      uid: 42
      gid: 65532
  groups:
    - name: nonroot
      gid: 65532
      members:
        - nonroot
os-release:
  name: Docker Hardened Images (Debian)
  id: debian
  version-id: "13"
  version-codename: trixie
  pretty-name: Docker Hardened Images/Debian GNU/Linux 13 (trixie)
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
work-dir: /app
environment:
  DART_VERSION: 3.14.1
  DEBIAN_FRONTEND: noninteractive
  PATH: /opt/dart-sdk/bin:/home/nonroot/.pub-cache/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
  PUB_CACHE: /home/nonroot/.pub-cache
paths:
  - type: directory
    path: /opt
    uid: 0
    gid: 0
  - type: symlink
    path: /opt/dart-sdk
    uid: 0
    gid: 0
    source: /usr/lib/dart-sdk
  - type: directory
    path: /app
    uid: 65532
    gid: 65532
    mode: "0755"
  - type: directory
    path: /home/nonroot/.pub-cache
    uid: 65532
    gid: 65532
    mode: "0755"
annotations:
  org.opencontainers.image.description: A minimal Dart SDK image
  org.opencontainers.image.licenses: BSD-3-Clause
cmd:
  - /bin/bash
