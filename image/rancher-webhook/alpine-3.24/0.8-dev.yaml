    - apk-tools
    - busybox
    - ca-certificates
    - ca-certificates-bundle
    - rancher-webhook-0.8-dev=0.8.12-r1
    - tzdata
accounts:
  root: true
  run-as: root
  users:
    - name: webhook
      uid: 65532
      gid: 65532
