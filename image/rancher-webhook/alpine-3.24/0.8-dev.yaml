# syntax=dhi.io/build:2-alpine3.24

name: Rancher Webhook 0.8.x (dev)
image: dhi.io/rancher-webhook
variant: dev
tags:
  - 0.8-alpine-dev
  - 0.8.12-alpine-dev
  - 0.8-alpine3.24-dev
  - 0.8.12-alpine3.24-dev
platforms:
  - linux/amd64
  - linux/arm64
dates:
  release: "2025-07-28"
  end-of-life: "2027-02-28"
vars:
