# syntax=dhi.io/build:2-debian13

name: Rancher Webhook 0.11.x (dev)
image: dhi.io/rancher-webhook
variant: dev
tags:
  - 0-dev
  - 0.11-dev
  - 0.11.4-dev
  - v0.11.4-dev
  - 0-debian-dev
  - 0-debian13-dev
  - 0.11-debian-dev
  - 0.11-debian13-dev
  - 0.11.4-debian-dev
  - 0.11.4-debian13-dev
platforms:
  - linux/amd64
  - linux/arm64
dates:
  release: "2026-07-24"
  end-of-life: "2028-02-27"
vars:
  FLAVORED_SUFFIX: -dev
  SEMVER_MAJOR_MINOR_VERSION: "0.11"
  SEMVER_MAJOR_VERSION: "0"
  SEMVER_VERSION: 0.11.4
  SUFFIX: -dev
  VERSION: 0.11.4-1
contents:
  repositories:
    - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
  keyring:
    - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
  packages:
    - '!gawk'
    - '!libelogind0'
    - '!mawk'
    - '!original-awk'
    - apt
    - base-files
    - bash
    - ca-certificates
    - ca-certificates-bundle
    - coreutils
    - diffutils
    - dpkg
    - findutils
    - grep
    - libc-bin
    - mawk
    - perl-base
    - rancher-webhook-0.11-dev=0.11.4-1
    - sed
    - tzdata
    - util-linux
accounts:
  root: true
  run-as: root
  users:
    - name: webhook
      uid: 65532
      gid: 65532
    - name: _apt
      uid: 42
      gid: 65532
  groups:
    - name: webhook
      gid: 65532
      members:
        - webhook
os-release:
  name: Docker Hardened Images (Debian)
  id: debian
  version-id: "13"
  version-codename: trixie
  pretty-name: Docker Hardened Images/Debian GNU/Linux 13 (trixie)
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
environment:
  DEBIAN_FRONTEND: noninteractive
annotations:
  org.opencontainers.image.description: A minimal Rancher Webhook image
  org.opencontainers.image.licenses: Apache-2.0
entrypoint:
  - /usr/bin/webhook
ports:
  - 9443/tcp
