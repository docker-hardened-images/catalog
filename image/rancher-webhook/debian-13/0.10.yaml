# syntax=dhi.io/build:2-debian13

name: Rancher Webhook 0.10.x
image: dhi.io/rancher-webhook
variant: runtime
tags:
  - "0.10"
  - 0.10.13
  - v0.10.13
  - 0.10-debian
  - 0.10-debian13
  - 0.10.13-debian
  - 0.10.13-debian13
platforms:
  - linux/amd64
  - linux/arm64
dates:
  release: "2026-03-18"
  end-of-life: "2027-10-10"
vars:
  FLAVORED_SUFFIX: ""
  SEMVER_MAJOR_MINOR_VERSION: "0.10"
  SEMVER_MAJOR_VERSION: "0"
  SEMVER_VERSION: 0.10.13
  SUFFIX: ""
  VERSION: 0.10.13-2
contents:
  repositories:
    - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
  keyring:
    - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
  packages:
    - '!libelogind0'
    - '!mawk'
    - '!original-awk'
    - base-files
    - ca-certificates-bundle
    - rancher-webhook-0.10=0.10.13-2
    - tzdata
accounts:
  run-as: "65532"
  users:
    - name: webhook
      uid: 65532
      gid: 65532
  groups:
    - name: webhook
      gid: 65532
      members:
        - webhook
os-release:
  name: Docker Hardened Images (Debian)
  id: debian
  version-id: "13"
  version-codename: trixie
  pretty-name: Docker Hardened Images/Debian GNU/Linux 13 (trixie)
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
annotations:
  org.opencontainers.image.description: A minimal Rancher Webhook image
  org.opencontainers.image.licenses: Apache-2.0
entrypoint:
  - /usr/bin/webhook
ports:
  - 9443/tcp
