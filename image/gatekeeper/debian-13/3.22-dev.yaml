# syntax=dhi.io/build:2-debian13

name: Gatekeeper 3.22.x (dev)
image: dhi.io/gatekeeper
variant: dev
tags:
  - 3.22-dev
  - 3.22.2-dev
  - 3.22-debian-dev
  - 3.22-debian13-dev
  - 3.22.2-debian-dev
  - 3.22.2-debian13-dev
platforms:
  - linux/amd64
  - linux/arm64
dates:
  release: "2026-03-09"
vars:
  FLAVORED_SUFFIX: -dev
  SEMVER_MAJOR_MINOR_VERSION: "3.22"
  SEMVER_MAJOR_VERSION: "3"
  SEMVER_VERSION: 3.22.2
  SUFFIX: -dev
  VERSION: 3.22.2-6
contents:
  repositories:
    - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
  keyring:
    - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
  packages:
    - '!gawk'
    - '!libelogind0'
    - '!original-awk'
    - apt
    - base-files
    - bash
    - ca-certificates
    - ca-certificates-bundle
    - coreutils
    - diffutils
    - dpkg
    - findutils
    - gatekeeper-3.22-dev=3.22.2-6
    - grep
    - libc-bin
    - mawk
    - perl-base
    - sed
    - tzdata
    - util-linux
accounts:
  root: true
  run-as: root
  users:
    - name: nonroot
      uid: 65532
      gid: 65532
    - name: _apt
      uid: 42
      gid: 65532
  groups:
    - name: nonroot
      gid: 65532
      members:
        - nonroot
os-release:
  name: Docker Hardened Images (Debian)
  id: debian
  version-id: "13"
  version-codename: trixie
  pretty-name: Docker Hardened Images/Debian GNU/Linux 13 (trixie)
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
environment:
  DEBIAN_FRONTEND: noninteractive
paths:
  - type: directory
    path: /usr/local/bin
    uid: 0
    gid: 0
  - type: symlink
    path: /usr/local/bin/gatekeeper
    uid: 0
    gid: 0
    source: /usr/bin/gatekeeper
  - type: symlink
    path: /manager
    uid: 0
    gid: 0
    source: /usr/local/bin/gatekeeper
annotations:
  org.opencontainers.image.description: A minimal Gatekeeper image
  org.opencontainers.image.licenses: Apache-2.0
entrypoint:
  - /usr/local/bin/gatekeeper
ports:
  - 8443/tcp
  - 9090/tcp
