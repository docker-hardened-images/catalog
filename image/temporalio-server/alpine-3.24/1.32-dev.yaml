# syntax=dhi.io/build:2-alpine3.24

name: Temporal Server 1.32.x (dev)
image: dhi.io/temporalio-server
variant: dev
tags:
  - 1-alpine-dev
  - 1.32-alpine-dev
  - 1-alpine3.24-dev
  - 1.32.1-alpine-dev
  - 1.32-alpine3.24-dev
  - 1.32.1-alpine3.24-dev
platforms:
  - linux/amd64
  - linux/arm64
dates:
  release: "2026-09-11"
vars:
  ARCH: '#{ target.arch == "amd64" ? "amd64" : "arm64" }'
  FLAVORED_SUFFIX: -dev
  SEMVER_MAJOR_MINOR_VERSION: "1.32"
  SEMVER_MAJOR_VERSION: "1"
  SEMVER_VERSION: 1.32.1
  SUFFIX: -dev
  VERSION: 1.32.1-r0
contents:
  repositories:
    - https://dhi.io/apk/alpine/v3.24/main
    - https://dl-cdn.alpinelinux.org/alpine/v3.24/main
    - https://dl-cdn.alpinelinux.org/alpine/v3.24/community
  keyring:
    - https://dhi.io/keyring/dhi-apk@docker-0F81AD7700D99184.rsa.pub
  packages:
    - alpine-baselayout-data
    - apk-tools
    - bash
    - busybox
    - ca-certificates
    - ca-certificates-bundle
    - coreutils
    - grep
    - temporalio-server-1.32-dev=1.32.1-r0
    - tzdata
accounts:
  root: true
  run-as: root
  users:
    - name: temporal
      uid: 1000
      gid: 1000
  groups:
    - name: temporal
      gid: 1000
      members:
        - temporal
os-release:
  name: Docker Hardened Images (Alpine)
  id: alpine
  version-id: "3.24"
  pretty-name: Docker Hardened Images/Alpine Linux v3.24
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
work-dir: /etc/temporal
environment:
  TEMPORAL_HOME: /etc/temporal
paths:
  - type: directory
    path: /etc/temporal/config
    uid: 1000
    gid: 1000
    mode: "0777"
annotations:
  org.opencontainers.image.description: Temporal Server - Workflow as Code to build and operate resilient applications
  org.opencontainers.image.licenses: MIT
entrypoint:
  - /etc/temporal/entrypoint.sh
ports:
  - 6933/tcp
  - 6934/tcp
  - 6935/tcp
  - 6939/tcp
  - 7233/tcp
  - 7234/tcp
  - 7235/tcp
  - 7239/tcp
