# syntax=dhi.io/build:2-debian13

name: Temporal Server 1.32.x (dev)
image: dhi.io/temporalio-server
variant: dev
tags:
  - 1-dev
  - 1.32-dev
  - 1.32.0-dev
  - 1-debian-dev
  - 1-debian13-dev
  - 1.32-debian-dev
  - 1.32-debian13-dev
  - 1.32.0-debian-dev
  - 1.32.0-debian13-dev
platforms:
  - linux/amd64
  - linux/arm64
dates:
  release: "2026-09-11"
vars:
  ARCH: '#{ target.arch == "amd64" ? "amd64" : "arm64" }'
  FLAVORED_SUFFIX: -dev
  SEMVER_MAJOR_MINOR_VERSION: "1.32"
  SEMVER_MAJOR_VERSION: "1"
  SEMVER_VERSION: 1.32.0
  SUFFIX: -dev
  VERSION: 1.32.0-2
contents:
  repositories:
    - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
  keyring:
    - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
  packages:
    - '!gawk'
    - '!libelogind0'
    - '!original-awk'
    - apt
    - base-files
    - bash
    - ca-certificates
    - ca-certificates-bundle
    - coreutils
    - diffutils
    - dpkg
    - findutils
    - grep
    - libc-bin
    - mawk
    - perl-base
    - sed
    - temporalio-server-1.32-dev=1.32.0-2
    - tzdata
    - util-linux
accounts:
  root: true
  run-as: root
  users:
    - name: temporal
      uid: 1000
      gid: 1000
    - name: _apt
      uid: 42
      gid: 65532
  groups:
    - name: temporal
      gid: 1000
      members:
        - temporal
os-release:
  name: Docker Hardened Images (Debian)
  id: debian
  version-id: "13"
  version-codename: trixie
  pretty-name: Docker Hardened Images/Debian GNU/Linux 13 (trixie)
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
work-dir: /etc/temporal
environment:
  DEBIAN_FRONTEND: noninteractive
  TEMPORAL_HOME: /etc/temporal
paths:
  - type: directory
    path: /etc/temporal/config
    uid: 1000
    gid: 1000
    mode: "0777"
annotations:
  org.opencontainers.image.description: Temporal Server - Workflow as Code to build and operate resilient applications
  org.opencontainers.image.licenses: MIT
entrypoint:
  - /etc/temporal/entrypoint.sh
ports:
  - 6933/tcp
  - 6934/tcp
  - 6935/tcp
  - 6939/tcp
  - 7233/tcp
  - 7234/tcp
  - 7235/tcp
  - 7239/tcp
