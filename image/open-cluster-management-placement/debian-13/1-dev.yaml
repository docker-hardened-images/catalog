# syntax=dhi.io/build:2-debian13

name: Placement 1.x (dev)
image: dhi.io/open-cluster-management-placement
variant: dev
tags:
  - 1-dev
  - 1.4-dev
  - 1.4.0-dev
  - 1-debian-dev
  - 1-debian13-dev
  - 1.4-debian-dev
  - 1.4-debian13-dev
  - 1.4.0-debian-dev
  - 1.4.0-debian13-dev
platforms:
  - linux/amd64
  - linux/arm64
dates:
  release: "2025-06-16"
vars:
  COMMIT_SHA: 45ecb6233fb316302a428d1d258e68a9cc2e7040
  SEMVER_MAJOR_MINOR_VERSION: "1.4"
  SEMVER_MAJOR_VERSION: "1"
  SEMVER_VERSION: 1.4.0
  VERSION: 1.4.0
contents:
  repositories:
    - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
  keyring:
    - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
  packages:
    - '!gawk'
    - '!libelogind0'
    - '!original-awk'
    - apt
    - base-files
    - bash
    - ca-certificates
    - ca-certificates-bundle
    - coreutils
    - diffutils
    - dpkg
    - findutils
    - grep
    - libc-bin
    - mawk
    - perl-base
    - sed
    - tzdata
    - util-linux
  builds:
    - name: placement
      work-dir: /go/src/open-cluster-management.io/ocm
      caches:
        - path: /go/pkg/mod
      contents:
        packages:
          - bash
          - ca-certificates-bundle
          - coreutils
          - golang-1.26
          - findutils
          - mawk
          - sed
        files:
          - url: git+https://github.com/open-cluster-management-io/ocm.git#v1.4.0
            checksum: 45ecb6233fb316302a428d1d258e68a9cc2e7040
            path: /go/src/open-cluster-management.io/ocm
            spdx:
              name: open-cluster-management-placement
              version: 1.4.0
              packages:
                - name: ocm
                  purl: pkg:golang/open-cluster-management.io/ocm@1.4.0
                  license: Apache-2.0
            uid: 0
            gid: 0
      pipeline:
        - name: remove vendor directory
          runs: |
            set -eux -o pipefail

            rm -rf vendor
        - name: patch cves
          uses: go/bump@v2
          with:
            deps:
              - golang.org/x/net@v0.60.0
              - github.com/google/cel-go@v0.30.0
              - google.golang.org/grpc@v1.85.0-dev.0.20260825072537-93e31b48545e
            download: true
        - name: adjust cel-go v0.30 test expectation
          runs: |
            set -eux -o pipefail

            sed -i '/name: "nil cluster"/,/expectedCost/ s/expectedCost:       3,/expectedCost:       2,/' pkg/placement/helpers/cel_test.go
        - name: re-vendor
          runs: |
            set -eux -o pipefail

            go mod vendor
        - name: test
          runs: |
            set -eux -o pipefail

            go test -short $(go list ./pkg/placement/... | grep -v /controllers) -count=1 -v
        - name: build placement
          uses: go/build@v1
          environment:
            GOFLAGS: -buildvcs=false
          with:
            ldflags:
              - -X open-cluster-management.io/ocm/pkg/version.versionFromGit=v1.4.0
              - -X open-cluster-management.io/ocm/pkg/version.commitFromGit=45ecb6233fb316302a428d1d258e68a9cc2e7040
            output: ${target.dir}/usr/local/bin/placement
            packages: ./cmd/placement
      outputs:
        - source: ${target.dir}/usr/local/bin/placement
          target: /usr/local/bin/placement
          uid: 0
          gid: 0
        - source: /opt/docker/sbom/open-cluster-management-placement
          target: /opt/docker/sbom/open-cluster-management-placement
          uid: 0
          gid: 0
accounts:
  root: true
  run-as: root
  users:
    - name: nonroot
      uid: 65532
      gid: 65532
    - name: _apt
      uid: 42
      gid: 65532
  groups:
    - name: nonroot
      gid: 65532
      members:
        - nonroot
os-release:
  name: Docker Hardened Images (Debian)
  id: debian
  version-id: "13"
  version-codename: trixie
  pretty-name: Docker Hardened Images/Debian GNU/Linux 13 (trixie)
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
environment:
  DEBIAN_FRONTEND: noninteractive
paths:
  - type: symlink
    path: /placement
    uid: 0
    gid: 0
    source: /usr/local/bin/placement
annotations:
  org.opencontainers.image.description: A minimal Placement controller image
  org.opencontainers.image.licenses: Apache-2.0
cmd:
  - /placement
  - controller
