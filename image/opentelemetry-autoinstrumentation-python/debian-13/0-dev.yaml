# syntax=dhi.io/build:2-debian13

name: OpenTelemetry Python Autoinstrumentation 0.x (dev)
image: dhi.io/opentelemetry-autoinstrumentation-python
variant: dev
tags:
  - 0-dev
  - 0.66-dev
  - 0.66b2-dev
  - 0-debian-dev
  - 0-debian13-dev
  - 0.66-debian-dev
  - 0.66-debian13-dev
  - 0.66b2-debian-dev
  - 0.66b2-debian13-dev
platforms:
  - linux/amd64
  - linux/arm64
dates:
  release: "2026-11-09"
vars:
  DEBIAN_EPOCH_MAJOR_VERSION: "0"
  FLAVORED_SUFFIX: -dev
  PIP_VERSION: 26.3-0
  PYTHON_MINOR: "3.15"
  PYTHON_VERSION: 3.15.2-9
  SUFFIX: -dev
  UPSTREAM_MAJOR_MINOR: "0.66"
  UPSTREAM_VERSION: 0.66b2
  VERSION: 0.66b2-5
contents:
  repositories:
    - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
  keyring:
    - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
  packages:
    - '!gawk'
    - '!libelogind0'
    - '!original-awk'
    - apt
    - base-files
    - bash
    - ca-certificates
    - ca-certificates-bundle
    - coreutils
    - diffutils
    - dpkg
    - findutils
    - gcc-14-base
    - grep
    - libbz2-1.0
    - libc-bin
    - libc6
    - libcrypt1
    - libdb5.3t64
    - libexpat1
    - libffi8
    - libgcc-s1
    - libgdbm-compat4t64
    - libgdbm6t64
    - liblzma5
    - libncursesw6
    - libpython-3.15-minimal=3.15.2-9
    - libpython-3.15-stdlib=3.15.2-9
    - libpython-3.15=3.15.2-9
    - libreadline8t64
    - libsqlite3-0
    - libssl3t64
    - libstdc++6
    - libtinfo6
    - libuuid1
    - libzstd1
    - mawk
    - openssl-provider-legacy
    - opentelemetry-autoinstrumentation-python-0=0.66b2-5
    - perl-base
    - python-3.15-minimal=3.15.2-9
    - python-3.15=3.15.2-9
    - python3-pip-whl=26.3-0
    - python3-setuptools-whl
    - readline-common
    - sed
    - tzdata
    - util-linux
    - zlib1g
accounts:
  root: true
  run-as: root
  users:
    - name: nonroot
      uid: 65532
      gid: 65532
    - name: _apt
      uid: 42
      gid: 65532
  groups:
    - name: nonroot
      gid: 65532
      members:
        - nonroot
os-release:
  name: Docker Hardened Images (Debian)
  id: debian
  version-id: "13"
  version-codename: trixie
  pretty-name: Docker Hardened Images/Debian GNU/Linux 13 (trixie)
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
environment:
  DEBIAN_FRONTEND: noninteractive
paths:
  - type: symlink
    path: /autoinstrumentation
    uid: 0
    gid: 0
    source: usr/lib/opentelemetry-autoinstrumentation-python/glibc
  - type: symlink
    path: /autoinstrumentation-musl
    uid: 0
    gid: 0
    source: usr/lib/opentelemetry-autoinstrumentation-python/musl
  - type: directory
    path: /otel-auto-instrumentation-python
    uid: 65532
    gid: 65532
    mode: "0755"
  - type: directory
    path: /usr/lib/python3/dist-packages
    uid: 0
    gid: 0
    mode: "0755"
annotations:
  org.opencontainers.image.description: A minimal OpenTelemetry Python Autoinstrumentation image
  org.opencontainers.image.licenses: Apache-2.0
cmd:
  - cp
  - -r
  - /autoinstrumentation/.
  - /otel-auto-instrumentation-python
