# syntax=dhi.io/build:2-debian13

name: PostgreSQL 18.x (dev)
image: dhi.io/postgres
variant: dev
tags:
  - 18-dev
  - 18.6-dev
  - 18-debian-dev
  - 18-debian13-dev
  - 18.6-debian-dev
  - 18.6-debian13-dev
platforms:
  - linux/amd64
  - linux/arm64
dates:
  release: "2025-09-25"
  end-of-life: "2030-11-14"
vars:
  GOSU_REFERENCE: dhi/pkg-gosu:1.19-debian13@sha256:c8d3f464708426e928beabdf198ddcbea1bfdcc305c58f3707dfb9e4aac9e590
  MAJOR_VERSION: "18"
  MINOR_VERSION: "6"
  PACKAGE_NAME: postgresql-18
  PGDATA: /var/lib/postgresql/18/data
  VERSION: 18.6-1
contents:
  repositories:
    - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
  keyring:
    - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
  packages:
    - '!gawk'
    - '!libelogind0'
    - '!mawk'
    - '!original-awk'
    - apt
    - base-files
    - bash
    - ca-certificates
    - coreutils
    - diffutils
    - dpkg
    - findutils
    - grep
    - less
    - libc-bin
    - libcurl4t64
    - libgssapi-krb5-2
    - libicu76
    - libldap2
    - liblz4-1
    - libnuma1
    - libpam0g
    - libreadline8t64
    - libselinux1
    - libssl3t64
    - liburing2
    - libuuid1
    - libxml2
    - libxslt1.1
    - libzstd1
    - llvm
    - locales
    - mawk
    - perl-base
    - postgresql-18=18.6-1
    - sed
    - tzdata
    - util-linux
    - zlib1g
  builds:
    - name: legacy /opt/postgresql layout
      contents:
        repositories:
          - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
        keyring:
          - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
        packages:
          - bash
          - coreutils
          - postgresql-18=18.6-1
      pipeline:
        - runs: |
            set -eux -o pipefail

            mkdir -p "/opt/postgresql/18/bin"

            for item in "/usr/lib/postgresql/18/"*; do
              [ -e "${item}" ] || continue
              name="$(basename "${item}")"
              ln -sfn "${item}" "/opt/postgresql/18/${name}"
            done

            while IFS= read -r path; do
              case "${path}" in
                /usr/bin/*)
                  [ -e "${path}" ] || continue
                  ln -sfn "${path}" "/opt/postgresql/18/bin/$(basename "${path}")"
                  ;;
              esac
            done < "/var/lib/dpkg/info/postgresql-18.list"
      outputs:
        - source: /opt/postgresql
          target: /opt/postgresql
          uid: 0
          gid: 0
    - name: locale
      contents:
        packages:
          - bash
          - locales
          - coreutils
          - gzip
      pipeline:
        - name: install locales
          runs: |
            set -eux -o pipefail

            ln -s /etc/locale.alias /usr/share/locale/locale.alias

            echo "en_US.UTF-8 UTF-8" >> /etc/locale.gen
            locale-gen en_US.UTF-8
      outputs:
        - source: /usr/share/locale
          target: /usr/share/locale
          uid: 0
          gid: 0
        - source: /usr/lib/locale
          target: /usr/lib/locale
          uid: 0
          gid: 0
  artifacts:
    - name: dhi.io/pkg-gosu:1.19-debian13@sha256:c8d3f464708426e928beabdf198ddcbea1bfdcc305c58f3707dfb9e4aac9e590
      includes:
        - opt/docker/sbom/gosu
        - usr/local/sbin/gosu
      uid: 0
      gid: 0
accounts:
  root: true
  run-as: root
  users:
    - name: postgres
      uid: 70
      gid: 70
    - name: _apt
      uid: 42
      gid: 65532
  groups:
    - name: postgres
      gid: 70
      members:
        - postgres
os-release:
  name: Docker Hardened Images (Debian)
  id: debian
  version-id: "13"
  version-codename: trixie
  pretty-name: Docker Hardened Images/Debian GNU/Linux 13 (trixie)
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
stop-signal: SIGINT
environment:
  DEBIAN_FRONTEND: noninteractive
  LANG: en_US.UTF-8
  LANGUAGE: en_US:en
  LC_ALL: en_US.UTF-8
  PATH: /opt/postgresql/18/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
  PG_MAJOR: "18"
  PG_MINOR: "6"
  PGDATA: /var/lib/postgresql/18/data
paths:
  - type: directory
    path: /var/lib/postgresql/18/data
    uid: 70
    gid: 70
    mode: "0700"
  - type: file
    path: /usr/local/bin/docker-entrypoint.sh
    uid: 0
    gid: 0
    mode: "0755"
    source: image/postgres/bin/docker-entrypoint.sh
annotations:
  org.opencontainers.image.description: A minimal PostgreSQL image
  org.opencontainers.image.licenses: PostgreSQL
entrypoint:
  - /usr/local/bin/docker-entrypoint.sh
ports:
  - 5432/tcp
