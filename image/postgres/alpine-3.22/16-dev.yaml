# syntax=dhi.io/build:2-alpine3.22

name: PostgreSQL 16.x (dev)
image: dhi.io/postgres
variant: dev
tags:
  - 16-alpine3.22-dev
  - 16.15-alpine3.22-dev
platforms:
  - linux/amd64
  - linux/arm64
dates:
  release: "2023-09-14"
  end-of-life: "2028-11-09"
vars:
  GOLANG_FIPS_REFERENCE: dhi/golang:1.26.11-alpine3.22-fips-dev@sha256:e57b922c59f1ac808bdf4a25dc0f61e0dd2dfdcf22deb543e4759a6be28c4e69
  GOLANG_REFERENCE: dhi/golang:1.26.11-alpine3.22-dev@sha256:9748de92567659334c9466c4fc9191e8e84bdc60abb1164915d7276973fd25a9
  GOSU_COMMIT_SHA: 29b939aa5bd4dc588af765b8248f6e39150d2565
  GOSU_VERSION: "1.20"
  MAJOR_VERSION: "16"
  MINOR_VERSION: "15"
  PGDATA: /var/lib/postgresql/16/data
contents:
  repositories:
    - https://dl-cdn.alpinelinux.org/alpine/v3.22/main
    - https://dl-cdn.alpinelinux.org/alpine/v3.22/community
  packages:
    - alpine-baselayout-data
    - apk-tools
    - bash
    - busybox
    - ca-certificates-bundle
    - findutils
    - icu-data-full
    - icu-libs
    - krb5-libs
    - less
    - libcrypto3
    - libldap
    - libselinux
    - libssl3
    - libuuid
    - libxml2
    - libxslt
    - linux-pam
    - llvm20-libs
    - lz4-libs
    - readline
    - tzdata
    - zlib
    - zstd-libs
  builds:
    - name: postgres
      contents:
        repositories:
          - https://dl-cdn.alpinelinux.org/alpine/v3.22/main
          - https://dl-cdn.alpinelinux.org/alpine/v3.22/community
        packages:
          - autoconf
          - automake
          - bison
          - clang
          - curl-dev
          - flex
          - g++
          - gcc
          - icu-dev
          - krb5-dev
          - libselinux-dev
          - liburing-dev
          - libxml2-dev
          - libxslt-dev
          - linux-pam-dev
          - llvm-dev
          - lz4
          - lz4-dev
          - make
          - numactl-dev
          - openldap-dev
          - openssl-dev
          - pkgconf
          - readline-dev
          - tzdata
          - util-linux-dev
          - zlib-dev
          - zstd
          - zstd-dev
        files:
          - url: https://ftp.postgresql.org/pub/source/v16.15/postgresql-16.15.tar.gz
            checksum: https://ftp.postgresql.org/pub/source/v16.15/postgresql-16.15.tar.gz.sha256
            path: ${source.dir}/
            spdx:
              name: postgresql
              version: "16.15"
              packages:
                - name: postgresql
                  purl: pkg:dhi/postgresql@16.15
                  license: PostgreSQL
            uid: 0
            gid: 0
      pipeline:
        - name: patch source
          uses: patch@v1
          work-dir: ${source.dir}/postgresql-16.15
          with:
            options: -p1
            patches:
              - ${source.dir}/patch/initdb.patch
              - ${source.dir}/patch/pager-less.patch
              - ${source.dir}/patch/dont-use-locale-a-on-musl.pg16.patch
              - ${source.dir}/patch/icu-collections-hack.pg16.patch
        - name: build and install
          work-dir: ${source.dir}/postgresql-16.15
          runs: |
            set -eux -o pipefail

            ./configure \
              --prefix='/opt/postgresql/16' \
              --with-gssapi \
              --with-icu \
              --with-ldap \
              --with-libcurl \
              --with-libnuma \
              --with-liburing \
              --with-libxml \
              --with-libxslt \
              --with-llvm \
              --with-lz4 \
              --with-pam \
              --with-selinux \
              --with-ssl=openssl \
              --with-uuid=e2fs \
              --with-zstd \
              --with-system-tzdata=/usr/share/zoneinfo

            make world-bin -j"$(nproc)"

            make install-world-bin DESTDIR='${target.dir}'
        - name: configure defaults
          work-dir: ${target.dir}/opt/postgresql/16/share
          runs: |
            set -eux -o pipefail

            sed -E -i postgresql.conf.sample \
              -e "s|^#?(listen_addresses)\s*=\s*\S+.*|\1 = '*'|"
      paths:
        - type: file
          path: ${source.dir}/patch/initdb.patch
          uid: 0
          gid: 0
          source: image/postgres/patch/initdb.patch
        - type: file
          path: ${source.dir}/patch/pager-less.patch
          uid: 0
          gid: 0
          source: image/postgres/patch/pager-less.patch
        - type: file
          path: ${source.dir}/patch/dont-use-locale-a-on-musl.pg16.patch
          uid: 0
          gid: 0
          source: image/postgres/patch/alpine-3.22/dont-use-locale-a-on-musl.pg16.patch
        - type: file
          path: ${source.dir}/patch/icu-collections-hack.pg16.patch
          uid: 0
          gid: 0
          source: image/postgres/patch/alpine-3.22/icu-collections-hack.pg16.patch
      outputs:
        - source: ${target.dir}/opt/postgresql/16
          target: /opt/postgresql/16
          uid: 0
          gid: 0
        - source: /opt/docker/sbom/postgresql
          target: /opt/docker/sbom/postgresql
          uid: 0
          gid: 0
    - name: gosu
      uses: dhi.io/golang:1.26.11-alpine3.22-dev@sha256:9748de92567659334c9466c4fc9191e8e84bdc60abb1164915d7276973fd25a9
      work-dir: /go/src/github.com/tianon/gosu
      contents:
        files:
          - url: git+https://github.com/tianon/gosu.git#1.20
            checksum: 29b939aa5bd4dc588af765b8248f6e39150d2565
            path: /go/src/github.com/tianon/gosu
            spdx:
              name: gosu
              version: "1.20"
              packages:
                - name: gosu
                  purl: pkg:golang/github.com/tianon/gosu@1.20
                  license: Apache-2.0
            uid: 0
            gid: 0
      pipeline:
        - name: update Go dependencies
          uses: go/bump@v2
          with:
            deps:
              - golang.org/x/sys@v0.44.0
              - github.com/moby/sys/user@v0.4.1
            tidy: true
        - uses: go/hermetic@v1
        - name: build gosu
          uses: go/build@v1
          with:
            output: ${target.dir}/usr/local/sbin/gosu
      outputs:
        - source: ${target.dir}/usr/local/sbin/gosu
          target: /usr/local/sbin/gosu
          uid: 0
          gid: 0
        - source: /opt/docker/sbom/gosu
          target: /opt/docker/sbom/gosu
          uid: 0
          gid: 0
accounts:
  root: true
  run-as: root
  users:
    - name: postgres
      uid: 70
      gid: 70
  groups:
    - name: postgres
      gid: 70
      members:
        - postgres
os-release:
  name: Docker Hardened Images (Alpine)
  id: alpine
  version-id: "3.22"
  pretty-name: Docker Hardened Images/Alpine Linux v3.22
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
stop-signal: SIGINT
environment:
  PATH: /opt/postgresql/16/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
  PG_MAJOR: "16"
  PG_MINOR: "15"
  PGDATA: /var/lib/postgresql/16/data
paths:
  - type: directory
    path: /var/lib/postgresql/16/data
    uid: 70
    gid: 70
    mode: "0700"
  - type: file
    path: /usr/local/bin/docker-entrypoint.sh
    uid: 0
    gid: 0
    mode: "0755"
    source: image/postgres/bin/docker-entrypoint.sh
annotations:
  org.opencontainers.image.description: A minimal PostgreSQL image
  org.opencontainers.image.licenses: PostgreSQL
entrypoint:
  - /usr/local/bin/docker-entrypoint.sh
ports:
  - 5432/tcp
