# syntax=dhi.io/build:2-debian13

name: Azul Platform Prime 21.x
image: dhi.io/azul
variant: runtime
tags:
  - 21-jdk-prime
  - 21-jdk-prime-debian
  - 21-jdk-prime-debian13
platforms:
  - linux/amd64
  - linux/arm64
dates:
  release: "2023-09-19"
  end-of-life: "2031-09-30"
vars:
  JAVA_MAJOR_VERSION: "21"
  JAVA_VERSION: 21.0.0
  PACKAGE_NAME: azul-prime-21-jdk
  VERSION: 26.01.0.0-11-0
  ZLIB1G_VERSION: 1:1.3.dfsg+really1.3.1-1+deb13u1+dhi0
contents:
  repositories:
    - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
  keyring:
    - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
  packages:
    - '!libelogind0'
    - '!mawk'
    - '!original-awk'
    - azul-prime-21-jdk=26.01.0.0-11-0
    - base-files
    - ca-certificates-bundle
    - libc6
    - tzdata
    - zlib1g=1:1.3.dfsg+really1.3.1-1+deb13u1+dhi0
  builds:
    - name: locale
      contents:
        packages:
          - bash
          - locales
          - coreutils
          - gzip
      pipeline:
        - name: install locales
          runs: |
            set -eux -o pipefail

            ln -s /etc/locale.alias /usr/share/locale/locale.alias

            echo "en_US.UTF-8 UTF-8" >> /etc/locale.gen
            locale-gen en_US.UTF-8
      outputs:
        - source: /usr/share/locale
          target: /usr/share/locale
          uid: 0
          gid: 0
        - source: /usr/lib/locale
          target: /usr/lib/locale
          uid: 0
          gid: 0
accounts:
  run-as: nonroot
  users:
    - name: nonroot
      uid: 65532
      gid: 65532
  groups:
    - name: nonroot
      gid: 65532
      members:
        - nonroot
os-release:
  name: Docker Hardened Images (Debian)
  id: debian
  version-id: "13"
  version-codename: trixie
  pretty-name: Docker Hardened Images/Debian GNU/Linux 13 (trixie)
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
environment:
  JAVA_HOME: /opt/zing/zing-jdk21
  LANG: en_US.UTF-8
  LANGUAGE: en_US:en
  LC_ALL: en_US.UTF-8
  PATH: /opt/zing/zing-jdk21/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
paths:
  - type: symlink
    path: /opt/zing
    uid: 0
    gid: 0
    source: /usr/lib/jvm
annotations:
  org.opencontainers.image.description: A minimal Azul Platform Prime image
cmd:
  - java
  - --help
