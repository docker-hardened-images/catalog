# syntax=dhi.io/build:2-debian13

name: Tippecanoe 2.x
image: dhi.io/tippecanoe
variant: runtime
tags:
  - "2"
  - "2.79"
  - 2.79.0
  - 2-debian
  - 2-debian13
  - 2.79-debian
  - 2.79-debian13
  - 2.79.0-debian
  - 2.79.0-debian13
platforms:
  - linux/amd64
  - linux/arm64
dates:
  release: "2022-08-12"
vars:
  SEMVER_MAJOR_MINOR_VERSION: "2.79"
  SEMVER_MAJOR_VERSION: "2"
  SEMVER_VERSION: 2.79.0
  VERSION: 2.79.0-0
contents:
  repositories:
    - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
  keyring:
    - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
  packages:
    - '!libelogind0'
    - '!mawk'
    - '!original-awk'
    - base-files
    - ca-certificates-bundle
    - libc6
    - libgcc-s1
    - libsqlite3-0
    - libstdc++6
    - tippecanoe-2=2.79.0-0
    - tzdata
    - zlib1g
accounts:
  run-as: nonroot
  users:
    - name: nonroot
      uid: 65532
      gid: 65532
  groups:
    - name: nonroot
      gid: 65532
      members:
        - nonroot
os-release:
  name: Docker Hardened Images (Debian)
  id: debian
  version-id: "13"
  version-codename: trixie
  pretty-name: Docker Hardened Images/Debian GNU/Linux 13 (trixie)
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
work-dir: /app
paths:
  - type: directory
    path: /app
    uid: 65532
    gid: 65532
    mode: "0770"
  - type: directory
    path: /usr/local/bin
    uid: 0
    gid: 0
  - type: symlink
    path: /usr/local/bin/tippecanoe
    uid: 0
    gid: 0
    source: /usr/bin/tippecanoe
  - type: symlink
    path: /usr/local/bin/tippecanoe-enumerate
    uid: 0
    gid: 0
    source: /usr/bin/tippecanoe-enumerate
  - type: symlink
    path: /usr/local/bin/tippecanoe-decode
    uid: 0
    gid: 0
    source: /usr/bin/tippecanoe-decode
  - type: symlink
    path: /usr/local/bin/tippecanoe-json-tool
    uid: 0
    gid: 0
    source: /usr/bin/tippecanoe-json-tool
  - type: symlink
    path: /usr/local/bin/tippecanoe-overzoom
    uid: 0
    gid: 0
    source: /usr/bin/tippecanoe-overzoom
  - type: symlink
    path: /usr/local/bin/tile-join
    uid: 0
    gid: 0
    source: /usr/bin/tile-join
annotations:
  org.opencontainers.image.description: A minimal Tippecanoe image
  org.opencontainers.image.licenses: BSD-2-Clause
cmd:
  - tippecanoe
  - -v
