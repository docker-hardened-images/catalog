metadata:
  display-name: Tippecanoe
  short-description: Build vector tilesets from large collections of GeoJSON features.
  featured: false
  home-url: https://github.com/felt/tippecanoe
  categories:
    - developer-tools
  included-tools:
    - name: tippecanoe
      description: Build a vector tileset from GeoJSON features
    - name: tippecanoe-decode
      description: Decode an mbtiles tileset back to GeoJSON
    - name: tippecanoe-enumerate
      description: List the tiles stored in an mbtiles file
    - name: tippecanoe-json-tool
      description: Inspect and rewrite GeoJSON features
    - name: tippecanoe-overzoom
      description: Generate overzoomed tiles from an existing tileset
    - name: tile-join
      description: Join and copy vector tiles between mbtiles files
