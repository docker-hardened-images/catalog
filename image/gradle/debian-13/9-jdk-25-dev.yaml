# syntax=dhi.io/build:2-debian13

name: Gradle 9.x JDK 25.x (dev)
image: dhi.io/gradle
variant: dev
tags:
  - 9-jdk25-dev
  - 9.9-jdk25-dev
  - 9.9.1-1-jdk25-dev
  - 9-jdk25-debian-dev
  - 9-jdk25-debian13-dev
  - 9.9-jdk25-debian-dev
  - 9.9-jdk25-debian13-dev
  - 9.9.1-1-jdk25-debian-dev
  - 9.9.1-1-jdk25-debian13-dev
platforms:
  - linux/amd64
  - linux/arm64
dates:
  release: "2025-07-31"
vars:
  EXPAT_VERSION: 2.9.0-1~deb13u1+dhi2
  GRADLE_MAJOR_MINOR_VERSION: "9.9"
  GRADLE_MAJOR_VERSION: "9"
  GRADLE_SEMVER: 9.9.1
  GRADLE_VERSION: 9.9.1-1
  JAVA_MAJOR_VERSION: "25"
  JAVA_VERSION: 1:25.0.5+8-3
  MAJOR_VERSION: "9"
  VERSION: 9.9.1
contents:
  repositories:
    - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
  keyring:
    - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
  packages:
    - '!gawk'
    - '!libelogind0'
    - '!libslang2'
    - '!mawk'
    - '!original-awk'
    - apt
    - base-files
    - bash
    - ca-certificates
    - coreutils
    - diffutils
    - dpkg
    - eclipse-temurin-25-jdk-oci-config=1:25.0.5+8-3
    - eclipse-temurin-25-jdk=1:25.0.5+8-3
    - findutils
    - git
    - gradle-9=9.9.1-1
    - grep
    - libasound2t64
    - libc-bin
    - libexpat1=2.9.0-1~deb13u1+dhi2
    - libncurses6
    - libudev-dev
    - locales
    - mawk
    - perl-base
    - sed
    - tzdata
    - util-linux
  builds:
    - name: locale
      contents:
        packages:
          - bash
          - locales
          - coreutils
          - gzip
      pipeline:
        - name: install locales
          runs: |
            set -eux -o pipefail

            ln -s /etc/locale.alias /usr/share/locale/locale.alias

            echo "en_US.UTF-8 UTF-8" >> /etc/locale.gen
            locale-gen en_US.UTF-8
      outputs:
        - source: /usr/share/locale
          target: /usr/share/locale
          uid: 0
          gid: 0
        - source: /usr/lib/locale
          target: /usr/lib/locale
          uid: 0
          gid: 0
accounts:
  root: true
  run-as: root
  users:
    - name: nonroot
      uid: 65532
      gid: 65532
    - name: _apt
      uid: 42
      gid: 65532
  groups:
    - name: nonroot
      gid: 65532
      members:
        - nonroot
os-release:
  name: Docker Hardened Images (Debian)
  id: debian
  version-id: "13"
  version-codename: trixie
  pretty-name: Docker Hardened Images/Debian GNU/Linux 13 (trixie)
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
work-dir: /build
environment:
  DEBIAN_FRONTEND: noninteractive
  GRADLE_HOME: /usr/share/java/gradle
  GRADLE_VERSION: 9.9.1
  JAVA_HOME: /usr/lib/jvm/temurin-25
  LANG: en_US.UTF-8
  LANGUAGE: en_US:en
  LC_ALL: en_US.UTF-8
paths:
  - type: directory
    path: /build
    uid: 65532
    gid: 65532
    mode: "0755"
  - type: directory
    path: /opt/java
    uid: 0
    gid: 0
    mode: "0755"
  - type: directory
    path: /opt/java/openjdk
    uid: 0
    gid: 0
    mode: "0755"
  - type: symlink
    path: /opt/java/openjdk/25
    uid: 0
    gid: 0
    source: /usr/lib/jvm/temurin-25
  - type: directory
    path: /opt/java/gradle
    uid: 0
    gid: 0
    mode: "0755"
  - type: symlink
    path: /opt/java/gradle/gradle-9.9.1
    uid: 0
    gid: 0
    source: /usr/share/java/gradle
annotations:
  org.opencontainers.image.description: A minimal Gradle image
  org.opencontainers.image.licenses: Apache-2.0
entrypoint:
  - gradle
