# syntax=dhi.io/build:2-debian13

name: Harbor Redis 2.14.x
image: dhi.io/harbor-redis
variant: runtime
tags:
  - "2.14"
  - 2.14.6
  - 2.14-debian
  - 2.14-debian13
  - 2.14.6-debian
  - 2.14.6-debian13
platforms:
  - linux/amd64
  - linux/arm64
dates:
  release: "2025-09-17"
vars:
  CACHE_SERVER_BINARY: redis-server
  CACHE_SERVER_PRODUCT: Redis
  CACHE_SERVER_VERSION_PREFIX: 7.2.
  REDIS_VERSION: 6:7.2.17-1rl1~trixie1
  SEMVER_MAJOR_MINOR_VERSION: "2.14"
  SEMVER_MAJOR_VERSION: "2"
  SEMVER_VERSION: 2.14.6
  VERSION: 2.14.6-0
  redis: pkg:deb/redis/redis@6:7.2.16-1rl1~trixie1?os_name=debian&os_version=13
  redis-server: pkg:deb/redis/redis-server@6:7.2.16-1rl1~trixie1?os_name=debian&os_version=13
  redis-tools: pkg:deb/redis/redis-tools@6:7.2.16-1rl1~trixie1?os_name=debian&os_version=13
contents:
  repositories:
    - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
    - deb [signed-by=/usr/share/keyrings/redis-archive-keyring.gpg] https://packages.redis.io/deb trixie main
  keyring:
    - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
    - https://packages.redis.io/gpg
  packages:
    - '!libelogind0'
    - '!mawk'
    - '!original-awk'
    - base-files
    - ca-certificates-bundle
    - harbor-redis-2.14=2.14.6-0
    - libpcre2-8-0
    - libssl3t64
    - libsystemd0
    - redis-server=6:7.2.17-1rl1~trixie1
    - redis-tools=6:7.2.17-1rl1~trixie1
    - redis=6:7.2.17-1rl1~trixie1
    - tzdata
  mappings:
    redis: pkg:deb/redis/redis@6:7.2.17-1rl1~trixie1?os_name=debian&os_version=13
    redis-server: pkg:deb/redis/redis-server@6:7.2.17-1rl1~trixie1?os_name=debian&os_version=13
    redis-tools: pkg:deb/redis/redis-tools@6:7.2.17-1rl1~trixie1?os_name=debian&os_version=13
accounts:
  run-as: redis
  users:
    - name: redis
      uid: 999
      gid: 999
  groups:
    - name: redis
      gid: 999
      members:
        - redis
os-release:
  name: Docker Hardened Images (Debian)
  id: debian
  version-id: "13"
  version-codename: trixie
  pretty-name: Docker Hardened Images/Debian GNU/Linux 13 (trixie)
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
work-dir: /var/lib/redis
paths:
  - type: symlink
    path: /etc/redis.conf
    uid: 0
    gid: 0
    source: /etc/harbor-redis/redis.conf
  - type: directory
    path: /var/lib/redis
    uid: 999
    gid: 999
    mode: "750"
  - type: directory
    path: /var/log/redis
    uid: 999
    gid: 999
    mode: "0755"
  - type: directory
    path: /run/redis
    uid: 999
    gid: 999
    mode: "0755"
annotations:
  org.opencontainers.image.description: A minimal Harbor Redis image
  org.opencontainers.image.licenses: Apache-2.0
entrypoint:
  - redis-server
cmd:
  - /etc/redis.conf
ports:
  - 6379/tcp
