# syntax=dhi.io/build:2-debian13

name: Harbor Redis 2.15.x (dev)
image: dhi.io/harbor-redis
variant: dev
tags:
  - 2.15-dev
  - 2.15.2-dev
  - 2.15-debian-dev
  - 2.15-debian13-dev
  - 2.15.2-debian-dev
  - 2.15.2-debian13-dev
platforms:
  - linux/amd64
  - linux/arm64
dates:
  release: "2026-03-19"
vars:
  REDIS_VERSION: 6:7.2.16-1rl1~trixie1
  SEMVER_MAJOR_MINOR_VERSION: "2.15"
  SEMVER_MAJOR_VERSION: "2"
  SEMVER_VERSION: 2.15.2
  VERSION: 2.15.2-0
  redis: pkg:deb/redis/redis@6:7.2.16-1rl1~trixie1?os_name=debian&os_version=13
  redis-server: pkg:deb/redis/redis-server@6:7.2.16-1rl1~trixie1?os_name=debian&os_version=13
  redis-tools: pkg:deb/redis/redis-tools@6:7.2.16-1rl1~trixie1?os_name=debian&os_version=13
contents:
  repositories:
    - deb [signed-by=/usr/share/keyrings/redis-archive-keyring.gpg] https://packages.redis.io/deb trixie main
    - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
  keyring:
    - https://packages.redis.io/gpg
    - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
  packages:
    - '!gawk'
    - '!libelogind0'
    - '!mawk'
    - '!original-awk'
    - adduser
    - apt
    - base-files
    - bash
    - ca-certificates
    - ca-certificates-bundle
    - coreutils
    - diffutils
    - dpkg
    - findutils
    - grep
    - harbor-redis-2.15=2.15.2-0
    - libc-bin
    - libpcre2-8-0
    - libssl3t64
    - libsystemd0
    - lsb-base
    - mawk
    - perl-base
    - redis-server=6:7.2.16-1rl1~trixie1
    - redis-tools=6:7.2.16-1rl1~trixie1
    - redis=6:7.2.16-1rl1~trixie1
    - sed
    - tzdata
    - util-linux
  mappings:
    redis: pkg:deb/redis/redis@6:7.2.16-1rl1~trixie1?os_name=debian&os_version=13
    redis-server: pkg:deb/redis/redis-server@6:7.2.16-1rl1~trixie1?os_name=debian&os_version=13
    redis-tools: pkg:deb/redis/redis-tools@6:7.2.16-1rl1~trixie1?os_name=debian&os_version=13
accounts:
  root: true
  run-as: root
  users:
    - name: redis
      uid: 999
      gid: 999
    - name: _apt
      uid: 42
      gid: 65532
  groups:
    - name: redis
      gid: 999
      members:
        - redis
os-release:
  name: Docker Hardened Images (Debian)
  id: debian
  version-id: "13"
  version-codename: trixie
  pretty-name: Docker Hardened Images/Debian GNU/Linux 13 (trixie)
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
work-dir: /var/lib/redis
environment:
  DEBIAN_FRONTEND: noninteractive
paths:
  - type: symlink
    path: /etc/redis.conf
    uid: 0
    gid: 0
    source: /etc/harbor-redis/redis.conf
  - type: directory
    path: /var/lib/redis
    uid: 999
    gid: 999
    mode: "750"
  - type: directory
    path: /var/log/redis
    uid: 999
    gid: 999
    mode: "0755"
  - type: directory
    path: /run/redis
    uid: 999
    gid: 999
    mode: "0755"
  - type: symlink
    path: /usr/bin/valkey-cli
    uid: 0
    gid: 0
    source: /usr/bin/redis-cli
annotations:
  org.opencontainers.image.description: A minimal Harbor Redis image
  org.opencontainers.image.licenses: Apache-2.0
entrypoint:
  - redis-server
cmd:
  - /etc/redis.conf
ports:
  - 6379/tcp
