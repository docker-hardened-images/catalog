# syntax=dhi.io/build:2-debian13

name: Sorry Cypress Director 2.x (dev)
image: dhi.io/sorry-cypress-director
variant: dev
tags:
  - 2-dev
  - 2.6-dev
  - 2.6.0-dev
  - 2-debian-dev
  - 2-debian13-dev
  - 2.6-debian-dev
  - 2.6-debian13-dev
  - 2.6.0-debian-dev
  - 2.6.0-debian13-dev
platforms:
  - linux/amd64
  - linux/arm64
dates:
  release: "2021-12-13"
vars:
  SEMVER_MAJOR_MINOR_VERSION: "2.6"
  SEMVER_MAJOR_VERSION: "2"
  SEMVER_VERSION: 2.6.0
  VERSION: 2.6.0-0
contents:
  repositories:
    - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
  keyring:
    - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
  packages:
    - '!gawk'
    - '!libelogind0'
    - '!original-awk'
    - apt
    - base-files
    - bash
    - ca-certificates
    - ca-certificates-bundle
    - coreutils
    - diffutils
    - dpkg
    - findutils
    - grep
    - libc-bin
    - mawk
    - nodejs-24
    - perl-base
    - sed
    - sorry-cypress-director-2=2.6.0-0
    - tini
    - tzdata
    - util-linux
accounts:
  root: true
  run-as: root
  users:
    - name: nonroot
      uid: 65532
      gid: 65532
    - name: _apt
      uid: 42
      gid: 65532
  groups:
    - name: nonroot
      gid: 65532
      members:
        - nonroot
os-release:
  name: Docker Hardened Images (Debian)
  id: debian
  version-id: "13"
  version-codename: trixie
  pretty-name: Docker Hardened Images/Debian GNU/Linux 13 (trixie)
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
work-dir: /app
environment:
  DEBIAN_FRONTEND: noninteractive
  NODE_ENV: production
paths:
  - type: directory
    path: /usr/local/bin
    uid: 0
    gid: 0
  - type: symlink
    path: /usr/local/bin/sorry-cypress-director
    uid: 0
    gid: 0
    source: /usr/bin/sorry-cypress-director
  - type: symlink
    path: /app
    uid: 0
    gid: 0
    source: /usr/lib/nodejs/sorry-cypress-director
  - type: symlink
    path: /usr/sbin/tini
    uid: 0
    gid: 0
    source: /usr/bin/tini
annotations:
  org.opencontainers.image.description: A minimal Sorry Cypress director image
  org.opencontainers.image.licenses: MIT
entrypoint:
  - tini
  - --
cmd:
  - /usr/local/bin/sorry-cypress-director
ports:
  - 1234/tcp
