# syntax=dhi.io/build:2-debian13

name: Sorry Cypress Director 2.x
image: dhi.io/sorry-cypress-director
variant: runtime
tags:
  - "2"
  - "2.6"
  - 2.6.0
  - 2-debian
  - 2-debian13
  - 2.6-debian
  - 2.6-debian13
  - 2.6.0-debian
  - 2.6.0-debian13
platforms:
  - linux/amd64
  - linux/arm64
dates:
  release: "2021-12-13"
vars:
  SEMVER_MAJOR_MINOR_VERSION: "2.6"
  SEMVER_MAJOR_VERSION: "2"
  SEMVER_VERSION: 2.6.0
  VERSION: 2.6.0-0
contents:
  repositories:
    - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
  keyring:
    - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
  packages:
    - base-files
    - ca-certificates-bundle
    - nodejs-24
    - sorry-cypress-director-2=2.6.0-0
    - tini
    - tzdata
accounts:
  run-as: nonroot
  users:
    - name: nonroot
      uid: 65532
      gid: 65532
  groups:
    - name: nonroot
      gid: 65532
      members:
        - nonroot
os-release:
  name: Docker Hardened Images (Debian)
  id: debian
  version-id: "13"
  version-codename: trixie
  pretty-name: Docker Hardened Images/Debian GNU/Linux 13 (trixie)
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
work-dir: /app
environment:
  NODE_ENV: production
paths:
  - type: directory
    path: /usr/local/bin
    uid: 0
    gid: 0
  - type: symlink
    path: /usr/local/bin/sorry-cypress-director
    uid: 0
    gid: 0
    source: /usr/bin/sorry-cypress-director
  - type: symlink
    path: /app
    uid: 0
    gid: 0
    source: /usr/lib/nodejs/sorry-cypress-director
  - type: symlink
    path: /usr/sbin/tini
    uid: 0
    gid: 0
    source: /usr/bin/tini
annotations:
  org.opencontainers.image.description: A minimal Sorry Cypress director image
  org.opencontainers.image.licenses: MIT
entrypoint:
  - tini
  - --
cmd:
  - /usr/local/bin/sorry-cypress-director
ports:
  - 1234/tcp
