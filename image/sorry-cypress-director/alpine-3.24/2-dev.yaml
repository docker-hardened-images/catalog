# syntax=dhi.io/build:2-alpine3.24

name: Sorry Cypress Director 2.x (dev)
image: dhi.io/sorry-cypress-director
variant: dev
tags:
  - 2-alpine-dev
  - 2.6-alpine-dev
  - 2-alpine3.24-dev
  - 2.6.0-alpine-dev
  - 2.6-alpine3.24-dev
  - 2.6.0-alpine3.24-dev
platforms:
  - linux/amd64
  - linux/arm64
dates:
  release: "2021-12-13"
vars:
  SEMVER_MAJOR_MINOR_VERSION: "2.6"
  SEMVER_MAJOR_VERSION: "2"
  SEMVER_VERSION: 2.6.0
  VERSION: 2.6.0-r0
contents:
  repositories:
    - https://dhi.io/apk/alpine/v3.24/main
    - https://dl-cdn.alpinelinux.org/alpine/v3.24/main
    - https://dl-cdn.alpinelinux.org/alpine/v3.24/community
  keyring:
    - https://dhi.io/keyring/dhi-apk@docker-0F81AD7700D99184.rsa.pub
  packages:
    - alpine-baselayout-data
    - apk-tools
    - busybox
    - ca-certificates
    - ca-certificates-bundle
    - nodejs-24
    - sorry-cypress-director-2=2.6.0-r0
    - tini
    - tzdata
accounts:
  root: true
  run-as: root
  users:
    - name: nonroot
      uid: 65532
      gid: 65532
  groups:
    - name: nonroot
      gid: 65532
      members:
        - nonroot
os-release:
  name: Docker Hardened Images (Alpine)
  id: alpine
  version-id: "3.24"
  pretty-name: Docker Hardened Images/Alpine Linux v3.24
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
work-dir: /app
environment:
  NODE_ENV: production
paths:
  - type: directory
    path: /usr/local/bin
    uid: 0
    gid: 0
  - type: symlink
    path: /usr/local/bin/sorry-cypress-director
    uid: 0
    gid: 0
    source: /usr/bin/sorry-cypress-director
  - type: symlink
    path: /app
    uid: 0
    gid: 0
    source: /usr/lib/nodejs/sorry-cypress-director
annotations:
  org.opencontainers.image.description: A minimal Sorry Cypress director image
  org.opencontainers.image.licenses: MIT
entrypoint:
  - tini
  - --
cmd:
  - /usr/local/bin/sorry-cypress-director
ports:
  - 1234/tcp
