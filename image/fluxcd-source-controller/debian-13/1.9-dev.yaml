# syntax=dhi.io/build:2-debian13

name: fluxcd source controller 1.9.x (dev)
image: dhi.io/fluxcd-source-controller
variant: dev
tags:
  - 1-dev
  - 1.9-dev
  - 1.9.6-dev
  - 1-debian-dev
  - 1-debian13-dev
  - 1.9-debian-dev
  - 1.9-debian13-dev
  - 1.9.6-debian-dev
  - 1.9.6-debian13-dev
platforms:
  - linux/amd64
  - linux/arm64
dates:
  release: "2023-07-03"
vars:
  COMMIT_SHA: 456fa323ef6a4b977f220cf2c60298bf193497ba
  SEMVER_MAJOR_MINOR_VERSION: "1.9"
  SEMVER_MAJOR_VERSION: "1"
  SEMVER_VERSION: 1.9.6
  VERSION: 1.9.6
contents:
  repositories:
    - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
  keyring:
    - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
  packages:
    - '!gawk'
    - '!libelogind0'
    - '!original-awk'
    - apt
    - base-files
    - bash
    - ca-certificates
    - ca-certificates-bundle
    - coreutils
    - diffutils
    - dpkg
    - findutils
    - grep
    - libc-bin
    - mawk
    - perl-base
    - sed
    - tzdata
    - util-linux
  builds:
    - name: fluxcd-source-controller
      work-dir: /go/src/github.com/fluxcd/source-controller
      caches:
        - path: /go/pkg/mod
      contents:
        packages:
          - bash
          - ca-certificates-bundle
          - coreutils
          - golang-1.27
          - findutils
          - mawk
          - sed
        files:
          - url: git+https://github.com/fluxcd/source-controller#v1.9.6
            checksum: 456fa323ef6a4b977f220cf2c60298bf193497ba
            path: /go/src/github.com/fluxcd/source-controller
            spdx:
              name: fluxcd-source-controller
              version: 1.9.6
              packages:
                - name: fluxcd-source-controller
                  purl: pkg:golang/github.com/fluxcd/source-controller@1.9.6
                  license: Apache-2.0
            uid: 0
            gid: 0
      pipeline:
        - name: patch (1.9 only)
          uses: go/bump@v2
          with:
            deps:
              - golang.org/x/crypto@v0.56.0
              - golang.org/x/mod@v0.40.0
              - github.com/go-git/go-git/v5@v5.19.2
              - google.golang.org/grpc@v1.83.2
              - github.com/sigstore/fulcio@v1.8.6
              - github.com/sigstore/sigstore-go@v1.2.1
              - oras.land/oras-go/v2@v2.6.2
            download: true
            replaces:
              - google.golang.org/grpc=google.golang.org/grpc@v1.83.2
        - name: test
          runs: |
            set -eux -o pipefail

            CGO_ENABLED=0 go test $(go list ./internal/... | grep -vE '/internal/(controller|bucket/(azure|gcp|minio)|oci/cosign|oci/notation|fs)')
        - name: build
          uses: go/build@v1
          environment:
            GOFLAGS: -buildvcs=false
          with:
            output: ${target.dir}/usr/local/bin/source-controller
      outputs:
        - source: ${target.dir}/usr/local/bin/source-controller
          target: /usr/local/bin/source-controller
          uid: 0
          gid: 0
        - source: /opt/docker/sbom/fluxcd-source-controller
          target: /opt/docker/sbom/fluxcd-source-controller
          uid: 0
          gid: 0
accounts:
  root: true
  run-as: root
  users:
    - name: nonroot
      uid: 65532
      gid: 65532
    - name: _apt
      uid: 42
      gid: 65532
  groups:
    - name: nonroot
      gid: 65532
      members:
        - nonroot
os-release:
  name: Docker Hardened Images (Debian)
  id: debian
  version-id: "13"
  version-codename: trixie
  pretty-name: Docker Hardened Images/Debian GNU/Linux 13 (trixie)
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
environment:
  DEBIAN_FRONTEND: noninteractive
annotations:
  org.opencontainers.image.description: A minimal Flux CD source-controller image
  org.opencontainers.image.licenses: Apache-2.0
entrypoint:
  - /usr/local/bin/source-controller
