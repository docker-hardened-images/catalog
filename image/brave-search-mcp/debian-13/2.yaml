# syntax=dhi.io/build:2-debian13

name: Brave Search MCP Server 2.x
image: dhi.io/brave-search-mcp
variant: runtime
tags:
  - "2"
  - "2.1"
  - 2.1.3
  - 2-debian
  - 2-debian13
  - 2.1-debian
  - 2.1-debian13
  - 2.1.3-debian
  - 2.1.3-debian13
platforms:
  - linux/amd64
  - linux/arm64
dates:
  release: "2026-06-15"
vars:
  NODEJS_MAJOR: "24"
  NODEJS_VERSION: 24.20.0-0
  SEMVER_MAJOR_MINOR_VERSION: "2.1"
  SEMVER_MAJOR_VERSION: "2"
  SEMVER_VERSION: 2.1.3
  VERSION: 2.1.3-2
contents:
  repositories:
    - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
  keyring:
    - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
  packages:
    - '!libelogind0'
    - '!mawk'
    - '!original-awk'
    - base-files
    - brave-search-mcp=2.1.3-2
    - ca-certificates-bundle
    - libstdc++6
    - nodejs-24=24.20.0-0
    - tzdata
  builds:
    - name: server.json
      contents:
        packages:
          - bash
          - sed
      pipeline:
        - runs: |
            set -eux -o pipefail

            sed -i "s/_VERSION_/2.1.3/g" "${source.dir}/config/server.json"
      paths:
        - type: file
          path: ${source.dir}/config/server.json
          uid: 0
          gid: 0
          source: image/brave-search-mcp/config/server.json
      attestations:
        - predicate-type: https://modelcontextprotocol.io/server.json/v1
          source: ${source.dir}/config/server.json
accounts:
  run-as: node
  users:
    - name: node
      uid: 1000
      gid: 1000
  groups:
    - name: node
      gid: 1000
      members:
        - node
os-release:
  name: Docker Hardened Images (Debian)
  id: debian
  version-id: "13"
  version-codename: trixie
  pretty-name: Docker Hardened Images/Debian GNU/Linux 13 (trixie)
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
environment:
  NODE_ENV: production
paths:
  - type: symlink
    path: /app
    uid: 0
    gid: 0
    source: /usr/lib/nodejs/brave-search-mcp
annotations:
  org.opencontainers.image.description: A minimal Brave Search MCP Server image
  org.opencontainers.image.licenses: MIT
labels:
  io.modelcontextprotocol.server.name: io.github.brave/brave-search-mcp-server
entrypoint:
  - node
  - /app/dist/index.js
