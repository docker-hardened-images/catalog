# syntax=dhi.io/build:2-debian13

name: Open Cluster Management Addon Manager 1.x
image: dhi.io/open-cluster-management-addon-manager
variant: runtime
tags:
  - "1"
  - "1.4"
  - 1.4.0
  - 1-debian
  - 1-debian13
  - 1.4-debian
  - 1.4-debian13
  - 1.4.0-debian
  - 1.4.0-debian13
platforms:
  - linux/amd64
  - linux/arm64
dates:
  release: "2026-01-30"
vars:
  COMMIT_SHA: 45ecb6233fb316302a428d1d258e68a9cc2e7040
  SEMVER_MAJOR_MINOR_VERSION: "1.4"
  SEMVER_MAJOR_VERSION: "1"
  SEMVER_VERSION: 1.4.0
  VERSION: 1.4.0
contents:
  repositories:
    - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
  keyring:
    - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
  packages:
    - base-files
    - ca-certificates-bundle
    - tzdata
  builds:
    - name: addon
      work-dir: /go/src/github.com/open-cluster-management-io/ocm
      caches:
        - path: /go/pkg/mod
      contents:
        packages:
          - bash
          - ca-certificates-bundle
          - coreutils
          - golang-1.26
          - findutils
          - mawk
          - sed
        files:
          - url: git+https://github.com/open-cluster-management-io/ocm.git#v1.4.0
            checksum: 45ecb6233fb316302a428d1d258e68a9cc2e7040
            path: /go/src/github.com/open-cluster-management-io/ocm
            spdx:
              name: open-cluster-management-addon-manager
              version: 1.4.0
              packages:
                - name: ocm
                  purl: pkg:golang/github.com/open-cluster-management-io/ocm@1.4.0
                  license: Apache-2.0
            uid: 0
            gid: 0
      pipeline:
        - name: remove vendor directory
          runs: |
            set -eux -o pipefail

            rm -rf vendor
        - name: patch
          uses: go/bump@v2
          privileged: true
          with:
            deps:
              - golang.org/x/net@v0.60.0
              - github.com/google/cel-go@v0.30.0
              - google.golang.org/grpc@v1.85.0-dev.0.20260825072537-93e31b48545e
            download: true
        - name: re-vendor
          runs: |
            set -eux -o pipefail

            go mod vendor
        - name: test
          privileged: true
          runs: |
            set -eux -o pipefail

            # install integration test deps
            go install sigs.k8s.io/controller-runtime/tools/setup-envtest@latest
            source <($(go env GOPATH)/bin/setup-envtest use 1.31 -p env)

            # Skip tests that become unstable with the bumped Kubernetes deps:
            # TestRunController assumes a connection-refused path, and
            # TestStopUnusedManagers can hang waiting for fake informer cache sync.
            CGO_ENABLED=0 go test ./cmd/addon/... ./pkg/addon/... -skip "^(TestRunController|TestStopUnusedManagers)$"
        - name: build
          uses: go/build@v1
          with:
            ldflags:
              - -X open-cluster-management.io/ocm/pkg/version.versionFromGit=1.4.0
              - -X open-cluster-management.io/ocm/pkg/version.commitFromGit=45ecb6233fb316302a428d1d258e68a9cc2e7040
            output: ${target.dir}/usr/local/bin/addon
            packages: ./cmd/addon
      outputs:
        - source: ${target.dir}/usr/local/bin/addon
          target: /usr/local/bin/addon
          uid: 0
          gid: 0
        - source: /opt/docker/sbom/open-cluster-management-addon-manager
          target: /opt/docker/sbom/open-cluster-management-addon-manager
          uid: 0
          gid: 0
accounts:
  run-as: "65532"
  users:
    - name: nonroot
      uid: 65532
      gid: 65532
  groups:
    - name: nonroot
      gid: 65532
      members:
        - nonroot
os-release:
  name: Docker Hardened Images (Debian)
  id: debian
  version-id: "13"
  version-codename: trixie
  pretty-name: Docker Hardened Images/Debian GNU/Linux 13 (trixie)
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
paths:
  - type: symlink
    path: /addon
    uid: 0
    gid: 0
    source: /usr/local/bin/addon
annotations:
  org.opencontainers.image.description: A minimal Open Cluster Management Addon Manager image
  org.opencontainers.image.licenses: Apache-2.0
cmd:
  - /addon
  - manager
