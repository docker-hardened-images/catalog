# syntax=dhi.io/build:2-alpine3.24

name: StackGres Operator 1.19.x (dev)
image: dhi.io/stackgres-operator
variant: dev
tags:
  - 1-alpine-dev
  - 1.19-alpine-dev
  - 1-alpine3.24-dev
  - 1.19.5-alpine-dev
  - 1.19-alpine3.24-dev
  - 1.19.5-alpine3.24-dev
platforms:
  - linux/amd64
  - linux/arm64
dates:
  release: "2026-07-22"
vars:
  COMPANION_VERSION_OPTIONS: -Dstackgres.operatorImageVersion=1.19.5-jvm -Dstackgres.operatorJvmImageVersion=1.19.5-jvm -Dstackgres.operatorNativeImageVersion=1.19.5
  JAVA_FIPS_SUFFIX: ""
  JAVA_VERSION: 21.0.13.9-r3
  JDK_MAJOR_VERSION: "21"
  SEMVER_MAJOR_MINOR_VERSION: "1.19"
  SEMVER_MAJOR_VERSION: "1"
  SEMVER_VERSION: 1.19.5
  VERSION: 1.19.5-r0
contents:
  repositories:
    - https://dhi.io/apk/alpine/v3.24/main
    - https://dl-cdn.alpinelinux.org/alpine/v3.24/main
    - https://dl-cdn.alpinelinux.org/alpine/v3.24/community
  keyring:
    - https://dhi.io/keyring/dhi-apk@docker-0F81AD7700D99184.rsa.pub
  packages:
    - alpine-baselayout-data
    - apk-tools
    - bash
    - busybox
    - ca-certificates
    - ca-certificates-bundle
    - coreutils
    - eclipse-temurin-21-jre-oci-config=21.0.13.9-r3
    - eclipse-temurin-21-jre=21.0.13.9-r3
    - findutils
    - libcrypto3
    - libffi
    - libgcc
    - libpq
    - libssl3
    - python-3.13
    - stackgres-operator-1.19=1.19.5-r0
    - tzdata
    - yaml
accounts:
  root: true
  run-as: root
  users:
    - name: nonroot
      uid: 65532
      gid: 65532
  groups:
    - name: nonroot
      gid: 65532
      members:
        - nonroot
os-release:
  name: Docker Hardened Images (Alpine)
  id: alpine
  version-id: "3.24"
  pretty-name: Docker Hardened Images/Alpine Linux v3.24
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
work-dir: /app
environment:
  HOME: /app
  JAVA_TOOL_OPTIONS: -Dstackgres.operatorImageVersion=1.19.5-jvm -Dstackgres.operatorJvmImageVersion=1.19.5-jvm -Dstackgres.operatorNativeImageVersion=1.19.5
  LANG: C.utf8
  OPERATOR_VERSION: 1.19.5
  STACKGRES_VERSION: 1.19.5
paths:
  - type: symlink
    path: /app
    uid: 0
    gid: 0
    source: /usr/share/stackgres-operator
  - type: symlink
    path: /bin/patronictl-4.x
    uid: 0
    gid: 0
    source: /usr/lib/stackgres-operator/patroni-4/bin/patronictl
  - type: symlink
    path: /bin/patronictl-3.x
    uid: 0
    gid: 0
    source: /usr/lib/stackgres-operator/patroni-3/bin/patronictl
annotations:
  org.opencontainers.image.description: A minimal StackGres Operator image
  org.opencontainers.image.licenses: AGPL-3.0-or-later
cmd:
  - /app/stackgres-operator.sh
ports:
  - 8080/tcp
  - 8443/tcp
