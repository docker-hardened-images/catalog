# syntax=dhi.io/build:2-debian13

name: StackGres Operator 1.19.x (dev)
image: dhi.io/stackgres-operator
variant: dev
tags:
  - 1-dev
  - 1.19-dev
  - 1.19.5-dev
  - 1-debian-dev
  - 1-debian13-dev
  - 1.19-debian-dev
  - 1.19-debian13-dev
  - 1.19.5-debian-dev
  - 1.19.5-debian13-dev
platforms:
  - linux/amd64
  - linux/arm64
dates:
  release: "2026-07-22"
vars:
  COMPANION_VERSION_OPTIONS: -Dstackgres.operatorImageVersion=1.19.5-jvm -Dstackgres.operatorJvmImageVersion=1.19.5-jvm -Dstackgres.operatorNativeImageVersion=1.19.5
  JAVA_FIPS_SUFFIX: ""
  JAVA_VERSION: 1:21.0.13.1+2-0
  JDK_MAJOR_VERSION: "21"
  SEMVER_MAJOR_MINOR_VERSION: "1.19"
  SEMVER_MAJOR_VERSION: "1"
  SEMVER_VERSION: 1.19.5
  VERSION: 1.19.5-9
contents:
  repositories:
    - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
  keyring:
    - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
  packages:
    - '!gawk'
    - '!libelogind0'
    - '!libpython3-stdlib'
    - '!libpython3.13-minimal'
    - '!libpython3.13-stdlib'
    - '!mawk'
    - '!original-awk'
    - '!python3'
    - '!python3-minimal'
    - '!python3.13'
    - '!python3.13-minimal'
    - apt
    - base-files
    - bash
    - ca-certificates
    - ca-certificates-bundle
    - coreutils
    - dash
    - diffutils
    - dpkg
    - eclipse-temurin-21-jre-oci-config=1:21.0.13.1+2-0
    - eclipse-temurin-21-jre=1:21.0.13.1+2-0
    - findutils
    - grep
    - libasound2t64
    - libc-bin
    - libc6
    - libffi8
    - libgcc-s1
    - libpq5
    - libpython-3.13-stdlib
    - libssl3t64
    - libstdc++6
    - libyaml-0-2
    - mawk
    - perl-base
    - python-3.13-minimal
    - sed
    - stackgres-operator-1.19=1.19.5-9
    - tzdata
    - util-linux
accounts:
  root: true
  run-as: root
  users:
    - name: nonroot
      uid: 65532
      gid: 65532
    - name: _apt
      uid: 42
      gid: 65532
  groups:
    - name: nonroot
      gid: 65532
      members:
        - nonroot
os-release:
  name: Docker Hardened Images (Debian)
  id: debian
  version-id: "13"
  version-codename: trixie
  pretty-name: Docker Hardened Images/Debian GNU/Linux 13 (trixie)
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
work-dir: /app
environment:
  DEBIAN_FRONTEND: noninteractive
  HOME: /app
  JAVA_TOOL_OPTIONS: -Dstackgres.operatorImageVersion=1.19.5-jvm -Dstackgres.operatorJvmImageVersion=1.19.5-jvm -Dstackgres.operatorNativeImageVersion=1.19.5
  LANG: C.utf8
  OPERATOR_VERSION: 1.19.5
  STACKGRES_VERSION: 1.19.5
paths:
  - type: symlink
    path: /app
    uid: 0
    gid: 0
    source: /usr/share/stackgres-operator
annotations:
  org.opencontainers.image.description: A minimal StackGres Operator image
  org.opencontainers.image.licenses: AGPL-3.0-or-later
cmd:
  - /app/stackgres-operator.sh
ports:
  - 8080/tcp
  - 8443/tcp
