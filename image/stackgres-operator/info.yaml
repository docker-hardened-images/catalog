metadata:
  display-name: StackGres Operator
  short-description: Kubernetes operator that runs, configures and manages highly available PostgreSQL clusters with Patroni, connection pooling, backups and monitoring.
  featured: false
  home-url: https://stackgres.io/
  categories:
    - databases-and-storage
  included-tools:
    - name: patronictl-4
      description: Patroni 4 command-line client the operator runs to read and control Patroni 4 clusters.
    - name: patronictl-3
      description: Patroni 3 command-line client the operator runs to read and control Patroni 3 clusters.
