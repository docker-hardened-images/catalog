# syntax=dhi.io/build:2-debian13

name: Jaeger 2.x (dev)
image: dhi.io/jaeger
variant: dev
tags:
  - 2-dev
  - 2.20-dev
  - 2.20.0-dev
  - 2-debian-dev
  - 2-debian13-dev
  - 2.20-debian-dev
  - 2.20-debian13-dev
  - 2.20.0-debian-dev
  - 2.20.0-debian13-dev
platforms:
  - linux/amd64
  - linux/arm64
dates:
  release: "2024-11-04"
vars:
  FLAVORED_SUFFIX: -dev
  SEMVER_MAJOR_MINOR_VERSION: "2.20"
  SEMVER_MAJOR_VERSION: "2"
  SEMVER_VERSION: 2.20.0
  SUFFIX: -dev
  VERSION: 2.20.0-5
contents:
  repositories:
    - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
  keyring:
    - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
  packages:
    - '!gawk'
    - '!libelogind0'
    - '!original-awk'
    - apt
    - base-files
    - bash
    - ca-certificates
    - ca-certificates-bundle
    - coreutils
    - diffutils
    - dpkg
    - findutils
    - grep
    - jaeger-dev=2.20.0-5
    - libc-bin
    - mawk
    - perl-base
    - sed
    - tzdata
    - util-linux
accounts:
  root: true
  run-as: root
  users:
    - name: nonroot
      uid: 65532
      gid: 65532
    - name: _apt
      uid: 42
      gid: 65532
  groups:
    - name: nonroot
      gid: 65532
      members:
        - nonroot
os-release:
  name: Docker Hardened Images (Debian)
  id: debian
  version-id: "13"
  version-codename: trixie
  pretty-name: Docker Hardened Images/Debian GNU/Linux 13 (trixie)
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
environment:
  DEBIAN_FRONTEND: noninteractive
  JAEGER_LISTEN_HOST: 0.0.0.0
paths:
  - type: directory
    path: /usr/local/bin
    uid: 0
    gid: 0
  - type: symlink
    path: /usr/local/bin/jaeger
    uid: 0
    gid: 0
    source: /usr/bin/jaeger
  - type: directory
    path: /cmd/jaeger
    uid: 0
    gid: 0
  - type: symlink
    path: /cmd/jaeger/jaeger-linux
    uid: 0
    gid: 0
    source: /usr/bin/jaeger
annotations:
  org.opencontainers.image.description: A minimal Jaeger v2 all-in-one distributed tracing image
  org.opencontainers.image.licenses: Apache-2.0
entrypoint:
  - jaeger
ports:
  - 5778/tcp
  - 5779/tcp
  - 4317/tcp
  - 4318/tcp
  - 14268/tcp
  - 14250/tcp
  - 9411/tcp
  - 16686/tcp
  - 13132/tcp
  - 13133/tcp
