# syntax=dhi.io/build:2-alpine3.24

name: Jaeger 2.x
image: dhi.io/jaeger
variant: runtime
tags:
  - 2-alpine
  - 2.20-alpine
  - 2-alpine3.24
  - 2.20.0-alpine
  - 2.20-alpine3.24
  - 2.20.0-alpine3.24
platforms:
  - linux/amd64
  - linux/arm64
dates:
  release: "2024-11-04"
vars:
  FLAVORED_SUFFIX: ""
  SEMVER_MAJOR_MINOR_VERSION: "2.20"
  SEMVER_MAJOR_VERSION: "2"
  SEMVER_VERSION: 2.20.0
  SUFFIX: ""
  VERSION: 2.20.0-r0
contents:
  repositories:
    - https://dhi.io/apk/alpine/v3.24/main
    - https://dl-cdn.alpinelinux.org/alpine/v3.24/main
    - https://dl-cdn.alpinelinux.org/alpine/v3.24/community
  keyring:
    - https://dhi.io/keyring/dhi-apk@docker-0F81AD7700D99184.rsa.pub
  packages:
    - alpine-baselayout-data
    - ca-certificates-bundle
    - jaeger
    - tzdata
accounts:
  run-as: nonroot
  users:
    - name: nonroot
      uid: 65532
      gid: 65532
  groups:
    - name: nonroot
      gid: 65532
      members:
        - nonroot
os-release:
  name: Docker Hardened Images (Alpine)
  id: alpine
  version-id: "3.24"
  pretty-name: Docker Hardened Images/Alpine Linux v3.24
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
environment:
  JAEGER_LISTEN_HOST: 0.0.0.0
paths:
  - type: directory
    path: /usr/local/bin
    uid: 0
    gid: 0
  - type: symlink
    path: /usr/local/bin/jaeger
    uid: 0
    gid: 0
    source: /usr/bin/jaeger
  - type: directory
    path: /cmd/jaeger
    uid: 0
    gid: 0
  - type: symlink
    path: /cmd/jaeger/jaeger-linux
    uid: 0
    gid: 0
    source: /usr/bin/jaeger
annotations:
  org.opencontainers.image.description: A minimal Jaeger v2 all-in-one distributed tracing image
  org.opencontainers.image.licenses: Apache-2.0
entrypoint:
  - jaeger
ports:
  - 5778/tcp
  - 5779/tcp
  - 4317/tcp
  - 4318/tcp
  - 14268/tcp
  - 14250/tcp
  - 9411/tcp
  - 16686/tcp
  - 13132/tcp
  - 13133/tcp
