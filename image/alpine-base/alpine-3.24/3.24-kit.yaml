# syntax=dhi.io/build:2-alpine3.23

name: Alpine 3.24 Base (kit, dev)
image: dhi.io/alpine-base
variant: dev
flavor: kit
tags:
  - 3.24-kit
platforms:
  - linux/amd64
  - linux/arm64
dates:
  release: "2026-06-09"
  end-of-life: "2028-06-01"
vars:
  APK_MAJOR_MINOR_VERSION: "1.37"
  APK_MAJOR_VERSION: "1"
  APK_VERSION: 1.37.0
  DHI_TAGS_OVERWRITE: "true"
  VERSION: 1.37.0_git20260817-r33
contents:
  repositories:
    - https://dhi.io/apk/alpine/v3.24/main
  keyring:
    - https://dhi.io/keyring/dhi-apk@docker-0F81AD7700D99184.rsa.pub
  packages:
    - alpine-baselayout-data
    - apk-tools
    - bash
    - busybox=1.37.0_git20260817-r33
    - ca-certificates-bundle
    - curl
    - git
    - ssl_client=1.37.0_git20260817-r33
    - sudo
accounts:
  root: true
  run-as: nonroot
  users:
    - name: nonroot
      uid: 65532
      gid: 65532
  groups:
    - name: nonroot
      gid: 65532
      members:
        - nonroot
os-release:
  name: Docker Hardened Images (Alpine)
  id: alpine
  version-id: "3.24"
  pretty-name: Docker Hardened Images/Alpine Linux v3.24
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
work-dir: /home/nonroot/workspace
environment:
  BASH_ENV: /etc/sandbox-persistent.sh
  SSL_CERT_FILE: /etc/ssl/certs/ca-certificates.crt
paths:
  - type: directory
    path: /home/nonroot/workspace
    uid: 65532
    gid: 65532
    mode: "0755"
  - type: emptyfile
    path: /etc/sandbox-persistent.sh
    uid: 65532
    gid: 65532
    mode: "0644"
  - type: directory
    path: /etc/sudoers.d
    uid: 0
    gid: 0
    mode: "0755"
  - type: file
    path: /etc/sudoers.d/nonroot
    content: |
      nonroot ALL=(ALL) NOPASSWD:ALL
    uid: 0
    gid: 0
    mode: "0440"
  - type: file
    path: /etc/sudoers.d/proxyconfig
    content: |
      Defaults:nonroot env_keep += "http_proxy https_proxy no_proxy HTTP_PROXY HTTPS_PROXY NO_PROXY SSL_CERT_FILE NODE_EXTRA_CA_CERTS REQUESTS_CA_BUNDLE JAVA_TOOL_OPTIONS"
    uid: 0
    gid: 0
    mode: "0440"
  - type: directory
    path: /usr/local/share/ca-certificates
    uid: 0
    gid: 0
    mode: "0755"
  - type: directory
    path: /usr/share/sandbox
    uid: 0
    gid: 0
    mode: "0755"
  - type: directory
    path: /usr/share/sandbox/kit
    uid: 0
    gid: 0
    mode: "0755"
  - type: directory
    path: /usr/share/sandbox/kit/alpine
    uid: 0
    gid: 0
    mode: "0755"
  - type: file
    path: /usr/share/sandbox/kit/alpine/kit.yaml
    content: |
      # syntax=docker/sandbox-kit:3
      schemaVersion: "3"
      displayName: Alpine
      author: "Docker, Inc."
      description: Alpine Sandbox Kit - Docker sandbox workload with bash, curl and git, running as nonroot with sudo / Alpine 3.24 Base (kit, dev)
      sourceUrl: https://dhi.io/catalog/alpine-base
      licenses: [MIT]
      kind: workload
      version: "3.24"
      capabilities:
        - type: com.docker.sandbox/sbx@1
        - type: com.docker.sandbox/network-policy@1
          config:
            runtime:
              allow:
                - dhi.io
        - type: com.docker.sandbox/agent-context@1
          config:
            filename: AGENTS.md
            content: |
              This is a plain shell sandbox on DHI Alpine 3.24 (dev) with bash, curl and git.
              It runs as the nonroot user (uid 65532) with passwordless sudo; install more with sudo apk.
              Composed kits list their own capabilities below.
    uid: 0
    gid: 0
    mode: "0644"
annotations:
  org.opencontainers.image.authors: Docker, Inc.
  org.opencontainers.image.description: Alpine Sandbox Kit - Docker sandbox workload with bash, curl and git, running as nonroot with sudo
  org.opencontainers.image.licenses: MIT
  org.opencontainers.image.source: https://dhi.io/catalog/alpine-base
  org.opencontainers.image.title: Alpine
  org.opencontainers.image.version: "3.24"
  vnd.docker.sandbox.kit.capabilities: com.docker.sandbox/agent-context@1,com.docker.sandbox/network-policy@1,com.docker.sandbox/sbx@1
  vnd.docker.sandbox.kit.descriptor: '{"schemaVersion":"3","displayName":"Alpine","author":"Docker, Inc.","description":"Alpine Sandbox Kit - Docker sandbox workload with bash, curl and git, running as nonroot with sudo / Alpine 3.24 Base (kit, dev)","sourceUrl":"https://dhi.io/catalog/alpine-base","version":"3.24","licenses":["MIT"],"kind":"workload","capabilities":[{"type":"com.docker.sandbox/sbx@1"},{"type":"com.docker.sandbox/network-policy@1","config":{"runtime":{"allow":["dhi.io"]}}},{"type":"com.docker.sandbox/agent-context@1","config":{"filename":"AGENTS.md","content":"This is a plain shell sandbox on DHI Alpine 3.24 (dev) with bash, curl and git.\nIt runs as the nonroot user (uid 65532) with passwordless sudo; install more with sudo apk.\nComposed kits list their own capabilities below.\n"}}]}'
  vnd.docker.sandbox.kit.schema-version: "3"
entrypoint:
  - bash
cmd:
  - -l
