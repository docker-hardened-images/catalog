# syntax=dhi.io/build:2-debian13

name: Zscaler MCP Server 0.15.x
image: dhi.io/zscaler-mcp
variant: runtime
tags:
  - "0"
  - "0.15"
  - 0.15.3
  - 0-debian
  - 0-debian13
  - 0.15-debian
  - 0.15-debian13
  - 0.15.3-debian
  - 0.15.3-debian13
platforms:
  - linux/amd64
  - linux/arm64
dates:
  release: "2026-07-21"
vars:
  FLAVORED_SUFFIX: ""
  SEMVER_MAJOR_MINOR_VERSION: "0.15"
  SEMVER_MAJOR_VERSION: "0"
  SEMVER_VERSION: 0.15.3
  SUFFIX: ""
  VERSION: 0.15.3-0
contents:
  repositories:
    - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
  keyring:
    - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
  packages:
    - base-files
    - ca-certificates-bundle
    - python3
    - tzdata
    - zscaler-mcp=0.15.3-0
  builds:
    - name: server.json
      contents:
        packages:
          - bash
          - sed
      pipeline:
        - runs: |
            set -eux -o pipefail

            sed -i "s/_VERSION_/0.15.3/g" "${source.dir}/config/server.json"
      paths:
        - type: file
          path: ${source.dir}/config/server.json
          uid: 0
          gid: 0
          source: image/zscaler-mcp/config/server.json
      attestations:
        - predicate-type: https://modelcontextprotocol.io/server.json/v1
          source: ${source.dir}/config/server.json
accounts:
  run-as: nonroot
  users:
    - name: nonroot
      uid: 65532
      gid: 65532
  groups:
    - name: nonroot
      gid: 65532
      members:
        - nonroot
os-release:
  name: Docker Hardened Images (Debian)
  id: debian
  version-id: "13"
  version-codename: trixie
  pretty-name: Docker Hardened Images/Debian GNU/Linux 13 (trixie)
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
annotations:
  org.opencontainers.image.description: Zscaler MCP Server - Model Context Protocol server for managing the Zscaler Zero Trust Exchange platform
  org.opencontainers.image.licenses: MIT
labels:
  io.modelcontextprotocol.server.name: io.github.zscaler/zscaler-mcp-server
entrypoint:
  - zscaler-mcp
