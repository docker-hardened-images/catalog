# syntax=dhi.io/build:2-debian13

name: Kubeflow Pipelines Frontend 2.x (dev)
image: dhi.io/kubeflow-pipelines-frontend
variant: dev
tags:
  - 2-dev
  - 2.18-dev
  - 2.18.0-dev
  - 2-debian-dev
  - 2-debian13-dev
  - 2.18-debian-dev
  - 2.18-debian13-dev
  - 2.18.0-debian-dev
  - 2.18.0-debian13-dev
platforms:
  - linux/amd64
  - linux/arm64
vars:
  SEMVER_MAJOR_MINOR_VERSION: "2.18"
  SEMVER_MAJOR_VERSION: "2"
  SEMVER_VERSION: 2.18.0
  VERSION: 2.18.0-0
contents:
  repositories:
    - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
  keyring:
    - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
  packages:
    - '!gawk'
    - '!libelogind0'
    - '!mawk'
    - '!original-awk'
    - apt
    - base-files
    - bash
    - ca-certificates
    - ca-certificates-bundle
    - coreutils
    - diffutils
    - dpkg
    - findutils
    - grep
    - kubeflow-pipelines-frontend=2.18.0-0
    - libc-bin
    - libc6
    - libgomp1
    - libstdc++6
    - mawk
    - netbase
    - nodejs-24
    - perl-base
    - sed
    - tzdata
    - util-linux
  builds:
    - name: sbom
      contents:
        packages:
          - bash
          - coreutils
      pipeline:
        - uses: spdx@v1
          with:
            license: Apache-2.0
            name: kubeflow-pipelines
            purl: pkg:github/kubeflow/pipelines@2.18.0#frontend
            version: 2.18.0
      outputs:
        - source: /opt/docker/sbom/kubeflow-pipelines
          target: /opt/docker/sbom/kubeflow-pipelines
          uid: 0
          gid: 0
accounts:
  root: true
  run-as: root
  users:
    - name: nonroot
      uid: 65532
      gid: 65532
    - name: _apt
      uid: 42
      gid: 65532
  groups:
    - name: nonroot
      gid: 65532
      members:
        - nonroot
os-release:
  name: Docker Hardened Images (Debian)
  id: debian
  version-id: "13"
  version-codename: trixie
  pretty-name: Docker Hardened Images/Debian GNU/Linux 13 (trixie)
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
environment:
  DEBIAN_FRONTEND: noninteractive
paths:
  - type: directory
    path: /app
    uid: 0
    gid: 0
  - type: symlink
    path: /app/server
    uid: 0
    gid: 0
    source: /usr/lib/kubeflow-pipelines-frontend/server
  - type: symlink
    path: /app/index.html
    uid: 0
    gid: 0
    source: /usr/lib/kubeflow-pipelines-frontend/build/index.html
  - type: symlink
    path: /app/static
    uid: 0
    gid: 0
    source: /usr/lib/kubeflow-pipelines-frontend/build/static
annotations:
  org.opencontainers.image.description: A minimal Kubeflow Pipelines frontend image
  org.opencontainers.image.licenses: Apache-2.0
entrypoint:
  - node
cmd:
  - /app/server/server.js
  - /app
  - "3000"
