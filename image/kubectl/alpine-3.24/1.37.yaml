# syntax=dhi.io/build:2-alpine3.24

name: kubectl 1.37.x
image: dhi.io/kubectl
variant: runtime
tags:
  - 1-alpine
  - 1.37-alpine
  - 1-alpine3.24
  - 1.37.2-alpine
  - 1.37-alpine3.24
  - 1.37.2-alpine3.24
platforms:
  - linux/amd64
  - linux/arm64
dates:
  release: "2026-08-26"
  end-of-life: "2027-10-28"
vars:
  FLAVORED_SUFFIX: ""
  SEMVER_MAJOR_MINOR_VERSION: "1.37"
  SEMVER_MAJOR_VERSION: "1"
  SEMVER_VERSION: 1.37.2
  SUFFIX: ""
  VERSION: 1.37.2-r0
contents:
  repositories:
    - https://dhi.io/apk/alpine/v3.24/main
    - https://dl-cdn.alpinelinux.org/alpine/v3.24/main
    - https://dl-cdn.alpinelinux.org/alpine/v3.24/community
  keyring:
    - https://dhi.io/keyring/dhi-apk@docker-0F81AD7700D99184.rsa.pub
  packages:
    - alpine-baselayout-data
    - ca-certificates-bundle
    - kubectl-1.37=1.37.2-r0
    - tzdata
accounts:
  run-as: nonroot
  users:
    - name: nonroot
      uid: 65532
      gid: 65532
  groups:
    - name: nonroot
      gid: 65532
      members:
        - nonroot
os-release:
  name: Docker Hardened Images (Alpine)
  id: alpine
  version-id: "3.24"
  pretty-name: Docker Hardened Images/Alpine Linux v3.24
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
paths:
  - type: directory
    path: /usr/local/bin
    uid: 0
    gid: 0
  - type: symlink
    path: /usr/local/bin/kubectl
    uid: 0
    gid: 0
    source: /usr/bin/kubectl
  - type: symlink
    path: /usr/local/bin/kubectl-convert
    uid: 0
    gid: 0
    source: /usr/bin/kubectl-convert
annotations:
  org.opencontainers.image.description: A minimal kubectl image
  org.opencontainers.image.licenses: Apache-2.0
entrypoint:
  - /usr/local/bin/kubectl
cmd:
  - --help
