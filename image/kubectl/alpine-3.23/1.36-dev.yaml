# syntax=dhi.io/build:2-alpine3.23

name: kubectl 1.36.x (dev)
image: dhi.io/kubectl
variant: dev
tags:
  - 1.36-alpine3.23-dev
  - 1.36.6-alpine3.23-dev
platforms:
  - linux/amd64
  - linux/arm64
dates:
  release: "2026-04-22"
  end-of-life: "2027-06-28"
vars:
  FLAVORED_SUFFIX: -dev
  SEMVER_MAJOR_MINOR_VERSION: "1.36"
  SEMVER_MAJOR_VERSION: "1"
  SEMVER_VERSION: 1.36.6
  SUFFIX: -dev
  VERSION: 1.36.6-r0
contents:
  repositories:
    - https://dhi.io/apk/alpine/v3.23/main
    - https://dl-cdn.alpinelinux.org/alpine/v3.23/main
    - https://dl-cdn.alpinelinux.org/alpine/v3.23/community
  keyring:
    - https://dhi.io/keyring/dhi-apk@docker-0F81AD7700D99184.rsa.pub
  packages:
    - alpine-baselayout-data
    - apk-tools
    - busybox
    - ca-certificates
    - ca-certificates-bundle
    - kubectl-1.36-dev=1.36.6-r0
    - tzdata
accounts:
  root: true
  run-as: root
  users:
    - name: nonroot
      uid: 65532
      gid: 65532
  groups:
    - name: nonroot
      gid: 65532
      members:
        - nonroot
os-release:
  name: Docker Hardened Images (Alpine)
  id: alpine
  version-id: "3.23"
  pretty-name: Docker Hardened Images/Alpine Linux v3.23
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
paths:
  - type: directory
    path: /usr/local/bin
    uid: 0
    gid: 0
  - type: symlink
    path: /usr/local/bin/kubectl
    uid: 0
    gid: 0
    source: /usr/bin/kubectl
  - type: symlink
    path: /usr/local/bin/kubectl-convert
    uid: 0
    gid: 0
    source: /usr/bin/kubectl-convert
annotations:
  org.opencontainers.image.description: A minimal kubectl image
  org.opencontainers.image.licenses: Apache-2.0
entrypoint:
  - /usr/local/bin/kubectl
cmd:
  - --help
