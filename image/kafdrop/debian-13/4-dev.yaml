# syntax=dhi.io/build:2-debian13

name: Kafdrop 4.x (dev)
image: dhi.io/kafdrop
variant: dev
tags:
  - 4-dev
  - 4.3-dev
  - 4.3.1-dev
  - 4-debian-dev
  - 4-debian13-dev
  - 4.3-debian-dev
  - 4.3-debian13-dev
  - 4.3.1-debian-dev
  - 4.3.1-debian13-dev
platforms:
  - linux/amd64
  - linux/arm64
dates:
  release: "2023-10-09"
vars:
  JAVA_FIPS_SUFFIX: ""
  SEMVER_MAJOR_MINOR_VERSION: "4.3"
  SEMVER_MAJOR_VERSION: "4"
  SEMVER_VERSION: 4.3.1
  VERSION: 4.3.1-0
contents:
  repositories:
    - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
  keyring:
    - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
  packages:
    - '!gawk'
    - '!libelogind0'
    - '!mawk'
    - '!original-awk'
    - apt
    - base-files
    - bash
    - ca-certificates-bundle
    - coreutils
    - diffutils
    - dpkg
    - eclipse-temurin-25-jre
    - eclipse-temurin-25-jre-oci-config
    - findutils
    - grep
    - kafdrop-4=4.3.1-0
    - libc-bin
    - mawk
    - perl-base
    - sed
    - tzdata
    - util-linux
  builds:
    - name: locale
      contents:
        packages:
          - bash
          - locales
          - coreutils
          - gzip
      pipeline:
        - name: install locales
          runs: |
            set -eux -o pipefail

            ln -s /etc/locale.alias /usr/share/locale/locale.alias

            echo "en_US.UTF-8 UTF-8" >> /etc/locale.gen
            locale-gen en_US.UTF-8
      outputs:
        - source: /usr/share/locale
          target: /usr/share/locale
          uid: 0
          gid: 0
        - source: /usr/lib/locale
          target: /usr/lib/locale
          uid: 0
          gid: 0
accounts:
  root: true
  run-as: root
  users:
    - name: nonroot
      uid: 65532
      gid: 65532
    - name: _apt
      uid: 42
      gid: 65532
  groups:
    - name: nonroot
      gid: 65532
      members:
        - nonroot
os-release:
  name: Docker Hardened Images (Debian)
  id: debian
  version-id: "13"
  version-codename: trixie
  pretty-name: Docker Hardened Images/Debian GNU/Linux 13 (trixie)
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
environment:
  DEBIAN_FRONTEND: noninteractive
  LANG: en_US.UTF-8
  LANGUAGE: en_US:en
  LC_ALL: en_US.UTF-8
paths:
  - type: symlink
    path: /kafdrop
    uid: 0
    gid: 0
    source: /usr/share/kafdrop
annotations:
  org.opencontainers.image.description: A minimal Kafdrop image
  org.opencontainers.image.licenses: Apache-2.0
entrypoint:
  - java
  - --add-opens=java.base/sun.nio.ch=ALL-UNNAMED
  - -Xss256K
  - -Dloader.path=/extra-classes
  - -jar
  - /usr/share/kafdrop/kafdrop.jar
ports:
  - 9000/tcp
