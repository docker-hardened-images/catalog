# syntax=dhi.io/build:2-alpine3.24

name: Kafdrop 4.x (dev)
image: dhi.io/kafdrop
variant: dev
tags:
  - 4-alpine-dev
  - 4.3-alpine-dev
  - 4-alpine3.24-dev
  - 4.3.1-alpine-dev
  - 4.3-alpine3.24-dev
  - 4.3.1-alpine3.24-dev
platforms:
  - linux/amd64
  - linux/arm64
dates:
  release: "2023-10-09"
vars:
  JAVA_FIPS_SUFFIX: ""
  SEMVER_MAJOR_MINOR_VERSION: "4.3"
  SEMVER_MAJOR_VERSION: "4"
  SEMVER_VERSION: 4.3.1
  VERSION: 4.3.1-r1
contents:
  repositories:
    - https://dhi.io/apk/alpine/v3.24/main
    - https://dl-cdn.alpinelinux.org/alpine/v3.24/main
    - https://dl-cdn.alpinelinux.org/alpine/v3.24/community
  keyring:
    - https://dhi.io/keyring/dhi-apk@docker-0F81AD7700D99184.rsa.pub
  packages:
    - alpine-baselayout-data
    - apk-tools
    - bash
    - busybox
    - ca-certificates
    - ca-certificates-bundle
    - coreutils
    - eclipse-temurin-25-jre
    - eclipse-temurin-25-jre-oci-config
    - findutils
    - kafdrop-4=4.3.1-r1
    - tzdata
accounts:
  root: true
  run-as: root
  users:
    - name: nonroot
      uid: 65532
      gid: 65532
  groups:
    - name: nonroot
      gid: 65532
      members:
        - nonroot
os-release:
  name: Docker Hardened Images (Alpine)
  id: alpine
  version-id: "3.24"
  pretty-name: Docker Hardened Images/Alpine Linux v3.24
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
environment:
  LANG: en_US.UTF-8
  LANGUAGE: en_US:en
  LC_ALL: en_US.UTF-8
paths:
  - type: symlink
    path: /kafdrop
    uid: 0
    gid: 0
    source: /usr/share/kafdrop
annotations:
  org.opencontainers.image.description: A minimal Kafdrop image
  org.opencontainers.image.licenses: Apache-2.0
entrypoint:
  - java
  - --add-opens=java.base/sun.nio.ch=ALL-UNNAMED
  - -Xss256K
  - -Dloader.path=/extra-classes
  - -jar
  - /usr/share/kafdrop/kafdrop.jar
ports:
  - 9000/tcp
