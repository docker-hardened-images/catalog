# syntax=dhi.io/build:2-debian13

name: JupyterHub K8s Network Tools 4.x
image: dhi.io/jupyterhub-k8s-network-tools
variant: runtime
tags:
  - "4"
  - "4.4"
  - 4.4.1
  - 4-debian
  - 4-debian13
  - 4.4-debian
  - 4.4-debian13
  - 4.4.1-debian
  - 4.4.1-debian13
platforms:
  - linux/amd64
  - linux/arm64
dates:
  release: "2026-08-10"
vars:
  FLAVORED_SUFFIX: ""
  SEMVER_MAJOR_MINOR_VERSION: "4.4"
  SEMVER_MAJOR_VERSION: "4"
  SEMVER_VERSION: 4.4.1
  SUFFIX: ""
  VERSION: 4.4.1
contents:
  repositories:
    - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
  keyring:
    - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
  packages:
    - bash
    - iptables
accounts:
  run-as: nonroot
  users:
    - name: nonroot
      uid: 65532
      gid: 65532
  groups:
    - name: nonroot
      gid: 65532
      members:
        - nonroot
os-release:
  name: Docker Hardened Images (Debian)
  id: debian
  version-id: "13"
  version-codename: trixie
  pretty-name: Docker Hardened Images/Debian GNU/Linux 13 (trixie)
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
paths:
  - type: symlink
    path: /usr/sbin/iptables
    uid: 0
    gid: 0
    source: /usr/sbin/iptables-nft
  - type: symlink
    path: /usr/sbin/ip6tables
    uid: 0
    gid: 0
    source: /usr/sbin/ip6tables-nft
annotations:
  org.opencontainers.image.description: A minimal jupyterhub-k8s-network-tools image
  org.opencontainers.image.licenses: BSD-3-Clause
entrypoint:
  - iptables
