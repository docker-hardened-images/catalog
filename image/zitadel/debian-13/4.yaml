# syntax=dhi.io/build:2-debian13

name: ZITADEL 4.x
image: dhi.io/zitadel
variant: runtime
tags:
  - "4"
  - "4.20"
  - 4.20.6
  - 4-debian
  - 4-debian13
  - 4.20-debian
  - 4.20-debian13
  - 4.20.6-debian
  - 4.20.6-debian13
platforms:
  - linux/amd64
  - linux/arm64
dates:
  release: "2025-07-31"
vars:
  FLAVORED_SUFFIX: ""
  LICENSE_SUFFIX: ""
  SEMVER_MAJOR_MINOR_VERSION: "4.20"
  SEMVER_MAJOR_VERSION: "4"
  SEMVER_VERSION: 4.20.6
  SUFFIX: ""
  VERSION: 4.20.6-0
contents:
  repositories:
    - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
  keyring:
    - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
  packages:
    - base-files
    - ca-certificates-bundle
    - tzdata
    - zitadel-4-license=4.20.6-0
    - zitadel-4=4.20.6-0
accounts:
  run-as: zitadel
  users:
    - name: zitadel
      uid: 1000
      gid: 1000
  groups:
    - name: zitadel
      gid: 1000
      members:
        - zitadel
os-release:
  name: Docker Hardened Images (Debian)
  id: debian
  version-id: "13"
  version-codename: trixie
  pretty-name: Docker Hardened Images/Debian GNU/Linux 13 (trixie)
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
work-dir: /
environment:
  ZITADEL_SERVICEPING_ENABLED: "false"
paths:
  - type: directory
    path: /app
    uid: 0
    gid: 0
    mode: "0755"
  - type: symlink
    path: /app/zitadel
    uid: 0
    gid: 0
    source: /usr/bin/zitadel
annotations:
  org.opencontainers.image.description: ZITADEL - Identity infrastructure, simplified for you
  org.opencontainers.image.licenses: AGPL-3.0-only AND Apache-2.0 AND MIT
entrypoint:
  - /app/zitadel
ports:
  - 8080/tcp
