# syntax=dhi.io/build:2-debian13

name: ZITADEL 4.x (dev)
image: dhi.io/zitadel
variant: dev
tags:
  - 4-dev
  - 4.20-dev
  - 4.20.5-dev
  - 4-debian-dev
  - 4-debian13-dev
  - 4.20-debian-dev
  - 4.20-debian13-dev
  - 4.20.5-debian-dev
  - 4.20.5-debian13-dev
platforms:
  - linux/amd64
  - linux/arm64
dates:
  release: "2025-07-31"
vars:
  FLAVORED_SUFFIX: -dev
  LICENSE_SUFFIX: ""
  SEMVER_MAJOR_MINOR_VERSION: "4.20"
  SEMVER_MAJOR_VERSION: "4"
  SEMVER_VERSION: 4.20.5
  SUFFIX: -dev
  VERSION: 4.20.5-0
contents:
  repositories:
    - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
  keyring:
    - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
  packages:
    - '!gawk'
    - '!libelogind0'
    - '!original-awk'
    - apt
    - base-files
    - bash
    - ca-certificates
    - ca-certificates-bundle
    - coreutils
    - diffutils
    - dpkg
    - findutils
    - grep
    - libc-bin
    - mawk
    - perl-base
    - sed
    - sqv
    - tzdata
    - util-linux
    - zitadel-4-dev=4.20.5-0
    - zitadel-4-license=4.20.5-0
  builds:
    - name: locale
      contents:
        packages:
          - bash
          - locales
          - coreutils
          - gzip
      pipeline:
        - name: install locales
          runs: |
            set -eux -o pipefail

            ln -s /etc/locale.alias /usr/share/locale/locale.alias

            echo "en_US.UTF-8 UTF-8" >> /etc/locale.gen
            locale-gen en_US.UTF-8
      outputs:
        - source: /usr/share/locale
          target: /usr/share/locale
          uid: 0
          gid: 0
        - source: /usr/lib/locale
          target: /usr/lib/locale
          uid: 0
          gid: 0
accounts:
  root: true
  run-as: root
  users:
    - name: zitadel
      uid: 1000
      gid: 1000
    - name: _apt
      uid: 42
      gid: 65532
  groups:
    - name: zitadel
      gid: 1000
      members:
        - zitadel
os-release:
  name: Docker Hardened Images (Debian)
  id: debian
  version-id: "13"
  version-codename: trixie
  pretty-name: Docker Hardened Images/Debian GNU/Linux 13 (trixie)
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
work-dir: /
environment:
  DEBIAN_FRONTEND: noninteractive
  LANG: en_US.UTF-8
  LANGUAGE: en_US:en
  LC_ALL: en_US.UTF-8
  ZITADEL_SERVICEPING_ENABLED: "false"
paths:
  - type: directory
    path: /app
    uid: 0
    gid: 0
    mode: "0755"
  - type: symlink
    path: /app/zitadel
    uid: 0
    gid: 0
    source: /usr/bin/zitadel
annotations:
  org.opencontainers.image.description: ZITADEL - Identity infrastructure, simplified for you
  org.opencontainers.image.licenses: AGPL-3.0-only AND Apache-2.0 AND MIT
entrypoint:
  - /app/zitadel
ports:
  - 8080/tcp
