# syntax=dhi.io/build:2-alpine3.24

name: ZITADEL 4.x (dev)
image: dhi.io/zitadel
variant: dev
tags:
  - 4-alpine-dev
  - 4.20-alpine-dev
  - 4-alpine3.24-dev
  - 4.20.6-alpine-dev
  - 4.20-alpine3.24-dev
  - 4.20.6-alpine3.24-dev
platforms:
  - linux/amd64
  - linux/arm64
dates:
  release: "2025-07-31"
vars:
  FLAVORED_SUFFIX: -dev
  SEMVER_MAJOR_MINOR_VERSION: "4.20"
  SEMVER_MAJOR_VERSION: "4"
  SEMVER_VERSION: 4.20.6
  SUFFIX: -dev
  VERSION: 4.20.6-r0
contents:
  repositories:
    - https://dhi.io/apk/alpine/v3.24/main
    - https://dl-cdn.alpinelinux.org/alpine/v3.24/main
    - https://dl-cdn.alpinelinux.org/alpine/v3.24/community
  keyring:
    - https://dhi.io/keyring/dhi-apk@docker-0F81AD7700D99184.rsa.pub
  packages:
    - alpine-baselayout-data
    - apk-tools
    - bash
    - busybox
    - ca-certificates
    - ca-certificates-bundle
    - coreutils
    - findutils
    - tzdata
    - zitadel-4-dev=4.20.6-r0
accounts:
  root: true
  run-as: root
  users:
    - name: zitadel
      uid: 1000
      gid: 1000
  groups:
    - name: zitadel
      gid: 1000
      members:
        - zitadel
os-release:
  name: Docker Hardened Images (Alpine)
  id: alpine
  version-id: "3.24"
  pretty-name: Docker Hardened Images/Alpine Linux v3.24
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
work-dir: /
environment:
  ZITADEL_SERVICEPING_ENABLED: "false"
paths:
  - type: directory
    path: /app
    uid: 0
    gid: 0
    mode: "0755"
  - type: symlink
    path: /app/zitadel
    uid: 0
    gid: 0
    source: /usr/bin/zitadel
annotations:
  org.opencontainers.image.description: ZITADEL - Identity infrastructure, simplified for you
  org.opencontainers.image.licenses: AGPL-3.0-only AND Apache-2.0 AND MIT
entrypoint:
  - /app/zitadel
ports:
  - 8080/tcp
