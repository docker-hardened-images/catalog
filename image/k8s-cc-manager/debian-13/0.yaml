# syntax=dhi.io/build:2-debian13

name: NVIDIA k8s-cc-manager 0.x
image: dhi.io/k8s-cc-manager
variant: runtime
tags:
  - "0"
  - "0.4"
  - 0.4.3
  - 0-debian
  - 0-debian13
  - 0.4-debian
  - 0.4-debian13
  - 0.4.3-debian
  - 0.4.3-debian13
platforms:
  - linux/amd64
  - linux/arm64
dates:
  release: "2026-06-16"
vars:
  GPU_ADMIN_TOOLS_VERSION: 2026.09.29
  SEMVER_MAJOR_MINOR_VERSION: "0.4"
  SEMVER_MAJOR_VERSION: "0"
  SEMVER_VERSION: 0.4.3
  VERSION: 0.4.3-7
contents:
  repositories:
    - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
  keyring:
    - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
  packages:
    - base-files
    - busybox
    - ca-certificates-bundle
    - k8s-cc-manager-0=0.4.3-7
    - libffi8
    - libgcc-s1
    - libstdc++6
    - python-3.13
    - tzdata
  builds:
    - name: gpu-admin-tools sbom
      contents:
        packages:
          - bash
          - coreutils
          - jq
      pipeline:
        - uses: spdx@v1
          with:
            license: MIT
            name: gpu-admin-tools
            purl: pkg:github/NVIDIA/gpu-admin-tools@2026.09.29
            version: 2026.09.29
      outputs:
        - source: /opt/docker/sbom/gpu-admin-tools
          target: /opt/docker/sbom/gpu-admin-tools
          uid: 0
          gid: 0
accounts:
  root: true
  run-as: root
  users:
    - name: nonroot
      uid: 65532
      gid: 65532
  groups:
    - name: nonroot
      gid: 65532
      members:
        - nonroot
os-release:
  name: Docker Hardened Images (Debian)
  id: debian
  version-id: "13"
  version-codename: trixie
  pretty-name: Docker Hardened Images/Debian GNU/Linux 13 (trixie)
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
work-dir: /app
environment:
  PATH: /app/.venv/bin:/usr/local/bin:/usr/local/sbin:/usr/sbin:/usr/bin:/sbin:/bin
  PYTHONUNBUFFERED: "1"
  SSL_CERT_FILE: /etc/ssl/certs/ca-certificates.crt
paths:
  - type: symlink
    path: /app
    uid: 0
    gid: 0
    source: /usr/lib/k8s-cc-manager
  - type: symlink
    path: /usr/bin/rm
    uid: 0
    gid: 0
    source: /usr/bin/busybox
annotations:
  org.opencontainers.image.description: A minimal NVIDIA k8s-cc-manager image
  org.opencontainers.image.licenses: Apache-2.0 AND MIT
entrypoint:
  - /app/.venv/bin/python
  - /app/main.py
