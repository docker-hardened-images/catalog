metadata:
  display-name: NVIDIA k8s-cc-manager
  short-description: NVIDIA manager for enabling GPU Confidential Computing and Protected PCIe modes from Kubernetes node labels.
  featured: false
  home-url: https://github.com/NVIDIA/k8s-cc-manager
  categories:
    - integration-and-delivery
  included-tools:
    - name: k8s-cc-manager
      description: Python daemon that watches the nvidia.com/cc.mode node label and applies the requested GPU Confidential Computing / Protected PCIe mode.
    - name: gpu-admin-tools
      description: Vendored NVIDIA GPU administration library (nvidia_gpu_tools) used to query and set CC/PPCIe mode and reset GPUs over PCI.
