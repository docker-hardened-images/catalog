# syntax=dhi.io/build:2-debian13

name: Node.js 24.x / Socket Firewall (sfw, dev)
image: dhi.io/node
variant: dev
flavor: sfw
tags:
  - 24-sfw-dev
  - 24.19-sfw-dev
  - 24.19.0-sfw-dev
  - 24-debian-sfw-dev
  - 24.19.0-0-sfw-dev
  - 24-debian13-sfw-dev
  - 24.19-debian-sfw-dev
  - 24.19-debian13-sfw-dev
  - 24.19.0-debian-sfw-dev
  - 24.19.0-0-debian-sfw-dev
  - 24.19.0-debian13-sfw-dev
  - 24.19.0-0-debian13-sfw-dev
platforms:
  - linux/amd64
  - linux/arm64
dates:
  release: "2025-05-06"
  end-of-life: "2028-04-30"
vars:
  COREPACK_VERSION: 0.35.0-1
  NODEJS_VERSION_MAJOR: "24"
  NODEJS_VERSION_MAJOR_MINOR: "24.19"
  NODEJS_VERSION_MAJOR_MINOR_PATCH: 24.19.0
  NPM_VERSION: 11.19.0-3
  SFW_VERSION: 1.15.0-0
  VERSION: 24.19.0-0
  YARN_VERSION: 1.22.22-1
contents:
  repositories:
    - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
  keyring:
    - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
  packages:
    - '!gawk'
    - '!libelogind0'
    - '!original-awk'
    - apt
    - base-files
    - bash
    - ca-certificates
    - coreutils
    - diffutils
    - dpkg
    - findutils
    - git
    - grep
    - libc-bin
    - libc6
    - libstdc++6
    - mawk
    - node-corepack=0.35.0-1
    - nodejs-24=24.19.0-0
    - npm=11.19.0-3
    - perl-base
    - sed
    - sfw-free-npm=1.15.0-0
    - sfw-free-oci-config=1.15.0-0
    - sfw-free-yarn=1.15.0-0
    - sfw-free=1.15.0-0
    - util-linux
    - yarn-classic=1.22.22-1
accounts:
  root: true
  run-as: root
  users:
    - name: node
      uid: 1000
      gid: 1000
    - name: _apt
      uid: 42
      gid: 65532
  groups:
    - name: node
      gid: 1000
      members:
        - node
os-release:
  name: Docker Hardened Images (Debian)
  id: debian
  version-id: "13"
  version-codename: trixie
  pretty-name: Docker Hardened Images/Debian GNU/Linux 13 (trixie)
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
work-dir: /app
environment:
  DEBIAN_FRONTEND: noninteractive
  NODE_VERSION: 24.19.0-0
  NPM_CONFIG_UPDATE_NOTIFIER: "false"
  PATH: /opt/socket/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
paths:
  - type: directory
    path: /app
    uid: 0
    gid: 0
    mode: "0755"
annotations:
  org.opencontainers.image.description: A minimal Node.JS image
  org.opencontainers.image.licenses: MIT
cmd:
  - node
