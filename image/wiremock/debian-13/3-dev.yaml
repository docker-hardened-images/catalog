# syntax=dhi.io/build:2-debian13

name: WireMock 3.x (dev)
image: dhi.io/wiremock
variant: dev
tags:
  - 3-dev
  - 3.13-dev
  - 3-debian-dev
  - 3-debian13-dev
  - 3.13-debian-dev
  - 3.13-debian13-dev
platforms:
  - linux/amd64
  - linux/arm64
vars:
  JAVA_HOME_PATH: /usr/lib/jvm/temurin-17
  JAVA_MAJOR_VERSION: "17"
  JDK_MAJOR_VERSION: "17"
  SEMVER_MAJOR_MINOR_VERSION: "3.13"
  SEMVER_MAJOR_VERSION: "3"
  SEMVER_VERSION: 3.13.2
  VERSION: 3.13.2-0
contents:
  repositories:
    - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
  keyring:
    - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
  packages:
    - '!gawk'
    - '!libelogind0'
    - '!mawk'
    - '!original-awk'
    - apt
    - base-files
    - bash
    - ca-certificates
    - ca-certificates-bundle
    - coreutils
    - diffutils
    - dpkg
    - eclipse-temurin-17-jre
    - eclipse-temurin-17-jre-oci-config
    - findutils
    - grep
    - libc-bin
    - libc6
    - libstdc++6
    - lsb-base
    - mawk
    - perl-base
    - sed
    - tzdata
    - util-linux
    - wiremock=3.13.2-0
  builds:
    - name: locale
      contents:
        packages:
          - bash
          - locales
          - coreutils
          - gzip
      pipeline:
        - name: install locales
          runs: |
            set -eux -o pipefail

            ln -s /etc/locale.alias /usr/share/locale/locale.alias

            echo "en_US.UTF-8 UTF-8" >> /etc/locale.gen
            locale-gen en_US.UTF-8
      outputs:
        - source: /usr/share/locale
          target: /usr/share/locale
          uid: 0
          gid: 0
        - source: /usr/lib/locale
          target: /usr/lib/locale
          uid: 0
          gid: 0
accounts:
  root: true
  run-as: root
  users:
    - name: nonroot
      uid: 65532
      gid: 65532
    - name: _apt
      uid: 42
      gid: 65532
  groups:
    - name: nonroot
      gid: 65532
      members:
        - nonroot
os-release:
  name: Docker Hardened Images (Debian)
  id: debian
  version-id: "13"
  version-codename: trixie
  pretty-name: Docker Hardened Images/Debian GNU/Linux 13 (trixie)
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
work-dir: /home/wiremock
environment:
  DEBIAN_FRONTEND: noninteractive
  JAVA_HOME: /usr/lib/jvm/temurin-17
  LANG: en_US.UTF-8
  LANGUAGE: en_US:en
  LC_ALL: en_US.UTF-8
  PATH: /usr/lib/jvm/temurin-17/bin:/usr/local/bin:/usr/local/sbin:/usr/sbin:/usr/bin:/sbin:/bin
paths:
  - type: directory
    path: /usr/local/bin
    uid: 0
    gid: 0
  - type: symlink
    path: /usr/local/bin/wiremock-standalone.jar
    uid: 0
    gid: 0
    source: /usr/share/wiremock/wiremock-standalone.jar
  - type: directory
    path: /home/wiremock
    uid: 65532
    gid: 65532
    mode: "0755"
  - type: directory
    path: /home/wiremock/__files
    uid: 65532
    gid: 65532
    mode: "0755"
  - type: directory
    path: /home/wiremock/mappings
    uid: 65532
    gid: 65532
    mode: "0755"
annotations:
  org.opencontainers.image.description: A minimal WireMock image
  org.opencontainers.image.licenses: Apache-2.0
entrypoint:
  - java
cmd:
  - -jar
  - /usr/local/bin/wiremock-standalone.jar
ports:
  - 8080/tcp
  - 8443/tcp
