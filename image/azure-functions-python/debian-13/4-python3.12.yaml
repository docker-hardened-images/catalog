# syntax=dhi.io/build:2-debian13

name: Azure Functions 4.x for Python 3.12.x (python3.12)
image: dhi.io/azure-functions-python
variant: runtime
flavor: python3.12
tags:
  - 4-python3.12
  - 4.1054-python3.12
  - 4-debian-python3.12
  - 4-debian13-python3.12
  - 4.1054.200-python3.12
  - 4.1054-debian-python3.12
  - 4.1054-debian13-python3.12
  - 4.1054.200-debian-python3.12
  - 4.1054.200-debian13-python3.12
platforms:
  - linux/amd64
vars:
  FUNCTIONS_WORKER: python
  PYTHON_MAJOR_MINOR_VERSION: "3.12"
  SEMVER_MAJOR_MINOR_VERSION: "4.1054"
  SEMVER_MAJOR_VERSION: "4"
  SEMVER_VERSION: 4.1054.200
  VERSION: 4.1054.200-16
contents:
  repositories:
    - deb [signed-by=/usr/share/keyrings/microsoft-signing-key.gpg] https://packages.microsoft.com/debian/13/prod trixie main
    - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
  keyring:
    - https://packages.microsoft.com/keys/microsoft-2025.asc
    - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
  packages:
    - '!libelogind0'
    - '!mawk'
    - '!original-awk'
    - azure-functions-python=4.1054.200-16
    - base-files
    - bash
    - ca-certificates-bundle
    - libglib2.0-0t64
    - libicu76
    - libsm6
    - libstdc++6
    - libxext6
    - libxrender-dev
    - msodbcsql18
    - mssql-tools18
    - python-3.12
    - python-3.12-dev
    - python3-pip
    - python3-setuptools
    - python3-wheel
    - tzdata
    - unixodbc
accounts:
  run-as: nonroot
  users:
    - name: nonroot
      uid: 65532
      gid: 65532
  groups:
    - name: nonroot
      gid: 65532
      members:
        - nonroot
os-release:
  name: Docker Hardened Images (Debian)
  id: debian
  version-id: "13"
  version-codename: trixie
  pretty-name: Docker Hardened Images/Debian GNU/Linux 13 (trixie)
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
environment:
  ASPNETCORE_CONTENTROOT: /azure-functions-host
  ASPNETCORE_URLS: http://+:80
  AzureFunctionsJobHost__Logging__Console__IsEnabled: "true"
  AzureWebJobsScriptRoot: /home/site/wwwroot
  DOTNET_RUNNING_IN_CONTAINER: "true"
  DOTNET_USE_POLLING_FILE_WATCHER: "true"
  FUNCTIONS_WORKER_RUNTIME: python
  FUNCTIONS_WORKER_RUNTIME_VERSION: "3.12"
paths:
  - type: file
    path: /usr/share/keyrings/microsoft-signing-key.gpg
    uid: 0
    gid: 0
    mode: "0644"
    source: ecosystem/azure-functions/keys/microsoft-signing-key.gpg
  - type: symlink
    path: /azure-functions-host
    uid: 0
    gid: 0
    source: /usr/share/azure-functions-host
  - type: symlink
    path: /FuncExtensionBundles
    uid: 0
    gid: 0
    source: /usr/share/FuncExtensionBundles
  - type: directory
    path: /home/site/wwwroot
    uid: 65532
    gid: 65532
    mode: "0755"
  - type: symlink
    path: /home/nonroot/site
    uid: 0
    gid: 0
    source: /home/site
annotations:
  org.opencontainers.image.description: A minimal Azure Functions Python image
  org.opencontainers.image.licenses: MIT
entrypoint:
  - /azure-functions-host/Microsoft.Azure.WebJobs.Script.WebHost
