# syntax=dhi.io/build:2-debian13

name: JetStream Controller 0.x
image: dhi.io/jetstream-controller
variant: runtime
tags:
  - "0"
  - "0.25"
  - 0.25.0
  - 0-debian
  - 0-debian13
  - 0.25-debian
  - 0.25-debian13
  - 0.25.0-debian
  - 0.25.0-debian13
platforms:
  - linux/amd64
  - linux/arm64
dates:
  release: "2020-10-05"
vars:
  FLAVORED_SUFFIX: ""
  SEMVER_MAJOR_MINOR_VERSION: "0.25"
  SEMVER_MAJOR_VERSION: "0"
  SEMVER_VERSION: 0.25.0
  SUFFIX: ""
  VERSION: 0.25.0-2
contents:
  repositories:
    - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
  keyring:
    - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
  packages:
    - base-files
    - ca-certificates-bundle
    - jetstream-controller-0=0.25.0-2
    - tzdata
accounts:
  run-as: "65532"
  users:
    - name: nonroot
      uid: 65532
      gid: 65532
  groups:
    - name: nonroot
      gid: 65532
      members:
        - nonroot
os-release:
  name: Docker Hardened Images (Debian)
  id: debian
  version-id: "13"
  version-codename: trixie
  pretty-name: Docker Hardened Images/Debian GNU/Linux 13 (trixie)
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
work-dir: /nack
environment:
  SSL_CERT_FILE: /etc/ssl/certs/ca-certificates.crt
paths:
  - type: directory
    path: /usr/local/bin
    uid: 0
    gid: 0
    mode: "0755"
  - type: symlink
    path: /usr/local/bin/jetstream-controller
    uid: 0
    gid: 0
    source: /usr/bin/jetstream-controller
  - type: symlink
    path: /jetstream-controller
    uid: 0
    gid: 0
    source: /usr/bin/jetstream-controller
  - type: directory
    path: /nack
    uid: 65532
    gid: 65532
    mode: "0770"
annotations:
  org.opencontainers.image.description: A minimal JetStream Controller image
  org.opencontainers.image.licenses: Apache-2.0
entrypoint:
  - /jetstream-controller
