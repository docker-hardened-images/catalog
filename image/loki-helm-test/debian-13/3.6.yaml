# syntax=dhi.io/build:2-debian13

name: loki-helm-test 3.6.x
image: dhi.io/loki-helm-test
variant: runtime
tags:
  - "3.6"
  - 3.6.16
  - 3.6-debian
  - 3.6-debian13
  - 3.6.16-debian
  - 3.6.16-debian13
platforms:
  - linux/amd64
  - linux/arm64
dates:
  release: "2026-02-23"
vars:
  FLAVORED_SUFFIX: ""
  SEMVER_MAJOR_MINOR_VERSION: "3.6"
  SEMVER_MAJOR_VERSION: "3"
  SEMVER_VERSION: 3.6.16
  SUFFIX: ""
  VERSION: 3.6.16-1
contents:
  repositories:
    - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
  keyring:
    - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
  packages:
    - base-files
    - ca-certificates-bundle
    - loki-helm-test-3.6=3.6.16-1
    - tzdata
accounts:
  run-as: nonroot
  users:
    - name: nonroot
      uid: 65532
      gid: 65532
  groups:
    - name: nonroot
      gid: 65532
      members:
        - nonroot
os-release:
  name: Docker Hardened Images (Debian)
  id: debian
  version-id: "13"
  version-codename: trixie
  pretty-name: Docker Hardened Images/Debian GNU/Linux 13 (trixie)
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
paths:
  - type: directory
    path: /usr/local/bin
    uid: 0
    gid: 0
  - type: symlink
    path: /usr/local/bin/helm-test
    uid: 0
    gid: 0
    source: /usr/bin/helm-test
annotations:
  org.opencontainers.image.description: A minimal loki-helm-test image
  org.opencontainers.image.licenses: AGPL-3.0
entrypoint:
  - /usr/local/bin/helm-test
