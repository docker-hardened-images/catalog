# syntax=dhi.io/build:2-debian13

name: MediaWiki 1.45 (php-fpm)
image: dhi.io/mediawiki
variant: runtime
flavor: php-fpm
tags:
  - 1.45-php-fpm
  - 1.45.4-php-fpm
  - 1.45-debian-php-fpm
  - 1.45-debian13-php-fpm
  - 1.45.4-debian-php-fpm
  - 1.45.4-debian13-php-fpm
platforms:
  - linux/amd64
  - linux/arm64
dates:
  release: "2025-12-04"
vars:
  PACKAGE_HOME: /usr/share/mediawiki-1.45
  PACKAGE_NAME: mediawiki-1.45
  PHP_INI_DIR: /etc/php-8.3
  PHP_MAJOR_MINOR_VERSION: "8.3"
  PHP_VERSION: 8.3.33-0
  SEMVER_MAJOR_MINOR_VERSION: "1.45"
  SEMVER_MAJOR_VERSION: "1"
  SEMVER_VERSION: 1.45.4
  VERSION: 1.45.4-1
contents:
  repositories:
    - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
  keyring:
    - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
  packages:
    - '!libelogind0'
    - '!mawk'
    - '!original-awk'
    - base-files
    - bash
    - fontconfig-config
    - git
    - libargon2-1
    - libcurl4t64
    - libfontconfig1
    - libgomp1
    - libicu76
    - liblcms2-2
    - liblqr-1-0
    - libltdl7
    - liblua5.1-0
    - libonig5
    - libpcre2-8-0
    - libreadline8t64
    - libsodium23
    - libsqlite3-0
    - libssl3t64
    - libstdc++6
    - libtiff6
    - libwebp7
    - libx11-6
    - libxext6
    - libxml2
    - mediawiki-1.45=1.45.4-1
    - php-8.3
    - php-8.3-fpm
    - python-3.13
    - python-3.13-dev
    - python3-pip
    - python3-setuptools
    - python3-wheel
    - zlib1g
accounts:
  run-as: nonroot
  users:
    - name: nonroot
      uid: 65532
      gid: 65532
  groups:
    - name: nonroot
      gid: 65532
      members:
        - nonroot
os-release:
  name: Docker Hardened Images (Debian)
  id: debian
  version-id: "13"
  version-codename: trixie
  pretty-name: Docker Hardened Images/Debian GNU/Linux 13 (trixie)
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
paths:
  - type: directory
    path: /var/www
    uid: 0
    gid: 0
  - type: symlink
    path: /var/www/html
    uid: 0
    gid: 0
    source: /usr/share/mediawiki-1.45
  - type: directory
    path: /var/www/data
    uid: 65532
    gid: 65532
    mode: "0755"
  - type: directory
    path: /usr/local/bin
    uid: 0
    gid: 0
  - type: symlink
    path: /usr/local/bin/magick
    uid: 0
    gid: 0
    source: /usr/bin/magick
  - type: symlink
    path: /usr/local/bin/convert
    uid: 0
    gid: 0
    source: /usr/bin/convert
  - type: directory
    path: /tmp
    uid: 0
    gid: 0
    mode: "0777"
annotations:
  org.opencontainers.image.description: A minimal MediaWiki image
  org.opencontainers.image.licenses: GPL-2.0
cmd:
  - php-fpm
ports:
  - 9000/tcp
