# syntax=dhi.io/build:2-alpine3.23

name: WBITT Network Multitool 3.x (compat)
image: dhi.io/wbitt-network-multitool
variant: runtime
flavor: compat
tags:
  - 3-alpine-compat
  - 3.24-alpine-compat
  - 3-alpine3.23-compat
  - 3.24.4-alpine-compat
  - 3.24-alpine3.23-compat
  - 3.24.4-alpine3.23-compat
platforms:
  - linux/amd64
  - linux/arm64
dates:
  release: "2025-11-24"
vars:
  SEMVER_MAJOR_MINOR_VERSION: "3.24"
  SEMVER_MAJOR_VERSION: "3"
  SEMVER_VERSION: 3.24.4
  VERSION: 3.24.4-r0
contents:
  repositories:
    - https://dhi.io/apk/alpine/v3.23/main
    - https://dl-cdn.alpinelinux.org/alpine/v3.23/main
    - https://dl-cdn.alpinelinux.org/alpine/v3.23/community
  keyring:
    - https://dhi.io/keyring/dhi-apk@docker-0F81AD7700D99184.rsa.pub
  packages:
    - alpine-baselayout-data
    - apache2-utils
    - bash
    - bind-tools
    - busybox-extras
    - curl
    - ethtool
    - git
    - iperf3
    - iproute2
    - iputils
    - jq
    - lftp
    - mtr
    - mysql-client
    - net-snmp-tools
    - net-tools
    - netcat-openbsd
    - nginx
    - nmap
    - nmap-scripts
    - openssh-client
    - openssl
    - perl-net-telnet
    - postgresql-client
    - procps
    - rsync
    - samba-client
    - socat
    - tcpdump
    - tcptraceroute
    - tshark
    - wbitt-network-multitool=3.24.4-r0
    - wget
accounts:
  run-as: nginx
  users:
    - name: nginx
      uid: 65532
      gid: 65532
  groups:
    - name: nginx
      gid: 65532
      members:
        - nginx
os-release:
  name: Docker Hardened Images (Alpine)
  id: alpine
  version-id: "3.23"
  pretty-name: Docker Hardened Images/Alpine Linux v3.23
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
paths:
  - type: directory
    path: /etc/nginx
    uid: 0
    gid: 65532
    mode: "0770"
  - type: delete
    path: /etc/nginx/nginx.conf
    uid: 0
    gid: 0
  - type: symlink
    path: /etc/nginx/nginx.conf
    uid: 0
    gid: 0
    source: /usr/share/wbitt-network-multitool/nginx.conf
  - type: directory
    path: /docker
    uid: 0
    gid: 0
  - type: symlink
    path: /docker/entrypoint.sh
    uid: 0
    gid: 0
    source: /usr/share/wbitt-network-multitool/entrypoint.sh
  - type: symlink
    path: /certs
    uid: 0
    gid: 0
    source: /usr/share/wbitt-network-multitool/certs
  - type: directory
    path: /var/cache/nginx
    uid: 65532
    gid: 65532
    mode: "0770"
  - type: directory
    path: /var/lib/nginx
    uid: 65532
    gid: 65532
    mode: "0770"
  - type: directory
    path: /var/lib/nginx/tmp
    uid: 65532
    gid: 65532
    mode: "0770"
  - type: directory
    path: /usr/share/nginx/html
    uid: 65532
    gid: 65532
    mode: "0770"
  - type: file
    path: /usr/share/nginx/html/index.html
    uid: 65532
    gid: 65532
    mode: "0644"
    source: image/wbitt-network-multitool/alpine-3.23/index.html
  - type: symlink
    path: /var/log/nginx/access.log
    uid: 0
    gid: 0
    source: /dev/stdout
  - type: symlink
    path: /var/log/nginx/error.log
    uid: 0
    gid: 0
    source: /dev/stderr
annotations:
  org.opencontainers.image.description: A minimal WBITT Network Multitool image
  org.opencontainers.image.licenses: MIT
entrypoint:
  - /bin/sh
  - /docker/entrypoint.sh
cmd:
  - /usr/sbin/nginx
  - -g
  - daemon off;
ports:
  - 80/tcp
  - 443/tcp
  - 1180/tcp
  - 11443/tcp
