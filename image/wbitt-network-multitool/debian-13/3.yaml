# syntax=dhi.io/build:2-debian13

name: WBITT Network Multitool 3.x
image: dhi.io/wbitt-network-multitool
variant: runtime
tags:
  - "3"
  - "3.24"
  - 3.24.4
  - 3-debian
  - 3-debian13
  - 3.24-debian
  - 3.24-debian13
  - 3.24.4-debian
  - 3.24.4-debian13
platforms:
  - linux/amd64
  - linux/arm64
dates:
  release: "2025-11-24"
vars:
  COMMIT_SHA: a180b64f8bc5de13c0e3f1ba662734694bacf0b7
  SEMVER_MAJOR_MINOR_VERSION: "3.24"
  SEMVER_MAJOR_VERSION: "3"
  SEMVER_VERSION: 3.24.4
  VERSION: 3.24.4
contents:
  repositories:
    - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
  keyring:
    - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
  packages:
    - '!libelogind0'
    - '!original-awk'
    - base-files
    - bash
    - bind9-dnsutils
    - busybox
    - ca-certificates-bundle
    - coreutils
    - curl
    - diffutils
    - findutils
    - grep
    - hostname
    - iproute2
    - iputils-arping
    - iputils-ping
    - iputils-tracepath
    - jq
    - libnet-telnet-perl
    - mawk
    - mount
    - mtr-tiny
    - net-tools
    - nginx-mainline
    - openssh-client
    - openssl
    - procps
    - rsync
    - sed
    - tcpdump
    - tcptraceroute
    - traceroute
    - tzdata
    - wget
  builds:
    - name: wbitt-network-multitool-setup
      contents:
        packages:
          - bash
          - coreutils
          - openssl
          - sed
        files:
          - url: git+https://github.com/wbitt/Network-MultiTool.git#3.24.4
            checksum: a180b64f8bc5de13c0e3f1ba662734694bacf0b7
            path: ${source.dir}/wbitt-network-multitool
            spdx:
              name: network-multitool
              version: 3.24.4
              packages:
                - name: network-multitool
                  purl: pkg:github/wbitt/Network-MultiTool@3.24.4
                  license: MIT
            uid: 0
            gid: 0
      pipeline:
        - name: setup-multitool
          runs: |
            set -eux -o pipefail

            mkdir -p ${target.dir}/certs
            mkdir -p ${target.dir}/docker
            mkdir -p ${target.dir}/etc/nginx
            openssl req \
              -x509 -newkey rsa:2048 -nodes -days 3650 \
              -keyout ${target.dir}/certs/server.key \
              -out ${target.dir}/certs/server.crt \
              -subj '/CN=localhost'

            cp ${source.dir}/wbitt-network-multitool/entrypoint.sh ${target.dir}/docker/entrypoint.sh

            cp ${source.dir}/wbitt-network-multitool/nginx.conf ${target.dir}/etc/nginx/nginx.conf
            sed -i 's|^pid .*|pid        /var/cache/nginx/nginx.pid;|' ${target.dir}/etc/nginx/nginx.conf
      outputs:
        - source: ${target.dir}/docker/entrypoint.sh
          target: /docker/entrypoint.sh
          uid: 0
          gid: 0
          mode: "0755"
        - source: ${target.dir}/etc/nginx/nginx.conf
          target: /etc/nginx/nginx.conf
          uid: 0
          gid: 0
          mode: "0644"
        - source: ${target.dir}/certs/server.key
          target: /certs/server.key
          uid: 0
          gid: 65532
          mode: "0640"
        - source: ${target.dir}/certs/server.crt
          target: /certs/server.crt
          uid: 0
          gid: 65532
          mode: "0644"
        - source: /opt/docker/sbom/network-multitool
          target: /opt/docker/sbom/network-multitool
          uid: 0
          gid: 0
accounts:
  run-as: nginx
  users:
    - name: nginx
      uid: 65532
      gid: 65532
    - name: tcpdump
      uid: 100
      gid: 101
  groups:
    - name: nginx
      gid: 65532
      members:
        - nginx
    - name: tcpdump
      gid: 101
os-release:
  name: Docker Hardened Images (Debian)
  id: debian
  version-id: "13"
  version-codename: trixie
  pretty-name: Docker Hardened Images/Debian GNU/Linux 13 (trixie)
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
paths:
  - type: directory
    path: /etc/nginx
    uid: 0
    gid: 65532
    mode: "0770"
  - type: directory
    path: /var/cache/nginx
    uid: 65532
    gid: 65532
    mode: "0770"
  - type: directory
    path: /usr/share/nginx/html
    uid: 65532
    gid: 65532
    mode: "0770"
  - type: delete
    path: /usr/share/nginx/html/index.html
    uid: 0
    gid: 0
  - type: symlink
    path: /var/log/nginx/access.log
    uid: 0
    gid: 0
    source: /dev/stdout
  - type: symlink
    path: /var/log/nginx/error.log
    uid: 0
    gid: 0
    source: /dev/stderr
  - type: symlink
    path: /usr/bin/traceroute
    uid: 0
    gid: 0
    source: /usr/bin/traceroute.db
  - type: symlink
    path: /usr/bin/traceroute6
    uid: 0
    gid: 0
    source: /usr/bin/traceroute.db
  - type: symlink
    path: /usr/bin/tcptraceroute
    uid: 0
    gid: 0
    source: /usr/bin/tcptraceroute.mt
  - type: symlink
    path: /usr/bin/telnet
    uid: 0
    gid: 0
    source: /bin/busybox
  - type: symlink
    path: /usr/bin/vi
    uid: 0
    gid: 0
    source: /bin/busybox
  - type: symlink
    path: /usr/bin/editor
    uid: 0
    gid: 0
    source: /bin/busybox
annotations:
  org.opencontainers.image.description: A minimal Network Multitool
  org.opencontainers.image.licenses: MIT
entrypoint:
  - /bin/sh
  - /docker/entrypoint.sh
cmd:
  - /usr/sbin/nginx
  - -g
  - daemon off;
ports:
  - 80/tcp
  - 443/tcp
  - 1180/tcp
  - 11443/tcp
