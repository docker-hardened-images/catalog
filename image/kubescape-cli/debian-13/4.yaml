# syntax=dhi.io/build:2-debian13

name: Kubescape CLI 4.x
image: dhi.io/kubescape-cli
variant: runtime
tags:
  - "4"
  - "4.0"
  - 4.0.21
  - 4-debian
  - 4-debian13
  - 4.0-debian
  - 4.0-debian13
  - 4.0.21-debian
  - 4.0.21-debian13
platforms:
  - linux/amd64
  - linux/arm64
dates:
  release: "2026-02-04"
vars:
  FLAVORED_SUFFIX: ""
  PACKAGE_NAME: kubescape-cli
  SEMVER_MAJOR_MINOR_VERSION: "4.0"
  SEMVER_MAJOR_VERSION: "4"
  SEMVER_VERSION: 4.0.21
  SUFFIX: ""
  VERSION: 4.0.21-2
contents:
  repositories:
    - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
  keyring:
    - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
  packages:
    - base-files
    - ca-certificates-bundle
    - kubescape-cli=4.0.21-2
    - tzdata
  builds:
    - name: kubescape-cli-sbom
      contents:
        repositories:
          - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
        keyring:
          - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
        packages:
          - bash
          - coreutils
      pipeline:
        - name: sbom
          uses: spdx@v1
          with:
            license: Apache-2.0
            name: kubescape-cli
            purl: pkg:dhi/kubescape@4.0.21
            version: 4.0.21
      outputs:
        - source: /opt/docker/sbom/kubescape-cli
          target: /opt/docker/sbom/kubescape-cli
          uid: 0
          gid: 0
accounts:
  run-as: nonroot
  users:
    - name: nonroot
      uid: 65532
      gid: 65532
  groups:
    - name: nonroot
      gid: 65532
      members:
        - nonroot
os-release:
  name: Docker Hardened Images (Debian)
  id: debian
  version-id: "13"
  version-codename: trixie
  pretty-name: Docker Hardened Images/Debian GNU/Linux 13 (trixie)
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
environment:
  CLIENT: image-release
  PATH: /usr/local/bin:/usr/bin:/bin
  RELEASE: v4.0.21
paths:
  - type: directory
    path: /usr/local/bin
    uid: 0
    gid: 0
  - type: symlink
    path: /usr/local/bin/kubescape
    uid: 0
    gid: 0
    source: /usr/bin/kubescape
annotations:
  org.opencontainers.image.description: A minimal Kubescape CLI image
  org.opencontainers.image.licenses: Apache-2.0
entrypoint:
  - kubescape
