# syntax=dhi.io/build:2-debian13

name: Kubescape CLI 4.x (dev)
image: dhi.io/kubescape-cli
variant: dev
tags:
  - 4-dev
  - 4.0-dev
  - 4.0.21-dev
  - 4-debian-dev
  - 4-debian13-dev
  - 4.0-debian-dev
  - 4.0-debian13-dev
  - 4.0.21-debian-dev
  - 4.0.21-debian13-dev
platforms:
  - linux/amd64
  - linux/arm64
dates:
  release: "2026-02-04"
vars:
  FLAVORED_SUFFIX: -dev
  PACKAGE_NAME: kubescape-cli
  SEMVER_MAJOR_MINOR_VERSION: "4.0"
  SEMVER_MAJOR_VERSION: "4"
  SEMVER_VERSION: 4.0.21
  SUFFIX: -dev
  VERSION: 4.0.21-1
contents:
  repositories:
    - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
  keyring:
    - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
  packages:
    - '!gawk'
    - '!libelogind0'
    - '!original-awk'
    - apt
    - base-files
    - bash
    - ca-certificates
    - ca-certificates-bundle
    - coreutils
    - diffutils
    - dpkg
    - findutils
    - grep
    - kubescape-cli-dev=4.0.21-1
    - libc-bin
    - mawk
    - perl-base
    - sed
    - tzdata
    - util-linux
  builds:
    - name: kubescape-cli-sbom
      contents:
        repositories:
          - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
        keyring:
          - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
        packages:
          - bash
          - coreutils
      pipeline:
        - name: sbom
          uses: spdx@v1
          with:
            license: Apache-2.0
            name: kubescape-cli
            purl: pkg:dhi/kubescape@4.0.21
            version: 4.0.21
      outputs:
        - source: /opt/docker/sbom/kubescape-cli
          target: /opt/docker/sbom/kubescape-cli
          uid: 0
          gid: 0
accounts:
  root: true
  run-as: root
  users:
    - name: nonroot
      uid: 65532
      gid: 65532
    - name: _apt
      uid: 42
      gid: 65532
  groups:
    - name: nonroot
      gid: 65532
      members:
        - nonroot
os-release:
  name: Docker Hardened Images (Debian)
  id: debian
  version-id: "13"
  version-codename: trixie
  pretty-name: Docker Hardened Images/Debian GNU/Linux 13 (trixie)
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
environment:
  CLIENT: image-release
  DEBIAN_FRONTEND: noninteractive
  PATH: /usr/local/bin:/usr/bin:/bin
  RELEASE: v4.0.21
paths:
  - type: directory
    path: /usr/local/bin
    uid: 0
    gid: 0
  - type: symlink
    path: /usr/local/bin/kubescape
    uid: 0
    gid: 0
    source: /usr/bin/kubescape
annotations:
  org.opencontainers.image.description: A minimal Kubescape CLI image
  org.opencontainers.image.licenses: Apache-2.0
entrypoint:
  - kubescape
