# syntax=dhi.io/build:2-debian13

name: KAI Scheduler Queue Controller 0.16.x (dev)
image: dhi.io/kai-scheduler-queuecontroller
variant: dev
tags:
  - 0.16-dev
  - 0.16.18-dev
  - 0.16-debian-dev
  - 0.16-debian13-dev
  - 0.16.18-debian-dev
  - 0.16.18-debian13-dev
platforms:
  - linux/amd64
  - linux/arm64
dates:
  release: "2026-06-24"
  end-of-life: "2027-06-24"
vars:
  FLAVORED_SUFFIX: -dev
  SEMVER_MAJOR_MINOR_VERSION: "0.16"
  SEMVER_MAJOR_VERSION: "0"
  SEMVER_VERSION: 0.16.18
  SUFFIX: -dev
  VERSION: 0.16.18-0
contents:
  repositories:
    - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
  keyring:
    - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
  packages:
    - '!gawk'
    - '!libelogind0'
    - '!original-awk'
    - apt
    - base-files
    - bash
    - ca-certificates
    - ca-certificates-bundle
    - coreutils
    - diffutils
    - dpkg
    - findutils
    - grep
    - kai-scheduler-queuecontroller-0.16-dev=0.16.18-0
    - libc-bin
    - mawk
    - perl-base
    - sed
    - tzdata
    - util-linux
  builds:
    - name: locale
      contents:
        packages:
          - bash
          - locales
          - coreutils
          - gzip
      pipeline:
        - name: install locales
          runs: |
            set -eux -o pipefail

            ln -s /etc/locale.alias /usr/share/locale/locale.alias

            echo "en_US.UTF-8 UTF-8" >> /etc/locale.gen
            locale-gen en_US.UTF-8
      outputs:
        - source: /usr/share/locale
          target: /usr/share/locale
          uid: 0
          gid: 0
        - source: /usr/lib/locale
          target: /usr/lib/locale
          uid: 0
          gid: 0
accounts:
  root: true
  run-as: root
  users:
    - name: nonroot
      uid: 65532
      gid: 65532
    - name: _apt
      uid: 42
      gid: 65532
  groups:
    - name: nonroot
      gid: 65532
      members:
        - nonroot
os-release:
  name: Docker Hardened Images (Debian)
  id: debian
  version-id: "13"
  version-codename: trixie
  pretty-name: Docker Hardened Images/Debian GNU/Linux 13 (trixie)
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
work-dir: /workspace
environment:
  DEBIAN_FRONTEND: noninteractive
  LANG: en_US.UTF-8
  LANGUAGE: en_US:en
  LC_ALL: en_US.UTF-8
paths:
  - type: directory
    path: /workspace
    uid: 0
    gid: 0
    mode: "0755"
  - type: symlink
    path: /workspace/app
    uid: 0
    gid: 0
    source: /usr/bin/kai-scheduler-queuecontroller
  - type: symlink
    path: /workspace/NOTICE
    uid: 0
    gid: 0
    source: /usr/share/licenses/kai-scheduler-queuecontroller/NOTICE
annotations:
  org.opencontainers.image.description: A minimal KAI Scheduler Queue Controller image
  org.opencontainers.image.licenses: Apache-2.0
entrypoint:
  - /workspace/app
ports:
  - 8080/tcp
  - 9443/tcp
