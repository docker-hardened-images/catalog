# syntax=dhi.io/build:2-debian13

name: Couchbase MCP Server 1.x
image: dhi.io/couchbase-mcp
variant: runtime
tags:
  - "1"
  - "1.0"
  - 1.0.0
  - 1-debian
  - 1-debian13
  - 1.0-debian
  - 1.0-debian13
  - 1.0.0-debian
  - 1.0.0-debian13
platforms:
  - linux/amd64
  - linux/arm64
dates:
  release: "2026-06-26"
vars:
  SEMVER_MAJOR_MINOR_VERSION: "1.0"
  SEMVER_MAJOR_VERSION: "1"
  SEMVER_VERSION: 1.0.0
  VERSION: 1.0.0-4
contents:
  repositories:
    - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
  keyring:
    - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
  packages:
    - '!libelogind0'
    - '!mawk'
    - '!original-awk'
    - base-files
    - ca-certificates
    - couchbase-mcp=1.0.0-4
    - libstdc++6
    - python-3.13
    - tzdata
  builds:
    - name: server.json
      contents:
        packages:
          - bash
          - sed
      pipeline:
        - runs: |
            set -eux -o pipefail

            sed -i "s/_VERSION_/1.0.0/g" "${source.dir}/config/server.json"
      paths:
        - type: file
          path: ${source.dir}/config/server.json
          uid: 0
          gid: 0
          source: image/couchbase-mcp/config/server.json
      attestations:
        - predicate-type: https://modelcontextprotocol.io/server.json/v1
          source: ${source.dir}/config/server.json
accounts:
  run-as: nonroot
  users:
    - name: nonroot
      uid: 65532
      gid: 65532
  groups:
    - name: nonroot
      gid: 65532
      members:
        - nonroot
os-release:
  name: Docker Hardened Images (Debian)
  id: debian
  version-id: "13"
  version-codename: trixie
  pretty-name: Docker Hardened Images/Debian GNU/Linux 13 (trixie)
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
environment:
  CB_MCP_READ_ONLY_MODE: "true"
paths:
  - type: directory
    path: /opt/venv/bin
    uid: 0
    gid: 0
  - type: symlink
    path: /opt/venv/bin/couchbase-mcp-server
    uid: 0
    gid: 0
    source: /opt/couchbase-mcp/bin/couchbase-mcp-server
annotations:
  org.opencontainers.image.description: A minimal Couchbase MCP Server image
  org.opencontainers.image.licenses: Apache-2.0
labels:
  io.modelcontextprotocol.server.name: io.github.couchbase/mcp-server-couchbase
entrypoint:
  - couchbase-mcp-server
ports:
  - 8000/tcp
