# syntax=dhi.io/build:2-alpine3.24

name: Couchbase MCP Server 1.x
image: dhi.io/couchbase-mcp
variant: runtime
tags:
  - 1-alpine
  - 1.0-alpine
  - 1-alpine3.24
  - 1.0.1-alpine
  - 1.0-alpine3.24
  - 1.0.1-alpine3.24
platforms:
  - linux/amd64
  - linux/arm64
dates:
  release: "2026-06-26"
vars:
  FLAVORED_SUFFIX: ""
  SEMVER_MAJOR_MINOR_VERSION: "1.0"
  SEMVER_MAJOR_VERSION: "1"
  SEMVER_VERSION: 1.0.1
  SUFFIX: ""
  VERSION: 1.0.1-r3
contents:
  repositories:
    - https://dhi.io/apk/alpine/v3.24/main
    - https://dl-cdn.alpinelinux.org/alpine/v3.24/main
    - https://dl-cdn.alpinelinux.org/alpine/v3.24/community
  keyring:
    - https://dhi.io/keyring/dhi-apk@docker-0F81AD7700D99184.rsa.pub
  packages:
    - alpine-baselayout-data
    - ca-certificates-bundle
    - couchbase-mcp=1.0.1-r3
    - libstdc++
    - python3
    - tzdata
  builds:
    - name: server.json
      contents:
        packages:
          - bash
          - sed
      pipeline:
        - runs: |
            set -eux -o pipefail

            sed -i "s/_VERSION_/1.0.1/g" "${source.dir}/config/server.json"
      paths:
        - type: file
          path: ${source.dir}/config/server.json
          uid: 0
          gid: 0
          source: image/couchbase-mcp/config/server.json
      attestations:
        - predicate-type: https://modelcontextprotocol.io/server.json/v1
          source: ${source.dir}/config/server.json
accounts:
  run-as: nonroot
  users:
    - name: nonroot
      uid: 65532
      gid: 65532
  groups:
    - name: nonroot
      gid: 65532
      members:
        - nonroot
os-release:
  name: Docker Hardened Images (Alpine)
  id: alpine
  version-id: "3.24"
  pretty-name: Docker Hardened Images/Alpine Linux v3.24
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
environment:
  CB_MCP_READ_ONLY_MODE: "true"
paths:
  - type: directory
    path: /opt/venv/bin
    uid: 0
    gid: 0
  - type: symlink
    path: /opt/venv/bin/couchbase-mcp-server
    uid: 0
    gid: 0
    source: /opt/couchbase-mcp/bin/couchbase-mcp-server
annotations:
  org.opencontainers.image.description: A minimal Couchbase MCP Server image
  org.opencontainers.image.licenses: Apache-2.0
labels:
  io.modelcontextprotocol.server.name: io.github.couchbase/mcp-server-couchbase
entrypoint:
  - couchbase-mcp-server
ports:
  - 8000/tcp
