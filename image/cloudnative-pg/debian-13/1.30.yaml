# syntax=dhi.io/build:2-debian13

name: CloudNativePG 1.30.x
image: dhi.io/cloudnative-pg
variant: runtime
tags:
  - "1"
  - "1.30"
  - 1.30.2
  - 1-debian
  - 1-debian13
  - 1.30-debian
  - 1.30-debian13
  - 1.30.2-debian
  - 1.30.2-debian13
platforms:
  - linux/amd64
  - linux/arm64
dates:
  release: "2026-06-29"
  end-of-life: "2027-03-31"
vars:
  FLAVORED_SUFFIX: ""
  SEMVER_MAJOR_MINOR_VERSION: "1.30"
  SEMVER_MAJOR_VERSION: "1"
  SEMVER_VERSION: 1.30.2
  SUFFIX: ""
  VERSION: 1.30.2-1
contents:
  repositories:
    - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
  keyring:
    - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
  packages:
    - base-files
    - ca-certificates-bundle
    - cloudnative-pg-1.30=1.30.2-1
    - tzdata
accounts:
  run-as: nonroot
  users:
    - name: nonroot
      uid: 65532
      gid: 65532
  groups:
    - name: nonroot
      gid: 65532
      members:
        - nonroot
os-release:
  name: Docker Hardened Images (Debian)
  id: debian
  version-id: "13"
  version-codename: trixie
  pretty-name: Docker Hardened Images/Debian GNU/Linux 13 (trixie)
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
paths:
  - type: symlink
    path: /manager
    uid: 0
    gid: 0
    source: /operator/manager_${target.arch}
annotations:
  org.opencontainers.image.description: A minimal CloudNativePG operator image
  org.opencontainers.image.licenses: Apache-2.0
entrypoint:
  - /manager
