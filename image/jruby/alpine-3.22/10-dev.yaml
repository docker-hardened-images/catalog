# syntax=dhi.io/build:2-alpine3.22

name: JRuby 10.x (dev)
image: dhi.io/jruby
variant: dev
tags:
  - 10-alpine3.22-dev
  - 10.1-alpine3.22-dev
  - 10.1.3-alpine3.22-dev
platforms:
  - linux/amd64
  - linux/arm64
vars:
  ARCH: '#{ target.arch == "amd64" ? "x64" : "aarch64" }'
  COMMIT_SHA: 3db52d02f9dadc9d055df08648d0659dd6939dc0
  JRE_REF: dhi/eclipse-temurin:21.0.13.9-alpine3.22@sha256:f7cfc8a8fc4bfd45be683541f01173969ab67b55b8f8dc80c788c11fe08a89c8
  JRE_VERSION: 21.0.13.9
  MAVEN_REF: dhi/maven:3.10.0-jdk21-alpine3.22-dev@sha256:3bac77dee8baa26b6e31fcab06268c8d12a22520a142c1f890649514e1c7fa8f
  SEMVER_MAJOR_MINOR_VERSION: "10.1"
  SEMVER_MAJOR_VERSION: "10"
  SEMVER_VERSION: 10.1.3
  VERSION: 10.1.3.0
contents:
  repositories:
    - https://dl-cdn.alpinelinux.org/alpine/v3.22/main
    - https://dl-cdn.alpinelinux.org/alpine/v3.22/community
  packages:
    - alpine-baselayout-data
    - apk-tools
    - bash
    - build-base
    - busybox
    - ca-certificates-bundle
    - coreutils
    - gcc
    - git
    - libffi-dev
    - make
    - musl-dev
    - tzdata
    - yaml-dev
  builds:
    - name: jruby
      uses: dhi.io/maven:3.10.0-jdk21-alpine3.22-dev@sha256:3bac77dee8baa26b6e31fcab06268c8d12a22520a142c1f890649514e1c7fa8f
      environment:
        JRE_TRUST_STORE: ${JRE_TRUST_STORE}
      contents:
        repositories:
          - https://dl-cdn.alpinelinux.org/alpine/v3.22/main
          - https://dl-cdn.alpinelinux.org/alpine/v3.22/community
        packages:
          - bash
        files:
          - url: git+https://github.com/jruby/jruby.git#10.1.3.0
            checksum: 3db52d02f9dadc9d055df08648d0659dd6939dc0
            path: ${source.dir}/jruby
            spdx:
              name: jruby
              version: 10.1.3.0
              packages:
                - name: jruby
                  purl: pkg:dhi/jruby@10.1.3.0
                  license: EPL-2.0 and GPL-2.0 and LGPL-2.1
            uid: 0
            gid: 0
      pipeline:
        - name: patch jruby stdlibs
          work-dir: ${source.dir}/jruby/lib
          privileged: true
          runs: |
            set -eux -o pipefail

            # update rexml for CVE-2025-58767
            ${source.dir}/patches/patch.sh rexml 3.4.4

            # update cgi for CVE-2025-27221 and CVE-2025-27220
            ${source.dir}/patches/patch.sh cgi 0.4.2

            # update json for CVE-2026-33210, CVE-2026-54696
            ${source.dir}/patches/patch.sh json 2.19.9

            # update uri for CVE-2025-61594
            ${source.dir}/patches/patch.sh uri 1.0.4

            # update jruby-openssl for CVE-2026-0636, CVE-2026-5588, CVE-2026-8763, CVE-2026-13506
            ${source.dir}/patches/patch.sh jruby-openssl 0.16.3

            # update net-imap for CVE-2026-42246, CVE-2026-42258, CVE-2026-42257, CVE-2026-42256, CVE-2026-42245, CVE-2026-47240, CVE-2026-47241, CVE-2026-47242
            # update erb for CVE-2026-41316
            # erb 6.x requires Ruby 3.4+, so JRuby 9.x (Ruby 3.1) takes erb 4.0.3.1
            # net-imap 0.5.15+ required for CVE-2026-47240, CVE-2026-47241, CVE-2026-47242 (command injection)
            if [ "10" = "9" ]; then
              ${source.dir}/patches/patch.sh net-imap 0.5.15
              ${source.dir}/patches/patch.sh erb 4.0.3.1
            else
              ${source.dir}/patches/patch.sh net-imap 0.6.4.1
              ${source.dir}/patches/patch.sh erb 6.0.1.1
            fi
        - uses: mvn/mirror@v1
        - name: install jruby
          work-dir: ${source.dir}/jruby
          privileged: true
          secrets:
            - id: maven_user
              env: MAVEN_USER
              optional: true
            - id: maven_password
              env: MAVEN_PASSWORD
              optional: true
          runs: |
            set -eux -o pipefail

            # Set platform-specific Maven properties
            if [ "${ARCH}" = "aarch64" ]; then
              export MAVEN_OPTS="-Dos.arch=aarch64 -Dos.name=Linux -Dos.version=arm64"
              export JAVA_OPTS="-Dos.arch=aarch64"
            fi

            mvn
        - name: Add lib and etc
          work-dir: ${source.dir}/jruby
          runs: |
            set -eux -o pipefail

            mkdir -p ${target.dir}/opt/jruby/etc/
            echo 'install: --no-document' >> ${target.dir}/opt/jruby/etc/gemrc
            echo 'update: --no-document' >> ${target.dir}/opt/jruby/etc/gemrc

            cp -r lib ${target.dir}/opt/jruby
        - name: add all dev binaries
          work-dir: ${source.dir}/jruby/bin
          runs: |
            set -eux -o pipefail

            install -D -m 755 -t ${target.dir}/opt/jruby/bin *
      paths:
        - type: file
          path: ${source.dir}/patches/patch.sh
          uid: 0
          gid: 0
          mode: "0777"
          source: image/jruby/patch/patch.sh
      outputs:
        - source: ${target.dir}/opt/jruby
          target: /opt/jruby
          uid: 0
          gid: 0
        - source: /opt/docker/sbom/jruby
          target: /opt/docker/sbom/jruby
          uid: 0
          gid: 0
  artifacts:
    - name: dhi.io/eclipse-temurin:21.0.13.9-alpine3.22@sha256:f7cfc8a8fc4bfd45be683541f01173969ab67b55b8f8dc80c788c11fe08a89c8
      includes:
        - opt/**
        - usr/local/bin/**
      uid: 0
      gid: 0
accounts:
  root: true
  run-as: root
  users:
    - name: nonroot
      uid: 65532
      gid: 65532
  groups:
    - name: nonroot
      gid: 65532
      members:
        - nonroot
os-release:
  name: Docker Hardened Images (Alpine)
  id: alpine
  version-id: "3.22"
  pretty-name: Docker Hardened Images/Alpine Linux v3.22
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
environment:
  DEBIAN_FRONTEND: noninteractive
  LD_LIBRARY_PATH: /usr/local/lib:${LD_LIBRARY_PATH}
  PATH: /opt/jruby/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
  SSL_CERT_FILE: /etc/ssl/certs/ca-certificates.crt
annotations:
  org.opencontainers.image.description: A minimal JRuby image
  org.opencontainers.image.licenses: EPL-2.0 and GPL-2.0 and LGPL-2.1
cmd:
  - /bin/bash
