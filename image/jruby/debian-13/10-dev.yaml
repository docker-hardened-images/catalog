# syntax=dhi.io/build:2-debian13

name: JRuby 10.x (dev)
image: dhi.io/jruby
variant: dev
tags:
  - 10-dev
  - 10.1-dev
  - 10.1.3-dev
  - 10-debian-dev
  - 10-debian13-dev
  - 10.1-debian-dev
  - 10.1-debian13-dev
  - 10.1.3-debian-dev
  - 10.1.3-debian13-dev
platforms:
  - linux/amd64
  - linux/arm64
vars:
  ARCH: '#{ target.arch == "amd64" ? "x64" : "aarch64" }'
  BINUTILS_ARCH: '#{ target.arch == "amd64" ? "x86-64" : "aarch64" }'
  COMMIT_SHA: 3db52d02f9dadc9d055df08648d0659dd6939dc0
  JAVA_FIPS_SUFFIX: ""
  JAVA_VARIANT: jdk
  JDK_MAJOR_VERSION: "21"
  MAVEN_REF: dhi/maven:3.10.0-jdk21-debian13-dev@sha256:80dc893830d1c2999d21e14933c209b53a9a7b9d13d31e057ad2392c66a9ff7d
  SEMVER_MAJOR_MINOR_VERSION: "10.1"
  SEMVER_MAJOR_VERSION: "10"
  SEMVER_VERSION: 10.1.3
  VERSION: 10.1.3.0
contents:
  repositories:
    - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
  keyring:
    - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
  packages:
    - '!binutils'
    - '!binutils-aarch64-linux-gnu'
    - '!binutils-common'
    - '!binutils-x86-64-linux-gnu'
    - '!gawk'
    - '!libbinutils'
    - '!libctf-nobfd0'
    - '!libctf0'
    - '!libelogind0'
    - '!libgprofng0'
    - '!libsframe1'
    - '!make-guile'
    - '!mawk'
    - '!original-awk'
    - apt
    - base-files
    - bash
    - binutils-latest
    - binutils-latest-${BINUTILS_ARCH}-linux-gnu
    - build-essential
    - coreutils
    - diffutils
    - dpkg
    - eclipse-temurin-21-jdk
    - eclipse-temurin-21-jdk-oci-config
    - findutils
    - git
    - grep
    - libc-bin
    - libctf-nobfd0-latest
    - libctf0-latest
    - libexpat1
    - libgprofng0-latest
    - libyaml-dev
    - make
    - mawk
    - perl-base
    - sed
    - tzdata
    - util-linux
  builds:
    - name: jruby
      environment:
        JAVA_HOME: /usr/lib/jvm/temurin-21
        JRE_TRUST_STORE: ${JRE_TRUST_STORE}
      contents:
        packages:
          - bash
          - ca-certificates
          - coreutils
          - eclipse-temurin-21-jdk
          - findutils
          - grep
          - gzip
          - sed
          - tar
        files:
          - url: git+https://github.com/jruby/jruby.git#10.1.3.0
            checksum: 3db52d02f9dadc9d055df08648d0659dd6939dc0
            path: ${source.dir}/jruby
            spdx:
              name: jruby
              version: 10.1.3.0
              packages:
                - name: jruby
                  purl: pkg:dhi/jruby@10.1.3.0
                  license: EPL-2.0 and GPL-2.0 and LGPL-2.1
            uid: 0
            gid: 0
        artifacts:
          - name: dhi.io/maven:3.10.0-jdk21-debian13-dev@sha256:80dc893830d1c2999d21e14933c209b53a9a7b9d13d31e057ad2392c66a9ff7d
            includes:
              - opt/**
              - usr/local/bin/**
            uid: 0
            gid: 0
      pipeline:
        - name: patch jruby stdlibs
          work-dir: ${source.dir}/jruby/lib
          privileged: true
          runs: |
            set -eux -o pipefail

            # update rexml for CVE-2025-58767
            ${source.dir}/patches/patch.sh rexml 3.4.4

            # update cgi for CVE-2025-27221 and CVE-2025-27220
            ${source.dir}/patches/patch.sh cgi 0.4.2

            # update json for CVE-2026-33210, CVE-2026-54696
            ${source.dir}/patches/patch.sh json 2.19.9

            # update uri for CVE-2025-61594
            ${source.dir}/patches/patch.sh uri 1.0.4

            # update jruby-openssl for CVE-2026-0636, CVE-2026-5588, CVE-2026-8763, CVE-2026-13506
            ${source.dir}/patches/patch.sh jruby-openssl 0.16.3

            # update net-imap for CVE-2026-42246, CVE-2026-42258, CVE-2026-42257, CVE-2026-42256, CVE-2026-42245, CVE-2026-47240, CVE-2026-47241, CVE-2026-47242
            # update erb for CVE-2026-41316
            # erb 6.x requires Ruby 3.4+, so JRuby 9.x (Ruby 3.1) takes erb 4.0.3.1
            # net-imap 0.5.15+ required for CVE-2026-47240, CVE-2026-47241, CVE-2026-47242 (command injection)
            if [ "10" = "9" ]; then
              ${source.dir}/patches/patch.sh net-imap 0.5.15
              ${source.dir}/patches/patch.sh erb 4.0.3.1
            else
              ${source.dir}/patches/patch.sh net-imap 0.6.4.1
              ${source.dir}/patches/patch.sh erb 6.0.1.1
            fi
        - uses: mvn/mirror@v1
        - name: install jruby
          work-dir: ${source.dir}/jruby
          privileged: true
          secrets:
            - id: maven_user
              env: MAVEN_USER
              optional: true
            - id: maven_password
              env: MAVEN_PASSWORD
              optional: true
          runs: |
            set -eux -o pipefail

            # Set platform-specific Maven properties
            if [ "${ARCH}" = "aarch64" ]; then
              export MAVEN_OPTS="-Dos.arch=aarch64 -Dos.name=Linux -Dos.version=arm64"
              export JAVA_OPTS="-Dos.arch=aarch64"
            fi

            mvn
        - name: Add lib and etc
          work-dir: ${source.dir}/jruby
          runs: |
            set -eux -o pipefail

            mkdir -p ${target.dir}/opt/jruby/etc/
            echo 'install: --no-document' >> ${target.dir}/opt/jruby/etc/gemrc
            echo 'update: --no-document' >> ${target.dir}/opt/jruby/etc/gemrc

            cp -r lib ${target.dir}/opt/jruby
        - name: add all dev binaries
          work-dir: ${source.dir}/jruby/bin
          runs: |
            set -eux -o pipefail

            install -D -m 755 -t ${target.dir}/opt/jruby/bin *
      paths:
        - type: file
          path: ${source.dir}/patches/patch.sh
          uid: 0
          gid: 0
          mode: "0777"
          source: image/jruby/patch/patch.sh
      outputs:
        - source: ${target.dir}/opt/jruby
          target: /opt/jruby
          uid: 0
          gid: 0
        - source: /opt/docker/sbom/jruby
          target: /opt/docker/sbom/jruby
          uid: 0
          gid: 0
    - name: locale
      contents:
        packages:
          - bash
          - locales
          - coreutils
          - gzip
      pipeline:
        - name: install locales
          runs: |
            set -eux -o pipefail

            ln -s /etc/locale.alias /usr/share/locale/locale.alias

            echo "en_US.UTF-8 UTF-8" >> /etc/locale.gen
            locale-gen en_US.UTF-8
      outputs:
        - source: /usr/share/locale
          target: /usr/share/locale
          uid: 0
          gid: 0
        - source: /usr/lib/locale
          target: /usr/lib/locale
          uid: 0
          gid: 0
  artifacts:
    - name: dhi.io/maven:3.10.0-jdk21-debian13-dev@sha256:80dc893830d1c2999d21e14933c209b53a9a7b9d13d31e057ad2392c66a9ff7d
      includes:
        - opt/**
        - usr/local/bin/**
      uid: 0
      gid: 0
accounts:
  root: true
  run-as: root
  users:
    - name: nonroot
      uid: 65532
      gid: 65532
    - name: _apt
      uid: 42
      gid: 65532
  groups:
    - name: nonroot
      gid: 65532
      members:
        - nonroot
os-release:
  name: Docker Hardened Images (Debian)
  id: debian
  version-id: "13"
  version-codename: trixie
  pretty-name: Docker Hardened Images/Debian GNU/Linux 13 (trixie)
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
environment:
  DEBIAN_FRONTEND: noninteractive
  LANG: en_US.UTF-8
  LANGUAGE: en_US:en
  LC_ALL: en_US.UTF-8
  LD_LIBRARY_PATH: /usr/local/lib:${LD_LIBRARY_PATH}
  PATH: /opt/jruby/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
  SSL_CERT_FILE: /etc/ssl/certs/ca-certificates.crt
annotations:
  org.opencontainers.image.description: A minimal JRuby image
  org.opencontainers.image.licenses: EPL-2.0 and GPL-2.0 and LGPL-2.1
cmd:
  - /bin/bash
