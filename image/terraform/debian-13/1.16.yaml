# syntax=dhi.io/build:2-debian13

name: Terraform 1.16.x
image: dhi.io/terraform
variant: runtime
tags:
  - "1"
  - "1.16"
  - 1.16.1
  - 1-debian
  - 1-debian13
  - 1.16-debian
  - 1.16-debian13
  - 1.16.1-debian
  - 1.16.1-debian13
platforms:
  - linux/amd64
  - linux/arm64
dates:
  release: "2026-08-26"
vars:
  COMMIT_SHA: 58e916f6706597d9d87898f9ecedf811b68c6f29
  SEMVER_MAJOR_MINOR_VERSION: "1.16"
  SEMVER_MAJOR_VERSION: "1"
  SEMVER_VERSION: 1.16.1
  VERSION: 1.16.1
contents:
  repositories:
    - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
  keyring:
    - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
  packages:
    - '!libelogind0'
    - '!mawk'
    - '!original-awk'
    - base-files
    - ca-certificates-bundle
    - git
    - tzdata
  builds:
    - name: terraform
      work-dir: /go/src/github.com/hashicorp/terraform
      caches:
        - path: /go/pkg/mod
      contents:
        packages:
          - bash
          - ca-certificates-bundle
          - coreutils
          - diffutils
          - golang-1.26
          - findutils
          - git
          - mawk
          - sed
        files:
          - url: git+https://github.com/hashicorp/terraform.git#v1.16.1
            checksum: 58e916f6706597d9d87898f9ecedf811b68c6f29
            path: /go/src/github.com/hashicorp/terraform
            spdx:
              name: terraform
              version: 1.16.1
              packages:
                - name: terraform
                  purl: pkg:golang/github.com/hashicorp/terraform@v1.16.1
                  license: BUSL-1.1
            uid: 65532
            gid: 65532
      pipeline:
        - name: update go dependencies (1.16 only)
          uses: go/bump@v2
          with:
            deps:
              - golang.org/x/crypto@v0.56.0
              - google.golang.org/grpc@v1.83.2
            download: true
        - runs: |
            set -eux -o pipefail

            install -d -o nonroot -g nonroot -m 0755 /go/pkg/mod/cache/download
            chown -R nonroot:nonroot /go/pkg/mod
        - name: run tests
          run-as: nonroot
          privileged: true
          runs: |
            set -eux -o pipefail

            if [ "1.16" = "1.13" ]; then
              go test -vet=off -timeout 30m ./... -skip '^TestTelemetryInTests$'
            else
              go test -vet=off -timeout 30m ./...
            fi
        - runs: |
            set -eux -o pipefail

            install -d -o nonroot -g nonroot -m 0755 /go/pkg/mod/cache/download
            chown -R nonroot:nonroot /go/pkg/mod
        - name: build
          uses: go/build@v1
          run-as: nonroot
          with:
            ldflags:
              - -X github.com/hashicorp/terraform/version.dev=no
            output: ./terraform
      accounts:
        root: true
        run-as: root
        users:
          - name: nonroot
            uid: 65532
            gid: 65532
        groups:
          - name: nonroot
            gid: 65532
            members:
              - nonroot
      outputs:
        - source: /go/src/github.com/hashicorp/terraform/terraform
          target: /usr/local/bin/terraform
          uid: 0
          gid: 0
        - source: /opt/docker/sbom/terraform
          target: /opt/docker/sbom/terraform
          uid: 0
          gid: 0
accounts:
  run-as: nonroot
  users:
    - name: nonroot
      uid: 65532
      gid: 65532
  groups:
    - name: nonroot
      gid: 65532
      members:
        - nonroot
os-release:
  name: Docker Hardened Images (Debian)
  id: debian
  version-id: "13"
  version-codename: trixie
  pretty-name: Docker Hardened Images/Debian GNU/Linux 13 (trixie)
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
annotations:
  org.opencontainers.image.description: A minimal Terraform image
  org.opencontainers.image.licenses: BUSL-1.1
entrypoint:
  - /usr/local/bin/terraform
