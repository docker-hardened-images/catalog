# syntax=dhi.io/build:2-debian13

name: Apollo MCP Server 1.x
image: dhi.io/apollo-mcp-server
variant: runtime
tags:
  - "1"
  - "1.20"
  - 1.20.0
  - 1-debian
  - 1-debian13
  - 1.20-debian
  - 1.20-debian13
  - 1.20.0-debian
  - 1.20.0-debian13
platforms:
  - linux/amd64
  - linux/arm64
dates:
  release: "2025-10-02"
vars:
  SEMVER_MAJOR_MINOR_VERSION: "1.20"
  SEMVER_MAJOR_VERSION: "1"
  SEMVER_VERSION: 1.20.0
  VERSION: 1.20.0-0
contents:
  repositories:
    - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
  keyring:
    - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
  packages:
    - '!libelogind0'
    - '!mawk'
    - '!original-awk'
    - apollo-mcp-server=1.20.0-0
    - base-files
    - ca-certificates-bundle
    - libc6
    - libgcc-s1
    - libssl3t64
    - tzdata
  builds:
    - name: server.json
      contents:
        packages:
          - bash
          - sed
      pipeline:
        - runs: |
            set -eux -o pipefail

            sed -i "s/_VERSION_/1.20.0/g" "${source.dir}/config/server.json"
      paths:
        - type: file
          path: ${source.dir}/config/server.json
          uid: 0
          gid: 0
          source: image/apollo-mcp-server/config/server.json
      attestations:
        - predicate-type: https://modelcontextprotocol.io/server.json/v1
          source: ${source.dir}/config/server.json
accounts:
  run-as: nonroot
  users:
    - name: nonroot
      uid: 65532
      gid: 65532
  groups:
    - name: nonroot
      gid: 65532
      members:
        - nonroot
os-release:
  name: Docker Hardened Images (Debian)
  id: debian
  version-id: "13"
  version-codename: trixie
  pretty-name: Docker Hardened Images/Debian GNU/Linux 13 (trixie)
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
work-dir: /data
environment:
  APOLLO_MCP_TRANSPORT__ADDRESS: 0.0.0.0
  APOLLO_MCP_TRANSPORT__TYPE: streamable_http
  SSL_CERT_FILE: /etc/ssl/certs/ca-certificates.crt
paths:
  - type: directory
    path: /usr/local/bin
    uid: 0
    gid: 0
  - type: symlink
    path: /usr/local/bin/apollo-mcp-server
    uid: 0
    gid: 0
    source: /usr/bin/apollo-mcp-server
  - type: directory
    path: /data
    uid: 0
    gid: 0
    mode: "0755"
annotations:
  org.opencontainers.image.description: A minimal Apollo MCP Server image
  org.opencontainers.image.licenses: MIT
labels:
  io.modelcontextprotocol.server.name: io.github.apollographql/apollo-mcp-server
entrypoint:
  - /usr/local/bin/apollo-mcp-server
cmd:
  - /dev/null
ports:
  - 8000/tcp
