# syntax=dhi.io/build:2-debian13

name: Filebeat 8.19.x
image: dhi.io/filebeat
variant: runtime
tags:
  - "8"
  - "8.19"
  - 8.19.20
  - 8-debian
  - 8-debian13
  - 8.19-debian
  - 8.19-debian13
  - 8.19.20-debian
  - 8.19.20-debian13
platforms:
  - linux/amd64
  - linux/arm64
dates:
  release: "2025-07-23"
  end-of-life: "2027-07-15"
vars:
  FLAVORED_SUFFIX: ""
  PACKAGE_NAME: filebeat-8.19
  SEMVER_MAJOR_MINOR_VERSION: "8.19"
  SEMVER_MAJOR_VERSION: "8"
  SEMVER_VERSION: 8.19.20
  SUFFIX: ""
  VERSION: 8.19.20-1
contents:
  repositories:
    - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
    - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
  keyring:
    - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
    - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
  packages:
    - '!libelogind0'
    - '!mawk'
    - '!original-awk'
    - base-files
    - ca-certificates-bundle
    - filebeat-8.19=8.19.20-1
    - tzdata
accounts:
  run-as: nonroot
  users:
    - name: nonroot
      uid: 1000
      gid: 1000
  groups:
    - name: nonroot
      gid: 1000
      members:
        - nonroot
os-release:
  name: Docker Hardened Images (Debian)
  id: debian
  version-id: "13"
  version-codename: trixie
  pretty-name: Docker Hardened Images/Debian GNU/Linux 13 (trixie)
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
work-dir: /usr/share/filebeat
environment:
  ELASTIC_CONTAINER: "true"
  PATH: /usr/share/filebeat:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
paths:
  - type: directory
    path: /usr/local/bin
    uid: 0
    gid: 0
  - type: symlink
    path: /usr/local/bin/filebeat
    uid: 0
    gid: 0
    source: /usr/bin/filebeat
  - type: directory
    path: /usr/share/filebeat/logs
    uid: 1000
    gid: 1000
    mode: "0755"
  - type: directory
    path: /usr/share/filebeat/data
    uid: 1000
    gid: 1000
    mode: "0755"
annotations:
  org.opencontainers.image.description: A minimal Filebeat image
  org.opencontainers.image.licenses: Elastic-2.0
entrypoint:
  - filebeat
cmd:
  - -E
  - http.enabled=true
  - -E
  - http.host=unix:///usr/share/filebeat/data/filebeat.sock
