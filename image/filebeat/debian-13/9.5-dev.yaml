# syntax=dhi.io/build:2-debian13

name: Filebeat 9.5.x (dev)
image: dhi.io/filebeat
variant: dev
tags:
  - 9-dev
  - 9.5-dev
  - 9.5.2-dev
  - 9-debian-dev
  - 9-debian13-dev
  - 9.5-debian-dev
  - 9.5-debian13-dev
  - 9.5.2-debian-dev
  - 9.5.2-debian13-dev
platforms:
  - linux/amd64
  - linux/arm64
dates:
  release: "2026-07-29"
vars:
  FLAVORED_SUFFIX: -dev
  PACKAGE_NAME: filebeat-9.5
  SEMVER_MAJOR_MINOR_VERSION: "9.5"
  SEMVER_MAJOR_VERSION: "9"
  SEMVER_VERSION: 9.5.2
  SUFFIX: -dev
  VERSION: 9.5.2-1
contents:
  repositories:
    - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
    - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
  keyring:
    - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
    - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
  packages:
    - '!gawk'
    - '!libelogind0'
    - '!mawk'
    - '!original-awk'
    - apt
    - base-files
    - bash
    - ca-certificates
    - ca-certificates-bundle
    - coreutils
    - diffutils
    - dpkg
    - filebeat-9.5-dev=9.5.2-1
    - findutils
    - grep
    - libc-bin
    - mawk
    - perl-base
    - sed
    - tzdata
    - util-linux
accounts:
  root: true
  run-as: root
  users:
    - name: nonroot
      uid: 1000
      gid: 1000
    - name: nonroot
      uid: 1000
      gid: 1000
    - name: _apt
      uid: 42
      gid: 65532
  groups:
    - name: nonroot
      gid: 1000
      members:
        - nonroot
    - name: nonroot
      gid: 1000
      members:
        - nonroot
os-release:
  name: Docker Hardened Images (Debian)
  id: debian
  version-id: "13"
  version-codename: trixie
  pretty-name: Docker Hardened Images/Debian GNU/Linux 13 (trixie)
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
work-dir: /usr/share/filebeat
environment:
  DEBIAN_FRONTEND: noninteractive
  ELASTIC_CONTAINER: "true"
  PATH: /usr/share/filebeat:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
paths:
  - type: directory
    path: /usr/local/bin
    uid: 0
    gid: 0
  - type: symlink
    path: /usr/local/bin/filebeat
    uid: 0
    gid: 0
    source: /usr/bin/filebeat
  - type: directory
    path: /usr/share/filebeat/logs
    uid: 1000
    gid: 1000
    mode: "0755"
  - type: directory
    path: /usr/share/filebeat/data
    uid: 1000
    gid: 1000
    mode: "0755"
annotations:
  org.opencontainers.image.description: A minimal Filebeat image
  org.opencontainers.image.licenses: Elastic-2.0
entrypoint:
  - filebeat
cmd:
  - -E
  - http.enabled=true
  - -E
  - http.host=unix:///usr/share/filebeat/data/filebeat.sock
