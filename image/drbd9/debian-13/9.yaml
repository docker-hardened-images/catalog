# syntax=dhi.io/build:2-debian13

name: drbd9 9.x
image: dhi.io/drbd9
variant: runtime
tags:
  - "9"
  - "9.3"
  - 9.3.3
  - 9-debian
  - 9-debian13
  - 9.3-debian
  - 9.3-debian13
  - 9.3.3-debian
  - 9.3.3-debian13
platforms:
  - linux/amd64
  - linux/arm64
dates:
  release: "2015-06-16"
vars:
  SEMVER_MAJOR_MINOR_VERSION: "9.3"
  SEMVER_MAJOR_VERSION: "9"
  SEMVER_VERSION: 9.3.3
  VERSION: 9.3.3-2
contents:
  repositories:
    - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
  keyring:
    - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
  packages:
    - '!binutils'
    - '!binutils-aarch64-linux-gnu'
    - '!binutils-common'
    - '!binutils-x86-64-linux-gnu'
    - '!libbinutils'
    - '!libctf-nobfd0'
    - '!libctf0'
    - '!libgprofng0'
    - '!libsframe1'
    - base-files
    - bash
    - binutils-latest
    - ca-certificates-bundle
    - coreutils
    - curl
    - diffutils
    - drbd9=9.3.3-2
    - elfutils
    - findutils
    - gcc
    - gcc-13
    - gnu-which
    - gnupg
    - grep
    - gzip
    - kmod
    - libc-bin
    - libc6-dev
    - libstdc++6
    - make
    - mawk
    - patch
    - perl
    - perl-base
    - python-3.14
    - python-3.14-dev
    - sed
    - tar
    - tzdata
    - util-linux
accounts:
  root: true
  run-as: root
  users:
    - name: nonroot
      uid: 65532
      gid: 65532
  groups:
    - name: nonroot
      gid: 65532
      members:
        - nonroot
os-release:
  name: Docker Hardened Images (Debian)
  id: debian
  version-id: "13"
  version-codename: trixie
  pretty-name: Docker Hardened Images/Debian GNU/Linux 13 (trixie)
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
environment:
  LB_HOW: compile
  PYTHONPATH: /opt/lbdist
paths:
  - type: directory
    path: /pkgs
    uid: 0
    gid: 0
    mode: "0755"
  - type: symlink
    path: /entry.sh
    uid: 0
    gid: 0
    source: /usr/lib/drbd9/entry.sh
  - type: symlink
    path: /drbd.tar.gz
    uid: 0
    gid: 0
    source: /usr/share/drbd9/drbd.tar.gz
  - type: symlink
    path: /opt/lbdist
    uid: 0
    gid: 0
    source: /usr/lib/drbd9/lbdist
annotations:
  org.opencontainers.image.description: A minimal drbd9 image
  org.opencontainers.image.licenses: GPL-2.0
entrypoint:
  - /entry.sh
