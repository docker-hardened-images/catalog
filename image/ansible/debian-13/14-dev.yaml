# syntax=dhi.io/build:2-debian13

name: Ansible 14.x (dev)
image: dhi.io/ansible
variant: dev
tags:
  - 14-dev
  - 14.5-dev
  - 14.5.0-dev
  - 14-debian-dev
  - 14-debian13-dev
  - 14.5-debian-dev
  - 14.5-debian13-dev
  - 14.5.0-debian-dev
  - 14.5.0-debian13-dev
platforms:
  - linux/amd64
  - linux/arm64
dates:
  release: "2026-06-02"
vars:
  SEMVER_MAJOR_MINOR_VERSION: "14.5"
  SEMVER_MAJOR_VERSION: "14"
  SEMVER_VERSION: 14.5.0
  VERSION: 14.5.0-0
contents:
  repositories:
    - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
  keyring:
    - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
  packages:
    - '!gawk'
    - '!libelogind0'
    - '!mawk'
    - '!original-awk'
    - ansible-14=14.5.0-0
    - apt
    - base-files
    - bash
    - ca-certificates
    - ca-certificates-bundle
    - coreutils
    - diffutils
    - dpkg
    - findutils
    - git
    - grep
    - libc-bin
    - libffi8
    - libpython-3.13-stdlib
    - libssl3t64
    - mawk
    - openssh-client
    - perl-base
    - python-3.13-minimal
    - sed
    - tzdata
    - util-linux
  builds:
    - name: locale
      contents:
        packages:
          - bash
          - locales
          - coreutils
          - gzip
      pipeline:
        - name: install locales
          runs: |
            set -eux -o pipefail

            ln -s /etc/locale.alias /usr/share/locale/locale.alias

            echo "en_US.UTF-8 UTF-8" >> /etc/locale.gen
            locale-gen en_US.UTF-8
      outputs:
        - source: /usr/share/locale
          target: /usr/share/locale
          uid: 0
          gid: 0
        - source: /usr/lib/locale
          target: /usr/lib/locale
          uid: 0
          gid: 0
accounts:
  root: true
  run-as: root
  users:
    - name: nonroot
      uid: 65532
      gid: 65532
    - name: _apt
      uid: 42
      gid: 65532
  groups:
    - name: nonroot
      gid: 65532
      members:
        - nonroot
os-release:
  name: Docker Hardened Images (Debian)
  id: debian
  version-id: "13"
  version-codename: trixie
  pretty-name: Docker Hardened Images/Debian GNU/Linux 13 (trixie)
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
work-dir: /work
environment:
  ANSIBLE_HOME: /home/nonroot/.ansible
  ANSIBLE_LOCAL_TEMP: /home/nonroot/.ansible/tmp
  DEBIAN_FRONTEND: noninteractive
  HOME: /home/nonroot
  LANG: en_US.UTF-8
  LANGUAGE: en_US:en
  LC_ALL: en_US.UTF-8
paths:
  - type: directory
    path: /home/nonroot
    uid: 65532
    gid: 65532
    mode: "0755"
  - type: directory
    path: /home/nonroot/.ansible
    uid: 65532
    gid: 65532
    mode: "0770"
  - type: directory
    path: /home/nonroot/.ansible/tmp
    uid: 65532
    gid: 65532
    mode: "0770"
  - type: directory
    path: /home/nonroot/.ssh
    uid: 65532
    gid: 65532
    mode: "0700"
  - type: directory
    path: /work
    uid: 65532
    gid: 65532
    mode: "0770"
annotations:
  org.opencontainers.image.description: A minimal Ansible image
  org.opencontainers.image.licenses: GPL-3.0-or-later
cmd:
  - ansible
  - --version
