# syntax=dhi.io/build:2-alpine3.24

name: Ansible 14.x (dev)
image: dhi.io/ansible
variant: dev
tags:
  - 14-alpine-dev
  - 14.5-alpine-dev
  - 14-alpine3.24-dev
  - 14.5.0-alpine-dev
  - 14.5-alpine3.24-dev
  - 14.5.0-alpine3.24-dev
platforms:
  - linux/amd64
  - linux/arm64
dates:
  release: "2026-06-02"
vars:
  SEMVER_MAJOR_MINOR_VERSION: "14.5"
  SEMVER_MAJOR_VERSION: "14"
  SEMVER_VERSION: 14.5.0
  VERSION: 14.5.0-r0
contents:
  repositories:
    - https://dhi.io/apk/alpine/v3.24/main
    - https://dl-cdn.alpinelinux.org/alpine/v3.24/main
    - https://dl-cdn.alpinelinux.org/alpine/v3.24/community
  keyring:
    - https://dhi.io/keyring/dhi-apk@docker-0F81AD7700D99184.rsa.pub
  packages:
    - alpine-baselayout-data
    - ansible-14=14.5.0-r0
    - apk-tools
    - bash
    - busybox
    - ca-certificates
    - ca-certificates-bundle
    - coreutils
    - findutils
    - git
    - libcrypto3
    - libgcc
    - libssl3
    - openssh-client
    - python-3.13
    - tzdata
accounts:
  root: true
  run-as: root
  users:
    - name: nonroot
      uid: 65532
      gid: 65532
  groups:
    - name: nonroot
      gid: 65532
      members:
        - nonroot
os-release:
  name: Docker Hardened Images (Alpine)
  id: alpine
  version-id: "3.24"
  pretty-name: Docker Hardened Images/Alpine Linux v3.24
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
work-dir: /work
environment:
  ANSIBLE_HOME: /home/nonroot/.ansible
  ANSIBLE_LOCAL_TEMP: /home/nonroot/.ansible/tmp
  HOME: /home/nonroot
  LANG: C.UTF-8
  LC_ALL: C.UTF-8
paths:
  - type: directory
    path: /home/nonroot
    uid: 65532
    gid: 65532
    mode: "0755"
  - type: directory
    path: /home/nonroot/.ansible
    uid: 65532
    gid: 65532
    mode: "0770"
  - type: directory
    path: /home/nonroot/.ansible/tmp
    uid: 65532
    gid: 65532
    mode: "0770"
  - type: directory
    path: /home/nonroot/.ssh
    uid: 65532
    gid: 65532
    mode: "0700"
  - type: directory
    path: /work
    uid: 65532
    gid: 65532
    mode: "0770"
annotations:
  org.opencontainers.image.description: A minimal Ansible image
  org.opencontainers.image.licenses: GPL-3.0-or-later
cmd:
  - ansible
  - --version
