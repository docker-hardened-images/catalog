metadata:
  display-name: Ansible
  short-description: Batteries-included Ansible community package for running playbooks and ad-hoc tasks from a minimal controller image.
  featured: false
  home-url: https://docs.ansible.com/
  categories:
    - integration-and-delivery
  included-tools:
    - name: ansible-community
      description: Prints the Ansible community package version.
    - name: ansible
      description: Ad-hoc task runner for the Ansible community package.
    - name: ansible-playbook
      description: Runs Ansible playbooks.
    - name: ansible-galaxy
      description: Lists and installs Ansible collections and roles.
    - name: ansible-vault
      description: Encrypts and decrypts Ansible vault data.
    - name: ansible-config
      description: Displays Ansible configuration.
    - name: ansible-doc
      description: Shows documentation for Ansible modules and plugins.
    - name: ansible-inventory
      description: Displays and graphs an Ansible inventory.
    - name: ansible-console
      description: Interactive Ansible console.
    - name: ansible-pull
      description: Pulls playbooks from a repository and runs them locally. Needs the dev variant, which has a shell and git.
