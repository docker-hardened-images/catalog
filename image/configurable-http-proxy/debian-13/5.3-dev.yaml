# syntax=dhi.io/build:2-debian13

name: Configurable HTTP Proxy 5.3.x (dev)
image: dhi.io/configurable-http-proxy
variant: dev
tags:
  - 5-dev
  - 5.3-dev
  - 5.3.0-dev
  - 5-debian-dev
  - 5-debian13-dev
  - 5.3-debian-dev
  - 5.3-debian13-dev
  - 5.3.0-debian-dev
  - 5.3.0-debian13-dev
platforms:
  - linux/amd64
  - linux/arm64
dates:
  release: "2026-07-08"
vars:
  SEMVER_MAJOR_MINOR_VERSION: "5.3"
  SEMVER_MAJOR_VERSION: "5"
  SEMVER_VERSION: 5.3.0
  VERSION: 5.3.0-1
contents:
  repositories:
    - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
  keyring:
    - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
  packages:
    - '!gawk'
    - '!libelogind0'
    - '!original-awk'
    - apt
    - base-files
    - bash
    - ca-certificates
    - ca-certificates-bundle
    - configurable-http-proxy=5.3.0-1
    - coreutils
    - diffutils
    - dpkg
    - findutils
    - grep
    - libc-bin
    - libc6
    - libgomp1
    - libstdc++6
    - mawk
    - netbase
    - nodejs-24
    - perl-base
    - sed
    - tzdata
    - util-linux
accounts:
  root: true
  run-as: root
  users:
    - name: nonroot
      uid: 65532
      gid: 65532
    - name: _apt
      uid: 42
      gid: 65532
  groups:
    - name: nonroot
      gid: 65532
      members:
        - nonroot
os-release:
  name: Docker Hardened Images (Debian)
  id: debian
  version-id: "13"
  version-codename: trixie
  pretty-name: Docker Hardened Images/Debian GNU/Linux 13 (trixie)
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
work-dir: /srv/configurable-http-proxy
environment:
  DEBIAN_FRONTEND: noninteractive
  NODE_ENV: production
  PATH: /srv/configurable-http-proxy/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
paths:
  - type: directory
    path: /srv
    uid: 0
    gid: 0
  - type: symlink
    path: /srv/configurable-http-proxy
    uid: 0
    gid: 0
    source: /usr/lib/configurable-http-proxy
annotations:
  org.opencontainers.image.description: A minimal configurable-http-proxy image
  org.opencontainers.image.licenses: BSD-3-Clause
entrypoint:
  - node
  - /srv/configurable-http-proxy/bin/configurable-http-proxy
cmd:
  - --api-ip=0.0.0.0
ports:
  - 8000/tcp
  - 8001/tcp
