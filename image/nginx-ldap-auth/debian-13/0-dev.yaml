# syntax=dhi.io/build:2-debian13

name: NGINX LDAP Auth 0.0.x (dev)
image: dhi.io/nginx-ldap-auth
variant: dev
tags:
  - 0-dev
  - 0.0-dev
  - 0.0.5-dev
  - 0-debian-dev
  - 0-debian13-dev
  - 0.0-debian-dev
  - 0.0-debian13-dev
  - 0.0.5-debian-dev
  - 0.0.5-debian13-dev
platforms:
  - linux/amd64
  - linux/arm64
dates:
  release: "2015-06-22"
vars:
  SEMVER_MAJOR_MINOR_VERSION: "0.0"
  SEMVER_MAJOR_VERSION: "0"
  SEMVER_VERSION: 0.0.5
  VERSION: 0.0.5.20230304-5
contents:
  repositories:
    - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
  keyring:
    - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
  packages:
    - '!gawk'
    - '!libelogind0'
    - '!mawk'
    - '!original-awk'
    - apt
    - base-files
    - bash
    - ca-certificates
    - coreutils
    - diffutils
    - dpkg
    - findutils
    - grep
    - libc-bin
    - libldap2
    - libsasl2-2
    - mawk
    - nginx-ldap-auth=0.0.5.20230304-5
    - perl-base
    - python-3.14
    - sed
    - util-linux
accounts:
  root: true
  run-as: root
  users:
    - name: nonroot
      uid: 65532
      gid: 65532
    - name: _apt
      uid: 42
      gid: 65532
  groups:
    - name: nonroot
      gid: 65532
      members:
        - nonroot
os-release:
  name: Docker Hardened Images (Debian)
  id: debian
  version-id: "13"
  version-codename: trixie
  pretty-name: Docker Hardened Images/Debian GNU/Linux 13 (trixie)
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
environment:
  DEBIAN_FRONTEND: noninteractive
  PYTHONUNBUFFERED: "1"
paths:
  - type: directory
    path: /usr/src/app
    uid: 0
    gid: 0
  - type: symlink
    path: /usr/src/app/nginx-ldap-auth-daemon.py
    uid: 0
    gid: 0
    source: /usr/bin/nginx-ldap-auth-daemon
annotations:
  org.opencontainers.image.description: A minimal nginx-ldap-auth image
  org.opencontainers.image.licenses: BSD-2-Clause
entrypoint:
  - /usr/bin/nginx-ldap-auth-daemon
cmd:
  - --host
  - 0.0.0.0
  - --port
  - "8888"
ports:
  - 8888/tcp
