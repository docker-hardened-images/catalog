# syntax=dhi.io/build:2-debian13

name: OpenFGA 1.x (dev)
image: dhi.io/openfga
variant: dev
tags:
  - 1-dev
  - 1.22-dev
  - 1.22.0-dev
  - 1-debian-dev
  - 1-debian13-dev
  - 1.22-debian-dev
  - 1.22-debian13-dev
  - 1.22.0-debian-dev
  - 1.22.0-debian13-dev
platforms:
  - linux/amd64
  - linux/arm64
dates:
  release: "2026-10-06"
vars:
  FLAVORED_SUFFIX: -dev
  GRPC_HEALTH_PROBE_COMMIT_SHA: 5d0402b1a167a1a610e51b458287c4bf12331bc6
  GRPC_HEALTH_PROBE_VERSION: 0.4.61
  SEMVER_MAJOR_MINOR_VERSION: "1.22"
  SEMVER_MAJOR_VERSION: "1"
  SEMVER_VERSION: 1.22.0
  SUFFIX: -dev
  VERSION: 1.22.0-7
contents:
  repositories:
    - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
  keyring:
    - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
  packages:
    - '!gawk'
    - '!libelogind0'
    - '!original-awk'
    - apt
    - base-files
    - bash
    - ca-certificates
    - ca-certificates-bundle
    - coreutils
    - diffutils
    - dpkg
    - findutils
    - grep
    - libc-bin
    - mawk
    - openfga-dev=1.22.0-7
    - perl-base
    - sed
    - tzdata
    - util-linux
  builds:
    - name: grpc-health-probe sbom
      contents:
        packages:
          - bash
          - coreutils
      pipeline:
        - name: record grpc-health-probe sbom
          uses: spdx@v1
          with:
            license: Apache-2.0
            name: grpc-health-probe
            purl: pkg:golang/github.com/grpc-ecosystem/grpc-health-probe@0.4.61
            version: 0.4.61
      outputs:
        - source: /opt/docker/sbom/grpc-health-probe
          target: /opt/docker/sbom/grpc-health-probe
          uid: 0
          gid: 0
accounts:
  root: true
  run-as: root
  users:
    - name: nonroot
      uid: 65532
      gid: 65532
    - name: _apt
      uid: 42
      gid: 65532
  groups:
    - name: nonroot
      gid: 65532
      members:
        - nonroot
os-release:
  name: Docker Hardened Images (Debian)
  id: debian
  version-id: "13"
  version-codename: trixie
  pretty-name: Docker Hardened Images/Debian GNU/Linux 13 (trixie)
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
environment:
  DEBIAN_FRONTEND: noninteractive
paths:
  - type: directory
    path: /usr/local/bin
    uid: 0
    gid: 0
  - type: symlink
    path: /usr/local/bin/openfga
    uid: 0
    gid: 0
    source: /usr/bin/openfga
  - type: symlink
    path: /usr/local/bin/grpc_health_probe
    uid: 0
    gid: 0
    source: /usr/bin/grpc_health_probe
annotations:
  org.opencontainers.image.description: A minimal openfga image
  org.opencontainers.image.licenses: Apache-2.0
entrypoint:
  - openfga
ports:
  - 8081/tcp
  - 8080/tcp
  - 3000/tcp
