# syntax=dhi.io/build:2-debian13

name: openfga 1.x (dev)
image: dhi.io/openfga
variant: dev
tags:
  - 1-dev
  - 1.18-dev
  - 1.18.3-dev
  - 1-debian-dev
  - 1-debian13-dev
  - 1.18-debian-dev
  - 1.18-debian13-dev
  - 1.18.3-debian-dev
  - 1.18.3-debian13-dev
platforms:
  - linux/amd64
  - linux/arm64
vars:
  COMMIT_SHA: 81c6202153a853d90589565884a56942c3fd07be
  GRPC_HEALTH_PROBE_COMMIT_SHA: bf5ea828fa1e069ada39fec39dc2a1bcb0de270e
  GRPC_HEALTH_PROBE_VERSION: 0.4.54
  SEMVER_MAJOR_MINOR_VERSION: "1.18"
  SEMVER_MAJOR_VERSION: "1"
  SEMVER_VERSION: 1.18.3
  VERSION: 1.18.3
contents:
  repositories:
    - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
  keyring:
    - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
  packages:
    - '!gawk'
    - '!libelogind0'
    - '!original-awk'
    - apt
    - base-files
    - bash
    - ca-certificates
    - ca-certificates-bundle
    - coreutils
    - diffutils
    - dpkg
    - findutils
    - grep
    - libc-bin
    - mawk
    - perl-base
    - sed
    - tzdata
    - util-linux
  builds:
    - name: grpc health probe
      work-dir: /go/src/github.com/grpc-ecosystem/grpc-health-probe
      caches:
        - path: /go/pkg/mod
      contents:
        packages:
          - bash
          - ca-certificates-bundle
          - coreutils
          - golang-1.26
          - findutils
          - mawk
          - sed
        files:
          - url: git+https://github.com/grpc-ecosystem/grpc-health-probe.git#v0.4.54
            checksum: bf5ea828fa1e069ada39fec39dc2a1bcb0de270e
            path: /go/src/github.com/grpc-ecosystem/grpc-health-probe
            spdx:
              name: grpc-health-probe
              version: 0.4.54
              packages:
                - name: grpc-health-probe
                  purl: pkg:golang/github.com/grpc-ecosystem/grpc-health-probe@0.4.54
                  license: Apache-2.0
            uid: 0
            gid: 0
      pipeline:
        - name: update go dependencies
          uses: go/bump@v2
          with:
            deps: []
            tidy: true
        - name: compile
          uses: go/build@v1
          with:
            ldflags:
              - -s
              - -w
              - -X main.versionTag=0.4.54
            output: ${target.dir}/usr/local/bin/grpc_health_probe
            packages: ./main.go
        - name: tests
          runs: |
            set -eux -o pipefail

            "${target.dir}/usr/local/bin/grpc_health_probe" --version
      outputs:
        - source: ${target.dir}/usr/local/bin/grpc_health_probe
          target: /usr/local/bin/grpc_health_probe
          uid: 0
          gid: 0
          mode: "0755"
        - source: /opt/docker/sbom/grpc-health-probe
          target: /opt/docker/sbom/grpc-health-probe
          uid: 0
          gid: 0
    - name: openfga
      caches:
        - path: /go/pkg/mod
      contents:
        packages:
          - bash
          - ca-certificates-bundle
          - coreutils
          - golang-1.26
          - findutils
          - mawk
          - sed
        files:
          - url: git+https://github.com/openfga/openfga.git#v1.18.3
            checksum: 81c6202153a853d90589565884a56942c3fd07be
            path: /go/src/github.com/openfga/openfga
            spdx:
              name: openfga
              version: 1.18.3
              packages:
                - name: openfga
                  purl: pkg:golang/github.com/openfga/openfga@1.18.3
                  license: Apache-2.0
            uid: 0
            gid: 0
      pipeline:
        - name: update go dependencies
          uses: go/bump@v1
          work-dir: /go/src/github.com/openfga/openfga
          with:
            deps: []
            download: true
        - name: compile
          uses: go/build@v1
          work-dir: /go/src/github.com/openfga/openfga
          with:
            ldflags:
              - -X github.com/openfga/openfga/internal/build.Version=v1.18.3
              - -X github.com/openfga/openfga/internal/build.Commit=81c6202153a853d90589565884a56942c3fd07be
              - -X github.com/openfga/openfga/internal/build.Date=$(date -u -d @${SOURCE_DATE_EPOCH} +%Y-%m-%dT%TZ)
              - -X github.com/openfga/openfga/internal/build.ProjectName=openfga
            output: ${target.dir}/usr/local/bin/openfga
            packages: ./cmd/openfga
        - name: tests
          work-dir: /go/src/github.com/openfga/openfga
          runs: |
            set -eux -o pipefail

            "${target.dir}/usr/local/bin/openfga" version
      outputs:
        - source: ${target.dir}/usr/local/bin/openfga
          target: /usr/local/bin/openfga
          uid: 0
          gid: 0
          mode: "0755"
        - source: /opt/docker/sbom/openfga
          target: /opt/docker/sbom/openfga
          uid: 0
          gid: 0
accounts:
  root: true
  run-as: root
  users:
    - name: nonroot
      uid: 65532
      gid: 65532
    - name: _apt
      uid: 42
      gid: 65532
  groups:
    - name: nonroot
      gid: 65532
      members:
        - nonroot
os-release:
  name: Docker Hardened Images (Debian)
  id: debian
  version-id: "13"
  version-codename: trixie
  pretty-name: Docker Hardened Images/Debian GNU/Linux 13 (trixie)
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
environment:
  DEBIAN_FRONTEND: noninteractive
annotations:
  org.opencontainers.image.description: A minimal openfga image
  org.opencontainers.image.licenses: Apache-2.0
entrypoint:
  - openfga
ports:
  - 8081/tcp
  - 8080/tcp
  - 3000/tcp
