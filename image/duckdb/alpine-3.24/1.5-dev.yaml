# syntax=dhi.io/build:2-alpine3.24

name: DuckDB 1.5.x (dev)
image: dhi.io/duckdb
variant: dev
tags:
  - 1.5-alpine-dev
  - 1.5.6-alpine-dev
  - 1.5-alpine3.24-dev
  - 1.5.6-alpine3.24-dev
platforms:
  - linux/amd64
  - linux/arm64
dates:
  release: "2026-03-09"
  end-of-life: "2027-03-01"
vars:
  SEMVER_MAJOR_MINOR_VERSION: "1.5"
  SEMVER_MAJOR_VERSION: "1"
  SEMVER_VERSION: 1.5.6
  VERSION: 1.5.6-r0
contents:
  repositories:
    - https://dhi.io/apk/alpine/v3.24/main
    - https://dl-cdn.alpinelinux.org/alpine/v3.24/main
    - https://dl-cdn.alpinelinux.org/alpine/v3.24/community
  keyring:
    - https://dhi.io/keyring/dhi-apk@docker-0F81AD7700D99184.rsa.pub
  packages:
    - alpine-baselayout-data
    - apk-tools
    - bash
    - busybox
    - ca-certificates
    - ca-certificates-bundle
    - coreutils
    - duckdb-1.5=1.5.6-r0
    - findutils
    - libgcc
    - libstdc++
    - musl
accounts:
  root: true
  run-as: root
  users:
    - name: nonroot
      uid: 65532
      gid: 65532
  groups:
    - name: nonroot
      gid: 65532
      members:
        - nonroot
os-release:
  name: Docker Hardened Images (Alpine)
  id: alpine
  version-id: "3.24"
  pretty-name: Docker Hardened Images/Alpine Linux v3.24
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
work-dir: /
environment:
  SSL_CERT_FILE: /etc/ssl/certs/ca-certificates.crt
paths:
  - type: symlink
    path: /duckdb
    uid: 0
    gid: 0
    source: /usr/bin/duckdb
  - type: directory
    path: /home/nonroot
    uid: 65532
    gid: 65532
    mode: "0700"
annotations:
  org.opencontainers.image.description: A minimal DuckDB image
  org.opencontainers.image.licenses: MIT
cmd:
  - /duckdb
