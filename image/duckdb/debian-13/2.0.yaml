# syntax=dhi.io/build:2-debian13

name: DuckDB 2.0.x
image: dhi.io/duckdb
variant: runtime
tags:
  - "2"
  - "2.0"
  - 2.0.0
  - 2-debian
  - 2-debian13
  - 2.0-debian
  - 2.0-debian13
  - 2.0.0-debian
  - 2.0.0-debian13
platforms:
  - linux/amd64
  - linux/arm64
dates:
  release: "2026-10-21"
  end-of-life: "2027-10-21"
vars:
  SEMVER_MAJOR_MINOR_VERSION: "2.0"
  SEMVER_MAJOR_VERSION: "2"
  SEMVER_VERSION: 2.0.0
  VERSION: 2.0.0-0
contents:
  repositories:
    - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
  keyring:
    - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
  packages:
    - '!libelogind0'
    - '!mawk'
    - '!original-awk'
    - base-files
    - ca-certificates-bundle
    - duckdb-2.0=2.0.0-0
    - libc6
    - libgcc-s1
    - libstdc++6
    - tzdata
accounts:
  run-as: nonroot
  users:
    - name: nonroot
      uid: 65532
      gid: 65532
  groups:
    - name: nonroot
      gid: 65532
      members:
        - nonroot
os-release:
  name: Docker Hardened Images (Debian)
  id: debian
  version-id: "13"
  version-codename: trixie
  pretty-name: Docker Hardened Images/Debian GNU/Linux 13 (trixie)
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
work-dir: /
environment:
  SSL_CERT_FILE: /etc/ssl/certs/ca-certificates.crt
paths:
  - type: symlink
    path: /duckdb
    uid: 0
    gid: 0
    source: /usr/bin/duckdb
  - type: directory
    path: /home/nonroot
    uid: 65532
    gid: 65532
    mode: "0700"
annotations:
  org.opencontainers.image.description: A minimal DuckDB image
  org.opencontainers.image.licenses: MIT
cmd:
  - /duckdb
