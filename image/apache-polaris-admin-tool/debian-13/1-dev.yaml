# syntax=dhi.io/build:2-debian13

name: Apache Polaris Admin Tool 1.x (dev)
image: dhi.io/apache-polaris-admin-tool
variant: dev
tags:
  - 1-dev
  - 1.8-dev
  - 1.8.0-dev
  - 1-debian-dev
  - 1-debian13-dev
  - 1.8-debian-dev
  - 1.8-debian13-dev
  - 1.8.0-debian-dev
  - 1.8.0-debian13-dev
platforms:
  - linux/amd64
  - linux/arm64
dates:
  release: "2026-04-21"
vars:
  JAVA_FIPS_SUFFIX: ""
  JAVA_VERSION: 1:21.0.13+9-0
  JDK_MAJOR_VERSION: "21"
  LAUNCHER_JVM_OPTIONS: -XX:MaxRAMPercentage=80.0 -XX:+UseParallelGC -XX:MinHeapFreeRatio=10 -XX:MaxHeapFreeRatio=20 -XX:GCTimeRatio=4 -XX:AdaptiveSizePolicyWeight=90 -XX:+ExitOnOutOfMemoryError
  SEMVER_MAJOR_MINOR_VERSION: "1.8"
  SEMVER_MAJOR_VERSION: "1"
  SEMVER_VERSION: 1.8.0
  VERSION: 1.8.0-0
contents:
  repositories:
    - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
  keyring:
    - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
  packages:
    - '!gawk'
    - '!libelogind0'
    - '!mawk'
    - '!original-awk'
    - apache-polaris-admin-tool-1=1.8.0-0
    - apt
    - base-files
    - bash
    - ca-certificates
    - ca-certificates-bundle
    - coreutils
    - diffutils
    - dpkg
    - eclipse-temurin-21-jre-oci-config=1:21.0.13+9-0
    - eclipse-temurin-21-jre=1:21.0.13+9-0
    - findutils
    - grep
    - libasound2t64
    - libc-bin
    - libc6
    - libgcc-s1
    - libstdc++6
    - mawk
    - perl-base
    - sed
    - tzdata
    - util-linux
  builds:
    - name: locale
      contents:
        packages:
          - bash
          - locales
          - coreutils
          - gzip
      pipeline:
        - name: install locales
          runs: |
            set -eux -o pipefail

            ln -s /etc/locale.alias /usr/share/locale/locale.alias

            echo "en_US.UTF-8 UTF-8" >> /etc/locale.gen
            locale-gen en_US.UTF-8
      outputs:
        - source: /usr/share/locale
          target: /usr/share/locale
          uid: 0
          gid: 0
        - source: /usr/lib/locale
          target: /usr/lib/locale
          uid: 0
          gid: 0
accounts:
  root: true
  run-as: root
  users:
    - name: polaris
      uid: 10000
      gid: 10001
    - name: _apt
      uid: 42
      gid: 65532
  groups:
    - name: polaris
      gid: 10001
      members:
        - polaris
os-release:
  name: Docker Hardened Images (Debian)
  id: debian
  version-id: "13"
  version-codename: trixie
  pretty-name: Docker Hardened Images/Debian GNU/Linux 13 (trixie)
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
work-dir: /deployments
environment:
  DEBIAN_FRONTEND: noninteractive
  JAVA_TOOL_OPTIONS: -XX:MaxRAMPercentage=80.0 -XX:+UseParallelGC -XX:MinHeapFreeRatio=10 -XX:MaxHeapFreeRatio=20 -XX:GCTimeRatio=4 -XX:AdaptiveSizePolicyWeight=90 -XX:+ExitOnOutOfMemoryError
  LANG: en_US.UTF-8
  LANGUAGE: en_US:en
  LC_ALL: en_US.UTF-8
paths:
  - type: symlink
    path: /deployments
    uid: 0
    gid: 0
    source: /usr/share/apache-polaris-admin-tool
annotations:
  org.opencontainers.image.description: A minimal Apache Polaris Admin Tool image
  org.opencontainers.image.licenses: Apache-2.0
entrypoint:
  - java
  - -jar
  - /deployments/polaris-admin-tool.jar
ports:
  - 8080/tcp
  - 8443/tcp
