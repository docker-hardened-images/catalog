# syntax=dhi.io/build:2-debian13

name: vault-k8s 1.7.x
image: dhi.io/vault-k8s
variant: runtime
tags:
  - "1"
  - "1.7"
  - 1.7.7
  - 1-debian
  - 1-debian13
  - 1.7-debian
  - 1.7-debian13
  - 1.7.7-debian
  - 1.7.7-debian13
platforms:
  - linux/amd64
  - linux/arm64
dates:
  release: "2022-09-06"
vars:
  COMMIT_SHA: 82c261c9829b3d28edb8028050f13ee625f4db01
  SEMVER_MAJOR_MINOR_VERSION: "1.7"
  SEMVER_MAJOR_VERSION: "1"
  SEMVER_VERSION: 1.7.7
  VERSION: 1.7.7
contents:
  repositories:
    - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
  keyring:
    - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
  packages:
    - base-files
    - ca-certificates-bundle
    - tzdata
  builds:
    - name: vault-k8s-go
      work-dir: /go/src/github.com/hashicorp/vault-k8s
      caches:
        - path: /go/pkg/mod
      contents:
        packages:
          - bash
          - ca-certificates-bundle
          - coreutils
          - golang-1.26
          - findutils
          - mawk
          - sed
        files:
          - url: git+https://github.com/hashicorp/vault-k8s.git#v1.7.7
            checksum: 82c261c9829b3d28edb8028050f13ee625f4db01
            path: /go/src/github.com/hashicorp/vault-k8s
            spdx:
              name: vault-k8s
              version: 1.7.7
              packages:
                - name: vault-k8s
                  purl: pkg:dhi/vault-k8s@1.7.7
                  license: MPL-2.0
            uid: 0
            gid: 0
      pipeline:
        - name: update go dependencies (1 only)
          uses: go/bump@v1
          with:
            deps:
              - golang.org/x/net@v0.62.0
            download: true
        - name: build
          uses: go/build@v1
          with:
            ldflags:
              - -X github.com/hashicorp/vault-k8s/version.Version=1.7.7
            output: ${target.dir}/usr/local/bin/vault-k8s
            packages: .
      outputs:
        - source: ${target.dir}/usr/local/bin/vault-k8s
          target: /usr/local/bin/vault-k8s
          uid: 0
          gid: 0
          mode: "0755"
accounts:
  run-as: nonroot
  users:
    - name: nonroot
      uid: 65532
      gid: 65532
  groups:
    - name: nonroot
      gid: 65532
      members:
        - nonroot
os-release:
  name: Docker Hardened Images (Debian)
  id: debian
  version-id: "13"
  version-codename: trixie
  pretty-name: Docker Hardened Images/Debian GNU/Linux 13 (trixie)
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
annotations:
  org.opencontainers.image.description: A minimal vault-k8s image
  org.opencontainers.image.licenses: MPL-2.0
entrypoint:
  - /usr/local/bin/vault-k8s
