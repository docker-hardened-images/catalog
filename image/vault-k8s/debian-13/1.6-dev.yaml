# syntax=dhi.io/build:2-debian13

name: vault-k8s 1.6.x (dev)
image: dhi.io/vault-k8s
variant: dev
tags:
  - 1.6-dev
  - 1.6.2-dev
  - 1.6-debian-dev
  - 1.6-debian13-dev
  - 1.6.2-debian-dev
  - 1.6.2-debian13-dev
platforms:
  - linux/amd64
  - linux/arm64
dates:
  release: "2025-02-26"
vars:
  DEBIAN_VERSION: 1.6.2-2
  FLAVORED_SUFFIX: -dev
  SEMVER_MAJOR_MINOR_VERSION: "1.6"
  SEMVER_MAJOR_VERSION: "1"
  SEMVER_VERSION: 1.6.2
  SUFFIX: -dev
  VERSION: 1.6.2
contents:
  repositories:
    - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
  keyring:
    - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
  packages:
    - '!gawk'
    - '!libelogind0'
    - '!original-awk'
    - apt
    - base-files
    - bash
    - ca-certificates
    - ca-certificates-bundle
    - coreutils
    - diffutils
    - dpkg
    - findutils
    - grep
    - libc-bin
    - mawk
    - perl-base
    - sed
    - tzdata
    - util-linux
    - vault-k8s-1.6-dev=1.6.2-2
accounts:
  root: true
  run-as: root
  users:
    - name: nonroot
      uid: 65532
      gid: 65532
    - name: _apt
      uid: 42
      gid: 65532
  groups:
    - name: nonroot
      gid: 65532
      members:
        - nonroot
os-release:
  name: Docker Hardened Images (Debian)
  id: debian
  version-id: "13"
  version-codename: trixie
  pretty-name: Docker Hardened Images/Debian GNU/Linux 13 (trixie)
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
environment:
  DEBIAN_FRONTEND: noninteractive
paths:
  - type: directory
    path: /usr/local/bin
    uid: 0
    gid: 0
  - type: symlink
    path: /usr/local/bin/vault-k8s
    uid: 0
    gid: 0
    source: /usr/bin/vault-k8s
annotations:
  org.opencontainers.image.description: A minimal vault-k8s image
  org.opencontainers.image.licenses: MPL-2.0
entrypoint:
  - /usr/local/bin/vault-k8s
