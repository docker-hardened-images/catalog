# syntax=dhi.io/build:2-debian13

name: JupyterHub K8s Image Awaiter 4.x (dev)
image: dhi.io/jupyterhub-k8s-image-awaiter
variant: dev
tags:
  - 4-dev
  - 4.4-dev
  - 4.4.1-dev
  - 4-debian-dev
  - 4-debian13-dev
  - 4.4-debian-dev
  - 4.4-debian13-dev
  - 4.4.1-debian-dev
  - 4.4.1-debian13-dev
platforms:
  - linux/amd64
  - linux/arm64
dates:
  release: "2026-08-10"
vars:
  FLAVORED_SUFFIX: -dev
  SEMVER_MAJOR_MINOR_VERSION: "4.4"
  SEMVER_MAJOR_VERSION: "4"
  SEMVER_VERSION: 4.4.1
  SUFFIX: -dev
  VERSION: 4.4.1-0
contents:
  repositories:
    - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
  keyring:
    - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
  packages:
    - '!gawk'
    - '!libelogind0'
    - '!original-awk'
    - apt
    - base-files
    - bash
    - ca-certificates
    - ca-certificates-bundle
    - coreutils
    - diffutils
    - dpkg
    - findutils
    - grep
    - jupyterhub-k8s-image-awaiter-dev=4.4.1-0
    - libc-bin
    - mawk
    - perl-base
    - sed
    - util-linux
accounts:
  root: true
  run-as: root
  users:
    - name: nonroot
      uid: 65532
      gid: 65532
    - name: _apt
      uid: 42
      gid: 65532
  groups:
    - name: nonroot
      gid: 65532
      members:
        - nonroot
os-release:
  name: Docker Hardened Images (Debian)
  id: debian
  version-id: "13"
  version-codename: trixie
  pretty-name: Docker Hardened Images/Debian GNU/Linux 13 (trixie)
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
environment:
  DEBIAN_FRONTEND: noninteractive
paths:
  - type: symlink
    path: /image-awaiter
    uid: 0
    gid: 0
    source: /usr/bin/image-awaiter
annotations:
  org.opencontainers.image.description: A minimal jupyterhub-k8s-image-awaiter image
  org.opencontainers.image.licenses: BSD-3-Clause
entrypoint:
  - /usr/bin/image-awaiter
