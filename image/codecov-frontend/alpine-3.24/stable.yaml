# syntax=dhi.io/build:2-alpine3.24

name: Codecov Frontend 26.x
image: dhi.io/codecov-frontend
variant: runtime
tags:
  - 26-alpine
  - 26.7-alpine
  - 26-alpine3.24
  - 26.7.6-alpine
  - 26.7-alpine3.24
  - 26.7.6-alpine3.24
platforms:
  - linux/amd64
  - linux/arm64
dates:
  release: "2023-10-03"
vars:
  SEMVER_MAJOR_MINOR_VERSION: "26.7"
  SEMVER_MAJOR_VERSION: "26"
  SEMVER_VERSION: 26.7.6
  VERSION: 26.7.6-r1
contents:
  repositories:
    - https://dhi.io/apk/alpine/v3.24/main
    - https://dl-cdn.alpinelinux.org/alpine/v3.24/main
    - https://dl-cdn.alpinelinux.org/alpine/v3.24/community
  keyring:
    - https://dhi.io/keyring/dhi-apk@docker-0F81AD7700D99184.rsa.pub
  packages:
    - busybox
    - ca-certificates-bundle
    - codecov-frontend=26.7.6-r1
    - gettext-envsubst
    - nginx-mainline
    - tzdata
accounts:
  run-as: nginx
  users:
    - name: nginx
      uid: 65532
      gid: 65532
  groups:
    - name: nginx
      gid: 65532
      members:
        - nginx
os-release:
  name: Docker Hardened Images (Alpine)
  id: alpine
  version-id: "3.24"
  pretty-name: Docker Hardened Images/Alpine Linux v3.24
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
work-dir: /var/www/app
environment:
  BUILD_VERSION: 26.7.6
  CODECOV_API_HOST: api.codecov.io
  CODECOV_BASE_HOST: codecov.io
paths:
  - type: directory
    path: /usr/local/bin
    uid: 0
    gid: 0
    mode: "0755"
  - type: symlink
    path: /usr/local/bin/codecov-frontend
    uid: 0
    gid: 0
    source: /usr/bin/codecov-frontend
  - type: symlink
    path: /usr/bin/start-nginx
    uid: 0
    gid: 0
    source: /usr/bin/codecov-frontend
  - type: directory
    path: /var/www/app
    uid: 0
    gid: 0
    mode: "0755"
  - type: symlink
    path: /var/www/app/gazebo
    uid: 0
    gid: 0
    source: /usr/share/codecov-frontend/gazebo
  - type: directory
    path: /etc/codecov-frontend/conf.d
    uid: 0
    gid: 0
    mode: "0755"
  - type: directory
    path: /var/lib/nginx
    uid: 0
    gid: 0
    mode: "0755"
  - type: symlink
    path: /var/log/nginx/access.log
    uid: 0
    gid: 0
    source: /dev/stdout
  - type: symlink
    path: /var/log/nginx/error.log
    uid: 0
    gid: 0
    source: /dev/stderr
  - type: directory
    path: /usr/share/codecov-frontend/gazebo/assets
    uid: 65532
    gid: 65532
    mode: "0755"
  - type: directory
    path: /usr/share/codecov-frontend/gazebo
    uid: 0
    gid: 0
    mode: "0755"
  - type: directory
    path: /usr/share/codecov-frontend
    uid: 0
    gid: 0
    mode: "0755"
  - type: directory
    path: /usr/share
    uid: 0
    gid: 0
    mode: "0755"
  - type: directory
    path: /usr
    uid: 0
    gid: 0
    mode: "0755"
annotations:
  org.opencontainers.image.description: A minimal Codecov Frontend image
  org.opencontainers.image.licenses: FSL-1.1-ALv2
entrypoint:
  - /usr/local/bin/codecov-frontend
ports:
  - 8080/tcp
