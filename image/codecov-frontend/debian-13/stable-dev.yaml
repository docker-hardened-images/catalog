# syntax=dhi.io/build:2-debian13

name: Codecov Frontend 26.x (dev)
image: dhi.io/codecov-frontend
variant: dev
tags:
  - 26-dev
  - 26.7-dev
  - 26.7.6-dev
  - 26-debian-dev
  - 26-debian13-dev
  - 26.7-debian-dev
  - 26.7-debian13-dev
  - 26.7.6-debian-dev
  - 26.7.6-debian13-dev
platforms:
  - linux/amd64
  - linux/arm64
dates:
  release: "2023-10-03"
vars:
  SEMVER_MAJOR_MINOR_VERSION: "26.7"
  SEMVER_MAJOR_VERSION: "26"
  SEMVER_VERSION: 26.7.6
  VERSION: 26.7.6-1
contents:
  repositories:
    - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
  keyring:
    - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
  packages:
    - '!gawk'
    - '!libelogind0'
    - '!original-awk'
    - apt
    - base-files
    - bash
    - ca-certificates
    - ca-certificates-bundle
    - codecov-frontend=26.7.6-1
    - coreutils
    - diffutils
    - dpkg
    - findutils
    - gettext-base
    - grep
    - libc-bin
    - libc6
    - libcrypt1
    - libpcre2-8-0
    - libssl3t64
    - mawk
    - nginx-mainline
    - perl-base
    - sed
    - tzdata
    - util-linux
    - zlib1g
accounts:
  root: true
  run-as: root
  users:
    - name: nginx
      uid: 65532
      gid: 65532
    - name: _apt
      uid: 42
      gid: 65532
  groups:
    - name: nginx
      gid: 65532
      members:
        - nginx
os-release:
  name: Docker Hardened Images (Debian)
  id: debian
  version-id: "13"
  version-codename: trixie
  pretty-name: Docker Hardened Images/Debian GNU/Linux 13 (trixie)
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
work-dir: /var/www/app
environment:
  BUILD_VERSION: 26.7.6
  CODECOV_API_HOST: api.codecov.io
  CODECOV_BASE_HOST: codecov.io
  DEBIAN_FRONTEND: noninteractive
paths:
  - type: directory
    path: /usr/local/bin
    uid: 0
    gid: 0
    mode: "0755"
  - type: symlink
    path: /usr/local/bin/codecov-frontend
    uid: 0
    gid: 0
    source: /usr/bin/codecov-frontend
  - type: symlink
    path: /usr/bin/start-nginx
    uid: 0
    gid: 0
    source: /usr/bin/codecov-frontend
  - type: directory
    path: /var/www/app
    uid: 0
    gid: 0
    mode: "0755"
  - type: symlink
    path: /var/www/app/gazebo
    uid: 0
    gid: 0
    source: /usr/share/codecov-frontend/gazebo
  - type: directory
    path: /etc/codecov-frontend/conf.d
    uid: 0
    gid: 0
    mode: "0755"
  - type: symlink
    path: /var/log/nginx/access.log
    uid: 0
    gid: 0
    source: /dev/stdout
  - type: symlink
    path: /var/log/nginx/error.log
    uid: 0
    gid: 0
    source: /dev/stderr
  - type: directory
    path: /usr/share/codecov-frontend/gazebo/assets
    uid: 65532
    gid: 65532
    mode: "0755"
  - type: directory
    path: /usr/share/codecov-frontend/gazebo
    uid: 0
    gid: 0
    mode: "0755"
  - type: directory
    path: /usr/share/codecov-frontend
    uid: 0
    gid: 0
    mode: "0755"
  - type: directory
    path: /usr/share
    uid: 0
    gid: 0
    mode: "0755"
  - type: directory
    path: /usr
    uid: 0
    gid: 0
    mode: "0755"
annotations:
  org.opencontainers.image.description: A minimal Codecov Frontend image
  org.opencontainers.image.licenses: FSL-1.1-ALv2
entrypoint:
  - /usr/local/bin/codecov-frontend
ports:
  - 8080/tcp
