# syntax=dhi.io/build:2-alpine3.24

name: Open Liberty 26.x (dev)
image: dhi.io/open-liberty
variant: dev
tags:
  - 26.0.0.11-alpine-dev
  - 26.0.0.11-alpine3.24-dev
platforms:
  - linux/amd64
  - linux/arm64
dates:
  release: "2026-11-03"
vars:
  LIBERTY_VERSION: 26.0.0.11
  SEMVER_MAJOR_VERSION: "26"
  VERSION: 26.0.0.11-r0
contents:
  repositories:
    - https://dhi.io/apk/alpine/v3.24/main
    - https://dl-cdn.alpinelinux.org/alpine/v3.24/main
    - https://dl-cdn.alpinelinux.org/alpine/v3.24/community
  keyring:
    - https://dhi.io/keyring/dhi-apk@docker-0F81AD7700D99184.rsa.pub
  packages:
    - alpine-baselayout-data
    - apk-tools
    - bash
    - busybox
    - ca-certificates
    - ca-certificates-bundle
    - coreutils
    - eclipse-temurin-21-jre
    - eclipse-temurin-21-jre-oci-config
    - findutils
    - gawk
    - grep
    - open-liberty=26.0.0.11-r0
    - openssl
    - procps-ng
    - sed
    - tzdata
accounts:
  root: true
  run-as: root
  users:
    - name: nonroot
      uid: 65532
      gid: 65532
  groups:
    - name: nonroot
      gid: 65532
      members:
        - nonroot
os-release:
  name: Docker Hardened Images (Alpine)
  id: alpine
  version-id: "3.24"
  pretty-name: Docker Hardened Images/Alpine Linux v3.24
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
environment:
  LOG_DIR: /liberty/logs
  PATH: /usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin:/opt/ol/wlp/bin:/opt/ol/helpers/build:/opt/ol/helpers/runtime
  RANDFILE: /tmp/.rnd
  WLP_OUTPUT_DIR: /opt/ol/wlp/output
  WLP_SKIP_MAXPERMSIZE: "true"
paths:
  - type: directory
    path: /logs
    uid: 65532
    gid: 65532
    mode: "0770"
  - type: directory
    path: /etc/wlp
    uid: 65532
    gid: 65532
    mode: "0770"
  - type: directory
    path: /serviceability
    uid: 65532
    gid: 65532
    mode: "0770"
  - type: directory
    path: /opt/ol/fixes
    uid: 65532
    gid: 65532
    mode: "0770"
  - type: directory
    path: /opt/ol/wlp/output
    uid: 65532
    gid: 65532
    mode: "0770"
  - type: directory
    path: /opt/ol/wlp/output/defaultServer
    uid: 65532
    gid: 65532
    mode: "0770"
  - type: directory
