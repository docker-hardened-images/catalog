    uid: 65532
    gid: 65532
    mode: "0770"
  - type: directory
    path: /opt/ol/wlp/usr/servers/defaultServer/apps
    uid: 65532
    gid: 65532
    mode: "0770"
  - type: directory
    path: /opt/ol/wlp/usr/servers/defaultServer/dropins
    uid: 65532
    gid: 65532
    mode: "0770"
  - type: directory
    path: /opt/ol/wlp/usr/servers/defaultServer/configDropins
    uid: 65532
    gid: 65532
    mode: "0770"
  - type: directory
    path: /opt/ol/wlp/usr/servers/defaultServer/configDropins/defaults
    uid: 65532
    gid: 65532
    mode: "0770"
  - type: directory
    path: /opt/ol/wlp/usr/servers/defaultServer/configDropins/overrides
    uid: 65532
    gid: 65532
    mode: "0770"
  - type: directory
    path: /opt/ol/wlp/usr/shared
    uid: 65532
    gid: 65532
    mode: "0770"
  - type: directory
    path: /opt/ol/wlp/usr/shared/resources
    uid: 65532
    gid: 65532
    mode: "0770"
  - type: directory
    path: /opt/ol/wlp/usr/shared/resources/lib.index.cache
    uid: 65532
    gid: 65532
    mode: "0770"
  - type: symlink
    path: /config
    uid: 0
    gid: 0
    source: /opt/ol/wlp/usr/servers/defaultServer
  - type: symlink
    path: /output
    uid: 0
    gid: 0
    source: /opt/ol/wlp/output/defaultServer
  - type: symlink
    path: /liberty
    uid: 0
    gid: 0
    source: /opt/ol/wlp
  - type: symlink
