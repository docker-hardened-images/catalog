metadata:
  display-name: Open Liberty
  short-description: Open Liberty is a lightweight, open source Java application server for Jakarta EE and MicroProfile applications.
  featured: false
  home-url: https://openliberty.io/
  categories:
    - languages-and-frameworks
    - web-servers
  included-tools:
    - name: server
      description: Creates, starts, stops and packages Liberty servers.
    - name: productInfo
      description: Reports the installed Liberty version and validates the installation.
    - name: securityUtility
      description: Encodes passwords and creates SSL certificates for Liberty servers.
    - name: configure.sh
      description: Upstream container build helper that applies the server configuration snippets.
