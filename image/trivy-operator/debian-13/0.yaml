# syntax=dhi.io/build:2-debian13

name: Trivy Operator 0.x
image: dhi.io/trivy-operator
variant: runtime
tags:
  - "0"
  - "0.36"
  - 0.36.1
  - 0-debian
  - 0-debian13
  - 0.36-debian
  - 0.36-debian13
  - 0.36.1-debian
  - 0.36.1-debian13
platforms:
  - linux/amd64
  - linux/arm64
dates:
  release: "2026-02-11"
vars:
  FLAVORED_SUFFIX: ""
  SEMVER_MAJOR_MINOR_VERSION: "0.36"
  SEMVER_MAJOR_VERSION: "0"
  SEMVER_VERSION: 0.36.1
  SUFFIX: ""
  VERSION: 0.36.1-1
contents:
  repositories:
    - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
  keyring:
    - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
  packages:
    - base-files
    - ca-certificates-bundle
    - trivy-operator=0.36.1-1
    - tzdata
accounts:
  run-as: trivyoperator
  users:
    - name: trivyoperator
      uid: 10000
      gid: 10000
  groups:
    - name: trivyoperator
      gid: 10000
os-release:
  name: Docker Hardened Images (Debian)
  id: debian
  version-id: "13"
  version-codename: trixie
  pretty-name: Docker Hardened Images/Debian GNU/Linux 13 (trixie)
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
