# syntax=dhi.io/build:2-debian13

name: Cilium 1.20.x (dev)
image: dhi.io/cilium
variant: dev
tags:
  - 1-dev
  - 1.20-dev
  - 1.20.2-dev
  - 1-debian-dev
  - 1-debian13-dev
  - 1.20-debian-dev
  - 1.20-debian13-dev
  - 1.20.2-debian-dev
  - 1.20.2-debian13-dev
platforms:
  - linux/amd64
  - linux/arm64
dates:
  release: "2026-07-29"
vars:
  CILIUM_ENVOY_SUFFIX: ""
  CILIUM_ENVOY_VERSION: 1.20.2-2
  CLANG_VERSION: "18"
  FLAVORED_SUFFIX: -dev
  SEMVER_MAJOR_MINOR_VERSION: "1.20"
  SEMVER_MAJOR_VERSION: "1"
  SEMVER_PATCH_VERSION: "2"
  SEMVER_VERSION: 1.20.2
  SUFFIX: -dev
  VERSION: 1.20.2-3
contents:
  repositories:
    - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
  keyring:
    - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
  packages:
    - '!gawk'
    - '!libelogind0'
    - '!original-awk'
    - apt
    - base-files
    - bash
    - bpftool
    - ca-certificates
    - ca-certificates-bundle
    - cilium-1.20-dev=1.20.2-3
    - cilium-1.20-libs=1.20.2-3
    - cilium-envoy-1.20=1.20.2-2
    - coreutils
    - diffutils
    - dpkg
    - findutils
    - grep
    - iproute2
    - ipset
    - iptables
    - kmod
    - libatomic1
    - libc++1-18
    - libc++abi1-18
    - libc-bin
    - libc6
    - libclang-cpp18
    - libllvm18
    - mawk
    - mount
    - perl-base
    - sed
    - tzdata
    - util-linux
  builds:
    - name: clang
      contents:
        packages:
          - base-files
          - dash
          - coreutils
          - clang-18
      pipeline:
        - name: install clang
          runs: |
            set -eux -o pipefail

            install -D -m 755 /usr/bin/clang-18 ${target.dir}/usr/bin/clang
      outputs:
        - source: ${target.dir}/usr/bin/clang
          target: /usr/bin/clang
          uid: 0
          gid: 0
accounts:
  root: true
  run-as: root
  users:
    - name: nonroot
      uid: 65532
      gid: 65532
    - name: _apt
      uid: 42
      gid: 65532
  groups:
    - name: nonroot
      gid: 65532
      members:
        - nonroot
os-release:
  name: Docker Hardened Images (Debian)
  id: debian
  version-id: "13"
  version-codename: trixie
  pretty-name: Docker Hardened Images/Debian GNU/Linux 13 (trixie)
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
environment:
  DEBIAN_FRONTEND: noninteractive
  HUBBLE_SERVER: unix:///var/run/cilium/hubble.sock
  INITSYSTEM: SYSTEMD
paths:
  - type: symlink
    path: /usr/bin/cilium
    uid: 0
    gid: 0
    source: /usr/bin/cilium-dbg
  - type: directory
    path: /etc/sysctl.d
    uid: 0
    gid: 0
annotations:
  org.opencontainers.image.description: A minimal Cilium image
  org.opencontainers.image.licenses: Apache-2.0
entrypoint:
  - /usr/bin/cilium
