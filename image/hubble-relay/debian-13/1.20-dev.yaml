# syntax=dhi.io/build:2-debian13

name: Hubble Relay 1.x (dev)
image: dhi.io/hubble-relay
variant: dev
tags:
  - 1-dev
  - 1.20-dev
  - 1.20.0-dev
  - 1-debian-dev
  - 1-debian13-dev
  - 1.20-debian-dev
  - 1.20-debian13-dev
  - 1.20.0-debian-dev
  - 1.20.0-debian13-dev
platforms:
  - linux/amd64
  - linux/arm64
dates:
  release: "2026-07-29"
vars:
  FLAVORED_SUFFIX: -dev
  GOPS_VERSION: 0.3.29-1
  SEMVER_MAJOR_MINOR_VERSION: "1.20"
  SEMVER_MAJOR_VERSION: "1"
  SEMVER_VERSION: 1.20.0
  SUFFIX: -dev
  VERSION: 1.20.0-1
contents:
  repositories:
    - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
  keyring:
    - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
  packages:
    - '!gawk'
    - '!libelogind0'
    - '!original-awk'
    - apt
    - base-files
    - bash
    - ca-certificates
    - ca-certificates-bundle
    - coreutils
    - diffutils
    - dpkg
    - findutils
    - gops-dev=0.3.29-1
    - grep
    - hubble-relay-1.20-dev=1.20.0-1
    - libc-bin
    - mawk
    - perl-base
    - sed
    - tzdata
    - util-linux
accounts:
  root: true
  run-as: root
  users:
    - name: nonroot
      uid: 65532
      gid: 65532
    - name: _apt
      uid: 42
      gid: 65532
  groups:
    - name: nonroot
      gid: 65532
      members:
        - nonroot
os-release:
  name: Docker Hardened Images (Debian)
  id: debian
  version-id: "13"
  version-codename: trixie
  pretty-name: Docker Hardened Images/Debian GNU/Linux 13 (trixie)
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
environment:
  DEBIAN_FRONTEND: noninteractive
  GOPS_CONFIG_DIR: /home/gops
paths:
  - type: directory
    path: /usr/local/bin
    uid: 0
    gid: 0
  - type: symlink
    path: /usr/local/bin/hubble-relay
    uid: 0
    gid: 0
    source: /usr/bin/hubble-relay
  - type: directory
    path: /home/gops
    uid: 65532
    gid: 65532
    mode: "0755"
  - type: directory
    path: /home/nonroot
    uid: 65532
    gid: 65532
    mode: "0700"
annotations:
  org.opencontainers.image.description: A minimal Hubble Relay image
  org.opencontainers.image.licenses: Apache-2.0
entrypoint:
  - /usr/bin/hubble-relay
cmd:
  - serve
