# syntax=dhi.io/build:2-alpine3.24

name: MongoDB Controllers for Kubernetes 1.x (dev)
image: dhi.io/mongodb-kubernetes
variant: dev
tags:
  - 1-alpine-dev
  - 1.12-alpine-dev
  - 1-alpine3.24-dev
  - 1.12.0-alpine-dev
  - 1.12-alpine3.24-dev
  - 1.12.0-alpine3.24-dev
platforms:
  - linux/amd64
  - linux/arm64
dates:
  release: "2025-05-06"
vars:
  FLAVORED_SUFFIX: -dev
  PACKAGE_VERSION: 1.13.0-r2
  SEMVER_MAJOR_MINOR_VERSION: "1.12"
  SEMVER_MAJOR_VERSION: "1"
  SEMVER_VERSION: 1.12.0
  SUFFIX: -dev
  VERSION: 1.12.0
contents:
  repositories:
    - https://dhi.io/apk/alpine/v3.24/main
    - https://dl-cdn.alpinelinux.org/alpine/v3.24/main
    - https://dl-cdn.alpinelinux.org/alpine/v3.24/community
  keyring:
    - https://dhi.io/keyring/dhi-apk@docker-0F81AD7700D99184.rsa.pub
  packages:
    - alpine-baselayout-data
    - apk-tools
    - busybox
    - ca-certificates
    - ca-certificates-bundle
    - mongodb-kubernetes-operator-dev=1.13.0-r2
    - tzdata
accounts:
  root: true
  run-as: root
  users:
    - name: nonroot
      uid: 65532
      gid: 65532
  groups:
    - name: nonroot
      gid: 65532
      members:
        - nonroot
os-release:
  name: Docker Hardened Images (Alpine)
  id: alpine
  version-id: "3.24"
  pretty-name: Docker Hardened Images/Alpine Linux v3.24
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
paths:
  - type: directory
    path: /usr/local/bin
    uid: 0
    gid: 0
  - type: symlink
    path: /usr/local/bin/mongodb-kubernetes-operator
    uid: 0
    gid: 0
    source: /usr/bin/mongodb-kubernetes-operator
annotations:
  org.opencontainers.image.description: A minimal MongoDB Controllers for Kubernetes image
  org.opencontainers.image.licenses: Apache-2.0
entrypoint:
  - /usr/local/bin/mongodb-kubernetes-operator
