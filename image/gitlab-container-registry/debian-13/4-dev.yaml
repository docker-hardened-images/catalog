# syntax=dhi.io/build:2-debian13

name: GitLab Container Registry 4.x (dev)
image: dhi.io/gitlab-container-registry
variant: dev
tags:
  - 4-dev
  - 4.41-dev
  - 4.41.0-dev
  - 4-debian-dev
  - 4-debian13-dev
  - 4.41-debian-dev
  - 4.41-debian13-dev
  - 4.41.0-debian-dev
  - 4.41.0-debian13-dev
platforms:
  - linux/amd64
  - linux/arm64
dates:
  release: "2026-06-24"
vars:
  FLAVORED_SUFFIX: -dev
  SEMVER_MAJOR_MINOR_VERSION: "4.41"
  SEMVER_MAJOR_VERSION: "4"
  SEMVER_VERSION: 4.41.0
  SUFFIX: -dev
  VERSION: 4.41.0-gitlab-0
contents:
  repositories:
    - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
  keyring:
    - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
  packages:
    - '!gawk'
    - '!libelogind0'
    - '!original-awk'
    - apt
    - base-files
    - bash
    - ca-certificates
    - ca-certificates-bundle
    - coreutils
    - diffutils
    - dpkg
    - findutils
    - gitlab-container-registry-dev=4.41.0-gitlab-0
    - grep
    - libc-bin
    - mawk
    - perl-base
    - sed
    - tzdata
    - util-linux
accounts:
  root: true
  run-as: root
  users:
    - name: nonroot
      uid: 65532
      gid: 65532
    - name: _apt
      uid: 42
      gid: 65532
  groups:
    - name: nonroot
      gid: 65532
      members:
        - nonroot
os-release:
  name: Docker Hardened Images (Debian)
  id: debian
  version-id: "13"
  version-codename: trixie
  pretty-name: Docker Hardened Images/Debian GNU/Linux 13 (trixie)
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
environment:
  DEBIAN_FRONTEND: noninteractive
paths:
  - type: file
    path: /etc/docker/registry/config.yml
    uid: 65532
    gid: 65532
    mode: "0644"
    source: image/gitlab-container-registry/config/config.yml
  - type: directory
    path: /var/lib/registry
    uid: 65532
    gid: 65532
    mode: "0770"
annotations:
  org.opencontainers.image.description: A minimal GitLab Container Registry image
  org.opencontainers.image.licenses: Apache-2.0
entrypoint:
  - registry
cmd:
  - serve
  - /etc/docker/registry/config.yml
ports:
  - 5000/tcp
  - 5001/tcp
