# syntax=dhi.io/build:2-alpine3.24

name: GitLab Container Registry 4.x
image: dhi.io/gitlab-container-registry
variant: runtime
tags:
  - 4-alpine
  - 4.41-alpine
  - 4-alpine3.24
  - 4.41.0-alpine
  - 4.41-alpine3.24
  - 4.41.0-alpine3.24
platforms:
  - linux/amd64
  - linux/arm64
dates:
  release: "2026-06-24"
vars:
  FLAVORED_SUFFIX: ""
  SEMVER_MAJOR_MINOR_VERSION: "4.41"
  SEMVER_MAJOR_VERSION: "4"
  SEMVER_VERSION: 4.41.0
  SUFFIX: ""
  VERSION: 4.41.0-gitlab-r0
contents:
  repositories:
    - https://dhi.io/apk/alpine/v3.24/main
    - https://dl-cdn.alpinelinux.org/alpine/v3.24/main
    - https://dl-cdn.alpinelinux.org/alpine/v3.24/community
  keyring:
    - https://dhi.io/keyring/dhi-apk@docker-0F81AD7700D99184.rsa.pub
