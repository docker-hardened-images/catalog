# syntax=dhi.io/build:2-debian13

name: ClamAV 1.5.x
image: dhi.io/clamav
variant: runtime
tags:
  - "1"
  - "1.5"
  - 1.5.4
  - 1-debian
  - 1-debian13
  - 1.5-debian
  - 1.5-debian13
  - 1.5.4-debian
  - 1.5.4-debian13
platforms:
  - linux/amd64
  - linux/arm64
dates:
  release: "2025-10-07"
vars:
  FLAVORED_SUFFIX: ""
  SEMVER_MAJOR_MINOR_VERSION: "1.5"
  SEMVER_MAJOR_VERSION: "1"
  SEMVER_VERSION: 1.5.4
  SUFFIX: ""
  VERSION: 1.5.4-1
contents:
  repositories:
    - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
  keyring:
    - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
  packages:
    - base-files
    - ca-certificates
    - ca-certificates-bundle
    - clamav-1.5=1.5.4-1
    - coreutils
    - dash
    - grep
    - libbz2-1.0
    - libc6
    - libcurl4t64
    - libgcc-s1
    - libjson-c5
    - libmilter1.0.1
    - libncurses6
    - libpcre2-8-0
    - libssl3t64
    - libstdc++6
    - libxml2
    - ncurses-base
    - netcat-openbsd
    - sed
    - tzdata
    - zlib1g
  files:
    - url: https://raw.githubusercontent.com/Cisco-Talos/clamav-docker/refs/heads/main/clamav/1.5/debian/scripts/docker-entrypoint-unprivileged.sh
      path: /usr/local/bin/docker-entrypoint-unprivileged.sh
      uid: 0
      gid: 0
      mode: "0755"
    - url: https://raw.githubusercontent.com/Cisco-Talos/clamav-docker/refs/heads/main/clamav/1.5/debian/scripts/docker-entrypoint.sh
      path: /usr/local/bin/docker-entrypoint.sh
      uid: 0
      gid: 0
      mode: "0755"
  builds:
    - name: update databases
      contents:
        repositories:
          - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
        keyring:
          - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
        packages:
          - coreutils
          - dash
          - clamav-1.5=1.5.4-1
          - ca-certificates
          - libbz2-1.0
          - libcurl4t64
          - libjson-c5
          - libmilter1.0.1
          - libncurses6
          - libpcre2-8-0
          - libssl3t64
          - libxml2
          - zlib1g
      pipeline:
        - name: update databases
          privileged: true
          runs: |
            set -eux -o pipefail

            mkdir -p /var/lib/clamav /var/log/clamav

            freshclam \
              --config-file=/etc/clamav/freshclam.conf \
              --user=$(whoami)

            rm -f /var/lib/clamav/freshclam.dat
            rm -f /var/lib/clamav/mirrors.dat
      outputs:
        - source: /var/lib/clamav
          target: /var/lib/clamav
          uid: 65532
          gid: 65532
          mode: "0755"
accounts:
  run-as: clamav
  users:
    - name: clamav
      uid: 65532
      gid: 65532
  groups:
    - name: clamav
      gid: 65532
      members:
        - clamav
os-release:
  name: Docker Hardened Images (Debian)
  id: debian
  version-id: "13"
  version-codename: trixie
  pretty-name: Docker Hardened Images/Debian GNU/Linux 13 (trixie)
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
environment:
  TZ: Etc/UTC
paths:
  - type: directory
    path: /run/clamav
    uid: 65532
    gid: 65532
    mode: "0755"
  - type: directory
    path: /run/lock
    uid: 65532
    gid: 65532
    mode: "0755"
  - type: directory
    path: /var/lib/clamav
    uid: 65532
    gid: 65532
    mode: "0755"
  - type: directory
    path: /var/log/clamav
    uid: 65532
    gid: 65532
    mode: "0755"
  - type: directory
    path: /tmp
    uid: 65532
    gid: 65532
    mode: "0755"
  - type: symlink
    path: /usr/local/bin/init
    uid: 65532
    gid: 65532
    mode: "0755"
    source: /usr/local/bin/docker-entrypoint.sh
  - type: symlink
    path: /usr/local/bin/init-unprivileged
    uid: 65532
    gid: 65532
    mode: "0755"
    source: /usr/local/bin/docker-entrypoint-unprivileged.sh
annotations:
  org.opencontainers.image.description: A minimal ClamAV image
  org.opencontainers.image.licenses: GPL-2.0
entrypoint:
  - /usr/local/bin/docker-entrypoint.sh
ports:
  - "3310"
  - "7357"
