# syntax=dhi.io/build:2-debian13

name: Ceph CSI 3.18.x
image: dhi.io/cephcsi
variant: runtime
tags:
  - "3"
  - "3.18"
  - 3.18.1
  - 3-debian
  - 3-debian13
  - 3.18-debian
  - 3.18-debian13
  - 3.18.1-debian
  - 3.18.1-debian13
platforms:
  - linux/amd64
  - linux/arm64
dates:
  release: "2020-07-27"
vars:
  CEPH_REFERENCE: dhi/ceph:20.2.4-debian13@sha256:df916bcded78aab87c1bac65dd46088a404f9662ab8f3accd1ba2e68ad8e1418
  COMMIT_SHA: e8688c3bf3d057daf1d7e679f3e0ed861a234c3b
  FLAVORED_SUFFIX: ""
  SEMVER_MAJOR_MINOR_VERSION: "3.18"
  SEMVER_MAJOR_VERSION: "3"
  SEMVER_VERSION: 3.18.1
  SUFFIX: ""
  VERSION: 3.18.1-5
contents:
  repositories:
    - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
  keyring:
    - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
  packages:
    - '!libpython3-stdlib'
    - '!libpython3.13-minimal'
    - '!libpython3.13-stdlib'
    - '!python3'
    - '!python3-minimal'
    - '!python3.13'
    - '!python3.13-minimal'
    - base-files
    - bash
    - ca-certificates-bundle
    - cephcsi=3.18.1-5
    - cryptsetup-bin
    - e2fsprogs
    - kmod
    - libc6
    - libnl-genl-3-200
    - mount
    - nfs-common
    - python-3.13
    - tzdata
    - util-linux
    - xfsprogs
  builds:
    - name: setcap
      contents:
        packages:
          - bash
          - base-files
          - coreutils
          - libcap2-bin
          - cephcsi=3.18.1-5
      pipeline:
        - name: setcap
          runs: |
            set -eux -o pipefail

            setcap 'cap_sys_admin,cap_dac_override+ep' /usr/bin/cephcsi
      outputs:
        - source: /usr/bin/cephcsi
          target: /usr/bin/cephcsi
          uid: 0
          gid: 0
  artifacts:
    - name: dhi.io/ceph:20.2.4-debian13@sha256:df916bcded78aab87c1bac65dd46088a404f9662ab8f3accd1ba2e68ad8e1418
      includes:
        - usr/bin/ceph
        - usr/bin/ceph-fuse
        - usr/bin/ceph.real
        - usr/bin/rbd
        - usr/bin/rbd-nbd
        - usr/lib/*-linux-gnu/lib*.so*
        - usr/lib/ceph/**
        - usr/lib/libceph*.so*
        - usr/lib/librados*.so*
        - usr/lib/librbd*.so*
        - usr/lib/python*/site-packages/**
      uid: 0
      gid: 0
accounts:
  run-as: nonroot
  users:
    - name: nonroot
      uid: 65532
      gid: 65532
  groups:
    - name: nonroot
      gid: 65532
      members:
        - nonroot
os-release:
  name: Docker Hardened Images (Debian)
  id: debian
  version-id: "13"
  version-codename: trixie
  pretty-name: Docker Hardened Images/Debian GNU/Linux 13 (trixie)
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
paths:
  - type: directory
    path: /etc/ceph
    uid: 65532
    gid: 65532
    mode: "0755"
  - type: directory
    path: /run/ceph
    uid: 65532
    gid: 65532
    mode: "0755"
  - type: symlink
    path: /etc/mtab
    uid: 0
    gid: 0
    source: /proc/mounts
  - type: symlink
    path: /usr/sbin/mount.ceph
    uid: 0
    gid: 0
    source: /usr/bin/mount
annotations:
  org.opencontainers.image.description: A minimal Ceph CSI image
  org.opencontainers.image.licenses: Apache-2.0
entrypoint:
  - /usr/bin/cephcsi
