# syntax=dhi.io/build:2-debian13

name: Hyperledger Fabric Orderer 2.x
image: dhi.io/hyperledger-fabric-orderer
variant: runtime
tags:
  - "2"
  - "2.5"
  - 2.5.16
  - 2-debian
  - 2-debian13
  - 2.5-debian
  - 2.5-debian13
  - 2.5.16-debian
  - 2.5.16-debian13
platforms:
  - linux/amd64
  - linux/arm64
dates:
  release: "2020-01-29"
vars:
  FLAVORED_SUFFIX: ""
  SEMVER_MAJOR_MINOR_VERSION: "2.5"
  SEMVER_MAJOR_VERSION: "2"
  SEMVER_VERSION: 2.5.16
  SUFFIX: ""
  VERSION: 2.5.16-13
contents:
  repositories:
    - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
  keyring:
    - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
  packages:
    - base-files
    - ca-certificates-bundle
    - fabric-2=2.5.16-13
    - tzdata
accounts:
  run-as: nonroot
  users:
    - name: nonroot
      uid: 65532
      gid: 65532
  groups:
    - name: nonroot
      gid: 65532
      members:
        - nonroot
os-release:
  name: Docker Hardened Images (Debian)
  id: debian
  version-id: "13"
  version-codename: trixie
  pretty-name: Docker Hardened Images/Debian GNU/Linux 13 (trixie)
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
environment:
  FABRIC_CFG_PATH: /etc/hyperledger/fabric
  FABRIC_VER: v2.5.16
paths:
  - type: directory
    path: /usr/local/bin
    uid: 0
    gid: 0
    mode: "0755"
  - type: symlink
    path: /usr/local/bin/orderer
    uid: 0
    gid: 0
    source: /usr/bin/orderer
  - type: directory
    path: /var/hyperledger/production/orderer
    uid: 65532
    gid: 65532
annotations:
  org.opencontainers.image.description: A minimal Hyperledger Fabric Orderer image
  org.opencontainers.image.licenses: Apache-2.0
cmd:
  - /usr/local/bin/orderer
  - start
ports:
  - 7050/tcp
