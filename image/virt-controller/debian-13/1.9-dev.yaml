# syntax=dhi.io/build:2-debian13

name: Virt Controller 1.9.x (dev)
image: dhi.io/virt-controller
variant: dev
tags:
  - 1-dev
  - 1.9-dev
  - 1.9.0-dev
  - 1-debian-dev
  - 1-debian13-dev
  - 1.9-debian-dev
  - 1.9-debian13-dev
  - 1.9.0-debian-dev
  - 1.9.0-debian13-dev
platforms:
  - linux/amd64
  - linux/arm64
dates:
  release: "2026-07-27"
vars:
  COMMIT_SHA: 79d34c1762169e5b0370ec491cef5ca12e6b504c
  SEMVER_MAJOR_MINOR_VERSION: "1.9"
  SEMVER_MAJOR_VERSION: "1"
  SEMVER_VERSION: 1.9.0
  VERSION: 1.9.0
contents:
  repositories:
    - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
  keyring:
    - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
  packages:
    - '!gawk'
    - '!libelogind0'
    - '!original-awk'
    - apt
    - base-files
    - bash
    - ca-certificates
    - ca-certificates-bundle
    - coreutils
    - diffutils
    - dpkg
    - findutils
    - grep
    - libc-bin
    - mawk
    - perl-base
    - sed
    - tzdata
    - util-linux
  builds:
    - name: virt-controller
      work-dir: /go/src/kubevirt.io/kubevirt
      caches:
        - path: /go/pkg/mod
      contents:
        packages:
          - bash
          - ca-certificates-bundle
          - coreutils
          - golang-1.26
          - findutils
          - mawk
          - sed
        files:
          - url: git+https://github.com/kubevirt/kubevirt.git#v1.9.0
            checksum: 79d34c1762169e5b0370ec491cef5ca12e6b504c
            path: /go/src/kubevirt.io/kubevirt
            spdx:
              name: virt-controller
              version: 1.9.0
              packages:
                - name: virt-controller
                  purl: pkg:golang/kubevirt.io/kubevirt@1.9.0
                  license: Apache-2.0
            uid: 0
            gid: 0
      pipeline:
        - name: patch go dependencies (1.9 only)
          uses: go/bump@v2
          with:
            deps:
              - github.com/containernetworking/plugins@v1.9.0
              - github.com/google/cel-go@v0.29.0
              - github.com/klauspost/compress@v1.18.7
              - go.mongodb.org/mongo-driver@v1.17.7
              - golang.org/x/net@v0.56.0
              - golang.org/x/text@v0.39.0
              - google.golang.org/grpc@v1.82.1
            download: true
        - name: test
          runs: |
            set -eux -o pipefail

            # -vet=off: virt-controller v1.5.x has non-constant format strings caught by Go 1.26's linting
            CGO_ENABLED=0 go test -vet=off ./cmd/virt-controller/... ./pkg/virt-controller/...
        - name: build
          uses: go/build@v1
          environment:
            GOFLAGS: -buildvcs=false
          with:
            ldflags:
              - -X kubevirt.io/client-go/version.gitVersion=v1.9.0
              - -X kubevirt.io/client-go/version.gitCommit=79d34c1762169e5b0370ec491cef5ca12e6b504c
            output: ${target.dir}/usr/local/bin/virt-controller
            packages: ./cmd/virt-controller
      paths:
        - type: directory
          path: ${source.dir}/patch
          uid: 0
          gid: 0
          source: image/virt-controller/patch
      outputs:
        - source: ${target.dir}/usr/local/bin/virt-controller
          target: /usr/local/bin/virt-controller
          uid: 0
          gid: 0
        - source: /opt/docker/sbom/virt-controller
          target: /opt/docker/sbom/virt-controller
          uid: 0
          gid: 0
accounts:
  root: true
  run-as: root
  users:
    - name: nonroot
      uid: 65532
      gid: 65532
    - name: _apt
      uid: 42
      gid: 65532
  groups:
    - name: nonroot
      gid: 65532
      members:
        - nonroot
os-release:
  name: Docker Hardened Images (Debian)
  id: debian
  version-id: "13"
  version-codename: trixie
  pretty-name: Docker Hardened Images/Debian GNU/Linux 13 (trixie)
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
environment:
  DEBIAN_FRONTEND: noninteractive
annotations:
  org.opencontainers.image.description: A minimal Virt Controller image
  org.opencontainers.image.licenses: Apache-2.0
entrypoint:
  - /usr/local/bin/virt-controller
ports:
  - 8182/tcp
