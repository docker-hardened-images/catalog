# syntax=dhi.io/build:2-debian13

name: Harbor Registry 2.15.x
image: dhi.io/harbor-registry
variant: runtime
tags:
  - "2"
  - "2.15"
  - 2.15.2
  - 2-debian
  - 2-debian13
  - 2.15-debian
  - 2.15-debian13
  - 2.15.2-debian
  - 2.15.2-debian13
platforms:
  - linux/amd64
  - linux/arm64
dates:
  release: "2026-03-19"
vars:
  FLAVORED_SUFFIX: ""
  SEMVER_MAJOR_MINOR_VERSION: "2.15"
  SEMVER_MAJOR_VERSION: "2"
  SEMVER_VERSION: 2.15.2
  SUFFIX: ""
  VERSION: 2.15.2-2
contents:
  repositories:
    - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
  keyring:
    - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
  packages:
    - base-files
    - ca-certificates-bundle
    - harbor-registry-2.15=2.15.2-2
    - tzdata
accounts:
  run-as: nonroot
  users:
    - name: nonroot
      uid: 65532
      gid: 65532
  groups:
    - name: nonroot
      gid: 65532
      members:
        - nonroot
os-release:
  name: Docker Hardened Images (Debian)
  id: debian
  version-id: "13"
  version-codename: trixie
  pretty-name: Docker Hardened Images/Debian GNU/Linux 13 (trixie)
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
paths:
  - type: directory
    path: /usr/local/bin
    uid: 0
    gid: 0
  - type: symlink
    path: /usr/local/bin/registry
    uid: 0
    gid: 0
    source: /usr/bin/registry
  - type: directory
    path: /etc/registry
    uid: 65532
    gid: 65532
    mode: "0755"
  - type: directory
    path: /storage
    uid: 65532
    gid: 65532
    mode: "0755"
annotations:
  org.opencontainers.image.description: A minimal Harbor Registry image
  org.opencontainers.image.licenses: Apache-2.0
entrypoint:
  - /usr/local/bin/registry
cmd:
  - serve
  - /etc/registry/config.yml
ports:
  - 5000/tcp
  - 5443/tcp
