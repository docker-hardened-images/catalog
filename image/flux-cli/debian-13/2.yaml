# syntax=dhi.io/build:2-debian13

name: Flux CLI 2.x
image: dhi.io/flux-cli
variant: runtime
tags:
  - "2"
  - "2.9"
  - 2.9.5
  - 2-debian
  - 2-debian13
  - 2.9-debian
  - 2.9-debian13
  - 2.9.5-debian
  - 2.9.5-debian13
platforms:
  - linux/amd64
  - linux/arm64
dates:
  release: "2026-02-27"
vars:
  FLAVORED_SUFFIX: ""
  SEMVER_MAJOR_MINOR_VERSION: "2.9"
  SEMVER_MAJOR_VERSION: "2"
  SEMVER_VERSION: 2.9.5
  SUFFIX: ""
  VERSION: 2.9.5-3
contents:
  repositories:
    - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
  keyring:
    - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
  packages:
    - base-files
    - ca-certificates-bundle
    - flux-cli=2.9.5-3
    - tzdata
accounts:
  run-as: nonroot
  users:
    - name: nonroot
      uid: 65532
      gid: 65532
  groups:
    - name: nonroot
      gid: 65532
      members:
        - nonroot
os-release:
  name: Docker Hardened Images (Debian)
  id: debian
  version-id: "13"
  version-codename: trixie
  pretty-name: Docker Hardened Images/Debian GNU/Linux 13 (trixie)
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
paths:
  - type: directory
    path: /usr/local/bin
    uid: 0
    gid: 0
  - type: symlink
    path: /usr/local/bin/flux-cli
    uid: 0
    gid: 0
    source: /usr/bin/flux-cli
  - type: symlink
    path: /usr/local/bin/flux
    uid: 0
    gid: 0
    source: /usr/local/bin/flux-cli
annotations:
  org.opencontainers.image.description: A minimal Flux CLI image
  org.opencontainers.image.licenses: Apache-2.0
entrypoint:
  - /usr/local/bin/flux-cli
