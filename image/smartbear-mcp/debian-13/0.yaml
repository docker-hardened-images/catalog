# syntax=dhi.io/build:2-debian13

name: SmartBear MCP Server 0.x
image: dhi.io/smartbear-mcp
variant: runtime
tags:
  - "0"
  - "0.26"
  - 0.26.1
  - 0-debian
  - 0-debian13
  - 0.26-debian
  - 0.26-debian13
  - 0.26.1-debian
  - 0.26.1-debian13
platforms:
  - linux/amd64
  - linux/arm64
dates:
  release: "2026-06-24"
vars:
  COMMIT_SHA: 273aa5031c9d955bebb21c6a389b5d79af67702a
  SEMVER_MAJOR_MINOR_VERSION: "0.26"
  SEMVER_MAJOR_VERSION: "0"
  SEMVER_VERSION: 0.26.1
  VERSION: 0.26.1
contents:
  repositories:
    - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
  keyring:
    - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
  packages:
    - base-files
    - ca-certificates-bundle
    - libc6
    - libgomp1
    - libstdc++6
    - netbase
    - nodejs-24
    - tzdata
  builds:
    - name: smartbear-mcp
      work-dir: ${source.dir}/smartbear-mcp
      caches:
        - path: /root/.npm
      contents:
        packages:
          - base-files
          - bash
          - ca-certificates
          - coreutils
          - findutils
          - git
          - libc6
          - libstdc++6
          - mawk
          - nodejs-24
          - node-corepack
          - npm
          - sed
          - yarn-classic
        files:
          - url: git+https://github.com/SmartBear/smartbear-mcp.git#v0.26.1
            checksum: 273aa5031c9d955bebb21c6a389b5d79af67702a
            path: ${source.dir}/smartbear-mcp
            spdx:
              name: smartbear-mcp
              version: 0.26.1
              packages:
                - name: '@smartbear/mcp'
                  purl: pkg:npm/%40smartbear/mcp@0.26.1
                  license: MIT
            uid: 0
            gid: 0
      pipeline:
        - name: install and build
          privileged: true
          runs: |
            set -eux -o pipefail

            npm ci
            npm run build

            rm -rf node_modules
            npm ci --ignore-scripts --omit=dev
            npm update --ignore-scripts --omit=dev
      outputs:
        - source: ${source.dir}/smartbear-mcp/dist
          target: /app/dist
          uid: 0
          gid: 0
        - source: ${source.dir}/smartbear-mcp/node_modules
          target: /app/node_modules
          uid: 0
          gid: 0
        - source: ${source.dir}/smartbear-mcp/package.json
          target: /app/package.json
          uid: 0
          gid: 0
        - source: /opt/docker/sbom/smartbear-mcp
          target: /opt/docker/sbom/smartbear-mcp
          uid: 0
          gid: 0
    - name: server.json
      contents:
        packages:
          - bash
          - sed
      pipeline:
        - runs: |
            set -eux -o pipefail

            sed -i "s/_VERSION_/0.26.1/g" "${source.dir}/config/server.json"
      paths:
        - type: file
          path: ${source.dir}/config/server.json
          uid: 0
          gid: 0
          source: image/smartbear-mcp/config/server.json
      attestations:
        - predicate-type: https://modelcontextprotocol.io/server.json/v1
          source: ${source.dir}/config/server.json
accounts:
  run-as: node
  users:
    - name: node
      uid: 1000
      gid: 1000
  groups:
    - name: node
      gid: 1000
      members:
        - node
os-release:
  name: Docker Hardened Images (Debian)
  id: debian
  version-id: "13"
  version-codename: trixie
  pretty-name: Docker Hardened Images/Debian GNU/Linux 13 (trixie)
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
work-dir: /app
environment:
  NODE_ENV: production
annotations:
  org.opencontainers.image.description: A minimal SmartBear MCP Server image
  org.opencontainers.image.licenses: MIT
labels:
  io.modelcontextprotocol.server.name: com.smartbear/smartbear-mcp
entrypoint:
  - node
  - /app/dist/index.js
