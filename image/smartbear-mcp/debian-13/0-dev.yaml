# syntax=dhi.io/build:2-debian13

name: SmartBear MCP Server 0.x (dev)
image: dhi.io/smartbear-mcp
variant: dev
tags:
  - 0-dev
  - 0.43-dev
  - 0.43.0-dev
  - 0-debian-dev
  - 0-debian13-dev
  - 0.43-debian-dev
  - 0.43-debian13-dev
  - 0.43.0-debian-dev
  - 0.43.0-debian13-dev
platforms:
  - linux/amd64
  - linux/arm64
dates:
  release: "2026-06-24"
vars:
  SEMVER_MAJOR_MINOR_VERSION: "0.43"
  SEMVER_MAJOR_VERSION: "0"
  SEMVER_VERSION: 0.43.0
  SMARTBEAR_MCP_PACKAGE: smartbear-mcp-0
  SMARTBEAR_MCP_PACKAGE_SUFFIX: ""
  SMARTBEAR_MCP_PKG_PIN: 0.43.0-2
  VERSION: 0.43.0-2
contents:
  repositories:
    - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
  keyring:
    - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
  packages:
    - '!gawk'
    - '!libelogind0'
    - '!original-awk'
    - apt
    - base-files
    - bash
    - ca-certificates
    - ca-certificates-bundle
    - coreutils
    - diffutils
    - dpkg
    - findutils
    - grep
    - libc-bin
    - libc6
    - libgomp1
    - libstdc++6
    - mawk
    - netbase
    - nodejs-24
    - perl-base
    - sed
    - smartbear-mcp-0=0.43.0-2
    - tzdata
    - util-linux
  builds:
    - name: server.json
      contents:
        packages:
          - bash
          - sed
      pipeline:
        - runs: |
            set -eux -o pipefail

            sed -i "s/_VERSION_/0.43.0/g" "${source.dir}/config/server.json"
      paths:
        - type: file
          path: ${source.dir}/config/server.json
          uid: 0
          gid: 0
          source: image/smartbear-mcp/config/server.json
      attestations:
        - predicate-type: https://modelcontextprotocol.io/server.json/v1
          source: ${source.dir}/config/server.json
accounts:
  root: true
  run-as: root
  users:
    - name: node
      uid: 1000
      gid: 1000
    - name: _apt
      uid: 42
      gid: 65532
  groups:
    - name: node
      gid: 1000
      members:
        - node
os-release:
  name: Docker Hardened Images (Debian)
  id: debian
  version-id: "13"
  version-codename: trixie
  pretty-name: Docker Hardened Images/Debian GNU/Linux 13 (trixie)
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
work-dir: /app
environment:
  DEBIAN_FRONTEND: noninteractive
  NODE_ENV: production
paths:
  - type: symlink
    path: /app
    uid: 0
    gid: 0
    source: /usr/lib/smartbear-mcp
annotations:
  org.opencontainers.image.description: A minimal SmartBear MCP Server image
  org.opencontainers.image.licenses: MIT
labels:
  io.modelcontextprotocol.server.name: com.smartbear/smartbear-mcp
entrypoint:
  - node
  - /app/dist/index.js
