# syntax=dhi.io/build:2-debian13

name: ktls-utils 1.x (dev)
image: dhi.io/ktls-utils
variant: dev
tags:
  - 1-dev
  - 1.4-dev
  - 1.4.0-dev
  - 1-debian-dev
  - 1-debian13-dev
  - 1.4-debian-dev
  - 1.4-debian13-dev
  - 1.4.0-debian-dev
  - 1.4.0-debian13-dev
platforms:
  - linux/amd64
  - linux/arm64
vars:
  SEMVER_MAJOR_MINOR_VERSION: "1.4"
  SEMVER_MAJOR_VERSION: "1"
  SEMVER_VERSION: 1.4.0
  VERSION: 1.4.0-0
contents:
  repositories:
    - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
  keyring:
    - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
  packages:
    - '!gawk'
    - '!libelogind0'
    - '!mawk'
    - '!original-awk'
    - apt
    - base-files
    - bash
    - ca-certificates
    - coreutils
    - diffutils
    - dpkg
    - findutils
    - grep
    - ktls-utils=1.4.0-0
    - libc-bin
    - libglib2.0-0t64
    - libgnutls30t64
    - libkeyutils1
    - libnl-3-200
    - libnl-genl-3-200
    - libyaml-0-2
    - mawk
    - perl-base
    - sed
    - tini
    - util-linux
accounts:
  root: true
  run-as: root
  users:
    - name: nonroot
      uid: 65532
      gid: 65532
    - name: _apt
      uid: 42
      gid: 65532
  groups:
    - name: nonroot
      gid: 65532
      members:
        - nonroot
os-release:
  name: Docker Hardened Images (Debian)
  id: debian
  version-id: "13"
  version-codename: trixie
  pretty-name: Docker Hardened Images/Debian GNU/Linux 13 (trixie)
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
environment:
  DEBIAN_FRONTEND: noninteractive
  KTLS_UTILS_VERSION: 1.4.0
annotations:
  org.opencontainers.image.description: A minimal ktls-utils image
  org.opencontainers.image.licenses: GPL-2.0
entrypoint:
  - /usr/bin/tini
  - -g
  - /usr/sbin/tlshd
  - --
  - --stderr
