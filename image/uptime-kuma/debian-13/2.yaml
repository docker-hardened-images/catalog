# syntax=dhi.io/build:2-debian13

name: Uptime Kuma 2.x
image: dhi.io/uptime-kuma
variant: runtime
tags:
  - "2"
  - "2.5"
  - 2.5.12
  - 2-debian
  - 2-debian13
  - 2.5-debian
  - 2.5-debian13
  - 2.5.12-debian
  - 2.5.12-debian13
platforms:
  - linux/amd64
  - linux/arm64
vars:
  COMMIT_SHA: 5aa5dec425f8a955b54e150636979a6927745ec5
  DEBIAN_VERSION: 2.5.12-0
  SEMVER_MAJOR_MINOR_VERSION: "2.5"
  SEMVER_MAJOR_VERSION: "2"
  SEMVER_VERSION: 2.5.12
  VERSION: 2.5.12
contents:
  repositories:
    - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
  keyring:
    - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
  packages:
    - base-files
    - ca-certificates-bundle
    - iputils-ping
    - libc6
    - libgomp1
    - libstdc++6
    - netbase
    - nodejs-24
    - tzdata
    - uptime-kuma-2=2.5.12-0
accounts:
  root: true
  run-as: node
  users:
    - name: node
      uid: 1000
      gid: 1000
  groups:
    - name: node
      gid: 1000
      members:
        - node
os-release:
  name: Docker Hardened Images (Debian)
  id: debian
  version-id: "13"
  version-codename: trixie
  pretty-name: Docker Hardened Images/Debian GNU/Linux 13 (trixie)
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
work-dir: /app
paths:
  - type: directory
    path: /app
    uid: 0
    gid: 0
    mode: "0755"
  - type: symlink
    path: /app/db
    uid: 0
    gid: 0
    source: /usr/lib/uptime-kuma-2/db
  - type: symlink
    path: /app/dist
    uid: 0
    gid: 0
    source: /usr/lib/uptime-kuma-2/dist
  - type: symlink
    path: /app/extra
    uid: 0
    gid: 0
    source: /usr/lib/uptime-kuma-2/extra
  - type: symlink
    path: /app/node_modules
    uid: 0
    gid: 0
    source: /usr/lib/uptime-kuma-2/node_modules
  - type: symlink
    path: /app/package.json
    uid: 0
    gid: 0
    source: /usr/lib/uptime-kuma-2/package.json
  - type: symlink
    path: /app/server
    uid: 0
    gid: 0
    source: /usr/lib/uptime-kuma-2/server
  - type: symlink
    path: /app/src
    uid: 0
    gid: 0
    source: /usr/lib/uptime-kuma-2/src
  - type: directory
    path: /app/data
    uid: 1000
    gid: 1000
    mode: "0755"
  - type: directory
    path: /app/sbom
    uid: 0
    gid: 0
    mode: "0755"
  - type: symlink
    path: /app/sbom/.spdx.dhi-uptime-kuma-frontend.json
    uid: 0
    gid: 0
    source: /opt/docker/sbom/uptime-kuma-2-frontend/.spdx.uptime-kuma-2-frontend.json
  - type: directory
    path: /opt/docker/sbom/dhi-uptime-kuma-frontend
    uid: 0
    gid: 0
    mode: "0755"
  - type: symlink
    path: /opt/docker/sbom/dhi-uptime-kuma-frontend/.spdx.dhi-uptime-kuma-frontend.json
    uid: 0
    gid: 0
    source: /opt/docker/sbom/uptime-kuma-2-frontend/.spdx.uptime-kuma-2-frontend.json
annotations:
  org.opencontainers.image.description: A minimal Uptime Kuma image
  org.opencontainers.image.licenses: MIT
cmd:
  - node
  - /app/server/server.js
ports:
  - 3001/tcp
