# syntax=dhi.io/build:2-debian13

name: Uptime Kuma 1.x (dev)
image: dhi.io/uptime-kuma
variant: dev
tags:
  - 1-dev
  - 1.23-dev
  - 1.23.17-dev
  - 1-debian-dev
  - 1-debian13-dev
  - 1.23-debian-dev
  - 1.23-debian13-dev
  - 1.23.17-debian-dev
  - 1.23.17-debian13-dev
platforms:
  - linux/amd64
  - linux/arm64
vars:
  COMMIT_SHA: 40ec7158534a28e6f8b431a628c53133c327c539
  DEBIAN_VERSION: 1.23.17-11
  SEMVER_MAJOR_MINOR_VERSION: "1.23"
  SEMVER_MAJOR_VERSION: "1"
  SEMVER_VERSION: 1.23.17
  VERSION: 1.23.17
contents:
  repositories:
    - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
  keyring:
    - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
  packages:
    - '!gawk'
    - '!libelogind0'
    - '!original-awk'
    - apt
    - base-files
    - bash
    - ca-certificates
    - ca-certificates-bundle
    - coreutils
    - diffutils
    - dpkg
    - findutils
    - grep
    - iputils-ping
    - libc-bin
    - libc6
    - libgomp1
    - libstdc++6
    - mawk
    - netbase
    - nodejs-24
    - perl-base
    - sed
    - tzdata
    - uptime-kuma-1=1.23.17-11
    - util-linux
accounts:
  root: true
  run-as: root
  users:
    - name: node
      uid: 1000
      gid: 1000
    - name: _apt
      uid: 42
      gid: 65532
  groups:
    - name: node
      gid: 1000
      members:
        - node
os-release:
  name: Docker Hardened Images (Debian)
  id: debian
  version-id: "13"
  version-codename: trixie
  pretty-name: Docker Hardened Images/Debian GNU/Linux 13 (trixie)
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
work-dir: /app
environment:
  DEBIAN_FRONTEND: noninteractive
paths:
  - type: directory
    path: /app
    uid: 0
    gid: 0
    mode: "0755"
  - type: symlink
    path: /app/db
    uid: 0
    gid: 0
    source: /usr/lib/uptime-kuma-1/db
  - type: symlink
    path: /app/dist
    uid: 0
    gid: 0
    source: /usr/lib/uptime-kuma-1/dist
  - type: symlink
    path: /app/extra
    uid: 0
    gid: 0
    source: /usr/lib/uptime-kuma-1/extra
  - type: symlink
    path: /app/node_modules
    uid: 0
    gid: 0
    source: /usr/lib/uptime-kuma-1/node_modules
  - type: symlink
    path: /app/package.json
    uid: 0
    gid: 0
    source: /usr/lib/uptime-kuma-1/package.json
  - type: symlink
    path: /app/server
    uid: 0
    gid: 0
    source: /usr/lib/uptime-kuma-1/server
  - type: symlink
    path: /app/src
    uid: 0
    gid: 0
    source: /usr/lib/uptime-kuma-1/src
  - type: directory
    path: /app/data
    uid: 1000
    gid: 1000
    mode: "0755"
  - type: directory
    path: /app/sbom
    uid: 0
    gid: 0
    mode: "0755"
  - type: symlink
    path: /app/sbom/.spdx.dhi-uptime-kuma-frontend.json
    uid: 0
    gid: 0
    source: /opt/docker/sbom/uptime-kuma-1-frontend/.spdx.uptime-kuma-1-frontend.json
  - type: directory
    path: /opt/docker/sbom/dhi-uptime-kuma-frontend
    uid: 0
    gid: 0
    mode: "0755"
  - type: symlink
    path: /opt/docker/sbom/dhi-uptime-kuma-frontend/.spdx.dhi-uptime-kuma-frontend.json
    uid: 0
    gid: 0
    source: /opt/docker/sbom/uptime-kuma-1-frontend/.spdx.uptime-kuma-1-frontend.json
annotations:
  org.opencontainers.image.description: A minimal Uptime Kuma image
  org.opencontainers.image.licenses: MIT
cmd:
  - node
  - /app/server/server.js
ports:
  - 3001/tcp
