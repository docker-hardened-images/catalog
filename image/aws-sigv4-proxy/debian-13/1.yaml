# syntax=dhi.io/build:2-debian13

name: AWS SigV4 Proxy 1.x
image: dhi.io/aws-sigv4-proxy
variant: runtime
tags:
  - "1"
  - "1.12"
  - 1-debian
  - 1-debian13
  - 1.12-debian
  - 1.12-debian13
platforms:
  - linux/amd64
  - linux/arm64
dates:
  release: "2021-08-24"
vars:
  FLAVORED_SUFFIX: ""
  SEMVER_MAJOR_MINOR_VERSION: "1.12"
  SEMVER_MAJOR_VERSION: "1"
  SEMVER_VERSION: "1.12"
  SUFFIX: ""
  VERSION: 1.12-0
contents:
  repositories:
    - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
  keyring:
    - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
  packages:
    - aws-sigv4-proxy=1.12-0
    - base-files
    - ca-certificates-bundle
    - tzdata
accounts:
  run-as: nonroot
  users:
    - name: nonroot
      uid: 65532
      gid: 65532
  groups:
    - name: nonroot
      gid: 65532
      members:
        - nonroot
os-release:
  name: Docker Hardened Images (Debian)
  id: debian
  version-id: "13"
  version-codename: trixie
  pretty-name: Docker Hardened Images/Debian GNU/Linux 13 (trixie)
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
paths:
  - type: directory
    path: /usr/local/bin
    uid: 0
    gid: 0
  - type: symlink
    path: /usr/local/bin/aws-sigv4-proxy
    uid: 0
    gid: 0
    source: /usr/bin/aws-sigv4-proxy
annotations:
  org.opencontainers.image.description: A minimal AWS SigV4 Proxy image
  org.opencontainers.image.licenses: Apache-2.0
entrypoint:
  - /usr/local/bin/aws-sigv4-proxy
