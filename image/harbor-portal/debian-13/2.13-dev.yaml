# syntax=dhi.io/build:2-debian13

name: Harbor Portal 2.13.x (dev)
image: dhi.io/harbor-portal
variant: dev
tags:
  - 2.13-dev
  - 2.13.5-dev
  - 2.13-debian-dev
  - 2.13-debian13-dev
  - 2.13.5-debian-dev
  - 2.13.5-debian13-dev
platforms:
  - linux/amd64
  - linux/arm64
dates:
  release: "2025-04-09"
vars:
  PACKAGE_NAME: harbor-portal-2.13
  SEMVER_MAJOR_MINOR_VERSION: "2.13"
  SEMVER_MAJOR_VERSION: "2"
  SEMVER_VERSION: 2.13.5
  VERSION: 2.13.5-1
contents:
  repositories:
    - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
  keyring:
    - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
  packages:
    - '!gawk'
    - '!libelogind0'
    - '!original-awk'
    - apt
    - base-files
    - bash
    - ca-certificates
    - ca-certificates-bundle
    - coreutils
    - diffutils
    - dpkg
    - findutils
    - grep
    - harbor-portal-2.13=2.13.5-1
    - libc-bin
    - libc6
    - libcrypt1
    - libpcre2-8-0
    - libssl3t64
    - mawk
    - nginx-mainline
    - perl-base
    - sed
    - tzdata
    - util-linux
    - zlib1g
accounts:
  root: true
  run-as: root
  users:
    - name: nginx
      uid: 65532
      gid: 65532
    - name: _apt
      uid: 42
      gid: 65532
  groups:
    - name: nginx
      gid: 65532
      members:
        - nginx
os-release:
  name: Docker Hardened Images (Debian)
  id: debian
  version-id: "13"
  version-codename: trixie
  pretty-name: Docker Hardened Images/Debian GNU/Linux 13 (trixie)
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
environment:
  DEBIAN_FRONTEND: noninteractive
  PATH: /usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
paths:
  - type: directory
    path: /run
    uid: 65532
    gid: 65532
    mode: "0755"
  - type: file
    path: /etc/nginx/nginx.conf
    uid: 65532
    gid: 65532
    mode: "0644"
    source: image/harbor-portal/config/default.conf
  - type: directory
    path: /tmp
    uid: 65532
    gid: 65532
    mode: "1777"
  - type: symlink
    path: /var/log/nginx/access.log
    uid: 0
    gid: 0
    source: /dev/stdout
  - type: symlink
    path: /var/log/nginx/error.log
    uid: 0
    gid: 0
    source: /dev/stderr
  - type: directory
    path: /cache/nginx
    uid: 65532
    gid: 65532
    mode: "0755"
annotations:
  org.opencontainers.image.description: A minimal Harbor Portal web interface image.
  org.opencontainers.image.licenses: Apache-2.0
cmd:
  - nginx
  - -g
  - daemon off;
ports:
  - 8080/tcp
