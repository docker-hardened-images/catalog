# syntax=dhi.io/build:2-debian13

name: GitLab Sidekiq 19.x (dev)
image: dhi.io/gitlab-sidekiq
variant: dev
tags:
  - 19-dev
  - 19.4-dev
  - 19.4.2-dev
  - 19-debian-dev
  - 19-debian13-dev
  - 19.4-debian-dev
  - 19.4-debian13-dev
  - 19.4.2-debian-dev
  - 19.4.2-debian13-dev
platforms:
  - linux/amd64
  - linux/arm64
dates:
  release: "2026-05-21"
vars:
  BINUTILS_ARCH: '#{ target.arch == "amd64" ? "x86-64" : "aarch64" }'
  COSIGN_VERSION: 2.6.5-12
  PYTHON_MAJOR_MINOR_VERSION: "3.12"
  PYTHON_VERSION: 3.12.16-1
  RUBY_MAJOR_MINOR_VERSION: "3.3"
  RUBY_VERSION: 3.3.13-0
  SEMVER_MAJOR_MINOR_VERSION: "19.4"
  SEMVER_MAJOR_VERSION: "19"
  SEMVER_VERSION: 19.4.2
  VERSION: 19.4.2-0
contents:
  repositories:
    - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
  keyring:
    - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
  packages:
    - '!binutils'
    - '!binutils-aarch64-linux-gnu'
    - '!binutils-common'
    - '!binutils-x86-64-linux-gnu'
    - '!gawk'
    - '!libbinutils'
    - '!libctf-nobfd0'
    - '!libctf0'
    - '!libelogind0'
    - '!libgprofng0'
    - '!libsframe1'
    - '!mawk'
    - '!original-awk'
    - apt
    - base-files
    - bash
    - binutils-latest
    - binutils-latest-${BINUTILS_ARCH}-linux-gnu
    - build-essential
    - ca-certificates
    - ca-certificates-bundle
    - coreutils
    - cosign-2=2.6.5-12
    - diffutils
    - dpkg
    - exiftool-gitlab
    - findutils
    - git
    - gitlab-rails-19=19.4.2-0
    - grep
    - gzip
    - libbsd0
    - libbz2-1.0
    - libc-bin
    - libc6
    - libcrypt1
    - libctf-nobfd0-latest
    - libctf0-latest
    - libcurl4t64
    - libdb5.3t64
    - libexpat1
    - libffi8
    - libgcc-s1
    - libgdbm-compat4t64
    - libgdbm6t64
    - libgmp10
    - libgprofng0-latest
    - libgssapi-krb5-2
    - libicu76
    - libjemalloc2
    - libk5crypto3
    - libkrb5-3
    - libkrb5support0
    - liblz1
    - liblzma5
    - libmagic-mgc
    - libmagic1t64
    - libncursesw6
    - libpq5
    - libpython-3.12-minimal=3.12.16-1
    - libpython-3.12-stdlib=3.12.16-1
    - libpython-3.12=3.12.16-1
    - libre2-11
    - libreadline8t64
    - libseccomp2
    - libsqlite3-0
    - libssh2-1t64
    - libssl3t64
    - libstdc++6
    - libtinfo6
    - libuuid1
    - libxml2
    - libyaml-0-2
    - libzstd1
    - mawk
    - openssh-client
    - perl
    - perl-base
    - postgresql-client-17
    - procps
    - python-3.12-minimal=3.12.16-1
    - python-3.12=3.12.16-1
    - python3-pip-whl
    - python3-setuptools-whl
    - ruby-3.3=3.3.13-0
    - sed
    - tzdata
    - tzdata-legacy
    - util-linux
    - xtail
    - zlib1g
  builds:
    - name: scripts
      contents:
        packages:
          - bash
          - coreutils
          - findutils
      pipeline:
        - name: install scripts
          runs: |
            set -eux -o pipefail

            mkdir -p ${target.dir}/scripts
            cp -a /scripts-src/. ${target.dir}/scripts/
            find ${target.dir}/scripts -maxdepth 1 -type f ! -name LICENSE -exec chmod 0755 {} +
      paths:
        - type: directory
          path: /scripts-src
          uid: 0
          gid: 0
          source: image/gitlab-sidekiq/scripts
      outputs:
        - source: ${target.dir}/scripts
          target: /scripts
          uid: 0
          gid: 0
    - name: locale
      contents:
        packages:
          - bash
          - locales
          - coreutils
          - gzip
      pipeline:
        - name: install locales
          runs: |
            set -eux -o pipefail

            ln -s /etc/locale.alias /usr/share/locale/locale.alias

            echo "en_US.UTF-8 UTF-8" >> /etc/locale.gen
            locale-gen en_US.UTF-8
      outputs:
        - source: /usr/share/locale
          target: /usr/share/locale
          uid: 0
          gid: 0
        - source: /usr/lib/locale
          target: /usr/lib/locale
          uid: 0
          gid: 0
accounts:
  root: true
  run-as: root
  users:
    - name: git
      uid: 1000
      gid: 1000
    - name: nonroot
      uid: 65532
      gid: 65532
    - name: _apt
      uid: 42
      gid: 65532
  groups:
    - name: git
      gid: 1000
      members:
        - git
    - name: nonroot
      gid: 65532
      members:
        - nonroot
os-release:
  name: Docker Hardened Images (Debian)
  id: debian
  version-id: "13"
  version-codename: trixie
  pretty-name: Docker Hardened Images/Debian GNU/Linux 13 (trixie)
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
environment:
  BOOTSNAP_CACHE_DIR: /srv/gitlab/bootsnap
  BUNDLE_DEPLOYMENT: "true"
  BUNDLE_PATH: /srv/gitlab/vendor/bundle
  BUNDLE_WITHOUT: development:test:mysql:aws
  CONFIG_TEMPLATE_DIRECTORY: /srv/gitlab/config
  DEBIAN_FRONTEND: noninteractive
  EXECJS_RUNTIME: Disabled
  LANG: en_US.UTF-8
  LANGUAGE: en_US:en
  LC_ALL: en_US.UTF-8
  RAILS_ENV: production
  RUBYOPT: -W:no-experimental
  SIDEKIQ_CONCURRENCY: "25"
  SIDEKIQ_TIMEOUT: "25"
  UPGRADE_STATUS_DIR: /var/opt/gitlab/.upgrade-status
  USE_GITLAB_LOGGER: "0"
paths:
  - type: directory
    path: /var/opt/gitlab
    uid: 1000
    gid: 1000
    mode: "0770"
  - type: directory
    path: /var/log/gitlab
    uid: 1000
    gid: 1000
    mode: "0770"
  - type: directory
    path: /srv/gitlab/tmp
    uid: 1000
    gid: 1000
    mode: "0755"
  - type: directory
    path: /srv/gitlab/config
    uid: 1000
    gid: 1000
    mode: "0755"
  - type: directory
    path: /srv/gitlab/bootsnap
    uid: 1000
    gid: 1000
    mode: "0755"
  - type: directory
    path: /home/git
    uid: 1000
    gid: 1000
    mode: "0755"
  - type: directory
    path: /home/git/gitlab-shell
    uid: 1000
    gid: 1000
    mode: "0755"
  - type: directory
    path: /srv/gitlab/shared/artifacts
    uid: 1000
    gid: 1000
    mode: "0755"
  - type: directory
    path: /srv/gitlab/shared/pages
    uid: 1000
    gid: 1000
    mode: "0755"
  - type: directory
    path: /srv/gitlab/builds
    uid: 1000
    gid: 1000
    mode: "0755"
  - type: directory
    path: /srv/gitlab/public/uploads
    uid: 1000
    gid: 1000
    mode: "0755"
  - type: directory
    path: /usr/local/bin
    uid: 0
    gid: 0
  - type: symlink
    path: /usr/local/bin/cosign
    uid: 0
    gid: 0
    source: /usr/bin/cosign
annotations:
  org.opencontainers.image.description: A minimal GitLab Sidekiq image
  org.opencontainers.image.licenses: MIT AND CC-BY-SA-4.0
entrypoint:
  - /scripts/entrypoint.sh
cmd:
  - /scripts/process-wrapper
