# syntax=dhi.io/build:2-debian13

name: GitLab Sidekiq 19.x
image: dhi.io/gitlab-sidekiq
variant: runtime
tags:
  - "19"
  - "19.5"
  - 19.5.5
  - 19-debian
  - 19-debian13
  - 19.5-debian
  - 19.5-debian13
  - 19.5.5-debian
  - 19.5.5-debian13
platforms:
  - linux/amd64
  - linux/arm64
dates:
  release: "2026-05-21"
vars:
  COSIGN_VERSION: 2.6.5-13
  PYTHON_MAJOR_MINOR_VERSION: "3.12"
  PYTHON_VERSION: 3.12.16-7
  RUBY_MAJOR_MINOR_VERSION: "3.3"
  RUBY_VERSION: 3.3.13-1
  SEMVER_MAJOR_MINOR_VERSION: "19.5"
  SEMVER_MAJOR_VERSION: "19"
  SEMVER_VERSION: 19.5.5
  VERSION: 19.5.5-1
contents:
  repositories:
    - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
  keyring:
    - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
  packages:
    - '!libelogind0'
    - '!mawk'
    - '!original-awk'
    - base-files
    - bash
    - ca-certificates
    - ca-certificates-bundle
    - coreutils
    - cosign-2=2.6.5-13
    - exiftool-gitlab
    - findutils
    - git
    - gitlab-rails-19=19.5.5-1
    - grep
    - gzip
    - libbsd0
    - libbz2-1.0
    - libc-bin
    - libc6
    - libcrypt1
    - libcurl4t64
    - libdb5.3t64
    - libexpat1
    - libffi8
    - libgcc-s1
    - libgdbm-compat4t64
    - libgdbm6t64
    - libgmp10
    - libgssapi-krb5-2
    - libicu76
    - libjemalloc2
    - libk5crypto3
    - libkrb5-3
    - libkrb5support0
    - liblz1
    - liblzma5
    - libmagic-mgc
    - libmagic1t64
    - libncursesw6
    - libpq5
    - libpython-3.12-minimal=3.12.16-7
    - libpython-3.12-stdlib=3.12.16-7
    - libpython-3.12=3.12.16-7
    - libre2-11
    - libreadline8t64
    - libseccomp2
    - libsqlite3-0
    - libssh2-1t64
    - libssl3t64
    - libstdc++6
    - libtinfo6
    - libuuid1
    - libxml2
    - libyaml-0-2
    - libzstd1
    - mawk
    - openssh-client
    - perl
    - postgresql-client-17
    - procps
    - python-3.12-minimal=3.12.16-7
    - python-3.12=3.12.16-7
    - python3-pip-whl
    - python3-setuptools-whl
    - ruby-3.3=3.3.13-1
    - sed
    - tzdata
    - tzdata-legacy
    - xtail
    - zlib1g
accounts:
  run-as: git
  users:
    - name: git
      uid: 1000
      gid: 1000
  groups:
    - name: git
      gid: 1000
      members:
        - git
os-release:
  name: Docker Hardened Images (Debian)
  id: debian
  version-id: "13"
  version-codename: trixie
  pretty-name: Docker Hardened Images/Debian GNU/Linux 13 (trixie)
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
environment:
  BOOTSNAP_CACHE_DIR: /srv/gitlab/bootsnap
  BUNDLE_DEPLOYMENT: "true"
  BUNDLE_PATH: /srv/gitlab/vendor/bundle
  BUNDLE_WITHOUT: development:test:mysql:aws
  CONFIG_TEMPLATE_DIRECTORY: /srv/gitlab/config
  EXECJS_RUNTIME: Disabled
  LANG: C.UTF-8
  RAILS_ENV: production
  RUBYOPT: -W:no-experimental
  SIDEKIQ_CONCURRENCY: "25"
  SIDEKIQ_TIMEOUT: "25"
  UPGRADE_STATUS_DIR: /var/opt/gitlab/.upgrade-status
  USE_GITLAB_LOGGER: "0"
