# syntax=dhi.io/build:2-alpine3.24

name: GitLab Sidekiq 18.x (dev)
image: dhi.io/gitlab-sidekiq
variant: dev
tags:
  - 18-alpine-dev
  - 18.11-alpine-dev
  - 18-alpine3.24-dev
  - 18.11.14-alpine-dev
  - 18.11-alpine3.24-dev
  - 18.11.14-alpine3.24-dev
platforms:
  - linux/amd64
  - linux/arm64
dates:
  release: "2025-05-14"
vars:
  COSIGN_VERSION: 2.6.5-r12
  PYTHON_MAJOR_MINOR_VERSION: "3.12"
  PYTHON_VERSION: 3.12.16-r1
  RUBY_MAJOR_MINOR_VERSION: "3.3"
  RUBY_VERSION: 3.3.13-r3
  SEMVER_MAJOR_MINOR_VERSION: "18.11"
  SEMVER_MAJOR_VERSION: "18"
  SEMVER_VERSION: 18.11.14
  VERSION: 18.11.14-r0
contents:
  repositories:
    - https://dhi.io/apk/alpine/v3.24/main
    - https://dl-cdn.alpinelinux.org/alpine/v3.24/main
    - https://dl-cdn.alpinelinux.org/alpine/v3.24/community
  keyring:
    - https://dhi.io/keyring/dhi-apk@docker-0F81AD7700D99184.rsa.pub
  packages:
    - alpine-baselayout-data
    - apk-tools
    - bash
    - busybox
    - ca-certificates
    - ca-certificates-bundle
    - coreutils
    - cosign-2
    - exiftool-gitlab
    - git
    - gitlab-rails-18=18.11.14-r0
    - gzip
    - musl-utils
    - openssh-client-default
    - perl
    - postgresql17-client
    - procps-ng
    - python-3.12
    - ruby-3.3
    - ruby3.3-bundler
    - tzdata
  builds:
    - name: scripts
      contents:
        packages:
          - bash
          - coreutils
          - findutils
      pipeline:
        - name: install scripts
          runs: |
            set -eux -o pipefail

            mkdir -p ${target.dir}/scripts
            cp -a /scripts-src/. ${target.dir}/scripts/
            find ${target.dir}/scripts -maxdepth 1 -type f ! -name LICENSE -exec chmod 0755 {} +
      paths:
        - type: directory
          path: /scripts-src
          uid: 0
          gid: 0
          source: image/gitlab-sidekiq/scripts
      outputs:
        - source: ${target.dir}/scripts
          target: /scripts
          uid: 0
          gid: 0
accounts:
  root: true
  run-as: root
  users:
    - name: git
      uid: 1000
      gid: 1000
  groups:
    - name: git
      gid: 1000
      members:
        - git
os-release:
  name: Docker Hardened Images (Alpine)
  id: alpine
  version-id: "3.24"
  pretty-name: Docker Hardened Images/Alpine Linux v3.24
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
environment:
  BOOTSNAP_CACHE_DIR: /srv/gitlab/bootsnap
  BUNDLE_DEPLOYMENT: "true"
  BUNDLE_PATH: /srv/gitlab/vendor/bundle
  BUNDLE_WITHOUT: development:test:mysql:aws
  CONFIG_TEMPLATE_DIRECTORY: /srv/gitlab/config
  EXECJS_RUNTIME: Disabled
  LANG: C.UTF-8
  RAILS_ENV: production
  RUBYOPT: -W:no-experimental
  SIDEKIQ_CONCURRENCY: "25"
  SIDEKIQ_TIMEOUT: "25"
  UPGRADE_STATUS_DIR: /var/opt/gitlab/.upgrade-status
  USE_GITLAB_LOGGER: "0"
paths:
  - type: directory
    path: /var/opt/gitlab
    uid: 1000
    gid: 1000
    mode: "0770"
  - type: directory
    path: /var/log/gitlab
    uid: 1000
    gid: 1000
    mode: "0770"
  - type: directory
    path: /srv/gitlab/tmp
    uid: 1000
    gid: 1000
    mode: "0755"
  - type: directory
    path: /srv/gitlab/config
    uid: 1000
    gid: 1000
    mode: "0755"
  - type: directory
    path: /srv/gitlab/bootsnap
    uid: 1000
    gid: 1000
    mode: "0755"
  - type: directory
    path: /home/git
    uid: 1000
    gid: 1000
    mode: "0755"
  - type: directory
    path: /home/git/gitlab-shell
    uid: 1000
    gid: 1000
    mode: "0755"
  - type: directory
    path: /srv/gitlab/shared/artifacts
    uid: 1000
    gid: 1000
    mode: "0755"
  - type: directory
    path: /srv/gitlab/shared/pages
    uid: 1000
    gid: 1000
    mode: "0755"
  - type: directory
    path: /srv/gitlab/builds
    uid: 1000
    gid: 1000
    mode: "0755"
  - type: directory
    path: /srv/gitlab/public/uploads
    uid: 1000
    gid: 1000
    mode: "0755"
  - type: directory
    path: /usr/local/bin
    uid: 0
    gid: 0
  - type: symlink
    path: /usr/local/bin/cosign
    uid: 0
    gid: 0
    source: /usr/bin/cosign
annotations:
  org.opencontainers.image.description: A minimal GitLab Sidekiq image
  org.opencontainers.image.licenses: MIT AND CC-BY-SA-4.0
entrypoint:
  - /scripts/entrypoint.sh
cmd:
  - /scripts/process-wrapper
