# syntax=dhi.io/build:2-debian13

name: Authelia 4.x (dev)
image: dhi.io/authelia
variant: dev
tags:
  - 4-dev
  - 4.39-dev
  - 4.39.28-dev
  - 4-debian-dev
  - 4-debian13-dev
  - 4.39-debian-dev
  - 4.39-debian13-dev
  - 4.39.28-debian-dev
  - 4.39.28-debian13-dev
platforms:
  - linux/amd64
  - linux/arm64
dates:
  release: "2019-12-10"
vars:
  COMMIT_SHA: 8da42b2348b0351c6284a2940a9c5eec3d4cd3fd
  ENTRYPOINT_CHECKSUM: sha256:d502e328c209351082ad6fe72191ecf1f26ceb779b6deb3e7417338f97d56d79
  FLAVORED_SUFFIX: -dev
  SEMVER_MAJOR_MINOR_VERSION: "4.39"
  SEMVER_MAJOR_VERSION: "4"
  SEMVER_VERSION: 4.39.28
  SUFFIX: -dev
  VERSION: 4.39.28-17
contents:
  repositories:
    - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
  keyring:
    - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
  packages:
    - '!gawk'
    - '!libelogind0'
    - '!original-awk'
    - apt
    - authelia-4-dev=4.39.28-17
    - base-files
    - bash
    - ca-certificates
    - ca-certificates-bundle
    - coreutils
    - diffutils
    - dpkg
    - findutils
    - grep
    - libc-bin
    - libc6
    - mawk
    - perl-base
    - sed
    - tzdata
    - util-linux
  builds:
    - name: locale
      contents:
        packages:
          - bash
          - locales
          - coreutils
          - gzip
      pipeline:
        - name: install locales
          runs: |
            set -eux -o pipefail

            ln -s /etc/locale.alias /usr/share/locale/locale.alias

            echo "en_US.UTF-8 UTF-8" >> /etc/locale.gen
            locale-gen en_US.UTF-8
      outputs:
        - source: /usr/share/locale
          target: /usr/share/locale
          uid: 0
          gid: 0
        - source: /usr/lib/locale
          target: /usr/lib/locale
          uid: 0
          gid: 0
accounts:
  root: true
  run-as: root
  users:
    - name: nonroot
      uid: 65532
      gid: 65532
    - name: _apt
      uid: 42
      gid: 65532
  groups:
    - name: nonroot
      gid: 65532
      members:
        - nonroot
os-release:
  name: Docker Hardened Images (Debian)
  id: debian
  version-id: "13"
  version-codename: trixie
  pretty-name: Docker Hardened Images/Debian GNU/Linux 13 (trixie)
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
work-dir: /app
environment:
  DEBIAN_FRONTEND: noninteractive
  LANG: en_US.UTF-8
  LANGUAGE: en_US:en
  LC_ALL: en_US.UTF-8
  PGID: "0"
  PUID: "0"
  X_AUTHELIA_CONFIG: /config/configuration.yml
paths:
  - type: directory
    path: /app
    uid: 0
    gid: 0
    mode: "0755"
  - type: symlink
    path: /app/authelia
    uid: 0
    gid: 0
    source: /usr/bin/authelia
  - type: directory
    path: /config
    uid: 65532
    gid: 65532
    mode: "0770"
annotations:
  org.opencontainers.image.description: A minimal Authelia image
  org.opencontainers.image.licenses: Apache-2.0
entrypoint:
  - /usr/bin/authelia
ports:
  - 9091/tcp
