# syntax=dhi.io/build:2-debian13

name: Rundeck 6.x
image: dhi.io/rundeck
variant: runtime
tags:
  - "6"
  - "6.3"
  - 6.3.0
  - 6-debian
  - 6-debian13
  - 6.3-debian
  - 6.3-debian13
  - 6.3.0-debian
  - 6.3.0-debian13
platforms:
  - linux/amd64
  - linux/arm64
dates:
  release: "2026-08-03"
vars:
  FLAVORED_SUFFIX: ""
  REMCO_DEB_VERSION: 0.12.6-11
  SEMVER_MAJOR_MINOR_VERSION: "6.3"
  SEMVER_MAJOR_VERSION: "6"
  SEMVER_VERSION: 6.3.0
  SUFFIX: ""
  VERSION: 6.3.0-7
contents:
  repositories:
    - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
  keyring:
    - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
  packages:
    - '!libelogind0'
    - '!mawk'
    - '!original-awk'
    - base-files
    - bash
    - ca-certificates-bundle
    - coreutils
    - curl
    - dash
    - eclipse-temurin-21-jre
    - eclipse-temurin-21-jre-oci-config
    - findutils
    - gawk
    - grep
    - hostname
    - libc6
    - libstdc++6
    - openssh-client
    - remco=0.12.6-11
    - rundeck=6.3.0-7
    - sed
    - tini
    - tzdata
    - unzip
    - util-linux
    - uuid-runtime
accounts:
  run-as: nonroot
  users:
    - name: nonroot
      uid: 65532
      gid: 65532
  groups:
    - name: nonroot
      gid: 65532
      members:
        - nonroot
os-release:
  name: Docker Hardened Images (Debian)
  id: debian
  version-id: "13"
  version-codename: trixie
  pretty-name: Docker Hardened Images/Debian GNU/Linux 13 (trixie)
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
work-dir: /home/rundeck
environment:
  JAVA_HOME: /usr/lib/jvm/temurin-21
  PATH: /usr/lib/jvm/temurin-21/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
  RUNDECK_HOME: /home/rundeck
paths:
  - type: directory
    path: /usr/share/rundeck/server/data
    uid: 65532
    gid: 65532
    mode: "0770"
    recursive: true
  - type: directory
    path: /usr/share/rundeck/var
    uid: 65532
    gid: 65532
    mode: "0770"
    recursive: true
  - type: directory
    path: /usr/share/rundeck/var/logs
    uid: 65532
    gid: 65532
    mode: "0770"
    recursive: true
  - type: directory
    path: /usr/share/rundeck/server/config
    uid: 65532
    gid: 65532
    mode: "0770"
    recursive: true
  - type: directory
    path: /usr/share/rundeck/etc
    uid: 65532
    gid: 65532
    mode: "0770"
    recursive: true
  - type: directory
    path: /usr/share/rundeck/libext
    uid: 65532
    gid: 65532
    mode: "0770"
    recursive: true
  - type: directory
    path: /usr/share/rundeck/repository
    uid: 65532
    gid: 65532
    mode: "0770"
    recursive: true
  - type: directory
    path: /usr/share/rundeck/projects
    uid: 65532
    gid: 65532
    mode: "0770"
    recursive: true
  - type: directory
    path: /usr/share/rundeck/user-assets
    uid: 65532
    gid: 65532
    mode: "0770"
    recursive: true
  - type: directory
    path: /usr/share/rundeck/server/addons
    uid: 0
    gid: 0
    mode: "0755"
  - type: directory
    path: /usr/share/rundeck/server/lib
    uid: 0
    gid: 0
    mode: "0755"
  - type: directory
    path: /usr/share/rundeck/server/work
    uid: 0
    gid: 0
    mode: "0755"
  - type: symlink
    path: /home/rundeck
    uid: 0
    gid: 0
    source: /usr/share/rundeck
annotations:
  org.opencontainers.image.description: A minimal Rundeck image
  org.opencontainers.image.licenses: Apache-2.0
entrypoint:
  - /usr/bin/tini
  - --
  - docker-lib/entry.sh
ports:
  - 4440/tcp
