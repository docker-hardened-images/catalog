# syntax=dhi.io/build:2-alpine3.24

name: Rundeck 6.x
image: dhi.io/rundeck
variant: runtime
tags:
  - 6-alpine
  - 6.2-alpine
  - 6-alpine3.24
  - 6.2.1-alpine
  - 6.2-alpine3.24
  - 6.2.1-alpine3.24
platforms:
  - linux/amd64
  - linux/arm64
dates:
  release: "2026-08-03"
vars:
  COMMIT_SHA: e649f088e039b0fabbbb7039f730cbbcc183f82d
  FLAVORED_SUFFIX: ""
  REMCO_APK_VERSION: 0.12.6-r7
  SEMVER_MAJOR_MINOR_VERSION: "6.2"
  SEMVER_MAJOR_VERSION: "6"
  SEMVER_VERSION: 6.2.1
  SUFFIX: ""
  VERSION: 6.2.1
contents:
  repositories:
    - https://dhi.io/apk/alpine/v3.24/main
    - https://dl-cdn.alpinelinux.org/alpine/v3.24/main
    - https://dl-cdn.alpinelinux.org/alpine/v3.24/community
  keyring:
    - https://dhi.io/keyring/dhi-apk@docker-0F81AD7700D99184.rsa.pub
  packages:
    - alpine-baselayout-data
    - bash
    - ca-certificates-bundle
    - coreutils
    - curl
    - eclipse-temurin-21-jre
    - eclipse-temurin-21-jre-oci-config
    - findutils
    - grep
    - libgcc
    - libstdc++
    - musl
    - openssh-client
    - remco=0.12.6-r7
    - sed
    - tini
    - tzdata
    - unzip
    - util-linux
    - zlib
  builds:
    - name: rundeck
      work-dir: ${source.dir}/rundeck
      caches:
        - path: /root/.gradle
      contents:
        packages:
          - bash
          - coreutils
          - findutils
          - git
          - sed
          - grep
          - ca-certificates
          - eclipse-temurin-21-jdk
          - nodejs-24
          - npm
        files:
          - url: git+https://github.com/rundeck/rundeck.git#e649f088e039b0fabbbb7039f730cbbcc183f82d
            checksum: e649f088e039b0fabbbb7039f730cbbcc183f82d
            path: ${source.dir}/rundeck
            spdx:
              name: rundeck
              version: 6.2.1
              packages:
                - name: rundeck
                  purl: pkg:github/rundeck/rundeck@6.2.1
                  license: Apache-2.0
            uid: 0
            gid: 0
      pipeline:
        - name: build war and ui
          privileged: true
          runs: |
            set -eux -o pipefail

            export JAVA_HOME=/usr/lib/jvm/temurin-21
            export PATH="/usr/lib/jvm/temurin-21/bin:$PATH"
            export NPM_CONFIG_REGISTRY=https://registry.npmjs.org/
            export CIRCLE_TAG=v6.2.1
            export CI=true

            node --version

            find . -name .npmrc -exec sed -i \
              -e '/@pagerduty:registry=/d' -e '/_authToken/d' {} +
            find . -name package-lock.json -exec \
              sed -i 's#https://npm.artifacts.pd-internal.com/npm/#https://registry.npmjs.org/#g' {} +

            MIRROR='https://maven-central.storage-download.googleapis.com/maven2/'
            find . -type f -name '*.gradle' -print0 | xargs -0 sed -i \
              -e "s|mavenCentral()|maven { url '${MIRROR}' }|g" \
              -e "s|gradlePluginPortal()|maven { url '${MIRROR}' }; gradlePluginPortal()|g"

            ./gradlew --init-script "${source.dir}/dhi-plugin-management.init.gradle" \
              --no-daemon --stacktrace :rundeckapp:bootWar -x test
        - name: install rundeck
          runs: |
            set -eux -o pipefail

            war=$(find rundeckapp/build/libs -name 'rundeck-*.war' | sort -V | tail -1)
            [ -n "$war" ] || {
              echo "no rundeck war produced by the build" >&2
              exit 1
            }

            app="${target.dir}/home/rundeck"
            mkdir -p "$app/docker-lib" "$app/etc" "$app/container-plugins" \
              "$app/libext" "$app/server/config" "$app/server/data" \
              "$app/var/logs" "$app/user-assets" "$app/repository" \
              "$app/projects" "${target.dir}/etc/remco"

            export PATH="/usr/lib/jvm/temurin-21/bin:$PATH"
            java -jar "$war" --installonly --basedir "$app"
            cp "$war" "$app/rundeck.war"

            cp -a docker/official/remco/. "${target.dir}/etc/remco/"
            cp -a docker/official/lib/. "$app/docker-lib/"
            cp -a docker/official/etc/. "$app/etc/"

            # libext is omitted: 110_sideload_container_plugins.sh copies
            # container-plugins/.keep into libext at startup as nonroot; a
            # root-owned libext/.keep from install blocks that cp.
            for dir in container-plugins server/data var/logs user-assets repository projects; do
              touch "$app/${dir}/.keep"
            done
      paths:
        - type: file
          path: ${source.dir}/dhi-plugin-management.init.gradle
          uid: 0
          gid: 0
          source: image/rundeck/files/plugin-management.init.gradle
      outputs:
        - source: ${target.dir}/home/rundeck
          target: /home/rundeck
          uid: 0
          gid: 0
        - source: ${target.dir}/etc/remco
          target: /etc/remco
          uid: 0
          gid: 0
accounts:
  run-as: nonroot
  users:
    - name: nonroot
      uid: 65532
      gid: 65532
  groups:
    - name: nonroot
      gid: 65532
      members:
        - nonroot
os-release:
  name: Docker Hardened Images (Alpine)
  id: alpine
  version-id: "3.24"
  pretty-name: Docker Hardened Images/Alpine Linux v3.24
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
work-dir: /home/rundeck
environment:
  JAVA_HOME: /usr/lib/jvm/temurin-21
  PATH: /usr/lib/jvm/temurin-21/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
  RUNDECK_HOME: /home/rundeck
paths:
  - type: symlink
    path: /usr/bin/tini
    uid: 0
    gid: 0
    source: /sbin/tini
  - type: directory
    path: /home/rundeck/server/data
    uid: 65532
    gid: 65532
    mode: "0770"
    recursive: true
  - type: directory
    path: /home/rundeck/var
    uid: 65532
    gid: 65532
    mode: "0770"
    recursive: true
  - type: directory
    path: /home/rundeck/var/logs
    uid: 65532
    gid: 65532
    mode: "0770"
    recursive: true
  - type: directory
    path: /home/rundeck/server/config
    uid: 65532
    gid: 65532
    mode: "0770"
    recursive: true
  - type: directory
    path: /home/rundeck/etc
    uid: 65532
    gid: 65532
    mode: "0770"
    recursive: true
  - type: directory
    path: /home/rundeck/libext
    uid: 65532
    gid: 65532
    mode: "0770"
    recursive: true
  - type: directory
    path: /home/rundeck/repository
    uid: 65532
    gid: 65532
    mode: "0770"
    recursive: true
  - type: directory
    path: /home/rundeck/projects
    uid: 65532
    gid: 65532
    mode: "0770"
    recursive: true
  - type: directory
    path: /home/rundeck/user-assets
    uid: 65532
    gid: 65532
    mode: "0770"
    recursive: true
annotations:
  org.opencontainers.image.description: A minimal Rundeck image
  org.opencontainers.image.licenses: Apache-2.0
entrypoint:
  - /usr/bin/tini
  - --
  - docker-lib/entry.sh
ports:
  - 4440/tcp
