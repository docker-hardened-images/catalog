# syntax=dhi.io/build:2-debian13

name: Kyverno Policy Reporter UI 2.x
image: dhi.io/kyverno-policy-reporter-ui
variant: runtime
tags:
  - "2"
  - "2.9"
  - 2.9.1
  - 2-debian
  - 2-debian13
  - 2.9-debian
  - 2.9-debian13
  - 2.9.1-debian
  - 2.9.1-debian13
platforms:
  - linux/amd64
  - linux/arm64
dates:
  release: "2026-04-29"
vars:
  COMMIT_SHA: 777b05a0da847f431e43df854fedd4f28a382f2d
  SEMVER_MAJOR_MINOR_VERSION: "2.9"
  SEMVER_MAJOR_VERSION: "2"
  SEMVER_VERSION: 2.9.1
  VERSION: 2.9.1
contents:
  repositories:
    - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
  keyring:
    - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
  packages:
    - base-files
    - ca-certificates-bundle
    - tzdata
  builds:
    - name: kyverno-policy-reporter-ui
      caches:
        - path: /go/pkg/mod
      contents:
        packages:
          - bash
          - ca-certificates-bundle
          - coreutils
          - golang-1.27
          - findutils
          - mawk
          - sed
          - jq
          - bun
        files:
          - url: git+https://github.com/kyverno/policy-reporter-ui.git#v2.9.1
            checksum: 777b05a0da847f431e43df854fedd4f28a382f2d
            path: /go/src/github.com/kyverno/policy-reporter-ui
            spdx:
              name: kyverno-policy-reporter-ui
              version: 2.9.1
              packages:
                - name: kyverno-policy-reporter-ui
                  purl: pkg:golang/github.com/kyverno/policy-reporter-ui@2.9.1
                  license: Apache-2.0
            uid: 0
            gid: 0
      pipeline:
        - name: build-frontend
          work-dir: /go/src/github.com/kyverno/policy-reporter-ui/frontend
          privileged: true
          runs: |
            set -eux -o pipefail

            bun pm pkg set overrides.form-data="4.0.6"               # CVE-2026-12143
            bun pm pkg set overrides.svgo="4.1.0"                    # GHSA-2p49-hgcm-8545, CVE-2026-84369, CVE-2026-84370
            bun pm pkg set overrides.postcss="8.5.23"                # GHSA-r28c-9q8g-f849, CVE-2026-69153
            bun pm pkg set overrides.tar="7.5.21"                    # GHSA-r292-9mhp-454m
            bun pm pkg set overrides.brace-expansion="5.0.12"        # CVE-2026-14257, CVE-2026-13149, CVE-2026-69152, CVE-2026-102276, CVE-2026-102277, CVE-2026-102278
            bun pm pkg set overrides.nanoid="3.3.18"                 # CVE-2026-67213
            bun pm pkg set overrides.undici="8.12.2"                 # CVE-2026-85024, CVE-2026-109869, CVE-2026-109841, CVE-2026-109924
            bun pm pkg set overrides.serialize-javascript="7.1.3"    # CVE-2026-115897
            bun pm pkg set overrides.devalue="5.9.3"                 # CVE-2026-92708, GHSA-x5rw-q4pp-hg5g, GHSA-r9w8-h9r3-54w4, GHSA-mcm9-63f2-9j32, GHSA-hx4r-w6wj-j8fg, GHSA-4q55-j62x-fr9h, GHSA-wf3x-273g-mvxv
            bun pm pkg set overrides.shell-quote="1.11.0"            # CVE-2026-102422
            bun pm pkg set overrides.source-map-js="1.2.2"           # CVE-2026-93749
            bun pm pkg set overrides.postcss-selector-parser="7.1.6" # CVE-2026-104844
            bun pm pkg set overrides.vue="3.5.42"                    # GHSA-g2v6-rqmx-r4w6
            bun pm pkg set overrides.markdown-it="15.0.3"            # CVE-2026-111758, CVE-2026-111766
            bun pm pkg set overrides.launch-editor="2.14.2"          # CVE-2026-112942, CVE-2026-112943, CVE-2026-112944
            bun pm pkg set overrides.vite="8.2.4"                    # CVE-2026-112942, CVE-2026-112943, CVE-2026-112944, CVE-2026-112945, CVE-2026-112946, CVE-2026-112947
            bun pm pkg set overrides.nuxt="4.6.2"                    # CVE-2026-114130, CVE-2026-114132, CVE-2026-114133

            # Move nuxt to devDependencies since it's needed for build-time only.
            jq '.devDependencies.nuxt = .dependencies.nuxt | del(.dependencies.nuxt)' package.json > package.json.tmp
            mv package.json.tmp package.json

            bun install
            bun add --dev --exact yaml@2.9.1
            bun run generate

            mkdir ${target.dir}/kodata
            cp -r dist ${target.dir}/kodata/ui
        - name: prepare ui for sbom
          work-dir: /go/src/github.com/kyverno/policy-reporter-ui/frontend
          privileged: true
          runs: |
            set -eux -o pipefail

            rm -rf node_modules

            # --ignore-scripts skips the frontend "postinstall" nuxt script
            bun install --production --ignore-scripts

            # Remove esbuild from node modules to avoid phantom golang vulnerabilities in sbom
            rm -rf node_modules/@esbuild
            find node_modules -type d -name esbuild -exec rm -rf {} + 2> /dev/null || true

            rm -rf node_modules/yaml
        - name: ui-sbom
          uses: sbom@v1
          with:
            prefix: kyverno-policy-reporter-ui-frontend
            source: /go/src/github.com/kyverno/policy-reporter-ui/frontend
        - name: copy-templates
          work-dir: /go/src/github.com/kyverno/policy-reporter-ui/backend
          runs: |
            set -eux -o pipefail

            cp -r templates ${target.dir}/kodata/templates
        - name: download backend dependencies
          uses: go/bump@v2
          work-dir: /go/src/github.com/kyverno/policy-reporter-ui/backend
          with:
            deps:
              - golang.org/x/net@v0.62.0
              - github.com/go-chi/chi/v5@v5.4.0
        - name: test
          work-dir: /go/src/github.com/kyverno/policy-reporter-ui/backend
          privileged: true
          runs: |
            set -eux -o pipefail

            go test $(go list ./... | grep -v '/util')
        - name: build-backend
          uses: go/build@v1
          work-dir: /go/src/github.com/kyverno/policy-reporter-ui/backend
          privileged: true
          with:
            output: ${target.dir}/usr/local/bin/kyverno-policy-reporter-ui
      outputs:
        - source: ${target.dir}/usr/local/bin/kyverno-policy-reporter-ui
          target: /usr/local/bin/kyverno-policy-reporter-ui
          uid: 0
          gid: 0
        - source: ${target.dir}/kodata
          target: /kodata
          uid: 0
          gid: 0
        - source: /opt/docker/sbom/kyverno-policy-reporter-ui
          target: /opt/docker/sbom/kyverno-policy-reporter-ui
          uid: 0
          gid: 0
        - source: /opt/docker/sbom/kyverno-policy-reporter-ui-frontend
          target: /opt/docker/sbom/kyverno-policy-reporter-ui-frontend
          uid: 0
          gid: 0
accounts:
  run-as: nonroot
  users:
    - name: nonroot
      uid: 65532
      gid: 65532
  groups:
    - name: nonroot
      gid: 65532
      members:
        - nonroot
os-release:
  name: Docker Hardened Images (Debian)
  id: debian
  version-id: "13"
  version-codename: trixie
  pretty-name: Docker Hardened Images/Debian GNU/Linux 13 (trixie)
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
environment:
  KO_DATA_PATH: /kodata
annotations:
  org.opencontainers.image.description: A minimal Kyverno Policy Reporter UI image
  org.opencontainers.image.licenses: Apache-2.0
entrypoint:
  - /usr/local/bin/kyverno-policy-reporter-ui
ports:
  - 8080/tcp
