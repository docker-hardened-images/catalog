# syntax=dhi.io/build:2-alpine3.24

name: Kyverno Policy Reporter UI 2.x (dev)
image: dhi.io/kyverno-policy-reporter-ui
variant: dev
tags:
  - 2-alpine-dev
  - 2.9-alpine-dev
  - 2-alpine3.24-dev
  - 2.9.1-alpine-dev
  - 2.9-alpine3.24-dev
  - 2.9.1-alpine3.24-dev
platforms:
  - linux/amd64
  - linux/arm64
dates:
  release: "2025-01-08"
vars:
  FLAVORED_SUFFIX: -dev
  SEMVER_MAJOR_MINOR_VERSION: "2.9"
  SEMVER_MAJOR_VERSION: "2"
  SEMVER_VERSION: 2.9.1
  SUFFIX: -dev
  VERSION: 2.9.1-r6
contents:
  repositories:
    - https://dhi.io/apk/alpine/v3.24/main
    - https://dl-cdn.alpinelinux.org/alpine/v3.24/main
    - https://dl-cdn.alpinelinux.org/alpine/v3.24/community
  keyring:
    - https://dhi.io/keyring/dhi-apk@docker-0F81AD7700D99184.rsa.pub
  packages:
    - alpine-baselayout-data
    - apk-tools
    - bash
    - busybox
    - ca-certificates
    - ca-certificates-bundle
    - coreutils
    - findutils
    - kyverno-policy-reporter-ui-dev=2.9.1-r6
    - tzdata
accounts:
  root: true
  run-as: root
  users:
    - name: nonroot
      uid: 65532
      gid: 65532
  groups:
    - name: nonroot
      gid: 65532
      members:
        - nonroot
os-release:
  name: Docker Hardened Images (Alpine)
  id: alpine
  version-id: "3.24"
  pretty-name: Docker Hardened Images/Alpine Linux v3.24
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
environment:
  KO_DATA_PATH: /kodata
paths:
  - type: directory
    path: /usr/local/bin
    uid: 0
    gid: 0
  - type: symlink
    path: /usr/local/bin/kyverno-policy-reporter-ui
    uid: 0
    gid: 0
    source: /usr/bin/kyverno-policy-reporter-ui
  - type: directory
    path: /ko-app
    uid: 0
    gid: 0
    mode: "0755"
  - type: symlink
    path: /ko-app/policy-reporter-ui
    uid: 0
    gid: 0
    source: /usr/bin/kyverno-policy-reporter-ui
  - type: symlink
    path: /kodata
    uid: 0
    gid: 0
    source: /usr/share/kyverno-policy-reporter-ui
annotations:
  org.opencontainers.image.description: A minimal Kyverno Policy Reporter UI image
  org.opencontainers.image.licenses: Apache-2.0
entrypoint:
  - /usr/local/bin/kyverno-policy-reporter-ui
ports:
  - 8080/tcp
