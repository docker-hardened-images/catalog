# syntax=dhi.io/build:2-debian13

name: NATS 2.15.x (dev)
image: dhi.io/nats
variant: dev
tags:
  - 2-dev
  - 2.15-dev
  - 2.15.1-dev
  - 2-debian-dev
  - 2-debian13-dev
  - 2.15-debian-dev
  - 2.15-debian13-dev
  - 2.15.1-debian-dev
  - 2.15.1-debian13-dev
platforms:
  - linux/amd64
  - linux/arm64
dates:
  release: "2025-09-22"
  end-of-life: "2026-09-22"
vars:
  COMMIT_SHA: b2fd3efc7456b11b06a54877ad6f6ccfb911edb4
  SEMVER_MAJOR_MINOR_VERSION: "2.15"
  SEMVER_MAJOR_VERSION: "2"
  SEMVER_VERSION: 2.15.1
  VERSION: 2.15.1
contents:
  repositories:
    - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
  keyring:
    - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
  packages:
    - '!gawk'
    - '!libelogind0'
    - '!original-awk'
    - apt
    - base-files
    - bash
    - ca-certificates
    - ca-certificates-bundle
    - coreutils
    - diffutils
    - dpkg
    - findutils
    - grep
    - libc-bin
    - mawk
    - perl-base
    - sed
    - tzdata
    - util-linux
  builds:
    - name: nats
      caches:
        - path: /go/pkg/mod
      contents:
        packages:
          - bash
          - ca-certificates-bundle
          - coreutils
          - golang-1.26
          - findutils
          - mawk
          - sed
        files:
          - url: git+https://github.com/nats-io/nats-server.git#v2.15.1
            checksum: b2fd3efc7456b11b06a54877ad6f6ccfb911edb4
            path: /go/src/github.com/nats-io/nats-server/v2
            spdx:
              name: nats-server
              version: 2.15.1
              packages:
                - name: nats-server
                  purl: pkg:golang/github.com/nats-io/nats-server/v2@2.15.1
                  license: Apache-2.0
            uid: 0
            gid: 0
      pipeline:
        - name: update go dependencies
          uses: go/bump@v1
          work-dir: /go/src/github.com/nats-io/nats-server/v2
          with:
            deps: []
            download: true
        - name: unit test
          work-dir: /go/src/github.com/nats-io/nats-server/v2
          privileged: true
          runs: |
            set -eux -o pipefail

            # NATS has a extense parallel test suite. This is a minimal set to catch possible breaking changes.
            # We do also skip tests that won't work or are flaky in buildkit.
            go test -v -p=1 $(go list ./... | grep -v "/server") -skip 'TestQueueDistributionAcrossRoutes|TestSysLogger|TestOCSPMust|TestOCSPAlways|TestOCSPPeerBadDelegatedCAResponseSigner|TestOCSPPeerUnknownAndRevokedIntermediate|TestOCSPPeerAllowWhenCAUnreachableOption|TestTLSGateway|TestGatewayTLS|TestTLSPinned|TestStress|TestLeafNodeGatewaySendsSystemEvent|TestNewRouteNoQueueSubscribersBounce|TestNewRouteQueueSubsDistribution' -count=1 -vet=off -timeout=30m -failfast
        - name: build
          uses: go/build@v1
          work-dir: /go/src/github.com/nats-io/nats-server/v2
          environment:
            GOFLAGS: -buildvcs=false
          with:
            ldflags:
              - -X server.serverVersion=2.15.1
              - -X server.gitCommit=b2fd3efc7456b11b06a54877ad6f6ccfb911edb4
            output: ${target.dir}/nats-server
            packages: .
      outputs:
        - source: ${target.dir}/nats-server
          target: /nats-server
          uid: 0
          gid: 0
        - source: /opt/docker/sbom/nats-server
          target: /opt/docker/sbom/nats-server
          uid: 0
          gid: 0
accounts:
  root: true
  run-as: root
  users:
    - name: nonroot
      uid: 65532
      gid: 65532
    - name: _apt
      uid: 42
      gid: 65532
  groups:
    - name: nonroot
      gid: 65532
      members:
        - nonroot
os-release:
  name: Docker Hardened Images (Debian)
  id: debian
  version-id: "13"
  version-codename: trixie
  pretty-name: Docker Hardened Images/Debian GNU/Linux 13 (trixie)
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
environment:
  DEBIAN_FRONTEND: noninteractive
paths:
  - type: file
    path: /nats-server.conf
    uid: 0
    gid: 0
    mode: "0644"
    source: image/nats/config/nats-server.conf
annotations:
  org.opencontainers.image.description: A minimal NATS server image
  org.opencontainers.image.licenses: Apache-2.0
entrypoint:
  - /nats-server
cmd:
  - --config
  - nats-server.conf
ports:
  - 4222/tcp
  - 8222/tcp
  - 6222/tcp
