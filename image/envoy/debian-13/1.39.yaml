# syntax=dhi.io/build:2-debian13

name: Envoy 1.39.x
image: dhi.io/envoy
variant: runtime
tags:
  - "1.39"
  - 1.39.6
  - 1.39-debian
  - 1.39-debian13
  - 1.39.6-debian
  - 1.39.6-debian13
platforms:
  - linux/amd64
  - linux/arm64
dates:
  release: "2026-07-14"
  end-of-life: "2027-01-13"
vars:
  PACKAGE_SUFFIX: ""
  SEMVER_MAJOR_MINOR_VERSION: "1.39"
  SEMVER_MAJOR_VERSION: "1"
  SEMVER_VERSION: 1.39.6
  VERSION: 1.39.6-3
contents:
  repositories:
    - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
  keyring:
    - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
  packages:
    - base-files
    - ca-certificates-bundle
    - envoy-1.39=1.39.6-3
    - libc6
    - tzdata
accounts:
  run-as: nonroot
  users:
    - name: nonroot
      uid: 65532
      gid: 65532
  groups:
    - name: nonroot
      gid: 65532
      members:
        - nonroot
os-release:
  name: Docker Hardened Images (Debian)
  id: debian
  version-id: "13"
  version-codename: trixie
  pretty-name: Docker Hardened Images/Debian GNU/Linux 13 (trixie)
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
paths:
  - type: directory
    path: /usr/local/bin
    uid: 0
    gid: 0
  - type: symlink
    path: /usr/local/bin/envoy
    uid: 0
    gid: 0
    source: /usr/bin/envoy
annotations:
  org.opencontainers.image.description: A minimal Envoy image
  org.opencontainers.image.licenses: Apache-2.0
cmd:
  - envoy
