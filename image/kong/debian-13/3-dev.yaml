# syntax=dhi.io/build:2-debian13

name: Kong 3.x (dev)
image: dhi.io/kong
variant: dev
tags:
  - 3-dev
  - 3.9-dev
  - 3.9.4-dev
  - 3-debian-dev
  - 3-debian13-dev
  - 3.9-debian-dev
  - 3.9-debian13-dev
  - 3.9.4-debian-dev
  - 3.9.4-debian13-dev
platforms:
  - linux/amd64
  - linux/arm64
dates:
  release: "2024-12-12"
vars:
  FLAVORED_SUFFIX: -dev
  PACKAGE_SUFFIX: ""
  SEMVER_MAJOR_MINOR_VERSION: "3.9"
  SEMVER_MAJOR_VERSION: "3"
  SEMVER_VERSION: 3.9.4
  SUFFIX: -dev
  VERSION: 3.9.4-0
contents:
  repositories:
    - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
  keyring:
    - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
  packages:
    - '!gawk'
    - '!libelogind0'
    - '!original-awk'
    - apt
    - base-files
    - bash
    - ca-certificates
    - ca-certificates-bundle
    - coreutils
    - diffutils
    - dpkg
    - findutils
    - grep
    - kong-3=3.9.4-0
    - libc-bin
    - libcrypt1
    - libstdc++6
    - libyaml-0-2
    - mawk
    - perl
    - perl-base
    - sed
    - tzdata
    - util-linux
    - zlib1g
accounts:
  root: true
  run-as: root
  users:
    - name: kong
      uid: 65532
      gid: 65532
    - name: _apt
      uid: 42
      gid: 65532
  groups:
    - name: kong
      gid: 65532
      members:
        - kong
os-release:
  name: Docker Hardened Images (Debian)
  id: debian
  version-id: "13"
  version-codename: trixie
  pretty-name: Docker Hardened Images/Debian GNU/Linux 13 (trixie)
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
environment:
  DEBIAN_FRONTEND: noninteractive
  KONG_NGINX_DAEMON: "off"
  KONG_PREFIX: /usr/local/kong
  KONG_VERSION: 3.9.4
  PATH: /usr/local/bin:/usr/local/openresty/bin:/usr/local/openresty/nginx/sbin:/usr/local/openresty/luajit/bin:/usr/bin:/bin
paths:
  - type: file
    path: /docker-entrypoint.sh
    uid: 65532
    gid: 65532
    mode: "0755"
    source: image/kong/bin/docker-entrypoint.sh
  - type: directory
    path: /usr/local/bin
    uid: 0
    gid: 0
  - type: symlink
    path: /usr/local/bin/kong
    uid: 0
    gid: 0
    source: /usr/bin/kong
  - type: symlink
    path: /usr/local/bin/kong-health
    uid: 0
    gid: 0
    source: /usr/bin/kong-health
  - type: symlink
    path: /usr/local/bin/luarocks
    uid: 0
    gid: 0
    source: /usr/bin/luarocks
  - type: symlink
    path: /usr/local/bin/luarocks-admin
    uid: 0
    gid: 0
    source: /usr/bin/luarocks-admin
  - type: symlink
    path: /usr/local/openresty
    uid: 0
    gid: 0
    source: /usr/lib/kong/openresty
  - type: symlink
    path: /usr/local/lib
    uid: 0
    gid: 0
    source: /usr/lib/kong/lib
  - type: symlink
    path: /usr/local/share
    uid: 0
    gid: 0
    source: /usr/share/kong
  - type: directory
    path: /usr/local/kong
    uid: 65532
    gid: 65532
    mode: "0755"
  - type: symlink
    path: /usr/local/kong/bin
    uid: 0
    gid: 0
    source: /usr/lib/kong/kong/bin
  - type: symlink
    path: /usr/local/kong/gui
    uid: 0
    gid: 0
    source: /usr/lib/kong/kong/gui
  - type: symlink
    path: /usr/local/kong/include
    uid: 0
    gid: 0
    source: /usr/lib/kong/kong/include
  - type: symlink
    path: /usr/local/kong/lib
    uid: 0
    gid: 0
    source: /usr/lib/kong/kong/lib
  - type: directory
    path: /etc/kong
    uid: 65532
    gid: 65532
    mode: "0755"
annotations:
  org.opencontainers.image.description: A minimal Kong image
  org.opencontainers.image.licenses: Apache-2.0
entrypoint:
  - /docker-entrypoint.sh
cmd:
  - kong
  - docker-start
ports:
  - 8000/tcp
  - 8001/tcp
  - 8443/tcp
  - 8444/tcp
