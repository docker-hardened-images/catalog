# syntax=dhi.io/build:2-debian13

name: Cilium Operator Azure 1.20.x
image: dhi.io/cilium-operator-azure
variant: runtime
tags:
  - "1"
  - "1.20"
  - 1.20.1
  - 1-debian
  - 1-debian13
  - 1.20-debian
  - 1.20-debian13
  - 1.20.1-debian
  - 1.20.1-debian13
platforms:
  - linux/amd64
  - linux/arm64
dates:
  release: "2026-07-29"
vars:
  COMMIT_SHA: 7d68cfb394f2960e10aa72e76d0d51e66c1b2ebc
  FLAVORED_SUFFIX: ""
  GOPS_VERSION: 0.3.29-4
  SEMVER_MAJOR_MINOR_VERSION: "1.20"
  SEMVER_MAJOR_VERSION: "1"
  SEMVER_VERSION: 1.20.1
  SUFFIX: ""
  VERSION: 1.20.1
contents:
  repositories:
    - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
  keyring:
    - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
  packages:
    - base-files
    - ca-certificates-bundle
    - gops=0.3.29-4
    - tzdata
  builds:
    - name: cilium-operator-azure
      work-dir: /go/src/github.com/cilium/cilium
      caches:
        - path: /go/pkg/mod
      contents:
        packages:
          - bash
          - ca-certificates-bundle
          - coreutils
          - golang-1.26
          - findutils
          - mawk
          - sed
        files:
          - url: git+https://github.com/cilium/cilium.git#v1.20.1
            checksum: 7d68cfb394f2960e10aa72e76d0d51e66c1b2ebc
            path: /go/src/github.com/cilium/cilium
            spdx:
              name: cilium-operator-azure
              version: 1.20.1
              packages:
                - name: cilium-operator-azure
                  purl: pkg:golang/github.com/cilium/cilium@1.20.1
                  license: Apache-2.0
            uid: 0
            gid: 0
      pipeline:
        - name: update go dependencies (1.20 only)
          uses: go/bump@v2
          with:
            deps:
              - golang.org/x/text@v0.39.0
              - github.com/google/cel-go@v0.29.0
              - github.com/klauspost/compress@v1.18.7
              - github.com/osrg/gobgp/v4@v4.7.0
            download: true
        - name: test
          runs: |
            set -eux -o pipefail

            # Skip TestRouterIDAllocation due to race condition in upstream cilium
            # that causes resource version conflicts on arm64 builds.
            CGO_ENABLED=0 go test -mod=vendor -v -skip 'TestRouterIDAllocation' ./operator/...
        - name: build
          uses: go/build@v1
          with:
            extra-args: -mod=vendor
            ldflags:
              - -X github.com/cilium/cilium/pkg/version.ciliumVersion=v1.20.1
            output: ${target.dir}/usr/local/bin/cilium-operator-azure
            packages: ./operator
            tags: osusergo,ipam_provider_azure
      outputs:
        - source: ${target.dir}/usr/local/bin/cilium-operator-azure
          target: /usr/local/bin/cilium-operator-azure
          uid: 0
          gid: 0
        - source: /opt/docker/sbom/cilium-operator-azure
          target: /opt/docker/sbom/cilium-operator-azure
          uid: 0
          gid: 0
accounts:
  run-as: nonroot
  users:
    - name: nonroot
      uid: 65532
      gid: 65532
  groups:
    - name: nonroot
      gid: 65532
      members:
        - nonroot
os-release:
  name: Docker Hardened Images (Debian)
  id: debian
  version-id: "13"
  version-codename: trixie
  pretty-name: Docker Hardened Images/Debian GNU/Linux 13 (trixie)
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
environment:
  GOPS_CONFIG_DIR: /home/gops
paths:
  - type: directory
    path: /home/gops
    uid: 65532
    gid: 65532
    mode: "0777"
  - type: directory
    path: /run/cilium
    uid: 65532
    gid: 65532
    mode: "0777"
annotations:
  org.opencontainers.image.description: A minimal Cilium Operator Azure image
  org.opencontainers.image.licenses: Apache-2.0
entrypoint:
  - /usr/local/bin/cilium-operator-azure
