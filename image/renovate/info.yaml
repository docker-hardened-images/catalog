metadata:
  display-name: Renovate
  short-description: Renovate scans repositories and proposes dependency updates. This image runs the Renovate CLI.
  featured: false
  home-url: https://github.com/renovatebot/renovate
  categories:
    - developer-tools
    - integration-and-delivery
  included-tools:
    - name: renovate
      description: Scans a repository and looks up newer versions of pinned dependencies.
    - name: renovate-config-validator
      description: Checks a Renovate config file and exits non-zero on an unknown option.
