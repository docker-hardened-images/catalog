# syntax=dhi.io/build:2-debian13

name: Renovate 44.x (dev)
image: dhi.io/renovate
variant: dev
tags:
  - 44-dev
  - 44.190-dev
  - 44.190.0-dev
  - 44-debian-dev
  - 44-debian13-dev
  - 44.190-debian-dev
  - 44.190-debian13-dev
  - 44.190.0-debian-dev
  - 44.190.0-debian13-dev
platforms:
  - linux/amd64
  - linux/arm64
dates:
  release: "2026-07-29"
vars:
  DEBIAN_EPOCH_MAJOR_MINOR_VERSION: "44.190"
  DEBIAN_EPOCH_MAJOR_VERSION: "44"
  DEBIAN_EPOCH_VERSION: 44.190.0
  MAJOR_VERSION: "44"
  SEMVER_VERSION: 44.190.0
  VERSION: 44.190.0-0
contents:
  repositories:
    - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
  keyring:
    - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
  packages:
    - '!gawk'
    - '!libelogind0'
    - '!mawk'
    - '!original-awk'
    - apt
    - base-files
    - bash
    - ca-certificates
    - coreutils
    - diffutils
    - dpkg
    - findutils
    - git
    - grep
    - libc-bin
    - libstdc++6
    - mawk
    - nodejs-24
    - perl-base
    - renovate-44=44.190.0-0
    - sed
    - tini
    - tzdata
    - util-linux
accounts:
  root: true
  run-as: root
  users:
    - name: nonroot
      uid: 65532
      gid: 65532
    - name: _apt
      uid: 42
      gid: 65532
  groups:
    - name: nonroot
      gid: 65532
      members:
        - nonroot
os-release:
  name: Docker Hardened Images (Debian)
  id: debian
  version-id: "13"
  version-codename: trixie
  pretty-name: Docker Hardened Images/Debian GNU/Linux 13 (trixie)
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
work-dir: /usr/src/app
environment:
  DEBIAN_FRONTEND: noninteractive
  LANG: C.UTF-8
  LC_ALL: C.UTF-8
  RENOVATE_BINARY_SOURCE: global
paths:
  - type: directory
    path: /usr/local
    uid: 0
    gid: 0
    mode: "0755"
  - type: directory
    path: /usr/local/sbin
    uid: 0
    gid: 0
    mode: "0755"
  - type: directory
    path: /usr/src/app
    uid: 65532
    gid: 65532
    mode: "0770"
  - type: directory
    path: /tmp/renovate
    uid: 65532
    gid: 65532
    mode: "0770"
  - type: directory
    path: /runner/cache/renovate/repository
    uid: 65532
    gid: 65532
    mode: "0770"
  - type: directory
    path: /home/nonroot
    uid: 65532
    gid: 65532
    mode: "0770"
  - type: symlink
    path: /usr/local/renovate
    uid: 0
    gid: 0
    source: /usr/lib/renovate
  - type: symlink
    path: /usr/local/sbin/renovate
    uid: 0
    gid: 0
    source: /usr/bin/renovate
  - type: symlink
    path: /usr/local/sbin/renovate-config-validator
    uid: 0
    gid: 0
    source: /usr/bin/renovate-config-validator
  - type: symlink
    path: /usr/local/sbin/tini
    uid: 0
    gid: 0
    source: /usr/bin/tini
  - type: file
    path: /usr/local/sbin/renovate-entrypoint.sh
    uid: 0
    gid: 0
    mode: "0755"
    source: image/renovate/renovate-entrypoint.sh
annotations:
  org.opencontainers.image.description: A minimal Renovate image
  org.opencontainers.image.licenses: AGPL-3.0-only
entrypoint:
  - /usr/local/sbin/renovate-entrypoint.sh
cmd:
  - renovate
