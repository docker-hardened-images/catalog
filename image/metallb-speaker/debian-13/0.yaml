# syntax=dhi.io/build:2-debian13

name: MetalLB Speaker 0.x
image: dhi.io/metallb-speaker
variant: runtime
tags:
  - "0"
  - "0.16"
  - 0.16.1
  - 0-debian
  - 0-debian13
  - 0.16-debian
  - 0.16-debian13
  - 0.16.1-debian
  - 0.16.1-debian13
platforms:
  - linux/amd64
  - linux/arm64
dates:
  release: "2025-06-03"
vars:
  FLAVORED_SUFFIX: ""
  SEMVER_MAJOR_MINOR_VERSION: "0.16"
  SEMVER_MAJOR_VERSION: "0"
  SEMVER_VERSION: 0.16.1
  SUFFIX: ""
  VERSION: 0.16.1-5
contents:
  repositories:
    - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
  keyring:
    - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
  packages:
    - base-files
    - ca-certificates-bundle
    - cp-tool=0.16.1-5
    - frr-metrics=0.16.1-5
    - speaker=0.16.1-5
    - tzdata
  files:
    - url: https://raw.githubusercontent.com/metallb/metallb/v0.16.1/frr-tools/reloader/frr-reloader.sh
      path: /frr-reloader.sh
      uid: 0
      gid: 0
      mode: "0755"
accounts:
  run-as: nonroot
  users:
    - name: nonroot
      uid: 65532
      gid: 65532
  groups:
    - name: nonroot
      gid: 65532
      members:
        - nonroot
os-release:
  name: Docker Hardened Images (Debian)
  id: debian
  version-id: "13"
  version-codename: trixie
  pretty-name: Docker Hardened Images/Debian GNU/Linux 13 (trixie)
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
paths:
  - type: symlink
    path: /cp-tool
    uid: 0
    gid: 0
    source: /usr/bin/cp-tool
  - type: symlink
    path: /frr-metrics
    uid: 0
    gid: 0
    source: /usr/bin/frr-metrics
annotations:
  org.opencontainers.image.description: A minimal MetalLB Speaker image
  org.opencontainers.image.licenses: Apache-2.0
entrypoint:
  - /usr/bin/speaker
