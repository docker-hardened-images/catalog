# syntax=dhi.io/build:2-debian13

name: Dependency-Track Frontend 5.x
image: dhi.io/dependencytrack-frontend
variant: runtime
tags:
  - "5"
  - "5.2"
  - 5.2.1
  - 5-debian
  - 5-debian13
  - 5.2-debian
  - 5.2-debian13
  - 5.2.1-debian
  - 5.2.1-debian13
platforms:
  - linux/amd64
  - linux/arm64
dates:
  release: "2026-06-07"
vars:
  SEMVER_MAJOR_MINOR_VERSION: "5.2"
  SEMVER_MAJOR_VERSION: "5"
  SEMVER_VERSION: 5.2.1
  VERSION: 5.2.1-3
contents:
  repositories:
    - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
  keyring:
    - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
  packages:
    - '!libelogind0'
    - '!mawk'
    - '!original-awk'
    - base-files
    - ca-certificates-bundle
    - coreutils
    - dash
    - dependencytrack-frontend-5=5.2.1-3
    - findutils
    - gawk
    - gettext-base
    - grep
    - jq
    - libc6
    - libcrypt1
    - libpcre2-8-0
    - libssl3t64
    - nginx-mainline
    - sed
    - tzdata
    - zlib1g
accounts:
  run-as: nginx
  users:
    - name: nginx
      uid: 65532
      gid: 65532
  groups:
    - name: nginx
      gid: 65532
      members:
        - nginx
    - name: www-data
      gid: 82
os-release:
  name: Docker Hardened Images (Debian)
  id: debian
  version-id: "13"
  version-codename: trixie
  pretty-name: Docker Hardened Images/Debian GNU/Linux 13 (trixie)
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
work-dir: /opt/owasp/dependency-track-frontend/
stop-signal: SIGQUIT
environment:
  BASE_PATH: /
  LANG: C.UTF-8
  OIDC_SCOPE: openid profile email
  TZ: Etc/UTC
paths:
  - type: directory
    path: /usr/share/dependencytrack-frontend
    uid: 0
    gid: 0
    mode: "0755"
  - type: directory
    path: /var/lib/dependencytrack-frontend
    uid: 0
    gid: 0
    mode: "0755"
  - type: delete
    path: /usr/share/dependencytrack-frontend/static/config.json
    uid: 0
    gid: 0
  - type: symlink
    path: /usr/share/dependencytrack-frontend/static/config.json
    uid: 0
    gid: 0
    source: /var/lib/dependencytrack-frontend/config.json
  - type: file
    path: /var/lib/dependencytrack-frontend/config.json
    uid: 65532
    gid: 65532
    mode: "0664"
    source: image/dependencytrack-frontend/config/static-config-5.2.1.json
  - type: directory
    path: /opt/owasp
    uid: 65532
    gid: 65532
    mode: "0755"
  - type: symlink
    path: /opt/owasp/dependency-track-frontend
    uid: 0
    gid: 0
    source: /usr/share/dependencytrack-frontend
  - type: directory
    path: /tmp
    uid: 0
    gid: 0
    mode: "1777"
  - type: directory
    path: /var/cache/nginx
    uid: 65532
    gid: 65532
    mode: "0770"
  - type: directory
    path: /etc/nginx/conf.d
    uid: 65532
    gid: 65532
    mode: "0770"
  - type: delete
    path: /etc/nginx/conf.d/default.conf
    uid: 0
    gid: 0
  - type: directory
    path: /etc/nginx/templates
    uid: 0
    gid: 0
    mode: "0755"
  - type: symlink
    path: /etc/nginx/templates/default.conf.template
    uid: 0
    gid: 0
    source: /usr/lib/dependencytrack-frontend/nginx/default.conf.template
  - type: file
    path: /etc/nginx/nginx.conf
    uid: 65532
    gid: 65532
    mode: "0644"
    source: image/dependencytrack-frontend/config/nginx.conf
  - type: symlink
    path: /var/log/nginx/access.log
    uid: 0
    gid: 0
    source: /dev/stdout
  - type: symlink
    path: /var/log/nginx/error.log
    uid: 0
    gid: 0
    source: /dev/stderr
  - type: file
    path: /docker-entrypoint.sh
    uid: 0
    gid: 0
    mode: "0755"
    source: image/dependencytrack-frontend/bin/entrypoint.sh
  - type: directory
    path: /docker-entrypoint.d
    uid: 0
    gid: 0
    mode: "0755"
  - type: symlink
    path: /docker-entrypoint.d/10-listen-on-ipv6-by-default.sh
    uid: 0
    gid: 0
    source: /usr/lib/dependencytrack-frontend/docker-entrypoint.d/10-listen-on-ipv6-by-default.sh
  - type: file
    path: /docker-entrypoint.d/20-envsubst-on-templates.sh
    uid: 0
    gid: 0
    mode: "0755"
    source: image/dependencytrack-frontend/bin/20-envsubst-on-templates.sh
  - type: symlink
    path: /docker-entrypoint.d/30-oidc-configuration.sh
    uid: 0
    gid: 0
    source: /usr/lib/dependencytrack-frontend/docker-entrypoint.d/30-oidc-configuration.sh
annotations:
  org.opencontainers.image.description: A minimal Dependency-Track frontend image
  org.opencontainers.image.licenses: Apache-2.0
entrypoint:
  - /docker-entrypoint.sh
cmd:
  - nginx
  - -g
  - daemon off;
ports:
  - 8080/tcp
