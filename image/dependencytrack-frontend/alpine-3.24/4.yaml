# syntax=dhi.io/build:2-alpine3.24

name: Dependency-Track Frontend 4.x
image: dhi.io/dependencytrack-frontend
variant: runtime
tags:
  - 4-alpine
  - 4.14-alpine
  - 4-alpine3.24
  - 4.14.4-alpine
  - 4.14-alpine3.24
  - 4.14.4-alpine3.24
platforms:
  - linux/amd64
  - linux/arm64
dates:
  release: "2021-03-18"
  end-of-life: "2026-12-31"
vars:
  SEMVER_MAJOR_MINOR_VERSION: "4.14"
  SEMVER_MAJOR_VERSION: "4"
  SEMVER_VERSION: 4.14.4
  VERSION: 4.14.4-r0
contents:
  repositories:
    - https://dhi.io/apk/alpine/v3.24/main
    - https://dl-cdn.alpinelinux.org/alpine/v3.24/main
    - https://dl-cdn.alpinelinux.org/alpine/v3.24/community
  keyring:
    - https://dhi.io/keyring/dhi-apk@docker-0F81AD7700D99184.rsa.pub
  packages:
    - alpine-baselayout-data
    - busybox
    - ca-certificates-bundle
    - coreutils
    - dependencytrack-frontend-4=4.14.4-r0
    - findutils
    - gawk
    - gettext-envsubst
    - grep
    - jq
    - libcrypto3
    - libssl3
    - musl
    - nginx-mainline
    - pcre2
    - sed
    - tzdata
    - zlib
  builds:
    - name: stage frontend assets
      shell: /bin/bash
      contents:
        packages:
          - bash
          - coreutils
          - findutils
          - dependencytrack-frontend-4=4.14.4-r0
      pipeline:
        - name: stage template and writable config
          runs: |
            set -eux -o pipefail

            install -d -m 0755 /etc/nginx/templates
            install -m 0644 \
              /usr/lib/dependencytrack-frontend/nginx/default.conf.template \
              /etc/nginx/templates/default.conf.template
            install -d -m 0755 /var/lib/dependencytrack-frontend
            install -m 0644 \
              /usr/share/dependencytrack-frontend/static/config.json \
              /var/lib/dependencytrack-frontend/config.json

            test "$(stat -c %a /etc/nginx/templates)" = 755
            test "$(stat -c %a /etc/nginx/templates/default.conf.template)" = 644
            test "$(stat -c %a /var/lib/dependencytrack-frontend/config.json)" = 644
      outputs:
        - source: /usr/share/dependencytrack-frontend
          target: /usr/share/dependencytrack-frontend
          uid: 0
          gid: 0
        - source: /var/lib/dependencytrack-frontend/config.json
          target: /var/lib/dependencytrack-frontend/config.json
          uid: 65532
          gid: 65532
          mode: "0664"
        - source: /etc/nginx/templates
          target: /etc/nginx/templates
          uid: 0
          gid: 0
accounts:
  run-as: nginx
  users:
    - name: nginx
      uid: 65532
      gid: 65532
  groups:
    - name: nginx
      gid: 65532
      members:
        - nginx
    - name: www-data
      gid: 82
os-release:
  name: Docker Hardened Images (Alpine)
  id: alpine
  version-id: "3.24"
  pretty-name: Docker Hardened Images/Alpine Linux v3.24
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
work-dir: /opt/owasp/dependency-track-frontend/
stop-signal: SIGQUIT
environment:
  BASE_PATH: /
  LANG: C.UTF-8
  OIDC_SCOPE: openid profile email
  TZ: Etc/UTC
paths:
  - type: directory
    path: /usr/share/dependencytrack-frontend
    uid: 0
    gid: 0
    mode: "0755"
  - type: directory
    path: /var/lib/dependencytrack-frontend
    uid: 0
    gid: 0
    mode: "0755"
  - type: delete
    path: /usr/share/dependencytrack-frontend/static/config.json
    uid: 0
    gid: 0
  - type: symlink
    path: /usr/share/dependencytrack-frontend/static/config.json
    uid: 0
    gid: 0
    source: /var/lib/dependencytrack-frontend/config.json
  - type: directory
    path: /opt/owasp
    uid: 65532
    gid: 65532
    mode: "0755"
  - type: symlink
    path: /opt/owasp/dependency-track-frontend
    uid: 0
    gid: 0
    source: /usr/share/dependencytrack-frontend
  - type: directory
    path: /tmp
    uid: 0
    gid: 0
    mode: "1777"
  - type: directory
    path: /var/lib/nginx
    uid: 0
    gid: 0
    mode: "0755"
  - type: directory
    path: /var/cache/nginx
    uid: 65532
    gid: 65532
    mode: "0770"
  - type: directory
    path: /etc/nginx/conf.d
    uid: 65532
    gid: 65532
    mode: "0770"
  - type: delete
    path: /etc/nginx/conf.d/default.conf
    uid: 0
    gid: 0
  - type: file
    path: /etc/nginx/nginx.conf
    uid: 65532
    gid: 65532
    mode: "0644"
    source: image/dependencytrack-frontend/config/nginx.conf
  - type: symlink
    path: /var/log/nginx/access.log
    uid: 0
    gid: 0
    source: /dev/stdout
  - type: symlink
    path: /var/log/nginx/error.log
    uid: 0
    gid: 0
    source: /dev/stderr
  - type: file
    path: /docker-entrypoint.sh
    uid: 0
    gid: 0
    mode: "0755"
    source: image/dependencytrack-frontend/bin/entrypoint.sh
  - type: directory
    path: /docker-entrypoint.d
    uid: 0
    gid: 0
    mode: "0755"
  - type: symlink
    path: /docker-entrypoint.d/10-listen-on-ipv6-by-default.sh
    uid: 0
    gid: 0
    source: /usr/lib/dependencytrack-frontend/docker-entrypoint.d/10-listen-on-ipv6-by-default.sh
  - type: file
    path: /docker-entrypoint.d/20-envsubst-on-templates.sh
    uid: 0
    gid: 0
    mode: "0755"
    source: image/dependencytrack-frontend/bin/20-envsubst-on-templates.sh
  - type: symlink
    path: /docker-entrypoint.d/30-oidc-configuration.sh
    uid: 0
    gid: 0
    source: /usr/lib/dependencytrack-frontend/docker-entrypoint.d/30-oidc-configuration.sh
annotations:
  org.opencontainers.image.description: A minimal Dependency-Track frontend image
  org.opencontainers.image.licenses: Apache-2.0
entrypoint:
  - /docker-entrypoint.sh
cmd:
  - nginx
  - -g
  - daemon off;
ports:
  - 8080/tcp
