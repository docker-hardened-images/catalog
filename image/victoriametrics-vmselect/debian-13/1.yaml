# syntax=dhi.io/build:2-debian13

name: VictoriaMetrics VMSelect 1.x
image: dhi.io/victoriametrics-vmselect
variant: runtime
tags:
  - "1"
  - "1.156"
  - 1.156.0
  - 1-debian
  - 1-debian13
  - 1.156-debian
  - 1.156-debian13
  - 1.156.0-debian
  - 1.156.0-debian13
platforms:
  - linux/amd64
  - linux/arm64
vars:
  FLAVORED_SUFFIX: ""
  SEMVER_MAJOR_MINOR_VERSION: "1.156"
  SEMVER_MAJOR_VERSION: "1"
  SEMVER_VERSION: 1.156.0
  SUFFIX: ""
  UPSTREAM_VERSION: 1.156.0-cluster
  VERSION: 1.156.0-cluster-2
contents:
  repositories:
    - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
  keyring:
    - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
  packages:
    - base-files
    - ca-certificates-bundle
    - tzdata
    - vmselect=1.156.0-cluster-2
  builds:
    - name: victoriametrics-vmselect-sbom
      contents:
        packages:
          - bash
          - coreutils
      pipeline:
        - name: add victoriametrics-vmselect sbom
          uses: spdx@v1
          with:
            license: Apache-2.0
            name: victoriametrics-vmselect
            purl: pkg:dhi/victoriametrics-vmselect@1.156.0-cluster
            version: 1.156.0-cluster
      outputs:
        - source: /opt/docker/sbom/victoriametrics-vmselect
          target: /opt/docker/sbom/victoriametrics-vmselect
          uid: 0
          gid: 0
accounts:
  run-as: nonroot
  users:
    - name: nonroot
      uid: 65532
      gid: 65532
  groups:
    - name: nonroot
      gid: 65532
      members:
        - nonroot
os-release:
  name: Docker Hardened Images (Debian)
  id: debian
  version-id: "13"
  version-codename: trixie
  pretty-name: Docker Hardened Images/Debian GNU/Linux 13 (trixie)
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
paths:
  - type: directory
    path: /usr/local/bin
    uid: 0
    gid: 0
  - type: symlink
    path: /usr/local/bin/vmselect
    uid: 0
    gid: 0
    source: /usr/bin/vmselect
annotations:
  org.opencontainers.image.description: A minimal VictoriaMetrics VMSelect image
  org.opencontainers.image.licenses: Apache-2.0
entrypoint:
  - /usr/local/bin/vmselect
ports:
  - 8481/tcp
