# syntax=dhi.io/build:2-alpine3.24

name: Kiali 2.x
image: dhi.io/kiali
variant: runtime
tags:
  - 2-alpine
  - 2.31-alpine
  - 2-alpine3.24
  - 2.31.0-alpine
  - 2.31-alpine3.24
  - 2.31.0-alpine3.24
platforms:
  - linux/amd64
  - linux/arm64
dates:
  release: "2026-08-21"
vars:
  FLAVORED_SUFFIX: ""
  SEMVER_MAJOR_MINOR_VERSION: "2.31"
  SEMVER_MAJOR_VERSION: "2"
  SEMVER_VERSION: 2.31.0
  SUFFIX: ""
  VERSION: 2.31.0-r3
contents:
  repositories:
    - https://dhi.io/apk/alpine/v3.24/main
    - https://dl-cdn.alpinelinux.org/alpine/v3.24/main
    - https://dl-cdn.alpinelinux.org/alpine/v3.24/community
  keyring:
    - https://dhi.io/keyring/dhi-apk@docker-0F81AD7700D99184.rsa.pub
  packages:
    - alpine-baselayout-data
    - ca-certificates-bundle
    - kiali-server=2.31.0-r3
    - tzdata
accounts:
  run-as: kiali
  users:
    - name: kiali
      uid: 1000
      gid: 1000
  groups:
    - name: kiali
      gid: 1000
      members:
        - kiali
os-release:
  name: Docker Hardened Images (Alpine)
  id: alpine
  version-id: "3.24"
  pretty-name: Docker Hardened Images/Alpine Linux v3.24
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
work-dir: /opt/kiali
paths:
  - type: directory
    path: /opt/kiali
    uid: 1000
    gid: 1000
    mode: "0755"
  - type: symlink
    path: /opt/kiali/kiali
    uid: 0
    gid: 0
    source: /usr/bin/kiali
  - type: directory
    path: /keys
    uid: 1000
    gid: 1000
    mode: "0770"
  - type: directory
    path: /tmp/kiali-offline
    uid: 1000
    gid: 1000
    mode: "0755"
annotations:
  org.opencontainers.image.description: A minimal Kiali image
  org.opencontainers.image.licenses: Apache-2.0
entrypoint:
  - /opt/kiali/kiali
ports:
  - 20001/tcp
