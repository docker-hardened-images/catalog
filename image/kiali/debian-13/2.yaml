# syntax=dhi.io/build:2-debian13

name: Kiali 2.x
image: dhi.io/kiali
variant: runtime
tags:
  - "2"
  - "2.31"
  - 2.31.0
  - 2-debian
  - 2-debian13
  - 2.31-debian
  - 2.31-debian13
  - 2.31.0-debian
  - 2.31.0-debian13
platforms:
  - linux/amd64
  - linux/arm64
dates:
  release: "2026-08-21"
vars:
  FLAVORED_SUFFIX: ""
  SEMVER_MAJOR_MINOR_VERSION: "2.31"
  SEMVER_MAJOR_VERSION: "2"
  SEMVER_VERSION: 2.31.0
  SUFFIX: ""
  VERSION: 2.31.0-3
contents:
  repositories:
    - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
  keyring:
    - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
  packages:
    - base-files
    - ca-certificates-bundle
    - kiali-server=2.31.0-3
    - tzdata
accounts:
  run-as: kiali
  users:
    - name: kiali
      uid: 1000
      gid: 1000
  groups:
    - name: kiali
      gid: 1000
      members:
        - kiali
os-release:
  name: Docker Hardened Images (Debian)
  id: debian
  version-id: "13"
  version-codename: trixie
  pretty-name: Docker Hardened Images/Debian GNU/Linux 13 (trixie)
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
work-dir: /opt/kiali
paths:
  - type: directory
    path: /opt/kiali
    uid: 1000
    gid: 1000
    mode: "0755"
  - type: symlink
    path: /opt/kiali/kiali
    uid: 0
    gid: 0
    source: /usr/bin/kiali
  - type: directory
    path: /keys
    uid: 1000
    gid: 1000
    mode: "0770"
  - type: directory
    path: /tmp/kiali-offline
    uid: 1000
    gid: 1000
    mode: "0755"
  - type: directory
    path: /tmp
    uid: 0
    gid: 0
    mode: "1777"
annotations:
  org.opencontainers.image.description: A minimal Kiali image
  org.opencontainers.image.licenses: Apache-2.0
entrypoint:
  - /opt/kiali/kiali
ports:
  - 20001/tcp
