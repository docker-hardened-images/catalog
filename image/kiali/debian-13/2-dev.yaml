# syntax=dhi.io/build:2-debian13

name: Kiali 2.x (dev)
image: dhi.io/kiali
variant: dev
tags:
  - 2-dev
  - 2.31-dev
  - 2.31.0-dev
  - 2-debian-dev
  - 2-debian13-dev
  - 2.31-debian-dev
  - 2.31-debian13-dev
  - 2.31.0-debian-dev
  - 2.31.0-debian13-dev
platforms:
  - linux/amd64
  - linux/arm64
dates:
  release: "2026-08-21"
vars:
  FLAVORED_SUFFIX: -dev
  SEMVER_MAJOR_MINOR_VERSION: "2.31"
  SEMVER_MAJOR_VERSION: "2"
  SEMVER_VERSION: 2.31.0
  SUFFIX: -dev
  VERSION: 2.31.0-3
contents:
  repositories:
    - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
  keyring:
    - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
  packages:
    - '!gawk'
    - '!libelogind0'
    - '!original-awk'
    - apt
    - base-files
    - bash
    - ca-certificates
    - ca-certificates-bundle
    - coreutils
    - diffutils
    - dpkg
    - findutils
    - grep
    - kiali-server-dev=2.31.0-3
    - libc-bin
    - mawk
    - perl-base
    - sed
    - sqv
    - tzdata
    - util-linux
accounts:
  root: true
  run-as: root
  users:
    - name: kiali
      uid: 1000
      gid: 1000
    - name: _apt
      uid: 42
      gid: 65532
  groups:
    - name: kiali
      gid: 1000
      members:
        - kiali
os-release:
  name: Docker Hardened Images (Debian)
  id: debian
  version-id: "13"
  version-codename: trixie
  pretty-name: Docker Hardened Images/Debian GNU/Linux 13 (trixie)
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
work-dir: /opt/kiali
environment:
  DEBIAN_FRONTEND: noninteractive
paths:
  - type: directory
    path: /opt/kiali
    uid: 1000
    gid: 1000
    mode: "0755"
  - type: symlink
    path: /opt/kiali/kiali
    uid: 0
    gid: 0
    source: /usr/bin/kiali
  - type: directory
    path: /keys
    uid: 1000
    gid: 1000
    mode: "0770"
  - type: directory
    path: /tmp/kiali-offline
    uid: 1000
    gid: 1000
    mode: "0755"
  - type: directory
    path: /tmp
    uid: 0
    gid: 0
    mode: "1777"
annotations:
  org.opencontainers.image.description: A minimal Kiali image
  org.opencontainers.image.licenses: Apache-2.0
entrypoint:
  - /opt/kiali/kiali
ports:
  - 20001/tcp
