# syntax=dhi.io/build:2-debian13

name: Rust 1.x (dev)
image: dhi.io/rust
variant: dev
tags:
  - 1-dev
  - 1.100-dev
  - 1.100.0-dev
  - 1-debian-dev
  - 1-debian13-dev
  - 1.100-debian-dev
  - 1.100-debian13-dev
  - 1.100.0-debian-dev
  - 1.100.0-debian13-dev
platforms:
  - linux/amd64
  - linux/arm64
dates:
  release: "2025-09-18"
vars:
  BINUTILS_ARCH: '#{ target.arch == "amd64" ? "x86-64" : "aarch64" }'
  SEMVER_MAJOR_MINOR_VERSION: "1.100"
  SEMVER_MAJOR_VERSION: "1"
  SEMVER_VERSION: 1.100.0
  VERSION: 1.100.0-4
contents:
  repositories:
    - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
  keyring:
    - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
  packages:
    - '!binutils'
    - '!binutils-aarch64-linux-gnu'
    - '!binutils-common'
    - '!binutils-x86-64-linux-gnu'
    - '!gawk'
    - '!libbinutils'
    - '!libctf-nobfd0'
    - '!libctf0'
    - '!libelogind0'
    - '!libgprofng0'
    - '!libsframe1'
    - '!make-guile'
    - '!mawk'
    - '!original-awk'
    - apt
    - base-files
    - bash
    - binutils-latest
    - binutils-latest-${BINUTILS_ARCH}-linux-gnu
    - ca-certificates
    - cargo=1.100.0-4
    - coreutils
    - diffutils
    - dpkg
    - g++
    - gcc
    - grep
    - libc-bin
    - libc6
    - libc6-dev
    - libctf-nobfd0-latest
    - libctf0-latest
    - libcurl4t64
    - libgcc-s1
    - libgprofng0-latest
    - libsqlite3-0
    - libssh2-1t64
    - libssl3t64
    - libstdc++6
    - make
    - mawk
    - perl-base
    - rust-analyzer=1.100.0-4
    - rust-clippy=1.100.0-4
    - rustc=1.100.0-4
    - rustfmt=1.100.0-4
    - sed
    - util-linux
    - zlib1g
accounts:
  root: true
  run-as: root
  users:
    - name: nonroot
      uid: 65532
      gid: 65532
    - name: _apt
      uid: 42
      gid: 65532
  groups:
    - name: nonroot
      gid: 65532
      members:
        - nonroot
os-release:
  name: Docker Hardened Images (Debian)
  id: debian
  version-id: "13"
  version-codename: trixie
  pretty-name: Docker Hardened Images/Debian GNU/Linux 13 (trixie)
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
work-dir: /build
environment:
  DEBIAN_FRONTEND: noninteractive
  RUST_VERSION: 1.100.0
paths:
  - type: directory
    path: /usr/local/bin
    uid: 0
    gid: 0
  - type: symlink
    path: /usr/local/bin/rustc
    uid: 0
    gid: 0
    source: /usr/bin/rustc
  - type: symlink
    path: /usr/local/bin/rustdoc
    uid: 0
    gid: 0
    source: /usr/bin/rustdoc
  - type: symlink
    path: /usr/local/bin/cargo
    uid: 0
    gid: 0
    source: /usr/bin/cargo
  - type: symlink
    path: /usr/local/bin/rustfmt
    uid: 0
    gid: 0
    source: /usr/bin/rustfmt
  - type: symlink
    path: /usr/local/bin/cargo-fmt
    uid: 0
    gid: 0
    source: /usr/bin/cargo-fmt
  - type: symlink
    path: /usr/local/bin/clippy-driver
    uid: 0
    gid: 0
    source: /usr/bin/clippy-driver
  - type: symlink
    path: /usr/local/bin/cargo-clippy
    uid: 0
    gid: 0
    source: /usr/bin/cargo-clippy
  - type: symlink
    path: /usr/local/bin/rust-analyzer
    uid: 0
    gid: 0
    source: /usr/bin/rust-analyzer
  - type: directory
    path: /usr/local/libexec
    uid: 0
    gid: 0
  - type: symlink
    path: /usr/local/libexec/rust-analyzer-proc-macro-srv
    uid: 0
    gid: 0
    source: /usr/libexec/rust-analyzer-proc-macro-srv
  - type: directory
    path: /usr/local/lib
    uid: 0
    gid: 0
  - type: symlink
    path: /usr/local/lib/rustlib
    uid: 0
    gid: 0
    source: /usr/lib/rustlib
annotations:
  org.opencontainers.image.description: A minimal Rust image
  org.opencontainers.image.licenses: MIT
cmd:
  - /bin/bash
