# syntax=dhi.io/build:2-debian13

name: K8s Device Plugin 0.x
image: dhi.io/k8s-device-plugin
variant: runtime
tags:
  - "0"
  - "0.20"
  - 0.20.0
  - 0-debian
  - 0-debian13
  - 0.20-debian
  - 0.20-debian13
  - 0.20.0-debian
  - 0.20.0-debian13
platforms:
  - linux/amd64
  - linux/arm64
dates:
  release: "2026-01-23"
vars:
  FLAVORED_SUFFIX: ""
  SEMVER_MAJOR_MINOR_VERSION: "0.20"
  SEMVER_MAJOR_VERSION: "0"
  SEMVER_VERSION: 0.20.0
  SUFFIX: ""
  VERSION: 0.20.0-2
contents:
  repositories:
    - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
  keyring:
    - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
  packages:
    - base-files
    - ca-certificates-bundle
    - config-manager=0.20.0-2
    - k8s-device-plugin=0.20.0-2
    - libstdc++6
    - mps-control-daemon=0.20.0-2
    - nvidia-device-plugin=0.20.0-2
    - tzdata
accounts:
  run-as: nonroot
  users:
    - name: nonroot
      uid: 65532
      gid: 65532
  groups:
    - name: nonroot
      gid: 65532
      members:
        - nonroot
os-release:
  name: Docker Hardened Images (Debian)
  id: debian
  version-id: "13"
  version-codename: trixie
  pretty-name: Docker Hardened Images/Debian GNU/Linux 13 (trixie)
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
work-dir: /app
environment:
  NVIDIA_DISABLE_REQUIRE: "true"
  NVIDIA_DRIVER_CAPABILITIES: compute,utility
  NVIDIA_VISIBLE_DEVICES: all
paths:
  - type: directory
    path: /usr/local/bin
    uid: 0
    gid: 0
  - type: symlink
    path: /usr/local/bin/nvidia-device-plugin
    uid: 0
    gid: 0
    source: /usr/bin/nvidia-device-plugin
  - type: symlink
    path: /usr/local/bin/gpu-feature-discovery
    uid: 0
    gid: 0
    source: /usr/bin/gpu-feature-discovery
  - type: symlink
    path: /usr/local/bin/config-manager
    uid: 0
    gid: 0
    source: /usr/bin/config-manager
  - type: symlink
    path: /usr/local/bin/mps-control-daemon
    uid: 0
    gid: 0
    source: /usr/bin/mps-control-daemon
annotations:
  org.opencontainers.image.description: A minimal NVIDIA K8s Device Plugin image
  org.opencontainers.image.licenses: Apache-2.0
entrypoint:
  - nvidia-device-plugin
