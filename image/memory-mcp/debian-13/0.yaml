# syntax=dhi.io/build:2-debian13

name: Memory MCP Server 2026.x
image: dhi.io/memory-mcp
variant: runtime
tags:
  - "2026"
  - "2026.7"
  - 2026.7.10
  - 2026-debian
  - 2026-debian13
  - 2026.7-debian
  - 2026.7-debian13
  - 2026.7.10-debian
  - 2026.7.10-debian13
platforms:
  - linux/amd64
  - linux/arm64
vars:
  SEMVER_MAJOR_MINOR_VERSION: "2026.7"
  SEMVER_MAJOR_VERSION: "2026"
  SEMVER_VERSION: 2026.7.10
  VERSION: 2026.7.10-0
contents:
  repositories:
    - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
  keyring:
    - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
  packages:
    - base-files
    - ca-certificates-bundle
    - libc6
    - libgomp1
    - libstdc++6
    - memory-mcp=2026.7.10-0
    - netbase
    - nodejs-24
    - tzdata
accounts:
  run-as: node
  users:
    - name: node
      uid: 1000
      gid: 1000
  groups:
    - name: node
      gid: 1000
      members:
        - node
os-release:
  name: Docker Hardened Images (Debian)
  id: debian
  version-id: "13"
  version-codename: trixie
  pretty-name: Docker Hardened Images/Debian GNU/Linux 13 (trixie)
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
environment:
  MEMORY_FILE_PATH: /data/memory.json
  NODE_ENV: production
paths:
  - type: symlink
    path: /app
    uid: 0
    gid: 0
    source: /usr/lib/memory-mcp
  - type: directory
    path: /data
    uid: 1000
    gid: 1000
    mode: "0755"
annotations:
  org.opencontainers.image.description: Memory MCP Server
  org.opencontainers.image.licenses: MIT
labels:
  io.modelcontextprotocol.server.name: io.github.modelcontextprotocol/server-memory
entrypoint:
  - node
  - /app/dist/index.js
