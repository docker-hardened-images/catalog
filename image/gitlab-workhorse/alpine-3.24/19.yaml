# syntax=dhi.io/build:2-alpine3.24

name: GitLab Workhorse 19.1.x
image: dhi.io/gitlab-workhorse
variant: runtime
tags:
  - 19-alpine
  - 19.1-alpine
  - 19-alpine3.24
  - 19.1.2-alpine
  - 19.1-alpine3.24
  - 19.1.2-alpine3.24
platforms:
  - linux/amd64
  - linux/arm64
dates:
  release: "2026-06-17"
vars:
  SEMVER_MAJOR_MINOR_VERSION: "19.1"
  SEMVER_MAJOR_VERSION: "19"
  SEMVER_VERSION: 19.1.2
  UPSTREAM_WORKHORSE_REFERENCE: registry.gitlab.com/gitlab-org/build/cng/gitlab-workhorse-ce:v19.1.2@sha256:25cfd44cbb16e00b9517cb1c1a35633990f78acbaa98ef5cd8e4e533bfc3b192
  UPSTREAM_WORKHORSE_VERSION: 19.1.2
  VERSION: 19.1.2-r2
  WH_FIPS: ""
contents:
  repositories:
    - https://dhi.io/apk/alpine/v3.24/main
    - https://dl-cdn.alpinelinux.org/alpine/v3.24/main
    - https://dl-cdn.alpinelinux.org/alpine/v3.24/community
  keyring:
    - https://dhi.io/keyring/dhi-apk@docker-0F81AD7700D99184.rsa.pub
  packages:
    - alpine-baselayout-data
    - bash
    - ca-certificates-bundle
    - coreutils
    - exiftool-gitlab
    - gitlab-workhorse
    - grep
    - perl
    - tzdata
  artifacts:
    - name: registry.gitlab.com/gitlab-org/build/cng/gitlab-workhorse-ce:v19.1.2@sha256:25cfd44cbb16e00b9517cb1c1a35633990f78acbaa98ef5cd8e4e533bfc3b192
      includes:
        - srv/gitlab/public/**
      uid: 0
      gid: 0
accounts:
  run-as: git
  users:
    - name: git
      uid: 1000
      gid: 1000
  groups:
    - name: git
      gid: 1000
      members:
        - git
os-release:
  name: Docker Hardened Images (Alpine)
  id: alpine
  version-id: "3.24"
  pretty-name: Docker Hardened Images/Alpine Linux v3.24
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
paths:
  - type: file
    path: /scripts/start-workhorse
    uid: 0
    gid: 0
    mode: "0755"
    source: image/gitlab-workhorse/scripts/start-workhorse
  - type: file
    path: /scripts/healthcheck
    uid: 0
    gid: 0
    mode: "0755"
    source: image/gitlab-workhorse/scripts/healthcheck
  - type: directory
    path: /srv/gitlab/public
    uid: 1000
    gid: 1000
    mode: "0755"
  - type: directory
    path: /srv/gitlab/config
    uid: 1000
    gid: 1000
    mode: "0755"
  - type: directory
    path: /var/log/gitlab
    uid: 1000
    gid: 1000
    mode: "0770"
  - type: directory
    path: /etc/gitlab/gitlab-workhorse
    uid: 1000
    gid: 1000
    mode: "0770"
  - type: directory
    path: /tmp
    uid: 1000
    gid: 1000
    mode: "1777"
annotations:
  org.opencontainers.image.description: A minimal GitLab Workhorse image
  org.opencontainers.image.licenses: MIT
entrypoint:
  - /scripts/start-workhorse
ports:
  - 8181/tcp
