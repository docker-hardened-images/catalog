# syntax=dhi.io/build:2-debian13

name: GitLab Workhorse 19.1.x (dev)
image: dhi.io/gitlab-workhorse
variant: dev
tags:
  - 19-dev
  - 19.1-dev
  - 19.1.2-dev
  - 19-debian-dev
  - 19-debian13-dev
  - 19.1-debian-dev
  - 19.1-debian13-dev
  - 19.1.2-debian-dev
  - 19.1.2-debian13-dev
platforms:
  - linux/amd64
  - linux/arm64
dates:
  release: "2026-06-17"
vars:
  SEMVER_MAJOR_MINOR_VERSION: "19.1"
  SEMVER_MAJOR_VERSION: "19"
  SEMVER_VERSION: 19.1.2
  UPSTREAM_WORKHORSE_REFERENCE: registry.gitlab.com/gitlab-org/build/cng/gitlab-workhorse-ce:v19.1.2@sha256:25cfd44cbb16e00b9517cb1c1a35633990f78acbaa98ef5cd8e4e533bfc3b192
  UPSTREAM_WORKHORSE_VERSION: 19.1.2
  VERSION: 19.1.2-1
  WH_FIPS: ""
contents:
  repositories:
    - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
  keyring:
    - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
  packages:
    - '!gawk'
    - '!libelogind0'
    - '!mawk'
    - '!original-awk'
    - apt
    - base-files
    - bash
    - ca-certificates
    - ca-certificates-bundle
    - coreutils
    - diffutils
    - dpkg
    - exiftool-gitlab
    - findutils
    - gitlab-workhorse
    - grep
    - libc-bin
    - mawk
    - perl
    - perl-base
    - sed
    - tzdata
    - util-linux
  artifacts:
    - name: registry.gitlab.com/gitlab-org/build/cng/gitlab-workhorse-ce:v19.1.2@sha256:25cfd44cbb16e00b9517cb1c1a35633990f78acbaa98ef5cd8e4e533bfc3b192
      includes:
        - srv/gitlab/public/**
      uid: 0
      gid: 0
accounts:
  root: true
  run-as: root
  users:
    - name: git
      uid: 1000
      gid: 1000
    - name: _apt
      uid: 42
      gid: 65532
  groups:
    - name: git
      gid: 1000
      members:
        - git
os-release:
  name: Docker Hardened Images (Debian)
  id: debian
  version-id: "13"
  version-codename: trixie
  pretty-name: Docker Hardened Images/Debian GNU/Linux 13 (trixie)
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
environment:
  DEBIAN_FRONTEND: noninteractive
paths:
  - type: file
    path: /scripts/start-workhorse
    uid: 0
    gid: 0
    mode: "0755"
    source: image/gitlab-workhorse/scripts/start-workhorse
  - type: file
    path: /scripts/healthcheck
    uid: 0
    gid: 0
    mode: "0755"
    source: image/gitlab-workhorse/scripts/healthcheck
  - type: directory
    path: /srv/gitlab/public
    uid: 1000
    gid: 1000
    mode: "0755"
  - type: directory
    path: /srv/gitlab/config
    uid: 1000
    gid: 1000
    mode: "0755"
  - type: directory
    path: /var/log/gitlab
    uid: 1000
    gid: 1000
    mode: "0770"
  - type: directory
    path: /etc/gitlab/gitlab-workhorse
    uid: 1000
    gid: 1000
    mode: "0770"
  - type: directory
    path: /tmp
    uid: 1000
    gid: 1000
    mode: "1777"
annotations:
  org.opencontainers.image.description: A minimal GitLab Workhorse image
  org.opencontainers.image.licenses: MIT
entrypoint:
  - /scripts/start-workhorse
ports:
  - 8181/tcp
