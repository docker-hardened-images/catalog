metadata:
  display-name: GitLab Workhorse
  short-description: GitLab Workhorse is the smart reverse proxy that sits in front of GitLab, handling resource-intensive HTTP requests such as file uploads and downloads, Git operations, and archive downloads.
  featured: false
  home-url: https://docs.gitlab.com/development/workhorse/
  categories:
    - integration-and-delivery
  included-tools:
    - name: gitlab-workhorse
      description: Smart reverse proxy in front of GitLab Rails; handles uploads, downloads, Git HTTP, and archive requests.
    - name: gitlab-resize-image
      description: Scales images and strips EXIF metadata on the fly (uses the bundled hardened exiftool).
    - name: gitlab-zip-cat
      description: Streams a single file out of a ZIP archive without extracting the whole archive.
    - name: gitlab-zip-metadata
      description: Generates a metadata index of a ZIP archive for fast in-archive file serving.
    - name: exiftool
      description: Hardened (JPEG/TIFF-only) Image::ExifTool build used by gitlab-resize-image to strip metadata.
