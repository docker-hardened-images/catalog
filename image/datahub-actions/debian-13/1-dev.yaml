# syntax=dhi.io/build:2-debian13

name: DataHub Actions 1.7.x (dev)
image: dhi.io/datahub-actions
variant: dev
tags:
  - 1-dev
  - 1.7-dev
  - 1.7.0-dev
  - 1.7.0.1-dev
  - 1-debian-dev
  - 1-debian13-dev
  - 1.7-debian-dev
  - 1.7-debian13-dev
  - 1.7.0-debian-dev
  - 1.7.0-debian13-dev
  - 1.7.0.1-debian-dev
  - 1.7.0.1-debian13-dev
platforms:
  - linux/amd64
  - linux/arm64
dates:
  release: "2025-10-01"
vars:
  PYTHON_MAJOR_MINOR_VERSION: "3.11"
  SEMVER_MAJOR_MINOR_VERSION: "1.7"
  SEMVER_MAJOR_VERSION: "1"
  SEMVER_VERSION: 1.7.0.1
  VERSION: 1.7.0.1-24
  VERSION_MAJOR_MINOR_PATCH: 1.7.0
contents:
  repositories:
    - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
  keyring:
    - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
  packages:
    - '!gawk'
    - '!libelogind0'
    - '!original-awk'
    - apt
    - base-files
    - bash
    - ca-certificates
    - coreutils
    - curl
    - datahub-actions=1.7.0.1-24
    - diffutils
    - dpkg
    - findutils
    - grep
    - krb5-config
    - krb5-user
    - libaio1t64
    - libc-bin
    - libffi8
    - libkrb5-3
    - libkrb5support0
    - libldap2
    - libodbc2
    - librdkafka1
    - libsasl2-2
    - libsasl2-modules
    - libsasl2-modules-gssapi-mit
    - libsasl2-modules-ldap
    - libstdc++6
    - mawk
    - perl-base
    - python-3.11
    - sed
    - tzdata
    - unixodbc
    - util-linux
accounts:
  root: true
  run-as: root
  users:
    - name: nonroot
      uid: 65532
      gid: 65532
    - name: _apt
      uid: 42
      gid: 65532
  groups:
    - name: nonroot
      gid: 65532
      members:
        - nonroot
os-release:
  name: Docker Hardened Images (Debian)
  id: debian
  version-id: "13"
  version-codename: trixie
  pretty-name: Docker Hardened Images/Debian GNU/Linux 13 (trixie)
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
work-dir: /home/nonroot
environment:
  DATAHUB_ACTIONS_SYSTEM_CONFIGS_PATH: /etc/datahub/actions/system/conf
  DATAHUB_ACTIONS_USER_CONFIGS_PATH: /etc/datahub/actions/conf
  DEBIAN_FRONTEND: noninteractive
  PATH: /opt/datahub/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
  PYTHONPATH: /opt/datahub/lib/python3.11/site-packages
paths:
  - type: directory
    path: /opt
    uid: 0
    gid: 0
  - type: directory
    path: /opt/datahub
    uid: 0
    gid: 0
  - type: symlink
    path: /opt/datahub/bin
    uid: 0
    gid: 0
    source: /usr/lib/datahub-actions/bin
  - type: symlink
    path: /opt/datahub/lib
    uid: 0
    gid: 0
    source: /usr/lib/datahub-actions/lib
  - type: symlink
    path: /opt/datahub/scripts
    uid: 0
    gid: 0
    source: /usr/share/datahub-actions/scripts
  - type: symlink
    path: /home/datahub
    uid: 0
    gid: 0
    source: /home/nonroot
  - type: directory
    path: /home/nonroot
    uid: 65532
    gid: 65532
    mode: "0755"
  - type: directory
    path: /home/nonroot/.aws
    uid: 65532
    gid: 65532
    mode: "0700"
  - type: directory
    path: /etc/datahub/actions/conf
    uid: 65532
    gid: 65532
    mode: "0755"
  - type: directory
    path: /etc/datahub/actions
    uid: 0
    gid: 0
    mode: "0755"
  - type: directory
    path: /etc/datahub
    uid: 0
    gid: 0
    mode: "0755"
  - type: directory
    path: /tmp/datahub/logs/actions
    uid: 65532
    gid: 65532
    mode: "0775"
annotations:
  org.opencontainers.image.description: A minimal DataHub Actions image
  org.opencontainers.image.licenses: Apache-2.0
entrypoint:
  - /opt/datahub/scripts/start.sh
  - /usr/bin/bash
