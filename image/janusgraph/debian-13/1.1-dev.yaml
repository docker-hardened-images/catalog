# syntax=dhi.io/build:2-debian13

name: JanusGraph 1.1.x (dev)
image: dhi.io/janusgraph
variant: dev
tags:
  - 1-dev
  - 1.1-dev
  - 1.1.0-dev
  - 1-debian-dev
  - 1-debian13-dev
  - 1.1-debian-dev
  - 1.1-debian13-dev
  - 1.1.0-debian-dev
  - 1.1.0-debian13-dev
platforms:
  - linux/amd64
  - linux/arm64
dates:
  release: "2024-11-09"
vars:
  JAVA_FIPS_SUFFIX: ""
  SEMVER_MAJOR_MINOR_VERSION: "1.1"
  SEMVER_MAJOR_VERSION: "1"
  SEMVER_VERSION: 1.1.0
  VERSION: 1.1.0-3
contents:
  repositories:
    - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
  keyring:
    - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
  packages:
    - '!gawk'
    - '!libelogind0'
    - '!mawk'
    - '!original-awk'
    - apt
    - base-files
    - bash
    - ca-certificates
    - ca-certificates-bundle
    - coreutils
    - diffutils
    - dpkg
    - eclipse-temurin-11-jre
    - eclipse-temurin-11-jre-oci-config
    - findutils
    - gawk
    - grep
    - janusgraph-1.1=1.1.0-3
    - krb5-user
    - libc-bin
    - mawk
    - perl-base
    - sed
    - tzdata
    - util-linux
    - yq-go
accounts:
  root: true
  run-as: root
  users:
    - name: janusgraph
      uid: 999
      gid: 999
    - name: _apt
      uid: 42
      gid: 65532
  groups:
    - name: janusgraph
      gid: 999
      members:
        - janusgraph
os-release:
  name: Docker Hardened Images (Debian)
  id: debian
  version-id: "13"
  version-codename: trixie
  pretty-name: Docker Hardened Images/Debian GNU/Linux 13 (trixie)
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
work-dir: /usr/share/janusgraph
environment:
  DEBIAN_FRONTEND: noninteractive
  JANUS_CONFIG_DIR: /etc/opt/janusgraph
  JANUS_DATA_DIR: /var/lib/janusgraph
  JANUS_HOME: /usr/share/janusgraph
  JANUS_INITDB_DIR: /docker-entrypoint-initdb.d
  JANUS_PROPS_TEMPLATE: berkeleyje-lucene
  JANUS_SERVER_TIMEOUT: "30"
  JANUS_STORAGE_TIMEOUT: "60"
  gremlinserver.graphs.graph: /etc/opt/janusgraph/janusgraph.properties
  gremlinserver.gremlinPool: "8"
  gremlinserver.threadPoolWorker: "1"
paths:
  - type: directory
    path: /etc/opt/janusgraph
    uid: 999
    gid: 999
    mode: "0700"
  - type: directory
    path: /var/lib/janusgraph
    uid: 999
    gid: 999
    mode: "0700"
  - type: directory
    path: /docker-entrypoint-initdb.d
    uid: 999
    gid: 999
    mode: "0700"
annotations:
  org.opencontainers.image.description: A minimal JanusGraph image
  org.opencontainers.image.licenses: Apache-2.0
entrypoint:
  - /usr/share/janusgraph/docker/docker-entrypoint.sh
cmd:
  - janusgraph
ports:
  - 8182/tcp
