# syntax=dhi.io/build:2-alpine3.24

name: JanusGraph 1.0.x
image: dhi.io/janusgraph
variant: runtime
tags:
  - 1.0-alpine
  - 1.0.1-alpine
  - 1.0-alpine3.24
  - 1.0.1-alpine3.24
platforms:
  - linux/amd64
  - linux/arm64
dates:
  release: "2024-11-08"
vars:
  JRE_PACKAGE: openjdk11-jre-headless
  SEMVER_MAJOR_MINOR_VERSION: "1.0"
  SEMVER_MAJOR_VERSION: "1"
  SEMVER_VERSION: 1.0.1
  VERSION: 1.0.1-r9
contents:
  repositories:
    - https://dhi.io/apk/alpine/v3.24/main
    - https://dl-cdn.alpinelinux.org/alpine/v3.24/main
    - https://dl-cdn.alpinelinux.org/alpine/v3.24/community
  keyring:
    - https://dhi.io/keyring/dhi-apk@docker-0F81AD7700D99184.rsa.pub
  packages:
    - alpine-baselayout-data
    - bash
    - ca-certificates
    - ca-certificates-bundle
    - coreutils
    - findutils
    - gawk
    - grep
    - janusgraph-1.0=1.0.1-r9
    - krb5
    - openjdk11-jre-headless
    - sed
    - tzdata
    - yq-go
accounts:
  run-as: janusgraph
  users:
    - name: janusgraph
      uid: 999
      gid: 999
  groups:
    - name: janusgraph
      gid: 999
      members:
        - janusgraph
os-release:
  name: Docker Hardened Images (Alpine)
  id: alpine
  version-id: "3.24"
  pretty-name: Docker Hardened Images/Alpine Linux v3.24
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
work-dir: /usr/share/janusgraph
environment:
  JANUS_CONFIG_DIR: /etc/opt/janusgraph
  JANUS_DATA_DIR: /var/lib/janusgraph
  JANUS_HOME: /usr/share/janusgraph
  JANUS_INITDB_DIR: /docker-entrypoint-initdb.d
  JANUS_PROPS_TEMPLATE: berkeleyje-lucene
  JANUS_SERVER_TIMEOUT: "30"
  JANUS_STORAGE_TIMEOUT: "60"
  gremlinserver.graphs.graph: /etc/opt/janusgraph/janusgraph.properties
  gremlinserver.gremlinPool: "8"
  gremlinserver.threadPoolWorker: "1"
paths:
  - type: directory
    path: /etc/opt/janusgraph
    uid: 999
    gid: 999
    mode: "0700"
  - type: directory
    path: /var/lib/janusgraph
    uid: 999
    gid: 999
    mode: "0700"
  - type: directory
    path: /docker-entrypoint-initdb.d
    uid: 999
    gid: 999
    mode: "0700"
annotations:
  org.opencontainers.image.description: A minimal JanusGraph image
  org.opencontainers.image.licenses: Apache-2.0
entrypoint:
  - /usr/share/janusgraph/docker/docker-entrypoint.sh
cmd:
  - janusgraph
ports:
  - 8182/tcp
