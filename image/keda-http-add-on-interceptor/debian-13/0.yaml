# syntax=dhi.io/build:2-debian13

name: KEDA HTTP Add-on Interceptor 0.x
image: dhi.io/keda-http-add-on-interceptor
variant: runtime
tags:
  - "0"
  - "0.16"
  - 0.16.0
  - 0-debian
  - 0-debian13
  - 0.16-debian
  - 0.16-debian13
  - 0.16.0-debian
  - 0.16.0-debian13
platforms:
  - linux/amd64
  - linux/arm64
dates:
  release: "2021-02-09"
vars:
  FLAVORED_SUFFIX: ""
  SEMVER_MAJOR_MINOR_VERSION: "0.16"
  SEMVER_MAJOR_VERSION: "0"
  SEMVER_VERSION: 0.16.0
  SUFFIX: ""
  VERSION: 0.16.0-0
contents:
  repositories:
    - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
