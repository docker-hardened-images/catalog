# syntax=dhi.io/build:2-debian13

name: KEDA HTTP Add-on Interceptor 0.x (dev)
image: dhi.io/keda-http-add-on-interceptor
variant: dev
tags:
  - 0-dev
  - 0.16-dev
  - 0.16.0-dev
  - 0-debian-dev
  - 0-debian13-dev
  - 0.16-debian-dev
  - 0.16-debian13-dev
  - 0.16.0-debian-dev
  - 0.16.0-debian13-dev
platforms:
  - linux/amd64
  - linux/arm64
dates:
  release: "2021-02-09"
vars:
  FLAVORED_SUFFIX: -dev
  SEMVER_MAJOR_MINOR_VERSION: "0.16"
  SEMVER_MAJOR_VERSION: "0"
  SEMVER_VERSION: 0.16.0
  SUFFIX: -dev
  VERSION: 0.16.0-0
contents:
  repositories:
    - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
  keyring:
    - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
  packages:
    - '!gawk'
    - '!libelogind0'
    - '!original-awk'
    - apt
    - base-files
    - bash
    - ca-certificates
    - ca-certificates-bundle
    - coreutils
    - diffutils
    - dpkg
    - findutils
    - grep
    - keda-http-add-on-interceptor-0-dev=0.16.0-0
    - libc-bin
    - mawk
    - perl-base
    - sed
    - tzdata
    - util-linux
accounts:
  root: true
  run-as: root
  users:
    - name: nonroot
      uid: 65532
      gid: 65532
    - name: _apt
      uid: 42
      gid: 65532
  groups:
    - name: nonroot
      gid: 65532
      members:
        - nonroot
os-release:
  name: Docker Hardened Images (Debian)
  id: debian
  version-id: "13"
  version-codename: trixie
  pretty-name: Docker Hardened Images/Debian GNU/Linux 13 (trixie)
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
work-dir: /
environment:
  DEBIAN_FRONTEND: noninteractive
  SSL_CERT_FILE: /etc/ssl/certs/ca-certificates.crt
paths:
  - type: directory
    path: /ko-app
    uid: 0
    gid: 0
    mode: "0755"
  - type: symlink
    path: /ko-app/interceptor
    uid: 0
    gid: 0
    source: /usr/bin/interceptor
annotations:
  org.opencontainers.image.description: A minimal KEDA HTTP Add-on Interceptor image
  org.opencontainers.image.licenses: Apache-2.0
entrypoint:
  - /ko-app/interceptor
