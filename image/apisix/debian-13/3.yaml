# syntax=dhi.io/build:2-debian13

name: APISIX 3.x
image: dhi.io/apisix
variant: runtime
tags:
  - "3"
  - "3.19"
  - 3.19.0
  - 3-debian
  - 3-debian13
  - 3.19-debian
  - 3.19-debian13
  - 3.19.0-debian
  - 3.19.0-debian13
platforms:
  - linux/amd64
  - linux/arm64
dates:
  release: "2026-09-28"
vars:
  ETCD_VERSION: 3.7.3-0
  PACKAGE_NAME: apisix-3
  SEMVER_MAJOR_MINOR_VERSION: "3.19"
  SEMVER_MAJOR_VERSION: "3"
  SEMVER_VERSION: 3.19.0
  VERSION: 3.19.0-2
contents:
  repositories:
    - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
  keyring:
    - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
  packages:
    - '!libelogind0'
    - '!mawk'
    - '!original-awk'
    - apisix-3=3.19.0-2
    - base-files
    - bash
    - brotli
    - ca-certificates
    - coreutils
    - etcd-3.7=3.7.3-0
    - libcrypt1
    - libldap2
    - libpcre2-8-0
    - libstdc++6
    - libxml2
    - libxslt1.1
    - libyaml-0-2
    - openssl
    - zlib1g
accounts:
  run-as: nonroot
  users:
    - name: nonroot
      uid: 65532
      gid: 65532
  groups:
    - name: nonroot
      gid: 65532
      members:
        - nonroot
os-release:
  name: Docker Hardened Images (Debian)
  id: debian
  version-id: "13"
  version-codename: trixie
  pretty-name: Docker Hardened Images/Debian GNU/Linux 13 (trixie)
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
environment:
  LUA_CPATH: /usr/local/apisix/lib/lua/5.1/?.so;;
  LUA_PATH: /usr/local/apisix/share/lua/5.1/?.lua;/usr/local/apisix/share/lua/5.1/?/init.lua;;
  PATH: /opt/openresty/luajit/bin:/opt/openresty/nginx/sbin:/opt/openresty/bin:/usr/local/apisix/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
paths:
  - type: file
    path: /usr/local/bin/docker-entrypoint.sh
    uid: 0
    gid: 0
    mode: "0755"
    source: image/apisix/bin/docker-entrypoint.sh
  - type: symlink
    path: /docker-entrypoint.sh
    uid: 0
    gid: 0
    source: /usr/local/bin/docker-entrypoint.sh
  - type: symlink
    path: /opt/openresty
    uid: 0
    gid: 0
    source: /usr/lib/apisix-3/openresty
  - type: symlink
    path: /usr/local/apisix
    uid: 0
    gid: 0
    source: /usr/lib/apisix-3
  - type: directory
    path: /usr/lib/apisix-3/bin
    uid: 65532
    gid: 65532
    mode: "0755"
  - type: symlink
    path: /usr/lib/apisix-3/bin/apisix
    uid: 0
    gid: 0
    source: /usr/bin/apisix
  - type: directory
    path: /usr/lib/apisix-3/conf
    uid: 65532
    gid: 65532
    mode: "0755"
  - type: directory
    path: /usr/lib/apisix-3/logs
    uid: 65532
    gid: 65532
    mode: "0755"
  - type: directory
    path: /usr/lib/apisix-3/client_body_temp
    uid: 65532
    gid: 65532
    mode: "0755"
  - type: directory
    path: /usr/lib/apisix-3/proxy_temp
    uid: 65532
    gid: 65532
    mode: "0755"
  - type: directory
    path: /usr/lib/apisix-3/fastcgi_temp
    uid: 65532
    gid: 65532
    mode: "0755"
  - type: directory
    path: /usr/lib/apisix-3/uwsgi_temp
    uid: 65532
    gid: 65532
    mode: "0755"
  - type: directory
    path: /usr/lib/apisix-3/scgi_temp
    uid: 65532
    gid: 65532
    mode: "0755"
  - type: directory
    path: /usr/lib/apisix-3
    uid: 0
    gid: 0
    mode: "0755"
annotations:
  org.opencontainers.image.description: A minimal APISIX image
  org.opencontainers.image.licenses: Apache-2.0
entrypoint:
  - /usr/local/bin/docker-entrypoint.sh
cmd:
  - docker-start
