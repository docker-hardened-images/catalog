# syntax=dhi.io/build:2-debian13

name: APISIX 3.x (dev)
image: dhi.io/apisix
variant: dev
tags:
  - 3-dev
  - 3.18-dev
  - 3.18.0-dev
  - 3-debian-dev
  - 3-debian13-dev
  - 3.18-debian-dev
  - 3.18-debian13-dev
  - 3.18.0-debian-dev
  - 3.18.0-debian13-dev
platforms:
  - linux/amd64
  - linux/arm64
dates:
  release: "2025-10-10"
vars:
  ETCD_VERSION: 3.7.1-8
  PACKAGE_NAME: apisix-3
  SEMVER_MAJOR_MINOR_VERSION: "3.18"
  SEMVER_MAJOR_VERSION: "3"
  SEMVER_VERSION: 3.18.0
  VERSION: 3.18.0-1
contents:
  repositories:
    - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
  keyring:
    - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
  packages:
    - '!gawk'
    - '!libelogind0'
    - '!mawk'
    - '!original-awk'
    - apisix-3=3.18.0-1
    - apt
    - base-files
    - bash
    - brotli
    - ca-certificates
    - coreutils
    - diffutils
    - dpkg
    - etcd-3.7=3.7.1-8
    - findutils
    - grep
    - libc-bin
    - libcrypt1
    - libldap2
    - libpcre2-8-0
    - libstdc++6
    - libxml2
    - libxslt1.1
    - libyaml-0-2
    - mawk
    - openssl
    - perl-base
    - sed
    - util-linux
    - zlib1g
  builds:
    - name: apisix writable dirs
      contents:
        repositories:
          - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
        keyring:
          - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
        packages:
          - apisix-3=3.18.0-1
          - bash
          - ca-certificates
          - coreutils
          - libcrypt1
          - libldap2
          - libpcre2-8-0
          - libstdc++6
          - libxml2
          - libxslt1.1
          - libyaml-0-2
          - openssl
          - zlib1g
      pipeline:
        - name: chown apisix conf and logs
          runs: |
            set -eux -o pipefail

            prefix=/usr/lib/apisix-3
            mkdir -p "${prefix}/conf" "${prefix}/logs" \
              "${prefix}/client_body_temp" "${prefix}/proxy_temp" \
              "${prefix}/fastcgi_temp" "${prefix}/uwsgi_temp" "${prefix}/scgi_temp"
            chown -R 65532:65532 \
              "${prefix}/conf" "${prefix}/logs" \
              "${prefix}/client_body_temp" "${prefix}/proxy_temp" \
              "${prefix}/fastcgi_temp" "${prefix}/uwsgi_temp" "${prefix}/scgi_temp"
      outputs:
        - source: /usr/lib/apisix-3/conf
          target: /usr/lib/apisix-3/conf
          uid: 65532
          gid: 65532
        - source: /usr/lib/apisix-3/logs
          target: /usr/lib/apisix-3/logs
          uid: 65532
          gid: 65532
        - source: /usr/lib/apisix-3/client_body_temp
          target: /usr/lib/apisix-3/client_body_temp
          uid: 65532
          gid: 65532
        - source: /usr/lib/apisix-3/proxy_temp
          target: /usr/lib/apisix-3/proxy_temp
          uid: 65532
          gid: 65532
        - source: /usr/lib/apisix-3/fastcgi_temp
          target: /usr/lib/apisix-3/fastcgi_temp
          uid: 65532
          gid: 65532
        - source: /usr/lib/apisix-3/uwsgi_temp
          target: /usr/lib/apisix-3/uwsgi_temp
          uid: 65532
          gid: 65532
        - source: /usr/lib/apisix-3/scgi_temp
          target: /usr/lib/apisix-3/scgi_temp
          uid: 65532
          gid: 65532
accounts:
  root: true
  run-as: root
  users:
    - name: nonroot
      uid: 65532
      gid: 65532
    - name: _apt
      uid: 42
      gid: 65532
  groups:
    - name: nonroot
      gid: 65532
      members:
        - nonroot
os-release:
  name: Docker Hardened Images (Debian)
  id: debian
  version-id: "13"
  version-codename: trixie
  pretty-name: Docker Hardened Images/Debian GNU/Linux 13 (trixie)
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
environment:
  DEBIAN_FRONTEND: noninteractive
  LUA_CPATH: /usr/local/apisix/lib/lua/5.1/?.so;;
  LUA_PATH: /usr/local/apisix/share/lua/5.1/?.lua;/usr/local/apisix/share/lua/5.1/?/init.lua;;
  PATH: /opt/openresty/luajit/bin:/opt/openresty/nginx/sbin:/opt/openresty/bin:/usr/local/apisix/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
paths:
  - type: file
    path: /usr/local/bin/docker-entrypoint.sh
    uid: 0
    gid: 0
    mode: "0755"
    source: image/apisix/bin/docker-entrypoint.sh
  - type: symlink
    path: /docker-entrypoint.sh
    uid: 0
    gid: 0
    source: /usr/local/bin/docker-entrypoint.sh
  - type: symlink
    path: /opt/openresty
    uid: 0
    gid: 0
    source: /usr/lib/apisix-3/openresty
  - type: symlink
    path: /usr/local/apisix
    uid: 0
    gid: 0
    source: /usr/lib/apisix-3
  - type: directory
    path: /usr/lib/apisix-3/bin
    uid: 65532
    gid: 65532
    mode: "0755"
  - type: symlink
    path: /usr/lib/apisix-3/bin/apisix
    uid: 0
    gid: 0
    source: /usr/bin/apisix
  - type: directory
    path: /usr/lib/apisix-3/conf
    uid: 65532
    gid: 65532
    mode: "0755"
  - type: directory
    path: /usr/lib/apisix-3/logs
    uid: 65532
    gid: 65532
    mode: "0755"
  - type: directory
    path: /usr/lib/apisix-3/client_body_temp
    uid: 65532
    gid: 65532
    mode: "0755"
  - type: directory
    path: /usr/lib/apisix-3/proxy_temp
    uid: 65532
    gid: 65532
    mode: "0755"
  - type: directory
    path: /usr/lib/apisix-3/fastcgi_temp
    uid: 65532
    gid: 65532
    mode: "0755"
  - type: directory
    path: /usr/lib/apisix-3/uwsgi_temp
    uid: 65532
    gid: 65532
    mode: "0755"
  - type: directory
    path: /usr/lib/apisix-3/scgi_temp
    uid: 65532
    gid: 65532
    mode: "0755"
  - type: directory
    path: /usr/lib/apisix-3
    uid: 0
    gid: 0
    mode: "0755"
annotations:
  org.opencontainers.image.description: A minimal APISIX image
  org.opencontainers.image.licenses: Apache-2.0
entrypoint:
  - /usr/local/bin/docker-entrypoint.sh
cmd:
  - docker-start
