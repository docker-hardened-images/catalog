    path: /goldmane
    uid: 0
    gid: 0
    source: /usr/local/bin/goldmane
  - type: symlink
    path: /health
    uid: 0
    gid: 0
    source: /usr/local/bin/health
  - type: directory
    path: /usr/local/bin
    uid: 0
    gid: 0
    mode: "0755"
  - type: symlink
    path: /usr/local/bin/goldmane
    uid: 0
    gid: 0
    source: /usr/bin/goldmane
  - type: symlink
    path: /usr/local/bin/health
    uid: 0
    gid: 0
    source: /usr/bin/health
annotations:
  org.opencontainers.image.description: A minimal Calico Goldmane flow aggregation image
  org.opencontainers.image.licenses: Apache-2.0
entrypoint:
  - /goldmane
