# syntax=dhi.io/build:2-debian13

name: Calico Goldmane 3.32.x (dev)
image: dhi.io/calico-goldmane
variant: dev
tags:
  - 3-dev
  - 3.32-dev
  - 3.32.4-dev
  - 3-debian-dev
  - 3-debian13-dev
  - 3.32-debian-dev
  - 3.32-debian13-dev
  - 3.32.4-debian-dev
  - 3.32.4-debian13-dev
platforms:
  - linux/amd64
  - linux/arm64
dates:
  release: "2026-04-30"
vars:
  COMMIT_SHA: edf78704a2c852da907d38bca19de94e5b69893a
  FLAVORED_SUFFIX: -dev
  PACKAGE_VERSION: 3.32.4-4
  SEMVER_MAJOR_MINOR_VERSION: "3.32"
  SEMVER_MAJOR_VERSION: "3"
  SEMVER_VERSION: 3.32.4
  SUFFIX: -dev
  VERSION: 3.32.4
contents:
  repositories:
    - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
  keyring:
    - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
  packages:
    - '!gawk'
    - '!libelogind0'
    - '!original-awk'
    - apt
    - base-files
    - bash
    - ca-certificates
    - ca-certificates-bundle
    - calico-goldmane-3.32-dev=3.32.4-4
    - coreutils
    - diffutils
    - dpkg
    - findutils
    - grep
    - libc-bin
    - mawk
    - perl-base
    - sed
    - tzdata
    - util-linux
  builds:
    - name: calico-goldmane-sbom
      contents:
        repositories:
          - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
        keyring:
          - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
        packages:
          - bash
          - coreutils
      pipeline:
        - uses: spdx@v1
          with:
            license: Apache-2.0
            name: calico-goldmane
            purl: pkg:golang/github.com/projectcalico/calico@3.32.4
            version: 3.32.4
      outputs:
        - source: /opt/docker/sbom/calico-goldmane
          target: /opt/docker/sbom/calico-goldmane
          uid: 0
          gid: 0
accounts:
  root: true
  run-as: root
  users:
    - name: goldmane
      uid: 10001
      gid: 10001
    - name: _apt
      uid: 42
      gid: 65532
  groups:
    - name: goldmane
      gid: 10001
      members:
        - goldmane
os-release:
  name: Docker Hardened Images (Debian)
  id: debian
  version-id: "13"
  version-codename: trixie
  pretty-name: Docker Hardened Images/Debian GNU/Linux 13 (trixie)
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
environment:
  DEBIAN_FRONTEND: noninteractive
paths:
