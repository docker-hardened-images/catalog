                  purl: pkg:golang/github.com/open-telemetry/opentelemetry-operator@0.160.0
                  license: Apache-2.0
            uid: 0
            gid: 0
      pipeline:
        - name: update go dependencies
          uses: go/bump@v1
          work-dir: /go/src/github.com/open-telemetry/opentelemetry-operator
          with:
            deps:
              - golang.org/x/net@v0.60.0
              - github.com/google/cel-go@v0.30.0
              - google.golang.org/grpc@v1.83.2
            download: true
        - name: build
          uses: go/build@v1
          work-dir: /go/src/github.com/open-telemetry/opentelemetry-operator
          with:
