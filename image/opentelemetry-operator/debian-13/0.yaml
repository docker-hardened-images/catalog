      outputs:
        - source: ${target.dir}/manager
          target: /manager
          uid: 0
          gid: 0
          mode: "0755"
        - source: /opt/docker/sbom/opentelemetry-operator
          target: /opt/docker/sbom/opentelemetry-operator
