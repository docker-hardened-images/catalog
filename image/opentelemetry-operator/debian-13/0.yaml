              - -X github.com/open-telemetry/opentelemetry-operator/internal/version.version=0.160.0
              - -X github.com/open-telemetry/opentelemetry-operator/internal/version.buildDate=$(date -u -d @${SOURCE_DATE_EPOCH} +'%Y-%m-%dT%H:%M:%SZ')
              - -X github.com/open-telemetry/opentelemetry-operator/internal/version.otelCol=0.160.0
              - -X github.com/open-telemetry/opentelemetry-operator/internal/version.targetAllocator=0.160.0
              - -X github.com/open-telemetry/opentelemetry-operator/internal/version.operatorOpAMPBridge=0.160.0
              - -X github.com/open-telemetry/opentelemetry-operator/internal/version.autoInstrumentationJava=2.31.1
              - -X github.com/open-telemetry/opentelemetry-operator/internal/version.autoInstrumentationNodeJS=0.78.0
              - -X github.com/open-telemetry/opentelemetry-operator/internal/version.autoInstrumentationPython=0.66b0
              - -X github.com/open-telemetry/opentelemetry-operator/internal/version.autoInstrumentationDotNet=1.17.0
              - -X github.com/open-telemetry/opentelemetry-operator/internal/version.autoInstrumentationGo=v0.24.0
              - -X github.com/open-telemetry/opentelemetry-operator/internal/version.autoInstrumentationApacheHttpd=1.0.4
              - -X github.com/open-telemetry/opentelemetry-operator/internal/version.autoInstrumentationNginx=1.0.4
