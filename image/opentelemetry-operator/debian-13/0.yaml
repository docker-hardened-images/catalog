  keyring:
    - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
  packages:
    - base-files
    - ca-certificates-bundle
    - tzdata
  builds:
    - name: opentelemetry-operator
      caches:
        - path: /go/pkg/mod
      contents:
        packages:
          - bash
          - ca-certificates-bundle
          - coreutils
          - golang-1.26
          - findutils
          - mawk
          - sed
        files:
          - url: git+https://github.com/open-telemetry/opentelemetry-operator.git#v0.160.0
            checksum: c7cc68b4b4b8e7450315fa22da1a1f23a7664fad
            path: /go/src/github.com/open-telemetry/opentelemetry-operator
            spdx:
              name: opentelemetry-operator
