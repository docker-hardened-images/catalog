# syntax=dhi.io/build:2-debian13

name: Azure CLI 2.x (dev)
image: dhi.io/azure-cli
variant: dev
tags:
  - 2-dev
  - 2.90-dev
  - 2.90.0-dev
  - 2-debian-dev
  - 2-debian13-dev
  - 2.90-debian-dev
  - 2.90-debian13-dev
  - 2.90.0-debian-dev
  - 2.90.0-debian13-dev
platforms:
  - linux/amd64
  - linux/arm64
dates:
  release: "2026-08-12"
vars:
  FLAVORED_SUFFIX: -dev
  SEMVER_MAJOR_MINOR_VERSION: "2.90"
  SEMVER_MAJOR_VERSION: "2"
  SEMVER_VERSION: 2.90.0
  SUFFIX: -dev
  VERSION: 2.90.0-1
contents:
  repositories:
    - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
  keyring:
    - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
  packages:
    - '!gawk'
    - '!libelogind0'
    - '!original-awk'
    - apt
    - azure-cli=2.90.0-1
    - base-files
    - bash
    - ca-certificates
    - ca-certificates-bundle
    - coreutils
    - diffutils
    - dpkg
    - findutils
    - grep
    - libc-bin
    - libpython-3.13-stdlib
    - mawk
    - perl-base
    - python-3.13-minimal
    - sed
    - tzdata
    - util-linux
accounts:
  root: true
  run-as: root
  users:
    - name: nonroot
      uid: 65532
      gid: 65532
    - name: _apt
      uid: 42
      gid: 65532
  groups:
    - name: nonroot
      gid: 65532
      members:
        - nonroot
os-release:
  name: Docker Hardened Images (Debian)
  id: debian
  version-id: "13"
  version-codename: trixie
  pretty-name: Docker Hardened Images/Debian GNU/Linux 13 (trixie)
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
environment:
  AZ_BICEP_GLOBALIZATION_INVARIANT: "1"
  AZURE_CONFIG_DIR: /azure
  DEBIAN_FRONTEND: noninteractive
paths:
  - type: directory
    path: /azure
    uid: 65532
    gid: 65532
    mode: "0770"
annotations:
  org.opencontainers.image.description: Azure CLI - Microsoft's command-line tool for managing Azure resources
  org.opencontainers.image.licenses: MIT
entrypoint:
  - az
cmd:
  - --help
