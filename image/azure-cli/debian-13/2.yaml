# syntax=dhi.io/build:2-debian13

name: Azure CLI 2.x
image: dhi.io/azure-cli
variant: runtime
tags:
  - "2"
  - "2.90"
  - 2.90.0
  - 2-debian
  - 2-debian13
  - 2.90-debian
  - 2.90-debian13
  - 2.90.0-debian
  - 2.90.0-debian13
platforms:
  - linux/amd64
  - linux/arm64
dates:
  release: "2026-08-12"
vars:
  FLAVORED_SUFFIX: ""
  SEMVER_MAJOR_MINOR_VERSION: "2.90"
  SEMVER_MAJOR_VERSION: "2"
  SEMVER_VERSION: 2.90.0
  SUFFIX: ""
  VERSION: 2.90.0-0
contents:
  repositories:
    - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
  keyring:
    - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
  packages:
    - azure-cli=2.90.0-0
    - base-files
    - ca-certificates-bundle
    - libpython-3.13-stdlib
    - python-3.13-minimal
    - tzdata
accounts:
  run-as: nonroot
  users:
    - name: nonroot
      uid: 65532
      gid: 65532
  groups:
    - name: nonroot
      gid: 65532
      members:
        - nonroot
os-release:
  name: Docker Hardened Images (Debian)
  id: debian
  version-id: "13"
  version-codename: trixie
  pretty-name: Docker Hardened Images/Debian GNU/Linux 13 (trixie)
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
environment:
  AZ_BICEP_GLOBALIZATION_INVARIANT: "1"
  AZURE_CONFIG_DIR: /azure
paths:
  - type: directory
    path: /azure
    uid: 65532
    gid: 65532
    mode: "0770"
annotations:
  org.opencontainers.image.description: Azure CLI - Microsoft's command-line tool for managing Azure resources
  org.opencontainers.image.licenses: MIT
entrypoint:
  - az
cmd:
  - --help
