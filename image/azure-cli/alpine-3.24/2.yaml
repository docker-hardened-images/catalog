# syntax=dhi.io/build:2-alpine3.24

name: Azure CLI 2.x
image: dhi.io/azure-cli
variant: runtime
tags:
  - 2-alpine
  - 2.90-alpine
  - 2-alpine3.24
  - 2.90.0-alpine
  - 2.90-alpine3.24
  - 2.90.0-alpine3.24
platforms:
  - linux/amd64
  - linux/arm64
dates:
  release: "2026-08-12"
vars:
  FLAVORED_SUFFIX: ""
  SEMVER_MAJOR_MINOR_VERSION: "2.90"
  SEMVER_MAJOR_VERSION: "2"
  SEMVER_VERSION: 2.90.0
  SUFFIX: ""
  VERSION: 2.90.0-r0
contents:
  repositories:
    - https://dhi.io/apk/alpine/v3.24/main
    - https://dl-cdn.alpinelinux.org/alpine/v3.24/main
    - https://dl-cdn.alpinelinux.org/alpine/v3.24/community
  keyring:
    - https://dhi.io/keyring/dhi-apk@docker-0F81AD7700D99184.rsa.pub
  packages:
    - alpine-baselayout-data
    - azure-cli=2.90.0-r0
    - ca-certificates-bundle
    - python-3.14
    - tzdata
accounts:
  run-as: nonroot
  users:
    - name: nonroot
      uid: 65532
      gid: 65532
  groups:
    - name: nonroot
      gid: 65532
      members:
        - nonroot
os-release:
  name: Docker Hardened Images (Alpine)
  id: alpine
  version-id: "3.24"
  pretty-name: Docker Hardened Images/Alpine Linux v3.24
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
environment:
  AZ_BICEP_GLOBALIZATION_INVARIANT: "1"
  AZURE_CONFIG_DIR: /azure
paths:
  - type: directory
    path: /azure
    uid: 65532
    gid: 65532
    mode: "0770"
annotations:
  org.opencontainers.image.description: Azure CLI - Microsoft's command-line tool for managing Azure resources
  org.opencontainers.image.licenses: MIT
entrypoint:
  - az
cmd:
  - --help
