# syntax=dhi.io/build:2-debian13

name: ActiveMQ Artemis 2.x
image: dhi.io/activemq-artemis
variant: runtime
tags:
  - "2"
  - "2.55"
  - 2.55.0
  - 2-debian
  - 2-debian13
  - 2.55-debian
  - 2.55-debian13
  - 2.55.0-debian
  - 2.55.0-debian13
platforms:
  - linux/amd64
  - linux/arm64
dates:
  release: "2025-10-13"
vars:
  ACTIVEMQ_ARTEMIS_MAJOR_MINOR_VERSION: "2.55"
  ACTIVEMQ_ARTEMIS_MAJOR_VERSION: "2"
  JDK_MAJOR_VERSION: "21"
  JRE_PATH: /usr/lib/jvm/temurin-21
  SEMVER_MAJOR_MINOR_VERSION: "2.55"
  SEMVER_MAJOR_VERSION: "2"
  SEMVER_VERSION: 2.55.0
  VERSION: 2.55.0-0
contents:
  repositories:
    - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
  keyring:
    - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
  packages:
    - '!libelogind0'
    - '!mawk'
    - '!original-awk'
    - activemq-artemis=2.55.0-0
    - base-files
    - bash
    - ca-certificates-bundle
    - coreutils
    - eclipse-temurin-21-jre
    - eclipse-temurin-21-jre-oci-config
    - tzdata
  builds:
    - name: locale
      contents:
        packages:
          - bash
          - locales
          - coreutils
          - gzip
      pipeline:
        - name: install locales
          runs: |
            set -eux -o pipefail

            ln -s /etc/locale.alias /usr/share/locale/locale.alias

            echo "en_US.UTF-8 UTF-8" >> /etc/locale.gen
            locale-gen en_US.UTF-8
      outputs:
        - source: /usr/share/locale
          target: /usr/share/locale
          uid: 0
          gid: 0
        - source: /usr/lib/locale
          target: /usr/lib/locale
          uid: 0
          gid: 0
accounts:
  run-as: nonroot
  users:
    - name: nonroot
      uid: 65532
      gid: 65532
  groups:
    - name: nonroot
      gid: 65532
      members:
        - nonroot
os-release:
  name: Docker Hardened Images (Debian)
  id: debian
  version-id: "13"
  version-codename: trixie
  pretty-name: Docker Hardened Images/Debian GNU/Linux 13 (trixie)
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
environment:
  JAVA_HOME: /usr/lib/jvm/temurin-21
  LANG: en_US.UTF-8
  LANGUAGE: en_US:en
  LC_ALL: en_US.UTF-8
  PATH: /opt/activemq-artemis/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
paths:
  - type: directory
    path: /usr/share/activemq-artemis/broker
    uid: 65532
    gid: 65532
  - type: directory
    path: /opt
    uid: 0
    gid: 0
  - type: symlink
    path: /opt/activemq-artemis
    uid: 0
    gid: 0
    source: /usr/share/activemq-artemis
annotations:
  org.opencontainers.image.description: A minimal ActiveMQ Artemis image
  org.opencontainers.image.licenses: Apache-2.0
entrypoint:
  - entrypoint.sh
cmd:
  - run
ports:
  - 8161/tcp
  - 61616/tcp
  - 5445/tcp
  - 5672/tcp
  - 1883/tcp
  - 61613/tcp
