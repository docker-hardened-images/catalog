# syntax=dhi.io/build:2-alpine3.24

name: Hydra 26.x (dev)
image: dhi.io/hydra
variant: dev
tags:
  - 26-alpine-dev
  - 26.2-alpine-dev
  - 26-alpine3.24-dev
  - 26.2.0-alpine-dev
  - 26.2-alpine3.24-dev
  - 26.2.0-alpine3.24-dev
platforms:
  - linux/amd64
  - linux/arm64
dates:
  release: "2026-03-20"
vars:
  FLAVORED_SUFFIX: -dev
  SEMVER_MAJOR_MINOR_VERSION: "26.2"
  SEMVER_MAJOR_VERSION: "26"
  SEMVER_VERSION: 26.2.0
  SUFFIX: -dev
  VERSION: 26.2.0-r1
contents:
  repositories:
    - https://dhi.io/apk/alpine/v3.24/main
    - https://dl-cdn.alpinelinux.org/alpine/v3.24/main
    - https://dl-cdn.alpinelinux.org/alpine/v3.24/community
  keyring:
    - https://dhi.io/keyring/dhi-apk@docker-0F81AD7700D99184.rsa.pub
  packages:
    - alpine-baselayout-data
    - apk-tools
    - bash
    - busybox
    - ca-certificates
    - ca-certificates-bundle
    - coreutils
    - findutils
    - hydra-dev=26.2.0-r1
    - tzdata
accounts:
  root: true
  run-as: root
  users:
    - name: nonroot
      uid: 65532
      gid: 65532
  groups:
    - name: nonroot
      gid: 65532
      members:
        - nonroot
os-release:
  name: Docker Hardened Images (Alpine)
  id: alpine
  version-id: "3.24"
  pretty-name: Docker Hardened Images/Alpine Linux v3.24
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
environment:
  SQA_OPT_OUT: "true"
paths:
  - type: directory
    path: /usr/local/bin
    uid: 0
    gid: 0
  - type: symlink
    path: /usr/local/bin/hydra
    uid: 0
    gid: 0
    source: /usr/bin/hydra
annotations:
  org.opencontainers.image.description: A minimal Ory Hydra image
  org.opencontainers.image.licenses: Apache-2.0
entrypoint:
  - hydra
cmd:
  - serve
  - all
ports:
  - 4444/tcp
  - 4445/tcp
