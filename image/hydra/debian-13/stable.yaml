# syntax=dhi.io/build:2-debian13

name: Hydra 26.x
image: dhi.io/hydra
variant: runtime
tags:
  - "26"
  - "26.2"
  - 26.2.0
  - 26-debian
  - 26-debian13
  - 26.2-debian
  - 26.2-debian13
  - 26.2.0-debian
  - 26.2.0-debian13
platforms:
  - linux/amd64
  - linux/arm64
dates:
  release: "2026-03-20"
vars:
  FLAVORED_SUFFIX: ""
  SEMVER_MAJOR_MINOR_VERSION: "26.2"
  SEMVER_MAJOR_VERSION: "26"
  SEMVER_VERSION: 26.2.0
  SUFFIX: ""
  VERSION: 26.2.0-1
contents:
  repositories:
    - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
  keyring:
    - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
  packages:
    - base-files
    - ca-certificates-bundle
    - hydra=26.2.0-1
    - libc6
    - tzdata
accounts:
  run-as: nonroot
  users:
    - name: nonroot
      uid: 65532
      gid: 65532
  groups:
    - name: nonroot
      gid: 65532
      members:
        - nonroot
os-release:
  name: Docker Hardened Images (Debian)
  id: debian
  version-id: "13"
  version-codename: trixie
  pretty-name: Docker Hardened Images/Debian GNU/Linux 13 (trixie)
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
environment:
  SQA_OPT_OUT: "true"
paths:
  - type: directory
    path: /usr/local/bin
    uid: 0
    gid: 0
  - type: symlink
    path: /usr/local/bin/hydra
    uid: 0
    gid: 0
    source: /usr/bin/hydra
annotations:
  org.opencontainers.image.description: A minimal Ory Hydra image
  org.opencontainers.image.licenses: Apache-2.0
entrypoint:
  - hydra
cmd:
  - serve
  - all
ports:
  - 4444/tcp
  - 4445/tcp
