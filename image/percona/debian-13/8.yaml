# syntax=dhi.io/build:2-debian13

name: Percona Server 8.x
image: dhi.io/percona
variant: runtime
tags:
  - "8"
  - "8.4"
  - 8.4.11
  - 8-debian
  - 8-debian13
  - 8.4-debian
  - 8.4-debian13
  - 8.4.11-debian
  - 8.4.11-debian13
platforms:
  - linux/amd64
  - linux/arm64
dates:
  release: "2024-04-10"
  end-of-life: "2032-04-30"
vars:
  SEMVER_MAJOR_MINOR_VERSION: "8.4"
  SEMVER_MAJOR_VERSION: "8"
  SEMVER_VERSION: 8.4.11
  VERSION: 8.4.11-11-0
contents:
  repositories:
    - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
  keyring:
    - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
  packages:
    - base-files
    - bash
    - ca-certificates-bundle
    - coreutils
    - gzip
    - libaio1t64
    - libatomic1
    - libcurl4t64
    - libicu76
    - libldap2
    - liblz4-1
    - libncurses6
    - libprotobuf-lite32t64
    - libssl3t64
    - libstdc++6
    - libtinfo6
    - libtirpc3t64
    - libzstd1
    - percona-server=8.4.11-11-0
    - tzdata
    - zlib1g
accounts:
  run-as: mysql
  users:
    - name: mysql
      uid: 65532
      gid: 65532
  groups:
    - name: mysql
      gid: 65532
      members:
        - mysql
os-release:
  name: Docker Hardened Images (Debian)
  id: debian
  version-id: "13"
  version-codename: trixie
  pretty-name: Docker Hardened Images/Debian GNU/Linux 13 (trixie)
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
paths:
  - type: directory
    path: /var/lib/mysql
    uid: 65532
    gid: 65532
    mode: "0755"
  - type: directory
    path: /var/log/mysql
    uid: 65532
    gid: 65532
    mode: "0755"
  - type: directory
    path: /var/lib/mysql-files
    uid: 65532
    gid: 65532
    mode: "0755"
  - type: directory
    path: /run/mysqld
    uid: 65532
    gid: 65532
    mode: "0755"
  - type: directory
    path: /etc/mysql
    uid: 65532
    gid: 65532
    mode: "0755"
  - type: file
    path: /etc/mysql/my.cnf
    content: |
      [mysqld]
      datadir=/var/lib/mysql
      socket=/run/mysqld/mysqld.sock
      pid-file=/run/mysqld/mysqld.pid

      [client]
      socket=/run/mysqld/mysqld.sock
    uid: 65532
    gid: 65532
    mode: "0644"
  - type: directory
    path: /docker-entrypoint-initdb.d
    uid: 65532
    gid: 65532
    mode: "0755"
  - type: file
    path: /usr/local/bin/docker-entrypoint.sh
    uid: 0
    gid: 0
    mode: "0755"
    source: image/percona/debian-13/docker-entrypoint.sh
annotations:
  org.opencontainers.image.description: A minimal Percona Server image
  org.opencontainers.image.licenses: GPL-2.0-only
entrypoint:
  - /usr/local/bin/docker-entrypoint.sh
cmd:
  - mysqld
ports:
  - 3306/tcp
  - 33060/tcp
