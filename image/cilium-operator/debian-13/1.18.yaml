# syntax=dhi.io/build:2-debian13

name: Cilium Operator 1.x
image: dhi.io/cilium-operator
variant: runtime
tags:
  - "1.18"
  - 1.18.14
  - 1.18-debian
  - 1.18-debian13
  - 1.18.14-debian
  - 1.18.14-debian13
platforms:
  - linux/amd64
  - linux/arm64
dates:
  release: "2025-07-29"
vars:
  FLAVORED_SUFFIX: ""
  GOPS_VERSION: 0.3.29-4
  SEMVER_MAJOR_MINOR_VERSION: "1.18"
  SEMVER_MAJOR_VERSION: "1"
  SEMVER_VERSION: 1.18.14
  SUFFIX: ""
  VERSION: 1.18.14-1
contents:
  repositories:
    - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
  keyring:
    - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
  packages:
    - base-files
    - ca-certificates-bundle
    - cilium-operator-1.18=1.18.14-1
    - gops=0.3.29-4
    - tzdata
accounts:
  run-as: nonroot
  users:
    - name: nonroot
      uid: 65532
      gid: 65532
  groups:
    - name: nonroot
      gid: 65532
      members:
        - nonroot
os-release:
  name: Docker Hardened Images (Debian)
  id: debian
  version-id: "13"
  version-codename: trixie
  pretty-name: Docker Hardened Images/Debian GNU/Linux 13 (trixie)
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
environment:
  GOPS_CONFIG_DIR: /home/gops
paths:
  - type: directory
    path: /home/gops
    uid: 65532
    gid: 65532
    mode: "0700"
  - type: directory
    path: /run/cilium
    uid: 65532
    gid: 65532
    mode: "0700"
  - type: directory
    path: /usr/local/bin
    uid: 0
    gid: 0
  - type: symlink
    path: /usr/local/bin/cilium-operator-generic
    uid: 0
    gid: 0
    source: /usr/bin/cilium-operator-generic
annotations:
  org.opencontainers.image.description: A minimal Cilium Operator image
  org.opencontainers.image.licenses: Apache-2.0
entrypoint:
  - /usr/local/bin/cilium-operator-generic
