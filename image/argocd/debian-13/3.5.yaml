# syntax=dhi.io/build:2-debian13

name: ArgoCD 3.5.x
image: dhi.io/argocd
variant: runtime
tags:
  - "3"
  - "3.5"
  - 3.5.0
  - 3-debian
  - 3-debian13
  - 3.5-debian
  - 3.5-debian13
  - 3.5.0-debian
  - 3.5.0-debian13
platforms:
  - linux/amd64
  - linux/arm64
dates:
  release: "2026-08-04"
vars:
  ARGOCD_USER_ID: "999"
  COMMIT_SHA: e95e1be88a2da6c06bff5c2fe1791e4d233ed810
  SEMVER_MAJOR_MINOR_VERSION: "3.5"
  SEMVER_MAJOR_VERSION: "3"
  SEMVER_VERSION: 3.5.0
  VERSION: 3.5.0
contents:
  repositories:
    - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
  keyring:
    - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
  packages:
    - '!libelogind0'
    - '!mawk'
    - '!original-awk'
    - base-files
    - ca-certificates
    - coreutils
    - dash
    - git
    - git-lfs
    - gnupg
    - gpg
    - gpg-agent
    - helm-3
    - kustomize
    - libexpat1
    - libgnutls30t64
    - openssh-client
    - tini
    - tzdata
    - yq-go
  builds:
    - name: argocd-go
      caches:
        - path: /go/pkg/mod
      contents:
        packages:
          - curl
          - git
          - git-lfs
          - gnupg
          - gpg
          - gpg-agent
          - grep
          - gzip
          - helm-3
          - kustomize
          - openssh-client
          - sed
          - bash
          - ca-certificates-bundle
          - coreutils
          - util-linux
          - golang-1.26
          - findutils
          - mawk
          - base-files
          - ca-certificates
          - libc6
          - libstdc++6
          - nodejs-24
          - node-corepack
          - npm
          - yarn-classic
        files:
          - url: git+https://github.com/argoproj/argo-cd.git#v3.5.0
            checksum: e95e1be88a2da6c06bff5c2fe1791e4d233ed810
            path: /go/src/github.com/argoproj/argo-cd/v3
            spdx:
              name: argocd
              version: 3.5.0
              packages:
                - name: argocd
                  purl: pkg:dhi/argocd@3.5.0
                  license: Apache-2.0
            uid: 0
            gid: 0
      pipeline:
        - name: patch-go (3.5 only)
          uses: go/bump@v2
          work-dir: /go/src/github.com/argoproj/argo-cd/v3
          caches:
            - path: /go/pkg/mod
          with:
            deps:
              - github.com/klauspost/compress@v1.18.7
              - github.com/slack-go/slack@v0.23.1
              - google.golang.org/grpc@v1.82.1
              - oras.land/oras-go/v2@v2.6.2
            replaces:
              - oras.land/oras-go/v2=oras.land/oras-go/v2@v2.6.2
            tidy: true
        - name: bump-pnpm (3.5 only)
          work-dir: /go/src/github.com/argoproj/argo-cd/v3/ui
          privileged: true
          environment:
            PNPM_HOME: /pnpm
          caches:
            - path: /pnpm/store
          runs: |
            set -eux -o pipefail

            corepack enable
            corepack prepare pnpm@10.28.1 --activate
            pnpm config set store-dir /pnpm/store

            # CVE remediations (equivalent of yarn-patches for the yarn-classic lines).
            npm pkg set pnpm.overrides.formidable=2.1.3
            npm pkg set pnpm.overrides.js-yaml=4.3.1
            npm pkg set pnpm.overrides.minimatch=5.1.8
            # lodash 4.18.0/4.18.1 are deprecated "Bad release"s that break
            # webpack's html-webpack-plugin (_.template). 4.17.23 is the newest
            # non-deprecated release and still covers CVE-2026-4800/CVE-2026-2950.
            npm pkg set pnpm.overrides.lodash-es=4.17.23
            npm pkg set pnpm.overrides.lodash=4.17.23
            npm pkg set pnpm.overrides.fast-xml-parser=5.7.0
            npm pkg set pnpm.overrides.dompurify=3.4.13
            npm pkg set pnpm.overrides.form-data=4.0.6
            npm pkg set pnpm.overrides.qs=6.15.2
            npm pkg set pnpm.overrides.yaml=1.10.3
            npm pkg set pnpm.overrides.unidiff=1.0.4
            npm pkg set pnpm.overrides.date-fns=4.1.0
            npm pkg set pnpm.overrides.uuid=11.1.1
            npm pkg set pnpm.overrides.brace-expansion=5.0.9 # CVE-2026-69152
            npm pkg set pnpm.overrides.linkify-it=5.0.2      # CVE-2026-48801, CVE-2026-59887

            # tsx is pulled into argocd-ui dependencies but should not ship.
            npm pkg delete dependencies.tsx devDependencies.tsx
            # Issue opened: https://github.com/argoproj/argo-cd/issues/24978
            npm pkg delete dependencies.react-hot-loader devDependencies.react-hot-loader # CVE-2025-57352

            # Refresh the lockfile so the overrides above are honored.
            pnpm install --lockfile-only
        - name: build-ui (pnpm, 3.5 only)
          work-dir: /go/src/github.com/argoproj/argo-cd/v3/ui
          privileged: true
          environment:
            NODE_ENV: production
            NODE_ONLINE_ENV: online
            PNPM_HOME: /pnpm
          caches:
            - path: /pnpm/store
          runs: |
            set -eux -o pipefail

            pnpm install
            pnpm build
        - name: prepare ui for sbom (pnpm, 3.5 only)
          work-dir: /go/src/github.com/argoproj/argo-cd/v3/ui
          privileged: true
          environment:
            PNPM_HOME: /pnpm
          caches:
            - path: /pnpm/store
          runs: |
            set -eux -o pipefail

            rm -rf node_modules
            # tsx / react-hot-loader already dropped in the bump-pnpm step above.
            pnpm install --prod
        - name: ui-sbom
          uses: sbom@v1
          with:
            prefix: argocd-ui
            source: /go/src/github.com/argoproj/argo-cd/v3/ui
        - name: build
          uses: go/build@v1
          work-dir: /go/src/github.com/argoproj/argo-cd/v3
          environment:
            GODEBUG: tarinsecurepath=0,zipinsecurepath=0
          caches:
            - path: /go/pkg/mod
          with:
            ldflags:
              - -extldflags '-static'
              - -X github.com/argoproj/argo-cd/v3/common.version=3.5.0
              - -X github.com/argoproj/argo-cd/v3/common.gitTag=v3.5.0
              - -X github.com/argoproj/argo-cd/v3/common.buildDate=$(date -ud @${SOURCE_DATE_EPOCH} +'%Y-%m-%dT%H:%M:%SZ')
              - -X github.com/argoproj/argo-cd/v3/common.gitCommit=e95e1be88a2da6c06bff5c2fe1791e4d233ed810
              - -X github.com/argoproj/argo-cd/v3/common.gitTreeState=clean
              - -X github.com/argoproj/argo-cd/v3/common.kubectlVersion=$(go list -m k8s.io/client-go | head -n 1 | rev | cut -d' ' -f1 | rev)
            output: ${target.dir}/usr/local/bin/argocd
            packages: ./cmd
      outputs:
        - source: ${target.dir}/usr/local/bin/argocd
          target: /usr/local/bin/argocd
          uid: 0
          gid: 0
        - source: /go/src/github.com/argoproj/argo-cd/v3/hack/gpg-wrapper.sh
          target: /usr/local/bin/gpg-wrapper.sh
          uid: 0
          gid: 0
        - source: /go/src/github.com/argoproj/argo-cd/v3/hack/git-verify-wrapper.sh
          target: /usr/local/bin/git-verify-wrapper.sh
          uid: 0
          gid: 0
        - source: /opt/docker/sbom/argocd
          target: /opt/docker/sbom/argocd
          uid: 0
          gid: 0
        - source: /opt/docker/sbom/argocd-ui
          target: /opt/docker/sbom/argocd-ui
          uid: 0
          gid: 0
accounts:
  run-as: "999"
  users:
    - name: argocd
      uid: 999
      gid: 999
  groups:
    - name: argocd
      gid: 999
      members:
        - argocd
os-release:
  name: Docker Hardened Images (Debian)
  id: debian
  version-id: "13"
  version-codename: trixie
  pretty-name: Docker Hardened Images/Debian GNU/Linux 13 (trixie)
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
environment:
  ARGOCD_USER_ID: "999"
paths:
  - type: symlink
    path: /usr/local/bin/helm
    uid: 0
    gid: 0
    source: /usr/bin/helm
  - type: emptyfile
    path: /app/config/ssh/ssh_known_hosts
    uid: 0
    gid: 0
  - type: directory
    path: /etc/ssh
    uid: 0
    gid: 0
  - type: symlink
    path: /etc/ssh/ssh_known_hosts
    uid: 0
    gid: 0
    source: /app/config/ssh/ssh_known_hosts
  - type: directory
    path: /app/config/gpg/source
    uid: 0
    gid: 0
    recursive: true
  - type: directory
    path: /app/config/gpg/keys
    uid: 999
    gid: 999
    mode: "0700"
    recursive: true
  - type: symlink
    path: /usr/local/bin/argocd-server
    uid: 0
    gid: 0
    source: /usr/local/bin/argocd
  - type: symlink
    path: /usr/local/bin/argocd-repo-server
    uid: 0
    gid: 0
    source: /usr/local/bin/argocd
  - type: symlink
    path: /usr/local/bin/argocd-cmp-server
    uid: 0
    gid: 0
    source: /usr/local/bin/argocd
  - type: symlink
    path: /usr/local/bin/argocd-application-controller
    uid: 0
    gid: 0
    source: /usr/local/bin/argocd
  - type: symlink
    path: /usr/local/bin/argocd-dex
    uid: 0
    gid: 0
    source: /usr/local/bin/argocd
  - type: symlink
    path: /usr/local/bin/argocd-notifications
    uid: 0
    gid: 0
    source: /usr/local/bin/argocd
  - type: symlink
    path: /usr/local/bin/argocd-applicationset-controller
    uid: 0
    gid: 0
    source: /usr/local/bin/argocd
  - type: symlink
    path: /usr/local/bin/argocd-k8s-auth
    uid: 0
    gid: 0
    source: /usr/local/bin/argocd
  - type: symlink
    path: /usr/local/bin/argocd-commit-server
    uid: 0
    gid: 0
    source: /usr/local/bin/argocd
annotations:
  org.opencontainers.image.description: A minimal ArgoCD image
  org.opencontainers.image.licenses: Apache-2.0
entrypoint:
  - /usr/bin/tini
  - --
