# syntax=dhi.io/build:2-debian13

name: ArgoCD 3.5.x
image: dhi.io/argocd
variant: runtime
tags:
  - "3"
  - "3.5"
  - 3.5.2
  - 3-debian
  - 3-debian13
  - 3.5-debian
  - 3.5-debian13
  - 3.5.2-debian
  - 3.5.2-debian13
platforms:
  - linux/amd64
  - linux/arm64
dates:
  release: "2026-08-04"
vars:
  ARGOCD_USER_ID: "999"
  SEMVER_MAJOR_MINOR_VERSION: "3.5"
  SEMVER_MAJOR_VERSION: "3"
  SEMVER_VERSION: 3.5.2
  VERSION: 3.5.2-3
contents:
  repositories:
    - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
  keyring:
    - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
  packages:
    - '!libelogind0'
    - '!mawk'
    - '!original-awk'
    - argocd-3.5=3.5.2-3
    - base-files
    - ca-certificates-bundle
    - coreutils
    - dash
    - git
    - git-lfs
    - gnupg
    - gpg
    - gpg-agent
    - helm-3
    - kustomize
    - libexpat1
    - libgnutls30t64
    - openssh-client
    - tini
    - tzdata
    - yq-go
accounts:
  run-as: "999"
  users:
    - name: argocd
      uid: 999
      gid: 999
  groups:
    - name: argocd
      gid: 999
      members:
        - argocd
os-release:
  name: Docker Hardened Images (Debian)
  id: debian
  version-id: "13"
  version-codename: trixie
  pretty-name: Docker Hardened Images/Debian GNU/Linux 13 (trixie)
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
environment:
  ARGOCD_USER_ID: "999"
paths:
  - type: directory
    path: /usr/local/bin
    uid: 0
    gid: 0
  - type: symlink
    path: /usr/local/bin/argocd
    uid: 0
    gid: 0
    source: /usr/bin/argocd
  - type: symlink
    path: /usr/local/bin/gpg-wrapper.sh
    uid: 0
    gid: 0
    source: /usr/bin/gpg-wrapper.sh
  - type: symlink
    path: /usr/local/bin/git-verify-wrapper.sh
    uid: 0
    gid: 0
    source: /usr/bin/git-verify-wrapper.sh
  - type: symlink
    path: /usr/local/bin/helm
    uid: 0
    gid: 0
    source: /usr/bin/helm
  - type: emptyfile
    path: /app/config/ssh/ssh_known_hosts
    uid: 0
    gid: 0
  - type: directory
    path: /etc/ssh
    uid: 0
    gid: 0
  - type: symlink
    path: /etc/ssh/ssh_known_hosts
    uid: 0
    gid: 0
    source: /app/config/ssh/ssh_known_hosts
  - type: directory
    path: /app/config/gpg/source
    uid: 0
    gid: 0
    recursive: true
  - type: directory
    path: /app/config/gpg/keys
    uid: 999
    gid: 999
    mode: "0700"
    recursive: true
  - type: symlink
    path: /usr/local/bin/argocd-server
    uid: 0
    gid: 0
    source: /usr/local/bin/argocd
  - type: symlink
    path: /usr/local/bin/argocd-repo-server
    uid: 0
    gid: 0
    source: /usr/local/bin/argocd
  - type: symlink
    path: /usr/local/bin/argocd-cmp-server
    uid: 0
    gid: 0
    source: /usr/local/bin/argocd
  - type: symlink
    path: /usr/local/bin/argocd-application-controller
    uid: 0
    gid: 0
    source: /usr/local/bin/argocd
  - type: symlink
    path: /usr/local/bin/argocd-dex
    uid: 0
    gid: 0
    source: /usr/local/bin/argocd
  - type: symlink
    path: /usr/local/bin/argocd-notifications
    uid: 0
    gid: 0
    source: /usr/local/bin/argocd
  - type: symlink
    path: /usr/local/bin/argocd-applicationset-controller
    uid: 0
    gid: 0
    source: /usr/local/bin/argocd
  - type: symlink
    path: /usr/local/bin/argocd-k8s-auth
    uid: 0
    gid: 0
    source: /usr/local/bin/argocd
  - type: symlink
    path: /usr/local/bin/argocd-commit-server
    uid: 0
    gid: 0
    source: /usr/local/bin/argocd
annotations:
  org.opencontainers.image.description: A minimal ArgoCD image
  org.opencontainers.image.licenses: Apache-2.0
entrypoint:
  - /usr/bin/tini
  - --
