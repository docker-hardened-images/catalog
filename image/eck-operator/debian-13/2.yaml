# syntax=dhi.io/build:2-debian13

name: ECK Operator 2.16.x
image: dhi.io/eck-operator
variant: runtime
tags:
  - "2"
  - "2.16"
  - 2.16.1
  - 2-debian
  - 2-debian13
  - 2.16-debian
  - 2.16-debian13
  - 2.16.1-debian
  - 2.16.1-debian13
platforms:
  - linux/amd64
  - linux/arm64
dates:
  release: "2025-01-17"
  end-of-life: "2027-01-15"
vars:
  COMMIT_SHA: 1f74bdd90e8a0eb0f62df80edc2ae58d820e4e73
  DEBIAN_VERSION: 2.16.1-17
  FLAVORED_SUFFIX: ""
  SEMVER_MAJOR_MINOR_VERSION: "2.16"
  SEMVER_MAJOR_VERSION: "2"
  SEMVER_MINOR_PATCH_VERSION: "16.1"
  SEMVER_VERSION: 2.16.1
  SUFFIX: ""
  VERSION: 2.16.1
contents:
  repositories:
    - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
  keyring:
    - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
  packages:
    - base-files
    - ca-certificates-bundle
    - eck-operator=2.16.1-17
    - tzdata
  files:
    - url: https://raw.githubusercontent.com/elastic/cloud-on-k8s/1f74bdd90e8a0eb0f62df80edc2ae58d820e4e73/config/eck.yaml
      path: /conf/eck.yaml
      uid: 65532
      gid: 65532
      mode: "0644"
    - url: https://raw.githubusercontent.com/elastic/cloud-on-k8s/1f74bdd90e8a0eb0f62df80edc2ae58d820e4e73/LICENSE.txt
      path: /licenses/LICENSE.txt
      uid: 65532
      gid: 65532
      mode: "0644"
    - url: https://raw.githubusercontent.com/elastic/cloud-on-k8s/1f74bdd90e8a0eb0f62df80edc2ae58d820e4e73/NOTICE.txt
      path: /licenses/NOTICE.txt
      uid: 65532
      gid: 65532
      mode: "0644"
  builds:
    - name: sbom
      contents:
        packages:
          - bash
          - coreutils
      pipeline:
        - name: spdx eck-operator
          uses: spdx@v1
          with:
            license: Elastic-License-2.0
            name: eck-operator
            purl: pkg:golang/github.com/elastic/cloud-on-k8s/v2@2.16.1
            version: 2.16.1
      outputs:
        - source: /opt/docker/sbom/eck-operator
          target: /opt/docker/sbom/eck-operator
          uid: 0
          gid: 0
accounts:
  run-as: "65532"
  users:
    - name: nonroot
      uid: 65532
      gid: 65532
  groups:
    - name: nonroot
      gid: 65532
      members:
        - nonroot
os-release:
  name: Docker Hardened Images (Debian)
  id: debian
  version-id: "13"
  version-codename: trixie
  pretty-name: Docker Hardened Images/Debian GNU/Linux 13 (trixie)
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
paths:
  - type: directory
    path: /usr/local/bin
    uid: 0
    gid: 0
  - type: symlink
    path: /usr/local/bin/elastic-operator
    uid: 0
    gid: 0
    source: /usr/bin/eck-operator
  - type: symlink
    path: /elastic-operator
    uid: 0
    gid: 0
    source: /usr/local/bin/elastic-operator
annotations:
  org.opencontainers.image.description: A minimal ECK Operator image
  org.opencontainers.image.licenses: Elastic-License-2.0
entrypoint:
  - /elastic-operator
cmd:
  - manager
