# syntax=dhi.io/build:2-debian13

name: ECK Operator 3.5.x
image: dhi.io/eck-operator
variant: runtime
tags:
  - "3"
  - "3.5"
  - 3.5.0
  - 3-debian
  - 3-debian13
  - 3.5-debian
  - 3.5-debian13
  - 3.5.0-debian
  - 3.5.0-debian13
platforms:
  - linux/amd64
  - linux/arm64
dates:
  release: "2026-02-25"
  end-of-life: "2027-10-15"
vars:
  COMMIT_SHA: 386c7b14f2d1bbb7f2af1e7da997e64875f16e47
  DEBIAN_VERSION: 3.5.0-15
  FLAVORED_SUFFIX: ""
  SEMVER_MAJOR_MINOR_VERSION: "3.5"
  SEMVER_MAJOR_VERSION: "3"
  SEMVER_MINOR_PATCH_VERSION: "5.0"
  SEMVER_VERSION: 3.5.0
  SUFFIX: ""
  VERSION: 3.5.0
contents:
  repositories:
    - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
  keyring:
    - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
  packages:
    - base-files
    - ca-certificates-bundle
    - eck-operator=3.5.0-15
    - tzdata
  files:
    - url: https://raw.githubusercontent.com/elastic/cloud-on-k8s/386c7b14f2d1bbb7f2af1e7da997e64875f16e47/config/eck.yaml
      path: /conf/eck.yaml
      uid: 65532
      gid: 65532
      mode: "0644"
    - url: https://raw.githubusercontent.com/elastic/cloud-on-k8s/386c7b14f2d1bbb7f2af1e7da997e64875f16e47/LICENSE.txt
      path: /licenses/LICENSE.txt
      uid: 65532
      gid: 65532
      mode: "0644"
    - url: https://raw.githubusercontent.com/elastic/cloud-on-k8s/386c7b14f2d1bbb7f2af1e7da997e64875f16e47/NOTICE.txt
      path: /licenses/NOTICE.txt
      uid: 65532
      gid: 65532
      mode: "0644"
  builds:
    - name: sbom
      contents:
        packages:
          - bash
          - coreutils
      pipeline:
        - name: spdx eck-operator
          uses: spdx@v1
          with:
            license: Elastic-License-2.0
            name: eck-operator
            purl: pkg:golang/github.com/elastic/cloud-on-k8s/v3@3.5.0
            version: 3.5.0
      outputs:
        - source: /opt/docker/sbom/eck-operator
          target: /opt/docker/sbom/eck-operator
          uid: 0
          gid: 0
accounts:
  run-as: "65532"
  users:
    - name: nonroot
      uid: 65532
      gid: 65532
  groups:
    - name: nonroot
      gid: 65532
      members:
        - nonroot
os-release:
  name: Docker Hardened Images (Debian)
  id: debian
  version-id: "13"
  version-codename: trixie
  pretty-name: Docker Hardened Images/Debian GNU/Linux 13 (trixie)
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
paths:
  - type: directory
    path: /usr/local/bin
    uid: 0
    gid: 0
  - type: symlink
    path: /usr/local/bin/elastic-operator
    uid: 0
    gid: 0
    source: /usr/bin/eck-operator
  - type: symlink
    path: /elastic-operator
    uid: 0
    gid: 0
    source: /usr/local/bin/elastic-operator
annotations:
  org.opencontainers.image.description: A minimal ECK Operator image
  org.opencontainers.image.licenses: Elastic-License-2.0
entrypoint:
  - /elastic-operator
cmd:
  - manager
