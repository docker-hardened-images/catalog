  VERSION: 1.5.0-0
contents:
  repositories:
    - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
  keyring:
    - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
  packages:
    - aws-network-policy-agent-cli=1.5.0-0
    - aws-network-policy-agent-cliv6=1.5.0-0
    - aws-network-policy-agent=1.5.0-0
    - base-files
    - ca-certificates-bundle
    - libc6
    - tzdata
accounts:
  root: true
  run-as: root
  users:
    - name: nonroot
      uid: 65532
      gid: 65532
