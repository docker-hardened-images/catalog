# syntax=dhi.io/build:2-debian13

name: AWS Network Policy Agent 1.x (dev)
image: dhi.io/aws-network-policy-agent
variant: dev
tags:
  - 1-dev
  - 1.5-dev
  - 1.5.0-dev
  - 1-debian-dev
  - 1-debian13-dev
  - 1.5-debian-dev
  - 1.5-debian13-dev
  - 1.5.0-debian-dev
  - 1.5.0-debian13-dev
platforms:
  - linux/amd64
  - linux/arm64
dates:
  release: "2025-12-19"
vars:
  COMMIT_SHA: e497e298e72ccb2ab3dc6542f31c0827235da3fb
  FLAVORED_SUFFIX: -dev
  SEMVER_MAJOR_MINOR_VERSION: "1.5"
  SEMVER_MAJOR_VERSION: "1"
  SEMVER_VERSION: 1.5.0
  SUFFIX: -dev
  VERSION: 1.5.0-0
contents:
  repositories:
    - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
  keyring:
    - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
  packages:
    - '!gawk'
    - '!libelogind0'
    - '!original-awk'
    - apt
    - aws-network-policy-agent-cli-dev=1.5.0-0
    - aws-network-policy-agent-cliv6-dev=1.5.0-0
    - aws-network-policy-agent-dev=1.5.0-0
    - base-files
    - bash
    - ca-certificates
    - ca-certificates-bundle
    - coreutils
    - diffutils
    - dpkg
    - findutils
    - grep
    - libc-bin
    - libc6
    - mawk
    - perl-base
    - sed
    - tzdata
    - util-linux
accounts:
  root: true
  run-as: root
  users:
    - name: nonroot
      uid: 65532
      gid: 65532
    - name: _apt
      uid: 42
      gid: 65532
  groups:
    - name: nonroot
      gid: 65532
      members:
        - nonroot
os-release:
  name: Docker Hardened Images (Debian)
  id: debian
  version-id: "13"
  version-codename: trixie
  pretty-name: Docker Hardened Images/Debian GNU/Linux 13 (trixie)
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
environment:
  DEBIAN_FRONTEND: noninteractive
paths:
  - type: symlink
    path: /controller
    uid: 0
    gid: 0
    source: /usr/bin/aws-network-policy-agent
  - type: symlink
    path: /aws-eks-na-cli
    uid: 0
    gid: 0
    source: /usr/bin/cli
  - type: symlink
    path: /aws-eks-na-cli-v6
    uid: 0
    gid: 0
    source: /usr/bin/cliv6
  - type: symlink
    path: /tc.v4ingress.bpf.o
    uid: 0
    gid: 0
    source: /usr/lib/aws-network-policy-agent/tc.v4ingress.bpf.o
  - type: symlink
    path: /tc.v4egress.bpf.o
    uid: 0
    gid: 0
    source: /usr/lib/aws-network-policy-agent/tc.v4egress.bpf.o
  - type: symlink
    path: /tc.v6ingress.bpf.o
    uid: 0
    gid: 0
    source: /usr/lib/aws-network-policy-agent/tc.v6ingress.bpf.o
  - type: symlink
    path: /tc.v6egress.bpf.o
    uid: 0
    gid: 0
    source: /usr/lib/aws-network-policy-agent/tc.v6egress.bpf.o
  - type: symlink
    path: /v4events.bpf.o
    uid: 0
    gid: 0
    source: /usr/lib/aws-network-policy-agent/v4events.bpf.o
  - type: symlink
    path: /v6events.bpf.o
    uid: 0
    gid: 0
    source: /usr/lib/aws-network-policy-agent/v6events.bpf.o
annotations:
  org.opencontainers.image.description: A minimal AWS Network Policy Agent image
  org.opencontainers.image.licenses: Apache-2.0
entrypoint:
  - /controller
