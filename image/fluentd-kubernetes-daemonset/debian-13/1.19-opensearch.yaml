# syntax=dhi.io/build:2-debian13

name: Fluentd Kubernetes Daemonset 1.19.x (opensearch)
image: dhi.io/fluentd-kubernetes-daemonset
variant: runtime
flavor: opensearch
tags:
  - 1-opensearch
  - 1.19-opensearch
  - 1.19.3-opensearch
  - 1-debian-opensearch
  - 1-debian13-opensearch
  - 1.19-debian-opensearch
  - 1.19-debian13-opensearch
  - 1.19.3-debian-opensearch
  - 1.19.3-debian13-opensearch
platforms:
  - linux/amd64
  - linux/arm64
dates:
  release: "2025-07-30"
vars:
  DESTINATION: opensearch
  GEM_HOME: /usr/local/bundle
  RUBY_VERSION: 3.4.10-36
  SEMVER_MAJOR_MINOR_VERSION: "1.19"
  SEMVER_MAJOR_VERSION: "1"
  SEMVER_VERSION: 1.19.3
  VERSION: 1.19.3-0
contents:
  repositories:
    - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
  keyring:
    - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
  packages:
    - '!libelogind0'
    - '!mawk'
    - '!original-awk'
    - base-files
    - bash
    - ca-certificates
    - ca-certificates-bundle
    - coreutils
    - fluentd-kubernetes-daemonset-opensearch=1.19.3-0
    - libc6
    - libcrypt1
    - libffi8
    - libgcc-s1
    - libgmp10
    - libjemalloc2
    - libssl3t64
    - libstdc++6
    - libyaml-0-2
    - ruby-3.4=3.4.10-36
    - tini
    - tzdata
    - zlib1g
accounts:
  run-as: nonroot
  users:
    - name: nonroot
      uid: 65532
      gid: 65532
  groups:
    - name: nonroot
      gid: 65532
      members:
        - nonroot
os-release:
  name: Docker Hardened Images (Debian)
  id: debian
  version-id: "13"
  version-codename: trixie
  pretty-name: Docker Hardened Images/Debian GNU/Linux 13 (trixie)
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
environment:
  BUNDLE_APP_CONFIG: /usr/local/bundle
  BUNDLE_SILENCE_ROOT_WARNING: "true"
  GEM_HOME: /usr/local/bundle
  PATH: /usr/local/bundle/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
paths:
  - type: directory
    path: /usr/local
    uid: 0
    gid: 0
  - type: symlink
    path: /usr/local/bundle
    uid: 0
    gid: 0
    source: /usr/lib/fluentd-kubernetes-daemonset/bundle
  - type: directory
    path: /etc/fluent
    uid: 0
    gid: 0
    mode: "0755"
  - type: directory
    path: /etc/fluent/conf.d
    uid: 0
    gid: 0
    mode: "0755"
  - type: directory
    path: /fluentd/log
    uid: 65532
    gid: 65532
    mode: "0755"
  - type: file
    path: /usr/local/bin/docker-entrypoint.sh
    uid: 0
    gid: 0
    mode: "0755"
    source: image/fluentd-kubernetes-daemonset/bin/docker-entrypoint.sh
  - type: file
    path: /etc/fluent/fluent.conf
    uid: 0
    gid: 0
    mode: "0644"
    source: image/fluentd-kubernetes-daemonset/config/opensearch/fluent.conf
  - type: file
    path: /etc/fluent/systemd.conf
    uid: 0
    gid: 0
    mode: "0644"
    source: image/fluentd-kubernetes-daemonset/config/opensearch/systemd.conf
  - type: file
    path: /etc/fluent/kubernetes.conf
    uid: 0
    gid: 0
    mode: "0644"
    source: image/fluentd-kubernetes-daemonset/config/opensearch/kubernetes.conf
  - type: file
    path: /etc/fluent/disable.conf
    uid: 0
    gid: 0
    mode: "0644"
    source: image/fluentd-kubernetes-daemonset/config/disable.conf
  - type: file
    path: /etc/fluent/prometheus.conf
    uid: 0
    gid: 0
    mode: "0644"
    source: image/fluentd-kubernetes-daemonset/config/prometheus.conf
  - type: file
    path: /etc/fluent/tail_container_parse.conf
    uid: 0
    gid: 0
    mode: "0644"
    source: image/fluentd-kubernetes-daemonset/config/tail_container_parse.conf
  - type: directory
    path: /etc/fluent/kubernetes
    uid: 0
    gid: 0
    mode: "0755"
    source: image/fluentd-kubernetes-daemonset/config/kubernetes
  - type: directory
    path: /etc/fluent/plugins
    uid: 0
    gid: 0
    mode: "0755"
  - type: file
    path: /etc/fluent/plugins/parser_kubernetes.rb
    uid: 0
    gid: 0
    mode: "0644"
    source: image/fluentd-kubernetes-daemonset/plugins/parser_kubernetes.rb
  - type: file
    path: /etc/fluent/plugins/parser_multiline_kubernetes.rb
    uid: 0
    gid: 0
    mode: "0644"
    source: image/fluentd-kubernetes-daemonset/plugins/parser_multiline_kubernetes.rb
annotations:
  org.opencontainers.image.description: A minimal Fluentd Kubernetes DaemonSet image
  org.opencontainers.image.licenses: Apache-2.0
entrypoint:
  - /usr/bin/tini
  - --
  - /usr/local/bin/docker-entrypoint.sh
cmd:
  - fluentd
ports:
  - 24231/tcp
