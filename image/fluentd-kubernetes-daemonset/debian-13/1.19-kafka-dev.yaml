# syntax=dhi.io/build:2-debian13

name: Fluentd Kubernetes Daemonset 1.19.x (kafka, dev)
image: dhi.io/fluentd-kubernetes-daemonset
variant: dev
flavor: kafka
tags:
  - 1-kafka-dev
  - 1.19-kafka-dev
  - 1.19.3-kafka-dev
  - 1-debian-kafka-dev
  - 1-debian13-kafka-dev
  - 1.19-debian-kafka-dev
  - 1.19-debian13-kafka-dev
  - 1.19.3-debian-kafka-dev
  - 1.19.3-debian13-kafka-dev
platforms:
  - linux/amd64
  - linux/arm64
dates:
  release: "2025-07-30"
vars:
  BINUTILS_ARCH: '#{ target.arch == "amd64" ? "x86-64" : "aarch64" }'
  DESTINATION: kafka
  GEM_HOME: /usr/local/bundle
  RUBY_VERSION: 3.4.10-37
  SEMVER_MAJOR_MINOR_VERSION: "1.19"
  SEMVER_MAJOR_VERSION: "1"
  SEMVER_VERSION: 1.19.3
  VERSION: 1.19.3-3
contents:
  repositories:
    - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
  keyring:
    - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
  packages:
    - '!binutils'
    - '!binutils-aarch64-linux-gnu'
    - '!binutils-common'
    - '!binutils-x86-64-linux-gnu'
    - '!gawk'
    - '!libbinutils'
    - '!libctf-nobfd0'
    - '!libctf0'
    - '!libelogind0'
    - '!libgprofng0'
    - '!libsframe1'
    - '!mawk'
    - '!original-awk'
    - apt
    - base-files
    - bash
    - binutils-latest
    - binutils-latest-${BINUTILS_ARCH}-linux-gnu
    - build-essential
    - ca-certificates
    - ca-certificates-bundle
    - coreutils
    - curl
    - diffutils
    - dpkg
    - findutils
    - fluentd-kubernetes-daemonset-kafka=1.19.3-3
    - git
    - grep
    - krb5-user
    - libc-bin
    - libc6
    - libcrypt1
    - libctf-nobfd0-latest
    - libctf0-latest
    - libexpat1
    - libffi8
    - libgcc-s1
    - libgmp10
    - libgprofng0-latest
    - libjemalloc-dev
    - libjemalloc2
    - libsasl2-2
    - libsasl2-modules-gssapi-mit
    - libsnappy1v5
    - libssl3t64
    - libstdc++6
    - libyaml-0-2
    - libyaml-dev
    - make
    - mawk
    - perl-base
    - ruby-3.4-dev=3.4.10-37
    - ruby-3.4=3.4.10-37
    - sed
    - tini
    - tzdata
    - util-linux
    - zlib1g
  builds:
    - name: locale
      contents:
        packages:
          - bash
          - locales
          - coreutils
          - gzip
      pipeline:
        - name: install locales
          runs: |
            set -eux -o pipefail

            ln -s /etc/locale.alias /usr/share/locale/locale.alias

            echo "en_US.UTF-8 UTF-8" >> /etc/locale.gen
            locale-gen en_US.UTF-8
      outputs:
        - source: /usr/share/locale
          target: /usr/share/locale
          uid: 0
          gid: 0
        - source: /usr/lib/locale
          target: /usr/lib/locale
          uid: 0
          gid: 0
accounts:
  root: true
  run-as: root
  users:
    - name: nonroot
      uid: 65532
      gid: 65532
    - name: nonroot
      uid: 65532
      gid: 65532
    - name: _apt
      uid: 42
      gid: 65532
  groups:
    - name: nonroot
      gid: 65532
      members:
        - nonroot
    - name: nonroot
      gid: 65532
      members:
        - nonroot
os-release:
  name: Docker Hardened Images (Debian)
  id: debian
  version-id: "13"
  version-codename: trixie
  pretty-name: Docker Hardened Images/Debian GNU/Linux 13 (trixie)
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
environment:
  BUNDLE_APP_CONFIG: /usr/local/bundle
  BUNDLE_SILENCE_ROOT_WARNING: "true"
  DEBIAN_FRONTEND: noninteractive
  GEM_HOME: /usr/local/bundle
  LANG: en_US.UTF-8
  LANGUAGE: en_US:en
  LC_ALL: en_US.UTF-8
  PATH: /usr/local/bundle/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
paths:
  - type: directory
    path: /usr/local
    uid: 0
    gid: 0
  - type: symlink
    path: /usr/local/bundle
    uid: 0
    gid: 0
    source: /usr/lib/fluentd-kubernetes-daemonset/bundle
  - type: directory
    path: /etc/fluent
    uid: 0
    gid: 0
    mode: "0755"
  - type: directory
    path: /etc/fluent/conf.d
    uid: 0
    gid: 0
    mode: "0755"
  - type: directory
    path: /fluentd/log
    uid: 65532
    gid: 65532
    mode: "0755"
  - type: file
    path: /usr/local/bin/docker-entrypoint.sh
    uid: 0
    gid: 0
    mode: "0755"
    source: image/fluentd-kubernetes-daemonset/bin/docker-entrypoint.sh
  - type: file
    path: /etc/fluent/fluent.conf
    uid: 0
    gid: 0
    mode: "0644"
    source: image/fluentd-kubernetes-daemonset/config/kafka/fluent.conf
  - type: file
    path: /etc/fluent/systemd.conf
    uid: 0
    gid: 0
    mode: "0644"
    source: image/fluentd-kubernetes-daemonset/config/kafka/systemd.conf
  - type: file
    path: /etc/fluent/kubernetes.conf
    uid: 0
    gid: 0
    mode: "0644"
    source: image/fluentd-kubernetes-daemonset/config/kafka/kubernetes.conf
  - type: file
    path: /etc/fluent/disable.conf
    uid: 0
    gid: 0
    mode: "0644"
    source: image/fluentd-kubernetes-daemonset/config/disable.conf
  - type: file
    path: /etc/fluent/prometheus.conf
    uid: 0
    gid: 0
    mode: "0644"
    source: image/fluentd-kubernetes-daemonset/config/prometheus.conf
  - type: file
    path: /etc/fluent/tail_container_parse.conf
    uid: 0
    gid: 0
    mode: "0644"
    source: image/fluentd-kubernetes-daemonset/config/tail_container_parse.conf
  - type: directory
    path: /etc/fluent/kubernetes
    uid: 0
    gid: 0
    mode: "0755"
    source: image/fluentd-kubernetes-daemonset/config/kubernetes
  - type: directory
    path: /etc/fluent/plugins
    uid: 0
    gid: 0
    mode: "0755"
  - type: file
    path: /etc/fluent/plugins/parser_kubernetes.rb
    uid: 0
    gid: 0
    mode: "0644"
    source: image/fluentd-kubernetes-daemonset/plugins/parser_kubernetes.rb
  - type: file
    path: /etc/fluent/plugins/parser_multiline_kubernetes.rb
    uid: 0
    gid: 0
    mode: "0644"
    source: image/fluentd-kubernetes-daemonset/plugins/parser_multiline_kubernetes.rb
  - type: symlink
    path: /usr/bin/kinit
    uid: 0
    gid: 0
    source: /usr/bin/kinit.mit
  - type: symlink
    path: /usr/bin/klist
    uid: 0
    gid: 0
    source: /usr/bin/klist.mit
  - type: symlink
    path: /usr/bin/kdestroy
    uid: 0
    gid: 0
    source: /usr/bin/kdestroy.mit
annotations:
  org.opencontainers.image.description: A minimal Fluentd Kubernetes DaemonSet image
  org.opencontainers.image.licenses: Apache-2.0
entrypoint:
  - /usr/bin/tini
  - --
  - /usr/local/bin/docker-entrypoint.sh
cmd:
  - fluentd
ports:
  - 24231/tcp
