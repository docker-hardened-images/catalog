# syntax=dhi.io/build:2-debian13

name: PgBouncer 1.26.x
image: dhi.io/pgbouncer
variant: runtime
tags:
  - "1"
  - "1.26"
  - 1.26.0
  - 1-debian
  - 1-debian13
  - 1.26-debian
  - 1.26-debian13
  - 1.26.0-debian
  - 1.26.0-debian13
platforms:
  - linux/amd64
  - linux/arm64
vars:
  FLAVORED_SUFFIX: ""
  PACKAGE_NAME: pgbouncer-1.26
  SEMVER_MAJOR_MINOR_VERSION: "1.26"
  SEMVER_MAJOR_VERSION: "1"
  SEMVER_VERSION: 1.26.0
  SUFFIX: ""
  VERSION: 1.26.0-1
contents:
  repositories:
    - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
  keyring:
    - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
  packages:
    - base-files
    - ca-certificates-bundle
    - libc-ares2
    - libc6
    - libcrypt1
    - libevent-2.1-7t64
    - libssl3t64
    - pgbouncer-1.26=1.26.0-1
    - tzdata
accounts:
  run-as: nonroot
  users:
    - name: nonroot
      uid: 65532
      gid: 65532
  groups:
    - name: nonroot
      gid: 65532
      members:
        - nonroot
os-release:
  name: Docker Hardened Images (Debian)
  id: debian
  version-id: "13"
  version-codename: trixie
  pretty-name: Docker Hardened Images/Debian GNU/Linux 13 (trixie)
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
environment:
  PATH: /usr/local/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
  PGBOUNCER_VERSION: 1.26.0
paths:
  - type: directory
    path: /etc/pgbouncer
    uid: 65532
    gid: 65532
    mode: "0755"
  - type: directory
    path: /var/log/pgbouncer
    uid: 65532
    gid: 65532
    mode: "0755"
  - type: directory
    path: /run/pgbouncer
    uid: 65532
    gid: 65532
    mode: "0755"
  - type: directory
    path: /usr/local/bin
    uid: 0
    gid: 0
  - type: symlink
    path: /usr/local/bin/pgbouncer
    uid: 0
    gid: 0
    source: /usr/bin/pgbouncer
annotations:
  org.opencontainers.image.description: A minimal PgBouncer image
  org.opencontainers.image.licenses: ISC
entrypoint:
  - pgbouncer
cmd:
  - /etc/pgbouncer/pgbouncer.ini
ports:
  - "6432"
