# syntax=dhi.io/build:2-debian13

name: PgBouncer 1.25.x (dev)
image: dhi.io/pgbouncer
variant: dev
tags:
  - 1.25-dev
  - 1.25.2-dev
  - 1.25-debian-dev
  - 1.25-debian13-dev
  - 1.25.2-debian-dev
  - 1.25.2-debian13-dev
platforms:
  - linux/amd64
  - linux/arm64
vars:
  FLAVORED_SUFFIX: -dev
  PACKAGE_NAME: pgbouncer-1.25
  SEMVER_MAJOR_MINOR_VERSION: "1.25"
  SEMVER_MAJOR_VERSION: "1"
  SEMVER_VERSION: 1.25.2
  SUFFIX: ""
  VERSION: 1.25.2-2
contents:
  repositories:
    - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
  keyring:
    - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
  packages:
    - '!gawk'
    - '!libelogind0'
    - '!original-awk'
    - apt
    - base-files
    - bash
    - ca-certificates
    - ca-certificates-bundle
    - coreutils
    - diffutils
    - dpkg
    - findutils
    - grep
    - libc-ares2
    - libc-bin
    - libc6
    - libcrypt1
    - libevent-2.1-7t64
    - libssl3t64
    - mawk
    - perl-base
    - pgbouncer-1.25=1.25.2-2
    - sed
    - tzdata
    - util-linux
accounts:
  root: true
  run-as: root
  users:
    - name: nonroot
      uid: 65532
      gid: 65532
    - name: _apt
      uid: 42
      gid: 65532
  groups:
    - name: nonroot
      gid: 65532
      members:
        - nonroot
os-release:
  name: Docker Hardened Images (Debian)
  id: debian
  version-id: "13"
  version-codename: trixie
  pretty-name: Docker Hardened Images/Debian GNU/Linux 13 (trixie)
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
environment:
  DEBIAN_FRONTEND: noninteractive
  PATH: /usr/local/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
  PGBOUNCER_VERSION: 1.25.2
paths:
  # CloudNativePG's pooler instance manager execs /usr/bin/pgbouncer (the
  # path Debian's package uses) and has no override, so without this link
  # the image crash-loops as a CNPG Pooler image (catalog#417).
  - type: symlink
    path: /usr/bin/pgbouncer
    uid: 0
    gid: 0
    source: /usr/local/bin/pgbouncer
  - type: directory
    path: /etc/pgbouncer
    uid: 65532
    gid: 65532
    mode: "0755"
  - type: directory
    path: /var/log/pgbouncer
    uid: 65532
    gid: 65532
    mode: "0755"
  - type: directory
    path: /run/pgbouncer
    uid: 65532
    gid: 65532
    mode: "0755"
  - type: directory
    path: /usr/local/bin
    uid: 0
    gid: 0
  - type: symlink
    path: /usr/local/bin/pgbouncer
    uid: 0
    gid: 0
    source: /usr/bin/pgbouncer
annotations:
  org.opencontainers.image.description: A minimal PgBouncer image
  org.opencontainers.image.licenses: ISC
entrypoint:
  - pgbouncer
cmd:
  - /etc/pgbouncer/pgbouncer.ini
ports:
  - "6432"
