# syntax=dhi.io/build:2-debian13

name: Grist 1.x (dev)
image: dhi.io/grist
variant: dev
tags:
  - 1-dev
  - 1.7-dev
  - 1.7.17-dev
  - 1-debian-dev
  - 1-debian13-dev
  - 1.7-debian-dev
  - 1.7-debian13-dev
  - 1.7.17-debian-dev
  - 1.7.17-debian13-dev
platforms:
  - linux/amd64
  - linux/arm64
vars:
  PYTHON_MAJOR_MINOR: "3.13"
  SEMVER_MAJOR_MINOR_VERSION: "1.7"
  SEMVER_MAJOR_VERSION: "1"
  SEMVER_VERSION: 1.7.17
  VERSION: 1.7.17-2
contents:
  repositories:
    - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
  keyring:
    - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
  packages:
    - '!gawk'
    - '!libelogind0'
    - '!original-awk'
    - apt
    - base-files
    - bash
    - ca-certificates
    - ca-certificates-bundle
    - coreutils
    - diffutils
    - dpkg
    - findutils
    - grep
    - grist=1.7.17-2
    - libc-bin
    - libc6
    - libgomp1
    - libsqlite3-0
    - libstdc++6
    - mawk
    - netbase
    - nodejs-24
    - perl-base
    - python-3.13
    - sed
    - tini
    - tzdata
    - util-linux
accounts:
  root: true
  run-as: root
  users:
    - name: nonroot
      uid: 65532
      gid: 65532
    - name: _apt
      uid: 42
      gid: 65532
  groups:
    - name: nonroot
      gid: 65532
      members:
        - nonroot
os-release:
  name: Docker Hardened Images (Debian)
  id: debian
  version-id: "13"
  version-codename: trixie
  pretty-name: Docker Hardened Images/Debian GNU/Linux 13 (trixie)
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
work-dir: /grist
environment:
  DEBIAN_FRONTEND: noninteractive
  GRIST_DATA_DIR: /persist/docs
  GRIST_DOCKER_GROUP: nonroot
  GRIST_DOCKER_USER: nonroot
  GRIST_HOST: 0.0.0.0
  GRIST_INST_DIR: /persist
  GRIST_ORG_IN_PATH: "true"
  GRIST_SANDBOX_FLAVOR: unsandboxed
  GRIST_SERVE_SAME_ORIGIN: "true"
  GRIST_SESSION_COOKIE: grist_core
  GRIST_SINGLE_PORT: "true"
  GVISOR_FLAGS: -unprivileged -ignore-cgroups
  NODE_ENV: production
  NODE_OPTIONS: --no-deprecation
  PATH: /opt/python/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
  PYTHON_VERSION_ON_CREATION: "3"
  TYPEORM_DATABASE: /persist/home.sqlite3
paths:
  - type: symlink
    path: /grist
    uid: 0
    gid: 0
    source: /usr/lib/grist
  - type: directory
    path: /usr/lib/grist/sandbox/pyodide/_build/cache
    uid: 0
    gid: 0
    mode: "0755"
  - type: directory
    path: /persist
    uid: 65532
    gid: 65532
    mode: "0755"
  - type: directory
    path: /persist/docs
    uid: 65532
    gid: 65532
    mode: "0755"
annotations:
  org.opencontainers.image.description: A minimal Grist image
  org.opencontainers.image.licenses: Apache-2.0
entrypoint:
  - /grist/sandbox/docker_entrypoint.sh
cmd:
  - node
  - /grist/sandbox/supervisor.mjs
ports:
  - 8484/tcp
