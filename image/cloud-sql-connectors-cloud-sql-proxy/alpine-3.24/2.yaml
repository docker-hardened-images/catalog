# syntax=dhi.io/build:2-alpine3.24

name: Cloud SQL Auth Proxy 2.x
image: dhi.io/cloud-sql-connectors-cloud-sql-proxy
variant: runtime
tags:
  - 2-alpine
  - 2.28-alpine
  - 2-alpine3.24
  - 2.28.1-alpine
  - 2.28-alpine3.24
  - 2.28.1-alpine3.24
platforms:
  - linux/amd64
  - linux/arm64
dates:
  release: "2023-01-17"
vars:
  DHI_TAGS_OVERWRITE: "true"
  FLAVORED_SUFFIX: ""
  SEMVER_MAJOR_MINOR_VERSION: "2.28"
  SEMVER_MAJOR_VERSION: "2"
  SEMVER_VERSION: 2.28.1
  SUFFIX: ""
  VERSION: 2.28.1-r0
contents:
  repositories:
    - https://dhi.io/apk/alpine/v3.24/main
    - https://dl-cdn.alpinelinux.org/alpine/v3.24/main
    - https://dl-cdn.alpinelinux.org/alpine/v3.24/community
  keyring:
    - https://dhi.io/keyring/dhi-apk@docker-0F81AD7700D99184.rsa.pub
  packages:
    - alpine-baselayout-data
    - ca-certificates-bundle
    - cloud-sql-proxy-2=2.28.1-r0
    - tzdata
accounts:
  run-as: nonroot
  users:
    - name: nonroot
      uid: 65532
      gid: 65532
  groups:
    - name: nonroot
      gid: 65532
      members:
        - nonroot
os-release:
  name: Docker Hardened Images (Alpine)
  id: alpine
  version-id: "3.24"
  pretty-name: Docker Hardened Images/Alpine Linux v3.24
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
work-dir: /home/nonroot
environment:
  SSL_CERT_FILE: /etc/ssl/certs/ca-certificates.crt
paths:
  - type: directory
    path: /home/nonroot
    uid: 65532
    gid: 65532
    mode: "0700"
  - type: symlink
    path: /cloud-sql-proxy
    uid: 0
    gid: 0
    source: /usr/bin/cloud-sql-proxy
annotations:
  org.opencontainers.image.description: A minimal Cloud SQL Auth Proxy image
  org.opencontainers.image.licenses: Apache-2.0
entrypoint:
  - /cloud-sql-proxy
