# syntax=dhi.io/build:2-debian13

name: Cloud SQL Auth Proxy 2.x (dev)
image: dhi.io/cloud-sql-connectors-cloud-sql-proxy
variant: dev
tags:
  - 2-dev
  - 2.28-dev
  - 2.28.1-dev
  - 2-debian-dev
  - 2-debian13-dev
  - 2.28-debian-dev
  - 2.28-debian13-dev
  - 2.28.1-debian-dev
  - 2.28.1-debian13-dev
platforms:
  - linux/amd64
  - linux/arm64
dates:
  release: "2023-01-17"
vars:
  FLAVORED_SUFFIX: -dev
  SEMVER_MAJOR_MINOR_VERSION: "2.28"
  SEMVER_MAJOR_VERSION: "2"
  SEMVER_VERSION: 2.28.1
  SUFFIX: -dev
  VERSION: 2.28.1-0
contents:
  repositories:
    - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
  keyring:
    - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
  packages:
    - '!gawk'
    - '!libelogind0'
    - '!original-awk'
    - apt
    - base-files
    - bash
    - ca-certificates
    - ca-certificates-bundle
    - cloud-sql-proxy-2-dev=2.28.1-0
    - coreutils
    - diffutils
    - dpkg
    - findutils
    - grep
    - libc-bin
    - mawk
    - perl-base
    - sed
    - tzdata
    - util-linux
accounts:
  root: true
  run-as: root
  users:
    - name: nonroot
      uid: 65532
      gid: 65532
    - name: _apt
      uid: 42
      gid: 65532
  groups:
    - name: nonroot
      gid: 65532
      members:
        - nonroot
os-release:
  name: Docker Hardened Images (Debian)
  id: debian
  version-id: "13"
  version-codename: trixie
  pretty-name: Docker Hardened Images/Debian GNU/Linux 13 (trixie)
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
work-dir: /home/nonroot
environment:
  DEBIAN_FRONTEND: noninteractive
  SSL_CERT_FILE: /etc/ssl/certs/ca-certificates.crt
paths:
  - type: directory
    path: /home/nonroot
    uid: 65532
    gid: 65532
    mode: "0700"
  - type: symlink
    path: /cloud-sql-proxy
    uid: 0
    gid: 0
    source: /usr/bin/cloud-sql-proxy
annotations:
  org.opencontainers.image.description: A minimal Cloud SQL Auth Proxy image
  org.opencontainers.image.licenses: Apache-2.0
entrypoint:
  - /cloud-sql-proxy
