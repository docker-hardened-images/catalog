# syntax=dhi.io/build:2-debian13

name: ASP.NET Core 11.x (dev)
image: dhi.io/aspnetcore
variant: dev
tags:
  - 11-dev
  - 11.0-dev
  - 11.0.0-dev
  - 11-debian-dev
  - 11-debian13-dev
  - 11.0-debian-dev
  - 11.0-debian13-dev
  - 11.0.0-debian-dev
  - 11.0.0-debian13-dev
platforms:
  - linux/amd64
  - linux/arm64
dates:
  release: "2026-11-10"
  end-of-life: "2028-11-14"
vars:
  DOTNET_RUNTIME_VERSION: 11.0.0-0
  SEMVER_MAJOR_MINOR_VERSION: "11.0"
  SEMVER_MAJOR_VERSION: "11"
  SEMVER_VERSION: 11.0.0
  VERSION: 11.0.0-0
contents:
  repositories:
    - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
  keyring:
    - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
  packages:
    - '!gawk'
    - '!libelogind0'
    - '!mawk'
    - '!original-awk'
    - apt
    - aspnetcore-runtime-11=11.0.0-0
    - base-files
    - bash
    - ca-certificates
    - ca-certificates-bundle
    - coreutils
    - diffutils
    - dotnet-runtime-11-oci-config=11.0.0-0
    - dotnet-runtime-11=11.0.0-0
    - dpkg
    - findutils
    - grep
    - libc-bin
    - libc6
    - libgcc-s1
    - libgssapi-krb5-2
    - libicu76
    - libssl3t64
    - libstdc++6
    - mawk
    - perl-base
    - sed
    - tzdata
    - util-linux
    - zlib1g
accounts:
  root: true
  run-as: root
  users:
    - name: nonroot
      uid: 65532
      gid: 65532
    - name: _apt
      uid: 42
      gid: 65532
  groups:
    - name: nonroot
      gid: 65532
      members:
        - nonroot
os-release:
  name: Docker Hardened Images (Debian)
  id: debian
  version-id: "13"
  version-codename: trixie
  pretty-name: Docker Hardened Images/Debian GNU/Linux 13 (trixie)
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
environment:
  ASPNET_VERSION: 11.0.0
  ASPNETCORE_HTTP_PORTS: "8080"
  DEBIAN_FRONTEND: noninteractive
  DOTNET_ROOT: /opt/dotnet
  DOTNET_RUNNING_IN_CONTAINER: "true"
  DOTNET_VERSION: 11.0.0
  PATH: /opt/dotnet:/opt/dotnet/tools:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
  SSL_CERT_FILE: /etc/ssl/certs/ca-certificates.crt
paths:
  - type: directory
    path: /opt
    uid: 0
    gid: 0
  - type: symlink
    path: /opt/dotnet
    uid: 0
    gid: 0
    source: /usr/lib/dotnet
annotations:
  org.opencontainers.image.description: A minimal ASP.NET Core image
  org.opencontainers.image.licenses: MIT
cmd:
  - dotnet
  - --help
