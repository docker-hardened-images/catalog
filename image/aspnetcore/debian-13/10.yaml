# syntax=dhi.io/build:2-debian13

name: ASP.NET Core 10.x
image: dhi.io/aspnetcore
variant: runtime
tags:
  - "10"
  - "10.0"
  - 10.0.15
  - 10-debian
  - 10-debian13
  - 10.0-debian
  - 10.0-debian13
  - 10.0.15-debian
  - 10.0.15-debian13
platforms:
  - linux/amd64
  - linux/arm64
dates:
  release: "2025-11-11"
  end-of-life: "2028-11-14"
vars:
  DOTNET_RUNTIME_VERSION: 10.0.15-1
  SEMVER_MAJOR_MINOR_VERSION: "10.0"
  SEMVER_MAJOR_VERSION: "10"
  SEMVER_VERSION: 10.0.15
  VERSION: 10.0.15-0
contents:
  repositories:
    - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
  keyring:
    - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
  packages:
    - '!acl'
    - '!cdebconf'
    - '!debconf'
    - '!dpkg'
    - '!gcc-14'
    - '!gcc-14-base'
    - '!gcc-base'
    - '!install-info'
    - '!libacl1'
    - '!libdebian-installer'
    - '!libdebian-installer4'
    - '!libelogind0'
    - '!libnewt0.52'
    - '!libpcre2-8-0'
    - '!libreadline8t64'
    - '!libslang2'
    - '!libtextwrap'
    - '!libtextwrap1'
    - '!libtinfo6'
    - '!mawk'
    - '!openssl'
    - '!openssl-provider-legacy'
    - '!original-awk'
    - '!pcre2'
    - '!readline-common'
    - '!tar'
    - aspnetcore-runtime-10=10.0.15-0
    - base-files
    - ca-certificates
    - ca-certificates-bundle
    - dotnet-runtime-10-oci-config=10.0.15-1
    - dotnet-runtime-10=10.0.15-1
    - libc6
    - libgcc-s1
    - libgssapi-krb5-2
    - libicu76
    - libssl3t64
    - libstdc++6
    - tzdata
    - zlib1g
accounts:
  run-as: nonroot
  users:
    - name: nonroot
      uid: 65532
      gid: 65532
  groups:
    - name: nonroot
      gid: 65532
      members:
        - nonroot
os-release:
  name: Docker Hardened Images (Debian)
  id: debian
  version-id: "13"
  version-codename: trixie
  pretty-name: Docker Hardened Images/Debian GNU/Linux 13 (trixie)
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
environment:
  ASPNETCORE_HTTP_PORTS: "8080"
  DOTNET_ROOT: /opt/dotnet
  DOTNET_RUNNING_IN_CONTAINER: "true"
  DOTNET_VERSION: 10.0.15
  PATH: /opt/dotnet:/opt/dotnet/tools:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
  SSL_CERT_FILE: /etc/ssl/certs/ca-certificates.crt
paths:
  - type: directory
    path: /opt
    uid: 0
    gid: 0
  - type: symlink
    path: /opt/dotnet
    uid: 0
    gid: 0
    source: /usr/lib/dotnet
annotations:
  org.opencontainers.image.description: A minimal ASP.NET Core image
  org.opencontainers.image.licenses: MIT
cmd:
  - dotnet
  - --help
