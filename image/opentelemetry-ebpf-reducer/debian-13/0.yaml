# syntax=dhi.io/build:2-debian13

name: OpenTelemetry eBPF Reducer 0.x
image: dhi.io/opentelemetry-ebpf-reducer
variant: runtime
tags:
  - "0"
  - "0.11"
  - 0.11.0
  - 0-debian
  - 0-debian13
  - 0.11-debian
  - 0.11-debian13
  - 0.11.0-debian
  - 0.11.0-debian13
platforms:
  - linux/amd64
dates:
  release: "2023-06-27"
vars:
  SEMVER_MAJOR_MINOR_VERSION: "0.11"
  SEMVER_MAJOR_VERSION: "0"
  SEMVER_VERSION: 0.11.0
  VERSION: 0.11.0-0
contents:
  repositories:
    - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
  keyring:
    - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
  packages:
    - '!libelogind0'
    - '!mawk'
    - '!original-awk'
    - base-files
    - bash
    - bc
    - ca-certificates-bundle
    - coreutils
    - libabsl20240722
    - libc6
    - libcares2
    - libcurl4t64
    - libcurlpp0t64
    - libelf1t64
    - libgcc-s1
    - libgrpc++1.51t64
    - libgrpc29t64
    - libprotobuf32t64
    - libssl3t64
    - libstdc++6
    - libzstd1
    - netcat-openbsd
    - opentelemetry-ebpf-reducer=0.11.0-0
    - sed
    - tzdata
    - zlib1g
accounts:
  run-as: nonroot
  users:
    - name: nonroot
      uid: 65532
      gid: 65532
  groups:
    - name: nonroot
      gid: 65532
      members:
        - nonroot
os-release:
  name: Docker Hardened Images (Debian)
  id: debian
  version-id: "13"
  version-codename: trixie
  pretty-name: Docker Hardened Images/Debian GNU/Linux 13 (trixie)
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
environment:
  EBPF_NET_DATA_DIR: /run/ebpf_net
  EBPF_NET_INSTALL_DIR: /usr/bin
  EBPF_NET_LOG_FILE_PATH: /run/ebpf_net/ebpf_net.log
paths:
  - type: directory
    path: /run/ebpf_net
    uid: 65532
    gid: 65532
    mode: "0770"
  - type: directory
    path: /srv
    uid: 0
    gid: 0
  - type: symlink
    path: /srv/opentelemetry-ebpf-reducer
    uid: 0
    gid: 0
    source: /usr/bin/opentelemetry-ebpf-reducer
  - type: symlink
    path: /srv/entrypoint.sh
    uid: 0
    gid: 0
    source: /usr/lib/opentelemetry-ebpf-reducer/entrypoint.sh
annotations:
  org.opencontainers.image.description: OpenTelemetry eBPF Reducer - aggregates and enriches network telemetry from OpenTelemetry eBPF collectors, exporting via Prometheus or OTLP/gRPC
  org.opencontainers.image.licenses: Apache-2.0
entrypoint:
  - /usr/lib/opentelemetry-ebpf-reducer/entrypoint.sh
cmd:
  - --port
  - "8000"
  - --prom
  - 0.0.0.0:7010
ports:
  - 8000/tcp
  - 7010/tcp
  - 7001/tcp
  - 7000/tcp
