# syntax=dhi.io/build:2-debian13

name: Vault 2.x (compat, dev)
image: dhi.io/vault
variant: dev
flavor: compat
tags:
  - 2-compat-dev
  - 2.1-compat-dev
  - 2.1.0-compat-dev
  - 2-debian-compat-dev
  - 2-debian13-compat-dev
  - 2.1-debian-compat-dev
  - 2.1-debian13-compat-dev
  - 2.1.0-debian-compat-dev
  - 2.1.0-debian13-compat-dev
platforms:
  - linux/amd64
  - linux/arm64
dates:
  release: "2026-04-13"
vars:
  BASE_DIGEST: sha256:4a01816cedefdd66a4a7f32813de794d8b8a8478e68deafd49f82e81c249cd8d
  BASE_TAG: 20250419-debian13
  COMMIT_SHA: cb6a54face072e372480d7cc2e64a3110b84756f
  GO_VERSION: "1"
  GOLANG_REFERENCE: dhi/golang:1.27.1-debian13-dev@sha256:aba199ecba031bbf5b35d9b4ccc4111123dc5b0ab4a3a41644299b6882c3de53
  GOSU_REFERENCE: dhi/pkg-gosu:1.19-debian13@sha256:83891258f255381719744799fcecf08927e48410523b068da378c2c346211511
  SEMVER_MAJOR_MINOR_VERSION: "2.1"
  SEMVER_MAJOR_VERSION: "2"
  SEMVER_VERSION: 2.1.0
  VERSION: 2.1.0
contents:
  repositories:
    - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
  keyring:
    - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
  packages:
    - '!gawk'
    - '!libelogind0'
    - '!original-awk'
    - apt
    - bash
    - ca-certificates
    - coreutils
    - diffutils
    - dpkg
    - findutils
    - grep
    - libc-bin
    - libcap2-bin
    - mawk
    - perl-base
    - sed
    - tini
    - util-linux
  builds:
    - name: vault
      uses: dhi.io/golang:1.27.1-debian13-dev@sha256:aba199ecba031bbf5b35d9b4ccc4111123dc5b0ab4a3a41644299b6882c3de53
      work-dir: /go/src/github.com/hashicorp/vault
      caches:
        - path: /go/pkg/mod
      contents:
        packages:
          - binutils
          - libcap2-bin
        files:
          - url: git+https://github.com/hashicorp/vault.git#v2.1.0
            checksum: cb6a54face072e372480d7cc2e64a3110b84756f
            path: /go/src/github.com/hashicorp/vault
            spdx:
              name: vault
              version: 2.1.0
              packages:
                - name: vault
                  purl: pkg:dhi/vault@2.1.0
                  license: BUSL-1.1
            uid: 0
            gid: 0
      pipeline:
        - name: update go dependencies
          uses: go/bump@v2
          with:
            deps:
              - golang.org/x/crypto@v0.56.0
              - golang.org/x/image@v0.5.0
              - github.com/Azure/go-ntlmssp@v0.1.1
              - github.com/apache/thrift@v0.24.0
              - github.com/docker/cli@v29.2.0
              - github.com/go-jose/go-jose/v3@v3.0.5
              - github.com/go-jose/go-jose/v4@v4.1.4
              - github.com/jackc/pgx/v5@v5.9.2
              - github.com/microsoft/kiota-http-go@v1.5.5
              - github.com/satori/go.uuid@v1.2.1-0.20181016170032-d91630c85102
              - go.opentelemetry.io/otel/exporters/otlp/otlptrace/otlptracehttp@v1.43.0
            download: true
        - name: patch go 1.27 http test expectations
          uses: git/patch@v1
          with:
            patch: ${source.dir}/patch/go-1.27-http-running-plugin-version-expectations.patch
        - name: patch enumer for go 1.27
          runs: |
            set -eux -o pipefail

            sed -i 's|github.com/stevendpclark/enumer@v0.0.0-20250122154818-a42b666c3cd3|github.com/ryancragun/enumer@v0.0.0-20260825172633-bd953a03880e|' tools/tools.sh
        - name: bootstrap
          privileged: true
          runs: |
            set -eux -o pipefail

            # Retry bootstrap to handle transient network errors from proxy.golang.org
            for attempt in 1 2 3; do
              if make bootstrap; then
                break
              elif [ "$attempt" -eq 3 ]; then
                echo "Bootstrap failed after 3 attempts" >&2
                exit 1
              else
                echo "Bootstrap attempt $attempt failed, retrying..." >&2
                sleep 5
              fi
            done
        - name: test
          runs: |
            set -eux -o pipefail

            # Vault's broad -short suite still runs Docker, network, cluster,
            # and cloud-heavy tests. Run real unit tests from root-module
            # packages that are stable across the 1.x and 2.x lines, while
            # avoiding root ./vault, external_tests, physical backends,
            # database plugins, command tests, nested module roots, and
            # helper/trace, whose tests conflict with buildkit's active tracer.
            # Within the selected packages, skip only tests that require host
            # syslog, root-sensitive filesystem permissions, or Keybase network
            # access, none of which are feasible in the offline build sandbox.
            unset VAULT_ADDR VAULT_TOKEN VAULT_DEV_ROOT_TOKEN_ID VAULT_ACC || true
            GOMAXPROCS=1 CGO_ENABLED=0 go test -tags=testonly -count=1 -p 1 -parallel=16 -timeout 30m \
              -skip 'Test(AuditBroker_Register_MultipleFails|SyslogBackend_newSyslogBackend|NewSyslogSink|Logger_SetupLoggerWithInValidLogPathPermission|PubKeyFilesFlagSetKeybase|FetchKeybasePubkeys)' \
              ./shamir \
              ./internal/observability/event \
              ./internalshared/... \
              ./vault/diagnose \
              ./builtin/logical/pki/parsing \
              ./helper/dhutil \
              ./helper/fairshare \
              ./helper/flag-kv \
              ./helper/flag-slice \
              ./helper/forwarding \
              ./helper/hostutil \
              ./helper/locking \
              ./helper/logging \
              ./helper/metricsutil \
              ./helper/monitor \
              ./helper/namespace \
              ./helper/osutil \
              ./helper/parseip \
              ./helper/pgpkeys \
              ./helper/policies \
              ./helper/random \
              ./helper/syncmap \
              ./helper/testhelpers \
              ./helper/timeutil \
              ./helper/useragent \
              ./helper/versions

            if [ "${target.fips}" = "true" ]; then
              # Keep the broad suite in strict FIPS mode, but run packages
              # that intentionally exercise legacy crypto paths in lenient
              # mode so FIPS variants still validate the supported paths.
              GOMAXPROCS=1 CGO_ENABLED=0 go test \
                -tags=testonly -count=1 -p 1 -parallel=16 -timeout 30m \
                -skip 'Test(AuditBroker_Register_MultipleFails|SyslogBackend_newSyslogBackend|NewSyslogSink)' \
                ./audit \
                ./builtin/logical/totp \
                ./http \
                ./helper/pkcs7 \
                ./helper/storagepacker

              # This transit subtest expects strict-mode rejections for RSA
              # PSS verification combinations, so skip it in the lenient pass
              # that keeps the package's other unit coverage available.
              GOMAXPROCS=1 CGO_ENABLED=0 go test \
                -tags=testonly -count=1 -p 1 -parallel=16 -timeout 30m \
                -skip 'TestTransit_SignVerify_RSA_PSS' \
                ./builtin/logical/transit
            else
              GOMAXPROCS=1 CGO_ENABLED=0 go test \
                -tags=testonly -count=1 -p 1 -parallel=16 -timeout 30m \
                -skip 'Test(AuditBroker_Register_MultipleFails|SyslogBackend_newSyslogBackend|NewSyslogSink)' \
                ./audit \
                ./builtin/logical/totp \
                ./builtin/logical/transit \
                ./http \
                ./helper/pkcs7 \
                ./helper/storagepacker
            fi
        - name: build
          uses: go/build@v1
          environment:
            GOFLAGS: -buildvcs=false
          with:
            ldflags:
              - -X github.com/hashicorp/vault/version.fullVersion=2.1.0
              - -X github.com/hashicorp/vault/version.GitCommit=cb6a54face072e372480d7cc2e64a3110b84756f
              - -X github.com/hashicorp/vault/version.BuildDate=$(date -u -d @${SOURCE_DATE_EPOCH} +'%FT%TZ')
            output: ${target.dir}/usr/local/bin/vault
            tags: vault
      paths:
        - type: file
          path: ${source.dir}/patch/CVE-2026-3605-reject-wildcards-in-acl-templates.patch
          uid: 0
          gid: 0
          source: image/vault/patch/CVE-2026-3605-reject-wildcards-in-acl-templates.patch
        - type: file
          path: ${source.dir}/patch/CVE-2026-4525-strip-vault-token-authz-passthrough.patch
          uid: 0
          gid: 0
          source: image/vault/patch/CVE-2026-4525-strip-vault-token-authz-passthrough.patch
        - type: file
          path: ${source.dir}/patch/CVE-2026-5052-reject-unsafe-acme-validation-targets.patch
          uid: 0
          gid: 0
          source: image/vault/patch/CVE-2026-5052-reject-unsafe-acme-validation-targets.patch
        - type: file
          path: ${source.dir}/patch/go-1.27-http-running-plugin-version-expectations.patch
          uid: 0
          gid: 0
          source: image/vault/patch/go-1.27-http-running-plugin-version-expectations.patch
      outputs:
        - source: ${target.dir}/usr/local/bin
          target: /usr/local/bin
          uid: 0
          gid: 0
        - source: /opt/docker/sbom/vault
          target: /opt/docker/sbom/vault
          uid: 0
          gid: 0
  artifacts:
    - name: dhi.io/pkg-gosu:1.19-debian13@sha256:83891258f255381719744799fcecf08927e48410523b068da378c2c346211511
      includes:
        - opt/docker/sbom/gosu
        - usr/local/sbin/gosu
      uid: 0
      gid: 0
accounts:
  root: true
  run-as: root
  users:
    - name: vault
      uid: 1000
      gid: 1000
    - name: _apt
      uid: 42
      gid: 65532
  groups:
    - name: vault
      gid: 1000
      members:
        - vault
os-release:
  name: Docker Hardened Images (Debian)
  id: debian
  version-id: "13"
  version-codename: trixie
  pretty-name: Docker Hardened Images/Debian GNU/Linux 13 (trixie)
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
environment:
  DEBIAN_FRONTEND: noninteractive
paths:
  - type: file
    path: /usr/local/bin/docker-entrypoint.sh
    uid: 0
    gid: 0
    mode: "0755"
    source: image/vault/bin/docker-entrypoint-compat.sh
  - type: directory
    path: /vault/data
    uid: 1000
    gid: 1000
    mode: "0755"
  - type: directory
    path: /vault/config
    uid: 1000
    gid: 1000
    mode: "0755"
  - type: directory
    path: /vault/logs
    uid: 1000
    gid: 1000
    mode: "0755"
  - type: directory
    path: /vault/file
    uid: 1000
    gid: 1000
    mode: "0755"
annotations:
  org.opencontainers.image.description: A minimal Vault image
  org.opencontainers.image.licenses: BUSL-1.1
entrypoint:
  - /usr/local/bin/docker-entrypoint.sh
cmd:
  - server
  - -config=/vault/config
ports:
  - 8200/tcp
