# syntax=dhi.io/build:2-alpine3.24

name: Metabase 0.x (dev)
image: dhi.io/metabase
variant: dev
tags:
  - 0-alpine-dev
  - 0.63-alpine-dev
  - 0-alpine3.24-dev
  - 0.63-alpine3.24-dev
  - 0.63.18.4-alpine-dev
  - 0.63.18.4-alpine3.24-dev
platforms:
  - linux/amd64
  - linux/arm64
dates:
  release: "2026-07-21"
vars:
  JAVA_MAJOR_VERSION: "25"
  SEMVER_MAJOR_MINOR_VERSION: "0.63"
  SEMVER_MAJOR_VERSION: "0"
  SEMVER_VERSION: 0.63.18.4
  VERSION: 0.63.18.4-r0
contents:
  repositories:
    - https://dhi.io/apk/alpine/v3.24/main
    - https://dl-cdn.alpinelinux.org/alpine/v3.24/main
    - https://dl-cdn.alpinelinux.org/alpine/v3.24/community
  keyring:
    - https://dhi.io/keyring/dhi-apk@docker-0F81AD7700D99184.rsa.pub
  packages:
    - alpine-baselayout-data
    - apk-tools
    - bash
    - busybox
    - ca-certificates
    - ca-certificates-bundle
    - coreutils
    - curl
    - eclipse-temurin-25-jre
    - eclipse-temurin-25-jre-oci-config
    - font-noto
    - font-noto-arabic
    - font-noto-cjk
    - font-noto-hebrew
    - font-noto-thai
    - fontconfig
    - metabase=0.63.18.4-r0
    - musl-utils
    - tzdata
  builds:
    - name: java-cacerts
      contents:
        packages:
          - bash
          - coreutils
          - eclipse-temurin-25-jre
        files:
          - url: https://truststore.pki.rds.amazonaws.com/global/global-bundle.pem
            checksum: sha256:e5bb2084ccf45087bda1c9bffdea0eb15ee67f0b91646106e466714f9de3c7e3
            path: ${source.dir}/rds-combined-ca-bundle.pem
            spdx:
              name: aws-rds-ca-bundle
              version: 2026-07
              packages:
                - name: aws-rds-ca-bundle
                  purl: pkg:generic/aws-rds-ca-bundle@2026-07
                  license: LicenseRef-Public-Domain-CA-Certificates
            uid: 0
            gid: 0
          - url: https://raw.githubusercontent.com/metabase/metabase/v0.63.18.4/bin/docker/DigiCertGlobalRootG2.crt.pem
            checksum: sha256:5d550643b6400d4341550a9b14aedd0b4fac33ae5deb7d8247b6b4f799c13306
            path: ${source.dir}/DigiCertGlobalRootG2.crt.pem
            spdx:
              name: digicert-global-root-g2
              version: "2013"
              packages:
                - name: digicert-global-root-g2
                  purl: pkg:generic/digicert-global-root-g2@2013
                  license: LicenseRef-Public-Domain-CA-Certificates
            uid: 0
            gid: 0
      pipeline:
        - name: import certs into jvm trust store
          runs: |
            set -eux -o pipefail

            JVM_DIR=/usr/lib/jvm/temurin-25
            $JVM_DIR/bin/keytool -noprompt -import -trustcacerts -alias aws-rds \
              -file ${source.dir}/rds-combined-ca-bundle.pem \
              -keystore $JVM_DIR/lib/security/cacerts -storepass changeit
            $JVM_DIR/bin/keytool -noprompt -import -trustcacerts -alias azure-cert \
              -file ${source.dir}/DigiCertGlobalRootG2.crt.pem \
              -keystore $JVM_DIR/lib/security/cacerts -storepass changeit

            install -D -m 0644 $JVM_DIR/lib/security/cacerts ${target.dir}$JVM_DIR/lib/security/cacerts
            install -D -m 0644 ${source.dir}/rds-combined-ca-bundle.pem ${target.dir}/app/certs/rds-combined-ca-bundle.pem
            install -D -m 0644 ${source.dir}/DigiCertGlobalRootG2.crt.pem ${target.dir}/app/certs/DigiCertGlobalRootG2.crt.pem
      outputs:
        - source: ${target.dir}/usr/lib/jvm/temurin-25/lib/security/cacerts
          target: /usr/lib/jvm/temurin-25/lib/security/cacerts
          uid: 0
          gid: 0
        - source: ${target.dir}/app/certs
          target: /app/certs
          uid: 0
          gid: 0
accounts:
  root: true
  run-as: root
  users:
    - name: metabase
      uid: 2000
      gid: 2000
  groups:
    - name: metabase
      gid: 2000
      members:
        - metabase
os-release:
  name: Docker Hardened Images (Alpine)
  id: alpine
  version-id: "3.24"
  pretty-name: Docker Hardened Images/Alpine Linux v3.24
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
environment:
  FC_LANG: en-US
  LANG: en_US.UTF-8
  LANGUAGE: en_US:en
  LC_ALL: en_US.UTF-8
  LC_CTYPE: en_US.UTF-8
  MB_DB_FILE: /metabase.db
paths:
  - type: directory
    path: /app
    uid: 0
    gid: 0
    mode: "0755"
  - type: symlink
    path: /app/run_metabase.sh
    uid: 0
    gid: 0
    source: /usr/bin/run_metabase.sh
  - type: symlink
    path: /app/metabase.jar
    uid: 0
    gid: 0
    source: /usr/share/metabase/metabase.jar
  - type: directory
    path: /metabase.db
    uid: 2000
    gid: 2000
    mode: "0775"
  - type: directory
    path: /plugins
    uid: 2000
    gid: 2000
    mode: "0775"
  - type: directory
    path: /opt/java
    uid: 0
    gid: 0
    mode: "0755"
  - type: symlink
    path: /opt/java/openjdk
    uid: 0
    gid: 0
    source: /usr/lib/jvm/temurin-25
annotations:
  org.opencontainers.image.description: A minimal Metabase image
  org.opencontainers.image.licenses: AGPL-3.0-only
entrypoint:
  - /app/run_metabase.sh
ports:
  - 3000/tcp
