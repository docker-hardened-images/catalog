# syntax=dhi.io/build:2-debian13

name: Stakater Reloader 1.x (dev)
image: dhi.io/stakater-reloader
variant: dev
tags:
  - 1-dev
  - 1.4-dev
  - 1.4.21-dev
  - v1.4.21-dev
  - 1-debian-dev
  - 1-debian13-dev
  - 1.4-debian-dev
  - 1.4-debian13-dev
  - 1.4.21-debian-dev
  - 1.4.21-debian13-dev
platforms:
  - linux/amd64
  - linux/arm64
vars:
  ARCH: '#{ target.arch == "amd64" ? "amd64" : "arm64" }'
  FLAVORED_SUFFIX: -dev
  SEMVER_MAJOR_MINOR_VERSION: "1.4"
  SEMVER_MAJOR_VERSION: "1"
  SEMVER_VERSION: 1.4.21
  SUFFIX: -dev
  VERSION: 1.4.21-1
contents:
  repositories:
    - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
  keyring:
    - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
  packages:
    - '!gawk'
    - '!gcc-14'
    - '!libelogind0'
    - '!libslang2'
    - '!mawk'
    - '!original-awk'
    - apt
    - base-files
    - bash
    - ca-certificates
    - coreutils
    - diffutils
    - dpkg
    - findutils
    - grep
    - libc-bin
    - mawk
    - perl-base
    - sed
    - stakater-reloader-dev=1.4.21-1
    - util-linux
accounts:
  root: true
  run-as: root
  users:
    - name: nonroot
      uid: 65532
      gid: 65532
    - name: _apt
      uid: 42
      gid: 65532
  groups:
    - name: nonroot
      gid: 65532
      members:
        - nonroot
os-release:
  name: Docker Hardened Images (Debian)
  id: debian
  version-id: "13"
  version-codename: trixie
  pretty-name: Docker Hardened Images/Debian GNU/Linux 13 (trixie)
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
environment:
  DEBIAN_FRONTEND: noninteractive
paths:
  - type: directory
    path: /usr/local/bin
    uid: 0
    gid: 0
  - type: symlink
    path: /usr/local/bin/Reloader
    uid: 0
    gid: 0
    source: /usr/bin/Reloader
annotations:
  org.opencontainers.image.description: A minimal stakater/reloader image
  org.opencontainers.image.licenses: Apache-2.0
entrypoint:
  - Reloader
