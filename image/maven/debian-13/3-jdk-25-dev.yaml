# syntax=dhi.io/build:2-debian13

name: Maven 3.x JDK 25.x (dev)
image: dhi.io/maven
variant: dev
tags:
  - 3-jdk25-dev
  - 3.10-jdk25-dev
  - 3.10.1-jdk25-dev
  - 3-jdk25-debian-dev
  - 3-jdk25-debian13-dev
  - 3.10-jdk25-debian-dev
  - 3.10-jdk25-debian13-dev
  - 3.10.1-jdk25-debian-dev
  - 3.10.1-jdk25-debian13-dev
platforms:
  - linux/amd64
  - linux/arm64
dates:
  release: "2013-10-22"
vars:
  JAVA_FIPS_SUFFIX: ""
  JAVA_MAJOR_VERSION: "25"
  JDK_MAJOR_VERSION: "25"
  MAVEN_MAJOR_MINOR_VERSION: "3.10"
  MAVEN_MAJOR_VERSION: "3"
  SEMVER_MAJOR_MINOR_VERSION: "3.10"
  SEMVER_MAJOR_VERSION: "3"
  SEMVER_VERSION: 3.10.1
  VERSION: 3.10.1-0
contents:
  repositories:
    - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
  keyring:
    - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
  packages:
    - '!gawk'
    - '!libelogind0'
    - '!libslang2'
    - '!mawk'
    - '!original-awk'
    - apt
    - base-files
    - bash
    - ca-certificates
    - coreutils
    - diffutils
    - dpkg
    - eclipse-temurin-25-jdk
    - eclipse-temurin-25-jdk-oci-config
    - findutils
    - grep
    - libc-bin
    - maven=3.10.1-0
    - mawk
    - perl-base
    - sed
    - util-linux
  builds:
    - name: locale
      contents:
        packages:
          - bash
          - locales
          - coreutils
          - gzip
      pipeline:
        - name: install locales
          runs: |
            set -eux -o pipefail

            ln -s /etc/locale.alias /usr/share/locale/locale.alias

            echo "en_US.UTF-8 UTF-8" >> /etc/locale.gen
            locale-gen en_US.UTF-8
      outputs:
        - source: /usr/share/locale
          target: /usr/share/locale
          uid: 0
          gid: 0
        - source: /usr/lib/locale
          target: /usr/lib/locale
          uid: 0
          gid: 0
accounts:
  root: true
  run-as: root
  users:
    - name: nonroot
      uid: 65532
      gid: 65532
    - name: _apt
      uid: 42
      gid: 65532
  groups:
    - name: nonroot
      gid: 65532
      members:
        - nonroot
os-release:
  name: Docker Hardened Images (Debian)
  id: debian
  version-id: "13"
  version-codename: trixie
  pretty-name: Docker Hardened Images/Debian GNU/Linux 13 (trixie)
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
work-dir: /build
environment:
  DEBIAN_FRONTEND: noninteractive
  JAVA_HOME: /usr/lib/jvm/temurin-25
  LANG: en_US.UTF-8
  LANGUAGE: en_US:en
  LC_ALL: en_US.UTF-8
  MAVEN_HOME: /opt/java/apache-maven-3.10.1
  MAVEN_VERSION: 3.10.1
paths:
  - type: directory
    path: /build
    uid: 65532
    gid: 65532
    mode: "0755"
  - type: directory
    path: /opt/java
    uid: 0
    gid: 0
  - type: symlink
    path: /opt/java/apache-maven-3.10.1
    uid: 0
    gid: 0
    source: /usr/share/java/maven-3
  - type: directory
    path: /usr/local/bin
    uid: 0
    gid: 0
  - type: symlink
    path: /usr/local/bin/mvn
    uid: 0
    gid: 0
    source: /usr/bin/mvn
  - type: symlink
    path: /usr/local/bin/mvnDebug
    uid: 0
    gid: 0
    source: /usr/bin/mvnDebug
  - type: symlink
    path: /usr/local/bin/mvnyjp
    uid: 0
    gid: 0
    source: /usr/bin/mvnyjp
annotations:
  org.opencontainers.image.description: A minimal Maven image
  org.opencontainers.image.licenses: Apache-2.0
entrypoint:
  - mvn
