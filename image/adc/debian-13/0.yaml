# syntax=dhi.io/build:2-debian13

name: API Declarative CLI 0.x
image: dhi.io/adc
variant: runtime
tags:
  - "0"
  - "0.29"
  - 0.29.0
  - 0-debian
  - 0-debian13
  - 0.29-debian
  - 0.29-debian13
  - 0.29.0-debian
  - 0.29.0-debian13
platforms:
  - linux/amd64
  - linux/arm64
dates:
  release: "2026-02-04"
vars:
  SEMVER_MAJOR_MINOR_VERSION: "0.29"
  SEMVER_MAJOR_VERSION: "0"
  SEMVER_VERSION: 0.29.0
  VERSION: 0.29.0-0
contents:
  repositories:
    - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
  keyring:
    - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
  packages:
    - '!libelogind0'
    - '!mawk'
    - '!original-awk'
    - adc=0.29.0-0
    - base-files
    - ca-certificates-bundle
    - libc6
    - libgomp1
    - libstdc++6
    - netbase
    - nodejs-24
    - tzdata
accounts:
  run-as: nonroot
  users:
    - name: nonroot
      uid: 65532
      gid: 65532
  groups:
    - name: nonroot
      gid: 65532
      members:
        - nonroot
os-release:
  name: Docker Hardened Images (Debian)
  id: debian
  version-id: "13"
  version-codename: trixie
  pretty-name: Docker Hardened Images/Debian GNU/Linux 13 (trixie)
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
paths:
  - type: directory
    path: /opt
    uid: 0
    gid: 0
  - type: symlink
    path: /opt/adc
    uid: 0
    gid: 0
    source: /usr/share/adc
annotations:
  org.opencontainers.image.description: A minimal API Declarative CLI image
  org.opencontainers.image.licenses: Apache-2.0
entrypoint:
  - node
  - /opt/adc/main.cjs
