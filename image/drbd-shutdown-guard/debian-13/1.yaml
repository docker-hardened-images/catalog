# syntax=dhi.io/build:2-debian13

name: drbd-shutdown-guard 1.x
image: dhi.io/drbd-shutdown-guard
variant: runtime
tags:
  - "1"
  - "1.1"
  - 1.1.2
  - 1-debian
  - 1-debian13
  - 1.1-debian
  - 1.1-debian13
  - 1.1.2-debian
  - 1.1.2-debian13
platforms:
  - linux/amd64
  - linux/arm64
dates:
  release: "2025-12-05"
vars:
  DRBD_UTILS_VERSION: 9.34.0-3
  FLAVORED_SUFFIX: ""
  SEMVER_MAJOR_MINOR_VERSION: "1.1"
  SEMVER_MAJOR_VERSION: "1"
  SEMVER_VERSION: 1.1.2
  SUFFIX: ""
  VERSION: 1.1.2-0
contents:
  repositories:
    - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
  keyring:
    - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
  packages:
    - base-files
    - bash
    - ca-certificates-bundle
    - drbd-shutdown-guard=1.1.2-0
    - drbd-utils=9.34.0-3
    - libkeyutils1
    - mount
    - tzdata
accounts:
  root: true
  run-as: root
  users:
    - name: nonroot
      uid: 65532
      gid: 65532
  groups:
    - name: nonroot
      gid: 65532
      members:
        - nonroot
os-release:
  name: Docker Hardened Images (Debian)
  id: debian
  version-id: "13"
  version-codename: trixie
  pretty-name: Docker Hardened Images/Debian GNU/Linux 13 (trixie)
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
environment:
  DRBDSETUP_LOCATION: /usr/sbin/drbdsetup
paths:
  - type: directory
    path: /usr/local/sbin
    uid: 0
    gid: 0
  - type: symlink
    path: /usr/local/sbin/drbd-shutdown-guard
    uid: 0
    gid: 0
    source: /usr/bin/drbd-shutdown-guard
  - type: directory
    path: /run
    uid: 0
    gid: 0
    mode: "0755"
annotations:
  org.opencontainers.image.description: A minimal drbd-shutdown-guard image
  org.opencontainers.image.licenses: Apache-2.0
cmd:
  - /usr/local/sbin/drbd-shutdown-guard
  - install
