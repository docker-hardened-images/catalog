# syntax=dhi.io/build:2-alpine3.24

name: Rancher Agent 2.15.x (dev)
image: dhi.io/rancher-agent
variant: dev
tags:
  - 2-alpine-dev
  - 2.15-alpine-dev
  - 2-alpine3.24-dev
  - 2.15.4-alpine-dev
  - 2.15-alpine3.24-dev
  - 2.15.4-alpine3.24-dev
platforms:
  - linux/amd64
  - linux/arm64
dates:
  release: "2026-08-27"
  end-of-life: "2028-02-27"
vars:
  FLAVORED_SUFFIX: -dev
  KUBECTL_MAJOR_MINOR_VERSION: "1.36"
  PKG_SUFFIX: ""
  SEMVER_MAJOR_MINOR_VERSION: "2.15"
  SEMVER_MAJOR_VERSION: "2"
  SEMVER_VERSION: 2.15.4
  SUFFIX: -dev
  TURTLES_CHART_VERSION: 110.0.4+up0.27.4
  VERSION: 2.15.4-r0
  WEBHOOK_CHART_VERSION: 110.0.5+up0.11.5
contents:
  repositories:
    - https://dhi.io/apk/alpine/v3.24/main
    - https://dl-cdn.alpinelinux.org/alpine/v3.24/main
    - https://dl-cdn.alpinelinux.org/alpine/v3.24/community
  keyring:
    - https://dhi.io/keyring/dhi-apk@docker-0F81AD7700D99184.rsa.pub
  packages:
    - acl
    - alpine-baselayout-data
    - apk-tools
    - bash
    - bash-completion
    - bind-tools
    - busybox
    - ca-certificates
    - ca-certificates-bundle
    - coreutils
    - curl
    - findutils
    - gawk
    - git
    - grep
    - gzip
    - iproute2-minimal
    - jq
    - kubectl-1.36
    - less
    - musl-utils
    - net-tools
    - openssh-client-default
    - openssl
    - rancher-agent-2.15-common=2.15.4-r0
    - rancher-agent-2.15-dev=2.15.4-r0
    - sed
    - tar
    - tzdata
    - util-linux
    - xz
accounts:
  root: true
  run-as: root
  users:
    - name: nonroot
      uid: 65532
      gid: 65532
  groups:
    - name: nonroot
      gid: 65532
      members:
        - nonroot
os-release:
  name: Docker Hardened Images (Alpine)
  id: alpine
  version-id: "3.24"
  pretty-name: Docker Hardened Images/Alpine Linux v3.24
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
work-dir: /var/lib/rancher
environment:
  AGENT_IMAGE: rancher/rancher-agent:v2.15.4
  CATTLE_RANCHER_TURTLES_VERSION: 110.0.4+up0.27.4
  CATTLE_RANCHER_WEBHOOK_VERSION: 110.0.5+up0.11.5
  SSL_CERT_DIR: /etc/kubernetes/ssl/certs
paths:
  - type: directory
    path: /var/lib/rancher
    uid: 0
    gid: 0
    mode: "0755"
annotations:
  org.opencontainers.image.description: A minimal Rancher Agent image
  org.opencontainers.image.licenses: Apache-2.0
entrypoint:
  - /usr/bin/run.sh
ports:
  - 80/tcp
  - 443/tcp
  - 444/tcp
