# syntax=dhi.io/build:2-alpine3.24

name: Rancher Agent 2.12.x (dev)
image: dhi.io/rancher-agent
variant: dev
tags:
  - 2.12-alpine-dev
  - 2.12.16-alpine-dev
  - 2.12-alpine3.24-dev
  - 2.12.16-alpine3.24-dev
platforms:
  - linux/amd64
  - linux/arm64
dates:
  release: "2025-08-29"
  end-of-life: "2027-02-28"
vars:
  FLAVORED_SUFFIX: -dev
  KUBECTL_MAJOR_MINOR_VERSION: "1.33"
  PKG_SUFFIX: ""
  PROVISIONING_CAPI_CHART_VERSION: 107.0.0+up0.8.0
  SEMVER_MAJOR_MINOR_VERSION: "2.12"
  SEMVER_MAJOR_VERSION: "2"
  SEMVER_VERSION: 2.12.16
  SUFFIX: -dev
  VERSION: 2.12.16-r0
  WEBHOOK_CHART_VERSION: 107.0.13+up0.8.13
contents:
  repositories:
    - https://dhi.io/apk/alpine/v3.24/main
    - https://dl-cdn.alpinelinux.org/alpine/v3.24/main
    - https://dl-cdn.alpinelinux.org/alpine/v3.24/community
  keyring:
    - https://dhi.io/keyring/dhi-apk@docker-0F81AD7700D99184.rsa.pub
  packages:
    - acl
    - alpine-baselayout-data
    - apk-tools
    - bash
    - bash-completion
    - bind-tools
    - busybox
    - ca-certificates
    - ca-certificates-bundle
    - coreutils
    - curl
    - findutils
    - gawk
    - git
    - grep
    - gzip
    - iproute2-minimal
    - jq
    - kubectl-1.33
    - less
    - musl-utils
    - net-tools
    - openssh-client-default
    - openssl
    - rancher-agent-2.12-common=2.12.16-r0
    - rancher-agent-2.12-dev=2.12.16-r0
    - sed
    - tar
    - tini
    - tzdata
    - util-linux
    - xz
accounts:
  root: true
  run-as: root
  users:
    - name: nonroot
      uid: 65532
      gid: 65532
  groups:
    - name: nonroot
      gid: 65532
      members:
        - nonroot
os-release:
  name: Docker Hardened Images (Alpine)
  id: alpine
  version-id: "3.24"
  pretty-name: Docker Hardened Images/Alpine Linux v3.24
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
work-dir: /var/lib/rancher
environment:
  AGENT_IMAGE: rancher/rancher-agent:v2.12.16
  CATTLE_RANCHER_PROVISIONING_CAPI_VERSION: 107.0.0+up0.8.0
  CATTLE_RANCHER_WEBHOOK_VERSION: 107.0.13+up0.8.13
  SSL_CERT_DIR: /etc/kubernetes/ssl/certs
paths:
  - type: directory
    path: /var/lib/rancher
    uid: 0
    gid: 0
    mode: "0755"
  - type: symlink
    path: /usr/bin/tini
    uid: 0
    gid: 0
    source: /sbin/tini
annotations:
  org.opencontainers.image.description: A minimal Rancher Agent image
  org.opencontainers.image.licenses: Apache-2.0
entrypoint:
  - /usr/bin/run.sh
ports:
  - 80/tcp
  - 443/tcp
  - 444/tcp
