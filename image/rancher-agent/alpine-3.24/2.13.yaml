# syntax=dhi.io/build:2-alpine3.24

name: Rancher Agent 2.13.x
image: dhi.io/rancher-agent
variant: runtime
tags:
  - 2.13-alpine
  - 2.13.12-alpine
  - 2.13-alpine3.24
  - 2.13.12-alpine3.24
platforms:
  - linux/amd64
  - linux/arm64
dates:
  release: "2025-12-17"
  end-of-life: "2027-06-17"
vars:
  FLAVORED_SUFFIX: ""
  KUBECTL_MAJOR_MINOR_VERSION: "1.34"
  PKG_SUFFIX: ""
  PROVISIONING_CAPI_CHART_VERSION: 108.0.0+up0.9.0
  SEMVER_MAJOR_MINOR_VERSION: "2.13"
  SEMVER_MAJOR_VERSION: "2"
  SEMVER_VERSION: 2.13.12
  SUFFIX: ""
  TURTLES_CHART_VERSION: 108.0.10+up0.25.10
  VERSION: 2.13.12-r0
  WEBHOOK_CHART_VERSION: 108.0.12+up0.9.12
contents:
  repositories:
    - https://dhi.io/apk/alpine/v3.24/main
    - https://dl-cdn.alpinelinux.org/alpine/v3.24/main
    - https://dl-cdn.alpinelinux.org/alpine/v3.24/community
  keyring:
    - https://dhi.io/keyring/dhi-apk@docker-0F81AD7700D99184.rsa.pub
  packages:
    - alpine-baselayout-data
    - bash
    - ca-certificates-bundle
    - coreutils
    - curl
    - findutils
    - gawk
    - git
    - grep
    - iproute2-minimal
    - jq
    - kubectl-1.34
    - musl-utils
    - net-tools
    - openssh-client-default
    - openssl
    - rancher-agent-2.13-common=2.13.12-r0
    - rancher-agent-2.13=2.13.12-r0
    - sed
    - tini
    - tzdata
accounts:
  root: true
  run-as: root
  users:
    - name: nonroot
      uid: 65532
      gid: 65532
  groups:
    - name: nonroot
      gid: 65532
      members:
        - nonroot
os-release:
  name: Docker Hardened Images (Alpine)
  id: alpine
  version-id: "3.24"
  pretty-name: Docker Hardened Images/Alpine Linux v3.24
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
work-dir: /var/lib/rancher
environment:
  AGENT_IMAGE: rancher/rancher-agent:v2.13.12
  CATTLE_RANCHER_PROVISIONING_CAPI_VERSION: 108.0.0+up0.9.0
  CATTLE_RANCHER_TURTLES_VERSION: 108.0.10+up0.25.10
  CATTLE_RANCHER_WEBHOOK_VERSION: 108.0.12+up0.9.12
  SSL_CERT_DIR: /etc/kubernetes/ssl/certs
paths:
  - type: directory
    path: /var/lib/rancher
    uid: 0
    gid: 0
    mode: "0755"
  - type: symlink
    path: /usr/bin/tini
    uid: 0
    gid: 0
    source: /sbin/tini
annotations:
  org.opencontainers.image.description: A minimal Rancher Agent image
  org.opencontainers.image.licenses: Apache-2.0
entrypoint:
  - /usr/bin/run.sh
ports:
  - 80/tcp
  - 443/tcp
  - 444/tcp
