# syntax=dhi.io/build:2-debian13

name: Rancher Agent 2.14.x
image: dhi.io/rancher-agent
variant: runtime
tags:
  - "2.14"
  - 2.14.8
  - v2.14.8
  - 2.14-debian
  - 2.14-debian13
  - 2.14.8-debian
  - 2.14.8-debian13
platforms:
  - linux/amd64
  - linux/arm64
dates:
  release: "2026-04-30"
  end-of-life: "2027-10-10"
vars:
  FLAVORED_SUFFIX: ""
  KUBECTL_MAJOR_MINOR_VERSION: "1.35"
  PKG_SUFFIX: ""
  SEMVER_MAJOR_MINOR_VERSION: "2.14"
  SEMVER_MAJOR_VERSION: "2"
  SEMVER_VERSION: 2.14.8
  SUFFIX: ""
  TURTLES_CHART_VERSION: 109.0.8+up0.26.8
  VERSION: 2.14.8-0
  WEBHOOK_CHART_VERSION: 109.0.14+up0.10.14
contents:
  repositories:
    - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
  keyring:
    - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
  packages:
    - '!libelogind0'
    - '!mawk'
    - '!original-awk'
    - base-files
    - bash
    - ca-certificates
    - coreutils
    - curl
    - findutils
    - gawk
    - git
    - grep
    - gzip
    - hostname
    - iproute2
    - jq
    - kubectl-1.35
    - libc-bin
    - openssh-client
    - openssl
    - rancher-agent-2.14-common=2.14.8-0
    - rancher-agent-2.14=2.14.8-0
    - sed
    - tar
    - tini
    - tzdata
accounts:
  root: true
  run-as: root
  users:
    - name: nonroot
      uid: 65532
      gid: 65532
  groups:
    - name: nonroot
      gid: 65532
      members:
        - nonroot
os-release:
  name: Docker Hardened Images (Debian)
  id: debian
  version-id: "13"
  version-codename: trixie
  pretty-name: Docker Hardened Images/Debian GNU/Linux 13 (trixie)
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
work-dir: /var/lib/rancher
environment:
  AGENT_IMAGE: rancher/rancher-agent:v2.14.8
  CATTLE_RANCHER_TURTLES_VERSION: 109.0.8+up0.26.8
  CATTLE_RANCHER_WEBHOOK_VERSION: 109.0.14+up0.10.14
  SSL_CERT_DIR: /etc/kubernetes/ssl/certs
paths:
  - type: directory
    path: /var/lib/rancher
    uid: 0
    gid: 0
    mode: "0755"
annotations:
  org.opencontainers.image.description: A minimal Rancher Agent image
  org.opencontainers.image.licenses: Apache-2.0
entrypoint:
  - /usr/bin/run.sh
ports:
  - 80/tcp
  - 443/tcp
  - 444/tcp
