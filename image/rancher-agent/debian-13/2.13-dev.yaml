# syntax=dhi.io/build:2-debian13

name: Rancher Agent 2.13.x (dev)
image: dhi.io/rancher-agent
variant: dev
tags:
  - 2.13-dev
  - 2.13.12-dev
  - v2.13.12-dev
  - 2.13-debian-dev
  - 2.13-debian13-dev
  - 2.13.12-debian-dev
  - 2.13.12-debian13-dev
platforms:
  - linux/amd64
  - linux/arm64
dates:
  release: "2025-12-17"
  end-of-life: "2027-06-17"
vars:
  FLAVORED_SUFFIX: -dev
  KUBECTL_MAJOR_MINOR_VERSION: "1.34"
  PKG_SUFFIX: ""
  PROVISIONING_CAPI_CHART_VERSION: 108.0.0+up0.9.0
  SEMVER_MAJOR_MINOR_VERSION: "2.13"
  SEMVER_MAJOR_VERSION: "2"
  SEMVER_VERSION: 2.13.12
  SUFFIX: -dev
  TURTLES_CHART_VERSION: 108.0.10+up0.25.10
  VERSION: 2.13.12-0
  WEBHOOK_CHART_VERSION: 108.0.12+up0.9.12
contents:
  repositories:
    - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
  keyring:
    - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
  packages:
    - '!gawk'
    - '!libelogind0'
    - '!mawk'
    - '!original-awk'
    - acl
    - apt
    - base-files
    - bash
    - bash-completion
    - bind9-dnsutils
    - ca-certificates
    - coreutils
    - curl
    - diffutils
    - dpkg
    - findutils
    - gawk
    - git
    - grep
    - gzip
    - hostname
    - iproute2
    - jq
    - kubectl-1.34
    - less
    - libc-bin
    - mawk
    - mount
    - openssh-client
    - openssl
    - perl-base
    - rancher-agent-2.13-common=2.13.12-0
    - rancher-agent-2.13-dev=2.13.12-0
    - sed
    - sysstat
    - tar
    - tini
    - tzdata
    - util-linux
    - xz-utils
accounts:
  root: true
  run-as: root
  users:
    - name: nonroot
      uid: 65532
      gid: 65532
    - name: _apt
      uid: 42
      gid: 65532
  groups:
    - name: nonroot
      gid: 65532
      members:
        - nonroot
os-release:
  name: Docker Hardened Images (Debian)
  id: debian
  version-id: "13"
  version-codename: trixie
  pretty-name: Docker Hardened Images/Debian GNU/Linux 13 (trixie)
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
work-dir: /var/lib/rancher
environment:
  AGENT_IMAGE: rancher/rancher-agent:v2.13.12
  CATTLE_RANCHER_PROVISIONING_CAPI_VERSION: 108.0.0+up0.9.0
  CATTLE_RANCHER_TURTLES_VERSION: 108.0.10+up0.25.10
  CATTLE_RANCHER_WEBHOOK_VERSION: 108.0.12+up0.9.12
  DEBIAN_FRONTEND: noninteractive
  SSL_CERT_DIR: /etc/kubernetes/ssl/certs
paths:
  - type: directory
    path: /var/lib/rancher
    uid: 0
    gid: 0
    mode: "0755"
  - type: symlink
    path: /usr/bin/sar
    uid: 0
    gid: 0
    source: /usr/bin/sar.sysstat
annotations:
  org.opencontainers.image.description: A minimal Rancher Agent image
  org.opencontainers.image.licenses: Apache-2.0
entrypoint:
  - /usr/bin/run.sh
ports:
  - 80/tcp
  - 443/tcp
  - 444/tcp
