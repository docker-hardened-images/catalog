# syntax=dhi.io/build:2-debian13

name: Seaweedfs 4.x (compat)
image: dhi.io/seaweedfs
variant: runtime
flavor: compat
tags:
  - 4-compat
  - 4.53-compat
  - 4-debian-compat
  - 4-debian13-compat
  - 4.53-debian-compat
  - 4.53-debian13-compat
platforms:
  - linux/amd64
  - linux/arm64
dates:
  release: "2026-10-25"
vars:
  FLAVORED_SUFFIX: -compat
  SEMVER_MAJOR_MINOR_VERSION: "4.53"
  SEMVER_MAJOR_VERSION: "4"
  SEMVER_VERSION: "4.53"
  SUFFIX: ""
  VERSION: 4.53-0
contents:
  repositories:
    - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
  keyring:
    - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
  packages:
    - base-files
    - bash
    - bzip2
    - ca-certificates-bundle
    - coreutils
    - dash
    - seaweedfs=4.53-0
    - tzdata
accounts:
  run-as: nonroot
  users:
    - name: nonroot
      uid: 65532
      gid: 65532
  groups:
    - name: nonroot
      gid: 65532
      members:
        - nonroot
os-release:
  name: Docker Hardened Images (Debian)
  id: debian
  version-id: "13"
  version-codename: trixie
  pretty-name: Docker Hardened Images/Debian GNU/Linux 13 (trixie)
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
work-dir: /data
paths:
  - type: file
    path: /etc/seaweedfs/filer.toml
    uid: 0
    gid: 0
    mode: "0644"
    source: image/seaweedfs/config/filer.toml
  - type: directory
    path: /data/filerldb2
    uid: 65532
    gid: 65532
  - type: directory
    path: /etc/seadweedfs
    uid: 65532
    gid: 65532
annotations:
  org.opencontainers.image.description: A minimal SeaweedFS image
  org.opencontainers.image.licenses: Apache-2.0
entrypoint:
  - /usr/bin/weed
ports:
  - 7333/tcp
  - 8080/tcp
  - 8333/tcp
  - 8888/tcp
  - 9333/tcp
  - 18080/tcp
  - 18888/tcp
  - 19333/tcp
