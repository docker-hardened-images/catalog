# syntax=dhi.io/build:2-debian13

name: dapr injector 1.x
image: dhi.io/dapr-injector
variant: runtime
tags:
  - "1"
  - "1.18"
  - 1.18.4
  - 1-debian
  - 1-debian13
  - 1.18-debian
  - 1.18-debian13
  - 1.18.4-debian
  - 1.18.4-debian13
platforms:
  - linux/amd64
  - linux/arm64
dates:
  release: "2025-09-16"
vars:
  COMMIT_SHA: 6d1c53f430205c0c0f3bc3589ce5a3ec3f6f1647
  SEMVER_MAJOR_MINOR_VERSION: "1.18"
  SEMVER_MAJOR_VERSION: "1"
  SEMVER_VERSION: 1.18.4
  VERSION: 1.18.4
contents:
  repositories:
    - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
  keyring:
    - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
  packages:
    - base-files
    - ca-certificates-bundle
    - tzdata
  builds:
    - name: dapr-injector
      work-dir: /go/src/github.com/dapr/dapr/cmd/injector
      caches:
        - path: /go/pkg/mod
      contents:
        packages:
          - bash
          - ca-certificates-bundle
          - coreutils
          - golang-1.26
          - findutils
          - mawk
          - sed
        files:
          - url: git+https://github.com/dapr/dapr#v1.18.4
            checksum: 6d1c53f430205c0c0f3bc3589ce5a3ec3f6f1647
            path: /go/src/github.com/dapr/dapr
            spdx:
              name: dapr
              version: 1.18.4
              packages:
                - name: dapr
                  purl: pkg:golang/github.com/dapr/dapr@1.18.4
                  license: Apache-2.0
            uid: 0
            gid: 0
      pipeline:
        - name: update go dependencies
          uses: go/bump@v2
          work-dir: /go/src/github.com/dapr/dapr
          with:
            deps:
              - golang.org/x/crypto@v0.56.0
              - google.golang.org/grpc@v1.83.2
            download: true
        - name: test
          privileged: true
          runs: |
            set -eux -o pipefail

            cd /go/src/github.com/dapr/dapr
            CGO_ENABLED=0 go test -short ./pkg/injector/...
        - name: build
          uses: go/build@v1
          environment:
            GOFLAGS: -buildvcs=false
          with:
            ldflags:
              - -X github.com/dapr/dapr/pkg/buildinfo.gitcommit=6d1c53f430205c0c0f3bc3589ce5a3ec3f6f1647
              - -X github.com/dapr/dapr/pkg/buildinfo.gitversion=1.18.4
              - -X github.com/dapr/dapr/pkg/buildinfo.version=1.18.4
            output: ${target.dir}/usr/local/bin/injector
            tags: allcomponents
      outputs:
        - source: ${target.dir}/usr/local/bin/injector
          target: /usr/local/bin/injector
          uid: 0
          gid: 0
        - source: /opt/docker/sbom/dapr
          target: /opt/docker/sbom/dapr
          uid: 0
          gid: 0
accounts:
  run-as: nonroot
  users:
    - name: nonroot
      uid: 65532
      gid: 65532
  groups:
    - name: nonroot
      gid: 65532
      members:
        - nonroot
os-release:
  name: Docker Hardened Images (Debian)
  id: debian
  version-id: "13"
  version-codename: trixie
  pretty-name: Docker Hardened Images/Debian GNU/Linux 13 (trixie)
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
paths:
  - type: directory
    path: /app/cmd/injector
    uid: 0
    gid: 0
  - type: symlink
    path: /injector
    uid: 0
    gid: 0
    source: /usr/local/bin/injector
annotations:
  org.opencontainers.image.description: A minimal Dapr sidecar injector admission controller image
  org.opencontainers.image.licenses: Apache-2.0
entrypoint:
  - /usr/local/bin/injector
ports:
  - 4000/tcp
  - 8080/tcp
  - 9090/tcp
