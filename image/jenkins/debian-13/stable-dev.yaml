# syntax=dhi.io/build:2-debian13

name: Jenkins 2.x (dev)
image: dhi.io/jenkins
variant: dev
tags:
  - 2-dev
  - 2.568-dev
  - 2.568.2-dev
  - 2-debian-dev
  - 2-debian13-dev
  - 2.568-debian-dev
  - 2.568-debian13-dev
  - 2.568.2-debian-dev
  - 2.568.2-debian13-dev
platforms:
  - linux/amd64
  - linux/arm64
dates:
  release: "2025-01-31"
vars:
  BCFIPS_VERSION: 2.1.2
  BCPKIXFIPS_VERSION: 2.1.11
  BCRNGJENT_VERSION: 1.3.6
  BCTLSFIPS_VERSION: 2.1.23
  BCUTILFIPS_VERSION: 2.1.6
  COMMIT_SHA: 41a9ef008120dd7d1ada33200ab71be9ca445236
  DOCKER_REPO_COMMIT_SHA: 53f5d618818bb7673c94b73e2e5335a9b5c5ed48
  DOCKER_REPO_VERSION: 2.568.2
  JAVA_FIPS_SUFFIX: ""
  JAVA_HOME_PATH: /usr/lib/jvm/temurin-21
  JAVA_MAJOR_VERSION: "21"
  JAVA_VARIANT: jdk
  JDK_MAJOR_VERSION: "21"
  MAVEN_REFERENCE: dhi/maven:3.9.16-jdk21-debian13-dev@sha256:b4468f0e2d54bb059241b34632637597a5fe1861b75af6e60406f52c0b6d5799
  MAVEN_VERSION: 3.9.16
  SEMVER_MAJOR_MINOR_VERSION: "2.568"
  SEMVER_MAJOR_VERSION: "2"
  VERSION: 2.568.2
contents:
  repositories:
    - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
  keyring:
    - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
  packages:
    - '!gawk'
    - '!libelogind0'
    - '!mawk'
    - '!original-awk'
    - apt
    - base-files
    - bash
    - ca-certificates
    - coreutils
    - diffutils
    - dpkg
    - eclipse-temurin-21-jdk
    - eclipse-temurin-21-jdk-oci-config
    - findutils
    - fontconfig
    - fonts-dejavu-core
    - git
    - grep
    - libc-bin
    - libpng16-16t64
    - mawk
    - openssh-client
    - perl-base
    - procps
    - sed
    - tini
    - tzdata
    - unzip
    - util-linux
  builds:
    - name: jenkins
      uses: dhi.io/maven:3.9.16-jdk21-debian13-dev@sha256:b4468f0e2d54bb059241b34632637597a5fe1861b75af6e60406f52c0b6d5799
      environment:
        JAVA_HOME: /usr/lib/jvm/temurin-21
      caches:
        - path: /root/.m2/repository
      contents:
        packages:
          - coreutils
          - findutils
          - bash
          - curl
          - git
          - gzip
          - sed
          - tar
          - unzip
          - zip
          - xmlstarlet
        files:
          - url: git+https://github.com/jenkinsci/jenkins.git#jenkins-2.568.2
            checksum: 41a9ef008120dd7d1ada33200ab71be9ca445236
            path: ${source.dir}/jenkins
            spdx:
              name: jenkins
              version: 2.568.2
              packages:
                - name: jenkins
                  purl: pkg:dhi/jenkins@2.568.2
                  license: MIT
            uid: 0
            gid: 0
          - url: git+https://github.com/jenkinsci/docker.git#53f5d618818bb7673c94b73e2e5335a9b5c5ed48
            checksum: 53f5d618818bb7673c94b73e2e5335a9b5c5ed48
            path: ${source.dir}/docker-builds
            uid: 0
            gid: 0
          - url: https://repo1.maven.org/maven2/org/apache/mina/mina-core/2.2.8/mina-core-2.2.8.jar
            checksum: sha256:07a62c5b2fae3a61da693f7a5c6d6711a7ea09f318972d3e76ae8a5f032329f3
            path: ${source.dir}/patch/deps/mina-core-2.2.8.jar
            spdx:
              name: mina-core
              version: 2.2.8
              packages:
                - name: mina-core
                  purl: pkg:maven/org.apache.mina/mina-core@2.2.8
                  license: Apache-2.0
            uid: 0
            gid: 0
          - url: https://repo1.maven.org/maven2/com/fasterxml/jackson/core/jackson-databind/2.21.5/jackson-databind-2.21.5.jar
            checksum: sha256:507418c0fafd38b2b2cfb704521630da613a8e4cc8381195a6f418017883e2c0
            path: ${source.dir}/patch/deps/jackson-databind-2.21.5.jar
            spdx:
              name: jackson-databind
              version: 2.21.5
              packages:
                - name: jackson-databind
                  purl: pkg:maven/com.fasterxml.jackson.core/jackson-databind@2.21.5
                  license: Apache-2.0
            uid: 0
            gid: 0
          - url: https://repo1.maven.org/maven2/com/fasterxml/jackson/core/jackson-core/2.21.5/jackson-core-2.21.5.jar
            checksum: sha256:b64b5874162b503a0e58a8f7758266e8dd9f91bf49e3a59ae0b5f47589a231b7
            path: ${source.dir}/patch/deps/jackson-core-2.21.5.jar
            spdx:
              name: jackson-core
              version: 2.21.5
              packages:
                - name: jackson-core
                  purl: pkg:maven/com.fasterxml.jackson.core/jackson-core@2.21.5
                  license: Apache-2.0
            uid: 0
            gid: 0
      pipeline:
        - uses: mvn/mirror@v1
        - name: remove git-changelist-maven-extension
          work-dir: ${source.dir}/jenkins
          runs: |
            set -eux -o pipefail

            # git-changelist-maven-extension is unavailable in the DHI Maven mirror.
            # It derives changelist values from Git metadata for Jenkins incremental
            # builds, which are unnecessary when DHI builds a tagged release.
            # Use local-name() so the XPath matches regardless of whether the
            # file declares an xmlns or not.
            ext_xml=".mvn/extensions.xml"
            if [ -f "${ext_xml}" ]; then
              xmlstarlet ed -L \
                -d "//*[local-name()='extension'][*[local-name()='artifactId']='git-changelist-maven-extension']" \
                "${ext_xml}"
            fi
        - name: patch stable detached jackson plugin
          uses: patch@v1
          work-dir: ${source.dir}/jenkins
          with:
            options: -p1
            patches:
              - ${source.dir}/patch/jackson3-api.patch
        - name: patch maven dependencies
          uses: mvn/patch@v1
          with:
            dependencies: ${source.dir}/patch/mvn-dependencies.json
            dependencies-key: dependencyManagement.dependencies
            downgrade: false
            mvn-root: ${source.dir}/jenkins/bom
        - name: patch maven properties
          uses: mvn/patch@v1
          with:
            downgrade: false
            mvn-root: ${source.dir}/jenkins
            properties: ${source.dir}/patch/mvn-properties.json
        - name: build
          work-dir: ${source.dir}/jenkins
          privileged: true
          secrets:
            - id: maven_user
              env: MAVEN_USER
              optional: true
            - id: maven_password
              env: MAVEN_PASSWORD
              optional: true
          runs: |
            set -eux -o pipefail

            mvn clean install -DskipTests -Dmaven.test.skip=true -Dspotless.check.skip=true
        - name: patch bundled jackson-databind in jackson2-api
          work-dir: ${source.dir}/jenkins
          runs: |
            set -eux -o pipefail

            patch_dir="$(mktemp -d)"
            trap 'rm -rf "${patch_dir}"' EXIT

            war_file="war/target/jenkins.war"
            hpi_path="WEB-INF/detached-plugins/jackson2-api.hpi"
            old_jackson_databind_path="WEB-INF/lib/jackson-databind-2.21.2.jar"
            new_jackson_databind_path="WEB-INF/lib/jackson-databind-2.21.5.jar"
            old_jackson_core_path="WEB-INF/lib/jackson-core-2.21.2.jar"
            new_jackson_core_path="WEB-INF/lib/jackson-core-2.21.5.jar"

            unzip -q "${war_file}" "${hpi_path}" -d "${patch_dir}"
            hpi_file="${patch_dir}/${hpi_path}"

            # Remove old jackson-databind versions
            if jar tf "${hpi_file}" | grep -q "${old_jackson_databind_path}"; then
              zip -q -d "${hpi_file}" "${old_jackson_databind_path}"
            fi
            if jar tf "${hpi_file}" | grep -q "WEB-INF/lib/jackson-databind-2.21.4.jar"; then
              zip -q -d "${hpi_file}" "WEB-INF/lib/jackson-databind-2.21.4.jar"
            fi

            # Remove old jackson-core versions
            if jar tf "${hpi_file}" | grep -q "${old_jackson_core_path}"; then
              zip -q -d "${hpi_file}" "${old_jackson_core_path}"
            fi

            # Add new jackson-databind and jackson-core
            mkdir -p "${patch_dir}/hpi-overlay/WEB-INF/lib"
            cp "${source.dir}/patch/deps/jackson-databind-2.21.5.jar" "${patch_dir}/hpi-overlay/${new_jackson_databind_path}"
            cp "${source.dir}/patch/deps/jackson-core-2.21.5.jar" "${patch_dir}/hpi-overlay/${new_jackson_core_path}"
            (cd "${patch_dir}/hpi-overlay" && jar --update --file "${hpi_file}" "${new_jackson_databind_path}" "${new_jackson_core_path}")

            # Verify old versions removed and new versions present
            if jar tf "${hpi_file}" | grep -q "${old_jackson_databind_path}"; then
              echo "ERROR: ${old_jackson_databind_path} is still present in ${hpi_path}" >&2
              exit 1
            fi
            if jar tf "${hpi_file}" | grep -q "${old_jackson_core_path}"; then
              echo "ERROR: ${old_jackson_core_path} is still present in ${hpi_path}" >&2
              exit 1
            fi
            jar tf "${hpi_file}" | grep -q "${new_jackson_databind_path}"
            jar tf "${hpi_file}" | grep -q "${new_jackson_core_path}"

            (cd "${patch_dir}" && jar --update --file "${source.dir}/jenkins/${war_file}" "${hpi_path}")

            # Final verification in repacked war
            unzip -p "${war_file}" "${hpi_path}" > "${patch_dir}/verified-jackson2-api.hpi"
            if jar tf "${patch_dir}/verified-jackson2-api.hpi" | grep -q "${old_jackson_databind_path}"; then
              echo "ERROR: ${old_jackson_databind_path} is still present in repacked ${war_file}" >&2
              exit 1
            fi
            if jar tf "${patch_dir}/verified-jackson2-api.hpi" | grep -q "${old_jackson_core_path}"; then
              echo "ERROR: ${old_jackson_core_path} is still present in repacked ${war_file}" >&2
              exit 1
            fi
            jar tf "${patch_dir}/verified-jackson2-api.hpi" | grep -q "${new_jackson_databind_path}"
            jar tf "${patch_dir}/verified-jackson2-api.hpi" | grep -q "${new_jackson_core_path}"
        - name: patch bundled mina-core
          work-dir: ${source.dir}/jenkins
          runs: |
            set -eux -o pipefail

            patch_dir="$(mktemp -d)"
            trap 'rm -rf "${patch_dir}"' EXIT

            war_file="war/target/jenkins.war"
            hpi_path="WEB-INF/detached-plugins/mina-sshd-api-core.hpi"
            old_mina_path="WEB-INF/lib/mina-core-2.2.4.jar"
            new_mina_path="WEB-INF/lib/mina-core-2.2.8.jar"

            unzip -q "${war_file}" "${hpi_path}" -d "${patch_dir}"
            hpi_file="${patch_dir}/${hpi_path}"

            if jar tf "${hpi_file}" | grep -q "${old_mina_path}"; then
              zip -q -d "${hpi_file}" "${old_mina_path}"
            fi

            # Also remove 2.2.7 if present from previous patch
            if jar tf "${hpi_file}" | grep -q "WEB-INF/lib/mina-core-2.2.7.jar"; then
              zip -q -d "${hpi_file}" "WEB-INF/lib/mina-core-2.2.7.jar"
            fi

            mkdir -p "${patch_dir}/hpi-overlay/WEB-INF/lib"
            cp "${source.dir}/patch/deps/mina-core-2.2.8.jar" "${patch_dir}/hpi-overlay/${new_mina_path}"
            (cd "${patch_dir}/hpi-overlay" && jar --update --file "${hpi_file}" "${new_mina_path}")

            if jar tf "${hpi_file}" | grep -q "${old_mina_path}"; then
              echo "ERROR: ${old_mina_path} is still present in ${hpi_path}" >&2
              exit 1
            fi
            if jar tf "${hpi_file}" | grep -q "WEB-INF/lib/mina-core-2.2.7.jar"; then
              echo "ERROR: mina-core-2.2.7.jar is still present in ${hpi_path}" >&2
              exit 1
            fi
            jar tf "${hpi_file}" | grep -q "${new_mina_path}"

            (cd "${patch_dir}" && jar --update --file "${source.dir}/jenkins/${war_file}" "${hpi_path}")

            unzip -p "${war_file}" "${hpi_path}" > "${patch_dir}/verified-mina-sshd-api-core.hpi"
            if jar tf "${patch_dir}/verified-mina-sshd-api-core.hpi" | grep -q "${old_mina_path}"; then
              echo "ERROR: ${old_mina_path} is still present in repacked ${war_file}" >&2
              exit 1
            fi
            if jar tf "${patch_dir}/verified-mina-sshd-api-core.hpi" | grep -q "WEB-INF/lib/mina-core-2.2.7.jar"; then
              echo "ERROR: mina-core-2.2.7.jar is still present in repacked ${war_file}" >&2
              exit 1
            fi
            jar tf "${patch_dir}/verified-mina-sshd-api-core.hpi" | grep -q "${new_mina_path}"
        - name: install
          work-dir: ${source.dir}/jenkins
          runs: |
            set -eux -o pipefail

            mkdir -p "${target.dir}/usr/share/jenkins"
            cp war/target/jenkins.war "${target.dir}/usr/share/jenkins/jenkins.war"
        - name: copy-entrypoint-scripts
          work-dir: ${source.dir}/docker-builds
          runs: |
            set -eux -o pipefail

            mkdir -p "${target.dir}/usr/local/bin"
            mkdir -p "${target.dir}/usr/share/jenkins/ref/init.groovy.d"

            # Copy jenkins.sh entrypoint script from upstream docker repo
            cp jenkins.sh "${target.dir}/usr/local/bin/jenkins.sh"

            # Copy jenkins-support script (required by jenkins.sh)
            cp jenkins-support "${target.dir}/usr/local/bin/jenkins-support"
      paths:
        - type: file
          path: ${source.dir}/patch/mvn-dependencies.json
          uid: 0
          gid: 0
          source: image/jenkins/patch/mvn-dependencies.json
        - type: file
          path: ${source.dir}/patch/jackson3-api.patch
          uid: 0
          gid: 0
          source: image/jenkins/patch/jackson3-api.patch
        - type: file
          path: ${source.dir}/patch/mvn-properties.json
          uid: 0
          gid: 0
          source: image/jenkins/patch/mvn-properties.json
      outputs:
        - source: ${target.dir}/usr/share/jenkins
          target: /usr/share/jenkins
          uid: 0
          gid: 0
        - source: ${target.dir}/usr/local/bin
          target: /usr/local/bin
          uid: 0
          gid: 0
          mode: "0755"
        - source: /opt/docker/sbom/jenkins
          target: /opt/docker/sbom/jenkins
          uid: 0
          gid: 0
        - source: ${target.dir}/usr/share/jenkins/ref
          target: /usr/share/jenkins/ref
          uid: 0
          gid: 0
    - name: locale
      contents:
        packages:
          - bash
          - locales
          - coreutils
          - gzip
      pipeline:
        - name: install locales
          runs: |
            set -eux -o pipefail

            ln -s /etc/locale.alias /usr/share/locale/locale.alias

            echo "en_US.UTF-8 UTF-8" >> /etc/locale.gen
            locale-gen en_US.UTF-8
      outputs:
        - source: /usr/share/locale
          target: /usr/share/locale
          uid: 0
          gid: 0
        - source: /usr/lib/locale
          target: /usr/lib/locale
          uid: 0
          gid: 0
accounts:
  root: true
  run-as: root
  users:
    - name: jenkins
      uid: 1000
      gid: 1000
    - name: _apt
      uid: 42
      gid: 65532
  groups:
    - name: jenkins
      gid: 1000
      members:
        - jenkins
os-release:
  name: Docker Hardened Images (Debian)
  id: debian
  version-id: "13"
  version-codename: trixie
  pretty-name: Docker Hardened Images/Debian GNU/Linux 13 (trixie)
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
work-dir: /var/jenkins_home
environment:
  COPY_REFERENCE_FILE_LOG: /var/jenkins_home/copy_reference_file.log
  DEBIAN_FRONTEND: noninteractive
  JAVA_HOME: /usr/lib/jvm/temurin-21
  JENKINS_HOME: /var/jenkins_home
  JENKINS_INCREMENTALS_REPO_MIRROR: https://repo.jenkins-ci.org/incrementals
  JENKINS_SLAVE_AGENT_PORT: "50000"
  JENKINS_UC: https://updates.jenkins.io
  JENKINS_UC_EXPERIMENTAL: https://updates.jenkins.io/experimental
  JENKINS_VERSION: 2.568.2
  LANG: en_US.UTF-8
  LANGUAGE: en_US:en
  LC_ALL: en_US.UTF-8
  PATH: /usr/local/bin:/usr/local/sbin:/usr/sbin:/usr/bin:/sbin:/bin
  REF: /usr/share/jenkins/ref
paths:
  - type: directory
    path: /var/jenkins_home
    uid: 1000
    gid: 1000
    mode: "0755"
annotations:
  org.opencontainers.image.description: A minimal Jenkins image
  org.opencontainers.image.licenses: MIT
entrypoint:
  - /usr/bin/tini
  - --
  - /usr/local/bin/jenkins.sh
ports:
  - 8080/tcp
  - 50000/tcp
