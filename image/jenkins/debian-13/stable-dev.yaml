# syntax=dhi.io/build:2-debian13

name: Jenkins 2.x (dev)
image: dhi.io/jenkins
variant: dev
tags:
  - 2-dev
  - 2.568-dev
  - 2.568.2-dev
  - 2-debian-dev
  - 2-debian13-dev
  - 2.568-debian-dev
  - 2.568-debian13-dev
  - 2.568.2-debian-dev
  - 2.568.2-debian13-dev
platforms:
  - linux/amd64
  - linux/arm64
dates:
  release: "2025-01-31"
vars:
  BCFIPS_VERSION: 2.1.2
  BCPKIXFIPS_VERSION: 2.1.11
  BCRNGJENT_VERSION: 1.3.6
  BCTLSFIPS_VERSION: 2.1.23
  BCUTILFIPS_VERSION: 2.1.6
  JAVA_FIPS_SUFFIX: ""
  JAVA_HOME_PATH: /usr/lib/jvm/temurin-21
  JAVA_MAJOR_VERSION: "21"
  JAVA_VARIANT: jdk
  JDK_MAJOR_VERSION: "21"
  SEMVER_MAJOR_MINOR_VERSION: "2.568"
  SEMVER_MAJOR_VERSION: "2"
  SEMVER_VERSION: 2.568.2
  VERSION: 2.568.2-1
contents:
  repositories:
    - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
  keyring:
    - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
  packages:
    - '!gawk'
    - '!libelogind0'
    - '!mawk'
    - '!original-awk'
    - apt
    - base-files
    - bash
    - ca-certificates
    - coreutils
    - diffutils
    - dpkg
    - eclipse-temurin-21-jdk
    - eclipse-temurin-21-jdk-oci-config
    - findutils
    - fontconfig
    - fonts-dejavu-core
    - git
    - grep
    - jenkins=2.568.2-1
    - libc-bin
    - libpng16-16t64
    - mawk
    - openssh-client
    - perl-base
    - procps
    - sed
    - tini
    - tzdata
    - unzip
    - util-linux
  builds:
    - name: locale
      contents:
        packages:
          - bash
          - locales
          - coreutils
          - gzip
      pipeline:
        - name: install locales
          runs: |
            set -eux -o pipefail

            ln -s /etc/locale.alias /usr/share/locale/locale.alias

            echo "en_US.UTF-8 UTF-8" >> /etc/locale.gen
            locale-gen en_US.UTF-8
      outputs:
        - source: /usr/share/locale
          target: /usr/share/locale
          uid: 0
          gid: 0
        - source: /usr/lib/locale
          target: /usr/lib/locale
          uid: 0
          gid: 0
accounts:
  root: true
  run-as: root
  users:
    - name: jenkins
      uid: 1000
      gid: 1000
    - name: _apt
      uid: 42
      gid: 65532
  groups:
    - name: jenkins
      gid: 1000
      members:
        - jenkins
os-release:
  name: Docker Hardened Images (Debian)
  id: debian
  version-id: "13"
  version-codename: trixie
  pretty-name: Docker Hardened Images/Debian GNU/Linux 13 (trixie)
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
work-dir: /var/jenkins_home
environment:
  COPY_REFERENCE_FILE_LOG: /var/jenkins_home/copy_reference_file.log
  DEBIAN_FRONTEND: noninteractive
  JAVA_HOME: /usr/lib/jvm/temurin-21
  JENKINS_HOME: /var/jenkins_home
  JENKINS_INCREMENTALS_REPO_MIRROR: https://repo.jenkins-ci.org/incrementals
  JENKINS_SLAVE_AGENT_PORT: "50000"
  JENKINS_UC: https://updates.jenkins.io
  JENKINS_UC_EXPERIMENTAL: https://updates.jenkins.io/experimental
  JENKINS_VERSION: 2.568.2
  LANG: en_US.UTF-8
  LANGUAGE: en_US:en
  LC_ALL: en_US.UTF-8
  PATH: /usr/local/bin:/usr/local/sbin:/usr/sbin:/usr/bin:/sbin:/bin
  REF: /usr/share/jenkins/ref
paths:
  - type: directory
    path: /var/jenkins_home
    uid: 1000
    gid: 1000
    mode: "0755"
  - type: directory
    path: /usr/share/jenkins/ref
    uid: 1000
    gid: 1000
    mode: "0755"
  - type: directory
    path: /usr/share/jenkins/ref/init.groovy.d
    uid: 1000
    gid: 1000
    mode: "0755"
  - type: directory
    path: /usr/local/bin
    uid: 0
    gid: 0
  - type: symlink
    path: /usr/local/bin/jenkins.sh
    uid: 0
    gid: 0
    source: /usr/share/jenkins/bin/jenkins.sh
  - type: symlink
    path: /usr/local/bin/jenkins-support
    uid: 0
    gid: 0
    source: /usr/share/jenkins/bin/jenkins-support
annotations:
  org.opencontainers.image.description: A minimal Jenkins image
  org.opencontainers.image.licenses: MIT
entrypoint:
  - /usr/bin/tini
  - --
  - /usr/local/bin/jenkins.sh
ports:
  - 8080/tcp
  - 50000/tcp
