# syntax=dhi.io/build:2-debian13

name: Jenkins 2.x (weekly) (dev)
image: dhi.io/jenkins
variant: dev
tags:
  - 2.580-dev
  - 2.580-debian-dev
  - 2.580-debian13-dev
platforms:
  - linux/amd64
  - linux/arm64
vars:
  BCFIPS_VERSION: 2.1.2
  BCPKIXFIPS_VERSION: 2.1.11
  BCRNGJENT_VERSION: 1.3.6
  BCTLSFIPS_VERSION: 2.1.23
  BCUTILFIPS_VERSION: 2.1.6
  COMMIT_SHA: 497de4961ad80d97e26bfdeb0d2e40442a84ecb0
  DOCKER_REPO_COMMIT_SHA: bb25c48ab0fef2900e85339b00a0bef333b94854
  DOCKER_REPO_VERSION: "2.580"
  JAVA_FIPS_SUFFIX: ""
  JAVA_HOME_PATH: /usr/lib/jvm/temurin-21
  JAVA_MAJOR_VERSION: "21"
  JAVA_VARIANT: jdk
  JDK_MAJOR_VERSION: "21"
  MAVEN_REFERENCE: dhi/maven:3.9.16-jdk21-debian13-dev@sha256:645612ac05bca83249c2a1c532128d6e5d397bdf1e0de52abc4d164034a784d2
  MAVEN_VERSION: 3.9.16
  SEMVER_MAJOR_MINOR_VERSION: "2.580"
  SEMVER_MAJOR_VERSION: "2"
  VERSION: "2.580"
contents:
  repositories:
    - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
  keyring:
    - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
  packages:
    - '!gawk'
    - '!libelogind0'
    - '!mawk'
    - '!original-awk'
    - apt
    - base-files
    - bash
    - ca-certificates
    - coreutils
    - diffutils
    - dpkg
    - eclipse-temurin-21-jdk
    - eclipse-temurin-21-jdk-oci-config
    - findutils
    - fontconfig
    - fonts-dejavu-core
    - git
    - grep
    - libc-bin
    - libpng16-16t64
    - mawk
    - openssh-client
    - perl-base
    - procps
    - sed
    - tini
    - tzdata
    - unzip
    - util-linux
  builds:
    - name: locale
      contents:
        packages:
          - bash
          - locales
          - coreutils
          - gzip
      pipeline:
        - name: install locales
          runs: |
            set -eux -o pipefail

            ln -s /etc/locale.alias /usr/share/locale/locale.alias

            echo "en_US.UTF-8 UTF-8" >> /etc/locale.gen
            locale-gen en_US.UTF-8
      outputs:
        - source: /usr/share/locale
          target: /usr/share/locale
          uid: 0
          gid: 0
        - source: /usr/lib/locale
          target: /usr/lib/locale
          uid: 0
          gid: 0
    - name: jenkins
      uses: dhi.io/maven:3.9.16-jdk21-debian13-dev@sha256:645612ac05bca83249c2a1c532128d6e5d397bdf1e0de52abc4d164034a784d2
      environment:
        JAVA_HOME: /usr/lib/jvm/temurin-21
      caches:
        - path: /root/.m2/repository
      contents:
        packages:
          - coreutils
          - findutils
          - bash
          - curl
          - git
          - gzip
          - sed
          - tar
          - unzip
          - zip
          - xmlstarlet
        files:
          - url: git+https://github.com/jenkinsci/jenkins.git#jenkins-2.580
            checksum: 497de4961ad80d97e26bfdeb0d2e40442a84ecb0
            path: ${source.dir}/jenkins
            spdx:
              name: jenkins
              version: "2.580"
              packages:
                - name: jenkins
                  purl: pkg:dhi/jenkins@2.580
                  license: MIT
            uid: 0
            gid: 0
          - url: git+https://github.com/jenkinsci/docker.git#bb25c48ab0fef2900e85339b00a0bef333b94854
            checksum: bb25c48ab0fef2900e85339b00a0bef333b94854
            path: ${source.dir}/docker-builds
            uid: 0
            gid: 0
          - url: https://repo1.maven.org/maven2/org/apache/mina/mina-core/2.2.8/mina-core-2.2.8.jar
            checksum: sha256:07a62c5b2fae3a61da693f7a5c6d6711a7ea09f318972d3e76ae8a5f032329f3
            path: ${source.dir}/patch/deps/mina-core-2.2.8.jar
            spdx:
              name: mina-core
              version: 2.2.8
              packages:
                - name: mina-core
                  purl: pkg:maven/org.apache.mina/mina-core@2.2.8
                  license: Apache-2.0
            uid: 0
            gid: 0
      pipeline:
        - uses: mvn/mirror@v1
        - name: remove unavailable maven extensions
          work-dir: ${source.dir}/jenkins
          runs: |
            set -eux -o pipefail

            # git-changelist-maven-extension and develocity-maven-extension are unavailable
            # in the DHI Maven mirror. git-changelist derives changelist values from Git metadata
            # for Jenkins incremental builds, which are unnecessary when DHI builds a tagged
            # release. develocity is optional Gradle build analytics tooling Jenkins 2.578+
            # added upstream; it is not required to produce jenkins.war.
            # Use local-name() so the XPath matches regardless of whether the
            # file declares an xmlns or not.
            ext_xml=".mvn/extensions.xml"
            if [ -f "${ext_xml}" ]; then
              xmlstarlet ed -L \
                -d "//*[local-name()='extension'][*[local-name()='artifactId']='git-changelist-maven-extension']" \
                -d "//*[local-name()='extension'][*[local-name()='artifactId']='develocity-maven-extension']" \
                "${ext_xml}"
            fi
        - name: build
          work-dir: ${source.dir}/jenkins
          privileged: true
          secrets:
            - id: maven_user
              env: MAVEN_USER
              optional: true
            - id: maven_password
              env: MAVEN_PASSWORD
              optional: true
          runs: |
            set -eux -o pipefail

            mvn clean install -DskipTests -Dmaven.test.skip=true -Dspotless.check.skip=true
        - name: install
          work-dir: ${source.dir}/jenkins
          runs: |
            set -eux -o pipefail

            mkdir -p "${target.dir}/usr/share/jenkins"
            cp war/target/jenkins.war "${target.dir}/usr/share/jenkins/jenkins.war"
        - name: copy-entrypoint-scripts
          work-dir: ${source.dir}/docker-builds
          runs: |
            set -eux -o pipefail

            mkdir -p "${target.dir}/usr/local/bin"
            mkdir -p "${target.dir}/usr/share/jenkins/ref/init.groovy.d"

            # Copy jenkins.sh entrypoint script from upstream docker repo
            cp jenkins.sh "${target.dir}/usr/local/bin/jenkins.sh"

            # Copy jenkins-support script (required by jenkins.sh)
            cp jenkins-support "${target.dir}/usr/local/bin/jenkins-support"
      outputs:
        - source: ${target.dir}/usr/share/jenkins
          target: /usr/share/jenkins
          uid: 0
          gid: 0
        - source: ${target.dir}/usr/local/bin
          target: /usr/local/bin
          uid: 0
          gid: 0
          mode: "0755"
        - source: /opt/docker/sbom/jenkins
          target: /opt/docker/sbom/jenkins
          uid: 0
          gid: 0
        - source: ${target.dir}/usr/share/jenkins/ref
          target: /usr/share/jenkins/ref
          uid: 0
          gid: 0
accounts:
  root: true
  run-as: root
  users:
    - name: jenkins
      uid: 1000
      gid: 1000
    - name: _apt
      uid: 42
      gid: 65532
  groups:
    - name: jenkins
      gid: 1000
      members:
        - jenkins
os-release:
  name: Docker Hardened Images (Debian)
  id: debian
  version-id: "13"
  version-codename: trixie
  pretty-name: Docker Hardened Images/Debian GNU/Linux 13 (trixie)
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
work-dir: /var/jenkins_home
environment:
  COPY_REFERENCE_FILE_LOG: /var/jenkins_home/copy_reference_file.log
  DEBIAN_FRONTEND: noninteractive
  JAVA_HOME: /usr/lib/jvm/temurin-21
  JENKINS_HOME: /var/jenkins_home
  JENKINS_INCREMENTALS_REPO_MIRROR: https://repo.jenkins-ci.org/incrementals
  JENKINS_SLAVE_AGENT_PORT: "50000"
  JENKINS_UC: https://updates.jenkins.io
  JENKINS_UC_EXPERIMENTAL: https://updates.jenkins.io/experimental
  JENKINS_VERSION: "2.580"
  LANG: en_US.UTF-8
  LANGUAGE: en_US:en
  LC_ALL: en_US.UTF-8
  PATH: /usr/local/bin:/usr/local/sbin:/usr/sbin:/usr/bin:/sbin:/bin
  REF: /usr/share/jenkins/ref
paths:
  - type: directory
    path: /var/jenkins_home
    uid: 1000
    gid: 1000
    mode: "0755"
annotations:
  org.opencontainers.image.description: A minimal Jenkins image
  org.opencontainers.image.licenses: MIT
entrypoint:
  - /usr/bin/tini
  - --
  - /usr/local/bin/jenkins.sh
ports:
  - 8080/tcp
  - 50000/tcp
