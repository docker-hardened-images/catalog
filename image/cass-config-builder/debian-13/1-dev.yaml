# syntax=dhi.io/build:2-debian13

name: Cass Config Builder 1.0.x (dev)
image: dhi.io/cass-config-builder
variant: dev
tags:
  - 1-dev
  - 1.0-dev
  - 1.0.21-dev
  - 1-debian-dev
  - 1-debian13-dev
  - 1.0-debian-dev
  - 1.0-debian13-dev
  - 1.0.21-debian-dev
  - 1.0.21-debian13-dev
platforms:
  - linux/amd64
  - linux/arm64
dates:
  release: "2026-01-26"
vars:
  JAVA_FIPS_SUFFIX: ""
  JAVA_VARIANT: jdk
  JDK_MAJOR_VERSION: "11"
  SEMVER_MAJOR_MINOR_VERSION: "1.0"
  SEMVER_MAJOR_VERSION: "1"
  SEMVER_VERSION: 1.0.21
  VERSION: 1.0.21-1
contents:
  repositories:
    - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
  keyring:
    - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
  packages:
    - '!gawk'
    - '!libelogind0'
    - '!original-awk'
    - '!tar'
    - apt
    - base-files
    - bash
    - ca-certificates
    - ca-certificates-bundle
    - cass-config-builder=1.0.21-1
    - coreutils
    - diffutils
    - dpkg
    - eclipse-temurin-11-jdk
    - eclipse-temurin-11-jdk-oci-config
    - findutils
    - grep
    - libc-bin
    - libstdc++6
    - mawk
    - perl-base
    - sed
    - tar
    - tzdata
    - util-linux
  builds:
    - name: locale
      contents:
        packages:
          - bash
          - locales
          - coreutils
          - gzip
      pipeline:
        - name: install locales
          runs: |
            set -eux -o pipefail

            ln -s /etc/locale.alias /usr/share/locale/locale.alias

            echo "en_US.UTF-8 UTF-8" >> /etc/locale.gen
            locale-gen en_US.UTF-8
      outputs:
        - source: /usr/share/locale
          target: /usr/share/locale
          uid: 0
          gid: 0
        - source: /usr/lib/locale
          target: /usr/lib/locale
          uid: 0
          gid: 0
accounts:
  root: true
  run-as: root
  users:
    - name: nonroot
      uid: 65532
      gid: 65532
    - name: _apt
      uid: 42
      gid: 65532
  groups:
    - name: nonroot
      gid: 65532
      members:
        - nonroot
os-release:
  name: Docker Hardened Images (Debian)
  id: debian
  version-id: "13"
  version-codename: trixie
  pretty-name: Docker Hardened Images/Debian GNU/Linux 13 (trixie)
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
environment:
  DEBIAN_FRONTEND: noninteractive
  JAVA_HOME: /usr/lib/jvm/temurin-11
  LANG: en_US.UTF-8
  LANGUAGE: en_US:en
  LC_ALL: en_US.UTF-8
paths:
  - type: directory
    path: /usr/local/bin
    uid: 0
    gid: 0
  - type: symlink
    path: /usr/local/bin/java
    uid: 0
    gid: 0
    source: /usr/lib/jvm/temurin-11/bin/java
  - type: symlink
    path: /usr/local/bin/cass-config-builder.jar
    uid: 0
    gid: 0
    source: /usr/share/cass-config-builder/cass-config-builder.jar
  - type: symlink
    path: /definitions
    uid: 0
    gid: 0
    source: /usr/share/cass-config-builder/definitions
  - type: directory
    path: /opt/cass-config-builder/output
    uid: 65532
    gid: 65532
    mode: "0770"
annotations:
  org.opencontainers.image.description: A minimal cass-config-builder image
  org.opencontainers.image.licenses: Apache-2.0
entrypoint:
  - java
  - -jar
  - /usr/local/bin/cass-config-builder.jar
