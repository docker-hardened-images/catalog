# syntax=dhi.io/build:2-debian13

name: Percona XtraBackup 8.4.x (dev)
image: dhi.io/percona-xtrabackup
variant: dev
tags:
  - 8.4-dev
  - 8.4.0-6-dev
  - 8.4-debian-dev
  - 8.4-debian13-dev
  - 8.4.0-6-debian-dev
  - 8.4.0-6-debian13-dev
platforms:
  - linux/amd64
  - linux/arm64
dates:
  release: "2024-08-08"
vars:
  ARCH: '#{ target.arch == "amd64" ? "x86_64" : "aarch64" }'
  DEBIAN_VERSION: 8.4.0-6-0
  FLAVORED_SUFFIX: -dev
  PACKAGE_NAME: percona-xtrabackup-8.4
  SEMVER_MAJOR_MINOR_VERSION: "8.4"
  SEMVER_MAJOR_VERSION: "8"
  SEMVER_VERSION: 8.4.0
  SUFFIX: -dev
  VERSION: 8.4.0-6
contents:
  repositories:
    - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
  keyring:
    - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
  packages:
    - '!gawk'
    - '!libelogind0'
    - '!original-awk'
    - apt
    - base-files
    - bash
    - ca-certificates
    - ca-certificates-bundle
    - coreutils
    - diffutils
    - dpkg
    - findutils
    - grep
    - libaio1t64
    - libc-bin
    - libgcrypt20
    - libgpg-error0
    - libicu76
    - liblz4-1
    - libncurses6
    - libnuma1
    - libproc2-0
    - libprotobuf-lite32t64
    - libssl3t64
    - libstdc++6
    - libzstd1
    - mawk
    - percona-xtrabackup-8.4=8.4.0-6-0
    - perl-base
    - sed
    - tzdata
    - util-linux
    - zlib1g
accounts:
  root: true
  run-as: root
  users:
    - name: nonroot
      uid: 65532
      gid: 65532
    - name: _apt
      uid: 42
      gid: 65532
  groups:
    - name: nonroot
      gid: 65532
      members:
        - nonroot
os-release:
  name: Docker Hardened Images (Debian)
  id: debian
  version-id: "13"
  version-codename: trixie
  pretty-name: Docker Hardened Images/Debian GNU/Linux 13 (trixie)
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
environment:
  DEBIAN_FRONTEND: noninteractive
paths:
  - type: directory
    path: /usr/local/bin
    uid: 0
    gid: 0
  - type: symlink
    path: /usr/local/bin/xtrabackup
    uid: 0
    gid: 0
    source: /usr/bin/xtrabackup
  - type: symlink
    path: /usr/lib/${ARCH}-linux-gnu/libaio.so.1
    uid: 0
    gid: 0
    source: /usr/lib/${ARCH}-linux-gnu/libaio.so.1t64
annotations:
  org.opencontainers.image.description: A minimal Percona XtraBackup image
  org.opencontainers.image.licenses: GPL-2.0-only
entrypoint:
  - /usr/local/bin/xtrabackup
