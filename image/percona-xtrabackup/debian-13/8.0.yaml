# syntax=dhi.io/build:2-debian13

name: Percona XtraBackup 8.0.x
image: dhi.io/percona-xtrabackup
variant: runtime
tags:
  - "8.0"
  - 8.0.35
  - 8.0-debian
  - 8.0-debian13
  - 8.0.35-debian
  - 8.0.35-debian13
platforms:
  - linux/amd64
  - linux/arm64
dates:
  release: "2025-01-26"
vars:
  ARCH: '#{ target.arch == "amd64" ? "x86_64" : "aarch64" }'
  DEBIAN_VERSION: 8.0.35-36-1
  FLAVORED_SUFFIX: ""
  PACKAGE_NAME: percona-xtrabackup-8.0
  SEMVER_MAJOR_MINOR_VERSION: "8.0"
  SEMVER_MAJOR_VERSION: "8"
  SEMVER_VERSION: 8.0.35
  SUFFIX: ""
  VERSION: 8.0.35-36
contents:
  repositories:
    - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
  keyring:
    - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
  packages:
    - base-files
    - ca-certificates-bundle
    - libaio1t64
    - libgcrypt20
    - libgpg-error0
    - libicu76
    - liblz4-1
    - libncurses6
    - libnuma1
    - libproc2-0
    - libprotobuf-lite32t64
    - libssl3t64
    - libstdc++6
    - libzstd1
    - percona-xtrabackup-8.0=8.0.35-36-1
    - tzdata
    - zlib1g
accounts:
  run-as: nonroot
  users:
    - name: nonroot
      uid: 65532
      gid: 65532
  groups:
    - name: nonroot
      gid: 65532
      members:
        - nonroot
os-release:
  name: Docker Hardened Images (Debian)
  id: debian
  version-id: "13"
  version-codename: trixie
  pretty-name: Docker Hardened Images/Debian GNU/Linux 13 (trixie)
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
paths:
  - type: directory
    path: /usr/local/bin
    uid: 0
    gid: 0
  - type: symlink
    path: /usr/local/bin/xtrabackup
    uid: 0
    gid: 0
    source: /usr/bin/xtrabackup
  - type: symlink
    path: /usr/lib/${ARCH}-linux-gnu/libaio.so.1
    uid: 0
    gid: 0
    source: /usr/lib/${ARCH}-linux-gnu/libaio.so.1t64
annotations:
  org.opencontainers.image.description: A minimal Percona XtraBackup image
  org.opencontainers.image.licenses: GPL-2.0-only
entrypoint:
  - /usr/local/bin/xtrabackup
