metadata:
  display-name: OpenTelemetry Collector Kubernetes
  short-description: |
    The OpenTelemetry Collector Kubernetes distribution is a vendor-neutral telemetry
    pipeline built for monitoring Kubernetes and the workloads running in it. It
    bundles the Kubernetes receivers, processors and extensions (k8s_cluster,
    kubelet_stats, k8s_attributes, k8s_objects) with OTLP, Prometheus, Jaeger and Zipkin
    support, and exports telemetry over OTLP.
  featured: false
  home-url: https://opentelemetry.io
  categories:
    - developer-tools
    - monitoring-and-observability
