name: Claude Code (docker, dev)
image: dhi.io/claude
output: squashed
variant: dev
flavor: docker
tags:
  - latest
  - 2.1.322
platforms:
  - linux/amd64
  - linux/arm64
vars:
  BANNER_KIT: claude docker 2.1.322
  CENTERED_KIT_NAME: '          claude docker 2.1.322'
  CLIPBOARD_BRIDGE_ARCH: '#{ target.arch == "amd64" ? "amd64" : "arm64" }'
  CLIPBOARD_BRIDGE_VERSION: v0.3.1
  DHI_TAGS_OVERWRITE: "true"
  KIT_NAME: claude
  SANDBOXES_COMMIT_SHA: 54a695035350bab5f126a88c892a9bc3b5ae162a
  SBX_AGENT_HOOK: sbx-claude-hook
  SEMVER_MAJOR_MINOR_VERSION: "2.1"
