    - name: install-claude-code
      contents:
        packages:
          - bash
          - ca-certificates
          - coreutils
          - findutils
          - curl
          - sed
          - grep
      pipeline:
        - name: install
          run-as: agent
          privileged: true
          runs: |
            set -eux -o pipefail

            curl -fsSL https://claude.ai/install.sh | bash -s -- "2.1.322"
      accounts:
        run-as: agent
        users:
          - name: agent
            uid: 1000
            gid: 1000
        groups:
          - name: agent
            gid: 1000
      outputs:
        - source: /
          target: /
          uid: 0
          gid: 0
          diff: true
    - name: filesystem
