  - type: file
    path: /opt/claude-sessions/interactive-sessions.py
    content: |
      #!/usr/bin/env python3
      # Enumerate interactive Claude Code sessions for agent-sessions@1 list.
      # Background agents (claude agents --json --all) are excluded; those are
      # a different control surface. Optional argv[1] is an absolute cwd filter
      # (exact match), matching ACP's cwd filter.
      #
      # Mirrors the Agent SDK's listSessions() over every project: same files,
      # same head/tail reads, same skip rules, same order.
      import json
      import math
      import os
      import re
      import stat
      import subprocess
      import sys
      import unicodedata

      BUF = 65536
      UUID = re.compile(r"^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$", re.I)
      COMMAND = re.compile(r"<command-name>(.*?)</command-name>")
      BASH_INPUT = re.compile(r"<bash-input>[\s\S]*?</bash-input>")
      SKIP = re.compile(r"^(?:\s*<[a-z][\w-]*[\s>]|\[Request interrupted by user[^\]]*\])")
      CONTROL = re.compile(r"[\x00-\x1f\x7f-\x9f]")
      PARENT = b'"parentUuid":'


      def lines(text):
          return text.split("\n")


      def parse(line):
          try:
              return json.loads(line)
          except ValueError:
              return None


      def string_value(text, start):
          j = start
          while j < len(text):
              if text[j] == "\\":
                  j += 2
              elif text[j] == '"':
                  raw = text[start:j]
                  return ((parse(f'"{raw}"') if "\\" in raw else raw) or raw), j
              else:
                  j += 1
          return None, j


      # First (or last) "key":"value" in a possibly truncated JSONL chunk,
      # without parsing whole lines.
      def string_field(text, key, last=False):
          found, at = None, -1
          for pattern in (f'"{key}":"', f'"{key}": "'):
              i = text.find(pattern)
              while i >= 0:
                  value, end = string_value(text, i + len(pattern))
                  if value is not None and not last:
                      return value
                  if value is not None and i > at:
                      found, at = value, i
                  i = text.find(pattern, end + 1) if last else -1
          return found


      def typed_field(tail, kind, key):
          for line in reversed(lines(tail)):
              if f'"{key}":' in line and f'"type":"{kind}"' in line:
                  entry = parse(line)
                  if isinstance(entry, dict) and entry.get("type") == kind and isinstance(entry.get(key), str):
                      return entry[key]
          return None


      def first_prompt(entry, state):
          if not isinstance(entry, dict) or entry.get("type") != "user":
              return None
          if entry.get("isMeta") is True or entry.get("isCompactSummary") is True:
              return None
          message = entry.get("message")
          if not message:
              return None
          content = message.get("content") if isinstance(message, dict) else None
          texts = []
          if isinstance(content, str):
              texts.append(content)
          elif isinstance(content, list):
              for block in content:
                  if not isinstance(block, dict):
                      continue
                  if block.get("type") == "tool_result":
                      return None
                  if block.get("type") == "text" and isinstance(block.get("text"), str):
                      texts.append(block["text"])
          for text in texts:
              text = text.replace("\n", " ").strip()
              if not text:
                  continue
              command = COMMAND.search(text)
              if command:
                  if not state.get("command"):
                      state["command"] = command.group(1)
                  continue
              if BASH_INPUT.search(text) or not SKIP.match(text):
                  return text
          return None


      def head_prompt(head):
          state = {}
          for line in lines(head):
              if '"type":"user"' not in line and '"type": "user"' not in line:
                  continue
              if '"tool_result"' in line or re.search(r'"(isMeta|isCompactSummary)": ?true', line):
                  continue
              prompt = first_prompt(parse(line), state)
              if prompt:
                  return prompt
          return state.get("command", "")


      def head_attachment(head):
          for line in lines(head):
              if '"type":"user"' not in line and '"type": "user"' not in line:
                  continue
              if '"tool_result"' in line or re.search(r'"isMeta": ?true', line):
                  continue
              if re.search(r'"type": ?"image"', line):
                  return "Image"
              if re.search(r'"type": ?"document"', line):
                  return "Document"
          return ""


      def read_lite(path):
          try:
              fd = os.open(path, os.O_RDONLY | os.O_NOFOLLOW | os.O_NONBLOCK)
          except OSError:
              return None
          with os.fdopen(fd, "rb") as f:
              st = os.fstat(f.fileno())
              if not stat.S_ISREG(st.st_mode):
                  return None
              head = f.read(BUF)
              if not head:
                  return None
              tail = head
              if st.st_size > BUF:
                  f.seek(st.st_size - BUF)
                  tail = f.read(BUF)
              return st, head, tail


      def has_messages(path):
          lite = read_lite(path)
          if lite is None:
              return False
          st, head, tail = lite
          if PARENT in head or PARENT in tail:
              return True
          if st.st_size <= BUF:
              return False
          with open(path, "rb") as f:
              carry = b""
              for _ in range(16):
                  chunk = f.read(1 << 20)
                  if not chunk:
                      return False
                  if PARENT in carry + chunk:
                      return True
                  carry = chunk[-len(PARENT):]
          return True


      def continued_in(tail):
          if '"type":"continued-in"' not in tail:
              return None
          for line in reversed(lines(tail)):
              marker = '"type":"continued-in"' in line
              if not marker and '"type":"user"' not in line and '"type":"assistant"' not in line:
                  continue
              entry = parse(line)
              if not isinstance(entry, dict):
                  continue
              if marker and entry.get("type") == "continued-in" and isinstance(entry.get("continuedInSessionId"), str):
                  target = entry["continuedInSessionId"]
                  return target if UUID.match(target) else None
              if entry.get("type") == "assistant":
                  message = entry.get("message")
                  stop = message.get("stop_reason") if isinstance(message, dict) else None
                  if entry.get("isApiErrorMessage") in (None, False) and isinstance(stop, str):
                      return None
              elif first_prompt(entry, {}) is not None:
                  return None
          return None


      def sidecar_title(project, session_id):
          try:
              with open(os.path.join(project, session_id, "custom-title.json"), encoding="utf-8") as f:
                  title = json.load(f).get("customTitle")
          except (OSError, ValueError, AttributeError):
              return None
          if not isinstance(title, str):
              return None
          title = "".join(" " if unicodedata.category(c) in ("Cc", "Cf") or c in "\u2028\u2029" else c for c in title.strip())
          return CONTROL.sub("", title).strip() or None


      def session(project, name):
          session_id = name[: -len(".jsonl")]
          path = os.path.join(project, name)
          lite = read_lite(path)
          if lite is None:
              return None
          st, head_bytes, tail_bytes = lite
          head = head_bytes.decode("utf-8", "replace")
          tail = tail_bytes.decode("utf-8", "replace")

          target = continued_in(tail)
          if target and has_messages(os.path.join(project, f"{target}.jsonl")):
              return None
          if re.search(r'"isSidechain": ?true', lines(head)[0]):
              return None

          title = string_field(tail, "customTitle", last=True)
          if title is None:
              title = sidecar_title(project, session_id)
          summary = (
              title
              or string_field(head, "customTitle", last=True)
              or string_field(tail, "aiTitle", last=True)
              or string_field(head, "aiTitle", last=True)
              or string_field(tail, "lastPrompt", last=True)
              or string_field(tail, "summary", last=True)
              or head_prompt(head)
              or head_attachment(head)
          )
          if not summary:
              return None
          cwd = typed_field(tail, "relocated", "relocatedCwd") or string_field(head, "cwd")
          return session_id, mtime_ms(st), cwd


      # The SDK's lastModified is Node's Stats.mtime: the double
      # sec * 1e3 + nsec / 1e6, rounded. Truncating reorders near-ties.
      def mtime_ms(st):
          sec, nsec = divmod(st.st_mtime_ns, 1_000_000_000)
          return math.floor(sec * 1e3 + nsec / 1e6 + 0.5)


      def projects_dir():
          config = os.environ.get("CLAUDE_CONFIG_DIR") or os.path.join(os.path.expanduser("~"), ".claude")
          return os.path.join(unicodedata.normalize("NFC", config), "projects")


      def list_sessions():
          try:
              projects = [e.path for e in os.scandir(projects_dir()) if e.is_dir(follow_symlinks=False)]
          except OSError:
              return []

          newest = {}
          for project in projects:
              try:
                  names = [n for n in os.listdir(project) if n.endswith(".jsonl") and UUID.match(n[: -len(".jsonl")])]
              except OSError:
                  continue
              for name in names:
                  found = session(project, name)
                  if found and (found[0] not in newest or found[1] > newest[found[0]][1]):
                      newest[found[0]] = found
          return sorted(newest.values(), key=lambda s: (s[1], s[0]), reverse=True)


      def main():
          cwd_filter = sys.argv[1] if len(sys.argv) > 1 else None
          agents = subprocess.run(["claude", "agents", "--json", "--all"], check=True, stdout=subprocess.PIPE, text=True)
          rows = json.loads(agents.stdout)
          background = {r["sessionId"] for r in rows if r.get("kind") == "background" and r.get("sessionId")}

          # A missing cwd still has a resumable ID; it matters only when the
          # caller requests a cwd filter.
          for session_id, _, cwd in list_sessions():
              if session_id not in background and (not cwd_filter or cwd == cwd_filter):
                  sys.stdout.write(f"{session_id}\n")


      if __name__ == "__main__":
          main()
    uid: 0
    gid: 0
    mode: "0755"
  - type: file
    path: /usr/local/bin/sbx-claude-hook
    content: |
      #!/bin/sh
      # sbx-agent-hook — forwards agent lifecycle and session information to a desktop app.
      #
      # A desktop app for sandboxes registers an MCP server per sandbox on the
      # sandbox's MCP gateway (the same gateway the agent already talks to). This
      # script turns harness payloads into `tools/call`s on that server so the app
      # can raise a notification (`agent_notify`) and render a status line for the
      # session (`agent_statusline`: model, effort, context window, tokens, cost,
      # lines changed, git branch). Both tools are looked up in the gateway's
      # `tools/list` first and called only when listed: the app's server is loaded
      # only while the app runs, and a governed gateway records every `tools/call`
      # its MCP policy does not permit as a denied audit entry, so a call the
      # gateway never sees is the only one that leaves no trace. Without the app
      # nothing is called and nothing else happens.
      #
      #   sbx-agent-hook claude          Claude Code Stop / StopFailure / Notification
      #                                  hook: event JSON on stdin -> notify;
      #                                  UserPromptSubmit: the prompt -> session info
      #                                  (title), so the app can name a conversation
      #                                  the harness lists by id only
      #   sbx-agent-hook claude-status   Claude Code statusLine command: session JSON
      #                                  on stdin -> session info (prints nothing, so
      #                                  no status line is drawn in the terminal)
      #   sbx-agent-hook codex           Codex `notify`: event JSON as the last
      #                                  argument -> notify + session info read from
      #                                  the thread's rollout file
      #
      # Fail-safe by construction: every path exits 0, nothing is ever written to
      # stdout or stderr (Claude Code treats empty stdout + exit 0 as a clean
      # no-op, Codex ignores notify output), each request is bounded by a short
      # curl timeout, and missing tooling (curl, jq) or a missing gateway just
      # ends the script. The agent is never blocked or shown an error.

      mode="${1:-}"
      input=""
      case "$mode" in
        claude|claude-status) input=$(cat 2>/dev/null) ;;
        codex)
          shift
          for arg; do input="$arg"; done
          ;;
        *) exit 0 ;;
      esac
      [ -n "$input" ] || exit 0

      url="${MCP_GATEWAY_URL:-}"
      auth="Authorization: Bearer ${MCP_SENTINEL_TOKEN_NAME:-proxy-managed}"
      ctype='Content-Type: application/json'
      accept='Accept: application/json, text/event-stream'
      state_dir="${TMPDIR:-/tmp}/sbx-agent-hook"

      # --- MCP session over Streamable HTTP ---------------------------------------
      sid=""
      hdr=""
      mcp_open() {
        hdr=$(mktemp 2>/dev/null) || return 1
        init='{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-03-26","capabilities":{},"clientInfo":{"name":"sbx-agent-hook","version":"1.3"}}}'
        if ! curl -s -m 3 -o /dev/null -D "$hdr" -H "$auth" -H "$ctype" -H "$accept" --data "$init" "$url"; then
          rm -f "$hdr"
          return 1
        fi
        sid=$(tr -d '\r' < "$hdr" | awk 'tolower($1) == "mcp-session-id:" { print $2; exit }')
        rm -f "$hdr"
        [ -n "$sid" ] || return 1
        curl -s -m 3 -o /dev/null -H "$auth" -H "$ctype" -H "$accept" -H "Mcp-Session-Id: $sid" \
          --data '{"jsonrpc":"2.0","method":"notifications/initialized"}' "$url"
        # A session with no listing is one nothing may be called on.
        if ! tools=$(mcp_tools); then
          mcp_close
          return 1
        fi
        return 0
      }
      # Streamable HTTP permits JSON or SSE; this jq prelude yields the body's
      # JSON-RPC messages either way.
      jq_messages='
        def messages:
          . as $body | try [fromjson] catch
            [$body | gsub("\r\n|\r"; "\n") | split("\n\n")[]
             | split("\n") | map(select(startswith("data:"))
                                  | .[5:] | ltrimstr(" ")) | join("\n")
             | select(length > 0) | fromjson?];
        def reply: messages | map(select(type == "object" and .jsonrpc == "2.0" and .id == $id));'
      rpc_id=1
      # The names the gateway lists, one per line, across every tools/list page.
      # A page that fails or does not parse fails the listing. Runs in a command
      # substitution, so it takes request ids from 1000 up: a session must never
      # see an id twice, and increments made here would be lost to the caller.
      tools=""
      mcp_tools() {
        cursor=""
        pages=0
        while [ "$pages" -lt 16 ]; do
          pages=$((pages + 1))
          list_id=$((1000 + pages))
          params=$(jq -cn --arg c "$cursor" 'if $c == "" then {} else {cursor: $c} end')
          response=$(curl -s --fail -m 5 -H "$auth" -H "$ctype" -H "$accept" -H "Mcp-Session-Id: $sid" \
            --data "{\"jsonrpc\":\"2.0\",\"id\":$list_id,\"method\":\"tools/list\",\"params\":$params}" "$url") || return 1
          # First line: the next cursor (empty on the last page); then the names.
          page=$(printf '%s' "$response" | jq -Rsr --argjson id "$list_id" "$jq_messages"'
            reply | select(length == 1) | .[0] | select(has("error") | not) | .result
            | select(type == "object") | select((.tools | type) == "array")
            | (.nextCursor // "" | tostring), (.tools[] | .name | select(type == "string"))') || return 1
          [ -n "$page" ] || return 1
          cursor=$(printf '%s\n' "$page" | sed 1q)
          printf '%s\n' "$page" | sed 1d
          [ -n "$cursor" ] || return 0
        done
        return 1
      }
      # Whether the gateway listed a tool in this session.
      has_tool() { # tool-name
        case "
      $tools
      " in *"
      $1
      "*) return 0 ;; esac
        return 1
      }
      mcp_call() { # tool-name arguments-json
        has_tool "$1" || return 1
        rpc_id=$((rpc_id + 1))
        response=$(curl -s --fail -m 5 -H "$auth" -H "$ctype" -H "$accept" -H "Mcp-Session-Id: $sid" \
          --data "{\"jsonrpc\":\"2.0\",\"id\":$rpc_id,\"method\":\"tools/call\",\"params\":{\"name\":\"$1\",\"arguments\":$2}}" "$url") || return 1
        # Only a matching, successful tools/call result acknowledges delivery;
        # HTTP 200 alone does not.
        printf '%s' "$response" | jq -Rse --argjson id "$rpc_id" "$jq_messages"'
          reply | length == 1 and (.[0]
            | (has("error") | not)
              and (.result | type == "object" and (.content | type == "array")
                   and ((has("isError") | not) or .isError == false)))
        ' >/dev/null
      }
      mcp_close() {
        [ -n "$sid" ] && curl -s -m 2 -o /dev/null -X DELETE -H "$auth" -H "Mcp-Session-Id: $sid" "$url"
      }

      # --- Payload builders --------------------------------------------------------
      # Lifecycle event (Claude hook JSON or Codex notify JSON) -> notify arguments.
      notify_args() { # agent
        printf '%s' "$input" | jq -c --arg agent "$1" '
          def str: if . == null then null else tostring end;
          {
            agent: $agent,
            event: ((.hook_event_name // .type // "unknown") | tostring | ascii_downcase),
            session_id: ((.session_id // ."thread-id") | str),
            cwd: (.cwd | str),
            message: (((.last_assistant_message // ."last-assistant-message" // .message // "") | tostring) | .[0:600]),
            title: (.title | str),
            notification_type: (.notification_type | str),
            stop_hook_active: ((.stop_hook_active // false) == true)
          }'
      }

      # Live git facts for a directory, as jq --arg values (empty when not a repo).
      git_branch=""; git_dirty="false"; git_commit=""
      read_git() { # dir
        git_branch=""; git_dirty="false"; git_commit=""
        [ -n "$1" ] && [ -d "$1" ] || return 0
        if git_branch=$(git -C "$1" rev-parse --abbrev-ref HEAD 2>/dev/null); then
          git_commit=$(git -C "$1" rev-parse --short HEAD 2>/dev/null)
          [ -z "$(git -C "$1" status --porcelain 2>/dev/null | head -1)" ] || git_dirty="true"
        else
          git_branch=""
        fi
      }

      # Attaches the git facts to a session-info object on stdin.
      with_git() {
        jq -c --arg b "$git_branch" --arg c "$git_commit" --argjson d "$git_dirty" '
          . + { git_branch: (if $b == "" then .git_branch else $b end),
                git_commit: (if $c == "" then .git_commit else $c end),
                git_dirty: (if $b == "" then .git_dirty else $d end) }'
      }

      # Claude Code UserPromptSubmit JSON -> session arguments carrying only the
      # prompt as title (first line, trimmed); the app fills the rest from the
      # status line. Empty when the event carries no prompt.
      claude_prompt_args() {
        printf '%s' "$input" | jq -c '
          def str: if . == null then null else tostring end;
          def trim: gsub("^\\s+|\\s+$"; "");
          (.prompt // "" | tostring | split("\n") | map(trim | select(length > 0)) | .[0] // "") as $line
          | select($line != "")
          | { agent: "claude", session_id: (.session_id | str), cwd: (.cwd | str), title: ($line | .[0:200]) }'
      }

      # Claude Code statusLine JSON -> session arguments.
      claude_session_args() {
        effort=""
        [ -r "$HOME/.claude/settings.json" ] && effort=$(jq -r '.effortLevel // .env.CLAUDE_CODE_EFFORT_LEVEL // empty' "$HOME/.claude/settings.json" 2>/dev/null)
        [ -n "$effort" ] || effort="${CLAUDE_CODE_EFFORT_LEVEL:-}"
        printf '%s' "$input" | jq -c --arg effort "$effort" '
          def num: if . == null then null else tonumber end;
          {
            agent: "claude",
            session_id: (.session_id // null),
            cwd: (.workspace.current_dir // .cwd // null),
            model_id: (.model.id // null),
            model_name: (.model.display_name // .model.id // null),
            effort: (if $effort == "" then null else $effort end),
            version: (.version // null),
            context_used_tokens: (.context_window.total_input_tokens | num),
            context_window: (.context_window.context_window_size | num),
            context_percent: (.context_window.used_percentage | num),
            input_tokens: (.context_window.total_input_tokens | num),
            output_tokens: (.context_window.total_output_tokens | num),
            cost_usd: (.cost.total_cost_usd | num),
            duration_ms: (.cost.total_duration_ms | num),
            lines_added: (.cost.total_lines_added | num),
            lines_removed: (.cost.total_lines_removed | num),
            git_branch: null, git_commit: null, git_dirty: null
          }'
      }

      # Codex rollout file for a thread -> session arguments.
      codex_session_args() { # thread-id
        codex_store="${CODEX_HOME:-$HOME/.codex}"
        # Rollouts live under sessions/YYYY/MM/DD/. A glob rather than find: on
        # the sandbox's virtiofs mounts directories report a link count of 1 and
        # GNU find's leaf optimisation then never descends into them.
        set -- "$codex_store"/sessions/*/*/*/rollout-*-"$1".jsonl
        file=$1
        [ -f "$file" ] || return 1
        jq -n -c '
          def trim: gsub("^\\s+|\\s+$"; "");
          [inputs] as $all
          | ($all | map(select(.type == "session_meta")) | last | .payload) as $meta
          | ($all | map(select(.type == "turn_context")) | last | .payload) as $turn
          | ($all | map(select(.type == "event_msg" and .payload.type == "token_count")) | last | .payload.info) as $tok
          | ($tok.model_context_window // null) as $win
          | ($tok.last_token_usage.total_tokens // null) as $used
          # The first user message that is not a block Codex injects itself
          # (AGENTS.md, environment context, permissions…) names the thread.
          | ($all
             | map(select(.type == "response_item" and .payload.type == "message" and .payload.role == "user"))
             | map(.payload.content // [] | map(select(.type == "input_text" or .type == "text") | .text // "") | join("\n")
                   | trim | select(length > 0)
                   | select(startswith("# AGENTS.md") or startswith("<environment_context>") or startswith("<user_instructions>")
                            or startswith("<permissions") or startswith("<turn_aborted") or startswith("<external_codex_apps")
                            or startswith("<in-app-browser-context") or startswith("<user_shell_command") or startswith("<app-context")
                            or startswith("<skill") or startswith("<collaboration_mode") or startswith("<realtime_") | not))
             | first // null) as $prompt
          | (if $prompt == null then null
             else ($prompt | split("\n") | map(trim | select(length > 0)) | .[0] // null | if . == null then null else .[0:200] end) end) as $title
          | {
              agent: "codex",
              session_id: ($meta.id // null),
              cwd: ($turn.cwd // $meta.cwd // null),
              title: $title,
              model_id: ($turn.model // null),
              model_name: ($turn.model // null),
              effort: ($turn.effort // null),
              version: ($meta.cli_version // null),
              context_used_tokens: $used,
              context_window: $win,
              context_percent: (if ($win != null and $win > 0 and $used != null) then (($used * 100 / $win) | floor) else null end),
              input_tokens: ($tok.total_token_usage.input_tokens // null),
              output_tokens: ($tok.total_token_usage.output_tokens // null),
              cost_usd: null, duration_ms: null, lines_added: null, lines_removed: null,
              git_branch: ($meta.git.branch // null),
              git_commit: (($meta.git.commit_hash // null) | if . == null then null else .[0:7] end),
              git_dirty: null
            }' "$file"
      }

      # Sends session info unless it is identical to what this session sent last.
      send_session() { # args-json
        [ -n "$1" ] || return 0
        key=$(printf '%s' "$1" | jq -r '.session_id // "unknown"' 2>/dev/null | tr -c 'A-Za-z0-9_.-' '_')
        mkdir -p "$state_dir" 2>/dev/null
        stamp="$state_dir/$key.session"
        sum=$(printf '%s' "$1" | cksum | cut -d' ' -f1)
        [ -r "$stamp" ] && [ "$(cat "$stamp" 2>/dev/null)" = "$sum" ] && return 0
        mcp_open || return 0
        # Keep failed deliveries eligible for retry on the next identical update.
        if mcp_call agent_statusline "$1"; then
          printf '%s' "$sum" > "$stamp" 2>/dev/null
        fi
        mcp_close
      }

      # One worker drains the latest queued status for a session. Queue before
      # detaching so a delayed older worker cannot send over a newer update.
      # Recheck after releasing the lock: an enqueue may have found us busy just
      # before release, leaving a payload that no other worker will pick up.
      send_pending() { # session-key
        pending="$state_dir/$1.pending"
        lock="$state_dir/$1.lock"
        while mkdir "$lock" 2>/dev/null; do
          trap 'rm -f "$lock/payload"; rmdir "$lock" 2>/dev/null' 0
          trap 'exit 0' HUP INT TERM
          while mv "$pending" "$lock/payload" 2>/dev/null; do
            args=$(cat "$lock/payload" 2>/dev/null)
            read_git "$(printf '%s' "$args" | jq -r '.cwd // empty')"
            send_session "$(printf '%s' "$args" | with_git)"
          done
          rm -f "$lock/payload"
          rmdir "$lock" 2>/dev/null || return 0
          trap - 0 HUP INT TERM
          [ -f "$pending" ] || return 0
        done
      }

      {
        [ -n "$url" ] || exit 0
        command -v curl >/dev/null 2>&1 || exit 0
        command -v jq >/dev/null 2>&1 || exit 0

        case "$mode" in
          claude)
            case "$(printf '%s' "$input" | jq -r '.hook_event_name // empty')" in
              UserPromptSubmit)
                # Not a lifecycle event: the prompt names the conversation. Sent
                # as session info, not a notification. (Claude Code adds a
                # UserPromptSubmit hook's stdout to the prompt; this prints none.)
                args=$(claude_prompt_args) || exit 0
                [ -n "$args" ] || exit 0
                mcp_open || exit 0
                mcp_call agent_statusline "$args"
                mcp_close
                exit 0
                ;;
            esac
            args=$(notify_args claude) || exit 0
            [ -n "$args" ] || exit 0
            # A Stop that a previous Stop hook already continued is the same turn.
            case "$args" in *'"stop_hook_active":true'*) exit 0 ;; esac
            mcp_open || exit 0
            mcp_call agent_notify "$args"
            mcp_close
            ;;
          claude-status)
            # Claude Code cancels an in-flight statusLine command when the next
            # update arrives, so the network work runs detached and the command
            # itself returns at once (and prints nothing).
            args=$(claude_session_args) || exit 0
            [ -n "$args" ] || exit 0
            key=$(printf '%s' "$args" | jq -r '.session_id // "unknown"' | tr -c 'A-Za-z0-9_.-' '_')
            mkdir -p "$state_dir" 2>/dev/null || exit 0
            queued=$(mktemp "$state_dir/$key.XXXXXX" 2>/dev/null) || exit 0
            if ! printf '%s' "$args" > "$queued" || ! mv "$queued" "$state_dir/$key.pending"; then
              rm -f "$queued"
              exit 0
            fi
            (
              send_pending "$key"
            ) </dev/null >/dev/null 2>&1 &
            ;;
          codex)
            args=$(notify_args codex) || exit 0
            [ -n "$args" ] || exit 0
            tid=$(printf '%s' "$input" | jq -r '."thread-id" // empty')
            session=""
            if [ -n "$tid" ]; then
              session=$(codex_session_args "$tid") || session=""
              if [ -n "$session" ]; then
                read_git "$(printf '%s' "$session" | jq -r '.cwd // empty')"
                session=$(printf '%s' "$session" | with_git)
              fi
            fi
            mcp_open || exit 0
            mcp_call agent_notify "$args"
            [ -n "$session" ] && mcp_call agent_statusline "$session"
            mcp_close
            ;;
        esac
      } >/dev/null 2>&1
      exit 0
    uid: 0
    gid: 0
    mode: "0755"
  - type: delete
    path: /etc/profile.d/01-dhi.sh
    uid: 0
    gid: 0
  - type: file
    path: /etc/profile.d/01-dhi.sh
    content: |
      #!/bin/sh
      _dhi_marker="${HOME:-/home/agent}/.local/state/dhi-banner-shown"
      [ -f "$_dhi_marker" ] && { return 0 2>/dev/null || exit 0; }
      # Replaces every $2 in $1 with $3, into _dhi_out.
      _dhi_sub() {
        _dhi_out=""
        _dhi_s=$1
        while :; do
          case "$_dhi_s" in
            *"$2"*)
              _dhi_out="$_dhi_out${_dhi_s%%"$2"*}$3"
              _dhi_s=${_dhi_s#*"$2"}
              ;;
            *) break ;;
          esac
        done
        _dhi_out="$_dhi_out$_dhi_s"
      }
      # Value $1 cut from the left to $2 characters, into _dhi_out, and its
      # width, which the ellipsis's bytes would overcount, into _dhi_len. The
      # end of a path says more than its start, so whole leading components
      # go first; the last is cut only when it alone does not fit.
      _dhi_short() {
        _dhi_out=$1
        _dhi_len=${#_dhi_out}
        [ "$_dhi_len" -le "$2" ] && return 0
        while [ $((${#_dhi_out} + _dhi_ellw)) -gt "$2" ]; do
          _dhi_t=${_dhi_out#/}
          case "$_dhi_t" in
            */*) _dhi_out="/${_dhi_t#*/}" ;;
            *) break ;;
          esac
        done
        while [ $((${#_dhi_out} + _dhi_ellw)) -gt "$2" ]; do
          _dhi_out=${_dhi_out#?}
        done
        _dhi_len=$((${#_dhi_out} + _dhi_ellw))
        _dhi_out="$_dhi_ell$_dhi_out"
      }
      # A panel row of label $1 and value $2, into _dhi_out; false without a
      # value, so a fact the sandbox does not provide leaves no row.
      _dhi_fact() {
        [ -n "$2" ] || return 1
        _dhi_short "$2" "$_dhi_vmax"
        _dhi_v=$_dhi_out
        _dhi_out=$(printf '%s%-11s%s%s' "$_dhi_dim" "$1" "$_dhi_off" "$_dhi_v")
        [ $((11 + _dhi_len)) -gt "$_dhi_pw" ] && _dhi_pw=$((11 + _dhi_len))
        return 0
      }
      # The host of URL $1, into _dhi_out.
      _dhi_host() {
        _dhi_out=${1#*://}
        _dhi_out=${_dhi_out%%/*}
        _dhi_out=${_dhi_out##*@}
        case "$_dhi_out" in
          *\]) ;;
          *:*) _dhi_out=${_dhi_out%:*} ;;
        esac
      }
      # A function, so its set -- leaves the sourcing shell's arguments alone.
      _dhi_banner() {
        # No escapes for NO_COLOR or a dumb terminal, 24-bit color where the
        # terminal says it takes it, ASCII glyphs where it may lack UTF-8.
        _dhi_e=$(printf '\033')
        _dhi_mode=16
        [ -n "${NO_COLOR:-}" ] && _dhi_mode=0
        case "${TERM:-dumb}" in dumb) _dhi_mode=0 ;; esac
        if [ "$_dhi_mode" = 16 ]; then
          case "${COLORTERM:-}" in truecolor|24bit) _dhi_mode=24 ;; esac
        fi
        _dhi_bold="" _dhi_dim="" _dhi_off="" _dhi_ring="" _dhi_in="" _dhi_acc=""
        case "$_dhi_mode" in
          24)
            _dhi_bold="$_dhi_e[1m" _dhi_dim="$_dhi_e[2m" _dhi_off="$_dhi_e[0m"
            _dhi_in="$_dhi_e[38;2;29;99;237m" _dhi_acc="$_dhi_e[38;2;0;229;255m"
            ;;
          16)
            _dhi_bold="$_dhi_e[1m" _dhi_dim="$_dhi_e[2m" _dhi_off="$_dhi_e[0m"
            _dhi_ring="$_dhi_e[36m" _dhi_in="$_dhi_e[34m" _dhi_acc="$_dhi_e[96m"
            ;;
        esac
        case "${TERM:-dumb}" in
          dumb|linux)
            _dhi_sep='-' _dhi_ell='...' _dhi_ellw=3 _dhi_hr='-'
            ;;
          *)
            _dhi_sep='·' _dhi_ell='…' _dhi_ellw=1 _dhi_hr='─'
            ;;
        esac

        # The kits staged in the sandbox: the workload, then every mixin sbx
        # composed onto it at create, which the build cannot know. A kit's
        # name is its directory; its kind and version are top-level keys of
        # its kit.yaml, which some kits quote.
        _dhi_workload=""
        _dhi_mixins=""
        _dhi_width=0
        _dhi_vw=0
        for _dhi_kit in /usr/share/sandbox/kit/*/kit.yaml; do
          [ -r "$_dhi_kit" ] || continue
          _dhi_name=${_dhi_kit%/kit.yaml}
          _dhi_name=${_dhi_name##*/}
          _dhi_kind=""
          _dhi_ver=""
          while IFS= read -r _dhi_line || [ -n "$_dhi_line" ]; do
            case "$_dhi_line" in
              kind:*) _dhi_kind=$(printf '%s' "${_dhi_line#kind:}" | tr -d " \"'") ;;
              version:*) _dhi_ver=$(printf '%s' "${_dhi_line#version:}" | tr -d " \"'") ;;
            esac
          done < "$_dhi_kit"
          [ "${#_dhi_name}" -gt "$_dhi_width" ] && _dhi_width=${#_dhi_name}
          [ "${#_dhi_ver}" -gt "$_dhi_vw" ] && _dhi_vw=${#_dhi_ver}
          if [ "$_dhi_kind" = workload ]; then
            _dhi_workload="$_dhi_workload$_dhi_name $_dhi_ver;"
          else
            _dhi_mixins="$_dhi_mixins$_dhi_name $_dhi_ver;"
          fi
        done

        _dhi_ws=${WORKSPACE_DIR:-}
        if [ -n "${HOME:-}" ]; then
          case "$_dhi_ws" in "$HOME"|"$HOME"/*) _dhi_ws="~${_dhi_ws#"$HOME"}" ;; esac
        fi
        _dhi_os=""
        if [ -r /etc/os-release ]; then
          _dhi_id="" _dhi_vid="" _dhi_code=""
          while IFS= read -r _dhi_line || [ -n "$_dhi_line" ]; do
            case "$_dhi_line" in
              ID=*) _dhi_id=$(printf '%s' "${_dhi_line#ID=}" | tr -d "\"'") ;;
              VERSION_ID=*) _dhi_vid=$(printf '%s' "${_dhi_line#VERSION_ID=}" | tr -d "\"'") ;;
              VERSION_CODENAME=*) _dhi_code=$(printf '%s' "${_dhi_line#VERSION_CODENAME=}" | tr -d "\"'") ;;
            esac
          done < /etc/os-release
          if [ -n "$_dhi_id" ]; then
            _dhi_cap=$(printf '%.1s' "$_dhi_id" | tr '[:lower:]' '[:upper:]')
            _dhi_os="$_dhi_cap${_dhi_id#?}"
            [ -n "$_dhi_vid" ] && _dhi_os="$_dhi_os $_dhi_vid"
            [ -n "$_dhi_code" ] && _dhi_os="$_dhi_os ($_dhi_code)"
          fi
        fi
        _dhi_egress=""
        _dhi_proxy=${https_proxy:-}
        [ -n "$_dhi_proxy" ] || _dhi_proxy=${HTTPS_PROXY:-}
        if [ -n "$_dhi_proxy" ]; then
          _dhi_host "$_dhi_proxy"
          case "$_dhi_out" in
            gateway.docker.internal) _dhi_egress="gateway proxy" ;;
            *) _dhi_egress=$_dhi_out ;;
          esac
        fi
        _dhi_mcp=""
        if [ -n "${MCP_GATEWAY_URL:-}" ]; then
          _dhi_host "$MCP_GATEWAY_URL"
          case "$_dhi_out" in
            mcp-gateway.docker.internal) _dhi_mcp=gateway ;;
            *) _dhi_mcp=$_dhi_out ;;
          esac
        fi

        # The panel starts at column 45, beside the art, its last row level
        # with the art's. A fact's value is cut to the room left there, or, on a terminal too
        # narrow for the art beside the shortest panel, to the room left by
        # the panel alone. A terminal of unknown width counts as 80 columns.
        _dhi_cols=$( { stty size </dev/tty; } 2>/dev/null )
        _dhi_cols=${_dhi_cols#* }
        case "$_dhi_cols" in ''|0|*[!0-9]*) _dhi_cols=${COLUMNS:-0} ;; esac
        case "$_dhi_cols" in ''|*[!0-9]*) _dhi_cols=0 ;; esac
        _dhi_vmax=$_dhi_cols
        [ "$_dhi_vmax" -gt 0 ] || _dhi_vmax=80
        if [ "$_dhi_vmax" -ge $((44 + 34)) ]; then
          _dhi_vmax=$((_dhi_vmax - 44 - 11))
        else
          _dhi_vmax=$((_dhi_vmax - 2 - 11))
        fi
        [ "$_dhi_vmax" -ge 12 ] || _dhi_vmax=12
        # A cap keeps the panel compact on a wide terminal.
        [ "$_dhi_vmax" -le 30 ] || _dhi_vmax=30

        # The panel, a row per positional argument; _dhi_pw tracks its widest
        # row, which escapes would overcount if measured from the rows. The
        # title and the rule under it, as wide as that row, go on last.
        set --
        _dhi_pw=34
        _dhi_fact sandbox "${SANDBOX_VM_ID:-}" && set -- "$@" "$_dhi_out"
        _dhi_fact workspace "$_dhi_ws" && set -- "$@" "$_dhi_out"
        _dhi_fact base "$_dhi_os" && set -- "$@" "$_dhi_out"
        _dhi_fact egress "$_dhi_egress" && set -- "$@" "$_dhi_out"
        _dhi_fact mcp "$_dhi_mcp" && set -- "$@" "$_dhi_out"
        set -- "$@" ""
        _dhi_rest="$_dhi_workload$_dhi_mixins"
        if [ -n "$_dhi_rest" ]; then
          set -- "$@" "${_dhi_dim}kits$_dhi_off"
          while [ -n "$_dhi_rest" ]; do
            _dhi_item=${_dhi_rest%%;*}
            _dhi_rest=${_dhi_rest#*;}
            _dhi_out=$(printf '%s%-*s%s  %s%s%s' "$_dhi_acc" "$_dhi_width" "${_dhi_item% *}" "$_dhi_off" "$_dhi_dim" "${_dhi_item##* }" "$_dhi_off")
            set -- "$@" "$_dhi_out"
          done
          [ $((_dhi_width + _dhi_vw + 2)) -gt "$_dhi_pw" ] && _dhi_pw=$((_dhi_width + _dhi_vw + 2))
        else
          _dhi_item="claude docker 2.1.322"
          set -- "$@" "$_dhi_acc$_dhi_item$_dhi_off"
          [ "${#_dhi_item}" -gt "$_dhi_pw" ] && _dhi_pw=${#_dhi_item}
        fi
        _dhi_rule=""
        _dhi_n=0
        while [ "$_dhi_n" -lt "$_dhi_pw" ]; do
          _dhi_rule="$_dhi_rule$_dhi_hr"
          _dhi_n=$((_dhi_n + 1))
        done
        set -- "${_dhi_bold}Docker Sandbox$_dhi_off$_dhi_dim  $_dhi_sep  hardened by DHI$_dhi_off" "$_dhi_dim$_dhi_rule$_dhi_off" "$@"

        # A terminal too narrow for both gets the panel alone; one of unknown
        # width gets both.
        printf '\n'
        if [ "$_dhi_cols" -gt 0 ] && [ "$_dhi_cols" -lt $((44 + _dhi_pw)) ]; then
          for _dhi_item in "$@"; do
            printf '  %s\n' "$_dhi_item"
          done
          printf '\n'
          return 0
        fi

        # The art's {o}uter ring, {i}nner mark and {a}ccent, each up to its
        # {r}eset. In 24-bit color the ring shades from aqua at the top to
        # Docker blue at the bottom, over its 21 rows. A panel taller than the
        # art starts at its top and runs on below it.
        _dhi_start=$((22 - $#))
        [ "$_dhi_start" -ge 1 ] || _dhi_start=1
        _dhi_row=0
        while IFS= read -r _dhi_art; do
          if [ "$_dhi_mode" = 24 ]; then
            _dhi_ring="$_dhi_e[38;2;$((94 - 58 * _dhi_row / 20));$((234 - 84 * _dhi_row / 20));$((255 - 18 * _dhi_row / 20))m"
          fi
          _dhi_row=$((_dhi_row + 1))
          _dhi_sub "$_dhi_art" '{o}' "$_dhi_ring"
          _dhi_sub "$_dhi_out" '{i}' "$_dhi_in"
          _dhi_sub "$_dhi_out" '{a}' "$_dhi_acc"
          _dhi_sub "$_dhi_out" '{r}' "$_dhi_off"
          _dhi_paint=$_dhi_out
          _dhi_sub "$_dhi_art" '{o}' ""
          _dhi_sub "$_dhi_out" '{i}' ""
          _dhi_sub "$_dhi_out" '{a}' ""
          _dhi_sub "$_dhi_out" '{r}' ""
          if [ "$_dhi_row" -ge "$_dhi_start" ] && [ $# -gt 0 ]; then
            printf '%s%*s%s\n' "$_dhi_paint" $((44 - ${#_dhi_out})) "" "$1"
            shift
          else
            printf '%s\n' "$_dhi_paint"
          fi
        done <<'EOF'
                      {o}.=****=.{r}
                {o}:+*******#******+:{r}
            {o}.*********{r}        {o}*********.{r}
          {o}:******:{r}                {o}:******:{r}
          {o}***:{r}                        {o}:***{r}
          {o}***{r}         {i}=******={r}         {o}***{r}
          {o}***{r}        {i}**********{r}        {o}*#*{r}
          {o}**#{r}       {i}***={r}    {i}=***{r}       {o}***{r}
          {o}***{r}       {i}*#*{r}      {i}*#*{r}       {o}**#{r}
          {o}***{r}       {i}+***{r}    {i}***+{r}       {o}***{r}
          {o}**#{r}        {i}=***  *#*={r}        {o}***{r}
          {o}***{r}        {i}**#*  ****{r}        {o}***{r}
          {o}****{r}       {i}***    ***{r}        {o}=+{r}
          {o}***={r}     {i}**#******#**{r}    {o}**={r}
            {o}****{r}     {i}**********{r}    {o}:***{r}
            {o}****-{r}                 {o}:***{r}
              {o}-****{r}           {a}**************{r}
                {o}*****{r}         {a}+*****#*******{r}
                  {o}+****+{r}    {a}+*{r}     {a}:***{r}
                    {o}.**********{r}    {a}:***{r}
                      {o}.****.       {a}=+{r}
      EOF
        for _dhi_item in "$@"; do
          printf '%44s%s\n' "" "$_dhi_item"
        done
        printf '\n'
      }
      _dhi_banner
      unset -f _dhi_banner _dhi_sub _dhi_short _dhi_fact _dhi_host
      unset _dhi_out _dhi_s _dhi_e _dhi_mode _dhi_bold _dhi_dim _dhi_off _dhi_ring _dhi_in _dhi_acc \
        _dhi_sep _dhi_rule _dhi_workload _dhi_mixins _dhi_width _dhi_vw _dhi_kit \
        _dhi_name _dhi_kind _dhi_ver _dhi_line _dhi_ws _dhi_os _dhi_id _dhi_vid _dhi_code _dhi_cap \
        _dhi_egress _dhi_proxy _dhi_mcp _dhi_pw _dhi_rest _dhi_item _dhi_cols \
        _dhi_row _dhi_art _dhi_paint _dhi_ell _dhi_vmax _dhi_v _dhi_start \
        _dhi_ellw _dhi_hr _dhi_len _dhi_t _dhi_n
      mkdir -p "$(dirname "$_dhi_marker")" 2>/dev/null || true
      : > "$_dhi_marker" 2>/dev/null || true
      unset _dhi_marker
    uid: 0
    gid: 0
    mode: "0755"
