annotations:
  org.opencontainers.image.description: A minimal Claude Code sandbox image
  org.opencontainers.image.licenses: LicenseRef-Proprietary
labels:
  com.docker.dash.kit: claude
  com.docker.sandboxes: templates
  com.docker.sandboxes.base: dhi.io/debian-base:trixie
  com.docker.sandboxes.flavor: claude
  com.docker.sandboxes.start-docker: "true"
