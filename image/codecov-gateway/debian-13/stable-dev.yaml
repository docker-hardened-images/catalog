# syntax=dhi.io/build:2-debian13

name: Codecov Gateway 26.x (dev)
image: dhi.io/codecov-gateway
variant: dev
tags:
  - 26-dev
  - 26.4-dev
  - 26.4.1-dev
  - 26-debian-dev
  - 26-debian13-dev
  - 26.4-debian-dev
  - 26.4-debian13-dev
  - 26.4.1-debian-dev
  - 26.4.1-debian13-dev
platforms:
  - linux/amd64
  - linux/arm64
dates:
  release: "2023-10-03"
vars:
  SEMVER_MAJOR_MINOR_VERSION: "26.4"
  SEMVER_MAJOR_VERSION: "26"
  SEMVER_VERSION: 26.4.1
  VERSION: 26.4.1-0
contents:
  repositories:
    - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
  keyring:
    - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
  packages:
    - '!gawk'
    - '!libelogind0'
    - '!original-awk'
    - apt
    - base-files
    - bash
    - ca-certificates
    - ca-certificates-bundle
    - codecov-gateway=26.4.1-0
    - coreutils
    - diffutils
    - dpkg
    - findutils
    - gettext-base
    - grep
    - haproxy-3.4
    - libc-bin
    - libc6
    - libcrypt1
    - libgcc-s1
    - liblua5.4-0
    - libpcre2-8-0
    - libssl3t64
    - mawk
    - netcat-openbsd
    - perl-base
    - sed
    - tzdata
    - util-linux
accounts:
  root: true
  run-as: root
  users:
    - name: haproxy
      uid: 65532
      gid: 65532
    - name: _apt
      uid: 42
      gid: 65532
  groups:
    - name: haproxy
      gid: 65532
      members:
        - haproxy
os-release:
  name: Docker Hardened Images (Debian)
  id: debian
  version-id: "13"
  version-codename: trixie
  pretty-name: Docker Hardened Images/Debian GNU/Linux 13 (trixie)
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
environment:
  BUILD_VERSION: 26.4.1
  CODECOV_API_ADMIN_DEBUG_ENABLED: "false"
  CODECOV_API_ADMIN_ENABLED: "false"
  CODECOV_API_ADMIN_PATH: admin
  CODECOV_API_HOST: api
  CODECOV_API_HOST_HEADER: '%[req.hdr(Host)]'
  CODECOV_API_PORT: "8000"
  CODECOV_API_SCHEME: http
  CODECOV_DEFAULT_HOST: frontend
  CODECOV_DEFAULT_HOST_HEADER: '%[req.hdr(Host)]'
  CODECOV_DEFAULT_PORT: "8080"
  CODECOV_DEFAULT_SCHEME: http
  CODECOV_GATEWAY_CHROOT_DISABLED: "true"
  CODECOV_GATEWAY_HTTP_PORT: "8080"
  CODECOV_GATEWAY_HTTPS_PORT: "8443"
  CODECOV_IA_HOST: api
  CODECOV_IA_HOST_HEADER: '%[req.hdr(Host)]'
  CODECOV_IA_PORT: "8000"
  CODECOV_IA_SCHEME: http
  CODECOV_MINIO_HOST: minio
  CODECOV_MINIO_HOST_HEADER: '%[req.hdr(Host)]'
  CODECOV_MINIO_PORT: "9000"
  CODECOV_MINIO_SCHEME: http
  DEBIAN_FRONTEND: noninteractive
paths:
  - type: directory
    path: /var/lib/haproxy
    uid: 0
    gid: 0
    mode: "0755"
  - type: directory
    path: /usr/local/bin
    uid: 0
    gid: 0
    mode: "0755"
  - type: symlink
    path: /usr/local/bin/codecov-gateway
    uid: 0
    gid: 0
    source: /usr/bin/codecov-gateway
  - type: symlink
    path: /usr/local/bin/entrypoint.sh
    uid: 0
    gid: 0
    source: /usr/bin/codecov-gateway
  - type: symlink
    path: /usr/bin/nc
    uid: 0
    gid: 0
    source: /usr/bin/nc.openbsd
  - type: directory
    path: /etc/codecov/ssl/certs
    uid: 0
    gid: 0
    mode: "0755"
  - type: directory
    path: /etc/haproxy
    uid: 65532
    gid: 65532
    mode: "0755"
  - type: directory
    path: /run
    uid: 65532
    gid: 65532
    mode: "0755"
  - type: directory
    path: /etc
    uid: 0
    gid: 0
    mode: "0755"
annotations:
  org.opencontainers.image.description: A minimal Codecov Gateway image
  org.opencontainers.image.licenses: FSL-1.1-ALv2
entrypoint:
  - /usr/local/bin/codecov-gateway
ports:
  - 8080/tcp
  - 8443/tcp
