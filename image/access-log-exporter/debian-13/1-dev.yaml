# syntax=dhi.io/build:2-debian13

name: Access Log Exporter 1.x (dev)
image: dhi.io/access-log-exporter
variant: dev
tags:
  - 1-dev
  - 1.0-dev
  - 1.0.1-dev
  - 1-debian-dev
  - 1-debian13-dev
  - 1.0-debian-dev
  - 1.0-debian13-dev
  - 1.0.1-debian-dev
  - 1.0.1-debian13-dev
platforms:
  - linux/amd64
  - linux/arm64
dates:
  release: "2026-10-23"
vars:
  COMMIT_SHA: 636bbb5e8fbb7872542cf1953277af1ba46f1a91
  DEBIAN_VERSION: 1.0.1-0
  FLAVORED_SUFFIX: -dev
  SEMVER_MAJOR_MINOR_VERSION: "1.0"
  SEMVER_MAJOR_VERSION: "1"
  SEMVER_VERSION: 1.0.1
  SUFFIX: -dev
  VERSION: 1.0.1
contents:
  repositories:
    - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
  keyring:
    - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
  packages:
    - '!gawk'
    - '!libelogind0'
    - '!original-awk'
    - access-log-exporter-1-dev=1.0.1-0
    - apt
    - base-files
    - bash
    - ca-certificates
    - ca-certificates-bundle
    - coreutils
    - diffutils
    - dpkg
    - findutils
    - grep
    - libc-bin
    - mawk
    - perl-base
    - sed
    - tzdata
    - util-linux
  files:
    - url: https://raw.githubusercontent.com/jkroepke/access-log-exporter/636bbb5e8fbb7872542cf1953277af1ba46f1a91/packaging/etc/access-log-exporter/config.yaml
      path: /etc/access-log-exporter/config.yaml
      uid: 65532
      gid: 65532
      mode: "0644"
accounts:
  root: true
  run-as: root
  users:
    - name: nonroot
      uid: 65532
      gid: 65532
