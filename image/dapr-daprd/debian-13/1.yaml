# syntax=dhi.io/build:2-debian13

name: dapr daprd 1.x
image: dhi.io/dapr-daprd
variant: runtime
tags:
  - "1"
  - "1.19"
  - 1.19.1
  - 1-debian
  - 1-debian13
  - 1.19-debian
  - 1.19-debian13
  - 1.19.1-debian
  - 1.19.1-debian13
platforms:
  - linux/amd64
  - linux/arm64
dates:
  release: "2025-09-16"
vars:
  FIPS_SUFFIX: ""
  FLAVORED_SUFFIX: ""
  SEMVER_MAJOR_MINOR_VERSION: "1.19"
  SEMVER_MAJOR_VERSION: "1"
  SEMVER_VERSION: 1.19.1
  SUFFIX: ""
  VERSION: 1.19.1-2
contents:
  repositories:
    - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
  keyring:
    - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
  packages:
    - base-files
    - ca-certificates-bundle
    - dapr-daprd=1.19.1-2
    - tzdata
accounts:
  run-as: "65532"
  users:
    - name: nonroot
      uid: 65532
      gid: 65532
  groups:
    - name: nonroot
      gid: 65532
      members:
        - nonroot
os-release:
  name: Docker Hardened Images (Debian)
  id: debian
  version-id: "13"
  version-codename: trixie
  pretty-name: Docker Hardened Images/Debian GNU/Linux 13 (trixie)
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
paths:
  - type: directory
    path: /usr/local/bin
    uid: 0
    gid: 0
  - type: symlink
    path: /usr/local/bin/daprd
    uid: 0
    gid: 0
    source: /usr/bin/daprd
  - type: symlink
    path: /daprd
    uid: 0
    gid: 0
    source: /usr/local/bin/daprd
  - type: directory
    path: /app/cmd/daprd
    uid: 0
    gid: 0
  - type: symlink
    path: /app/cmd/daprd/daprd
    uid: 0
    gid: 0
    source: /usr/local/bin/daprd
annotations:
  org.opencontainers.image.description: A minimal Dapr daprd runtime image
  org.opencontainers.image.licenses: Apache-2.0
entrypoint:
  - /usr/local/bin/daprd
ports:
  - "3500"
  - "50001"
  - "9090"
