# syntax=dhi.io/build:2-debian13

name: k8ssandra-client 0.x (dev)
image: dhi.io/k8ssandra-client
variant: dev
tags:
  - 0-dev
  - 0.9-dev
  - 0.9.4-dev
  - 0-debian-dev
  - 0-debian13-dev
  - 0.9-debian-dev
  - 0.9-debian13-dev
  - 0.9.4-debian-dev
  - 0.9.4-debian13-dev
platforms:
  - linux/amd64
  - linux/arm64
dates:
  release: "2025-06-04"
vars:
  FLAVORED_SUFFIX: -dev
  SEMVER_MAJOR_MINOR_VERSION: "0.9"
  SEMVER_MAJOR_VERSION: "0"
  SEMVER_VERSION: 0.9.4
  SUFFIX: -dev
  VERSION: 0.9.4-1
  YQ_VERSION: 4.54.3-1
contents:
  repositories:
    - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
  keyring:
    - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
  packages:
    - '!gawk'
    - '!libelogind0'
    - '!original-awk'
    - apt
    - bash
    - ca-certificates
    - coreutils
    - diffutils
    - dpkg
    - findutils
    - grep
    - kubectl-1.35-dev
    - kubectl-k8ssandra-dev=0.9.4-1
    - libc-bin
    - mawk
    - perl-base
    - sed
    - util-linux
    - yq-go=4.54.3-1
accounts:
  root: true
  run-as: root
  users:
    - name: nonroot
      uid: 65532
      gid: 65532
    - name: _apt
      uid: 42
      gid: 65532
  groups:
    - name: nonroot
      gid: 65532
      members:
        - nonroot
os-release:
  name: Docker Hardened Images (Debian)
  id: debian
  version-id: "13"
  version-codename: trixie
  pretty-name: Docker Hardened Images/Debian GNU/Linux 13 (trixie)
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
environment:
  DEBIAN_FRONTEND: noninteractive
paths:
  - type: directory
    path: /usr/local/bin
    uid: 0
    gid: 0
  - type: symlink
    path: /usr/local/bin/kubectl
    uid: 0
    gid: 0
    source: /usr/bin/kubectl
  - type: symlink
    path: /usr/local/bin/kubectl-k8ssandra
    uid: 0
    gid: 0
    source: /usr/bin/kubectl-k8ssandra
  - type: symlink
    path: /usr/local/bin/yq
    uid: 0
    gid: 0
    source: /usr/bin/yq
annotations:
  org.opencontainers.image.description: A minimal k8ssandra-client image
  org.opencontainers.image.licenses: Apache-2.0
entrypoint:
  - /usr/local/bin/kubectl-k8ssandra
cmd:
  - --help
