# syntax=dhi.io/build:2-debian13

name: Langfuse 4.x
image: dhi.io/langfuse
variant: runtime
tags:
  - "4"
  - "4.10"
  - 4.10.0
  - 4-debian
  - 4-debian13
  - 4.10-debian
  - 4.10-debian13
  - 4.10.0-debian
  - 4.10.0-debian13
platforms:
  - linux/amd64
  - linux/arm64
dates:
  release: "2026-07-30"
vars:
  COMMIT_SHA: ddc198b49f1439f95ecf674c68863bfb0c2bd07f
  MIGRATE_COMMIT_SHA: 89e308c340a2c069c3260f268307d38a7db88227
  MIGRATE_VERSION: 4.19.1
  PNPM_VERSION: 11.1.3
  PRISMA_VERSION: 6.19.3
  SEMVER_MAJOR_MINOR_VERSION: "4.10"
  SEMVER_MAJOR_VERSION: "4"
  SEMVER_VERSION: 4.10.0
  TURBO_VERSION: 2.9.14
  VERSION: 4.10.0
contents:
  repositories:
    - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
  keyring:
    - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
  packages:
    - '!libelogind0'
    - '!mawk'
    - '!original-awk'
    - base-files
    - ca-certificates
    - ca-certificates-bundle
    - dash
    - dumb-init
    - libc6
    - libgomp1
    - libstdc++6
    - netbase
    - nodejs-24
    - tzdata
  builds:
    - name: golang-migrate
      work-dir: /go/src/github.com/golang-migrate/migrate
      environment:
        TURBO_TELEMETRY_DISABLED: "1"
      caches:
        - path: /go/pkg/mod
      contents:
        packages:
          - bash
          - ca-certificates-bundle
          - coreutils
          - golang-1.26
          - findutils
          - mawk
          - sed
        files:
          - url: git+https://github.com/golang-migrate/migrate.git#v4.19.1
            checksum: 89e308c340a2c069c3260f268307d38a7db88227
            path: /go/src/github.com/golang-migrate/migrate
            spdx:
              name: golang-migrate
              version: 4.19.1
              packages:
                - name: golang-migrate
                  purl: pkg:golang/github.com/golang-migrate/migrate/v4@v4.19.1
                  license: MIT
            uid: 0
            gid: 0
      pipeline:
        - name: update go dependencies
          uses: go/bump@v2
          with:
            deps: []
            download: true
        - name: build migrate
          uses: go/build@v1
          with:
            ldflags:
              - -s
              - -w
            output: ${target.dir}/usr/bin/migrate
            packages: ./cmd/migrate
            tags: clickhouse
      outputs:
        - source: ${target.dir}/usr/bin/migrate
          target: /usr/bin/migrate
          uid: 0
          gid: 0
          mode: "0755"
        - source: /opt/docker/sbom/golang-migrate
          target: /opt/docker/sbom/golang-migrate
          uid: 0
          gid: 0
    - name: langfuse
      work-dir: ${source.dir}/langfuse
      environment:
        CI: "true"
        DOCKER_BUILD: "1"
        NEXT_MANUAL_SIG_HANDLE: "true"
        NEXT_TELEMETRY_DISABLED: "1"
        PNPM_HOME: /pnpm
      caches:
        - path: /pnpm/store
        - path: /root/.cache
      contents:
        packages:
          - base-files
          - bash
          - ca-certificates
          - coreutils
          - findutils
          - git
          - libc6
          - libstdc++6
          - mawk
          - nodejs-24
          - node-corepack
          - npm
          - sed
          - yarn-classic
          - yq-go
        files:
          - url: git+https://github.com/langfuse/langfuse.git#v4.10.0
            checksum: ddc198b49f1439f95ecf674c68863bfb0c2bd07f
            path: ${source.dir}/langfuse
            spdx:
              name: langfuse
              version: 4.10.0
              packages:
                - name: langfuse
                  purl: pkg:github/langfuse/langfuse@4.10.0
                  license: MIT
            uid: 0
            gid: 0
      pipeline:
        - name: build and stage web (v4)
          privileged: true
          runs: |
            set -eux -o pipefail

            corepack enable
            corepack prepare pnpm@11.1.3 --activate
            npm install -g --no-package-lock --no-save turbo@2.9.14
            export PATH="$(npm config get prefix)/bin:${PATH}"

            turbo prune --scope=web --docker

            cd ./out
            cp -a json/. .
            cp -a full/. .

            npm pkg set packageManager=pnpm@11.1.3

            yq -i '.minimumReleaseAge = 0' pnpm-workspace.yaml
            yq -i '.overrides."axios" = "1.18.0"' pnpm-workspace.yaml
            yq -i '.overrides."fast-uri" = "3.1.5"' pnpm-workspace.yaml
            yq -i '.overrides."langsmith" = "0.6.0"' pnpm-workspace.yaml
            yq -i '.overrides."nodemailer" = "9.0.1"' pnpm-workspace.yaml
            yq -i '.overrides."nanoid" = "3.3.17"' pnpm-workspace.yaml
            yq -i '.overrides."hono" = "4.12.34"' pnpm-workspace.yaml
            yq -i '.overrides."js-yaml@4" = "4.3.1"' pnpm-workspace.yaml
            yq -i '.overrides."brace-expansion" = "5.0.9"' pnpm-workspace.yaml
            yq -i '.overrides."fast-xml-parser" = "5.7.0"' pnpm-workspace.yaml
            yq -i '.overrides."qs" = "6.15.2"' pnpm-workspace.yaml
            yq -i '.overrides."@tootallnate/once" = "3.0.1"' pnpm-workspace.yaml
            yq -i '.overrides."protobufjs" = "7.6.5"' pnpm-workspace.yaml
            yq -i '.overrides."@protobufjs/utf8" = "1.1.1"' pnpm-workspace.yaml
            yq -i '.overrides."postcss" = "8.5.23"' pnpm-workspace.yaml
            yq -i '.overrides."form-data" = "4.0.6"' pnpm-workspace.yaml
            yq -i '.overrides."follow-redirects" = "1.16.0"' pnpm-workspace.yaml
            yq -i '.overrides."@babel/runtime" = "7.29.2"' pnpm-workspace.yaml
            yq -i '.overrides."@babel/core" = "7.29.6"' pnpm-workspace.yaml
            yq -i '.overrides."@opentelemetry/exporter-prometheus" = "0.217.0"' pnpm-workspace.yaml
            yq -i '.overrides."@opentelemetry/sdk-node" = "0.217.0"' pnpm-workspace.yaml
            yq -i '.overrides."shell-quote" = "1.9.0"' pnpm-workspace.yaml
            yq -i '.overrides."esbuild" = "0.28.1"' pnpm-workspace.yaml
            yq -i '.overrides."@grpc/grpc-js" = ">=1.14.4"' pnpm-workspace.yaml
            yq -i '.overrides."dompurify" = "3.4.13"' pnpm-workspace.yaml
            yq -i '.overrides."@opentelemetry/core" = "2.8.0"' pnpm-workspace.yaml
            yq -i '.overrides."@opentelemetry/propagator-jaeger" = "2.9.0"' pnpm-workspace.yaml
            yq -i '.overrides."sharp" = "0.35.0"' pnpm-workspace.yaml
            yq -i '.overrides."@hono/node-server" = "2.0.10"' pnpm-workspace.yaml
            yq -i 'del(.patchedDependencies."next-auth@4.24.14")' pnpm-workspace.yaml
            yq -i '.overrides."next-auth" = "4.24.15"' pnpm-workspace.yaml

            pnpm install ---lockfile-only --ignore-scripts

            pnpm install ---frozen-lockfile --ignore-scripts

            rm -f /src/langfuse/pnpm-workspace.yaml /src/langfuse/pnpm-lock.yaml

            node -e '
              const fs = require("fs");
              const f = "./web/package.json";
              const p = JSON.parse(fs.readFileSync(f, "utf8"));
              p.scripts.build = p.scripts.build.replace(/(\s|^)next build(\s|$)/, "$1next build --webpack$2");
              fs.writeFileSync(f, JSON.stringify(p, null, 2) + "\n");
            '

            node -e '
              const fs = require("fs");
              const f = "./web/next.config.mjs";
              let s = fs.readFileSync(f, "utf8");
              const extra = "cpus: 0, workerThreads: false, esmExternals: \"loose\",";
              if (/experimental:\s*\{/.test(s)) {
                s = s.replace(/experimental:\s*\{/, "experimental: { " + extra);
              } else {
                s = s.replace(/const nextConfig = \{/, "const nextConfig = {\n  experimental: { " + extra + " },");
              }
              if (!/outputFileTracingExcludes:/.test(s)) {
                s = s.replace(/const nextConfig = \{/, "const nextConfig = {\n  outputFileTracingExcludes: { \"*\": [\"node_modules/@esbuild/**\", \"node_modules/typescript/**\", \"node_modules/webpack/**\", \"node_modules/terser-webpack-plugin/**\"] },");
              }
              if (!/outputFileTracingRoot:/.test(s)) {
                s = s.replace(/const nextConfig = \{/, "const nextConfig = {\n  outputFileTracingRoot: new URL(\"..\", import.meta.url).pathname,");
              }
              if (!/typescript:\s*\{/.test(s)) {
                s = s.replace(/const nextConfig = \{/, "const nextConfig = {\n  typescript: { ignoreBuildErrors: true },");
              }
              if (/webpack\(config[^)]*\)\s*\{/.test(s)) {
                s = s.replace(/(webpack\(config[^)]*\)\s*\{)/, "$1\n    config.optimization = { ...(config.optimization || {}), minimize: false };");
              } else {
                s = s.replace(/const nextConfig = \{/, "const nextConfig = {\n  webpack: (config) => { config.optimization = { ...(config.optimization || {}), minimize: false }; return config; },");
              }
              s = s.replace(/export\s+default\s+withSentryConfig\([^]*$/, "export default nextConfig;\n");
              fs.writeFileSync(f, s);
            '

            HEAP_MB=$(node -e 'console.log(Math.min(8192, Math.floor(require("os").totalmem()/1024/1024*0.45)))')
            NODE_OPTIONS="--max-old-space-size=${HEAP_MB}" \
              NEXT_IGNORE_BUILD_ERRORS=true \
              turbo run build --filter=web... --concurrency=1

            mkdir -p "${target.dir}/opt/prisma"
            npm install -g --no-package-lock --no-save \
              --prefix "${target.dir}/opt/prisma" \
              prisma@6.19.3

            find "${target.dir}/opt/prisma" -type f \
              \( -name '*.js' -o -name 'prisma' \) \
              -exec sed -i '1s|^#!/usr/bin/env node$|#!/usr/local/bin/node|' {} +

            mkdir -p "${target.dir}/app/web/.next" \
              "${target.dir}/app/packages/shared/scripts"

            cp -a ./web/.next/standalone/. "${target.dir}/app/"
            cp -a ./web/.next/static "${target.dir}/app/web/.next/static"
            cp -a ./web/public "${target.dir}/app/web/public"

            cp -a ./packages/shared/prisma "${target.dir}/app/packages/shared/prisma"

            if [ -f ./packages/shared/clickhouse/scripts/up.sh ]; then
              sed -i -E \
                -e 's| && source | \&\& . |g' \
                -e 's|&> /dev/null|>/dev/null 2>\&1|g' \
                -e 's|" == "|" = "|g' \
                ./packages/shared/clickhouse/scripts/up.sh
            fi
            cp -a ./packages/shared/clickhouse "${target.dir}/app/packages/shared/clickhouse"

            cp ./web/next.config.mjs "${target.dir}/app/next.config.mjs"
            cp ./web/package.json "${target.dir}/app/package.json"

            cp ./web/entrypoint.sh "${target.dir}/app/web/entrypoint.sh"
            chmod +x "${target.dir}/app/web/entrypoint.sh"

            sed -i -E \
              -e 's|_stripped=\$\(printf.*"\$_val".*sed.*\)|_stripped="$_val"|' \
              -e 's|_stripped=\$\(printf.*"\$_pass".*sed.*\)|_stripped="$_pass"|' \
              "${target.dir}/app/web/entrypoint.sh"

            cp ./packages/shared/scripts/cleanup.sql \
              "${target.dir}/app/packages/shared/scripts/cleanup.sql"
      outputs:
        - source: ${target.dir}/app
          target: /app
          uid: 65532
          gid: 65532
        - source: ${target.dir}/opt/prisma
          target: /opt/prisma
          uid: 0
          gid: 0
        - source: /opt/docker/sbom/langfuse
          target: /opt/docker/sbom/langfuse
          uid: 0
          gid: 0
accounts:
  run-as: nonroot
  users:
    - name: nonroot
      uid: 65532
      gid: 65532
  groups:
    - name: nonroot
      gid: 65532
      members:
        - nonroot
os-release:
  name: Docker Hardened Images (Debian)
  id: debian
  version-id: "13"
  version-codename: trixie
  pretty-name: Docker Hardened Images/Debian GNU/Linux 13 (trixie)
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
work-dir: /app
environment:
  HOSTNAME: 0.0.0.0
  NEXT_MANUAL_SIG_HANDLE: "true"
  NEXT_TELEMETRY_DISABLED: "1"
  NODE_ENV: production
  PATH: /opt/prisma/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
  PORT: "3000"
paths:
  - type: directory
    path: /app
    uid: 65532
    gid: 65532
    mode: "0755"
  - type: directory
    path: /usr/local/bin
    uid: 0
    gid: 0
    mode: "0755"
  - type: symlink
    path: /usr/local/bin/node
    uid: 0
    gid: 0
    source: /usr/bin/node
  - type: symlink
    path: /usr/local/bin/entrypoint.sh
    uid: 0
    gid: 0
    source: /app/web/entrypoint.sh
annotations:
  org.opencontainers.image.description: A minimal Langfuse image
  org.opencontainers.image.licenses: MIT
entrypoint:
  - dumb-init
  - --
  - /usr/local/bin/entrypoint.sh
cmd:
  - node
  - ./web/server.js
  - --keepAliveTimeout
  - "110000"
ports:
  - 3000/tcp
