# syntax=dhi.io/build:2-debian13

name: Open Cluster Management Work 1.x
image: dhi.io/open-cluster-management-work
variant: runtime
tags:
  - "1"
  - "1.4"
  - 1.4.0
  - 1-debian
  - 1-debian13
  - 1.4-debian
  - 1.4-debian13
  - 1.4.0-debian
  - 1.4.0-debian13
platforms:
  - linux/amd64
  - linux/arm64
dates:
  release: "2026-01-30"
vars:
  COMMIT_SHA: 45ecb6233fb316302a428d1d258e68a9cc2e7040
  SEMVER_MAJOR_MINOR_VERSION: "1.4"
  SEMVER_MAJOR_VERSION: "1"
  SEMVER_VERSION: 1.4.0
  VERSION: 1.4.0
contents:
  repositories:
    - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
  keyring:
    - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
  packages:
    - base-files
    - ca-certificates-bundle
    - tzdata
  builds:
    - name: open-cluster-management-work
      work-dir: /go/src/open-cluster-management.io/ocm
      caches:
        - path: /go/pkg/mod
      contents:
        packages:
          - bash
          - ca-certificates-bundle
          - coreutils
          - golang-1.26
          - findutils
          - mawk
          - sed
        files:
          - url: git+https://github.com/open-cluster-management-io/ocm.git#v1.4.0
            checksum: 45ecb6233fb316302a428d1d258e68a9cc2e7040
            path: /go/src/open-cluster-management.io/ocm
            spdx:
              name: open-cluster-management-work
              version: 1.4.0
              packages:
                - name: open-cluster-management-work
                  purl: pkg:golang/open-cluster-management.io/ocm@1.4.0
                  license: Apache-2.0
            uid: 0
            gid: 0
      pipeline:
        - name: bump go dependencies
          uses: go/bump@v2
          with:
            deps:
              - github.com/google/cel-go@v0.30.0
              - google.golang.org/grpc@v1.85.0-dev.0.20260825072537-93e31b48545e
            download: true
        - name: test
          runs: |
            set -eux -o pipefail

            go test -short $(go list ./pkg/work/... | grep -v -e /controllers -e /webhook -e /hub -e /spoke) -count=1 -v
        - name: build open-cluster-management-work
          uses: go/build@v1
          with:
            ldflags:
              - -X open-cluster-management.io/ocm/pkg/version.versionFromGit=v1.4.0
              - -X open-cluster-management.io/ocm/pkg/version.commitFromGit=45ecb6233fb316302a428d1d258e68a9cc2e7040
            output: ${target.dir}/usr/local/bin/open-cluster-management-work
            packages: ./cmd/work
      outputs:
        - source: ${target.dir}/usr/local/bin/open-cluster-management-work
          target: /usr/local/bin/open-cluster-management-work
          uid: 0
          gid: 0
        - source: /opt/docker/sbom/open-cluster-management-work
          target: /opt/docker/sbom/open-cluster-management-work
          uid: 0
          gid: 0
accounts:
  run-as: nonroot
  users:
    - name: nonroot
      uid: 65532
      gid: 65532
  groups:
    - name: nonroot
      gid: 65532
      members:
        - nonroot
os-release:
  name: Docker Hardened Images (Debian)
  id: debian
  version-id: "13"
  version-codename: trixie
  pretty-name: Docker Hardened Images/Debian GNU/Linux 13 (trixie)
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
paths:
  - type: symlink
    path: /work
    uid: 0
    gid: 0
    source: /usr/local/bin/open-cluster-management-work
annotations:
  org.opencontainers.image.description: A minimal Open Cluster Management Work image
  org.opencontainers.image.licenses: Apache-2.0
cmd:
  - /work
  - manager
