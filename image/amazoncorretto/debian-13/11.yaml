# syntax=dhi.io/build:2-debian13

name: Amazon Corretto 11.x
image: dhi.io/amazoncorretto
variant: runtime
tags:
  - "11"
  - "11.0"
  - 11.0.33
  - 11-debian
  - 11-debian13
  - 11.0-debian
  - 11.0.33.1.1
  - 11.0-debian13
  - 11.0.33-debian
  - 11.0.33-debian13
  - 11.0.33.1.1-debian
  - 11.0.33.1.1-debian13
platforms:
  - linux/amd64
  - linux/arm64
dates:
  release: "2019-02-18"
  end-of-life: "2032-01-31"
vars:
  ARCH: '#{ target.arch == "amd64" ? "x64" : "aarch64" }'
  BASE_VERSION: 11.0.33.1.1
  JAVA_DST_BASENAME: java-11-amazon-corretto
  JAVA_HOME: /usr/lib/jvm/java-11-amazon-corretto
  JAVA_JDK_DOWNLOAD: https://corretto.aws/downloads/resources/11.0.33.1.1/${JAVA_SRC_BASENAME}.tar.gz
  JAVA_JDK_SIG: https://corretto.aws/downloads/resources/11.0.33.1.1/${JAVA_SRC_BASENAME}.tar.gz.sig
  JAVA_MAJOR_MINOR_VERSION: "11.0"
  JAVA_MAJOR_VERSION: "11"
  JAVA_VERSION: 11.0.33
  JAVA_VERSION_SUFFIX: "1.1"
  VERSION: 11.0.33.1.1-0
contents:
  repositories:
    - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
  keyring:
    - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
  packages:
    - '!acl'
    - '!bzip2'
    - '!cdebconf'
    - '!debconf'
    - '!dpkg'
    - '!gcc-14'
    - '!gcc-14-base'
    - '!gcc-base'
    - '!install-info'
    - '!libacl1'
    - '!libdebian-installer'
    - '!libdebian-installer4'
    - '!libelogind0'
    - '!libgcc-s1'
    - '!libnewt0.52'
    - '!libpcre2-8-0'
    - '!libreadline8t64'
    - '!libslang2'
    - '!libssl3t64'
    - '!libtextwrap'
    - '!libtextwrap1'
    - '!libtinfo6'
    - '!mawk'
    - '!openssl'
    - '!openssl-provider-legacy'
    - '!original-awk'
    - '!pcre2'
    - '!readline-common'
    - '!tar'
    - amazoncorretto-11-jdk-oci-config=11.0.33.1.1-0
    - amazoncorretto-11-jdk=11.0.33.1.1-0
    - base-files
    - ca-certificates
    - libasound2t64
    - libc6
    - libgcc-s1
    - libstdc++6
    - locales
    - tzdata
  builds:
    - name: locale
      contents:
        packages:
          - bash
          - locales
          - coreutils
          - gzip
      pipeline:
        - name: install locales
          runs: |
            set -eux -o pipefail

            ln -s /etc/locale.alias /usr/share/locale/locale.alias

            echo "en_US.UTF-8 UTF-8" >> /etc/locale.gen
            locale-gen en_US.UTF-8
      outputs:
        - source: /usr/share/locale
          target: /usr/share/locale
          uid: 0
          gid: 0
        - source: /usr/lib/locale
          target: /usr/lib/locale
          uid: 0
          gid: 0
accounts:
  run-as: nonroot
  users:
    - name: nonroot
      uid: 65532
      gid: 65532
  groups:
    - name: nonroot
      gid: 65532
      members:
        - nonroot
os-release:
  name: Docker Hardened Images (Debian)
  id: debian
  version-id: "13"
  version-codename: trixie
  pretty-name: Docker Hardened Images/Debian GNU/Linux 13 (trixie)
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
environment:
  JAVA_HOME: /usr/lib/jvm/java-11-amazon-corretto
  LANG: en_US.UTF-8
  LANGUAGE: en_US:en
  LC_ALL: en_US.UTF-8
annotations:
  org.opencontainers.image.description: The full Amazon Corretto JDK image
  org.opencontainers.image.licenses: GPL-2.0-only WITH Classpath-exception-2.0
cmd:
  - java
  - -help
