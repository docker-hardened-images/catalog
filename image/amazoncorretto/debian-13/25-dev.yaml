# syntax=dhi.io/build:2-debian13

name: Amazon Corretto 25.x (dev)
image: dhi.io/amazoncorretto
variant: dev
tags:
  - 25-dev
  - 25.0-dev
  - 25.0.5-dev
  - 25-debian-dev
  - 25.0.5.1.2-dev
  - 25-debian13-dev
  - 25.0-debian-dev
  - 25.0-debian13-dev
  - 25.0.5-debian-dev
  - 25.0.5-debian13-dev
  - 25.0.5.1.2-debian-dev
  - 25.0.5.1.2-debian13-dev
platforms:
  - linux/amd64
  - linux/arm64
dates:
  release: "2025-09-16"
  end-of-life: "2032-10-31"
vars:
  ARCH: '#{ target.arch == "amd64" ? "x64" : "aarch64" }'
  BASE_VERSION: 25.0.5.1.2
  JAVA_DST_BASENAME: java-25-amazon-corretto
  JAVA_HOME: /usr/lib/jvm/java-25-amazon-corretto
  JAVA_JDK_DOWNLOAD: https://corretto.aws/downloads/resources/25.0.5.1.2/${JAVA_SRC_BASENAME}.tar.gz
  JAVA_JDK_SIG: https://corretto.aws/downloads/resources/25.0.5.1.2/${JAVA_SRC_BASENAME}.tar.gz.sig
  JAVA_MAJOR_MINOR_VERSION: "25.0"
  JAVA_MAJOR_VERSION: "25"
  JAVA_VERSION: 25.0.5
  JAVA_VERSION_SUFFIX: "1.2"
  VERSION: 25.0.5.1.2-0
contents:
  repositories:
    - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
  keyring:
    - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
  packages:
    - '!gawk'
    - '!libelogind0'
    - '!mawk'
    - '!original-awk'
    - amazoncorretto-25-jdk-oci-config=25.0.5.1.2-0
    - amazoncorretto-25-jdk=25.0.5.1.2-0
    - apt
    - base-files
    - bash
    - ca-certificates
    - coreutils
    - diffutils
    - dpkg
    - findutils
    - grep
    - libasound2t64
    - libc-bin
    - libc6
    - libgcc-s1
    - libstdc++6
    - locales
    - mawk
    - perl-base
    - sed
    - tzdata
    - util-linux
  builds:
    - name: locale
      contents:
        packages:
          - bash
          - locales
          - coreutils
          - gzip
      pipeline:
        - name: install locales
          runs: |
            set -eux -o pipefail

            ln -s /etc/locale.alias /usr/share/locale/locale.alias

            echo "en_US.UTF-8 UTF-8" >> /etc/locale.gen
            locale-gen en_US.UTF-8
      outputs:
        - source: /usr/share/locale
          target: /usr/share/locale
          uid: 0
          gid: 0
        - source: /usr/lib/locale
          target: /usr/lib/locale
          uid: 0
          gid: 0
accounts:
  root: true
  run-as: root
  users:
    - name: nonroot
      uid: 65532
      gid: 65532
    - name: _apt
      uid: 42
      gid: 65532
  groups:
    - name: nonroot
      gid: 65532
      members:
        - nonroot
os-release:
  name: Docker Hardened Images (Debian)
  id: debian
  version-id: "13"
  version-codename: trixie
  pretty-name: Docker Hardened Images/Debian GNU/Linux 13 (trixie)
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
environment:
  DEBIAN_FRONTEND: noninteractive
  JAVA_HOME: /usr/lib/jvm/java-25-amazon-corretto
  LANG: en_US.UTF-8
  LANGUAGE: en_US:en
  LC_ALL: en_US.UTF-8
annotations:
  org.opencontainers.image.description: The full Amazon Corretto JDK image
  org.opencontainers.image.licenses: GPL-2.0-only WITH Classpath-exception-2.0
cmd:
  - /bin/bash
