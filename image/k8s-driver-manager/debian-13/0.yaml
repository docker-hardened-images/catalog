# syntax=dhi.io/build:2-debian13

name: K8s Driver Manager 0.x
image: dhi.io/k8s-driver-manager
variant: runtime
tags:
  - "0"
  - "0.12"
  - 0.12.1
  - 0-debian
  - 0-debian13
  - 0.12-debian
  - 0.12-debian13
  - 0.12.1-debian
  - 0.12.1-debian13
platforms:
  - linux/amd64
  - linux/arm64
dates:
  release: "2021-08-05"
vars:
  FLAVORED_SUFFIX: ""
  SEMVER_MAJOR_MINOR_VERSION: "0.12"
  SEMVER_MAJOR_VERSION: "0"
  SEMVER_VERSION: 0.12.1
  SUFFIX: ""
  VERSION: 0.12.1-1
contents:
  repositories:
    - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
  keyring:
    - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
  packages:
    - base-files
    - ca-certificates-bundle
    - coreutils
    - dash
    - k8s-driver-manager=0.12.1-1
    - tzdata
    - vfio-manage=0.12.1-1
accounts:
  root: true
  run-as: root
  users:
    - name: nonroot
      uid: 65532
      gid: 65532
  groups:
    - name: nonroot
      gid: 65532
      members:
        - nonroot
os-release:
  name: Docker Hardened Images (Debian)
  id: debian
  version-id: "13"
  version-codename: trixie
  pretty-name: Docker Hardened Images/Debian GNU/Linux 13 (trixie)
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
annotations:
  org.opencontainers.image.description: A minimal K8s Driver Manager image
  org.opencontainers.image.licenses: Apache-2.0
entrypoint:
  - driver-manager
  - preflight_check
