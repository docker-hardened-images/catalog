metadata:
  display-name: K8s Driver Manager
  short-description: NVIDIA GPU Operator component that orchestrates NVIDIA GPU driver upgrades and unloads kernel modules on Kubernetes nodes
  featured: false
  home-url: https://github.com/NVIDIA/k8s-driver-manager
  categories:
    - machine-learning-and-ai
  included-tools:
    - name: driver-manager
      description: Orchestrates NVIDIA GPU driver upgrades - drains nodes, uninstalls the current driver, and runs preflight checks - as part of the GPU Operator's driver-upgrade flow.
    - name: vfio-manage
      description: Binds and unbinds GPUs to/from the VFIO driver for GPU passthrough (vGPU/virtualization) workloads.
