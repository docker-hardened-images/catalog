# syntax=dhi.io/build:2-debian13

name: Confluent Platform ZooKeeper 7.7.x
image: dhi.io/cp-zookeeper
variant: runtime
tags:
  - "7.7"
  - 7.7.12
  - 7.7-debian
  - 7.7-debian13
  - 7.7.12-debian
  - 7.7.12-debian13
platforms:
  - linux/amd64
  - linux/arm64
dates:
  release: "2024-07-19"
vars:
  COMMIT_SHA: 6e2d9b7e696318d7c5c0c89fb67d1cca13b876a7
  COMMON_DOCKER_COMMIT_SHA: aa2ef794c631f8f58a7228e62b0fe8fca89cf2a5
  COMMON_DOCKER_VERSION: 7.7.12
  DUB_VERSION: 0.0.172-20
  JAVA_FIPS_SUFFIX: ""
  JDK_MAJOR_VERSION: "21"
  SEMVER_MAJOR_MINOR_VERSION: "7.7"
  SEMVER_MAJOR_VERSION: "7"
  SEMVER_VERSION: 7.7.12
  VERSION: 7.7.12
  ZOOKEEPER_HOME: /usr/share/zookeeper
  ZOOKEEPER_VERSION: 3.8.8-1
contents:
  repositories:
    - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
  keyring:
    - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
  packages:
    - '!libelogind0'
    - '!mawk'
    - '!original-awk'
    - base-files
    - bash
    - ca-certificates-bundle
    - confluent-docker-utils=0.0.172-20
    - coreutils
    - eclipse-temurin-21-jre
    - eclipse-temurin-21-jre-oci-config
    - grep
    - hostname
    - python-3.13
    - sed
    - tzdata
    - zookeeper-3.8=3.8.8-1
  files:
    - url: https://raw.githubusercontent.com/confluentinc/kafka-images/6e2d9b7e696318d7c5c0c89fb67d1cca13b876a7/zookeeper/include/etc/confluent/docker/configure
      path: /etc/confluent/docker/configure
      spdx:
        name: kafka-images
        version: 7.7.12
        packages:
          - name: kafka-images
            purl: pkg:github/confluentinc/kafka-images@7.7.12
            license: Apache-2.0
      uid: 0
      gid: 0
      mode: "0755"
    - url: https://raw.githubusercontent.com/confluentinc/kafka-images/6e2d9b7e696318d7c5c0c89fb67d1cca13b876a7/zookeeper/include/etc/confluent/docker/ensure
      path: /etc/confluent/docker/ensure
      uid: 0
      gid: 0
      mode: "0755"
    - url: https://raw.githubusercontent.com/confluentinc/kafka-images/6e2d9b7e696318d7c5c0c89fb67d1cca13b876a7/zookeeper/include/etc/confluent/docker/launch
      path: /etc/confluent/docker/launch
      uid: 0
      gid: 0
      mode: "0755"
    - url: https://raw.githubusercontent.com/confluentinc/kafka-images/6e2d9b7e696318d7c5c0c89fb67d1cca13b876a7/zookeeper/include/etc/confluent/docker/run
      path: /etc/confluent/docker/run
      uid: 0
      gid: 0
      mode: "0755"
    - url: https://raw.githubusercontent.com/confluentinc/kafka-images/6e2d9b7e696318d7c5c0c89fb67d1cca13b876a7/zookeeper/include/etc/confluent/docker/log4j.properties.template
      path: /etc/confluent/docker/log4j.properties.template
      uid: 0
      gid: 0
      mode: "0644"
    - url: https://raw.githubusercontent.com/confluentinc/kafka-images/6e2d9b7e696318d7c5c0c89fb67d1cca13b876a7/zookeeper/include/etc/confluent/docker/myid.template
      path: /etc/confluent/docker/myid.template
      uid: 0
      gid: 0
      mode: "0644"
    - url: https://raw.githubusercontent.com/confluentinc/kafka-images/6e2d9b7e696318d7c5c0c89fb67d1cca13b876a7/zookeeper/include/etc/confluent/docker/tools-log4j.properties.template
      path: /etc/confluent/docker/tools-log4j.properties.template
      uid: 0
      gid: 0
      mode: "0644"
    - url: https://raw.githubusercontent.com/confluentinc/kafka-images/6e2d9b7e696318d7c5c0c89fb67d1cca13b876a7/zookeeper/include/etc/confluent/docker/zookeeper.properties.template
      path: /etc/confluent/docker/zookeeper.properties.template
      uid: 0
      gid: 0
      mode: "0644"
    - url: https://raw.githubusercontent.com/confluentinc/common-docker/aa2ef794c631f8f58a7228e62b0fe8fca89cf2a5/base/include/etc/confluent/docker/bash-config
      path: /etc/confluent/docker/bash-config
      spdx:
        name: common-docker
        version: 7.7.12
        packages:
          - name: common-docker
            purl: pkg:github/confluentinc/common-docker@7.7.12
            license: Apache-2.0
      uid: 0
      gid: 0
      mode: "0644"
  builds:
    - name: kafka-images launch inventory
      contents:
        packages:
          - bash
          - ca-certificates
          - coreutils
          - git
      pipeline:
        - name: compare upstream directory to declarative list
          privileged: true
          runs: |
            set -eux -o pipefail

            git -c init.defaultBranch=master init /tmp/kafka-images
            git -C /tmp/kafka-images remote add origin https://github.com/confluentinc/kafka-images.git
            git -C /tmp/kafka-images fetch --depth 1 origin "6e2d9b7e696318d7c5c0c89fb67d1cca13b876a7"
            git -c advice.detachedHead=false -C /tmp/kafka-images checkout --detach FETCH_HEAD
            test "$(git -C /tmp/kafka-images rev-parse HEAD)" = "6e2d9b7e696318d7c5c0c89fb67d1cca13b876a7"

            actual="$(ls -1A /tmp/kafka-images/zookeeper/include/etc/confluent/docker | LC_ALL=C sort)"
            expected="$(printf '%s\n' \
              configure \
              ensure \
              launch \
              log4j.properties.template \
              myid.template \
              run \
              tools-log4j.properties.template \
              zookeeper.properties.template \
              | LC_ALL=C sort)"
            if [ "$actual" != "$expected" ]; then
              printf '%s\n' "FATAL: kafka-images zookeeper launch directory at 6e2d9b7e696318d7c5c0c89fb67d1cca13b876a7 does not match the declarative contents.files list" >&2
              printf '%s\n' "upstream:" "$actual" "declared:" "$expected" >&2
              exit 1
            fi

            touch /tmp/kafka-images-launch-inventory
      outputs:
        - source: /tmp/kafka-images-launch-inventory
          target: /etc/confluent/docker/.launch-inventory
          uid: 0
          gid: 0
    - name: locale
      contents:
        packages:
          - bash
          - locales
          - coreutils
          - gzip
      pipeline:
        - name: install locales
          runs: |
            set -eux -o pipefail

            ln -s /etc/locale.alias /usr/share/locale/locale.alias

            echo "en_US.UTF-8 UTF-8" >> /etc/locale.gen
            locale-gen en_US.UTF-8
      outputs:
        - source: /usr/share/locale
          target: /usr/share/locale
          uid: 0
          gid: 0
        - source: /usr/lib/locale
          target: /usr/lib/locale
          uid: 0
          gid: 0
accounts:
  run-as: appuser
  users:
    - name: appuser
      uid: 1000
      gid: 1000
  groups:
    - name: appuser
      gid: 1000
      members:
        - appuser
os-release:
  name: Docker Hardened Images (Debian)
  id: debian
  version-id: "13"
  version-codename: trixie
  pretty-name: Docker Hardened Images/Debian GNU/Linux 13 (trixie)
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
work-dir: /home/appuser
environment:
