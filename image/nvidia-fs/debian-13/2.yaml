# syntax=dhi.io/build:2-debian13

name: NVIDIA GPUDirect Storage Driver 2.x
image: dhi.io/nvidia-fs
variant: runtime
tags:
  - "2"
  - "2.31"
  - 2.31.5
  - 2-debian
  - 2-debian13
  - 2.31-debian
  - 2.31-debian13
  - 2.31.5-debian
  - v2.31.5-rhel9
  - v2.31.5-rhel10
  - 2.31.5-debian13
  - v2.31.5-rhel9.6
  - v2.31.5-rhel9.7
  - v2.31.5-rhel9.8
  - v2.31.5-rhcos4.14
  - v2.31.5-rhcos4.15
  - v2.31.5-rhcos4.16
  - v2.31.5-rhcos4.17
  - v2.31.5-rhcos4.18
  - v2.31.5-ubuntu22.04
  - v2.31.5-ubuntu24.04
  - v2.31.5-ubuntu26.04
platforms:
  - linux/amd64
  - linux/arm64
dates:
  release: "2020-12-03"
vars:
  BINUTILS_ARCH: '#{ target.arch == "amd64" ? "x86-64" : "aarch64" }'
  SEMVER_MAJOR_MINOR_VERSION: "2.31"
  SEMVER_MAJOR_VERSION: "2"
  SEMVER_VERSION: 2.31.5
  VERSION: 2.31.5-0
contents:
  repositories:
    - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
  keyring:
    - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
  packages:
    - '!binutils'
    - '!binutils-aarch64-linux-gnu'
    - '!binutils-common'
    - '!binutils-x86-64-linux-gnu'
    - '!libbinutils'
    - '!libctf-nobfd0'
    - '!libctf0'
    - '!libelogind0'
    - '!libgprofng0'
    - '!libsframe1'
    - '!mawk'
    - '!original-awk'
    - base-files
    - bash
    - binutils-latest
    - binutils-latest-${BINUTILS_ARCH}-linux-gnu
    - ca-certificates-bundle
    - coreutils
    - findutils
    - gcc
    - gcc-13
    - grep
    - kmod
    - libctf0-latest
    - libdw1t64
    - libelf1t64
    - make
    - mawk
    - nvidia-fs-dkms-2=2.31.5-0
    - sed
    - tzdata
    - xz-utils
    - zstd
accounts:
  root: true
  run-as: root
  users:
    - name: nonroot
      uid: 65532
      gid: 65532
  groups:
    - name: nonroot
      gid: 65532
      members:
        - nonroot
os-release:
  name: Docker Hardened Images (Debian)
  id: debian
  version-id: "13"
  version-codename: trixie
  pretty-name: Docker Hardened Images/Debian GNU/Linux 13 (trixie)
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
environment:
  GDS_VERSION: 2.31.5
paths:
  - type: directory
    path: /usr/local/bin
    uid: 0
    gid: 0
    mode: "0755"
  - type: file
    path: /usr/local/bin/nvidia-gds-driver
    uid: 0
    gid: 0
    mode: "0755"
    source: image/nvidia-fs/bin/nvidia-gds-driver
  - type: symlink
    path: /usr/local/bin/ocp_dtk_entrypoint
    uid: 0
    gid: 0
    source: nvidia-gds-driver
annotations:
  org.opencontainers.image.description: A minimal NVIDIA GPUDirect Storage Driver image
  org.opencontainers.image.licenses: MIT AND GPL-2.0-only AND Apache-2.0
entrypoint:
  - /usr/local/bin/nvidia-gds-driver
  - install
