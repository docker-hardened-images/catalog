# syntax=dhi.io/build:2-debian13

name: NVIDIA GPUDirect Storage Driver 2.x (dev)
image: dhi.io/nvidia-fs
variant: dev
tags:
  - 2-dev
  - 2.31-dev
  - 2.31.5-dev
  - 2-debian-dev
  - 2-debian13-dev
  - 2.31-debian-dev
  - 2.31-debian13-dev
  - 2.31.5-debian-dev
  - 2.31.5-debian13-dev
platforms:
  - linux/amd64
  - linux/arm64
dates:
  release: "2020-12-03"
vars:
  BINUTILS_ARCH: '#{ target.arch == "amd64" ? "x86-64" : "aarch64" }'
  SEMVER_MAJOR_MINOR_VERSION: "2.31"
  SEMVER_MAJOR_VERSION: "2"
  SEMVER_VERSION: 2.31.5
  VERSION: 2.31.5-0
contents:
  repositories:
    - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
  keyring:
    - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
  packages:
    - '!binutils'
    - '!binutils-aarch64-linux-gnu'
    - '!binutils-common'
    - '!binutils-x86-64-linux-gnu'
    - '!gawk'
    - '!libbinutils'
    - '!libctf-nobfd0'
    - '!libctf0'
    - '!libelogind0'
    - '!libgprofng0'
    - '!libsframe1'
    - '!mawk'
    - '!original-awk'
    - apt
    - base-files
    - bash
    - binutils-latest
    - binutils-latest-${BINUTILS_ARCH}-linux-gnu
    - ca-certificates
    - ca-certificates-bundle
    - coreutils
    - diffutils
    - dpkg
    - findutils
    - gcc
    - gcc-13
    - grep
    - kmod
    - libc-bin
    - libctf0-latest
    - libdw1t64
    - libelf1t64
    - make
    - mawk
    - nvidia-fs-dkms-2=2.31.5-0
    - perl-base
    - sed
    - tzdata
    - util-linux
    - xz-utils
    - zstd
accounts:
  root: true
  run-as: root
  users:
    - name: nonroot
      uid: 65532
      gid: 65532
    - name: _apt
      uid: 42
      gid: 65532
  groups:
    - name: nonroot
      gid: 65532
      members:
        - nonroot
os-release:
  name: Docker Hardened Images (Debian)
  id: debian
  version-id: "13"
  version-codename: trixie
  pretty-name: Docker Hardened Images/Debian GNU/Linux 13 (trixie)
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
environment:
  DEBIAN_FRONTEND: noninteractive
  GDS_VERSION: 2.31.5
paths:
  - type: directory
    path: /usr/local/bin
    uid: 0
    gid: 0
    mode: "0755"
  - type: file
    path: /usr/local/bin/nvidia-gds-driver
    uid: 0
    gid: 0
    mode: "0755"
    source: image/nvidia-fs/bin/nvidia-gds-driver
  - type: symlink
    path: /usr/local/bin/ocp_dtk_entrypoint
    uid: 0
    gid: 0
    source: nvidia-gds-driver
annotations:
  org.opencontainers.image.description: A minimal NVIDIA GPUDirect Storage Driver image
  org.opencontainers.image.licenses: MIT AND GPL-2.0-only AND Apache-2.0
entrypoint:
  - /usr/local/bin/nvidia-gds-driver
  - install
