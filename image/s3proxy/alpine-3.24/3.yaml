# syntax=dhi.io/build:2-alpine3.24

name: S3Proxy 3.x
image: dhi.io/s3proxy
variant: runtime
tags:
  - 3-alpine
  - 3.3-alpine
  - 3-alpine3.24
  - 3.3.0-alpine
  - 3.3-alpine3.24
  - 3.3.0-alpine3.24
platforms:
  - linux/amd64
  - linux/arm64
dates:
  release: "2026-01-06"
vars:
  SEMVER_MAJOR_MINOR_VERSION: "3.3"
  SEMVER_MAJOR_VERSION: "3"
  SEMVER_VERSION: 3.3.0
  VERSION: 3.3.0-r1
contents:
  repositories:
    - https://dhi.io/apk/alpine/v3.24/main
    - https://dl-cdn.alpinelinux.org/alpine/v3.24/main
    - https://dl-cdn.alpinelinux.org/alpine/v3.24/community
  keyring:
    - https://dhi.io/keyring/dhi-apk@docker-0F81AD7700D99184.rsa.pub
  packages:
    - alpine-baselayout-data
    - busybox
    - ca-certificates-bundle
    - dumb-init
    - eclipse-temurin-21-jre
    - eclipse-temurin-21-jre-oci-config
    - s3proxy=3.3.0-r1
    - tzdata
accounts:
  run-as: nonroot
  users:
    - name: nonroot
      uid: 65532
      gid: 65532
  groups:
    - name: nonroot
      gid: 65532
      members:
        - nonroot
os-release:
  name: Docker Hardened Images (Alpine)
  id: alpine
  version-id: "3.24"
  pretty-name: Docker Hardened Images/Alpine Linux v3.24
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
work-dir: /opt/s3proxy
environment:
  JCLOUDS_CREDENTIAL: remote-credential
  JCLOUDS_FILESYSTEM_BASEDIR: /data
  JCLOUDS_IDENTITY: remote-identity
  JCLOUDS_PROVIDER: filesystem-nio2
  JCLOUDS_REGIONS: us-east-1
  LANG: C.UTF-8
  LOG_LEVEL: info
  S3PROXY_AUTHORIZATION: aws-v2-or-v4
  S3PROXY_CORS_ALLOW_ALL: "false"
  S3PROXY_CREDENTIAL: local-credential
  S3PROXY_ENDPOINT: http://0.0.0.0:8080
  S3PROXY_IDENTITY: local-identity
  S3PROXY_IGNORE_UNKNOWN_HEADERS: "false"
  S3PROXY_KEYSTORE_PASSWORD: password
  S3PROXY_KEYSTORE_PATH: keystore.jks
  S3PROXY_METRICS_ENABLED: "false"
  S3PROXY_METRICS_HOST: 0.0.0.0
  S3PROXY_METRICS_PORT: "9090"
  S3PROXY_READ_ONLY_BLOBSTORE: "false"
  S3PROXY_V4_MAX_CHUNK_SIZE: "16777216"
paths:
  - type: directory
    path: /data
    uid: 65532
    gid: 65532
    mode: "0770"
  - type: directory
    path: /opt/s3proxy
    uid: 65532
    gid: 65532
    mode: "0755"
  - type: symlink
    path: /opt/s3proxy/run-docker-container.sh
    uid: 0
    gid: 0
    source: /usr/bin/s3proxy
annotations:
  org.opencontainers.image.description: A minimal S3Proxy image
  org.opencontainers.image.licenses: Apache-2.0
entrypoint:
  - dumb-init
  - --
cmd:
  - /opt/s3proxy/run-docker-container.sh
ports:
  - 8080/tcp
