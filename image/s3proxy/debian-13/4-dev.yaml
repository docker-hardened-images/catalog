# syntax=dhi.io/build:2-debian13

name: S3Proxy 4.x (dev)
image: dhi.io/s3proxy
variant: dev
tags:
  - 4-dev
  - 4.0-dev
  - 4.0.0-dev
  - 4-debian-dev
  - 4-debian13-dev
  - 4.0-debian-dev
  - 4.0-debian13-dev
  - 4.0.0-debian-dev
  - 4.0.0-debian13-dev
platforms:
  - linux/amd64
  - linux/arm64
dates:
  release: "2026-08-04"
vars:
  SEMVER_MAJOR_MINOR_VERSION: "4.0"
  SEMVER_MAJOR_VERSION: "4"
  SEMVER_VERSION: 4.0.0
  VERSION: 4.0.0-2
contents:
  repositories:
    - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
  keyring:
    - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
  packages:
    - '!gawk'
    - '!libelogind0'
    - '!mawk'
    - '!original-awk'
    - apt
    - base-files
    - bash
    - ca-certificates
    - ca-certificates-bundle
    - coreutils
    - dash
    - diffutils
    - dpkg
    - dumb-init
    - eclipse-temurin-25-jre
    - eclipse-temurin-25-jre-oci-config
    - findutils
    - grep
    - libc-bin
    - mawk
    - perl-base
    - s3proxy=4.0.0-2
    - sed
    - tzdata
    - util-linux
  builds:
    - name: locale
      contents:
        packages:
          - bash
          - locales
          - coreutils
          - gzip
      pipeline:
        - name: install locales
          runs: |
            set -eux -o pipefail

            ln -s /etc/locale.alias /usr/share/locale/locale.alias

            echo "en_US.UTF-8 UTF-8" >> /etc/locale.gen
            locale-gen en_US.UTF-8
      outputs:
        - source: /usr/share/locale
          target: /usr/share/locale
          uid: 0
          gid: 0
        - source: /usr/lib/locale
          target: /usr/lib/locale
          uid: 0
          gid: 0
accounts:
  root: true
  run-as: root
  users:
    - name: nonroot
      uid: 65532
      gid: 65532
    - name: _apt
      uid: 42
      gid: 65532
  groups:
    - name: nonroot
      gid: 65532
      members:
        - nonroot
os-release:
  name: Docker Hardened Images (Debian)
  id: debian
  version-id: "13"
  version-codename: trixie
  pretty-name: Docker Hardened Images/Debian GNU/Linux 13 (trixie)
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
work-dir: /opt/s3proxy
environment:
  DEBIAN_FRONTEND: noninteractive
  JCLOUDS_CREDENTIAL: remote-credential
  JCLOUDS_FILESYSTEM_BASEDIR: /data
  JCLOUDS_IDENTITY: remote-identity
  JCLOUDS_PROVIDER: filesystem-nio2
  JCLOUDS_REGIONS: us-east-1
  LANG: en_US.UTF-8
  LANGUAGE: en_US:en
  LC_ALL: en_US.UTF-8
  LOG_LEVEL: info
  S3PROXY_AUTHORIZATION: aws-v2-or-v4
  S3PROXY_CORS_ALLOW_ALL: "false"
  S3PROXY_CREDENTIAL: local-credential
  S3PROXY_ENDPOINT: http://0.0.0.0:8080
  S3PROXY_IDENTITY: local-identity
  S3PROXY_IGNORE_UNKNOWN_HEADERS: "false"
  S3PROXY_KEYSTORE_PASSWORD: password
  S3PROXY_KEYSTORE_PATH: keystore.jks
  S3PROXY_METRICS_ENABLED: "false"
  S3PROXY_METRICS_HOST: 0.0.0.0
  S3PROXY_METRICS_PORT: "9090"
  S3PROXY_READ_ONLY_BLOBSTORE: "false"
  S3PROXY_V4_MAX_CHUNK_SIZE: "16777216"
paths:
  - type: directory
    path: /data
    uid: 65532
    gid: 65532
    mode: "0770"
  - type: directory
    path: /opt/s3proxy
    uid: 65532
    gid: 65532
    mode: "0755"
  - type: symlink
    path: /opt/s3proxy/run-docker-container.sh
    uid: 0
    gid: 0
    source: /usr/bin/s3proxy
annotations:
  org.opencontainers.image.description: A minimal S3Proxy image
  org.opencontainers.image.licenses: Apache-2.0
entrypoint:
  - dumb-init
  - --
cmd:
  - /opt/s3proxy/run-docker-container.sh
ports:
  - 8080/tcp
