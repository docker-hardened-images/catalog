# syntax=dhi.io/build:2-debian13

name: Prometheus NATS Exporter 0.20.x
image: dhi.io/prometheus-nats-exporter
variant: runtime
tags:
  - "0"
  - "0.20"
  - 0.20.1
  - 0-debian
  - 0-debian13
  - 0.20-debian
  - 0.20-debian13
  - 0.20.1-debian
  - 0.20.1-debian13
platforms:
  - linux/amd64
  - linux/arm64
dates:
  release: "2025-11-21"
vars:
  FLAVORED_SUFFIX: ""
  SEMVER_MAJOR_MINOR_VERSION: "0.20"
  SEMVER_MAJOR_VERSION: "0"
  SEMVER_VERSION: 0.20.1
  SUFFIX: ""
  VERSION: 0.20.1-0
contents:
  repositories:
    - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
  keyring:
    - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
  packages:
    - base-files
    - ca-certificates-bundle
    - prometheus-nats-exporter=0.20.1-0
    - tzdata
accounts:
  run-as: nonroot
  users:
    - name: nonroot
      uid: 65532
      gid: 65532
  groups:
    - name: nonroot
      gid: 65532
      members:
        - nonroot
os-release:
  name: Docker Hardened Images (Debian)
  id: debian
  version-id: "13"
  version-codename: trixie
  pretty-name: Docker Hardened Images/Debian GNU/Linux 13 (trixie)
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
paths:
  - type: directory
    path: /usr/local/bin
    uid: 0
    gid: 0
  - type: symlink
    path: /usr/local/bin/prometheus-nats-exporter
    uid: 0
    gid: 0
    source: /usr/bin/prometheus-nats-exporter
annotations:
  org.opencontainers.image.description: A minimal Prometheus NATS Exporter image
  org.opencontainers.image.licenses: Apache-2.0
entrypoint:
  - /usr/local/bin/prometheus-nats-exporter
ports:
  - 7777/tcp
