# syntax=dhi.io/build:2-debian13

name: OpenSearch 3.x (dev)
image: dhi.io/opensearch
variant: dev
tags:
  - 3-dev
  - 3.8-dev
  - 3.8.0-dev
  - 3-debian-dev
  - 3-debian13-dev
  - 3.8-debian-dev
  - 3.8-debian13-dev
  - 3.8.0-debian-dev
  - 3.8.0-debian13-dev
platforms:
  - linux/amd64
  - linux/arm64
dates:
  release: "2025-05-06"
vars:
  BCFIPS_VERSION: 2.1.2
  BCPKIXFIPS_VERSION: 2.1.11
  BCRNGJENT_VERSION: 1.3.6
  BCTLSFIPS_VERSION: 2.1.23
  BCUTILFIPS_VERSION: 2.1.6
  GOSU_REFERENCE: dhi/pkg-gosu:1.19-debian13@sha256:c8d3f464708426e928beabdf198ddcbea1bfdcc305c58f3707dfb9e4aac9e590
  JAVA_FIPS_SUFFIX: ""
  JAVA_VARIANT: jdk
  JDK_MAJOR_VERSION: "21"
  SEMVER_MAJOR_MINOR_VERSION: "3.8"
  SEMVER_MAJOR_VERSION: "3"
  SEMVER_VERSION: 3.8.0
  VERSION: 3.8.0-3
contents:
  repositories:
    - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
  keyring:
    - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
  packages:
    - '!gawk'
    - '!libelogind0'
    - '!mawk'
    - '!original-awk'
    - apt
    - base-files
    - bash
    - ca-certificates
    - ca-certificates-bundle
    - coreutils
    - diffutils
    - dpkg
    - eclipse-temurin-21-jdk
    - eclipse-temurin-21-jdk-oci-config
    - findutils
    - grep
    - libc-bin
    - libstdc++6
    - mawk
    - opensearch=3.8.0-3
    - perl-base
    - sed
    - tzdata
    - util-linux
  builds:
    - name: locale
      contents:
        packages:
          - bash
          - locales
          - coreutils
          - gzip
      pipeline:
        - name: install locales
          runs: |
            set -eux -o pipefail

            ln -s /etc/locale.alias /usr/share/locale/locale.alias

            echo "en_US.UTF-8 UTF-8" >> /etc/locale.gen
            locale-gen en_US.UTF-8
      outputs:
        - source: /usr/share/locale
          target: /usr/share/locale
          uid: 0
          gid: 0
        - source: /usr/lib/locale
          target: /usr/lib/locale
          uid: 0
          gid: 0
    - name: opensearch package ownership
      contents:
        repositories:
          - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
        keyring:
          - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
        packages:
          - bash
          - coreutils
          - opensearch=3.8.0-3
      pipeline:
        - name: set opensearch ownership
          runs: |
            set -eux -o pipefail

            chown -R 1000:1000 /usr/share/opensearch
      outputs:
        - source: /usr/share/opensearch
          target: /usr/share/opensearch
          uid: 0
          gid: 0
    - name: patch dev entrypoint
      contents:
        repositories:
          - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
        keyring:
          - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
        packages:
          - bash
          - coreutils
          - patch
          - opensearch=3.8.0-3
      pipeline:
        - name: patch dev entrypoint to drop root
          runs: |
            set -eux -o pipefail

            workdir="$(mktemp -d)"
            trap 'rm -rf "${workdir}"' EXIT
            mkdir -p "${workdir}/docker/release/config/opensearch"
            cp /usr/share/opensearch/bin/docker-entrypoint.sh \
              "${workdir}/docker/release/config/opensearch/opensearch-docker-entrypoint-3.x.sh"
            patch -d "${workdir}" -p1 < /src/patch/dev-entrypoint.patch
            install -D -m 0755 \
              "${workdir}/docker/release/config/opensearch/opensearch-docker-entrypoint-3.x.sh" \
              /usr/share/opensearch/bin/docker-entrypoint.sh
      paths:
        - type: file
          path: /src/patch/dev-entrypoint.patch
          uid: 0
          gid: 0
          mode: "0444"
          source: image/opensearch/patch/dev-entrypoint.patch
      outputs:
        - source: /usr/share/opensearch/bin/docker-entrypoint.sh
          target: /usr/share/opensearch/bin/docker-entrypoint.sh
          uid: 0
          gid: 0
  artifacts:
    - name: dhi.io/pkg-gosu:1.19-debian13@sha256:c8d3f464708426e928beabdf198ddcbea1bfdcc305c58f3707dfb9e4aac9e590
      includes:
        - opt/docker/sbom/gosu
        - usr/local/sbin/gosu
      uid: 0
      gid: 0
accounts:
  root: true
  run-as: root
  users:
    - name: opensearch
      uid: 1000
      gid: 1000
    - name: _apt
      uid: 42
      gid: 65532
  groups:
    - name: opensearch
      gid: 1000
      members:
        - opensearch
os-release:
  name: Docker Hardened Images (Debian)
  id: debian
  version-id: "13"
  version-codename: trixie
  pretty-name: Docker Hardened Images/Debian GNU/Linux 13 (trixie)
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
work-dir: /usr/share/opensearch
environment:
  DEBIAN_FRONTEND: noninteractive
  HOME: /usr/share/opensearch
  JAVA_HOME: /usr/lib/jvm/temurin-21
  LANG: en_US.UTF-8
  LANGUAGE: en_US:en
  LC_ALL: en_US.UTF-8
  OPENSEARCH_FIPS_MODE: "false"
  OPENSEARCH_HOME: /usr/share/opensearch
  OPENSEARCH_PATH_CONF: /usr/share/opensearch/config
  PATH: /usr/share/opensearch/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
paths:
  - type: directory
    path: /usr/local/bin
    uid: 0
    gid: 0
  - type: symlink
    path: /usr/local/bin/docker-entrypoint.sh
    uid: 0
    gid: 0
    source: /usr/share/opensearch/bin/docker-entrypoint.sh
  - type: directory
    path: /usr/share/opensearch/data
    uid: 1000
    gid: 1000
    mode: "0755"
  - type: directory
    path: /usr/share/opensearch/logs
    uid: 1000
    gid: 1000
    mode: "0755"
annotations:
  org.opencontainers.image.description: A minimal OpenSearch image
  org.opencontainers.image.licenses: Apache-2.0
entrypoint:
  - /usr/local/bin/docker-entrypoint.sh
cmd:
  - opensearch
ports:
  - 9200/tcp
  - 9300/tcp
  - 9600/tcp
  - 9650/tcp
