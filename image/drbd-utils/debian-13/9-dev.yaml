# syntax=dhi.io/build:2-debian13

name: drbd-utils 9.x (dev)
image: dhi.io/drbd-utils
variant: dev
tags:
  - 9-dev
  - 9.34-dev
  - 9.34.0-dev
  - 9-debian-dev
  - 9-debian13-dev
  - 9.34-debian-dev
  - 9.34-debian13-dev
  - 9.34.0-debian-dev
  - 9.34.0-debian13-dev
platforms:
  - linux/amd64
  - linux/arm64
vars:
  SEMVER_MAJOR_MINOR_VERSION: "9.34"
  SEMVER_MAJOR_VERSION: "9"
  SEMVER_VERSION: 9.34.0
  VERSION: 9.34.0-3
contents:
  repositories:
    - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
  keyring:
    - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
  packages:
    - '!gawk'
    - '!libelogind0'
    - '!mawk'
    - '!original-awk'
    - apt
    - base-files
    - bash
    - ca-certificates
    - ca-certificates-bundle
    - coreutils
    - diffutils
    - dpkg
    - drbd-utils=9.34.0-3
    - findutils
    - grep
    - libc-bin
    - libkeyutils1
    - libssl3t64
    - libstdc++6
    - mawk
    - mount
    - perl-base
    - sed
    - tzdata
    - util-linux
accounts:
  root: true
  run-as: root
  users:
    - name: nonroot
      uid: 65532
      gid: 65532
    - name: _apt
      uid: 42
      gid: 65532
  groups:
    - name: nonroot
      gid: 65532
      members:
        - nonroot
os-release:
  name: Docker Hardened Images (Debian)
  id: debian
  version-id: "13"
  version-codename: trixie
  pretty-name: Docker Hardened Images/Debian GNU/Linux 13 (trixie)
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
environment:
  DEBIAN_FRONTEND: noninteractive
  DRBD_UTILS_VERSION: 9.34.0-3
paths:
  - type: directory
    path: /etc/drbd.d
    uid: 0
    gid: 0
    mode: "0755"
  - type: directory
    path: /usr/lib/drbd
    uid: 0
    gid: 0
    mode: "0755"
annotations:
  org.opencontainers.image.description: A minimal drbd-utils image
  org.opencontainers.image.licenses: GPL-2.0
