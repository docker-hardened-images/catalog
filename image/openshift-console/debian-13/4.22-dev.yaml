# syntax=dhi.io/build:2-debian13

name: Console for Red Hat OpenShift 4.x (dev)
image: dhi.io/openshift-console
variant: dev
tags:
  - 4-dev
  - 4.22-dev
  - 4.22.10-dev
  - 4-debian-dev
  - 4-debian13-dev
  - 4.22-debian-dev
  - 4.22-debian13-dev
  - 4.22.10-debian-dev
  - 4.22.10-debian13-dev
platforms:
  - linux/amd64
  - linux/arm64
dates:
  release: "2026-06-09"
vars:
  FLAVORED_SUFFIX: -dev
  SEMVER_MAJOR_MINOR_VERSION: "4.22"
  SEMVER_MAJOR_VERSION: "4"
  SEMVER_VERSION: 4.22.10
  SUFFIX: -dev
  VERSION: 4.22.10-2
contents:
  repositories:
    - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
  keyring:
    - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
  packages:
    - '!gawk'
    - '!libelogind0'
    - '!original-awk'
    - apt
    - base-files
    - bash
    - ca-certificates-bundle
    - coreutils
    - diffutils
    - dpkg
    - findutils
    - grep
    - libc-bin
    - mawk
    - openshift-console-dev=4.22.10-2
    - perl-base
    - sed
    - tzdata
    - util-linux
accounts:
  root: true
  run-as: root
  users:
    - name: nonroot
      uid: 65532
      gid: 65532
    - name: _apt
      uid: 42
      gid: 65532
  groups:
    - name: nonroot
      gid: 65532
      members:
        - nonroot
os-release:
  name: Docker Hardened Images (Debian)
  id: debian
  version-id: "13"
  version-codename: trixie
  pretty-name: Docker Hardened Images/Debian GNU/Linux 13 (trixie)
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
work-dir: /
environment:
  DEBIAN_FRONTEND: noninteractive
paths:
  - type: directory
    path: /opt
    uid: 0
    gid: 0
  - type: directory
    path: /opt/bridge
    uid: 0
    gid: 0
  - type: directory
    path: /usr/local/bin
    uid: 0
    gid: 0
  - type: symlink
    path: /opt/bridge/bin
    uid: 0
    gid: 0
    source: /usr/lib/openshift-console/bin
  - type: symlink
    path: /opt/bridge/static
    uid: 0
    gid: 0
    source: /usr/share/openshift-console/static
  - type: directory
    path: /pkg
    uid: 0
    gid: 0
  - type: symlink
    path: /pkg/graphql
    uid: 0
    gid: 0
    source: /usr/share/openshift-console/graphql
  - type: symlink
    path: /usr/local/bin/openshift-console
    uid: 0
    gid: 0
    source: /opt/bridge/bin/bridge
annotations:
  org.opencontainers.image.description: A minimal Red Hat OpenShift Console image
  org.opencontainers.image.licenses: Apache-2.0
cmd:
  - /usr/local/bin/openshift-console
  - --public-dir=/opt/bridge/static
ports:
  - "8443"
  - "9000"
