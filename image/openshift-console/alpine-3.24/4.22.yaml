# syntax=dhi.io/build:2-alpine3.24

name: Console for Red Hat OpenShift 4.x
image: dhi.io/openshift-console
variant: runtime
tags:
  - 4-alpine
  - 4.22-alpine
  - 4-alpine3.24
  - 4.22.10-alpine
  - 4.22-alpine3.24
  - 4.22.10-alpine3.24
platforms:
  - linux/amd64
  - linux/arm64
dates:
  release: "2026-06-09"
vars:
  FLAVORED_SUFFIX: ""
  SEMVER_MAJOR_MINOR_VERSION: "4.22"
  SEMVER_MAJOR_VERSION: "4"
  SEMVER_VERSION: 4.22.10
  SUFFIX: ""
  VERSION: 4.22.10-r2
contents:
  repositories:
    - https://dhi.io/apk/alpine/v3.24/main
    - https://dl-cdn.alpinelinux.org/alpine/v3.24/main
    - https://dl-cdn.alpinelinux.org/alpine/v3.24/community
  keyring:
    - https://dhi.io/keyring/dhi-apk@docker-0F81AD7700D99184.rsa.pub
  packages:
    - ca-certificates-bundle
    - openshift-console=4.22.10-r2
    - tzdata
accounts:
  run-as: nonroot
  users:
    - name: nonroot
      uid: 65532
      gid: 65532
  groups:
    - name: nonroot
      gid: 65532
      members:
        - nonroot
os-release:
  name: Docker Hardened Images (Alpine)
  id: alpine
  version-id: "3.24"
  pretty-name: Docker Hardened Images/Alpine Linux v3.24
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
work-dir: /
paths:
  - type: directory
    path: /opt
    uid: 0
    gid: 0
  - type: directory
    path: /opt/bridge
    uid: 0
    gid: 0
  - type: directory
    path: /usr/local/bin
    uid: 0
    gid: 0
  - type: symlink
    path: /opt/bridge/bin
    uid: 0
    gid: 0
    source: /usr/lib/openshift-console/bin
  - type: symlink
    path: /opt/bridge/static
    uid: 0
    gid: 0
    source: /usr/share/openshift-console/static
  - type: directory
    path: /pkg
    uid: 0
    gid: 0
  - type: symlink
    path: /pkg/graphql
    uid: 0
    gid: 0
    source: /usr/share/openshift-console/graphql
  - type: symlink
    path: /usr/local/bin/openshift-console
    uid: 0
    gid: 0
    source: /opt/bridge/bin/bridge
annotations:
  org.opencontainers.image.description: A minimal Red Hat OpenShift Console image
  org.opencontainers.image.licenses: Apache-2.0
cmd:
  - /usr/local/bin/openshift-console
  - --public-dir=/opt/bridge/static
ports:
  - "8443"
  - "9000"
