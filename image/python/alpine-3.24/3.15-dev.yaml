# syntax=dhi.io/build:2-alpine3.24

name: Python 3.15.x (dev)
image: dhi.io/python
variant: dev
tags:
  - 3-alpine-dev
  - 3.15-alpine-dev
  - 3-alpine3.24-dev
  - 3.15.2-alpine-dev
  - 3.15-alpine3.24-dev
  - 3.15.2-alpine3.24-dev
platforms:
  - linux/amd64
  - linux/arm64
dates:
  release: "2026-10-09"
  end-of-life: "2031-10-31"
vars:
  PYTHON_MAJOR_MINOR_VERSION: "3.15"
  PYTHON_MAJOR_VERSION: "3"
  PYTHON_PIP_VERSION: 26.3-r1
  PYTHON_SETUPTOOLS_VERSION: 84.0.0-r1
  PYTHON_VERSION: 3.15.2
  VERSION: 3.15.2-r3
contents:
  repositories:
    - https://dhi.io/apk/alpine/v3.24/main
    - https://dl-cdn.alpinelinux.org/alpine/v3.24/main
    - https://dl-cdn.alpinelinux.org/alpine/v3.24/community
  keyring:
    - https://dhi.io/keyring/dhi-apk@docker-0F81AD7700D99184.rsa.pub
  packages:
    - alpine-baselayout-data
    - apk-tools
    - busybox
    - bzip2
    - ca-certificates
    - ca-certificates-bundle
    - expat
    - gcc
    - gdbm
    - libffi
    - libffi-dev
    - mpdecimal
    - musl
    - musl-dev
    - ncurses
    - openssl
    - py3.15-pip=26.3-r1
    - py3.15-setuptools=84.0.0-r1
    - python-3.15=3.15.2-r3
    - readline
    - sqlite-libs
    - tzdata
    - zlib
accounts:
  root: true
  run-as: root
  users:
    - name: nonroot
      uid: 65532
      gid: 65532
  groups:
    - name: nonroot
      gid: 65532
      members:
        - nonroot
os-release:
  name: Docker Hardened Images (Alpine)
  id: alpine
  version-id: "3.24"
  pretty-name: Docker Hardened Images/Alpine Linux v3.24
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
environment:
  PYTHON_VERSION: 3.15.2
  SSL_CERT_FILE: /etc/ssl/certs/ca-certificates.crt
annotations:
  org.opencontainers.image.description: A minimal Python image
  org.opencontainers.image.licenses: PSF-2.0
cmd:
  - python3
