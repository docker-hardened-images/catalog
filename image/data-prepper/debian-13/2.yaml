# syntax=dhi.io/build:2-debian13

name: Data Prepper 2.x
image: dhi.io/data-prepper
variant: runtime
tags:
  - "2"
  - "2.16"
  - 2.16.0
  - 2-debian
  - 2-debian13
  - 2.16-debian
  - 2.16-debian13
  - 2.16.0-debian
  - 2.16.0-debian13
platforms:
  - linux/amd64
  - linux/arm64
dates:
  release: "2022-10-10"
vars:
  JAVA_FIPS_SUFFIX: ""
  JAVA_HOME: /usr/lib/jvm/temurin-17
  JAVA_VARIANT: jre
  JDK_MAJOR_VERSION: "17"
  SEMVER_MAJOR_MINOR_VERSION: "2.16"
  SEMVER_MAJOR_VERSION: "2"
  SEMVER_VERSION: 2.16.0
  VERSION: 2.16.0-1
contents:
  repositories:
    - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
  keyring:
    - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
  packages:
    - '!libelogind0'
    - '!mawk'
    - '!original-awk'
    - base-files
    - bash
    - bc
    - ca-certificates
    - coreutils
    - data-prepper=2.16.0-1
    - eclipse-temurin-17-jre
    - eclipse-temurin-17-jre-oci-config
    - gettext-base
    - mawk
    - sed
    - tzdata
  builds:
    - name: locale
      contents:
        packages:
          - bash
          - locales
          - coreutils
          - gzip
      pipeline:
        - name: install locales
          runs: |
            set -eux -o pipefail

            ln -s /etc/locale.alias /usr/share/locale/locale.alias

            echo "en_US.UTF-8 UTF-8" >> /etc/locale.gen
            locale-gen en_US.UTF-8
      outputs:
        - source: /usr/share/locale
          target: /usr/share/locale
          uid: 0
          gid: 0
        - source: /usr/lib/locale
          target: /usr/lib/locale
          uid: 0
          gid: 0
accounts:
  run-as: nonroot
  users:
    - name: nonroot
      uid: 65532
      gid: 65532
  groups:
    - name: nonroot
      gid: 65532
      members:
        - nonroot
os-release:
  name: Docker Hardened Images (Debian)
  id: debian
  version-id: "13"
  version-codename: trixie
  pretty-name: Docker Hardened Images/Debian GNU/Linux 13 (trixie)
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
work-dir: /usr/share/data-prepper
environment:
  DATA_PREPPER_PATH: /usr/share/data-prepper
  JAVA_HOME: /usr/lib/jvm/temurin-17
  LANG: en_US.UTF-8
  LANGUAGE: en_US:en
  LC_ALL: en_US.UTF-8
  PATH: /usr/share/data-prepper/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
paths:
  - type: file
    path: /usr/share/data-prepper/config/data-prepper-config.yaml
    uid: 0
    gid: 0
    mode: "0644"
    source: image/data-prepper/files/default-data-prepper-config.yaml
  - type: file
    path: /usr/share/data-prepper/pipelines/pipelines.yaml
    uid: 0
    gid: 0
    mode: "0644"
    source: image/data-prepper/files/default-pipelines.yaml
  - type: directory
    path: /usr/share/data-prepper/log/data-prepper
    uid: 65532
    gid: 65532
    mode: "0755"
  - type: directory
    path: /var/log/data-prepper
    uid: 65532
    gid: 65532
    mode: "0755"
annotations:
  org.opencontainers.image.description: A minimal Data Prepper image
  org.opencontainers.image.licenses: Apache-2.0
entrypoint:
  - /usr/share/data-prepper/bin/data-prepper
ports:
  - 4900/tcp
