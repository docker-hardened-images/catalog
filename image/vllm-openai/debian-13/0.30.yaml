# syntax=dhi.io/build:2-debian13

name: vLLM OpenAI 0.30.x
image: dhi.io/vllm-openai
variant: runtime
tags:
  - "0"
  - "0.30"
  - 0.30.0
  - 0-debian
  - 0-debian13
  - 0.30-debian
  - 0.30-debian13
  - 0.30.0-debian
  - 0.30.0-debian13
platforms:
  - linux/amd64
  - linux/arm64
dates:
  release: "2026-09-22"
vars:
  ARCH_TRIPLET: '#{ target.arch == "amd64" ? "x86_64-linux-gnu" : "aarch64-linux-gnu" }'
  PACKAGE_NAME: vllm-openai-0.30-cuda13.0-python3.12
  PYTORCH_PACKAGE_VERSION: 2.13.0-3
  SEMVER_MAJOR_MINOR_VERSION: "0.30"
  SEMVER_MAJOR_VERSION: "0"
  SEMVER_VERSION: 0.30.0
  VERSION: 0.30.0-6
contents:
  repositories:
    - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] https://dhi.io/deb/debian/main trixie main
  keyring:
    - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
  packages:
    - '!libelogind0'
    - '!mawk'
    - '!original-awk'
    - base-files
    - ca-certificates
    - ffmpeg
    - g++
    - gcc
    - libc-bin
    - libffi8
    - libgl1
    - libibverbs-dev
    - libnuma-dev
    - libsm6
    - libxext6
    - numactl
    - python-3.12
    - python-3.12-dev
    - pytorch-2.13-cuda13.0-python3.12=2.13.0-3
    - vllm-openai-0.30-cuda13.0-python3.12=0.30.0-6
accounts:
  run-as: nonroot
  users:
    - name: nonroot
      uid: 65532
      gid: 65532
  groups:
    - name: nonroot
      gid: 65532
      members:
        - nonroot
os-release:
  name: Docker Hardened Images (Debian)
  id: debian
  version-id: "13"
  version-codename: trixie
  pretty-name: Docker Hardened Images/Debian GNU/Linux 13 (trixie)
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
work-dir: /home/nonroot
environment:
  CUDA_VERSION: 13.0.3
  HF_HOME: /home/nonroot/.cache/huggingface
  LD_LIBRARY_PATH: /usr/local/nvidia/lib:/usr/local/nvidia/lib64:/usr/local/cuda/lib64
  LIBRARY_PATH: /usr/local/nvidia/lib:/usr/local/nvidia/lib64:/usr/local/cuda/lib64
  NUMBA_CACHE_DIR: /home/nonroot/.cache/numba
  NVIDIA_DRIVER_CAPABILITIES: compute,utility
  NVIDIA_PRODUCT_NAME: CUDA
  NVIDIA_REQUIRE_CUDA: cuda>=13.0
  NVIDIA_VISIBLE_DEVICES: all
  PATH: /usr/local/nvidia/bin:/usr/local/cuda/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
  REQUESTS_CA_BUNDLE: /etc/ssl/certs/ca-certificates.crt
  SSL_CERT_FILE: /etc/ssl/certs/ca-certificates.crt
  TMPDIR: /tmp
  TORCH_CUDA_ARCH_LIST: 7.5 8.0 8.6 8.9 9.0 10.0 11.0 12.0
  TRITON_CACHE_DIR: /home/nonroot/.cache/triton
  VLLM_CACHE_ROOT: /home/nonroot/.cache/vllm
  VLLM_ENABLE_CUDA_COMPATIBILITY: "0"
  VLLM_TARGET_DEVICE: cuda
  VLLM_USAGE_SOURCE: production-docker-image
  XDG_CACHE_HOME: /home/nonroot/.cache
paths:
  - type: symlink
    path: /usr/lib/${ARCH_TRIPLET}/libblas.so.3
    uid: 0
    gid: 0
    source: blas/libblas.so.3
  - type: symlink
    path: /usr/lib/${ARCH_TRIPLET}/liblapack.so.3
    uid: 0
    gid: 0
    source: lapack/liblapack.so.3
  - type: directory
    path: /opt
    uid: 0
    gid: 0
  - type: symlink
    path: /opt/venv
    uid: 0
    gid: 0
    source: /usr/lib/vllm-openai
  - type: directory
    path: /tmp
    uid: 0
    gid: 0
    mode: "1777"
  - type: directory
    path: /home/nonroot/.cache
    uid: 65532
    gid: 65532
    mode: "0775"
  - type: directory
    path: /home/nonroot/.cache/flashinfer
    uid: 65532
    gid: 65532
    mode: "0775"
  - type: directory
    path: /home/nonroot/.cache/huggingface
    uid: 65532
    gid: 65532
    mode: "0775"
  - type: directory
    path: /home/nonroot/.cache/numba
    uid: 65532
    gid: 65532
    mode: "0775"
  - type: directory
    path: /home/nonroot/.cache/triton
    uid: 65532
    gid: 65532
    mode: "0775"
  - type: directory
    path: /home/nonroot/.cache/vllm
    uid: 65532
    gid: 65532
    mode: "0775"
annotations:
  com.nvidia.volumes.needed: nvidia_driver
  org.opencontainers.image.description: vLLM OpenAI - High-throughput LLM serving with an OpenAI-compatible API
  org.opencontainers.image.licenses: Apache-2.0
entrypoint:
  - /usr/bin/vllm
  - serve
ports:
  - "8000"
