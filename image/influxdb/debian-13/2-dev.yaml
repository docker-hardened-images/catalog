# syntax=dhi.io/build:2-debian13

name: InfluxDB 2.x (dev)
image: dhi.io/influxdb
variant: dev
tags:
  - 2-dev
  - 2.10-dev
  - 2.10.1-dev
  - 2-debian-dev
  - 2-debian13-dev
  - 2.10-debian-dev
  - 2.10-debian13-dev
  - 2.10.1-debian-dev
  - 2.10.1-debian13-dev
platforms:
  - linux/amd64
  - linux/arm64
dates:
  release: "2020-11-09"
vars:
  CLI_VERSION: 2.9.1-1
  PACKAGE_SUFFIX: -dev
  SEMVER_MAJOR_MINOR_VERSION: "2.10"
  SEMVER_MAJOR_VERSION: "2"
  SEMVER_VERSION: 2.10.1
  VERSION: 2.10.1-8
contents:
  repositories:
    - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
  keyring:
    - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
  packages:
    - '!gawk'
    - '!libelogind0'
    - '!original-awk'
    - apt
    - base-files
    - bash
    - ca-certificates
    - ca-certificates-bundle
    - coreutils
    - diffutils
    - dpkg
    - findutils
    - grep
    - influx-cli-2-dev=2.9.1-1
    - influxdb-2-dev=2.10.1-8
    - libc-bin
    - libc6
    - libgcc-s1
    - libsqlite3-0
    - libstdc++6
    - mawk
    - openssl
    - perl-base
    - sed
    - tar
    - tzdata
    - util-linux
accounts:
  root: true
  run-as: root
  users:
    - name: nonroot
      uid: 65532
      gid: 65532
    - name: _apt
      uid: 42
      gid: 65532
  groups:
    - name: nonroot
      gid: 65532
      members:
        - nonroot
os-release:
  name: Docker Hardened Images (Debian)
  id: debian
  version-id: "13"
  version-codename: trixie
  pretty-name: Docker Hardened Images/Debian GNU/Linux 13 (trixie)
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
environment:
  DEBIAN_FRONTEND: noninteractive
  INFLUX_CONFIGS_PATH: /var/lib/influx-cli/configs
  INFLUXD_CONFIG_PATH: /etc/influxdb/
paths:
  - type: file
    path: /etc/influxdb/config.yaml
    uid: 0
    gid: 0
    mode: "0644"
    source: image/influxdb/data/2/default-config.yaml
  - type: directory
    path: /usr/local/bin
    uid: 0
    gid: 0
  - type: symlink
    path: /usr/local/bin/influxd
    uid: 0
    gid: 0
    source: /usr/bin/influxd
  - type: directory
    path: /var/lib/influxdb
    uid: 65532
    gid: 65532
  - type: directory
    path: /var/lib/influx-cli
    uid: 65532
    gid: 65532
  - type: symlink
    path: /usr/local/bin/influx
    uid: 0
    gid: 0
    source: /usr/bin/influx
annotations:
  org.opencontainers.image.description: A minimal InfluxDB image
  org.opencontainers.image.licenses: MIT
entrypoint:
  - influxd
ports:
  - 8086/tcp
