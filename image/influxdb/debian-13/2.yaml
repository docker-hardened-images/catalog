# syntax=dhi.io/build:2-debian13

name: InfluxDB 2.x
image: dhi.io/influxdb
variant: runtime
tags:
  - "2"
  - "2.9"
  - 2.9.1
  - 2-debian
  - 2-debian13
  - 2.9-debian
  - 2.9-debian13
  - 2.9.1-debian
  - 2.9.1-debian13
platforms:
  - linux/amd64
  - linux/arm64
dates:
  release: "2020-11-09"
vars:
  COMMIT_SHA: d4fa1941fd4adb29a556e774de426dfbab72f346
  GO_TAGS: libsqlite3,sqlite_foreign_keys,sqlite_json,assets,noasm
  GOLANG_VERSION: 1.26.9-0
  OPENAPI_COMMIT_SHA: 8b5f1bbb2cd388eb454dc9da19e3d2c4061cdf5f
  PROTOC_GEN_GO_VERSION: v1.36.5
  SEMVER_MAJOR_MINOR_VERSION: "2.9"
  SEMVER_MAJOR_VERSION: "2"
  SEMVER_VERSION: 2.9.1
  UI_COMMIT_SHA: fdb6b600f5daa380b268276f72301dfdb4a6027a
  UI_VERSION: 2.10.0
  VERSION: 2.9.1
contents:
  repositories:
    - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
  keyring:
    - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
  packages:
    - base-files
    - ca-certificates-bundle
    - libc6
    - libgcc-s1
    - libsqlite3-0
    - libstdc++6
    - tzdata
  builds:
    - name: influxdb
      environment:
        GOBIN: /go/bin
        GODEBUG: tarinsecurepath=0,zipinsecurepath=0
        GOPATH: /go
        PATH: /go/bin:/usr/lib/go/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
      caches:
        - path: /root/.cargo
        - path: /go/pkg/mod
      contents:
        packages:
          - base-files
          - build-essential
          - libprotobuf-dev
          - libsqlite3-dev
          - pkg-config
          - protobuf-compiler
          - bash
          - ca-certificates
          - coreutils
          - findutils
          - git
          - libc6
          - libc-bin
          - libstdc++6
          - cargo-1.97
          - rustc-1.97
          - mawk
          - nodejs-24
          - node-corepack
          - npm
          - sed
          - yarn-classic
          - ca-certificates-bundle
          - golang-1.26=1.26.9-0
        files:
          - url: https://raw.githubusercontent.com/influxdata/openapi/8b5f1bbb2cd388eb454dc9da19e3d2c4061cdf5f/contracts/oss.json
            path: ${source.dir}/swagger.json
            uid: 0
            gid: 0
          - url: git+https://github.com/influxdata/ui.git#OSS-v2.10.0
            checksum: fdb6b600f5daa380b268276f72301dfdb4a6027a
            path: ${source.dir}/ui
            uid: 0
            gid: 0
          - url: git+https://github.com/influxdata/influxdb.git#v2.9.1
            checksum: d4fa1941fd4adb29a556e774de426dfbab72f346
            path: /go/src/github.com/influxdata/influxdb
            spdx:
              name: influxdb
              version: 2.9.1
              packages:
                - name: influxdb
                  purl: pkg:golang/github.com/influxdata/influxdb@2.9.1
                  license: MIT
            uid: 0
            gid: 0
      pipeline:
        - name: build ui
          work-dir: ${source.dir}/ui
          privileged: true
          runs: |
            set -eux -o pipefail

            export CYPRESS_INSTALL_BINARY=0
            yarn install --network-timeout 1000000
            export NODE_OPTIONS="--max-old-space-size=2048"
            yarn build:ci
        - name: place ui into go source for embedding
          work-dir: ${source.dir}/ui
          runs: |
            set -eux -o pipefail

            mkdir -p /go/src/github.com/influxdata/influxdb/static/data
            cp -r build /go/src/github.com/influxdata/influxdb/static/data/build
        - name: place openapi into go source for embedding
          runs: |
            set -eux -o pipefail

            cp ${source.dir}/swagger.json /go/src/github.com/influxdata/influxdb/static/data/
        - name: generate embedded ui and openapi
          work-dir: /go/src/github.com/influxdata/influxdb
          privileged: true
          runs: |
            set -eux -o pipefail

            go generate --tags libsqlite3,sqlite_foreign_keys,sqlite_json,assets,noasm ./static
        - name: go generate
          work-dir: /go/src/github.com/influxdata/influxdb
          privileged: true
          runs: |
            set -eux -o pipefail

            go install "google.golang.org/protobuf/cmd/protoc-gen-go@v1.36.5"
            go install github.com/benbjohnson/tmpl
            go install golang.org/x/tools/cmd/stringer
            go install golang.org/x/tools/cmd/goimports
            go install github.com/influxdata/pkg-config

            go generate --tags libsqlite3,sqlite_foreign_keys,sqlite_json,assets,noasm ./influxql/... ./models/... ./pkg/... ./storage/... ./tsdb/... ./v1/...
        - name: update go dependencies
          uses: go/bump@v1
          work-dir: /go/src/github.com/influxdata/influxdb
          with:
            deps:
              - golang.org/x/text@v0.41.0
              - golang.org/x/crypto@v0.57.0
              - github.com/aws/aws-sdk-go-v2/aws/protocol/eventstream@v1.7.8
              - github.com/aws/aws-sdk-go-v2/service/s3@v1.97.3
              - github.com/buger/jsonparser@v1.1.2
              - github.com/eclipse/paho.mqtt.golang@v1.5.1
              - github.com/go-jose/go-jose/v4@v4.1.4
              - github.com/hashicorp/go-retryablehttp@v0.7.7
              - github.com/hashicorp/vault/api@v1.9.2
              - github.com/klauspost/compress@v1.18.7
              - go.opentelemetry.io/otel@v1.44.0
              - go.opentelemetry.io/otel/sdk@v1.45.0
              - google.golang.org/grpc@v1.83.2
            download: true
        - name: patch session store test expiry window
          uses: patch@v1
          work-dir: /go/src/github.com/influxdata/influxdb
          with:
            options: -p1
            patch: ${source.dir}/patch/session-store-test-expiry.patch
        - name: test
          work-dir: /go/src/github.com/influxdata/influxdb
          privileged: true
          runs: |
            set -eux -o pipefail

            # This flux rust gets compiled via the pkg-config shim installed above.
            # The pkg-config shim uses the CARGO envvar to override the default cargo binary.
            # The same envvar is used below in the build step.
            export CARGO=${source.dir}/helpers/bin/cargo-wrapper.sh

            # -vet=off: influxdb v2.9.x has format-string vet failures under Go 1.26.
            # Skip file_URL special-path subtests that expect /dev/core or /sys/kernel
            # errors this environment does not produce.
            go test -vet=off --tags libsqlite3,sqlite_foreign_keys,sqlite_json,assets,noasm ./... -skip 'TestService/DryRun_-_stack/file_URL//dev/core|TestService/DryRun_-_stack/file_URL//sys/kernel/vmcoreinfo'
        - name: build
          uses: go/build@v1
          work-dir: /go/src/github.com/influxdata/influxdb
          with:
            cgo_enabled: 1
            extra_env: CARGO=${source.dir}/helpers/bin/cargo-wrapper.sh PKG_CONFIG=/go/bin/pkg-config
            ldflags:
              - -X main.commit=d4fa1941fd4adb29a556e774de426dfbab72f346
              - -X main.version=v2.9.1
              - -X main.date=$(date -u -d @${SOURCE_DATE_EPOCH} +'%FT%TZ')
            output: ${target.dir}/usr/local/bin/influxd
            packages: ./cmd/influxd
            tags: libsqlite3,sqlite_foreign_keys,sqlite_json,assets,noasm
      paths:
        - type: directory
          path: ${source.dir}/patch
          uid: 0
          gid: 0
          source: image/influxdb/patch
        - type: file
          path: ${source.dir}/helpers/bin/cargo-wrapper.sh
          uid: 0
          gid: 0
          mode: "0755"
          source: image/influxdb/bin/2/cargo-wrapper.sh
      outputs:
        - source: ${target.dir}/usr/local/bin
          target: /usr/local/bin
          uid: 0
          gid: 0
        - source: /opt/docker/sbom/influxdb
          target: /opt/docker/sbom/influxdb
          uid: 0
          gid: 0
accounts:
  run-as: nonroot
  users:
    - name: nonroot
      uid: 65532
      gid: 65532
  groups:
    - name: nonroot
      gid: 65532
      members:
        - nonroot
os-release:
  name: Docker Hardened Images (Debian)
  id: debian
  version-id: "13"
  version-codename: trixie
  pretty-name: Docker Hardened Images/Debian GNU/Linux 13 (trixie)
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
environment:
  INFLUXD_CONFIG_PATH: /etc/influxdb/
paths:
  - type: file
    path: /etc/influxdb/config.yaml
    uid: 0
    gid: 0
    mode: "0644"
    source: image/influxdb/data/2/default-config.yaml
  - type: directory
    path: /var/lib/influxdb
    uid: 65532
    gid: 65532
annotations:
  org.opencontainers.image.description: A minimal InfluxDB image
  org.opencontainers.image.licenses: MIT
entrypoint:
  - influxd
ports:
  - 8086/tcp
