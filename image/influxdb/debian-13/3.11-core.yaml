# syntax=dhi.io/build:2-debian13

name: InfluxDB 3.11.x Core (core)
image: dhi.io/influxdb
variant: runtime
flavor: core
tags:
  - 3-core
  - 3.11-core
  - 3.11.1-core
  - 3-debian-core
  - 3-debian13-core
  - 3.11-debian-core
  - 3.11-debian13-core
  - 3.11.1-debian-core
  - 3.11.1-debian13-core
platforms:
  - linux/amd64
  - linux/arm64
dates:
  release: "2026-07-30"
vars:
  COMMIT_SHA: a95809c862448e050a2f6db3df202984e058bac3
  PYTHON_MAJOR_MINOR_VERSION: "3.13"
  SEMVER_MAJOR_MINOR_VERSION: "3.11"
  SEMVER_MAJOR_VERSION: "3"
  SEMVER_VERSION: 3.11.1
  VERSION: 3.11.1
contents:
  repositories:
    - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
  keyring:
    - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
  packages:
    - base-files
    - bash
    - ca-certificates-bundle
    - coreutils
    - libc6
    - libgcc-s1
    - libstdc++6
    - python-3.13
    - python-3.13-dev
    - python3-pip
    - python3-setuptools
    - python3-wheel
    - tzdata
  builds:
    - name: influxdb3
      shell: /bin/bash
      caches:
        - path: /root/.cargo
      contents:
        packages:
          - build-essential
          - cargo-1.97
          - rustc-1.97
          - bash
          - ca-certificates
          - coreutils
          - findutils
          - gawk
          - binutils
          - git
          - grep
          - libprotobuf-dev
          - lld
          - protobuf-compiler
          - sed
          - python-3.13
          - python-3.13-dev
          - python3-pip
          - python3-setuptools
          - python3-wheel
        files:
          - url: git+https://github.com/influxdata/influxdb.git#v3.11.1
            checksum: a95809c862448e050a2f6db3df202984e058bac3
            path: ${source.dir}/influxdb3
            spdx:
              name: influxdb3
              version: 3.11.1
              packages:
                - name: influxdb3
                  purl: pkg:cargo/influxdb3@3.11.1
                  license: MIT
            uid: 0
            gid: 0
      pipeline:
        - name: bump quinn-proto cargo dep
          work-dir: ${source.dir}/influxdb3
          privileged: true
          runs: |
            set -eux -o pipefail

            # GHSA-4w2j-m93h-cj5j: quinn-proto 0.11.14 -> 0.11.15 (patch bump,
            # stays within the existing 0.11.x requirement). Upstream 3.11.0
            # already ships fixed anyhow/crossbeam-epoch/pyo3/serde_with.
            cargo update --package quinn-proto --precise 0.11.15
        - name: bump event-listener cargo dep
          work-dir: ${source.dir}/influxdb3
          privileged: true
          runs: |
            set -eux -o pipefail

            # RUSTSEC-2026-0221: event-listener 5.4.1 -> 5.4.2
            cargo update --package event-listener --precise 5.4.2
        - name: cargo sbom
          uses: sbom@v1
          with:
            extra-scanners: rust-cargo-lock-cataloger
            prefix: influxdb3-cargo
            source: ${source.dir}/influxdb3
        - name: configure PYO3
          runs: |
            set -eux -o pipefail

            cat > "${source.dir}/pyo3_config_file.txt" << EOF
            implementation=CPython
            version=3.13
            shared=true
            abi3=false
            lib_name=python3.13
            lib_dir=/usr/lib
            executable=/usr/bin/python3.13
            pointer_width=64
            build_flags=
            suppress_build_script_link_lines=false
            EOF
        - name: build
          work-dir: ${source.dir}/influxdb3
          privileged: true
          runs: |
            set -eux -o pipefail

            export PYO3_CONFIG_FILE="${source.dir}/pyo3_config_file.txt"
            export CARGO_PROFILE_RELEASE_LTO=thin
            export CARGO_BUILD_JOBS="${CARGO_BUILD_JOBS:-4}"
            cargo build --release
        - name: install
          work-dir: ${source.dir}/influxdb3
          runs: |
            set -eux -o pipefail

            install -D target/release/influxdb3 \
              '${target.dir}/usr/local/bin/influxdb3'
      outputs:
        - source: ${target.dir}/usr/local/bin
          target: /usr/local/bin
          uid: 0
          gid: 0
        - source: /opt/docker/sbom/influxdb3
          target: /opt/docker/sbom/influxdb3
          uid: 0
          gid: 0
        - source: /opt/docker/sbom/influxdb3-cargo
          target: /opt/docker/sbom/influxdb3-cargo
          uid: 0
          gid: 0
accounts:
  run-as: nonroot
  users:
    - name: nonroot
      uid: 65532
      gid: 65532
  groups:
    - name: nonroot
      gid: 65532
      members:
        - nonroot
os-release:
  name: Docker Hardened Images (Debian)
  id: debian
  version-id: "13"
  version-codename: trixie
  pretty-name: Docker Hardened Images/Debian GNU/Linux 13 (trixie)
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
environment:
  INFLUXDB3_DB_DIR: /var/lib/influxdb3
  INFLUXDB3_PLUGIN_DIR: /plugins
paths:
  - type: directory
    path: /var/lib/influxdb3
    uid: 65532
    gid: 65532
  - type: directory
    path: /plugins
    uid: 65532
    gid: 65532
annotations:
  org.opencontainers.image.description: A minimal InfluxDB image
  org.opencontainers.image.licenses: MIT
entrypoint:
  - influxdb3
ports:
  - 8181/tcp
