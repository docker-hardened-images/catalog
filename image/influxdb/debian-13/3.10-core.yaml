# syntax=dhi.io/build:2-debian13

name: InfluxDB 3.10.x Core (core)
image: dhi.io/influxdb
variant: runtime
flavor: core
tags:
  - 3.10-core
  - 3.10.6-core
  - 3.10-debian-core
  - 3.10-debian13-core
  - 3.10.6-debian-core
  - 3.10.6-debian13-core
platforms:
  - linux/amd64
  - linux/arm64
dates:
  release: "2026-06-17"
vars:
  PYTHON_MAJOR_MINOR_VERSION: "3.13"
  SEMVER_MAJOR_MINOR_VERSION: "3.10"
  SEMVER_MAJOR_VERSION: "3"
  SEMVER_VERSION: 3.10.6
  VERSION: 3.10.6-1
contents:
  repositories:
    - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
  keyring:
    - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
  packages:
    - base-files
    - bash
    - ca-certificates-bundle
    - coreutils
    - influxdb3-3.10=3.10.6-1
    - libc6
    - libgcc-s1
    - libpython-3.13
    - libstdc++6
    - python-3.13
    - python-3.13-dev
    - python3-pip
    - python3-setuptools
    - python3-wheel
    - tzdata
accounts:
  run-as: nonroot
  users:
    - name: nonroot
      uid: 65532
      gid: 65532
  groups:
    - name: nonroot
      gid: 65532
      members:
        - nonroot
os-release:
  name: Docker Hardened Images (Debian)
  id: debian
  version-id: "13"
  version-codename: trixie
  pretty-name: Docker Hardened Images/Debian GNU/Linux 13 (trixie)
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
environment:
  INFLUXDB3_DB_DIR: /var/lib/influxdb3
  INFLUXDB3_PLUGIN_DIR: /plugins
paths:
  - type: directory
    path: /usr/local/bin
    uid: 0
    gid: 0
  - type: symlink
    path: /usr/local/bin/influxdb3
    uid: 0
    gid: 0
    source: /usr/bin/influxdb3
  - type: directory
    path: /var/lib/influxdb3
    uid: 65532
    gid: 65532
  - type: directory
    path: /plugins
    uid: 65532
    gid: 65532
annotations:
  org.opencontainers.image.description: A minimal InfluxDB image
  org.opencontainers.image.licenses: MIT
entrypoint:
  - influxdb3
ports:
  - 8181/tcp
