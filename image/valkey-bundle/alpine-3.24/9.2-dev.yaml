    - valkey-bloom=1.0.1-r0
    - valkey-json=1.1.0-r0
    - valkey-ldap=1.1.1-r0
    - valkey-search-1.3=1.3.0-r0
  builds:
    - name: valkey
      work-dir: ${source.dir}/valkey
      contents:
        packages:
          - bash
          - binutils
          - clang
          - coreutils
          - gawk
          - git
          - grep
          - linux-headers
          - make
          - musl-dev
          - openssl-dev
          - pkgconf
          - python3
          - sed
          - zstd-dev
          - zstd-static
        files:
          - url: git+https://github.com/valkey-io/valkey.git#9.2.1
            checksum: d1a551720f5feb1a2ff5b9a7b5e22520ae77eeef
            path: ${source.dir}/valkey
            spdx:
              name: valkey
              version: 9.2.1
              packages:
                - name: valkey
                  purl: pkg:dhi/valkey@9.2.1
                  license: BSD-3-Clause
            uid: 0
            gid: 0
      pipeline:
        - name: build
          runs: |
            set -eux -o pipefail

            make BUILD_TLS=yes BUILD_ZSTD=yes CC=clang-22

            mkdir -p "${target.dir}/usr/local/bin"
            cp src/valkey-server "${target.dir}/usr/local/bin/valkey-server"
            cp src/valkey-cli "${target.dir}/usr/local/bin/valkey-cli"
            cp src/valkey-benchmark "${target.dir}/usr/local/bin/valkey-benchmark"
        - uses: spdx@v1
          with:
            license: BSD-3-Clause OR GPL-2.0-only
            name: zstd
            purl: pkg:github/facebook/zstd@v1.5.7
            version: v1.5.7
      outputs:
        - source: ${target.dir}/usr/local/bin/valkey-server
          target: /usr/local/bin/valkey-server
          uid: 0
          gid: 0
          mode: "0755"
        - source: ${target.dir}/usr/local/bin/valkey-cli
          target: /usr/local/bin/valkey-cli
          uid: 0
          gid: 0
          mode: "0755"
        - source: ${target.dir}/usr/local/bin/valkey-benchmark
          target: /usr/local/bin/valkey-benchmark
          uid: 0
          gid: 0
          mode: "0755"
        - source: /opt/docker/sbom/zstd
          target: /opt/docker/sbom/zstd
          uid: 0
          gid: 0
