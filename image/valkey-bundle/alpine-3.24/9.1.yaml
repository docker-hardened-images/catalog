  end-of-life: "2028-10-21"
vars:
  COMMIT_SHA: 29173b67508b2de4c0f0ed551f3b47cf19fc3ca8
  SEMVER_MAJOR_MINOR_VERSION: "9.1"
  SEMVER_MAJOR_VERSION: "9"
  SEMVER_VERSION: 9.1.3
  VALKEY_BLOOM_VERSION: 1.0.1-r0
  VALKEY_JSON_VERSION: 1.0.3-r0
  VALKEY_LDAP_VERSION: 1.1.1-r0
  VALKEY_SEARCH_VERSION: 1.2.1-r0
  VERSION: 9.1.3
contents:
  repositories:
    - https://dhi.io/apk/alpine/v3.24/main
    - https://dl-cdn.alpinelinux.org/alpine/v3.24/main
    - https://dl-cdn.alpinelinux.org/alpine/v3.24/community
  keyring:
    - https://dhi.io/keyring/dhi-apk@docker-0F81AD7700D99184.rsa.pub
  packages:
    - alpine-baselayout-data
    - busybox
    - ca-certificates-bundle
    - libgcc
    - libssl3
    - libstdc++
    - pcre2
    - tini
    - tzdata
    - valkey-bloom=1.0.1-r0
    - valkey-json=1.0.3-r0
    - valkey-ldap=1.1.1-r0
    - valkey-search=1.2.1-r0
  builds:
    - name: valkey
      work-dir: ${source.dir}/valkey
      contents:
        packages:
          - bash
          - binutils
          - clang
          - coreutils
          - gawk
          - git
          - grep
          - linux-headers
          - make
          - musl-dev
          - openssl-dev
          - pkgconf
          - python3
          - sed
        files:
          - url: git+https://github.com/valkey-io/valkey.git#9.1.3
            checksum: 29173b67508b2de4c0f0ed551f3b47cf19fc3ca8
            path: ${source.dir}/valkey
            spdx:
              name: valkey
              version: 9.1.3
              packages:
                - name: valkey
                  purl: pkg:dhi/valkey@9.1.3
                  license: BSD-3-Clause
            uid: 0
            gid: 0
      pipeline:
        - name: build
          runs: |
            set -eux -o pipefail

            make BUILD_TLS=yes CC=clang-22

            mkdir -p "${target.dir}/usr/local/bin"
            cp src/valkey-server "${target.dir}/usr/local/bin/valkey-server"
            cp src/valkey-cli "${target.dir}/usr/local/bin/valkey-cli"
            cp src/valkey-benchmark "${target.dir}/usr/local/bin/valkey-benchmark"
      outputs:
        - source: ${target.dir}/usr/local/bin/valkey-server
          target: /usr/local/bin/valkey-server
          uid: 0
          gid: 0
          mode: "0755"
        - source: ${target.dir}/usr/local/bin/valkey-cli
          target: /usr/local/bin/valkey-cli
          uid: 0
          gid: 0
          mode: "0755"
        - source: ${target.dir}/usr/local/bin/valkey-benchmark
          target: /usr/local/bin/valkey-benchmark
          uid: 0
          gid: 0
          mode: "0755"
accounts:
  run-as: nonroot
  users:
    - name: nonroot
      uid: 65532
      gid: 65532
  groups:
    - name: nonroot
      gid: 65532
      members:
        - nonroot
os-release:
  name: Docker Hardened Images (Alpine)
  id: alpine
  version-id: "3.24"
