# syntax=dhi.io/build:2-alpine3.24

name: Valkey Bundle 9.1.x
image: dhi.io/valkey-bundle
variant: runtime
tags:
  - 9-alpine
  - 9.1-alpine
  - 9-alpine3.24
  - 9.1.3-alpine
  - 9.1-alpine3.24
  - 9.1.3-alpine3.24
platforms:
  - linux/amd64
  - linux/arm64
dates:
