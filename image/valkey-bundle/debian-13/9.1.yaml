    uid: 65532
    gid: 65532
    mode: "0755"
  - type: directory
    path: /var/log/valkey
    uid: 65532
    gid: 65532
    mode: "0755"
  - type: directory
    path: /run/valkey/
    uid: 65532
    gid: 65532
    mode: "0755"
  - type: directory
    path: /data
    uid: 65532
    gid: 65532
    mode: "0755"
  - type: file
