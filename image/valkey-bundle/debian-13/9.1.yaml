    uid: 0
    gid: 0
    mode: "0755"
    source: image/valkey-bundle/bin/bundle-docker-entrypoint.sh
annotations:
  org.opencontainers.image.description: A minimal Valkey Bundle image
  org.opencontainers.image.licenses: BSD-3-Clause
entrypoint:
