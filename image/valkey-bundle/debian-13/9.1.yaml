# syntax=dhi.io/build:2-debian13

name: Valkey Bundle 9.1.x
image: dhi.io/valkey-bundle
variant: runtime
tags:
  - "9"
  - "9.1"
  - 9.1.3
  - 9-debian
  - 9-debian13
  - 9.1-debian
  - 9.1-debian13
  - 9.1.3-debian
  - 9.1.3-debian13
platforms:
  - linux/amd64
  - linux/arm64
dates:
  release: "2026-05-19"
  end-of-life: "2028-10-21"
vars:
  COMMIT_SHA: 29173b67508b2de4c0f0ed551f3b47cf19fc3ca8
  DEBIAN_EPOCH_MAJOR_MINOR_VERSION: "9.1"
  DEBIAN_EPOCH_MAJOR_VERSION: "9"
  DEBIAN_EPOCH_VERSION: 9.1.3
  VALKEY_BLOOM_VERSION: 1.0.1-1
  VALKEY_JSON_VERSION: 1.0.3-0
  VALKEY_LDAP_VERSION: 1.1.1-0
  VALKEY_SEARCH_VERSION: 1.2.1-0
  VERSION: 9.1.3
contents:
  repositories:
    - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
  keyring:
    - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
  packages:
    - '!adduser'
    - '!audit'
    - '!cdebconf'
    - '!dpkg'
    - '!elogind'
    - '!install-info'
    - '!libdebian-installer'
    - '!libdebian-installer4'
    - '!libelogind0'
    - '!libnewt0.52'
    - '!libslang2'
    - '!libtextwrap'
    - '!libtextwrap1'
    - '!mawk'
    - '!original-awk'
    - '!pam'
    - '!passwd'
    - '!pcre2'
    - '!shadow'
    - '!sysvinit'
    - '!sysvinit-utils'
    - base-files
    - bash
    - coreutils
    - gawk
    - grep
    - hostname
    - libc-bin
    - libpcre2-8-0
    - libssl3t64
    - libstdc++6
    - tini
    - valkey-bloom=1.0.1-1
    - valkey-json=1.0.3-0
    - valkey-ldap=1.1.1-0
    - valkey-search=1.2.1-0
  builds:
    - name: valkey
      work-dir: ${source.dir}/valkey
      contents:
        packages:
          - bash
          - clang
          - coreutils
          - gawk
          - gnu-which
          - grep
          - hostname
          - libssl-dev
          - make
          - pkg-config
          - python3
          - sed
        files:
          - url: git+https://github.com/valkey-io/valkey.git#9.1.3
            checksum: 29173b67508b2de4c0f0ed551f3b47cf19fc3ca8
            path: ${source.dir}/valkey
            spdx:
              name: valkey
              version: 9.1.3
              packages:
                - name: valkey
                  purl: pkg:dhi/valkey@9.1.3
                  license: BSD-3-Clause
            uid: 0
            gid: 0
      pipeline:
        - name: build
          runs: |
            set -eux -o pipefail

            make BUILD_TLS=yes CC=clang

            mkdir -p "${target.dir}/usr/local/bin"
            cp src/valkey-server "${target.dir}/usr/local/bin/valkey-server"
            cp src/valkey-cli "${target.dir}/usr/local/bin/valkey-cli"
            cp src/valkey-benchmark "${target.dir}/usr/local/bin/valkey-benchmark"
      outputs:
        - source: ${target.dir}/usr/local/bin/valkey-server
          target: /usr/local/bin/valkey-server
          uid: 0
          gid: 0
          mode: "0755"
        - source: ${target.dir}/usr/local/bin/valkey-cli
          target: /usr/local/bin/valkey-cli
          uid: 0
          gid: 0
          mode: "0755"
        - source: ${target.dir}/usr/local/bin/valkey-benchmark
          target: /usr/local/bin/valkey-benchmark
          uid: 0
          gid: 0
          mode: "0755"
accounts:
  run-as: nonroot
  users:
    - name: nonroot
      uid: 65532
      gid: 65532
  groups:
    - name: nonroot
      gid: 65532
      members:
        - nonroot
os-release:
  name: Docker Hardened Images (Debian)
  id: debian
  version-id: "13"
  version-codename: trixie
  pretty-name: Docker Hardened Images/Debian GNU/Linux 13 (trixie)
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
work-dir: /data
