# syntax=dhi.io/build:2-debian13

name: Thanos 0.42.x (dev)
image: dhi.io/thanos
variant: dev
tags:
  - 0-dev
  - 0.42-dev
  - 0.42.4-dev
  - 0-debian-dev
  - 0-debian13-dev
  - 0.42-debian-dev
  - 0.42-debian13-dev
  - 0.42.4-debian-dev
  - 0.42.4-debian13-dev
platforms:
  - linux/amd64
  - linux/arm64
dates:
  release: "2026-07-30"
vars:
  COMMIT_SHA: 45c4f39487e1653e606307d3952a6259fb96acae
  DEBIAN_EPOCH_MAJOR_MINOR_VERSION: "0.42"
  DEBIAN_EPOCH_MAJOR_VERSION: "0"
  DEBIAN_EPOCH_VERSION: 0.42.4
  FLAVORED_SUFFIX: -dev
  SEMVER_VERSION: 0.42.4
  SUFFIX: -dev
  VERSION: 0.42.4-1
contents:
  repositories:
    - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
  keyring:
    - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
  packages:
    - '!gawk'
    - '!libelogind0'
    - '!original-awk'
    - apt
    - base-files
    - bash
    - ca-certificates
    - ca-certificates-bundle
    - coreutils
    - diffutils
    - dpkg
    - findutils
    - grep
    - libc-bin
    - mawk
    - perl-base
    - sed
    - thanos-dev=0.42.4-1
    - tzdata
    - util-linux
accounts:
  root: true
  run-as: root
  users:
    - name: nonroot
      uid: 65532
      gid: 65532
    - name: _apt
      uid: 42
      gid: 65532
  groups:
    - name: nonroot
      gid: 65532
      members:
        - nonroot
os-release:
  name: Docker Hardened Images (Debian)
  id: debian
  version-id: "13"
  version-codename: trixie
  pretty-name: Docker Hardened Images/Debian GNU/Linux 13 (trixie)
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
environment:
  DEBIAN_FRONTEND: noninteractive
paths:
  - type: directory
    path: /usr/local/bin
    uid: 0
    gid: 0
  - type: symlink
    path: /usr/local/bin/thanos
    uid: 0
    gid: 0
    source: /usr/bin/thanos
  - type: directory
    path: /var/thanos
    uid: 65532
    gid: 65532
    mode: "0755"
annotations:
  org.opencontainers.image.description: A minimal Thanos image
  org.opencontainers.image.licenses: Apache-2.0
entrypoint:
  - thanos
