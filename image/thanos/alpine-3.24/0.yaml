              - go.opentelemetry.io/otel/exporters/otlp/otlptrace/otlptracehttp@v1.43.0
            download: true
        - name: unit test
          runs: |
            set -eux -o pipefail

            go test ./cmd/thanos/... -skip Test_CheckRules_Glob
        - name: build
          uses: go/build@v1
          with:
            ldflags:
              - -X github.com/prometheus/common/version.Version=0.42.4
              - -X github.com/prometheus/common/version.Revision=45c4f39487e1653e606307d3952a6259fb96acae
              - -X github.com/prometheus/common/version.Branch=dhi
              - -X github.com/prometheus/common/version.BuildUser=dhi
