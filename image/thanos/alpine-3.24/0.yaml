    - https://dhi.io/apk/alpine/v3.24/main
    - https://dl-cdn.alpinelinux.org/alpine/v3.24/main
    - https://dl-cdn.alpinelinux.org/alpine/v3.24/community
  keyring:
    - https://dhi.io/keyring/dhi-apk@docker-0F81AD7700D99184.rsa.pub
  packages:
    - alpine-baselayout-data
    - ca-certificates-bundle
    - tzdata
  builds:
    - name: thanos
      work-dir: /go/src/github.com/thanos-io/thanos
      caches:
        - path: /go/pkg/mod
      contents:
        packages:
          - bash
          - ca-certificates-bundle
          - coreutils
          - golang-1.26
          - golang-1.26-oci-config
        files:
          - url: git+https://github.com/thanos-io/thanos.git#v0.42.4
            checksum: 45c4f39487e1653e606307d3952a6259fb96acae
            path: /go/src/github.com/thanos-io/thanos
            spdx:
              name: thanos
              version: 0.42.4
              packages:
                - name: thanos
                  purl: pkg:golang/github.com/thanos-io/thanos@0.42.4
                  license: Apache-2.0
            uid: 0
            gid: 0
      pipeline:
        - name: update go dependencies
          uses: go/bump@v2
          with:
            deps:
              - github.com/go-jose/go-jose/v4@v4.1.4
              - github.com/klauspost/compress@v1.18.7
              - go.mongodb.org/mongo-driver@v1.17.7
