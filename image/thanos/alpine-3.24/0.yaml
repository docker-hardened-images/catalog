            output: ${target.dir}/usr/local/bin/thanos
            packages: ./cmd/thanos
            tags: netgo,slicelabels
      outputs:
        - source: ${target.dir}/usr/local/bin/
          target: /usr/local/bin/
          uid: 0
          gid: 0
        - source: /opt/docker/sbom/thanos
          target: /opt/docker/sbom/thanos
          uid: 0
          gid: 0
accounts:
  run-as: nonroot
  users:
    - name: nonroot
      uid: 65532
      gid: 65532
  groups:
    - name: nonroot
      gid: 65532
      members:
        - nonroot
os-release:
