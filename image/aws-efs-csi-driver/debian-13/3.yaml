# syntax=dhi.io/build:2-debian13

name: AWS EFS CSI Driver 3.x
image: dhi.io/aws-efs-csi-driver
variant: runtime
tags:
  - "3"
  - "3.5"
  - 3.5.3
  - 3-debian
  - 3-debian13
  - 3.5-debian
  - 3.5-debian13
  - 3.5.3-debian
  - 3.5.3-debian13
platforms:
  - linux/amd64
  - linux/arm64
dates:
  release: "2026-01-20"
vars:
  EFS_UTILS_SUFFIX: ""
  FLAVORED_SUFFIX: ""
  PACKAGE_NAME: aws-efs-csi-driver-3
  SEMVER_MAJOR_MINOR_VERSION: "3.5"
  SEMVER_MAJOR_VERSION: "3"
  SEMVER_VERSION: 3.5.3
  SUFFIX: ""
  VERSION: 3.5.3-0
contents:
  repositories:
    - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
  keyring:
    - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
  packages:
    - amazon-efs-utils-3
    - aws-efs-csi-driver-3=3.5.3-0
    - base-files
    - ca-certificates-bundle
    - coreutils
    - dash
    - debianutils
    - mount
    - nfs-common
    - openssl
    - python-3.13
    - stunnel4
    - tzdata
    - util-linux
accounts:
  root: true
  run-as: nonroot
  users:
    - name: nonroot
      uid: 65532
      gid: 65532
  groups:
    - name: nonroot
      gid: 65532
      members:
        - nonroot
os-release:
  name: Docker Hardened Images (Debian)
  id: debian
  version-id: "13"
  version-codename: trixie
  pretty-name: Docker Hardened Images/Debian GNU/Linux 13 (trixie)
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
paths:
  - type: delete
    path: /etc/amazon/efs
    uid: 0
    gid: 0
  - type: symlink
    path: /etc/amazon/efs-static-files
    uid: 0
    gid: 0
    source: /usr/share/amazon-efs-utils
  - type: symlink
    path: /usr/bin/which
    uid: 0
    gid: 0
    source: /usr/bin/which.debianutils
annotations:
  org.opencontainers.image.description: A minimal AWS EFS CSI Driver image
  org.opencontainers.image.licenses: Apache-2.0
entrypoint:
  - /bin/aws-efs-csi-driver
