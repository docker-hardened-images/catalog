# syntax=dhi.io/build:2-debian13

name: AWS EFS CSI Driver 3.x (dev)
image: dhi.io/aws-efs-csi-driver
variant: dev
tags:
  - 3-dev
  - 3.5-dev
  - 3.5.4-dev
  - 3-debian-dev
  - 3-debian13-dev
  - 3.5-debian-dev
  - 3.5-debian13-dev
  - 3.5.4-debian-dev
  - 3.5.4-debian13-dev
platforms:
  - linux/amd64
  - linux/arm64
dates:
  release: "2026-01-20"
vars:
  EFS_UTILS_SUFFIX: ""
  FLAVORED_SUFFIX: -dev
  PACKAGE_NAME: aws-efs-csi-driver-3
  SEMVER_MAJOR_MINOR_VERSION: "3.5"
  SEMVER_MAJOR_VERSION: "3"
  SEMVER_VERSION: 3.5.4
  SUFFIX: -dev
  VERSION: 3.5.4-0
contents:
  repositories:
    - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
  keyring:
    - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
  packages:
    - '!gawk'
    - '!libelogind0'
    - '!original-awk'
    - amazon-efs-utils-3
    - apt
    - aws-efs-csi-driver-3-dev=3.5.4-0
    - base-files
    - bash
    - ca-certificates
    - ca-certificates-bundle
    - coreutils
    - dash
    - debianutils
    - diffutils
    - dpkg
    - findutils
    - grep
    - libc-bin
    - mawk
    - mount
    - nfs-common
    - openssl
    - perl-base
    - python-3.13
    - sed
    - stunnel4
    - tzdata
    - util-linux
accounts:
  root: true
  run-as: root
  users:
    - name: nonroot
      uid: 65532
      gid: 65532
    - name: _apt
      uid: 42
      gid: 65532
  groups:
    - name: nonroot
      gid: 65532
      members:
        - nonroot
os-release:
  name: Docker Hardened Images (Debian)
  id: debian
  version-id: "13"
  version-codename: trixie
  pretty-name: Docker Hardened Images/Debian GNU/Linux 13 (trixie)
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
environment:
  DEBIAN_FRONTEND: noninteractive
paths:
  - type: delete
    path: /etc/amazon/efs
    uid: 0
    gid: 0
  - type: symlink
    path: /etc/amazon/efs-static-files
    uid: 0
    gid: 0
    source: /usr/share/amazon-efs-utils
  - type: symlink
    path: /usr/bin/which
    uid: 0
    gid: 0
    source: /usr/bin/which.debianutils
annotations:
  org.opencontainers.image.description: A minimal AWS EFS CSI Driver image
  org.opencontainers.image.licenses: Apache-2.0
entrypoint:
  - /bin/aws-efs-csi-driver
