# syntax=dhi.io/build:2-debian13

name: AWS EFS CSI Driver 2.x
image: dhi.io/aws-efs-csi-driver
variant: runtime
tags:
  - "2"
  - "2.3"
  - 2.3.1
  - 2-debian
  - 2-debian13
  - 2.3-debian
  - 2.3-debian13
  - 2.3.1-debian
  - 2.3.1-debian13
platforms:
  - linux/amd64
  - linux/arm64
dates:
