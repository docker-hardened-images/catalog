# syntax=dhi.io/build:2-debian13

name: Webflow MCP Server 1.x (dev)
image: dhi.io/webflow-mcp
variant: dev
tags:
  - 1-dev
  - 1.0-dev
  - 1.0.0-dev
  - 1-debian-dev
  - 1-debian13-dev
  - 1.0-debian-dev
  - 1.0-debian13-dev
  - 1.0.0-debian-dev
  - 1.0.0-debian13-dev
platforms:
  - linux/amd64
  - linux/arm64
dates:
  release: "2025-09-17"
vars:
  NODEJS_MAJOR: "24"
  NODEJS_VERSION: 24.19.0-0
  SEMVER_MAJOR_MINOR_VERSION: "1.0"
  SEMVER_MAJOR_VERSION: "1"
  SEMVER_VERSION: 1.0.0
  VERSION: 1.0.0-4
contents:
  repositories:
    - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
  keyring:
    - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
  packages:
    - '!gawk'
    - '!libelogind0'
    - '!mawk'
    - '!original-awk'
    - apt
    - base-files
    - bash
    - ca-certificates
    - ca-certificates-bundle
    - coreutils
    - diffutils
    - dpkg
    - findutils
    - grep
    - libc-bin
    - libc6
    - libgomp1
    - libstdc++6
    - mawk
    - netbase
    - nodejs-24=24.19.0-0
    - perl-base
    - sed
    - tzdata
    - util-linux
    - webflow-mcp=1.0.0-4
  builds:
    - name: server.json
      contents:
        packages:
          - bash
          - sed
      pipeline:
        - runs: |
            set -eux -o pipefail

            sed -i "s/_VERSION_/1.0.0/g" "${source.dir}/config/server.json"
      paths:
        - type: file
          path: ${source.dir}/config/server.json
          uid: 0
          gid: 0
          source: image/webflow-mcp/config/server.json
      attestations:
        - predicate-type: https://modelcontextprotocol.io/server.json/v1
          source: ${source.dir}/config/server.json
accounts:
  root: true
  run-as: root
  users:
    - name: nonroot
      uid: 65532
      gid: 65532
    - name: _apt
      uid: 42
      gid: 65532
  groups:
    - name: nonroot
      gid: 65532
      members:
        - nonroot
os-release:
  name: Docker Hardened Images (Debian)
  id: debian
  version-id: "13"
  version-codename: trixie
  pretty-name: Docker Hardened Images/Debian GNU/Linux 13 (trixie)
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
work-dir: /app
environment:
  DEBIAN_FRONTEND: noninteractive
  NODE_ENV: production
paths:
  - type: symlink
    path: /app
    uid: 0
    gid: 0
    source: /usr/lib/nodejs/webflow-mcp
annotations:
  org.opencontainers.image.description: A minimal Webflow MCP Server image
  org.opencontainers.image.licenses: MIT
labels:
  io.modelcontextprotocol.server.name: io.github.webflow/mcp-server
entrypoint:
  - node
  - /app/dist/index.js
