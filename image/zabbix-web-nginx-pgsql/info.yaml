metadata:
  display-name: Zabbix Web Nginx PostgreSQL
  short-description: Zabbix web interface for PostgreSQL-backed Zabbix servers, served by Nginx and PHP-FPM.
  featured: false
  home-url: https://www.zabbix.com/
  categories:
    - monitoring-and-observability
  included-tools:
    - name: nginx
      description: Web server that serves the Zabbix frontend.
    - name: php-fpm
      description: FastCGI process manager that runs the Zabbix frontend PHP code.
    - name: psql
      description: PostgreSQL client the 6.0, 7.0 and 7.4 entrypoints use to wait for the database.
    - name: curl
      description: HTTP client for the /ping health probe.
