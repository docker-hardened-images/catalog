# syntax=dhi.io/build:2-debian13

name: Consul Dataplane 2.1.x (dev)
image: dhi.io/consul-dataplane
variant: dev
tags:
  - 2-dev
  - 2.1-dev
  - 2.1.0-dev
  - 2-debian-dev
  - 2-debian13-dev
  - 2.1-debian-dev
  - 2.1-debian13-dev
  - 2.1.0-debian-dev
  - 2.1.0-debian13-dev
platforms:
  - linux/amd64
  - linux/arm64
dates:
  release: "2026-10-22"
vars:
  ENVOY_MAJOR_MINOR_VERSION: "1.39"
  ENVOY_SUFFIX: ""
  ENVOY_VERSION: 1.39.6-3
  FLAVORED_SUFFIX: -dev
  PACKAGE_NAME: consul-dataplane-2.1
  SEMVER_MAJOR_MINOR_VERSION: "2.1"
  SEMVER_MAJOR_VERSION: "2"
  SEMVER_VERSION: 2.1.0
  SUFFIX: -dev
  TEST_CHART_VERSION: 2.1.0
  TEST_CONSUL_IMAGE: hashicorp/consul:2.1.0@sha256:259fd02f2544fe1aa03fa49efd3b105c8dd67106d710a72f5e898110266356f7
  VERSION: 2.1.0-0
contents:
  repositories:
    - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
  keyring:
    - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
  packages:
    - '!gawk'
    - '!libelogind0'
    - '!original-awk'
    - apt
    - base-files
    - bash
    - ca-certificates
    - ca-certificates-bundle
    - consul-dataplane-2.1-dev=2.1.0-0
    - coreutils
    - diffutils
    - dpkg
    - dumb-init
    - envoy-1.39=1.39.6-3
    - findutils
    - grep
    - libc-bin
    - mawk
    - perl-base
    - sed
    - tzdata
    - util-linux
  builds:
    - name: setcap
      contents:
        packages:
          - bash
          - coreutils
          - libcap2-bin
          - envoy-1.39=1.39.6-3
          - consul-dataplane-2.1-dev=2.1.0-0
      pipeline:
        - name: setcap
          runs: |
            set -eux -o pipefail

            install -d /usr/local/bin
            install -m 0755 /usr/bin/envoy /usr/local/bin/privileged-envoy
            install -m 0755 /usr/bin/consul-dataplane /usr/local/bin/privileged-consul-dataplane
            setcap cap_net_bind_service=+ep /usr/local/bin/privileged-envoy
            setcap cap_net_bind_service=+ep /usr/local/bin/privileged-consul-dataplane
            setcap -v cap_net_bind_service=+ep /usr/local/bin/privileged-envoy
            setcap -v cap_net_bind_service=+ep /usr/local/bin/privileged-consul-dataplane
      outputs:
        - source: /usr/local/bin/privileged-envoy
          target: /usr/local/bin/privileged-envoy
          uid: 0
          gid: 0
        - source: /usr/local/bin/privileged-consul-dataplane
          target: /usr/local/bin/privileged-consul-dataplane
          uid: 0
          gid: 0
accounts:
  root: true
  run-as: root
  users:
    - name: "100"
      uid: 100
      gid: 1000
    - name: _apt
      uid: 42
      gid: 65532
  groups:
    - name: consul-dataplane
      gid: 1000
      members:
        - "100"
os-release:
  name: Docker Hardened Images (Debian)
  id: debian
  version-id: "13"
  version-codename: trixie
  pretty-name: Docker Hardened Images/Debian GNU/Linux 13 (trixie)
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
environment:
  DEBIAN_FRONTEND: noninteractive
paths:
  - type: directory
    path: /usr/local/bin
    uid: 0
    gid: 0
    mode: "0755"
  - type: symlink
    path: /usr/local/bin/consul-dataplane
    uid: 0
    gid: 0
    source: /usr/bin/consul-dataplane
  - type: symlink
    path: /usr/local/bin/discover
    uid: 0
    gid: 0
    source: /usr/bin/discover
  - type: symlink
    path: /usr/local/bin/envoy
    uid: 0
    gid: 0
    source: /usr/bin/envoy
  - type: symlink
    path: /usr/local/bin/dumb-init
    uid: 0
    gid: 0
    source: /usr/bin/dumb-init
annotations:
  org.opencontainers.image.description: A minimal Consul Dataplane image
  org.opencontainers.image.licenses: MPL-2.0
entrypoint:
  - /usr/local/bin/dumb-init
  - /usr/local/bin/consul-dataplane
