# syntax=dhi.io/build:2-debian13

name: Klipper Service Load Balancer 0.x (dev)
image: dhi.io/klipper-lb
variant: dev
tags:
  - 0-dev
  - 0.4-dev
  - 0.4.17-dev
  - 0-debian-dev
  - 0-debian13-dev
  - 0.4-debian-dev
  - 0.4-debian13-dev
  - 0.4.17-debian-dev
  - 0.4.17-debian13-dev
platforms:
  - linux/amd64
  - linux/arm64
dates:
  release: "2026-04-14"
vars:
  FLAVORED_SUFFIX: -dev
  SEMVER_MAJOR_MINOR_VERSION: "0.4"
  SEMVER_MAJOR_VERSION: "0"
  SEMVER_VERSION: 0.4.17
  SUFFIX: -dev
  VERSION: 0.4.17-0
contents:
  repositories:
    - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
  keyring:
    - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
  packages:
    - '!gawk'
    - '!libelogind0'
    - '!original-awk'
    - apt
    - base-files
    - bash
    - ca-certificates
    - ca-certificates-bundle
    - coreutils
    - diffutils
    - dpkg
    - findutils
    - grep
    - iptables
    - klipper-lb=0.4.17-0
    - kmod
    - libc-bin
    - libcap2-bin
    - mawk
    - nftables
    - perl-base
    - sed
    - tzdata
    - util-linux
  builds:
    - name: klipper-lb runtime setup
      contents:
        repositories:
          - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
        keyring:
          - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
        packages:
          - bash
          - coreutils
          - libcap2-bin
          - klipper-lb=0.4.17-0
      pipeline:
        - name: setcap
          runs: |
            set -eux -o pipefail

            setcap cap_net_admin,cap_net_raw+ep /usr/lib/klipper-lb/xtables-nft-multi
            setcap cap_net_admin,cap_net_raw+ep /usr/lib/klipper-lb/xtables-legacy-multi
            touch ${target.dir}/xtables.lock
        - name: verify setcap
          runs: |
            set -eux -o pipefail

            setcap -v cap_net_admin,cap_net_raw+ep /usr/lib/klipper-lb/xtables-nft-multi
            setcap -v cap_net_admin,cap_net_raw+ep /usr/lib/klipper-lb/xtables-legacy-multi
      outputs:
        - source: /usr/lib/klipper-lb/xtables-nft-multi
          target: /usr/lib/klipper-lb/xtables-nft-multi
          uid: 0
          gid: 0
        - source: /usr/lib/klipper-lb/xtables-legacy-multi
          target: /usr/lib/klipper-lb/xtables-legacy-multi
          uid: 0
          gid: 0
        - source: ${target.dir}/xtables.lock
          target: /run/xtables.lock
          uid: 65532
          gid: 65532
accounts:
  root: true
  run-as: root
  users:
    - name: nonroot
      uid: 65532
      gid: 65532
    - name: _apt
      uid: 42
      gid: 65532
  groups:
    - name: nonroot
      gid: 65532
      members:
        - nonroot
os-release:
  name: Docker Hardened Images (Debian)
  id: debian
  version-id: "13"
  version-codename: trixie
  pretty-name: Docker Hardened Images/Debian GNU/Linux 13 (trixie)
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
environment:
  BIN_DIR: /opt/klipper-lb/bin
  DEBIAN_FRONTEND: noninteractive
  PATH: /opt/klipper-lb/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
  PAUSE_FIFO: /opt/klipper-lb/pause
paths:
  - type: directory
    path: /opt/klipper-lb
    uid: 65532
    gid: 65532
  - type: directory
    path: /opt/klipper-lb/bin
    uid: 65532
    gid: 65532
annotations:
  org.opencontainers.image.description: A minimal Klipper Service Load Balancer image
  org.opencontainers.image.licenses: Apache-2.0
entrypoint:
  - entry
