# syntax=dhi.io/build:2-debian13

name: postgres-operator 2.x
image: dhi.io/postgres-operator
variant: runtime
tags:
  - "2"
  - "2.0"
  - 2.0.3
  - 2-debian
  - 2-debian13
  - 2.0-debian
  - 2.0-debian13
  - 2.0.3-debian
  - 2.0.3-debian13
platforms:
  - linux/amd64
  - linux/arm64
dates:
  release: "2026-07-27"
vars:
  FLAVORED_SUFFIX: ""
  SEMVER_MAJOR_MINOR_VERSION: "2.0"
  SEMVER_MAJOR_VERSION: "2"
  SEMVER_VERSION: 2.0.3
  SUFFIX: ""
  VERSION: 2.0.3-1
contents:
  repositories:
    - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
  keyring:
    - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
  packages:
    - base-files
    - ca-certificates-bundle
    - postgres-operator=2.0.3-1
    - tzdata
accounts:
  run-as: nonroot
  users:
    - name: nonroot
      uid: 65532
      gid: 65532
  groups:
    - name: nonroot
      gid: 65532
      members:
        - nonroot
os-release:
  name: Docker Hardened Images (Debian)
  id: debian
  version-id: "13"
  version-codename: trixie
  pretty-name: Docker Hardened Images/Debian GNU/Linux 13 (trixie)
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
paths:
  - type: symlink
    path: /postgres-operator
    uid: 0
    gid: 0
    source: /usr/bin/postgres-operator
annotations:
  org.opencontainers.image.description: A minimal postgres-operator image
  org.opencontainers.image.licenses: MIT
entrypoint:
  - postgres-operator
ports:
  - 8080/tcp
