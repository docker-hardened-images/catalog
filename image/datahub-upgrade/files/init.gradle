// Avoid Docker Build Cloud Maven Central rate limits while preserving the
// non-Central repositories DataHub v1.6+ needs (LinkedIn Pegasus, Confluent).

def GOOGLE_MAVEN_MIRROR = 'https://maven-central.storage-download.googleapis.com/maven2/'
def PLUGIN_PORTAL = 'https://plugins.gradle.org/m2/'
def CONFLUENT_MAVEN = 'https://packages.confluent.io/maven'
def LINKEDIN_OPENSOURCE = 'https://linkedin.jfrog.io/artifactory/open-source'

def configureDhiRepositories = { RepositoryHandler repos ->
    repos.maven {
        name 'GoogleMavenCentralMirror'
        url GOOGLE_MAVEN_MIRROR
    }
    repos.maven {
        name 'ConfluentMaven'
        url CONFLUENT_MAVEN
    }
    repos.maven {
        name 'LinkedInOpenSource'
        url LINKEDIN_OPENSOURCE
    }
    repos.maven {
        name 'GradlePluginPortalNoModule'
        url PLUGIN_PORTAL
        metadataSources {
            mavenPom()
            artifact()
            ignoreGradleMetadataRedirection()
        }
    }
    repos.mavenLocal()
}

allprojects {
    buildscript {
        repositories configureDhiRepositories
    }
    repositories configureDhiRepositories
}

beforeSettings { settings ->
    settings.pluginManagement {
        repositories configureDhiRepositories
    }
}

settingsEvaluated { settings ->
    try {
        settings.dependencyResolutionManagement {
            repositories configureDhiRepositories
        }
    } catch (Throwable ignored) {
        // dependencyResolutionManagement is Gradle 6.8+ only.
    }
}
