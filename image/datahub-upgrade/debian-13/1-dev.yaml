# syntax=dhi.io/build:2-debian13

name: DataHub Upgrade 1.x (dev)
image: dhi.io/datahub-upgrade
variant: dev
tags:
  - 1-dev
  - 1.7-dev
  - 1.7.0-dev
  - 1.7.0.1-dev
  - 1-debian-dev
  - 1-debian13-dev
  - 1.7-debian-dev
  - 1.7-debian13-dev
  - 1.7.0-debian-dev
  - 1.7.0-debian13-dev
  - 1.7.0.1-debian-dev
  - 1.7.0.1-debian13-dev
platforms:
  - linux/amd64
  - linux/arm64
dates:
  release: "2025-03-17"
vars:
  FLAVORED_SUFFIX: -dev
  JAVA_FIPS_SUFFIX: ""
  JAVA_VARIANT: jdk
  JDK_MAJOR_VERSION: "21"
  KUBECTL_VERSION: 1.36.5-0
  SEMVER_MAJOR_MINOR_VERSION: "1.7"
  SEMVER_MAJOR_VERSION: "1"
  SEMVER_VERSION: 1.7.0.1
  SUFFIX: -dev
  VERSION: 1.7.0.1-6
  VERSION_MAJOR_MINOR_PATCH: 1.7.0
contents:
  repositories:
    - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
  keyring:
    - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
  packages:
    - '!gawk'
    - '!libelogind0'
    - '!mawk'
    - '!original-awk'
    - apt
    - base-files
    - bash
    - ca-certificates
    - ca-certificates-bundle
    - coreutils
    - curl
    - datahub-upgrade=1.7.0.1-6
    - diffutils
    - dpkg
    - eclipse-temurin-21-jdk
    - eclipse-temurin-21-jdk-oci-config
    - findutils
    - grep
    - kubectl-1.36-dev=1.36.5-0
    - libc-bin
    - libsnappy1v5
    - mawk
    - perl-base
    - sed
    - tzdata
    - util-linux
accounts:
  root: true
  run-as: root
  users:
    - name: datahub
      uid: 65532
      gid: 65532
    - name: _apt
      uid: 42
      gid: 65532
  groups:
    - name: datahub
      gid: 65532
      members:
        - datahub
os-release:
  name: Docker Hardened Images (Debian)
  id: debian
  version-id: "13"
  version-codename: trixie
  pretty-name: Docker Hardened Images/Debian GNU/Linux 13 (trixie)
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
work-dir: /datahub/datahub-upgrade
environment:
  DEBIAN_FRONTEND: noninteractive
  JAVA_HOME: /usr/lib/jvm/temurin-21
  JAVA_OPTS: ""
  JMX_OPTS: ""
  LD_LIBRARY_PATH: /lib:/lib64
  OTEL_EXPORTER_OTLP_HTTP_COMPRESSION: gzip
  OTEL_EXPORTER_OTLP_HTTP_HTTP2_MAX_FRAME_SIZE: "8388608"
  OTEL_EXPORTER_OTLP_MAX_PAYLOAD_SIZE: "4194304"
  OTEL_EXPORTER_OTLP_TRACES_COMPRESSION: gzip
  PATH: /usr/lib/jvm/temurin-21/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
paths:
  - type: directory
    path: /datahub
    uid: 65532
    gid: 65532
    mode: "0755"
  - type: symlink
    path: /datahub/datahub-upgrade
    uid: 0
    gid: 0
    source: /usr/lib/datahub-upgrade
  - type: symlink
    path: /datahub/datahub-gms
    uid: 0
    gid: 0
    source: /usr/share/datahub-gms
  - type: directory
    path: /usr/local/lib/datahub
    uid: 65532
    gid: 65532
    mode: "0755"
  - type: symlink
    path: /usr/local/lib/datahub/wait_for_deps.sh
    uid: 0
    gid: 0
    source: /usr/lib/datahub/wait_for_deps.sh
  - type: directory
    path: /usr/local/bin
    uid: 0
    gid: 0
  - type: symlink
    path: /usr/local/bin/java
    uid: 0
    gid: 0
    source: /usr/bin/java
  - type: directory
    path: /home/datahub
    uid: 65532
    gid: 65532
    mode: "0755"
annotations:
  org.opencontainers.image.description: A minimal DataHub Upgrade image
  org.opencontainers.image.licenses: Apache-2.0
entrypoint:
  - /datahub/datahub-upgrade/scripts/start.sh
