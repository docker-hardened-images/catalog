# syntax=dhi.io/build:2-alpine3.24

name: LiteLLM Database 1.95.x
image: dhi.io/litellm-database
variant: runtime
tags:
  - 1.95-alpine
  - 1.95.1-alpine
  - 1.95-alpine3.24
  - 1.95.1-alpine3.24
platforms:
  - linux/amd64
  - linux/arm64
dates:
  release: "2026-08-11"
vars:
  PRISMA_BINARY_PLATFORM: '#{ target.arch == "amd64" ? "linux-musl-openssl-3.0.x" : "linux-musl-arm64-openssl-3.0.x" }'
  PRISMA_QUERY_ENGINE_SOURCE: '#{ target.arch == "amd64" ? "query-engine-linux-musl-openssl-3.0.x" : "query-engine-linux-musl-arm64-openssl-3.0.x" }'
  SEMVER_MAJOR_MINOR_VERSION: "1.95"
  SEMVER_MAJOR_VERSION: "1"
  SEMVER_VERSION: 1.95.1
  VERSION: 1.95.1-r1
contents:
  repositories:
    - https://dhi.io/apk/alpine/v3.24/main
    - https://dl-cdn.alpinelinux.org/alpine/v3.24/main
    - https://dl-cdn.alpinelinux.org/alpine/v3.24/community
  keyring:
    - https://dhi.io/keyring/dhi-apk@docker-0F81AD7700D99184.rsa.pub
  packages:
    - alpine-baselayout-data
    - bash
    - ca-certificates-bundle
    - coreutils
    - libsndfile
    - libstdc++
    - litellm-database-1.95=1.95.1-r1
    - nodejs-24
    - openssl
    - python-3.13
    - tzdata
accounts:
  run-as: nonroot
  users:
    - name: nonroot
      uid: 65532
      gid: 65532
  groups:
    - name: nonroot
      gid: 65532
      members:
        - nonroot
os-release:
  name: Docker Hardened Images (Alpine)
  id: alpine
  version-id: "3.24"
  pretty-name: Docker Hardened Images/Alpine Linux v3.24
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
work-dir: /app
environment:
  PATH: /app/.venv/bin:/usr/local/bin:/usr/local/sbin:/usr/sbin:/usr/bin:/sbin:/bin
  PRISMA_BINARY_CACHE_DIR: /opt/prisma/binaries
  PRISMA_BINARY_PLATFORM: ${PRISMA_BINARY_PLATFORM}
  PRISMA_CLI_PATH: /opt/prisma/binaries/node_modules/.bin/prisma
  PRISMA_CLI_QUERY_ENGINE_TYPE: binary
  PRISMA_OFFLINE_MODE: "true"
  PRISMA_QUERY_ENGINE_BINARY: /opt/prisma/binaries/node_modules/prisma/query-engine-dhi
paths:
  - type: directory
    path: /app
    uid: 0
    gid: 0
    mode: "0755"
  - type: symlink
    path: /usr/lib/libsndfile.so
    uid: 0
    gid: 0
    source: libsndfile.so.1
  - type: symlink
    path: /opt/prisma/binaries/node_modules/prisma/query-engine-dhi
    uid: 0
    gid: 0
    source: ${PRISMA_QUERY_ENGINE_SOURCE}
annotations:
  org.opencontainers.image.description: A minimal LiteLLM Database image
  org.opencontainers.image.licenses: MIT AND LicenseRef-Proprietary
entrypoint:
  - /app/docker/prod_entrypoint.sh
cmd:
  - --port
  - "4000"
ports:
  - 4000/tcp
