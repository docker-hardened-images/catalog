# syntax=dhi.io/build:2-debian13

name: LiteLLM Database 1.94.x (dev)
image: dhi.io/litellm-database
variant: dev
tags:
  - 1-dev
  - 1.94-dev
  - 1.94.2-dev
  - 1-debian-dev
  - 1-debian13-dev
  - 1.94-debian-dev
  - 1.94-debian13-dev
  - 1.94.2-debian-dev
  - 1.94.2-debian13-dev
platforms:
  - linux/amd64
  - linux/arm64
dates:
  release: "2026-07-28"
vars:
  ARCH_TRIPLET: '#{ target.arch == "amd64" ? "x86_64-linux-gnu" : "aarch64-linux-gnu" }'
  PRISMA_QUERY_ENGINE_SOURCE: '#{ target.arch == "amd64" ? "query-engine-debian-openssl-3.0.x" : "query-engine-linux-arm64-openssl-3.0.x" }'
  SEMVER_MAJOR_MINOR_VERSION: "1.94"
  SEMVER_MAJOR_VERSION: "1"
  SEMVER_VERSION: 1.94.2
  VERSION: 1.94.2-1
contents:
  repositories:
    - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
  keyring:
    - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
  packages:
    - '!gawk'
    - '!libelogind0'
    - '!mawk'
    - '!original-awk'
    - apt
    - base-files
    - bash
    - ca-certificates
    - ca-certificates-bundle
    - coreutils
    - diffutils
    - dpkg
    - findutils
    - grep
    - libc-bin
    - libsndfile1
    - libssl3t64
    - libstdc++6
    - litellm-database=1.94.2-1
    - mawk
    - nodejs-24
    - perl-base
    - python-3.13
    - sed
    - tzdata
    - util-linux
accounts:
  root: true
  run-as: root
  users:
    - name: nonroot
      uid: 65532
      gid: 65532
    - name: _apt
      uid: 42
      gid: 65532
  groups:
    - name: nonroot
      gid: 65532
      members:
        - nonroot
os-release:
  name: Docker Hardened Images (Debian)
  id: debian
  version-id: "13"
  version-codename: trixie
  pretty-name: Docker Hardened Images/Debian GNU/Linux 13 (trixie)
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
work-dir: /app
environment:
  DEBIAN_FRONTEND: noninteractive
  PATH: /app/.venv/bin:/usr/local/bin:/usr/local/sbin:/usr/sbin:/usr/bin:/sbin:/bin
  PRISMA_BINARY_CACHE_DIR: /opt/prisma/binaries
  PRISMA_CLI_PATH: /opt/prisma/binaries/node_modules/.bin/prisma
  PRISMA_CLI_QUERY_ENGINE_TYPE: binary
  PRISMA_OFFLINE_MODE: "true"
  PRISMA_QUERY_ENGINE_BINARY: /opt/prisma/binaries/node_modules/prisma/query-engine-dhi
paths:
  - type: directory
    path: /app
    uid: 0
    gid: 0
    mode: "0755"
  - type: symlink
    path: /usr/lib/${ARCH_TRIPLET}/libsndfile.so
    uid: 0
    gid: 0
    source: libsndfile.so.1
  - type: symlink
    path: /opt/prisma/binaries/node_modules/prisma/query-engine-dhi
    uid: 0
    gid: 0
    source: ${PRISMA_QUERY_ENGINE_SOURCE}
annotations:
  org.opencontainers.image.description: A minimal LiteLLM Database image
  org.opencontainers.image.licenses: MIT AND LicenseRef-Proprietary
entrypoint:
  - /app/docker/prod_entrypoint.sh
cmd:
  - --port
  - "4000"
ports:
  - 4000/tcp
