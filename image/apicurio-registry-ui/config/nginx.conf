worker_processes auto;
error_log /var/log/nginx/error.log;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    proxy_temp_path /tmp/proxy_temp;
    client_body_temp_path /tmp/client_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';

    access_log  /var/log/nginx/access.log  main;

    sendfile            on;
    tcp_nopush          on;
    tcp_nodelay         on;
    keepalive_timeout   65;
    types_hash_max_size 4096;

    include             /etc/nginx/mime.types;
    default_type        application/octet-stream;

    include /opt/app-root/etc/nginx.d/*.conf;

    server {
        listen       8080 default_server;
        server_name  _;
        root         /usr/share/apicurio-registry-ui;

        include /opt/app-root/etc/nginx.default.d/*.conf;

        # config.js and index.html are generated at start under
        # /var/lib/apicurio-registry-ui; the web root is read-only.
        location = /config.js {
            root /var/lib/apicurio-registry-ui;
            expires -1;
            add_header Cache-Control "no-cache";
        }

        location = /index.html {
            root /var/lib/apicurio-registry-ui;
        }

        location = /editors {
            return 301 $scheme://$http_host/editors/;
        }

        location / {
            try_files $uri $uri/ /index.html;
        }
    }

    server {
        listen       1337 ssl;
        http2        on;
        server_name  _;
        root         /usr/share/apicurio-registry-ui;

        ssl_certificate "/etc/pki/nginx/server.crt";
        ssl_certificate_key "/etc/pki/nginx/private/server.key";
        ssl_session_cache shared:SSL:1m;
        ssl_session_timeout  10m;
        ssl_prefer_server_ciphers on;

        include /opt/app-root/etc/nginx.default.d/*.conf;

        location = /config.js {
            root /var/lib/apicurio-registry-ui;
            expires -1;
            add_header Cache-Control "no-cache";
        }

        location = /index.html {
            root /var/lib/apicurio-registry-ui;
        }

        location = /editors {
            return 301 $scheme://$http_host/editors/;
        }

        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}
