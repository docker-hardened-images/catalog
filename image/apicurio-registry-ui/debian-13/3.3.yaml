# syntax=dhi.io/build:2-debian13

name: Apicurio Registry UI 3.3.x
image: dhi.io/apicurio-registry-ui
variant: runtime
tags:
  - "3"
  - "3.3"
  - 3.3.5
  - 3-debian
  - 3-debian13
  - 3.3-debian
  - 3.3-debian13
  - 3.3.5-debian
  - 3.3.5-debian13
platforms:
  - linux/amd64
  - linux/arm64
dates:
  release: "2026-06-08"
vars:
  PACKAGE_NAME: apicurio-registry-ui-3.3
  SEMVER_MAJOR_MINOR_VERSION: "3.3"
  SEMVER_MAJOR_VERSION: "3"
  SEMVER_VERSION: 3.3.5
  VERSION: 3.3.5-2
contents:
  repositories:
    - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
  keyring:
    - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
  packages:
    - '!libelogind0'
    - '!mawk'
    - '!original-awk'
    - apicurio-registry-ui-3.3=3.3.5-2
    - base-files
    - ca-certificates
    - ca-certificates-bundle
    - coreutils
    - dash
    - libc6
    - libcrypt1
    - libgcc-s1
    - libpcre2-8-0
    - libssl3t64
    - libstdc++6
    - nginx-stable
    - nodejs-24
    - openssl
    - tzdata
    - zlib1g
  builds:
    - name: writable-dirs
      contents:
        packages:
          - bash
          - coreutils
      pipeline:
        - name: create the writable directories
          runs: |
            set -eux -o pipefail

            install -d -o 65532 -g 0 -m 0770 \
              ${target.dir}/var/lib/apicurio-registry-ui \
              ${target.dir}/etc/pki/nginx \
              ${target.dir}/etc/pki/nginx/private
      outputs:
        - source: ${target.dir}/var/lib
          target: /var/lib
          uid: 0
          gid: 0
        - source: ${target.dir}/etc/pki
          target: /etc/pki
          uid: 0
          gid: 0
accounts:
  run-as: nginx
  users:
    - name: nginx
      uid: 65532
      gid: 65532
  groups:
    - name: nginx
      gid: 65532
      members:
        - nginx
os-release:
  name: Docker Hardened Images (Debian)
  id: debian
  version-id: "13"
  version-codename: trixie
  pretty-name: Docker Hardened Images/Debian GNU/Linux 13 (trixie)
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
work-dir: /opt/app-root/src
stop-signal: SIGQUIT
paths:
  - type: directory
    path: /usr/share/apicurio-registry-ui
    uid: 0
    gid: 0
    mode: "0755"
  - type: directory
    path: /opt/app-root
    uid: 0
    gid: 0
    mode: "0755"
  - type: symlink
    path: /opt/app-root/src
    uid: 0
    gid: 0
    source: /usr/share/apicurio-registry-ui
  - type: directory
    path: /opt/app-root/etc
    uid: 0
    gid: 0
    mode: "0755"
  - type: directory
    path: /opt/app-root/etc/nginx.d
    uid: 0
    gid: 0
    mode: "0755"
  - type: directory
    path: /opt/app-root/etc/nginx.default.d
    uid: 0
    gid: 0
    mode: "0755"
  - type: file
    path: /etc/nginx/nginx.conf
    uid: 0
    gid: 0
    mode: "0644"
    source: image/apicurio-registry-ui/config/nginx.conf
  - type: symlink
    path: /var/log/nginx/access.log
    uid: 0
    gid: 0
    source: /dev/stdout
  - type: symlink
    path: /var/log/nginx/error.log
    uid: 0
    gid: 0
    source: /dev/stderr
  - type: file
    path: /usr/local/bin/entrypoint.sh
    uid: 0
    gid: 0
    mode: "0755"
    source: image/apicurio-registry-ui/bin/entrypoint.sh
  - type: symlink
    path: /usr/local/bin/create-config.cjs
    uid: 0
    gid: 0
    source: /usr/lib/apicurio-registry-ui/create-config.cjs
  - type: symlink
    path: /usr/local/bin/update-base-href.cjs
    uid: 0
    gid: 0
    source: /usr/lib/apicurio-registry-ui/update-base-href.cjs
annotations:
  org.opencontainers.image.description: A minimal Apicurio Registry UI image
  org.opencontainers.image.licenses: Apache-2.0
entrypoint:
  - /usr/local/bin/entrypoint.sh
cmd:
  - nginx
  - -g
  - daemon off;
ports:
  - 8080/tcp
  - 1337/tcp
