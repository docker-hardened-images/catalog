# syntax=dhi.io/build:2-alpine3.24

name: Apicurio Registry UI 3.3.x (dev)
image: dhi.io/apicurio-registry-ui
variant: dev
tags:
  - 3-alpine-dev
  - 3.3-alpine-dev
  - 3-alpine3.24-dev
  - 3.3.5-alpine-dev
  - 3.3-alpine3.24-dev
  - 3.3.5-alpine3.24-dev
platforms:
  - linux/amd64
  - linux/arm64
dates:
  release: "2026-06-08"
vars:
  PACKAGE_NAME: apicurio-registry-ui-3.3
  SEMVER_MAJOR_MINOR_VERSION: "3.3"
  SEMVER_MAJOR_VERSION: "3"
  SEMVER_VERSION: 3.3.5
  VERSION: 3.3.5-r1
contents:
  repositories:
    - https://dhi.io/apk/alpine/v3.24/main
    - https://dl-cdn.alpinelinux.org/alpine/v3.24/main
    - https://dl-cdn.alpinelinux.org/alpine/v3.24/community
  keyring:
    - https://dhi.io/keyring/dhi-apk@docker-0F81AD7700D99184.rsa.pub
  packages:
    - alpine-baselayout-data
    - apicurio-registry-ui-3.3=3.3.5-r1
    - apk-tools
    - bash
    - busybox
    - ca-certificates
    - ca-certificates-bundle
    - coreutils
    - findutils
    - libcrypto3
    - libgcc
    - libssl3
    - libstdc++
    - musl
    - nginx-stable
    - nodejs-24
    - openssl
    - pcre2
    - tzdata
    - zlib
  builds:
    - name: writable-dirs
      contents:
        packages:
          - bash
          - busybox
      pipeline:
        - name: create the writable directories
          runs: |
            set -eux -o pipefail

            install -d -o 65532 -g 0 -m 0770 \
              ${target.dir}/var/lib/apicurio-registry-ui \
              ${target.dir}/etc/pki/nginx \
              ${target.dir}/etc/pki/nginx/private
      outputs:
        - source: ${target.dir}/var/lib
          target: /var/lib
          uid: 0
          gid: 0
        - source: ${target.dir}/etc/pki
          target: /etc/pki
          uid: 0
          gid: 0
accounts:
  root: true
  run-as: root
  users:
    - name: nginx
      uid: 65532
      gid: 65532
    - name: nginx
      uid: 65532
      gid: 65532
  groups:
    - name: nginx
      gid: 65532
      members:
        - nginx
    - name: nginx
      gid: 65532
      members:
        - nginx
os-release:
  name: Docker Hardened Images (Alpine)
  id: alpine
  version-id: "3.24"
  pretty-name: Docker Hardened Images/Alpine Linux v3.24
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
work-dir: /opt/app-root/src
stop-signal: SIGQUIT
paths:
  - type: directory
    path: /usr/share/apicurio-registry-ui
    uid: 0
    gid: 0
    mode: "0755"
  - type: directory
    path: /opt/app-root
    uid: 0
    gid: 0
    mode: "0755"
  - type: symlink
    path: /opt/app-root/src
    uid: 0
    gid: 0
    source: /usr/share/apicurio-registry-ui
  - type: directory
    path: /opt/app-root/etc
    uid: 0
    gid: 0
    mode: "0755"
  - type: directory
    path: /opt/app-root/etc/nginx.d
    uid: 0
    gid: 0
    mode: "0755"
  - type: directory
    path: /opt/app-root/etc/nginx.default.d
    uid: 0
    gid: 0
    mode: "0755"
  - type: file
    path: /etc/nginx/nginx.conf
    uid: 0
    gid: 0
    mode: "0644"
    source: image/apicurio-registry-ui/config/nginx.conf
  - type: symlink
    path: /var/log/nginx/access.log
    uid: 0
    gid: 0
    source: /dev/stdout
  - type: symlink
    path: /var/log/nginx/error.log
    uid: 0
    gid: 0
    source: /dev/stderr
  - type: file
    path: /usr/local/bin/entrypoint.sh
    uid: 0
    gid: 0
    mode: "0755"
    source: image/apicurio-registry-ui/bin/entrypoint.sh
  - type: symlink
    path: /usr/local/bin/create-config.cjs
    uid: 0
    gid: 0
    source: /usr/lib/apicurio-registry-ui/create-config.cjs
  - type: symlink
    path: /usr/local/bin/update-base-href.cjs
    uid: 0
    gid: 0
    source: /usr/lib/apicurio-registry-ui/update-base-href.cjs
  - type: directory
    path: /var/lib/nginx
    uid: 0
    gid: 0
    mode: "0755"
annotations:
  org.opencontainers.image.description: A minimal Apicurio Registry UI image
  org.opencontainers.image.licenses: Apache-2.0
entrypoint:
  - /usr/local/bin/entrypoint.sh
cmd:
  - nginx
  - -g
  - daemon off;
ports:
  - 8080/tcp
  - 1337/tcp
