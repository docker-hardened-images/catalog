metadata:
  display-name: AWS for Fluent Bit
  short-description: AWS for Fluent Bit is the AWS distribution of Fluent Bit, bundled with the CloudWatch Logs, Kinesis Data Streams and Kinesis Data Firehose output plugins.
  featured: false
  home-url: https://github.com/aws/aws-for-fluent-bit
  categories:
    - monitoring-and-observability
  included-tools:
    - name: fluent-bit
      description: Fluent Bit log processor and forwarder.
    - name: cloudwatch
      description: Amazon CloudWatch Logs output plugin, loaded from /fluent-bit/cloudwatch.so.
    - name: kinesis
      description: Amazon Kinesis Data Streams output plugin, loaded from /fluent-bit/kinesis.so.
    - name: firehose
      description: Amazon Kinesis Data Firehose output plugin, loaded from /fluent-bit/firehose.so.
