# syntax=dhi.io/build:2-debian13

name: SendGrid Python 6.x
image: dhi.io/sendgrid-python
variant: runtime
tags:
  - "6"
  - "6.12"
  - 6.12.5
  - 6-debian
  - 6-debian13
  - 6.12-debian
  - 6.12-debian13
  - 6.12.5-debian
  - 6.12.5-debian13
platforms:
  - linux/amd64
  - linux/arm64
dates:
  release: "2026-09-02"
vars:
  SEMVER_MAJOR_MINOR_VERSION: "6.12"
  SEMVER_MAJOR_VERSION: "6"
  SEMVER_VERSION: 6.12.5
  VERSION: 6.12.5-12
contents:
  repositories:
    - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
  keyring:
    - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
  packages:
    - '!libelogind0'
    - '!mawk'
    - '!original-awk'
    - base-files
    - ca-certificates
    - ca-certificates-bundle
    - libffi8
    - libgcc-s1
    - libssl3t64
    - libstdc++6
    - python-3.14
    - sendgrid-python=6.12.5-12
    - tzdata
accounts:
  run-as: nonroot
  users:
    - name: nonroot
      uid: 65532
      gid: 65532
  groups:
    - name: nonroot
      gid: 65532
      members:
        - nonroot
os-release:
  name: Docker Hardened Images (Debian)
  id: debian
  version-id: "13"
  version-codename: trixie
  pretty-name: Docker Hardened Images/Debian GNU/Linux 13 (trixie)
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
environment:
  PATH: /usr/lib/sendgrid-python/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
annotations:
  org.opencontainers.image.description: A minimal SendGrid Python library image
  org.opencontainers.image.licenses: MIT
entrypoint:
  - /usr/lib/sendgrid-python/bin/python3
cmd:
  - -c
  - import sendgrid; print("sendgrid", sendgrid.__version__)
