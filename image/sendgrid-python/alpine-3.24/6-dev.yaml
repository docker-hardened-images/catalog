# syntax=dhi.io/build:2-alpine3.24

name: SendGrid Python 6.x (dev)
image: dhi.io/sendgrid-python
variant: dev
tags:
  - 6-alpine-dev
  - 6.12-alpine-dev
  - 6-alpine3.24-dev
  - 6.12.5-alpine-dev
  - 6.12-alpine3.24-dev
  - 6.12.5-alpine3.24-dev
platforms:
  - linux/amd64
  - linux/arm64
dates:
  release: "2026-09-02"
vars:
  FLAVORED_SUFFIX: -dev
  SEMVER_MAJOR_MINOR_VERSION: "6.12"
  SEMVER_MAJOR_VERSION: "6"
  SEMVER_VERSION: 6.12.5
  SUFFIX: -dev
  VERSION: 6.12.5-r12
contents:
  repositories:
    - https://dhi.io/apk/alpine/v3.24/main
    - https://dl-cdn.alpinelinux.org/alpine/v3.24/main
    - https://dl-cdn.alpinelinux.org/alpine/v3.24/community
  keyring:
    - https://dhi.io/keyring/dhi-apk@docker-0F81AD7700D99184.rsa.pub
  packages:
    - alpine-baselayout-data
    - apk-tools
    - bash
    - busybox
    - ca-certificates
    - ca-certificates-bundle
    - coreutils
    - findutils
    - libffi
    - libgcc
    - libstdc++
    - musl-utils
    - python-3.14
    - sendgrid-python=6.12.5-r12
    - tzdata
accounts:
  root: true
  run-as: root
  users:
    - name: nonroot
      uid: 65532
      gid: 65532
  groups:
    - name: nonroot
      gid: 65532
      members:
        - nonroot
os-release:
  name: Docker Hardened Images (Alpine)
  id: alpine
  version-id: "3.24"
  pretty-name: Docker Hardened Images/Alpine Linux v3.24
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
environment:
  PATH: /usr/lib/sendgrid-python/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
annotations:
  org.opencontainers.image.description: A minimal SendGrid Python library image
  org.opencontainers.image.licenses: MIT
entrypoint:
  - /usr/lib/sendgrid-python/bin/python3
cmd:
  - -c
  - import sendgrid; print("sendgrid", sendgrid.__version__)
