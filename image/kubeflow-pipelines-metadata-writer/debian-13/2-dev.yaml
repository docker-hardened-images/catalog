# syntax=dhi.io/build:2-debian13

name: Kubeflow Pipelines - Metadata Writer 2.17.x (dev)
image: dhi.io/kubeflow-pipelines-metadata-writer
variant: dev
tags:
  - 2-dev
  - 2.17-dev
  - 2.17.0-dev
  - 2-debian-dev
  - 2-debian13-dev
  - 2.17-debian-dev
  - 2.17-debian13-dev
  - 2.17.0-debian-dev
  - 2.17.0-debian13-dev
platforms:
  - linux/amd64
vars:
  SEMVER_MAJOR_MINOR_VERSION: "2.17"
  SEMVER_MAJOR_VERSION: "2"
  SEMVER_VERSION: 2.17.0
  VERSION: 2.17.0-2
contents:
  repositories:
    - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
  keyring:
    - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
  packages:
    - '!gawk'
    - '!libelogind0'
    - '!original-awk'
    - apt
    - base-files
    - bash
    - ca-certificates
    - ca-certificates-bundle
    - coreutils
    - diffutils
    - dpkg
    - findutils
    - grep
    - kubeflow-pipelines-metadata-writer=2.17.0-2
    - libc-bin
    - libstdc++6
    - mawk
    - perl-base
    - python-3.11
    - sed
    - tzdata
    - util-linux
accounts:
  root: true
  run-as: root
  users:
    - name: nonroot
      uid: 65532
      gid: 65532
    - name: _apt
      uid: 42
      gid: 65532
  groups:
    - name: nonroot
      gid: 65532
      members:
        - nonroot
os-release:
  name: Docker Hardened Images (Debian)
  id: debian
  version-id: "13"
  version-codename: trixie
  pretty-name: Docker Hardened Images/Debian GNU/Linux 13 (trixie)
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
environment:
  DEBIAN_FRONTEND: noninteractive
  PYTHONUNBUFFERED: "1"
paths:
  - type: symlink
    path: /app
    uid: 0
    gid: 0
    source: /usr/lib/kubeflow-pipelines-metadata-writer
annotations:
  org.opencontainers.image.description: A minimal Kubeflow Pipelines metadata writer image
  org.opencontainers.image.licenses: Apache-2.0
entrypoint:
  - /app/.venv/bin/python3
  - /app/metadata_writer.py
