# syntax=dhi.io/build:2-debian13

name: Kubeflow Pipelines - Metadata Writer 2.17.x
image: dhi.io/kubeflow-pipelines-metadata-writer
variant: runtime
tags:
  - "2"
  - "2.17"
  - 2.17.0
  - 2-debian
  - 2-debian13
  - 2.17-debian
  - 2.17-debian13
  - 2.17.0-debian
  - 2.17.0-debian13
platforms:
  - linux/amd64
vars:
  SEMVER_MAJOR_MINOR_VERSION: "2.17"
  SEMVER_MAJOR_VERSION: "2"
  SEMVER_VERSION: 2.17.0
  VERSION: 2.17.0-3
contents:
  repositories:
    - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
  keyring:
    - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
  packages:
    - base-files
    - ca-certificates-bundle
    - kubeflow-pipelines-metadata-writer=2.17.0-3
    - libstdc++6
    - python-3.11
    - tzdata
accounts:
  run-as: nonroot
  users:
    - name: nonroot
      uid: 65532
      gid: 65532
  groups:
    - name: nonroot
      gid: 65532
      members:
        - nonroot
os-release:
  name: Docker Hardened Images (Debian)
  id: debian
  version-id: "13"
  version-codename: trixie
  pretty-name: Docker Hardened Images/Debian GNU/Linux 13 (trixie)
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
environment:
  PYTHONUNBUFFERED: "1"
paths:
  - type: symlink
    path: /app
    uid: 0
    gid: 0
    source: /usr/lib/kubeflow-pipelines-metadata-writer
annotations:
  org.opencontainers.image.description: A minimal Kubeflow Pipelines metadata writer image
  org.opencontainers.image.licenses: Apache-2.0
entrypoint:
  - /app/.venv/bin/python3
  - /app/metadata_writer.py
