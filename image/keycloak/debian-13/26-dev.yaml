# syntax=dhi.io/build:2-debian13

name: Keycloak 26.x (dev)
image: dhi.io/keycloak
variant: dev
tags:
  - 26-dev
  - 26.8-dev
  - 26.8.2-dev
  - 26-debian-dev
  - 26-debian13-dev
  - 26.8-debian-dev
  - 26.8-debian13-dev
  - 26.8.2-debian-dev
  - 26.8.2-debian13-dev
platforms:
  - linux/amd64
  - linux/arm64
dates:
  release: "2025-09-30"
vars:
  JAVA_FIPS_SUFFIX: ""
  JAVA_VARIANT: jdk
  JDK_MAJOR_VERSION: "21"
  PACKAGE_FIPS_SUFFIX: ""
  SEMVER_MAJOR_MINOR_VERSION: "26.8"
  SEMVER_MAJOR_VERSION: "26"
  SEMVER_VERSION: 26.8.2
  VERSION: 26.8.2-8
contents:
  repositories:
    - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
  keyring:
    - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
  packages:
    - '!gawk'
    - '!libelogind0'
    - '!mawk'
    - '!original-awk'
    - apt
    - base-files
    - bash
    - ca-certificates
    - coreutils
    - diffutils
    - dpkg
    - eclipse-temurin-21-jdk
    - eclipse-temurin-21-jdk-oci-config
    - eclipse-temurin-21-jre
    - eclipse-temurin-21-jre-oci-config
    - findutils
    - grep
    - keycloak-26=26.8.2-8
    - libc-bin
    - mawk
    - perl-base
    - sed
    - util-linux
  builds:
    - name: keycloak writable lib
      contents:
        packages:
          - bash
          - coreutils
          - keycloak-26=26.8.2-8
      pipeline:
        - name: make lib/quarkus writable for the keycloak user
          runs: |
            set -eux -o pipefail

            chmod -R u+rwX,g+rX,o+rX /usr/share/keycloak/lib/quarkus
            chown -R 65532:65532 /usr/share/keycloak/lib/quarkus
      outputs:
        - source: /usr/share/keycloak/lib/quarkus
          target: /usr/share/keycloak/lib/quarkus
          uid: 0
          gid: 0
    - name: locale
      contents:
        packages:
          - bash
          - locales
          - coreutils
          - gzip
      pipeline:
        - name: install locales
          runs: |
            set -eux -o pipefail

            ln -s /etc/locale.alias /usr/share/locale/locale.alias

            echo "en_US.UTF-8 UTF-8" >> /etc/locale.gen
            locale-gen en_US.UTF-8
      outputs:
        - source: /usr/share/locale
          target: /usr/share/locale
          uid: 0
          gid: 0
        - source: /usr/lib/locale
          target: /usr/lib/locale
          uid: 0
          gid: 0
accounts:
  root: true
  run-as: root
  users:
    - name: nonroot
      uid: 65532
      gid: 65532
    - name: _apt
      uid: 42
      gid: 65532
  groups:
    - name: nonroot
      gid: 65532
      members:
        - nonroot
os-release:
  name: Docker Hardened Images (Debian)
  id: debian
  version-id: "13"
  version-codename: trixie
  pretty-name: Docker Hardened Images/Debian GNU/Linux 13 (trixie)
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
environment:
  DEBIAN_FRONTEND: noninteractive
  KC_RUN_IN_CONTAINER: "true"
  LANG: en_US.UTF-8
  LANGUAGE: en_US:en
  LC_ALL: en_US.UTF-8
paths:
  - type: directory
    path: /opt
    uid: 0
    gid: 0
  - type: symlink
    path: /opt/keycloak
    uid: 0
    gid: 0
    source: /usr/share/keycloak
  - type: directory
    path: /usr/share/keycloak/data
    uid: 65532
    gid: 65532
    mode: "0755"
  - type: directory
    path: /usr/share/keycloak/data/tmp
    uid: 65532
    gid: 65532
    mode: "0744"
  - type: directory
    path: /usr/share/keycloak/lib
    uid: 65532
    gid: 65532
    mode: "0755"
  - type: directory
    path: /usr/share/keycloak/lib/quarkus
    uid: 65532
    gid: 65532
    mode: "0755"
annotations:
  org.opencontainers.image.description: A minimal Keycloak image
  org.opencontainers.image.licenses: Apache-2.0
entrypoint:
  - /opt/keycloak/bin/kc.sh
cmd:
  - start
  - --optimized
ports:
  - 8080/tcp
  - 8443/tcp
  - 9000/tcp
