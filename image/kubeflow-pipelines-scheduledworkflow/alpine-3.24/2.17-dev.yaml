# syntax=dhi.io/build:2-alpine3.24

name: Kubeflow Pipelines Scheduled Workflow Controller 2.17.x (dev)
image: dhi.io/kubeflow-pipelines-scheduledworkflow
variant: dev
tags:
  - 2.17-alpine-dev
  - 2.17.3-alpine-dev
  - 2.17-alpine3.24-dev
  - 2.17.3-alpine3.24-dev
platforms:
  - linux/amd64
  - linux/arm64
dates:
  release: "2026-07-09"
vars:
  CONTROLLER_MULTIUSER: ""
  FLAVORED_SUFFIX: -dev
  SEMVER_MAJOR_MINOR_VERSION: "2.17"
  SEMVER_MAJOR_VERSION: "2"
  SEMVER_VERSION: 2.17.3
  SUFFIX: -dev
  VERSION: 2.17.3-r0
contents:
  repositories:
    - https://dhi.io/apk/alpine/v3.24/main
    - https://dl-cdn.alpinelinux.org/alpine/v3.24/main
    - https://dl-cdn.alpinelinux.org/alpine/v3.24/community
  keyring:
    - https://dhi.io/keyring/dhi-apk@docker-0F81AD7700D99184.rsa.pub
  packages:
    - alpine-baselayout-data
    - apk-tools
    - bash
    - busybox
    - busybox-binsh
    - ca-certificates
    - ca-certificates-bundle
    - coreutils
    - findutils
    - kubeflow-pipelines-scheduledworkflow-2.17-dev=2.17.3-r0
    - tzdata
accounts:
  root: true
  run-as: root
  users:
    - name: nonroot
      uid: 65532
      gid: 65532
  groups:
    - name: nonroot
      gid: 65532
      members:
        - nonroot
os-release:
  name: Docker Hardened Images (Alpine)
  id: alpine
  version-id: "3.24"
  pretty-name: Docker Hardened Images/Alpine Linux v3.24
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
work-dir: /bin
environment:
  LOG_LEVEL: info
paths:
  - type: symlink
    path: /bin/controller
    uid: 0
    gid: 0
    source: /usr/bin/scheduledworkflow
annotations:
  org.opencontainers.image.description: A minimal Kubeflow Pipelines Scheduled Workflow Controller image
  org.opencontainers.image.licenses: Apache-2.0
cmd:
  - /bin/sh
  - -c
  - exec /bin/controller --logtostderr=true  --namespace=${NAMESPACE} --logLevel=${LOG_LEVEL} --clientQPS=${CLIENT_QPS:-5} --clientBurst=${CLIENT_BURST:-10} --recurringRunResyncIntervalSeconds=${RESYNC_INTERVAL_SECONDS:-30} --metricsPort=${METRICS_PORT:-9090} --userIdentityHeader="${USER_IDENTITY_HEADER:-}" --userIdentityValue="${USER_IDENTITY_VALUE:-}"
ports:
  - 9090/tcp
