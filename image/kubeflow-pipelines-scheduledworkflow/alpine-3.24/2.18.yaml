# syntax=dhi.io/build:2-alpine3.24

name: Kubeflow Pipelines Scheduled Workflow Controller 2.18.x
image: dhi.io/kubeflow-pipelines-scheduledworkflow
variant: runtime
tags:
  - 2-alpine
  - 2.18-alpine
  - 2-alpine3.24
  - 2.18.2-alpine
  - 2.18-alpine3.24
  - 2.18.2-alpine3.24
platforms:
  - linux/amd64
  - linux/arm64
dates:
  release: "2026-10-28"
vars:
  CONTROLLER_MULTIUSER: --multiUser=${MULTIUSER:-false}
  FLAVORED_SUFFIX: ""
  SEMVER_MAJOR_MINOR_VERSION: "2.18"
  SEMVER_MAJOR_VERSION: "2"
  SEMVER_VERSION: 2.18.2
  SUFFIX: ""
  VERSION: 2.18.2-r0
contents:
  repositories:
    - https://dhi.io/apk/alpine/v3.24/main
    - https://dl-cdn.alpinelinux.org/alpine/v3.24/main
    - https://dl-cdn.alpinelinux.org/alpine/v3.24/community
  keyring:
    - https://dhi.io/keyring/dhi-apk@docker-0F81AD7700D99184.rsa.pub
  packages:
    - alpine-baselayout-data
    - busybox
    - busybox-binsh
    - ca-certificates-bundle
    - kubeflow-pipelines-scheduledworkflow-2.18=2.18.2-r0
    - tzdata
accounts:
  run-as: nonroot
  users:
    - name: nonroot
      uid: 65532
      gid: 65532
  groups:
    - name: nonroot
      gid: 65532
      members:
        - nonroot
os-release:
  name: Docker Hardened Images (Alpine)
  id: alpine
  version-id: "3.24"
  pretty-name: Docker Hardened Images/Alpine Linux v3.24
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
work-dir: /bin
environment:
  LOG_LEVEL: info
paths:
  - type: symlink
    path: /bin/controller
    uid: 0
    gid: 0
    source: /usr/bin/scheduledworkflow
annotations:
  org.opencontainers.image.description: A minimal Kubeflow Pipelines Scheduled Workflow Controller image
  org.opencontainers.image.licenses: Apache-2.0
cmd:
  - /bin/sh
  - -c
  - exec /bin/controller --logtostderr=true --multiUser=${MULTIUSER:-false} --namespace=${NAMESPACE} --logLevel=${LOG_LEVEL} --clientQPS=${CLIENT_QPS:-5} --clientBurst=${CLIENT_BURST:-10} --recurringRunResyncIntervalSeconds=${RESYNC_INTERVAL_SECONDS:-30} --metricsPort=${METRICS_PORT:-9090} --userIdentityHeader="${USER_IDENTITY_HEADER:-}" --userIdentityValue="${USER_IDENTITY_VALUE:-}"
ports:
  - 9090/tcp
