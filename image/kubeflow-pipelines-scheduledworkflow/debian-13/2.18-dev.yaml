# syntax=dhi.io/build:2-debian13

name: Kubeflow Pipelines Scheduled Workflow Controller 2.18.x (dev)
image: dhi.io/kubeflow-pipelines-scheduledworkflow
variant: dev
tags:
  - 2-dev
  - 2.18-dev
  - 2.18.2-dev
  - 2-debian-dev
  - 2-debian13-dev
  - 2.18-debian-dev
  - 2.18-debian13-dev
  - 2.18.2-debian-dev
  - 2.18.2-debian13-dev
platforms:
  - linux/amd64
  - linux/arm64
dates:
  release: "2026-10-28"
vars:
  CONTROLLER_MULTIUSER: --multiUser=${MULTIUSER:-false}
  FLAVORED_SUFFIX: -dev
  SEMVER_MAJOR_MINOR_VERSION: "2.18"
  SEMVER_MAJOR_VERSION: "2"
  SEMVER_VERSION: 2.18.2
  SUFFIX: -dev
  VERSION: 2.18.2-0
contents:
  repositories:
    - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
  keyring:
    - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
  packages:
    - '!gawk'
    - '!libelogind0'
    - '!original-awk'
    - apt
    - base-files
    - bash
    - ca-certificates
    - ca-certificates-bundle
    - coreutils
    - dash
    - debianutils
    - diffutils
    - dpkg
    - findutils
    - grep
    - kubeflow-pipelines-scheduledworkflow-2.18-dev=2.18.2-0
    - libc-bin
    - mawk
    - perl-base
    - sed
    - tzdata
    - util-linux
  builds:
    - name: locale
      contents:
        packages:
          - bash
          - locales
          - coreutils
          - gzip
      pipeline:
        - name: install locales
          runs: |
            set -eux -o pipefail

            ln -s /etc/locale.alias /usr/share/locale/locale.alias

            echo "en_US.UTF-8 UTF-8" >> /etc/locale.gen
            locale-gen en_US.UTF-8
      outputs:
        - source: /usr/share/locale
          target: /usr/share/locale
          uid: 0
          gid: 0
        - source: /usr/lib/locale
          target: /usr/lib/locale
          uid: 0
          gid: 0
accounts:
  root: true
  run-as: root
  users:
    - name: nonroot
      uid: 65532
      gid: 65532
    - name: _apt
      uid: 42
      gid: 65532
  groups:
    - name: nonroot
      gid: 65532
      members:
        - nonroot
os-release:
  name: Docker Hardened Images (Debian)
  id: debian
  version-id: "13"
  version-codename: trixie
  pretty-name: Docker Hardened Images/Debian GNU/Linux 13 (trixie)
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
work-dir: /bin
environment:
  DEBIAN_FRONTEND: noninteractive
  LANG: en_US.UTF-8
  LANGUAGE: en_US:en
  LC_ALL: en_US.UTF-8
  LOG_LEVEL: info
paths:
  - type: symlink
    path: /bin/controller
    uid: 0
    gid: 0
    source: /usr/bin/scheduledworkflow
annotations:
  org.opencontainers.image.description: A minimal Kubeflow Pipelines Scheduled Workflow Controller image
  org.opencontainers.image.licenses: Apache-2.0
cmd:
  - /bin/sh
  - -c
  - exec /bin/controller --logtostderr=true --multiUser=${MULTIUSER:-false} --namespace=${NAMESPACE} --logLevel=${LOG_LEVEL} --clientQPS=${CLIENT_QPS:-5} --clientBurst=${CLIENT_BURST:-10} --recurringRunResyncIntervalSeconds=${RESYNC_INTERVAL_SECONDS:-30} --metricsPort=${METRICS_PORT:-9090} --userIdentityHeader="${USER_IDENTITY_HEADER:-}" --userIdentityValue="${USER_IDENTITY_VALUE:-}"
ports:
  - 9090/tcp
