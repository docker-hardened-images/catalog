# syntax=dhi.io/build:2-debian13

name: Kubeflow Pipelines Scheduled Workflow Controller 2.17.x
image: dhi.io/kubeflow-pipelines-scheduledworkflow
variant: runtime
tags:
  - "2.17"
  - 2.17.3
  - 2.17-debian
  - 2.17-debian13
  - 2.17.3-debian
  - 2.17.3-debian13
platforms:
  - linux/amd64
  - linux/arm64
dates:
  release: "2026-07-09"
vars:
  CONTROLLER_MULTIUSER: ""
  FLAVORED_SUFFIX: ""
  SEMVER_MAJOR_MINOR_VERSION: "2.17"
  SEMVER_MAJOR_VERSION: "2"
  SEMVER_VERSION: 2.17.3
  SUFFIX: ""
  VERSION: 2.17.3-0
contents:
  repositories:
    - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
  keyring:
    - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
  packages:
    - base-files
    - ca-certificates-bundle
    - dash
    - debianutils
    - kubeflow-pipelines-scheduledworkflow-2.17=2.17.3-0
    - tzdata
accounts:
  run-as: nonroot
  users:
    - name: nonroot
      uid: 65532
      gid: 65532
  groups:
    - name: nonroot
      gid: 65532
      members:
        - nonroot
os-release:
  name: Docker Hardened Images (Debian)
  id: debian
  version-id: "13"
  version-codename: trixie
  pretty-name: Docker Hardened Images/Debian GNU/Linux 13 (trixie)
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
work-dir: /bin
environment:
  LOG_LEVEL: info
paths:
  - type: symlink
    path: /bin/controller
    uid: 0
    gid: 0
    source: /usr/bin/scheduledworkflow
annotations:
  org.opencontainers.image.description: A minimal Kubeflow Pipelines Scheduled Workflow Controller image
  org.opencontainers.image.licenses: Apache-2.0
cmd:
  - /bin/sh
  - -c
  - exec /bin/controller --logtostderr=true  --namespace=${NAMESPACE} --logLevel=${LOG_LEVEL} --clientQPS=${CLIENT_QPS:-5} --clientBurst=${CLIENT_BURST:-10} --recurringRunResyncIntervalSeconds=${RESYNC_INTERVAL_SECONDS:-30} --metricsPort=${METRICS_PORT:-9090} --userIdentityHeader="${USER_IDENTITY_HEADER:-}" --userIdentityValue="${USER_IDENTITY_VALUE:-}"
ports:
  - 9090/tcp
