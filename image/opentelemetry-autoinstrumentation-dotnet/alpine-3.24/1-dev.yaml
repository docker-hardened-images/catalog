# syntax=dhi.io/build:2-alpine3.24

name: OpenTelemetry .NET Autoinstrumentation 1.x (dev)
image: dhi.io/opentelemetry-autoinstrumentation-dotnet
variant: dev
tags:
  - 1-alpine-dev
  - 1.20-alpine-dev
  - 1-alpine3.24-dev
  - 1.20.0-alpine-dev
  - 1.20-alpine3.24-dev
  - 1.20.0-alpine3.24-dev
platforms:
  - linux/amd64
  - linux/arm64
dates:
  release: "2023-09-07"
vars:
  FLAVORED_SUFFIX: -dev
  SEMVER_MAJOR_MINOR_VERSION: "1.20"
  SEMVER_MAJOR_VERSION: "1"
  SEMVER_VERSION: 1.20.0
  SUFFIX: -dev
  VERSION: 1.20.0-r0
contents:
  repositories:
    - https://dhi.io/apk/alpine/v3.24/main
    - https://dl-cdn.alpinelinux.org/alpine/v3.24/main
    - https://dl-cdn.alpinelinux.org/alpine/v3.24/community
  keyring:
    - https://dhi.io/keyring/dhi-apk@docker-0F81AD7700D99184.rsa.pub
  packages:
    - alpine-baselayout-data
    - apk-tools
    - bash
    - busybox
    - ca-certificates
    - ca-certificates-bundle
    - coreutils
    - findutils
    - opentelemetry-dotnet-instrumentation-1=1.20.0-r0
    - tzdata
accounts:
  root: true
  run-as: root
  users:
    - name: nonroot
      uid: 65532
      gid: 65532
  groups:
    - name: nonroot
      gid: 65532
      members:
        - nonroot
os-release:
  name: Docker Hardened Images (Alpine)
  id: alpine
  version-id: "3.24"
  pretty-name: Docker Hardened Images/Alpine Linux v3.24
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
paths:
  - type: symlink
    path: /autoinstrumentation
    uid: 0
    gid: 0
    source: /usr/lib/opentelemetry-dotnet-instrumentation
  - type: directory
    path: /otel-auto-instrumentation-dotnet
    uid: 65532
    gid: 65532
    mode: "0750"
annotations:
  org.opencontainers.image.description: A minimal OpenTelemetry .NET Autoinstrumentation image
  org.opencontainers.image.licenses: Apache-2.0
cmd:
  - cp
  - -r
  - /autoinstrumentation/.
  - /otel-auto-instrumentation-dotnet
