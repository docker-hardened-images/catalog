# syntax=dhi.io/build:2-debian13

name: Cilium Operator AWS 1.x
image: dhi.io/cilium-operator-aws
variant: runtime
tags:
  - "1"
  - "1.20"
  - 1.20.2
  - 1-debian
  - 1-debian13
  - 1.20-debian
  - 1.20-debian13
  - 1.20.2-debian
  - 1.20.2-debian13
platforms:
  - linux/amd64
  - linux/arm64
dates:
  release: "2026-07-29"
vars:
  FLAVORED_SUFFIX: ""
  GOPS_VERSION: 0.3.29-4
  SEMVER_MAJOR_MINOR_VERSION: "1.20"
  SEMVER_MAJOR_VERSION: "1"
  SEMVER_VERSION: 1.20.2
  SUFFIX: ""
  VERSION: 1.20.2-2
contents:
  repositories:
    - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
  keyring:
    - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
  packages:
    - base-files
    - ca-certificates-bundle
    - cilium-operator-aws-1.20=1.20.2-2
    - gops=0.3.29-4
    - tzdata
accounts:
  run-as: nonroot
  users:
    - name: nonroot
      uid: 65532
      gid: 65532
  groups:
    - name: nonroot
      gid: 65532
      members:
        - nonroot
os-release:
  name: Docker Hardened Images (Debian)
  id: debian
  version-id: "13"
  version-codename: trixie
  pretty-name: Docker Hardened Images/Debian GNU/Linux 13 (trixie)
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
environment:
  GOPS_CONFIG_DIR: /home/gops
paths:
  - type: directory
    path: /home/gops
    uid: 65532
    gid: 65532
    mode: "0770"
  - type: directory
    path: /run/cilium
    uid: 65532
    gid: 65532
    mode: "0770"
  - type: directory
    path: /usr/local/bin
    uid: 0
    gid: 0
  - type: symlink
    path: /usr/local/bin/cilium-operator-aws
    uid: 0
    gid: 0
    source: /usr/bin/cilium-operator-aws
annotations:
  org.opencontainers.image.description: A minimal Cilium Operator AWS image
  org.opencontainers.image.licenses: Apache-2.0
entrypoint:
  - /usr/local/bin/cilium-operator-aws
