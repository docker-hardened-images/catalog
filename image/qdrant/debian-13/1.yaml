# syntax=dhi.io/build:2-debian13

name: Qdrant 1.x
image: dhi.io/qdrant
variant: runtime
tags:
  - "1"
  - "1.19"
  - 1.19.0
  - 1-debian
  - 1-debian13
  - 1.19-debian
  - 1.19-debian13
  - 1.19.0-debian
  - 1.19.0-debian13
platforms:
  - linux/amd64
  - linux/arm64
dates:
  release: "2023-02-08"
vars:
  SEMVER_MAJOR_MINOR_VERSION: "1.19"
  SEMVER_MAJOR_VERSION: "1"
  SEMVER_VERSION: 1.19.0
  VERSION: 1.19.0-0
contents:
  repositories:
    - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
  keyring:
    - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
  packages:
    - '!libelogind0'
    - '!mawk'
    - '!original-awk'
    - base-files
    - ca-certificates-bundle
    - libc6
    - libgcc-s1
    - libunwind8
    - qdrant=1.19.0-0
    - tzdata
accounts:
  run-as: nonroot
  users:
    - name: nonroot
      uid: 65532
      gid: 65532
  groups:
    - name: nonroot
      gid: 65532
      members:
        - nonroot
os-release:
  name: Docker Hardened Images (Debian)
  id: debian
  version-id: "13"
  version-codename: trixie
  pretty-name: Docker Hardened Images/Debian GNU/Linux 13 (trixie)
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
work-dir: /qdrant
environment:
  RUN_MODE: production
  TZ: Etc/UTC
paths:
  - type: directory
    path: /qdrant
    uid: 65532
    gid: 65532
    mode: "0755"
  - type: symlink
    path: /qdrant/config
    uid: 0
    gid: 0
    source: /usr/share/qdrant/config
  - type: symlink
    path: /qdrant/static
    uid: 0
    gid: 0
    source: /usr/share/qdrant/static
  - type: directory
    path: /qdrant/storage
    uid: 65532
    gid: 65532
    mode: "0770"
  - type: directory
    path: /qdrant/snapshots
    uid: 65532
    gid: 65532
    mode: "0770"
annotations:
  org.opencontainers.image.description: A minimal Qdrant image
  org.opencontainers.image.licenses: Apache-2.0
entrypoint:
  - /usr/bin/qdrant
ports:
  - 6333/tcp
  - 6334/tcp
