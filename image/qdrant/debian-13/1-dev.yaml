# syntax=dhi.io/build:2-debian13

name: Qdrant 1.x (dev)
image: dhi.io/qdrant
variant: dev
tags:
  - 1-dev
  - 1.18-dev
  - 1.18.3-dev
  - 1-debian-dev
  - 1-debian13-dev
  - 1.18-debian-dev
  - 1.18-debian13-dev
  - 1.18.3-debian-dev
  - 1.18.3-debian13-dev
platforms:
  - linux/amd64
  - linux/arm64
dates:
  release: "2023-02-08"
vars:
  SEMVER_MAJOR_MINOR_VERSION: "1.18"
  SEMVER_MAJOR_VERSION: "1"
  SEMVER_VERSION: 1.18.3
  VERSION: 1.18.3-2
contents:
  repositories:
    - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
  keyring:
    - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
  packages:
    - '!gawk'
    - '!libelogind0'
    - '!mawk'
    - '!original-awk'
    - apt
    - base-files
    - bash
    - ca-certificates
    - ca-certificates-bundle
    - coreutils
    - diffutils
    - dpkg
    - findutils
    - grep
    - libc-bin
    - libc6
    - libgcc-s1
    - libunwind8
    - mawk
    - perl-base
    - qdrant=1.18.3-2
    - sed
    - tzdata
    - util-linux
accounts:
  root: true
  run-as: root
  users:
    - name: nonroot
      uid: 65532
      gid: 65532
    - name: _apt
      uid: 42
      gid: 65532
  groups:
    - name: nonroot
      gid: 65532
      members:
        - nonroot
os-release:
  name: Docker Hardened Images (Debian)
  id: debian
  version-id: "13"
  version-codename: trixie
  pretty-name: Docker Hardened Images/Debian GNU/Linux 13 (trixie)
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
work-dir: /qdrant
environment:
  DEBIAN_FRONTEND: noninteractive
  RUN_MODE: production
  TZ: Etc/UTC
paths:
  - type: directory
    path: /qdrant
    uid: 65532
    gid: 65532
    mode: "0755"
  - type: symlink
    path: /qdrant/config
    uid: 0
    gid: 0
    source: /usr/share/qdrant/config
  - type: symlink
    path: /qdrant/static
    uid: 0
    gid: 0
    source: /usr/share/qdrant/static
  - type: directory
    path: /qdrant/storage
    uid: 65532
    gid: 65532
    mode: "0770"
  - type: directory
    path: /qdrant/snapshots
    uid: 65532
    gid: 65532
    mode: "0770"
annotations:
  org.opencontainers.image.description: A minimal Qdrant image
  org.opencontainers.image.licenses: Apache-2.0
entrypoint:
  - /usr/bin/qdrant
ports:
  - 6333/tcp
  - 6334/tcp
