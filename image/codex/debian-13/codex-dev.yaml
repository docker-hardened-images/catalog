name: Codex (docker, dev)
image: dhi.io/codex
output: squashed
variant: dev
flavor: docker
tags:
  - latest
  - 0.167.2
platforms:
  - linux/amd64
  - linux/arm64
vars:
  BANNER_KIT: codex docker 0.167.2
  CENTERED_KIT_NAME: '          codex docker 0.167.2'
  CLIPBOARD_BRIDGE_ARCH: '#{ target.arch == "amd64" ? "amd64" : "arm64" }'
  CLIPBOARD_BRIDGE_VERSION: v0.3.1
  CODEX_TARGET: '#{ target.arch == "amd64" ? "x86_64-unknown-linux-musl" : "aarch64-unknown-linux-musl" }'
  DHI_TAGS_OVERWRITE: "true"
  KIT_NAME: codex
  SANDBOXES_COMMIT_SHA: 54a695035350bab5f126a88c892a9bc3b5ae162a
  SBX_AGENT_HOOK: sbx-codex-hook
  SEMVER_MAJOR_MINOR_VERSION: "0.167"
  SEMVER_MAJOR_VERSION: "0"
  SEMVER_VERSION: 0.167.2
  VERSION: 0.167.2
contents:
  repositories:
    - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
  keyring:
    - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
