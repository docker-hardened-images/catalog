    - lsof
    - make
    - mawk
    - nano
    - ncurses-base
    - ncurses-bin
    - net-tools
    - netcat-openbsd
    - openssh-client
    - perl-base
    - procps
    - psmisc
    - python-3.14
    - python3-pip
    - ripgrep
    - sed
    - socat
    - sudo
    - tini
    - tmux
    - traceroute
    - tree
    - unzip
    - util-linux
    - uv
    - vim
    - vim-common
    - vim-runtime
    - wget
