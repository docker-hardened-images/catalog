          uid: 0
          gid: 0
    - name: ld.so.cache
      contents:
        packages:
          - bash
          - libc-bin
          - libstdc++6
      pipeline:
        - name: generate ld.so.cache
          runs: |
            set -eux -o pipefail

            ldconfig -X -C ${target.dir}/ld.so.cache
            cache="$(ldconfig -p -C ${target.dir}/ld.so.cache)"
            [[ "$cache" == *"libc.so.6 "* && "$cache" == *"libstdc++.so.6 "* ]]
      outputs:
        - source: ${target.dir}/ld.so.cache
          target: /etc/ld.so.cache
          uid: 0
          gid: 0
          mode: "0644"
    - name: install-codex
      contents:
        packages:
          - bash
          - ca-certificates
          - coreutils
          - grep
        files:
          - url: https://github.com/openai/codex/releases/download/rust-v0.167.2/codex-package-${CODEX_TARGET}.tar.gz
            checksum: https://github.com/openai/codex/releases/download/rust-v0.167.2/codex-package_SHA256SUMS
            path: ${source.dir}/codex
            spdx:
              name: codex
              version: 0.167.2
              packages:
                - name: codex
                  purl: pkg:github/openai/codex@rust-v0.167.2
                  license: Apache-2.0
            uid: 0
            gid: 0
      pipeline:
        - name: install
          runs: |
            set -eux -o pipefail

            grep -q "\"version\": \"0.167.2\"" "${source.dir}/codex/codex-package.json"

            scratch=$(mktemp -d)
            CODEX_HOME="$scratch" "${source.dir}/codex/bin/codex" --version | grep -q "0.167.2"
            rm -rf "$scratch"

            mkdir -p "${target.dir}/usr/local/bin"
            ln -s /opt/codex/bin/codex "${target.dir}/usr/local/bin/codex"
      outputs:
        - source: ${source.dir}/codex
          target: /opt/codex
          uid: 0
          gid: 0
        - source: ${target.dir}/usr/local/bin
          target: /usr/local/bin
          uid: 0
          gid: 0
        - source: /opt/docker/sbom/codex
          target: /opt/docker/sbom/codex
          uid: 0
          gid: 0
