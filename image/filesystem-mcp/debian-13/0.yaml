# syntax=dhi.io/build:2-debian13

name: Filesystem MCP Server 2026.x
image: dhi.io/filesystem-mcp
variant: runtime
tags:
  - "2026"
  - "2026.8"
  - 2026.8.31
  - 2026-debian
  - 2026-debian13
  - 2026.8-debian
  - 2026.8-debian13
  - 2026.8.31-debian
  - 2026.8.31-debian13
platforms:
  - linux/amd64
  - linux/arm64
vars:
  SEMVER_MAJOR_MINOR_VERSION: "2026.8"
  SEMVER_MAJOR_VERSION: "2026"
  SEMVER_VERSION: 2026.8.31
  VERSION: 2026.8.31-0
contents:
  repositories:
    - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
  keyring:
    - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
  packages:
    - base-files
    - ca-certificates-bundle
    - filesystem-mcp=2026.8.31-0
    - libc6
    - libgomp1
    - libstdc++6
    - netbase
    - nodejs-24
    - tzdata
accounts:
  root: true
  run-as: node
  users:
    - name: node
      uid: 1000
      gid: 1000
  groups:
    - name: node
      gid: 1000
      members:
        - node
os-release:
  name: Docker Hardened Images (Debian)
  id: debian
  version-id: "13"
  version-codename: trixie
  pretty-name: Docker Hardened Images/Debian GNU/Linux 13 (trixie)
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
paths:
  - type: symlink
    path: /app
    uid: 0
    gid: 0
    source: /usr/lib/filesystem-mcp
annotations:
  org.opencontainers.image.description: Filesystem MCP Server
  org.opencontainers.image.licenses: MIT
labels:
  io.modelcontextprotocol.server.name: io.github.modelcontextprotocol/server-filesystem
entrypoint:
  - node
  - /app/dist/index.js
