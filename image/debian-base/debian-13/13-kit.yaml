# syntax=dhi.io/build:2-debian13

name: Debian 13 Base (kit, dev)
image: dhi.io/debian-base
variant: dev
flavor: kit
tags:
  - trixie-kit
platforms:
  - linux/amd64
  - linux/arm64
dates:
  release: "2025-08-09"
  end-of-life: "2028-08-09"
vars:
  DEBIAN_EPOCH_MAJOR_MINOR_VERSION: "5.2"
  DEBIAN_EPOCH_MAJOR_VERSION: "5"
  DEBIAN_EPOCH_VERSION: 5.2.37
  DHI_TAGS_OVERWRITE: "true"
  VERSION: 5.2.37-2+dhi1
contents:
  repositories:
    - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
  keyring:
    - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
  packages:
    - '!gawk'
    - '!libelogind0'
    - '!mawk'
    - '!original-awk'
    - apt
    - base-files
    - bash
    - ca-certificates
    - coreutils
    - curl
    - diffutils
    - dpkg
    - findutils
    - git
    - gnu-which
    - grep
    - gzip
    - libc-bin
    - mawk
    - ncurses-bin
    - ncurses-term
    - perl-base
    - sed
    - sudo
    - tar
    - tzdata
    - util-linux
accounts:
  root: true
  run-as: nonroot
  users:
    - name: nonroot
      uid: 65532
      gid: 65532
    - name: _apt
      uid: 42
      gid: 65532
  groups:
    - name: nonroot
      gid: 65532
      members:
        - nonroot
os-release:
  name: Docker Hardened Images (Debian)
  id: debian
  version-id: "13"
  version-codename: trixie
  pretty-name: Docker Hardened Images/Debian GNU/Linux 13 (trixie)
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
work-dir: /home/nonroot/workspace
environment:
  BASH_ENV: /etc/sandbox-persistent.sh
  DEBIAN_FRONTEND: noninteractive
paths:
  - type: file
    path: /etc/pam.d/common-auth
    uid: 0
    gid: 0
    mode: "0644"
    source: image/debian-base/debian-13/pam.d/common-auth
  - type: file
    path: /etc/pam.d/common-account
    uid: 0
    gid: 0
    mode: "0644"
    source: image/debian-base/debian-13/pam.d/common-account
  - type: file
    path: /etc/pam.d/common-session
    uid: 0
    gid: 0
    mode: "0644"
    source: image/debian-base/debian-13/pam.d/common-session
  - type: file
    path: /etc/pam.d/common-session-noninteractive
    uid: 0
    gid: 0
    mode: "0644"
    source: image/debian-base/debian-13/pam.d/common-session-noninteractive
  - type: file
    path: /etc/pam.d/common-password
    uid: 0
    gid: 0
    mode: "0644"
    source: image/debian-base/debian-13/pam.d/common-password
  - type: directory
    path: /home/nonroot/workspace
    uid: 65532
    gid: 65532
    mode: "0755"
  - type: emptyfile
    path: /etc/sandbox-persistent.sh
    uid: 65532
    gid: 65532
    mode: "0644"
  - type: directory
    path: /etc/sudoers.d
    uid: 0
    gid: 0
    mode: "0755"
  - type: file
    path: /etc/sudoers.d/nonroot
    content: |
      nonroot ALL=(ALL) NOPASSWD:ALL
    uid: 0
    gid: 0
    mode: "0440"
  - type: file
    path: /etc/sudoers.d/proxyconfig
    content: |
      Defaults:nonroot env_keep += "http_proxy https_proxy no_proxy HTTP_PROXY HTTPS_PROXY NO_PROXY SSL_CERT_FILE NODE_EXTRA_CA_CERTS REQUESTS_CA_BUNDLE JAVA_TOOL_OPTIONS"
    uid: 0
    gid: 0
    mode: "0440"
  - type: file
    path: /etc/pam.d/sudo
    content: |
      @include common-auth
      @include common-account
      @include common-session-noninteractive
    uid: 0
    gid: 0
    mode: "0644"
  - type: directory
    path: /usr/local/share/ca-certificates
    uid: 0
    gid: 0
    mode: "0755"
  - type: directory
    path: /usr/share/sandbox
    uid: 0
    gid: 0
    mode: "0755"
  - type: directory
    path: /usr/share/sandbox/kit
    uid: 0
    gid: 0
    mode: "0755"
  - type: directory
    path: /usr/share/sandbox/kit/debian
    uid: 0
    gid: 0
    mode: "0755"
  - type: file
    path: /usr/share/sandbox/kit/debian/kit.yaml
    content: |
      # syntax=docker/sandbox-kit:3
      schemaVersion: "3"
      displayName: Debian
      author: "Docker, Inc."
      description: Debian Sandbox Kit - Docker sandbox workload with bash, curl and git, running as nonroot with sudo / Debian 13 Base (kit, dev)
      sourceUrl: https://dhi.io/catalog/debian-base
      licenses: [MIT]
      kind: workload
      version: "13"
      capabilities:
        - type: com.docker.sandbox/sbx@1
        - type: com.docker.sandbox/network-policy@1
          config:
            runtime:
              allow:
                - deb.debian.org
                - dhi.io
        - type: com.docker.sandbox/agent-context@1
          config:
            filename: AGENTS.md
            content: |
              This is a plain shell sandbox on DHI Debian 13 (dev) with bash, curl and git.
              It runs as the nonroot user (uid 65532) with passwordless sudo; install more with sudo apt.
              Composed kits list their own capabilities below.
    uid: 0
    gid: 0
    mode: "0644"
annotations:
  org.opencontainers.image.authors: Docker, Inc.
  org.opencontainers.image.description: Debian Sandbox Kit - Docker sandbox workload with bash, curl and git, running as nonroot with sudo
  org.opencontainers.image.licenses: MIT
  org.opencontainers.image.source: https://dhi.io/catalog/debian-base
  org.opencontainers.image.title: Debian
  org.opencontainers.image.version: "13"
  vnd.docker.sandbox.kit.capabilities: com.docker.sandbox/agent-context@1,com.docker.sandbox/network-policy@1,com.docker.sandbox/sbx@1
  vnd.docker.sandbox.kit.descriptor: '{"schemaVersion":"3","displayName":"Debian","author":"Docker, Inc.","description":"Debian Sandbox Kit - Docker sandbox workload with bash, curl and git, running as nonroot with sudo / Debian 13 Base (kit, dev)","sourceUrl":"https://dhi.io/catalog/debian-base","version":"13","licenses":["MIT"],"kind":"workload","capabilities":[{"type":"com.docker.sandbox/sbx@1"},{"type":"com.docker.sandbox/network-policy@1","config":{"runtime":{"allow":["deb.debian.org","dhi.io"]}}},{"type":"com.docker.sandbox/agent-context@1","config":{"filename":"AGENTS.md","content":"This is a plain shell sandbox on DHI Debian 13 (dev) with bash, curl and git.\nIt runs as the nonroot user (uid 65532) with passwordless sudo; install more with sudo apt.\nComposed kits list their own capabilities below.\n"}}]}'
  vnd.docker.sandbox.kit.schema-version: "3"
entrypoint:
  - bash
cmd:
  - -l
