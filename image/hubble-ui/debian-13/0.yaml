# syntax=dhi.io/build:2-debian13

name: Cilium Hubble UI 0.x
image: dhi.io/hubble-ui
variant: runtime
tags:
  - "0"
  - "0.13"
  - 0.13.6
  - 0-debian
  - 0-debian13
  - 0.13-debian
  - 0.13-debian13
  - 0.13.6-debian
  - 0.13.6-debian13
platforms:
  - linux/amd64
  - linux/arm64
vars:
  HUBBLE_UI_FIPS: ""
  SEMVER_MAJOR_MINOR_VERSION: "0.13"
  SEMVER_MAJOR_VERSION: "0"
  SEMVER_VERSION: 0.13.6
  VERSION: 0.13.6-12
contents:
  repositories:
    - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
  keyring:
    - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
  packages:
    - base-files
    - ca-certificates-bundle
    - hubble-ui=0.13.6-12
    - libc6
    - libcrypt1
    - libpcre2-8-0
    - libssl3t64
    - nginx-mainline
    - tzdata
    - zlib1g
  builds:
    - name: hubble-ui-payload
      contents:
        packages:
          - bash
          - coreutils
          - hubble-ui=0.13.6-12
      pipeline:
        - name: check frontend payload
          shell: /bin/bash
          runs: |
            set -eux -o pipefail

            test -f /app/index.html
      outputs:
        - source: /app
          target: /app
          uid: 65532
          gid: 65532
          mode: "0755"
accounts:
  run-as: nginx
  users:
    - name: nginx
      uid: 65532
      gid: 65532
  groups:
    - name: nginx
      gid: 65532
      members:
        - nginx
    - name: www-data
      gid: 82
os-release:
  name: Docker Hardened Images (Debian)
  id: debian
  version-id: "13"
  version-codename: trixie
  pretty-name: Docker Hardened Images/Debian GNU/Linux 13 (trixie)
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
paths:
  - type: directory
    path: /app
    uid: 65532
    gid: 65532
    mode: "0755"
  - type: directory
    path: /run/nginx
    uid: 65532
    gid: 65532
    mode: "0777"
  - type: directory
    path: /var/cache/nginx
    uid: 65532
    gid: 65532
    mode: "0777"
  - type: symlink
    path: /var/log/nginx/access.log
    uid: 0
    gid: 0
    source: /dev/stdout
  - type: symlink
    path: /var/log/nginx/error.log
    uid: 0
    gid: 0
    source: /dev/stderr
  - type: file
    path: /etc/nginx/nginx.conf
    uid: 0
    gid: 0
    mode: "0644"
    source: image/hubble-ui/config/nginx.conf
  - type: file
    path: /etc/nginx/conf.d/default.conf
    uid: 0
    gid: 0
    mode: "0644"
    source: image/hubble-ui/config/default.conf
annotations:
  org.opencontainers.image.description: A minimal Cilium Hubble UI image
  org.opencontainers.image.licenses: Apache-2.0
entrypoint:
  - nginx
cmd:
  - -g
  - daemon off;
ports:
  - 8080/tcp
