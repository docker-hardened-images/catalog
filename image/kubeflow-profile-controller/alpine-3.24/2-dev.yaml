# syntax=dhi.io/build:2-alpine3.24

name: Kubeflow Profile Controller 2.x (dev)
image: dhi.io/kubeflow-profile-controller
variant: dev
tags:
  - 2-alpine-dev
  - 2.0-alpine-dev
  - 2-alpine3.24-dev
  - 2.0.1-alpine-dev
  - 2.0-alpine3.24-dev
  - 2.0.1-alpine3.24-dev
platforms:
  - linux/amd64
  - linux/arm64
dates:
  release: "2026-06-02"
vars:
  FLAVORED_SUFFIX: -dev
  SEMVER_MAJOR_MINOR_VERSION: "2.0"
  SEMVER_MAJOR_VERSION: "2"
  SEMVER_VERSION: 2.0.1
  SUFFIX: -dev
  VERSION: 2.0.1-r0
contents:
  repositories:
    - https://dhi.io/apk/alpine/v3.24/main
    - https://dl-cdn.alpinelinux.org/alpine/v3.24/main
    - https://dl-cdn.alpinelinux.org/alpine/v3.24/community
  keyring:
    - https://dhi.io/keyring/dhi-apk@docker-0F81AD7700D99184.rsa.pub
  packages:
    - alpine-baselayout-data
    - apk-tools
    - bash
    - busybox
    - ca-certificates
    - ca-certificates-bundle
    - coreutils
    - findutils
    - kubeflow-profile-controller-2-dev=2.0.1-r0
    - tzdata
accounts:
  root: true
  run-as: root
  users:
    - name: nonroot
      uid: 65532
      gid: 65532
  groups:
    - name: nonroot
      gid: 65532
      members:
        - nonroot
os-release:
  name: Docker Hardened Images (Alpine)
  id: alpine
  version-id: "3.24"
  pretty-name: Docker Hardened Images/Alpine Linux v3.24
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
work-dir: /
paths:
  - type: symlink
    path: /manager
    uid: 0
    gid: 0
    source: /usr/bin/kubeflow-profile-controller
  - type: symlink
    path: /third_party
    uid: 0
    gid: 0
    source: /usr/share/kubeflow-profile-controller/third_party
annotations:
  org.opencontainers.image.description: Kubeflow Profile Controller - reconciles Profiles into tenant namespaces
  org.opencontainers.image.licenses: Apache-2.0
entrypoint:
  - /manager
ports:
  - 8080/tcp
