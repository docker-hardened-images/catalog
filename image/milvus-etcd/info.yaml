metadata:
  display-name: Milvus etcd
  short-description: Bitnami-compatible etcd distribution maintained by the Milvus project as the metadata store for Milvus deployments
  featured: false
  home-url: https://github.com/milvus-io/bitnami-docker-etcd
  categories:
    - databases-and-storage
  included-tools:
    - name: etcd
      description: etcd server binary, a distributed key-value store.
    - name: etcdctl
      description: etcd command line client, used by the packaged scripts for health checks and cluster management.
    - name: etcdutl
      description: etcd utility command, used for snapshot and disaster-recovery tasks.
    - name: yq
      description: YAML processor used by the packaged Bitnami-style scripts to render the etcd configuration file.
