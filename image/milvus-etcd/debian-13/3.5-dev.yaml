# syntax=dhi.io/build:2-debian13

name: milvus-etcd 3.5.x (dev)
image: dhi.io/milvus-etcd
variant: dev
tags:
  - 3-dev
  - 3.5-dev
  - 3.5.30-dev
  - 3-debian-dev
  - 3-debian13-dev
  - 3.5-debian-dev
  - 3.5-debian13-dev
  - 3.5.30-debian-dev
  - 3.5.30-debian13-dev
platforms:
  - linux/amd64
  - linux/arm64
dates:
  release: "2022-06-06"
vars:
  ETCD_VERSION: 3.5.34-2
  FLAVORED_SUFFIX: -dev
  SEMVER_MAJOR_MINOR_VERSION: "3.5"
  SEMVER_MAJOR_VERSION: "3"
  SEMVER_VERSION: 3.5.30
  SUFFIX: -dev
  VERSION: 3.5.30-0
contents:
  repositories:
    - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
  keyring:
    - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
  packages:
    - '!gawk'
    - '!libelogind0'
    - '!original-awk'
    - apt
    - base-files
    - bash
    - ca-certificates
    - ca-certificates-bundle
    - coreutils
    - diffutils
    - dpkg
    - etcd-3.5-dev=3.5.34-2
    - findutils
    - gosu
    - grep
    - hostname
    - libc-bin
    - mawk
    - milvus-etcd=3.5.30-0
    - passwd
    - perl-base
    - procps
    - sed
    - tzdata
    - util-linux
    - yq-go-dev
accounts:
  root: true
  run-as: root
  users:
    - name: etcd
      uid: 1001
      gid: 0
    - name: nonroot
      uid: 65532
      gid: 65532
    - name: _apt
      uid: 42
      gid: 65532
  groups:
    - name: root
      gid: 0
      members:
        - etcd
    - name: nonroot
      gid: 65532
      members:
        - nonroot
os-release:
  name: Docker Hardened Images (Debian)
  id: debian
  version-id: "13"
  version-codename: trixie
  pretty-name: Docker Hardened Images/Debian GNU/Linux 13 (trixie)
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
work-dir: /opt/bitnami/etcd
environment:
  APP_VERSION: 3.5.30
  BITNAMI_APP_NAME: etcd
  DEBIAN_FRONTEND: noninteractive
  ETCDCTL_API: "3"
  HOME: /
  PATH: /opt/bitnami/common/bin:/opt/bitnami/etcd/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
paths:
  - type: directory
    path: /opt/bitnami/etcd/conf
    uid: 1001
    gid: 1001
    mode: "0770"
  - type: directory
    path: /opt/bitnami/etcd/certs
    uid: 1001
    gid: 1001
    mode: "0770"
  - type: directory
    path: /opt/bitnami/etcd/tmp
    uid: 1001
    gid: 1001
    mode: "0770"
  - type: directory
    path: /bitnami/etcd
    uid: 1001
    gid: 1001
    mode: "0770"
  - type: directory
    path: /bitnami/etcd/data
    uid: 1001
    gid: 1001
    mode: "0700"
  - type: directory
    path: /snapshots
    uid: 1001
    gid: 1001
    mode: "0770"
  - type: directory
    path: /opt/bitnami
    uid: 0
    gid: 0
    mode: "0755"
  - type: directory
    path: /opt/bitnami/etcd
    uid: 0
    gid: 0
    mode: "0755"
  - type: directory
    path: /bitnami
    uid: 0
    gid: 0
    mode: "0755"
annotations:
  org.opencontainers.image.description: A minimal milvus-etcd image
  org.opencontainers.image.licenses: Apache-2.0
entrypoint:
  - /opt/bitnami/scripts/etcd/entrypoint.sh
cmd:
  - /opt/bitnami/scripts/etcd/run.sh
ports:
  - 2379/tcp
  - 2380/tcp
