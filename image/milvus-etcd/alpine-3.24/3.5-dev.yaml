# syntax=dhi.io/build:2-alpine3.24

name: milvus-etcd 3.5.x (dev)
image: dhi.io/milvus-etcd
variant: dev
tags:
  - 3-alpine-dev
  - 3.5-alpine-dev
  - 3-alpine3.24-dev
  - 3.5.30-alpine-dev
  - 3.5-alpine3.24-dev
  - 3.5.30-alpine3.24-dev
platforms:
  - linux/amd64
  - linux/arm64
dates:
  release: "2022-06-06"
vars:
  ETCD_VERSION: 3.5.34-r1
  FLAVORED_SUFFIX: -dev
  SEMVER_MAJOR_MINOR_VERSION: "3.5"
  SEMVER_MAJOR_VERSION: "3"
  SEMVER_VERSION: 3.5.30
  SUFFIX: -dev
  VERSION: 3.5.30-r0
contents:
  repositories:
    - https://dhi.io/apk/alpine/v3.24/main
    - https://dl-cdn.alpinelinux.org/alpine/v3.24/main
    - https://dl-cdn.alpinelinux.org/alpine/v3.24/community
  keyring:
    - https://dhi.io/keyring/dhi-apk@docker-0F81AD7700D99184.rsa.pub
  packages:
    - alpine-baselayout-data
    - apk-tools
    - bash
    - busybox
    - ca-certificates
    - ca-certificates-bundle
    - etcd-3.5-dev=3.5.34-r1
    - gosu
    - milvus-etcd=3.5.30-r0
    - musl-utils
    - shadow
    - tzdata
    - yq-go-dev
accounts:
  root: true
  run-as: root
  users:
    - name: etcd
      uid: 1001
      gid: 0
    - name: nonroot
      uid: 65532
      gid: 65532
  groups:
    - name: root
      gid: 0
      members:
        - etcd
    - name: nonroot
      gid: 65532
      members:
        - nonroot
os-release:
  name: Docker Hardened Images (Alpine)
  id: alpine
  version-id: "3.24"
  pretty-name: Docker Hardened Images/Alpine Linux v3.24
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
work-dir: /opt/bitnami/etcd
environment:
  APP_VERSION: 3.5.30
  BITNAMI_APP_NAME: etcd
  ETCDCTL_API: "3"
  HOME: /
  PATH: /opt/bitnami/common/bin:/opt/bitnami/etcd/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
paths:
  - type: directory
    path: /opt/bitnami/etcd/conf
    uid: 1001
    gid: 1001
    mode: "0770"
  - type: directory
    path: /opt/bitnami/etcd/certs
    uid: 1001
    gid: 1001
    mode: "0770"
  - type: directory
    path: /opt/bitnami/etcd/tmp
    uid: 1001
    gid: 1001
    mode: "0770"
  - type: directory
    path: /bitnami/etcd
    uid: 1001
    gid: 1001
    mode: "0770"
  - type: directory
    path: /bitnami/etcd/data
    uid: 1001
    gid: 1001
    mode: "0700"
  - type: directory
    path: /snapshots
    uid: 1001
    gid: 1001
    mode: "0770"
  - type: directory
    path: /opt/bitnami
    uid: 0
    gid: 0
    mode: "0755"
  - type: directory
    path: /opt/bitnami/etcd
    uid: 0
    gid: 0
    mode: "0755"
  - type: directory
    path: /bitnami
    uid: 0
    gid: 0
    mode: "0755"
annotations:
  org.opencontainers.image.description: A minimal milvus-etcd image
  org.opencontainers.image.licenses: Apache-2.0
entrypoint:
  - /opt/bitnami/scripts/etcd/entrypoint.sh
cmd:
  - /opt/bitnami/scripts/etcd/run.sh
ports:
  - 2379/tcp
  - 2380/tcp
