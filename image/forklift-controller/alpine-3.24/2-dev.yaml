# syntax=dhi.io/build:2-alpine3.24

name: Forklift Controller 2.x (dev)
image: dhi.io/forklift-controller
variant: dev
tags:
  - 2-alpine-dev
  - 2.12-alpine-dev
  - 2-alpine3.24-dev
  - 2.12.7-alpine-dev
  - 2.12-alpine3.24-dev
  - 2.12.7-alpine3.24-dev
platforms:
  - linux/amd64
  - linux/arm64
dates:
  release: "2026-08-24"
vars:
  FLAVORED_SUFFIX: -dev
  SEMVER_MAJOR_MINOR_VERSION: "2.12"
  SEMVER_MAJOR_VERSION: "2"
  SEMVER_VERSION: 2.12.7
  SUFFIX: -dev
  VERSION: 2.12.7-r3
contents:
  repositories:
    - https://dhi.io/apk/alpine/v3.24/main
    - https://dl-cdn.alpinelinux.org/alpine/v3.24/main
    - https://dl-cdn.alpinelinux.org/alpine/v3.24/community
  keyring:
    - https://dhi.io/keyring/dhi-apk@docker-0F81AD7700D99184.rsa.pub
  packages:
    - alpine-baselayout-data
    - apk-tools
    - bash
    - busybox
    - ca-certificates
    - ca-certificates-bundle
    - coreutils
    - findutils
    - forklift-controller-dev=2.12.7-r3
    - tzdata
accounts:
  root: true
  run-as: root
  users:
    - name: nonroot
      uid: 65532
      gid: 65532
  groups:
    - name: nonroot
      gid: 65532
      members:
        - nonroot
os-release:
