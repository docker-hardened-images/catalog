# syntax=dhi.io/build:2-debian13

name: Codecov API 26.x (dev)
image: dhi.io/codecov-api
variant: dev
tags:
  - 26-dev
  - 26.9-dev
  - 26.9.10-dev
  - 26-debian-dev
  - 26-debian13-dev
  - 26.9-debian-dev
  - 26.9-debian13-dev
  - 26.9.10-debian-dev
  - 26.9.10-debian13-dev
platforms:
  - linux/amd64
  - linux/arm64
dates:
  release: "2025-04-14"
vars:
  SEMVER_MAJOR_MINOR_VERSION: "26.9"
  SEMVER_MAJOR_VERSION: "26"
  SEMVER_VERSION: 26.9.10
  VERSION: 26.9.10-1
contents:
  repositories:
    - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
  keyring:
    - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
  packages:
    - '!gawk'
    - '!libelogind0'
    - '!original-awk'
    - apt
    - base-files
    - bash
    - ca-certificates
    - ca-certificates-bundle
    - codecov-api=26.9.10-1
    - coreutils
    - diffutils
    - dpkg
    - findutils
    - grep
    - libc-bin
    - libgcc-s1
    - libpq5
    - libssl3t64
    - libstdc++6
    - mawk
    - perl-base
    - python-3.13
    - sed
    - tzdata
    - util-linux
accounts:
  root: true
  run-as: root
  users:
    - name: nonroot
      uid: 65532
      gid: 65532
    - name: _apt
      uid: 42
      gid: 65532
  groups:
    - name: nonroot
      gid: 65532
      members:
        - nonroot
os-release:
  name: Docker Hardened Images (Debian)
  id: debian
  version-id: "13"
  version-codename: trixie
  pretty-name: Docker Hardened Images/Debian GNU/Linux 13 (trixie)
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
work-dir: /app/apps/codecov-api
environment:
  CODECOV_API_PORT: "8000"
  DEBIAN_FRONTEND: noninteractive
  HOME: /home/nonroot
  PATH: /usr/lib/codecov-api/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
  PYTHONDONTWRITEBYTECODE: "1"
  PYTHONUNBUFFERED: "1"
  RELEASE_VERSION: 26.9.10
  RUN_ENV: ENTERPRISE
paths:
  - type: directory
    path: /home/nonroot
    uid: 65532
    gid: 65532
    mode: "0755"
  - type: directory
    path: /app
    uid: 0
    gid: 0
    mode: "0755"
  - type: directory
    path: /app/apps
    uid: 0
    gid: 0
    mode: "0755"
  - type: symlink
    path: /app/apps/codecov-api
    uid: 0
    gid: 0
    source: /usr/share/codecov-api
annotations:
  org.opencontainers.image.description: A minimal Codecov API image
  org.opencontainers.image.licenses: FSL-1.1-ALv2
entrypoint:
  - /usr/share/codecov-api/api.sh
ports:
  - 8000/tcp
