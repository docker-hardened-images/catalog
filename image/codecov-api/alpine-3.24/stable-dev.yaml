# syntax=dhi.io/build:2-alpine3.24

name: Codecov API 26.x (dev)
image: dhi.io/codecov-api
variant: dev
tags:
  - 26-alpine-dev
  - 26.9-alpine-dev
  - 26-alpine3.24-dev
  - 26.9.10-alpine-dev
  - 26.9-alpine3.24-dev
  - 26.9.10-alpine3.24-dev
platforms:
  - linux/amd64
  - linux/arm64
dates:
  release: "2025-04-14"
vars:
  SEMVER_MAJOR_MINOR_VERSION: "26.9"
  SEMVER_MAJOR_VERSION: "26"
  SEMVER_VERSION: 26.9.10
  VERSION: 26.9.10-r1
contents:
  repositories:
    - https://dhi.io/apk/alpine/v3.24/main
    - https://dl-cdn.alpinelinux.org/alpine/v3.24/main
    - https://dl-cdn.alpinelinux.org/alpine/v3.24/community
  keyring:
    - https://dhi.io/keyring/dhi-apk@docker-0F81AD7700D99184.rsa.pub
  packages:
    - apk-tools
    - bash
    - busybox
    - ca-certificates
    - ca-certificates-bundle
    - codecov-api=26.9.10-r1
    - coreutils
    - findutils
    - python-3.13
    - tzdata
accounts:
  root: true
  run-as: root
  users:
    - name: nonroot
      uid: 65532
      gid: 65532
  groups:
    - name: nonroot
      gid: 65532
      members:
        - nonroot
os-release:
  name: Docker Hardened Images (Alpine)
  id: alpine
  version-id: "3.24"
  pretty-name: Docker Hardened Images/Alpine Linux v3.24
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
work-dir: /app/apps/codecov-api
environment:
  CODECOV_API_PORT: "8000"
  HOME: /home/nonroot
  PATH: /usr/lib/codecov-api/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
  PYTHONDONTWRITEBYTECODE: "1"
  PYTHONUNBUFFERED: "1"
  RELEASE_VERSION: 26.9.10
  RUN_ENV: ENTERPRISE
paths:
  - type: directory
    path: /home/nonroot
    uid: 65532
    gid: 65532
    mode: "0755"
  - type: directory
    path: /app
    uid: 0
    gid: 0
    mode: "0755"
  - type: directory
    path: /app/apps
    uid: 0
    gid: 0
    mode: "0755"
  - type: symlink
    path: /app/apps/codecov-api
    uid: 0
    gid: 0
    source: /usr/share/codecov-api
annotations:
  org.opencontainers.image.description: A minimal Codecov API image
  org.opencontainers.image.licenses: FSL-1.1-ALv2
entrypoint:
  - /usr/share/codecov-api/api.sh
ports:
  - 8000/tcp
