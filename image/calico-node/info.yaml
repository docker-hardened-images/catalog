metadata:
  display-name: Calico Node
  short-description: Calico's per-host DaemonSet container image. Provides CNI networking and policy for Kubernetes.
  featured: false
  home-url: https://www.tigera.io/project-calico/
  categories:
    - networking
  included-tools:
    - name: calico-node
      description: Main daemon that runs Felix (the policy/dataplane engine) and confd, and supervises the other services in this image via runit.
    - name: bird
      description: BIRD Internet Routing Daemon (IPv4) used to distribute BGP routing information between nodes.
    - name: bird6
      description: IPv6 variant of the BIRD BGP daemon.
    - name: birdcl
      description: Control CLI for inspecting and manipulating the running IPv4 BIRD daemon.
    - name: birdcl6
      description: Control CLI for inspecting and manipulating the running IPv6 BIRD daemon.
    - name: mountns
      description: Internal helper invoked by Felix to mount the host's root cgroup2 filesystem so eBPF programs can be attached correctly.
