# syntax=dhi.io/build:2-alpine3.24

name: Crossplane Provider Family AWS 2.x
image: dhi.io/crossplane-provider-family-aws
variant: runtime
tags:
  - 2-alpine
  - 2.9-alpine
  - 2-alpine3.24
  - 2.9.0-alpine
  - 2.9-alpine3.24
  - 2.9.0-alpine3.24
platforms:
  - linux/amd64
  - linux/arm64
dates:
  release: "2025-08-12"
vars:
  PACKAGE_SUFFIX: ""
  SEMVER_MAJOR_MINOR_VERSION: "2.9"
  SEMVER_MAJOR_VERSION: "2"
  SEMVER_VERSION: 2.9.0
  VERSION: 2.9.0-r0
contents:
  repositories:
    - https://dhi.io/apk/alpine/v3.24/main
    - https://dl-cdn.alpinelinux.org/alpine/v3.24/main
    - https://dl-cdn.alpinelinux.org/alpine/v3.24/community
  keyring:
    - https://dhi.io/keyring/dhi-apk@docker-0F81AD7700D99184.rsa.pub
  packages:
    - alpine-baselayout-data
    - ca-certificates-bundle
    - crossplane-provider-aws-2-config=2.9.0-r0
    - tzdata
  builds:
    - name: package-yaml
      shell: /bin/bash
      contents:
        packages:
          - bash
          - busybox
          - coreutils
          - crossplane-provider-aws-2-config-xpkg=2.9.0-r0
      pipeline:
        - name: verify package.yaml
          runs: |
            set -eux -o pipefail

            f=/usr/share/crossplane-provider-aws/config/package.yaml
            test -f "$f"
            test ! -L "$f"
            test -s "$f"
            grep -qx 'kind: Provider' "$f"
            test "$(grep -cx 'kind: CustomResourceDefinition' "$f")" -eq 5
      outputs:
        - source: /usr/share/crossplane-provider-aws/config/package.yaml
          target: /package.yaml
          uid: 0
          gid: 0
          mode: "0644"
accounts:
  run-as: "65532"
  users:
    - name: nonroot
      uid: 65532
      gid: 65532
  groups:
    - name: nonroot
      gid: 65532
      members:
        - nonroot
os-release:
  name: Docker Hardened Images (Alpine)
  id: alpine
  version-id: "3.24"
  pretty-name: Docker Hardened Images/Alpine Linux v3.24
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
environment:
  TF_APPEND_USER_AGENT: crossplane-provider-aws/v2.9.0 upbound-provider-aws/v2.9.0
paths:
  - type: directory
    path: /usr/local/bin
    uid: 0
    gid: 0
  - type: symlink
    path: /usr/local/bin/provider
    uid: 0
    gid: 0
    source: /usr/bin/provider-aws-config
annotations:
  org.opencontainers.image.description: A minimal Crossplane Provider Family AWS image
  org.opencontainers.image.licenses: Apache-2.0 AND MPL-2.0 AND MIT AND BSD-3-Clause AND BSD-2-Clause AND ISC AND Unicode-DFS-2016
entrypoint:
  - provider
ports:
  - 8080/tcp
  - 8081/tcp
  - 9443/tcp
