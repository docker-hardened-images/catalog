# syntax=dhi.io/build:2-debian13

name: Crossplane Provider Family AWS 2.x (dev)
image: dhi.io/crossplane-provider-family-aws
variant: dev
tags:
  - 2-dev
  - 2.9-dev
  - 2.9.0-dev
  - 2-debian-dev
  - 2-debian13-dev
  - 2.9-debian-dev
  - 2.9-debian13-dev
  - 2.9.0-debian-dev
  - 2.9.0-debian13-dev
platforms:
  - linux/amd64
  - linux/arm64
dates:
  release: "2025-08-12"
vars:
  PACKAGE_SUFFIX: ""
  SEMVER_MAJOR_MINOR_VERSION: "2.9"
  SEMVER_MAJOR_VERSION: "2"
  SEMVER_VERSION: 2.9.0
  VERSION: 2.9.0-0
contents:
  repositories:
    - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
  keyring:
    - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
  packages:
    - '!gawk'
    - '!libelogind0'
    - '!original-awk'
    - apt
    - base-files
    - bash
    - ca-certificates
    - ca-certificates-bundle
    - coreutils
    - crossplane-provider-aws-2-config=2.9.0-0
    - diffutils
    - dpkg
    - findutils
    - grep
    - libc-bin
    - mawk
    - perl-base
    - sed
    - tzdata
    - util-linux
  builds:
    - name: package-yaml
      shell: /bin/bash
      contents:
        packages:
          - base-files
          - bash
          - coreutils
          - grep
          - crossplane-provider-aws-2-config-xpkg=2.9.0-0
      pipeline:
        - name: verify package.yaml
          runs: |
            set -eux -o pipefail

            f=/usr/share/crossplane-provider-aws/config/package.yaml
            test -f "$f"
            test ! -L "$f"
            test -s "$f"
            grep -qx 'kind: Provider' "$f"
            test "$(grep -cx 'kind: CustomResourceDefinition' "$f")" -eq 5
      outputs:
        - source: /usr/share/crossplane-provider-aws/config/package.yaml
          target: /package.yaml
          uid: 0
          gid: 0
          mode: "0644"
accounts:
  root: true
  run-as: root
  users:
    - name: nonroot
      uid: 65532
      gid: 65532
    - name: _apt
      uid: 42
      gid: 65532
  groups:
    - name: nonroot
      gid: 65532
      members:
        - nonroot
os-release:
  name: Docker Hardened Images (Debian)
  id: debian
  version-id: "13"
  version-codename: trixie
  pretty-name: Docker Hardened Images/Debian GNU/Linux 13 (trixie)
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
environment:
  DEBIAN_FRONTEND: noninteractive
  TF_APPEND_USER_AGENT: crossplane-provider-aws/v2.9.0 upbound-provider-aws/v2.9.0
paths:
  - type: directory
    path: /usr/local/bin
    uid: 0
    gid: 0
  - type: symlink
    path: /usr/local/bin/provider
    uid: 0
    gid: 0
    source: /usr/bin/provider-aws-config
annotations:
  org.opencontainers.image.description: A minimal Crossplane Provider Family AWS image
  org.opencontainers.image.licenses: Apache-2.0 AND MPL-2.0 AND MIT AND BSD-3-Clause AND BSD-2-Clause AND ISC AND Unicode-DFS-2016
entrypoint:
  - provider
ports:
  - 8080/tcp
  - 8081/tcp
  - 9443/tcp
