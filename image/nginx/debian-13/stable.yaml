# syntax=dhi.io/build:2-debian13

name: Nginx stable
image: dhi.io/nginx
variant: runtime
tags:
  - "1.30"
  - 1.30.6
  - 1.30-debian
  - 1.30-debian13
  - 1.30.6-debian
  - 1.30.6-debian13
platforms:
  - linux/amd64
  - linux/arm64
dates:
  release: "2025-04-23"
vars:
  DEBIAN_EPOCH_MAJOR_MINOR_VERSION: "1.30"
  DEBIAN_EPOCH_MAJOR_VERSION: "1"
  DEBIAN_EPOCH_VERSION: 1.30.6
  NGINX_PACKAGE: nginx-stable
  NGINX_VERSION: 1.30.6
  PKG_RELEASE: "1"
  VERSION: 1.30.6-1
contents:
  repositories:
    - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
  keyring:
    - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
  packages:
    - '!libelogind0'
    - '!mawk'
    - '!original-awk'
    - base-files
    - coreutils
    - libc6
    - libcrypt1
    - libpcre2-8-0
    - libssl3t64
    - nginx-stable=1.30.6-1
    - zlib1g
accounts:
  run-as: nginx
  users:
    - name: nginx
      uid: 65532
      gid: 65532
  groups:
    - name: nginx
      gid: 65532
      members:
        - nginx
    - name: www-data
      gid: 82
os-release:
  name: Docker Hardened Images (Debian)
  id: debian
  version-id: "13"
  version-codename: trixie
  pretty-name: Docker Hardened Images/Debian GNU/Linux 13 (trixie)
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
environment:
  NGINX_VERSION: 1.30.6
  PKG_RELEASE: "1"
