# syntax=dhi.io/build:2-debian13

name: Metacontroller 4.x
image: dhi.io/metacontroller
variant: runtime
tags:
  - "4"
  - "4.17"
  - 4.17.11
  - 4-debian
  - 4-debian13
  - 4.17-debian
  - 4.17-debian13
  - 4.17.11-debian
  - 4.17.11-debian13
platforms:
  - linux/amd64
  - linux/arm64
dates:
  release: "2022-05-04"
vars:
  DEBIAN_EPOCH_MAJOR_MINOR_VERSION: "4.17"
  DEBIAN_EPOCH_MAJOR_VERSION: "4"
  DEBIAN_EPOCH_VERSION: 4.17.11
  FLAVORED_SUFFIX: ""
  SUFFIX: ""
  VERSION: 4.17.11-0
contents:
  repositories:
    - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
  keyring:
    - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
  packages:
    - '!libelogind0'
    - '!mawk'
    - '!original-awk'
    - base-files
    - ca-certificates-bundle
    - metacontroller-4=4.17.11-0
    - tzdata
accounts:
  run-as: "65532"
  users:
    - name: nonroot
      uid: 65532
      gid: 65532
  groups:
    - name: nonroot
      gid: 65532
      members:
        - nonroot
os-release:
  name: Docker Hardened Images (Debian)
  id: debian
  version-id: "13"
  version-codename: trixie
  pretty-name: Docker Hardened Images/Debian GNU/Linux 13 (trixie)
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
work-dir: /
annotations:
  org.opencontainers.image.description: A minimal Metacontroller image
  org.opencontainers.image.licenses: Apache-2.0 AND BSD-3-Clause AND ISC AND MIT
cmd:
  - /usr/bin/metacontroller
ports:
  - 8081/tcp
  - 9999/tcp
