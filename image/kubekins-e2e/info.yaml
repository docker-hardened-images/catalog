metadata:
  display-name: Kubekins-e2e
  short-description: Kubernetes test-infra image that runs end-to-end test jobs through kubetest2, kind, kubectl, Docker-in-Docker and the cloud CLIs.
  featured: false
  home-url: https://github.com/kubernetes/test-infra/tree/master/images/kubekins-e2e-v2
  categories:
    - developer-tools
    - integration-and-delivery
  included-tools:
    - name: runner.sh
      description: The entrypoint; wraps a command, activates gcloud credentials and starts Docker-in-Docker when asked.
    - name: kubetest2
      description: Deploys a Kubernetes cluster and runs tests against it, with the gce, gke and kind deployers and the exec, ginkgo, node and clusterloader2 testers.
    - name: kind
      description: Creates local Kubernetes clusters in Docker containers.
    - name: kubectl
      description: The Kubernetes command-line client.
    - name: Docker Engine and CLI
      description: Docker Engine for Docker-in-Docker, the Docker CLI and the buildx plugin.
    - name: Go
      description: The Go toolchain, with gcc for cgo builds.
    - name: Google Cloud CLI
      description: gcloud, gsutil and bq.
    - name: AWS CLI
      description: AWS CLI version 2 (Debian tags only).
    - name: helm
      description: The Kubernetes package manager.
    - name: gh
      description: The GitHub CLI.
