# syntax=dhi.io/build:2-debian13

name: Hyperledger Fabric Peer 3.x (dev)
image: dhi.io/hyperledger-fabric-peer
variant: dev
tags:
  - 3-dev
  - 3.1-dev
  - 3.1.5-dev
  - 3-debian-dev
  - 3-debian13-dev
  - 3.1-debian-dev
  - 3.1-debian13-dev
  - 3.1.5-debian-dev
  - 3.1.5-debian13-dev
platforms:
  - linux/amd64
  - linux/arm64
dates:
  release: "2025-10-18"
vars:
  COMMIT_SHA: 86c1172bec37e6590c6b1ae6f847833df48d65fc
  FLAVORED_SUFFIX: -dev
  PEER_3_SEMVER: 3.1.5
  SEMVER_MAJOR_MINOR_VERSION: "3.1"
  SEMVER_MAJOR_VERSION: "3"
  SEMVER_VERSION: 3.1.5
  SUFFIX: -dev
  VERSION: 3.1.5-14
contents:
  repositories:
    - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
  keyring:
    - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
  packages:
    - '!gawk'
    - '!libelogind0'
    - '!original-awk'
    - apt
    - base-files
    - bash
    - ca-certificates
    - ca-certificates-bundle
    - coreutils
    - diffutils
    - dpkg
    - findutils
    - grep
    - libc-bin
    - mawk
    - peer-3-dev=3.1.5-14
    - perl-base
    - sed
    - tzdata
    - util-linux
accounts:
  root: true
  run-as: root
  users:
    - name: nonroot
      uid: 65532
      gid: 65532
    - name: _apt
      uid: 42
      gid: 65532
  groups:
    - name: nonroot
      gid: 65532
      members:
        - nonroot
os-release:
  name: Docker Hardened Images (Debian)
  id: debian
  version-id: "13"
  version-codename: trixie
  pretty-name: Docker Hardened Images/Debian GNU/Linux 13 (trixie)
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
environment:
  DEBIAN_FRONTEND: noninteractive
  FABRIC_CFG_PATH: /etc/hyperledger/fabric
  FABRIC_VER: v3.1.5
paths:
  - type: directory
    path: /usr/local/bin
    uid: 0
    gid: 0
    mode: "0755"
  - type: symlink
    path: /usr/local/bin/peer
    uid: 0
    gid: 0
    source: /usr/bin/peer
annotations:
  org.opencontainers.image.description: A minimal Hyperledger Fabric Peer image
  org.opencontainers.image.licenses: Apache-2.0
entrypoint:
  - /usr/local/bin/peer
cmd:
  - node
  - start
ports:
  - 7051/tcp
