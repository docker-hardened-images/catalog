metadata:
  display-name: Teleport
  short-description: Teleport is an identity-aware access platform that provides SSO, short-lived certificates, MFA and session recording for SSH, Kubernetes, databases, web apps and Windows desktops.
  featured: false
  home-url: https://goteleport.com
  categories:
    - security
  included-tools:
    - name: tctl
      description: Teleport cluster administration tool
    - name: tsh
      description: Teleport client for SSH, Kubernetes, database, application and desktop access
    - name: tbot
      description: Teleport Machine & Workload Identity agent
    - name: fdpass-teleport
      description: SSH connection multiplexing helper used by tsh
