# syntax=dhi.io/build:2-debian13

name: Teleport 18.x
image: dhi.io/teleport
variant: runtime
tags:
  - "18"
  - "18.11"
  - 18.11.1
  - 18-debian
  - 18-debian13
  - 18.11-debian
  - 18.11-debian13
  - 18.11.1-debian
  - 18.11.1-debian13
platforms:
  - linux/amd64
  - linux/arm64
dates:
  release: "2025-07-04"
vars:
  FLAVORED_SUFFIX: ""
  SEMVER_MAJOR_MINOR_VERSION: "18.11"
  SEMVER_MAJOR_VERSION: "18"
  SEMVER_VERSION: 18.11.1
  SUFFIX: ""
  VERSION: 18.11.1-4
contents:
  repositories:
    - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
  keyring:
    - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
  packages:
    - base-files
    - ca-certificates-bundle
    - dumb-init
    - libaudit1
    - libbpf1
    - libc6
    - libcap-ng0
    - libelf1t64
    - libfido2-1
    - libgcc-s1
    - libpam0g
    - libpcsclite1
    - tbot-18=18.11.1-4
    - tctl-18=18.11.1-4
    - teleport-18=18.11.1-4
    - tsh-18=18.11.1-4
    - tzdata
    - zlib1g
accounts:
  run-as: nonroot
  users:
    - name: nonroot
      uid: 65532
      gid: 65532
  groups:
    - name: nonroot
      gid: 65532
      members:
        - nonroot
os-release:
  name: Docker Hardened Images (Debian)
  id: debian
  version-id: "13"
  version-codename: trixie
  pretty-name: Docker Hardened Images/Debian GNU/Linux 13 (trixie)
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
stop-signal: SIGQUIT
environment:
  SSL_CERT_FILE: /etc/ssl/certs/ca-certificates.crt
  TELEPORT_TOOLS_VERSION: "off"
paths:
  - type: directory
    path: /usr/local/bin
    uid: 0
    gid: 0
  - type: symlink
    path: /usr/local/bin/teleport
    uid: 0
    gid: 0
    source: /usr/bin/teleport
  - type: symlink
    path: /usr/local/bin/tctl
    uid: 0
    gid: 0
    source: /usr/bin/tctl
  - type: symlink
    path: /usr/local/bin/tsh
    uid: 0
    gid: 0
    source: /usr/bin/tsh
  - type: symlink
    path: /usr/local/bin/tbot
    uid: 0
    gid: 0
    source: /usr/bin/tbot
  - type: symlink
    path: /usr/local/bin/fdpass-teleport
    uid: 0
    gid: 0
    source: /usr/bin/fdpass-teleport
  - type: directory
    path: /etc/teleport
    uid: 65532
    gid: 65532
    mode: "0770"
  - type: directory
    path: /var/lib/teleport
    uid: 65532
    gid: 65532
    mode: "0770"
annotations:
  org.opencontainers.image.description: A minimal Teleport image
  org.opencontainers.image.licenses: AGPL-3.0-only
entrypoint:
  - /usr/bin/dumb-init
  - /usr/local/bin/teleport
  - start
  - -c
  - /etc/teleport/teleport.yaml
ports:
  - 3023/tcp
  - 3024/tcp
  - 3025/tcp
  - 3026/tcp
  - 3080/tcp
