# syntax=dhi.io/build:2-debian13

name: KAI Scheduler NUMA Placement Exporter 0.18.x (dev)
image: dhi.io/kai-scheduler-numa-placement-exporter
variant: dev
tags:
  - 0.18-dev
  - 0.18.8-dev
  - v0.18.8-dev
  - 0.18-debian-dev
  - 0.18-debian13-dev
  - 0.18.8-debian-dev
  - 0.18.8-debian13-dev
platforms:
  - linux/amd64
  - linux/arm64
dates:
  release: "2026-09-23"
  end-of-life: "2027-09-23"
vars:
  FLAVORED_SUFFIX: -dev
  LIBC6_VERSION: 2.41-12+deb13u5+dhi0
  OPENSSL_VERSION: 3.5.9-1~deb13u1+dhi1
  SEMVER_MAJOR_MINOR_VERSION: "0.18"
  SEMVER_MAJOR_VERSION: "0"
  SEMVER_VERSION: 0.18.8
  SUFFIX: -dev
  VERSION: 0.18.8-0
contents:
  repositories:
    - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
  keyring:
    - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
  packages:
    - '!gawk'
    - '!libelogind0'
    - '!mawk'
    - '!original-awk'
    - apt
    - base-files
    - bash
    - ca-certificates
    - ca-certificates-bundle
    - coreutils
    - diffutils
    - dpkg
    - findutils
    - grep
    - kai-scheduler-numa-placement-exporter-0.18-dev=0.18.8-0
    - libc-bin
    - libc-bin=2.41-12+deb13u5+dhi0
    - libc6=2.41-12+deb13u5+dhi0
    - libssl3t64=3.5.9-1~deb13u1+dhi1
    - mawk
    - openssl-provider-legacy=3.5.9-1~deb13u1+dhi1
    - openssl=3.5.9-1~deb13u1+dhi1
    - perl-base
    - sed
    - tzdata
    - util-linux
accounts:
  root: true
  run-as: root
  users:
    - name: nonroot
      uid: 65532
      gid: 65532
    - name: _apt
      uid: 42
      gid: 65532
  groups:
    - name: nonroot
      gid: 65532
      members:
        - nonroot
os-release:
  name: Docker Hardened Images (Debian)
  id: debian
  version-id: "13"
  version-codename: trixie
  pretty-name: Docker Hardened Images/Debian GNU/Linux 13 (trixie)
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
work-dir: /workspace
environment:
  DEBIAN_FRONTEND: noninteractive
paths:
  - type: directory
    path: /workspace
    uid: 0
    gid: 0
    mode: "0755"
  - type: symlink
    path: /workspace/app
    uid: 0
    gid: 0
    source: /usr/bin/numa-placement-exporter
annotations:
  org.opencontainers.image.description: A minimal KAI Scheduler NUMA Placement Exporter image
  org.opencontainers.image.licenses: Apache-2.0
entrypoint:
  - /workspace/app
