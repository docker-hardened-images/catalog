# syntax=dhi.io/build:2-debian13

name: Flux Operator 0.x
image: dhi.io/flux-operator
variant: runtime
tags:
  - "0"
  - "0.61"
  - 0.61.0
  - 0-debian
  - 0-debian13
  - 0.61-debian
  - 0.61-debian13
  - 0.61.0-debian
  - 0.61.0-debian13
platforms:
  - linux/amd64
  - linux/arm64
dates:
  release: "2024-05-29"
vars:
  FLAVORED_SUFFIX: ""
  SEMVER_MAJOR_MINOR_VERSION: "0.61"
  SEMVER_MAJOR_VERSION: "0"
  SEMVER_VERSION: 0.61.0
  SUFFIX: ""
  VERSION: 0.61.0-0
contents:
  repositories:
    - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
  keyring:
    - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
  packages:
    - base-files
    - ca-certificates-bundle
    - flux-operator=0.61.0-0
    - tzdata
accounts:
  run-as: nonroot
  users:
    - name: nonroot
      uid: 65532
      gid: 65532
  groups:
    - name: nonroot
      gid: 65532
      members:
        - nonroot
os-release:
  name: Docker Hardened Images (Debian)
  id: debian
  version-id: "13"
  version-codename: trixie
  pretty-name: Docker Hardened Images/Debian GNU/Linux 13 (trixie)
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
paths:
  - type: symlink
    path: /flux-operator
    uid: 0
    gid: 0
    source: /usr/bin/flux-operator
  - type: symlink
    path: /data
    uid: 0
    gid: 0
    source: /usr/share/flux-operator/data
annotations:
  org.opencontainers.image.description: A minimal Flux Operator image
  org.opencontainers.image.licenses: AGPL-3.0
entrypoint:
  - /usr/bin/flux-operator
ports:
  - 8080/tcp
  - 8081/tcp
  - 9080/tcp
