# syntax=dhi.io/build:2-debian13

name: Flyway 11.20.x
image: dhi.io/flyway
variant: runtime
tags:
  - "11"
  - "11.20"
  - 11.20.3
  - 11-jre21
  - 11-debian
  - 11-debian13
  - 11.20-jre21
  - 11.20-debian
  - 11.20.3-jre21
  - 11.20-debian13
  - 11.20.3-debian
  - 11-jre21-debian
  - 11.20.3-debian13
  - 11-jre21-debian13
  - 11.20-jre21-debian
  - 11.20-jre21-debian13
  - 11.20.3-jre21-debian
  - 11.20.3-jre21-debian13
platforms:
  - linux/amd64
  - linux/arm64
dates:
  release: "2026-01-26"
vars:
  FLAVORED_SUFFIX: ""
  JAVA_HOME: /usr/lib/jvm/temurin-21
  JDK_MAJOR_VERSION: "21"
  PACKAGE_NAME: flyway-11
  SEMVER_MAJOR_MINOR_VERSION: "11.20"
  SEMVER_MAJOR_VERSION: "11"
  SEMVER_VERSION: 11.20.3
  SUFFIX: ""
  VERSION: 11.20.3-6
contents:
  repositories:
    - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
  keyring:
    - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
  packages:
    - '!libelogind0'
    - '!mawk'
    - '!original-awk'
    - base-files
    - bash
    - ca-certificates-bundle
    - coreutils
    - eclipse-temurin-21-jre
    - eclipse-temurin-21-jre-oci-config
    - flyway-11=11.20.3-6
    - libc6
    - libstdc++6
    - tzdata
  builds:
    - name: locale
      contents:
        packages:
          - bash
          - locales
          - coreutils
          - gzip
      pipeline:
        - name: install locales
          runs: |
            set -eux -o pipefail

            ln -s /etc/locale.alias /usr/share/locale/locale.alias

            echo "en_US.UTF-8 UTF-8" >> /etc/locale.gen
            locale-gen en_US.UTF-8
      outputs:
        - source: /usr/share/locale
          target: /usr/share/locale
          uid: 0
          gid: 0
        - source: /usr/lib/locale
          target: /usr/lib/locale
          uid: 0
          gid: 0
accounts:
  run-as: nonroot
  users:
    - name: nonroot
      uid: 65532
      gid: 65532
  groups:
    - name: nonroot
      gid: 65532
      members:
        - nonroot
os-release:
  name: Docker Hardened Images (Debian)
  id: debian
  version-id: "13"
  version-codename: trixie
  pretty-name: Docker Hardened Images/Debian GNU/Linux 13 (trixie)
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
work-dir: /flyway
environment:
  JAVA_HOME: /usr/lib/jvm/temurin-21
  LANG: en_US.UTF-8
  LANGUAGE: en_US:en
  LC_ALL: en_US.UTF-8
  PATH: /flyway:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
paths:
  - type: symlink
    path: /flyway
    uid: 0
    gid: 0
    source: /usr/share/flyway
  - type: directory
    path: /opt
    uid: 0
    gid: 0
  - type: symlink
    path: /opt/flyway
    uid: 0
    gid: 0
    source: /flyway
  - type: directory
    path: /flyway/conf
    uid: 65532
    gid: 65532
  - type: directory
    path: /flyway/drivers
    uid: 65532
    gid: 65532
  - type: directory
    path: /flyway/jars
    uid: 65532
    gid: 65532
  - type: directory
    path: /flyway/sql
    uid: 65532
    gid: 65532
  - type: symlink
    path: /flyway/flyway.jar
    uid: 0
    gid: 0
    source: /flyway/lib/flyway/flyway-commandline-11.20.3.jar
  - type: directory
    path: /usr/local/bin
    uid: 0
    gid: 0
  - type: symlink
    path: /usr/local/bin/flyway
    uid: 0
    gid: 0
    source: /usr/bin/flyway
annotations:
  org.opencontainers.image.description: A minimal Flyway image
  org.opencontainers.image.licenses: Apache-2.0
entrypoint:
  - flyway
