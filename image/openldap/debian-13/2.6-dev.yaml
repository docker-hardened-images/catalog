# syntax=dhi.io/build:2-debian13

name: OpenLDAP 2.6.x (dev)
image: dhi.io/openldap
variant: dev
tags:
  - 2.6-dev
  - 2.6.16-dev
  - 2.6-debian-dev
  - 2.6-debian13-dev
  - 2.6.16-debian-dev
  - 2.6.16-debian13-dev
platforms:
  - linux/amd64
  - linux/arm64
dates:
  release: "2021-10-25"
vars:
  FLAVORED_SUFFIX: -dev
  SEMVER_MAJOR_MINOR_VERSION: "2.6"
  SEMVER_MAJOR_VERSION: "2"
  SEMVER_VERSION: 2.6.16
  SUFFIX: -dev
  VERSION: 2.6.16-0
contents:
  repositories:
    - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
  keyring:
    - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
  packages:
    - '!gawk'
    - '!libelogind0'
    - '!original-awk'
    - apt
    - base-files
    - bash
    - ca-certificates
    - ca-certificates-bundle
    - coreutils
    - diffutils
    - dpkg
    - findutils
    - grep
    - libargon2-1
    - libc-bin
    - libc6
    - libcrypt1
    - libltdl7
    - libodbc2
    - libperl5.40
    - libsasl2-2
    - libssl3t64
    - mawk
    - openldap-2.6-clients=2.6.16-0
    - openldap-2.6-libs=2.6.16-0
    - openldap-2.6=2.6.16-0
    - perl-base
    - sed
    - tzdata
    - util-linux
accounts:
  root: true
  run-as: root
  users:
    - name: nonroot
      uid: 65532
      gid: 65532
    - name: _apt
      uid: 42
      gid: 65532
  groups:
    - name: nonroot
      gid: 65532
      members:
        - nonroot
os-release:
  name: Docker Hardened Images (Debian)
  id: debian
  version-id: "13"
  version-codename: trixie
  pretty-name: Docker Hardened Images/Debian GNU/Linux 13 (trixie)
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
environment:
  DEBIAN_FRONTEND: noninteractive
paths:
  - type: directory
    path: /usr/local/bin
    uid: 0
    gid: 0
  - type: symlink
    path: /usr/local/bin/slapd
    uid: 0
    gid: 0
    source: /usr/sbin/slapd
  - type: directory
    path: /etc/openldap/slapd.d
    uid: 65532
    gid: 65532
    mode: "0700"
  - type: directory
    path: /var/lib/openldap/openldap-data
    uid: 65532
    gid: 65532
    mode: "0700"
  - type: directory
    path: /run/openldap
    uid: 65532
    gid: 65532
    mode: "0755"
annotations:
  org.opencontainers.image.description: A minimal OpenLDAP image
  org.opencontainers.image.licenses: OLDAP-2.8
entrypoint:
  - /usr/local/bin/slapd
cmd:
  - -d
  - "256"
  - -F
  - /etc/openldap/slapd.d
  - -h
  - ldap://:1389/ ldaps://:1636/ ldapi:///
ports:
  - 1389/tcp
  - 1636/tcp
