metadata:
  display-name: OpenLDAP
  short-description: OpenLDAP standalone LDAP server (slapd) with the OpenLDAP client tools
  featured: false
  home-url: https://www.openldap.org/
  categories:
    - security
  included-tools:
    - name: slapd
      description: OpenLDAP stand-alone LDAP server.
    - name: slapadd
      description: Offline tool that loads LDIF into a slapd configuration or database.
    - name: slapcat
      description: Tool that exports a slapd configuration or database as LDIF.
    - name: ldapsearch
      description: LDAP client that searches a directory.
    - name: ldapmodify
      description: LDAP client that adds and modifies entries, also available as ldapadd.
