# syntax=dhi.io/build:2-alpine3.24

name: OpenLDAP 2.6.x
image: dhi.io/openldap
variant: runtime
tags:
  - 2.6-alpine
  - 2.6.16-alpine
  - 2.6-alpine3.24
  - 2.6.16-alpine3.24
platforms:
  - linux/amd64
  - linux/arm64
dates:
  release: "2021-10-25"
vars:
  FLAVORED_SUFFIX: ""
  SEMVER_MAJOR_MINOR_VERSION: "2.6"
  SEMVER_MAJOR_VERSION: "2"
  SEMVER_VERSION: 2.6.16
  SUFFIX: ""
  VERSION: 2.6.16-r0
contents:
  repositories:
    - https://dhi.io/apk/alpine/v3.24/main
    - https://dl-cdn.alpinelinux.org/alpine/v3.24/main
    - https://dl-cdn.alpinelinux.org/alpine/v3.24/community
  keyring:
    - https://dhi.io/keyring/dhi-apk@docker-0F81AD7700D99184.rsa.pub
  packages:
    - alpine-baselayout-data
    - argon2-libs
    - ca-certificates-bundle
    - libcrypto3
    - libltdl
    - libsasl
    - libssl3
    - openldap-2.6-clients=2.6.16-r0
    - openldap-2.6-libs=2.6.16-r0
    - openldap-2.6=2.6.16-r0
    - perl
    - tzdata
    - unixodbc
accounts:
  run-as: nonroot
  users:
    - name: nonroot
      uid: 65532
      gid: 65532
  groups:
    - name: nonroot
      gid: 65532
      members:
        - nonroot
os-release:
  name: Docker Hardened Images (Alpine)
  id: alpine
  version-id: "3.24"
  pretty-name: Docker Hardened Images/Alpine Linux v3.24
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
paths:
  - type: directory
    path: /usr/local/bin
    uid: 0
    gid: 0
  - type: symlink
    path: /usr/local/bin/slapd
    uid: 0
    gid: 0
    source: /usr/sbin/slapd
  - type: directory
    path: /etc/openldap/slapd.d
    uid: 65532
    gid: 65532
    mode: "0700"
  - type: directory
    path: /var/lib/openldap/openldap-data
    uid: 65532
    gid: 65532
    mode: "0700"
  - type: directory
    path: /run/openldap
    uid: 65532
    gid: 65532
    mode: "0755"
annotations:
  org.opencontainers.image.description: A minimal OpenLDAP image
  org.opencontainers.image.licenses: OLDAP-2.8
entrypoint:
  - /usr/local/bin/slapd
cmd:
  - -d
  - "256"
  - -F
  - /etc/openldap/slapd.d
  - -h
  - ldap://:1389/ ldaps://:1636/ ldapi:///
ports:
  - 1389/tcp
  - 1636/tcp
