# syntax=dhi.io/build:2-debian13

name: kubernetes-pause 3.x
image: dhi.io/kubernetes-pause
variant: runtime
tags:
  - "3"
  - "3.10"
  - 3.10.2
  - 3-debian
  - 3-debian13
  - 3.10-debian
  - 3.10-debian13
  - 3.10.2-debian
  - 3.10.2-debian13
platforms:
  - linux/amd64
  - linux/arm64
dates:
  release: "2024-05-23"
vars:
  FLAVORED_SUFFIX: ""
  SEMVER_MAJOR_MINOR_VERSION: "3.10"
  SEMVER_MAJOR_VERSION: "3"
  SEMVER_VERSION: 3.10.2
  SUFFIX: ""
  VERSION: 3.10.2-1
contents:
  repositories:
    - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
  keyring:
    - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
  packages:
    - base-files
    - ca-certificates-bundle
    - kubernetes-pause=3.10.2-1
    - tzdata
accounts:
  run-as: pause
  users:
    - name: pause
      uid: 65535
      gid: 65535
  groups:
    - name: pause
      gid: 65535
      members:
        - pause
os-release:
  name: Docker Hardened Images (Debian)
  id: debian
  version-id: "13"
  version-codename: trixie
  pretty-name: Docker Hardened Images/Debian GNU/Linux 13 (trixie)
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
paths:
  - type: symlink
    path: /pause
    uid: 0
    gid: 0
    source: /usr/bin/pause
annotations:
  org.opencontainers.image.description: A minimal kubernetes-pause image
  org.opencontainers.image.licenses: Apache-2.0
entrypoint:
  - /pause
