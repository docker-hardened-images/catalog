# syntax=dhi.io/build:2-debian13

name: kubernetes-pause 3.x (dev)
image: dhi.io/kubernetes-pause
variant: dev
tags:
  - 3-dev
  - 3.10-dev
  - 3.10.2-dev
  - 3-debian-dev
  - 3-debian13-dev
  - 3.10-debian-dev
  - 3.10-debian13-dev
  - 3.10.2-debian-dev
  - 3.10.2-debian13-dev
platforms:
  - linux/amd64
  - linux/arm64
dates:
  release: "2024-05-23"
vars:
  FLAVORED_SUFFIX: -dev
  SEMVER_MAJOR_MINOR_VERSION: "3.10"
  SEMVER_MAJOR_VERSION: "3"
  SEMVER_VERSION: 3.10.2
  SUFFIX: -dev
  VERSION: 3.10.2-1
contents:
  repositories:
    - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
  keyring:
    - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
  packages:
    - '!gawk'
    - '!libelogind0'
    - '!original-awk'
    - apt
    - base-files
    - bash
    - ca-certificates
    - ca-certificates-bundle
    - coreutils
    - diffutils
    - dpkg
    - findutils
    - grep
    - kubernetes-pause-dev=3.10.2-1
    - libc-bin
    - mawk
    - perl-base
    - sed
    - tzdata
    - util-linux
  builds:
    - name: locale
      contents:
        packages:
          - bash
          - locales
          - coreutils
          - gzip
      pipeline:
        - name: install locales
          runs: |
            set -eux -o pipefail

            ln -s /etc/locale.alias /usr/share/locale/locale.alias

            echo "en_US.UTF-8 UTF-8" >> /etc/locale.gen
            locale-gen en_US.UTF-8
      outputs:
        - source: /usr/share/locale
          target: /usr/share/locale
          uid: 0
          gid: 0
        - source: /usr/lib/locale
          target: /usr/lib/locale
          uid: 0
          gid: 0
accounts:
  root: true
  run-as: root
  users:
    - name: pause
      uid: 65535
      gid: 65535
    - name: _apt
      uid: 42
      gid: 65532
  groups:
    - name: pause
      gid: 65535
      members:
        - pause
os-release:
  name: Docker Hardened Images (Debian)
  id: debian
  version-id: "13"
  version-codename: trixie
  pretty-name: Docker Hardened Images/Debian GNU/Linux 13 (trixie)
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
environment:
  DEBIAN_FRONTEND: noninteractive
  LANG: en_US.UTF-8
  LANGUAGE: en_US:en
  LC_ALL: en_US.UTF-8
paths:
  - type: symlink
    path: /pause
    uid: 0
    gid: 0
    source: /usr/bin/pause
annotations:
  org.opencontainers.image.description: A minimal kubernetes-pause image
  org.opencontainers.image.licenses: Apache-2.0
entrypoint:
  - /pause
