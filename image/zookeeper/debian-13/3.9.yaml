# syntax=dhi.io/build:2-debian13

name: Zookeeper 3.9.x
image: dhi.io/zookeeper
variant: runtime
tags:
  - "3"
  - 3-jre25
  - 3-debian
  - 3.9-jre25
  - 3-debian13
  - 3.9.7-jre25
  - 3-jre25-debian
  - 3-jre25-debian13
  - 3.9-jre25-debian
  - 3.9-jre25-debian13
  - 3.9.7-jre25-debian
  - 3.9.7-jre25-debian13
platforms:
  - linux/amd64
  - linux/arm64
dates:
  release: "2023-07-19"
vars:
  JDK_MAJOR_VERSION: "25"
  JRE_PATH: /opt/java/openjdk/25-jre
  SEMVER_MAJOR_MINOR_VERSION: "3.9"
  SEMVER_MAJOR_VERSION: "3"
  SEMVER_VERSION: 3.9.7
  VERSION: 3.9.7-1
  ZOOKEEPER_BIN_SHA256: d87db41fc53cf06966497489be6ee604b9bbd5f53871183a252371db75f7617c
contents:
  repositories:
    - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
  keyring:
    - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
  packages:
    - '!libelogind0'
    - '!mawk'
    - '!original-awk'
    - base-files
    - bash
    - ca-certificates-bundle
    - coreutils
    - eclipse-temurin-25-jre
    - eclipse-temurin-25-jre-oci-config
    - grep
    - sed
    - tzdata
    - zlib1g
    - zookeeper-3.9=3.9.7-1
  builds:
    - name: zookeeper docs
      contents:
        packages:
          - bash
          - coreutils
          - gzip
          - tar
        files:
          - url: https://archive.apache.org/dist/zookeeper/zookeeper-3.9.7/apache-zookeeper-3.9.7-bin.tar.gz
            checksum: sha256:d87db41fc53cf06966497489be6ee604b9bbd5f53871183a252371db75f7617c
            path: ${source.dir}/zookeeper-bin.tar.gz
            spdx:
              name: zookeeper-docs
              version: 3.9.7
              packages:
                - name: zookeeper-docs
                  purl: pkg:maven/org.apache.zookeeper/zookeeper@3.9.7
                  license: Apache-2.0
            uid: 0
            gid: 0
      pipeline:
        - name: extract docs
          runs: |
            set -eux -o pipefail

            mkdir -p "${target.dir}/usr/share/zookeeper"
            tar -xzf "${source.dir}/zookeeper-bin.tar.gz" -C "${target.dir}/usr/share/zookeeper" --strip-components=1 "apache-zookeeper-3.9.7-bin/docs"
            test -f "${target.dir}/usr/share/zookeeper/docs/index.html"
      outputs:
        - source: ${target.dir}/usr/share/zookeeper/docs
          target: /usr/share/zookeeper/docs
          uid: 0
          gid: 0
    - name: locale
      contents:
        packages:
          - bash
          - locales
          - coreutils
          - gzip
      pipeline:
        - name: install locales
          runs: |
            set -eux -o pipefail

            ln -s /etc/locale.alias /usr/share/locale/locale.alias

            echo "en_US.UTF-8 UTF-8" >> /etc/locale.gen
            locale-gen en_US.UTF-8
      outputs:
        - source: /usr/share/locale
          target: /usr/share/locale
          uid: 0
          gid: 0
        - source: /usr/lib/locale
          target: /usr/lib/locale
          uid: 0
          gid: 0
accounts:
  run-as: nonroot
  users:
    - name: nonroot
      uid: 65532
      gid: 65532
  groups:
    - name: nonroot
      gid: 65532
      members:
        - nonroot
os-release:
  name: Docker Hardened Images (Debian)
  id: debian
  version-id: "13"
  version-codename: trixie
  pretty-name: Docker Hardened Images/Debian GNU/Linux 13 (trixie)
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
environment:
  JAVA_HOME: /opt/java/openjdk/25-jre
  LANG: en_US.UTF-8
  LANGUAGE: en_US:en
  LC_ALL: en_US.UTF-8
  PATH: /opt/zookeeper/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
  ZOO_ADMINSERVER_ENABLED: "true"
  ZOO_AUTOPURGE_PURGEINTERVAL: "0"
  ZOO_AUTOPURGE_SNAPRETAINCOUNT: "3"
  ZOO_CONF_DIR: /opt/zookeeper/conf
  ZOO_DATA_DIR: /var/zookeeper/data
  ZOO_DATA_LOG_DIR: /var/zookeeper/datalog
  ZOO_INIT_LIMIT: "5"
  ZOO_LOG_DIR: /var/zookeeper/logs
  ZOO_MAX_CLIENT_CNXNS: "60"
  ZOO_STANDALONE_ENABLED: "true"
  ZOO_SYNC_LIMIT: "2"
  ZOO_TICK_TIME: "2000"
  ZOOCFGDIR: /opt/zookeeper/conf
paths:
  - type: directory
    path: /opt/java
    uid: 0
    gid: 0
    mode: "0755"
  - type: directory
    path: /opt/java/openjdk
    uid: 0
    gid: 0
    mode: "0755"
  - type: symlink
    path: /opt/java/openjdk/25-jre
    uid: 0
    gid: 0
    source: /usr/lib/jvm/temurin-25
  - type: symlink
    path: /opt/zookeeper
    uid: 0
    gid: 0
    source: /usr/share/zookeeper
  - type: file
    path: /opt/zookeeper/bin/entrypoint.sh
    uid: 0
    gid: 0
    mode: "0755"
    source: image/zookeeper/bin/entrypoint.sh
  - type: directory
    path: /opt/zookeeper/conf
    uid: 65532
    gid: 65532
  - type: directory
    path: /var/zookeeper/data
    uid: 65532
    gid: 65532
  - type: directory
    path: /var/zookeeper/datalog
    uid: 65532
    gid: 65532
  - type: directory
    path: /var/zookeeper/logs
    uid: 65532
    gid: 65532
annotations:
  org.opencontainers.image.description: A minimal Zookeeper image
  org.opencontainers.image.licenses: Apache-2.0
entrypoint:
  - entrypoint.sh
cmd:
  - zkServer.sh
  - start-foreground
