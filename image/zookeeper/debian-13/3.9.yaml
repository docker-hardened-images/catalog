  SEMVER_MAJOR_MINOR_VERSION: "3.9"
  SEMVER_MAJOR_VERSION: "3"
  SEMVER_VERSION: 3.9.6
  VERSION: 3.9.6
contents:
  repositories:
    - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
  keyring:
    - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
  packages:
    - '!libelogind0'
    - '!mawk'
    - '!original-awk'
    - base-files
    - bash
    - coreutils
    - grep
    - sed
    - zlib1g
  builds:
    - name: zookeeper
      contents:
        packages:
          - coreutils
          - bash
          - findutils
          - gzip
          - hostname
          - sed
        files:
          - url: git+https://github.com/apache/zookeeper.git#release-3.9.6
            checksum: a355171b081b5b60749db8f19cca1528b0df936f
            path: ${source.dir}/src/zookeeper
            spdx:
              name: zookeeper
              version: 3.9.6
              packages:
                - name: zookeeper
                  purl: pkg:dhi/zookeeper@3.9.6
                  license: Apache-2.0
            uid: 0
            gid: 0
        artifacts:
          - name: dhi.io/maven:3.10.0-jdk25-debian13-dev@sha256:b0b1c5ac3066174565346260bd1f5909f152ec90fa561e5fa1f8ea0e21f863eb
            includes:
              - opt/**
              - usr/local/bin/**
            uid: 0
            gid: 0
          - name: dhi.io/eclipse-temurin:25.0.5.8-jdk-debian13-dev@sha256:e9cb69a4921d9557e939e858119ba55a13a9db8aca063f60179e317263e79c37
            includes:
              - opt/java/openjdk/**
              - usr/local/bin/**
            uid: 0
            gid: 0
      pipeline:
        - name: patch
          uses: mvn/patch@v1
          with:
            mvn-root: ${source.dir}/src/zookeeper
            properties: ${source.dir}/patch/mvn-properties-3.9.json
        - name: drop jline jdk8 classifier
          runs: |
            set -eux -o pipefail

            find "${source.dir}/src/zookeeper" -name pom.xml -exec sed -i '/<artifactId>jline<\/artifactId>/,/<\/dependency>/{ /<classifier>jdk8<\/classifier>/d }' {} +
        - name: configure maven mirror
          privileged: true
          runs: |
            set -eux -o pipefail

            mkdir -p /root/.m2
            cat > /root/.m2/settings.xml << 'EOF'
            <?xml version="1.0" encoding="UTF-8"?>
            <settings xmlns="http://maven.apache.org/SETTINGS/1.0.0">
              <mirrors>
                <mirror>
                  <id>google-maven-central</id>
                  <name>GCS Maven Central mirror</name>
                  <url>https://maven-central.storage-download.googleapis.com/maven2/</url>
                  <mirrorOf>central</mirrorOf>
                </mirror>
              </mirrors>
            </settings>
            EOF
        - name: install
          privileged: true
          runs: |
            set -eux -o pipefail

            export MAVEN_HOME="/opt/java/apache-maven-3.10.0"
            export MAVEN_VERSION="3.10.0"
            export JAVA_HOME="/opt/java/openjdk/25"

            mkdir -p "${target.dir}/zookeeper"

            cd "${source.dir}/src/zookeeper"

            mvn clean install -DskipTests

            tar -zxf "zookeeper-assembly/target/apache-zookeeper-3.9.6-bin.tar.gz" -C "${target.dir}/zookeeper" --strip-components=1
            chown -R 65532:65532 "${target.dir}/zookeeper/conf"
      paths:
        - type: file
          path: /src/patch/mvn-properties-3.9.json
          uid: 0
          gid: 0
          source: image/zookeeper/patch/mvn-properties-3.9.json
      outputs:
        - source: ${target.dir}/zookeeper
          target: /opt/zookeeper
          uid: 0
          gid: 0
        - source: /opt/docker/sbom
          target: /opt/docker/sbom
          uid: 0
          gid: 0
    - name: locale
      contents:
        packages:
          - bash
          - locales
          - coreutils
          - gzip
      pipeline:
        - name: install locales
          runs: |
            set -eux -o pipefail

            ln -s /etc/locale.alias /usr/share/locale/locale.alias

            echo "en_US.UTF-8 UTF-8" >> /etc/locale.gen
            locale-gen en_US.UTF-8
      outputs:
        - source: /usr/share/locale
          target: /usr/share/locale
          uid: 0
          gid: 0
        - source: /usr/lib/locale
          target: /usr/lib/locale
          uid: 0
          gid: 0
  artifacts:
    - name: dhi.io/eclipse-temurin:25.0.5.8-debian13@sha256:03940d5da6f4d531421a83695493d67e9447621b7de87bfeccfa81a6e137c738
      includes:
        - opt/**
      uid: 0
      gid: 0
