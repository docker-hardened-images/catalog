# syntax=dhi.io/build:2-debian13

name: Fleet Agent 0.14.x
image: dhi.io/fleet-agent
variant: runtime
tags:
  - "0.14"
  - 0.14.12
  - v0.14.12
  - 0.14-debian
  - 0.14-debian13
  - 0.14.12-debian
  - 0.14.12-debian13
platforms:
  - linux/amd64
  - linux/arm64
dates:
  release: "2025-11-18"
vars:
  FLAVORED_SUFFIX: ""
  SEMVER_MAJOR_MINOR_VERSION: "0.14"
  SEMVER_MAJOR_VERSION: "0"
  SEMVER_VERSION: 0.14.12
  SUFFIX: ""
  VERSION: 0.14.12-0
contents:
  repositories:
    - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
  keyring:
    - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
  packages:
    - base-files
    - ca-certificates-bundle
    - fleet-0.14=0.14.12-0
    - tzdata
accounts:
  run-as: nonroot
  users:
    - name: nonroot
      uid: 65532
      gid: 65532
  groups:
    - name: nonroot
      gid: 65532
      members:
        - nonroot
os-release:
  name: Docker Hardened Images (Debian)
  id: debian
  version-id: "13"
  version-codename: trixie
  pretty-name: Docker Hardened Images/Debian GNU/Linux 13 (trixie)
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
work-dir: /
paths:
  - type: directory
    path: /usr/local/bin
    uid: 0
    gid: 0
  - type: symlink
    path: /usr/local/bin/fleetagent
    uid: 0
    gid: 0
    source: /usr/bin/fleetagent
annotations:
  org.opencontainers.image.description: A minimal Fleet Agent image
  org.opencontainers.image.licenses: Apache-2.0
entrypoint:
  - /usr/local/bin/fleetagent
