# syntax=dhi.io/build:2-debian13

name: Percona Server for MongoDB 7.0.x (dev)
image: dhi.io/percona-server-mongodb
variant: dev
tags:
  - 7-dev
  - 7.0-dev
  - 7.0.40-dev
  - 7-debian-dev
  - 7.0.40-22-dev
  - 7-debian13-dev
  - 7.0-debian-dev
  - 7.0-debian13-dev
  - 7.0.40-debian-dev
  - 7.0.40-debian13-dev
  - 7.0.40-22-debian-dev
  - 7.0.40-22-debian13-dev
platforms:
  - linux/amd64
  - linux/arm64
dates:
  release: "2023-12-11"
  end-of-life: "2027-08-31"
vars:
  PACKAGE_NAME: percona-server-mongodb-7.0
  PSMDB_VERSION: 7.0.40-22
  SEMVER_MAJOR_MINOR_VERSION: "7.0"
  SEMVER_MAJOR_VERSION: "7"
  SEMVER_VERSION: 7.0.40
  VERSION: 7.0.40-22-0
contents:
  repositories:
    - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
  keyring:
    - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
  packages:
    - '!gawk'
    - '!libelogind0'
    - '!mawk'
    - '!original-awk'
    - apt
    - base-files
    - bash
    - ca-certificates-bundle
    - coreutils
    - diffutils
    - dpkg
    - findutils
    - grep
    - libc-bin
    - libcurl4t64
    - libgssapi-krb5-2
    - libkrb5-3
    - libldap2
    - libsasl2-2
    - libsasl2-modules
    - libsasl2-modules-gssapi-mit
    - libssl3t64
    - mawk
    - percona-server-mongodb-7.0-mongos=7.0.40-22-0
    - percona-server-mongodb-7.0-mongosh=7.0.40-22-0
    - percona-server-mongodb-7.0-tools=7.0.40-22-0
    - percona-server-mongodb-7.0=7.0.40-22-0
    - perl-base
    - sed
    - tzdata
    - util-linux
    - zlib1g
accounts:
  root: true
  run-as: root
  users:
    - name: mongodb
      uid: 1001
      gid: 0
    - name: _apt
      uid: 42
      gid: 65532
  groups:
    - name: mongodb
      gid: 1001
      members:
        - mongodb
os-release:
  name: Docker Hardened Images (Debian)
  id: debian
  version-id: "13"
  version-codename: trixie
  pretty-name: Docker Hardened Images/Debian GNU/Linux 13 (trixie)
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
environment:
  DEBIAN_FRONTEND: noninteractive
  HOME: /home/mongodb
  PSMDB_VERSION: 7.0.40-22
paths:
  - type: directory
    path: /usr/local/bin
    uid: 0
    gid: 0
    mode: "0755"
  - type: symlink
    path: /usr/local/bin/mongod
    uid: 0
    gid: 0
    source: /usr/bin/mongod
  - type: directory
    path: /home/mongodb
    uid: 1001
    gid: 1001
    mode: "0770"
  - type: directory
    path: /data
    uid: 1001
    gid: 1001
    mode: "0770"
  - type: directory
    path: /data/db
    uid: 1001
    gid: 1001
    mode: "0770"
  - type: directory
    path: /data/configdb
    uid: 1001
    gid: 1001
    mode: "0770"
  - type: directory
    path: /var/log/mongo
    uid: 1001
    gid: 1001
    mode: "0770"
annotations:
  org.opencontainers.image.description: A minimal Percona Server for MongoDB image
  org.opencontainers.image.licenses: SSPL-1.0
entrypoint:
  - /usr/local/bin/mongod
ports:
  - 27017/tcp
