# syntax=dhi.io/build:2-debian13

name: Percona Server for MongoDB 8.3.x
image: dhi.io/percona-server-mongodb
variant: runtime
tags:
  - "8"
  - "8.3"
  - 8.3.13
  - 8-debian
  - 8.3.13-4
  - 8-debian13
  - 8.3-debian
  - 8.3-debian13
  - 8.3.13-debian
  - 8.3.13-4-debian
  - 8.3.13-debian13
  - 8.3.13-4-debian13
platforms:
  - linux/amd64
  - linux/arm64
dates:
  release: "2026-07-29"
vars:
  PACKAGE_NAME: percona-server-mongodb-8.3
  PSMDB_VERSION: 8.3.13-4
  SEMVER_MAJOR_MINOR_VERSION: "8.3"
  SEMVER_MAJOR_VERSION: "8"
  SEMVER_VERSION: 8.3.13
  VERSION: 8.3.13-4-1
contents:
  repositories:
    - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
  keyring:
    - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
  packages:
    - '!libelogind0'
    - '!mawk'
    - '!original-awk'
    - base-files
    - ca-certificates-bundle
    - libcurl4t64
    - libgssapi-krb5-2
    - libkrb5-3
    - libldap2
    - libsasl2-2
    - libsasl2-modules
    - libsasl2-modules-gssapi-mit
    - libssl3t64
    - percona-server-mongodb-8.3-mongos=8.3.13-4-1
    - percona-server-mongodb-8.3-mongosh=8.3.13-4-1
    - percona-server-mongodb-8.3-tools=8.3.13-4-1
    - percona-server-mongodb-8.3=8.3.13-4-1
    - tzdata
    - zlib1g
accounts:
  run-as: mongodb
  users:
    - name: mongodb
      uid: 1001
      gid: 0
  groups:
    - name: mongodb
      gid: 1001
      members:
        - mongodb
os-release:
  name: Docker Hardened Images (Debian)
  id: debian
  version-id: "13"
  version-codename: trixie
  pretty-name: Docker Hardened Images/Debian GNU/Linux 13 (trixie)
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
environment:
  HOME: /home/mongodb
  PSMDB_VERSION: 8.3.13-4
paths:
  - type: directory
    path: /usr/local/bin
    uid: 0
    gid: 0
    mode: "0755"
  - type: symlink
    path: /usr/local/bin/mongod
    uid: 0
    gid: 0
    source: /usr/bin/mongod
  - type: directory
    path: /home/mongodb
    uid: 1001
    gid: 1001
    mode: "0770"
  - type: directory
    path: /data
    uid: 1001
    gid: 1001
    mode: "0770"
  - type: directory
    path: /data/db
    uid: 1001
    gid: 1001
    mode: "0770"
  - type: directory
    path: /data/configdb
    uid: 1001
    gid: 1001
    mode: "0770"
  - type: directory
    path: /var/log/mongo
    uid: 1001
    gid: 1001
    mode: "0770"
annotations:
  org.opencontainers.image.description: A minimal Percona Server for MongoDB image
  org.opencontainers.image.licenses: SSPL-1.0
entrypoint:
  - /usr/local/bin/mongod
ports:
  - 27017/tcp
