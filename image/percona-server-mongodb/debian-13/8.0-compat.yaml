# syntax=dhi.io/build:2-debian13

name: Percona Server for MongoDB 8.0.x (compat)
image: dhi.io/percona-server-mongodb
variant: runtime
flavor: compat
tags:
  - 8-compat
  - 8.0-compat
  - 8.0.29-compat
  - 8-debian-compat
  - 8.0.29-13-compat
  - 8-debian13-compat
  - 8.0-debian-compat
  - 8.0-debian13-compat
  - 8.0.29-debian-compat
  - 8.0.29-debian13-compat
  - 8.0.29-13-debian-compat
  - 8.0.29-13-debian13-compat
platforms:
  - linux/amd64
  - linux/arm64
dates:
  release: "2024-12-17"
  end-of-life: "2029-10-31"
vars:
  JS_YAML_VERSION: 4.3.2
  PACKAGE_NAME: percona-server-mongodb-8.0
  PSMDB_VERSION: 8.0.29-13
  SEMVER_MAJOR_MINOR_VERSION: "8.0"
  SEMVER_MAJOR_VERSION: "8"
  SEMVER_VERSION: 8.0.29
  VERSION: 8.0.29-13-1
contents:
  repositories:
    - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
  keyring:
    - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
  packages:
    - '!libelogind0'
    - '!mawk'
    - '!original-awk'
    - base-files
    - bash
    - ca-certificates-bundle
    - coreutils
    - findutils
    - gosu
    - grep
    - jq
    - libcurl4t64
    - libgssapi-krb5-2
    - libkrb5-3
    - libldap2
    - libsasl2-2
    - libsasl2-modules
    - libsasl2-modules-gssapi-mit
    - libssl3t64
    - mawk
    - numactl
    - percona-server-mongodb-8.0-mongobridge=8.0.29-13-1
    - percona-server-mongodb-8.0-mongos=8.0.29-13-1
    - percona-server-mongodb-8.0-mongosh=8.0.29-13-1
    - percona-server-mongodb-8.0-tools=8.0.29-13-1
    - percona-server-mongodb-8.0=8.0.29-13-1
    - procps
    - tzdata
    - zlib1g
  builds:
    - name: compat entrypoint
      contents:
        packages:
          - bash
          - coreutils
          - gzip
          - tar
        files:
          - url: https://registry.npmjs.org/js-yaml/-/js-yaml-4.3.2.tgz
            checksum: sha256:c7b241d2224cf9253ff53854aa4cee87da91bd889c4d0fa3a3ffd1041ecee5b1
            path: ${source.dir}/js-yaml.tgz
            spdx:
              name: js-yaml
              version: 4.3.2
              packages:
                - name: js-yaml
                  purl: pkg:npm/js-yaml@4.3.2
                  license: MIT
            uid: 0
            gid: 0
      pipeline:
        - name: install
          runs: |
            set -eux -o pipefail

            tar -xzf "${source.dir}/js-yaml.tgz" -C "${source.dir}" package/dist/js-yaml.min.js
            install -D -m 0644 "${source.dir}/package/dist/js-yaml.min.js" "${target.dir}/js-yaml.js"
            install -D -m 0755 "${source.dir}/docker-entrypoint.sh" "${target.dir}/usr/local/bin/docker-entrypoint.sh"
      paths:
        - type: file
          path: ${source.dir}/docker-entrypoint.sh
          uid: 0
          gid: 0
          source: image/percona-server-mongodb/bin/docker-entrypoint.sh
        - type: directory
          path: ${target.dir}
          uid: 0
          gid: 0
        - type: symlink
          path: ${target.dir}/entrypoint.sh
          uid: 0
          gid: 0
          source: usr/local/bin/docker-entrypoint.sh
      outputs:
        - source: ${target.dir}/
          target: /
          uid: 0
          gid: 0
        - source: /opt/docker/sbom/js-yaml
          target: /opt/docker/sbom/js-yaml
          uid: 0
          gid: 0
accounts:
  run-as: mongodb
  users:
    - name: mongodb
      uid: 1001
      gid: 0
  groups:
    - name: mongodb
      gid: 1001
      members:
        - mongodb
os-release:
  name: Docker Hardened Images (Debian)
  id: debian
  version-id: "13"
  version-codename: trixie
  pretty-name: Docker Hardened Images/Debian GNU/Linux 13 (trixie)
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
environment:
  HOME: /home/mongodb
  PSMDB_VERSION: 8.0.29-13
paths:
  - type: directory
    path: /usr/local/bin
    uid: 0
    gid: 0
    mode: "0755"
  - type: symlink
    path: /usr/local/bin/mongod
    uid: 0
    gid: 0
    source: /usr/bin/mongod
  - type: directory
    path: /home/mongodb
    uid: 1001
    gid: 1001
    mode: "0770"
  - type: directory
    path: /data
    uid: 1001
    gid: 1001
    mode: "0770"
  - type: directory
    path: /data/db
    uid: 1001
    gid: 1001
    mode: "0770"
  - type: directory
    path: /data/configdb
    uid: 1001
    gid: 1001
    mode: "0770"
  - type: directory
    path: /var/log/mongo
    uid: 1001
    gid: 1001
    mode: "0770"
annotations:
  org.opencontainers.image.description: A minimal Percona Server for MongoDB image
  org.opencontainers.image.licenses: SSPL-1.0
entrypoint:
  - /usr/local/bin/docker-entrypoint.sh
cmd:
  - mongod
ports:
  - 27017/tcp
