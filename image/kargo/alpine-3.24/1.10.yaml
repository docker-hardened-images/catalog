# syntax=dhi.io/build:2-alpine3.24

name: Kargo 1.10.x
image: dhi.io/kargo
variant: runtime
tags:
  - 1.10-alpine
  - 1.10.16-alpine
  - 1.10-alpine3.24
  - 1.10.16-alpine3.24
platforms:
  - linux/amd64
  - linux/arm64
dates:
  release: "2026-04-17"
vars:
  DHI_TAGS_OVERWRITE: "true"
  PACKAGE_SUFFIX: ""
  SEMVER_MAJOR_MINOR_VERSION: "1.10"
  SEMVER_MAJOR_VERSION: "1"
  SEMVER_VERSION: 1.10.16
  SHIP_GRPC_HEALTH_PROBE: "true"
  VERSION: 1.10.16-r6
contents:
  repositories:
    - https://dhi.io/apk/alpine/v3.24/main
    - https://dl-cdn.alpinelinux.org/alpine/v3.24/main
    - https://dl-cdn.alpinelinux.org/alpine/v3.24/community
  keyring:
    - https://dhi.io/keyring/dhi-apk@docker-0F81AD7700D99184.rsa.pub
  packages:
    - alpine-baselayout-data
    - ca-certificates-bundle
    - dash
    - git
    - gnupg
    - gpg
    - gpg-agent
    - kargo-1.10=1.10.16-r6
    - openssh-client
    - tini
    - tzdata
accounts:
  run-as: nonroot
  users:
    - name: nonroot
      uid: 65532
      gid: 65532
  groups:
    - name: nonroot
      gid: 65532
      members:
        - nonroot
os-release:
  name: Docker Hardened Images (Alpine)
  id: alpine
  version-id: "3.24"
  pretty-name: Docker Hardened Images/Alpine Linux v3.24
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
environment:
  SSL_CERT_FILE: /etc/ssl/certs/ca-certificates.crt
paths:
  - type: directory
    path: /usr/local/bin
    uid: 0
    gid: 0
  - type: symlink
    path: /usr/local/bin/kargo
    uid: 0
    gid: 0
    source: /usr/bin/kargo
  - type: symlink
    path: /usr/local/bin/credential-helper
    uid: 0
    gid: 0
    source: /usr/bin/credential-helper
  - type: symlink
    path: /usr/local/bin/helm
    uid: 0
    gid: 0
    source: /usr/bin/helm
  - type: symlink
    path: /usr/local/bin/grpc_health_probe
    uid: 0
    gid: 0
    source: /usr/bin/grpc_health_probe
  - type: directory
    path: /home/nonroot
    uid: 65532
    gid: 65532
    mode: "0700"
annotations:
  org.opencontainers.image.description: A minimal Kargo image
  org.opencontainers.image.licenses: Apache-2.0
entrypoint:
  - /sbin/tini
  - --
cmd:
  - /usr/local/bin/kargo
ports:
  - 8080/tcp
  - 9443/tcp
