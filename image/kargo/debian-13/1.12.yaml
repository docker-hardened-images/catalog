# syntax=dhi.io/build:2-debian13

name: Kargo 1.12.x
image: dhi.io/kargo
variant: runtime
tags:
  - "1"
  - "1.12"
  - 1.12.5
  - 1-debian
  - 1-debian13
  - 1.12-debian
  - 1.12-debian13
  - 1.12.5-debian
  - 1.12.5-debian13
platforms:
  - linux/amd64
  - linux/arm64
dates:
  release: "2026-09-30"
vars:
  PACKAGE_SUFFIX: ""
  SEMVER_MAJOR_MINOR_VERSION: "1.12"
  SEMVER_MAJOR_VERSION: "1"
  SEMVER_VERSION: 1.12.5
  SHIP_GRPC_HEALTH_PROBE: "false"
  VERSION: 1.12.5-6
contents:
  repositories:
    - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
  keyring:
    - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
  packages:
    - '!libelogind0'
    - '!mawk'
    - '!original-awk'
    - base-files
    - ca-certificates-bundle
    - dash
    - git
    - gnupg
    - gpg
    - gpg-agent
    - kargo-1.12=1.12.5-6
    - openssh-client
    - tini
    - tzdata
accounts:
  run-as: nonroot
  users:
    - name: nonroot
      uid: 65532
      gid: 65532
  groups:
    - name: nonroot
      gid: 65532
      members:
        - nonroot
os-release:
  name: Docker Hardened Images (Debian)
  id: debian
  version-id: "13"
  version-codename: trixie
  pretty-name: Docker Hardened Images/Debian GNU/Linux 13 (trixie)
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
environment:
  SSL_CERT_FILE: /etc/ssl/certs/ca-certificates.crt
paths:
  - type: directory
    path: /usr/local/bin
    uid: 0
    gid: 0
  - type: symlink
    path: /usr/local/bin/kargo
    uid: 0
    gid: 0
    source: /usr/bin/kargo
  - type: symlink
    path: /usr/local/bin/credential-helper
    uid: 0
    gid: 0
    source: /usr/bin/credential-helper
  - type: symlink
    path: /usr/local/bin/helm
    uid: 0
    gid: 0
    source: /usr/bin/helm
  - type: symlink
    path: /usr/sbin/tini
    uid: 0
    gid: 0
    source: /usr/bin/tini
  - type: directory
    path: /home/nonroot
    uid: 65532
    gid: 65532
    mode: "0700"
annotations:
  org.opencontainers.image.description: A minimal Kargo image
  org.opencontainers.image.licenses: Apache-2.0
entrypoint:
  - /sbin/tini
  - --
cmd:
  - /usr/local/bin/kargo
ports:
  - 8080/tcp
  - 9443/tcp
