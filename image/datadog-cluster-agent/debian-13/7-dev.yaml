# syntax=dhi.io/build:2-debian13

name: Datadog Cluster Agent 7.x (dev)
image: dhi.io/datadog-cluster-agent
variant: dev
tags:
  - 7-dev
  - 7.86-dev
  - 7.86.0-dev
  - 7-debian-dev
  - 7-debian13-dev
  - 7.86-debian-dev
  - 7.86-debian13-dev
  - 7.86.0-debian-dev
  - 7.86.0-debian13-dev
platforms:
  - linux/amd64
dates:
  release: "2019-11-22"
vars:
  PACKAGE_SUFFIX: -dev
  SEMVER_MAJOR_MINOR_VERSION: "7.86"
  SEMVER_MAJOR_VERSION: "7"
  SEMVER_VERSION: 7.86.0
  VERSION: 7.86.0-1
contents:
  repositories:
    - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
  keyring:
    - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
  packages:
    - '!gawk'
    - '!libelogind0'
    - '!original-awk'
    - apt
    - base-files
    - bash
    - ca-certificates
    - ca-certificates-bundle
    - cluster-agent-runtime-files=7.86.0-1
    - coreutils
    - cws-instrumentation-dev=7.86.0-1
    - datadog-agent-dev=7.86.0-1
    - datadog-cluster-agent-dev=7.86.0-1
    - diffutils
    - dpkg
    - findutils
    - grep
    - libc-bin
    - libc6
    - libseccomp2
    - libzstd1
    - mawk
    - perl-base
    - sed
    - tzdata
    - util-linux
accounts:
  root: true
  run-as: root
  users:
    - name: nonroot
      uid: 65532
      gid: 65532
    - name: _apt
      uid: 42
      gid: 65532
  groups:
    - name: nonroot
      gid: 65532
      members:
        - nonroot
os-release:
  name: Docker Hardened Images (Debian)
  id: debian
  version-id: "13"
  version-codename: trixie
  pretty-name: Docker Hardened Images/Debian GNU/Linux 13 (trixie)
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
environment:
  DD_SECRET_BACKEND_COMMAND_ALLOW_GROUP_EXEC_PERM: "true"
  DEBIAN_FRONTEND: noninteractive
  DOCKER_DD_AGENT: "true"
  LD_PRELOAD: /usr/lib/datadog-agent/nosys.so
  PATH: /opt/datadog-agent/bin:/usr/local/bin:/usr/bin:/bin
paths:
  - type: directory
    path: /opt
    uid: 0
    gid: 0
    mode: "0755"
  - type: directory
    path: /opt/datadog-agent
    uid: 0
    gid: 0
    mode: "0755"
  - type: directory
    path: /opt/datadog-agent/bin
    uid: 0
    gid: 0
    mode: "0755"
  - type: symlink
    path: /opt/datadog-agent/bin/datadog-cluster-agent
    uid: 0
    gid: 0
    source: /usr/bin/datadog-cluster-agent
  - type: symlink
    path: /opt/datadog-agent/bin/agent
    uid: 0
    gid: 0
    source: /usr/bin/datadog-cluster-agent
  - type: symlink
    path: /opt/datadog-agent/bin/cws-instrumentation
    uid: 0
    gid: 0
    source: /usr/bin/cws-instrumentation
  - type: symlink
    path: /opt/datadog-agent/bin/secret-generic-connector
    uid: 0
    gid: 0
    source: /usr/bin/secret-generic-connector
  - type: directory
    path: /usr/local/bin
    uid: 0
    gid: 0
  - type: symlink
    path: /usr/local/bin/datadog-cluster-agent
    uid: 0
    gid: 0
    source: /usr/bin/datadog-cluster-agent
  - type: directory
    path: /opt/datadog-agent/bin/datadog-cws-instrumentation
    uid: 0
    gid: 0
  - type: symlink
    path: /opt/datadog-agent/bin/datadog-cws-instrumentation/cws-instrumentation.${target.arch}
    uid: 0
    gid: 0
    source: /usr/bin/cws-instrumentation
  - type: directory
    path: /var/log/datadog
    uid: 65532
    gid: 65532
    mode: "0770"
annotations:
  org.opencontainers.image.description: A minimal Datadog Cluster Agent image
  org.opencontainers.image.licenses: Apache-2.0
entrypoint:
  - /usr/local/bin/datadog-cluster-agent
cmd:
  - start
ports:
  - 5005/tcp
