# syntax=dhi.io/build:2-debian13

name: MLflow 3.x
image: dhi.io/mlflow
variant: runtime
tags:
  - "3"
  - "3.16"
  - 3.16.0
  - 3-debian
  - 3-debian13
  - 3.16-debian
  - 3.16-debian13
  - 3.16.0-debian
  - 3.16.0-debian13
platforms:
  - linux/amd64
  - linux/arm64
dates:
  release: "2026-06-10"
vars:
  SEMVER_MAJOR_MINOR_VERSION: "3.16"
  SEMVER_MAJOR_VERSION: "3"
  SEMVER_VERSION: 3.16.0
  VERSION: 3.16.0-0
contents:
  repositories:
    - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
  keyring:
    - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
  packages:
    - '!libelogind0'
    - '!mawk'
    - '!original-awk'
    - base-files
    - ca-certificates-bundle
    - libpq5
    - libstdc++6
    - mlflow=3.16.0-0
    - python-3.12
    - tzdata
accounts:
  run-as: nonroot
  users:
    - name: nonroot
      uid: 65532
      gid: 65532
  groups:
    - name: nonroot
      gid: 65532
      members:
        - nonroot
os-release:
  name: Docker Hardened Images (Debian)
  id: debian
  version-id: "13"
  version-codename: trixie
  pretty-name: Docker Hardened Images/Debian GNU/Linux 13 (trixie)
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
work-dir: /opt/mlflow/data
environment:
  PATH: /opt/mlflow/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
  VIRTUAL_ENV: /opt/mlflow
paths:
  - type: directory
    path: /opt
    uid: 0
    gid: 0
  - type: symlink
    path: /opt/mlflow
    uid: 0
    gid: 0
    source: /usr/lib/mlflow
  - type: directory
    path: /usr/lib/mlflow/data
    uid: 65532
    gid: 65532
    mode: "0770"
annotations:
  org.opencontainers.image.description: A minimal MLflow image
  org.opencontainers.image.licenses: Apache-2.0
entrypoint:
  - /opt/mlflow/bin/mlflow
