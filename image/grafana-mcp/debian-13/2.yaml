# syntax=dhi.io/build:2-debian13

name: Grafana MCP Server 2.x
image: dhi.io/grafana-mcp
variant: runtime
tags:
  - "2"
  - "2.1"
  - 2.1.1
  - latest
  - 2-debian
  - 2-debian13
  - 2.1-debian
  - 2.1-debian13
  - 2.1.1-debian
  - 2.1.1-debian13
platforms:
  - linux/amd64
  - linux/arm64
dates:
  release: "2026-10-01"
vars:
  FLAVORED_SUFFIX: ""
  PACKAGE_NAME: mcp-grafana-2
  SEMVER_MAJOR_MINOR_VERSION: "2.1"
  SEMVER_MAJOR_VERSION: "2"
  SEMVER_VERSION: 2.1.1
  SUFFIX: ""
  VERSION: 2.1.1-2
contents:
  repositories:
    - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
  keyring:
    - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
  packages:
    - base-files
    - ca-certificates-bundle
    - mcp-grafana-2=2.1.1-2
    - tzdata
accounts:
  run-as: nonroot
  users:
    - name: nonroot
      uid: 65532
      gid: 65532
  groups:
    - name: nonroot
      gid: 65532
      members:
        - nonroot
os-release:
  name: Docker Hardened Images (Debian)
  id: debian
  version-id: "13"
  version-codename: trixie
  pretty-name: Docker Hardened Images/Debian GNU/Linux 13 (trixie)
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
paths:
  - type: directory
    path: /usr/local/bin
    uid: 0
    gid: 0
  - type: symlink
    path: /usr/local/bin/mcp-grafana
    uid: 0
    gid: 0
    source: /usr/bin/mcp-grafana
annotations:
  org.opencontainers.image.description: A minimal Grafana MCP Server image
  org.opencontainers.image.licenses: AGPL-3.0
labels:
  io.modelcontextprotocol.server.name: io.github.grafana/mcp-grafana
entrypoint:
  - mcp-grafana
cmd:
  - --transport
  - stdio
