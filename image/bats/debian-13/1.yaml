# syntax=dhi.io/build:2-debian13

name: BATS 1.x
image: dhi.io/bats
variant: runtime
tags:
  - "1"
  - "1.14"
  - 1.14.0
  - 1-debian
  - 1-debian13
  - 1.14-debian
  - 1.14-debian13
  - 1.14.0-debian
  - 1.14.0-debian13
platforms:
  - linux/amd64
  - linux/arm64
dates:
  release: "2025-11-07"
vars:
  SEMVER_MAJOR_MINOR_VERSION: "1.14"
  SEMVER_MAJOR_VERSION: "1"
  SEMVER_VERSION: 1.14.0
  VERSION: 1.14.0-0
contents:
  repositories:
    - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
  keyring:
    - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
  packages:
    - '!libelogind0'
    - '!mawk'
    - '!original-awk'
    - base-files
    - bash
    - bats=1.14.0-0
    - ca-certificates
    - ca-certificates-bundle
    - coreutils
    - findutils
    - grep
    - ncurses-base
    - ncurses-bin
    - parallel
    - perl
    - sed
    - tar
    - tini
    - tzdata
    - util-linux
    - zlib1g
accounts:
  run-as: "65532"
  users:
    - name: nonroot
      uid: 65532
      gid: 65532
  groups:
    - name: nonroot
      gid: 65532
      members:
        - nonroot
os-release:
  name: Docker Hardened Images (Debian)
  id: debian
  version-id: "13"
  version-codename: trixie
  pretty-name: Docker Hardened Images/Debian GNU/Linux 13 (trixie)
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
work-dir: /code
environment:
  SSL_CERT_FILE: /etc/ssl/certs/ca-certificates.crt
paths:
  - type: directory
    path: /usr/local/bin
    uid: 0
    gid: 0
  - type: symlink
    path: /usr/local/bin/bats
    uid: 0
    gid: 0
    source: /usr/bin/bats
  - type: symlink
    path: /usr/local/bin/bash
    uid: 0
    gid: 0
    source: /usr/bin/bash
  - type: symlink
    path: /opt/bats
    uid: 0
    gid: 0
    source: /usr/share/bats
  - type: directory
    path: /code
    uid: 65532
    gid: 65532
    mode: "0755"
annotations:
  org.opencontainers.image.description: A minimal BATS testing framework image
  org.opencontainers.image.licenses: MIT
entrypoint:
  - /usr/bin/tini
  - --
  - /usr/local/bin/bash
  - /usr/local/bin/bats
