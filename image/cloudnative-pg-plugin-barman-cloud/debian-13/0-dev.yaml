# syntax=dhi.io/build:2-debian13

name: CloudnativePG Barman Cloud Plugin 0.x (dev)
image: dhi.io/cloudnative-pg-plugin-barman-cloud
variant: dev
tags:
  - 0-dev
  - 0.14-dev
  - 0.14.0-dev
  - 0-debian-dev
  - 0-debian13-dev
  - 0.14-debian-dev
  - 0.14-debian13-dev
  - 0.14.0-debian-dev
  - 0.14.0-debian13-dev
platforms:
  - linux/amd64
  - linux/arm64
vars:
  DEBIAN_VERSION: 0.14.0-3
  FLAVORED_SUFFIX: -dev
  SEMVER_MAJOR_MINOR_VERSION: "0.14"
  SEMVER_MAJOR_VERSION: "0"
  SEMVER_VERSION: 0.14.0
  SUFFIX: -dev
  VERSION: 0.14.0
contents:
  repositories:
    - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
  keyring:
    - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
  packages:
    - '!gawk'
    - '!libelogind0'
    - '!original-awk'
    - apt
    - base-files
    - bash
    - ca-certificates
    - ca-certificates-bundle
    - coreutils
    - diffutils
    - dpkg
    - findutils
    - grep
    - libc-bin
    - mawk
    - perl-base
    - plugin-barman-cloud-dev=0.14.0-3
    - sed
    - tzdata
    - util-linux
accounts:
  root: true
  run-as: root
  users:
    - name: nonroot
      uid: 65532
      gid: 65532
    - name: _apt
      uid: 42
      gid: 65532
  groups:
    - name: nonroot
      gid: 65532
      members:
        - nonroot
os-release:
  name: Docker Hardened Images (Debian)
  id: debian
  version-id: "13"
  version-codename: trixie
  pretty-name: Docker Hardened Images/Debian GNU/Linux 13 (trixie)
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
environment:
  DEBIAN_FRONTEND: noninteractive
paths:
  - type: directory
    path: /usr/local/bin
    uid: 0
    gid: 0
  - type: symlink
    path: /usr/local/bin/manager
    uid: 0
    gid: 0
    source: /usr/bin/manager
annotations:
  org.opencontainers.image.description: A minimal CloudnativePG Barman Cloud Plugin image
  org.opencontainers.image.licenses: Apache 2.0
entrypoint:
  - manager
