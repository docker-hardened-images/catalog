# syntax=dhi.io/build:2-debian13

name: Kubernetes Proxy 1.34.x
image: dhi.io/kube-proxy
variant: runtime
tags:
  - "1.34"
  - 1.34.11
  - v1.34.11
  - 1.34-debian
  - 1.34-debian13
  - 1.34.11-debian
  - 1.34.11-debian13
platforms:
  - linux/amd64
  - linux/arm64
dates:
  release: "2025-08-27"
  end-of-life: "2026-10-27"
vars:
  FLAVORED_SUFFIX: ""
  SEMVER_MAJOR_MINOR_VERSION: "1.34"
  SEMVER_MAJOR_VERSION: "1"
  SEMVER_VERSION: 1.34.11
  SUFFIX: ""
  VERSION: 1.34.11-2
contents:
  repositories:
    - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
  keyring:
    - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
  packages:
    - '!libelogind0'
    - '!mawk'
    - '!original-awk'
    - base-files
    - ca-certificates-bundle
    - iptables
    - kube-proxy-1.34=1.34.11-2
    - tzdata
accounts:
  run-as: nonroot
  users:
    - name: nonroot
      uid: 65532
      gid: 65532
  groups:
    - name: nonroot
      gid: 65532
      members:
        - nonroot
os-release:
  name: Docker Hardened Images (Debian)
  id: debian
  version-id: "13"
  version-codename: trixie
  pretty-name: Docker Hardened Images/Debian GNU/Linux 13 (trixie)
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
paths:
  - type: directory
    path: /usr/local/bin
    uid: 0
    gid: 0
  - type: symlink
    path: /usr/local/bin/kube-proxy
    uid: 0
    gid: 0
    source: /usr/bin/kube-proxy
  - type: symlink
    path: /usr/sbin/iptables
    uid: 0
    gid: 0
    source: /usr/sbin/iptables-nft
  - type: symlink
    path: /usr/sbin/iptables-save
    uid: 0
    gid: 0
    source: /usr/sbin/iptables-nft-save
  - type: symlink
    path: /usr/sbin/iptables-restore
    uid: 0
    gid: 0
    source: /usr/sbin/iptables-nft-restore
  - type: symlink
    path: /usr/sbin/ip6tables
    uid: 0
    gid: 0
    source: /usr/sbin/ip6tables-nft
  - type: symlink
    path: /usr/sbin/ip6tables-save
    uid: 0
    gid: 0
    source: /usr/sbin/ip6tables-nft-save
  - type: symlink
    path: /usr/sbin/ip6tables-restore
    uid: 0
    gid: 0
    source: /usr/sbin/ip6tables-nft-restore
  - type: directory
    path: /run/kubernetes
    uid: 65532
    gid: 65532
    mode: "0755"
annotations:
  org.opencontainers.image.description: A minimal Kubernetes proxy image
  org.opencontainers.image.licenses: Apache-2.0
entrypoint:
  - kube-proxy
