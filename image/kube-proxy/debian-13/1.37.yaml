# syntax=dhi.io/build:2-debian13

name: Kubernetes Proxy 1.37.x
image: dhi.io/kube-proxy
variant: runtime
tags:
  - "1"
  - "1.37"
  - 1.37.1
  - v1.37.1
  - 1-debian
  - 1-debian13
  - 1.37-debian
  - 1.37-debian13
  - 1.37.1-debian
  - 1.37.1-debian13
platforms:
  - linux/amd64
  - linux/arm64
dates:
  release: "2026-08-26"
  end-of-life: "2027-10-28"
vars:
  FLAVORED_SUFFIX: ""
  SEMVER_MAJOR_MINOR_VERSION: "1.37"
  SEMVER_MAJOR_VERSION: "1"
  SEMVER_VERSION: 1.37.1
  SUFFIX: ""
  VERSION: 1.37.1-1
contents:
  repositories:
    - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
  keyring:
    - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
  packages:
    - '!libelogind0'
    - '!mawk'
    - '!original-awk'
    - base-files
    - ca-certificates-bundle
    - iptables
    - kube-proxy-1.37=1.37.1-1
    - tzdata
  builds:
    - name: setcap iptables
      contents:
        packages:
          - bash
          - base-files
          - coreutils
          - libcap2-bin
          - iptables
      pipeline:
        - name: setcap
          runs: |
            set -eux -o pipefail

            setcap cap_net_admin,cap_net_raw+ep /usr/sbin/xtables-legacy-multi
            setcap cap_net_admin,cap_net_raw+ep /usr/sbin/xtables-nft-multi
            setcap cap_net_admin,cap_net_raw+ep /usr/sbin/iptables-apply
      outputs:
        - source: /usr/sbin/xtables-legacy-multi
          target: /usr/sbin/xtables-legacy-multi
          uid: 0
          gid: 0
        - source: /usr/sbin/xtables-nft-multi
          target: /usr/sbin/xtables-nft-multi
          uid: 0
          gid: 0
        - source: /usr/sbin/iptables-apply
          target: /usr/sbin/iptables-apply
          uid: 0
          gid: 0
accounts:
  run-as: nonroot
  users:
    - name: nonroot
      uid: 65532
      gid: 65532
  groups:
    - name: nonroot
      gid: 65532
      members:
        - nonroot
os-release:
  name: Docker Hardened Images (Debian)
  id: debian
  version-id: "13"
  version-codename: trixie
  pretty-name: Docker Hardened Images/Debian GNU/Linux 13 (trixie)
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
paths:
  - type: directory
    path: /usr/local/bin
    uid: 0
    gid: 0
  - type: symlink
    path: /usr/local/bin/kube-proxy
    uid: 0
    gid: 0
    source: /usr/bin/kube-proxy
  - type: directory
    path: /run/kubernetes
    uid: 65532
    gid: 65532
    mode: "0755"
annotations:
  org.opencontainers.image.description: A minimal Kubernetes proxy image
  org.opencontainers.image.licenses: Apache-2.0
entrypoint:
  - kube-proxy
