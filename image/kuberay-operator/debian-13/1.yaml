# syntax=dhi.io/build:2-debian13

name: KubeRay Operator 1.x
image: dhi.io/kuberay-operator
variant: runtime
tags:
  - "1"
  - "1.7"
  - 1.7.1
  - 1-debian
  - 1-debian13
  - 1.7-debian
  - 1.7-debian13
  - 1.7.1-debian
  - 1.7.1-debian13
platforms:
  - linux/amd64
  - linux/arm64
dates:
  release: "2023-11-07"
vars:
  FLAVORED_SUFFIX: ""
  SEMVER_MAJOR_MINOR_VERSION: "1.7"
  SEMVER_MAJOR_VERSION: "1"
  SEMVER_VERSION: 1.7.1
  SUFFIX: ""
  VERSION: 1.7.1-0
contents:
  repositories:
    - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
  keyring:
    - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
  packages:
    - base-files
    - ca-certificates-bundle
    - kuberay-operator-1=1.7.1-0
    - tzdata
accounts:
  run-as: "65532"
  users:
    - name: "65532"
      uid: 65532
      gid: 65532
  groups:
    - name: nonroot
      gid: 65532
      members:
        - "65532"
os-release:
  name: Docker Hardened Images (Debian)
  id: debian
  version-id: "13"
  version-codename: trixie
  pretty-name: Docker Hardened Images/Debian GNU/Linux 13 (trixie)
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
work-dir: /
environment:
  SSL_CERT_FILE: /etc/ssl/certs/ca-certificates.crt
paths:
  - type: directory
    path: /usr/local/bin
    uid: 0
    gid: 0
  - type: symlink
    path: /usr/local/bin/manager
    uid: 0
    gid: 0
    source: /usr/bin/manager
  - type: symlink
    path: /manager
    uid: 0
    gid: 0
    source: /usr/bin/manager
  - type: directory
    path: /tmp
    uid: 0
    gid: 0
    mode: "1777"
annotations:
  org.opencontainers.image.description: A minimal KubeRay Operator image
  org.opencontainers.image.licenses: Apache-2.0
entrypoint:
  - /manager
ports:
  - 8080/tcp
  - 8082/tcp
