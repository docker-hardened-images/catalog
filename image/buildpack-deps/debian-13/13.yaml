# syntax=dhi.io/build:2-debian13

name: Buildpack Deps 13.x
image: dhi.io/buildpack-deps
variant: runtime
tags:
  - trixie
  - trixie-debian13
platforms:
  - linux/amd64
  - linux/arm64
dates:
  release: "2025-08-09"
  end-of-life: "2028-08-09"
vars:
  DEBIAN_EPOCH_MAJOR_VERSION: "13"
  DHI_TAGS_OVERWRITE: "true"
  PYTHON_VERSION: 3.13.18-2
  VERSION: 13.8+deb13u7+dhi0
contents:
  repositories:
    - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
  keyring:
    - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
  packages:
    - '!cdebconf'
    - '!libelogind0'
    - '!libpython3-stdlib'
    - '!libpython3.13-minimal'
    - '!libpython3.13-stdlib'
    - '!mawk'
    - '!original-awk'
    - '!python3'
    - '!python3-minimal'
    - '!python3.13'
    - '!python3.13-minimal'
    - autoconf
    - base-files
    - bash
    - bzip2
    - ca-certificates
    - ca-certificates-bundle
    - coreutils
    - curl
    - default-libmysqlclient-dev
    - diffutils
    - dirmngr
    - file
    - findutils
    - g++
    - gcc
    - git
    - gnu-which
    - gnupg-utils
    - gpg
    - gpg-agent
    - gpgv
    - grep
    - gzip
    - libbz2-dev
    - libc6-dev
    - libcurl4-openssl-dev
    - libdb5.3-dev
    - libevent-dev
    - libffi-dev
    - libgdbm-dev
    - libglib2.0-dev
    - libgmp-dev
    - libjpeg-dev
    - libkrb5-dev
    - liblzma-dev
    - libmaxminddb-dev
    - libncurses-dev
    - libpng-dev
    - libpq-dev
    - libreadline-dev
    - libsqlite3-dev
    - libssl-dev
    - libtool
    - libwebp-dev
    - libxml2-dev
    - libxslt1-dev
    - libyaml-dev
    - make
    - mawk
    - mercurial
    - ncurses-bin
    - ncurses-term
    - netbase
    - openssh-client
    - patch
    - procps
    - python-3.13=3.13.18-2
    - sed
    - subversion
    - tar
    - tzdata
    - unzip
    - wget
    - xz-utils
    - zlib1g-dev
accounts:
  run-as: nonroot
  users:
    - name: nonroot
      uid: 65532
      gid: 65532
  groups:
    - name: nonroot
      gid: 65532
      members:
        - nonroot
os-release:
  name: Docker Hardened Images (Debian)
  id: debian
  version-id: "13"
  version-codename: trixie
  pretty-name: Docker Hardened Images/Debian GNU/Linux 13 (trixie)
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
annotations:
  org.opencontainers.image.description: A minimal buildpack-deps image
  org.opencontainers.image.licenses: MIT
cmd:
  - /bin/bash
