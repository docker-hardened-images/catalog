# syntax=dhi.io/build:2-debian13

name: Mapbox MCP Server 0.16.x
image: dhi.io/mapbox-mcp
variant: runtime
tags:
  - "0"
  - "0.16"
  - 0.16.0
  - 0-debian
  - 0-debian13
  - 0.16-debian
  - 0.16-debian13
  - 0.16.0-debian
  - 0.16.0-debian13
platforms:
  - linux/amd64
  - linux/arm64
dates:
  release: "2026-06-15"
vars:
  SEMVER_MAJOR_MINOR_VERSION: "0.16"
  SEMVER_MAJOR_VERSION: "0"
  SEMVER_VERSION: 0.16.0
  VERSION: 0.16.0-0
contents:
  repositories:
    - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
  keyring:
    - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
  packages:
    - base-files
    - ca-certificates-bundle
    - libc6
    - libgomp1
    - libstdc++6
    - mapbox-mcp=0.16.0-0
    - netbase
    - nodejs-24
    - tzdata
  builds:
    - name: server.json
      contents:
        packages:
          - bash
          - sed
      pipeline:
        - runs: |
            set -eux -o pipefail

            sed -i "s/_VERSION_/0.16.0/g" "${source.dir}/config/server.json"
      paths:
        - type: file
          path: ${source.dir}/config/server.json
          uid: 0
          gid: 0
          source: image/mapbox-mcp/config/server.json
      attestations:
        - predicate-type: https://modelcontextprotocol.io/server.json/v1
          source: ${source.dir}/config/server.json
accounts:
  run-as: node
  users:
    - name: node
      uid: 1000
      gid: 1000
  groups:
    - name: node
      gid: 1000
      members:
        - node
os-release:
  name: Docker Hardened Images (Debian)
  id: debian
  version-id: "13"
  version-codename: trixie
  pretty-name: Docker Hardened Images/Debian GNU/Linux 13 (trixie)
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
environment:
  MAPBOX_ACCESS_TOKEN: ""
paths:
  - type: symlink
    path: /app
    uid: 0
    gid: 0
    source: /usr/lib/mapbox-mcp
annotations:
  org.opencontainers.image.description: Mapbox MCP Server - Model Context Protocol server for Mapbox geospatial APIs
  org.opencontainers.image.licenses: MIT
labels:
  io.modelcontextprotocol.server.name: io.github.mapbox/mcp-server
entrypoint:
  - node
  - /app/dist/esm/index.js
