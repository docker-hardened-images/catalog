metadata:
  display-name: NVIDIA Container Toolkit
  short-description: |-
    The NVIDIA Container Toolkit configures container runtimes to run GPU
    workloads. This image is the GPU Operator's container-toolkit operand: it
    ships nvidia-ctk-installer together with the pre-extracted toolkit and
    libnvidia-container payloads it installs onto cluster nodes.
  featured: false
  home-url: https://github.com/NVIDIA/nvidia-container-toolkit
  categories:
    - machine-learning-and-ai
  included-tools:
    - name: nvidia-ctk-installer
      description: Installs the NVIDIA Container Toolkit onto the host and configures the node's container runtime
    - name: nvidia-ctk
      description: NVIDIA Container Toolkit CLI, staged under /artifacts for host installation
    - name: nvidia-container-cli
      description: libnvidia-container CLI the legacy runtime hook execs, staged under /artifacts
