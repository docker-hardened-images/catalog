# syntax=dhi.io/build:2-debian13

name: NVIDIA Container Toolkit 1.x
image: dhi.io/nvidia-container-toolkit
variant: runtime
tags:
  - "1"
  - "1.20"
  - 1.20.2
  - 1-debian
  - 1-debian13
  - 1.20-debian
  - 1.20-debian13
  - 1.20.2-debian
  - 1.20.2-debian13
platforms:
  - linux/amd64
  - linux/arm64
dates:
  release: "2019-10-22"
vars:
  FLAVORED_SUFFIX: ""
  LIBNVC_DEBIAN_VERSION: 1.20.1-4
  MULTIARCH_TRIPLET: '#{ target.arch == "amd64" ? "x86_64-linux-gnu" : "aarch64-linux-gnu" }'
  PKG_SUFFIX: ""
  SEMVER_MAJOR_MINOR_VERSION: "1.20"
  SEMVER_MAJOR_VERSION: "1"
  SEMVER_VERSION: 1.20.2
  SUFFIX: ""
  VERSION: 1.20.2-1
contents:
  repositories:
    - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
  keyring:
    - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
  packages:
    - '!libelogind0'
    - '!mawk'
    - '!original-awk'
    - base-files
    - bash
    - ca-certificates-bundle
    - coreutils
    - dash
    - libc6
    - libcap2
    - libnvidia-container-tools=1.20.1-4
    - libnvidia-container1=1.20.1-4
    - libseccomp2
    - nvidia-cdi-hook=1.20.2-1
    - nvidia-container-runtime-hook=1.20.2-1
    - nvidia-container-runtime.cdi=1.20.2-1
    - nvidia-container-runtime.legacy=1.20.2-1
    - nvidia-container-runtime=1.20.2-1
    - nvidia-container-toolkit=1.20.2-1
    - nvidia-ctk-installer=1.20.2-1
    - tzdata
accounts:
  root: true
  run-as: root
  users:
    - name: nonroot
      uid: 65532
      gid: 65532
  groups:
    - name: nonroot
      gid: 65532
      members:
        - nonroot
os-release:
  name: Docker Hardened Images (Debian)
  id: debian
  version-id: "13"
  version-codename: trixie
  pretty-name: Docker Hardened Images/Debian GNU/Linux 13 (trixie)
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
work-dir: /work
environment:
  NVIDIA_DISABLE_REQUIRE: "true"
  NVIDIA_DRIVER_CAPABILITIES: utility
  NVIDIA_VISIBLE_DEVICES: void
  PATH: /usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin:/work
paths:
  - type: directory
    path: /work
    uid: 0
    gid: 0
    mode: "0755"
  - type: symlink
    path: /work/nvidia-ctk-installer
    uid: 0
    gid: 0
    source: /usr/bin/nvidia-ctk-installer
  - type: symlink
    path: /work/nvidia-toolkit
    uid: 0
    gid: 0
    source: /usr/bin/nvidia-ctk-installer
  - type: directory
    path: /artifacts/deb/usr/bin
    uid: 0
    gid: 0
    mode: "0755"
  - type: directory
    path: /artifacts/deb/usr/lib/${MULTIARCH_TRIPLET}
    uid: 0
    gid: 0
    mode: "0755"
  - type: directory
    path: /artifacts/rpm/usr/bin
    uid: 0
    gid: 0
    mode: "0755"
  - type: directory
    path: /artifacts/rpm/usr/lib64
    uid: 0
    gid: 0
    mode: "0755"
  - type: symlink
    path: /artifacts/deb/usr/bin/nvidia-ctk
    uid: 0
    gid: 0
    source: /usr/bin/nvidia-ctk
  - type: symlink
    path: /artifacts/deb/usr/bin/nvidia-cdi-hook
    uid: 0
    gid: 0
    source: /usr/bin/nvidia-cdi-hook
  - type: symlink
    path: /artifacts/deb/usr/bin/nvidia-container-runtime
    uid: 0
    gid: 0
    source: /usr/bin/nvidia-container-runtime
  - type: symlink
    path: /artifacts/deb/usr/bin/nvidia-container-runtime.cdi
    uid: 0
    gid: 0
    source: /usr/bin/nvidia-container-runtime.cdi
  - type: symlink
    path: /artifacts/deb/usr/bin/nvidia-container-runtime.legacy
    uid: 0
    gid: 0
    source: /usr/bin/nvidia-container-runtime.legacy
  - type: symlink
    path: /artifacts/deb/usr/bin/nvidia-container-runtime-hook
    uid: 0
    gid: 0
    source: /usr/bin/nvidia-container-runtime-hook
  - type: symlink
    path: /artifacts/deb/usr/bin/nvidia-container-cli
    uid: 0
    gid: 0
    source: /usr/bin/nvidia-container-cli
  - type: symlink
    path: /artifacts/rpm/usr/bin/nvidia-ctk
    uid: 0
    gid: 0
    source: /usr/bin/nvidia-ctk
  - type: symlink
    path: /artifacts/rpm/usr/bin/nvidia-cdi-hook
    uid: 0
    gid: 0
    source: /usr/bin/nvidia-cdi-hook
  - type: symlink
    path: /artifacts/rpm/usr/bin/nvidia-container-runtime
    uid: 0
    gid: 0
    source: /usr/bin/nvidia-container-runtime
  - type: symlink
    path: /artifacts/rpm/usr/bin/nvidia-container-runtime.cdi
    uid: 0
    gid: 0
    source: /usr/bin/nvidia-container-runtime.cdi
  - type: symlink
    path: /artifacts/rpm/usr/bin/nvidia-container-runtime.legacy
    uid: 0
    gid: 0
    source: /usr/bin/nvidia-container-runtime.legacy
  - type: symlink
    path: /artifacts/rpm/usr/bin/nvidia-container-runtime-hook
    uid: 0
    gid: 0
    source: /usr/bin/nvidia-container-runtime-hook
  - type: symlink
    path: /artifacts/rpm/usr/bin/nvidia-container-cli
    uid: 0
