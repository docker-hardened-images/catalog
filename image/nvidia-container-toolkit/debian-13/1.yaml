    source: /usr/bin/nvidia-container-cli
  - type: symlink
    path: /artifacts/deb/usr/lib/${MULTIARCH_TRIPLET}/libnvidia-container.so.1
    uid: 0
    gid: 0
    source: /usr/lib/${MULTIARCH_TRIPLET}/libnvidia-container.so.1
  - type: symlink
    path: /artifacts/deb/usr/lib/${MULTIARCH_TRIPLET}/libnvidia-container-go.so.1
    uid: 0
    gid: 0
    source: /usr/lib/${MULTIARCH_TRIPLET}/libnvidia-container-go.so.1
  - type: symlink
    path: /artifacts/rpm/usr/lib64/libnvidia-container.so.1
    uid: 0
    gid: 0
    source: /usr/lib/${MULTIARCH_TRIPLET}/libnvidia-container.so.1
  - type: symlink
    path: /artifacts/rpm/usr/lib64/libnvidia-container-go.so.1
    uid: 0
    gid: 0
    source: /usr/lib/${MULTIARCH_TRIPLET}/libnvidia-container-go.so.1
annotations:
  org.opencontainers.image.description: A minimal NVIDIA Container Toolkit image
  org.opencontainers.image.licenses: Apache-2.0
entrypoint:
  - /work/nvidia-ctk-installer
