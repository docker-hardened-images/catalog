# syntax=dhi.io/build:2-debian13

name: Go 1.27.x
image: dhi.io/golang
variant: runtime
tags:
  - "1"
  - "1.27"
  - 1.27.1
  - 1-debian
  - 1-debian13
  - 1.27-debian
  - 1.27-debian13
  - 1.27.1-debian
  - 1.27.1-debian13
platforms:
  - linux/amd64
  - linux/arm64
dates:
  release: "2026-08-19"
vars:
  FLAVORED_SUFFIX: ""
  SEMVER_MAJOR_MINOR_VERSION: "1.27"
  SEMVER_MAJOR_VERSION: "1"
  SEMVER_VERSION: 1.27.1
  VERSION: 1.27.1-0
contents:
  repositories:
    - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
  keyring:
    - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
  packages:
    - '!libelogind0'
    - '!mawk'
    - '!original-awk'
    - base-files
    - bash
    - ca-certificates
    - coreutils
    - findutils
    - golang-1.27-oci-config=1.27.1-0
    - golang-1.27=1.27.1-0
    - tzdata
accounts:
  run-as: nonroot
  users:
    - name: nonroot
      uid: 65532
      gid: 65532
  groups:
    - name: nonroot
      gid: 65532
      members:
        - nonroot
os-release:
  name: Docker Hardened Images (Debian)
  id: debian
  version-id: "13"
  version-codename: trixie
  pretty-name: Docker Hardened Images/Debian GNU/Linux 13 (trixie)
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
work-dir: /go
environment:
  GOLANG_VERSION: 1.27.1
  GOPATH: /go
  GOTOOLCHAIN: local
  PATH: /go/bin:/usr/lib/go/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
paths:
  - type: directory
    path: /go
    uid: 65532
    gid: 65532
    mode: "0755"
  - type: directory
    path: /go/bin
    uid: 65532
    gid: 65532
    mode: "0755"
  - type: directory
    path: /go/src
    uid: 65532
    gid: 65532
    mode: "0755"
  - type: directory
    path: /usr/src
    uid: 65532
    gid: 65532
    mode: "0755"
  - type: directory
    path: /go/pkg
    uid: 65532
    gid: 65532
    mode: "0755"
  - type: directory
    path: /home/nonroot/.config/go/telemetry/
    uid: 65532
    gid: 65532
    mode: "0744"
  - type: file
    path: /home/nonroot/.config/go/telemetry/mode
    content: |
      off 1970-01-01
    uid: 65532
    gid: 65532
    mode: "0644"
annotations:
  org.opencontainers.image.description: A minimal Golang image
  org.opencontainers.image.licenses: BSD-3-Clause
cmd:
  - go
  - help
