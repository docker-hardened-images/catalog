# syntax=dhi.io/build:2-debian13

name: Go 1.27.x (dev)
image: dhi.io/golang
variant: dev
tags:
  - 1-dev
  - 1.27-dev
  - 1.27.1-dev
  - 1-debian-dev
  - 1-debian13-dev
  - 1.27-debian-dev
  - 1.27-debian13-dev
  - 1.27.1-debian-dev
  - 1.27.1-debian13-dev
platforms:
  - linux/amd64
  - linux/arm64
dates:
  release: "2026-08-19"
vars:
  BINUTILS_ARCH: '#{ target.arch == "amd64" ? "x86-64" : "aarch64" }'
  FLAVORED_SUFFIX: -dev
  SEMVER_MAJOR_MINOR_VERSION: "1.27"
  SEMVER_MAJOR_VERSION: "1"
  SEMVER_VERSION: 1.27.1
  VERSION: 1.27.1-0
contents:
  repositories:
    - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
  keyring:
    - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
  packages:
    - '!binutils'
    - '!binutils-aarch64-linux-gnu'
    - '!binutils-common'
    - '!binutils-x86-64-linux-gnu'
    - '!gawk'
    - '!libbinutils'
    - '!libctf-nobfd0'
    - '!libctf0'
    - '!libelogind0'
    - '!libgprofng0'
    - '!libsframe1'
    - '!mawk'
    - '!original-awk'
    - apt
    - base-files
    - bash
    - binutils-latest
    - binutils-latest-${BINUTILS_ARCH}-linux-gnu
    - ca-certificates
    - coreutils
    - diffutils
    - dpkg
    - findutils
    - g++
    - gcc
    - git
    - golang-1.27-dev-oci-config=1.27.1-0
    - golang-1.27-dev=1.27.1-0
    - grep
    - libc-bin
    - libc6-dev
    - libctf-nobfd0-latest
    - libctf0-latest
    - libexpat1
    - libgprofng0-latest
    - libslang2
    - make
    - mawk
    - perl-base
    - sed
    - tar
    - tzdata
    - util-linux
accounts:
  root: true
  run-as: root
  users:
    - name: nonroot
      uid: 65532
      gid: 65532
    - name: _apt
      uid: 42
      gid: 65532
  groups:
    - name: nonroot
      gid: 65532
      members:
        - nonroot
os-release:
  name: Docker Hardened Images (Debian)
  id: debian
  version-id: "13"
  version-codename: trixie
  pretty-name: Docker Hardened Images/Debian GNU/Linux 13 (trixie)
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
work-dir: /go
environment:
  DEBIAN_FRONTEND: noninteractive
  GOLANG_VERSION: 1.27.1
  GOPATH: /go
  GOTOOLCHAIN: local
  PATH: /go/bin:/usr/lib/go/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
paths:
  - type: directory
    path: /home/nonroot/.config/go/telemetry/
    uid: 65532
    gid: 65532
    mode: "0744"
  - type: file
    path: /home/nonroot/.config/go/telemetry/mode
    content: |
      off 1970-01-01
    uid: 65532
    gid: 65532
    mode: "0644"
  - type: file
    path: /root/.config/go/telemetry/mode
    content: |
      off 1970-01-01
    uid: 0
    gid: 0
    mode: "0644"
  - type: directory
    path: /go
    uid: 0
    gid: 0
    mode: "0755"
  - type: directory
    path: /go/bin
    uid: 0
    gid: 0
    mode: "0755"
  - type: directory
    path: /go/src
    uid: 0
    gid: 0
    mode: "0755"
  - type: directory
    path: /usr/src
    uid: 0
    gid: 0
    mode: "0755"
annotations:
  org.opencontainers.image.description: A minimal Golang image
  org.opencontainers.image.licenses: BSD-3-Clause
cmd:
  - go
  - help
