    - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
  keyring:
    - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
  packages:
    - base-files
    - ca-certificates-bundle
    - restic=0.19.1-2
    - tzdata
    - velero-helper=1.18.2-2
    - velero-restore-helper=1.18.2-2
    - velero=1.18.2-2
accounts:
  run-as: cnb
  users:
    - name: cnb
      uid: 1001
      gid: 1000
  groups:
    - name: cnb
      gid: 1000
      members:
        - cnb
os-release:
  name: Docker Hardened Images (Debian)
