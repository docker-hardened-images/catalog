# syntax=dhi.io/build:2-debian13

name: Velero 1.x (dev)
image: dhi.io/velero
variant: dev
tags:
  - 1-dev
  - 1.18-dev
  - 1.18.2-dev
  - 1-debian-dev
  - 1-debian13-dev
  - 1.18-debian-dev
  - 1.18-debian13-dev
  - 1.18.2-debian-dev
  - 1.18.2-debian13-dev
platforms:
  - linux/amd64
  - linux/arm64
vars:
  COMMIT_SHA: c253c7fe37d78c9b7e55c68544f7c5b2608712d8
  FLAVORED_SUFFIX: -dev
  RESTIC_SEMVER_VERSION: 0.19.1
  RESTIC_SUFFIX: -dev
  RESTIC_VERSION: 0.19.1-2
  SEMVER_MAJOR_MINOR_VERSION: "1.18"
  SEMVER_MAJOR_VERSION: "1"
  SEMVER_VERSION: 1.18.2
  SUFFIX: -dev
  VERSION: 1.18.2-2
contents:
  repositories:
    - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
  keyring:
    - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
  packages:
    - '!gawk'
    - '!libelogind0'
    - '!original-awk'
    - apt
    - base-files
    - bash
    - ca-certificates
    - ca-certificates-bundle
    - coreutils
    - diffutils
    - dpkg
    - findutils
    - grep
    - libc-bin
    - mawk
    - perl-base
    - restic-dev=0.19.1-2
    - sed
    - tzdata
    - util-linux
    - velero-dev=1.18.2-2
    - velero-helper-dev=1.18.2-2
    - velero-restore-helper-dev=1.18.2-2
accounts:
  root: true
  run-as: root
  users:
    - name: cnb
      uid: 1001
      gid: 1000
    - name: _apt
      uid: 42
      gid: 65532
  groups:
    - name: cnb
      gid: 1000
      members:
        - cnb
os-release:
  name: Docker Hardened Images (Debian)
  id: debian
  version-id: "13"
  version-codename: trixie
  pretty-name: Docker Hardened Images/Debian GNU/Linux 13 (trixie)
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
environment:
  DEBIAN_FRONTEND: noninteractive
paths:
  - type: directory
    path: /usr/local/bin
    uid: 0
    gid: 0
  - type: symlink
    path: /usr/local/bin/velero
    uid: 0
    gid: 0
    source: /usr/bin/velero
  - type: symlink
    path: /usr/local/bin/velero-restore-helper
    uid: 0
    gid: 0
    source: /usr/bin/velero-restore-helper
  - type: symlink
    path: /usr/local/bin/velero-helper
    uid: 0
    gid: 0
    source: /usr/bin/velero-helper
  - type: symlink
    path: /usr/local/bin/restic
    uid: 0
    gid: 0
    source: /usr/bin/restic
  - type: symlink
    path: /velero
    uid: 0
    gid: 0
    source: /usr/local/bin/velero
  - type: symlink
    path: /velero-restore-helper
    uid: 0
    gid: 0
    source: /usr/local/bin/velero-restore-helper
  - type: symlink
    path: /velero-helper
    uid: 0
    gid: 0
    source: /usr/local/bin/velero-helper
annotations:
  org.opencontainers.image.description: A minimal Velero image
  org.opencontainers.image.licenses: Apache-2.0
