# syntax=dhi.io/build:2-alpine3.24

name: Locust 2.x
image: dhi.io/locust
variant: runtime
tags:
  - 2-alpine
  - 2.47-alpine
  - 2-alpine3.24
  - 2.47.0-alpine
  - 2.47-alpine3.24
  - 2.47.0-alpine3.24
platforms:
  - linux/amd64
  - linux/arm64
dates:
  release: "2021-08-01"
vars:
  SEMVER_MAJOR_MINOR_VERSION: "2.47"
  SEMVER_MAJOR_VERSION: "2"
  SEMVER_VERSION: 2.47.0
  VERSION: 2.47.0-r1
contents:
  repositories:
    - https://dhi.io/apk/alpine/v3.24/main
    - https://dl-cdn.alpinelinux.org/alpine/v3.24/main
    - https://dl-cdn.alpinelinux.org/alpine/v3.24/community
  keyring:
    - https://dhi.io/keyring/dhi-apk@docker-0F81AD7700D99184.rsa.pub
  packages:
    - alpine-baselayout-data
    - brotli-libs
    - c-ares
    - ca-certificates-bundle
    - libev
    - libgcc
    - libstdc++
    - libuv
    - libzmq
    - locust-2=2.47.0-r1
    - musl
    - python-3.14
    - tzdata
accounts:
  run-as: nonroot
  users:
    - name: nonroot
      uid: 65532
      gid: 65532
  groups:
    - name: nonroot
      gid: 65532
      members:
        - nonroot
os-release:
  name: Docker Hardened Images (Alpine)
  id: alpine
  version-id: "3.24"
  pretty-name: Docker Hardened Images/Alpine Linux v3.24
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
work-dir: /home/locust
environment:
  HOME: /home/locust
  PATH: /usr/lib/locust/bin:/usr/local/bin:/usr/local/sbin:/usr/sbin:/usr/bin:/sbin:/bin
  PYTHONUNBUFFERED: "1"
paths:
  - type: directory
    path: /home/locust
    uid: 65532
    gid: 65532
    mode: "0700"
  - type: directory
    path: /opt
    uid: 0
    gid: 0
    mode: "0755"
  - type: symlink
    path: /opt/venv
    uid: 0
    gid: 0
    source: /usr/lib/locust
annotations:
  org.opencontainers.image.description: A minimal Locust image
  org.opencontainers.image.licenses: MIT
entrypoint:
  - locust
ports:
  - 8089/tcp
  - 5557/tcp
