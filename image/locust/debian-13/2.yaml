# syntax=dhi.io/build:2-debian13

name: Locust 2.x
image: dhi.io/locust
variant: runtime
tags:
  - "2"
  - "2.47"
  - 2.47.0
  - 2-debian
  - 2-debian13
  - 2.47-debian
  - 2.47-debian13
  - 2.47.0-debian
  - 2.47.0-debian13
platforms:
  - linux/amd64
  - linux/arm64
dates:
  release: "2021-08-01"
vars:
  SEMVER_MAJOR_MINOR_VERSION: "2.47"
  SEMVER_MAJOR_VERSION: "2"
  SEMVER_VERSION: 2.47.0
  VERSION: 2.47.0-6
contents:
  repositories:
    - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
  keyring:
    - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
  packages:
    - '!libelogind0'
    - '!mawk'
    - '!original-awk'
    - base-files
    - ca-certificates-bundle
    - libbrotli1
    - libc6
    - libcares2
    - libev4t64
    - libgcc-s1
    - libpython-3.14-stdlib
    - libstdc++6
    - libuv1t64
    - libzmq5
    - locust-2=2.47.0-6
    - python-3.14-minimal
    - tzdata
accounts:
  run-as: nonroot
  users:
    - name: nonroot
      uid: 65532
      gid: 65532
  groups:
    - name: nonroot
      gid: 65532
      members:
        - nonroot
os-release:
  name: Docker Hardened Images (Debian)
  id: debian
  version-id: "13"
  version-codename: trixie
  pretty-name: Docker Hardened Images/Debian GNU/Linux 13 (trixie)
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
work-dir: /home/locust
environment:
  HOME: /home/locust
  PATH: /usr/lib/locust/bin:/usr/local/bin:/usr/local/sbin:/usr/sbin:/usr/bin:/sbin:/bin
  PYTHONUNBUFFERED: "1"
paths:
  - type: directory
    path: /home/locust
    uid: 65532
    gid: 65532
    mode: "0700"
  - type: directory
    path: /opt
    uid: 0
    gid: 0
    mode: "0755"
  - type: symlink
    path: /opt/venv
    uid: 0
    gid: 0
    source: /usr/lib/locust
annotations:
  org.opencontainers.image.description: A minimal Locust image
  org.opencontainers.image.licenses: MIT
entrypoint:
  - locust
ports:
  - 8089/tcp
  - 5557/tcp
