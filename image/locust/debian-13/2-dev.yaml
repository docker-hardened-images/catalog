# syntax=dhi.io/build:2-debian13

name: Locust 2.x (dev)
image: dhi.io/locust
variant: dev
tags:
  - 2-dev
  - 2.47-dev
  - 2.47.0-dev
  - 2-debian-dev
  - 2-debian13-dev
  - 2.47-debian-dev
  - 2.47-debian13-dev
  - 2.47.0-debian-dev
  - 2.47.0-debian13-dev
platforms:
  - linux/amd64
  - linux/arm64
dates:
  release: "2021-08-01"
vars:
  SEMVER_MAJOR_MINOR_VERSION: "2.47"
  SEMVER_MAJOR_VERSION: "2"
  SEMVER_VERSION: 2.47.0
  VERSION: 2.47.0-0
contents:
  repositories:
    - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
  keyring:
    - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
  packages:
    - '!gawk'
    - '!libelogind0'
    - '!mawk'
    - '!original-awk'
    - apt
    - base-files
    - bash
    - ca-certificates
    - ca-certificates-bundle
    - coreutils
    - diffutils
    - dpkg
    - findutils
    - grep
    - libbrotli1
    - libc-bin
    - libc6
    - libcares2
    - libev4t64
    - libgcc-s1
    - libpython-3.14-stdlib
    - libstdc++6
    - libuv1t64
    - libzmq5
    - locust-2=2.47.0-0
    - mawk
    - perl-base
    - python-3.14
    - python-3.14-minimal
    - python3-pip
    - sed
    - tzdata
    - util-linux
  builds:
    - name: locale
      contents:
        packages:
          - bash
          - locales
          - coreutils
          - gzip
      pipeline:
        - name: install locales
          runs: |
            set -eux -o pipefail

            ln -s /etc/locale.alias /usr/share/locale/locale.alias

            echo "en_US.UTF-8 UTF-8" >> /etc/locale.gen
            locale-gen en_US.UTF-8
      outputs:
        - source: /usr/share/locale
          target: /usr/share/locale
          uid: 0
          gid: 0
        - source: /usr/lib/locale
          target: /usr/lib/locale
          uid: 0
          gid: 0
accounts:
  root: true
  run-as: root
  users:
    - name: nonroot
      uid: 65532
      gid: 65532
    - name: _apt
      uid: 42
      gid: 65532
  groups:
    - name: nonroot
      gid: 65532
      members:
        - nonroot
os-release:
  name: Docker Hardened Images (Debian)
  id: debian
  version-id: "13"
  version-codename: trixie
  pretty-name: Docker Hardened Images/Debian GNU/Linux 13 (trixie)
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
work-dir: /home/locust
environment:
  DEBIAN_FRONTEND: noninteractive
  HOME: /home/locust
  LANG: en_US.UTF-8
  LANGUAGE: en_US:en
  LC_ALL: en_US.UTF-8
  PATH: /usr/lib/locust/bin:/usr/local/bin:/usr/local/sbin:/usr/sbin:/usr/bin:/sbin:/bin
  PIP_PYTHON: /usr/lib/locust/bin/python
  PYTHONUNBUFFERED: "1"
paths:
  - type: directory
    path: /home/locust
    uid: 65532
    gid: 65532
    mode: "0700"
  - type: directory
    path: /opt
    uid: 0
    gid: 0
    mode: "0755"
  - type: symlink
    path: /opt/venv
    uid: 0
    gid: 0
    source: /usr/lib/locust
annotations:
  org.opencontainers.image.description: A minimal Locust image
  org.opencontainers.image.licenses: MIT
entrypoint:
  - locust
ports:
  - 8089/tcp
  - 5557/tcp
