# syntax=dhi.io/build:2-debian13

name: Keel 0.x
image: dhi.io/keel
variant: runtime
tags:
  - "0"
  - "0.22"
  - 0.22.4
  - 0-debian
  - 0-debian13
  - 0.22-debian
  - 0.22-debian13
  - 0.22.4-debian
  - 0.22.4-debian13
platforms:
  - linux/amd64
  - linux/arm64
dates:
  release: "2017-06-12"
vars:
  FLAVORED_SUFFIX: ""
  SEMVER_MAJOR_MINOR_VERSION: "0.22"
  SEMVER_MAJOR_VERSION: "0"
  SEMVER_VERSION: 0.22.4
  SUFFIX: ""
  VERSION: 0.22.4-11
contents:
  repositories:
    - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
  keyring:
    - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
  packages:
    - base-files
    - ca-certificates-bundle
    - keel-0=0.22.4-11
    - libc6
    - libsqlite3-0
    - tzdata
accounts:
  run-as: "65532"
  users:
    - name: nonroot
      uid: 65532
      gid: 65532
  groups:
    - name: nonroot
      gid: 65532
      members:
        - nonroot
os-release:
  name: Docker Hardened Images (Debian)
  id: debian
  version-id: "13"
  version-codename: trixie
  pretty-name: Docker Hardened Images/Debian GNU/Linux 13 (trixie)
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
work-dir: /
environment:
  HOME: /data
  SSL_CERT_FILE: /etc/ssl/certs/ca-certificates.crt
  XDG_DATA_HOME: /data
paths:
  - type: symlink
    path: /www
    uid: 0
    gid: 0
    source: /usr/share/keel/www
  - type: directory
    path: /data
    uid: 65532
    gid: 65532
    mode: "0770"
  - type: directory
    path: /run/secrets/kubernetes.io
    uid: 0
    gid: 0
    mode: "0755"
annotations:
  org.opencontainers.image.description: A minimal Keel image
  org.opencontainers.image.licenses: MPL-2.0
entrypoint:
  - /bin/keel
ports:
  - 9300/tcp
