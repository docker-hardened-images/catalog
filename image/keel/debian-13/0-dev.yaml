# syntax=dhi.io/build:2-debian13

name: Keel 0.x (dev)
image: dhi.io/keel
variant: dev
tags:
  - 0-dev
  - 0.22-dev
  - 0.22.4-dev
  - 0-debian-dev
  - 0-debian13-dev
  - 0.22-debian-dev
  - 0.22-debian13-dev
  - 0.22.4-debian-dev
  - 0.22.4-debian13-dev
platforms:
  - linux/amd64
  - linux/arm64
dates:
  release: "2017-06-12"
vars:
  FLAVORED_SUFFIX: -dev
  SEMVER_MAJOR_MINOR_VERSION: "0.22"
  SEMVER_MAJOR_VERSION: "0"
  SEMVER_VERSION: 0.22.4
  SUFFIX: -dev
  VERSION: 0.22.4-7
contents:
  repositories:
    - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
  keyring:
    - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
  packages:
    - '!gawk'
    - '!libelogind0'
    - '!original-awk'
    - apt
    - base-files
    - bash
    - ca-certificates
    - ca-certificates-bundle
    - coreutils
    - diffutils
    - dpkg
    - findutils
    - grep
    - keel-0-dev=0.22.4-7
    - libc-bin
    - libc6
    - libsqlite3-0
    - mawk
    - perl-base
    - sed
    - tzdata
    - util-linux
  builds:
    - name: locale
      contents:
        packages:
          - bash
          - locales
          - coreutils
          - gzip
      pipeline:
        - name: install locales
          runs: |
            set -eux -o pipefail

            ln -s /etc/locale.alias /usr/share/locale/locale.alias

            echo "en_US.UTF-8 UTF-8" >> /etc/locale.gen
            locale-gen en_US.UTF-8
      outputs:
        - source: /usr/share/locale
          target: /usr/share/locale
          uid: 0
          gid: 0
        - source: /usr/lib/locale
          target: /usr/lib/locale
          uid: 0
          gid: 0
accounts:
  root: true
  run-as: root
  users:
    - name: nonroot
      uid: 65532
      gid: 65532
    - name: _apt
      uid: 42
      gid: 65532
  groups:
    - name: nonroot
      gid: 65532
      members:
        - nonroot
os-release:
  name: Docker Hardened Images (Debian)
  id: debian
  version-id: "13"
  version-codename: trixie
  pretty-name: Docker Hardened Images/Debian GNU/Linux 13 (trixie)
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
work-dir: /
environment:
  DEBIAN_FRONTEND: noninteractive
  HOME: /data
  LANG: en_US.UTF-8
  LANGUAGE: en_US:en
  LC_ALL: en_US.UTF-8
  SSL_CERT_FILE: /etc/ssl/certs/ca-certificates.crt
  XDG_DATA_HOME: /data
paths:
  - type: symlink
    path: /www
    uid: 0
    gid: 0
    source: /usr/share/keel/www
  - type: directory
    path: /data
    uid: 65532
    gid: 65532
    mode: "0770"
  - type: directory
    path: /run/secrets/kubernetes.io
    uid: 0
    gid: 0
    mode: "0755"
annotations:
  org.opencontainers.image.description: A minimal Keel image
  org.opencontainers.image.licenses: MPL-2.0
entrypoint:
  - /bin/keel
ports:
  - 9300/tcp
