# syntax=dhi.io/build:2-debian13

name: OpenResty 1.x (dev)
image: dhi.io/openresty
variant: dev
tags:
  - 1-dev
  - 1.31-dev
  - 1-debian-dev
  - 1.31.1.1-dev
  - 1-debian13-dev
  - 1.31-debian-dev
  - 1.31-debian13-dev
  - 1.31.1.1-debian-dev
  - 1.31.1.1-debian13-dev
platforms:
  - linux/amd64
  - linux/arm64
vars:
  SEMVER_MAJOR_MINOR_VERSION: "1.31"
  SEMVER_MAJOR_VERSION: "1"
  SEMVER_VERSION: 1.31.1.1
  VERSION: 1.31.1.1-0
contents:
  repositories:
    - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
  keyring:
    - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
  packages:
    - '!gawk'
    - '!libelogind0'
    - '!mawk'
    - '!original-awk'
    - apt
    - base-files
    - bash
    - ca-certificates
    - coreutils
    - diffutils
    - dpkg
    - findutils
    - grep
    - libc-bin
    - libcrypt1
    - libgcc-s1
    - libpcre2-8-0
    - libssl3t64
    - mawk
    - openresty=1.31.1.1-0
    - perl
    - perl-base
    - sed
    - util-linux
    - zlib1g
accounts:
  root: true
  run-as: root
  users:
    - name: nonroot
      uid: 65532
      gid: 65532
    - name: _apt
      uid: 42
      gid: 65532
  groups:
    - name: nonroot
      gid: 65532
      members:
        - nonroot
os-release:
  name: Docker Hardened Images (Debian)
  id: debian
  version-id: "13"
  version-codename: trixie
  pretty-name: Docker Hardened Images/Debian GNU/Linux 13 (trixie)
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
environment:
  DEBIAN_FRONTEND: noninteractive
  PATH: /opt/openresty/luajit/bin:/opt/openresty/nginx/sbin:/opt/openresty/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
paths:
  - type: directory
    path: /opt/openresty
    uid: 0
    gid: 0
  - type: symlink
    path: /opt/openresty/bin
    uid: 0
    gid: 0
    source: /usr/share/openresty/bin
  - type: symlink
    path: /opt/openresty/luajit
    uid: 0
    gid: 0
    source: /usr/share/openresty/luajit
  - type: symlink
    path: /opt/openresty/lualib
    uid: 0
    gid: 0
    source: /usr/share/openresty/lualib
  - type: directory
    path: /opt/openresty/nginx
    uid: 0
    gid: 0
  - type: symlink
    path: /opt/openresty/nginx/conf
    uid: 0
    gid: 0
    source: /etc/openresty
  - type: symlink
    path: /opt/openresty/nginx/html
    uid: 0
    gid: 0
    source: /usr/share/openresty/nginx/html
  - type: symlink
    path: /opt/openresty/pod
    uid: 0
    gid: 0
    source: /usr/share/openresty/pod
  - type: symlink
    path: /opt/openresty/site
    uid: 0
    gid: 0
    source: /usr/share/openresty/site
  - type: directory
    path: /var/cache/openresty
    uid: 65532
    gid: 65532
    mode: "0755"
  - type: directory
    path: /var/log/openresty
    uid: 65532
    gid: 65532
    mode: "0755"
  - type: directory
    path: /run
    uid: 65532
    gid: 65532
    mode: "0755"
annotations:
  org.opencontainers.image.description: A minimal OpenResty image
  org.opencontainers.image.licenses: BSD-2-Clause
entrypoint:
  - /opt/openresty/bin/openresty
cmd:
  - -g
  - daemon off;
