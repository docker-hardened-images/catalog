# syntax=dhi.io/build:2-debian13

name: OpenTelemetry Java Autoinstrumentation 2.x
image: dhi.io/opentelemetry-autoinstrumentation-java
variant: runtime
tags:
  - "2"
  - "2.31"
  - 2.31.1
  - 2-debian
  - 2-debian13
  - 2.31-debian
  - 2.31-debian13
  - 2.31.1-debian
  - 2.31.1-debian13
platforms:
  - linux/amd64
  - linux/arm64
dates:
  release: "2024-01-12"
vars:
  FLAVORED_SUFFIX: ""
  SEMVER_MAJOR_MINOR_VERSION: "2.31"
  SEMVER_MAJOR_VERSION: "2"
  SEMVER_VERSION: 2.31.1
  SUFFIX: ""
  VERSION: 2.31.1-0
contents:
  repositories:
    - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
  keyring:
    - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
  packages:
    - base-files
    - ca-certificates-bundle
    - coreutils
    - opentelemetry-javaagent=2.31.1-0
    - tzdata
accounts:
  run-as: nonroot
  users:
    - name: nonroot
      uid: 65532
      gid: 65532
  groups:
    - name: nonroot
      gid: 65532
      members:
        - nonroot
os-release:
  name: Docker Hardened Images (Debian)
  id: debian
  version-id: "13"
  version-codename: trixie
  pretty-name: Docker Hardened Images/Debian GNU/Linux 13 (trixie)
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
paths:
  - type: symlink
    path: /javaagent.jar
    uid: 0
    gid: 0
    source: /usr/share/opentelemetry-javaagent/opentelemetry-javaagent.jar
  - type: directory
    path: /otel-auto-instrumentation-java
    uid: 65532
    gid: 65532
    mode: "0770"
annotations:
  org.opencontainers.image.description: A minimal OpenTelemetry Java Autoinstrumentation image
  org.opencontainers.image.licenses: Apache-2.0
cmd:
  - cp
  - /javaagent.jar
  - /otel-auto-instrumentation-java/javaagent.jar
