# syntax=dhi.io/build:2-debian13

name: OpenTelemetry Java Autoinstrumentation 2.x (dev)
image: dhi.io/opentelemetry-autoinstrumentation-java
variant: dev
tags:
  - 2-dev
  - 2.31-dev
  - 2.31.1-dev
  - 2-debian-dev
  - 2-debian13-dev
  - 2.31-debian-dev
  - 2.31-debian13-dev
  - 2.31.1-debian-dev
  - 2.31.1-debian13-dev
platforms:
  - linux/amd64
  - linux/arm64
dates:
  release: "2024-01-12"
vars:
  FLAVORED_SUFFIX: -dev
  SEMVER_MAJOR_MINOR_VERSION: "2.31"
  SEMVER_MAJOR_VERSION: "2"
  SEMVER_VERSION: 2.31.1
  SUFFIX: -dev
  VERSION: 2.31.1-0
contents:
  repositories:
    - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
  keyring:
    - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
  packages:
    - '!gawk'
    - '!libelogind0'
    - '!original-awk'
    - apt
    - base-files
    - bash
    - ca-certificates
    - ca-certificates-bundle
    - coreutils
    - diffutils
    - dpkg
    - findutils
    - grep
    - libc-bin
    - mawk
    - opentelemetry-javaagent=2.31.1-0
    - perl-base
    - sed
    - tzdata
    - util-linux
accounts:
  root: true
  run-as: root
  users:
    - name: nonroot
      uid: 65532
      gid: 65532
    - name: _apt
      uid: 42
      gid: 65532
  groups:
    - name: nonroot
      gid: 65532
      members:
        - nonroot
os-release:
  name: Docker Hardened Images (Debian)
  id: debian
  version-id: "13"
  version-codename: trixie
  pretty-name: Docker Hardened Images/Debian GNU/Linux 13 (trixie)
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
environment:
  DEBIAN_FRONTEND: noninteractive
paths:
  - type: symlink
    path: /javaagent.jar
    uid: 0
    gid: 0
    source: /usr/share/opentelemetry-javaagent/opentelemetry-javaagent.jar
  - type: directory
    path: /otel-auto-instrumentation-java
    uid: 65532
    gid: 65532
    mode: "0770"
annotations:
  org.opencontainers.image.description: A minimal OpenTelemetry Java Autoinstrumentation image
  org.opencontainers.image.licenses: Apache-2.0
cmd:
  - cp
  - /javaagent.jar
  - /otel-auto-instrumentation-java/javaagent.jar
