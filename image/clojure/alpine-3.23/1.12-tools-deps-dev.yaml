# syntax=dhi.io/build:2-alpine3.23

name: Clojure 1.12.x (tools-deps, dev)
image: dhi.io/clojure
variant: dev
flavor: tools-deps
tags:
  - 1-alpine-tools-deps-dev
  - 1.12-alpine-tools-deps-dev
  - 1-alpine3.23-tools-deps-dev
  - 1.12.6-alpine-tools-deps-dev
  - 1.12-alpine3.23-tools-deps-dev
  - 1.12.6-alpine3.23-tools-deps-dev
platforms:
  - linux/amd64
  - linux/arm64
vars:
  COMMIT_SHA: 31a3138ab25343a619fc3734a503a48affe236d1
  JRE_REFERENCE: dhi/eclipse-temurin:21.0.12.8-alpine3.23@sha256:e62496fd2d7a2d00c291e7a6d253e2ca93a0d41a56476a0aba3ac844ae318b2e
  JRE_VERSION: 21.0.12.8
  MAVEN_REFERENCE: dhi/maven:3.9.16-jdk21-alpine3.22-dev@sha256:f02f28d00a727fabad7503b5165aac2ab057eeef6353305da0bc47715449ee73
  SEMVER_MAJOR_MINOR_VERSION: "1.12"
  SEMVER_MAJOR_VERSION: "1"
  SEMVER_VERSION: 1.12.6
  TOOLS_DEPS_COMMIT_SHA: 97d3c6f717647744c7d90f7c1f6e93f8a4f613e2
  TOOLS_DEPS_LIB_COMMIT_SHA: 653749f9e44e1e90086ec294fbd9065e4a96c479
  TOOLS_DEPS_LIB_VERSION: 0.31.1646
  TOOLS_DEPS_VERSION: 1.12.6.1673
  VERSION: 1.12.6
contents:
  repositories:
    - https://dl-cdn.alpinelinux.org/alpine/v3.23/main
    - https://dl-cdn.alpinelinux.org/alpine/v3.23/community
  packages:
    - alpine-baselayout-data
    - apk-tools
    - bash
    - coreutils
    - ncurses-terminfo-base
    - rlwrap
  builds:
    - name: clojure-core
      uses: dhi.io/maven:3.9.16-jdk21-alpine3.22-dev@sha256:f02f28d00a727fabad7503b5165aac2ab057eeef6353305da0bc47715449ee73
      work-dir: ${source.dir}/clojure
      contents:
        packages:
          - bash
        files:
          - url: git+https://github.com/clojure/clojure.git#clojure-1.12.6
            checksum: 31a3138ab25343a619fc3734a503a48affe236d1
            path: ${source.dir}/clojure
            spdx:
              name: clojure
              version: 1.12.6
              packages:
                - name: clojure
                  purl: pkg:dhi/clojure@1.12.6
                  license: EPL-1.0
            uid: 0
            gid: 0
      pipeline:
        - uses: mvn/mirror@v1
        - name: strip Sonatype Central publishing plugin from Clojure pom
          runs: |
            set -eux -o pipefail

            if grep -Fq 'central-publishing-maven-plugin' pom.xml; then
              sed -i '/<!-- deploy artifacts to central -->/,/<\/plugin>/d' pom.xml
            fi
        - name: build clojure core
          privileged: true
          secrets:
            - id: maven_user
              env: MAVEN_USER
              optional: true
            - id: maven_password
              env: MAVEN_PASSWORD
              optional: true
          runs: |
            set -eux -o pipefail

            mvn -Plocal clean install -DskipTests
      outputs:
        - source: ${source.dir}/clojure/target/clojure-1.12.6.jar
          target: /usr/local/lib/clojure/clojure-1.12.6.jar
          uid: 0
          gid: 0
        - source: /opt/docker/sbom/clojure
          target: /opt/docker/sbom/clojure
          uid: 0
          gid: 0
    - name: tools-deps
      uses: dhi.io/maven:3.9.16-jdk21-alpine3.22-dev@sha256:f02f28d00a727fabad7503b5165aac2ab057eeef6353305da0bc47715449ee73
      work-dir: ${source.dir}/tools.deps
      contents:
        packages:
          - bash
        files:
          - url: git+https://github.com/clojure/tools.deps.git#v0.31.1646
            checksum: 653749f9e44e1e90086ec294fbd9065e4a96c479
            path: ${source.dir}/tools.deps
            spdx:
              name: tools.deps
              version: 0.31.1646
              packages:
                - name: tools.deps
                  purl: pkg:dhi/tools.deps@0.31.1646
                  license: EPL-1.0
            uid: 0
            gid: 0
          - url: git+https://github.com/clojure/brew-install.git#1.12.6.1673
            checksum: 97d3c6f717647744c7d90f7c1f6e93f8a4f613e2
            path: ${source.dir}/brew-install
            spdx:
              name: clojure-tools
              version: 1.12.6.1673
              packages:
                - name: clojure-tools
                  purl: pkg:dhi/clojure-tools@1.12.6.1673
                  license: EPL-1.0
            uid: 0
            gid: 0
      pipeline:
        - uses: mvn/mirror@v1
        - name: patch tools.deps
          work-dir: ${source.dir}/tools.deps
          runs: |
            set -eux -o pipefail

            # Pin commons-io as a direct dependency (matches mvn-deps-tools-deps.json
            # pin; replaces mvn/patch@v1 because dhi/maven alpine lacks xq-python).
            sed -i '/<\/dependencies>/i \    <dependency>\n      <groupId>commons-io<\/groupId>\n      <artifactId>commons-io<\/artifactId>\n      <version>2.17.0<\/version>\n    <\/dependency>' pom.xml
        - name: pin plexus-utils direct (CVE-2025-67030)
          work-dir: ${source.dir}/tools.deps
          runs: |
            set -eux -o pipefail

            # Force plexus-utils 3.6.1 as a direct <dependency> so it wins over
            # the 3.3.1 pulled in transitively via maven-core 3.8.8. Stays on the
            # 3.x line because 4.x removed the org.codehaus.plexus.util.xml.pull
            # API that maven/aether still imports.
            sed -i '/<\/dependencies>/i \    <dependency>\n      <groupId>org.codehaus.plexus<\/groupId>\n      <artifactId>plexus-utils<\/artifactId>\n      <version>3.6.1<\/version>\n    <\/dependency>' pom.xml
        - name: patch cli scripts
          runs: |
            set -eux -o pipefail

            SCRIPTS="${source.dir}/brew-install/src/main/resources/clojure/install"
            mkdir -p "${target.dir}/usr/local/bin"
            sed -e "s|PREFIX|/usr/local/lib/clojure|g" -e "s|\${project.version}|1.12.6.1673|g" "${SCRIPTS}/clojure" > "${target.dir}/usr/local/bin/clojure"
            sed "s|BINDIR|/usr/local/bin|g" "${SCRIPTS}/clj" > "${target.dir}/usr/local/bin/clj"
            chmod +x "${target.dir}/usr/local/bin/clojure" "${target.dir}/usr/local/bin/clj"
            # Point tools classpath at individual JARs (we don't ship the clojure-tools uber JAR)
            sed -i 's|^tools_cp=.*|tools_cp="$install_dir/tools.deps-0.31.1646.jar:$install_dir/deps/*"|' "${target.dir}/usr/local/bin/clojure"
        - name: build tools.deps
          privileged: true
          secrets:
            - id: maven_user
              env: MAVEN_USER
              optional: true
            - id: maven_password
              env: MAVEN_PASSWORD
              optional: true
          runs: |
            set -eux -o pipefail

            mvn clean install -DskipTests
            mvn dependency:copy-dependencies -DoutputDirectory=${target.dir}/usr/local/lib/clojure/deps

            # Build libexec/exec.jar so `clj -T:build` and `clj -X` can locate clojure.run.exec
            mkdir -p "${target.dir}/usr/local/lib/clojure/libexec"
            jar cf "${target.dir}/usr/local/lib/clojure/libexec/exec.jar" -C "${source.dir}/brew-install/src/main/clojure" .
      outputs:
        - source: ${source.dir}/tools.deps/target/tools.deps-0.31.1646.jar
          target: /usr/local/lib/clojure/tools.deps-0.31.1646.jar
          uid: 0
          gid: 0
        - source: ${target.dir}/usr/local/lib/clojure/deps
          target: /usr/local/lib/clojure/deps
          uid: 0
          gid: 0
        - source: ${target.dir}/usr/local/lib/clojure/libexec
          target: /usr/local/lib/clojure/libexec
          uid: 0
          gid: 0
        - source: ${target.dir}/usr/local/bin
          target: /usr/local/bin
          uid: 0
          gid: 0
        - source: ${source.dir}/brew-install/src/main/resources/clojure/install/deps.edn
          target: /usr/local/lib/clojure/deps.edn
          uid: 0
          gid: 0
        - source: ${source.dir}/brew-install/src/main/resources/clojure/install/example-deps.edn
          target: /usr/local/lib/clojure/example-deps.edn
          uid: 0
          gid: 0
        - source: ${source.dir}/brew-install/src/main/resources/clojure/install/tools.edn
          target: /usr/local/lib/clojure/tools.edn
          uid: 0
          gid: 0
        - source: ${source.dir}/brew-install/doc/clojure.1
          target: /usr/local/share/man/man1/clojure.1
          uid: 0
          gid: 0
        - source: /opt/docker/sbom/tools.deps
          target: /opt/docker/sbom/tools.deps
          uid: 0
          gid: 0
        - source: /opt/docker/sbom/clojure-tools
          target: /opt/docker/sbom/clojure-tools
          uid: 0
          gid: 0
  artifacts:
    - name: dhi.io/eclipse-temurin:21.0.12.8-alpine3.23@sha256:e62496fd2d7a2d00c291e7a6d253e2ca93a0d41a56476a0aba3ac844ae318b2e
      includes:
        - opt/**
        - usr/bin/java
        - usr/lib/jvm/**
        - usr/local/bin/**
      uid: 0
      gid: 0
accounts:
  root: true
  run-as: root
  users:
    - name: nonroot
      uid: 65532
      gid: 65532
  groups:
    - name: nonroot
      gid: 65532
      members:
        - nonroot
os-release:
  name: Docker Hardened Images (Alpine)
  id: alpine
  version-id: "3.23"
  pretty-name: Docker Hardened Images/Alpine Linux v3.23
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
work-dir: /tmp
environment:
  CLOJURE_VERSION: 1.12.6.1673
annotations:
  org.opencontainers.image.description: A minimal Clojure image
  org.opencontainers.image.licenses: EPL-1.0
cmd:
  - clj
  - --version
