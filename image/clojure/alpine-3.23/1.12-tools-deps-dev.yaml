# syntax=dhi.io/build:2-alpine3.23

name: Clojure 1.12.x (tools-deps, dev)
image: dhi.io/clojure
variant: dev
flavor: tools-deps
tags:
  - 1-alpine-tools-deps-dev
  - 1.12-alpine-tools-deps-dev
  - 1-alpine3.23-tools-deps-dev
  - 1.12.7-alpine-tools-deps-dev
  - 1.12-alpine3.23-tools-deps-dev
  - 1.12.7-alpine3.23-tools-deps-dev
platforms:
  - linux/amd64
  - linux/arm64
vars:
  COMMIT_SHA: 435bdf34790c852a0bc6daf1d05e8959e081b607
  JDK_MAJOR_VERSION: "21"
  JDK_VERSION: 21.0.13.9.1.2-r0
  JRE_REFERENCE: dhi/eclipse-temurin:21.0.13.9-alpine3.23@sha256:44b5131fcff6967db6f603bbf7643f7e76bb3f5d22cfbfd09cab1f66bd6ff31d
  JRE_VERSION: 21.0.13.9
  MAVEN_VERSION: 3.10.1-r0
  SEMVER_MAJOR_MINOR_VERSION: "1.12"
  SEMVER_MAJOR_VERSION: "1"
  SEMVER_VERSION: 1.12.7
  TOOLS_DEPS_COMMIT_SHA: 011ea2bc045c780a9288ccbfe4aba05a34681933
  TOOLS_DEPS_LIB_COMMIT_SHA: 6b49f41d2c536ff8a977c2e36eae77e8c9af1bc4
  TOOLS_DEPS_LIB_VERSION: 0.32.1650
  TOOLS_DEPS_VERSION: 1.12.7.1681
  VERSION: 1.12.7
contents:
  repositories:
    - https://dl-cdn.alpinelinux.org/alpine/v3.23/main
    - https://dl-cdn.alpinelinux.org/alpine/v3.23/community
  packages:
    - alpine-baselayout-data
    - apk-tools
    - bash
    - coreutils
    - ncurses-terminfo-base
    - rlwrap
  builds:
    - name: clojure-core
      work-dir: ${source.dir}/clojure
      environment:
        JAVA_HOME: /usr/lib/jvm/temurin-21
        MAVEN_HOME: /usr/share/java/maven-3
      contents:
        repositories:
          - https://dhi.io/apk/alpine/v3.23/main
          - https://dl-cdn.alpinelinux.org/alpine/v3.23/main
          - https://dl-cdn.alpinelinux.org/alpine/v3.23/community
        keyring:
          - https://dhi.io/keyring/dhi-apk@docker-0F81AD7700D99184.rsa.pub
        packages:
          - bash
          - busybox
          - ca-certificates-bundle
          - eclipse-temurin-21-jdk=21.0.13.9.1.2-r0
          - maven=3.10.1-r0
        files:
          - url: git+https://github.com/clojure/clojure.git#clojure-1.12.7
            checksum: 435bdf34790c852a0bc6daf1d05e8959e081b607
            path: ${source.dir}/clojure
            spdx:
              name: clojure
              version: 1.12.7
              packages:
                - name: clojure
                  purl: pkg:dhi/clojure@1.12.7
                  license: EPL-1.0
            uid: 0
            gid: 0
      pipeline:
        - uses: mvn/mirror@v1
        - name: strip Sonatype Central publishing plugin from Clojure pom
          runs: |
            set -eux -o pipefail

            if grep -Fq 'central-publishing-maven-plugin' pom.xml; then
              sed -i '/<!-- deploy artifacts to central -->/,/<\/plugin>/d' pom.xml
            fi
        - name: build clojure core
          privileged: true
          secrets:
            - id: maven_user
              env: MAVEN_USER
              optional: true
            - id: maven_password
              env: MAVEN_PASSWORD
              optional: true
          runs: |
            set -eux -o pipefail

            mvn -Plocal clean install -DskipTests
      outputs:
        - source: ${source.dir}/clojure/target/clojure-1.12.7.jar
          target: /usr/local/lib/clojure/clojure-1.12.7.jar
          uid: 0
          gid: 0
        - source: /opt/docker/sbom/clojure
          target: /opt/docker/sbom/clojure
          uid: 0
          gid: 0
    - name: tools-deps
      work-dir: ${source.dir}/tools.deps
      environment:
        JAVA_HOME: /usr/lib/jvm/temurin-21
        MAVEN_HOME: /usr/share/java/maven-3
      contents:
        repositories:
          - https://dhi.io/apk/alpine/v3.23/main
          - https://dl-cdn.alpinelinux.org/alpine/v3.23/main
          - https://dl-cdn.alpinelinux.org/alpine/v3.23/community
        keyring:
          - https://dhi.io/keyring/dhi-apk@docker-0F81AD7700D99184.rsa.pub
        packages:
          - bash
          - busybox
          - ca-certificates-bundle
          - eclipse-temurin-21-jdk=21.0.13.9.1.2-r0
          - maven=3.10.1-r0
        files:
          - url: git+https://github.com/clojure/tools.deps.git#v0.32.1650
            checksum: 6b49f41d2c536ff8a977c2e36eae77e8c9af1bc4
            path: ${source.dir}/tools.deps
            spdx:
              name: tools.deps
              version: 0.32.1650
              packages:
                - name: tools.deps
                  purl: pkg:dhi/tools.deps@0.32.1650
                  license: EPL-1.0
            uid: 0
            gid: 0
          - url: git+https://github.com/clojure/brew-install.git#1.12.7.1681
            checksum: 011ea2bc045c780a9288ccbfe4aba05a34681933
            path: ${source.dir}/brew-install
            spdx:
              name: clojure-tools
              version: 1.12.7.1681
              packages:
                - name: clojure-tools
                  purl: pkg:dhi/clojure-tools@1.12.7.1681
                  license: EPL-1.0
            uid: 0
            gid: 0
      pipeline:
        - uses: mvn/mirror@v1
        - name: patch tools.deps
          work-dir: ${source.dir}/tools.deps
          runs: |
            set -eux -o pipefail

            # Pin commons-io as a direct dependency (matches mvn-deps-tools-deps.json
            # pin; replaces mvn/patch@v1, which needs xq-python).
            sed -i '/<\/dependencies>/i \    <dependency>\n      <groupId>commons-io<\/groupId>\n      <artifactId>commons-io<\/artifactId>\n      <version>2.17.0<\/version>\n    <\/dependency>' pom.xml
        - name: pin plexus-utils direct (CVE-2025-67030)
          work-dir: ${source.dir}/tools.deps
          runs: |
            set -eux -o pipefail

            # Force plexus-utils 3.6.1 as a direct <dependency> so it wins over
            # the 3.3.1 pulled in transitively via maven-core 3.8.8. Stays on the
            # 3.x line because 4.x removed the org.codehaus.plexus.util.xml.pull
            # API that maven/aether still imports.
            sed -i '/<\/dependencies>/i \    <dependency>\n      <groupId>org.codehaus.plexus<\/groupId>\n      <artifactId>plexus-utils<\/artifactId>\n      <version>3.6.1<\/version>\n    <\/dependency>' pom.xml
        - name: patch cli scripts
          runs: |
            set -eux -o pipefail

            SCRIPTS="${source.dir}/brew-install/src/main/resources/clojure/install"
            mkdir -p "${target.dir}/usr/local/bin"
            sed -e "s|PREFIX|/usr/local/lib/clojure|g" -e "s|\${project.version}|1.12.7.1681|g" "${SCRIPTS}/clojure" > "${target.dir}/usr/local/bin/clojure"
            sed "s|BINDIR|/usr/local/bin|g" "${SCRIPTS}/clj" > "${target.dir}/usr/local/bin/clj"
            chmod +x "${target.dir}/usr/local/bin/clojure" "${target.dir}/usr/local/bin/clj"
            # Point tools classpath at individual JARs (we don't ship the clojure-tools uber JAR)
            sed -i 's|^tools_cp=.*|tools_cp="$install_dir/tools.deps-0.32.1650.jar:$install_dir/deps/*"|' "${target.dir}/usr/local/bin/clojure"
        - name: build tools.deps
          privileged: true
          secrets:
            - id: maven_user
              env: MAVEN_USER
              optional: true
            - id: maven_password
              env: MAVEN_PASSWORD
              optional: true
          runs: |
            set -eux -o pipefail

            mvn clean install -DskipTests
            mvn dependency:copy-dependencies -DoutputDirectory=${target.dir}/usr/local/lib/clojure/deps

            # Build libexec/exec.jar so `clj -T:build` and `clj -X` can locate clojure.run.exec
            mkdir -p "${target.dir}/usr/local/lib/clojure/libexec"
            jar cf "${target.dir}/usr/local/lib/clojure/libexec/exec.jar" -C "${source.dir}/brew-install/src/main/clojure" .
      outputs:
        - source: ${source.dir}/tools.deps/target/tools.deps-0.32.1650.jar
          target: /usr/local/lib/clojure/tools.deps-0.32.1650.jar
          uid: 0
          gid: 0
        - source: ${target.dir}/usr/local/lib/clojure/deps
          target: /usr/local/lib/clojure/deps
          uid: 0
          gid: 0
        - source: ${target.dir}/usr/local/lib/clojure/libexec
          target: /usr/local/lib/clojure/libexec
          uid: 0
          gid: 0
        - source: ${target.dir}/usr/local/bin
          target: /usr/local/bin
          uid: 0
          gid: 0
        - source: ${source.dir}/brew-install/src/main/resources/clojure/install/deps.edn
          target: /usr/local/lib/clojure/deps.edn
          uid: 0
          gid: 0
        - source: ${source.dir}/brew-install/src/main/resources/clojure/install/example-deps.edn
          target: /usr/local/lib/clojure/example-deps.edn
          uid: 0
          gid: 0
        - source: ${source.dir}/brew-install/src/main/resources/clojure/install/tools.edn
          target: /usr/local/lib/clojure/tools.edn
          uid: 0
          gid: 0
        - source: ${source.dir}/brew-install/doc/clojure.1
          target: /usr/local/share/man/man1/clojure.1
          uid: 0
          gid: 0
        - source: /opt/docker/sbom/tools.deps
          target: /opt/docker/sbom/tools.deps
          uid: 0
          gid: 0
        - source: /opt/docker/sbom/clojure-tools
          target: /opt/docker/sbom/clojure-tools
          uid: 0
          gid: 0
  artifacts:
    - name: dhi.io/eclipse-temurin:21.0.13.9-alpine3.23@sha256:44b5131fcff6967db6f603bbf7643f7e76bb3f5d22cfbfd09cab1f66bd6ff31d
      includes:
        - opt/**
        - usr/bin/java
        - usr/lib/jvm/**
        - usr/local/bin/**
      uid: 0
      gid: 0
accounts:
  root: true
  run-as: root
  users:
    - name: nonroot
      uid: 65532
      gid: 65532
  groups:
    - name: nonroot
      gid: 65532
      members:
        - nonroot
os-release:
  name: Docker Hardened Images (Alpine)
  id: alpine
  version-id: "3.23"
  pretty-name: Docker Hardened Images/Alpine Linux v3.23
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
