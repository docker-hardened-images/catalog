# syntax=dhi.io/build:2-debian13

name: cloudflared 2026.x (dev)
image: dhi.io/cloudflared
variant: dev
tags:
  - 2026-dev
  - 2026.10-dev
  - 2026.10.4-dev
  - 2026-debian-dev
  - 2026-debian13-dev
  - 2026.10-debian-dev
  - 2026.10-debian13-dev
  - 2026.10.4-debian-dev
  - 2026.10.4-debian13-dev
platforms:
  - linux/amd64
  - linux/arm64
dates:
  release: "2026-01-20"
vars:
  FLAVORED_SUFFIX: -dev
  SEMVER_MAJOR_MINOR_VERSION: "2026.10"
  SEMVER_MAJOR_VERSION: "2026"
  SEMVER_VERSION: 2026.10.4
  SUFFIX: -dev
  VERSION: 2026.10.4-0
contents:
  repositories:
    - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
  keyring:
    - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
  packages:
    - '!gawk'
    - '!libelogind0'
    - '!original-awk'
    - apt
    - base-files
    - bash
    - ca-certificates
    - ca-certificates-bundle
    - cloudflared-dev=2026.10.4-0
    - coreutils
    - diffutils
    - dpkg
    - findutils
    - grep
    - libc-bin
    - mawk
    - perl-base
    - sed
    - tzdata
    - util-linux
  builds:
    - name: locale
      contents:
        packages:
          - bash
          - locales
          - coreutils
          - gzip
      pipeline:
        - name: install locales
          runs: |
            set -eux -o pipefail

            ln -s /etc/locale.alias /usr/share/locale/locale.alias

            echo "en_US.UTF-8 UTF-8" >> /etc/locale.gen
            locale-gen en_US.UTF-8
      outputs:
        - source: /usr/share/locale
          target: /usr/share/locale
          uid: 0
          gid: 0
        - source: /usr/lib/locale
          target: /usr/lib/locale
          uid: 0
          gid: 0
accounts:
  root: true
  run-as: root
  users:
    - name: nonroot
      uid: 65532
      gid: 65532
      mode: "0700"
    - name: _apt
      uid: 42
      gid: 65532
  groups:
    - name: nonroot
      gid: 65532
      members:
        - nonroot
os-release:
  name: Docker Hardened Images (Debian)
  id: debian
  version-id: "13"
  version-codename: trixie
  pretty-name: Docker Hardened Images/Debian GNU/Linux 13 (trixie)
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
work-dir: /home/nonroot
environment:
  DEBIAN_FRONTEND: noninteractive
  LANG: en_US.UTF-8
  LANGUAGE: en_US:en
  LC_ALL: en_US.UTF-8
  SSL_CERT_FILE: /etc/ssl/certs/ca-certificates.crt
paths:
  - type: directory
    path: /usr/local/bin
    uid: 0
    gid: 0
  - type: symlink
    path: /usr/local/bin/cloudflared
    uid: 0
    gid: 0
    source: /usr/bin/cloudflared
  - type: directory
    path: /home/nonroot
    uid: 65532
    gid: 65532
    mode: "0700"
  - type: directory
    path: /home/nonroot/.cloudflared
    uid: 65532
    gid: 65532
    mode: "0700"
  - type: directory
    path: /usr/local/etc
    uid: 0
    gid: 0
  - type: directory
    path: /usr/local/etc/cloudflared
    uid: 65532
    gid: 65532
    mode: "0700"
  - type: directory
    path: /etc/cloudflared
    uid: 65532
    gid: 65532
    mode: "0755"
  - type: directory
    path: /var/log/cloudflared
    uid: 65532
    gid: 65532
    mode: "0770"
annotations:
  org.opencontainers.image.description: A minimal cloudflared image
  org.opencontainers.image.licenses: Apache-2.0
entrypoint:
  - cloudflared
  - --no-autoupdate
cmd:
  - version
