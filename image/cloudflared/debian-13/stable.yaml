# syntax=dhi.io/build:2-debian13

name: cloudflared 2026.x
image: dhi.io/cloudflared
variant: runtime
tags:
  - "2026"
  - "2026.10"
  - 2026.10.4
  - 2026-debian
  - 2026-debian13
  - 2026.10-debian
  - 2026.10-debian13
  - 2026.10.4-debian
  - 2026.10.4-debian13
platforms:
  - linux/amd64
  - linux/arm64
dates:
  release: "2026-01-20"
vars:
  FLAVORED_SUFFIX: ""
  SEMVER_MAJOR_MINOR_VERSION: "2026.10"
  SEMVER_MAJOR_VERSION: "2026"
  SEMVER_VERSION: 2026.10.4
  SUFFIX: ""
  VERSION: 2026.10.4-0
contents:
  repositories:
    - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
  keyring:
    - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
  packages:
    - base-files
    - ca-certificates-bundle
    - cloudflared=2026.10.4-0
    - tzdata
accounts:
  run-as: nonroot
  users:
    - name: nonroot
      uid: 65532
      gid: 65532
      mode: "0700"
  groups:
    - name: nonroot
      gid: 65532
      members:
        - nonroot
os-release:
  name: Docker Hardened Images (Debian)
  id: debian
  version-id: "13"
  version-codename: trixie
  pretty-name: Docker Hardened Images/Debian GNU/Linux 13 (trixie)
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
work-dir: /home/nonroot
environment:
  SSL_CERT_FILE: /etc/ssl/certs/ca-certificates.crt
paths:
  - type: directory
    path: /usr/local/bin
    uid: 0
    gid: 0
  - type: symlink
    path: /usr/local/bin/cloudflared
    uid: 0
    gid: 0
    source: /usr/bin/cloudflared
  - type: directory
    path: /home/nonroot
    uid: 65532
    gid: 65532
    mode: "0700"
  - type: directory
    path: /home/nonroot/.cloudflared
    uid: 65532
    gid: 65532
    mode: "0700"
  - type: directory
    path: /usr/local/etc
    uid: 0
    gid: 0
  - type: directory
    path: /usr/local/etc/cloudflared
    uid: 65532
    gid: 65532
    mode: "0700"
  - type: directory
    path: /etc/cloudflared
    uid: 65532
    gid: 65532
    mode: "0755"
  - type: directory
    path: /var/log/cloudflared
    uid: 65532
    gid: 65532
    mode: "0770"
annotations:
  org.opencontainers.image.description: A minimal cloudflared image
  org.opencontainers.image.licenses: Apache-2.0
entrypoint:
  - cloudflared
  - --no-autoupdate
cmd:
  - version
