# syntax=dhi.io/build:2-debian13

name: Grafana 13.2.x
image: dhi.io/grafana
variant: runtime
tags:
  - "13.2"
  - 13.2.7
  - 13.2-debian
  - 13.2-debian13
  - 13.2.7-debian
  - 13.2.7-debian13
platforms:
  - linux/amd64
  - linux/arm64
dates:
  release: "2026-08-18"
  end-of-life: "2027-05-18"
vars:
  ELASTICSEARCH_PLUGIN_VERSION: 12.9.7-1
  FLAVORED_SUFFIX: ""
  GRAFANA_PACKAGE_SUFFIX: ""
  GRAFANA_POSTGRESQL_DATASOURCE_PLUGIN_VERSION: 13.0.7-1
  GRAFANA_PYROSCOPE_DATASOURCE_PLUGIN_VERSION: 13.0.10-1
  INFLUXDB_PLUGIN_VERSION: 13.2.0-1
  JAEGER_PLUGIN_VERSION: 13.0.8-1
  LOKI_PLUGIN_VERSION: 13.2.5-2
  MSSQL_PLUGIN_VERSION: 13.0.10-1
  MYSQL_PLUGIN_VERSION: 13.1.7-1
  OPENTSDB_PLUGIN_VERSION: 13.0.8-1
  PROMETHEUS_PLUGIN_VERSION: 13.3.0-0
  SEMVER_MAJOR_MINOR_VERSION: "13.2"
  SEMVER_MAJOR_VERSION: "13"
  SEMVER_VERSION: 13.2.7
  STACKDRIVER_PLUGIN_VERSION: 12.6.7-1
  SUFFIX: ""
  TEMPO_PLUGIN_VERSION: 13.5.1-0
  VERSION: 13.2.7-0
  ZIPKIN_PLUGIN_VERSION: 12.4.13-1
contents:
  repositories:
    - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
  keyring:
    - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
  packages:
    - '!dpkg'
    - '!gawk'
    - '!libslang2'
    - '!tar'
    - base-files
    - ca-certificates-bundle
    - grafana-13.2=13.2.7-0
    - grafana-cloudmonitoring-datasource-12=12.6.7-1
    - grafana-elasticsearch-datasource-12=12.9.7-1
    - grafana-influxdb-datasource-13=13.2.0-1
    - grafana-jaeger-datasource-13=13.0.8-1
    - grafana-loki-datasource-13=13.2.5-2
    - grafana-mssql-datasource-13=13.0.10-1
    - grafana-mysql-datasource-13=13.1.7-1
    - grafana-opentsdb-datasource-13=13.0.8-1
    - grafana-postgresql-datasource-13=13.0.7-1
    - grafana-prometheus-datasource-13=13.3.0-0
    - grafana-pyroscope-datasource-13=13.0.10-1
    - grafana-tempo-datasource-13=13.5.1-0
    - grafana-zipkin-datasource-12=12.4.13-1
    - libc6
    - libgcc-s1
    - libstdc++6
    - tzdata
accounts:
  run-as: grafana
  users:
    - name: grafana
      uid: 65532
      gid: 65532
  groups:
    - name: grafana
      gid: 65532
      members:
        - grafana
os-release:
  name: Docker Hardened Images (Debian)
  id: debian
  version-id: "13"
  version-codename: trixie
  pretty-name: Docker Hardened Images/Debian GNU/Linux 13 (trixie)
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
work-dir: /var/lib/grafana
environment:
  GF_PLUGINS_ALLOW_LOADING_UNSIGNED_PLUGINS: elasticsearch,grafana-postgresql-datasource,grafana-pyroscope-datasource,influxdb,jaeger,loki,mssql,mysql,opentsdb,prometheus,stackdriver,tempo,zipkin
  GF_PLUGINS_PREINSTALL_AUTO_UPDATE: "false"
  GRAFANA_VERSION: 13.2.7
  PATH: /usr/share/grafana/bin:/usr/sbin:/sbin:/usr/bin:/bin:/usr/local/bin
paths:
  - type: directory
    path: /etc/grafana
    uid: 65532
    gid: 65532
    mode: "0755"
  - type: directory
    path: /etc/grafana/provisioning
    uid: 65532
    gid: 65532
    mode: "0755"
  - type: directory
    path: /etc/grafana/provisioning/alerting
    uid: 65532
    gid: 65532
    mode: "0755"
  - type: directory
    path: /etc/grafana/provisioning/dashboards
    uid: 65532
    gid: 65532
    mode: "0755"
  - type: directory
    path: /etc/grafana/provisioning/datasources
    uid: 65532
    gid: 65532
    mode: "0755"
  - type: directory
    path: /etc/grafana/provisioning/plugins
    uid: 65532
    gid: 65532
    mode: "0755"
  - type: directory
    path: /etc/grafana/plugins
    uid: 65532
    gid: 65532
    mode: "0755"
  - type: directory
    path: /var/lib/grafana
    uid: 65532
    gid: 65532
    mode: "0755"
  - type: directory
    path: /var/lib/grafana/plugins
    uid: 65532
    gid: 65532
    mode: "0755"
  - type: directory
    path: /var/log/grafana
    uid: 65532
    gid: 65532
    mode: "0755"
  - type: directory
    path: /tmp
    uid: 65532
    gid: 65532
    mode: "0755"
annotations:
  org.opencontainers.image.description: A minimal Grafana image
  org.opencontainers.image.licenses: AGPL-3.0
entrypoint:
  - grafana
  - server
  - --homepath=/usr/share/grafana
  - --config=/etc/grafana/grafana.ini
  - --packaging=docker
  - cfg:default.log.mode=console
  - cfg:default.paths.data=/var/lib/grafana
  - cfg:default.paths.logs=/var/log/grafana
  - cfg:default.paths.plugins=/var/lib/grafana/plugins
  - cfg:default.paths.provisioning=/etc/grafana/provisioning
ports:
  - 3000/tcp
