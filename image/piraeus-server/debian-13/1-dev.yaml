# syntax=dhi.io/build:2-debian13

name: Piraeus Server 1.x (dev)
image: dhi.io/piraeus-server
variant: dev
tags:
  - 1-dev
  - 1.35-dev
  - 1.35.0-dev
  - 1-debian-dev
  - 1-debian13-dev
  - 1.35-debian-dev
  - 1.35-debian13-dev
  - 1.35.0-debian-dev
  - 1.35.0-debian13-dev
platforms:
  - linux/amd64
  - linux/arm64
dates:
  release: "2019-08-08"
vars:
  DRBD_UTILS_VERSION: 9.34.0-3
  FLAVORED_SUFFIX: -dev
  JAVA_FIPS_SUFFIX: ""
  JAVA_VARIANT: jdk
  JDK_MAJOR_VERSION: "21"
  JRE_PATH: /usr/lib/jvm/temurin-21
  KUBECTL_VERSION: 1.36.4-3
  PYTHON_VERSION: 3.13.15-1
  SEMVER_MAJOR_MINOR_VERSION: "1.35"
  SEMVER_MAJOR_VERSION: "1"
  SEMVER_VERSION: 1.35.0
  SUFFIX: -dev
  VERSION: 1.35.0-2
contents:
  repositories:
    - deb http://deb.debian.org/debian trixie contrib
    - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
  keyring:
    - https://ftp-master.debian.org/keys/archive-key-13.asc
    - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
  packages:
    - '!gawk'
    - '!libelogind0'
    - '!libpython3-stdlib'
    - '!libpython3.13'
    - '!libpython3.13-minimal'
    - '!libpython3.13-stdlib'
    - '!original-awk'
    - '!python3'
    - '!python3-minimal'
    - '!python3.13'
    - '!python3.13-minimal'
    - '!udev'
    - apt
    - base-files
    - bash
    - ca-certificates
    - ca-certificates-bundle
    - coreutils
    - cryptsetup
    - curl
    - diffutils
    - dpkg
    - drbd-utils=9.34.0-3
    - e2fsprogs
    - eclipse-temurin-21-jdk
    - eclipse-temurin-21-jdk-oci-config
    - findutils
    - grep
    - gzip
    - hostname
    - iproute2
    - iputils-ping
    - jq
    - kubectl-1.36-dev=1.36.4-3
    - libc-bin
    - libc6
    - libgcc-s1
    - libkeyutils1
    - libpython-3.13-minimal=3.13.15-1
    - libpython-3.13-stdlib=3.13.15-1
    - libpython-3.13=3.13.15-1
    - libstdc++6
    - lsscsi
    - lvm2
    - mawk
    - mount
    - multipath-tools
    - net-tools
    - netcat-traditional
    - nvme-cli
    - perl-base
    - piraeus-server=1.35.0-2
    - procps
    - python-3.13-minimal=3.13.15-1
    - python-3.13=3.13.15-1
    - sed
    - socat
    - sysstat
    - thin-provisioning-tools
    - tzdata
    - util-linux
    - xfsprogs
    - zfsutils-linux
    - zlib1g
    - zstd
  builds:
    - name: fix caps
      contents:
        packages:
          - bash
          - util-linux
          - hostname
          - libcap2-bin
      pipeline:
        - name: setcap
          runs: |
            set -eux -o pipefail

            setcap cap_sys_admin+ep /usr/bin/unshare
            setcap cap_sys_admin,cap_net_admin+ep /usr/bin/hostname
      outputs:
        - source: /usr/bin/unshare
          target: /usr/bin/unshare
          uid: 0
          gid: 0
        - source: /usr/bin/hostname
          target: /usr/bin/hostname
          uid: 0
          gid: 0
    - name: locale
      contents:
        packages:
          - bash
          - locales
          - coreutils
          - gzip
      pipeline:
        - name: install locales
          runs: |
            set -eux -o pipefail

            ln -s /etc/locale.alias /usr/share/locale/locale.alias

            echo "en_US.UTF-8 UTF-8" >> /etc/locale.gen
            locale-gen en_US.UTF-8
      outputs:
        - source: /usr/share/locale
          target: /usr/share/locale
          uid: 0
          gid: 0
        - source: /usr/lib/locale
          target: /usr/lib/locale
          uid: 0
          gid: 0
accounts:
  root: true
  run-as: root
  users:
    - name: nonroot
      uid: 65532
      gid: 65532
    - name: _apt
      uid: 42
      gid: 65532
  groups:
    - name: nonroot
      gid: 65532
      members:
        - nonroot
os-release:
  name: Docker Hardened Images (Debian)
  id: debian
  version-id: "13"
  version-codename: trixie
  pretty-name: Docker Hardened Images/Debian GNU/Linux 13 (trixie)
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
work-dir: /
environment:
  DEBIAN_FRONTEND: noninteractive
  JAVA_HOME: /usr/lib/jvm/temurin-21
  LANG: en_US.UTF-8
  LANGUAGE: en_US:en
  LC_ALL: en_US.UTF-8
paths:
  - type: symlink
    path: /opt/python
    uid: 0
    gid: 0
    source: /usr
  - type: directory
    path: /usr/local/sbin
    uid: 0
    gid: 0
  - type: symlink
    path: /usr/local/sbin/losetup-container
    uid: 0
    gid: 0
    source: /usr/sbin/losetup-container
  - type: symlink
    path: /usr/local/sbin/losetup
    uid: 0
    gid: 0
    source: /usr/lib/piraeus-server/bin/losetup
  - type: directory
    path: /var/log/linstor-controller
    uid: 65532
    gid: 65532
    mode: "0775"
  - type: directory
    path: /logs
    uid: 65532
    gid: 65532
    mode: "0775"
  - type: directory
    path: /var/lib/linstor.d
    uid: 65532
    gid: 65532
    mode: "0775"
  - type: directory
    path: /var/lib/linstor
    uid: 65532
    gid: 65532
    mode: "0775"
  - type: directory
    path: /etc/linstor
    uid: 65532
    gid: 65532
    mode: "0775"
  - type: file
    path: /etc/drbd.conf
    content: |
      include "drbd.d/global_common.conf";
      include "drbd.d/*.res";
    uid: 0
    gid: 0
  - type: directory
    path: /etc/drbd.d
    uid: 65532
    gid: 65532
    mode: "0775"
  - type: file
    path: /etc/drbd.d/linstor-resources.res
    content: |
      include "/var/lib/linstor.d/*.res";
    uid: 65532
    gid: 65532
    mode: "0644"
  - type: file
    path: /etc/drbd.d/global_common.conf
    content: |
      global { usage-count no; }
    uid: 65532
    gid: 65532
    mode: "0644"
  - type: file
    path: /etc/lvm/lvm.conf
    content: |
      activation {
          udev_sync = 0
          udev_rules = 0
          monitoring = 0
      }
      devices {
          global_filter = [ "r|^/dev/drbd|" ]
          obtain_device_list_from_udev = 0
      }
    uid: 65532
    gid: 65532
    mode: "0644"
  - type: directory
    path: /run/drbd/lock
    uid: 65532
    gid: 65532
    mode: "0775"
annotations:
  org.opencontainers.image.description: A minimal Piraeus Server image
  org.opencontainers.image.licenses: Apache-2.0
entrypoint:
  - /usr/bin/k8s-await-election
  - /usr/bin/piraeus-entry.sh
cmd:
  - startSatellite
ports:
  - 3366/tcp
  - 3367/tcp
  - 3370/tcp
  - 3371/tcp
  - 3376/tcp
  - 3377/tcp
