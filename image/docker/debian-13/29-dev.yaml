# syntax=dhi.io/build:2-debian13

name: Docker 29.x (cli, dev)
image: dhi.io/docker
variant: dev
flavor: cli
tags:
  - 29-cli-dev
  - 29.10-cli-dev
  - 29.10.0-cli-dev
  - 29-debian-cli-dev
  - 29-debian13-cli-dev
  - 29.10-debian-cli-dev
  - 29.10-debian13-cli-dev
  - 29.10.0-debian-cli-dev
  - 29.10.0-debian13-cli-dev
platforms:
  - linux/amd64
  - linux/arm64
vars:
  BUILDX_VERSION: 0.39.1-2
  COMPOSE_VERSION: 5.8.0-6
  DOCKER_CLI_VERSION: 5:29.10.0-9
  SCOUT_CLI_VERSION: 1.30.0-0
  SCOUT_PACKAGE: scout-cli-dev
  SEMVER_MAJOR_MINOR_VERSION: "29.10"
  SEMVER_MAJOR_VERSION: "29"
  SEMVER_VERSION: 29.10.0
  VERSION: 29.10.0
contents:
  repositories:
    - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
  keyring:
    - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
  packages:
    - '!gawk'
    - '!libelogind0'
    - '!original-awk'
    - apt
    - base-files
    - bash
    - ca-certificates
    - coreutils
    - diffutils
    - docker-buildx-plugin=0.39.1-2
    - docker-ce-cli
    - docker-compose-plugin=5.8.0-6
    - dpkg
    - grep
    - libc-bin
    - libc6
    - mawk
    - perl-base
    - scout-cli-dev=1.30.0-0
    - sed
    - util-linux
accounts:
  root: true
  run-as: root
  users:
    - name: nonroot
      uid: 65532
      gid: 65532
    - name: _apt
      uid: 42
      gid: 65532
  groups:
    - name: docker
      gid: 2375
os-release:
  name: Docker Hardened Images (Debian)
  id: debian
  version-id: "13"
  version-codename: trixie
  pretty-name: Docker Hardened Images/Debian GNU/Linux 13 (trixie)
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
environment:
  DEBIAN_FRONTEND: noninteractive
  DOCKER_BUILDX_VERSION: 0.39.1-2
  DOCKER_COMPOSE_VERSION: 5.8.0-6
  DOCKER_TLS_CERTDIR: /cert
  DOCKER_VERSION: 29.10.0
paths:
  - type: directory
    path: /certs/client
    uid: 0
    gid: 0
  - type: directory
    path: /usr/local/bin
    uid: 0
    gid: 0
  - type: symlink
    path: /usr/local/bin/docker
    uid: 0
    gid: 0
    source: /usr/bin/docker
  - type: directory
    path: /usr/local/libexec
    uid: 0
    gid: 0
  - type: directory
    path: /usr/local/libexec/docker
    uid: 0
    gid: 0
  - type: directory
    path: /usr/local/libexec/docker/cli-plugins
    uid: 0
    gid: 0
  - type: symlink
    path: /usr/local/libexec/docker/cli-plugins/docker-scout
    uid: 0
    gid: 0
    source: /usr/bin/docker-scout
annotations:
  org.opencontainers.image.description: A minimal Docker image
  org.opencontainers.image.licenses: Apache-2.0
entrypoint:
  - docker
