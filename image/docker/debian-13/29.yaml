# syntax=dhi.io/build:2-debian13

name: Docker 29.x (cli)
image: dhi.io/docker
variant: runtime
flavor: cli
tags:
  - 29-cli
  - 29.10-cli
  - 29.10.0-cli
  - 29-debian-cli
  - 29-debian13-cli
  - 29.10-debian-cli
  - 29.10-debian13-cli
  - 29.10.0-debian-cli
  - 29.10.0-debian13-cli
platforms:
  - linux/amd64
  - linux/arm64
vars:
  BUILDX_VERSION: 0.39.0-16
  COMMIT_SHA: fdd4b8e5da335e1d0d83d29af5045f57280cd694
  COMPOSE_VERSION: 5.8.0-3
  SCOUT_CLI_PLUGIN_SEMVER_VERSION: 1.29.0
  SCOUT_CLI_PLUGIN_VERSION: 1.29.0-0
  SEMVER_MAJOR_MINOR_VERSION: "29.10"
  SEMVER_MAJOR_VERSION: "29"
  SEMVER_VERSION: 29.10.0
  VERSION: 29.10.0
contents:
  repositories:
    - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
  keyring:
    - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
  packages:
    - base-files
    - ca-certificates
    - docker-buildx-plugin=0.39.0-16
    - docker-compose-plugin=5.8.0-3
    - docker-scout-cli-plugin=1.29.0-0
    - libc6
  builds:
    - name: scout-cli-sbom
      contents:
        packages:
          - bash
          - coreutils
      pipeline:
        - uses: spdx@v1
          with:
            license: Apache-2.0
            name: scout-cli
            purl: pkg:github/docker/scout-cli-plugin@1.29.0
            version: 1.29.0
      outputs:
        - source: /opt/docker/sbom/scout-cli
          target: /opt/docker/sbom/scout-cli
          uid: 0
          gid: 0
    - name: docker-cli
      work-dir: /go/src/github.com/docker/cli
      environment:
        GOPATH: /go
      caches:
        - path: /go/pkg/mod
      contents:
        packages:
          - bash
          - btrfs-progs
          - build-essential
          - ca-certificates
          - libseccomp-dev
          - libtool
          - linux-libc-dev
          - liblvm2-dev
          - ca-certificates-bundle
          - coreutils
          - golang-1.27
          - findutils
          - mawk
          - sed
        files:
          - url: git+https://github.com/docker/cli.git#v29.10.0
            checksum: fdd4b8e5da335e1d0d83d29af5045f57280cd694
            path: /go/src/github.com/docker/cli
            spdx:
              name: docker-cli
              version: 29.10.0
              packages:
                - name: docker-cli
                  purl: pkg:golang/github.com/docker/cli@29.10.0
                  license: Apache-2.0
            uid: 0
            gid: 0
      pipeline:
        - name: build
          work-dir: /go/src/github.com/docker/cli
          runs: |
            set -eux -o pipefail

            export DISABLE_WARN_OUTSIDE_CONTAINER=1
            export LDFLAGS=""
            export CGO_ENABLED=1

            make VERSION="29.10.0" dynbinary

            install -Dm755 build/docker-linux-* "${target.dir}/usr/local/bin/docker"
      outputs:
        - source: ${target.dir}/usr/local/bin/docker
          target: /usr/local/bin/docker
          uid: 0
          gid: 0
          mode: "0755"
        - source: /opt/docker/sbom/docker-cli
          target: /opt/docker/sbom/docker-cli
          uid: 0
          gid: 0
accounts:
  root: true
  run-as: root
  users:
    - name: nonroot
      uid: 65532
      gid: 65532
  groups:
    - name: docker
      gid: 2375
os-release:
  name: Docker Hardened Images (Debian)
  id: debian
  version-id: "13"
  version-codename: trixie
  pretty-name: Docker Hardened Images/Debian GNU/Linux 13 (trixie)
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
environment:
  DOCKER_BUILDX_VERSION: 0.39.0-16
  DOCKER_COMPOSE_VERSION: 5.8.0-3
  DOCKER_TLS_CERTDIR: /cert
  DOCKER_VERSION: 29.10.0
paths:
  - type: directory
    path: /certs/client
    uid: 0
    gid: 0
  - type: directory
    path: /usr/local/libexec
    uid: 0
    gid: 0
  - type: directory
    path: /usr/local/libexec/docker
    uid: 0
    gid: 0
  - type: directory
    path: /usr/local/libexec/docker/cli-plugins
    uid: 0
    gid: 0
  - type: symlink
    path: /usr/local/libexec/docker/cli-plugins/docker-scout
    uid: 0
    gid: 0
    source: /usr/libexec/docker/cli-plugins/docker-scout
annotations:
  org.opencontainers.image.description: A minimal Docker image
  org.opencontainers.image.licenses: Apache-2.0
entrypoint:
  - docker
