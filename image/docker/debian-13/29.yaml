# syntax=dhi.io/build:2-debian13

name: Docker 29.x (cli)
image: dhi.io/docker
variant: runtime
flavor: cli
tags:
  - 29-cli
  - 29.8-cli
  - 29.8.2-cli
  - 29-debian-cli
  - 29-debian13-cli
  - 29.8-debian-cli
  - 29.8-debian13-cli
  - 29.8.2-debian-cli
  - 29.8.2-debian13-cli
platforms:
  - linux/amd64
  - linux/arm64
vars:
  BUILDX_VERSION: 0.37.2-0
  COMMIT_SHA: 7fc2dff9bceb96b266a3b2c3117c0955a0d9e616
  COMPOSE_VERSION: 5.5.1-2
  SCOUT_CLI_PLUGIN_COMMIT_SHA: dac313a945b1fc7abe573ed1c5236c478d03ac63
  SCOUT_CLI_PLUGIN_VERSION: 1.25.0
  SEMVER_MAJOR_MINOR_VERSION: "29.8"
  SEMVER_MAJOR_VERSION: "29"
  SEMVER_VERSION: 29.8.2
  VERSION: 29.8.2
contents:
  repositories:
    - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
  keyring:
    - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
  packages:
    - base-files
    - ca-certificates
    - docker-buildx-plugin=0.37.2-0
    - docker-compose-plugin=5.5.1-2
    - libc6
  builds:
    - name: scout
      work-dir: /go/src/github.com/docker/scout-cli-plugin
      caches:
        - path: /go/pkg/mod
      contents:
        packages:
          - bash
          - ca-certificates-bundle
          - coreutils
          - golang-1.26
          - findutils
          - mawk
          - sed
        files:
          - url: git+https://github.com/docker/scout-cli-plugin.git#v1.25.0
            checksum: dac313a945b1fc7abe573ed1c5236c478d03ac63
            path: /go/src/github.com/docker/scout-cli-plugin
            spdx:
              name: scout-cli
              version: 1.25.0
              packages:
                - name: scout-cli
                  purl: pkg:github/docker/scout-cli-plugin@1.25.0
                  license: Apache-2.0
            uid: 0
            gid: 0
      pipeline:
        - name: patch for trivy permissions
          uses: git/patch@v1
          with:
            patch: ${source.dir}/patch/trivy-0_72.patch
        - name: go dependencies
          uses: go/bump@v2
          with:
            deps:
              - github.com/containerd/containerd/v2@v2.3.5
              - github.com/go-git/go-git/v5@v5.19.2
              - golang.org/x/mod@v0.41.0
              - github.com/in-toto/in-toto-golang@v0.11.0
              - github.com/sigstore/rekor@v1.5.4
              - github.com/sigstore/sigstore-go@v1.2.1
              - github.com/sigstore/timestamp-authority/v2@v2.1.2
              - github.com/aquasecurity/trivy@v0.72.0
              - github.com/yuin/goldmark@v1.7.17
              - helm.sh/helm/v3@v3.20.2
              - go.opentelemetry.io/otel@v1.45.0
              - go.opentelemetry.io/otel/sdk@v1.45.0
              - go.opentelemetry.io/otel/exporters/otlp/otlptrace@v1.45.0
              - go.opentelemetry.io/otel/exporters/otlp/otlptrace/otlptracegrpc@v1.45.0
              - google.golang.org/grpc@v1.83.2
            downgrade: true
            replaces:
              - github.com/moby/buildkit=github.com/moby/buildkit@v0.32.2
              - github.com/sigstore/sigstore=github.com/sigstore/sigstore@v1.10.8
            tidy: true
        - uses: go/hermetic@v1
        - name: build
          uses: go/build@v1
          with:
            experiments: jsonv2
            ldflags:
              - -X github.com/docker/scout-cli-plugin/internal/version.version=1.25.0
              - -X github.com/docker/scout-cli-plugin/internal/version.commit=dac313a945b1fc7abe573ed1c5236c478d03ac63
            output: ${target.dir}/usr/local/libexec/docker/cli-plugins/docker-scout
            packages: ./cmd/docker-scout
      paths:
        - type: file
          path: ${source.dir}/patch/trivy-0_72.patch
          uid: 0
          gid: 0
          source: image/docker/patch/trivy-0_72.patch
      outputs:
        - source: ${target.dir}/usr/local/libexec/docker/cli-plugins/docker-scout
          target: /usr/local/libexec/docker/cli-plugins/docker-scout
          uid: 0
          gid: 0
          mode: "0755"
        - source: /opt/docker/sbom/scout-cli
          target: /opt/docker/sbom/scout-cli
          uid: 0
          gid: 0
    - name: docker-cli
      work-dir: /go/src/github.com/docker/cli
      environment:
        GOPATH: /go
      caches:
        - path: /go/pkg/mod
      contents:
        packages:
          - bash
          - btrfs-progs
          - build-essential
          - ca-certificates
          - libseccomp-dev
          - libtool
          - linux-libc-dev
          - liblvm2-dev
          - ca-certificates-bundle
          - coreutils
          - golang-1.27
          - findutils
          - mawk
          - sed
        files:
          - url: git+https://github.com/docker/cli.git#v29.8.2
            checksum: 7fc2dff9bceb96b266a3b2c3117c0955a0d9e616
            path: /go/src/github.com/docker/cli
            spdx:
              name: docker-cli
              version: 29.8.2
              packages:
                - name: docker-cli
                  purl: pkg:golang/github.com/docker/cli@29.8.2
                  license: Apache-2.0
            uid: 0
            gid: 0
      pipeline:
        - name: build
          work-dir: /go/src/github.com/docker/cli
          runs: |
            set -eux -o pipefail

            export DISABLE_WARN_OUTSIDE_CONTAINER=1
            export LDFLAGS=""
            export CGO_ENABLED=1

            make VERSION="29.8.2" dynbinary

            install -Dm755 build/docker-linux-* "${target.dir}/usr/local/bin/docker"
      outputs:
        - source: ${target.dir}/usr/local/bin/docker
          target: /usr/local/bin/docker
          uid: 0
          gid: 0
          mode: "0755"
        - source: /opt/docker/sbom/docker-cli
          target: /opt/docker/sbom/docker-cli
          uid: 0
          gid: 0
accounts:
  root: true
  run-as: root
  users:
    - name: nonroot
      uid: 65532
      gid: 65532
  groups:
    - name: docker
      gid: 2375
os-release:
  name: Docker Hardened Images (Debian)
  id: debian
  version-id: "13"
  version-codename: trixie
  pretty-name: Docker Hardened Images/Debian GNU/Linux 13 (trixie)
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
environment:
  DOCKER_BUILDX_VERSION: 0.37.2-0
  DOCKER_COMPOSE_VERSION: 5.5.1-2
  DOCKER_TLS_CERTDIR: /cert
  DOCKER_VERSION: 29.8.2
paths:
  - type: directory
    path: /certs/client
    uid: 0
    gid: 0
annotations:
  org.opencontainers.image.description: A minimal Docker image
  org.opencontainers.image.licenses: Apache-2.0
entrypoint:
  - docker
