# syntax=dhi.io/build:2-debian13

name: Apache Kafka 4.1.x (native)
image: dhi.io/kafka
variant: runtime
flavor: native
tags:
  - 4.1-native
  - 4.1.2-native
  - 4.1-debian-native
  - 4.1-debian13-native
  - 4.1.2-debian-native
  - 4.1.2-debian13-native
platforms:
  - linux/amd64
  - linux/arm64
dates:
  release: "2025-09-02"
vars:
  KAFKA_MAJOR_MINOR_VERSION: ${KAFKA_VERSION:([0-9]+.[0-9]+).*$}
  KAFKA_MAJOR_VERSION: ${KAFKA_VERSION:([0-9]+).*$}
  SEMVER_MAJOR_MINOR_VERSION: "4.1"
  SEMVER_MAJOR_VERSION: "4"
  SEMVER_VERSION: 4.1.2
  VERSION: 4.1.2-1
contents:
  repositories:
    - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
  keyring:
    - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
  packages:
    - '!gawk'
    - base-files
    - bash
    - ca-certificates
    - kafka-native-4.1=4.1.2-1
    - libc6
    - netbase
    - tzdata
    - zlib1g
  builds:
    - name: locale
      contents:
        packages:
          - bash
          - locales
          - coreutils
          - gzip
      pipeline:
        - name: install locales
          runs: |
            set -eux -o pipefail

            ln -s /etc/locale.alias /usr/share/locale/locale.alias

            echo "en_US.UTF-8 UTF-8" >> /etc/locale.gen
            locale-gen en_US.UTF-8
      outputs:
        - source: /usr/share/locale
          target: /usr/share/locale
          uid: 0
          gid: 0
        - source: /usr/lib/locale
          target: /usr/lib/locale
          uid: 0
          gid: 0
accounts:
  run-as: kafka
  users:
    - name: kafka
      uid: 65532
      gid: 65532
  groups:
    - name: kafka
      gid: 65532
      members:
        - kafka
os-release:
  name: Docker Hardened Images (Debian)
  id: debian
  version-id: "13"
  version-codename: trixie
  pretty-name: Docker Hardened Images/Debian GNU/Linux 13 (trixie)
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
environment:
  CLUSTER_ID: 5L6g3nShT-eMCtK--X86sw
  KAFKA_LOG4J_CMD_OPTS: -Dkafka.logs.dir=/opt/kafka/logs -Dlog4j2.configurationFile=/opt/kafka/config/log4j2.yaml
  LANG: en_US.UTF-8
  LANGUAGE: en_US:en
  LC_ALL: en_US.UTF-8
paths:
  - type: directory
    path: /opt/kafka
    uid: 0
    gid: 0
    mode: "0755"
  - type: symlink
    path: /opt/kafka/kafka.Kafka
    uid: 0
    gid: 0
    source: /usr/lib/kafka-native/kafka.Kafka
  - type: directory
    path: /opt/kafka/config
    uid: 65532
    gid: 65532
    mode: "0755"
  - type: directory
    path: /opt/kafka/logs
    uid: 65532
    gid: 65532
    mode: "0755"
  - type: directory
    path: /tmp/kraft-combined-logs
    uid: 65532
    gid: 65532
    mode: "0755"
  - type: file
    path: /usr/local/bin/docker-entrypoint.sh
    uid: 0
    gid: 0
    mode: "0755"
    source: image/kafka/bin/docker-entrypoint-native.sh
annotations:
  org.opencontainers.image.description: A minimal Kafka image
  org.opencontainers.image.licenses: Apache-2.0
entrypoint:
  - /usr/local/bin/docker-entrypoint.sh
cmd:
  - start
  - --config=/opt/kafka/config/server.properties
ports:
  - 9092/tcp
