  files:
    - url: https://raw.githubusercontent.com/jupyterlab/jupyterlab/v4.6.2/jupyterlab/staging/package.json
      checksum: sha256:1ddc43a83f017b38823293747ff9f2331b6865d337939f576af7b41bb7a20ba4
      path: /opt/conda/lib/python3.13/site-packages/jupyterlab/staging/package.json
      spdx:
        name: jupyterlab-staging-package.json
        version: 4.6.2
        packages:
          - name: jupyterlab-staging-package.json
            purl: pkg:github/jupyterlab/jupyterlab@v4.6.2#jupyterlab/staging/package.json
            license: BSD-3-Clause
      uid: 1000
      gid: 100
      mode: "0644"
  builds:
    - name: restore nbclassic static components
      contents:
        packages:
          - bash
          - coreutils
          - unzip
        files:
          - url: https://files.pythonhosted.org/packages/3d/fd/dfb6db427bb4e0a50c9802b11df0b69d9364192f3db999849cde9209c8d0/nbclassic-1.3.3-py3-none-any.whl
            checksum: sha256:dcee5149aa6aa01846c7458d6394b29b325213b5e118ee14c80d689122e0e4f2
            path: ${source.dir}/nbclassic.whl
            spdx:
              name: nbclassic-static-components
              version: 1.3.3
              packages:
                - name: nbclassic
                  purl: pkg:pypi/nbclassic@1.3.3
                  license: BSD-3-Clause
            uid: 0
            gid: 0
      pipeline:
        - name: extract static components
          runs: |
            set -eux -o pipefail

            site_packages="${target.dir}/opt/conda/lib/python3.13/site-packages"
            mkdir -p "${site_packages}"
            unzip -q "${source.dir}/nbclassic.whl" 'nbclassic/static/components/*' -d "${site_packages}"
      outputs:
        - source: ${target.dir}/opt/conda/lib/python3.13/site-packages/nbclassic/static/components
          target: /opt/conda/lib/python3.13/site-packages/nbclassic/static/components
          uid: 0
          gid: 0
        - source: /opt/docker/sbom/nbclassic-static-components
          target: /opt/docker/sbom/nbclassic-static-components
          uid: 0
          gid: 0
