# syntax=dhi.io/build:2-debian13

name: OpenMetadata 1.12.x
image: dhi.io/openmetadata
variant: runtime
tags:
  - "1.12"
  - 1.12.14
  - 1.12-debian
  - 1.12-debian13
  - 1.12.14-debian
  - 1.12.14-debian13
platforms:
  - linux/amd64
  - linux/arm64
dates:
  release: "2026-02-22"
vars:
  JAVA_FIPS_SUFFIX: ""
  SEMVER_MAJOR_MINOR_VERSION: "1.12"
  SEMVER_MAJOR_VERSION: "1"
  SEMVER_VERSION: 1.12.14
  VERSION: 1.12.14-1
contents:
  repositories:
    - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
  keyring:
    - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
  packages:
    - base-files
    - bash
    - ca-certificates
    - ca-certificates-bundle
    - coreutils
    - eclipse-temurin-21-jre
    - eclipse-temurin-21-jre-oci-config
    - openmetadata-server-1.12
    - tzdata
accounts:
  run-as: openmetadata
  users:
    - name: openmetadata
      uid: 1000
      gid: 1000
  groups:
    - name: openmetadata
      gid: 1000
      members:
        - openmetadata
os-release:
  name: Docker Hardened Images (Debian)
  id: debian
  version-id: "13"
  version-codename: trixie
  pretty-name: Docker Hardened Images/Debian GNU/Linux 13 (trixie)
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
work-dir: /opt/openmetadata
paths:
  - type: directory
    path: /opt/openmetadata/logs
    uid: 1000
    gid: 1000
    mode: "0770"
  - type: symlink
    path: /openmetadata-start.sh
    uid: 0
    gid: 0
    source: /usr/bin/openmetadata-start
annotations:
  org.opencontainers.image.description: A minimal OpenMetadata image
  org.opencontainers.image.licenses: Apache-2.0
entrypoint:
  - /bin/bash
cmd:
  - /openmetadata-start.sh
ports:
  - 8585/tcp
  - 8586/tcp
