# syntax=dhi.io/build:2-debian13

name: OpenMetadata 1.13.x (dev)
image: dhi.io/openmetadata
variant: dev
tags:
  - 1-dev
  - 1.13-dev
  - 1.13.3-dev
  - 1-debian-dev
  - 1-debian13-dev
  - 1.13-debian-dev
  - 1.13-debian13-dev
  - 1.13.3-debian-dev
  - 1.13.3-debian13-dev
platforms:
  - linux/amd64
  - linux/arm64
dates:
  release: "2026-06-08"
vars:
  JAVA_FIPS_SUFFIX: ""
  SEMVER_MAJOR_MINOR_VERSION: "1.13"
  SEMVER_MAJOR_VERSION: "1"
  SEMVER_VERSION: 1.13.3
  VERSION: 1.13.3-1
contents:
  repositories:
    - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
  keyring:
    - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
  packages:
    - '!gawk'
    - '!libelogind0'
    - '!original-awk'
    - apt
    - base-files
    - bash
    - ca-certificates
    - ca-certificates-bundle
    - coreutils
    - diffutils
    - dpkg
    - eclipse-temurin-21-jre
    - eclipse-temurin-21-jre-oci-config
    - findutils
    - grep
    - libc-bin
    - mawk
    - openmetadata-server-1.13
    - perl-base
    - sed
    - tzdata
    - util-linux
  builds:
    - name: locale
      contents:
        packages:
          - bash
          - locales
          - coreutils
          - gzip
      pipeline:
        - name: install locales
          runs: |
            set -eux -o pipefail

            ln -s /etc/locale.alias /usr/share/locale/locale.alias

            echo "en_US.UTF-8 UTF-8" >> /etc/locale.gen
            locale-gen en_US.UTF-8
      outputs:
        - source: /usr/share/locale
          target: /usr/share/locale
          uid: 0
          gid: 0
        - source: /usr/lib/locale
          target: /usr/lib/locale
          uid: 0
          gid: 0
accounts:
  root: true
  run-as: root
  users:
    - name: openmetadata
      uid: 1000
      gid: 1000
    - name: _apt
      uid: 42
      gid: 65532
  groups:
    - name: openmetadata
      gid: 1000
      members:
        - openmetadata
os-release:
  name: Docker Hardened Images (Debian)
  id: debian
  version-id: "13"
  version-codename: trixie
  pretty-name: Docker Hardened Images/Debian GNU/Linux 13 (trixie)
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
work-dir: /opt/openmetadata
environment:
  DEBIAN_FRONTEND: noninteractive
  LANG: en_US.UTF-8
  LANGUAGE: en_US:en
  LC_ALL: en_US.UTF-8
paths:
  - type: directory
    path: /opt/openmetadata/logs
    uid: 1000
    gid: 1000
    mode: "0770"
  - type: symlink
    path: /openmetadata-start.sh
    uid: 0
    gid: 0
    source: /usr/bin/openmetadata-start
annotations:
  org.opencontainers.image.description: A minimal OpenMetadata image
  org.opencontainers.image.licenses: Apache-2.0
entrypoint:
  - /bin/bash
cmd:
  - /openmetadata-start.sh
ports:
  - 8585/tcp
  - 8586/tcp
