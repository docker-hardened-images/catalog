# syntax=dhi.io/build:2-alpine3.24

name: OpenMetadata 1.12.x
image: dhi.io/openmetadata
variant: runtime
tags:
  - 1.12-alpine
  - 1.12.13-alpine
  - 1.12-alpine3.24
  - 1.12.13-alpine3.24
platforms:
  - linux/amd64
  - linux/arm64
dates:
  release: "2026-02-22"
vars:
  FLAVORED_SUFFIX: ""
  JAVA_FIPS_SUFFIX: ""
  SEMVER_MAJOR_MINOR_VERSION: "1.12"
  SEMVER_MAJOR_VERSION: "1"
  SEMVER_VERSION: 1.12.13
  SUFFIX: ""
  VERSION: 1.12.13-r4
contents:
  repositories:
    - https://dhi.io/apk/alpine/v3.24/main
    - https://dl-cdn.alpinelinux.org/alpine/v3.24/main
    - https://dl-cdn.alpinelinux.org/alpine/v3.24/community
  keyring:
    - https://dhi.io/keyring/dhi-apk@docker-0F81AD7700D99184.rsa.pub
  packages:
    - alpine-baselayout-data
    - bash
    - ca-certificates-bundle
    - coreutils
    - eclipse-temurin-21-jre
    - eclipse-temurin-21-jre-oci-config
    - openmetadata-server-1.12
    - tzdata
accounts:
  run-as: openmetadata
  users:
    - name: openmetadata
      uid: 1000
      gid: 1000
  groups:
    - name: openmetadata
      gid: 1000
      members:
        - openmetadata
os-release:
  name: Docker Hardened Images (Alpine)
  id: alpine
  version-id: "3.24"
  pretty-name: Docker Hardened Images/Alpine Linux v3.24
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
work-dir: /opt/openmetadata
paths:
  - type: directory
    path: /opt/openmetadata/logs
    uid: 1000
    gid: 1000
    mode: "0770"
  - type: symlink
    path: /openmetadata-start.sh
    uid: 0
    gid: 0
    source: /usr/bin/openmetadata-start
annotations:
  org.opencontainers.image.description: A minimal OpenMetadata image
  org.opencontainers.image.licenses: Apache-2.0
entrypoint:
  - /bin/bash
cmd:
  - /openmetadata-start.sh
ports:
  - 8585/tcp
  - 8586/tcp
