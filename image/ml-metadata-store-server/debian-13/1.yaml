# syntax=dhi.io/build:2-debian13

name: ML Metadata Store Server 1.x
image: dhi.io/ml-metadata-store-server
variant: runtime
tags:
  - "1"
  - "1.21"
  - 1.21.0
  - 1-debian
  - 1-debian13
  - 1.21-debian
  - 1.21-debian13
  - 1.21.0-debian
  - 1.21.0-debian13
platforms:
  - linux/amd64
  - linux/arm64
dates:
  release: "2021-05-21"
vars:
  SEMVER_MAJOR_MINOR_VERSION: "1.21"
  SEMVER_MAJOR_VERSION: "1"
  SEMVER_VERSION: 1.21.0
  VERSION: 1.21.0-4
contents:
  repositories:
    - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
  keyring:
    - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
  packages:
    - base-files
    - ca-certificates-bundle
    - dash
    - libc6
    - libgcc-s1
    - libmariadb3
    - libpq5
    - libsqlite3-0
    - libssl3t64
    - libstdc++6
    - ml-metadata-store-server-1=1.21.0-4
    - tzdata
    - zlib1g
accounts:
  run-as: nonroot
  users:
    - name: nonroot
      uid: 65532
      gid: 65532
  groups:
    - name: nonroot
      gid: 65532
      members:
        - nonroot
os-release:
  name: Docker Hardened Images (Debian)
  id: debian
  version-id: "13"
  version-codename: trixie
  pretty-name: Docker Hardened Images/Debian GNU/Linux 13 (trixie)
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
environment:
  GRPC_PORT: "8080"
annotations:
  org.opencontainers.image.description: A minimal ML Metadata store server image
  org.opencontainers.image.licenses: Apache-2.0
entrypoint:
  - /bin/sh
  - -c
  - exec /usr/bin/metadata_store_server --grpc_port="$GRPC_PORT" --metadata_store_server_config_file="$METADATA_STORE_SERVER_CONFIG_FILE" "$@"
  - metadata_store_server
ports:
  - 8080/tcp
