# syntax=dhi.io/build:2-debian13

name: ML Metadata Store Server 1.x (dev)
image: dhi.io/ml-metadata-store-server
variant: dev
tags:
  - 1-dev
  - 1.21-dev
  - 1.21.0-dev
  - 1-debian-dev
  - 1-debian13-dev
  - 1.21-debian-dev
  - 1.21-debian13-dev
  - 1.21.0-debian-dev
  - 1.21.0-debian13-dev
platforms:
  - linux/amd64
  - linux/arm64
dates:
  release: "2021-05-21"
vars:
  SEMVER_MAJOR_MINOR_VERSION: "1.21"
  SEMVER_MAJOR_VERSION: "1"
  SEMVER_VERSION: 1.21.0
  VERSION: 1.21.0-3
contents:
  repositories:
    - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
  keyring:
    - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
  packages:
    - '!gawk'
    - '!libelogind0'
    - '!original-awk'
    - apt
    - base-files
    - bash
    - ca-certificates
    - ca-certificates-bundle
    - coreutils
    - dash
    - diffutils
    - dpkg
    - findutils
    - grep
    - libc-bin
    - libc6
    - libgcc-s1
    - libmariadb3
    - libpq5
    - libsqlite3-0
    - libssl3t64
    - libstdc++6
    - mawk
    - ml-metadata-store-server-1=1.21.0-3
    - perl-base
    - sed
    - tzdata
    - util-linux
    - zlib1g
accounts:
  root: true
  run-as: root
  users:
    - name: nonroot
      uid: 65532
      gid: 65532
    - name: _apt
      uid: 42
      gid: 65532
  groups:
    - name: nonroot
      gid: 65532
      members:
        - nonroot
os-release:
  name: Docker Hardened Images (Debian)
  id: debian
  version-id: "13"
  version-codename: trixie
  pretty-name: Docker Hardened Images/Debian GNU/Linux 13 (trixie)
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
environment:
  DEBIAN_FRONTEND: noninteractive
  GRPC_PORT: "8080"
annotations:
  org.opencontainers.image.description: A minimal ML Metadata store server image
  org.opencontainers.image.licenses: Apache-2.0
entrypoint:
  - /bin/sh
  - -c
  - exec /usr/bin/metadata_store_server --grpc_port="$GRPC_PORT" --metadata_store_server_config_file="$METADATA_STORE_SERVER_CONFIG_FILE" "$@"
  - metadata_store_server
ports:
  - 8080/tcp
