# syntax=dhi.io/build:2-alpine3.24

name: ML Metadata Store Server 1.x
image: dhi.io/ml-metadata-store-server
variant: runtime
tags:
  - 1-alpine
  - 1.21-alpine
  - 1-alpine3.24
  - 1.21.0-alpine
  - 1.21-alpine3.24
  - 1.21.0-alpine3.24
platforms:
  - linux/amd64
  - linux/arm64
dates:
  release: "2021-05-21"
vars:
  SEMVER_MAJOR_MINOR_VERSION: "1.21"
  SEMVER_MAJOR_VERSION: "1"
  SEMVER_VERSION: 1.21.0
  VERSION: 1.21.0-r2
contents:
  repositories:
    - https://dhi.io/apk/alpine/v3.24/main
    - https://dl-cdn.alpinelinux.org/alpine/v3.24/main
    - https://dl-cdn.alpinelinux.org/alpine/v3.24/community
  keyring:
    - https://dhi.io/keyring/dhi-apk@docker-0F81AD7700D99184.rsa.pub
  packages:
    - alpine-baselayout-data
    - busybox
    - ca-certificates-bundle
    - ml-metadata-store-server-1=1.21.0-r2
    - tzdata
accounts:
  run-as: nonroot
  users:
    - name: nonroot
      uid: 65532
      gid: 65532
  groups:
    - name: nonroot
      gid: 65532
      members:
        - nonroot
os-release:
  name: Docker Hardened Images (Alpine)
  id: alpine
  version-id: "3.24"
  pretty-name: Docker Hardened Images/Alpine Linux v3.24
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
environment:
  GRPC_PORT: "8080"
paths:
  - type: symlink
    path: /bin/metadata_store_server
    uid: 0
    gid: 0
    source: /usr/bin/metadata_store_server
annotations:
  org.opencontainers.image.description: A minimal ML Metadata store server image
  org.opencontainers.image.licenses: Apache-2.0
entrypoint:
  - /bin/sh
  - -c
  - exec /usr/bin/metadata_store_server --grpc_port="$GRPC_PORT" --metadata_store_server_config_file="$METADATA_STORE_SERVER_CONFIG_FILE" "$@"
  - metadata_store_server
ports:
  - 8080/tcp
