# syntax=dhi.io/build:2-debian13

name: ClickHouse Server 26.7.x-stable
image: dhi.io/clickhouse-server
variant: runtime
tags:
  - "26.7"
  - 26.7.6
  - 26.7-debian
  - 26.7-debian13
  - 26.7.6-debian
  - 26.7.6-debian13
platforms:
  - linux/amd64
  - linux/arm64
vars:
  DEBIAN_EPOCH_MAJOR_MINOR_VERSION: "26.7"
  DEBIAN_EPOCH_MAJOR_VERSION: "26"
  DEBIAN_EPOCH_VERSION: 26.7.6
  PACKAGE_NAME: clickhouse-server-26.7
  RELEASE_TYPE: stable
  SEMVER_VERSION: 26.7.6.57
  VERSION: 26.7.6.57-0
contents:
  repositories:
    - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
  keyring:
    - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
  packages:
    - '!libelogind0'
    - '!mawk'
    - '!original-awk'
    - '!tar'
    - base-files
    - bash
    - ca-certificates-bundle
    - clickhouse-server-26.7=26.7.6.57-0
    - coreutils
    - findutils
    - locales
    - tzdata
  builds:
    - name: clickhouse-server
      contents:
        repositories:
          - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
        keyring:
          - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
        packages:
          - base-files
          - clickhouse-server-26.7=26.7.6.57-0
          - bash
          - coreutils
          - findutils
          - locales
          - tzdata
      pipeline:
        - name: configure clickhouse runtime directories
          runs: |
            set -eux -o pipefail

            locale-gen en_US.UTF-8

            mkdir -p \
              "/var/lib/clickhouse" \
              "/var/log/clickhouse-server" \
              "/etc/clickhouse-client" \
              "/etc/clickhouse-server/config.d" \
              "/etc/clickhouse-server/users.d" \
              "/docker-entrypoint-initdb.d"

            chmod ugo+Xrw -R /etc/clickhouse-server /etc/clickhouse-client
            chown 1001:1001 /var/lib/clickhouse
            chown root:1001 /var/log/clickhouse-server
            chmod ugo+Xrw -R /var/lib/clickhouse /var/log/clickhouse-server /etc/clickhouse-server /etc/clickhouse-client
      outputs:
        - source: /
          target: /
          uid: 0
          gid: 0
          diff: true
    - name: locale
      contents:
        packages:
          - bash
          - locales
          - coreutils
          - gzip
      pipeline:
        - name: install locales
          runs: |
            set -eux -o pipefail

            ln -s /etc/locale.alias /usr/share/locale/locale.alias

            echo "en_US.UTF-8 UTF-8" >> /etc/locale.gen
            locale-gen en_US.UTF-8
      outputs:
        - source: /usr/share/locale
          target: /usr/share/locale
          uid: 0
          gid: 0
        - source: /usr/lib/locale
          target: /usr/lib/locale
          uid: 0
          gid: 0
accounts:
  root: true
  run-as: clickhouse
  users:
    - name: clickhouse
      uid: 1001
      gid: 1001
  groups:
    - name: clickhouse
      gid: 1001
      members:
        - clickhouse
os-release:
  name: Docker Hardened Images (Debian)
  id: debian
  version-id: "13"
  version-codename: trixie
  pretty-name: Docker Hardened Images/Debian GNU/Linux 13 (trixie)
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
environment:
  CLICKHOUSE_CONFIG: /etc/clickhouse-server/config.xml
  CLICKHOUSE_VERSION: 26.7.6.57
  LANG: en_US.UTF-8
  LANGUAGE: en_US:en
  LC_ALL: en_US.UTF-8
  TZ: UTC
paths:
  - type: file
    path: /etc/clickhouse-server/config.d/docker_related_config.xml
    uid: 1001
    gid: 1001
    mode: "0644"
    source: image/clickhouse-server/config/docker_related_config.xml
  - type: file
    path: /entrypoint.sh
    uid: 1001
    gid: 1001
    mode: "0755"
    source: image/clickhouse-server/bin/entrypoint.sh
annotations:
  org.opencontainers.image.description: A minimal ClickHouse Server image
  org.opencontainers.image.licenses: Apache-2.0
entrypoint:
  - /entrypoint.sh
ports:
  - 9000/tcp
  - 8123/tcp
  - 9009/tcp
