    - tiff
    - tzdata
    - util-linux
  files:
    - url: https://raw.githubusercontent.com/docker-library/wordpress/ecc7cdbdf47591bfa14954933fa2ab4fcce46428/latest/php8.5/fpm-alpine/docker-entrypoint.sh
      checksum: sha256:4e925e60ccc324f3f5df8da39d518c88a6d2e1b228113811493c5a975ae9137b
      path: /usr/local/bin/docker-entrypoint.sh
      uid: 0
      gid: 0
      mode: "0755"
    - url: https://raw.githubusercontent.com/docker-library/wordpress/ecc7cdbdf47591bfa14954933fa2ab4fcce46428/latest/php8.3/fpm-alpine/wp-config-docker.php
      checksum: sha256:1513f88b7252f29790f0acad201b1ef0d442f0d80e88c33e4a6d473615084162
      path: /usr/src/wordpress/wp-config-docker.php
      uid: 0
      gid: 0
      mode: "0644"
  builds:
    - name: php-fpm config
      contents:
        packages:
          - busybox
          - php-8.5-fpm=8.5.11-r0
      pipeline:
        - name: install php-fpm config
          runs: |
            set -eux -o pipefail

            cp '/etc/php-8.5/php-fpm.conf.default' '/etc/php-8.5/php-fpm.conf'
            cp '/etc/php-8.5/php-fpm.d/www.conf.default' '/etc/php-8.5/php-fpm.d/www.conf'

            sed -ri 's/^(listen = 127.0.0.1:9000)/;\1/' '/etc/php-8.5/php-fpm.d/www.conf'
      outputs:
        - source: /etc/php-8.5/php-fpm.conf
          target: /etc/php-8.5/php-fpm.conf
          uid: 0
          gid: 0
        - source: /etc/php-8.5/php-fpm.d/www.conf
          target: /etc/php-8.5/php-fpm.d/www.conf
          uid: 0
          gid: 0
    - name: build php extensions
      shell: bash
      contents:
        packages:
          - autoconf
          - automake
          - bash
          - build-base
          - fontconfig-dev
          - freetype-dev
          - lcms2-dev
          - libavif-dev
          - libheif-dev
          - libjpeg-turbo-dev
          - libpng-dev
          - libssl3
          - libtool
          - libwebp-dev
          - libxml2-dev
          - libzip-dev
          - make
          - oniguruma-dev
          - pcre2-dev
          - pkgconf
          - tiff-dev
          - zlib-dev
          - php-8.5-dev=8.5.11-r0
        files:
          - url: git+https://github.com/ImageMagick/ImageMagick.git#7.1.2-32
            checksum: ad98b244c995d2e3051757fa3b7855f45b550d24
            path: ${source.dir}/imagemagick
            spdx:
              name: imagemagick
              version: 7.1.2-32
              packages:
                - name: imagemagick
                  purl: pkg:github/ImageMagick/ImageMagick@7.1.2-32
                  license: ImageMagick
            uid: 0
            gid: 0
          - url: git+https://github.com/Imagick/imagick.git#3.8.1
            checksum: 70087bab33eab913e99ac77d64d04d1a2fd0b7b0
            path: ${source.dir}/imagick
            spdx:
              name: imagick
              version: 3.8.1
              packages:
                - name: imagick
                  purl: pkg:composer/imagick/imagick@3.8.1
                  license: PHP-3.01
            uid: 0
            gid: 0
      pipeline:
        - name: build imagemagick
          work-dir: ${source.dir}/imagemagick
          runs: |
            set -eux -o pipefail

            ./configure \
              --prefix=/opt/imagemagick \
              --disable-static \
              --enable-shared \
              --with-modules \
              --with-quantum-depth=16 \
              --with-heic=yes \
              --with-webp=yes \
              --without-magick-plus-plus \
              --without-perl \
              --disable-docs \
              --disable-opencl

            make -j$(nproc)
            make install

            mkdir -p ${target.dir}/opt
            cp -a /opt/imagemagick ${target.dir}/opt/

            find ${target.dir}/opt/imagemagick -type f -name "*.so*" -exec strip --strip-unneeded {} \; || true
        - name: build bundled extensions
          runs: |
            set -eux -o pipefail

            build_ext() {
              local ext=$1
              shift
              cd "/usr/include/php/src/ext/$ext"
              phpize
              ./configure "$@"
              make -j$(nproc)
              make install
            }

            build_ext gd --with-avif --with-freetype --with-jpeg --with-webp
            build_ext mysqli
            build_ext pdo_mysql
            build_ext zip
            build_ext exif
            build_ext bcmath
        - name: build imagick
          work-dir: ${source.dir}/imagick
          runs: |
            set -eux -o pipefail

            export PKG_CONFIG_PATH=/opt/imagemagick/lib/pkgconfig
            export CFLAGS="-I/opt/imagemagick/include/ImageMagick-7"
            export LDFLAGS="-L/opt/imagemagick/lib"

            sed -i "s/@PACKAGE_VERSION@/3.8.1/g" php_imagick.h
            phpize
            ./configure --with-imagick=/opt/imagemagick
            make -j$(nproc)
            make install
      outputs:
        - source: /usr/lib/php/extensions
          target: /usr/lib/php/extensions
          uid: 0
          gid: 0
        - source: ${target.dir}/opt/imagemagick
          target: /opt/imagemagick
          uid: 0
          gid: 0
        - source: /opt/docker/sbom/imagemagick
          target: /opt/docker/sbom/imagemagick
          uid: 0
          gid: 0
        - source: /opt/docker/sbom/imagick
          target: /opt/docker/sbom/imagick
          uid: 0
          gid: 0
    - name: wordpress install
      contents:
        packages:
          - bash
          - ca-certificates-bundle
          - busybox
        files:
          - url: git+https://github.com/WordPress/WordPress.git#7.1.3
            checksum: fc9832bef919c2a08541248db23af90d14ffb082
            path: ${source.dir}/wordpress
            spdx:
              name: wordpress
              version: 7.1.3
              packages:
                - name: wordpress
                  purl: pkg:github/WordPress/WordPress@7.1.3
                  license: GPL-2.0-or-later
            uid: 0
            gid: 0
      pipeline:
        - name: install wordpress
          runs: |
            set -eux -o pipefail

            mkdir -p ${target.dir}/usr/src/wordpress
            cp -a ${source.dir}/wordpress/. ${target.dir}/usr/src/wordpress/
            rm -rf ${target.dir}/usr/src/wordpress/.git

            chown -R 65532:65532 ${target.dir}/usr/src/wordpress
      outputs:
        - source: ${target.dir}/usr/src/wordpress
          target: /usr/src/wordpress
          uid: 65532
          gid: 65532
        - source: /opt/docker/sbom/wordpress
          target: /opt/docker/sbom/wordpress
          uid: 0
          gid: 0
accounts:
