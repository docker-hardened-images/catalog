# syntax=dhi.io/build:2-alpine3.23

name: WordPress 7.1.3 (php8.5-fpm)
image: dhi.io/wordpress
variant: runtime
flavor: php8.5-fpm
tags:
  - 7.1.3-alpine3.23-php8.5-fpm
platforms:
  - linux/amd64
  - linux/arm64
dates:
  release: "2026-08-19"
vars:
  COMMIT_SHA: fc9832bef919c2a08541248db23af90d14ffb082
  IMAGEMAGICK_COMMIT_SHA: ad98b244c995d2e3051757fa3b7855f45b550d24
  IMAGEMAGICK_PREFIX: /opt/imagemagick
  IMAGEMAGICK_VERSION: 7.1.2-32
  IMAGICK_COMMIT_SHA: 70087bab33eab913e99ac77d64d04d1a2fd0b7b0
  IMAGICK_VERSION: 3.8.1
  PHP_INI_DIR: /etc/php-8.5
