# syntax=dhi.io/build:2-debian13

name: ACK EKS Controller 1.x
image: dhi.io/aws-controllers-k8s-eks-controller
variant: runtime
tags:
  - "1"
  - "1.27"
  - 1.27.0
  - 1-debian
  - 1-debian13
  - 1.27-debian
  - 1.27-debian13
  - 1.27.0-debian
  - 1.27.0-debian13
platforms:
  - linux/amd64
  - linux/arm64
dates:
  release: "2023-02-03"
vars:
  FLAVORED_SUFFIX: ""
  SEMVER_MAJOR_MINOR_VERSION: "1.27"
  SEMVER_MAJOR_VERSION: "1"
  SEMVER_VERSION: 1.27.0
  SUFFIX: ""
  VERSION: 1.27.0-0
contents:
  repositories:
    - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
  keyring:
    - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
  packages:
    - aws-controllers-k8s-eks-controller-1=1.27.0-0
    - base-files
    - ca-certificates-bundle
    - tzdata
accounts:
  run-as: nonroot
  users:
    - name: nonroot
      uid: 65532
      gid: 65532
  groups:
    - name: nonroot
      gid: 65532
      members:
        - nonroot
os-release:
  name: Docker Hardened Images (Debian)
  id: debian
  version-id: "13"
  version-codename: trixie
  pretty-name: Docker Hardened Images/Debian GNU/Linux 13 (trixie)
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
work-dir: /
paths:
  - type: symlink
    path: /usr/bin/controller
    uid: 0
    gid: 0
    source: /usr/bin/ack-eks-controller
  - type: symlink
    path: /home/nonroot/.aws
    uid: 0
    gid: 0
    source: /.aws
annotations:
  org.opencontainers.image.description: A minimal ACK EKS Controller image
  org.opencontainers.image.licenses: Apache-2.0
entrypoint:
  - /bin/controller
ports:
  - 8080/tcp
  - 8081/tcp
