# syntax=dhi.io/build:2-alpine3.24

name: ACK EKS Controller 1.x
image: dhi.io/aws-controllers-k8s-eks-controller
variant: runtime
tags:
  - 1-alpine
  - 1.27-alpine
  - 1-alpine3.24
  - 1.27.0-alpine
  - 1.27-alpine3.24
  - 1.27.0-alpine3.24
platforms:
  - linux/amd64
  - linux/arm64
dates:
  release: "2023-02-03"
vars:
