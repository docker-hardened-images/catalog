    - aws-controllers-k8s-eks-controller-1=1.27.0-r0
    - ca-certificates-bundle
    - tzdata
accounts:
  run-as: nonroot
  users:
    - name: nonroot
      uid: 65532
      gid: 65532
  groups:
    - name: nonroot
      gid: 65532
      members:
        - nonroot
os-release:
