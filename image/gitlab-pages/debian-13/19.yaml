# syntax=dhi.io/build:2-debian13

name: GitLab Pages 19.x
image: dhi.io/gitlab-pages
variant: runtime
tags:
  - "19"
  - "19.2"
  - 19.2.1
  - 19-debian
  - 19-debian13
  - 19.2-debian
  - 19.2-debian13
  - 19.2.1-debian
  - 19.2.1-debian13
platforms:
  - linux/amd64
  - linux/arm64
dates:
  release: "2026-05-21"
vars:
  GP_FIPS: ""
  SEMVER_MAJOR_MINOR_VERSION: "19.2"
  SEMVER_MAJOR_VERSION: "19"
  SEMVER_VERSION: 19.2.1
  VERSION: 19.2.1-0
contents:
  repositories:
    - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
  keyring:
    - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
  packages:
    - '!libelogind0'
    - '!mawk'
    - '!original-awk'
    - base-files
    - ca-certificates-bundle
    - gitlab-pages=19.2.1-0
    - tzdata
accounts:
  run-as: nonroot
  users:
    - name: nonroot
      uid: 65532
      gid: 65532
  groups:
    - name: nonroot
      gid: 65532
      members:
        - nonroot
os-release:
  name: Docker Hardened Images (Debian)
  id: debian
  version-id: "13"
  version-codename: trixie
  pretty-name: Docker Hardened Images/Debian GNU/Linux 13 (trixie)
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
paths:
  - type: directory
    path: /etc/gitlab-pages
    uid: 65532
    gid: 65532
    mode: "0770"
  - type: directory
    path: /srv/gitlab-pages
    uid: 65532
    gid: 65532
    mode: "0770"
  - type: directory
    path: /var/log/gitlab
    uid: 65532
    gid: 65532
    mode: "0770"
  - type: directory
    path: /srv
    uid: 0
    gid: 0
    mode: "0755"
  - type: directory
    path: /var/log
    uid: 0
    gid: 0
    mode: "0755"
annotations:
  org.opencontainers.image.description: A minimal GitLab Pages image
  org.opencontainers.image.licenses: MIT
entrypoint:
  - /usr/bin/gitlab-pages
ports:
  - 8090/tcp
