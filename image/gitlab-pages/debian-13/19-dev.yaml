# syntax=dhi.io/build:2-debian13

name: GitLab Pages 19.x (dev)
image: dhi.io/gitlab-pages
variant: dev
tags:
  - 19-dev
  - 19.2-dev
  - 19.2.1-dev
  - 19-debian-dev
  - 19-debian13-dev
  - 19.2-debian-dev
  - 19.2-debian13-dev
  - 19.2.1-debian-dev
  - 19.2.1-debian13-dev
platforms:
  - linux/amd64
  - linux/arm64
dates:
  release: "2026-05-21"
vars:
  GP_FIPS: ""
  SEMVER_MAJOR_MINOR_VERSION: "19.2"
  SEMVER_MAJOR_VERSION: "19"
  SEMVER_VERSION: 19.2.1
  VERSION: 19.2.1-0
contents:
  repositories:
    - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
  keyring:
    - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
  packages:
    - '!gawk'
    - '!libelogind0'
    - '!mawk'
    - '!original-awk'
    - apt
    - base-files
    - bash
    - ca-certificates
    - ca-certificates-bundle
    - coreutils
    - diffutils
    - dpkg
    - findutils
    - gitlab-pages=19.2.1-0
    - grep
    - libc-bin
    - mawk
    - perl-base
    - sed
    - tzdata
    - util-linux
  builds:
    - name: locale
      contents:
        packages:
          - bash
          - locales
          - coreutils
          - gzip
      pipeline:
        - name: install locales
          runs: |
            set -eux -o pipefail

            ln -s /etc/locale.alias /usr/share/locale/locale.alias

            echo "en_US.UTF-8 UTF-8" >> /etc/locale.gen
            locale-gen en_US.UTF-8
      outputs:
        - source: /usr/share/locale
          target: /usr/share/locale
          uid: 0
          gid: 0
        - source: /usr/lib/locale
          target: /usr/lib/locale
          uid: 0
          gid: 0
accounts:
  root: true
  run-as: root
  users:
    - name: nonroot
      uid: 65532
      gid: 65532
    - name: _apt
      uid: 42
      gid: 65532
  groups:
    - name: nonroot
      gid: 65532
      members:
        - nonroot
os-release:
  name: Docker Hardened Images (Debian)
  id: debian
  version-id: "13"
  version-codename: trixie
  pretty-name: Docker Hardened Images/Debian GNU/Linux 13 (trixie)
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
environment:
  DEBIAN_FRONTEND: noninteractive
  LANG: en_US.UTF-8
  LANGUAGE: en_US:en
  LC_ALL: en_US.UTF-8
paths:
  - type: directory
    path: /etc/gitlab-pages
    uid: 65532
    gid: 65532
    mode: "0770"
  - type: directory
    path: /srv/gitlab-pages
    uid: 65532
    gid: 65532
    mode: "0770"
  - type: directory
    path: /var/log/gitlab
    uid: 65532
    gid: 65532
    mode: "0770"
  - type: directory
    path: /srv
    uid: 0
    gid: 0
    mode: "0755"
  - type: directory
    path: /var/log
    uid: 0
    gid: 0
    mode: "0755"
annotations:
  org.opencontainers.image.description: A minimal GitLab Pages image
  org.opencontainers.image.licenses: MIT
entrypoint:
  - /usr/bin/gitlab-pages
ports:
  - 8090/tcp
