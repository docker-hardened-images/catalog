    - liblz4-1
    - libpam0g
    - libpq5
    - libreadline8t64
    - libselinux1
    - libssl3t64
    - libxml2
    - libxslt1.1
    - libzstd1
    - locales
    - tzdata
    - zlib1g
  builds:
    - name: patroni
      uses: dhi.io/python:3.13.15-debian13-dev@sha256:81978c0c24990a7a88a061625697df4078afa92d9967ec42fae7d2e9a078371f
      work-dir: ${source.dir}/patroni
      caches:
