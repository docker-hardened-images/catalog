      contents:
        packages:
          - bash
          - build-essential
          - coreutils
          - curl
          - dpkg
          - findutils
          - libpq-dev
        files:
          - url: git+https://github.com/patroni/patroni.git#v4.1.5
            checksum: 235fdb3990513c7852da8dc51e9cb92b6d0e4907
            path: ${source.dir}/patroni
            spdx:
              name: patroni
              version: 4.1.5
              packages:
                - name: patroni
                  purl: pkg:pypi/patroni@4.1.5
                  license: MIT
            uid: 0
            gid: 0
      pipeline:
        - name: install patroni
          privileged: true
          runs: |
            set -eux -o pipefail

            pip install \
              --prefix ${target.dir}/opt/patroni \
              ".[etcd3,kubernetes]" \
              "psycopg[c]>=3.0"
      outputs:
        - source: ${target.dir}/opt/patroni
          target: /opt/patroni
          uid: 0
          gid: 0
        - source: /opt/docker/sbom/patroni
          target: /opt/docker/sbom/patroni
          uid: 0
          gid: 0
  artifacts:
    - name: dhi.io/python:3.13.15-debian13@sha256:e512071462b6f002ac3d6f4d31bdf7d20fe6ffce3b5ce4f684b5e50d14dba217
