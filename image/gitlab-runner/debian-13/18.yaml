# syntax=dhi.io/build:2-debian13

name: GitLab Runner 18.x
image: dhi.io/gitlab-runner
variant: runtime
tags:
  - "18"
  - "18.11"
  - 18.11.4
  - 18-debian
  - 18-debian13
  - 18.11-debian
  - 18.11-debian13
  - 18.11.4-debian
  - 18.11.4-debian13
platforms:
  - linux/amd64
  - linux/arm64
dates:
  release: "2026-04-16"
  end-of-life: "2026-07-16"
vars:
  FLAVORED_SUFFIX: ""
  GIT_LFS_REFERENCE: dhi/pkg-git-lfs:3.8.0-debian13@sha256:44d34e5aebb67ea17098d59a81f938d863d87ae404fcdcedc988267e96013f7b
  PACKAGE_NAME: gitlab-runner-18
  SEMVER_MAJOR_MINOR_VERSION: "18.11"
  SEMVER_MAJOR_VERSION: "18"
  SEMVER_VERSION: 18.11.4
  SUFFIX: ""
  VERSION: 18.11.4-3
contents:
  repositories:
    - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
  keyring:
    - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
  packages:
    - base-files
    - bash
    - ca-certificates-bundle
    - coreutils
    - findutils
    - git
    - gitlab-runner-18=18.11.4-3
    - grep
    - hostname
    - openssh-client
    - tzdata
  artifacts:
    - name: dhi.io/pkg-git-lfs:3.8.0-debian13@sha256:44d34e5aebb67ea17098d59a81f938d863d87ae404fcdcedc988267e96013f7b
      includes:
        - opt/**
        - usr/**
      uid: 0
      gid: 0
accounts:
  root: true
  run-as: nonroot
  users:
    - name: nonroot
      uid: 65532
      gid: 65532
  groups:
    - name: nonroot
      gid: 65532
      members:
        - nonroot
os-release:
  name: Docker Hardened Images (Debian)
  id: debian
  version-id: "13"
  version-codename: trixie
  pretty-name: Docker Hardened Images/Debian GNU/Linux 13 (trixie)
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
stop-signal: SIGQUIT
paths:
  - type: directory
    path: /usr/local/bin
    uid: 0
    gid: 0
  - type: symlink
    path: /usr/local/bin/gitlab-runner
    uid: 0
    gid: 0
    source: /usr/bin/gitlab-runner
  - type: symlink
    path: /usr/local/bin/docker-machine
    uid: 0
    gid: 0
    source: /usr/bin/docker-machine
  - type: directory
    path: /etc/gitlab-runner
    uid: 65532
    gid: 65532
    mode: "0770"
  - type: directory
    path: /home/gitlab-runner
    uid: 65532
    gid: 65532
    mode: "0770"
annotations:
  org.opencontainers.image.description: A minimal GitLab Runner image
  org.opencontainers.image.licenses: MIT
entrypoint:
  - gitlab-runner
cmd:
  - run
  - --working-directory=/home/gitlab-runner
  - --config=/etc/gitlab-runner/config.toml
