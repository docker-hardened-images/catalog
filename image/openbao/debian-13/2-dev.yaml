# syntax=dhi.io/build:2-debian13

name: OpenBao 2.x (dev)
image: dhi.io/openbao
variant: dev
tags:
  - 2-dev
  - 2.6-dev
  - 2.6.2-dev
  - 2-debian-dev
  - 2-debian13-dev
  - 2.6-debian-dev
  - 2.6-debian13-dev
  - 2.6.2-debian-dev
  - 2.6.2-debian13-dev
platforms:
  - linux/amd64
  - linux/arm64
dates:
  release: "2026-02-05"
vars:
  FLAVORED_SUFFIX: -dev
  SEMVER_MAJOR_MINOR_VERSION: "2.6"
  SEMVER_MAJOR_VERSION: "2"
  SEMVER_VERSION: 2.6.2
  SUFFIX: -dev
  VERSION: 2.6.2-5
contents:
  repositories:
    - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
  keyring:
    - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
  packages:
    - '!gawk'
    - '!libelogind0'
    - '!original-awk'
    - apt
    - bao-dev=2.6.2-5
    - base-files
    - bash
    - ca-certificates
    - ca-certificates-bundle
    - coreutils
    - diffutils
    - dpkg
    - findutils
    - grep
    - libc-bin
    - mawk
    - perl-base
    - sed
    - tzdata
    - util-linux
accounts:
  root: true
  run-as: root
  users:
    - name: openbao
      uid: 1000
      gid: 1000
    - name: _apt
      uid: 42
      gid: 65532
  groups:
    - name: openbao
      gid: 1000
      members:
        - openbao
os-release:
  name: Docker Hardened Images (Debian)
  id: debian
  version-id: "13"
  version-codename: trixie
  pretty-name: Docker Hardened Images/Debian GNU/Linux 13 (trixie)
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
environment:
  DEBIAN_FRONTEND: noninteractive
paths:
  - type: directory
    path: /openbao
    uid: 1000
    gid: 1000
    mode: "0755"
  - type: directory
    path: /openbao/logs
    uid: 1000
    gid: 1000
    mode: "0755"
  - type: directory
    path: /openbao/file
    uid: 1000
    gid: 1000
    mode: "0755"
  - type: directory
    path: /openbao/config
    uid: 1000
    gid: 1000
    mode: "0755"
  - type: directory
    path: /usr/local/bin
    uid: 0
    gid: 0
  - type: symlink
    path: /usr/local/bin/bao
    uid: 0
    gid: 0
    source: /usr/bin/bao
annotations:
  org.opencontainers.image.description: A minimal OpenBao image
  org.opencontainers.image.licenses: MPL-2.0
entrypoint:
  - bao
cmd:
  - server
  - -config=/openbao/config
ports:
  - 8200/tcp
