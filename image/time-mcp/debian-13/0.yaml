# syntax=dhi.io/build:2-debian13

name: Time MCP Server 2026.x
image: dhi.io/time-mcp
variant: runtime
tags:
  - "2026"
  - "2026.7"
  - latest
  - 2026.7.10
  - 2026-debian
  - 2026-debian13
  - 2026.7-debian
  - 2026.7-debian13
  - 2026.7.10-debian
  - 2026.7.10-debian13
platforms:
  - linux/amd64
  - linux/arm64
vars:
  SEMVER_MAJOR_MINOR_VERSION: "2026.7"
  SEMVER_MAJOR_VERSION: "2026"
  SEMVER_VERSION: 2026.7.10
  VERSION: 2026.7.10-2
contents:
  repositories:
    - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
  keyring:
    - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
  packages:
    - base-files
    - ca-certificates-bundle
    - python-3.14
    - time-mcp=2026.7.10-2
    - tzdata
accounts:
  run-as: nonroot
  users:
    - name: nonroot
      uid: 65532
      gid: 65532
  groups:
    - name: nonroot
      gid: 65532
      members:
        - nonroot
os-release:
  name: Docker Hardened Images (Debian)
  id: debian
  version-id: "13"
  version-codename: trixie
  pretty-name: Docker Hardened Images/Debian GNU/Linux 13 (trixie)
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
environment:
  LOCAL_TIMEZONE: UTC
  PATH: /app/.venv/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
paths:
  - type: directory
    path: /app
    uid: 0
    gid: 0
  - type: symlink
    path: /app/.venv
    uid: 0
    gid: 0
    source: /usr/lib/time-mcp
annotations:
  org.opencontainers.image.description: Time MCP Server
  org.opencontainers.image.licenses: MIT
labels:
  io.modelcontextprotocol.server.name: io.github.modelcontextprotocol/server-time
entrypoint:
  - mcp-server-time
