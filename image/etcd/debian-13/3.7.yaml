# syntax=dhi.io/build:2-debian13

name: etcd 3.7.x
image: dhi.io/etcd
variant: runtime
tags:
  - "3"
  - "3.7"
  - 3.7.1
  - 3-debian
  - 3-debian13
  - 3.7-debian
  - 3.7-debian13
  - 3.7.1-debian
  - 3.7.1-debian13
platforms:
  - linux/amd64
  - linux/arm64
dates:
  release: "2026-07-08"
vars:
  FLAVORED_SUFFIX: ""
  SEMVER_MAJOR_MINOR_VERSION: "3.7"
  SEMVER_MAJOR_VERSION: "3"
  SEMVER_VERSION: 3.7.1
  SUFFIX: ""
  VERSION: 3.7.1-8
contents:
  repositories:
    - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
  keyring:
    - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
  packages:
    - base-files
    - ca-certificates-bundle
    - etcd-3.7=3.7.1-8
    - tzdata
accounts:
  run-as: nonroot
  users:
    - name: etcd
      uid: 100
      gid: 101
    - name: nonroot
      uid: 65532
      gid: 65532
  groups:
    - name: etcd
      gid: 101
      members:
        - etcd
        - nonroot
    - name: nonroot
      gid: 65532
      members:
        - nonroot
os-release:
  name: Docker Hardened Images (Debian)
  id: debian
  version-id: "13"
  version-codename: trixie
  pretty-name: Docker Hardened Images/Debian GNU/Linux 13 (trixie)
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
work-dir: /var/lib/etcd
environment:
  SSL_CERT_FILE: /etc/ssl/certs/ca-certificates.crt
paths:
  - type: directory
    path: /var/lib/etcd
    uid: 100
    gid: 101
    mode: "1770"
  - type: directory
    path: /usr/local/bin
    uid: 0
    gid: 0
    mode: "0755"
  - type: symlink
    path: /usr/local/bin/etcd
    uid: 0
    gid: 0
    source: /usr/bin/etcd
  - type: symlink
    path: /usr/local/bin/etcdctl
    uid: 0
    gid: 0
    source: /usr/bin/etcdctl
  - type: symlink
    path: /usr/local/bin/etcdutl
    uid: 0
    gid: 0
    source: /usr/bin/etcdutl
annotations:
  org.opencontainers.image.description: A minimal and secure etcd image
  org.opencontainers.image.licenses: Apache-2.0
cmd:
  - /usr/local/bin/etcd
ports:
  - 2379/tcp
  - 2380/tcp
