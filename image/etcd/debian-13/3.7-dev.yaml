# syntax=dhi.io/build:2-debian13

name: etcd 3.7.x (dev)
image: dhi.io/etcd
variant: dev
tags:
  - 3-dev
  - 3.7-dev
  - 3.7.1-dev
  - 3-debian-dev
  - 3-debian13-dev
  - 3.7-debian-dev
  - 3.7-debian13-dev
  - 3.7.1-debian-dev
  - 3.7.1-debian13-dev
platforms:
  - linux/amd64
  - linux/arm64
dates:
  release: "2026-07-08"
vars:
  FLAVORED_SUFFIX: -dev
  SEMVER_MAJOR_MINOR_VERSION: "3.7"
  SEMVER_MAJOR_VERSION: "3"
  SEMVER_VERSION: 3.7.1
  SUFFIX: -dev
  VERSION: 3.7.1-8
contents:
  repositories:
    - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
  keyring:
    - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
  packages:
    - '!gawk'
    - '!libelogind0'
    - '!original-awk'
    - apt
    - base-files
    - bash
    - ca-certificates
    - ca-certificates-bundle
    - coreutils
    - diffutils
    - dpkg
    - etcd-3.7-dev=3.7.1-8
    - findutils
    - grep
    - libc-bin
    - mawk
    - perl-base
    - sed
    - tzdata
    - util-linux
accounts:
  root: true
  run-as: root
  users:
    - name: etcd
      uid: 100
      gid: 101
    - name: nonroot
      uid: 65532
      gid: 65532
    - name: _apt
      uid: 42
      gid: 65532
  groups:
    - name: etcd
      gid: 101
      members:
        - etcd
        - nonroot
    - name: nonroot
      gid: 65532
      members:
        - nonroot
os-release:
  name: Docker Hardened Images (Debian)
  id: debian
  version-id: "13"
  version-codename: trixie
  pretty-name: Docker Hardened Images/Debian GNU/Linux 13 (trixie)
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
work-dir: /var/lib/etcd
environment:
  DEBIAN_FRONTEND: noninteractive
  SSL_CERT_FILE: /etc/ssl/certs/ca-certificates.crt
paths:
  - type: directory
    path: /var/lib/etcd
    uid: 100
    gid: 101
    mode: "1770"
  - type: directory
    path: /usr/local/bin
    uid: 0
    gid: 0
    mode: "0755"
  - type: symlink
    path: /usr/local/bin/etcd
    uid: 0
    gid: 0
    source: /usr/bin/etcd
  - type: symlink
    path: /usr/local/bin/etcdctl
    uid: 0
    gid: 0
    source: /usr/bin/etcdctl
  - type: symlink
    path: /usr/local/bin/etcdutl
    uid: 0
    gid: 0
    source: /usr/bin/etcdutl
annotations:
  org.opencontainers.image.description: A minimal and secure etcd image
  org.opencontainers.image.licenses: Apache-2.0
cmd:
  - /usr/local/bin/etcd
ports:
  - 2379/tcp
  - 2380/tcp
