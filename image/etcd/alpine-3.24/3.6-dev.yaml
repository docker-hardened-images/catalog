# syntax=dhi.io/build:2-alpine3.24

name: etcd 3.6.x (dev)
image: dhi.io/etcd
variant: dev
tags:
  - 3.6-alpine-dev
  - 3.6.14-alpine-dev
  - 3.6-alpine3.24-dev
  - 3.6.14-alpine3.24-dev
platforms:
  - linux/amd64
  - linux/arm64
dates:
  release: "2025-05-15"
vars:
  FLAVORED_SUFFIX: -dev
  SEMVER_MAJOR_MINOR_VERSION: "3.6"
  SEMVER_MAJOR_VERSION: "3"
  SEMVER_VERSION: 3.6.14
  SUFFIX: -dev
  VERSION: 3.6.14-r14
contents:
  repositories:
    - https://dhi.io/apk/alpine/v3.24/main
    - https://dl-cdn.alpinelinux.org/alpine/v3.24/main
    - https://dl-cdn.alpinelinux.org/alpine/v3.24/community
  keyring:
    - https://dhi.io/keyring/dhi-apk@docker-0F81AD7700D99184.rsa.pub
  packages:
    - alpine-baselayout-data
    - apk-tools
    - bash
    - busybox
    - ca-certificates
    - ca-certificates-bundle
    - coreutils
    - etcd-3.6-dev=3.6.14-r14
    - findutils
    - tzdata
accounts:
  root: true
  run-as: root
  users:
    - name: etcd
      uid: 100
      gid: 101
    - name: nonroot
      uid: 65532
      gid: 65532
  groups:
    - name: etcd
      gid: 101
      members:
        - etcd
        - nonroot
    - name: nonroot
      gid: 65532
      members:
        - nonroot
os-release:
  name: Docker Hardened Images (Alpine)
  id: alpine
  version-id: "3.24"
  pretty-name: Docker Hardened Images/Alpine Linux v3.24
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
work-dir: /var/lib/etcd
environment:
  SSL_CERT_FILE: /etc/ssl/certs/ca-certificates.crt
paths:
  - type: directory
    path: /var/lib/etcd
    uid: 100
    gid: 101
    mode: "1770"
  - type: directory
    path: /usr/local/bin
    uid: 0
    gid: 0
    mode: "0755"
  - type: symlink
    path: /usr/local/bin/etcd
    uid: 0
    gid: 0
    source: /usr/bin/etcd
  - type: symlink
    path: /usr/local/bin/etcdctl
    uid: 0
    gid: 0
    source: /usr/bin/etcdctl
  - type: symlink
    path: /usr/local/bin/etcdutl
    uid: 0
    gid: 0
    source: /usr/bin/etcdutl
annotations:
  org.opencontainers.image.description: A minimal and secure etcd image
  org.opencontainers.image.licenses: Apache-2.0
cmd:
  - /usr/local/bin/etcd
ports:
  - 2379/tcp
  - 2380/tcp
