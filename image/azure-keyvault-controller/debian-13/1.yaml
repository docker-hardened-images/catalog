# syntax=dhi.io/build:2-debian13

name: Azure Key Vault Controller 1.x
image: dhi.io/azure-keyvault-controller
variant: runtime
tags:
  - "1"
  - "1.8"
  - 1.8.4
  - 1-debian
  - 1-debian13
  - 1.8-debian
  - 1.8-debian13
  - 1.8.4-debian
  - 1.8.4-debian13
platforms:
  - linux/amd64
  - linux/arm64
dates:
  release: "2026-04-15"
vars:
  FLAVORED_SUFFIX: ""
  SEMVER_MAJOR_MINOR_VERSION: "1.8"
  SEMVER_MAJOR_VERSION: "1"
  SEMVER_VERSION: 1.8.4
  SUFFIX: ""
  VERSION: 1.8.4-2
contents:
  repositories:
    - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
  keyring:
    - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
  packages:
    - azure-keyvault-controller=1.8.4-2
    - base-files
    - ca-certificates-bundle
    - tzdata
accounts:
  run-as: "65532"
  users:
    - name: nonroot
      uid: 65532
      gid: 65532
  groups:
    - name: nonroot
      gid: 65532
      members:
        - nonroot
os-release:
  name: Docker Hardened Images (Debian)
  id: debian
  version-id: "13"
  version-codename: trixie
  pretty-name: Docker Hardened Images/Debian GNU/Linux 13 (trixie)
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
paths:
  - type: directory
    path: /usr/local/bin
    uid: 0
    gid: 0
  - type: symlink
    path: /usr/local/bin/azure-keyvault-controller
    uid: 0
    gid: 0
    source: /usr/bin/azure-keyvault-controller
annotations:
  org.opencontainers.image.description: A minimal Azure Key Vault Controller image
  org.opencontainers.image.licenses: Apache-2.0
entrypoint:
  - /usr/local/bin/azure-keyvault-controller
