# syntax=dhi.io/build:2-debian13

name: AWS Mountpoint S3 CSI Driver 2.x
image: dhi.io/aws-mountpoint-s3-csi-driver
variant: runtime
tags:
  - "2"
  - "2.9"
  - 2.9.2
  - 2-debian
  - 2-debian13
  - 2.9-debian
  - 2.9-debian13
  - 2.9.2-debian
  - 2.9.2-debian13
platforms:
  - linux/amd64
  - linux/arm64
dates:
  release: "2025-07-29"
vars:
  CONTROLLER_PACKAGE_NAME: aws-s3-csi-controller-2.9
  DRIVER_PACKAGE_NAME: aws-s3-csi-driver-2.9
  FLAVORED_SUFFIX: ""
  MOUNTER_PACKAGE_NAME: aws-s3-csi-mounter-2.9
  MOUNTPOINT_VERSION: 1.22.0
  MP_ARCH: '#{ target.arch == "amd64" ? "x86_64" : "arm64" }'
  SEMVER_MAJOR_MINOR_VERSION: "2.9"
  SEMVER_MAJOR_VERSION: "2"
  SEMVER_VERSION: 2.9.2
  SUFFIX: ""
  VERSION: 2.9.2-0
contents:
  repositories:
    - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
  keyring:
    - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
  packages:
    - aws-s3-csi-controller-2.9=2.9.2-0
    - aws-s3-csi-driver-2.9=2.9.2-0
    - aws-s3-csi-mounter-2.9=2.9.2-0
    - base-files
    - ca-certificates-bundle
    - libc6
    - libfuse2t64
    - mount
    - tzdata
    - zlib1g
  builds:
    - name: mountpoint-s3
      contents:
        packages:
          - bash
          - coreutils
          - gpg
          - gpg-agent
          - grep
          - gzip
          - tar
        files:
          - url: https://s3.amazonaws.com/mountpoint-s3-release/public_keys/KEYS
            path: ${source.dir}/KEYS
            uid: 0
            gid: 0
          - url: https://s3.amazonaws.com/mountpoint-s3-release/1.22.0/${MP_ARCH}/mount-s3-1.22.0-${MP_ARCH}.tar.gz
            path: ${source.dir}/mount-s3.tar.gz
            spdx:
              name: mountpoint-s3
              version: 1.22.0
              packages:
                - name: mountpoint-s3
                  purl: pkg:github/awslabs/mountpoint-s3@1.22.0
                  license: Apache-2.0
            uid: 0
            gid: 0
          - url: https://s3.amazonaws.com/mountpoint-s3-release/1.22.0/${MP_ARCH}/mount-s3-1.22.0-${MP_ARCH}.tar.gz.asc
            path: ${source.dir}/mount-s3.tar.gz.asc
            uid: 0
            gid: 0
      pipeline:
        - name: verify mount-s3 signature
          uses: gpg/verify@v1
          with:
            file: ${source.dir}/mount-s3.tar.gz
            keys: ${source.dir}/KEYS
            signature: ${source.dir}/mount-s3.tar.gz.asc
        - name: extract mount-s3
          runs: |
            set -eux -o pipefail

            tar -xzf "${source.dir}/mount-s3.tar.gz" -C "${source.dir}"
            mkdir -p "${target.dir}/usr/bin"
            cp "${source.dir}/bin/mount-s3" "${target.dir}/usr/bin/mount-s3"
      outputs:
        - source: ${target.dir}/usr/bin/mount-s3
          target: /usr/bin/mount-s3
          uid: 0
          gid: 0
          mode: "0755"
        - source: /opt/docker/sbom/mountpoint-s3
          target: /opt/docker/sbom/mountpoint-s3
          uid: 0
          gid: 0
accounts:
  run-as: nonroot
  users:
    - name: nonroot
      uid: 65532
      gid: 65532
  groups:
    - name: nonroot
      gid: 65532
      members:
        - nonroot
os-release:
  name: Docker Hardened Images (Debian)
  id: debian
  version-id: "13"
  version-codename: trixie
  pretty-name: Docker Hardened Images/Debian GNU/Linux 13 (trixie)
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
environment:
  MOUNTPOINT_BIN_DIR: /usr/bin
  MOUNTPOINT_VERSION: 1.22.0
annotations:
  org.opencontainers.image.description: A minimal AWS Mountpoint for Amazon S3 CSI Driver image
  org.opencontainers.image.licenses: Apache-2.0
entrypoint:
  - /usr/bin/aws-s3-csi-driver
