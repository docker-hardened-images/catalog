# syntax=dhi.io/build:2-debian13

name: Flink Kubernetes Operator 1.x
image: dhi.io/flink-kubernetes-operator
variant: runtime
tags:
  - "1"
  - "1.16"
  - 1.16.1
  - 1-debian
  - 1-debian13
  - 1.16-debian
  - 1.16-debian13
  - 1.16.1-debian
  - 1.16.1-debian13
platforms:
  - linux/amd64
  - linux/arm64
dates:
  release: "2026-05-07"
vars:
  FLINK_HOME: /opt/flink
  JAVA_VARIANT: jre
  JDK_MAJOR_VERSION: "17"
  OPERATOR_HOME: /flink-kubernetes-operator
  SEMVER_MAJOR_MINOR_VERSION: "1.16"
  SEMVER_MAJOR_VERSION: "1"
  SEMVER_VERSION: 1.16.1
  VERSION: 1.16.1-3
contents:
  repositories:
    - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
  keyring:
    - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
  packages:
    - '!libelogind0'
    - '!mawk'
    - '!original-awk'
    - base-files
    - bash
    - ca-certificates
    - ca-certificates-bundle
    - coreutils
    - eclipse-temurin-17-jre
    - eclipse-temurin-17-jre-oci-config
    - flink-kubernetes-operator=1.16.1-3
    - libjemalloc-dev
    - libstdc++6
    - tzdata
  builds:
    - name: locale
      contents:
        packages:
          - bash
          - locales
          - coreutils
          - gzip
      pipeline:
        - name: install locales
          runs: |
            set -eux -o pipefail

            ln -s /etc/locale.alias /usr/share/locale/locale.alias

            echo "en_US.UTF-8 UTF-8" >> /etc/locale.gen
            locale-gen en_US.UTF-8
      outputs:
        - source: /usr/share/locale
          target: /usr/share/locale
          uid: 0
          gid: 0
        - source: /usr/lib/locale
          target: /usr/lib/locale
          uid: 0
          gid: 0
accounts:
  run-as: flink
  users:
    - name: flink
      uid: 9999
      gid: 9999
  groups:
    - name: flink
      gid: 9999
os-release:
  name: Docker Hardened Images (Debian)
  id: debian
  version-id: "13"
  version-codename: trixie
  pretty-name: Docker Hardened Images/Debian GNU/Linux 13 (trixie)
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
work-dir: /flink-kubernetes-operator
environment:
  DISABLE_JEMALLOC: "false"
  FLINK_HOME: /opt/flink
  FLINK_PLUGINS_DIR: /opt/flink/plugins
  JAVA_HOME: /usr/lib/jvm/temurin-17
  KUBERNETES_STANDALONE_JAR: flink-kubernetes-standalone-1.16.1.jar
  LANG: en_US.UTF-8
  LANGUAGE: en_US:en
  LC_ALL: en_US.UTF-8
  OPERATOR_JAR: flink-kubernetes-operator-1.16.1-shaded.jar
  OPERATOR_LIB: /opt/flink/operator-lib
  OPERATOR_LOG: /opt/flink/log
  OPERATOR_VERSION: 1.16.1
  WEBHOOK_JAR: flink-kubernetes-webhook-1.16.1-shaded.jar
paths:
  - type: file
    path: /docker-entrypoint.sh
    uid: 0
    gid: 0
    mode: "0755"
    source: image/flink-kubernetes-operator/bin/docker-entrypoint.sh
  - type: directory
    path: /flink-kubernetes-operator
    uid: 9999
    gid: 9999
    mode: "0755"
    recursive: true
  - type: directory
    path: /opt/flink
    uid: 9999
    gid: 9999
    mode: "0755"
    recursive: true
annotations:
  org.opencontainers.image.description: A minimal Apache Flink Kubernetes Operator image
  org.opencontainers.image.licenses: Apache-2.0
entrypoint:
  - /docker-entrypoint.sh
cmd:
  - help
