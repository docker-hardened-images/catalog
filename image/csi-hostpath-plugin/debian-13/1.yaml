  - "1.18"
  - 1.18.0
  - 1-debian
  - 1-debian13
  - 1.18-debian
  - 1.18-debian13
  - 1.18.0-debian
  - 1.18.0-debian13
platforms:
  - linux/amd64
  - linux/arm64
dates:
