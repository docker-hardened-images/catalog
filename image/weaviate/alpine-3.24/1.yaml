# syntax=dhi.io/build:2-alpine3.24

name: Weaviate 1.x
image: dhi.io/weaviate
variant: runtime
tags:
  - 1-alpine
  - 1.41-alpine
  - 1-alpine3.24
  - 1.41.0-alpine
  - 1.41-alpine3.24
  - 1.41.0-alpine3.24
platforms:
  - linux/amd64
  - linux/arm64
dates:
  release: "2021-01-14"
vars:
  FLAVORED_SUFFIX: ""
  SEMVER_MAJOR_MINOR_VERSION: "1.41"
  SEMVER_MAJOR_VERSION: "1"
  SEMVER_VERSION: 1.41.0
  SUFFIX: ""
  VERSION: 1.41.0-r0
contents:
  repositories:
    - https://dhi.io/apk/alpine/v3.24/main
    - https://dl-cdn.alpinelinux.org/alpine/v3.24/main
    - https://dl-cdn.alpinelinux.org/alpine/v3.24/community
  keyring:
    - https://dhi.io/keyring/dhi-apk@docker-0F81AD7700D99184.rsa.pub
  packages:
    - alpine-baselayout-data
    - bc
    - ca-certificates-bundle
    - tzdata
    - weaviate=1.41.0-r0
accounts:
  run-as: nonroot
  users:
    - name: nonroot
      uid: 65532
      gid: 65532
  groups:
    - name: nonroot
      gid: 65532
      members:
        - nonroot
os-release:
  name: Docker Hardened Images (Alpine)
  id: alpine
  version-id: "3.24"
  pretty-name: Docker Hardened Images/Alpine Linux v3.24
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
environment:
  PERSISTENCE_DATA_PATH: /var/lib/weaviate
paths:
  - type: directory
    path: /bin
    uid: 0
    gid: 0
    mode: "0755"
  - type: symlink
    path: /bin/weaviate
    uid: 0
    gid: 0
    source: /usr/bin/weaviate
  - type: directory
    path: /var/lib/weaviate
    uid: 65532
    gid: 65532
    mode: "0755"
annotations:
  org.opencontainers.image.description: A minimal Weaviate image
  org.opencontainers.image.licenses: BSD-3-Clause AND LicenseRef-Weaviate
entrypoint:
  - /bin/weaviate
cmd:
  - --host
  - 0.0.0.0
  - --port
  - "8080"
  - --scheme
  - http
ports:
  - 8080/tcp
  - 50051/tcp
