# syntax=dhi.io/build:2-debian13

name: Linkerd Proxy 2.x (dev)
image: dhi.io/linkerd-proxy
variant: dev
tags:
  - 2-dev
  - 2.370-dev
  - 2.370.0-dev
  - 2-debian-dev
  - 2-debian13-dev
  - 2.370-debian-dev
  - edge-26.10.1-dev
  - 2.370-debian13-dev
  - 2.370.0-debian-dev
  - 2.370.0-debian13-dev
  - edge-26.10.1-debian-dev
  - edge-26.10.1-debian13-dev
platforms:
  - linux/amd64
  - linux/arm64
dates:
  release: "2019-09-14"
vars:
  AWAIT_PINNED_VERSION: 0.3.3
  AWAIT_VERSION: 0.3.3-1
  COREUTILS_DEBIAN_VERSION: 9.7-3
  COREUTILS_UPSTREAM_VERSION: "9.7"
  COREUTILS_VERSION: 9.7-3+dhi4
  EDGE_VERSION: 26.10.1
  FLAVORED_SUFFIX: -dev
  IDENTITY_VERSION: 26.10.1-1
  NETWORK_VALIDATOR_PINNED_VERSION: 0.1.9
  NETWORK_VALIDATOR_VERSION: 0.1.9-1
  PINNED_VERSION: 2.370.0
  PROXY_INIT_PINNED_VERSION: 2.4.10
  PROXY_INIT_VERSION: 2.4.10-0
  SEMVER_MAJOR_MINOR_VERSION: "2.370"
  SEMVER_MAJOR_VERSION: "2"
  SEMVER_VERSION: 2.370.0
  SUFFIX: -dev
  VERSION: 2.370.0-0
contents:
  repositories:
    - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
  keyring:
    - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
  packages:
    - '!gawk'
    - '!libelogind0'
    - '!original-awk'
    - apt
    - base-files
    - bash
    - ca-certificates
    - ca-certificates-bundle
    - coreutils
    - diffutils
    - dpkg
    - findutils
    - grep
    - iptables
    - libc-bin
    - libc6
    - libgcc-s1
    - linkerd-await-0-dev=0.3.3-1
    - linkerd-network-validator-0-dev=0.1.9-1
    - linkerd2-proxy-2-dev=2.370.0-0
    - linkerd2-proxy-identity-dev=26.10.1-1
    - linkerd2-proxy-init-2-dev=2.4.10-0
    - mawk
    - nftables
    - perl-base
    - sed
    - tzdata
    - util-linux
  builds:
    - name: setcap proxy-init
      contents:
        packages:
          - bash
          - coreutils
          - iptables
          - libcap2-bin
          - linkerd2-proxy-init-2-dev=2.4.10-0
      pipeline:
        - name: setcap
          runs: |
            set -eux -o pipefail

            for bin in /usr/sbin/xtables-legacy-multi /usr/sbin/xtables-nft-multi /usr/bin/linkerd2-proxy-init; do
              setcap 'cap_net_raw,cap_net_admin+eip' "$bin"
              setcap -v 'cap_net_raw,cap_net_admin+eip' "$bin"
            done
        - name: verify coreutils version
          runs: |
            set -eux -o pipefail

            case "$(sleep --version)" in
              "sleep (GNU coreutils) 9.7"*) ;;
              *) exit 1 ;;
            esac
        - uses: spdx@v1
          with:
            license: GPL-3.0-or-later
            name: coreutils
            purl: pkg:deb/debian/coreutils@9.7-3?os_name=debian&os_version=13
            version: 9.7-3+dhi4
      outputs:
        - source: /usr/sbin/xtables-legacy-multi
          target: /usr/sbin/xtables-legacy-multi
          uid: 0
          gid: 0
        - source: /usr/sbin/xtables-nft-multi
          target: /usr/sbin/xtables-nft-multi
          uid: 0
          gid: 0
        - source: /usr/bin/linkerd2-proxy-init
          target: /usr/bin/linkerd2-proxy-init
          uid: 0
          gid: 0
        - source: /usr/bin/sleep
          target: /usr/bin/sleep
          uid: 0
          gid: 0
        - source: /opt/docker/sbom/coreutils
          target: /opt/docker/sbom/coreutils
          uid: 0
          gid: 0
accounts:
  root: true
  run-as: root
  users:
    - name: nonroot
      uid: 65532
      gid: 65532
    - name: _apt
      uid: 42
      gid: 65532
  groups:
    - name: nonroot
      gid: 65532
      members:
        - nonroot
os-release:
  name: Docker Hardened Images (Debian)
  id: debian
  version-id: "13"
  version-codename: trixie
  pretty-name: Docker Hardened Images/Debian GNU/Linux 13 (trixie)
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
work-dir: /home/nonroot
environment:
  DEBIAN_FRONTEND: noninteractive
  LINKERD_CONTAINER_VERSION_OVERRIDE: edge-26.10.1
  LINKERD2_PROXY_LOG: warn,linkerd=info
  LINKERD2_PROXY_LOG_FORMAT: plain
paths:
  - type: directory
    path: /usr/lib/linkerd
    uid: 0
    gid: 0
  - type: symlink
    path: /usr/lib/linkerd/linkerd2-proxy
    uid: 0
    gid: 0
    source: /usr/bin/linkerd2-proxy
  - type: symlink
    path: /usr/lib/linkerd/linkerd2-proxy-identity
    uid: 0
    gid: 0
    source: /usr/bin/linkerd2-proxy-identity
  - type: symlink
    path: /usr/lib/linkerd/linkerd2-proxy-init
    uid: 0
    gid: 0
    source: /usr/bin/linkerd2-proxy-init
  - type: symlink
    path: /usr/lib/linkerd/linkerd-await
    uid: 0
    gid: 0
    source: /usr/bin/linkerd-await
  - type: symlink
    path: /usr/lib/linkerd/linkerd2-network-validator
    uid: 0
    gid: 0
    source: /usr/bin/linkerd-network-validator
  - type: directory
    path: /home/nonroot
    uid: 65532
    gid: 65532
    mode: "0770"
annotations:
  org.opencontainers.image.description: A minimal Linkerd data plane proxy image
  org.opencontainers.image.licenses: Apache-2.0
entrypoint:
  - /usr/lib/linkerd/linkerd2-proxy-identity
