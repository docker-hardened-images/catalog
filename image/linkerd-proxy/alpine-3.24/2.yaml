# syntax=dhi.io/build:2-alpine3.24

name: Linkerd Proxy 2.x
image: dhi.io/linkerd-proxy
variant: runtime
tags:
  - 2-alpine
  - 2-alpine3.24
  - 2.370-alpine
  - 2.370.0-alpine
  - 2.370-alpine3.24
  - 2.370.0-alpine3.24
  - edge-26.10.1-alpine
  - edge-26.10.1-alpine3.24
platforms:
  - linux/amd64
  - linux/arm64
dates:
  release: "2019-09-14"
vars:
  AWAIT_PINNED_VERSION: 0.3.3
  AWAIT_VERSION: 0.3.3-r1
  EDGE_VERSION: 26.10.1
  FLAVORED_SUFFIX: ""
  IDENTITY_VERSION: 26.10.1-r1
  NETWORK_VALIDATOR_PINNED_VERSION: 0.1.9
  NETWORK_VALIDATOR_VERSION: 0.1.9-r1
  PINNED_VERSION: 2.370.0
  PROXY_INIT_PINNED_VERSION: 2.4.10
  PROXY_INIT_VERSION: 2.4.10-r0
  SEMVER_MAJOR_MINOR_VERSION: "2.370"
  SEMVER_MAJOR_VERSION: "2"
  SEMVER_VERSION: 2.370.0
  SUFFIX: ""
  VERSION: 2.370.0-r0
contents:
  repositories:
    - https://dhi.io/apk/alpine/v3.24/main
    - https://dl-cdn.alpinelinux.org/alpine/v3.24/main
    - https://dl-cdn.alpinelinux.org/alpine/v3.24/community
  keyring:
    - https://dhi.io/keyring/dhi-apk@docker-0F81AD7700D99184.rsa.pub
  packages:
    - ca-certificates-bundle
    - iptables
    - iptables-legacy
    - libgcc
    - linkerd-await-0=0.3.3-r1
    - linkerd-network-validator-0=0.1.9-r1
    - linkerd2-proxy-2=2.370.0-r0
    - linkerd2-proxy-identity=26.10.1-r1
    - linkerd2-proxy-init-2=2.4.10-r0
    - tzdata
  builds:
    - name: setcap proxy-init
      contents:
        packages:
          - busybox
          - iptables
          - iptables-legacy
          - libcap-getcap
          - libcap-setcap
          - linkerd2-proxy-init-2=2.4.10-r0
      pipeline:
        - name: setcap
          runs: |
            set -eux -o pipefail

            for bin in /usr/sbin/xtables-legacy-multi /usr/sbin/xtables-nft-multi /usr/bin/linkerd2-proxy-init; do
              setcap 'cap_net_raw,cap_net_admin+eip' "$bin"
              setcap -v 'cap_net_raw,cap_net_admin+eip' "$bin"
            done
      outputs:
        - source: /usr/sbin/xtables-legacy-multi
          target: /usr/sbin/xtables-legacy-multi
          uid: 0
          gid: 0
        - source: /usr/sbin/xtables-nft-multi
          target: /usr/sbin/xtables-nft-multi
          uid: 0
          gid: 0
        - source: /usr/bin/linkerd2-proxy-init
          target: /usr/bin/linkerd2-proxy-init
          uid: 0
          gid: 0
accounts:
  run-as: nonroot
  users:
    - name: nonroot
      uid: 65532
      gid: 65532
  groups:
    - name: nonroot
      gid: 65532
      members:
        - nonroot
os-release:
  name: Docker Hardened Images (Alpine)
  id: alpine
  version-id: "3.24"
  pretty-name: Docker Hardened Images/Alpine Linux v3.24
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
work-dir: /home/nonroot
environment:
  LINKERD_CONTAINER_VERSION_OVERRIDE: edge-26.10.1
  LINKERD2_PROXY_LOG: warn,linkerd=info
  LINKERD2_PROXY_LOG_FORMAT: plain
paths:
  - type: directory
    path: /usr/lib/linkerd
    uid: 0
    gid: 0
  - type: symlink
    path: /usr/lib/linkerd/linkerd2-proxy
    uid: 0
    gid: 0
    source: /usr/bin/linkerd2-proxy
  - type: symlink
    path: /usr/lib/linkerd/linkerd2-proxy-identity
    uid: 0
    gid: 0
    source: /usr/bin/linkerd2-proxy-identity
  - type: symlink
    path: /usr/lib/linkerd/linkerd2-proxy-init
    uid: 0
    gid: 0
    source: /usr/bin/linkerd2-proxy-init
  - type: symlink
    path: /usr/lib/linkerd/linkerd-await
    uid: 0
    gid: 0
    source: /usr/bin/linkerd-await
  - type: symlink
    path: /usr/lib/linkerd/linkerd2-network-validator
    uid: 0
    gid: 0
    source: /usr/bin/linkerd-network-validator
  - type: directory
    path: /home/nonroot
    uid: 65532
    gid: 65532
    mode: "0770"
annotations:
  org.opencontainers.image.description: A minimal Linkerd data plane proxy image
  org.opencontainers.image.licenses: Apache-2.0
entrypoint:
  - /usr/lib/linkerd/linkerd2-proxy-identity
