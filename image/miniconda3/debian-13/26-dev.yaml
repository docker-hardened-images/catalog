# syntax=dhi.io/build:2-debian13

name: Miniconda3 26.x (dev)
image: dhi.io/miniconda3
variant: dev
tags:
  - 26-dev
  - 26.7-dev
  - 26.7.1-dev
  - 26-debian-dev
  - 26-debian13-dev
  - 26.7-debian-dev
  - 26.7-debian13-dev
  - 26.7.1-debian-dev
  - 26.7.1-debian13-dev
platforms:
  - linux/amd64
  - linux/arm64
dates:
  release: "2026-03-06"
vars:
  SEMVER_MAJOR_MINOR_VERSION: "26.7"
  SEMVER_MAJOR_VERSION: "26"
  SEMVER_VERSION: 26.7.1
  VERSION: 26.7.1-1-0
contents:
  repositories:
    - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
  keyring:
    - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
  packages:
    - '!gawk'
    - '!libelogind0'
    - '!original-awk'
    - apt
    - base-files
    - bash
    - ca-certificates
    - ca-certificates-bundle
    - coreutils
    - curl
    - diffutils
    - dpkg
    - findutils
    - git
    - grep
    - libc-bin
    - libc6
    - libexpat1
    - libglib2.0-0t64
    - libsm6
    - libxext6
    - libxrender1
    - mawk
    - mercurial
    - miniconda3-26=26.7.1-1-0
    - openssh-client
    - perl
    - perl-base
    - procps
    - sed
    - subversion
    - tzdata
    - util-linux
    - wget
    - zlib1g
  builds:
    - name: locale
      contents:
        packages:
          - bash
          - locales
          - coreutils
          - gzip
      pipeline:
        - name: install locales
          runs: |
            set -eux -o pipefail

            ln -s /etc/locale.alias /usr/share/locale/locale.alias

            echo "en_US.UTF-8 UTF-8" >> /etc/locale.gen
            locale-gen en_US.UTF-8
      outputs:
        - source: /usr/share/locale
          target: /usr/share/locale
          uid: 0
          gid: 0
        - source: /usr/lib/locale
          target: /usr/lib/locale
          uid: 0
          gid: 0
accounts:
  root: true
  run-as: root
  users:
    - name: nonroot
      uid: 65532
      gid: 65532
    - name: _apt
      uid: 42
      gid: 65532
  groups:
    - name: nonroot
      gid: 65532
      members:
        - nonroot
os-release:
  name: Docker Hardened Images (Debian)
  id: debian
  version-id: "13"
  version-codename: trixie
  pretty-name: Docker Hardened Images/Debian GNU/Linux 13 (trixie)
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
environment:
  DEBIAN_FRONTEND: noninteractive
  LANG: en_US.UTF-8
  LANGUAGE: en_US:en
  LC_ALL: en_US.UTF-8
  PATH: /opt/conda/bin:/usr/local/bin:/usr/local/sbin:/usr/sbin:/usr/bin:/sbin:/bin
paths:
  - type: file
    path: /usr/local/bin/docker-entrypoint.sh
    content: |
      #!/bin/bash
      exec "$@"
    uid: 0
    gid: 0
    mode: "0755"
annotations:
  org.opencontainers.image.description: A minimal Miniconda3 image
  org.opencontainers.image.licenses: BSD-3-Clause
entrypoint:
  - /usr/local/bin/docker-entrypoint.sh
cmd:
  - /bin/bash
