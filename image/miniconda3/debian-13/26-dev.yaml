# syntax=dhi.io/build:2-debian13

name: Miniconda3 26.x (dev)
image: dhi.io/miniconda3
variant: dev
tags:
  - 26-dev
  - 26.7-dev
  - 26.7.1-dev
  - 26-debian-dev
  - 26-debian13-dev
  - 26.7-debian-dev
  - 26.7-debian13-dev
  - 26.7.1-debian-dev
  - 26.7.1-debian13-dev
platforms:
  - linux/amd64
  - linux/arm64
dates:
  release: "2026-03-06"
vars:
  COMMIT_SHA: b01c4bb53b85ca70b18ccf047816fcce7e4a90a4
  INSTALLER_SHA256_AMD64: e8b25b92b262499141c5bd57a98d3c008024185fa951494b9cd9b6d94e72338b
  INSTALLER_SHA256_ARM64: e31545afd7462d3c9c33b154c7a101c5acb5e01b69380b6994651aead6942893
  INSTALLER_URL_AMD64: https://repo.anaconda.com/miniconda/Miniconda3-py314_26.7.1-1-Linux-x86_64.sh
  INSTALLER_URL_ARM64: https://repo.anaconda.com/miniconda/Miniconda3-py314_26.7.1-1-Linux-aarch64.sh
  SEMVER_MAJOR_MINOR_VERSION: "26.7"
  SEMVER_MAJOR_VERSION: "26"
  SEMVER_VERSION: 26.7.1
  VERSION: 26.7.1-1
contents:
  repositories:
    - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
  keyring:
    - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
  packages:
    - '!gawk'
    - '!libelogind0'
    - '!original-awk'
    - apt
    - bash
    - ca-certificates
    - coreutils
    - curl
    - diffutils
    - dpkg
    - findutils
    - git
    - grep
    - libc-bin
    - libexpat1
    - libglib2.0-0t64
    - libsm6
    - libxext6
    - libxrender1
    - mawk
    - mercurial
    - openssh-client
    - perl
    - perl-base
    - procps
    - sed
    - subversion
    - util-linux
    - wget
    - zlib1g
  builds:
    - name: miniconda3
      contents:
        packages:
          - bash
          - bzip2
          - ca-certificates
          - coreutils
          - findutils
          - grep
          - libc-bin
          - mawk
          - sed
        files:
          - url: https://repo.anaconda.com/miniconda/Miniconda3-py314_26.7.1-1-Linux-x86_64.sh
            checksum: sha256:e8b25b92b262499141c5bd57a98d3c008024185fa951494b9cd9b6d94e72338b
            path: ${source.dir}/miniconda-installer-amd64.sh
            spdx:
              name: miniconda3
              version: 26.7.1-1
              packages:
                - name: miniconda3
                  purl: pkg:generic/miniconda3@26.7.1-1
                  license: BSD-3-Clause
            uid: 0
            gid: 0
            mode: "0755"
          - url: https://repo.anaconda.com/miniconda/Miniconda3-py314_26.7.1-1-Linux-aarch64.sh
            checksum: sha256:e31545afd7462d3c9c33b154c7a101c5acb5e01b69380b6994651aead6942893
            path: ${source.dir}/miniconda-installer-arm64.sh
            spdx:
              name: miniconda3
              version: 26.7.1-1
              packages:
                - name: miniconda3
                  purl: pkg:generic/miniconda3@26.7.1-1
                  license: BSD-3-Clause
            uid: 0
            gid: 0
            mode: "0755"
      pipeline:
        - name: install miniconda
          privileged: true
          runs: |
            set -eux -o pipefail

            case "$(uname -m)" in
              x86_64) INSTALLER="${source.dir}/miniconda-installer-amd64.sh" ;;
              aarch64) INSTALLER="${source.dir}/miniconda-installer-arm64.sh" ;;
              *)
                echo "unsupported architecture: $(uname -m)" >&2
                exit 1
                ;;
            esac

            bash "${INSTALLER}" -b -p /opt/conda

            printf 'channels:\n  - conda-forge\nchannel_priority: strict\n' > /opt/conda/.condarc

            /opt/conda/bin/conda update -n base -y urllib3 cryptography pyjwt pip idna python-dotenv msgpack-python pydantic-settings click anyio certifi setuptools

            /opt/conda/bin/conda install -n base -y 'urllib3==2.8.0' 'certifi==2026.10.19' 'pip==26.2.2'

            SITE=$(echo /opt/conda/lib/python*/site-packages)
            align_vendor() {
              root="$1"
              rm -rf "${root}/urllib3"
              cp -a "${SITE}/urllib3" "${root}/urllib3"
              sed -i 's/urllib3==2\.7\.0/urllib3==2.8.0/' "${root}/vendor.txt"
              sed -i \
                -e 's|pkg:pypi/urllib3@2\.7\.0|pkg:pypi/urllib3@2.8.0|g' \
                -e 's|"version": "2.7.0"|"version": "2.8.0"|' \
                "${root}/bom.cdx.json"
              grep -q 'urllib3==2.8.0' "${root}/vendor.txt"
              grep -q 'pkg:pypi/urllib3@2.8.0' "${root}/bom.cdx.json"
              if grep -q 'urllib3@2\.7\.0' "${root}/bom.cdx.json"; then
                echo "stale urllib3 pin in ${root}/bom.cdx.json" >&2
                exit 1
              fi
              rm -rf "${root}/certifi"
              cp -a "${SITE}/certifi" "${root}/certifi"
              sed -i -E 's/certifi==[0-9]{4}\.[0-9]{1,2}\.[0-9]{1,2}/certifi==2026.10.19/' "${root}/vendor.txt"
              sed -i -E \
                -e 's|pkg:pypi/certifi@[0-9]{4}\.[0-9]{1,2}\.[0-9]{1,2}|pkg:pypi/certifi@2026.10.19|g' \
                -e 's|"version": "[0-9]{4}\.[0-9]{1,2}\.[0-9]{1,2}"|"version": "2026.10.19"|g' \
                "${root}/bom.cdx.json"
              grep -q 'certifi==2026.10.19' "${root}/vendor.txt"
              grep -q 'pkg:pypi/certifi@2026.10.19' "${root}/bom.cdx.json"
              stale_certifi=$(grep -oE 'pkg:pypi/certifi@[0-9]{4}\.[0-9]{1,2}\.[0-9]{1,2}' "${root}/bom.cdx.json" | sort -u | grep -v 'pkg:pypi/certifi@2026.10.19' || true)
              if [ -n "${stale_certifi}" ]; then
                echo "stale certifi pin in ${root}/bom.cdx.json" >&2
                exit 1
              fi
              if grep -E '"version": "[0-9]{4}\.[0-9]{1,2}\.[0-9]{1,2}"' "${root}/bom.cdx.json" | grep -qv '"version": "2026.10.19"'; then
                echo "stale certifi version in ${root}/bom.cdx.json" >&2
                exit 1
              fi
              if grep -q 'emSign ECC Root CA - G3' "${root}/certifi/cacert.pem"; then
                echo "eMudhra G3 root still present in ${root}/certifi/cacert.pem" >&2
                exit 1
              fi
              rm -rf "${root}/msgpack"
              cp -a "${SITE}/msgpack" "${root}/msgpack"
              find "${root}/msgpack" -name '*.so' -delete
              sed -i 's/msgpack==1\.1\.2/msgpack==1.2.4/' "${root}/vendor.txt"
              sed -i \
                -e 's|pkg:pypi/msgpack@1\.1\.2|pkg:pypi/msgpack@1.2.4|g' \
                -e '/"name": "msgpack"/,/"version"/ s/"version": "1\.1\.2"/"version": "1.2.4"/' \
                "${root}/bom.cdx.json"
              grep -q 'msgpack==1.2.4' "${root}/vendor.txt"
              grep -q 'pkg:pypi/msgpack@1.2.4' "${root}/bom.cdx.json"
              if grep -q 'msgpack@1\.1\.2' "${root}/bom.cdx.json"; then
                echo "stale msgpack pin in ${root}/bom.cdx.json" >&2
                exit 1
              fi
            }
            align_vendor "${SITE}/pip/_vendor"
            find /opt/conda/pkgs -type d -path '*/site-packages/pip/_vendor' > /tmp/pip-vendor-roots
            while read -r root; do
              align_vendor "${root}"
            done < /tmp/pip-vendor-roots
            rm -f /tmp/pip-vendor-roots

            /opt/conda/bin/conda clean --all --yes
            find /opt/conda -type d -name '__pycache__' -prune -exec rm -rf {} +
            find /opt/conda -type d -name 'tests' -prune -exec rm -rf {} + || true
            find /opt/conda -name '*.pyc' -delete
        - name: conda packages sbom
          uses: sbom@v1
          with:
            extra-scanners: python-package-cataloger
            prefix: miniconda3-packages
            source: /opt/conda
      outputs:
        - source: /opt/conda
          target: /opt/conda
          uid: 0
          gid: 0
        - source: /opt/docker/sbom/miniconda3-packages
          target: /opt/docker/sbom/miniconda3-packages
          uid: 0
          gid: 0
    - name: locale
      contents:
        packages:
          - bash
          - locales
          - coreutils
          - gzip
      pipeline:
        - name: install locales
          runs: |
            set -eux -o pipefail

            ln -s /etc/locale.alias /usr/share/locale/locale.alias

            echo "en_US.UTF-8 UTF-8" >> /etc/locale.gen
            locale-gen en_US.UTF-8
      outputs:
        - source: /usr/share/locale
          target: /usr/share/locale
          uid: 0
          gid: 0
        - source: /usr/lib/locale
          target: /usr/lib/locale
          uid: 0
          gid: 0
accounts:
  root: true
  run-as: root
  users:
    - name: nonroot
      uid: 65532
      gid: 65532
    - name: _apt
      uid: 42
      gid: 65532
  groups:
    - name: nonroot
      gid: 65532
      members:
        - nonroot
os-release:
  name: Docker Hardened Images (Debian)
  id: debian
  version-id: "13"
  version-codename: trixie
  pretty-name: Docker Hardened Images/Debian GNU/Linux 13 (trixie)
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
environment:
  DEBIAN_FRONTEND: noninteractive
  LANG: en_US.UTF-8
  LANGUAGE: en_US:en
  LC_ALL: en_US.UTF-8
  PATH: /opt/conda/bin:/usr/local/bin:/usr/local/sbin:/usr/sbin:/usr/bin:/sbin:/bin
paths:
  - type: file
    path: /usr/local/bin/docker-entrypoint.sh
    content: |
      #!/bin/bash
      exec "$@"
    uid: 0
    gid: 0
    mode: "0755"
annotations:
  org.opencontainers.image.description: A minimal Miniconda3 image
  org.opencontainers.image.licenses: BSD-3-Clause
entrypoint:
  - /usr/local/bin/docker-entrypoint.sh
cmd:
  - /bin/bash
