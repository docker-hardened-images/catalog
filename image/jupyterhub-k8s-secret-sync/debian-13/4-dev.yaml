# syntax=dhi.io/build:2-debian13

name: JupyterHub K8s Secret Sync 4.x (dev)
image: dhi.io/jupyterhub-k8s-secret-sync
variant: dev
tags:
  - 4-dev
  - 4.4-dev
  - 4.4.5-dev
  - 4-debian-dev
  - 4-debian13-dev
  - 4.4-debian-dev
  - 4.4-debian13-dev
  - 4.4.5-debian-dev
  - 4.4.5-debian13-dev
platforms:
  - linux/amd64
  - linux/arm64
dates:
  release: "2026-08-10"
vars:
  PKG_SUFFIX: ""
  SEMVER_MAJOR_MINOR_VERSION: "4.4"
  SEMVER_MAJOR_VERSION: "4"
  SEMVER_VERSION: 4.4.5
  VERSION: 4.4.5-1
contents:
  repositories:
    - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
  keyring:
    - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
  packages:
    - '!gawk'
    - '!libelogind0'
    - '!original-awk'
    - apt
    - base-files
    - bash
    - ca-certificates
    - ca-certificates-bundle
    - coreutils
    - curl
    - diffutils
    - dpkg
    - findutils
    - grep
    - jupyterhub-k8s-secret-sync-4=4.4.5-1
    - libc-bin
    - libffi8
    - libstdc++6
    - mawk
    - perl-base
    - python-3.14
    - python-3.14-dev
    - python3-pip
    - python3-setuptools
    - python3-wheel
    - sed
    - tini
    - tzdata
    - util-linux
accounts:
  root: true
  run-as: root
  users:
    - name: nonroot
      uid: 65532
      gid: 65532
    - name: _apt
      uid: 42
      gid: 65532
  groups:
    - name: nonroot
      gid: 65532
      members:
        - nonroot
os-release:
  name: Docker Hardened Images (Debian)
  id: debian
  version-id: "13"
  version-codename: trixie
  pretty-name: Docker Hardened Images/Debian GNU/Linux 13 (trixie)
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
environment:
  DEBIAN_FRONTEND: noninteractive
  PYTHONUNBUFFERED: "1"
paths:
  - type: symlink
    path: /opt/acme-secret-sync
    uid: 0
    gid: 0
    source: /usr/lib/jupyterhub-k8s-secret-sync
annotations:
  org.opencontainers.image.description: A minimal jupyterhub-k8s-secret-sync image
  org.opencontainers.image.licenses: BSD-3-Clause
entrypoint:
  - /usr/bin/tini
  - --
  - /usr/bin/acme-secret-sync
