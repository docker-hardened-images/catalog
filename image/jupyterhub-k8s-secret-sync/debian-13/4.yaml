# syntax=dhi.io/build:2-debian13

name: JupyterHub K8s Secret Sync 4.x
image: dhi.io/jupyterhub-k8s-secret-sync
variant: runtime
tags:
  - "4"
  - "4.4"
  - 4.4.5
  - 4-debian
  - 4-debian13
  - 4.4-debian
  - 4.4-debian13
  - 4.4.5-debian
  - 4.4.5-debian13
platforms:
  - linux/amd64
  - linux/arm64
dates:
  release: "2026-08-10"
vars:
  PKG_SUFFIX: ""
  SEMVER_MAJOR_MINOR_VERSION: "4.4"
  SEMVER_MAJOR_VERSION: "4"
  SEMVER_VERSION: 4.4.5
  VERSION: 4.4.5-1
contents:
  repositories:
    - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
  keyring:
    - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
  packages:
    - base-files
    - ca-certificates-bundle
    - jupyterhub-k8s-secret-sync-4=4.4.5-1
    - libffi8
    - libstdc++6
    - python-3.14
    - tini
    - tzdata
accounts:
  run-as: nonroot
  users:
    - name: nonroot
      uid: 65532
      gid: 65532
  groups:
    - name: nonroot
      gid: 65532
      members:
        - nonroot
os-release:
  name: Docker Hardened Images (Debian)
  id: debian
  version-id: "13"
  version-codename: trixie
  pretty-name: Docker Hardened Images/Debian GNU/Linux 13 (trixie)
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
environment:
  PYTHONUNBUFFERED: "1"
paths:
  - type: symlink
    path: /opt/acme-secret-sync
    uid: 0
    gid: 0
    source: /usr/lib/jupyterhub-k8s-secret-sync
annotations:
  org.opencontainers.image.description: A minimal jupyterhub-k8s-secret-sync image
  org.opencontainers.image.licenses: BSD-3-Clause
entrypoint:
  - /usr/bin/tini
  - --
  - /usr/bin/acme-secret-sync
