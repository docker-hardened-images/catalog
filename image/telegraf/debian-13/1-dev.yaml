# syntax=dhi.io/build:2-debian13

name: Telegraf 1.39.x (dev)
image: dhi.io/telegraf
variant: dev
tags:
  - 1-dev
  - 1.39-dev
  - 1.39.3-dev
  - 1-debian-dev
  - 1-debian13-dev
  - 1.39-debian-dev
  - 1.39-debian13-dev
  - 1.39.3-debian-dev
  - 1.39.3-debian13-dev
platforms:
  - linux/amd64
  - linux/arm64
dates:
  release: "2016-09-02"
vars:
  FLAVORED_SUFFIX: -dev
  SEMVER_MAJOR_MINOR_VERSION: "1.39"
  SEMVER_MAJOR_VERSION: "1"
  SEMVER_VERSION: 1.39.3
  SUFFIX: -dev
  VERSION: 1.39.3-5
contents:
  repositories:
    - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
  keyring:
    - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
  packages:
    - '!gawk'
    - '!libelogind0'
    - '!original-awk'
    - apt
    - base-files
    - bash
    - ca-certificates
    - ca-certificates-bundle
    - coreutils
    - diffutils
    - dpkg
    - findutils
    - grep
    - libc-bin
    - mawk
    - perl-base
    - sed
    - telegraf-dev=1.39.3-5
    - tzdata
    - util-linux
accounts:
  root: true
  run-as: root
  users:
    - name: nonroot
      uid: 65532
      gid: 65532
    - name: _apt
      uid: 42
      gid: 65532
  groups:
    - name: nonroot
      gid: 65532
      members:
        - nonroot
os-release:
  name: Docker Hardened Images (Debian)
  id: debian
  version-id: "13"
  version-codename: trixie
  pretty-name: Docker Hardened Images/Debian GNU/Linux 13 (trixie)
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
environment:
  DEBIAN_FRONTEND: noninteractive
paths:
  - type: directory
    path: /usr/local/bin
    uid: 0
    gid: 0
  - type: symlink
    path: /usr/local/bin/telegraf
    uid: 0
    gid: 0
    source: /usr/bin/telegraf
  - type: directory
    path: /etc/telegraf
    uid: 65532
    gid: 65532
    mode: "0770"
  - type: directory
    path: /etc/telegraf/telegraf.d
    uid: 65532
    gid: 65532
    mode: "0770"
annotations:
  org.opencontainers.image.description: A minimal Telegraf image
  org.opencontainers.image.licenses: MIT
entrypoint:
  - telegraf
ports:
  - 8092/udp
  - 8094/tcp
  - 8125/udp
