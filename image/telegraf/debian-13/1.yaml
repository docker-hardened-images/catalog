# syntax=dhi.io/build:2-debian13

name: Telegraf 1.39.x
image: dhi.io/telegraf
variant: runtime
tags:
  - "1"
  - "1.39"
  - 1.39.3
  - 1-debian
  - 1-debian13
  - 1.39-debian
  - 1.39-debian13
  - 1.39.3-debian
  - 1.39.3-debian13
platforms:
  - linux/amd64
  - linux/arm64
dates:
  release: "2016-09-02"
vars:
  FLAVORED_SUFFIX: ""
  SEMVER_MAJOR_MINOR_VERSION: "1.39"
  SEMVER_MAJOR_VERSION: "1"
  SEMVER_VERSION: 1.39.3
  SUFFIX: ""
  VERSION: 1.39.3-6
contents:
  repositories:
    - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
  keyring:
    - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
  packages:
    - base-files
    - ca-certificates-bundle
    - telegraf=1.39.3-6
    - tzdata
accounts:
  run-as: nonroot
  users:
    - name: nonroot
      uid: 65532
      gid: 65532
  groups:
    - name: nonroot
      gid: 65532
      members:
        - nonroot
os-release:
  name: Docker Hardened Images (Debian)
  id: debian
  version-id: "13"
  version-codename: trixie
  pretty-name: Docker Hardened Images/Debian GNU/Linux 13 (trixie)
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
paths:
  - type: directory
    path: /usr/local/bin
    uid: 0
    gid: 0
  - type: symlink
    path: /usr/local/bin/telegraf
    uid: 0
    gid: 0
    source: /usr/bin/telegraf
  - type: directory
    path: /etc/telegraf
    uid: 65532
    gid: 65532
    mode: "0770"
  - type: directory
    path: /etc/telegraf/telegraf.d
    uid: 65532
    gid: 65532
    mode: "0770"
annotations:
  org.opencontainers.image.description: A minimal Telegraf image
  org.opencontainers.image.licenses: MIT
entrypoint:
  - telegraf
ports:
  - 8092/udp
  - 8094/tcp
  - 8125/udp
