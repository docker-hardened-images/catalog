# syntax=dhi.io/build:2-alpine3.24

name: Vaultwarden 1.x (dev)
image: dhi.io/vaultwarden
variant: dev
tags:
  - 1-alpine-dev
  - 1.37-alpine-dev
  - 1-alpine3.24-dev
  - 1.37.4-alpine-dev
  - 1.37-alpine3.24-dev
  - 1.37.4-alpine3.24-dev
platforms:
  - linux/amd64
  - linux/arm64
dates:
  release: "2018-08-21"
vars:
  SEMVER_MAJOR_MINOR_VERSION: "1.37"
  SEMVER_MAJOR_VERSION: "1"
  SEMVER_VERSION: 1.37.4
  VERSION: 1.37.4-r0
contents:
  repositories:
    - https://dhi.io/apk/alpine/v3.24/main
    - https://dl-cdn.alpinelinux.org/alpine/v3.24/main
    - https://dl-cdn.alpinelinux.org/alpine/v3.24/community
  keyring:
    - https://dhi.io/keyring/dhi-apk@docker-0F81AD7700D99184.rsa.pub
  packages:
    - alpine-baselayout-data
    - apk-tools
    - bash
    - busybox
    - ca-certificates
    - ca-certificates-bundle
    - coreutils
    - findutils
    - libcrypto3
    - libgcc
    - libpq
    - libssl3
    - mariadb-connector-c
    - musl
    - musl-utils
    - sqlite-libs
    - tzdata
    - vaultwarden-1=1.37.4-r0
    - zstd-libs
  builds:
    - name: setcap vaultwarden
      contents:
        packages:
          - bash
          - libcap-setcap
          - libcap2
          - vaultwarden-1=1.37.4-r0
      pipeline:
        - name: setcap
          runs: |
            set -eux -o pipefail

            setcap 'cap_net_bind_service=+eip' /usr/bin/vaultwarden
            setcap -v 'cap_net_bind_service=+eip' /usr/bin/vaultwarden
      outputs:
        - source: /usr/bin/vaultwarden
          target: /usr/bin/vaultwarden
          uid: 0
          gid: 0
accounts:
  root: true
  run-as: root
  users:
    - name: nonroot
      uid: 65532
      gid: 65532
  groups:
    - name: nonroot
      gid: 65532
      members:
        - nonroot
os-release:
  name: Docker Hardened Images (Alpine)
  id: alpine
  version-id: "3.24"
  pretty-name: Docker Hardened Images/Alpine Linux v3.24
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
work-dir: /
environment:
  ROCKET_ADDRESS: 0.0.0.0
  ROCKET_PORT: "80"
  ROCKET_PROFILE: release
paths:
  - type: directory
    path: /data
    uid: 65532
    gid: 65532
    mode: "0770"
  - type: symlink
    path: /start.sh
    uid: 0
    gid: 0
    source: /usr/lib/vaultwarden/start.sh
  - type: symlink
    path: /vaultwarden
    uid: 0
    gid: 0
    source: /usr/bin/vaultwarden
  - type: symlink
    path: /web-vault
    uid: 0
    gid: 0
    source: /usr/share/vaultwarden/web-vault
annotations:
  org.opencontainers.image.description: A minimal Vaultwarden image
  org.opencontainers.image.licenses: AGPL-3.0-only
cmd:
  - /start.sh
ports:
  - 80/tcp
