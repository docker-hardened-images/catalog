# syntax=dhi.io/build:2-debian13

name: Vaultwarden 1.x
image: dhi.io/vaultwarden
variant: runtime
tags:
  - "1"
  - "1.37"
  - 1.37.4
  - 1-debian
  - 1-debian13
  - 1.37-debian
  - 1.37-debian13
  - 1.37.4-debian
  - 1.37.4-debian13
platforms:
  - linux/amd64
  - linux/arm64
dates:
  release: "2018-08-21"
vars:
  SEMVER_MAJOR_MINOR_VERSION: "1.37"
  SEMVER_MAJOR_VERSION: "1"
  SEMVER_VERSION: 1.37.4
  VERSION: 1.37.4-1
contents:
  repositories:
    - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
  keyring:
    - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
  packages:
    - '!libelogind0'
    - '!mawk'
    - '!original-awk'
    - base-files
    - ca-certificates-bundle
    - dash
    - libc6
    - libgcc-s1
    - libmariadb3
    - libpq5
    - libsqlite3-0
    - libssl3t64
    - libzstd1
    - tzdata
    - vaultwarden-1=1.37.4-1
  builds:
    - name: setcap vaultwarden
      contents:
        packages:
          - bash
          - coreutils
          - libcap2-bin
          - vaultwarden-1=1.37.4-1
      pipeline:
        - name: setcap
          runs: |
            set -eux -o pipefail

            setcap 'cap_net_bind_service=+eip' /usr/bin/vaultwarden
            setcap -v 'cap_net_bind_service=+eip' /usr/bin/vaultwarden
      outputs:
        - source: /usr/bin/vaultwarden
          target: /usr/bin/vaultwarden
          uid: 0
          gid: 0
accounts:
  run-as: nonroot
  users:
    - name: nonroot
      uid: 65532
      gid: 65532
  groups:
    - name: nonroot
      gid: 65532
      members:
        - nonroot
os-release:
  name: Docker Hardened Images (Debian)
  id: debian
  version-id: "13"
  version-codename: trixie
  pretty-name: Docker Hardened Images/Debian GNU/Linux 13 (trixie)
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
work-dir: /
environment:
  ROCKET_ADDRESS: 0.0.0.0
  ROCKET_PORT: "80"
  ROCKET_PROFILE: release
paths:
  - type: directory
    path: /data
    uid: 65532
    gid: 65532
    mode: "0770"
  - type: symlink
    path: /start.sh
    uid: 0
    gid: 0
    source: /usr/lib/vaultwarden/start.sh
  - type: symlink
    path: /vaultwarden
    uid: 0
    gid: 0
    source: /usr/bin/vaultwarden
  - type: symlink
    path: /web-vault
    uid: 0
    gid: 0
    source: /usr/share/vaultwarden/web-vault
annotations:
  org.opencontainers.image.description: A minimal Vaultwarden image
  org.opencontainers.image.licenses: AGPL-3.0-only
cmd:
  - /start.sh
ports:
  - 80/tcp
