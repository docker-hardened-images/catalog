# syntax=dhi.io/build:2-alpine3.24

name: GitLab Operator 3.5.x
image: dhi.io/gitlab-operator
variant: runtime
tags:
  - 3-alpine
  - 3.5-alpine
  - 3-alpine3.24
  - 3.5.4-alpine
  - 3.5-alpine3.24
  - 3.5.4-alpine3.24
platforms:
  - linux/amd64
  - linux/arm64
dates:
  release: "2026-10-15"
vars:
  OPERATOR_FIPS: ""
  SEMVER_MAJOR_MINOR_VERSION: "3.5"
  SEMVER_MAJOR_VERSION: "3"
  SEMVER_VERSION: 3.5.4
  VERSION: 3.5.4-r0
contents:
  repositories:
    - https://dhi.io/apk/alpine/v3.24/main
    - https://dl-cdn.alpinelinux.org/alpine/v3.24/main
    - https://dl-cdn.alpinelinux.org/alpine/v3.24/community
  keyring:
    - https://dhi.io/keyring/dhi-apk@docker-0F81AD7700D99184.rsa.pub
  packages:
    - ca-certificates-bundle
    - gitlab-operator-3.5=3.5.4-r0
    - tzdata
accounts:
  run-as: nonroot
  users:
    - name: nonroot
      uid: 65532
      gid: 65532
  groups:
    - name: nonroot
      gid: 65532
      members:
        - nonroot
os-release:
  name: Docker Hardened Images (Alpine)
  id: alpine
  version-id: "3.24"
  pretty-name: Docker Hardened Images/Alpine Linux v3.24
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
environment:
  HELM_CHARTS: /usr/share/gitlab-operator/charts
paths:
  - type: symlink
    path: /manager
    uid: 0
    gid: 0
    source: /usr/bin/gitlab-operator
annotations:
  org.opencontainers.image.description: A minimal GitLab Operator image
  org.opencontainers.image.licenses: Apache-2.0
entrypoint:
  - /manager
ports:
  - 8443/tcp
  - 9443/tcp
  - 6060/tcp
