# syntax=dhi.io/build:2-debian13

name: GitLab Operator 3.4.x (dev)
image: dhi.io/gitlab-operator
variant: dev
tags:
  - 3.4-dev
  - 3.4.3-dev
  - 3.4-debian-dev
  - 3.4-debian13-dev
  - 3.4.3-debian-dev
  - 3.4.3-debian13-dev
platforms:
  - linux/amd64
  - linux/arm64
dates:
  release: "2026-09-17"
vars:
  OPERATOR_FIPS: ""
  SEMVER_MAJOR_MINOR_VERSION: "3.4"
  SEMVER_MAJOR_VERSION: "3"
  SEMVER_VERSION: 3.4.3
  VERSION: 3.4.3-1
contents:
  repositories:
    - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
  keyring:
    - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
  packages:
    - '!gawk'
    - '!libelogind0'
    - '!original-awk'
    - apt
    - base-files
    - bash
    - ca-certificates
    - ca-certificates-bundle
    - coreutils
    - diffutils
    - dpkg
    - findutils
    - gitlab-operator-3.4=3.4.3-1
    - grep
    - libc-bin
    - mawk
    - perl-base
    - sed
    - tzdata
    - util-linux
accounts:
  root: true
  run-as: root
  users:
    - name: nonroot
      uid: 65532
      gid: 65532
    - name: _apt
      uid: 42
      gid: 65532
  groups:
    - name: nonroot
      gid: 65532
      members:
        - nonroot
os-release:
  name: Docker Hardened Images (Debian)
  id: debian
  version-id: "13"
  version-codename: trixie
  pretty-name: Docker Hardened Images/Debian GNU/Linux 13 (trixie)
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
environment:
  DEBIAN_FRONTEND: noninteractive
  HELM_CHARTS: /usr/share/gitlab-operator/charts
paths:
  - type: symlink
    path: /manager
    uid: 0
    gid: 0
    source: /usr/bin/gitlab-operator
annotations:
  org.opencontainers.image.description: A minimal GitLab Operator image
  org.opencontainers.image.licenses: Apache-2.0
entrypoint:
  - /manager
ports:
  - 8443/tcp
  - 9443/tcp
  - 6060/tcp
