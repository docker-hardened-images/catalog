# syntax=dhi.io/build:2-debian13

name: Connaisseur 3.x
image: dhi.io/connaisseur
variant: runtime
tags:
  - "3"
  - "3.11"
  - 3.11.0
  - 3-debian
  - 3-debian13
  - 3.11-debian
  - 3.11-debian13
  - 3.11.0-debian
  - 3.11.0-debian13
platforms:
  - linux/amd64
  - linux/arm64
dates:
  release: "2026-01-30"
vars:
  FLAVORED_SUFFIX: ""
  SEMVER_MAJOR_MINOR_VERSION: "3.11"
  SEMVER_MAJOR_VERSION: "3"
  SEMVER_VERSION: 3.11.0
  SUFFIX: ""
  VERSION: 3.11.0-1
contents:
  repositories:
    - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
  keyring:
    - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
  packages:
    - base-files
    - ca-certificates-bundle
    - connaisseur=3.11.0-1
    - tzdata
accounts:
  run-as: nonroot
  users:
    - name: nonroot
      uid: 65532
      gid: 65532
  groups:
    - name: nonroot
      gid: 65532
      members:
        - nonroot
os-release:
  name: Docker Hardened Images (Debian)
  id: debian
  version-id: "13"
  version-codename: trixie
  pretty-name: Docker Hardened Images/Debian GNU/Linux 13 (trixie)
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
paths:
  - type: directory
    path: /usr/local/bin
    uid: 0
    gid: 0
  - type: symlink
    path: /usr/local/bin/connaisseur
    uid: 0
    gid: 0
    source: /usr/bin/connaisseur
  - type: directory
    path: /app/bin
    uid: 0
    gid: 0
  - type: symlink
    path: /app/bin/connaisseur
    uid: 0
    gid: 0
    source: /usr/local/bin/connaisseur
annotations:
  org.opencontainers.image.description: A minimal Connaisseur image
  org.opencontainers.image.licenses: Apache-2.0
entrypoint:
  - /usr/local/bin/connaisseur
ports:
  - 5000/tcp
