# syntax=dhi.io/build:2-debian13

name: Valkey Operator 0.x
image: dhi.io/valkey-operator
variant: runtime
tags:
  - "0"
  - "0.5"
  - 0.5.0
  - 0-debian
  - 0-debian13
  - 0.5-debian
  - 0.5-debian13
  - 0.5.0-debian
  - 0.5.0-debian13
platforms:
  - linux/amd64
  - linux/arm64
dates:
  release: "2026-08-11"
vars:
  FLAVORED_SUFFIX: ""
  SEMVER_MAJOR_MINOR_VERSION: "0.5"
  SEMVER_MAJOR_VERSION: "0"
  SEMVER_VERSION: 0.5.0
  SUFFIX: ""
  VERSION: 0.5.0-3
contents:
  repositories:
    - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
  keyring:
    - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
  packages:
    - base-files
    - ca-certificates
    - ca-certificates-bundle
    - tzdata
    - valkey-operator=0.5.0-3
accounts:
  run-as: nonroot
  users:
    - name: nonroot
      uid: 65532
      gid: 65532
  groups:
    - name: nonroot
      gid: 65532
      members:
        - nonroot
os-release:
  name: Docker Hardened Images (Debian)
  id: debian
  version-id: "13"
  version-codename: trixie
  pretty-name: Docker Hardened Images/Debian GNU/Linux 13 (trixie)
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
paths:
  - type: symlink
    path: /manager
    uid: 0
    gid: 0
    source: /usr/bin/manager
annotations:
  org.opencontainers.image.description: A minimal Valkey Operator image
  org.opencontainers.image.licenses: Apache-2.0
entrypoint:
  - /manager
