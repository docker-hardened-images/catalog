            license: NOASSERTION
      uid: 0
      gid: 0
      mode: "0755"
  builds:
    - name: build php extensions
      shell: bash
      contents:
        packages:
          - autoconf
          - bash
          - build-base
          - coreutils
          - findutils
          - grep
          - gzip
          - pkgconf
          - php-8.4
