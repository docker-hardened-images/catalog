        files:
          - url: https://www.php.net/distributions/php-8.4.26.tar.xz
            checksum: sha256:32a2de53862ad44ed4a5005244ce4f1b50c271e74dced215449a4443b40569f1
            path: ${source.dir}/php-8.4.26.tar.xz
            spdx:
              name: php
              version: 8.4.26
              packages:
                - name: php
                  purl: pkg:dhi/php@8.4.26
                  license: PHP-3.01
            uid: 0
            gid: 0
          - url: https://pecl.php.net/get/apcu-5.1.28.tgz
            checksum: sha256:ca9c1820810a168786f8048a4c3f8c9e3fd941407ad1553259fb2e30b5f057bf
            path: ${source.dir}/apcu-5.1.28.tgz
            spdx:
              name: apcu
              version: 5.1.28
              packages:
                - name: apcu
                  purl: pkg:github/krakjoe/apcu@v5.1.28
                  license: PHP-3.01
            uid: 0
            gid: 0
          - url: https://pecl.php.net/get/redis-6.3.0.tgz
            checksum: sha256:0d5141f634bd1db6c1ddcda053d25ecf2c4fc1c395430d534fd3f8d51dd7f0b5
            path: ${source.dir}/redis-6.3.0.tgz
            spdx:
              name: phpredis
              version: 6.3.0
              packages:
                - name: phpredis
                  purl: pkg:github/phpredis/phpredis@6.3.0
                  license: PHP-3.01
            uid: 0
            gid: 0
      pipeline:
        - name: extract php source
          runs: |
            set -eux -o pipefail

            tar -xaf "${source.dir}/php-8.4.26.tar.xz" -C "${source.dir}"
        - name: build bundled extensions
          runs: |
            set -eux -o pipefail

            build_ext() {
              local ext=$1
              shift
              cd "${source.dir}/php-8.4.26/ext/$ext"
              phpize
              ./configure --with-php-config=/usr/bin/php-config "$@"
              make -j "$(nproc)"
              make install
            }

            build_ext gd --with-freetype --with-jpeg
            build_ext bcmath
            build_ext ldap
            build_ext mysqli
            build_ext pdo_mysql
            build_ext zip
        - name: build pecl extensions
          runs: |
            set -eux -o pipefail

            build_pecl() {
              local dir=$1
              tar -xzf "${source.dir}/$dir.tgz" -C "${source.dir}"
              cd "${source.dir}/$dir"
              phpize
              ./configure --with-php-config=/usr/bin/php-config
              make -j "$(nproc)"
              make install
            }

            build_pecl "apcu-5.1.28"
            build_pecl "redis-6.3.0"
      outputs:
        - source: /usr/lib/php/extensions
          target: /usr/lib/php/extensions
          uid: 0
          gid: 0
    - name: php-fpm config
      contents:
        packages:
          - busybox
          - php-8.4-fpm
      pipeline:
        - name: install php-fpm config
          runs: |
            set -eux -o pipefail

            cp '/etc/php-8.4/php-fpm.conf.default' '/etc/php-8.4/php-fpm.conf'
            cp '/etc/php-8.4/php-fpm.d/www.conf.default' '/etc/php-8.4/php-fpm.d/www.conf'
            sed -ri 's/^(listen = 127.0.0.1:9000)/;\1/' '/etc/php-8.4/php-fpm.d/www.conf'
      outputs:
        - source: /etc/php-8.4/php-fpm.conf
          target: /etc/php-8.4/php-fpm.conf
          uid: 0
          gid: 0
        - source: /etc/php-8.4/php-fpm.d/www.conf
          target: /etc/php-8.4/php-fpm.d/www.conf
          uid: 0
          gid: 0
