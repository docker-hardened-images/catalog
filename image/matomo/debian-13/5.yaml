contents:
  repositories:
    - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
  keyring:
    - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
  packages:
    - base-files
    - ca-certificates-bundle
    - coreutils
    - dash
    - grep
    - libargon2-1
    - libcurl4t64
    - libfreetype6
    - libicu76
    - libjpeg62-turbo
    - libldap2
    - libonig5
    - libpcre2-8-0
    - libpng16-16t64
    - libreadline8t64
    - libsasl2-2
    - libsodium23
    - libsqlite3-0
    - libssl3t64
    - libxml2
    - libzip5
    - matomo=5.14.0-0
    - php-8.4
    - php-8.4-fpm
    - php-8.4-oci-config
    - sed
    - tar
    - zlib1g
  files:
    - url: https://raw.githubusercontent.com/matomo-org/docker/6d73de7d142d0eed5dd5aadba7fe51474330146a/fpm/docker-entrypoint.sh
      checksum: sha256:041f013ff91b258faee30c6e2367032ed2146a04f8491f438d3582381407feaf
      path: /usr/local/bin/docker-entrypoint.sh
      spdx:
        name: matomo-docker-entrypoint
        version: 6d73de7d142d0eed5dd5aadba7fe51474330146a
        packages:
          - name: matomo-docker-entrypoint
            purl: pkg:github/matomo-org/docker@6d73de7d142d0eed5dd5aadba7fe51474330146a
            license: NOASSERTION
      uid: 0
      gid: 0
      mode: "0755"
  builds:
    - name: build php extensions
      shell: bash
      contents:
        packages:
          - autoconf
          - bash
          - build-essential
          - coreutils
          - dpkg-dev
          - findutils
          - gawk
          - grep
          - gzip
          - php-8.4
          - php-8.4-dev
          - php-8.4-oci-config
          - pkg-config
          - sed
          - tar
          - xz-utils
          - libfreetype-dev
          - libjpeg-dev
          - libldap2-dev
          - libpcre2-dev
          - libpng-dev
          - libzip-dev
          - zlib1g-dev
        files:
          - url: https://www.php.net/distributions/php-8.4.26.tar.xz
            checksum: sha256:32a2de53862ad44ed4a5005244ce4f1b50c271e74dced215449a4443b40569f1
            path: ${source.dir}/php-8.4.26.tar.xz
            spdx:
              name: php
              version: 8.4.26
              packages:
                - name: php
                  purl: pkg:dhi/php@8.4.26
                  license: PHP-3.01
            uid: 0
            gid: 0
          - url: https://pecl.php.net/get/apcu-5.1.28.tgz
            checksum: sha256:ca9c1820810a168786f8048a4c3f8c9e3fd941407ad1553259fb2e30b5f057bf
            path: ${source.dir}/apcu-5.1.28.tgz
            spdx:
              name: apcu
              version: 5.1.28
              packages:
                - name: apcu
                  purl: pkg:github/krakjoe/apcu@v5.1.28
                  license: PHP-3.01
            uid: 0
            gid: 0
          - url: https://pecl.php.net/get/redis-6.3.0.tgz
            checksum: sha256:0d5141f634bd1db6c1ddcda053d25ecf2c4fc1c395430d534fd3f8d51dd7f0b5
            path: ${source.dir}/redis-6.3.0.tgz
            spdx:
              name: phpredis
              version: 6.3.0
              packages:
                - name: phpredis
                  purl: pkg:github/phpredis/phpredis@6.3.0
                  license: PHP-3.01
            uid: 0
            gid: 0
      pipeline:
        - name: extract php source
          runs: |
            set -eux -o pipefail

            tar -xaf "${source.dir}/php-8.4.26.tar.xz" -C "${source.dir}"
        - name: build bundled extensions
          runs: |
            set -eux -o pipefail

            build_ext() {
              local ext=$1
              shift
              cd "${source.dir}/php-8.4.26/ext/$ext"
              phpize
              ./configure --with-php-config=/usr/bin/php-config "$@"
              make -j "$(nproc)"
              make install
            }

            build_ext gd --with-freetype --with-jpeg
            build_ext bcmath
            build_ext ldap --with-libdir="lib/$(dpkg-architecture -qDEB_HOST_MULTIARCH)"
            build_ext mysqli
            build_ext pdo_mysql
            build_ext zip
        - name: build pecl extensions
          runs: |
            set -eux -o pipefail

            build_pecl() {
              local dir=$1
              tar -xzf "${source.dir}/$dir.tgz" -C "${source.dir}"
              cd "${source.dir}/$dir"
              phpize
              ./configure --with-php-config=/usr/bin/php-config
              make -j "$(nproc)"
              make install
            }

            build_pecl "apcu-5.1.28"
            build_pecl "redis-6.3.0"
      outputs:
        - source: /usr/lib/php/extensions
          target: /usr/lib/php/extensions
          uid: 0
          gid: 0
