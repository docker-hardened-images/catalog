# syntax=dhi.io/build:2-debian13

name: CDI Importer 1.x (dev)
image: dhi.io/cdi-importer
variant: dev
tags:
  - 1-dev
  - 1.66-dev
  - 1.66.0-dev
  - 1-debian-dev
  - 1-debian13-dev
  - 1.66-debian-dev
  - 1.66-debian13-dev
  - 1.66.0-debian-dev
  - 1.66.0-debian13-dev
platforms:
  - linux/amd64
  - linux/arm64
dates:
  release: "2018-06-14"
vars:
  FLAVORED_SUFFIX: -dev
  SEMVER_MAJOR_MINOR_VERSION: "1.66"
  SEMVER_MAJOR_VERSION: "1"
  SEMVER_VERSION: 1.66.0
  SUFFIX: -dev
  VERSION: 1.66.0-0
contents:
  repositories:
    - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
  keyring:
    - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
  packages:
    - '!gawk'
    - '!libelogind0'
    - '!original-awk'
    - apt
    - base-files
    - bash
    - ca-certificates
    - ca-certificates-bundle
    - cdi-containerimage-server-dev=1.66.0-0
    - cdi-image-size-detection-dev=1.66.0-0
    - cdi-importer-dev=1.66.0-0
    - cdi-source-update-poller-dev=1.66.0-0
    - coreutils
    - diffutils
    - dpkg
    - findutils
    - grep
    - libc-bin
    - libc6
    - libnbd0
    - mawk
    - nbdkit
    - openstack-populator-dev=1.66.0-0
    - ovirt-populator-dev=1.66.0-0
    - perl-base
    - qemu-utils
    - sed
    - tzdata
    - util-linux
accounts:
  root: true
  run-as: root
  users:
    - name: nonroot
      uid: 65532
      gid: 65532
    - name: _apt
      uid: 42
      gid: 65532
  groups:
    - name: nonroot
      gid: 65532
      members:
        - nonroot
os-release:
  name: Docker Hardened Images (Debian)
  id: debian
  version-id: "13"
  version-codename: trixie
  pretty-name: Docker Hardened Images/Debian GNU/Linux 13 (trixie)
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
work-dir: /home/cdi-importer
environment:
  DEBIAN_FRONTEND: noninteractive
paths:
  - type: directory
    path: /usr/local/bin
    uid: 0
    gid: 0
  - type: symlink
    path: /usr/local/bin/cdi-importer
    uid: 0
    gid: 0
    source: /usr/bin/cdi-importer
  - type: symlink
    path: /usr/local/bin/openstack-populator
    uid: 0
    gid: 0
    source: /usr/bin/openstack-populator
  - type: symlink
    path: /usr/local/bin/ovirt-populator
    uid: 0
    gid: 0
    source: /usr/bin/ovirt-populator
  - type: symlink
    path: /usr/local/bin/cdi-containerimage-server
    uid: 0
    gid: 0
    source: /usr/bin/cdi-containerimage-server
  - type: symlink
    path: /usr/local/bin/cdi-image-size-detection
    uid: 0
    gid: 0
    source: /usr/bin/cdi-image-size-detection
  - type: symlink
    path: /usr/local/bin/cdi-source-update-poller
    uid: 0
    gid: 0
    source: /usr/bin/cdi-source-update-poller
  - type: directory
    path: /home/cdi-importer
    uid: 0
    gid: 0
annotations:
  org.opencontainers.image.description: A minimal CDI Importer image
  org.opencontainers.image.licenses: Apache-2.0
entrypoint:
  - /usr/local/bin/cdi-importer
  - -alsologtostderr
ports:
  - 8443/tcp
