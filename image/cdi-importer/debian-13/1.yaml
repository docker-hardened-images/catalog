# syntax=dhi.io/build:2-debian13

name: CDI Importer 1.x
image: dhi.io/cdi-importer
variant: runtime
tags:
  - "1"
  - "1.66"
  - 1.66.1
  - 1-debian
  - 1-debian13
  - 1.66-debian
  - 1.66-debian13
  - 1.66.1-debian
  - 1.66.1-debian13
platforms:
  - linux/amd64
  - linux/arm64
dates:
  release: "2018-06-14"
vars:
  FLAVORED_SUFFIX: ""
  OVIRT_ENGINE_SDK_VERSION: 4.6.3
  OVIRT_IMAGEIO_VERSION: 2.5.1
  SEMVER_MAJOR_MINOR_VERSION: "1.66"
  SEMVER_MAJOR_VERSION: "1"
  SEMVER_VERSION: 1.66.1
  SUFFIX: ""
  VERSION: 1.66.1-3
contents:
  repositories:
    - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
  keyring:
    - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
  packages:
    - '!dpkg'
    - base-files
    - ca-certificates
    - ca-certificates-bundle
    - cdi-containerimage-server=1.66.1-3
    - cdi-image-size-detection=1.66.1-3
    - cdi-importer=1.66.1-3
    - cdi-source-update-poller=1.66.1-3
    - libc6
    - libnbd0
    - libxml2
    - nbdkit
    - openstack-populator=1.66.1-3
    - ovirt-populator=1.66.1-3
    - python3
    - python3-pycurl
    - qemu-utils
    - tzdata
    - util-linux
  builds:
    - name: ovirt-img
      contents:
        packages:
          - bash
          - ca-certificates-bundle
          - coreutils
          - findutils
          - gcc
          - libxml2-dev
          - python3.13-dev
          - python3.13-venv
      pipeline:
        - name: build
          privileged: true
          caches:
            - path: /root/.cache/pip
          runs: |
            set -eux -o pipefail

            dist_packages="${target.dir}/usr/lib/python3/dist-packages"
            mkdir -p "${dist_packages}" "${target.dir}/usr/local/bin"

            python3.13 -m venv /tmp/ovirt-build-venv
            /tmp/ovirt-build-venv/bin/pip install \
              --no-deps \
              --target="${dist_packages}" \
              "ovirt-imageio==2.5.1" \
              "ovirt-engine-sdk-python==4.6.3"

            mv "${dist_packages}/bin/ovirt-img" "${target.dir}/usr/local/bin/ovirt-img"
            rm -rf "${dist_packages}/bin"

            {
              echo '#!/usr/bin/python3'
              tail -n +2 "${target.dir}/usr/local/bin/ovirt-img"
            } \
              > /tmp/ovirt-img.fixed
            install -m 0755 /tmp/ovirt-img.fixed "${target.dir}/usr/local/bin/ovirt-img"
            rm /tmp/ovirt-img.fixed

            find "${dist_packages}" -name '__pycache__' -type d -exec rm -rf {} + || true
        - uses: spdx@v1
          with:
            license: GPL-2.0-or-later
            name: ovirt-imageio
            purl: pkg:pypi/ovirt-imageio@2.5.1
            version: 2.5.1
        - uses: spdx@v1
          with:
            license: Apache-2.0
            name: ovirt-engine-sdk-python
            purl: pkg:pypi/ovirt-engine-sdk-python@4.6.3
            version: 4.6.3
      outputs:
        - source: ${target.dir}/usr/local/bin/ovirt-img
          target: /usr/local/bin/ovirt-img
          uid: 0
          gid: 0
        - source: ${target.dir}/usr/lib/python3/dist-packages
          target: /usr/lib/python3/dist-packages
          uid: 0
          gid: 0
        - source: /opt/docker/sbom/ovirt-imageio
          target: /opt/docker/sbom/ovirt-imageio
          uid: 0
          gid: 0
        - source: /opt/docker/sbom/ovirt-engine-sdk-python
          target: /opt/docker/sbom/ovirt-engine-sdk-python
          uid: 0
          gid: 0
accounts:
  run-as: "65532"
  users:
    - name: nonroot
      uid: 65532
      gid: 65532
  groups:
    - name: nonroot
      gid: 65532
      members:
        - nonroot
os-release:
  name: Docker Hardened Images (Debian)
  id: debian
  version-id: "13"
  version-codename: trixie
  pretty-name: Docker Hardened Images/Debian GNU/Linux 13 (trixie)
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
work-dir: /home/cdi-importer
paths:
  - type: directory
    path: /usr/local/bin
    uid: 0
    gid: 0
  - type: symlink
    path: /usr/local/bin/cdi-importer
    uid: 0
    gid: 0
    source: /usr/bin/cdi-importer
  - type: symlink
    path: /usr/local/bin/openstack-populator
    uid: 0
    gid: 0
    source: /usr/bin/openstack-populator
  - type: symlink
    path: /usr/local/bin/ovirt-populator
    uid: 0
    gid: 0
    source: /usr/bin/ovirt-populator
  - type: symlink
    path: /usr/local/bin/cdi-containerimage-server
    uid: 0
    gid: 0
    source: /usr/bin/cdi-containerimage-server
  - type: symlink
    path: /usr/local/bin/cdi-image-size-detection
    uid: 0
    gid: 0
    source: /usr/bin/cdi-image-size-detection
  - type: symlink
    path: /usr/local/bin/cdi-source-update-poller
    uid: 0
    gid: 0
    source: /usr/bin/cdi-source-update-poller
  - type: directory
    path: /home/cdi-importer
    uid: 0
    gid: 0
annotations:
  org.opencontainers.image.description: A minimal CDI Importer image
  org.opencontainers.image.licenses: Apache-2.0
entrypoint:
  - /usr/local/bin/cdi-importer
  - -alsologtostderr
ports:
  - 8443/tcp
