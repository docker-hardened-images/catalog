# syntax=dhi.io/build:2-debian13

name: Crossplane 2.4.x
image: dhi.io/crossplane
variant: runtime
tags:
  - "2"
  - "2.4"
  - 2.4.4
  - 2-debian
  - 2-debian13
  - 2.4-debian
  - 2.4-debian13
  - 2.4.4-debian
  - 2.4.4-debian13
platforms:
  - linux/amd64
  - linux/arm64
dates:
  release: "2026-08-20"
vars:
  FLAVORED_SUFFIX: ""
  SEMVER_MAJOR_MINOR_VERSION: "2.4"
  SEMVER_MAJOR_VERSION: "2"
  SEMVER_VERSION: 2.4.4
  SUFFIX: ""
  VERSION: 2.4.4-0
contents:
  repositories:
    - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
  keyring:
    - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
  packages:
    - base-files
    - ca-certificates
    - ca-certificates-bundle
    - crossplane-2.4=2.4.4-0
    - tzdata
  builds:
    - name: cluster-assets
      contents:
        packages:
          - bash
          - crossplane-2.4=2.4.4-0
      pipeline:
        - name: check cluster assets
          runs: |
            set -eux -o pipefail

            test -s /usr/share/crossplane/crds/apiextensions.crossplane.io_compositions.yaml
            test -s /usr/share/crossplane/webhookconfigurations/usage.yaml
      outputs:
        - source: /usr/share/crossplane/crds
          target: /crds
          uid: 0
          gid: 0
        - source: /usr/share/crossplane/webhookconfigurations
          target: /webhookconfigurations
          uid: 0
          gid: 0
accounts:
  run-as: "65532"
  users:
    - name: nonroot
      uid: 65532
      gid: 65532
  groups:
    - name: nonroot
      gid: 65532
      members:
        - nonroot
os-release:
  name: Docker Hardened Images (Debian)
  id: debian
  version-id: "13"
  version-codename: trixie
  pretty-name: Docker Hardened Images/Debian GNU/Linux 13 (trixie)
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
paths:
  - type: directory
    path: /usr/local/bin
    uid: 0
    gid: 0
  - type: symlink
    path: /usr/local/bin/crossplane
    uid: 0
    gid: 0
    source: /usr/bin/crossplane
annotations:
  org.opencontainers.image.description: A minimal Crossplane image
  org.opencontainers.image.licenses: Apache-2.0
entrypoint:
  - /usr/local/bin/crossplane
