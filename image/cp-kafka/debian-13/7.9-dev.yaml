# syntax=dhi.io/build:2-debian13

name: Confluent Platform Kafka 7.9.x (dev)
image: dhi.io/cp-kafka
variant: dev
tags:
  - 7-dev
  - 7.9-dev
  - 7.9.10-dev
  - 7-debian-dev
  - 7-debian13-dev
  - 7.9-debian-dev
  - 7.9-debian13-dev
  - 7.9.10-debian-dev
  - 7.9.10-debian13-dev
platforms:
  - linux/amd64
  - linux/arm64
dates:
  release: "2025-02-19"
vars:
  COMMIT_SHA: ffd841688b14b1cbf5f3b1c2873ebb53098b172f
  COMMON_DOCKER_COMMIT_SHA: bdae688c8d580c6860a0cf427d9be1cb4b13ed73
  COMMON_DOCKER_VERSION: 7.9.10
  DUB_VERSION: 0.0.172-10
  JAVA_FIPS_SUFFIX: ""
  JAVA_VERSION: 1:17.0.20.1+1-4
  JDK_MAJOR_VERSION: "17"
  KAFKA_PACKAGE: kafka-3.9
  KAFKA_VERSION: 3.9.2-1
  PACKAGE_FIPS_SUFFIX: ""
  SEMVER_MAJOR_MINOR_VERSION: "7.9"
  SEMVER_MAJOR_VERSION: "7"
  SEMVER_VERSION: 7.9.10
  VERSION: 7.9.10
contents:
  repositories:
    - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
  keyring:
    - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
  packages:
    - '!gawk'
    - '!libelogind0'
    - '!mawk'
    - '!original-awk'
    - apt
    - base-files
    - bash
    - ca-certificates
    - ca-certificates-bundle
    - confluent-docker-utils=0.0.172-10
    - coreutils
    - diffutils
    - dpkg
    - eclipse-temurin-17-jre-oci-config=1:17.0.20.1+1-4
    - eclipse-temurin-17-jre=1:17.0.20.1+1-4
    - findutils
    - grep
    - hostname
    - kafka-3.9=3.9.2-1
    - libasound2t64
    - libc-bin
    - libgcc-s1
    - libstdc++6
    - mawk
    - perl-base
    - procps
    - python-3.13
    - sed
    - tzdata
    - util-linux
  builds:
    - name: confluent-launch-scripts
      work-dir: ${source.dir}/kafka-images/kafka/include/etc/confluent/docker
      contents:
        packages:
          - bash
          - coreutils
          - grep
          - sed
        files:
          - url: git+https://github.com/confluentinc/kafka-images.git#v7.9.10
            checksum: ffd841688b14b1cbf5f3b1c2873ebb53098b172f
            path: ${source.dir}/kafka-images
            spdx:
              name: kafka-images
              version: 7.9.10
              packages:
                - name: kafka-images
                  purl: pkg:github/confluentinc/kafka-images@7.9.10
                  license: Apache-2.0
            uid: 0
            gid: 0
          - url: git+https://github.com/confluentinc/common-docker.git#v7.9.10
            checksum: bdae688c8d580c6860a0cf427d9be1cb4b13ed73
            path: ${source.dir}/common-docker
            spdx:
              name: common-docker
              version: 7.9.10
              packages:
                - name: common-docker
                  purl: pkg:github/confluentinc/common-docker@7.9.10
                  license: Apache-2.0
            uid: 0
            gid: 0
      pipeline:
        - name: stage confluent launch scripts
          runs: |
            set -eux -o pipefail

            DEST="${target.dir}/etc/confluent/docker"
            mkdir -p "$DEST"

            for f in *; do
              case "$f" in
                configure | ensure | launch | run | *.template) ;;
                *)
                  echo "FATAL: unhandled upstream launch-script file: $f" >&2
                  exit 1
                  ;;
              esac
            done

            for f in configure ensure launch run; do
              install -m 0755 "$f" "$DEST/$f"
            done
            for f in *.template; do
              install -m 0644 "$f" "$DEST/$f"
            done

            install -m 0644 \
              "${source.dir}/common-docker/base/include/etc/confluent/docker/bash-config" \
              "$DEST/bash-config"

            test -f "$DEST/kafka.properties.template"
        - name: replace cub invocations
          runs: |
            set -eux -o pipefail

            DEST="${target.dir}/etc/confluent/docker"

            grep -qF 'KAFKA_LISTENERS=$(cub listeners "$KAFKA_ADVERTISED_LISTENERS")' "$DEST/configure"
            sed -i 's@KAFKA_LISTENERS=$(cub listeners "$KAFKA_ADVERTISED_LISTENERS")@KAFKA_LISTENERS=$(sed -E "s#://[^:]*:#://0.0.0.0:#g" <<< "$KAFKA_ADVERTISED_LISTENERS")@' \
              "$DEST/configure"

            grep -qF 'cub zk-ready "$KAFKA_ZOOKEEPER_CONNECT" "${KAFKA_CUB_ZK_TIMEOUT:-40}"' "$DEST/ensure"
            sed -i 's@cub zk-ready "$KAFKA_ZOOKEEPER_CONNECT" "${KAFKA_CUB_ZK_TIMEOUT:-40}"@/etc/confluent/docker/zk-ready "$KAFKA_ZOOKEEPER_CONNECT" "${KAFKA_CUB_ZK_TIMEOUT:-40}"@' \
              "$DEST/ensure"
            install -m 0755 "${source.dir}/zk-ready" "$DEST/zk-ready"

            ! grep -nE '(^|[^a-z])cub ' "$DEST/configure" "$DEST/ensure" "$DEST/launch" "$DEST/run"
      paths:
        - type: file
          path: ${source.dir}/zk-ready
          uid: 0
          gid: 0
          source: image/cp-kafka/bin/zk-ready
      outputs:
        - source: ${target.dir}/etc/confluent/docker
          target: /etc/confluent/docker
          uid: 0
          gid: 0
        - source: /opt/docker/sbom/kafka-images
          target: /opt/docker/sbom/kafka-images
          uid: 0
          gid: 0
        - source: /opt/docker/sbom/common-docker
          target: /opt/docker/sbom/common-docker
          uid: 0
          gid: 0
    - name: kafka-command-wrappers
      contents:
        packages:
          - bash
          - coreutils
          - kafka-3.9=3.9.2-1
      pipeline:
        - name: generate bare-name wrappers
          runs: |
            set -eux -o pipefail

            BIN="${target.dir}/usr/bin"
            mkdir -p "$BIN"

            test -f /usr/share/kafka/bin/kafka-server-start.sh
            test -f /usr/share/kafka/bin/kafka-run-class.sh

            for f in /usr/share/kafka/bin/*.sh; do
              name="$(basename "$f" .sh)"
              case "$name" in
                kafka-server-start | kafka-server-stop | zookeeper-server-stop | trogdor)
                  continue
                  ;;
              esac
              printf '#!/bin/bash\nexec %s "$@"\n' "$f" > "$BIN/$name"
              chmod 0755 "$BIN/$name"
            done
      outputs:
        - source: ${target.dir}/usr/bin
          target: /usr/bin
          uid: 0
          gid: 0
    - name: locale
      contents:
        packages:
          - bash
          - locales
          - coreutils
          - gzip
      pipeline:
        - name: install locales
          runs: |
            set -eux -o pipefail

            ln -s /etc/locale.alias /usr/share/locale/locale.alias

            echo "en_US.UTF-8 UTF-8" >> /etc/locale.gen
            locale-gen en_US.UTF-8
      outputs:
        - source: /usr/share/locale
          target: /usr/share/locale
          uid: 0
          gid: 0
        - source: /usr/lib/locale
          target: /usr/lib/locale
          uid: 0
          gid: 0
accounts:
  root: true
  run-as: root
  users:
    - name: appuser
      uid: 1000
      gid: 1000
    - name: _apt
      uid: 42
      gid: 65532
  groups:
    - name: appuser
      gid: 1000
      members:
        - appuser
os-release:
