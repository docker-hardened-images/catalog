metadata:
  display-name: Datadog Agent
  short-description: The Datadog Agent collects metrics, traces, and logs from your infrastructure and applications and sends them to the Datadog platform.
  featured: false
  home-url: https://docs.datadoghq.com/agent/
  categories:
    - monitoring-and-observability
  included-tools:
    - name: agent
      description: Core Datadog Agent for metric collection, service checks, and orchestration
    - name: trace-agent
      description: APM trace collection and forwarding agent
    - name: process-agent
      description: Standalone process agent (ships for parity; the core agent runs the process checks)
    - name: security-agent
      description: Cloud Security Management agent
