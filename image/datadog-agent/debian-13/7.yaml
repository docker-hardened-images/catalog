    uid: 0
    gid: 0
    mode: "0644"
    source: image/datadog-agent/licenses/msodbcsql18-LICENSE.txt
  - type: directory
    path: /opt/datadog-agent/run
    uid: 100
    gid: 100
    mode: "0770"
  - type: directory
    path: /var/log/datadog
    uid: 100
    gid: 100
    mode: "0770"
  - type: directory
    path: /etc/datadog-agent
    uid: 100
    gid: 100
    mode: "0770"
  - type: directory
    path: /var/run/datadog
    uid: 100
    gid: 100
    mode: "0770"
  - type: directory
    path: /opt/datadog-agent/embedded
    uid: 0
    gid: 0
    mode: "0755"
  - type: directory
    path: /usr
    uid: 0
    gid: 0
    mode: "0755"
  - type: directory
    path: /usr/lib
    uid: 0
    gid: 0
    mode: "0755"
  - type: directory
    path: /usr/lib64
    uid: 0
    gid: 0
    mode: "0755"
  - type: directory
    path: /usr/share
    uid: 0
