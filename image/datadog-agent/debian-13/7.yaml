# syntax=dhi.io/build:2-debian13

name: Datadog Agent 7.x
image: dhi.io/datadog-agent
variant: runtime
tags:
  - "7"
  - "7.85"
  - 7.85.4
  - 7-debian
  - 7-debian13
  - 7.85-debian
  - 7.85-debian13
  - 7.85.4-debian
  - 7.85.4-debian13
platforms:
  - linux/amd64
  - linux/arm64
dates:
  release: "2019-12-18"
vars:
  COMMIT_SHA: 52568a4d2e3322d854091c4882b474bd4ca8591f
  INTEGRATIONS_VERSION: 7.85.4-1
  JAVA_FIPS_SUFFIX: ""
  JAVA_VERSION: 1:11.0.33+10-0
  JMXFETCH_VERSION: 0.52.0-4
  LIBTIRPC_VERSION: 1.3.6+ds-1+deb13u0+dhi2
  MSODBC_VERSION: 18.7.1.1-1
  PACKAGE_FIPS_SUFFIX: ""
  PYTHON_VERSION: 3.13.18-7
  SECRET_CONNECTOR_VERSION: 7.85.4-0
  SEMVER_MAJOR_MINOR_VERSION: "7.85"
  SEMVER_MAJOR_VERSION: "7"
  SEMVER_VERSION: 7.85.4
  VERSION: 7.85.4-0
contents:
  repositories:
    - deb [signed-by=/usr/share/keyrings/microsoft-signing-key.asc] https://packages.microsoft.com/debian/13/prod trixie main
    - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
  keyring:
    - https://packages.microsoft.com/keys/microsoft-2025.asc
    - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
  packages:
    - '!libelogind0'
    - '!mawk'
    - '!original-awk'
    - base-files
    - ca-certificates
    - ca-certificates-bundle
    - datadog-agent-core-7=7.85.4-0
    - datadog-agent-integrations-7=7.85.4-1
    - datadog-agent-jmxfetch-7=0.52.0-4
    - datadog-agent-process-7=7.85.4-0
    - datadog-agent-security-7=7.85.4-0
    - datadog-agent-trace-7=7.85.4-0
    - eclipse-temurin-11-jre-oci-config=1:11.0.33+10-0
    - eclipse-temurin-11-jre=1:11.0.33+10-0
    - iproute2
    - libasound2t64
    - libbz2-1.0
    - libc6
    - libffi8
    - libgcc-s1
    - libgdbm-compat4t64
    - libgdbm6
    - libgssapi-krb5-2
    - libkrb5-3
    - liblz4-1
    - libncursesw6
    - libodbc2
    - libpq5
    - libpython-3.13-minimal=3.13.18-7
    - libpython-3.13-stdlib=3.13.18-7
    - libpython-3.13=3.13.18-7
    - libsasl2-2
    - libseccomp2
    - libsqlite3-0
    - libssl3t64
    - libstdc++6
    - libtirpc-common=1.3.6+ds-1+deb13u0+dhi2
    - libtirpc3t64=1.3.6+ds-1+deb13u0+dhi2
    - libuuid1
    - libxml2
    - libxslt1.1
    - libzstd1
    - msodbcsql18=18.7.1.1-1
    - python-3.13-minimal=3.13.18-7
    - python-3.13=3.13.18-7
    - tdsodbc
    - tzdata
    - zlib1g
  builds:
    - name: stage secret-generic-connector
      contents:
        packages:
          - bash
          - coreutils
          - datadog-agent=7.85.4-0
      pipeline:
        - name: relayout
          runs: |
            set -eux -o pipefail

            install -D -o 0 -g secret-manager -m 0550 \
              /usr/bin/secret-generic-connector \
              /opt/datadog-agent/embedded/bin/secret-generic-connector
      accounts:
        groups:
          - name: secret-manager
            gid: 101
      outputs:
        - source: /opt/datadog-agent/embedded/bin/secret-generic-connector
          target: /opt/datadog-agent/embedded/bin/secret-generic-connector
          uid: 0
          gid: 0
        - source: /opt/docker/sbom/datadog-agent
          target: /opt/docker/sbom/datadog-agent
          uid: 0
          gid: 0
        - source: /usr/share/doc/datadog-agent/copyright
          target: /usr/share/doc/datadog-agent/copyright
          uid: 0
          gid: 0
accounts:
  run-as: dd-agent
  users:
    - name: dd-agent
      uid: 100
      gid: 100
  groups:
    - name: dd-agent
      gid: 100
      members:
        - dd-agent
    - name: secret-manager
      gid: 101
      members:
        - dd-agent
os-release:
  name: Docker Hardened Images (Debian)
  id: debian
  version-id: "13"
  version-codename: trixie
  pretty-name: Docker Hardened Images/Debian GNU/Linux 13 (trixie)
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
work-dir: /opt/datadog-agent/run
environment:
  CURL_CA_BUNDLE: /etc/ssl/certs/ca-certificates.crt
  DD_GIT_COMMIT_SHA: 52568a4d2e3322d854091c4882b474bd4ca8591f
  DD_GIT_REPOSITORY_URL: https://github.com/DataDog/datadog-agent
  DD_SECRET_BACKEND_COMMAND_ALLOW_GROUP_EXEC_PERM: "true"
  DOCKER_DD_AGENT: "true"
  JAVA_HOME: /usr/lib/jvm/temurin-11
  LD_LIBRARY_PATH: /opt/datadog-agent/embedded/lib:/opt/mqm/lib64
  LD_PRELOAD: /opt/lib/nosys.so
  PATH: /opt/datadog-agent/bin:/opt/datadog-agent/embedded/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin:/usr/lib/jvm/temurin-11/bin
  PYTHONPATH: /opt/datadog-agent/embedded/lib/python3.13/site-packages
paths:
