    uid: 0
    gid: 0
    mode: "0755"
  - type: symlink
    path: /bin/agent
    uid: 0
    gid: 0
    source: /opt/datadog-agent/bin/agent/agent
annotations:
  org.opencontainers.image.description: A minimal Datadog Agent image
  org.opencontainers.image.licenses: Apache-2.0
