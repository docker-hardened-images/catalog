# syntax=dhi.io/build:2-debian13

name: Jenkins Inbound Agent (latest) (dev)
image: dhi.io/jenkins-inbound-agent
variant: dev
tags:
  - 3390-dev
  - 3390-debian-dev
  - 3390-debian13-dev
platforms:
  - linux/amd64
  - linux/arm64
dates:
  release: "2026-06-23"
vars:
  JAVA_FIPS_SUFFIX: ""
  JAVA_HOME_PATH: /usr/lib/jvm/temurin-21
  JAVA_MAJOR_VERSION: "21"
  REMOTING_MAJOR_VERSION: "3390"
  VERSION: 3390.v3381cf39b~501-0
contents:
  repositories:
    - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
  keyring:
    - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
  packages:
    - '!gawk'
    - '!libelogind0'
    - '!mawk'
    - '!original-awk'
    - apt
    - base-files
    - bash
    - ca-certificates
    - coreutils
    - diffutils
    - dpkg
    - eclipse-temurin-21-jre
    - eclipse-temurin-21-jre-oci-config
    - findutils
    - git
    - grep
    - jenkins-inbound-agent=3390.v3381cf39b~501-0
    - libc-bin
    - mawk
    - openssh-client
    - perl-base
    - sed
    - tzdata
    - util-linux
  builds:
    - name: locale
      contents:
        packages:
          - bash
          - locales
          - coreutils
          - gzip
      pipeline:
        - name: install locales
          runs: |
            set -eux -o pipefail

            ln -s /etc/locale.alias /usr/share/locale/locale.alias

            echo "en_US.UTF-8 UTF-8" >> /etc/locale.gen
            locale-gen en_US.UTF-8
      outputs:
        - source: /usr/share/locale
          target: /usr/share/locale
          uid: 0
          gid: 0
        - source: /usr/lib/locale
          target: /usr/lib/locale
          uid: 0
          gid: 0
accounts:
  root: true
  run-as: root
  users:
    - name: jenkins
      uid: 1000
      gid: 1000
    - name: _apt
      uid: 42
      gid: 65532
  groups:
    - name: jenkins
      gid: 1000
      members:
        - jenkins
os-release:
  name: Docker Hardened Images (Debian)
  id: debian
  version-id: "13"
  version-codename: trixie
  pretty-name: Docker Hardened Images/Debian GNU/Linux 13 (trixie)
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
work-dir: /home/jenkins
environment:
  AGENT_WORKDIR: /home/jenkins/agent
  DEBIAN_FRONTEND: noninteractive
  JAVA_HOME: /usr/lib/jvm/temurin-21
  LANG: en_US.UTF-8
  LANGUAGE: en_US:en
  LC_ALL: en_US.UTF-8
  TZ: Etc/UTC
  USER: jenkins
paths:
  - type: directory
    path: /home/jenkins
    uid: 1000
    gid: 1000
    mode: "0755"
  - type: directory
    path: /home/jenkins/agent
    uid: 1000
    gid: 1000
    mode: "0755"
  - type: directory
    path: /home/jenkins/.jenkins
    uid: 1000
    gid: 1000
    mode: "0755"
  - type: directory
    path: /usr/local/bin
    uid: 0
    gid: 0
  - type: symlink
    path: /usr/local/bin/jenkins-agent
    uid: 0
    gid: 0
    source: /usr/bin/jenkins-agent
annotations:
  org.opencontainers.image.description: A Jenkins Inbound Agent image for Kubernetes and containerized environments
  org.opencontainers.image.licenses: MIT
entrypoint:
  - /usr/local/bin/jenkins-agent
