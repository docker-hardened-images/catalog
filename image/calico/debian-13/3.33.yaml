# syntax=dhi.io/build:2-debian13

name: Calico 3.33.x
image: dhi.io/calico
variant: runtime
tags:
  - "3"
  - "3.33"
  - 3.33.0
  - v3.33.0
  - 3-debian
  - 3-debian13
  - 3.33-debian
  - 3.33-debian13
  - 3.33.0-debian
  - 3.33.0-debian13
platforms:
  - linux/amd64
  - linux/arm64
dates:
  release: "2026-09-28"
vars:
  FLAVORED_SUFFIX: ""
  NDR_PACKAGE_VERSION: 3.33.0-0
  PACKAGE_VERSION: 3.33.0-0
  SEMVER_MAJOR_MINOR_VERSION: "3.33"
  SEMVER_MAJOR_VERSION: "3"
  SEMVER_VERSION: 3.33.0
  SUFFIX: ""
  VERSION: 3.33.0
contents:
  repositories:
    - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
  keyring:
    - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
  packages:
    - base-files
    - ca-certificates-bundle
    - calico-3.33=3.33.0-0
    - calico-node-driver-registrar-3.33=3.33.0-0
    - tzdata
accounts:
  run-as: nonroot
  users:
    - name: nonroot
      uid: 65532
      gid: 65532
  groups:
    - name: nonroot
      gid: 65532
      members:
        - nonroot
os-release:
  name: Docker Hardened Images (Debian)
  id: debian
  version-id: "13"
  version-codename: trixie
  pretty-name: Docker Hardened Images/Debian GNU/Linux 13 (trixie)
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
paths:
  - type: symlink
    path: /usr/bin/calicoctl
    uid: 0
    gid: 0
    source: /usr/bin/calico
  - type: symlink
    path: /usr/bin/calico-ipam
    uid: 0
    gid: 0
    source: /usr/bin/calico
  - type: symlink
    path: /usr/bin/csi-node-driver-registrar
    uid: 0
    gid: 0
    source: /usr/bin/node-driver-registrar
annotations:
  org.opencontainers.image.description: A minimal Calico image
  org.opencontainers.image.licenses: Apache-2.0
entrypoint:
  - /usr/bin/calico
