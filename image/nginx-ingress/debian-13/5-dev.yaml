# syntax=dhi.io/build:2-debian13

name: Nginx Ingress 5.x (dev)
image: dhi.io/nginx-ingress
variant: dev
tags:
  - 5-dev
  - 5.6-dev
  - 5.6.1-dev
  - 5-debian-dev
  - 5-debian13-dev
  - 5.6-debian-dev
  - 5.6-debian13-dev
  - 5.6.1-debian-dev
  - 5.6.1-debian13-dev
platforms:
  - linux/amd64
  - linux/arm64
dates:
  release: "2025-04-16"
vars:
  FLAVORED_SUFFIX: -dev
  RUNTIME_SUFFIX: ""
  SEMVER_MAJOR_MINOR_VERSION: "5.6"
  SEMVER_MAJOR_VERSION: "5"
  SEMVER_VERSION: 5.6.1
  SETCAP_DEV_SUFFIX: -dev
  SUFFIX: ""
  VERSION: 5.6.1-0
contents:
  repositories:
    - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
  keyring:
    - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
  packages:
    - '!gawk'
    - '!libelogind0'
    - '!original-awk'
    - apt
    - base-files
    - bash
    - ca-certificates
    - ca-certificates-bundle
    - coreutils
    - dash
    - diffutils
    - dpkg
    - findutils
    - gcc-14-base
    - grep
    - libc-bin
    - libc6
    - libcrypt1
    - libgcc-s1
    - libgrpc++1.51t64
    - libgrpc29t64
    - libpcre2-8-0
    - libprotobuf32t64
    - libssl3t64
    - libstdc++6
    - libxml2
    - mawk
    - nginx-ingress-dev=5.6.1-0
    - nginx-ingress=5.6.1-0
    - nginx-mainline
    - nginx-mainline-module-njs
    - nginx-mainline-module-otel
    - opentelemetry-cpp
    - perl-base
    - sed
    - tzdata
    - util-linux
    - zlib1g
  builds:
    - name: setcap nginx
      contents:
        repositories:
          - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
        keyring:
          - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
        packages:
          - bash
          - base-files
          - coreutils
          - libcap2-bin
          - nginx-mainline
      pipeline:
        - name: setcap
          runs: |
            set -eux -o pipefail

            setcap 'cap_net_bind_service=+eip' /usr/sbin/nginx
            setcap -v 'cap_net_bind_service=+eip' /usr/sbin/nginx

            # nginx-debug ships in nginx-mainline alongside nginx and upstream
            # grants it the same capability so debug builds can also bind
            # privileged ports.
            setcap 'cap_net_bind_service=+eip' /usr/sbin/nginx-debug
            setcap -v 'cap_net_bind_service=+eip' /usr/sbin/nginx-debug

            chown -R 101:0 /etc/nginx
            chmod -R g+w /etc/nginx
      outputs:
        - source: /usr/sbin/nginx
          target: /usr/sbin/nginx
          uid: 0
          gid: 0
        - source: /usr/sbin/nginx-debug
          target: /usr/sbin/nginx-debug
          uid: 0
          gid: 0
        - source: /etc/nginx
          target: /etc/nginx
          uid: 101
          gid: 0
    - name: setcap nginx-ingress
      contents:
        repositories:
          - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
          - deb [signed-by=/usr/share/keyrings/dhi-deb-security.gpg] http://dhi.io/deb/debian/security trixie main
        keyring:
          - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
          - https://dhi.io/keyring/dhi-deb-sec-gpg.D46852F6925E9F71.key
        packages:
          - bash
          - coreutils
          - libcap2-bin
          - nginx-ingress=5.6.1-0
          - nginx-ingress-dev=5.6.1-0
      pipeline:
        - name: setcap
          runs: |
            set -eux -o pipefail

            setcap 'cap_net_bind_service=+ep' /usr/bin/nginx-ingress
            setcap -v 'cap_net_bind_service=+ep' /usr/bin/nginx-ingress

            chmod 0640 /etc/nginx-agent/nginx-agent.conf
      outputs:
        - source: /usr/bin/nginx-ingress
          target: /usr/bin/nginx-ingress
          uid: 0
          gid: 0
        - source: /etc/nginx-agent/nginx-agent.conf
          target: /etc/nginx-agent/nginx-agent.conf
          uid: 0
          gid: 0
          mode: "0640"
accounts:
  root: true
  run-as: root
  users:
    - name: "101"
      uid: 101
      gid: 0
    - name: _apt
      uid: 42
      gid: 65532
  groups:
    - name: nonroot
      gid: 65532
      members:
        - nonroot
os-release:
  name: Docker Hardened Images (Debian)
  id: debian
  version-id: "13"
  version-codename: trixie
  pretty-name: Docker Hardened Images/Debian GNU/Linux 13 (trixie)
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
environment:
  BUILD_OS: debian
  DEBIAN_FRONTEND: noninteractive
paths:
  - type: symlink
    path: /nginx-ingress
    uid: 0
    gid: 0
    source: /usr/bin/nginx-ingress
  - type: symlink
    path: /nginx.ingress.tmpl
    uid: 0
    gid: 0
    source: /usr/share/nginx-ingress/nginx.ingress.tmpl
  - type: symlink
    path: /nginx.tmpl
    uid: 0
    gid: 0
    source: /usr/share/nginx-ingress/nginx.tmpl
  - type: symlink
    path: /nginx.virtualserver.tmpl
    uid: 0
    gid: 0
    source: /usr/share/nginx-ingress/nginx.virtualserver.tmpl
  - type: symlink
    path: /nginx.transportserver.tmpl
    uid: 0
    gid: 0
    source: /usr/share/nginx-ingress/nginx.transportserver.tmpl
  - type: directory
    path: /etc/nginx-agent
    uid: 101
    gid: 0
  - type: directory
    path: /var/lib/nginx-agent
    uid: 101
    gid: 0
  - type: directory
    path: /var/log/nginx-agent
    uid: 101
    gid: 0
  - type: directory
    path: /etc/nginx/secrets
    uid: 101
    gid: 0
  - type: directory
    path: /var/lib/nginx/stream-config.d
    uid: 101
    gid: 0
  - type: directory
    path: /etc/nginx
    uid: 101
    gid: 0
  - type: directory
    path: /var/cache/nginx
    uid: 101
    gid: 0
  - type: directory
    path: /var/lib/nginx
    uid: 101
    gid: 0
  - type: directory
    path: /var/log/nginx
    uid: 101
    gid: 0
annotations:
  org.opencontainers.image.description: A minimal Nginx Ingress image
  org.opencontainers.image.licenses: Apache-2.0
entrypoint:
  - /nginx-ingress
ports:
  - "80"
  - "443"
