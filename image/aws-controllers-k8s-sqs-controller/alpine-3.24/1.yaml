    - aws-controllers-k8s-sqs-controller-1=1.9.0-r0
    - ca-certificates-bundle
    - tzdata
accounts:
  run-as: "65532"
  users:
    - name: nonroot
      uid: 65532
      gid: 65532
  groups:
    - name: nonroot
      gid: 65532
      members:
        - nonroot
os-release:
