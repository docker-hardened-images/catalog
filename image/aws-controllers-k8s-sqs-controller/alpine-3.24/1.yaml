# syntax=dhi.io/build:2-alpine3.24

name: AWS Controllers for Kubernetes SQS controller 1.x
image: dhi.io/aws-controllers-k8s-sqs-controller
variant: runtime
tags:
  - 1-alpine
  - 1.9-alpine
  - 1-alpine3.24
  - 1.9.0-alpine
  - 1.9-alpine3.24
  - 1.9.0-alpine3.24
platforms:
  - linux/amd64
  - linux/arm64
dates:
  release: "2023-04-04"
vars:
