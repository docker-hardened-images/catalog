# syntax=dhi.io/build:2-debian13

name: AWS Controllers for Kubernetes SQS controller 1.x
image: dhi.io/aws-controllers-k8s-sqs-controller
variant: runtime
tags:
  - "1"
  - "1.9"
  - 1.9.0
  - 1-debian
  - 1-debian13
  - 1.9-debian
  - 1.9-debian13
  - 1.9.0-debian
  - 1.9.0-debian13
platforms:
  - linux/amd64
  - linux/arm64
dates:
  release: "2023-04-04"
vars:
  DEBIAN_EPOCH_MAJOR_MINOR_VERSION: "1.9"
  DEBIAN_EPOCH_MAJOR_VERSION: "1"
  DEBIAN_EPOCH_VERSION: 1.9.0
  FLAVORED_SUFFIX: ""
  SUFFIX: ""
  VERSION: 1.9.0-0
contents:
  repositories:
    - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
  keyring:
    - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
  packages:
    - '!libelogind0'
    - '!mawk'
    - '!original-awk'
    - aws-controllers-k8s-sqs-controller-1=1.9.0-0
    - base-files
    - ca-certificates-bundle
    - tzdata
accounts:
  run-as: "65532"
  users:
    - name: nonroot
      uid: 65532
      gid: 65532
  groups:
    - name: nonroot
      gid: 65532
      members:
        - nonroot
os-release:
  name: Docker Hardened Images (Debian)
  id: debian
  version-id: "13"
  version-codename: trixie
  pretty-name: Docker Hardened Images/Debian GNU/Linux 13 (trixie)
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
work-dir: /
environment:
  HOME: /
paths:
  - type: symlink
    path: /usr/bin/controller
    uid: 0
    gid: 0
    source: /usr/bin/ack-sqs-controller
annotations:
  org.opencontainers.image.description: A minimal ACK SQS controller image
  org.opencontainers.image.licenses: Apache-2.0
entrypoint:
  - /bin/controller
ports:
  - 8080/tcp
  - 8081/tcp
