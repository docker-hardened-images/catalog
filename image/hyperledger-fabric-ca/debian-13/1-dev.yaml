# syntax=dhi.io/build:2-debian13

name: Hyperledger Fabric CA 1.5.x (dev)
image: dhi.io/hyperledger-fabric-ca
variant: dev
tags:
  - 1-dev
  - 1.5-dev
  - 1.5.22-dev
  - 1-debian-dev
  - 1-debian13-dev
  - 1.5-debian-dev
  - 1.5-debian13-dev
  - 1.5.22-debian-dev
  - 1.5.22-debian13-dev
platforms:
  - linux/amd64
  - linux/arm64
dates:
  release: "2026-02-06"
vars:
  FLAVORED_SUFFIX: -dev
  SEMVER_MAJOR_MINOR_VERSION: "1.5"
  SEMVER_MAJOR_VERSION: "1"
  SEMVER_VERSION: 1.5.22
  SUFFIX: -dev
  VERSION: 1.5.22-13
contents:
  repositories:
    - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
  keyring:
    - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
  packages:
    - '!gawk'
    - '!libelogind0'
    - '!original-awk'
    - apt
    - base-files
    - bash
    - ca-certificates
    - ca-certificates-bundle
    - coreutils
    - diffutils
    - dpkg
    - fabric-ca-dev=1.5.22-13
    - fabric-ca-server-dev=1.5.22-13
    - findutils
    - grep
    - libc-bin
    - libc6
    - mawk
    - perl-base
    - sed
    - tzdata
    - util-linux
accounts:
  root: true
  run-as: root
  users:
    - name: nonroot
      uid: 65532
      gid: 65532
    - name: _apt
      uid: 42
      gid: 65532
  groups:
    - name: nonroot
      gid: 65532
      members:
        - nonroot
os-release:
  name: Docker Hardened Images (Debian)
  id: debian
  version-id: "13"
  version-codename: trixie
  pretty-name: Docker Hardened Images/Debian GNU/Linux 13 (trixie)
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
environment:
  DEBIAN_FRONTEND: noninteractive
  FABRIC_CA_HOME: /etc/hyperledger/fabric-ca-server
paths:
  - type: directory
    path: /usr/local/bin
    uid: 0
    gid: 0
  - type: directory
    path: /etc/hyperledger/fabric-ca-server
    uid: 65532
    gid: 65532
    mode: "0744"
  - type: symlink
    path: /usr/local/bin/fabric-ca-server
    uid: 0
    gid: 0
    source: /usr/bin/fabric-ca-server
  - type: symlink
    path: /usr/local/bin/fabric-ca-client
    uid: 0
    gid: 0
    source: /usr/bin/fabric-ca-client
annotations:
  org.opencontainers.image.description: A minimal Hyperledger Fabric CA image
  org.opencontainers.image.licenses: Apache-2.0
cmd:
  - fabric-ca-server
  - version
ports:
  - 7054/tcp
