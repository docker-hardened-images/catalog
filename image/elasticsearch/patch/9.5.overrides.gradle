// Gradle init script: force CVE-remediated dependency versions at resolution time.
//
// Replaces the per-version `.patch` files that previously edited
// `build-tools-internal/version.properties`, `gradle/build.versions.toml`,
// `gradle/verification-metadata.xml`, and individual module build.gradle files.
// The matching definition step regenerates verification-metadata.xml via
// `./gradlew --write-verification-metadata sha256 ...` so the forced artifacts
// pass strict dependency verification.
//
// Each rule matches the exact old version the upstream tag ships with, so this
// is a deterministic override (not a blanket "always-bump" rule). To support a
// new upstream point release, update only the version literals below.

allprojects {
    configurations.all {
        resolutionStrategy.eachDependency { details ->
            def grp = details.requested.group
            def name = details.requested.name
            def ver = details.requested.version

            // Jackson 2.15.0 / 2.17.2 / 2.18.8 -> 2.18.9; 2.19.2 / 2.21.3 -> 2.21.5.
            // Upstream pins 2.18.8 in version.properties and may still resolve older
            // jackson lines transitively. 2.18.9 / 2.21.5 fix the jackson-databind
            // PTV bypass family (CVE-2026-54512, -54513, -54514, -54515) and
            // @JsonView bypass vulnerabilities (CVE-2026-59888, CVE-2026-59889,
            // GHSA-mhm7-754m-9p8w).
            if (grp != null && grp.startsWith("com.fasterxml.jackson")
                    && (ver == "2.15.0" || ver == "2.17.2" || ver == "2.18.8")) {
                details.useVersion("2.18.9")
                details.because("CVE remediation: CVE-2026-54515, CVE-2026-59889, GHSA-mhm7-754m-9p8w")
            }
            if (grp != null && grp.startsWith("com.fasterxml.jackson")
                    && ver == "2.19.2") {
                details.useVersion("2.21.5")
                details.because("CVE remediation: GHSA-r7wm-3cxj-wff9, GHSA-72hv-8253-57qq, CVE-2026-54512, CVE-2026-54513, CVE-2026-54514, CVE-2026-54515, CVE-2026-59888, CVE-2026-59889, GHSA-mhm7-754m-9p8w")
            }
            if (grp != null && grp.startsWith("com.fasterxml.jackson")
                    && ver == "2.21.3") {
                details.useVersion("2.21.5")
                details.because("CVE remediation: CVE-2026-59888, GHSA-mhm7-754m-9p8w, GHSA-r7wm-3cxj-wff9")
            }

            // parquet-hadoop-bundle 1.17.0 shades jackson-core/databind 2.19.2
            // (esql-datasource-iceberg / esql-datasource-parquet). Gradle
            // resolutionStrategy cannot rewrite shaded classes; 1.17.1 is the
            // latest bundle and embeds jackson 2.21.3 instead.
            if (grp == "org.apache.parquet" && name == "parquet-hadoop-bundle"
                    && ver == "1.17.0") {
                details.useVersion("1.17.1")
                details.because("CVE remediation: parquet-hadoop-bundle 1.17.1 embeds jackson 2.21.3 (was 2.19.2 in 1.17.0)")
            }

            // Netty 4.1.133.Final -> 4.1.135.Final for transitive deps. 9.5.0
            // already pins 4.1.135.Final in version.properties. Do NOT bump all
            // io.netty artifacts to 4.1.136.Final on 9.5: Netty 4.1.136 rewrites
            // FlowControlHandler auto-read behavior and breaks FIPS HTTPS
            // (TestFipsEnd2End). Remaining Netty CVEs on other 4.1.135.Final
            // modules are VEXed as under_investigation.
            if (grp == "io.netty" && ver == "4.1.133.Final") {
                details.useVersion("4.1.135.Final")
                details.because("CVE remediation: CVE-2026-44249, CVE-2026-45416, CVE-2026-45674, CVE-2026-47691, CVE-2026-45673, CVE-2026-47244")
            }

            // CVE-2026-73508: netty-codec-dns resource leak fixed in 4.1.136.Final.
            // Bump only this module — a full Netty 4.1.136 upgrade breaks FIPS HTTPS
            // on 9.x (FlowControlHandler in netty-handler).
            if (grp == "io.netty" && name == "netty-codec-dns" && ver == "4.1.135.Final") {
                details.useVersion("4.1.136.Final")
                details.because("CVE remediation: CVE-2026-73508")
            }

            // Reactor Netty 1.0.45 -> 1.2.8 (modules/repository-azure pins
            // azureReactorNetty=1.0.45 and x-pack/plugin/esql-datasource-azure
            // declares reactor-netty-core/http=1.0.45 directly)
            if (grp == "io.projectreactor.netty"
                    && (name == "reactor-netty-core" || name == "reactor-netty-http")
                    && ver == "1.0.45") {
                details.useVersion("1.2.8")
                details.because("CVE remediation: pin reactor-netty")
            }

            // Elastic APM agent 1.55.0 / 1.55.6 -> 1.56.0 (modules/apm; 1.55.6 fat jar
            // embeds log4j-api 2.25.4, fixed in 1.56.0 with log4j-api 2.26.0)
            if (grp == "co.elastic.apm" && name == "elastic-apm-agent-java8"
                    && (ver == "1.55.0" || ver == "1.55.6")) {
                details.useVersion("1.56.0")
                details.because("CVE remediation: CVE-2026-49844 pin elastic-apm-agent-java8")
            }

            // Log4j 2.19.0 / 2.25.0 / 2.25.4 / 2.26.0 -> 2.26.1 for legacy transitive pins.
            // 9.5.0 ships log4j 2.26.1 in version.properties.
            if (grp == "org.apache.logging.log4j"
                    && (ver == "2.19.0" || ver == "2.25.0" || ver == "2.25.4" || ver == "2.26.0")) {
                details.useVersion("2.26.1")
                details.because("CVE remediation: CVE-2026-49844 pin log4j")
            }

            // httpclient5 5.6.1 -> 5.6.3 (9.5.0 pins 5.6.1 in version.properties)
            if (grp == "org.apache.httpcomponents.client5"
                    && name == "httpclient5" && ver == "5.6.1") {
                details.useVersion("5.6.3")
                details.because("CVE remediation: CVE-2026-64607")
            }

            // commons-lang3 3.9 / 3.14.0 -> 3.18.0
            if (grp == "org.apache.commons" && name == "commons-lang3"
                    && (ver == "3.9" || ver == "3.14.0")) {
                details.useVersion("3.18.0")
                details.because("CVE remediation: pin commons-lang3")
            }

            // SLF4J 2.0.6 -> 2.0.17 for legacy transitive pins. 9.5.0 ships
            // slf4j 2.0.18 in version.properties.
            if (grp == "org.slf4j" && ver == "2.0.6") {
                details.useVersion("2.0.17")
                details.because("CVE remediation: pin slf4j")
            }

            // OpenTelemetry API 1.47.0 -> 1.62.0 (CVE-2026-45292: unbounded
            // baggage memory allocation in W3CBaggagePropagator)
            if (grp == "io.opentelemetry" && name == "opentelemetry-api"
                    && ver == "1.47.0") {
                details.useVersion("1.62.0")
                details.because("CVE remediation: CVE-2026-45292")
            }

            // lz4-java 1.10.1 -> 1.11.1
            if (grp == "at.yawk.lz4" && name == "lz4-java" && ver == "1.10.1") {
                details.useVersion("1.11.1")
                details.because("CVE remediation: CVE-2026-59949")
            }

            // jsoup 1.21.2 -> 1.23.1
            if (grp == "org.jsoup" && name == "jsoup" && ver == "1.21.2") {
                details.useVersion("1.23.1")
                details.because("CVE remediation: CVE-2026-71497")
            }
        }
    }
}
