# syntax=dhi.io/build:2-debian13

name: Elasticsearch 9.5.x
image: dhi.io/elasticsearch
variant: runtime
tags:
  - "9"
  - "9.5"
  - 9.5.6
  - 9-debian
  - 9-debian13
  - 9.5-debian
  - 9.5-debian13
  - 9.5.6-debian
  - 9.5.6-debian13
platforms:
  - linux/amd64
  - linux/arm64
dates:
  release: "2026-07-29"
vars:
  ARCH: '#{ target.arch == "amd64" ? "amd64" : "arm64" }'
  ELASTICSEARCH_COMMIT_SHA: fd1e8011342a0988e432b999cea4bf884ca120ed
  ELASTICSEARCH_HOME: /usr/share/elasticsearch
  ELASTICSEARCH_OUTPUT_ARCHIVE_DIR: '#{ target.arch == "amd64" ? "linux-tar" : "linux-aarch64-tar" }'
  GO_ARCH: '#{ target.arch == "amd64" ? "x86_64" : "aarch64" }'
  HAS_SOURCE_SHIMS: "FALSE"
  JAVA_HOME: /usr/lib/jvm/temurin-21
  JAVA_MAJOR_VERSION: "21"
  SEMVER_MAJOR_MINOR_VERSION: "9.5"
  SEMVER_MAJOR_VERSION: "9"
  SEMVER_VERSION: 9.5.6
  VERSION: 9.5.6
  X_PACK_CORE_SHA256: sha256:bdb47d0a4049a8d735b99f9954307ca31799ae75724ad02c79e8ea468bc219a7
contents:
  repositories:
    - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
  keyring:
    - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
  packages:
    - '!libelogind0'
    - '!mawk'
    - '!original-awk'
    - base-files
    - bash
    - coreutils
    - curl
    - eclipse-temurin-21-jdk
    - eclipse-temurin-21-jdk-oci-config
    - findutils
    - grep
    - libstdc++6
    - netcat-openbsd
    - tini
  builds:
    - name: elasticsearch
      environment:
        ES_JAVA_HOME: /usr/lib/jvm/temurin-21
      contents:
        packages:
          - bash
          - coreutils
          - findutils
          - sed
          - tini
          - eclipse-temurin-21-jdk
        files:
          - url: git+https://github.com/elastic/elasticsearch.git#v9.5.6
            checksum: fd1e8011342a0988e432b999cea4bf884ca120ed
            path: ${source.dir}/elasticsearch
            spdx:
              name: elasticsearch
              version: 9.5.6
              packages:
                - name: elasticsearch
                  purl: pkg:dhi/elasticsearch@9.5.6
                  license: Apache-2.0
            uid: 0
            gid: 0
          - url: https://repo1.maven.org/maven2/org/elasticsearch/plugin/x-pack-core/9.5.6/x-pack-core-9.5.6.jar
            checksum: sha256:bdb47d0a4049a8d735b99f9954307ca31799ae75724ad02c79e8ea468bc219a7
            path: ${source.dir}/x-pack-core/x-pack-core-9.5.6.jar
            uid: 0
            gid: 0
          - url: https://repo1.maven.org/maven2/com/google/guava/guava/33.7.2-jre/guava-33.7.2-jre.jar
            checksum: sha256:b530942257fb935f8b2cfaa5f8eb5bd59c555fd8e8d01b8ce98912e077ea606c
            path: ${source.dir}/patch/deps/guava-33.7.2-jre.jar
            spdx:
              name: guava
              version: 33.7.2-jre
              packages:
                - name: guava
                  purl: pkg:maven/com.google.guava/guava@33.7.2-jre
                  license: Apache-2.0
            uid: 0
            gid: 0
          - url: https://repo1.maven.org/maven2/com/google/guava/failureaccess/1.0.3/failureaccess-1.0.3.jar
            checksum: sha256:cbfc3906b19b8f55dd7cfd6dfe0aa4532e834250d7f080bd8d211a3e246b59cb
            path: ${source.dir}/patch/deps/failureaccess-1.0.3.jar
            spdx:
              name: failureaccess
              version: 1.0.3
              packages:
                - name: failureaccess
                  purl: pkg:maven/com.google.guava/failureaccess@1.0.3
                  license: Apache-2.0
            uid: 0
            gid: 0
          - url: https://repo1.maven.org/maven2/org/pantsbuild/jarjar/1.7.2/jarjar-1.7.2.jar
            checksum: sha256:0706a455e17b67718abe212e3a77688bbe8260852fc74e3e836d9f2e76d91c27
            path: ${source.dir}/patch/deps/jarjar-1.7.2.jar
            uid: 0
            gid: 0
          - url: https://repo1.maven.org/maven2/org/ow2/asm/asm/7.0/asm-7.0.jar
            checksum: sha256:b88ef66468b3c978ad0c97fd6e90979e56155b4ac69089ba7a44e9aa7ffe9acf
            path: ${source.dir}/patch/deps/asm-7.0.jar
            uid: 0
            gid: 0
          - url: https://repo1.maven.org/maven2/org/ow2/asm/asm-commons/7.0/asm-commons-7.0.jar
            checksum: sha256:fed348ef05958e3e846a3ac074a12af5f7936ef3d21ce44a62c4fa08a771927d
            path: ${source.dir}/patch/deps/asm-commons-7.0.jar
            uid: 0
            gid: 0
      pipeline:
        - name: git patch elasticsearch docker-entrypoint for FIPS keystore
          uses: patch@v1
          work-dir: ${source.dir}/elasticsearch
          with:
            options: -p1
            patches:
              - ${source.dir}/patch/docker-entrypoint-fips-keystore.patch
        - name: stage gradle dependency overrides init script
          work-dir: ${source.dir}/elasticsearch
          runs: |
            set -eux -o pipefail

            cp "${source.dir}/patch/9.5.overrides.gradle" \
              "${source.dir}/elasticsearch/dhi-overrides.init.gradle"
        - name: extract Elastic public key to be properly compatible with Elastic licenses
          work-dir: ${source.dir}/x-pack-core
          runs: |
            set -eux -o pipefail

            jar xf x-pack-core-9.5.6.jar public.key
        - name: build
          work-dir: ${source.dir}/elasticsearch
          privileged: true
          runs: |
            set -eux -o pipefail

            # DefaultSslContext is unavailable under the FIPS JDK TLS stack, which breaks the Gradle
            # wrapper download. Compile with the tracked non-FIPS builder image; runtime still ships FIPS Java.
            unset JDK_JAVA_OPTIONS
            unset JAVA_TOOL_OPTIONS
            unset _JAVA_OPTIONS

            # Two-pass Gradle build. Pass 1 regenerates gradle/verification-metadata.xml
            # for the forced dependency versions declared in dhi-overrides.init.gradle so
            # strict dependency verification passes; --write-verification-metadata
            # short-circuits task execution. Pass 2 runs the actual localDistro build with
            # the same overrides in effect.
            ./gradlew \
              --init-script "${source.dir}/elasticsearch/dhi-overrides.init.gradle" \
              --write-verification-metadata sha256 \
              localDistro \
              -Dbuild.snapshot=false \
              -Dlicense.key=${source.dir}/x-pack-core/public.key

            ./gradlew \
              --init-script "${source.dir}/elasticsearch/dhi-overrides.init.gradle" \
              localDistro \
              -Dbuild.snapshot=false \
              -Dlicense.key=${source.dir}/x-pack-core/public.key
        - name: repack iceberg-bundled-guava with guava 33.7.2
          work-dir: ${source.dir}/elasticsearch
          runs: |
            set -eux -o pipefail

            bash "${source.dir}/patch/iceberg-guava-repack.sh" \
              "${source.dir}/elasticsearch/distribution/archives/${ELASTICSEARCH_OUTPUT_ARCHIVE_DIR}/build/install/elasticsearch-9.5.6" \
              "${source.dir}/patch/deps"
        - name: extract built tarball
          runs: |
            set -eux -o pipefail

            # remove bundled jdk
            rm -r "${source.dir}/elasticsearch/distribution/archives/${ELASTICSEARCH_OUTPUT_ARCHIVE_DIR}/build/install/elasticsearch-9.5.6/jdk"

            mkdir -p "${target.dir}/usr/share/elasticsearch/"
            cp -r "${source.dir}/elasticsearch/distribution/archives/${ELASTICSEARCH_OUTPUT_ARCHIVE_DIR}/build/install/elasticsearch-9.5.6/." "${target.dir}/usr/share/elasticsearch"

            # Upstream's Docker build renames the distro file-based log4j config before
            # overlaying the console variant (see distribution/docker Dockerfile). Preserve
            # that file here so docker-entrypoint.sh can switch to file logging when
            # ES_LOG_STYLE=file (e.g. ECK stack monitoring) before paths: replaces
            # log4j2.properties with the DHI console config.
            cp "${target.dir}/usr/share/elasticsearch/config/log4j2.properties" \
              "${target.dir}/usr/share/elasticsearch/config/log4j2.file.properties"
      paths:
        - type: file
          path: ${source.dir}/patch/docker-entrypoint-fips-keystore.patch
          uid: 0
          gid: 0
          source: image/elasticsearch/patch/docker-entrypoint-fips-keystore.patch
        - type: file
          path: ${source.dir}/patch/9.5.overrides.gradle
          uid: 0
          gid: 0
          source: image/elasticsearch/patch/9.5.overrides.gradle
        - type: file
          path: ${source.dir}/patch/iceberg-guava-repack.sh
          uid: 0
          gid: 0
          source: image/elasticsearch/patch/iceberg-guava-repack.sh
      outputs:
        - source: ${target.dir}/usr/share/elasticsearch
          target: /usr/share/elasticsearch
          uid: 1000
          gid: 1000
        - source: /opt/docker/sbom/elasticsearch
          target: /opt/docker/sbom/elasticsearch
          uid: 0
          gid: 0
        - source: ${source.dir}/elasticsearch/distribution/docker/src/docker/bin/docker-entrypoint.sh
          target: /usr/local/bin/docker-entrypoint.sh
          uid: 1000
          gid: 1000
          mode: "0755"
    - name: locale
      contents:
        packages:
          - bash
          - locales
          - coreutils
          - gzip
      pipeline:
        - name: install locales
          runs: |
            set -eux -o pipefail

            ln -s /etc/locale.alias /usr/share/locale/locale.alias

            echo "en_US.UTF-8 UTF-8" >> /etc/locale.gen
            locale-gen en_US.UTF-8
      outputs:
        - source: /usr/share/locale
          target: /usr/share/locale
          uid: 0
          gid: 0
        - source: /usr/lib/locale
          target: /usr/lib/locale
          uid: 0
          gid: 0
accounts:
  run-as: elasticsearch
  users:
    - name: elasticsearch
      uid: 1000
      gid: 1000
  groups:
    - name: elasticsearch
      gid: 1000
      members:
        - elasticsearch
os-release:
  name: Docker Hardened Images (Debian)
  id: debian
  version-id: "13"
  version-codename: trixie
  pretty-name: Docker Hardened Images/Debian GNU/Linux 13 (trixie)
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
work-dir: /usr/share/elasticsearch
environment:
  ELASTIC_CONTAINER: "true"
  ELASTICSEARCH_VERSION: 9.5.6
  ES_JAVA_HOME: /usr/lib/jvm/temurin-21
  LANG: en_US.UTF-8
  LANGUAGE: en_US:en
  LC_ALL: en_US.UTF-8
  PATH: /usr/share/elasticsearch/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
paths:
  - type: symlink
    path: /usr/bin/nc
    uid: 0
    gid: 0
    source: /usr/bin/nc.openbsd
  - type: file
    path: /usr/share/elasticsearch/config/elasticsearch.yml
    uid: 1000
    gid: 1000
    mode: "0644"
    source: image/elasticsearch/config/elasticsearch.yml
  - type: file
    path: /usr/share/elasticsearch/config/log4j2.properties
    uid: 1000
    gid: 1000
    mode: "0644"
    source: image/elasticsearch/config/log4j2.properties
annotations:
  org.opencontainers.image.description: A minimal Elasticsearch image
  org.opencontainers.image.licenses: Elastic-License-2.0
entrypoint:
  - /usr/bin/tini
  - --
  - /usr/local/bin/docker-entrypoint.sh
cmd:
  - eswrapper
ports:
  - 9200/tcp
  - 9300/tcp
