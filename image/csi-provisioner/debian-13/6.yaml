# syntax=dhi.io/build:2-debian13

name: csi-provisioner 6.3.x
image: dhi.io/csi-provisioner
variant: runtime
tags:
  - "6"
  - "6.3"
  - 6.3.0
  - 6-debian
  - 6-debian13
  - 6.3-debian
  - 6.3-debian13
  - 6.3.0-debian
  - 6.3.0-debian13
platforms:
  - linux/amd64
  - linux/arm64
vars:
  FLAVORED_SUFFIX: ""
  SEMVER_MAJOR_MINOR_VERSION: "6.3"
  SEMVER_MAJOR_VERSION: "6"
  SEMVER_VERSION: 6.3.0
  SUFFIX: ""
  VERSION: 6.3.0-2
contents:
  repositories:
    - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
  keyring:
    - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
  packages:
    - base-files
    - ca-certificates-bundle
    - csi-provisioner=6.3.0-2
    - tzdata
accounts:
  run-as: nonroot
  users:
    - name: nonroot
      uid: 65532
      gid: 65532
  groups:
    - name: nonroot
      gid: 65532
      members:
        - nonroot
os-release:
  name: Docker Hardened Images (Debian)
  id: debian
  version-id: "13"
  version-codename: trixie
  pretty-name: Docker Hardened Images/Debian GNU/Linux 13 (trixie)
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
paths:
  - type: directory
    path: /usr/local/bin
    uid: 0
    gid: 0
  - type: symlink
    path: /usr/local/bin/csi-provisioner
    uid: 0
    gid: 0
    source: /usr/bin/csi-provisioner
annotations:
  org.opencontainers.image.description: A minimal csi-provisioner image
  org.opencontainers.image.licenses: Apache-2.0
entrypoint:
  - /usr/local/bin/csi-provisioner
