# syntax=dhi.io/build:2-debian13

name: Valkey 8.1.x (dev)
image: dhi.io/valkey
variant: dev
tags:
  - 8-dev
  - 8.1-dev
  - 8.1.11-dev
  - 8-debian-dev
  - 8-debian13-dev
  - 8.1-debian-dev
  - 8.1-debian13-dev
  - 8.1.11-debian-dev
  - 8.1.11-debian13-dev
platforms:
  - linux/amd64
  - linux/arm64
dates:
  release: "2025-03-31"
  end-of-life: "2030-03-31"
vars:
  DEBIAN_EPOCH_MAJOR_MINOR_VERSION: "8.1"
  DEBIAN_EPOCH_MAJOR_VERSION: "8"
  DEBIAN_EPOCH_VERSION: 8.1.11
  VERSION: 8.1.11-0
contents:
  repositories:
    - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
  keyring:
    - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
  packages:
    - '!gawk'
    - '!libelogind0'
    - '!original-awk'
    - apt
    - bash
    - ca-certificates
    - coreutils
    - diffutils
    - dpkg
    - findutils
    - grep
    - hostname
    - libc-bin
    - libpcre2-8-0
    - libssl3t64
    - mawk
    - perl-base
    - sed
    - tini
    - util-linux
    - valkey-8.1-server=8.1.11-0
    - valkey-8.1-tools=8.1.11-0
accounts:
  root: true
  run-as: root
  users:
    - name: _apt
      uid: 42
      gid: 65532
  groups:
    - name: nonroot
      gid: 65532
      members:
        - nonroot
os-release:
  name: Docker Hardened Images (Debian)
  id: debian
  version-id: "13"
  version-codename: trixie
  pretty-name: Docker Hardened Images/Debian GNU/Linux 13 (trixie)
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
work-dir: /data
environment:
  DEBIAN_FRONTEND: noninteractive
paths:
  - type: file
    path: /usr/local/bin/valkey-server
    content: |
      #!/bin/sh
      exec /usr/bin/valkey-server "$@"
    uid: 0
    gid: 0
    mode: "0755"
  - type: file
    path: /usr/local/bin/valkey-cli
    content: |
      #!/bin/sh
      exec /usr/bin/valkey-cli "$@"
    uid: 0
    gid: 0
    mode: "0755"
  - type: file
    path: /usr/local/bin/valkey-benchmark
    content: |
      #!/bin/sh
      exec /usr/bin/valkey-benchmark "$@"
    uid: 0
    gid: 0
    mode: "0755"
  - type: file
    path: /usr/local/bin/valkey-sentinel
    content: |
      #!/bin/bash
      if [ -x /usr/bin/valkey-sentinel ]; then
        exec /usr/bin/valkey-sentinel "$@"
      fi
      exec -a valkey-sentinel /usr/bin/valkey-server "$@"
    uid: 0
    gid: 0
    mode: "0755"
  - type: file
    path: /usr/local/bin/valkey-check-rdb
    content: |
      #!/bin/sh
      exec /usr/bin/valkey-check-rdb "$@"
    uid: 0
    gid: 0
    mode: "0755"
  - type: file
    path: /usr/local/bin/valkey-check-aof
    content: |
      #!/bin/sh
      exec /usr/bin/valkey-check-aof "$@"
    uid: 0
    gid: 0
    mode: "0755"
  - type: file
    path: /usr/local/bin/redis-server
    content: |
      #!/bin/sh
      exec /usr/bin/valkey-server "$@"
    uid: 0
    gid: 0
    mode: "0755"
  - type: file
    path: /usr/local/bin/redis-cli
    content: |
      #!/bin/sh
      exec /usr/bin/valkey-cli "$@"
    uid: 0
    gid: 0
    mode: "0755"
  - type: file
    path: /usr/local/bin/redis-benchmark
    content: |
      #!/bin/sh
      exec /usr/bin/valkey-benchmark "$@"
    uid: 0
    gid: 0
    mode: "0755"
  - type: file
    path: /usr/local/bin/redis-sentinel
    content: |
      #!/bin/bash
      if [ -x /usr/bin/valkey-sentinel ]; then
        exec /usr/bin/valkey-sentinel "$@"
      fi
      exec -a valkey-sentinel /usr/bin/valkey-server "$@"
    uid: 0
    gid: 0
    mode: "0755"
  - type: file
    path: /usr/local/bin/redis-check-rdb
    content: |
      #!/bin/sh
      exec /usr/bin/valkey-check-rdb "$@"
    uid: 0
    gid: 0
    mode: "0755"
  - type: file
    path: /usr/local/bin/redis-check-aof
    content: |
      #!/bin/sh
      exec /usr/bin/valkey-check-aof "$@"
    uid: 0
    gid: 0
    mode: "0755"
  - type: directory
    path: /var/lib/valkey
    uid: 65532
    gid: 65532
    mode: "0755"
  - type: directory
    path: /var/log/valkey
    uid: 65532
    gid: 65532
    mode: "0755"
  - type: directory
    path: /run/valkey/
    uid: 65532
    gid: 65532
    mode: "0755"
  - type: directory
    path: /data
    uid: 65532
    gid: 65532
    mode: "0755"
  - type: file
    path: /usr/local/bin/docker-entrypoint.sh
    content: |
      #!/bin/sh
      set -e

      # first arg is `-f` or `--some-option`
      # or first arg is `something.conf`
      if [ "${1#-}" != "$1" ] || [ "${1%.conf}" != "$1" ]; then
        set -- valkey-server "$@"
      fi

      # set an appropriate umask (if one isn't set)
      um="$(umask)"
      if [ "$um" = '0022' ]; then
        umask 0077
      fi

      exec "$@"
    uid: 0
    gid: 0
    mode: "0755"
annotations:
  org.opencontainers.image.description: A minimal Valkey image
  org.opencontainers.image.licenses: BSD-3-Clause
entrypoint:
  - /usr/bin/tini
  - --
  - /usr/local/bin/docker-entrypoint.sh
cmd:
  - valkey-server
ports:
  - 6379/tcp
