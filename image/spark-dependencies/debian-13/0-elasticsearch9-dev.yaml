# syntax=dhi.io/build:2-debian13

name: Jaeger Spark Dependencies 0.x (elasticsearch9, dev)
image: dhi.io/spark-dependencies
variant: dev
flavor: elasticsearch9
tags:
  - 0-elasticsearch9-dev
  - 0.7-elasticsearch9-dev
  - 0.7.2-elasticsearch9-dev
  - 0-debian-elasticsearch9-dev
  - 0-debian13-elasticsearch9-dev
  - 0.7-debian-elasticsearch9-dev
  - 0.7-debian13-elasticsearch9-dev
  - 0.7.2-debian-elasticsearch9-dev
  - 0.7.2-debian13-elasticsearch9-dev
platforms:
  - linux/amd64
  - linux/arm64
dates:
  release: "2026-01-04"
vars:
  JAVA_FIPS_SUFFIX: ""
  JAVA_VARIANT: jre
  JDK_MAJOR_VERSION: "21"
  SEMVER_MAJOR_MINOR_VERSION: "0.7"
  SEMVER_MAJOR_VERSION: "0"
  SEMVER_VERSION: 0.7.2
  VERSION: 0.7.2-6
contents:
  repositories:
    - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
  keyring:
    - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
  packages:
    - '!gawk'
    - '!libelogind0'
    - '!mawk'
    - '!original-awk'
    - apt
    - base-files
    - bash
    - ca-certificates
    - ca-certificates-bundle
    - coreutils
    - diffutils
    - dpkg
    - eclipse-temurin-21-jre
    - eclipse-temurin-21-jre-oci-config
    - findutils
    - grep
    - libc-bin
    - libstdc++6
    - mawk
    - perl-base
    - sed
    - spark-dependencies-elasticsearch9=0.7.2-6
    - tzdata
    - util-linux
  builds:
    - name: locale
      contents:
        packages:
          - bash
          - locales
          - coreutils
          - gzip
      pipeline:
        - name: install locales
          runs: |
            set -eux -o pipefail

            ln -s /etc/locale.alias /usr/share/locale/locale.alias

            echo "en_US.UTF-8 UTF-8" >> /etc/locale.gen
            locale-gen en_US.UTF-8
      outputs:
        - source: /usr/share/locale
          target: /usr/share/locale
          uid: 0
          gid: 0
        - source: /usr/lib/locale
          target: /usr/lib/locale
          uid: 0
          gid: 0
accounts:
  root: true
  run-as: root
  users:
    - name: nonroot
      uid: 65532
      gid: 65532
    - name: _apt
      uid: 42
      gid: 65532
  groups:
    - name: nonroot
      gid: 65532
      members:
        - nonroot
os-release:
  name: Docker Hardened Images (Debian)
  id: debian
  version-id: "13"
  version-codename: trixie
  pretty-name: Docker Hardened Images/Debian GNU/Linux 13 (trixie)
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
work-dir: /usr/share/spark-dependencies
environment:
  DEBIAN_FRONTEND: noninteractive
  JAR_PATH: /usr/share/spark-dependencies/spark-dependencies-elasticsearch9.jar
  JAVA_HOME: /usr/lib/jvm/temurin-21
  LANG: en_US.UTF-8
  LANGUAGE: en_US:en
  LC_ALL: en_US.UTF-8
paths:
  - type: file
    path: /usr/local/bin/entrypoint.sh
    uid: 0
    gid: 0
    mode: "0755"
    source: image/spark-dependencies/bin/entrypoint.sh
  - type: symlink
    path: /entrypoint.sh
    uid: 0
    gid: 0
    source: /usr/local/bin/entrypoint.sh
annotations:
  org.opencontainers.image.description: A minimal Jaeger Spark dependencies job image
  org.opencontainers.image.licenses: Apache-2.0
entrypoint:
  - /usr/local/bin/entrypoint.sh
