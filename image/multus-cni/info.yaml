metadata:
  display-name: Multus CNI
  short-description: Multus CNI is a CNI meta-plugin that enables attaching multiple network interfaces to Kubernetes pods
  featured: false
  home-url: https://github.com/k8snetworkplumbingwg/multus-cni
  categories:
    - networking
  included-tools:
    - name: multus
      description: The Multus CNI meta-plugin binary invoked by the container runtime (thin plugin mode).
    - name: multus-daemon
      description: The Multus daemon serving CNI requests in thick plugin mode.
    - name: multus-shim
      description: Lightweight CNI shim that forwards runtime requests to the multus-daemon (thick plugin mode).
    - name: install_multus
      description: Installer that copies the Multus binaries onto the host CNI directory.
    - name: thin_entrypoint
      description: Default entrypoint for thin plugin deployments; installs the plugin and generates its CNI configuration.
    - name: kubeconfig_generator
      description: Generates the kubeconfig Multus uses to reach the Kubernetes API from the node.
    - name: cert-approver
      description: Approves kubelet-style certificate signing requests when per-node certificates are enabled.
    - name: passthru
      description: Passthru CNI plugin used as a no-op delegate.
