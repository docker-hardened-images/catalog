# syntax=dhi.io/build:2-debian13

name: Multus CNI 4.x (dev)
image: dhi.io/multus-cni
variant: dev
tags:
  - 4-dev
  - 4.3-dev
  - 4.3.0-dev
  - 4-debian-dev
  - 4-debian13-dev
  - 4.3-debian-dev
  - 4.3-debian13-dev
  - 4.3.0-debian-dev
  - 4.3.0-debian13-dev
platforms:
  - linux/amd64
  - linux/arm64
dates:
  release: "2023-04-13"
vars:
  FLAVORED_SUFFIX: -dev
  SEMVER_MAJOR_MINOR_VERSION: "4.3"
  SEMVER_MAJOR_VERSION: "4"
  SEMVER_VERSION: 4.3.0
  SUFFIX: -dev
  VERSION: 4.3.0-3
contents:
  repositories:
    - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
  keyring:
    - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
  packages:
    - '!gawk'
    - '!libelogind0'
    - '!original-awk'
    - apt
    - base-files
    - bash
    - ca-certificates
    - ca-certificates-bundle
    - coreutils
    - diffutils
    - dpkg
    - findutils
    - grep
    - libc-bin
    - mawk
    - multus-cni-dev=4.3.0-3
    - perl-base
    - sed
    - tzdata
    - util-linux
accounts:
  root: true
  run-as: root
  users:
    - name: nonroot
      uid: 65532
      gid: 65532
    - name: _apt
      uid: 42
      gid: 65532
  groups:
    - name: nonroot
      gid: 65532
      members:
        - nonroot
os-release:
  name: Docker Hardened Images (Debian)
  id: debian
  version-id: "13"
  version-codename: trixie
  pretty-name: Docker Hardened Images/Debian GNU/Linux 13 (trixie)
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
environment:
  DEBIAN_FRONTEND: noninteractive
paths:
  - type: directory
    path: /usr/local/bin
    uid: 0
    gid: 0
  - type: symlink
    path: /usr/local/bin/thin_entrypoint
    uid: 0
    gid: 0
    source: /usr/bin/thin_entrypoint
  - type: directory
    path: /usr/src/multus-cni/bin
    uid: 0
    gid: 0
    mode: "0755"
  - type: symlink
    path: /usr/src/multus-cni/bin/multus
    uid: 0
    gid: 0
    source: /usr/bin/multus
  - type: symlink
    path: /usr/src/multus-cni/bin/multus-daemon
    uid: 0
    gid: 0
    source: /usr/bin/multus-daemon
  - type: symlink
    path: /usr/src/multus-cni/bin/multus-shim
    uid: 0
    gid: 0
    source: /usr/bin/multus-shim
  - type: symlink
    path: /usr/src/multus-cni/bin/install_multus
    uid: 0
    gid: 0
    source: /usr/bin/install_multus
  - type: symlink
    path: /usr/src/multus-cni/bin/thin_entrypoint
    uid: 0
    gid: 0
    source: /usr/bin/thin_entrypoint
  - type: symlink
    path: /usr/src/multus-cni/bin/kubeconfig_generator
    uid: 0
    gid: 0
    source: /usr/bin/kubeconfig_generator
  - type: symlink
    path: /usr/src/multus-cni/bin/cert-approver
    uid: 0
    gid: 0
    source: /usr/bin/cert-approver
  - type: symlink
    path: /usr/src/multus-cni/bin/passthru
    uid: 0
    gid: 0
    source: /usr/bin/passthru
  - type: symlink
    path: /thin_entrypoint
    uid: 0
    gid: 0
    source: /usr/bin/thin_entrypoint
  - type: symlink
    path: /install_multus
    uid: 0
    gid: 0
    source: /usr/bin/install_multus
  - type: symlink
    path: /kubeconfig_generator
    uid: 0
    gid: 0
    source: /usr/bin/kubeconfig_generator
  - type: symlink
    path: /cert-approver
    uid: 0
    gid: 0
    source: /usr/bin/cert-approver
annotations:
  org.opencontainers.image.description: A minimal Multus CNI image
  org.opencontainers.image.licenses: Apache-2.0
entrypoint:
  - /thin_entrypoint
