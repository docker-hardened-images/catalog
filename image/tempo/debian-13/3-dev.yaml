# syntax=dhi.io/build:2-debian13

name: Tempo 3.x (dev)
image: dhi.io/tempo
variant: dev
tags:
  - 3-dev
  - 3.0-dev
  - 3.0.3-dev
  - 3-debian-dev
  - 3-debian13-dev
  - 3.0-debian-dev
  - 3.0-debian13-dev
  - 3.0.3-debian-dev
  - 3.0.3-debian13-dev
platforms:
  - linux/amd64
  - linux/arm64
dates:
  release: "2026-05-28"
vars:
  COMMIT_SHA: 1900ed7bb5cad1a3edc285783d7d4ac4278337dc
  DEBIAN_EPOCH_MAJOR_MINOR_VERSION: "3.0"
  DEBIAN_EPOCH_MAJOR_VERSION: "3"
  DEBIAN_EPOCH_VERSION: 3.0.3
  VERSION: 3.0.3
contents:
  repositories:
    - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
  keyring:
    - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
  packages:
    - '!gawk'
    - '!libelogind0'
    - '!original-awk'
    - apt
    - base-files
    - bash
    - ca-certificates
    - ca-certificates-bundle
    - coreutils
    - diffutils
    - dpkg
    - findutils
    - grep
    - libc-bin
    - mawk
    - perl-base
    - sed
    - tzdata
    - util-linux
  builds:
    - name: tempo
      work-dir: /go/src/github.com/grafana/tempo
      caches:
        - path: /go/pkg/mod
      contents:
        packages:
          - bash
          - ca-certificates-bundle
          - coreutils
          - findutils
          - golang-1.26
          - hostname
          - make
          - mawk
          - sed
        files:
          - url: git+https://github.com/grafana/tempo.git#v3.0.3
            checksum: 1900ed7bb5cad1a3edc285783d7d4ac4278337dc
            path: /go/src/github.com/grafana/tempo
            spdx:
              name: tempo
              version: 3.0.3
              packages:
                - name: tempo
                  purl: pkg:golang/github.com/grafana/tempo@v3.0.3
                  license: AGPL-3.0
            uid: 0
            gid: 0
      pipeline:
        - name: bump go dependencies (3 only)
          uses: go/bump@v2
          with:
            deps:
              - golang.org/x/text@v0.39.0
              - golang.org/x/net@v0.56.0
              - github.com/apache/thrift@v0.23.0
              - github.com/klauspost/compress@v1.18.7
              - go.opentelemetry.io/otel@v1.44.0
              - google.golang.org/grpc@v1.82.1
            tidy: true
        - name: build
          uses: go/build@v1
          environment:
            GOFLAGS: -buildvcs=false
          with:
            ldflags:
              - -X main.Version=v3.0.3
              - -X main.Branch=3.0.3
              - -X main.Revision=1900ed7bb5cad1a3edc285783d7d4ac4278337dc
            output: ${target.dir}/opt/tempo/tempo
            packages: ./cmd/tempo
      outputs:
        - source: ${target.dir}/opt/tempo/tempo
          target: /opt/tempo/tempo
          uid: 0
          gid: 0
        - source: /go/src/github.com/grafana/tempo/tools/packaging/tempo.yaml
          target: /etc/tempo/config.yaml
          uid: 0
          gid: 0
        - source: /opt/docker/sbom/tempo
          target: /opt/docker/sbom/tempo
          uid: 0
          gid: 0
accounts:
  root: true
  run-as: root
  users:
    - name: nonroot
      uid: 65532
      gid: 65532
    - name: _apt
      uid: 42
      gid: 65532
  groups:
    - name: nonroot
      gid: 65532
      members:
        - nonroot
os-release:
  name: Docker Hardened Images (Debian)
  id: debian
  version-id: "13"
  version-codename: trixie
  pretty-name: Docker Hardened Images/Debian GNU/Linux 13 (trixie)
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
environment:
  DEBIAN_FRONTEND: noninteractive
paths:
  - type: directory
    path: /var/tempo
    uid: 65532
    gid: 65532
    mode: "0755"
  - type: file
    path: /etc/tempo/config.yaml
    uid: 65532
    gid: 65532
    mode: "0644"
    source: image/tempo/config/tempo-v3.yaml
annotations:
  org.opencontainers.image.description: A minimal Tempo image
  org.opencontainers.image.licenses: AGPL-3.0
entrypoint:
  - /opt/tempo/tempo
cmd:
  - -config.file=/etc/tempo/config.yaml
ports:
  - 3200/tcp
