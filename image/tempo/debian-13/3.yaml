# syntax=dhi.io/build:2-debian13

name: Tempo 3.x
image: dhi.io/tempo
variant: runtime
tags:
  - "3"
  - "3.1"
  - 3.1.0
  - 3-debian
  - 3-debian13
  - 3.1-debian
  - 3.1-debian13
  - 3.1.0-debian
  - 3.1.0-debian13
platforms:
  - linux/amd64
  - linux/arm64
dates:
  release: "2026-05-28"
vars:
  COMMIT_SHA: 77fc4563d1135d0ca2656709c7384c278a9c67b0
  DEBIAN_EPOCH_MAJOR_MINOR_VERSION: "3.1"
  DEBIAN_EPOCH_MAJOR_VERSION: "3"
  DEBIAN_EPOCH_VERSION: 3.1.0
  VERSION: 3.1.0
contents:
  repositories:
    - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
  keyring:
    - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
  packages:
    - base-files
    - ca-certificates-bundle
    - tzdata
  builds:
    - name: tempo
      work-dir: /go/src/github.com/grafana/tempo
      caches:
        - path: /go/pkg/mod
      contents:
        packages:
          - bash
          - ca-certificates-bundle
          - coreutils
          - findutils
          - golang-1.26
          - hostname
          - make
          - mawk
          - sed
        files:
          - url: git+https://github.com/grafana/tempo.git#v3.1.0
            checksum: 77fc4563d1135d0ca2656709c7384c278a9c67b0
            path: /go/src/github.com/grafana/tempo
            spdx:
              name: tempo
              version: 3.1.0
              packages:
                - name: tempo
                  purl: pkg:golang/github.com/grafana/tempo@v3.1.0
                  license: AGPL-3.0
            uid: 0
            gid: 0
      pipeline:
        - name: bump go dependencies (3 only)
          uses: go/bump@v2
          with:
            deps:
              - golang.org/x/crypto@v0.56.0
              - golang.org/x/net@v0.57.0
              - golang.org/x/text@v0.41.0
              - github.com/apache/thrift@v0.24.0
              - github.com/klauspost/compress@v1.18.7
              - go.etcd.io/etcd/client/pkg/v3@v3.6.14
              - go.opentelemetry.io/contrib/bridges/otelzap@v0.20.1
              - go.opentelemetry.io/otel@v1.45.0
              - go.opentelemetry.io/otel/exporters/otlp/otlplog/otlploggrpc@v0.21.0
              - go.opentelemetry.io/otel/exporters/otlp/otlplog/otlploghttp@v0.21.0
              - go.opentelemetry.io/otel/exporters/otlp/otlptrace@v1.45.0
              - go.opentelemetry.io/otel/exporters/otlp/otlptrace/otlptracegrpc@v1.45.0
              - go.opentelemetry.io/otel/exporters/otlp/otlptrace/otlptracehttp@v1.45.0
              - go.opentelemetry.io/otel/exporters/stdout/stdoutlog@v0.21.0
              - go.opentelemetry.io/otel/log@v0.21.0
              - go.opentelemetry.io/otel/sdk@v1.45.0
              - go.opentelemetry.io/otel/sdk/log@v0.21.0
              - google.golang.org/grpc@v1.83.2
            downgrade: true
            replaces:
              - google.golang.org/grpc=google.golang.org/grpc@v1.83.2
            tidy: true
        - name: build
          uses: go/build@v1
          environment:
            GOFLAGS: -buildvcs=false
          with:
            ldflags:
              - -X main.Version=v3.1.0
              - -X main.Branch=3.1.0
              - -X main.Revision=77fc4563d1135d0ca2656709c7384c278a9c67b0
            output: ${target.dir}/opt/tempo/tempo
            packages: ./cmd/tempo
      outputs:
        - source: ${target.dir}/opt/tempo/tempo
          target: /opt/tempo/tempo
          uid: 0
          gid: 0
        - source: /go/src/github.com/grafana/tempo/tools/packaging/tempo.yaml
          target: /etc/tempo/config.yaml
          uid: 0
          gid: 0
        - source: /opt/docker/sbom/tempo
          target: /opt/docker/sbom/tempo
          uid: 0
          gid: 0
accounts:
  run-as: nonroot
  users:
    - name: nonroot
      uid: 65532
      gid: 65532
  groups:
    - name: nonroot
      gid: 65532
      members:
        - nonroot
os-release:
  name: Docker Hardened Images (Debian)
  id: debian
  version-id: "13"
  version-codename: trixie
  pretty-name: Docker Hardened Images/Debian GNU/Linux 13 (trixie)
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
paths:
  - type: directory
    path: /var/tempo
    uid: 65532
    gid: 65532
    mode: "0755"
  - type: file
    path: /etc/tempo/config.yaml
    uid: 65532
    gid: 65532
    mode: "0644"
    source: image/tempo/config/tempo-v3.yaml
annotations:
  org.opencontainers.image.description: A minimal Tempo image
  org.opencontainers.image.licenses: AGPL-3.0
entrypoint:
  - /opt/tempo/tempo
cmd:
  - -config.file=/etc/tempo/config.yaml
ports:
  - 3200/tcp
