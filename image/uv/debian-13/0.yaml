# syntax=dhi.io/build:2-debian13

name: uv 0.x
image: dhi.io/uv
variant: runtime
tags:
  - "0"
  - "0.13"
  - 0.13.8
  - 0-debian
  - 0-debian13
  - 0.13-debian
  - 0.13-debian13
  - 0.13.8-debian
  - 0.13.8-debian13
platforms:
  - linux/amd64
  - linux/arm64
vars:
  COMMIT_SHA: 3d97a6aad5ad989c1b4fc89406d54f0dce370b72
  SEMVER_MAJOR_MINOR_VERSION: "0.13"
  SEMVER_MAJOR_VERSION: "0"
  SEMVER_VERSION: 0.13.8
  VERSION: 0.13.8
contents:
  repositories:
    - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
  keyring:
    - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
  packages:
    - base-files
    - ca-certificates-bundle
    - libc6
    - libgcc-s1
    - libstdc++6
    - tzdata
  builds:
    - name: uv
      caches:
        - path: /root/.cargo
      contents:
        packages:
          - build-essential
          - cargo-1.97
          - rustc-1.97
          - bash
          - ca-certificates
          - cmake
          - coreutils
          - findutils
          - gawk
          - git
          - grep
          - libssl-dev
          - pkg-config
          - sed
        files:
          - url: git+https://github.com/astral-sh/uv.git#0.13.8
            checksum: 3d97a6aad5ad989c1b4fc89406d54f0dce370b72
            path: ${source.dir}/uv-3d97a6aad5ad989c1b4fc89406d54f0dce370b72
            spdx:
              name: uv
              version: 0.13.8
              packages:
                - name: uv
                  purl: pkg:dhi/uv@0.13.8
                  license: MIT
            uid: 0
            gid: 0
      pipeline:
        - name: install cargo-auditable cargo-audit
          privileged: true
          runs: |
            set -eux -o pipefail

            cargo install cargo-auditable cargo-audit
        - name: bump cargo dependencies
          work-dir: ${source.dir}/uv-3d97a6aad5ad989c1b4fc89406d54f0dce370b72
          privileged: true
          runs: |
            set -eux -o pipefail

            # quinn-proto: upstream Cargo.lock at 0.13.8 already pins 0.11.18 (removed prior --precise 0.11.15 pin that caused GHSA findings)

            # RUSTSEC-2026-0186 → memmap2 ≥0.9.11
            cargo update --package memmap2 --precise 0.9.11

            # RUSTSEC-2026-0190 → anyhow ≥1.0.103
            cargo update --package anyhow --precise 1.0.103

            # RUSTSEC-2026-0204 → crossbeam-epoch ≥0.9.20
            cargo update --package crossbeam-epoch --precise 0.9.20

            # RUSTSEC-2026-0221 → event-listener ≥5.4.2
            cargo update --package event-listener --precise 5.4.2

            # GHSA-q83h-524g-xf6h → h2 ≥0.4.16
            cargo update --package h2 --precise 0.4.16

            cargo update --package rustix --precise 1.1.6

            cargo update --package rustls --precise 0.23.46
            cargo update --package rustls-webpki --precise 0.103.16
            cargo update --package webpki-root-certs --precise 1.0.10
            cargo update --package zstd-safe@7.2.4 --precise 7.4.0
            cargo update --package zstd@0.13.3 --precise 0.13.4
            cargo update --package zstd-safe@8.0.0 --precise 8.2.0
            cargo update --package zstd@0.14.0 --precise 0.14.3
            cargo update --package zstd-sys --precise 2.1.2
            cargo update --package tokio --precise 1.53.3
            cargo update --package ctutils --precise 0.4.4
        - name: build
          work-dir: ${source.dir}/uv-3d97a6aad5ad989c1b4fc89406d54f0dce370b72
          privileged: true
          runs: |
            set -eux -o pipefail

            cargo auditable build --release
        - name: strip
          uses: strip@v1
          with:
            dir: ${source.dir}/uv-3d97a6aad5ad989c1b4fc89406d54f0dce370b72/target
      outputs:
        - source: ${source.dir}/uv-3d97a6aad5ad989c1b4fc89406d54f0dce370b72/target/release/uv
          target: /usr/local/bin/uv
          uid: 0
          gid: 0
        - source: ${source.dir}/uv-3d97a6aad5ad989c1b4fc89406d54f0dce370b72/target/release/uvx
          target: /usr/local/bin/uvx
          uid: 0
          gid: 0
        - source: /opt/docker/sbom/uv
          target: /opt/docker/sbom/uv
          uid: 0
          gid: 0
accounts:
  run-as: nonroot
  users:
    - name: nonroot
      uid: 65532
      gid: 65532
  groups:
    - name: nonroot
      gid: 65532
      members:
        - nonroot
os-release:
  name: Docker Hardened Images (Debian)
  id: debian
  version-id: "13"
  version-codename: trixie
  pretty-name: Docker Hardened Images/Debian GNU/Linux 13 (trixie)
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
work-dir: /io
environment:
  UV_VERSION: 0.13.8
paths:
  - type: directory
    path: /io
    uid: 65532
    gid: 65532
    mode: "0755"
  - type: symlink
    path: /uv
    uid: 0
    gid: 0
    source: /usr/local/bin/uv
  - type: symlink
    path: /uvx
    uid: 0
    gid: 0
    source: /usr/local/bin/uvx
annotations:
  org.opencontainers.image.description: A minimal uv image - An extremely fast Python package installer and resolver
  org.opencontainers.image.licenses: MIT
entrypoint:
  - /usr/local/bin/uv
