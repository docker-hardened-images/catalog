# syntax=dhi.io/build:2-debian13

name: uv 0.x
image: dhi.io/uv
variant: runtime
tags:
  - "0"
  - "0.13"
  - 0.13.9
  - 0-debian
  - 0-debian13
  - 0.13-debian
  - 0.13-debian13
  - 0.13.9-debian
  - 0.13.9-debian13
platforms:
  - linux/amd64
  - linux/arm64
vars:
  SEMVER_MAJOR_MINOR_VERSION: "0.13"
  SEMVER_MAJOR_VERSION: "0"
  SEMVER_VERSION: 0.13.9
  VERSION: 0.13.9-2
contents:
  repositories:
    - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
  keyring:
    - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
  packages:
    - base-files
    - ca-certificates-bundle
    - libc6
    - libgcc-s1
    - libstdc++6
    - libzstd1
    - tzdata
    - uv=0.13.9-2
  builds:
    - name: uv-sbom
      contents:
        packages:
          - bash
          - coreutils
      pipeline:
        - uses: spdx@v1
          with:
            license: MIT
            name: uv
            purl: pkg:dhi/uv@0.13.9
            version: 0.13.9
      outputs:
        - source: /opt/docker/sbom/uv
          target: /opt/docker/sbom/uv
          uid: 0
          gid: 0
accounts:
  run-as: nonroot
  users:
    - name: nonroot
      uid: 65532
      gid: 65532
  groups:
    - name: nonroot
      gid: 65532
      members:
        - nonroot
os-release:
  name: Docker Hardened Images (Debian)
  id: debian
  version-id: "13"
  version-codename: trixie
  pretty-name: Docker Hardened Images/Debian GNU/Linux 13 (trixie)
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
work-dir: /io
environment:
  UV_VERSION: 0.13.9
paths:
  - type: directory
    path: /io
    uid: 65532
    gid: 65532
    mode: "0755"
  - type: directory
    path: /usr/local/bin
    uid: 0
    gid: 0
  - type: symlink
    path: /usr/local/bin/uv
    uid: 0
    gid: 0
    source: /usr/bin/uv
  - type: symlink
    path: /usr/local/bin/uvx
    uid: 0
    gid: 0
    source: /usr/bin/uvx
  - type: symlink
    path: /uv
    uid: 0
    gid: 0
    source: /usr/local/bin/uv
  - type: symlink
    path: /uvx
    uid: 0
    gid: 0
    source: /usr/local/bin/uvx
annotations:
  org.opencontainers.image.description: A minimal uv image - An extremely fast Python package installer and resolver
  org.opencontainers.image.licenses: MIT
entrypoint:
  - /usr/local/bin/uv
