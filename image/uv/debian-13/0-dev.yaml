# syntax=dhi.io/build:2-debian13

name: uv 0.x (dev)
image: dhi.io/uv
variant: dev
tags:
  - 0-dev
  - 0.13-dev
  - 0.13.10-dev
  - 0-debian-dev
  - 0-debian13-dev
  - 0.13-debian-dev
  - 0.13-debian13-dev
  - 0.13.10-debian-dev
  - 0.13.10-debian13-dev
platforms:
  - linux/amd64
  - linux/arm64
dates:
  release: "2024-02-15"
vars:
  SEMVER_MAJOR_MINOR_VERSION: "0.13"
  SEMVER_MAJOR_VERSION: "0"
  SEMVER_VERSION: 0.13.10
  UV_PACKAGE: uv
  VERSION: 0.13.10-4
contents:
  repositories:
    - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
  keyring:
    - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
  packages:
    - '!gawk'
    - '!libelogind0'
    - '!original-awk'
    - apt
    - base-files
    - bash
    - ca-certificates
    - ca-certificates-bundle
    - coreutils
    - diffutils
    - dpkg
    - findutils
    - git
    - grep
    - libc-bin
    - libc6
    - libgcc-s1
    - libstdc++6
    - libzstd1
    - mawk
    - perl-base
    - sed
    - tzdata
    - util-linux
    - uv=0.13.10-4
  builds:
    - name: uv-sbom
      contents:
        packages:
          - bash
          - coreutils
      pipeline:
        - uses: spdx@v1
          with:
            license: MIT
            name: uv
            purl: pkg:dhi/uv@0.13.10
            version: 0.13.10
      outputs:
        - source: /opt/docker/sbom/uv
          target: /opt/docker/sbom/uv
          uid: 0
          gid: 0
accounts:
  root: true
  run-as: root
  users:
    - name: nonroot
      uid: 65532
      gid: 65532
    - name: _apt
      uid: 42
      gid: 65532
  groups:
    - name: nonroot
      gid: 65532
      members:
        - nonroot
os-release:
  name: Docker Hardened Images (Debian)
  id: debian
  version-id: "13"
  version-codename: trixie
  pretty-name: Docker Hardened Images/Debian GNU/Linux 13 (trixie)
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
work-dir: /io
environment:
  DEBIAN_FRONTEND: noninteractive
  UV_VERSION: 0.13.10
paths:
  - type: directory
    path: /io
    uid: 65532
    gid: 65532
    mode: "0755"
  - type: directory
    path: /usr/local/bin
    uid: 0
    gid: 0
  - type: symlink
    path: /usr/local/bin/uv
    uid: 0
    gid: 0
    source: /usr/bin/uv
  - type: symlink
    path: /usr/local/bin/uvx
    uid: 0
    gid: 0
    source: /usr/bin/uvx
  - type: symlink
    path: /uv
    uid: 0
    gid: 0
    source: /usr/bin/uv
  - type: symlink
    path: /uvx
    uid: 0
    gid: 0
    source: /usr/bin/uvx
annotations:
  org.opencontainers.image.description: A minimal uv image - An extremely fast Python package installer and resolver
  org.opencontainers.image.licenses: MIT
entrypoint:
  - /usr/local/bin/uv
