# syntax=dhi.io/build:2-debian13

name: Azure Disk CSI Driver 1.33.x (dev)
image: dhi.io/azuredisk-csi
variant: dev
tags:
  - 1.33-dev
  - 1.33.15-dev
  - 1.33-debian-dev
  - 1.33-debian13-dev
  - 1.33.15-debian-dev
  - 1.33.15-debian13-dev
platforms:
  - linux/amd64
  - linux/arm64
dates:
  release: "2025-05-13"
vars:
  FLAVORED_SUFFIX: -dev
  SEMVER_MAJOR_MINOR_VERSION: "1.33"
  SEMVER_MAJOR_VERSION: "1"
  SEMVER_VERSION: 1.33.15
  SUFFIX: -dev
  VERSION: 1.33.15-1
contents:
  repositories:
    - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
  keyring:
    - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
  packages:
    - '!dpkg'
    - '!gawk'
    - '!libelogind0'
    - '!libexpat1'
    - '!libpython3-stdlib'
    - '!libpython3.13-minimal'
    - '!libpython3.13-stdlib'
    - '!original-awk'
    - '!python3'
    - '!python3-dbus'
    - '!python3-minimal'
    - '!python3.13'
    - '!python3.13-minimal'
    - '!tar'
    - apt
    - azuredisk-csi-1.33-dev=1.33.15-1
    - base-files
    - bash
    - btrfs-progs
    - ca-certificates
    - ca-certificates-bundle
    - coreutils
    - diffutils
    - dpkg
    - e2fsprogs
    - findutils
    - grep
    - libc-bin
    - libc6
    - libexpat1
    - libpython3-stdlib
    - libpython3.13-minimal
    - libpython3.13-stdlib
    - mawk
    - mount
    - perl-base
    - python3
    - python3-dbus
    - python3-minimal
    - python3.13
    - python3.13-minimal
    - sed
    - tar
    - tzdata
    - util-linux
    - xfsprogs
accounts:
  root: true
  run-as: root
  users:
    - name: nonroot
      uid: 65532
      gid: 65532
    - name: _apt
      uid: 42
      gid: 65532
  groups:
    - name: nonroot
      gid: 65532
      members:
        - nonroot
os-release:
  name: Docker Hardened Images (Debian)
  id: debian
  version-id: "13"
  version-codename: trixie
  pretty-name: Docker Hardened Images/Debian GNU/Linux 13 (trixie)
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
environment:
  DEBIAN_FRONTEND: noninteractive
paths:
  - type: symlink
    path: /azurediskplugin
    uid: 0
    gid: 0
    source: /usr/bin/azurediskplugin
annotations:
  org.opencontainers.image.description: A minimal Azure Disk CSI Driver image
  org.opencontainers.image.licenses: Apache-2.0
entrypoint:
  - /azurediskplugin
