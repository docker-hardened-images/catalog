# syntax=dhi.io/build:2-debian13

name: Buildkite MCP Server 1.x
image: dhi.io/buildkite-mcp
variant: runtime
tags:
  - "1"
  - "1.20"
  - 1.20.0
  - 1-debian
  - 1-debian13
  - 1.20-debian
  - 1.20-debian13
  - 1.20.0-debian
  - 1.20.0-debian13
platforms:
  - linux/amd64
  - linux/arm64
dates:
  release: "2026-07-17"
vars:
  SEMVER_MAJOR_MINOR_VERSION: "1.20"
  SEMVER_MAJOR_VERSION: "1"
  SEMVER_VERSION: 1.20.0
  VERSION: 1.20.0-1
contents:
  repositories:
    - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
  keyring:
    - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
  packages:
    - base-files
    - buildkite-mcp=1.20.0-1
    - ca-certificates-bundle
    - tzdata
  builds:
    - name: server.json
      contents:
        packages:
          - bash
          - sed
      pipeline:
        - runs: |
            set -eux -o pipefail

            sed -i "s/_VERSION_/1.20.0/g" "${source.dir}/config/server.json"
      paths:
        - type: file
          path: ${source.dir}/config/server.json
          uid: 0
          gid: 0
          source: image/buildkite-mcp/config/server.json
      attestations:
        - predicate-type: https://modelcontextprotocol.io/server.json/v1
          source: ${source.dir}/config/server.json
accounts:
  run-as: nonroot
  users:
    - name: nonroot
      uid: 65532
      gid: 65532
  groups:
    - name: nonroot
      gid: 65532
      members:
        - nonroot
os-release:
  name: Docker Hardened Images (Debian)
  id: debian
  version-id: "13"
  version-codename: trixie
  pretty-name: Docker Hardened Images/Debian GNU/Linux 13 (trixie)
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
paths:
  - type: directory
    path: /server
    uid: 0
    gid: 0
    mode: "0755"
  - type: symlink
    path: /server/buildkite-mcp-server
    uid: 0
    gid: 0
    source: /usr/bin/buildkite-mcp-server
  - type: directory
    path: /ko-app
    uid: 0
    gid: 0
    mode: "0755"
  - type: symlink
    path: /ko-app/buildkite-mcp-server
    uid: 0
    gid: 0
    source: /server/buildkite-mcp-server
annotations:
  org.opencontainers.image.description: Buildkite MCP Server - connects AI tools to the Buildkite API
  org.opencontainers.image.licenses: MIT
labels:
  io.modelcontextprotocol.server.name: io.github.buildkite/buildkite-mcp-server
entrypoint:
  - /server/buildkite-mcp-server
cmd:
  - stdio
