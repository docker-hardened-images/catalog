# syntax=dhi.io/build:2-debian13

name: Woodpecker Server 3.x
image: dhi.io/woodpecker-server
variant: runtime
tags:
  - "3"
  - "3.20"
  - 3.20.1
  - 3-debian
  - 3-debian13
  - 3.20-debian
  - 3.20-debian13
  - 3.20.1-debian
  - 3.20.1-debian13
platforms:
  - linux/amd64
  - linux/arm64
dates:
  release: "2025-01-18"
vars:
  FLAVORED_SUFFIX: ""
  SEMVER_MAJOR_MINOR_VERSION: "3.20"
  SEMVER_MAJOR_VERSION: "3"
  SEMVER_VERSION: 3.20.1
  SUFFIX: ""
  VERSION: 3.20.1-4
contents:
  repositories:
    - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
  keyring:
    - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
  packages:
    - '!libelogind0'
    - '!mawk'
    - '!original-awk'
    - base-files
    - ca-certificates-bundle
    - libc6
    - libsqlite3-0
    - tzdata
    - tzdata-legacy
    - woodpecker-server-3=3.20.1-4
accounts:
  root: true
  run-as: woodpecker
  users:
    - name: woodpecker
      uid: 1000
      gid: 1000
  groups:
    - name: woodpecker
      gid: 1000
      members:
        - woodpecker
os-release:
  name: Docker Hardened Images (Debian)
  id: debian
  version-id: "13"
  version-codename: trixie
  pretty-name: Docker Hardened Images/Debian GNU/Linux 13 (trixie)
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
work-dir: /
environment:
  GODEBUG: netdns=go
  SQLITE_TMPDIR: /var/lib/woodpecker
  WOODPECKER_DISABLE_VERSION_CHECK: "true"
  WOODPECKER_IN_CONTAINER: "true"
  XDG_CACHE_HOME: /var/lib/woodpecker
  XDG_DATA_HOME: /var/lib/woodpecker
paths:
  - type: directory
    path: /var/lib/woodpecker
    uid: 1000
    gid: 1000
    mode: "0755"
annotations:
  org.opencontainers.image.description: A minimal Woodpecker CI server image
  org.opencontainers.image.licenses: Apache-2.0 AND BSD-3-Clause AND MIT AND CC-BY-3.0
entrypoint:
  - /bin/woodpecker-server
ports:
  - "443"
  - "8000"
  - "9000"
