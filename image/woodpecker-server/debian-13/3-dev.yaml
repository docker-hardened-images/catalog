# syntax=dhi.io/build:2-debian13

name: Woodpecker Server 3.x (dev)
image: dhi.io/woodpecker-server
variant: dev
tags:
  - 3-dev
  - 3.20-dev
  - 3.20.1-dev
  - 3-debian-dev
  - 3-debian13-dev
  - 3.20-debian-dev
  - 3.20-debian13-dev
  - 3.20.1-debian-dev
  - 3.20.1-debian13-dev
platforms:
  - linux/amd64
  - linux/arm64
dates:
  release: "2025-01-18"
vars:
  FLAVORED_SUFFIX: -dev
  SEMVER_MAJOR_MINOR_VERSION: "3.20"
  SEMVER_MAJOR_VERSION: "3"
  SEMVER_VERSION: 3.20.1
  SUFFIX: -dev
  VERSION: 3.20.1-2
contents:
  repositories:
    - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
  keyring:
    - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
  packages:
    - '!gawk'
    - '!libelogind0'
    - '!mawk'
    - '!original-awk'
    - apt
    - base-files
    - bash
    - ca-certificates
    - ca-certificates-bundle
    - coreutils
    - diffutils
    - dpkg
    - findutils
    - grep
    - libc-bin
    - libc6
    - libsqlite3-0
    - mawk
    - perl-base
    - sed
    - tzdata
    - tzdata-legacy
    - util-linux
    - woodpecker-server-3-dev=3.20.1-2
  builds:
    - name: locale
      contents:
        packages:
          - bash
          - locales
          - coreutils
          - gzip
      pipeline:
        - name: install locales
          runs: |
            set -eux -o pipefail

            ln -s /etc/locale.alias /usr/share/locale/locale.alias

            echo "en_US.UTF-8 UTF-8" >> /etc/locale.gen
            locale-gen en_US.UTF-8
      outputs:
        - source: /usr/share/locale
          target: /usr/share/locale
          uid: 0
          gid: 0
        - source: /usr/lib/locale
          target: /usr/lib/locale
          uid: 0
          gid: 0
accounts:
  root: true
  run-as: root
  users:
    - name: woodpecker
      uid: 1000
      gid: 1000
    - name: _apt
      uid: 42
      gid: 65532
  groups:
    - name: woodpecker
      gid: 1000
      members:
        - woodpecker
os-release:
  name: Docker Hardened Images (Debian)
  id: debian
  version-id: "13"
  version-codename: trixie
  pretty-name: Docker Hardened Images/Debian GNU/Linux 13 (trixie)
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
work-dir: /
environment:
  DEBIAN_FRONTEND: noninteractive
  GODEBUG: netdns=go
  LANG: en_US.UTF-8
  LANGUAGE: en_US:en
  LC_ALL: en_US.UTF-8
  SQLITE_TMPDIR: /var/lib/woodpecker
  WOODPECKER_DISABLE_VERSION_CHECK: "true"
  WOODPECKER_IN_CONTAINER: "true"
  XDG_CACHE_HOME: /var/lib/woodpecker
  XDG_DATA_HOME: /var/lib/woodpecker
paths:
  - type: directory
    path: /var/lib/woodpecker
    uid: 1000
    gid: 1000
    mode: "0755"
annotations:
  org.opencontainers.image.description: A minimal Woodpecker CI server image
  org.opencontainers.image.licenses: Apache-2.0 AND BSD-3-Clause AND MIT AND CC-BY-3.0
entrypoint:
  - /bin/woodpecker-server
ports:
  - "443"
  - "8000"
  - "9000"
