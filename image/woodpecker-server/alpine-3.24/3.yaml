# syntax=dhi.io/build:2-alpine3.24

name: Woodpecker Server 3.x
image: dhi.io/woodpecker-server
variant: runtime
tags:
  - 3-alpine
  - 3.21-alpine
  - 3-alpine3.24
  - 3.21.0-alpine
  - 3.21-alpine3.24
  - 3.21.0-alpine3.24
platforms:
  - linux/amd64
  - linux/arm64
dates:
  release: "2025-01-18"
vars:
  FLAVORED_SUFFIX: ""
  SEMVER_MAJOR_MINOR_VERSION: "3.21"
  SEMVER_MAJOR_VERSION: "3"
  SEMVER_VERSION: 3.21.0
  SUFFIX: ""
  VERSION: 3.21.0-r0
contents:
  repositories:
    - https://dhi.io/apk/alpine/v3.24/main
    - https://dl-cdn.alpinelinux.org/alpine/v3.24/main
    - https://dl-cdn.alpinelinux.org/alpine/v3.24/community
  keyring:
    - https://dhi.io/keyring/dhi-apk@docker-0F81AD7700D99184.rsa.pub
  packages:
    - alpine-baselayout-data
    - ca-certificates-bundle
    - musl
    - sqlite-libs
    - tzdata
    - woodpecker-server-3=3.21.0-r0
accounts:
  root: true
  run-as: woodpecker
  users:
    - name: woodpecker
      uid: 1000
      gid: 1000
  groups:
    - name: woodpecker
      gid: 1000
      members:
        - woodpecker
os-release:
  name: Docker Hardened Images (Alpine)
  id: alpine
  version-id: "3.24"
  pretty-name: Docker Hardened Images/Alpine Linux v3.24
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
work-dir: /
environment:
  GODEBUG: netdns=go
  SQLITE_TMPDIR: /var/lib/woodpecker
  WOODPECKER_DISABLE_VERSION_CHECK: "true"
  WOODPECKER_IN_CONTAINER: "true"
  XDG_CACHE_HOME: /var/lib/woodpecker
  XDG_DATA_HOME: /var/lib/woodpecker
paths:
  - type: directory
    path: /bin
    uid: 0
    gid: 0
    mode: "0755"
  - type: symlink
    path: /bin/woodpecker-server
    uid: 0
    gid: 0
    source: /usr/bin/woodpecker-server
  - type: directory
    path: /var/lib/woodpecker
    uid: 1000
    gid: 1000
    mode: "0755"
annotations:
  org.opencontainers.image.description: A minimal Woodpecker CI server image
  org.opencontainers.image.licenses: Apache-2.0 AND BSD-3-Clause AND MIT AND CC-BY-3.0
entrypoint:
  - /bin/woodpecker-server
ports:
  - "443"
  - "8000"
  - "9000"
