# syntax=dhi.io/build:2-alpine3.23

name: Redis 8.6.x
image: dhi.io/redis
variant: runtime
tags:
  - 8.6-alpine
  - 8.6.8-alpine
  - 8.6-alpine3.24
  - 8.6.8-alpine3.24
platforms:
  - linux/amd64
  - linux/arm64
dates:
  release: "2026-02-11"
vars:
  REDIS_LICENSE: AGPL-3.0-only
  SEMVER_MAJOR_MINOR_VERSION: "8.6"
  SEMVER_MAJOR_VERSION: "8"
  SEMVER_VERSION: 8.6.8
  VERSION: 8.6.8-r1
contents:
  repositories:
    - https://dhi.io/apk/alpine/v3.24/main
    - https://dl-cdn.alpinelinux.org/alpine/v3.24/main
    - https://dl-cdn.alpinelinux.org/alpine/v3.24/community
  keyring:
    - https://dhi.io/keyring/dhi-apk@docker-0F81AD7700D99184.rsa.pub
  packages:
    - alpine-baselayout-data
    - ca-certificates-bundle
    - libgcc
    - libssl3
    - libstdc++
    - pcre2
    - redis-8.6-sentinel=8.6.8-r1
    - redis-8.6-server=8.6.8-r1
    - redis-8.6-tools=8.6.8-r1
    - tini
    - tzdata
  builds:
    - name: redis sbom
      contents:
        packages:
          - bash
          - coreutils
      pipeline:
        - uses: spdx@v1
          with:
            license: AGPL-3.0-only
            name: redis
            purl: pkg:github/redis/redis@8.6.8
            version: 8.6.8
      outputs:
        - source: /opt/docker/sbom/redis
          target: /opt/docker/sbom/redis
          uid: 0
          gid: 0
accounts:
  run-as: nonroot
  users:
    - name: nonroot
      uid: 65532
      gid: 65532
  groups:
    - name: nonroot
      gid: 65532
      members:
        - nonroot
os-release:
  name: Docker Hardened Images (Alpine)
  id: alpine
  version-id: "3.24"
  pretty-name: Docker Hardened Images/Alpine Linux v3.24
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
work-dir: /data
environment:
  REDIS_VERSION: 8.6.8
paths:
  - type: directory
    path: /usr/bin
    uid: 0
    gid: 0
  - type: symlink
    path: /usr/bin/tini
    uid: 0
    gid: 0
    source: /sbin/tini
  - type: directory
    path: /usr/local/bin
    uid: 0
    gid: 0
