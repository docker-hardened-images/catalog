# syntax=dhi.io/build:2-debian13

name: Redis 8.10.x
image: dhi.io/redis
variant: runtime
tags:
  - "8"
  - "8.10"
  - 8.10.1
  - 8-debian
  - 8-debian13
  - 8.10-debian
  - 8.10-debian13
  - 8.10.1-debian
  - 8.10.1-debian13
platforms:
  - linux/amd64
  - linux/arm64
dates:
  release: "2026-07-29"
vars:
  COMMIT_SHA: 3399357e7c17b668289386b8a15a3037bc4527b1
  HAS_MODULES: "true"
  LLVM_VERSION: "21"
  MODULE_BUILD_FLOW: modern
  REDIS_FULL_CHECKSUM: sha256:e5cae2686231290bf55ae5cc4da01e646c3424233cae7618ebf3a64250ef1583
  REDIS_LICENSE: AGPL-3.0-only
  REDISBLOOM_VERSION: 8.10.1
  REDISEARCH_VERSION: 8.10.0
  REDISJSON_VERSION: 8.10.0
  REDISTIMESERIES_VERSION: 8.10.0
  SEMVER_MAJOR_MINOR_VERSION: "8.10"
  SEMVER_MAJOR_VERSION: "8"
  SEMVER_VERSION: 8.10.1
  VERSION: 8.10.1
contents:
  repositories:
    - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
  keyring:
    - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
  packages:
    - '!libelogind0'
    - '!mawk'
    - '!original-awk'
    - base-files
    - ca-certificates
    - libcrypt1
    - libpcre2-8-0
    - libssl3t64
    - libstdc++6
    - tini
  builds:
    - name: redis
      work-dir: ${source.dir}/redis
      contents:
        repositories:
          - deb http://deb.debian.org/debian trixie-backports main
        packages:
          - autoconf
          - automake
          - bash
          - ca-certificates
          - clang-21
          - cmake
          - coreutils
          - findutils
          - g++
          - gcc
          - git
          - gnu-which
          - grep
          - gzip
          - libc6-dev
          - libssl-dev
          - libtool
          - lld-21
          - llvm-21
          - make
          - pkgconf
          - python3
          - python3-dev
          - python3-pip
          - python3-venv
          - rsync
          - sed
          - unzip
          - wget
          - xz-utils
        files:
          - url: https://github.com/redis/redis/releases/download/8.10.1/redis-full.tar.gz
            checksum: sha256:e5cae2686231290bf55ae5cc4da01e646c3424233cae7618ebf3a64250ef1583
            path: ${source.dir}/redis/redis-full.tar.gz
            spdx:
              name: redis
              version: 8.10.1
              packages:
                - name: redis
                  purl: pkg:github/redis/redis@8.10.1
                  license: AGPL-3.0-only
            uid: 0
            gid: 0
      pipeline:
        - name: extract full Redis source
          runs: |
            set -eux -o pipefail

            tar -xzf redis-full.tar.gz --strip-components=1
            rm redis-full.tar.gz
        - uses: spdx@v1
          with:
            license: AGPL-3.0-only
            name: redisbloom
            purl: pkg:github/redisbloom/redisbloom@v8.10.1
            version: 8.10.1
        - uses: spdx@v1
          with:
            license: AGPL-3.0-only
            name: redisearch
            purl: pkg:github/redisearch/redisearch@v8.10.0
            version: 8.10.0
        - uses: spdx@v1
          with:
            license: AGPL-3.0-only
            name: redisjson
            purl: pkg:github/redisjson/redisjson@v8.10.0
            version: 8.10.0
        - uses: spdx@v1
          with:
            license: AGPL-3.0-only
            name: redistimeseries
            purl: pkg:github/redistimeseries/redistimeseries@v8.10.0
            version: 8.10.0
        - name: patch build
          runs: |
            set -eux -o pipefail

            # https://github.com/redis/redis/commit/edd4d555df57dc84265fdfb4ef59a4678832f6da
            # grep -E '^ *createBoolConfig[(]"protected-mode",.*, *1 *,.*[)],$' '${source.dir}/redis/src/config.c'
            # sed -ri 's!^( *createBoolConfig[(]"protected-mode",.*, *)1( *,.*[)],)$!\10\2!' '${source.dir}/redis/src/config.c'
            # grep -E '^ *createBoolConfig[(]"protected-mode",.*, *0 *,.*[)],$' '${source.dir}/redis/src/config.c'

            # https://github.com/jemalloc/jemalloc/issues/467
            if [ ${target.arch} = arm64 ]; then
              jemallocFlags="--build=aarch64-linux-gnu --with-lg-page=16 --with-lg-hugepage=21"
            else
              jemallocFlags="--build=x86_64-linux-gnu --with-lg-page=12 --with-lg-hugepage=21"
            fi
            grep -F 'cd jemalloc && ./configure ' '${source.dir}/redis/deps/Makefile'
            sed -ri 's!cd jemalloc && ./configure !&'"$jemallocFlags"' !' '${source.dir}/redis/deps/Makefile'
            grep -F "cd jemalloc && ./configure $jemallocFlags " '${source.dir}/redis/deps/Makefile'
        - name: build and deploy with bundled modules
          privileged: true
          runs: |
            set -eux -o pipefail

            export PATH=/usr/lib/llvm-21/bin:$PATH
            export BUILD_TLS=yes INSTALL_RUST_TOOLCHAIN=yes DISABLE_WERRORS=yes

            make -j"$(nproc)" deploy DESTDIR=${target.dir} PREFIX=/usr/local
            sed -ri 's!^loadmodule ${target.dir}/usr/local/!loadmodule /usr/local/!' redis.conf
            ! grep -F 'loadmodule ${target.dir}/usr/local/' redis.conf
        - name: patch config
          runs: |
            set -eux -o pipefail

            echo 'include /etc/redis/conf.d/*.conf' >> '${source.dir}/redis/redis.conf'
        - name: preserve full config path
          runs: |
            set -eux -o pipefail

            cp redis.conf redis-full.conf
      outputs:
        - source: ${target.dir}/usr/local/bin
          target: /usr/local/bin
          uid: 0
          gid: 0
        - source: ${target.dir}/usr/local/lib/redis/modules
          target: /usr/local/lib/redis/modules
          uid: 0
          gid: 0
        - source: ${source.dir}/redis/redis.conf
          target: /etc/redis/redis.conf
          uid: 0
          gid: 0
          mode: "0644"
        - source: ${source.dir}/redis/redis-full.conf
          target: /etc/redis/redis-full.conf
          uid: 0
          gid: 0
          mode: "0644"
        - source: /opt/docker/sbom/redis
          target: /opt/docker/sbom/redis
          uid: 0
          gid: 0
        - source: /opt/docker/sbom/redisbloom
          target: /opt/docker/sbom/redisbloom
          uid: 0
          gid: 0
        - source: /opt/docker/sbom/redisearch
          target: /opt/docker/sbom/redisearch
          uid: 0
          gid: 0
        - source: /opt/docker/sbom/redisjson
          target: /opt/docker/sbom/redisjson
          uid: 0
          gid: 0
        - source: /opt/docker/sbom/redistimeseries
          target: /opt/docker/sbom/redistimeseries
          uid: 0
          gid: 0
accounts:
  run-as: nonroot
  users:
    - name: nonroot
      uid: 65532
      gid: 65532
  groups:
    - name: nonroot
      gid: 65532
      members:
        - nonroot
os-release:
  name: Docker Hardened Images (Debian)
  id: debian
  version-id: "13"
  version-codename: trixie
  pretty-name: Docker Hardened Images/Debian GNU/Linux 13 (trixie)
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
work-dir: /data
environment:
  REDIS_VERSION: 8.10.1
paths:
  - type: directory
    path: /var/lib/redis
    uid: 65532
    gid: 65532
    mode: "0755"
  - type: directory
    path: /var/log/redis
    uid: 65532
    gid: 65532
    mode: "0755"
  - type: directory
    path: /run/redis
    uid: 65532
    gid: 65532
    mode: "0755"
  - type: directory
    path: /data
    uid: 65532
    gid: 65532
    mode: "0755"
  - type: file
    path: /etc/redis/conf.d/docker.conf
    content: |
      daemonize no
      bind 0.0.0.0 -::1
      logfile ""
    uid: 0
    gid: 0
    mode: "0555"
annotations:
  org.opencontainers.image.description: A minimal Redis image
  org.opencontainers.image.licenses: AGPL-3.0-only
entrypoint:
  - /usr/bin/tini
  - --
cmd:
  - redis-server
  - /etc/redis/redis.conf
