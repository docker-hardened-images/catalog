# syntax=dhi.io/build:2-debian13

name: Redis 8.6.x (compat)
image: dhi.io/redis
variant: runtime
flavor: compat
tags:
  - 8.6-compat
  - 8.6.8-compat
  - 8.6-debian-compat
  - 8.6-debian13-compat
  - 8.6.8-debian-compat
  - 8.6.8-debian13-compat
platforms:
  - linux/amd64
  - linux/arm64
dates:
  release: "2026-03-24"
vars:
  HAS_MODULES: "true"
  MODULE_BUILD_FLOW: legacy
  PACKAGE_NAME: redis-8.6
  REDIS_LICENSE: AGPL-3.0-only
  SEMVER_MAJOR_MINOR_VERSION: "8.6"
  SEMVER_MAJOR_VERSION: "8"
  SEMVER_VERSION: 8.6.8
  VERSION: 8.6.8-3
contents:
  repositories:
    - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
  keyring:
    - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
  packages:
    - '!libelogind0'
    - '!mawk'
    - '!original-awk'
    - base-files
    - bash
    - ca-certificates
    - coreutils
    - findutils
    - grep
    - hostname
    - libc-bin
    - libc6
    - libgcc-s1
    - libpcre2-8-0
    - libssl3t64
    - libstdc++6
    - mawk
    - openssl
    - procps
    - redis-8.6-sentinel=8.6.8-3
    - redis-8.6-server=8.6.8-3
    - redis-8.6-tools=8.6.8-3
    - sed
    - tini
  builds:
    - name: redis sbom
      contents:
        packages:
          - bash
          - coreutils
      pipeline:
        - uses: spdx@v1
          with:
            license: AGPL-3.0-only
            name: redis
            purl: pkg:github/redis/redis@8.6.8
            version: 8.6.8
      outputs:
        - source: /opt/docker/sbom/redis
          target: /opt/docker/sbom/redis
          uid: 0
          gid: 0
accounts:
  run-as: nonroot
  users:
    - name: nonroot
      uid: 65532
      gid: 65532
  groups:
    - name: nonroot
      gid: 65532
      members:
        - nonroot
os-release:
  name: Docker Hardened Images (Debian)
  id: debian
  version-id: "13"
  version-codename: trixie
  pretty-name: Docker Hardened Images/Debian GNU/Linux 13 (trixie)
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
work-dir: /data
environment:
  REDIS_VERSION: 8.6.8
paths:
  - type: directory
    path: /usr/local/bin
    uid: 0
    gid: 0
    mode: "0755"
  - type: symlink
    path: /usr/local/bin/redis-benchmark
    uid: 0
    gid: 0
    source: /usr/bin/redis-benchmark
  - type: symlink
    path: /usr/local/bin/redis-check-aof
    uid: 0
    gid: 0
    source: /usr/bin/redis-check-aof
  - type: symlink
    path: /usr/local/bin/redis-check-rdb
    uid: 0
    gid: 0
    source: /usr/bin/redis-check-rdb
  - type: symlink
    path: /usr/local/bin/redis-cli
    uid: 0
    gid: 0
    source: /usr/bin/redis-cli
  - type: symlink
    path: /usr/local/bin/redis-sentinel
    uid: 0
    gid: 0
    source: /usr/bin/redis-sentinel
  - type: symlink
    path: /usr/local/bin/redis-server
    uid: 0
    gid: 0
    source: /usr/bin/redis-server
  - type: directory
    path: /usr/local/lib
    uid: 0
    gid: 0
    mode: "0755"
  - type: symlink
    path: /usr/local/lib/redis
    uid: 0
    gid: 0
    source: /usr/lib/redis
  - type: directory
    path: /var/lib/redis
    uid: 65532
    gid: 65532
    mode: "0755"
  - type: directory
    path: /var/log/redis
    uid: 65532
    gid: 65532
    mode: "0755"
  - type: directory
    path: /run/redis
    uid: 65532
    gid: 65532
    mode: "0755"
  - type: directory
    path: /data
    uid: 65532
    gid: 65532
    mode: "0755"
  - type: file
    path: /etc/redis/conf.d/docker.conf
    content: |
      daemonize no
      bind 0.0.0.0 -::1
      logfile ""
    uid: 0
    gid: 0
    mode: "0555"
  - type: file
    path: /usr/local/bin/docker-entrypoint.sh
    content: |
      #!/bin/sh
      set -e

      if [ "${1#-}" != "$1" ]; then
        # docker run dhi/redis --flag
        set -- /etc/redis/redis.conf "$@"
      fi

      if [ "${1%.conf}" != "$1" ]; then
        # docker run dhi/redis /path/to/custom/conf [optional flags]
        set -- redis-server "$@"
      fi

      # set an appropriate umask (if one isn't set)
      # - https://github.com/redis/redis/blob/bb875603fb7ff3f9d19aad906bd45d7db98d9a39/utils/systemd-redis_server.service#L37
      um="$(umask)"
      if [ "$um" = '0022' ]; then
        umask 0077
      fi

      exec "$@"
    uid: 0
    gid: 0
    mode: "0755"
annotations:
  org.opencontainers.image.description: A minimal Redis image
  org.opencontainers.image.licenses: AGPL-3.0-only
entrypoint:
  - /usr/bin/tini
  - --
  - /usr/local/bin/docker-entrypoint.sh
cmd:
  - redis-server
  - /etc/redis/redis.conf
