# syntax=dhi.io/build:2-debian13

name: Redis 8.10.x (dev)
image: dhi.io/redis
variant: dev
tags:
  - 8-dev
  - 8.10-dev
  - 8.10.3-dev
  - 8-debian-dev
  - 8-debian13-dev
  - 8.10-debian-dev
  - 8.10-debian13-dev
  - 8.10.3-debian-dev
  - 8.10.3-debian13-dev
platforms:
  - linux/amd64
  - linux/arm64
dates:
  release: "2026-07-29"
vars:
  HAS_MODULES: "true"
  MODULE_BUILD_FLOW: modern
  REDIS_LICENSE: AGPL-3.0-only
  REDISBLOOM_VERSION: 8.10.1
  REDISEARCH_VERSION: 8.10.1
  REDISJSON_VERSION: 8.10.0
  REDISTIMESERIES_VERSION: 8.10.1
  SEMVER_MAJOR_MINOR_VERSION: "8.10"
  SEMVER_MAJOR_VERSION: "8"
  SEMVER_VERSION: 8.10.3
  VERSION: 8.10.3-2
contents:
  repositories:
    - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
  keyring:
    - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
  packages:
    - '!gawk'
    - '!libelogind0'
    - '!mawk'
    - '!original-awk'
    - apt
    - base-files
    - bash
    - ca-certificates
    - coreutils
    - diffutils
    - dpkg
    - findutils
    - grep
    - hostname
    - libc-bin
    - libc6
    - libcrypt1
    - libgcc-s1
    - libpcre2-8-0
    - libssl3t64
    - libstdc++6
    - mawk
    - perl-base
    - redis-8.10-sentinel=8.10.3-2
    - redis-8.10-server=8.10.3-2
    - redis-8.10-tools=8.10.3-2
    - sed
    - tini
    - util-linux
  builds:
    - name: redis sbom
      contents:
        packages:
          - bash
          - coreutils
      pipeline:
        - uses: spdx@v1
          with:
            license: AGPL-3.0-only
            name: redis
            purl: pkg:github/redis/redis@8.10.3
            version: 8.10.3
        - uses: spdx@v1
          with:
            license: AGPL-3.0-only
            name: redisbloom
            purl: pkg:github/redisbloom/redisbloom@v8.10.1
            version: 8.10.1
        - uses: spdx@v1
          with:
            license: AGPL-3.0-only
            name: redisearch
            purl: pkg:github/redisearch/redisearch@v8.10.1
            version: 8.10.1
        - uses: spdx@v1
          with:
            license: AGPL-3.0-only
            name: redisjson
            purl: pkg:github/redisjson/redisjson@v8.10.0
            version: 8.10.0
        - uses: spdx@v1
          with:
            license: AGPL-3.0-only
            name: redistimeseries
            purl: pkg:github/redistimeseries/redistimeseries@v8.10.1
            version: 8.10.1
      outputs:
        - source: /opt/docker/sbom/redis
          target: /opt/docker/sbom/redis
          uid: 0
          gid: 0
        - source: /opt/docker/sbom/redisbloom
          target: /opt/docker/sbom/redisbloom
          uid: 0
          gid: 0
        - source: /opt/docker/sbom/redisearch
          target: /opt/docker/sbom/redisearch
          uid: 0
          gid: 0
        - source: /opt/docker/sbom/redisjson
          target: /opt/docker/sbom/redisjson
          uid: 0
          gid: 0
        - source: /opt/docker/sbom/redistimeseries
          target: /opt/docker/sbom/redistimeseries
          uid: 0
          gid: 0
accounts:
  root: true
  run-as: root
  users:
    - name: nonroot
      uid: 65532
      gid: 65532
    - name: _apt
      uid: 42
      gid: 65532
  groups:
    - name: nonroot
      gid: 65532
      members:
        - nonroot
os-release:
  name: Docker Hardened Images (Debian)
  id: debian
  version-id: "13"
  version-codename: trixie
  pretty-name: Docker Hardened Images/Debian GNU/Linux 13 (trixie)
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
work-dir: /data
environment:
  DEBIAN_FRONTEND: noninteractive
  REDIS_VERSION: 8.10.3
paths:
  - type: directory
    path: /usr/local/bin
    uid: 0
    gid: 0
    mode: "0755"
  - type: symlink
    path: /usr/local/bin/redis-benchmark
    uid: 0
    gid: 0
    source: /usr/bin/redis-benchmark
  - type: symlink
    path: /usr/local/bin/redis-check-aof
    uid: 0
    gid: 0
    source: /usr/bin/redis-check-aof
  - type: symlink
    path: /usr/local/bin/redis-check-rdb
    uid: 0
    gid: 0
    source: /usr/bin/redis-check-rdb
  - type: symlink
    path: /usr/local/bin/redis-cli
    uid: 0
    gid: 0
    source: /usr/bin/redis-cli
  - type: symlink
    path: /usr/local/bin/redis-sentinel
    uid: 0
    gid: 0
    source: /usr/bin/redis-sentinel
  - type: symlink
    path: /usr/local/bin/redis-server
    uid: 0
    gid: 0
    source: /usr/bin/redis-server
  - type: directory
    path: /usr/local/lib
    uid: 0
    gid: 0
    mode: "0755"
  - type: symlink
    path: /usr/local/lib/redis
    uid: 0
    gid: 0
    source: /usr/lib/redis
  - type: directory
    path: /var/lib/redis
    uid: 65532
    gid: 65532
    mode: "0755"
  - type: directory
    path: /var/log/redis
    uid: 65532
    gid: 65532
    mode: "0755"
  - type: directory
    path: /run/redis
    uid: 65532
    gid: 65532
    mode: "0755"
  - type: directory
    path: /data
    uid: 65532
    gid: 65532
    mode: "0755"
  - type: file
    path: /etc/redis/conf.d/docker.conf
    content: |
      daemonize no
      bind 0.0.0.0 -::1
      logfile ""
    uid: 0
    gid: 0
    mode: "0555"
annotations:
  org.opencontainers.image.description: A minimal Redis image
  org.opencontainers.image.licenses: AGPL-3.0-only
entrypoint:
  - /usr/bin/tini
  - --
cmd:
  - redis-server
  - /etc/redis/redis.conf
