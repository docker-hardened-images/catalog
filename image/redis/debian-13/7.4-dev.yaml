# syntax=dhi.io/build:2-debian13

name: Redis 7.4.x (dev)
image: dhi.io/redis
variant: dev
tags:
  - 7-dev
  - 7.4-dev
  - 7.4.12-dev
  - 7-debian-dev
  - 7-debian13-dev
  - 7.4-debian-dev
  - 7.4-debian13-dev
  - 7.4.12-debian-dev
  - 7.4.12-debian13-dev
platforms:
  - linux/amd64
  - linux/arm64
dates:
  release: "2024-07-29"
  end-of-life: "2026-11-30"
vars:
  MODULE_BUILD_FLOW: legacy
  REDIS_LICENSE: SSPL-1.0
  SEMVER_MAJOR_MINOR_VERSION: "7.4"
  SEMVER_MAJOR_VERSION: "7"
  SEMVER_VERSION: 7.4.12
  VERSION: 7.4.12-2
contents:
  repositories:
    - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
  keyring:
    - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
  packages:
    - '!gawk'
    - '!libelogind0'
    - '!mawk'
    - '!original-awk'
    - apt
    - base-files
    - bash
    - ca-certificates
    - coreutils
    - diffutils
    - dpkg
    - findutils
    - grep
    - hostname
    - libc-bin
    - libc6
    - libgcc-s1
    - libpcre2-8-0
    - libssl3t64
    - libstdc++6
    - mawk
    - perl-base
    - redis-7.4-sentinel=7.4.12-2
    - redis-7.4-server=7.4.12-2
    - redis-7.4-tools=7.4.12-2
    - sed
    - tini
    - util-linux
  builds:
    - name: redis sbom
      contents:
        packages:
          - bash
          - coreutils
      pipeline:
        - uses: spdx@v1
          with:
            license: SSPL-1.0
            name: redis
            purl: pkg:github/redis/redis@7.4.12
            version: 7.4.12
      outputs:
        - source: /opt/docker/sbom/redis
          target: /opt/docker/sbom/redis
          uid: 0
          gid: 0
accounts:
  root: true
  run-as: root
  users:
    - name: nonroot
      uid: 65532
      gid: 65532
    - name: _apt
      uid: 42
      gid: 65532
  groups:
    - name: nonroot
      gid: 65532
      members:
        - nonroot
os-release:
  name: Docker Hardened Images (Debian)
  id: debian
  version-id: "13"
  version-codename: trixie
  pretty-name: Docker Hardened Images/Debian GNU/Linux 13 (trixie)
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
work-dir: /data
environment:
  DEBIAN_FRONTEND: noninteractive
  REDIS_VERSION: 7.4.12
paths:
  - type: directory
    path: /usr/local/bin
    uid: 0
    gid: 0
    mode: "0755"
  - type: symlink
    path: /usr/local/bin/redis-benchmark
    uid: 0
    gid: 0
    source: /usr/bin/redis-benchmark
  - type: symlink
    path: /usr/local/bin/redis-check-aof
    uid: 0
    gid: 0
    source: /usr/bin/redis-check-aof
  - type: symlink
    path: /usr/local/bin/redis-check-rdb
    uid: 0
    gid: 0
    source: /usr/bin/redis-check-rdb
  - type: symlink
    path: /usr/local/bin/redis-cli
    uid: 0
    gid: 0
    source: /usr/bin/redis-cli
  - type: symlink
    path: /usr/local/bin/redis-sentinel
    uid: 0
    gid: 0
    source: /usr/bin/redis-sentinel
  - type: symlink
    path: /usr/local/bin/redis-server
    uid: 0
    gid: 0
    source: /usr/bin/redis-server
  - type: directory
    path: /var/lib/redis
    uid: 65532
    gid: 65532
    mode: "0755"
  - type: directory
    path: /var/log/redis
    uid: 65532
    gid: 65532
    mode: "0755"
  - type: directory
    path: /run/redis
    uid: 65532
    gid: 65532
    mode: "0755"
  - type: directory
    path: /data
    uid: 65532
    gid: 65532
    mode: "0755"
  - type: file
    path: /etc/redis/conf.d/docker.conf
    content: |
      daemonize no
      bind 0.0.0.0 -::1
      logfile ""
    uid: 0
    gid: 0
    mode: "0555"
annotations:
  org.opencontainers.image.description: A minimal Redis image
  org.opencontainers.image.licenses: SSPL-1.0
entrypoint:
  - /usr/bin/tini
  - --
cmd:
  - redis-server
  - /etc/redis/redis.conf
