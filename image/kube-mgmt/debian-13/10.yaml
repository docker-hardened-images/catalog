# syntax=dhi.io/build:2-debian13

name: kube-mgmt 10.x
image: dhi.io/kube-mgmt
variant: runtime
tags:
  - "10"
  - "10.0"
  - 10.0.0
  - 10-debian
  - 10-debian13
  - 10.0-debian
  - 10.0-debian13
  - 10.0.0-debian
  - 10.0.0-debian13
platforms:
  - linux/amd64
  - linux/arm64
dates:
  release: "2026-02-05"
vars:
  FLAVORED_SUFFIX: ""
  PACKAGE_NAME: kube-mgmt-10
  SEMVER_MAJOR_MINOR_VERSION: "10.0"
  SEMVER_MAJOR_VERSION: "10"
  SEMVER_VERSION: 10.0.0
  SUFFIX: ""
  VERSION: 10.0.0-2
contents:
  repositories:
    - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
  keyring:
    - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
  packages:
    - base-files
    - ca-certificates-bundle
    - kube-mgmt-10=10.0.0-2
    - tzdata
accounts:
  run-as: nonroot
  users:
    - name: nonroot
      uid: 65532
      gid: 65532
  groups:
    - name: nonroot
      gid: 65532
      members:
        - nonroot
os-release:
  name: Docker Hardened Images (Debian)
  id: debian
  version-id: "13"
  version-codename: trixie
  pretty-name: Docker Hardened Images/Debian GNU/Linux 13 (trixie)
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
paths:
  - type: directory
    path: /usr/local/bin
    uid: 0
    gid: 0
  - type: symlink
    path: /usr/local/bin/kube-mgmt
    uid: 0
    gid: 0
    source: /usr/bin/kube-mgmt
annotations:
  org.opencontainers.image.description: A minimal kube-mgmt image
  org.opencontainers.image.licenses: Apache-2.0
entrypoint:
  - /usr/local/bin/kube-mgmt
