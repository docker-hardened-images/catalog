metadata:
  display-name: Socket CLI
  short-description: Socket CLI scans npm, pnpm, and yarn projects for supply-chain security risks -- malicious packages, typosquats, and known vulnerabilities -- from the command line and CI pipelines.
  featured: false
  home-url: https://socket.dev
  categories:
    - developer-tools
    - security
  included-tools:
    - name: socket
      description: Main Socket CLI entry point (scan, package score, patch, login, and more).
    - name: socket-npm
      description: Wraps npm install/publish with Socket security scoring (needs npm, present in the dev variant).
    - name: socket-npx
      description: Wraps npx with Socket security scoring (needs npx, present in the dev variant).
