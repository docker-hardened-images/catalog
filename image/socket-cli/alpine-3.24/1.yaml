# syntax=dhi.io/build:2-alpine3.24

name: Socket CLI 1.x
image: dhi.io/socket-cli
variant: runtime
tags:
  - 1-alpine
  - 1.1-alpine
  - 1-alpine3.24
  - 1.1-alpine3.24
  - 1.1.167-alpine
  - 1.1.167-alpine3.24
platforms:
  - linux/amd64
  - linux/arm64
dates:
  release: "2025-06-13"
vars:
  FLAVORED_SUFFIX: ""
  NODEJS_MAJOR: "24"
  NODEJS_VERSION: 24.20.0-r0
  SEMVER_MAJOR_MINOR_VERSION: "1.1"
  SEMVER_MAJOR_VERSION: "1"
  SEMVER_VERSION: 1.1.167
  SUFFIX: ""
  VERSION: 1.1.167-r0
contents:
  repositories:
    - https://dhi.io/apk/alpine/v3.24/main
    - https://dl-cdn.alpinelinux.org/alpine/v3.24/main
    - https://dl-cdn.alpinelinux.org/alpine/v3.24/community
  keyring:
    - https://dhi.io/keyring/dhi-apk@docker-0F81AD7700D99184.rsa.pub
  packages:
    - alpine-baselayout-data
    - ca-certificates-bundle
    - nodejs-24=24.20.0-r0
    - socket-cli-1=1.1.167-r0
    - tzdata
accounts:
  run-as: nonroot
  users:
    - name: nonroot
      uid: 65532
      gid: 65532
  groups:
    - name: nonroot
      gid: 65532
      members:
        - nonroot
os-release:
  name: Docker Hardened Images (Alpine)
  id: alpine
  version-id: "3.24"
  pretty-name: Docker Hardened Images/Alpine Linux v3.24
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
work-dir: /work
environment:
  NODE_COMPILE_CACHE: /tmp
  NODE_ENV: production
paths:
  - type: directory
    path: /work
    uid: 65532
    gid: 65532
    mode: "0770"
  - type: symlink
    path: /app
    uid: 0
    gid: 0
    source: /usr/lib/nodejs/socket-cli
  - type: directory
    path: /usr/local/bin
    uid: 0
    gid: 0
    mode: "0755"
  - type: symlink
    path: /usr/local/bin/socket
    uid: 0
    gid: 0
    source: /usr/lib/nodejs/socket-cli/bin/cli.js
  - type: symlink
    path: /usr/local/bin/socket-npm
    uid: 0
    gid: 0
    source: /usr/lib/nodejs/socket-cli/bin/npm-cli.js
  - type: symlink
    path: /usr/local/bin/socket-npx
    uid: 0
    gid: 0
    source: /usr/lib/nodejs/socket-cli/bin/npx-cli.js
  - type: symlink
    path: /usr/local/bin/socket-pnpm
    uid: 0
    gid: 0
    source: /usr/lib/nodejs/socket-cli/bin/pnpm-cli.js
  - type: symlink
    path: /usr/local/bin/socket-yarn
    uid: 0
    gid: 0
    source: /usr/lib/nodejs/socket-cli/bin/yarn-cli.js
annotations:
  org.opencontainers.image.description: Socket CLI - supply-chain security scanning for npm, pnpm, and yarn projects
  org.opencontainers.image.licenses: MIT
entrypoint:
  - node
  - /app/bin/cli.js
cmd:
  - --help
