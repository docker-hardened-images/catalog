# syntax=dhi.io/build:2-debian13

name: Socket CLI 1.x
image: dhi.io/socket-cli
variant: runtime
tags:
  - "1"
  - "1.1"
  - 1.1.167
  - 1-debian
  - 1-debian13
  - 1.1-debian
  - 1.1-debian13
  - 1.1.167-debian
  - 1.1.167-debian13
platforms:
  - linux/amd64
  - linux/arm64
dates:
  release: "2025-06-13"
vars:
  NODEJS_MAJOR: "24"
  NODEJS_VERSION: 24.20.0-0
  SEMVER_MAJOR_MINOR_VERSION: "1.1"
  SEMVER_MAJOR_VERSION: "1"
  SEMVER_VERSION: 1.1.167
  VERSION: 1.1.167-0
contents:
  repositories:
    - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
  keyring:
    - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
  packages:
    - '!libelogind0'
    - '!mawk'
    - '!original-awk'
    - base-files
    - ca-certificates
    - libgomp1
    - libstdc++6
    - nodejs-24=24.20.0-0
    - socket-cli-1=1.1.167-0
    - tzdata
accounts:
  run-as: nonroot
  users:
    - name: nonroot
      uid: 65532
      gid: 65532
  groups:
    - name: nonroot
      gid: 65532
      members:
        - nonroot
os-release:
  name: Docker Hardened Images (Debian)
  id: debian
  version-id: "13"
  version-codename: trixie
  pretty-name: Docker Hardened Images/Debian GNU/Linux 13 (trixie)
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
work-dir: /work
environment:
  NODE_COMPILE_CACHE: /tmp
  NODE_ENV: production
paths:
  - type: directory
    path: /work
    uid: 65532
    gid: 65532
    mode: "0770"
  - type: symlink
    path: /app
    uid: 0
    gid: 0
    source: /usr/lib/nodejs/socket-cli
  - type: directory
    path: /usr/local/bin
    uid: 0
    gid: 0
    mode: "0755"
  - type: symlink
    path: /usr/local/bin/socket
    uid: 0
    gid: 0
    source: /usr/lib/nodejs/socket-cli/bin/cli.js
  - type: symlink
    path: /usr/local/bin/socket-npm
    uid: 0
    gid: 0
    source: /usr/lib/nodejs/socket-cli/bin/npm-cli.js
  - type: symlink
    path: /usr/local/bin/socket-npx
    uid: 0
    gid: 0
    source: /usr/lib/nodejs/socket-cli/bin/npx-cli.js
  - type: symlink
    path: /usr/local/bin/socket-pnpm
    uid: 0
    gid: 0
    source: /usr/lib/nodejs/socket-cli/bin/pnpm-cli.js
  - type: symlink
    path: /usr/local/bin/socket-yarn
    uid: 0
    gid: 0
    source: /usr/lib/nodejs/socket-cli/bin/yarn-cli.js
annotations:
  org.opencontainers.image.description: Socket CLI - supply-chain security scanning for npm, pnpm, and yarn projects
  org.opencontainers.image.licenses: MIT
entrypoint:
  - node
  - /app/bin/cli.js
cmd:
  - --help
