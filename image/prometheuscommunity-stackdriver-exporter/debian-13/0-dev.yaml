# syntax=dhi.io/build:2-debian13

name: Stackdriver Exporter 0.x (dev)
image: dhi.io/prometheuscommunity-stackdriver-exporter
variant: dev
tags:
  - 0-dev
  - 0.19-dev
  - 0.19.0-dev
  - 0-debian-dev
  - 0-debian13-dev
  - 0.19-debian-dev
  - 0.19-debian13-dev
  - 0.19.0-debian-dev
  - 0.19.0-debian13-dev
platforms:
  - linux/amd64
  - linux/arm64
dates:
  release: "2017-06-03"
vars:
  DEBIAN_EPOCH_MAJOR_MINOR_VERSION: "0.19"
  DEBIAN_EPOCH_MAJOR_VERSION: "0"
  DEBIAN_EPOCH_VERSION: 0.19.0
  FLAVORED_SUFFIX: -dev
  SUFFIX: -dev
  VERSION: 0.19.0-3
contents:
  repositories:
    - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
  keyring:
    - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
  packages:
    - '!gawk'
    - '!libelogind0'
    - '!mawk'
    - '!original-awk'
    - apt
    - base-files
    - bash
    - ca-certificates
    - ca-certificates-bundle
    - coreutils
    - diffutils
    - dpkg
    - findutils
    - grep
    - libc-bin
    - mawk
    - perl-base
    - sed
    - stackdriver-exporter-0-dev=0.19.0-3
    - tzdata
    - util-linux
accounts:
  root: true
  run-as: root
  users:
    - name: nonroot
      uid: 65532
      gid: 65532
    - name: _apt
      uid: 42
      gid: 65532
  groups:
    - name: nonroot
      gid: 65532
      members:
        - nonroot
os-release:
  name: Docker Hardened Images (Debian)
  id: debian
  version-id: "13"
  version-codename: trixie
  pretty-name: Docker Hardened Images/Debian GNU/Linux 13 (trixie)
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
environment:
  DEBIAN_FRONTEND: noninteractive
paths:
  - type: directory
    path: /usr/local/bin
    uid: 0
    gid: 0
    mode: "0755"
  - type: symlink
    path: /usr/local/bin/stackdriver_exporter
    uid: 0
    gid: 0
    source: /usr/bin/stackdriver_exporter
  - type: symlink
    path: /LICENSE
    uid: 0
    gid: 0
    source: /usr/share/stackdriver-exporter/LICENSE
  - type: directory
    path: /home/nonroot/.config
    uid: 65532
    gid: 65532
    mode: "0755"
  - type: symlink
    path: /home/nonroot/.config/gcloud
    uid: 0
    gid: 0
    source: /home/.config/gcloud
annotations:
  org.opencontainers.image.description: A minimal Stackdriver Exporter image
  org.opencontainers.image.licenses: Apache-2.0
entrypoint:
  - /usr/local/bin/stackdriver_exporter
ports:
  - 9255/tcp
