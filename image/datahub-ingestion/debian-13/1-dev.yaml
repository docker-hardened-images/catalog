# syntax=dhi.io/build:2-debian13

name: DataHub Ingestion 1.5.x (dev)
image: dhi.io/datahub-ingestion
variant: dev
tags:
  - 1-dev
  - 1.5-dev
  - 1.5.0-dev
  - 1.5.0.7-dev
  - 1-debian-dev
  - 1-debian13-dev
  - 1.5-debian-dev
  - 1.5-debian13-dev
  - 1.5.0-debian-dev
  - 1.5.0-debian13-dev
  - 1.5.0.7-debian-dev
  - 1.5.0.7-debian13-dev
platforms:
  - linux/amd64
  - linux/arm64
dates:
  release: "2025-10-01"
vars:
  PYTHON_MAJOR_MINOR_VERSION: "3.10"
  SEMVER_MAJOR_MINOR_VERSION: "1.5"
  SEMVER_MAJOR_VERSION: "1"
  SEMVER_VERSION: 1.5.0.7
  VERSION: 1.5.0.7-0
  VERSION_MAJOR_MINOR_PATCH: 1.5.0
contents:
  repositories:
    - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
  keyring:
    - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
  packages:
    - '!gawk'
    - '!libelogind0'
    - '!original-awk'
    - apt
    - base-files
    - bash
    - ca-certificates
    - coreutils
    - datahub-ingestion=1.5.0.7-0
    - diffutils
    - dpkg
    - findutils
    - grep
    - krb5-config
    - krb5-user
    - libaio1t64
    - libc-bin
    - libffi8
    - libkrb5-3
    - libkrb5support0
    - libldap2
    - libodbc2
    - librdkafka1
    - libsasl2-2
    - libsasl2-modules
    - libsasl2-modules-gssapi-mit
    - libsasl2-modules-ldap
    - libstdc++6
    - mawk
    - perl-base
    - python-3.10
    - sed
    - tzdata
    - unixodbc
    - util-linux
accounts:
  root: true
  run-as: root
  users:
    - name: nonroot
      uid: 65532
      gid: 65532
    - name: _apt
      uid: 42
      gid: 65532
  groups:
    - name: nonroot
      gid: 65532
      members:
        - nonroot
os-release:
  name: Docker Hardened Images (Debian)
  id: debian
  version-id: "13"
  version-codename: trixie
  pretty-name: Docker Hardened Images/Debian GNU/Linux 13 (trixie)
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
work-dir: /home/nonroot
environment:
  DEBIAN_FRONTEND: noninteractive
  PATH: /opt/datahub/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
  PYTHONPATH: /opt/datahub/lib/python3.10/site-packages
paths:
  - type: directory
    path: /home/nonroot
    uid: 65532
    gid: 65532
    mode: "0755"
  - type: directory
    path: /opt
    uid: 0
    gid: 0
  - type: symlink
    path: /opt/datahub
    uid: 0
    gid: 0
    source: /usr/lib/datahub-ingestion
annotations:
  org.opencontainers.image.description: A minimal DataHub Ingestion image
  org.opencontainers.image.licenses: Apache-2.0
entrypoint:
  - datahub
  - /usr/bin/bash
