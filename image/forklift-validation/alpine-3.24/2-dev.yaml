# syntax=dhi.io/build:2-alpine3.24

name: Forklift Validation 2.x (dev)
image: dhi.io/forklift-validation
variant: dev
tags:
  - 2-alpine-dev
  - 2.12-alpine-dev
  - 2-alpine3.24-dev
  - 2.12.1-alpine-dev
  - 2.12-alpine3.24-dev
  - 2.12.1-alpine3.24-dev
platforms:
  - linux/amd64
  - linux/arm64
dates:
