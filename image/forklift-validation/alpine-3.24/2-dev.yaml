  packages:
    - alpine-baselayout-data
    - apk-tools
    - bash
    - busybox
    - ca-certificates
    - ca-certificates-bundle
    - coreutils
    - findutils
    - forklift-validation=2.12.1-r8
    - tzdata
accounts:
  root: true
  run-as: root
