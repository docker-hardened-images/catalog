# syntax=dhi.io/build:2-debian13

name: Forklift Validation 2.x
image: dhi.io/forklift-validation
variant: runtime
tags:
  - "2"
  - "2.12"
  - 2.12.1
  - 2-debian
  - 2-debian13
  - 2.12-debian
  - 2.12-debian13
  - 2.12.1-debian
  - 2.12.1-debian13
platforms:
  - linux/amd64
  - linux/arm64
dates:
  release: "2026-06-30"
vars:
  FLAVORED_SUFFIX: ""
  FORKLIFT_VALIDATION_FIPS_SUFFIX: ""
  SEMVER_MAJOR_MINOR_VERSION: "2.12"
  SEMVER_MAJOR_VERSION: "2"
  SEMVER_VERSION: 2.12.1
  SUFFIX: ""
  VERSION: 2.12.1-9
contents:
  repositories:
    - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
  keyring:
    - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
  packages:
    - base-files
    - ca-certificates-bundle
    - dash
    - forklift-validation=2.12.1-9
    - tzdata
accounts:
  run-as: nonroot
  users:
    - name: nonroot
      uid: 65532
      gid: 65532
  groups:
    - name: nonroot
      gid: 65532
      members:
        - nonroot
os-release:
  name: Docker Hardened Images (Debian)
  id: debian
  version-id: "13"
  version-codename: trixie
  pretty-name: Docker Hardened Images/Debian GNU/Linux 13 (trixie)
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
annotations:
  org.opencontainers.image.description: A minimal Forklift Validation image
  org.opencontainers.image.licenses: Apache-2.0
entrypoint:
  - /usr/bin/entrypoint.sh
ports:
  - 8181/tcp
