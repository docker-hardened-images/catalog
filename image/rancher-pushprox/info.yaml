metadata:
  display-name: Rancher PushProx
  short-description: A proxy and client that let Prometheus scrape targets behind NAT or firewalls while keeping the pull model.
  featured: false
  home-url: https://github.com/rancher/PushProx
  categories:
    - monitoring-and-observability
  included-tools:
    - name: pushprox-proxy
      description: Proxy server that Prometheus scrapes; it relays scrape requests to registered clients (default command, port 8080)
    - name: pushprox-client
      description: Client that runs beside a target, polls the proxy for scrape requests and serves metrics locally (port 9369 when started)
