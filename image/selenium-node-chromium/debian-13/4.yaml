# syntax=dhi.io/build:2-debian13

name: Selenium Node Chromium 4.x
image: dhi.io/selenium-node-chromium
variant: runtime
tags:
  - "4"
  - "4.52"
  - 4.52.0
  - 4-debian
  - 4-debian13
  - 4.52-debian
  - 4.52-debian13
  - 4.52.0-debian
  - 4.52.0-debian13
platforms:
  - linux/amd64
  - linux/arm64
dates:
  release: "2021-10-13"
vars:
  JAVA_FIPS_SUFFIX: ""
  JAVA_VARIANT: jre
  JDK_MAJOR_VERSION: "21"
  JRE_PATH: /usr/lib/jvm/temurin-21
  SEMVER_MAJOR_MINOR_VERSION: "4.52"
  SEMVER_MAJOR_VERSION: "4"
  SEMVER_VERSION: 4.52.0
  VERSION: 4.52.0-4
contents:
  repositories:
    - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
  keyring:
    - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
  packages:
    - '!libelogind0'
    - '!mawk'
    - '!original-awk'
    - base-files
    - bash
    - ca-certificates
    - ca-certificates-bundle
    - chromium
    - chromium-common
    - chromium-driver
    - chromium-l10n
    - eclipse-temurin-21-jre
    - eclipse-temurin-21-jre-oci-config
    - selenium-node-chromium=4.52.0-4
    - tini
    - tzdata
  builds:
    - name: selenium sbom
      contents:
        packages:
          - bash
          - coreutils
      pipeline:
        - uses: spdx@v1
          with:
            license: Apache-2.0
            name: selenium
            purl: pkg:maven/org.seleniumhq.selenium/selenium-server@4.52.0
            version: 4.52.0
      outputs:
        - source: /opt/docker/sbom/selenium
          target: /opt/docker/sbom/selenium
          uid: 0
          gid: 0
    - name: locale
      contents:
        packages:
          - bash
          - locales
          - coreutils
          - gzip
      pipeline:
        - name: install locales
          runs: |
            set -eux -o pipefail

            ln -s /etc/locale.alias /usr/share/locale/locale.alias

            echo "en_US.UTF-8 UTF-8" >> /etc/locale.gen
            locale-gen en_US.UTF-8
      outputs:
        - source: /usr/share/locale
          target: /usr/share/locale
          uid: 0
          gid: 0
        - source: /usr/lib/locale
          target: /usr/lib/locale
          uid: 0
          gid: 0
accounts:
  run-as: nonroot
  users:
    - name: nonroot
      uid: 65532
      gid: 65532
  groups:
    - name: nonroot
      gid: 65532
      members:
        - nonroot
os-release:
  name: Docker Hardened Images (Debian)
  id: debian
  version-id: "13"
  version-codename: trixie
  pretty-name: Docker Hardened Images/Debian GNU/Linux 13 (trixie)
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
environment:
  CONFIG_FILE: /opt/selenium/config.toml
  JAVA_HOME: /usr/lib/jvm/temurin-21
  LANG: en_US.UTF-8
  LANGUAGE: en_US:en
  LC_ALL: en_US.UTF-8
  SE_BIND_HOST: "false"
  SE_DRAIN_AFTER_SESSION_COUNT: "0"
  SE_ENABLE_TLS: "false"
  SE_ENABLE_TRACING: "true"
  SE_HTTPS_CERTIFICATE: /opt/selenium/secrets/tls.crt
  SE_HTTPS_PRIVATE_KEY: /opt/selenium/secrets/tls.key
  SE_HUB_HOST: selenium-hub
  SE_HUB_PORT: "4444"
  SE_JAVA_DISABLE_HOSTNAME_VERIFICATION: "true"
  SE_JAVA_HTTPCLIENT_VERSION: HTTP_1_1
  SE_JAVA_SSL_TRUST_STORE: /opt/selenium/secrets/server.jks
  SE_JAVA_SSL_TRUST_STORE_PASSWORD: /opt/selenium/secrets/server.pass
  SE_LOG_LEVEL: INFO
  SE_NODE_BROWSER_VERSION: stable
  SE_NODE_DETECT_DRIVERS: "true"
  SE_NODE_GRID_URL: ""
  SE_NODE_MAX_SESSIONS: "1"
  SE_NODE_PORT: "5555"
  SE_NODE_REGISTER_CYCLE: "10"
  SE_NODE_REGISTER_PERIOD: "120"
  SE_NODE_SESSION_TIMEOUT: "300"
  SE_OTEL_JAVA_GLOBAL_AUTOCONFIGURE_ENABLED: "true"
  SE_OTEL_SERVICE_NAME: selenium-node-chromium
  SE_OTEL_TRACES_EXPORTER: otlp
paths:
  - type: file
    path: /usr/local/bin/selenium-node
    uid: 0
    gid: 0
    mode: "0755"
    source: image/selenium-node-chromium/bin/selenium-node.sh
  - type: file
    path: /usr/bin/chromium
    content: |
      #!/bin/bash
      exec /usr/lib/chromium/chromium "$@"
    uid: 0
    gid: 0
    mode: "0755"
  - type: directory
    path: /opt/selenium
    uid: 0
    gid: 0
  - type: symlink
    path: /opt/selenium/selenium-server.jar
    uid: 0
    gid: 0
    source: /usr/share/selenium-node-chromium/selenium-server.jar
  - type: directory
    path: /opt/selenium/secrets
    uid: 65532
    gid: 65532
    mode: "0755"
  - type: directory
    path: /opt/selenium/logs
    uid: 65532
    gid: 65532
    mode: "0755"
annotations:
  org.opencontainers.image.description: A minimal Selenium Grid Chromium node image
  org.opencontainers.image.licenses: Apache-2.0
entrypoint:
  - /usr/local/bin/selenium-node
ports:
  - 5555/tcp
  - 4442/tcp
  - 4443/tcp
