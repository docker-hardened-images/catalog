# syntax=dhi.io/build:2-debian13

name: Kured 1.23.x (dev)
image: dhi.io/kured
variant: dev
tags:
  - 1-dev
  - 1.23-dev
  - 1.23.0-dev
  - 1-debian-dev
  - 1-debian13-dev
  - 1.23-debian-dev
  - 1.23-debian13-dev
  - 1.23.0-debian-dev
  - 1.23.0-debian13-dev
platforms:
  - linux/amd64
  - linux/arm64
dates:
  release: "2026-01-22"
vars:
  FLAVORED_SUFFIX: -dev
  SEMVER_MAJOR_MINOR_VERSION: "1.23"
  SEMVER_MAJOR_VERSION: "1"
  SEMVER_VERSION: 1.23.0
  SUFFIX: -dev
  VERSION: 1.23.0-10
contents:
  repositories:
    - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
  keyring:
    - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
  packages:
    - '!gawk'
    - '!libelogind0'
    - '!mawk'
    - '!original-awk'
    - apt
    - base-files
    - bash
    - ca-certificates
    - ca-certificates-bundle
    - coreutils
    - diffutils
    - dpkg
    - findutils
    - grep
    - kured-dev=1.23.0-10
    - libc-bin
    - mawk
    - perl-base
    - sed
    - tzdata
    - util-linux
  builds:
    - name: setcap kured
      contents:
        packages:
          - bash
          - libcap2-bin
          - kured-dev=1.23.0-10
      pipeline:
        - name: setcap
          runs: |
            set -eux -o pipefail

            setcap cap_kill+ep /usr/bin/kured
            setcap -v cap_kill+ep /usr/bin/kured
      outputs:
        - source: /usr/bin/kured
          target: /usr/bin/kured
          uid: 0
          gid: 0
accounts:
  root: true
  run-as: root
  users:
    - name: nonroot
      uid: 65532
      gid: 65532
    - name: _apt
      uid: 42
      gid: 65532
  groups:
    - name: nonroot
      gid: 65532
      members:
        - nonroot
os-release:
  name: Docker Hardened Images (Debian)
  id: debian
  version-id: "13"
  version-codename: trixie
  pretty-name: Docker Hardened Images/Debian GNU/Linux 13 (trixie)
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
environment:
  DEBIAN_FRONTEND: noninteractive
annotations:
  org.opencontainers.image.description: A minimal Kubernetes Reboot Daemon image
  org.opencontainers.image.licenses: Apache-2.0
entrypoint:
  - /usr/bin/kured
