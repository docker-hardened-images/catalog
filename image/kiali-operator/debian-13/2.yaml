# syntax=dhi.io/build:2-debian13

name: Kiali Operator 2.x
image: dhi.io/kiali-operator
variant: runtime
tags:
  - "2"
  - "2.34"
  - 2.34.0
  - 2-debian
  - 2-debian13
  - 2.34-debian
  - 2.34-debian13
  - 2.34.0-debian
  - 2.34.0-debian13
platforms:
  - linux/amd64
  - linux/arm64
dates:
  release: "2024-10-21"
vars:
  ANSIBLE_OPERATOR_VERSION: 1.42.3-9
  ANSIBLE_RUNTIME_VERSION: 1.42.3-6
  FLAVORED_SUFFIX: ""
  PYTHON_MINOR: "3.12"
  SEMVER_MAJOR_MINOR_VERSION: "2.34"
  SEMVER_MAJOR_VERSION: "2"
  SEMVER_VERSION: 2.34.0
  SUFFIX: ""
  VERSION: 2.34.0-1
contents:
  repositories:
    - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
  keyring:
    - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
  packages:
    - ansible-operator-runtime=1.42.3-6
    - ansible-operator=1.42.3-9
    - base-files
    - ca-certificates-bundle
    - coreutils
    - curl
    - dash
    - grep
    - kiali-operator=2.34.0-1
    - libc-bin
    - libffi8
    - libpython-3.12-stdlib
    - libssl3t64
    - python-3.12-minimal
    - sed
    - tini
    - tzdata
accounts:
  run-as: ansible
  users:
    - name: ansible
      uid: 1001
      gid: 0
  groups:
    - name: nonroot
      gid: 65532
      members:
        - nonroot
os-release:
  name: Docker Hardened Images (Debian)
  id: debian
  version-id: "13"
  version-codename: trixie
  pretty-name: Docker Hardened Images/Debian GNU/Linux 13 (trixie)
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
work-dir: /opt/ansible
environment:
  HOME: /opt/ansible
  LANG: C.UTF-8
  LC_ALL: C.UTF-8
  PYTHONPATH: /usr/lib/kiali-operator/python3.12/site-packages:/usr/lib/ansible-operator-runtime/lib/python3.12/site-packages
  SSL_CERT_FILE: /etc/ssl/certs/ca-certificates.crt
  USER_NAME: ansible
  USER_UID: "1001"
paths:
  - type: directory
    path: /opt/ansible/.ansible/tmp
    uid: 1001
    gid: 0
    mode: "0775"
  - type: file
    path: /etc/ansible/ansible.cfg
    uid: 0
    gid: 0
    mode: "0644"
    source: image/kiali-operator/config/ansible.cfg
  - type: file
    path: /etc/ansible/hosts
    uid: 0
    gid: 0
    mode: "0644"
    source: image/kiali-operator/config/hosts
  - type: directory
    path: /usr/local/bin
    uid: 0
    gid: 0
    mode: "0755"
  - type: symlink
    path: /usr/local/bin/ansible-operator
    uid: 0
    gid: 0
    source: /usr/bin/ansible-operator
  - type: symlink
    path: /usr/local/bin/ansible
    uid: 0
    gid: 0
    source: /usr/bin/ansible
  - type: symlink
    path: /usr/local/bin/ansible-galaxy
    uid: 0
    gid: 0
    source: /usr/bin/ansible-galaxy
  - type: symlink
    path: /usr/local/bin/ansible-playbook
    uid: 0
    gid: 0
    source: /usr/bin/ansible-playbook
  - type: symlink
    path: /usr/local/bin/python3
    uid: 0
    gid: 0
    source: /usr/bin/python3.12
  - type: symlink
    path: /tini
    uid: 0
    gid: 0
    source: /usr/bin/tini
annotations:
  org.opencontainers.image.description: A minimal Kiali Operator image
  org.opencontainers.image.licenses: Apache-2.0
entrypoint:
  - /tini
  - --
  - /usr/local/bin/ansible-operator
  - run
  - --watches-file=./watches.yaml
ports:
  - 6789/tcp
  - 8080/tcp
