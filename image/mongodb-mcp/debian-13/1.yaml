# syntax=dhi.io/build:2-debian13

name: MongoDB MCP Server 1.x
image: dhi.io/mongodb-mcp
variant: runtime
tags:
  - "1"
  - "1.14"
  - 1.14.0
  - 1-debian
  - 1-debian13
  - 1.14-debian
  - 1.14-debian13
  - 1.14.0-debian
  - 1.14.0-debian13
platforms:
  - linux/amd64
  - linux/arm64
vars:
  SEMVER_MAJOR_MINOR_VERSION: "1.14"
  SEMVER_MAJOR_VERSION: "1"
  SEMVER_VERSION: 1.14.0
  VERSION: 1.14.0-1
contents:
  repositories:
    - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
  keyring:
    - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
  packages:
    - base-files
    - ca-certificates-bundle
    - libc6
    - libgomp1
    - libstdc++6
    - mongodb-mcp=1.14.0-1
    - netbase
    - nodejs-24
    - tzdata
accounts:
  run-as: node
  users:
    - name: node
      uid: 1000
      gid: 1000
  groups:
    - name: node
      gid: 1000
      members:
        - node
os-release:
  name: Docker Hardened Images (Debian)
  id: debian
  version-id: "13"
  version-codename: trixie
  pretty-name: Docker Hardened Images/Debian GNU/Linux 13 (trixie)
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
environment:
  MDB_MCP_LOGGERS: stderr,mcp
paths:
  - type: symlink
    path: /app
    uid: 0
    gid: 0
    source: /usr/lib/mongodb-mcp
annotations:
  org.opencontainers.image.description: MongoDB MCP Server
  org.opencontainers.image.licenses: Apache-2.0
labels:
  io.modelcontextprotocol.server.name: io.github.mongodb-js/mongodb-mcp-server
entrypoint:
  - node
  - /app/dist/esm/index.js
