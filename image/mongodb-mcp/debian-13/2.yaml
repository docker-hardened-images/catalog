# syntax=dhi.io/build:2-debian13

name: MongoDB MCP Server 2.x
image: dhi.io/mongodb-mcp
variant: runtime
tags:
  - "2"
  - "2.0"
  - 2.0.0
  - 2-debian
  - 2-debian13
  - 2.0-debian
  - 2.0-debian13
  - 2.0.0-debian
  - 2.0.0-debian13
platforms:
  - linux/amd64
  - linux/arm64
dates:
  release: "2026-07-31"
vars:
  COMMIT_SHA: 39fcf3efde1164a7bcf255b11cb5c22c99110955
  SEMVER_MAJOR_MINOR_VERSION: "2.0"
  SEMVER_MAJOR_VERSION: "2"
  SEMVER_VERSION: 2.0.0
  VERSION: 2.0.0
contents:
  repositories:
    - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
  keyring:
    - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
  packages:
    - base-files
    - ca-certificates-bundle
    - libc6
    - libgomp1
    - libstdc++6
    - netbase
    - nodejs-24
    - tzdata
  builds:
    - name: mongodb-mcp
      contents:
        packages:
          - base-files
          - bash
          - ca-certificates
          - coreutils
          - findutils
          - git
          - libc6
          - libstdc++6
          - mawk
          - nodejs-24
          - node-corepack
          - npm
          - sed
          - yarn-classic
          - yq
        files:
          - url: git+https://github.com/mongodb-js/mongodb-mcp-server.git#v2.0.0
            checksum: 39fcf3efde1164a7bcf255b11cb5c22c99110955
            path: ${source.dir}/mongodb-mcp-server-39fcf3efde1164a7bcf255b11cb5c22c99110955
            spdx:
              name: mongodb-mcp-server
              version: 2.0.0
              packages:
                - name: mongodb-mcp-server
                  purl: pkg:dhi/mongodb-mcp@2.0.0
                  license: Apache-2.0
            uid: 0
            gid: 0
      pipeline:
        - name: bump pnpm dependencies
          work-dir: ${source.dir}/mongodb-mcp-server-39fcf3efde1164a7bcf255b11cb5c22c99110955
          privileged: true
          runs: |
            set -eux -o pipefail

            yq -Y -i '.overrides.minimatch = "10.2.3"' pnpm-workspace.yaml
            yq -Y -i '.overrides.qs = "6.15.2"' pnpm-workspace.yaml
            yq -Y -i '.overrides."@modelcontextprotocol/sdk" = "1.26.0"' pnpm-workspace.yaml
            yq -Y -i '.overrides.hono = "4.12.34"' pnpm-workspace.yaml
            yq -Y -i '.overrides."fast-xml-parser" = "5.7.0"' pnpm-workspace.yaml
            yq -Y -i '.overrides."ip-address" = "10.3.1"' pnpm-workspace.yaml
            yq -Y -i '.overrides."@mongodb-js/socksv5" = "0.0.11"' pnpm-workspace.yaml
            yq -Y -i '.overrides."fast-uri" = "3.1.5"' pnpm-workspace.yaml
            yq -Y -i '.overrides."@hono/node-server" = "2.0.10"' pnpm-workspace.yaml
            yq -Y -i '.overrides."hono>@hono/node-server" = "2.0.10"' pnpm-workspace.yaml
            yq -Y -i '.packageExtensions.hono.peerDependencies."@hono/node-server" = "2.0.10"' pnpm-workspace.yaml
        - name: build
          work-dir: ${source.dir}/mongodb-mcp-server-39fcf3efde1164a7bcf255b11cb5c22c99110955
          privileged: true
          runs: |
            set -eux -o pipefail

            corepack enable
            corepack prepare pnpm@11.5.1 --activate

            rm -f pnpm-lock.yaml

            pnpm install

            npm run build

            export CI=true
            pnpm prune --prod --ignore-scripts

            test -d node_modules/.pnpm/@mongodb-js+socksv5@0.0.11
            test -d node_modules/.pnpm/ip-address@10.3.1
            ! ls -d node_modules/.pnpm/ip-address@9.* 2> /dev/null
      outputs:
        - source: ${source.dir}/mongodb-mcp-server-39fcf3efde1164a7bcf255b11cb5c22c99110955/node_modules
          target: /app/node_modules
          uid: 0
          gid: 0
        - source: ${source.dir}/mongodb-mcp-server-39fcf3efde1164a7bcf255b11cb5c22c99110955/dist
          target: /app/dist
          uid: 0
          gid: 0
        - source: ${source.dir}/mongodb-mcp-server-39fcf3efde1164a7bcf255b11cb5c22c99110955/packages/metrics
          target: /app/packages/metrics
          uid: 0
          gid: 0
        - source: ${source.dir}/mongodb-mcp-server-39fcf3efde1164a7bcf255b11cb5c22c99110955/packages/types
          target: /app/packages/types
          uid: 0
          gid: 0
accounts:
  run-as: node
  users:
    - name: node
      uid: 1000
      gid: 1000
  groups:
    - name: node
      gid: 1000
      members:
        - node
os-release:
  name: Docker Hardened Images (Debian)
  id: debian
  version-id: "13"
  version-codename: trixie
  pretty-name: Docker Hardened Images/Debian GNU/Linux 13 (trixie)
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
environment:
  MDB_MCP_LOGGERS: stderr,mcp
annotations:
  org.opencontainers.image.description: MongoDB MCP Server
  org.opencontainers.image.licenses: Apache-2.0
labels:
  io.modelcontextprotocol.server.name: io.github.mongodb-js/mongodb-mcp-server
entrypoint:
  - node
  - /app/dist/esm/index.js
