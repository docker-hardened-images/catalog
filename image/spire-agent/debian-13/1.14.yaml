# syntax=dhi.io/build:2-debian13

name: Spiffe Spire Agent 1.14.x
image: dhi.io/spire-agent
variant: runtime
tags:
  - "1.14"
  - 1.14.7
  - 1.14-debian
  - 1.14-debian13
  - 1.14.7-debian
  - 1.14.7-debian13
platforms:
  - linux/amd64
  - linux/arm64
dates:
  release: "2025-12-11"
vars:
  FLAVORED_SUFFIX: ""
  PACKAGE_NAME: spire-agent-1.14
  SEMVER_MAJOR_MINOR_VERSION: "1.14"
  SEMVER_MAJOR_VERSION: "1"
  SEMVER_VERSION: 1.14.7
  SUFFIX: ""
  VERSION: 1.14.7-2
contents:
  repositories:
    - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
  keyring:
    - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
  packages:
    - base-files
    - ca-certificates-bundle
    - spire-agent-1.14=1.14.7-2
    - tzdata
accounts:
  run-as: nonroot
  users:
    - name: nonroot
      uid: 65532
      gid: 65532
  groups:
    - name: nonroot
      gid: 65532
      members:
        - nonroot
os-release:
  name: Docker Hardened Images (Debian)
  id: debian
  version-id: "13"
  version-codename: trixie
  pretty-name: Docker Hardened Images/Debian GNU/Linux 13 (trixie)
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
work-dir: /opt/spire
paths:
  - type: directory
    path: /opt/spire/bin
    uid: 0
    gid: 0
  - type: directory
    path: /usr/local/bin
    uid: 0
    gid: 0
  - type: symlink
    path: /opt/spire/bin/spire-agent
    uid: 0
    gid: 0
    source: /usr/bin/spire-agent
  - type: symlink
    path: /usr/local/bin/spire-agent
    uid: 0
    gid: 0
    source: /usr/bin/spire-agent
annotations:
  org.opencontainers.image.description: A minimal Spiffe Spire Agent image
  org.opencontainers.image.licenses: Apache-2.0
entrypoint:
  - /opt/spire/bin/spire-agent
  - run
