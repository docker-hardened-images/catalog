# syntax=dhi.io/build:2-alpine3.24

name: Forklift Populator Controller 2.x
image: dhi.io/populator-controller
variant: runtime
tags:
  - 2-alpine
  - 2.12-alpine
  - 2-alpine3.24
  - 2.12.7-alpine
  - 2.12-alpine3.24
  - 2.12.7-alpine3.24
platforms:
  - linux/amd64
  - linux/arm64
dates:
  release: "2026-08-10"
vars:
  FLAVORED_SUFFIX: ""
  SEMVER_MAJOR_MINOR_VERSION: "2.12"
  SEMVER_MAJOR_VERSION: "2"
  SEMVER_VERSION: 2.12.7
  SUFFIX: ""
  VERSION: 2.12.7-r2
contents:
  repositories:
    - https://dhi.io/apk/alpine/v3.24/main
    - https://dl-cdn.alpinelinux.org/alpine/v3.24/main
    - https://dl-cdn.alpinelinux.org/alpine/v3.24/community
  keyring:
    - https://dhi.io/keyring/dhi-apk@docker-0F81AD7700D99184.rsa.pub
  packages:
    - alpine-baselayout-data
    - ca-certificates-bundle
    - populator-controller=2.12.7-r2
    - tar
    - tzdata
accounts:
  run-as: nonroot
  users:
    - name: nonroot
      uid: 65532
      gid: 65532
  groups:
    - name: nonroot
      gid: 65532
      members:
        - nonroot
os-release:
  name: Docker Hardened Images (Alpine)
  id: alpine
  version-id: "3.24"
  pretty-name: Docker Hardened Images/Alpine Linux v3.24
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
paths:
  - type: directory
    path: /usr/local/bin
    uid: 0
    gid: 0
    mode: "0755"
  - type: symlink
    path: /usr/local/bin/populator-controller
    uid: 0
    gid: 0
    source: /usr/bin/populator-controller
annotations:
  org.opencontainers.image.description: A minimal Forklift populator controller image
  org.opencontainers.image.licenses: Apache-2.0
entrypoint:
  - /usr/local/bin/populator-controller
ports:
  - 8080/tcp
  - 8081/tcp
  - 8082/tcp
