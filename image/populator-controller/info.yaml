metadata:
  display-name: Forklift Populator Controller
  short-description: |
    Kubernetes controller that populates persistent volumes during Forklift VM migrations.

    Part of the Forklift migration toolkit, the populator controller watches
    OvirtVolumePopulator, OpenstackVolumePopulator, and VSphereXcopyVolumePopulator
    custom resources and launches the matching populator pod to transfer VM disk
    data into the target PersistentVolumeClaim on KubeVirt.
  featured: false
  home-url: https://github.com/kubev2v/forklift
  categories:
    - databases-and-storage
