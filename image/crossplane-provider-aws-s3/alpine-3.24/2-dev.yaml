# syntax=dhi.io/build:2-alpine3.24

name: Crossplane Provider AWS S3 2.x (dev)
image: dhi.io/crossplane-provider-aws-s3
variant: dev
tags:
  - 2-alpine-dev
  - 2.10-alpine-dev
  - 2-alpine3.24-dev
  - 2.10.0-alpine-dev
  - 2.10-alpine3.24-dev
  - 2.10.0-alpine3.24-dev
platforms:
  - linux/amd64
  - linux/arm64
dates:
  release: "2025-08-12"
vars:
  PACKAGE_SUFFIX: ""
  SEMVER_MAJOR_MINOR_VERSION: "2.10"
  SEMVER_MAJOR_VERSION: "2"
  SEMVER_VERSION: 2.10.0
  VERSION: 2.10.0-r0
  XPKG_DEPENDS_ON_VERSION: '>=0.0.0-0'
contents:
  repositories:
    - https://dhi.io/apk/alpine/v3.24/main
    - https://dl-cdn.alpinelinux.org/alpine/v3.24/main
    - https://dl-cdn.alpinelinux.org/alpine/v3.24/community
  keyring:
    - https://dhi.io/keyring/dhi-apk@docker-0F81AD7700D99184.rsa.pub
  packages:
    - alpine-baselayout-data
    - apk-tools
    - bash
    - busybox
    - ca-certificates
    - ca-certificates-bundle
    - coreutils
    - crossplane-provider-aws-s3-2=2.10.0-r0
    - findutils
    - tzdata
  builds:
    - name: package-yaml
      shell: /bin/bash
      contents:
        packages:
          - bash
          - busybox
          - coreutils
          - crossplane-provider-aws-s3-2-xpkg=2.10.0-r0
      pipeline:
        - name: verify package.yaml
          runs: |
            set -eux -o pipefail

            f=/usr/share/crossplane-provider-aws-s3/package.yaml
            test -f "$f"
            test ! -L "$f"
            test -s "$f"
            test "$(grep -cx 'kind: Provider' "$f")" -eq 1
            crds="$(grep -cx 'kind: CustomResourceDefinition' "$f")"
            test "$crds" -gt 0
            test "$(grep -c '^  group: ' "$f")" -eq "$crds"
            test "$(grep -cE '^  group: s3\.aws\.(m\.)?upbound\.io$' "$f")" -eq "$crds"

            test "$(grep -c '^  - provider: ' "$f")" -eq 1
            dep="$(grep -A1 -x '  - provider: dhi.io/crossplane-provider-family-aws' "$f")"
            test "$(printf '%s\n' "$dep" | wc -l)" -eq 2
            line="$(printf '%s\n' "$dep" | tail -n 1)"
            want='>=0.0.0-0'
            case "$line" in
              "    version: $want" | "    version: '$want'" | "    version: \"$want\"") ;;
              *)
                echo "unexpected dependsOn version line: $line" >&2
                exit 1
                ;;
            esac
      outputs:
        - source: /usr/share/crossplane-provider-aws-s3/package.yaml
          target: /package.yaml
          uid: 0
          gid: 0
          mode: "0644"
accounts:
  root: true
  run-as: root
  users:
    - name: nonroot
      uid: 65532
      gid: 65532
  groups:
    - name: nonroot
      gid: 65532
      members:
        - nonroot
os-release:
  name: Docker Hardened Images (Alpine)
  id: alpine
  version-id: "3.24"
  pretty-name: Docker Hardened Images/Alpine Linux v3.24
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
environment:
  TF_APPEND_USER_AGENT: crossplane-provider-aws/v2.10.0 upbound-provider-aws/v2.10.0
paths:
  - type: directory
    path: /usr/local/bin
    uid: 0
    gid: 0
  - type: symlink
    path: /usr/local/bin/provider
    uid: 0
    gid: 0
    source: /usr/bin/provider-aws-s3
annotations:
  org.opencontainers.image.description: A minimal Crossplane Provider AWS S3 image
  org.opencontainers.image.licenses: Apache-2.0 AND MPL-2.0 AND MIT AND BSD-3-Clause AND BSD-2-Clause AND ISC AND Unicode-DFS-2016
entrypoint:
  - provider
ports:
  - 8080/tcp
  - 8081/tcp
  - 9443/tcp
