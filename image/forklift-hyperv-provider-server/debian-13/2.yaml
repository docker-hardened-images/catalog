# syntax=dhi.io/build:2-debian13

name: Forklift Hyper-V Provider Server 2.x
image: dhi.io/forklift-hyperv-provider-server
variant: runtime
tags:
  - "2"
  - "2.12"
  - 2.12.8
  - 2-debian
  - 2-debian13
  - 2.12-debian
  - 2.12-debian13
  - 2.12.8-debian
  - 2.12.8-debian13
platforms:
  - linux/amd64
  - linux/arm64
dates:
  release: "2026-08-24"
vars:
  FLAVORED_SUFFIX: ""
  SEMVER_MAJOR_MINOR_VERSION: "2.12"
  SEMVER_MAJOR_VERSION: "2"
  SEMVER_VERSION: 2.12.8
  SUFFIX: ""
  VERSION: 2.12.8-0
contents:
  repositories:
    - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
  keyring:
    - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
  packages:
    - base-files
    - ca-certificates-bundle
    - forklift-hyperv-provider-server=2.12.8-0
    - tzdata
accounts:
  run-as: "65532"
  users:
    - name: nonroot
      uid: 65532
      gid: 65532
  groups:
    - name: nonroot
      gid: 65532
      members:
        - nonroot
os-release:
  name: Docker Hardened Images (Debian)
  id: debian
  version-id: "13"
  version-codename: trixie
  pretty-name: Docker Hardened Images/Debian GNU/Linux 13 (trixie)
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
paths:
  - type: directory
    path: /usr/local/bin
    uid: 0
    gid: 0
    mode: "0755"
  - type: symlink
    path: /usr/local/bin/hyperv-provider-server
    uid: 0
    gid: 0
    source: /usr/bin/hyperv-provider-server
annotations:
  org.opencontainers.image.description: A minimal Forklift Hyper-V Provider Server image
  org.opencontainers.image.licenses: Apache-2.0
entrypoint:
  - /usr/local/bin/hyperv-provider-server
ports:
  - 8080/tcp
