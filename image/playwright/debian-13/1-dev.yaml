# syntax=dhi.io/build:2-debian13

name: Playwright 1.x (dev)
image: dhi.io/playwright
variant: dev
tags:
  - 1-dev
  - 1.62-dev
  - 1.62.1-dev
  - 1-debian-dev
  - 1-debian13-dev
  - 1.62-debian-dev
  - 1.62-debian13-dev
  - 1.62.1-debian-dev
  - 1.62.1-debian13-dev
platforms:
  - linux/amd64
  - linux/arm64
dates:
  release: "2020-05-06"
vars:
  MULTIARCH_DIR: '#{ target.arch == "amd64" ? "x86_64-linux-gnu" : "aarch64-linux-gnu" }'
  NODEJS_MAJOR: "24"
  NODEJS_VERSION: 24.18.1-0
  NPM_VERSION: 11.19.0-3
  SEMVER_MAJOR_MINOR_VERSION: "1.62"
  SEMVER_MAJOR_VERSION: "1"
  SEMVER_VERSION: 1.62.1
  VERSION: 1.62.1-0
contents:
  repositories:
    - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
  keyring:
    - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
  packages:
    - '!gawk'
    - '!libelogind0'
    - '!mawk'
    - '!original-awk'
    - apt
    - base-files
    - bash
    - ca-certificates
    - ca-certificates-bundle
    - chromium
    - chromium-common
    - chromium-headless-shell
    - coreutils
    - diffutils
    - dpkg
    - findutils
    - fonts-freefont-ttf
    - fonts-ipafont-gothic
    - fonts-liberation
    - fonts-noto-color-emoji
    - fonts-tlwg-loma-otf
    - fonts-unifont
    - fonts-wqy-zenhei
    - gawk
    - git
    - grep
    - gstreamer1.0-libav
    - gstreamer1.0-plugins-bad
    - gstreamer1.0-plugins-base
    - gstreamer1.0-plugins-good
    - libasound2t64
    - libatk-bridge2.0-0t64
    - libatk1.0-0t64
    - libatomic1
    - libatspi2.0-0t64
    - libavcodec61
    - libavif16
    - libc-bin
    - libcairo-gobject2
    - libcairo2
    - libcups2t64
    - libdbus-1-3
    - libdbus-glib-1-2
    - libdrm2
    - libegl1
    - libenchant-2-2
    - libepoxy0
    - libevdev2
    - libevent-2.1-7t64
    - libfontconfig1
    - libfreetype6
    - libgbm1
    - libgdk-pixbuf-2.0-0
    - libgles2
    - libglib2.0-0t64
    - libglx0
    - libgstreamer-gl1.0-0
    - libgstreamer-plugins-base1.0-0
    - libgstreamer1.0-0
    - libgtk-3-0t64
    - libgtk-4-1
    - libgudev-1.0-0
    - libharfbuzz-icu0
    - libharfbuzz0b
    - libhyphen0
    - libicu76
    - libjpeg62-turbo
    - liblcms2-2
    - libmanette-0.2-0
    - libnotify4
    - libnspr4
    - libnss3
    - libopengl0
    - libopenjp2-7
    - libopus0
    - libpango-1.0-0
    - libpangocairo-1.0-0
    - libpng16-16t64
    - libproxy1v5
    - libsecret-1-0
    - libsoup-3.0-0
    - libwayland-client0
    - libwayland-egl1
    - libwayland-server0
    - libwebp7
    - libwebpdemux2
    - libwoff1
    - libx11-6
    - libx11-xcb1
    - libxcb-shm0
    - libxcb1
    - libxcomposite1
    - libxcursor1
    - libxdamage1
    - libxext6
    - libxfixes3
    - libxi6
    - libxkbcommon0
    - libxml2
    - libxrandr2
    - libxrender1
    - libxslt1.1
    - libxtst6
    - mawk
    - nodejs-24=24.18.1-0
    - npm=11.19.0-3
    - openssh-client
    - perl-base
    - playwright=1.62.1-0
    - sed
    - tzdata
    - util-linux
    - xauth
    - xfonts-scalable
    - xvfb
  builds:
    - name: glib-compile-schemas
      contents:
        repositories:
          - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
        keyring:
          - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
        packages:
          - bash
          - coreutils
          - dash
          - gsettings-desktop-schemas
          - libglib2.0-bin
          - libgtk-3-common
          - libgtk-4-common
      pipeline:
        - name: compile
          runs: |
            set -eux -o pipefail

            glib-compile-schemas /usr/share/glib-2.0/schemas
            test -s /usr/share/glib-2.0/schemas/gschemas.compiled
      outputs:
        - source: /usr/share/glib-2.0/schemas/gschemas.compiled
          target: /usr/share/glib-2.0/schemas/gschemas.compiled
          uid: 0
          gid: 0
accounts:
  root: true
  run-as: root
  users:
    - name: nonroot
      uid: 65532
      gid: 65532
    - name: _apt
      uid: 42
      gid: 65532
  groups:
    - name: nonroot
      gid: 65532
      members:
        - nonroot
os-release:
  name: Docker Hardened Images (Debian)
  id: debian
  version-id: "13"
  version-codename: trixie
  pretty-name: Docker Hardened Images/Debian GNU/Linux 13 (trixie)
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
environment:
  DEBIAN_FRONTEND: noninteractive
  HOME: /root
  LANG: C.UTF-8
  LC_ALL: C.UTF-8
  NODE_PATH: /usr/lib/node_modules
  PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
paths:
  - type: directory
    path: /home/nonroot
    uid: 65532
    gid: 65532
    mode: "0755"
  - type: symlink
    path: /usr/lib/${MULTIARCH_DIR}/libblas.so.3
    uid: 0
    gid: 0
    source: /usr/lib/${MULTIARCH_DIR}/blas/libblas.so.3
  - type: symlink
    path: /usr/lib/${MULTIARCH_DIR}/liblapack.so.3
    uid: 0
    gid: 0
    source: /usr/lib/${MULTIARCH_DIR}/lapack/liblapack.so.3
  - type: symlink
    path: /ms-playwright
    uid: 0
    gid: 0
    source: /usr/lib/ms-playwright
annotations:
  org.opencontainers.image.description: A minimal Playwright image
  org.opencontainers.image.licenses: Apache-2.0
cmd:
  - /bin/bash
