metadata:
  display-name: Playwright
  short-description: End-to-end browser automation and testing framework with bundled Chromium-compatible, Firefox, and WebKit browsers
  featured: false
  home-url: https://playwright.dev/
  categories:
    - developer-tools
  included-tools:
    - name: playwright
      description: The Playwright CLI, used to run tests, install browsers, and generate scripts.
    - name: node
      description: The Node.js runtime used to execute the Playwright driver and CLI.
    - name: npm
      description: The Node.js package manager in the dev variant, used to install project dependencies such as @playwright/test.
    - name: git
      description: Distributed version control system in the dev variant, commonly needed by CI tooling and dependency installs.
    - name: chromium
      description: Chromium-compatible browser used by Playwright for automation and testing, provided by Debian's own chromium package rather than a Playwright-bundled archive.
    - name: firefox
      description: Bundled, version-pinned Firefox browser used by Playwright for automation and testing.
    - name: webkit
      description: Bundled, version-pinned WebKit browser used by Playwright for automation and testing.
