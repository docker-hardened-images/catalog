# syntax=dhi.io/build:2-debian13

name: pgvector 0.8.x for PostgreSQL 14.x (dev)
image: dhi.io/pgvector
variant: dev
tags:
  - pg14-dev
  - 0.8-pg14-dev
  - 0.8.7-pg14-dev
  - pg14-debian-dev
  - pg14-debian13-dev
  - 0.8-pg14-debian-dev
  - 0.8-pg14-debian13-dev
  - 0.8.7-pg14-debian-dev
  - 0.8.7-pg14-debian13-dev
platforms:
  - linux/amd64
  - linux/arm64
dates:
  release: "2021-09-30"
  end-of-life: "2026-11-12"
vars:
  GOSU_VERSION: 1.20.0-0
  PG_MAJOR_VERSION: "14"
  PG_MINOR_VERSION: "24"
  PG_PACKAGE_VERSION: 14.24-1
  PG_VERSION: "14.24"
  PG14_PACKAGE_VERSION: 14.24-1
  PG15_PACKAGE_VERSION: 15.19-1
  PG16_PACKAGE_VERSION: 16.15-1
  PG17_PACKAGE_VERSION: 17.11-1
  PG18_PACKAGE_VERSION: 18.6-1
  PGDATA: /var/lib/postgresql/14/data
  PGVECTOR_PACKAGE_NAME: pgvector-0-pg14
  PGVECTOR_PACKAGE_VERSION: 0.8.7-0
  PGVECTOR14_PACKAGE_VERSION: 0.8.7-0
  PGVECTOR15_PACKAGE_VERSION: 0.8.7-0
  PGVECTOR16_PACKAGE_VERSION: 0.8.7-0
  PGVECTOR17_PACKAGE_VERSION: 0.8.7-0
  PGVECTOR18_PACKAGE_VERSION: 0.8.7-0
  POSTGRES_PACKAGE_NAME: postgresql-14
  SEMVER_MAJOR_MINOR_VERSION: "0.8"
  SEMVER_MAJOR_VERSION: "0"
  SEMVER_VERSION: 0.8.7
  VERSION: 0.8.7-0
contents:
  repositories:
    - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
  keyring:
    - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
  packages:
    - '!gawk'
    - '!libelogind0'
    - '!mawk'
    - '!original-awk'
    - apt
    - base-files
    - bash
    - ca-certificates
    - ca-certificates-bundle
    - coreutils
    - diffutils
    - dpkg
    - findutils
    - gosu=1.20.0-0
    - grep
    - less
    - libc-bin
    - libcurl4t64
    - libgssapi-krb5-2
    - libicu76
    - libldap2
    - liblz4-1
    - libnuma1
    - libpam0g
    - libreadline8t64
    - libselinux1
    - libssl3t64
    - liburing2
    - libuuid1
    - libxml2
    - libxslt1.1
    - libzstd1
    - llvm
    - locales
    - mawk
    - perl-base
    - pgvector-0-pg14=0.8.7-0
    - postgresql-14=14.24-1
    - sed
    - tzdata
    - util-linux
    - zlib1g
  builds:
    - name: legacy /opt/postgresql layout
      contents:
        repositories:
          - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
        keyring:
          - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
        packages:
          - bash
          - coreutils
          - postgresql-14=14.24-1
      pipeline:
        - runs: |
            set -eux -o pipefail

            mkdir -p "/opt/postgresql/14/bin"

            for item in "/usr/lib/postgresql/14/"*; do
              [ -e "${item}" ] || continue
              name="$(basename "${item}")"
              ln -sfn "${item}" "/opt/postgresql/14/${name}"
            done

            while IFS= read -r path; do
              case "${path}" in
                /usr/bin/*)
                  [ -e "${path}" ] || continue
                  ln -sfn "${path}" "/opt/postgresql/14/bin/$(basename "${path}")"
                  ;;
              esac
            done < "/var/lib/dpkg/info/postgresql-14.list"
      outputs:
        - source: /opt/postgresql
          target: /opt/postgresql
          uid: 0
          gid: 0
    - name: locale
      contents:
        packages:
          - bash
          - locales
          - coreutils
          - gzip
      pipeline:
        - name: install locales
          runs: |
            set -eux -o pipefail

            ln -s /etc/locale.alias /usr/share/locale/locale.alias

            echo "en_US.UTF-8 UTF-8" >> /etc/locale.gen
            locale-gen en_US.UTF-8
      outputs:
        - source: /usr/share/locale
          target: /usr/share/locale
          uid: 0
          gid: 0
        - source: /usr/lib/locale
          target: /usr/lib/locale
          uid: 0
          gid: 0
accounts:
  root: true
  run-as: root
  users:
    - name: postgres
      uid: 70
      gid: 70
    - name: _apt
      uid: 42
      gid: 65532
  groups:
    - name: postgres
      gid: 70
      members:
        - postgres
os-release:
  name: Docker Hardened Images (Debian)
  id: debian
  version-id: "13"
  version-codename: trixie
  pretty-name: Docker Hardened Images/Debian GNU/Linux 13 (trixie)
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
stop-signal: SIGINT
environment:
  DEBIAN_FRONTEND: noninteractive
  LANG: en_US.UTF-8
  LANGUAGE: en_US:en
  LC_ALL: en_US.UTF-8
  PATH: /opt/postgresql/14/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
  PG_MAJOR: "14"
  PG_MINOR: "24"
  PGDATA: /var/lib/postgresql/14/data
paths:
  - type: directory
    path: /var/lib/postgresql/14/data
    uid: 70
    gid: 70
    mode: "0700"
  - type: file
    path: /usr/local/bin/docker-entrypoint.sh
    uid: 0
    gid: 0
    mode: "0755"
    source: image/pgvector/bin/docker-entrypoint.sh
annotations:
  org.opencontainers.image.description: A minimal pgvector image
  org.opencontainers.image.licenses: PostgreSQL
entrypoint:
  - /usr/local/bin/docker-entrypoint.sh
ports:
  - 5432/tcp
