# syntax=dhi.io/build:2-debian13

name: pgvector 0.8.x for PostgreSQL 15.x
image: dhi.io/pgvector
variant: runtime
tags:
  - pg15
  - 0.8-pg15
  - 0.8.7-pg15
  - pg15-debian
  - pg15-debian13
  - 0.8-pg15-debian
  - 0.8-pg15-debian13
  - 0.8.7-pg15-debian
  - 0.8.7-pg15-debian13
platforms:
  - linux/amd64
  - linux/arm64
dates:
  release: "2022-10-13"
  end-of-life: "2027-11-11"
vars:
  PG_MAJOR_VERSION: "15"
  PG_MINOR_VERSION: "19"
  PG_PACKAGE_VERSION: 15.19-1
  PG_VERSION: "15.19"
  PG14_PACKAGE_VERSION: 14.24-1
  PG15_PACKAGE_VERSION: 15.19-1
  PG16_PACKAGE_VERSION: 16.15-1
  PG17_PACKAGE_VERSION: 17.11-1
  PG18_PACKAGE_VERSION: 18.6-1
  PGDATA: /var/lib/postgresql/15/data
  PGVECTOR_PACKAGE_NAME: pgvector-0-pg15
  PGVECTOR_PACKAGE_VERSION: 0.8.7-0
  PGVECTOR14_PACKAGE_VERSION: 0.8.7-0
  PGVECTOR15_PACKAGE_VERSION: 0.8.7-0
  PGVECTOR16_PACKAGE_VERSION: 0.8.7-0
  PGVECTOR17_PACKAGE_VERSION: 0.8.7-0
  PGVECTOR18_PACKAGE_VERSION: 0.8.7-0
  POSTGRES_PACKAGE_NAME: postgresql-15
  SEMVER_MAJOR_MINOR_VERSION: "0.8"
  SEMVER_MAJOR_VERSION: "0"
  SEMVER_VERSION: 0.8.7
  VERSION: 0.8.7-0
contents:
  repositories:
    - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
  keyring:
    - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
  packages:
    - '!libelogind0'
    - '!mawk'
    - '!original-awk'
    - base-files
    - bash
    - ca-certificates
    - ca-certificates-bundle
    - coreutils
    - findutils
    - less
    - libcurl4t64
    - libgssapi-krb5-2
    - libicu76
    - libldap2
    - liblz4-1
    - libnuma1
    - libpam0g
    - libreadline8t64
    - libselinux1
    - libssl3t64
    - liburing2
    - libuuid1
    - libxml2
    - libxslt1.1
    - libzstd1
    - llvm
    - locales
    - pgvector-0-pg15=0.8.7-0
    - postgresql-15=15.19-1
    - sed
    - tzdata
    - zlib1g
  builds:
    - name: locale
      contents:
        packages:
          - bash
          - locales
          - coreutils
          - gzip
      pipeline:
        - name: install locales
          runs: |
            set -eux -o pipefail

            ln -s /etc/locale.alias /usr/share/locale/locale.alias

            echo "en_US.UTF-8 UTF-8" >> /etc/locale.gen
            locale-gen en_US.UTF-8
      outputs:
        - source: /usr/share/locale
          target: /usr/share/locale
          uid: 0
          gid: 0
        - source: /usr/lib/locale
          target: /usr/lib/locale
          uid: 0
          gid: 0
accounts:
  run-as: postgres
  users:
    - name: postgres
      uid: 70
      gid: 70
  groups:
    - name: postgres
      gid: 70
      members:
        - postgres
os-release:
  name: Docker Hardened Images (Debian)
  id: debian
  version-id: "13"
  version-codename: trixie
  pretty-name: Docker Hardened Images/Debian GNU/Linux 13 (trixie)
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
stop-signal: SIGINT
environment:
  LANG: en_US.UTF-8
  LANGUAGE: en_US:en
  LC_ALL: en_US.UTF-8
  PATH: /opt/postgresql/15/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
  PG_MAJOR: "15"
  PG_MINOR: "19"
  PGDATA: /var/lib/postgresql/15/data
