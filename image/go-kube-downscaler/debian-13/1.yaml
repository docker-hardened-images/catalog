# syntax=dhi.io/build:2-debian13

name: GoKubeDownscaler 1.x
image: dhi.io/go-kube-downscaler
variant: runtime
tags:
  - "1"
  - "1.4"
  - 1.4.2
  - 1-debian
  - 1-debian13
  - 1.4-debian
  - 1.4-debian13
  - 1.4.2-debian
  - 1.4.2-debian13
platforms:
  - linux/amd64
  - linux/arm64
dates:
  release: "2024-09-16"
vars:
  DEBIAN_EPOCH_MAJOR_MINOR_VERSION: "1.4"
  DEBIAN_EPOCH_MAJOR_VERSION: "1"
  DEBIAN_EPOCH_VERSION: 1.4.2
  FLAVORED_SUFFIX: ""
  SUFFIX: ""
  VERSION: 1.4.2-1
contents:
  repositories:
    - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
  keyring:
    - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
  packages:
    - '!libelogind0'
    - '!mawk'
    - '!original-awk'
    - base-files
    - ca-certificates-bundle
    - go-kube-downscaler-1=1.4.2-1
    - tzdata
accounts:
  run-as: nonroot
  users:
    - name: nonroot
      uid: 65532
      gid: 65532
  groups:
    - name: nonroot
      gid: 65532
      members:
        - nonroot
os-release:
  name: Docker Hardened Images (Debian)
  id: debian
  version-id: "13"
  version-codename: trixie
  pretty-name: Docker Hardened Images/Debian GNU/Linux 13 (trixie)
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
work-dir: /
paths:
  - type: directory
    path: /app
    uid: 0
    gid: 0
    mode: "0755"
  - type: symlink
    path: /app/gokubedownscaler
    uid: 0
    gid: 0
    source: /usr/bin/gokubedownscaler
annotations:
  org.opencontainers.image.description: A minimal GoKubeDownscaler image
  org.opencontainers.image.licenses: GPL-3.0-only
entrypoint:
  - /app/gokubedownscaler
ports:
  - 8081/tcp
  - 8085/tcp
