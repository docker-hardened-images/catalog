# syntax=dhi.io/build:2-debian13

name: GoKubeDownscaler 1.x (dev)
image: dhi.io/go-kube-downscaler
variant: dev
tags:
  - 1-dev
  - 1.4-dev
  - 1.4.2-dev
  - 1-debian-dev
  - 1-debian13-dev
  - 1.4-debian-dev
  - 1.4-debian13-dev
  - 1.4.2-debian-dev
  - 1.4.2-debian13-dev
platforms:
  - linux/amd64
  - linux/arm64
dates:
  release: "2024-09-16"
vars:
  DEBIAN_EPOCH_MAJOR_MINOR_VERSION: "1.4"
  DEBIAN_EPOCH_MAJOR_VERSION: "1"
  DEBIAN_EPOCH_VERSION: 1.4.2
  FLAVORED_SUFFIX: -dev
  SUFFIX: -dev
  VERSION: 1.4.2-2
contents:
  repositories:
    - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
  keyring:
    - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
  packages:
    - '!gawk'
    - '!libelogind0'
    - '!mawk'
    - '!original-awk'
    - apt
    - base-files
    - bash
    - ca-certificates
    - ca-certificates-bundle
    - coreutils
    - diffutils
    - dpkg
    - findutils
    - go-kube-downscaler-1-dev=1.4.2-2
    - grep
    - libc-bin
    - mawk
    - perl-base
    - sed
    - sqv
    - tzdata
    - util-linux
accounts:
  root: true
  run-as: root
  users:
    - name: nonroot
      uid: 65532
      gid: 65532
    - name: _apt
      uid: 42
      gid: 65532
  groups:
    - name: nonroot
      gid: 65532
      members:
        - nonroot
os-release:
  name: Docker Hardened Images (Debian)
  id: debian
  version-id: "13"
  version-codename: trixie
  pretty-name: Docker Hardened Images/Debian GNU/Linux 13 (trixie)
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
work-dir: /
environment:
  DEBIAN_FRONTEND: noninteractive
paths:
  - type: directory
    path: /app
    uid: 0
    gid: 0
    mode: "0755"
  - type: symlink
    path: /app/gokubedownscaler
    uid: 0
    gid: 0
    source: /usr/bin/gokubedownscaler
annotations:
  org.opencontainers.image.description: A minimal GoKubeDownscaler image
  org.opencontainers.image.licenses: GPL-3.0-only
entrypoint:
  - /app/gokubedownscaler
ports:
  - 8081/tcp
  - 8085/tcp
