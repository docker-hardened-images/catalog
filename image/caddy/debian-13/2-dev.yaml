# syntax=dhi.io/build:2-debian13

name: Caddy 2.11.x (dev)
image: dhi.io/caddy
variant: dev
tags:
  - 2-dev
  - 2.11-dev
  - 2.11.4-dev
  - 2-debian-dev
  - 2-debian13-dev
  - 2.11-debian-dev
  - 2.11-debian13-dev
  - 2.11.4-debian-dev
  - 2.11.4-debian13-dev
platforms:
  - linux/amd64
  - linux/arm64
dates:
  release: "2020-05-04"
vars:
  COMMIT_SHA: e2eee6a7fce366321294c9c2a79f3146891dcbdf
  FLAVORED_SUFFIX: -dev
  SEMVER_MAJOR_MINOR_VERSION: "2.11"
  SEMVER_MAJOR_VERSION: "2"
  SEMVER_VERSION: 2.11.4
  SUFFIX: -dev
  VERSION: 2.11.4-1
contents:
  repositories:
    - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
  keyring:
    - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
  packages:
    - '!gawk'
    - '!libelogind0'
    - '!original-awk'
    - apt
    - base-files
    - bash
    - ca-certificates
    - ca-certificates-bundle
    - caddy-dev=2.11.4-1
    - coreutils
    - diffutils
    - dpkg
    - findutils
    - grep
    - libc-bin
    - mawk
    - perl-base
    - sed
    - tzdata
    - util-linux
accounts:
  root: true
  run-as: root
  users:
    - name: nonroot
      uid: 65532
      gid: 65532
    - name: _apt
      uid: 42
      gid: 65532
  groups:
    - name: nonroot
      gid: 65532
      members:
        - nonroot
os-release:
  name: Docker Hardened Images (Debian)
  id: debian
  version-id: "13"
  version-codename: trixie
  pretty-name: Docker Hardened Images/Debian GNU/Linux 13 (trixie)
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
work-dir: /srv
environment:
  DEBIAN_FRONTEND: noninteractive
  XDG_CONFIG_HOME: /config
  XDG_DATA_HOME: /data
paths:
  - type: directory
    path: /usr/local/bin
    uid: 0
    gid: 0
  - type: symlink
    path: /usr/local/bin/caddy
    uid: 0
    gid: 0
    source: /usr/bin/caddy
  - type: directory
    path: /etc/caddy
    uid: 65532
    gid: 65532
    mode: "0755"
  - type: directory
    path: /srv
    uid: 65532
    gid: 65532
    mode: "0755"
  - type: directory
    path: /usr/share/caddy
    uid: 65532
    gid: 65532
    mode: "0755"
  - type: directory
    path: /var/lib/caddy
    uid: 65532
    gid: 65532
    mode: "0755"
  - type: directory
    path: /config/caddy
    uid: 65532
    gid: 65532
    mode: "0755"
  - type: directory
    path: /data/caddy
    uid: 65532
    gid: 65532
    mode: "0755"
  - type: file
    path: /etc/caddy/Caddyfile
    uid: 65532
    gid: 65532
    mode: "0644"
    source: image/caddy/config/Caddyfile
  - type: file
    path: /usr/share/caddy/index.html
    uid: 65532
    gid: 65532
    mode: "0644"
    source: image/caddy/config/index.html
annotations:
  org.opencontainers.image.description: A minimal Caddy image
  org.opencontainers.image.licenses: Apache-2.0
entrypoint:
  - /usr/local/bin/caddy
cmd:
  - run
  - --config
  - /etc/caddy/Caddyfile
