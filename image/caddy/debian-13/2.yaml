# syntax=dhi.io/build:2-debian13

name: Caddy 2.11.x
image: dhi.io/caddy
variant: runtime
tags:
  - "2"
  - "2.11"
  - 2.11.4
  - 2-debian
  - 2-debian13
  - 2.11-debian
  - 2.11-debian13
  - 2.11.4-debian
  - 2.11.4-debian13
platforms:
  - linux/amd64
  - linux/arm64
dates:
  release: "2020-05-04"
vars:
  COMMIT_SHA: e2eee6a7fce366321294c9c2a79f3146891dcbdf
  FLAVORED_SUFFIX: ""
  SEMVER_MAJOR_MINOR_VERSION: "2.11"
  SEMVER_MAJOR_VERSION: "2"
  SEMVER_VERSION: 2.11.4
  SUFFIX: ""
  VERSION: 2.11.4-4
contents:
  repositories:
    - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
  keyring:
    - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
  packages:
    - base-files
    - ca-certificates-bundle
    - caddy=2.11.4-4
    - tzdata
accounts:
  run-as: nonroot
  users:
    - name: nonroot
      uid: 65532
      gid: 65532
  groups:
    - name: nonroot
      gid: 65532
      members:
        - nonroot
os-release:
  name: Docker Hardened Images (Debian)
  id: debian
  version-id: "13"
  version-codename: trixie
  pretty-name: Docker Hardened Images/Debian GNU/Linux 13 (trixie)
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
work-dir: /srv
environment:
  XDG_CONFIG_HOME: /config
  XDG_DATA_HOME: /data
paths:
  - type: directory
    path: /usr/local/bin
    uid: 0
    gid: 0
  - type: symlink
    path: /usr/local/bin/caddy
    uid: 0
    gid: 0
    source: /usr/bin/caddy
  - type: directory
    path: /etc/caddy
    uid: 65532
    gid: 65532
    mode: "0755"
  - type: directory
    path: /srv
    uid: 65532
    gid: 65532
    mode: "0755"
  - type: directory
    path: /usr/share/caddy
    uid: 65532
    gid: 65532
    mode: "0755"
  - type: directory
    path: /var/lib/caddy
    uid: 65532
    gid: 65532
    mode: "0755"
  - type: directory
    path: /config/caddy
    uid: 65532
    gid: 65532
    mode: "0755"
  - type: directory
    path: /data/caddy
    uid: 65532
    gid: 65532
    mode: "0755"
  - type: file
    path: /etc/caddy/Caddyfile
    uid: 65532
    gid: 65532
    mode: "0644"
    source: image/caddy/config/Caddyfile
  - type: file
    path: /usr/share/caddy/index.html
    uid: 65532
    gid: 65532
    mode: "0644"
    source: image/caddy/config/index.html
annotations:
  org.opencontainers.image.description: A minimal Caddy image
  org.opencontainers.image.licenses: Apache-2.0
entrypoint:
  - /usr/local/bin/caddy
cmd:
  - run
  - --config
  - /etc/caddy/Caddyfile
