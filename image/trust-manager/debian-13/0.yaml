# syntax=dhi.io/build:2-debian13

name: Trust Manager 0.x
image: dhi.io/trust-manager
variant: runtime
tags:
  - "0"
  - "0.24"
  - 0.24.0
  - 0-debian
  - 0-debian13
  - 0.24-debian
  - 0.24-debian13
  - 0.24.0-debian
  - 0.24.0-debian13
platforms:
  - linux/amd64
  - linux/arm64
vars:
  FLAVORED_SUFFIX: ""
  SEMVER_MAJOR_MINOR_VERSION: "0.24"
  SEMVER_MAJOR_VERSION: "0"
  SEMVER_VERSION: 0.24.0
  SUFFIX: ""
  VERSION: 0.24.0-5
contents:
  repositories:
    - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
  keyring:
    - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
  packages:
    - base-files
    - ca-certificates-bundle
    - trust-manager=0.24.0-5
    - tzdata
accounts:
  run-as: "65532"
  users:
    - name: nonroot
      uid: 65532
      gid: 65532
  groups:
    - name: nonroot
      gid: 65532
      members:
        - nonroot
os-release:
  name: Docker Hardened Images (Debian)
  id: debian
  version-id: "13"
  version-codename: trixie
  pretty-name: Docker Hardened Images/Debian GNU/Linux 13 (trixie)
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
environment:
  SSL_CERT_FILE: /etc/ssl/certs/ca-certificates.crt
paths:
  - type: directory
    path: /usr/local/bin
    uid: 0
    gid: 0
  - type: symlink
    path: /usr/local/bin/trust-manager
    uid: 0
    gid: 0
    source: /usr/bin/trust-manager
  - type: directory
    path: /ko-app
    uid: 0
    gid: 0
    mode: "0755"
  - type: symlink
    path: /ko-app/trust-manager
    uid: 0
    gid: 0
    source: /usr/local/bin/trust-manager
  - type: symlink
    path: /etc/ssl/certs.pem
    uid: 0
    gid: 0
    source: /etc/ssl/certs/ca-certificates.crt
annotations:
  org.opencontainers.image.description: A minimal cert-manager trust-manager image
  org.opencontainers.image.licenses: Apache-2.0
entrypoint:
  - /usr/local/bin/trust-manager
