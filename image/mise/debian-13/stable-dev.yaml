# syntax=dhi.io/build:2-debian13

name: mise 2026.x (dev)
image: dhi.io/mise
variant: dev
tags:
  - 2026-dev
  - 2026.9-dev
  - 2026.9.18-dev
  - 2026-debian-dev
  - 2026-debian13-dev
  - 2026.9-debian-dev
  - 2026.9-debian13-dev
  - 2026.9.18-debian-dev
  - 2026.9.18-debian13-dev
platforms:
  - linux/amd64
  - linux/arm64
dates:
  release: "2023-08-15"
vars:
  SEMVER_MAJOR_MINOR_VERSION: "2026.9"
  SEMVER_MAJOR_VERSION: "2026"
  SEMVER_VERSION: 2026.9.18
  VERSION: 2026.9.18-0
contents:
  repositories:
    - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
  keyring:
    - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
  packages:
    - '!gawk'
    - '!libelogind0'
    - '!original-awk'
    - apt
    - base-files
    - bash
    - ca-certificates
    - ca-certificates-bundle
    - coreutils
    - diffutils
    - dpkg
    - findutils
    - grep
    - libc-bin
    - libc6
    - libgcc-s1
    - libssl3t64
    - libzstd1
    - mawk
    - mise=2026.9.18-0
    - perl-base
    - sed
    - tzdata
    - util-linux
    - zlib1g
  builds:
    - name: locale
      contents:
        packages:
          - bash
          - locales
          - coreutils
          - gzip
      pipeline:
        - name: install locales
          runs: |
            set -eux -o pipefail

            ln -s /etc/locale.alias /usr/share/locale/locale.alias

            echo "en_US.UTF-8 UTF-8" >> /etc/locale.gen
            locale-gen en_US.UTF-8
      outputs:
        - source: /usr/share/locale
          target: /usr/share/locale
          uid: 0
          gid: 0
        - source: /usr/lib/locale
          target: /usr/lib/locale
          uid: 0
          gid: 0
accounts:
  root: true
  run-as: root
  users:
    - name: nonroot
      uid: 65532
      gid: 65532
    - name: _apt
      uid: 42
      gid: 65532
  groups:
    - name: nonroot
      gid: 65532
      members:
        - nonroot
os-release:
  name: Docker Hardened Images (Debian)
  id: debian
  version-id: "13"
  version-codename: trixie
  pretty-name: Docker Hardened Images/Debian GNU/Linux 13 (trixie)
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
work-dir: /mise
environment:
  DEBIAN_FRONTEND: noninteractive
  LANG: en_US.UTF-8
  LANGUAGE: en_US:en
  LC_ALL: en_US.UTF-8
  MISE_CACHE_DIR: /mise/cache
  MISE_CACHE_PRUNE_AGE: 10y
  MISE_CONFIG_DIR: /mise
  MISE_DATA_DIR: /mise
  MISE_DISABLE_UPDATE_WARNING: "true"
  PATH: /mise/shims:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
paths:
  - type: directory
    path: /usr/local/bin
    uid: 0
    gid: 0
  - type: symlink
    path: /usr/local/bin/mise
    uid: 0
    gid: 0
    source: /usr/bin/mise
  - type: directory
    path: /mise
    uid: 65532
    gid: 65532
    mode: "0770"
  - type: directory
    path: /mise/cache
    uid: 65532
    gid: 65532
    mode: "0770"
  - type: directory
    path: /mise/shims
    uid: 65532
    gid: 65532
    mode: "0770"
  - type: directory
    path: /mise/downloads
    uid: 65532
    gid: 65532
    mode: "0770"
  - type: directory
    path: /mise/installs
    uid: 65532
    gid: 65532
    mode: "0770"
  - type: directory
    path: /mise/migrations
    uid: 65532
    gid: 65532
    mode: "0770"
annotations:
  org.opencontainers.image.description: A minimal mise image
  org.opencontainers.image.licenses: MIT
entrypoint:
  - mise
cmd:
  - --help
