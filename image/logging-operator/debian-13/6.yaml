# syntax=dhi.io/build:2-debian13

name: Logging operator 6.x
image: dhi.io/logging-operator
variant: runtime
tags:
  - "6"
  - "6.9"
  - 6.9.0
  - 6-debian
  - 6-debian13
  - 6.9-debian
  - 6.9-debian13
  - 6.9.0-debian
  - 6.9.0-debian13
platforms:
  - linux/amd64
  - linux/arm64
dates:
  release: "2025-07-14"
vars:
  FLAVORED_SUFFIX: ""
  SEMVER_MAJOR_MINOR_VERSION: "6.9"
  SEMVER_MAJOR_VERSION: "6"
  SEMVER_VERSION: 6.9.0
  SUFFIX: ""
  VERSION: 6.9.0-1
contents:
  repositories:
    - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
  keyring:
    - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
  packages:
    - '!libelogind0'
    - '!mawk'
    - '!original-awk'
    - base-files
    - ca-certificates-bundle
    - logging-operator-6=6.9.0-1
    - tzdata
    - tzdata-legacy
accounts:
  run-as: nonroot
  users:
    - name: nonroot
      uid: 65532
      gid: 65532
  groups:
    - name: nonroot
      gid: 65532
      members:
        - nonroot
os-release:
  name: Docker Hardened Images (Debian)
  id: debian
  version-id: "13"
  version-codename: trixie
  pretty-name: Docker Hardened Images/Debian GNU/Linux 13 (trixie)
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
work-dir: /
paths:
  - type: directory
    path: /usr/local/bin
    uid: 0
    gid: 0
    mode: "0755"
  - type: symlink
    path: /usr/local/bin/logging-operator
    uid: 0
    gid: 0
    source: /usr/bin/logging-operator
  - type: symlink
    path: /manager
    uid: 0
    gid: 0
    source: /usr/bin/logging-operator
annotations:
  org.opencontainers.image.description: A minimal Logging operator image
  org.opencontainers.image.licenses: Apache-2.0
entrypoint:
  - /usr/local/bin/logging-operator
