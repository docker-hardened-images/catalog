# syntax=dhi.io/build:2-debian13

name: Logging operator 6.x (dev)
image: dhi.io/logging-operator
variant: dev
tags:
  - 6-dev
  - 6.9-dev
  - 6.9.0-dev
  - 6-debian-dev
  - 6-debian13-dev
  - 6.9-debian-dev
  - 6.9-debian13-dev
  - 6.9.0-debian-dev
  - 6.9.0-debian13-dev
platforms:
  - linux/amd64
  - linux/arm64
dates:
  release: "2025-07-14"
vars:
  FLAVORED_SUFFIX: -dev
  SEMVER_MAJOR_MINOR_VERSION: "6.9"
  SEMVER_MAJOR_VERSION: "6"
  SEMVER_VERSION: 6.9.0
  SUFFIX: -dev
  VERSION: 6.9.0-0
contents:
  repositories:
    - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
  keyring:
    - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
  packages:
    - '!gawk'
    - '!libelogind0'
    - '!mawk'
    - '!original-awk'
    - apt
    - base-files
    - bash
    - ca-certificates
    - ca-certificates-bundle
    - coreutils
    - diffutils
    - dpkg
    - findutils
    - grep
    - libc-bin
    - logging-operator-6-dev=6.9.0-0
    - mawk
    - perl-base
    - sed
    - tzdata
    - tzdata-legacy
    - util-linux
accounts:
  root: true
  run-as: root
  users:
    - name: nonroot
      uid: 65532
      gid: 65532
    - name: _apt
      uid: 42
      gid: 65532
  groups:
    - name: nonroot
      gid: 65532
      members:
        - nonroot
os-release:
  name: Docker Hardened Images (Debian)
  id: debian
  version-id: "13"
  version-codename: trixie
  pretty-name: Docker Hardened Images/Debian GNU/Linux 13 (trixie)
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
work-dir: /
environment:
  DEBIAN_FRONTEND: noninteractive
paths:
  - type: directory
    path: /usr/local/bin
    uid: 0
    gid: 0
    mode: "0755"
  - type: symlink
    path: /usr/local/bin/logging-operator
    uid: 0
    gid: 0
    source: /usr/bin/logging-operator
  - type: symlink
    path: /manager
    uid: 0
    gid: 0
    source: /usr/bin/logging-operator
annotations:
  org.opencontainers.image.description: A minimal Logging operator image
  org.opencontainers.image.licenses: Apache-2.0
entrypoint:
  - /usr/local/bin/logging-operator
