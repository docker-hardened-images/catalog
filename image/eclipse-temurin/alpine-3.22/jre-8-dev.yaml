# syntax=dhi.io/build:2-alpine3.22

name: Eclipse Temurin 8.x JRE (dev)
image: dhi.io/eclipse-temurin
variant: dev
tags:
  - 8-alpine3.22-dev
  - 8u504-alpine3.22-dev
  - 8u504.b01-alpine3.22-dev
platforms:
  - linux/amd64
dates:
  release: "2021-07-29"
  end-of-life: "2030-12-31"
vars:
  ECLIPSE_ARCH: '#{ target.arch == "amd64" ? "x64" : "aarch64" }'
  JAVA_CATALOG_VERSION: 8u504.b01
  JAVA_JDK_CHECKSUM: https://github.com/adoptium/temurin8-binaries/releases/download/jdk8u504-b01/OpenJDK8U-jdk_${ECLIPSE_ARCH}_alpine-linux_hotspot_8u504b01.tar.gz.sha256.txt
  JAVA_JDK_DOWNLOAD: https://github.com/adoptium/temurin8-binaries/releases/download/jdk8u504-b01/OpenJDK8U-jdk_${ECLIPSE_ARCH}_alpine-linux_hotspot_8u504b01.tar.gz
  JAVA_JRE_CHECKSUM: https://github.com/adoptium/temurin8-binaries/releases/download/jdk8u504-b01/OpenJDK8U-jre_${ECLIPSE_ARCH}_alpine-linux_hotspot_8u504b01.tar.gz.sha256.txt
  JAVA_JRE_DOWNLOAD: https://github.com/adoptium/temurin8-binaries/releases/download/jdk8u504-b01/OpenJDK8U-jre_${ECLIPSE_ARCH}_alpine-linux_hotspot_8u504b01.tar.gz
  JAVA_MAJOR_MINOR_VERSION: 8u504
  JAVA_MAJOR_VERSION: "8"
  JAVA_VERSION: 8u504
  JAVA_VERSION_SUFFIX: b01
  OS: alpine-linux
  VERSION: jdk8u504-b01
contents:
  repositories:
    - https://dl-cdn.alpinelinux.org/alpine/v3.22/main
    - https://dl-cdn.alpinelinux.org/alpine/v3.22/community
  packages:
    - alpine-baselayout-data
    - apk-tools
    - busybox
    - ca-certificates-bundle
    - musl
    - tzdata
  builds:
    - name: eclipse-temurin
      contents:
        repositories:
          - https://dl-cdn.alpinelinux.org/alpine/v3.22/main
        packages:
          - alpine-baselayout-data
          - busybox
        files:
          - url: https://github.com/adoptium/temurin8-binaries/releases/download/jdk8u504-b01/OpenJDK8U-jre_${ECLIPSE_ARCH}_alpine-linux_hotspot_8u504b01.tar.gz
            checksum: https://github.com/adoptium/temurin8-binaries/releases/download/jdk8u504-b01/OpenJDK8U-jre_${ECLIPSE_ARCH}_alpine-linux_hotspot_8u504b01.tar.gz.sha256.txt
            path: ${target.dir}/opt/java/openjdk
            spdx:
              name: eclipse-temurin
              version: 8u504.b01
              packages:
                - name: eclipse-temurin
                  purl: pkg:dhi/eclipse/temurin-jre@8u504.b01
                  license: GPL-2.0-with-classpath-exception
            uid: 0
            gid: 0
      pipeline:
        - name: create symlinks
          runs: |
            set -eux -o pipefail

            mv ${target.dir}/opt/java/openjdk/* ${target.dir}/opt/java/openjdk/8-jre
            mkdir -p ${target.dir}/usr/local/bin
            find ${target.dir}/opt/java/openjdk/8-jre/bin -type f -executable -o -type l | while read -r file; do
              filename=$(basename "$file")
              ln -s /opt/java/openjdk/8-jre/bin/$filename ${target.dir}/usr/local/bin/$filename
            done
        - name: remove compromised CA roots
          runs: |
            set -eux -o pipefail

            JAVA_HOME="${target.dir}/opt/java/openjdk/8-jre"
            KEYTOOL="$JAVA_HOME/bin/keytool"
            CACERTS="$JAVA_HOME/lib/security/cacerts"

            "$KEYTOOL" -list -keystore "$CACERTS" -storepass changeit > /dev/null
            for alias in \
              "comodoaaaca [jdk]" \
              "emsigneccrootcag3 [jdk]" \
              "emsignrootcag1 [jdk]" \
              "emsignrootcag2 [jdk]" \
              "cn_aaa_certificate_services,o_comodo_ca_limited,l_salford,st_greater_manchester,c_gb [jdk]" \
              "cn_emsign_ecc_root_ca__g3,o_emudhra_technologies_limited,ou_emsign_pki,c_in [jdk]" \
              "cn_emsign_root_ca__g1,o_emudhra_technologies_limited,ou_emsign_pki,c_in [jdk]" \
              "cn_emsign_root_ca__g2,o_emudhra_technologies_limited,ou_emsign_pki,c_in [jdk]" \
              "cn=aaa_certificate_services,o=comodo_ca_limited,l=salford,st=greater_manchester,c=gb" \
              "cn=emsign_ecc_root_ca_-_g3,o=emudhra_technologies_limited,ou=emsign_pki,c=in" \
              "cn=emsign_root_ca_-_g1,o=emudhra_technologies_limited,ou=emsign_pki,c=in" \
              "cn=emsign_root_ca_-_g2,o=emudhra_technologies_limited,ou=emsign_pki,c=in"; do
              if "$KEYTOOL" -list -keystore "$CACERTS" -storepass changeit -alias "$alias" > /dev/null 2>&1; then
                "$KEYTOOL" -delete -keystore "$CACERTS" -storepass changeit -alias "$alias"
              fi
            done

            LISTING="$("$KEYTOOL" -list -v -keystore "$CACERTS" -storepass changeit)"
            for subject in \
              "CN=AAA Certificate Services" \
              "CN=emSign Root CA - G1" \
              "CN=emSign Root CA - G2" \
              "CN=emSign ECC Root CA - G3"; do
              if echo "$LISTING" | grep -F "Owner: ${subject}," > /dev/null; then
                echo "compromised CA root still present: ${subject}" >&2
                exit 1
              fi
            done
      outputs:
        - source: ${target.dir}/opt/java
          target: /opt/java
          uid: 0
          gid: 0
        - source: ${target.dir}/usr/local/bin
          target: /usr/local/bin
          uid: 0
          gid: 0
        - source: /opt/docker/sbom
          target: /opt/docker/sbom
          uid: 0
          gid: 0
accounts:
  root: true
  run-as: root
  users:
    - name: nonroot
      uid: 65532
      gid: 65532
  groups:
    - name: nonroot
      gid: 65532
      members:
        - nonroot
os-release:
  name: Docker Hardened Images (Alpine)
  id: alpine
  version-id: "3.22"
  pretty-name: Docker Hardened Images/Alpine Linux v3.22
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
environment:
  JAVA_HOME: /opt/java/openjdk/8-jre
  JAVA_VERSION: jre-8u504+b01
annotations:
  org.opencontainers.image.description: A minimal Eclipse Temurin image
  org.opencontainers.image.licenses: GPL-2.0-only WITH Classpath-exception-2.0
cmd:
  - /bin/sh
