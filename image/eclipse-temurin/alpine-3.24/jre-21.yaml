# syntax=dhi.io/build:2-alpine3.23

name: Eclipse Temurin 21.x JRE
image: dhi.io/eclipse-temurin
variant: runtime
tags:
  - 21-alpine
  - 21.0-alpine
  - 21-alpine3.24
  - 21.0.13-alpine
  - 21.0-alpine3.24
  - 21.0.13-alpine3.24
  - 21.0.13.9.1.2-alpine
  - 21.0.13.9.1.2-alpine3.24
platforms:
  - linux/amd64
  - linux/arm64
dates:
  release: "2023-10-10"
  end-of-life: "2029-12-31"
vars:
  JAVA_CATALOG_VERSION: 21.0.13.9.1.2
  JAVA_MAJOR_MINOR_VERSION: "21.0"
  JAVA_MAJOR_VERSION: "21"
  JAVA_VERSION: 21.0.13
  JAVA_VERSION_SUFFIX: "2"
  MUSL_ARCH: '#{ target.arch == "amd64" ? "x86_64" : "aarch64" }'
  VERSION: 21.0.13.9.1.2-r0
contents:
  repositories:
    - https://dhi.io/apk/alpine/v3.24/main
    - https://dl-cdn.alpinelinux.org/alpine/v3.24/main
    - https://dl-cdn.alpinelinux.org/alpine/v3.24/community
  keyring:
    - https://dhi.io/keyring/dhi-apk@docker-0F81AD7700D99184.rsa.pub
  packages:
    - alpine-baselayout-data
    - ca-certificates-bundle
    - eclipse-temurin-21-jre-oci-config=21.0.13.9.1.2-r0
    - eclipse-temurin-21-jre=21.0.13.9.1.2-r0
    - musl
    - tzdata
accounts:
  run-as: nonroot
  users:
    - name: nonroot
      uid: 65532
      gid: 65532
  groups:
    - name: nonroot
      gid: 65532
      members:
        - nonroot
os-release:
  name: Docker Hardened Images (Alpine)
  id: alpine
  version-id: "3.24"
  pretty-name: Docker Hardened Images/Alpine Linux v3.24
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
paths:
  - type: symlink
    path: /usr/bin/ldd
    uid: 0
    gid: 0
    source: /lib/ld-musl-${MUSL_ARCH}.so.1
annotations:
  org.opencontainers.image.description: A minimal Eclipse Temurin image
  org.opencontainers.image.licenses: GPL-2.0-only WITH Classpath-exception-2.0
cmd:
  - java
  - --help
