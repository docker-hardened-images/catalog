# syntax=dhi.io/build:2-debian13

name: Kubeflow Pipelines Cache Deployer 2.18.x (dev)
image: dhi.io/kubeflow-pipelines-cache-deployer
variant: dev
tags:
  - 2-dev
  - 2.18-dev
  - 2.18.1-dev
  - 2-debian-dev
  - 2-debian13-dev
  - 2.18-debian-dev
  - 2.18-debian13-dev
  - 2.18.1-debian-dev
  - 2.18.1-debian13-dev
platforms:
  - linux/amd64
  - linux/arm64
dates:
  release: "2026-10-28"
vars:
  KUBECTL_MAJOR_MINOR_VERSION: "1.37"
  PACKAGE_SUFFIX: ""
  SEMVER_MAJOR_MINOR_VERSION: "2.18"
  SEMVER_MAJOR_VERSION: "2"
  SEMVER_VERSION: 2.18.1
  VERSION: 2.18.1-0
contents:
  repositories:
    - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
  keyring:
    - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
  packages:
    - '!gawk'
    - '!libelogind0'
    - '!original-awk'
    - apt
    - base-files
    - bash
    - ca-certificates
    - ca-certificates-bundle
    - coreutils
    - dash
    - diffutils
    - dpkg
    - findutils
    - grep
    - kubectl-1.37
    - kubeflow-pipelines-cache-deployer-2.18=2.18.1-0
    - libc-bin
    - mawk
    - openssl
    - perl-base
    - sed
    - tzdata
    - util-linux
  builds:
    - name: writable-dirs
      contents:
        packages:
          - coreutils
          - dash
      pipeline:
        - name: create the state directory and HOME
          runs: |
            set -eux -o pipefail

            install -d -m 0755 /stage/home /stage/var /stage/var/lib
            install -d -o 65532 -g 0 -m 0770 \
              /stage/home/cache-deployer \
              /stage/var/lib/kubeflow-pipelines-cache-deployer
      outputs:
        - source: /stage
          target: /
          uid: 0
          gid: 0
accounts:
  root: true
  run-as: root
  users:
    - name: nonroot
      uid: 65532
      gid: 65532
    - name: _apt
      uid: 42
      gid: 65532
  groups:
    - name: nonroot
      gid: 65532
      members:
        - nonroot
os-release:
  name: Docker Hardened Images (Debian)
  id: debian
  version-id: "13"
  version-codename: trixie
  pretty-name: Docker Hardened Images/Debian GNU/Linux 13 (trixie)
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
work-dir: /kfp/cache/deployer
environment:
  DEBIAN_FRONTEND: noninteractive
  HOME: /home/cache-deployer
paths:
  - type: directory
    path: /kfp
    uid: 0
    gid: 0
    mode: "0755"
  - type: directory
    path: /kfp/cache
    uid: 0
    gid: 0
    mode: "0755"
  - type: directory
    path: /kfp/cache/deployer
    uid: 0
    gid: 0
    mode: "0755"
  - type: symlink
    path: /kfp/cache/deployer/deploy-cache-service.sh
    uid: 0
    gid: 0
    source: /usr/lib/kubeflow-pipelines-cache-deployer/deploy-cache-service.sh
  - type: symlink
    path: /kfp/cache/deployer/webhook-create-signed-cert.sh
    uid: 0
    gid: 0
    source: /usr/lib/kubeflow-pipelines-cache-deployer/webhook-create-signed-cert.sh
  - type: symlink
    path: /kfp/cache/deployer/webhook-patch-ca-bundle.sh
    uid: 0
    gid: 0
    source: /usr/lib/kubeflow-pipelines-cache-deployer/webhook-patch-ca-bundle.sh
  - type: symlink
    path: /kfp/cache/deployer/cache-webhook-config.v1.yaml.template
    uid: 0
    gid: 0
    source: /usr/share/kubeflow-pipelines-cache-deployer/cache-webhook-config.v1.yaml.template
  - type: symlink
    path: /kfp/cache/deployer/cache-webhook-config.v1beta1.v1.15.yaml.template
    uid: 0
    gid: 0
    source: /usr/share/kubeflow-pipelines-cache-deployer/cache-webhook-config.v1beta1.v1.15.yaml.template
  - type: symlink
    path: /kfp/cache/deployer/cache-webhook-config.v1beta1.yaml.template
    uid: 0
    gid: 0
    source: /usr/share/kubeflow-pipelines-cache-deployer/cache-webhook-config.v1beta1.yaml.template
  - type: directory
    path: /usr/local/bin
    uid: 0
    gid: 0
  - type: symlink
    path: /usr/local/bin/kubectl
    uid: 0
    gid: 0
    source: /usr/bin/kubectl
annotations:
  org.opencontainers.image.description: A minimal Kubeflow Pipelines cache deployer image
  org.opencontainers.image.licenses: Apache-2.0
entrypoint:
  - /bin/sh
  - /kfp/cache/deployer/deploy-cache-service.sh
