# syntax=dhi.io/build:2-debian13

name: AWS Load Balancer Controller 2.x (dev)
image: dhi.io/aws-load-balancer-controller
variant: dev
tags:
  - 2-dev
  - 2.17-dev
  - 2.17.1-dev
  - 2-debian-dev
  - 2-debian13-dev
  - 2.17-debian-dev
  - 2.17-debian13-dev
  - 2.17.1-debian-dev
  - 2.17.1-debian13-dev
platforms:
  - linux/amd64
  - linux/arm64
dates:
  release: "2026-01-09"
vars:
  FLAVORED_SUFFIX: -dev
  PACKAGE_NAME: aws-load-balancer-controller-2
  PACKAGE_SUFFIX: ""
  SEMVER_MAJOR_MINOR_VERSION: "2.17"
  SEMVER_MAJOR_VERSION: "2"
  SEMVER_VERSION: 2.17.1
  SUFFIX: -dev
  VERSION: 2.17.1-10
contents:
  repositories:
    - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
  keyring:
    - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
  packages:
    - '!gawk'
    - '!libelogind0'
    - '!original-awk'
    - apt
    - aws-load-balancer-controller-2=2.17.1-10
    - base-files
    - bash
    - ca-certificates
    - ca-certificates-bundle
    - coreutils
    - diffutils
    - dpkg
    - findutils
    - grep
    - libc-bin
    - mawk
    - perl-base
    - sed
    - tzdata
    - util-linux
accounts:
  root: true
  run-as: root
  users:
    - name: nonroot
      uid: 65532
      gid: 65532
