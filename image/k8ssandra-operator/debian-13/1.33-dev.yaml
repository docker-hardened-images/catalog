# syntax=dhi.io/build:2-debian13

name: k8ssandra-operator 1.x (dev)
image: dhi.io/k8ssandra-operator
variant: dev
tags:
  - 1.33-dev
  - 1.33.0-dev
  - 1.33-debian-dev
  - 1.33-debian13-dev
  - 1.33.0-debian-dev
  - 1.33.0-debian13-dev
platforms:
  - linux/amd64
  - linux/arm64
dates:
  release: "2025-09-08"
vars:
  FLAVORED_SUFFIX: -dev
  SEMVER_MAJOR_MINOR_VERSION: "1.33"
  SEMVER_MAJOR_VERSION: "1"
  SEMVER_VERSION: 1.33.0
  SUFFIX: -dev
  VERSION: 1.33.0-1
contents:
  repositories:
    - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
  keyring:
    - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
  packages:
    - '!gawk'
    - '!libelogind0'
    - '!original-awk'
    - apt
    - base-files
    - bash
    - ca-certificates
    - ca-certificates-bundle
    - coreutils
    - diffutils
    - dpkg
    - findutils
    - grep
    - k8ssandra-operator-1.33-dev=1.33.0-1
    - libc-bin
    - mawk
    - perl-base
    - sed
    - tzdata
    - util-linux
  builds:
    - name: k8ssandra-operator-sbom
      contents:
        packages:
          - bash
          - coreutils
      pipeline:
        - uses: spdx@v1
          with:
            license: Apache-2.0
            name: k8ssandra-operator
            purl: pkg:golang/github.com/k8ssandra/k8ssandra-operator@1.33.0
            version: 1.33.0
      outputs:
        - source: /opt/docker/sbom/k8ssandra-operator
          target: /opt/docker/sbom/k8ssandra-operator
          uid: 0
          gid: 0
accounts:
  root: true
  run-as: root
  users:
    - name: nonroot
      uid: 65532
      gid: 65532
    - name: _apt
      uid: 42
      gid: 65532
  groups:
    - name: nonroot
      gid: 65532
      members:
        - nonroot
os-release:
  name: Docker Hardened Images (Debian)
  id: debian
  version-id: "13"
  version-codename: trixie
  pretty-name: Docker Hardened Images/Debian GNU/Linux 13 (trixie)
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
environment:
  DEBIAN_FRONTEND: noninteractive
paths:
  - type: symlink
    path: /manager
    uid: 0
    gid: 0
    source: /usr/bin/manager
annotations:
  org.opencontainers.image.description: A minimal k8ssandra-operator image
  org.opencontainers.image.licenses: Apache-2.0
entrypoint:
  - /manager
