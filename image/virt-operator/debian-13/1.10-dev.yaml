# syntax=dhi.io/build:2-debian13

name: Virt Operator 1.10.x (dev)
image: dhi.io/virt-operator
variant: dev
tags:
  - 1-dev
  - 1.10-dev
  - 1.10.0-dev
  - 1-debian-dev
  - 1-debian13-dev
  - 1.10-debian-dev
  - 1.10-debian13-dev
  - 1.10.0-debian-dev
  - 1.10.0-debian13-dev
platforms:
  - linux/amd64
  - linux/arm64
dates:
  release: "2026-11-18"
vars:
  COMMIT_SHA: b0c8f3da95be1137d2285198b89a1e2323ec9278
  GOLANG_VERSION: 1.26.11-18
  SEMVER_MAJOR_MINOR_VERSION: "1.10"
  SEMVER_MAJOR_VERSION: "1"
  SEMVER_VERSION: 1.10.0
  VERSION: 1.10.0
contents:
  repositories:
    - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
  keyring:
    - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
  packages:
    - '!gawk'
    - '!libelogind0'
    - '!original-awk'
    - apt
    - base-files
    - bash
    - ca-certificates
    - ca-certificates-bundle
    - coreutils
    - diffutils
    - dpkg
    - findutils
    - grep
    - libc-bin
    - mawk
    - perl-base
    - sed
    - tzdata
    - util-linux
  builds:
    - name: virt-operator
      work-dir: /go/src/kubevirt.io/kubevirt
      environment:
        GOTOOLCHAIN: local
      caches:
        - path: /go/pkg/mod
        - path: /root/.cache/go-build
      contents:
        packages:
          - bash
          - ca-certificates-bundle
          - coreutils
          - golang-1.26=1.26.11-18
          - findutils
          - mawk
          - sed
        files:
          - url: git+https://github.com/kubevirt/kubevirt.git#v1.10.0
            checksum: b0c8f3da95be1137d2285198b89a1e2323ec9278
            path: /go/src/kubevirt.io/kubevirt
            spdx:
              name: virt-operator
              version: 1.10.0
              packages:
                - name: virt-operator
                  purl: pkg:golang/kubevirt.io/kubevirt@1.10.0
                  license: Apache-2.0
            uid: 0
            gid: 0
      pipeline:
        - name: patch go dependencies (1.10 only)
          uses: go/bump@v2
          with:
            deps:
              - golang.org/x/text@v0.41.0
              - golang.org/x/net@v0.62.0
              - google.golang.org/grpc@v1.83.2
              - go.mongodb.org/mongo-driver@v1.17.7
            download: true
        - name: test
          work-dir: /go/src/kubevirt.io/kubevirt/cmd/virt-operator
          runs: |
            set -eux -o pipefail

            CGO_ENABLED=0 go test ./...
        - name: build
          uses: go/build@v1
          work-dir: /go/src/kubevirt.io/kubevirt/cmd/virt-operator
          environment:
            GOFLAGS: -buildvcs=false
          with:
            ldflags:
              - -X kubevirt.io/client-go/version.gitVersion=v1.10.0
              - -X kubevirt.io/client-go/version.gitCommit=b0c8f3da95be1137d2285198b89a1e2323ec9278
            output: ${target.dir}/usr/local/bin/virt-operator
      paths:
        - type: directory
          path: ${source.dir}/patch
          uid: 0
          gid: 0
          source: image/virt-operator/patch
      outputs:
        - source: ${target.dir}/usr/local/bin/virt-operator
          target: /usr/local/bin/virt-operator
          uid: 0
          gid: 0
        - source: /opt/docker/sbom/virt-operator
          target: /opt/docker/sbom/virt-operator
          uid: 0
          gid: 0
accounts:
  root: true
  run-as: root
  users:
    - name: nonroot
      uid: 65532
      gid: 65532
    - name: _apt
      uid: 42
      gid: 65532
  groups:
    - name: nonroot
      gid: 65532
      members:
        - nonroot
os-release:
  name: Docker Hardened Images (Debian)
  id: debian
  version-id: "13"
  version-codename: trixie
  pretty-name: Docker Hardened Images/Debian GNU/Linux 13 (trixie)
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
environment:
  DEBIAN_FRONTEND: noninteractive
annotations:
  org.opencontainers.image.description: A minimal Virt Operator image
  org.opencontainers.image.licenses: Apache-2.0
entrypoint:
  - /usr/local/bin/virt-operator
