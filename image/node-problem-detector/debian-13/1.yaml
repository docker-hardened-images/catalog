# syntax=dhi.io/build:2-debian13

name: Node Problem Detector 1.36.x
image: dhi.io/node-problem-detector
variant: runtime
tags:
  - "1"
  - "1.36"
  - 1.36.0
  - 1-debian
  - 1-debian13
  - 1.36-debian
  - 1.36-debian13
  - 1.36.0-debian
  - 1.36.0-debian13
platforms:
  - linux/amd64
  - linux/arm64
dates:
  release: "2026-06-30"
vars:
  FLAVORED_SUFFIX: ""
  SEMVER_MAJOR_MINOR_VERSION: "1.36"
  SEMVER_MAJOR_VERSION: "1"
  SEMVER_VERSION: 1.36.0
  SUFFIX: ""
  VERSION: 1.36.0-2
contents:
  repositories:
    - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
  keyring:
    - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
  packages:
    - base-files
    - bash
    - ca-certificates-bundle
    - libc6
    - libsystemd0
    - node-problem-detector=1.36.0-2
    - tzdata
    - util-linux
accounts:
  run-as: nonroot
  users:
    - name: nonroot
      uid: 65532
      gid: 65532
  groups:
    - name: nonroot
      gid: 65532
      members:
        - nonroot
os-release:
  name: Docker Hardened Images (Debian)
  id: debian
  version-id: "13"
  version-codename: trixie
  pretty-name: Docker Hardened Images/Debian GNU/Linux 13 (trixie)
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
paths:
  - type: symlink
    path: /node-problem-detector
    uid: 0
    gid: 0
    source: /usr/bin/node-problem-detector
  - type: directory
    path: /home/kubernetes/bin
    uid: 0
    gid: 0
  - type: symlink
    path: /home/kubernetes/bin/health-checker
    uid: 0
    gid: 0
    source: /usr/bin/health-checker
  - type: symlink
    path: /home/kubernetes/bin/log-counter
    uid: 0
    gid: 0
    source: /usr/bin/log-counter
  - type: symlink
    path: /config
    uid: 0
    gid: 0
    source: /usr/share/node-problem-detector/config
annotations:
  org.opencontainers.image.description: A minimal Node Problem Detector image
  org.opencontainers.image.licenses: Apache-2.0
entrypoint:
  - /node-problem-detector
  - --config.system-log-monitor=/config/kernel-monitor.json,/config/readonly-monitor.json
