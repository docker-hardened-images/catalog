# syntax=dhi.io/build:2-debian13

name: AuthService 1.x
image: dhi.io/authservice
variant: runtime
tags:
  - "1"
  - "1.1"
  - 1.1.8
  - 1-debian
  - 1-debian13
  - 1.1-debian
  - 1.1-debian13
  - 1.1.8-debian
  - 1.1.8-debian13
platforms:
  - linux/amd64
  - linux/arm64
dates:
  release: "2024-03-26"
vars:
  FLAVORED_SUFFIX: ""
  SEMVER_MAJOR_MINOR_VERSION: "1.1"
  SEMVER_MAJOR_VERSION: "1"
  SEMVER_VERSION: 1.1.8
  SUFFIX: ""
  VERSION: 1.1.8-2
contents:
  repositories:
    - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
  keyring:
    - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
  packages:
    - authservice=1.1.8-2
    - base-files
    - ca-certificates-bundle
    - tzdata
accounts:
  run-as: nonroot
  users:
    - name: nonroot
      uid: 65532
      gid: 65532
  groups:
    - name: nonroot
      gid: 65532
      members:
        - nonroot
os-release:
  name: Docker Hardened Images (Debian)
  id: debian
  version-id: "13"
  version-codename: trixie
  pretty-name: Docker Hardened Images/Debian GNU/Linux 13 (trixie)
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
paths:
  - type: directory
    path: /usr/local/bin
    uid: 0
    gid: 0
    mode: "0755"
  - type: symlink
    path: /usr/local/bin/authservice
    uid: 0
    gid: 0
    source: /usr/bin/authservice
annotations:
  org.opencontainers.image.description: A minimal AuthService image
  org.opencontainers.image.licenses: Apache-2.0
entrypoint:
  - /usr/local/bin/authservice
