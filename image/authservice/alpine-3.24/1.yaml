# syntax=dhi.io/build:2-alpine3.24

name: AuthService 1.x
image: dhi.io/authservice
variant: runtime
tags:
  - 1-alpine
  - 1.1-alpine
  - 1-alpine3.24
  - 1.1.8-alpine
  - 1.1-alpine3.24
  - 1.1.8-alpine3.24
platforms:
  - linux/amd64
  - linux/arm64
dates:
  release: "2024-03-26"
vars:
  FLAVORED_SUFFIX: ""
  SEMVER_MAJOR_MINOR_VERSION: "1.1"
  SEMVER_MAJOR_VERSION: "1"
  SEMVER_VERSION: 1.1.8
  SUFFIX: ""
  VERSION: 1.1.8-r2
contents:
  repositories:
    - https://dhi.io/apk/alpine/v3.24/main
    - https://dl-cdn.alpinelinux.org/alpine/v3.24/main
    - https://dl-cdn.alpinelinux.org/alpine/v3.24/community
  keyring:
    - https://dhi.io/keyring/dhi-apk@docker-0F81AD7700D99184.rsa.pub
  packages:
    - alpine-baselayout-data
    - authservice=1.1.8-r2
    - ca-certificates-bundle
    - tzdata
accounts:
  run-as: nonroot
  users:
    - name: nonroot
      uid: 65532
      gid: 65532
  groups:
    - name: nonroot
      gid: 65532
      members:
        - nonroot
os-release:
  name: Docker Hardened Images (Alpine)
  id: alpine
  version-id: "3.24"
  pretty-name: Docker Hardened Images/Alpine Linux v3.24
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
paths:
  - type: directory
    path: /usr/local/bin
    uid: 0
    gid: 0
    mode: "0755"
  - type: symlink
    path: /usr/local/bin/authservice
    uid: 0
    gid: 0
    source: /usr/bin/authservice
annotations:
  org.opencontainers.image.description: A minimal AuthService image
  org.opencontainers.image.licenses: Apache-2.0
entrypoint:
  - /usr/local/bin/authservice
