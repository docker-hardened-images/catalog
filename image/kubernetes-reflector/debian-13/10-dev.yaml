# syntax=dhi.io/build:2-debian13

name: Kubernetes Reflector 10.x (dev)
image: dhi.io/kubernetes-reflector
variant: dev
tags:
  - 10-dev
  - 10.0-dev
  - 10.0.70-dev
  - 10-debian-dev
  - 10-debian13-dev
  - 10.0-debian-dev
  - 10.0-debian13-dev
  - 10.0.70-debian-dev
  - 10.0.70-debian13-dev
platforms:
  - linux/amd64
  - linux/arm64
dates:
  release: "2026-01-20"
vars:
  ARCH: '#{ target.arch == "amd64" ? "x64" : "arm64" }'
  ASPNETCORE_VERSION: 10.0.14
  DOTNET_RUNTIME_VERSION: 10.0.14
  SEMVER_MAJOR_MINOR_VERSION: "10.0"
  SEMVER_MAJOR_VERSION: "10"
  SEMVER_VERSION: 10.0.70
  VERSION: 10.0.70-0
contents:
  repositories:
    - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
  keyring:
    - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
  packages:
    - '!gawk'
    - '!libelogind0'
    - '!original-awk'
    - apt
    - base-files
    - bash
    - ca-certificates
    - ca-certificates-bundle
    - coreutils
    - diffutils
    - dpkg
    - findutils
    - grep
    - kubernetes-reflector-10=10.0.70-0
    - libc-bin
    - libc6
    - libgcc-s1
    - libicu76
    - libssl3t64
    - libstdc++6
    - mawk
    - perl-base
    - sed
    - tzdata
    - util-linux
    - zlib1g
  files:
    - url: https://builds.dotnet.microsoft.com/dotnet/aspnetcore/Runtime/10.0.14/aspnetcore-runtime-10.0.14-linux-${ARCH}.tar.gz
      path: /opt/dotnet
      spdx:
        name: aspnetcore-runtime
        version: 10.0.14
        packages:
          - name: aspnetcore-runtime
            purl: pkg:dhi/microsoft/aspnetcore-runtime@10.0.14
            license: MIT
          - name: dotnet-runtime
            purl: pkg:dhi/microsoft/dotnet-runtime@10.0.14
            license: MIT
          - name: microsoft.aspnetcore.app.runtime.linux-${ARCH}
            purl: pkg:nuget/microsoft.aspnetcore.app.runtime.linux-${ARCH}@10.0.14
            license: MIT
          - name: microsoft.netcore.app.runtime.linux-${ARCH}
            purl: pkg:nuget/microsoft.netcore.app.runtime.linux-${ARCH}@10.0.14
            license: MIT
      uid: 0
      gid: 0
  builds:
    - name: locale
      contents:
        packages:
          - bash
          - locales
          - coreutils
          - gzip
      pipeline:
        - name: install locales
          runs: |
            set -eux -o pipefail

            ln -s /etc/locale.alias /usr/share/locale/locale.alias

            echo "en_US.UTF-8 UTF-8" >> /etc/locale.gen
            locale-gen en_US.UTF-8
      outputs:
        - source: /usr/share/locale
          target: /usr/share/locale
          uid: 0
          gid: 0
        - source: /usr/lib/locale
          target: /usr/lib/locale
          uid: 0
          gid: 0
accounts:
  root: true
  run-as: root
  users:
    - name: nonroot
      uid: 65532
      gid: 65532
    - name: _apt
      uid: 42
      gid: 65532
  groups:
    - name: nonroot
      gid: 65532
      members:
        - nonroot
os-release:
  name: Docker Hardened Images (Debian)
  id: debian
  version-id: "13"
  version-codename: trixie
  pretty-name: Docker Hardened Images/Debian GNU/Linux 13 (trixie)
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
work-dir: /app
environment:
  ASPNET_VERSION: 10.0.14
  ASPNETCORE_HTTP_PORTS: "8080"
  DEBIAN_FRONTEND: noninteractive
  DOTNET_ROOT: /opt/dotnet
  DOTNET_RUNNING_IN_CONTAINER: "true"
  DOTNET_VERSION: 10.0.14
  LANG: en_US.UTF-8
  LANGUAGE: en_US:en
  LC_ALL: en_US.UTF-8
  PATH: /opt/dotnet:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
paths:
  - type: symlink
    path: /app
    uid: 0
    gid: 0
    source: /usr/lib/kubernetes-reflector
annotations:
  org.opencontainers.image.description: A minimal Kubernetes Reflector image
  org.opencontainers.image.licenses: MIT
entrypoint:
  - dotnet
  - ES.Kubernetes.Reflector.dll
ports:
  - 8080/tcp
