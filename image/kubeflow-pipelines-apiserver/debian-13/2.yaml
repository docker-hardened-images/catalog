# syntax=dhi.io/build:2-debian13

name: Kubeflow Pipelines API Server 2.x
image: dhi.io/kubeflow-pipelines-apiserver
variant: runtime
tags:
  - "2"
  - "2.17"
  - 2.17.1
  - 2-debian
  - 2-debian13
  - 2.17-debian
  - 2.17-debian13
  - 2.17.1-debian
  - 2.17.1-debian13
platforms:
  - linux/amd64
  - linux/arm64
vars:
  SEMVER_MAJOR_MINOR_VERSION: "2.17"
  SEMVER_MAJOR_VERSION: "2"
  SEMVER_VERSION: 2.17.1
  VERSION: 2.17.1-2
contents:
  repositories:
    - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
  keyring:
    - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
  packages:
    - base-files
    - ca-certificates-bundle
    - kubeflow-pipelines-apiserver=2.17.1-2
    - libc6
    - tzdata
accounts:
  run-as: nonroot
  users:
    - name: nonroot
      uid: 65532
      gid: 65532
  groups:
    - name: nonroot
      gid: 65532
      members:
        - nonroot
os-release:
  name: Docker Hardened Images (Debian)
  id: debian
  version-id: "13"
  version-codename: trixie
  pretty-name: Docker Hardened Images/Debian GNU/Linux 13 (trixie)
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
environment:
  TAG_NAME: 2.17.1
paths:
  - type: directory
    path: /usr/local/bin
    uid: 0
    gid: 0
  - type: symlink
    path: /usr/local/bin/apiserver
    uid: 0
    gid: 0
    source: /usr/bin/apiserver
  - type: symlink
    path: /config
    uid: 0
    gid: 0
    source: /usr/share/kubeflow-pipelines-apiserver/config
  - type: symlink
    path: /samples
    uid: 0
    gid: 0
    source: /usr/share/kubeflow-pipelines-apiserver/samples
annotations:
  org.opencontainers.image.description: API server for Kubeflow Pipelines, providing workflow management and orchestration.
  org.opencontainers.image.licenses: Apache-2.0
entrypoint:
  - /usr/local/bin/apiserver
cmd:
  - --config=/config
  - -logtostderr=true
  - --logLevel=info
  - --sampleconfig=/config/sample_config.json
ports:
  - 8888/tcp
