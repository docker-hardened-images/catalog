# syntax=dhi.io/build:2-debian13

name: KAI Scheduler Podgrouper 0.14.x (dev)
image: dhi.io/kai-scheduler-podgrouper
variant: dev
tags:
  - 0.14-dev
  - 0.14.14-dev
  - 0.14-debian-dev
  - 0.14-debian13-dev
  - 0.14.14-debian-dev
  - 0.14.14-debian13-dev
platforms:
  - linux/amd64
  - linux/arm64
dates:
  release: "2026-03-30"
  end-of-life: "2027-03-30"
vars:
  BASE_FILES_VERSION: 13.8+deb13u8+dhi0
  FLAVORED_SUFFIX: -dev
  OPENSSL_VERSION: 3.5.9-1~deb13u1+dhi1
  SEMVER_MAJOR_MINOR_VERSION: "0.14"
  SEMVER_MAJOR_VERSION: "0"
  SEMVER_VERSION: 0.14.14
  SHIP_COPYRIGHT: "false"
  SUFFIX: -dev
  VERSION: 0.14.14-0
contents:
  repositories:
    - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
  keyring:
    - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
  packages:
    - '!gawk'
    - '!libelogind0'
    - '!original-awk'
    - apt
    - base-files=13.8+deb13u8+dhi0
    - bash
    - ca-certificates
    - ca-certificates-bundle
    - coreutils
    - diffutils
    - dpkg
    - findutils
    - grep
    - kai-scheduler-podgrouper-0.14-dev=0.14.14-0
    - libc-bin
    - libssl3t64=3.5.9-1~deb13u1+dhi1
    - mawk
    - openssl-provider-legacy=3.5.9-1~deb13u1+dhi1
    - openssl=3.5.9-1~deb13u1+dhi1
    - perl-base
    - sed
    - tzdata
    - util-linux
accounts:
  root: true
  run-as: root
  users:
    - name: nonroot
      uid: 65532
      gid: 65532
    - name: _apt
      uid: 42
      gid: 65532
  groups:
    - name: nonroot
      gid: 65532
      members:
        - nonroot
os-release:
  name: Docker Hardened Images (Debian)
  id: debian
  version-id: "13"
  version-codename: trixie
  pretty-name: Docker Hardened Images/Debian GNU/Linux 13 (trixie)
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
work-dir: /workspace
environment:
  DEBIAN_FRONTEND: noninteractive
paths:
  - type: directory
    path: /workspace
    uid: 0
    gid: 0
    mode: "0755"
  - type: symlink
    path: /workspace/app
    uid: 0
    gid: 0
    source: /usr/bin/kai-scheduler-podgrouper
  - type: symlink
    path: /workspace/NOTICE
    uid: 0
    gid: 0
    source: /usr/share/licenses/kai-scheduler-podgrouper/NOTICE
annotations:
  org.opencontainers.image.description: A minimal KAI Scheduler Podgrouper image
  org.opencontainers.image.licenses: Apache-2.0
entrypoint:
  - /workspace/app
ports:
  - 8080/tcp
  - 8081/tcp
