// Avoid Docker Build Cloud Maven Central rate limits while preserving the
// non-Central repositories DataHub v1.6+ needs (LinkedIn Pegasus, Confluent).

def GOOGLE_MAVEN_MIRROR = 'https://maven-central.storage-download.googleapis.com/maven2/'
def PLUGIN_PORTAL = 'https://plugins.gradle.org/m2/'
def CONFLUENT_MAVEN = 'https://packages.confluent.io/maven'
def LINKEDIN_OPENSOURCE = 'https://linkedin.jfrog.io/artifactory/open-source'

def configureDhiRepositories = { RepositoryHandler repos ->
    repos.maven {
        name 'GoogleMavenCentralMirror'
        url GOOGLE_MAVEN_MIRROR
    }
    repos.maven {
        name 'ConfluentMaven'
        url CONFLUENT_MAVEN
    }
    repos.maven {
        name 'LinkedInOpenSource'
        url LINKEDIN_OPENSOURCE
    }
    repos.maven {
        name 'GradlePluginPortalNoModule'
        url PLUGIN_PORTAL
        metadataSources {
            mavenPom()
            artifact()
            ignoreGradleMetadataRedirection()
        }
    }
    repos.mavenLocal()
}

allprojects {
    buildscript {
        repositories configureDhiRepositories
    }
    repositories configureDhiRepositories
}

beforeSettings { settings ->
    settings.pluginManagement {
        repositories configureDhiRepositories
    }
}

settingsEvaluated { settings ->
    try {
        settings.dependencyResolutionManagement {
            repositories configureDhiRepositories
        }
    } catch (Throwable ignored) {
        // dependencyResolutionManagement is Gradle 6.8+ only.
    }
}

// Force CVE-remediated dependency versions at resolution time.
// CVE-2026-59949 (lz4-java Out-of-bounds Read) -> force lz4-java to 1.11.1.
// GHSA-R7WM-3CXJ-WFF9 / CVE-2026-54512 / CVE-2026-54513 -> tools.jackson 3.1.4+.
allprojects {
    configurations.all {
        resolutionStrategy {
            force 'tools.jackson.core:jackson-core:3.1.4'
            force 'tools.jackson.core:jackson-databind:3.1.5'
            eachDependency { details ->
                def grp = details.requested.group
                def name = details.requested.name

                if (grp == "at.yawk.lz4" && name == "lz4-java") {
                    details.useVersion("1.11.1")
                    details.because("CVE-2026-59949: Out-of-bounds Read")
                }
                if (grp == 'tools.jackson.core') {
                    if (name == 'jackson-core') {
                        details.useVersion('3.1.4')
                        details.because('DHI CVE remediation: GHSA-R7WM-3CXJ-WFF9, CVE-2026-54512')
                    } else if (name == 'jackson-databind') {
                        details.useVersion('3.1.5')
                        details.because('DHI CVE remediation: CVE-2026-54513, CVE-2026-54514')
                    }
                } else if (grp != null && grp.startsWith('tools.jackson')) {
                    details.useVersion('3.1.5')
                    details.because('DHI CVE remediation: GHSA-R7WM-3CXJ-WFF9')
                }
            }
        }
    }
}
