# syntax=dhi.io/build:2-debian13

name: DataHub MAE Consumer 1.x
image: dhi.io/datahub-mae-consumer
variant: runtime
tags:
  - "1"
  - "1.6"
  - 1.6.0
  - 1.6.0.2
  - 1-debian
  - 1-debian13
  - 1.6-debian
  - 1.6-debian13
  - 1.6.0-debian
  - 1.6.0-debian13
  - 1.6.0.2-debian
  - 1.6.0.2-debian13
platforms:
  - linux/amd64
  - linux/arm64
dates:
  release: "2025-09-25"
vars:
  JAVA_FIPS_SUFFIX: ""
  JAVA_VARIANT: jre
  JDK_MAJOR_VERSION: "21"
  SEMVER_MAJOR_MINOR_VERSION: "1.6"
  SEMVER_MAJOR_VERSION: "1"
  SEMVER_VERSION: 1.6.0.2
  VERSION: 1.6.0.2-0
  VERSION_MAJOR_MINOR_PATCH: 1.6.0
contents:
  repositories:
    - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
  keyring:
    - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
  packages:
    - '!libelogind0'
    - '!mawk'
    - '!original-awk'
    - base-files
    - bash
    - ca-certificates
    - ca-certificates-bundle
    - coreutils
    - curl
    - datahub-mae-consumer=1.6.0.2-0
    - eclipse-temurin-21-jre
    - eclipse-temurin-21-jre-oci-config
    - libsnappy1v5
    - tzdata
    - wget
accounts:
  run-as: nonroot
  users:
    - name: nonroot
      uid: 65532
      gid: 65532
  groups:
    - name: nonroot
      gid: 65532
      members:
        - nonroot
os-release:
  name: Docker Hardened Images (Debian)
  id: debian
  version-id: "13"
  version-codename: trixie
  pretty-name: Docker Hardened Images/Debian GNU/Linux 13 (trixie)
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
environment:
  JAVA_OPTS: ""
  JMX_OPTS: ""
  LD_LIBRARY_PATH: /lib:/lib64
  OTEL_EXPORTER_OTLP_HTTP_COMPRESSION: gzip
  OTEL_EXPORTER_OTLP_HTTP_HTTP2_MAX_FRAME_SIZE: "8388608"
  OTEL_EXPORTER_OTLP_MAX_PAYLOAD_SIZE: "4194304"
  OTEL_EXPORTER_OTLP_TRACES_COMPRESSION: gzip
paths:
  - type: directory
    path: /datahub
    uid: 65532
    gid: 65532
    mode: "0750"
  - type: symlink
    path: /datahub/datahub-mae-consumer
    uid: 0
    gid: 0
    source: /usr/share/datahub-mae-consumer
  - type: directory
    path: /usr/local/bin
    uid: 0
    gid: 0
  - type: symlink
    path: /usr/local/bin/dockerize
    uid: 0
    gid: 0
    source: /usr/bin/dockerize
annotations:
  org.opencontainers.image.description: DataHub Metadata Audit Event (MAE) Consumer - the Kafka consumer that ingests MetadataChangeLog events and Platform Events into DataHub's search and graph indices.
  org.opencontainers.image.licenses: Apache-2.0
entrypoint:
  - /datahub/datahub-mae-consumer/scripts/start.sh
ports:
  - 9091/tcp
