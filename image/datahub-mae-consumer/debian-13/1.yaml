contents:
  repositories:
    - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
  keyring:
    - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
  packages:
    - '!libelogind0'
    - '!mawk'
    - '!original-awk'
    - base-files
    - bash
    - ca-certificates
    - ca-certificates-bundle
    - coreutils
    - curl
    - eclipse-temurin-21-jre
    - eclipse-temurin-21-jre-oci-config
    - libsnappy1v5
    - tzdata
    - wget
  builds:
    - name: dockerize
      work-dir: /go/src/github.com/powerman/dockerize
      caches:
        - path: /go/pkg/mod
      contents:
        packages:
          - bash
          - ca-certificates-bundle
          - coreutils
          - golang-1.26
          - findutils
          - mawk
          - sed
        files:
          - url: git+https://github.com/powerman/dockerize.git#v0.24.3
            checksum: a21f69ff60cdf1b2d54dadb7d04f28c8b6723c19
            path: /go/src/github.com/powerman/dockerize
            spdx:
              name: dockerize
              version: 0.24.3
              packages:
                - name: dockerize
                  purl: pkg:golang/github.com/powerman/dockerize@0.24.3
                  license: MIT
            uid: 0
            gid: 0
      pipeline:
        - name: update go dependencies
          uses: go/bump@v2
          with:
            deps:
              - golang.org/x/crypto@v0.52.0
            download: true
        - name: test dockerize
          runs: |
            set -eux -o pipefail

            go test ./...
        - name: build dockerize
          uses: go/build@v1
          with:
            output: ${target.dir}/usr/local/bin/dockerize
            packages: ./
      outputs:
        - source: ${target.dir}/usr/local/bin/dockerize
          target: /usr/local/bin/dockerize
          uid: 0
          gid: 0
          mode: "0755"
        - source: /opt/docker/sbom/dockerize
          target: /opt/docker/sbom/dockerize
          uid: 0
          gid: 0
    - name: datahub-mae-consumer
      work-dir: ${source.dir}/datahub
      caches:
        - path: /root/.gradle
      contents:
        packages:
          - bash
          - ca-certificates
          - coreutils
          - curl
          - findutils
          - git
          - grep
          - gzip
          - sed
          - tar
          - unzip
          - zip
          - gradle-8
          - eclipse-temurin-21-jdk
        files:
          - url: git+https://github.com/datahub-project/datahub.git#v1.6.0.1
            checksum: 036f89a860a92e8a756eccfc2d46047b52f05877
            path: ${source.dir}/datahub
            spdx:
              name: datahub
              version: 1.6.0.1
              packages:
                - name: datahub
                  purl: pkg:dhi/datahub-mae-consumer@1.6.0.1
                  license: Apache-2.0
            uid: 0
            gid: 0
          - url: https://repo1.maven.org/maven2/com/fasterxml/jackson/core/jackson-core/2.21.5/jackson-core-2.21.5.jar
            checksum: sha256:b64b5874162b503a0e58a8f7758266e8dd9f91bf49e3a59ae0b5f47589a231b7
            path: ${source.dir}/patch/deps/jackson-core-2.21.5.jar
            spdx:
              name: jackson-core
              version: 2.21.5
              packages:
                - name: jackson-core
                  purl: pkg:maven/com.fasterxml.jackson.core/jackson-core@2.21.5
                  license: Apache-2.0
            uid: 0
            gid: 0
          - url: https://repo1.maven.org/maven2/com/fasterxml/jackson/core/jackson-databind/2.21.5/jackson-databind-2.21.5.jar
            checksum: sha256:507418c0fafd38b2b2cfb704521630da613a8e4cc8381195a6f418017883e2c0
            path: ${source.dir}/patch/deps/jackson-databind-2.21.5.jar
            spdx:
              name: jackson-databind
              version: 2.21.5
              packages:
                - name: jackson-databind
                  purl: pkg:maven/com.fasterxml.jackson.core/jackson-databind@2.21.5
                  license: Apache-2.0
            uid: 0
            gid: 0
          - url: https://repo1.maven.org/maven2/tools/jackson/core/jackson-core/3.1.4/jackson-core-3.1.4.jar
            checksum: sha256:3bda1cd6eff0a8d47bdfcaeae7c2bd5311d6c8ed494ef5f3e51029bb44aa9bdf
            path: ${source.dir}/patch/deps/tools-jackson-core-3.1.4.jar
            spdx:
              name: jackson-core
              version: 3.1.4
              packages:
                - name: jackson-core
                  purl: pkg:maven/tools.jackson.core/jackson-core@3.1.4
                  license: Apache-2.0
            uid: 0
            gid: 0
          - url: https://repo1.maven.org/maven2/tools/jackson/core/jackson-databind/3.1.5/jackson-databind-3.1.5.jar
            checksum: sha256:3a2338d996fd3056791df8d335fa9ba8a62a706ed4245ecf81b3e583df37d08a
            path: ${source.dir}/patch/deps/tools-jackson-databind-3.1.5.jar
            spdx:
              name: jackson-databind
              version: 3.1.5
              packages:
                - name: jackson-databind
                  purl: pkg:maven/tools.jackson.core/jackson-databind@3.1.5
                  license: Apache-2.0
            uid: 0
            gid: 0
      pipeline:
        - name: patch maven central for build cloud rate limits
          runs: |
            set -eux -o pipefail

            MIRROR='maven { url "https://maven-central.storage-download.googleapis.com/maven2/" }'
            PORTAL=$'maven {\\n    url "https://plugins.gradle.org/m2/"\\n    metadataSources { mavenPom(); artifact(); ignoreGradleMetadataRedirection() }\\n}'
            find . \( -name "*.gradle" -o -name "*.gradle.kts" \) -print0 \
              | xargs -0 sed -i \
                -e "s|mavenCentral()|${MIRROR}|g" \
                -e "s|gradlePluginPortal()|${PORTAL}|g"
        - name: rewrite upstream lz4-java 1.10.1 pins to 1.11.1
          runs: |
            set -eux -o pipefail

            find . \( -name '*.gradle' -o -name '*.gradle.kts' -o -name 'gradle.lockfile' \) -print0 \
              | xargs -0 sed -i \
                -e 's|at\.yawk\.lz4:lz4-java:1\.10\.1|at.yawk.lz4:lz4-java:1.11.1|g'
        - name: bump vulnerable dependency versions
          runs: |
            set -eux -o pipefail

            cat >> build.gradle << 'GRADLE'

            // ===== DHI CVE remediation: force minimum versions =====
            allprojects {
                afterEvaluate {
                    rootProject.ext['nettyVersion'] = '4.2.17.Final'
                }
                configurations.configureEach {
                    resolutionStrategy {
                        force 'at.yawk.lz4:lz4-java:1.11.1'
                        force 'tools.jackson.core:jackson-core:3.1.4'
                        force 'tools.jackson.core:jackson-databind:3.1.5'
                        eachDependency { details ->
                            def req = details.requested
                            if (req.group != null && req.group.startsWith('com.fasterxml.jackson')
                                    && req.name != 'jackson-annotations') {
                                details.useVersion '2.21.5'
                                details.because 'DHI CVE remediation: GHSA-72hv-8253-57qq, GHSA-R7WM-3CXJ-WFF9, CVE-2026-54512, CVE-2026-54513, CVE-2026-54514, CVE-2026-54516, CVE-2026-54517, CVE-2026-54518'
                            }
                            if (req.group == 'tools.jackson.core') {
                                if (req.name == 'jackson-core') {
                                    details.useVersion '3.1.4'
                                    details.because 'DHI CVE remediation: GHSA-R7WM-3CXJ-WFF9, CVE-2026-54512'
                                } else if (req.name == 'jackson-databind') {
                                    details.useVersion '3.1.5'
                                    details.because 'DHI CVE remediation: CVE-2026-54513, CVE-2026-54514, CVE-2026-54515, CVE-2026-54516, CVE-2026-54517, CVE-2026-54518'
                                }
                            } else if (req.group != null && req.group.startsWith('tools.jackson')) {
                                details.useVersion '3.1.5'
                                details.because 'DHI CVE remediation: GHSA-R7WM-3CXJ-WFF9, CVE-2026-54512, CVE-2026-54513'
                            }
                            if (req.group == 'org.apache.commons' && req.name == 'commons-configuration2'
                                    && req.version == '2.10.1') {
                                details.useVersion '2.15.0'
                                details.because 'DHI CVE remediation: CVE-2026-45205'
                            }
                            if (req.group == 'io.opentelemetry' && req.name == 'opentelemetry-extension-trace-propagators'
                                    && req.version == '1.49.0') {
                                details.useVersion '1.62.0'
                                details.because 'DHI CVE remediation: CVE-2026-45292'
                            }
                            if (req.group == 'io.netty' && !req.name.startsWith('netty-tcnative')
                                    && req.name.startsWith('netty-')) {
                                details.useVersion '4.2.17.Final'
                                details.because 'DHI CVE remediation: CVE-2026-59902, CVE-2026-59903, CVE-2026-44891'
                            }
                            if (req.group == 'org.apache.httpcomponents.client5'
                                    && req.name == 'httpclient5') {
                                details.useVersion '5.6.3'
                                details.because 'DHI CVE remediation: CVE-2026-64607'
                            }
                            if (req.group == 'org.springframework.kafka' && req.name == 'spring-kafka'
                                    && req.version == '4.0.5') {
                                details.useVersion '4.0.6'
                                details.because 'DHI CVE remediation: CVE-2026-41731, CVE-2026-41726'
                            }
                            if (req.group == 'org.springframework.boot'
                                    && req.name.startsWith('spring-boot-')) {
                                details.useVersion '4.0.7'
                                details.because 'DHI CVE remediation: CVE-2026-41001'
                            }
                            if (req.group == 'org.jline' && req.name == 'jline') {
                                details.useVersion '4.2.1'
                                details.because 'DHI CVE remediation: GHSA-47qp-hqvx-6r3f, GHSA-2r2c-cx56-8933'
                            }
                            if (req.group == 'org.postgresql' && req.name == 'postgresql'
                                    && req.version == '42.7.11') {
                                details.useVersion '42.7.12'
                                details.because 'DHI CVE remediation: CVE-2026-54291'
                            }
                            if (req.group == 'ch.qos.logback' && req.name.startsWith('logback-')) {
                                details.useVersion '1.5.35'
                                details.because 'DHI CVE remediation: CVE-2026-9828, CVE-2026-10532'
                            }
                            if (req.group == 'org.springframework' && req.version == '7.0.7') {
                                details.useVersion '7.0.8'
                                details.because 'DHI CVE remediation: CVE-2026-41841, CVE-2026-41842, CVE-2026-41843, CVE-2026-41844, CVE-2026-41845, CVE-2026-41846, CVE-2026-41853'
                            }
                            if ((req.group == 'org.lz4' || req.group == 'at.yawk.lz4')
                                    && req.name == 'lz4-java') {
                                details.useTarget 'at.yawk.lz4:lz4-java:1.11.1'
                                details.because 'DHI CVE remediation: CVE-2026-59949'
                            }
                        }
                    }
                }
            }
            GRADLE
        - name: build jar
          privileged: true
          runs: |
            set -eux -o pipefail

            export GRADLE_HOME="/usr/share/java/gradle"
            export JAVA_HOME="/usr/lib/jvm/temurin-21"
            export PATH="${GRADLE_HOME}/bin:${JAVA_HOME}/bin:${PATH}"

            find . -name 'gradle.lockfile' -delete || true

            ./gradlew --init-script ${source.dir}/files/init.gradle \
              :metadata-jobs:mae-consumer-job:assemble \
              -x test \
              --parallel --max-workers=4 \
              --update-locks 'com.fasterxml.jackson.core:*,com.fasterxml.jackson.dataformat:*,com.fasterxml.jackson.datatype:*,com.fasterxml.jackson.module:*,tools.jackson.core:*,tools.jackson.dataformat:*,tools.jackson.datatype:*,tools.jackson.module:*,org.apache.commons:*,org.apache.httpcomponents.client5:*,io.opentelemetry:*,io.netty:*,org.postgresql:*,org.springframework.boot:*,org.springframework.kafka:*,org.springframework:*,org.jline:*,ch.qos.logback:*,at.yawk.lz4:*' \
              --no-daemon --console=plain
        - name: patch jackson in mae-consumer-job
          privileged: true
          runs: |
            set -eux -o pipefail

            JAR=$(readlink -f metadata-jobs/mae-consumer-job/build/libs/mae-consumer-job.jar)
            test -f "$JAR"

            CORE_VER=3.1.4
            DATABIND_VER=3.1.5
            PATCH_DIR="${source.dir}/patch/deps"

            work=$(mktemp -d)
            trap 'rm -rf "$work"' EXIT

            export JAVA_HOME="/usr/lib/jvm/temurin-21"
            export PATH="${JAVA_HOME}/bin:${PATH}"

            mapfile -t old_entries < <(unzip -Z1 "$JAR" | grep -E '^BOOT-INF/lib/jackson-(core|databind)-3\..+\.jar$' || true)
            if [ "${#old_entries[@]}" -gt 0 ]; then
              zip -d "$JAR" "${old_entries[@]}"
            fi

            mkdir -p "$work/update/BOOT-INF/lib"
            cp "${PATCH_DIR}/tools-jackson-core-${CORE_VER}.jar" \
              "$work/update/BOOT-INF/lib/jackson-core-${CORE_VER}.jar"
            cp "${PATCH_DIR}/tools-jackson-databind-${DATABIND_VER}.jar" \
              "$work/update/BOOT-INF/lib/jackson-databind-${DATABIND_VER}.jar"
            (cd "$work/update" && zip -0 -r "$JAR" \
              "BOOT-INF/lib/jackson-core-${CORE_VER}.jar" \
              "BOOT-INF/lib/jackson-databind-${DATABIND_VER}.jar")

            unzip -Z1 "$JAR" | grep -Fqx "BOOT-INF/lib/jackson-core-${CORE_VER}.jar"
            unzip -Z1 "$JAR" | grep -Fqx "BOOT-INF/lib/jackson-databind-${DATABIND_VER}.jar"
            if unzip -Z1 "$JAR" | grep -E '^BOOT-INF/lib/jackson-(core|databind)-3\.1\.2\.jar$'; then
              echo "ERROR: tools.jackson 3.1.2 still in mae-consumer-job.jar BOOT-INF/lib" >&2
              exit 1
            fi

            bash "${source.dir}/patch/patch-hazelcast-jackson.sh" \
              "$JAR" \
              "$PATCH_DIR"
        - name: stage runtime files
          runs: |
            set -eux -o pipefail

            mkdir -p "${target.dir}/datahub/datahub-mae-consumer/bin"
            mkdir -p "${target.dir}/datahub/datahub-mae-consumer/scripts"
            mkdir -p "${target.dir}/datahub/datahub-mae-consumer/resources"
            mkdir -p "${target.dir}/datahub/datahub-mae-consumer/lib"

            cp metadata-jobs/mae-consumer-job/build/libs/mae-consumer-job.jar \
              "${target.dir}/datahub/datahub-mae-consumer/bin/mae-consumer-job.jar"
            cp metadata-models/src/main/resources/entity-registry.yml \
              "${target.dir}/datahub/datahub-mae-consumer/resources/entity-registry.yml"
            cp docker/monitoring/client-prometheus-config.yaml \
              "${target.dir}/datahub/datahub-mae-consumer/scripts/prometheus-config.yaml"

            cp "${source.dir}/files/start.sh" \
              "${target.dir}/datahub/datahub-mae-consumer/scripts/start.sh"
            chmod 0755 "${target.dir}/datahub/datahub-mae-consumer/scripts/start.sh"
        - name: fetch otel javaagent
          privileged: true
          runs: |
            set -eux -o pipefail

            curl -fsSL -o /tmp/opentelemetry-javaagent.jar \
              "https://github.com/open-telemetry/opentelemetry-java-instrumentation/releases/download/v2.28.0/opentelemetry-javaagent.jar"
            echo "130606aed07f101458fe42b8f453ef3a2536f6bce8a7ae64f222f5688ada2500  /tmp/opentelemetry-javaagent.jar" | sha256sum -c -
            mv /tmp/opentelemetry-javaagent.jar \
              "${target.dir}/datahub/datahub-mae-consumer/lib/opentelemetry-javaagent.jar"
        - name: fetch jmx prometheus javaagent
          privileged: true
          runs: |
            set -eux -o pipefail

            curl -fsSL -o /tmp/jmx_prometheus_javaagent.jar \
              "https://maven-central.storage-download.googleapis.com/maven2/io/prometheus/jmx/jmx_prometheus_javaagent/0.20.0/jmx_prometheus_javaagent-0.20.0.jar"
            echo "8b67ed40485d475648c36d11d21464b484406f85faf912b3363f71a6a7861320  /tmp/jmx_prometheus_javaagent.jar" | sha256sum -c -
            mv /tmp/jmx_prometheus_javaagent.jar \
              "${target.dir}/datahub/datahub-mae-consumer/lib/jmx_prometheus_javaagent.jar"
      paths:
        - type: file
          path: ${source.dir}/files/start.sh
          uid: 0
          gid: 0
          source: image/datahub-mae-consumer/files/start.sh
        - type: file
          path: ${source.dir}/files/init.gradle
          uid: 0
          gid: 0
          source: image/datahub-mae-consumer/files/init.gradle
        - type: file
          path: ${source.dir}/patch/patch-hazelcast-jackson.sh
          uid: 0
          gid: 0
          mode: "0755"
          source: image/datahub-mae-consumer/patch/patch-hazelcast-jackson.sh
      outputs:
        - source: ${target.dir}/datahub/datahub-mae-consumer
          target: /datahub/datahub-mae-consumer
          uid: 0
          gid: 0
        - source: /opt/docker/sbom/datahub
          target: /opt/docker/sbom/datahub
          uid: 0
          gid: 0
accounts:
  run-as: nonroot
  users:
    - name: nonroot
      uid: 65532
      gid: 65532
  groups:
    - name: nonroot
      gid: 65532
      members:
        - nonroot
os-release:
  name: Docker Hardened Images (Debian)
  id: debian
  version-id: "13"
  version-codename: trixie
  pretty-name: Docker Hardened Images/Debian GNU/Linux 13 (trixie)
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
environment:
  JAVA_OPTS: ""
  JMX_OPTS: ""
  LD_LIBRARY_PATH: /lib:/lib64
  OTEL_EXPORTER_OTLP_HTTP_COMPRESSION: gzip
  OTEL_EXPORTER_OTLP_HTTP_HTTP2_MAX_FRAME_SIZE: "8388608"
  OTEL_EXPORTER_OTLP_MAX_PAYLOAD_SIZE: "4194304"
  OTEL_EXPORTER_OTLP_TRACES_COMPRESSION: gzip
paths:
  - type: directory
    path: /datahub
    uid: 65532
    gid: 65532
    mode: "0750"
  - type: directory
    path: /datahub/datahub-mae-consumer
    uid: 65532
    gid: 65532
    mode: "0750"
annotations:
  org.opencontainers.image.description: DataHub Metadata Audit Event (MAE) Consumer - the Kafka consumer that ingests MetadataChangeLog events and Platform Events into DataHub's search and graph indices.
  org.opencontainers.image.licenses: Apache-2.0
entrypoint:
  - /datahub/datahub-mae-consumer/scripts/start.sh
ports:
