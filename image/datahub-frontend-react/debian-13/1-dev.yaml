# syntax=dhi.io/build:2-debian13

name: DataHub Frontend 1.x (dev)
image: dhi.io/datahub-frontend-react
variant: dev
tags:
  - 1-dev
  - 1.5-dev
  - 1.5.0-dev
  - 1.5.0.7-dev
  - 1-debian-dev
  - 1-debian13-dev
  - 1.5-debian-dev
  - 1.5-debian13-dev
  - 1.5.0-debian-dev
  - 1.5.0-debian13-dev
  - 1.5.0.7-debian-dev
  - 1.5.0.7-debian13-dev
platforms:
  - linux/amd64
  - linux/arm64
dates:
  release: "2025-08-22"
vars:
  COMMIT_SHA: 9fa880ef1890ce1052cc06d5fb3b7f9e114f528c
  JAVA_FIPS_SUFFIX: ""
  JAVA_VARIANT: jdk
  JDK_MAJOR_VERSION: "17"
  JMX_PROMETHEUS_SHA256: 8b67ed40485d475648c36d11d21464b484406f85faf912b3363f71a6a7861320
  JMX_PROMETHEUS_VERSION: 0.20.0
  OTEL_JAVAAGENT_SHA256: 130606aed07f101458fe42b8f453ef3a2536f6bce8a7ae64f222f5688ada2500
  OTEL_JAVAAGENT_VERSION: 2.28.0
  SEMVER_MAJOR_MINOR_VERSION: "1.5"
  SEMVER_MAJOR_VERSION: "1"
  SEMVER_VERSION: 1.5.0.7
  VERSION: 1.5.0.7
  VERSION_MAJOR_MINOR_PATCH: 1.5.0
contents:
  repositories:
    - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
  keyring:
    - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
  packages:
    - '!gawk'
    - '!libelogind0'
    - '!mawk'
    - '!original-awk'
    - apt
    - base-files
    - bash
    - ca-certificates
    - coreutils
    - diffutils
    - dpkg
    - eclipse-temurin-17-jdk
    - eclipse-temurin-17-jdk-oci-config
    - findutils
    - grep
    - libc-bin
    - libstdc++6
    - mawk
    - perl-base
    - sed
    - sqlite3
    - util-linux
  builds:
    - name: datahub-frontend-react
      work-dir: ${source.dir}/datahub
      environment:
        CI: "false"
        NODE_OPTIONS: --max-old-space-size=5120 --openssl-legacy-provider
      caches:
        - path: /root/.gradle/caches
        - path: /root/.gradle/wrapper
        - path: ${source.dir}/datahub/datahub-web-react/node_modules
      contents:
        packages:
          - bash
          - coreutils
          - ca-certificates
          - curl
          - findutils
          - git
          - grep
          - gnu-which
          - libstdc++6
          - python3
          - sed
          - tar
          - base-files
          - libc6
          - mawk
          - nodejs-24
          - node-corepack
          - npm
          - yarn-classic
          - eclipse-temurin-17-jdk
          - gradle-8
        files:
          - url: git+https://github.com/datahub-project/datahub.git#v1.5.0.7
            checksum: 9fa880ef1890ce1052cc06d5fb3b7f9e114f528c
            path: ${source.dir}/datahub
            spdx:
              name: datahub-frontend-react
              version: 1.5.0.7
              packages:
                - name: datahub-frontend-react
                  purl: pkg:github/datahub-project/datahub@1.5.0.7
                  license: Apache-2.0
            uid: 0
            gid: 0
      pipeline:
        - name: fetch java agents
          privileged: true
          runs: |
            set -eux -o pipefail

            # The DHI built-in `contents.files` fetcher routes through the
            # cloud builder which intermittently hits Maven Central's per-IP
            # 429 throttling and returns a different artifact than the one
            # that lives at the canonical URL, producing a digest mismatch
            # that we cannot work around with checksums alone. Download the
            # agents here from a fallback chain (Maven Central origin →
            # Google's verbatim mirror → Apache mirror → repo1) and verify
            # SHA-256 manually. See definitions-external PR #232 for the
            # same workaround applied to datahub-upgrade.
            install -d -m 0755 "${target.dir}/opt/javaagents"

            fetch() {
              local out="$1"
              shift
              for url in "$@"; do
                echo "fetch: $url" >&2
                if curl --fail --silent --show-error --location \
                  --retry 4 --retry-delay 5 --retry-all-errors \
                  --connect-timeout 30 --max-time 600 \
                  --output "$out" "$url"; then
                  return 0
                fi
              done
              echo "all mirrors failed for $out" >&2
              return 1
            }

            jmx_path="io/prometheus/jmx/jmx_prometheus_javaagent/0.20.0/jmx_prometheus_javaagent-0.20.0.jar"
            fetch "${target.dir}/opt/javaagents/jmx_prometheus_javaagent.jar" \
              "https://repo.maven.apache.org/maven2/${jmx_path}" \
              "https://maven-central.storage-download.googleapis.com/maven2/${jmx_path}" \
              "https://repo1.maven.org/maven2/${jmx_path}"

            fetch "${target.dir}/opt/javaagents/opentelemetry-javaagent.jar" \
              "https://github.com/open-telemetry/opentelemetry-java-instrumentation/releases/download/v2.28.0/opentelemetry-javaagent.jar"

            echo "8b67ed40485d475648c36d11d21464b484406f85faf912b3363f71a6a7861320  ${target.dir}/opt/javaagents/jmx_prometheus_javaagent.jar" \
              | sha256sum -c -
            echo "130606aed07f101458fe42b8f453ef3a2536f6bce8a7ae64f222f5688ada2500  ${target.dir}/opt/javaagents/opentelemetry-javaagent.jar" \
              | sha256sum -c -

            chmod 0444 "${target.dir}/opt/javaagents/"*.jar
        - name: jmx_prometheus_javaagent sbom
          uses: spdx@v1
          with:
            license: Apache-2.0
            name: jmx_prometheus_javaagent
            purl: pkg:maven/io.prometheus.jmx/jmx_prometheus_javaagent@0.20.0
            version: 0.20.0
        - name: opentelemetry-javaagent sbom
          uses: spdx@v1
          with:
            license: Apache-2.0
            name: opentelemetry-javaagent
            purl: pkg:maven/io.opentelemetry.javaagent/opentelemetry-javaagent@2.28.0
            version: 2.28.0
        - name: install gradle init scripts
          secrets:
            - id: maven_user
              env: MAVEN_USER
              optional: true
            - id: maven_password
              env: MAVEN_PASSWORD
              optional: true
          runs: |
            set -eux -o pipefail

            mkdir -p /root/.gradle/init.d
            cat > /root/.gradle/init.d/maven-mirror.gradle << 'EOF'
            def cloudsmithUrl = 'https://dl.cloudsmith.io/basic/docker/dhi-maven-central/maven/'
            def gcsMirror     = 'https://maven-central.storage-download.googleapis.com/maven2/'
            def pluginPortal  = 'https://plugins.gradle.org/m2/'

            def cloudsmithUser = System.getenv('MAVEN_USER')
            def cloudsmithPass = System.getenv('MAVEN_PASSWORD')
            def hasCloudsmith  = cloudsmithUser != null && !cloudsmithUser.isEmpty() &&
                                 cloudsmithPass != null && !cloudsmithPass.isEmpty()
            println "dhi-init: cloudsmith=${hasCloudsmith} gcs-mirror=${gcsMirror}"

            def configureRepos = { container ->
              container.clear()
              if (hasCloudsmith) {
                container.maven {
                  url cloudsmithUrl
                  credentials {
                    username = cloudsmithUser
                    password = cloudsmithPass
                  }
                  name 'cloudsmith-central'
                }
              }
              container.maven { url gcsMirror; name 'gcs-maven-central-mirror' }
              container.maven {
                url pluginPortal
                name 'gradle-plugin-portal'
                // Plugin Portal 303-redirects `.module` (Gradle Module
                // Metadata) requests back to repo.maven.apache.org, which
                // 429s for the cloud builder's IPs. Restrict metadata to
                // mavenPom() + artifact() so the .module redirect lookup
                // never happens. (See definitions-external PR #242.)
                metadataSources {
                  mavenPom()
                  artifact()
                  ignoreGradleMetadataRedirection()
                }
              }
            }

            allprojects {
              buildscript {
                repositories {
                  configureRepos delegate
                }
              }
              repositories {
                configureRepos delegate
              }
            }

            settingsEvaluated { settings ->
              settings.pluginManagement {
                repositories {
                  configureRepos delegate
                }
              }
            }
            EOF
        - name: tweak upstream build
          runs: |
            set -eux -o pipefail

            # Disable the @codecov/vite-plugin bundle-analysis upload in
            # datahub-web-react: we have no CODECOV_TOKEN at build time, so the
            # plugin retries `get-pre-signed-url`, fails, and spams the logs.
            sed -i \
              "s|enableBundleAnalysis: true|enableBundleAnalysis: false|" \
              datahub-web-react/vite.config.ts
            grep -q 'enableBundleAnalysis: false' datahub-web-react/vite.config.ts

            # Upstream root build.gradle owns Jackson / lz4 via
            # ext.jacksonVersion + resolutionStrategy.force (and an
            # eachDependency that useTarget()s the same pin). Appending a
            # later eachDependency.useVersion cannot override those forces,
            # which is why prior PR attempts left jackson at 2.21.2/2.21.3
            # and lz4 at 1.10.1 in the staged image.
            #
            # jacksonVersion 2.21.3 -> 2.21.5 remediates GHSA-r7wm-3cxj-wff9,
            # CVE-2026-59888, CVE-2026-59889, GHSA-mhm7-754m-9p8w (and the
            # earlier 545xx jackson-databind family) for unshaded copies.
            # buildSrc must stay in sync (upstream comment on both files).
            # jackson-annotations stays on the minor-only 2.21 line via
            # jacksonMinorRelease derived from jacksonVersion.
            sed -i "s|ext.jacksonVersion = '2.21.3'|ext.jacksonVersion = '2.21.5'|" \
              build.gradle buildSrc/build.gradle
            grep -q "ext.jacksonVersion = '2.21.5'" build.gradle
            grep -q "ext.jacksonVersion = '2.21.5'" buildSrc/build.gradle

            # lz4-java 1.10.1 -> 1.11.1 fixes CVE-2026-59949. Upstream pins
            # this both via eachDependency useTarget and resolutionStrategy.force.
            sed -i \
              -e "s|at.yawk.lz4:lz4-java:1.10.1|at.yawk.lz4:lz4-java:1.11.1|g" \
              build.gradle
            grep -q 'at.yawk.lz4:lz4-java:1.11.1' build.gradle
            if grep -q 'at.yawk.lz4:lz4-java:1.10.1' build.gradle; then
              echo "lz4-java 1.10.1 pin still present after sed" >&2
              exit 1
            fi

            # Force narrowly-scoped transitive CVE fixes not covered by the
            # jacksonVersion / lz4 sed above. eachDependency is sufficient for
            # these (upstream does not resolutionStrategy.force them to an
            # older pin the way it does jackson/lz4).
            #
            # hazelcast 5.7.0 is still required for other findings, but its
            # shaded jackson copies remain unreachable by Gradle and are
            # covered by vex/datahub-frontend-react/jackson-*.vex.json.
            # akka-http 10.5.3 fixes CVE-2023-44487; Akka core modules must
            # stay aligned at 2.7.0+.
            # netty 4.2.16.Final covers the 2026 Netty CVE batch.
            # shiro-core 2.2.1 fixes CVE-2026-49268.
            # tools.jackson 3.1.4/3.1.5 covers unshaded Jackson 3.x copies
            # for GHSA-r7wm-3cxj-wff9 / CVE-2026-59888 / CVE-2026-59889.
            # jetty 12.0.36 fixes CVE-2026-10050.
            # logback 1.5.35 fixes CVE-2026-9828, CVE-2026-10532.
            # spring-core/spring-expression 6.2.19 fixes CVE-2026-41848,
            # CVE-2026-41850, CVE-2026-41851, CVE-2026-41852.
            # micrometer-core 1.15.12 fixes CVE-2026-40983, CVE-2026-40984.
            # httpcore5 5.4.3 fixes CVE-2026-54399.
            cat >> build.gradle << 'GRADLE'

            // ===== DHI CVE remediation: force minimum versions =====
            allprojects {
                configurations.configureEach {
                    resolutionStrategy.eachDependency { details ->
                        def req = details.requested
                        if (req.group == 'com.hazelcast' && req.name == 'hazelcast') {
                            details.useVersion '5.7.0'
                            details.because 'DHI CVE remediation: GHSA-72hv-8253-57qq'
                        }
                        if (req.group == 'com.typesafe.akka' && req.name.startsWith('akka-')) {
                            if (req.name == 'akka-http_2.13' || req.name == 'akka-http-core_2.13' || req.name == 'akka-parsing_2.13') {
                                details.useVersion '10.5.3'
                                details.because 'DHI CVE remediation: CVE-2023-44487'
                            } else {
                                details.useVersion '2.7.0'
                                details.because 'DHI CVE remediation: Akka version alignment for akka-http 10.5.3'
                            }
                        }
                        if (req.group == 'io.netty' && req.name.startsWith('netty-') && !req.name.startsWith('netty-tcnative')) {
                            details.useVersion '4.2.16.Final'
                            details.because 'DHI CVE remediation: CVE-2026-44249, CVE-2026-44250, CVE-2026-44890, CVE-2026-44891, CVE-2026-44892, CVE-2026-44893, CVE-2026-44894, CVE-2026-45416, CVE-2026-45536, CVE-2026-45673, CVE-2026-45674, CVE-2026-46340, CVE-2026-47244, CVE-2026-47691, CVE-2026-48006, CVE-2026-48043, CVE-2026-48059'
                        }
                        if (req.group == 'org.apache.shiro' && req.name == 'shiro-core') {
                            details.useVersion '2.2.1'
                            details.because 'DHI CVE remediation: CVE-2026-49268'
                        }
                        if (req.group == 'org.springframework' && (req.name == 'spring-core' || req.name == 'spring-expression')) {
                            details.useVersion '6.2.19'
                            details.because 'DHI CVE remediation: CVE-2026-41848, CVE-2026-41850, CVE-2026-41851, CVE-2026-41852'
                        }
                        if (req.group == 'tools.jackson.core') {
                            if (req.name == 'jackson-core') {
                                details.useVersion '3.1.4'
                                details.because 'DHI CVE remediation: GHSA-r7wm-3cxj-wff9'
                            } else if (req.name == 'jackson-databind') {
                                details.useVersion '3.1.5'
                                details.because 'DHI CVE remediation: CVE-2026-59888, CVE-2026-59889'
                            }
                        }
                        if (req.group == 'org.eclipse.jetty' && req.name.startsWith('jetty-')) {
                            details.useVersion '12.0.36'
                            details.because 'DHI CVE remediation: CVE-2026-10050'
                        }
                        if (req.group == 'ch.qos.logback' && req.name.startsWith('logback-')) {
                            details.useVersion '1.5.35'
                            details.because 'DHI CVE remediation: CVE-2026-9828, CVE-2026-10532'
                        }
                        if (req.group == 'io.micrometer' && req.name == 'micrometer-core') {
                            details.useVersion '1.15.12'
                            details.because 'DHI CVE remediation: CVE-2026-40983, CVE-2026-40984'
                        }
                        if (req.group == 'org.apache.httpcomponents.core5' && req.name == 'httpcore5') {
                            details.useVersion '5.4.3'
                            details.because 'DHI CVE remediation: CVE-2026-54399'
                        }
                    }
                }
            }
            GRADLE
        - name: build datahub-frontend stage
          work-dir: ${source.dir}/datahub
          privileged: true
          runs: |
            set -eux -o pipefail

            export GRADLE_HOME="/usr/share/java/gradle"
            export JAVA_HOME="/usr/lib/jvm/temurin-17"
            export PATH="${GRADLE_HOME}/bin:${JAVA_HOME}/bin:${PATH}"
            export JAVA_TOOL_OPTIONS="-Dfile.encoding=UTF-8"

            # Stale lockfiles in the persistent Gradle cache mount can block
            # later builds with "Timeout waiting to lock journal cache".
            find /root/.gradle/caches -name '*.lock' -delete 2> /dev/null || true
            find /root/.gradle/caches/journal-* -mindepth 1 -maxdepth 1 \
              -name '*.lock' -delete 2> /dev/null || true

            # `:datahub-frontend:stage` triggers the Play 2 plugin to assemble
            # the runnable distribution under datahub-frontend/build/stage/main/.
            # It transitively builds :datahub-web-react (Vite/Yarn) and bundles
            # the assets JAR into the Play classpath.
            #
            # `-x test -x check` skips unit tests and the full :check graph
            # (Spotless, static analysis, lint) — saves ~30 min on the cold
            # build and avoids test-only deps like BouncyCastle/mockito.
            # `--parallel --max-workers=4` lets independent metadata-events
            # subprojects compile concurrently while avoiding Gradle javaCompile
            # cache lock contention seen at higher worker counts.
            # The Gradle init script at /root/.gradle/init.d/maven-mirror.gradle
            # (placed by the `configure gradle maven mirror` step above) is
            # auto-loaded by Gradle from the user init.d directory — no
            # `--init-script` flag needed.
            # `--update-locks` refreshes lock lines for the groups we sed/force
            # above. jacksonVersion is now 2.21.5 and lz4 is forced to 1.11.1
            # in upstream build.gradle, so lock refresh writes those pins
            # instead of fighting them.
            ./gradlew \
              --no-daemon \
              --no-watch-fs \
              --console=plain \
              --warning-mode=summary \
              --parallel \
              --max-workers=4 \
              --update-locks 'com.fasterxml.jackson.core:*,com.fasterxml.jackson.dataformat:*,com.fasterxml.jackson.datatype:*,com.fasterxml.jackson.module:*,com.fasterxml.jackson:*,tools.jackson.core:*,tools.jackson.dataformat:*,tools.jackson.datatype:*,tools.jackson.module:*,at.yawk.lz4:*,org.eclipse.jetty:*,io.netty:*,ch.qos.logback:*,com.hazelcast:*,com.typesafe.akka:*,org.apache.shiro:*,org.springframework:*,io.micrometer:*,org.apache.httpcomponents.core5:*' \
              :datahub-frontend:stage \
              -x test \
              -x check
        - name: stage runtime layout
          work-dir: ${source.dir}/datahub
          runs: |
            set -eux -o pipefail

            # Lay out the runtime image the way upstream does:
            #   /datahub-frontend/   <- Play distribution (bin/, lib/, conf/)
            #   /datahub-frontend/conf/mfe.*.yaml
            #   /datahub-frontend/client-prometheus-config.yaml
            #   /start.sh            <- entrypoint
            install -d -m 0755 "${target.dir}/datahub-frontend"
            cp -a datahub-frontend/build/stage/main/. "${target.dir}/datahub-frontend/"

            # Additional micro-frontend (MFE) config files that ship in the
            # upstream image alongside the staged distribution.
            install -D -m 0644 \
              datahub-frontend/conf/mfe.config.dev.yaml \
              "${target.dir}/datahub-frontend/conf/mfe.config.dev.yaml"
            install -D -m 0644 \
              datahub-frontend/conf/mfe.config.local.yaml \
              "${target.dir}/datahub-frontend/conf/mfe.config.local.yaml"

            # JMX Prometheus exporter config consumed by the Java agent when
            # ENABLE_PROMETHEUS=true (see start.sh).
            install -D -m 0644 \
              docker/monitoring/client-prometheus-config.yaml \
              "${target.dir}/datahub-frontend/client-prometheus-config.yaml"

            # Upstream start.sh uses `[[ ... ]]` (bash) under a `/bin/sh`
            # shebang. Busybox sh on Alpine accepts that, but Debian's dash
            # does not — rewrite the shebang to /bin/bash and add bash to the
            # runtime contents.
            install -D -m 0755 docker/datahub-frontend/start.sh "${target.dir}/start.sh"
            sed -i '1s|.*|#!/bin/bash|' "${target.dir}/start.sh"

            # Always create /etc/datahub-frontend so the outputs entry can
            # copy it for every variant. The FIPS-only step below populates
            # datahub-fips.properties inside it; for non-FIPS variants it
            # stays empty (the empty dir is a no-op at runtime).
            install -d -m 0755 "${target.dir}/etc/datahub-frontend"
      outputs:
        - source: ${target.dir}/datahub-frontend
          target: /datahub-frontend
          uid: 0
          gid: 0
        - source: ${target.dir}/opt/javaagents
          target: /opt/javaagents
          uid: 0
          gid: 0
        - source: ${target.dir}/start.sh
          target: /start.sh
          uid: 0
          gid: 0
          mode: "0755"
        - source: ${target.dir}/etc/datahub-frontend
          target: /etc/datahub-frontend
          uid: 0
          gid: 0
        - source: /opt/docker/sbom/datahub-frontend-react
          target: /opt/docker/sbom/datahub-frontend-react
          uid: 0
          gid: 0
        - source: /opt/docker/sbom/opentelemetry-javaagent
          target: /opt/docker/sbom/opentelemetry-javaagent
          uid: 0
          gid: 0
        - source: /opt/docker/sbom/jmx_prometheus_javaagent
          target: /opt/docker/sbom/jmx_prometheus_javaagent
          uid: 0
          gid: 0
    - name: locale
      contents:
        packages:
          - bash
          - locales
          - coreutils
          - gzip
      pipeline:
        - name: install locales
          runs: |
            set -eux -o pipefail

            ln -s /etc/locale.alias /usr/share/locale/locale.alias

            echo "en_US.UTF-8 UTF-8" >> /etc/locale.gen
            locale-gen en_US.UTF-8
      outputs:
        - source: /usr/share/locale
          target: /usr/share/locale
          uid: 0
          gid: 0
        - source: /usr/lib/locale
          target: /usr/lib/locale
          uid: 0
          gid: 0
accounts:
  root: true
  run-as: root
  users:
    - name: nonroot
      uid: 65532
      gid: 65532
    - name: _apt
      uid: 42
      gid: 65532
  groups:
    - name: nonroot
      gid: 65532
      members:
        - nonroot
os-release:
  name: Docker Hardened Images (Debian)
  id: debian
  version-id: "13"
  version-codename: trixie
  pretty-name: Docker Hardened Images/Debian GNU/Linux 13 (trixie)
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
environment:
  DEBIAN_FRONTEND: noninteractive
  JMX_VERSION: 0.20.0
  LANG: en_US.UTF-8
  LANGUAGE: en_US:en
  LC_ALL: en_US.UTF-8
  MFE_CONFIG_FILE_PATH: /datahub-frontend/conf/mfe.config.dev.yaml
  OTEL_EXPORTER_OTLP_HTTP_COMPRESSION: gzip
  OTEL_EXPORTER_OTLP_HTTP_HTTP2_MAX_FRAME_SIZE: "16777215"
  OTEL_EXPORTER_OTLP_MAX_PAYLOAD_SIZE: "4194304"
  OTEL_EXPORTER_OTLP_TRACES_COMPRESSION: gzip
  SERVER_PORT: "9002"
paths:
  - type: symlink
    path: /opentelemetry-javaagent.jar
    uid: 0
    gid: 0
    source: /opt/javaagents/opentelemetry-javaagent.jar
  - type: symlink
    path: /jmx_prometheus_javaagent.jar
    uid: 0
    gid: 0
    source: /opt/javaagents/jmx_prometheus_javaagent.jar
  - type: directory
    path: /tmp/datahub/logs/datahub-frontend
    uid: 65532
    gid: 65532
    mode: "0770"
annotations:
  org.opencontainers.image.description: A minimal DataHub Frontend image
  org.opencontainers.image.licenses: Apache-2.0
entrypoint:
  - /start.sh
ports:
  - 9002/tcp
