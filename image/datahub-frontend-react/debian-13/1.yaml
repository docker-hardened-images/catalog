# syntax=dhi.io/build:2-debian13

name: DataHub Frontend 1.x
image: dhi.io/datahub-frontend-react
variant: runtime
tags:
  - "1"
  - "1.6"
  - 1.6.0
  - 1.6.0.2
  - 1-debian
  - 1-debian13
  - 1.6-debian
  - 1.6-debian13
  - 1.6.0-debian
  - 1.6.0-debian13
  - 1.6.0.2-debian
  - 1.6.0.2-debian13
platforms:
  - linux/amd64
  - linux/arm64
dates:
  release: "2025-08-22"
vars:
  JAVA_FIPS_SUFFIX: ""
  JAVA_VARIANT: jre
  JDK_MAJOR_VERSION: "21"
  SEMVER_MAJOR_MINOR_VERSION: "1.6"
  SEMVER_MAJOR_VERSION: "1"
  SEMVER_VERSION: 1.6.0.2
  VERSION: 1.6.0.2-0
  VERSION_MAJOR_MINOR_PATCH: 1.6.0
contents:
  repositories:
    - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
  keyring:
    - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
  packages:
    - '!libelogind0'
    - '!mawk'
    - '!original-awk'
    - base-files
    - bash
    - ca-certificates
    - ca-certificates-bundle
    - coreutils
    - datahub-frontend-react=1.6.0.2-0
    - eclipse-temurin-21-jre
    - eclipse-temurin-21-jre-oci-config
    - findutils
    - grep
    - libstdc++6
    - sed
    - sqlite3
    - tzdata
  builds:
    - name: locale
      contents:
        packages:
          - bash
          - locales
          - coreutils
          - gzip
      pipeline:
        - name: install locales
          runs: |
            set -eux -o pipefail

            ln -s /etc/locale.alias /usr/share/locale/locale.alias

            echo "en_US.UTF-8 UTF-8" >> /etc/locale.gen
            locale-gen en_US.UTF-8
      outputs:
        - source: /usr/share/locale
          target: /usr/share/locale
          uid: 0
          gid: 0
        - source: /usr/lib/locale
          target: /usr/lib/locale
          uid: 0
          gid: 0
accounts:
  run-as: nonroot
  users:
    - name: nonroot
      uid: 65532
      gid: 65532
  groups:
    - name: nonroot
      gid: 65532
      members:
        - nonroot
os-release:
  name: Docker Hardened Images (Debian)
  id: debian
  version-id: "13"
  version-codename: trixie
  pretty-name: Docker Hardened Images/Debian GNU/Linux 13 (trixie)
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
environment:
  JMX_VERSION: 0.20.0
  LANG: en_US.UTF-8
  LANGUAGE: en_US:en
  LC_ALL: en_US.UTF-8
  MFE_CONFIG_FILE_PATH: /datahub-frontend/conf/mfe.config.dev.yaml
  OTEL_EXPORTER_OTLP_HTTP_COMPRESSION: gzip
  OTEL_EXPORTER_OTLP_HTTP_HTTP2_MAX_FRAME_SIZE: "16777215"
  OTEL_EXPORTER_OTLP_MAX_PAYLOAD_SIZE: "4194304"
  OTEL_EXPORTER_OTLP_TRACES_COMPRESSION: gzip
  SERVER_PORT: "9002"
paths:
  - type: directory
    path: /tmp/datahub/logs/datahub-frontend
    uid: 65532
    gid: 65532
    mode: "0770"
  - type: symlink
    path: /start.sh
    uid: 0
    gid: 0
    source: /usr/share/datahub-frontend-react/scripts/start.sh
  - type: symlink
    path: /datahub-frontend
    uid: 0
    gid: 0
    source: /usr/share/datahub-frontend-react
annotations:
  org.opencontainers.image.description: A minimal DataHub Frontend image
  org.opencontainers.image.licenses: Apache-2.0
entrypoint:
  - /start.sh
ports:
  - 9002/tcp
