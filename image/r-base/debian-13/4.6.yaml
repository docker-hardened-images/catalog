# syntax=dhi.io/build:2-debian13

name: R 4.6.x
image: dhi.io/r-base
variant: runtime
tags:
  - "4"
  - "4.6"
  - 4.6.1
  - 4-debian
  - 4-debian13
  - 4.6-debian
  - 4.6-debian13
  - 4.6.1-debian
  - 4.6.1-debian13
platforms:
  - linux/amd64
  - linux/arm64
dates:
  release: "2026-04-24"
vars:
  FLAVORED_SUFFIX: ""
  SEMVER_MAJOR_MINOR_VERSION: "4.6"
  SEMVER_MAJOR_VERSION: "4"
  SEMVER_VERSION: 4.6.1
  SUFFIX: ""
  VERSION: 4.6.1-0
contents:
  repositories:
    - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
  keyring:
    - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
  packages:
    - '!libelogind0'
    - '!mawk'
    - '!original-awk'
    - base-files
    - bzip2
    - ca-certificates-bundle
    - coreutils
    - dash
    - fontconfig-config
    - gnu-which
    - grep
    - gzip
    - init-system-helpers
    - less
    - libbz2-1.0
    - libc6
    - libcairo2
    - libcurl4t64
    - libdeflate0
    - libfontconfig1
    - libfreetype6
    - libgcc-s1
    - libgfortran5
    - libglib2.0-0t64
    - libgomp1
    - libicu76
    - libjpeg62-turbo
    - liblzma5
    - libncursesw6
    - libopenblas0-pthread
    - libpango-1.0-0
    - libpangocairo-1.0-0
    - libpcre2-8-0
    - libpng16-16t64
    - libreadline8t64
    - libstdc++6
    - libtcl8.6
    - libtiff6
    - libtinfo6
    - libtk8.6
    - libx11-6
    - libxft2
    - libxrender1
    - libxss1
    - libxt6t64
    - libzstd1
    - netbase
    - r-base-4.6=4.6.1-0
    - sed
    - tar
    - tzdata
    - unzip
    - zip
    - zlib1g
  builds:
    - name: locale
      contents:
        packages:
          - bash
          - locales
          - coreutils
          - gzip
      pipeline:
        - name: install locales
          runs: |
            set -eux -o pipefail

            ln -s /etc/locale.alias /usr/share/locale/locale.alias

            echo "en_US.UTF-8 UTF-8" >> /etc/locale.gen
            locale-gen en_US.UTF-8
      outputs:
        - source: /usr/share/locale
          target: /usr/share/locale
          uid: 0
          gid: 0
        - source: /usr/lib/locale
          target: /usr/lib/locale
          uid: 0
          gid: 0
accounts:
  run-as: nonroot
  users:
    - name: nonroot
      uid: 65532
      gid: 65532
  groups:
    - name: nonroot
      gid: 65532
      members:
        - nonroot
os-release:
  name: Docker Hardened Images (Debian)
  id: debian
  version-id: "13"
  version-codename: trixie
  pretty-name: Docker Hardened Images/Debian GNU/Linux 13 (trixie)
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
environment:
  LANG: en_US.UTF-8
  LANGUAGE: en_US:en
  LC_ALL: en_US.UTF-8
  R_BASE_VERSION: 4.6.1
  R_LIBS_SITE: /usr/local/lib/R/site-library:/usr/lib/R/site-library
  SSL_CERT_FILE: /etc/ssl/certs/ca-certificates.crt
paths:
  - type: directory
    path: /usr/local/bin
    uid: 0
    gid: 0
  - type: directory
    path: /usr/local/lib
    uid: 0
    gid: 0
  - type: directory
    path: /usr/local/lib/R
    uid: 0
    gid: 0
  - type: directory
    path: /usr/local/lib/R/site-library
    uid: 0
    gid: 0
    mode: "0755"
  - type: symlink
    path: /usr/local/bin/install.r
    uid: 0
    gid: 0
    source: /usr/bin/install.r
  - type: symlink
    path: /usr/local/bin/install2.r
    uid: 0
    gid: 0
    source: /usr/bin/install2.r
  - type: symlink
    path: /usr/local/bin/installBioc.r
    uid: 0
    gid: 0
    source: /usr/bin/installBioc.r
  - type: symlink
    path: /usr/local/bin/installDeps.r
    uid: 0
    gid: 0
    source: /usr/bin/installDeps.r
  - type: symlink
    path: /usr/local/bin/installGithub.r
    uid: 0
    gid: 0
    source: /usr/bin/installGithub.r
  - type: symlink
    path: /usr/local/bin/testInstalled.r
    uid: 0
    gid: 0
    source: /usr/bin/testInstalled.r
annotations:
  org.opencontainers.image.description: A minimal R image
  org.opencontainers.image.licenses: GPL-2.0-only OR GPL-3.0-only
cmd:
  - R
