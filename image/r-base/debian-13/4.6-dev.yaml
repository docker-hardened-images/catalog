# syntax=dhi.io/build:2-debian13

name: R 4.6.x (dev)
image: dhi.io/r-base
variant: dev
tags:
  - 4-dev
  - 4.6-dev
  - 4.6.1-dev
  - 4-debian-dev
  - 4-debian13-dev
  - 4.6-debian-dev
  - 4.6-debian13-dev
  - 4.6.1-debian-dev
  - 4.6.1-debian13-dev
platforms:
  - linux/amd64
  - linux/arm64
dates:
  release: "2026-04-24"
vars:
  FLAVORED_SUFFIX: -dev
  SEMVER_MAJOR_MINOR_VERSION: "4.6"
  SEMVER_MAJOR_VERSION: "4"
  SEMVER_VERSION: 4.6.1
  SUFFIX: -dev
  VERSION: 4.6.1-0
contents:
  repositories:
    - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
  keyring:
    - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
  packages:
    - '!gawk'
    - '!libelogind0'
    - '!mawk'
    - '!original-awk'
    - apt
    - base-files
    - bash
    - binutils
    - bzip2
    - ca-certificates
    - ca-certificates-bundle
    - coreutils
    - dash
    - diffutils
    - dpkg
    - findutils
    - fontconfig-config
    - g++
    - gcc
    - gfortran
    - gnu-which
    - grep
    - gzip
    - init-system-helpers
    - less
    - libbz2-1.0
    - libbz2-dev
    - libc-bin
    - libc6
    - libc6-dev
    - libcairo2
    - libcairo2-dev
    - libcurl4-openssl-dev
    - libcurl4t64
    - libdeflate0
    - libfontconfig1
    - libfontconfig1-dev
    - libfreetype6
    - libgcc-s1
    - libgfortran5
    - libglib2.0-0t64
    - libgomp1
    - libicu-dev
    - libicu76
    - libjpeg-dev
    - libjpeg62-turbo
    - liblzma-dev
    - liblzma5
    - libncurses-dev
    - libncursesw6
    - libopenblas-pthread-dev
    - libopenblas0-pthread
    - libpango-1.0-0
    - libpango1.0-dev
    - libpangocairo-1.0-0
    - libpcre2-8-0
    - libpcre2-dev
    - libpng16-16t64
    - libreadline-dev
    - libreadline8t64
    - libstdc++6
    - libtcl8.6
    - libtiff-dev
    - libtiff6
    - libtinfo6
    - libtk8.6
    - libx11-6
    - libx11-dev
    - libxft2
    - libxrender1
    - libxss1
    - libxt-dev
    - libxt6t64
    - libzstd1
    - make
    - mawk
    - netbase
    - perl-base
    - pkgconf
    - r-base-4.6=4.6.1-0
    - sed
    - sqv
    - tar
    - tcl8.6-dev
    - tk8.6-dev
    - tzdata
    - unzip
    - util-linux
    - zip
    - zlib1g
    - zlib1g-dev
  builds:
    - name: locale
      contents:
        packages:
          - bash
          - locales
          - coreutils
          - gzip
      pipeline:
        - name: install locales
          runs: |
            set -eux -o pipefail

            ln -s /etc/locale.alias /usr/share/locale/locale.alias

            echo "en_US.UTF-8 UTF-8" >> /etc/locale.gen
            locale-gen en_US.UTF-8
      outputs:
        - source: /usr/share/locale
          target: /usr/share/locale
          uid: 0
          gid: 0
        - source: /usr/lib/locale
          target: /usr/lib/locale
          uid: 0
          gid: 0
accounts:
  root: true
  run-as: root
  users:
    - name: nonroot
      uid: 65532
      gid: 65532
    - name: _apt
      uid: 42
      gid: 65532
  groups:
    - name: nonroot
      gid: 65532
      members:
        - nonroot
os-release:
  name: Docker Hardened Images (Debian)
  id: debian
  version-id: "13"
  version-codename: trixie
  pretty-name: Docker Hardened Images/Debian GNU/Linux 13 (trixie)
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
environment:
  DEBIAN_FRONTEND: noninteractive
  LANG: en_US.UTF-8
  LANGUAGE: en_US:en
  LC_ALL: en_US.UTF-8
  R_BASE_VERSION: 4.6.1
  R_LIBS_SITE: /usr/local/lib/R/site-library:/usr/lib/R/site-library
  SSL_CERT_FILE: /etc/ssl/certs/ca-certificates.crt
paths:
  - type: directory
    path: /usr/local/bin
    uid: 0
    gid: 0
  - type: directory
    path: /usr/local/lib
    uid: 0
    gid: 0
  - type: directory
    path: /usr/local/lib/R
    uid: 0
    gid: 0
  - type: directory
    path: /usr/local/lib/R/site-library
    uid: 0
    gid: 0
    mode: "0755"
  - type: symlink
    path: /usr/local/bin/install.r
    uid: 0
    gid: 0
    source: /usr/bin/install.r
  - type: symlink
    path: /usr/local/bin/install2.r
    uid: 0
    gid: 0
    source: /usr/bin/install2.r
  - type: symlink
    path: /usr/local/bin/installBioc.r
    uid: 0
    gid: 0
    source: /usr/bin/installBioc.r
  - type: symlink
    path: /usr/local/bin/installDeps.r
    uid: 0
    gid: 0
    source: /usr/bin/installDeps.r
  - type: symlink
    path: /usr/local/bin/installGithub.r
    uid: 0
    gid: 0
    source: /usr/bin/installGithub.r
  - type: symlink
    path: /usr/local/bin/testInstalled.r
    uid: 0
    gid: 0
    source: /usr/bin/testInstalled.r
annotations:
  org.opencontainers.image.description: A minimal R image
  org.opencontainers.image.licenses: GPL-2.0-only OR GPL-3.0-only
cmd:
  - R
