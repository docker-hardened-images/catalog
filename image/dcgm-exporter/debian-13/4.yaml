# syntax=dhi.io/build:2-debian13

name: NVIDIA DCGM Exporter 4.x
image: dhi.io/dcgm-exporter
variant: runtime
tags:
  - "4"
  - 4.6-4.8
  - 4-debian
  - 4-debian13
  - 4.6.0-4.8.3
  - 4.6-4.8-debian
  - 4.6-4.8-debian13
  - 4.6.0-4.8.3-debian
  - 4.6.0-4.8.3-debian13
platforms:
  - linux/amd64
  - linux/arm64
dates:
  release: "2025-01-27"
vars:
  COMMIT_SHA: 181290c399d46a9b905e083d0204348be63cb436
  DCGM_VERSION: 4.6.0
  DEBIAN_VERSION: 4.6.0-4.8.3-30
  EXPORTER_VERSION: 4.8.3
  FLAVORED_SUFFIX: ""
  SEMVER_DCGM_MAJOR_MINOR_VERSION: "4.6"
  SEMVER_DCGM_MAJOR_VERSION: "4"
  SEMVER_EXPORTER_MAJOR_MINOR_VERSION: "4.8"
  SEMVER_EXPORTER_MAJOR_VERSION: "4"
  SEMVER_MAJOR_MINOR_VERSION: "4.6"
  SEMVER_MAJOR_VERSION: "4"
  SEMVER_VERSION: 4.6.0
  SUFFIX: ""
  VERSION: 4.6.0-4.8.3
contents:
  repositories:
    - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
  keyring:
    - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
  packages:
    - '!libelogind0'
    - '!mawk'
    - '!original-awk'
    - base-files
    - ca-certificates-bundle
    - dcgm-exporter=4.6.0-4.8.3-30
    - libc-bin
    - libc6
    - libstdc++6
    - tini
    - tzdata
accounts:
  root: true
  run-as: root
  users:
    - name: nonroot
      uid: 65532
      gid: 65532
  groups:
    - name: nonroot
      gid: 65532
      members:
        - nonroot
os-release:
  name: Docker Hardened Images (Debian)
  id: debian
  version-id: "13"
  version-codename: trixie
  pretty-name: Docker Hardened Images/Debian GNU/Linux 13 (trixie)
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
work-dir: /
environment:
  DCGM_EXPORTER_COLLECTORS: /etc/dcgm-exporter/default-counters.csv
  NVIDIA_DISABLE_REQUIRE: "true"
  NVIDIA_DRIVER_CAPABILITIES: compute,utility
  NVIDIA_VISIBLE_DEVICES: all
paths:
  - type: directory
    path: /usr/local/bin
    uid: 0
    gid: 0
    mode: "0755"
  - type: symlink
    path: /usr/local/bin/dcgm-exporter
    uid: 0
    gid: 0
    source: /usr/bin/dcgm-exporter
  - type: directory
    path: /usr/local/lib
    uid: 0
    gid: 0
    mode: "0755"
  - type: directory
    path: /usr/local/lib/x86_64-linux-gnu
    uid: 0
    gid: 0
    mode: "0755"
  - type: directory
    path: /usr/local/lib/aarch64-linux-gnu
    uid: 0
    gid: 0
    mode: "0755"
annotations:
  org.opencontainers.image.description: A minimal NVIDIA DCGM exporter image
  org.opencontainers.image.licenses: Apache-2.0 AND LicenseRef-NVIDIA-DCGM-EULA
entrypoint:
  - /usr/bin/tini
  - --
  - /usr/local/bin/dcgm-exporter
ports:
  - 9400/tcp
