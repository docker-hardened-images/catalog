accounts:
  root: true
  run-as: root
  users:
    - name: nonroot
      uid: 65532
      gid: 65532
    - name: _apt
      uid: 42
      gid: 65532
  groups:
    - name: nonroot
      gid: 65532
      members:
        - nonroot
os-release:
  name: Docker Hardened Images (Debian)
  id: debian
  version-id: "13"
  version-codename: trixie
  pretty-name: Docker Hardened Images/Debian GNU/Linux 13 (trixie)
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
environment:
  AMENT_PREFIX_PATH: /opt/ros/jazzy
  CMAKE_PREFIX_PATH: /opt/ros/jazzy
  COLCON_PREFIX_PATH: /opt/ros/jazzy
  DEBIAN_FRONTEND: noninteractive
  LANG: C.UTF-8
  LC_ALL: C.UTF-8
  LD_LIBRARY_PATH: /opt/ros/jazzy/lib
  PATH: /opt/ros/jazzy/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
  PKG_CONFIG_PATH: /opt/ros/jazzy/lib/${ROS_ARCH}-linux-gnu/pkgconfig:/opt/ros/jazzy/lib/pkgconfig
  PYTHONPATH: /opt/ros/jazzy/lib/python3.13/site-packages
  ROS_AUTOMATIC_DISCOVERY_RANGE: SUBNET
  ROS_DISTRO: jazzy
  ROS_PYTHON_VERSION: "3"
  ROS_VERSION: "2"
paths:
  - type: symlink
    path: /usr/lib/${ROS_ARCH}-linux-gnu/libblas.so.3
    uid: 0
    gid: 0
    source: blas/libblas.so.3
  - type: symlink
    path: /usr/lib/${ROS_ARCH}-linux-gnu/liblapack.so.3
    uid: 0
    gid: 0
    source: lapack/liblapack.so.3
  - type: file
    path: /ros_entrypoint.sh
    uid: 0
    gid: 0
    mode: "0755"
    source: image/ros/bin/ros_entrypoint.sh
annotations:
  org.opencontainers.image.description: A minimal ROS 2 base image
  org.opencontainers.image.licenses: Apache-2.0 AND BSD-3-Clause
entrypoint:
  - /ros_entrypoint.sh
cmd:
  - bash
