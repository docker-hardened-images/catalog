# syntax=dhi.io/build:2-debian13

name: ROS 2 Lyrical
image: dhi.io/ros
variant: runtime
tags:
  - lyrical
  - lyrical-debian
  - lyrical-20260807
  - lyrical-debian13
  - lyrical-ros-base
  - lyrical-20260807-debian
  - lyrical-ros-base-debian
  - lyrical-20260807-debian13
  - lyrical-ros-base-debian13
platforms:
  - linux/amd64
  - linux/arm64
dates:
  release: "2026-05-22"
vars:
  ROS_ARCH: '#{ target.arch == "amd64" ? "x86_64" : "aarch64" }'
  ROS_DISTRO: lyrical
  ROS_PACKAGE: ros-lyrical
  ROS_SYNC_VERSION: "20260807"
  VERSION: 20260807-4
contents:
  repositories:
    - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
  keyring:
    - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
  packages:
    - '!dpkg'
    - '!libelogind0'
    - '!libpython3-stdlib'
    - '!libpython3.13-minimal'
    - '!libpython3.13-stdlib'
    - '!mawk'
    - '!original-awk'
    - '!python3'
    - '!python3-minimal'
    - '!python3.13'
    - '!python3.13-minimal'
    - base-files
    - bash
    - ca-certificates-bundle
    - coreutils
    - dash
    - libblas3
    - libc-bin
    - libc6
    - libconsole-bridge1.0
    - libfoonathan-memory0.7.3t64
    - libgcc-s1
    - liblapack3
    - liblttng-ust1t64
    - liblz4-1
    - liborocos-kdl1.5
    - libpython-3.13
    - libspdlog1.15
    - libsqlite3-0
    - libssl3t64
    - libstdc++6
    - libtinyxml2-11
    - libyaml-0-2
    - libyaml-cpp0.8
    - libzstd1
    - python-3.13
    - python3-argcomplete
    - python3-catkin-pkg
    - python3-cryptography
    - python3-empy
    - python3-lark
    - python3-lxml
    - python3-numpy
    - python3-osrf-pycommon
    - python3-packaging
    - python3-psutil
    - python3-pykdl
    - python3-rosdistro
    - python3-typing-extensions
    - python3-yaml
    - ros-lyrical=20260807-4
    - tzdata
accounts:
  run-as: nonroot
  users:
    - name: nonroot
      uid: 65532
      gid: 65532
  groups:
    - name: nonroot
      gid: 65532
      members:
        - nonroot
os-release:
  name: Docker Hardened Images (Debian)
  id: debian
  version-id: "13"
  version-codename: trixie
  pretty-name: Docker Hardened Images/Debian GNU/Linux 13 (trixie)
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
environment:
  AMENT_PREFIX_PATH: /opt/ros/lyrical
  LANG: C.UTF-8
  LC_ALL: C.UTF-8
  LD_LIBRARY_PATH: /opt/ros/lyrical/lib
  PATH: /opt/ros/lyrical/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
  PYTHONPATH: /opt/ros/lyrical/lib/python3.13/site-packages
  ROS_AUTOMATIC_DISCOVERY_RANGE: SUBNET
  ROS_DISTRO: lyrical
  ROS_PYTHON_VERSION: "3"
  ROS_VERSION: "2"
paths:
  - type: symlink
    path: /usr/lib/${ROS_ARCH}-linux-gnu/libblas.so.3
    uid: 0
    gid: 0
    source: blas/libblas.so.3
  - type: symlink
    path: /usr/lib/${ROS_ARCH}-linux-gnu/liblapack.so.3
    uid: 0
    gid: 0
    source: lapack/liblapack.so.3
  - type: file
    path: /ros_entrypoint.sh
    uid: 0
    gid: 0
    mode: "0755"
    source: image/ros/bin/ros_entrypoint.sh
annotations:
  org.opencontainers.image.description: A minimal ROS 2 base image
  org.opencontainers.image.licenses: Apache-2.0 AND BSD-3-Clause
entrypoint:
  - /ros_entrypoint.sh
cmd:
  - bash
