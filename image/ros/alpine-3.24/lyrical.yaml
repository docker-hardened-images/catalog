# syntax=dhi.io/build:2-alpine3.24

name: ROS 2 Lyrical
image: dhi.io/ros
variant: runtime
tags:
  - lyrical-alpine
  - lyrical-alpine3.24
  - lyrical-20260807-alpine
  - lyrical-ros-base-alpine
  - lyrical-20260807-alpine3.24
  - lyrical-ros-base-alpine3.24
platforms:
  - linux/amd64
  - linux/arm64
dates:
  release: "2026-05-22"
vars:
  ROS_DISTRO: lyrical
  ROS_PACKAGE: ros-lyrical
  ROS_SYNC_VERSION: "20260807"
  VERSION: 20260807-r0
contents:
  repositories:
    - https://dhi.io/apk/alpine/v3.24/main
    - https://dl-cdn.alpinelinux.org/alpine/v3.24/main
    - https://dl-cdn.alpinelinux.org/alpine/v3.24/community
  keyring:
    - https://dhi.io/keyring/dhi-apk@docker-0F81AD7700D99184.rsa.pub
  packages:
    - alpine-baselayout-data
    - bash
    - ca-certificates-bundle
    - coreutils
    - libcrypto3
    - libgcc
    - libssl3
    - libstdc++
    - lttng-ust
    - lz4-libs
    - musl
    - py3-argcomplete
    - py3-cryptography
    - py3-dateutil
    - py3-distro
    - py3-docutils
    - py3-lark-parser
    - py3-lxml
    - py3-numpy
    - py3-packaging
    - py3-parsing
    - py3-psutil
    - py3-typing-extensions
    - py3-yaml
    - python3
    - ros-lyrical=20260807-r0
    - spdlog
    - sqlite-libs
    - tzdata
    - yaml
    - yaml-cpp
    - zstd-libs
accounts:
  run-as: nonroot
  users:
    - name: nonroot
      uid: 65532
      gid: 65532
  groups:
    - name: nonroot
      gid: 65532
      members:
        - nonroot
os-release:
  name: Docker Hardened Images (Alpine)
  id: alpine
  version-id: "3.24"
  pretty-name: Docker Hardened Images/Alpine Linux v3.24
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
environment:
  AMENT_PREFIX_PATH: /opt/ros/lyrical
  LANG: C.UTF-8
  LC_ALL: C.UTF-8
  LD_LIBRARY_PATH: /opt/ros/lyrical/lib64:/opt/ros/lyrical/lib
  PATH: /opt/ros/lyrical/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
  PYTHONPATH: /opt/ros/lyrical/lib/python3.14/site-packages
  ROS_AUTOMATIC_DISCOVERY_RANGE: SUBNET
  ROS_DISTRO: lyrical
  ROS_PYTHON_VERSION: "3"
  ROS_VERSION: "2"
paths:
  - type: file
    path: /ros_entrypoint.sh
    uid: 0
    gid: 0
    mode: "0755"
    source: image/ros/bin/ros_entrypoint.sh
annotations:
  org.opencontainers.image.description: A minimal ROS 2 base image
  org.opencontainers.image.licenses: Apache-2.0 AND BSD-3-Clause
entrypoint:
  - /ros_entrypoint.sh
cmd:
  - bash
