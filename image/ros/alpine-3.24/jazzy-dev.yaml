    - py3-packaging
    - py3-parsing
    - py3-pluggy
    - py3-psutil
    - py3-pybind11-dev
    - py3-pygments
    - py3-pytest
    - py3-pytest-cov
    - py3-pytest-repeat
    - py3-pytest-rerunfailures
    - py3-yaml
    - python3
    - python3-dev
    - ros-jazzy-dev=20260618-r0
    - ros-jazzy=20260618-r0
    - spdlog
    - spdlog-dev
    - sqlite-dev
    - sqlite-libs
    - tinyxml2
    - tinyxml2-dev
    - tzdata
    - uncrustify
    - yaml
    - yaml-cpp
    - yaml-cpp-dev
    - yaml-dev
    - zstd-dev
    - zstd-libs
accounts:
  root: true
  run-as: root
  users:
    - name: nonroot
      uid: 65532
      gid: 65532
  groups:
    - name: nonroot
      gid: 65532
      members:
        - nonroot
os-release:
  name: Docker Hardened Images (Alpine)
  id: alpine
  version-id: "3.24"
  pretty-name: Docker Hardened Images/Alpine Linux v3.24
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
environment:
  AMENT_PREFIX_PATH: /opt/ros/jazzy
  CMAKE_PREFIX_PATH: /opt/ros/jazzy
  COLCON_PREFIX_PATH: /opt/ros/jazzy
  LANG: C.UTF-8
  LC_ALL: C.UTF-8
  LD_LIBRARY_PATH: /opt/ros/jazzy/lib64:/opt/ros/jazzy/lib
  PATH: /opt/ros/jazzy/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
  PKG_CONFIG_PATH: /opt/ros/jazzy/lib64/pkgconfig:/opt/ros/jazzy/lib/pkgconfig
  PYTHONPATH: /opt/ros/jazzy/lib/python3.14/site-packages
  ROS_AUTOMATIC_DISCOVERY_RANGE: SUBNET
  ROS_DISTRO: jazzy
  ROS_PYTHON_VERSION: "3"
  ROS_VERSION: "2"
paths:
  - type: file
    path: /ros_entrypoint.sh
    uid: 0
    gid: 0
    mode: "0755"
    source: image/ros/bin/ros_entrypoint.sh
annotations:
  org.opencontainers.image.description: A minimal ROS 2 base image
  org.opencontainers.image.licenses: Apache-2.0 AND BSD-3-Clause
entrypoint:
  - /ros_entrypoint.sh
cmd:
  - bash
