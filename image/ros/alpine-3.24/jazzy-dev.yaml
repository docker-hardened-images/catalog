# syntax=dhi.io/build:2-alpine3.24

name: ROS 2 Jazzy (dev)
image: dhi.io/ros
variant: dev
tags:
  - jazzy-alpine-dev
  - jazzy-alpine3.24-dev
  - jazzy-20260618-alpine-dev
  - jazzy-ros-base-alpine-dev
  - jazzy-20260618-alpine3.24-dev
  - jazzy-ros-base-alpine3.24-dev
platforms:
  - linux/amd64
  - linux/arm64
dates:
  release: "2024-05-23"
vars:
  ROS_DISTRO: jazzy
  ROS_PACKAGE: ros-jazzy
  ROS_SYNC_VERSION: "20260618"
  VERSION: 20260618-r0
contents:
  repositories:
    - https://dhi.io/apk/alpine/v3.24/main
    - https://dl-cdn.alpinelinux.org/alpine/v3.24/main
    - https://dl-cdn.alpinelinux.org/alpine/v3.24/community
