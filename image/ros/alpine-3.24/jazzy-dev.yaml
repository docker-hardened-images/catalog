    - https://dhi.io/keyring/dhi-apk@docker-0F81AD7700D99184.rsa.pub
  packages:
    - alpine-baselayout-data
    - apk-tools
    - asio-dev
    - bash
    - build-base
    - bullet-dev
    - busybox
    - ca-certificates
    - ca-certificates-bundle
    - cmake
    - coreutils
    - cppcheck
    - eigen-dev
    - findutils
    - fmt-dev
    - git~2.54.1
    - graphviz
    - libcrypto3
    - libgcc
    - libssl3
    - libstdc++
    - libxml2-utils
    - lttng-ust
    - lttng-ust-dev
    - lz4-dev
    - lz4-libs
    - musl
    - openssl-dev
    - py3-argcomplete
    - py3-coverage
    - py3-cryptography
    - py3-dateutil
    - py3-distlib
    - py3-distro
    - py3-docutils
    - py3-flake8
    - py3-iniconfig
    - py3-lark-parser
    - py3-lxml
    - py3-notify2
    - py3-numpy
