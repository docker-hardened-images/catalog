# syntax=dhi.io/build:2-debian13

name: Memcached 1.x
image: dhi.io/memcached
variant: runtime
tags:
  - "1"
  - "1.6"
  - 1.6.45
  - 1-debian
  - 1-debian13
  - 1.6-debian
  - 1.6-debian13
  - 1.6.45-debian
  - 1.6.45-debian13
platforms:
  - linux/amd64
  - linux/arm64
dates:
  release: "2020-03-08"
vars:
  FLAVORED_SUFFIX: ""
  SEMVER_MAJOR_MINOR_VERSION: "1.6"
  SEMVER_MAJOR_VERSION: "1"
  SEMVER_VERSION: 1.6.45
  SUFFIX: ""
  VERSION: 1.6.45-0
contents:
  repositories:
    - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
  keyring:
    - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
  packages:
    - '!dpkg'
    - '!gawk'
    - '!install-info'
    - '!libelogind0'
    - '!libmpfr6'
    - '!libreadline8t64'
    - '!libsigsegv'
    - '!libsigsegv2'
    - '!mawk'
    - '!mpfr4'
    - '!original-awk'
    - '!readline-common'
    - '!tar'
    - '!texinfo'
    - base-files
    - ca-certificates-bundle
    - libevent-2.1-7t64
    - libsasl2-2
    - libsasl2-modules
    - libssl3t64
    - memcached=1.6.45-0
    - tzdata
accounts:
  run-as: memcached
  users:
    - name: memcached
      uid: 11211
      gid: 11211
  groups:
    - name: memcached
      gid: 11211
      members:
        - memcached
os-release:
  name: Docker Hardened Images (Debian)
  id: debian
  version-id: "13"
  version-codename: trixie
  pretty-name: Docker Hardened Images/Debian GNU/Linux 13 (trixie)
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
environment:
  MEMCACHED_VERSION: 1.6.45
  PATH: /opt/memcached/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
paths:
  - type: directory
    path: /opt/memcached/bin
    uid: 11211
    gid: 11211
    mode: "0755"
  - type: symlink
    path: /opt/memcached/bin/memcached
    uid: 0
    gid: 0
    source: /usr/bin/memcached
annotations:
  org.opencontainers.image.description: A minimal Memcached image
  org.opencontainers.image.licenses: BSD-3-Clause
entrypoint:
  - memcached
ports:
  - 11211/tcp
