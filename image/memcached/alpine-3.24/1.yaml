# syntax=dhi.io/build:2-alpine3.24

name: Memcached 1.x
image: dhi.io/memcached
variant: runtime
tags:
  - 1-alpine
  - 1.6-alpine
  - 1-alpine3.24
  - 1.6.42-alpine
  - 1.6-alpine3.24
  - 1.6.42-alpine3.24
platforms:
  - linux/amd64
  - linux/arm64
dates:
  release: "2020-03-08"
vars:
  FLAVORED_SUFFIX: ""
  SEMVER_MAJOR_MINOR_VERSION: "1.6"
  SEMVER_MAJOR_VERSION: "1"
  SEMVER_VERSION: 1.6.42
  SUFFIX: ""
  VERSION: 1.6.42-r0
contents:
  repositories:
    - https://dhi.io/apk/alpine/v3.24/main
    - https://dl-cdn.alpinelinux.org/alpine/v3.24/main
    - https://dl-cdn.alpinelinux.org/alpine/v3.24/community
  keyring:
    - https://dhi.io/keyring/dhi-apk@docker-0F81AD7700D99184.rsa.pub
  packages:
    - alpine-baselayout-data
    - ca-certificates-bundle
    - libevent
    - libsasl
    - libssl3
    - memcached=1.6.42-r0
    - tzdata
accounts:
  run-as: memcached
  users:
    - name: memcached
      uid: 11211
      gid: 11211
  groups:
    - name: memcached
      gid: 11211
      members:
        - memcached
os-release:
  name: Docker Hardened Images (Alpine)
  id: alpine
  version-id: "3.24"
  pretty-name: Docker Hardened Images/Alpine Linux v3.24
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
environment:
  MEMCACHED_VERSION: 1.6.42
  PATH: /opt/memcached/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
paths:
  - type: directory
    path: /opt/memcached/bin
    uid: 11211
    gid: 11211
    mode: "0755"
  - type: symlink
    path: /opt/memcached/bin/memcached
    uid: 0
    gid: 0
    source: /usr/bin/memcached
annotations:
  org.opencontainers.image.description: A minimal Memcached image
  org.opencontainers.image.licenses: BSD-3-Clause
entrypoint:
  - memcached
ports:
  - 11211/tcp
