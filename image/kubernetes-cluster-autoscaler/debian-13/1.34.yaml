# syntax=dhi.io/build:2-debian13

name: Kubernetes Cluster Autoscaler 1.34.x
image: dhi.io/kubernetes-cluster-autoscaler
variant: runtime
tags:
  - "1.34"
  - 1.34.5
  - 1.34-debian
  - 1.34-debian13
  - 1.34.5-debian
  - 1.34.5-debian13
platforms:
  - linux/amd64
  - linux/arm64
dates:
  release: "2025-08-27"
  end-of-life: "2026-10-27"
vars:
  FLAVORED_SUFFIX: ""
  SEMVER_MAJOR_MINOR_VERSION: "1.34"
  SEMVER_MAJOR_VERSION: "1"
  SEMVER_VERSION: 1.34.5
  SUFFIX: ""
  VERSION: 1.34.5-4
contents:
  repositories:
    - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
  keyring:
    - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
  packages:
    - base-files
    - ca-certificates-bundle
    - kubernetes-cluster-autoscaler-1.34=1.34.5-4
    - tzdata
accounts:
  run-as: nonroot
  users:
    - name: nonroot
      uid: 65532
      gid: 65532
  groups:
    - name: nonroot
      gid: 65532
      members:
        - nonroot
os-release:
  name: Docker Hardened Images (Debian)
  id: debian
  version-id: "13"
  version-codename: trixie
  pretty-name: Docker Hardened Images/Debian GNU/Linux 13 (trixie)
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
paths:
  - type: symlink
    path: /cluster-autoscaler
    uid: 0
    gid: 0
    source: /usr/bin/cluster-autoscaler
annotations:
  org.opencontainers.image.description: A minimal Kubernetes Cluster Autoscaler image
  org.opencontainers.image.licenses: Apache-2.0
entrypoint:
  - /cluster-autoscaler
