# syntax=dhi.io/build:2-alpine3.23

name: Centrifugo 6.x
image: dhi.io/centrifugo
variant: runtime
tags:
  - 6-alpine
  - 6.9-alpine
  - 6-alpine3.24
  - 6.9.7-alpine
  - 6.9-alpine3.24
  - 6.9.7-alpine3.24
platforms:
  - linux/amd64
  - linux/arm64
dates:
  release: "2025-01-16"
vars:
  FLAVORED_SUFFIX: ""
  SEMVER_MAJOR_MINOR_VERSION: "6.9"
  SEMVER_MAJOR_VERSION: "6"
  SEMVER_VERSION: 6.9.7
  SUFFIX: ""
  VERSION: 6.9.7-r2
contents:
  repositories:
    - https://dhi.io/apk/alpine/v3.24/main
    - https://dl-cdn.alpinelinux.org/alpine/v3.24/main
    - https://dl-cdn.alpinelinux.org/alpine/v3.24/community
  keyring:
    - https://dhi.io/keyring/dhi-apk@docker-0F81AD7700D99184.rsa.pub
  packages:
    - alpine-baselayout-data
    - ca-certificates-bundle
    - centrifugo=6.9.7-r2
    - tzdata
accounts:
  run-as: nonroot
  users:
    - name: nonroot
      uid: 65532
      gid: 65532
  groups:
    - name: nonroot
      gid: 65532
      members:
        - nonroot
os-release:
  name: Docker Hardened Images (Alpine)
  id: alpine
  version-id: "3.24"
  pretty-name: Docker Hardened Images/Alpine Linux v3.24
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
work-dir: /centrifugo
paths:
  - type: directory
    path: /usr/local/bin
    uid: 0
    gid: 0
  - type: symlink
    path: /usr/local/bin/centrifugo
    uid: 0
    gid: 0
    source: /usr/bin/centrifugo
  - type: directory
    path: /centrifugo
    uid: 65532
    gid: 65532
    mode: "0755"
annotations:
  org.opencontainers.image.description: A minimal Centrifugo real-time messaging server image
  org.opencontainers.image.licenses: Apache-2.0
entrypoint:
  - /usr/local/bin/centrifugo
ports:
  - 8000/tcp
