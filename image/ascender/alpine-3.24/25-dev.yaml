# syntax=dhi.io/build:2-alpine3.24

name: Ascender 25.x (dev)
image: dhi.io/ascender
variant: dev
tags:
  - 25-alpine-dev
  - 25.6-alpine-dev
  - 25-alpine3.24-dev
  - 25.6.3-alpine-dev
  - 25.6-alpine3.24-dev
  - 25.6.3-alpine3.24-dev
platforms:
  - linux/amd64
  - linux/arm64
dates:
  release: "2025-04-10"
vars:
  GIT_VERSION: 2.54.1-r0
  SEMVER_MAJOR_MINOR_VERSION: "25.6"
  SEMVER_MAJOR_VERSION: "25"
  SEMVER_VERSION: 25.6.3
  VERSION: 25.6.3-r2
contents:
  repositories:
    - https://dhi.io/apk/alpine/v3.24/main
    - https://dl-cdn.alpinelinux.org/alpine/v3.24/main
    - https://dl-cdn.alpinelinux.org/alpine/v3.24/community
  keyring:
    - https://dhi.io/keyring/dhi-apk@docker-0F81AD7700D99184.rsa.pub
  packages:
    - alpine-baselayout-data
    - apk-tools
    - ascender-25=25.6.3-r2
    - bash
    - busybox
    - busybox-binsh
    - ca-certificates
    - ca-certificates-bundle
    - coreutils
    - dumb-init
    - gawk
    - git=2.54.1-r0
    - grep
    - krb5-libs
    - libcrypto3
    - libffi
    - libgcc
    - libldap
    - libpq
    - libsasl
    - libsodium
    - libssl3
    - libstdc++
    - libuuid
    - libxml2
    - libxslt
    - nginx-mainline
    - pcre2
    - python-3.12
    - rsyslog
    - rsyslog-http
    - sed
    - tzdata
    - xmlsec
    - yaml
    - zlib
  builds:
    - name: state-directories
      contents:
        packages:
          - bash
          - busybox
      pipeline:
        - name: create the state directories
          runs: |
            set -eux -o pipefail

            install -d -o 1000 -g 0 -m 0770 \
              ${target.dir}/var/lib/awx \
              ${target.dir}/var/lib/awx/projects \
              ${target.dir}/var/lib/awx/job_status \
              ${target.dir}/var/lib/awx/rsyslog \
              ${target.dir}/var/lib/awx/rsyslog/conf.d \
              ${target.dir}/var/lib/nginx \
              ${target.dir}/var/lib/nginx/tmp \
              ${target.dir}/var/log/tower \
              ${target.dir}/var/log/nginx \
              ${target.dir}/run/supervisor \
              ${target.dir}/run/awx-rsyslog \
              ${target.dir}/run/awx-receptor \
              ${target.dir}/etc/receptor
            install -d -o 0 -g 0 -m 0755 \
              ${target.dir}/var/lib/awx/.local \
              ${target.dir}/var/lib/awx/.local/share
            install -d -o 1000 -g 0 -m 0770 ${target.dir}/var/lib/awx/.local/share/containers
      outputs:
        - source: ${target.dir}/var/lib
          target: /var/lib
          uid: 0
          gid: 0
        - source: ${target.dir}/var/log
          target: /var/log
          uid: 0
          gid: 0
        - source: ${target.dir}/run
          target: /run
          uid: 0
          gid: 0
        - source: ${target.dir}/etc
          target: /etc
          uid: 0
          gid: 0
accounts:
  root: true
  run-as: root
  users:
    - name: awx
      uid: 1000
      gid: 0
  groups:
    - name: root
      gid: 0
      members:
        - awx
os-release:
  name: Docker Hardened Images (Alpine)
  id: alpine
  version-id: "3.24"
  pretty-name: Docker Hardened Images/Alpine Linux v3.24
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
environment:
  AWX_LOGGING_MODE: stdout
  HOME: /var/lib/awx
  LANG: en_US.UTF-8
  LANGUAGE: en_US:en
  LC_ALL: en_US.UTF-8
paths:
  - type: directory
    path: /usr/local/bin
    uid: 0
    gid: 0
    mode: "0755"
  - type: symlink
    path: /usr/local/bin/dumb-init
    uid: 0
    gid: 0
    source: /usr/bin/dumb-init
  - type: symlink
    path: /usr/local/bin/supervisord
    uid: 0
    gid: 0
    source: /usr/bin/supervisord
  - type: symlink
    path: /usr/local/bin/supervisorctl
    uid: 0
    gid: 0
    source: /usr/bin/supervisorctl
  - type: symlink
    path: /usr/local/bin/wait-for-migrations
    uid: 0
    gid: 0
    source: /usr/bin/wait-for-migrations
  - type: symlink
    path: /usr/local/bin/stop-supervisor
    uid: 0
    gid: 0
    source: /usr/bin/stop-supervisor
  - type: symlink
    path: /var/log/nginx/access.log
    uid: 0
    gid: 0
    source: /dev/stdout
  - type: symlink
    path: /var/log/nginx/error.log
    uid: 0
    gid: 0
    source: /dev/stderr
  - type: directory
    path: /etc/pki/tls/certs
    uid: 0
    gid: 0
  - type: directory
    path: /etc/pki/ca-trust/extracted/pem
    uid: 0
    gid: 0
  - type: symlink
    path: /etc/pki/ca-trust/extracted/pem/tls-ca-bundle.pem
    uid: 0
    gid: 0
    source: /etc/ssl/certs/ca-certificates.crt
  - type: symlink
    path: /etc/pki/tls/certs/ca-bundle.crt
    uid: 0
    gid: 0
    source: /etc/pki/ca-trust/extracted/pem/tls-ca-bundle.pem
annotations:
  org.opencontainers.image.description: A minimal Ascender image
  org.opencontainers.image.licenses: Apache-2.0
entrypoint:
  - /usr/local/bin/dumb-init
  - --
ports:
  - 8052/tcp
