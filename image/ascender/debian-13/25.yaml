# syntax=dhi.io/build:2-debian13

name: Ascender 25.x
image: dhi.io/ascender
variant: runtime
tags:
  - "25"
  - "25.6"
  - 25.6.3
  - 25-debian
  - 25-debian13
  - 25.6-debian
  - 25.6-debian13
  - 25.6.3-debian
  - 25.6.3-debian13
platforms:
  - linux/amd64
  - linux/arm64
dates:
  release: "2025-04-10"
vars:
  SEMVER_MAJOR_MINOR_VERSION: "25.6"
  SEMVER_MAJOR_VERSION: "25"
  SEMVER_VERSION: 25.6.3
  VERSION: 25.6.3-6
contents:
  repositories:
    - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
  keyring:
    - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
  packages:
    - ascender-25=25.6.3-6
    - base-files
    - bash
    - ca-certificates-bundle
    - coreutils
    - dash
    - dumb-init
    - git
    - grep
    - libc6
    - libcap2
    - libcrypt1
    - libcurl4t64
    - libdouble-conversion3
    - libffi8
    - libgcc-s1
    - libgssapi-krb5-2
    - libkrb5-3
    - libldap2
    - libpcre2-8-0
    - libpq5
    - libpython-3.12
    - libsasl2-2
    - libssl3t64
    - libstdc++6
    - libsystemd0
    - libuuid1
    - libxml2
    - libxmlsec1t64
    - libxmlsec1t64-openssl
    - libxslt1.1
    - libyaml-0-2
    - libzstd1
    - mawk
    - nginx-mainline
    - python-3.12
    - sed
    - tzdata
    - zlib1g
  builds:
    - name: state-directories
      contents:
        packages:
          - bash
          - coreutils
      pipeline:
        - name: create the state directories
          runs: |
            set -eux -o pipefail

            install -d -o 1000 -g 0 -m 0770 \
              ${target.dir}/var/lib/awx \
              ${target.dir}/var/lib/awx/projects \
              ${target.dir}/var/lib/awx/job_status \
              ${target.dir}/var/lib/awx/rsyslog \
              ${target.dir}/var/lib/awx/rsyslog/conf.d \
              ${target.dir}/var/lib/nginx \
              ${target.dir}/var/log/tower \
              ${target.dir}/var/log/nginx \
              ${target.dir}/var/cache/nginx \
              ${target.dir}/run/supervisor \
              ${target.dir}/run/awx-rsyslog \
              ${target.dir}/run/awx-receptor \
              ${target.dir}/etc/receptor
            install -d -o 0 -g 0 -m 0755 \
              ${target.dir}/var/lib/awx/.local \
              ${target.dir}/var/lib/awx/.local/share
            install -d -o 1000 -g 0 -m 0770 ${target.dir}/var/lib/awx/.local/share/containers
      outputs:
        - source: ${target.dir}/var/lib
          target: /var/lib
          uid: 0
          gid: 0
        - source: ${target.dir}/var/log
          target: /var/log
          uid: 0
          gid: 0
        - source: ${target.dir}/var/cache
          target: /var/cache
          uid: 0
          gid: 0
        - source: ${target.dir}/run
          target: /run
          uid: 0
          gid: 0
        - source: ${target.dir}/etc
          target: /etc
          uid: 0
          gid: 0
    - name: locale
      contents:
        packages:
          - bash
          - locales
          - coreutils
          - gzip
      pipeline:
        - name: install locales
          runs: |
            set -eux -o pipefail

            ln -s /etc/locale.alias /usr/share/locale/locale.alias

            echo "en_US.UTF-8 UTF-8" >> /etc/locale.gen
            locale-gen en_US.UTF-8
      outputs:
        - source: /usr/share/locale
          target: /usr/share/locale
          uid: 0
          gid: 0
        - source: /usr/lib/locale
          target: /usr/lib/locale
          uid: 0
          gid: 0
accounts:
  run-as: awx
  users:
    - name: awx
      uid: 1000
      gid: 0
  groups:
    - name: root
      gid: 0
      members:
        - awx
os-release:
  name: Docker Hardened Images (Debian)
  id: debian
  version-id: "13"
  version-codename: trixie
  pretty-name: Docker Hardened Images/Debian GNU/Linux 13 (trixie)
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
environment:
  AWX_LOGGING_MODE: stdout
  HOME: /var/lib/awx
  LANG: en_US.UTF-8
  LANGUAGE: en_US:en
  LC_ALL: en_US.UTF-8
  SSL_CERT_FILE: /etc/ssl/certs/ca-certificates.crt
paths:
  - type: directory
    path: /usr/local/bin
    uid: 0
    gid: 0
    mode: "0755"
  - type: symlink
    path: /usr/local/bin/dumb-init
    uid: 0
    gid: 0
    source: /usr/bin/dumb-init
  - type: symlink
    path: /usr/local/bin/supervisord
    uid: 0
    gid: 0
    source: /usr/bin/supervisord
  - type: symlink
    path: /usr/local/bin/supervisorctl
    uid: 0
    gid: 0
    source: /usr/bin/supervisorctl
  - type: symlink
    path: /usr/local/bin/wait-for-migrations
    uid: 0
    gid: 0
    source: /usr/bin/wait-for-migrations
  - type: symlink
    path: /usr/local/bin/stop-supervisor
    uid: 0
    gid: 0
    source: /usr/bin/stop-supervisor
  - type: symlink
    path: /var/log/nginx/access.log
    uid: 0
    gid: 0
    source: /dev/stdout
  - type: symlink
    path: /var/log/nginx/error.log
    uid: 0
    gid: 0
    source: /dev/stderr
  - type: delete
    path: /etc/nginx/conf.d/default.conf
    uid: 0
    gid: 0
  - type: directory
    path: /etc/pki/tls/certs
    uid: 0
    gid: 0
  - type: directory
    path: /etc/pki/ca-trust/extracted/pem
    uid: 0
    gid: 0
  - type: symlink
    path: /etc/pki/ca-trust/extracted/pem/tls-ca-bundle.pem
    uid: 0
    gid: 0
    source: /etc/ssl/certs/ca-certificates.crt
  - type: symlink
    path: /etc/pki/tls/certs/ca-bundle.crt
    uid: 0
    gid: 0
    source: /etc/pki/ca-trust/extracted/pem/tls-ca-bundle.pem
annotations:
  org.opencontainers.image.description: A minimal Ascender image
  org.opencontainers.image.licenses: Apache-2.0
entrypoint:
  - /usr/local/bin/dumb-init
  - --
ports:
  - 8052/tcp
