# syntax=dhi.io/build:2-debian13

name: Kaniko 1.x (dev)
image: dhi.io/kaniko
variant: dev
tags:
  - 1-dev
  - 1.25-dev
  - 1.25.23-dev
  - 1-debian-dev
  - 1-debian13-dev
  - 1.25-debian-dev
  - 1.25-debian13-dev
  - 1.25.23-debian-dev
  - 1.25.23-debian13-dev
platforms:
  - linux/amd64
  - linux/arm64
dates:
  release: "2020-08-18"
vars:
  DEBIAN_EPOCH_MAJOR_MINOR_VERSION: "1.25"
  DEBIAN_EPOCH_MAJOR_VERSION: "1"
  DEBIAN_EPOCH_VERSION: 1.25.23
  FLAVORED_SUFFIX: -dev
  SUFFIX: -dev
  VERSION: 1.25.23-0
contents:
  repositories:
    - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
  keyring:
    - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
  packages:
    - '!gawk'
    - '!libelogind0'
    - '!mawk'
    - '!original-awk'
    - apt
    - base-files
    - bash
    - ca-certificates-bundle
    - coreutils
    - diffutils
    - dpkg
    - findutils
    - grep
    - kaniko-1-dev=1.25.23-0
    - kaniko-warmer-1-dev=1.25.23-0
    - libc-bin
    - mawk
    - perl-base
    - sed
    - tzdata
    - util-linux
  builds:
    - name: kaniko-root
      contents:
        packages:
          - bash
          - ca-certificates-bundle
          - coreutils
          - grep
      pipeline:
        - name: create /kaniko
          runs: |
            set -eux -o pipefail

            install -d -m 1777 /out/rootfs/kaniko
            test "$(stat -c %a /out/rootfs/kaniko)" = 1777
        - name: check CA bundle
          runs: |
            set -eux -o pipefail

            test -f /etc/ssl/certs/ca-certificates.crt
            test ! -L /etc/ssl/certs/ca-certificates.crt
            grep -q 'BEGIN CERTIFICATE' /etc/ssl/certs/ca-certificates.crt
      outputs:
        - source: /out/rootfs/
          target: /
          uid: 0
          gid: 0
        - source: /etc/ssl/certs/ca-certificates.crt
          target: /kaniko/ssl/certs/ca-certificates.crt
          uid: 0
          gid: 0
          mode: "0644"
    - name: locale
      contents:
        packages:
          - bash
          - locales
          - coreutils
          - gzip
      pipeline:
        - name: install locales
          runs: |
            set -eux -o pipefail

            ln -s /etc/locale.alias /usr/share/locale/locale.alias

            echo "en_US.UTF-8 UTF-8" >> /etc/locale.gen
            locale-gen en_US.UTF-8
      outputs:
        - source: /usr/share/locale
          target: /usr/share/locale
          uid: 0
          gid: 0
        - source: /usr/lib/locale
          target: /usr/lib/locale
          uid: 0
          gid: 0
accounts:
  root: true
  run-as: root
  users:
    - name: nonroot
      uid: 65532
      gid: 65532
    - name: _apt
      uid: 42
      gid: 65532
  groups:
    - name: nonroot
      gid: 65532
      members:
        - nonroot
os-release:
  name: Docker Hardened Images (Debian)
  id: debian
  version-id: "13"
  version-codename: trixie
  pretty-name: Docker Hardened Images/Debian GNU/Linux 13 (trixie)
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
work-dir: /workspace
environment:
  DEBIAN_FRONTEND: noninteractive
  DOCKER_CONFIG: /kaniko/.docker/
  DOCKER_CREDENTIAL_GCR_CONFIG: /kaniko/.config/gcloud/docker_credential_gcr_config.json
  HOME: /root
  LANG: en_US.UTF-8
  LANGUAGE: en_US:en
  LC_ALL: en_US.UTF-8
  PATH: /usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin:/kaniko
  SSL_CERT_DIR: /kaniko/ssl/certs
  USER: root
paths:
  - type: directory
    path: /kaniko/.docker
    uid: 0
    gid: 0
    mode: "0755"
  - type: directory
    path: /kaniko/ssl
    uid: 0
    gid: 0
    mode: "0755"
  - type: directory
    path: /kaniko/ssl/certs
    uid: 0
    gid: 0
    mode: "0755"
  - type: directory
    path: /workspace
    uid: 0
    gid: 0
    mode: "0755"
annotations:
  org.opencontainers.image.description: A minimal Kaniko image
  org.opencontainers.image.licenses: Apache-2.0
entrypoint:
  - /kaniko/executor
