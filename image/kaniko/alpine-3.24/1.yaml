# syntax=dhi.io/build:2-alpine3.24

name: Kaniko 1.x
image: dhi.io/kaniko
variant: runtime
tags:
  - 1-alpine
  - 1.25-alpine
  - 1-alpine3.24
  - 1.25.24-alpine
  - 1.25-alpine3.24
  - 1.25.24-alpine3.24
platforms:
  - linux/amd64
  - linux/arm64
dates:
  release: "2020-08-18"
vars:
  APK_MAJOR_MINOR_VERSION: "1.25"
  APK_MAJOR_VERSION: "1"
  APK_VERSION: 1.25.24
  FLAVORED_SUFFIX: ""
  SUFFIX: ""
  VERSION: 1.25.24-r0
contents:
  repositories:
    - https://dhi.io/apk/alpine/v3.24/main
    - https://dl-cdn.alpinelinux.org/alpine/v3.24/main
    - https://dl-cdn.alpinelinux.org/alpine/v3.24/community
  keyring:
    - https://dhi.io/keyring/dhi-apk@docker-0F81AD7700D99184.rsa.pub
  packages:
    - alpine-baselayout-data
    - ca-certificates-bundle
    - kaniko-1=1.25.24-r0
    - tzdata
  builds:
    - name: kaniko-root
      contents:
        packages:
          - busybox
          - ca-certificates-bundle
      pipeline:
        - name: create /kaniko
          runs: |
            set -eux -o pipefail

            install -d -m 1777 /out/rootfs/kaniko
            test "$(stat -c %a /out/rootfs/kaniko)" = 1777
        - name: check CA bundle
          runs: |
            set -eux -o pipefail

            test -f /etc/ssl/certs/ca-certificates.crt
            test ! -L /etc/ssl/certs/ca-certificates.crt
            grep -q 'BEGIN CERTIFICATE' /etc/ssl/certs/ca-certificates.crt
      outputs:
        - source: /out/rootfs/
          target: /
          uid: 0
          gid: 0
        - source: /etc/ssl/certs/ca-certificates.crt
          target: /kaniko/ssl/certs/ca-certificates.crt
          uid: 0
          gid: 0
          mode: "0644"
accounts:
  root: true
  run-as: root
  users:
    - name: nonroot
      uid: 65532
      gid: 65532
  groups:
    - name: nonroot
      gid: 65532
      members:
        - nonroot
os-release:
  name: Docker Hardened Images (Alpine)
  id: alpine
  version-id: "3.24"
  pretty-name: Docker Hardened Images/Alpine Linux v3.24
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
work-dir: /workspace
environment:
  DOCKER_CONFIG: /kaniko/.docker/
  DOCKER_CREDENTIAL_GCR_CONFIG: /kaniko/.config/gcloud/docker_credential_gcr_config.json
  HOME: /root
  PATH: /usr/local/bin:/kaniko
  SSL_CERT_DIR: /kaniko/ssl/certs
  USER: root
paths:
  - type: directory
    path: /kaniko/.docker
    uid: 0
    gid: 0
    mode: "0755"
  - type: directory
    path: /kaniko/ssl
    uid: 0
    gid: 0
    mode: "0755"
  - type: directory
    path: /kaniko/ssl/certs
    uid: 0
    gid: 0
    mode: "0755"
  - type: directory
    path: /workspace
    uid: 0
    gid: 0
    mode: "0755"
annotations:
  org.opencontainers.image.description: A minimal Kaniko image
  org.opencontainers.image.licenses: Apache-2.0
entrypoint:
  - /kaniko/executor
