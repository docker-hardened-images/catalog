# syntax=dhi.io/build:2-debian13

name: GitHub MCP Server 1.x
image: dhi.io/github-mcp
variant: runtime
tags:
  - "1"
  - "1.8"
  - 1.8.0
  - 1-debian
  - 1-debian13
  - 1.8-debian
  - 1.8-debian13
  - 1.8.0-debian
  - 1.8.0-debian13
platforms:
  - linux/amd64
  - linux/arm64
dates:
  release: "2026-04-16"
vars:
  SEMVER_MAJOR_MINOR_VERSION: "1.8"
  SEMVER_MAJOR_VERSION: "1"
  SEMVER_VERSION: 1.8.0
  VERSION: 1.8.0-0
contents:
  repositories:
    - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
  keyring:
    - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
  packages:
    - base-files
    - ca-certificates-bundle
    - github-mcp-server=1.8.0-0
    - tzdata
accounts:
  run-as: nonroot
  users:
    - name: nonroot
      uid: 65532
      gid: 65532
  groups:
    - name: nonroot
      gid: 65532
      members:
        - nonroot
os-release:
  name: Docker Hardened Images (Debian)
  id: debian
  version-id: "13"
  version-codename: trixie
  pretty-name: Docker Hardened Images/Debian GNU/Linux 13 (trixie)
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
paths:
  - type: directory
    path: /server
    uid: 0
    gid: 0
  - type: symlink
    path: /server/github-mcp-server
    uid: 0
    gid: 0
    source: /usr/bin/github-mcp-server
annotations:
  org.opencontainers.image.description: A minimal GitHub MCP Server image
  org.opencontainers.image.licenses: MIT
labels:
  io.modelcontextprotocol.server.name: io.github.github/github-mcp-server
entrypoint:
  - /server/github-mcp-server
cmd:
  - stdio
