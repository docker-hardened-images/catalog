# syntax=dhi.io/build:2-debian13

name: kube-state-metrics 2.x (dev)
image: dhi.io/kube-state-metrics
variant: dev
tags:
  - 2-dev
  - 2.20-dev
  - 2.20.0-dev
  - 2-debian-dev
  - 2-debian13-dev
  - 2.20-debian-dev
  - 2.20-debian13-dev
  - 2.20.0-debian-dev
  - 2.20.0-debian13-dev
platforms:
  - linux/amd64
  - linux/arm64
vars:
  FLAVORED_SUFFIX: -dev
  SEMVER_MAJOR_MINOR_VERSION: "2.20"
  SEMVER_MAJOR_VERSION: "2"
  SEMVER_VERSION: 2.20.0
  SUFFIX: -dev
  VERSION: 2.20.0-3
contents:
  repositories:
    - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
  keyring:
    - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
  packages:
    - '!gawk'
    - '!libelogind0'
    - '!original-awk'
    - apt
    - base-files
    - bash
    - ca-certificates
    - ca-certificates-bundle
    - coreutils
    - diffutils
    - dpkg
    - findutils
    - grep
    - kube-state-metrics-dev=2.20.0-3
    - libc-bin
    - mawk
    - perl-base
    - sed
    - tzdata
    - util-linux
accounts:
  root: true
  run-as: root
  users:
    - name: nonroot
      uid: 65532
      gid: 65532
    - name: _apt
      uid: 42
      gid: 65532
  groups:
    - name: nonroot
      gid: 65532
      members:
        - nonroot
os-release:
  name: Docker Hardened Images (Debian)
  id: debian
  version-id: "13"
  version-codename: trixie
  pretty-name: Docker Hardened Images/Debian GNU/Linux 13 (trixie)
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
environment:
  DEBIAN_FRONTEND: noninteractive
paths:
  - type: directory
    path: /usr/local/bin
    uid: 0
    gid: 0
    mode: "0755"
  - type: symlink
    path: /usr/local/bin/kube-state-metrics
    uid: 0
    gid: 0
    source: /usr/bin/kube-state-metrics
  - type: symlink
    path: /kube-state-metrics
    uid: 0
    gid: 0
    source: /usr/local/bin/kube-state-metrics
annotations:
  org.opencontainers.image.description: A minimal kube-state-metrics image
  org.opencontainers.image.licenses: Apache-2.0
entrypoint:
  - kube-state-metrics
  - --port=8080
  - --telemetry-port=8081
ports:
  - 8080/tcp
  - 8081/tcp
