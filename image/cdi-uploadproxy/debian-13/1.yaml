# syntax=dhi.io/build:2-debian13

name: CDI Upload Proxy 1.x
image: dhi.io/cdi-uploadproxy
variant: runtime
tags:
  - "1"
  - "1.66"
  - 1.66.1
  - 1-debian
  - 1-debian13
  - 1.66-debian
  - 1.66-debian13
  - 1.66.1-debian
  - 1.66.1-debian13
platforms:
  - linux/amd64
  - linux/arm64
dates:
  release: "2018-06-14"
vars:
  FLAVORED_SUFFIX: ""
  SEMVER_MAJOR_MINOR_VERSION: "1.66"
  SEMVER_MAJOR_VERSION: "1"
  SEMVER_VERSION: 1.66.1
  SUFFIX: ""
  VERSION: 1.66.1-9
contents:
  repositories:
    - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
  keyring:
    - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
  packages:
    - base-files
    - ca-certificates-bundle
    - cdi-uploadproxy=1.66.1-9
    - tzdata
accounts:
  run-as: "65532"
  users:
    - name: nonroot
      uid: 65532
      gid: 65532
  groups:
    - name: nonroot
      gid: 65532
      members:
        - nonroot
os-release:
  name: Docker Hardened Images (Debian)
  id: debian
  version-id: "13"
  version-codename: trixie
  pretty-name: Docker Hardened Images/Debian GNU/Linux 13 (trixie)
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
work-dir: /home/cdi-uploadproxy
paths:
  - type: directory
    path: /usr/local/bin
    uid: 0
    gid: 0
  - type: symlink
    path: /usr/local/bin/cdi-uploadproxy
    uid: 0
    gid: 0
    source: /usr/bin/cdi-uploadproxy
  - type: directory
    path: /home/cdi-uploadproxy
    uid: 0
    gid: 0
annotations:
  org.opencontainers.image.description: A minimal CDI Upload Proxy image
  org.opencontainers.image.licenses: Apache-2.0
entrypoint:
  - /usr/local/bin/cdi-uploadproxy
  - -alsologtostderr
ports:
  - 8443/tcp
