# syntax=dhi.io/build:2-debian13

name: Goldilocks 4.x
image: dhi.io/goldilocks
variant: runtime
tags:
  - "4"
  - "4.16"
  - 4.16.1
  - 4-debian
  - 4-debian13
  - 4.16-debian
  - 4.16-debian13
  - 4.16.1-debian
  - 4.16.1-debian13
platforms:
  - linux/amd64
  - linux/arm64
dates:
  release: "2026-01-21"
vars:
  FLAVORED_SUFFIX: ""
  SEMVER_MAJOR_MINOR_VERSION: "4.16"
  SEMVER_MAJOR_VERSION: "4"
  SEMVER_VERSION: 4.16.1
  SUFFIX: ""
  VERSION: 4.16.1-2
contents:
  repositories:
    - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
  keyring:
    - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
  packages:
    - base-files
    - ca-certificates-bundle
    - goldilocks=4.16.1-2
    - tzdata
accounts:
  run-as: "10324"
  users:
    - name: goldilocks
      uid: 10324
      gid: 10324
  groups:
    - name: goldilocks
      gid: 10324
      members:
        - goldilocks
os-release:
  name: Docker Hardened Images (Debian)
  id: debian
  version-id: "13"
  version-codename: trixie
  pretty-name: Docker Hardened Images/Debian GNU/Linux 13 (trixie)
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
paths:
  - type: directory
    path: /usr/local/bin
    uid: 0
    gid: 0
  - type: symlink
    path: /usr/local/bin/goldilocks
    uid: 0
    gid: 0
    source: /usr/bin/goldilocks
  - type: symlink
    path: /goldilocks
    uid: 0
    gid: 0
    source: /usr/local/bin/goldilocks
annotations:
  org.opencontainers.image.description: A minimal Goldilocks image
  org.opencontainers.image.licenses: Apache-2.0
cmd:
  - /goldilocks
ports:
  - 8080/tcp
