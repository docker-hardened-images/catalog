# syntax=dhi.io/build:2-debian13

name: Goldilocks 4.x (dev)
image: dhi.io/goldilocks
variant: dev
tags:
  - 4-dev
  - 4.16-dev
  - 4.16.1-dev
  - 4-debian-dev
  - 4-debian13-dev
  - 4.16-debian-dev
  - 4.16-debian13-dev
  - 4.16.1-debian-dev
  - 4.16.1-debian13-dev
platforms:
  - linux/amd64
  - linux/arm64
dates:
  release: "2026-01-21"
vars:
  FLAVORED_SUFFIX: -dev
  SEMVER_MAJOR_MINOR_VERSION: "4.16"
  SEMVER_MAJOR_VERSION: "4"
  SEMVER_VERSION: 4.16.1
  SUFFIX: -dev
  VERSION: 4.16.1-2
contents:
  repositories:
    - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
  keyring:
    - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
  packages:
    - '!gawk'
    - '!libelogind0'
    - '!original-awk'
    - apt
    - base-files
    - bash
    - ca-certificates
    - ca-certificates-bundle
    - coreutils
    - diffutils
    - dpkg
    - findutils
    - goldilocks-dev=4.16.1-2
    - grep
    - libc-bin
    - mawk
    - perl-base
    - sed
    - tzdata
    - util-linux
accounts:
  root: true
  run-as: root
  users:
    - name: goldilocks
      uid: 10324
      gid: 10324
    - name: _apt
      uid: 42
      gid: 65532
  groups:
    - name: goldilocks
      gid: 10324
      members:
        - goldilocks
os-release:
  name: Docker Hardened Images (Debian)
  id: debian
  version-id: "13"
  version-codename: trixie
  pretty-name: Docker Hardened Images/Debian GNU/Linux 13 (trixie)
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
environment:
  DEBIAN_FRONTEND: noninteractive
paths:
  - type: directory
    path: /usr/local/bin
    uid: 0
    gid: 0
  - type: symlink
    path: /usr/local/bin/goldilocks
    uid: 0
    gid: 0
    source: /usr/bin/goldilocks
  - type: symlink
    path: /goldilocks
    uid: 0
    gid: 0
    source: /usr/local/bin/goldilocks
annotations:
  org.opencontainers.image.description: A minimal Goldilocks image
  org.opencontainers.image.licenses: Apache-2.0
cmd:
  - /goldilocks
ports:
  - 8080/tcp
