# syntax=dhi.io/build:2-debian13

name: Homepage 2.x
image: dhi.io/homepage
variant: runtime
tags:
  - "2"
  - "2.7"
  - 2.7.0
  - 2-debian
  - 2-debian13
  - 2.7-debian
  - 2.7-debian13
  - 2.7.0-debian
  - 2.7.0-debian13
platforms:
  - linux/amd64
  - linux/arm64
dates:
  release: "2026-08-14"
vars:
  COMMIT_SHA: 2e5f10134ae3961bb936d3e7c441f9a1f4a4bf4f
  SEMVER_MAJOR_MINOR_VERSION: "2.7"
  SEMVER_MAJOR_VERSION: "2"
  SEMVER_VERSION: 2.7.0
  VERSION: 2.7.0
contents:
  repositories:
    - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
  keyring:
    - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
  packages:
    - base-files
    - bash
    - ca-certificates-bundle
    - coreutils
    - gosu
    - libc6
    - libgomp1
    - libstdc++6
    - netbase
    - nodejs-24
    - tzdata
  builds:
    - name: homepage
      work-dir: ${source.dir}/homepage
      caches:
        - path: /root/.local/share/pnpm
        - path: /root/.cache
      contents:
        packages:
          - base-files
          - bash
          - ca-certificates
          - coreutils
          - findutils
          - git
          - libc6
          - libstdc++6
          - mawk
          - nodejs-24
          - node-corepack
          - npm
          - sed
          - yarn-classic
          - yq
        files:
          - url: git+https://github.com/gethomepage/homepage.git#v2.7.0
            checksum: 2e5f10134ae3961bb936d3e7c441f9a1f4a4bf4f
            path: ${source.dir}/homepage
            spdx:
              name: homepage
              version: 2.7.0
              packages:
                - name: homepage
                  purl: pkg:dhi/homepage@2.7.0
                  license: GPL-3.0
            uid: 0
            gid: 0
      pipeline:
        - name: update entrypoint
          runs: |
            set -eux -o pipefail

            sed -i 's/su-exec/gosu/g' docker-entrypoint.sh
        - name: bump pnpm dependencies
          privileged: true
          runs: |
            set -eux -o pipefail

            corepack enable
            corepack prepare pnpm@latest --activate

            # CVE-2026-25896, CVE-2026-33036, CVE-2026-26278, CVE-2026-25128, CVE-2026-41650, CVE-2026-33349, CVE-2026-27942
            yq -Y -i '.overrides."gamedig>fast-xml-parser" = "5.7.0"' pnpm-workspace.yaml

            # CVE-2026-41305, CVE-2026-45623, GHSA-r28c-9q8g-f849, CVE-2026-69153
            yq -Y -i '.overrides."postcss@8.4.31" = "8.5.23"' pnpm-workspace.yaml

            # CVE-2025-54798, CVE-2026-44705, CVE-2026-49982
            yq -Y -i '.overrides."tmp" = "0.2.7"' pnpm-workspace.yaml

            # CVE-2026-45736, CVE-2026-48779
            yq -Y -i '.overrides."ws" = "8.21.0"' pnpm-workspace.yaml

            # CVE-2026-44291, CVE-2026-44293, CVE-2026-44289, CVE-2026-44290, CVE-2026-44288, CVE-2026-44292, CVE-2026-44294, CVE-2026-48712, CVE-2026-54269, CVE-2026-59877
            yq -Y -i '.overrides."protobufjs" = "7.6.5"' pnpm-workspace.yaml

            # CVE-2026-53655, CVE-2026-59873, CVE-2026-59874, CVE-2026-59871, CVE-2026-59875, GHSA-r292-9mhp-454m
            yq -Y -i '.overrides."tar" = "7.5.21"' pnpm-workspace.yaml

            # CVE-2026-53550, CVE-2026-59869, GHSA-5p4m-2wfm-xmqj
            # Homepage 2.1.2+ depends on js-yaml v5 (CORE_SCHEMA.withTags); a bare
            # js-yaml override downgrades v5 to 4.3.1 and breaks next build.
            yq -Y -i '.overrides."js-yaml@3" = "3.15.1"' pnpm-workspace.yaml
            yq -Y -i '.overrides."js-yaml@4" = "4.3.2"' pnpm-workspace.yaml

            # CVE-2026-67213
            yq -Y -i '.overrides."nanoid" = "3.3.18"' pnpm-workspace.yaml

            # CVE-2026-44288
            yq -Y -i '.overrides."@protobufjs/utf8" = "1.1.1"' pnpm-workspace.yaml

            # CVE-2026-44724, CVE-2026-50289
            yq -Y -i '.overrides."systeminformation" = "5.31.7"' pnpm-workspace.yaml

            # GHSA-f88m-g3jw-g9cj, GHSA-rgj7-g3m4-5g8c, GHSA-wq5f-xc86-pv6w
            yq -Y -i '.overrides."sharp" = "0.35.5"' pnpm-workspace.yaml

            # CVE-2026-45819
            yq -Y -i '.overrides."baseline-browser-mapping" = "2.11.0"' pnpm-workspace.yaml

            # CVE-2026-84373
            yq -Y -i '.overrides."vitest" = "4.1.11"' pnpm-workspace.yaml

            # CVE-2026-101910, CVE-2026-101911, CVE-2026-101912, CVE-2026-101913, CVE-2026-111997
            yq -Y -i '.overrides."ip-address" = "10.7.4"' pnpm-workspace.yaml

            # CVE-2026-101915, CVE-2026-101916
            yq -Y -i '.overrides."@grpc/grpc-js" = "1.14.5"' pnpm-workspace.yaml

            # CVE-2026-93748
            yq -Y -i '.overrides."http-cache-semantics" = "4.3.0"' pnpm-workspace.yaml

            # CVE-2026-93749
            yq -Y -i '.overrides."source-map-js" = "1.2.2"' pnpm-workspace.yaml

            # CVE-2026-111755, CVE-2026-111756
            yq -Y -i '.overrides."follow-redirects" = "1.16.1"' pnpm-workspace.yaml

            # CVE-2026-109841, CVE-2026-109869, CVE-2026-109924, CVE-2026-18149, CVE-2026-18540, CVE-2026-19534, CVE-2026-84890, CVE-2026-84933, CVE-2026-84947, CVE-2026-84961, CVE-2026-85008, CVE-2026-85014, CVE-2026-85024, CVE-2026-85152
            yq -Y -i '.overrides."undici" = "8.12.2"' pnpm-workspace.yaml

            # GHSA-2464-fhr4-w9xw, GHSA-673q-mjm6-r5xr, CVE-2026-94482, CVE-2026-44578, CVE-2026-44574, CVE-2026-45109, CVE-2026-44579, CVE-2026-44575, CVE-2026-44573, CVE-2026-44580, CVE-2026-44577, CVE-2026-44576, CVE-2026-44581, CVE-2026-44582, CVE-2026-44572, CVE-2026-64641, CVE-2026-64642, CVE-2026-64643, CVE-2026-64644, CVE-2026-64645, CVE-2026-64646, CVE-2026-64647, CVE-2026-64648, CVE-2026-64649, GHSA-2xp9-vwfh-vxw4, CVE-2026-75604, CVE-2026-94483, CVE-2026-94484, CVE-2026-94485, CVE-2026-94486, CVE-2026-94543, CVE-2026-94544, GHSA-vcvr-r3jv-pc5j
            pnpm up next@16.4.1

            pnpm up follow-redirects@1.16.1
        - name: build
          privileged: true
          runs: |
            set -eux -o pipefail

            pnpm install --prefer-offline \
              && NEXT_TELEMETRY_DISABLED=1 \
                NEXT_PUBLIC_BUILDTIME=$(date -u -d @${SOURCE_DATE_EPOCH} +'%FT%TZ') \
                NEXT_PUBLIC_VERSION=2.7.0 \
                NEXT_PUBLIC_REVISION=2e5f10134ae3961bb936d3e7c441f9a1f4a4bf4f \
                pnpm run build

            mkdir ${target.dir}/app
            cp -r ./.next/standalone/. ${target.dir}/app
            cp -r ./.next/static/. ${target.dir}/app/.next/static
            cp -r ./public/. ${target.dir}/app/public
      outputs:
        - source: ${target.dir}/app
          target: /app
          uid: 65532
          gid: 65532
        - source: ${source.dir}/homepage/docker-entrypoint.sh
          target: /usr/local/bin/docker-entrypoint.sh
          uid: 0
          gid: 0
          mode: "0755"
        - source: /opt/docker/sbom/homepage
          target: /opt/docker/sbom/homepage
          uid: 0
          gid: 0
accounts:
  run-as: nonroot
  users:
    - name: nonroot
      uid: 65532
      gid: 65532
  groups:
    - name: nonroot
      gid: 65532
      members:
        - nonroot
os-release:
  name: Docker Hardened Images (Debian)
  id: debian
  version-id: "13"
  version-codename: trixie
  pretty-name: Docker Hardened Images/Debian GNU/Linux 13 (trixie)
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
work-dir: /app
environment:
  HOSTNAME: '::'
  NODE_ENV: production
  PORT: "3000"
annotations:
  org.opencontainers.image.description: A minimal Homepage image
  org.opencontainers.image.licenses: Apache-2.0
entrypoint:
  - docker-entrypoint.sh
cmd:
  - node
  - server.js
ports:
  - 3000/tcp
