# syntax=dhi.io/build:2-debian13

name: Homepage 2.x
image: dhi.io/homepage
variant: runtime
tags:
  - "2"
  - "2.7"
  - 2.7.0
  - 2-debian
  - 2-debian13
  - 2.7-debian
  - 2.7-debian13
  - 2.7.0-debian
  - 2.7.0-debian13
platforms:
  - linux/amd64
  - linux/arm64
dates:
  release: "2026-08-14"
vars:
  SEMVER_MAJOR_MINOR_VERSION: "2.7"
  SEMVER_MAJOR_VERSION: "2"
  SEMVER_VERSION: 2.7.0
  VERSION: 2.7.0-3
contents:
  repositories:
    - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
  keyring:
    - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
  packages:
    - base-files
    - bash
    - ca-certificates-bundle
    - coreutils
    - gosu
    - homepage=2.7.0-3
    - netbase
    - nodejs-24
    - tzdata
accounts:
  run-as: nonroot
  users:
    - name: nonroot
      uid: 65532
      gid: 65532
  groups:
    - name: nonroot
      gid: 65532
      members:
        - nonroot
os-release:
  name: Docker Hardened Images (Debian)
  id: debian
  version-id: "13"
  version-codename: trixie
  pretty-name: Docker Hardened Images/Debian GNU/Linux 13 (trixie)
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
work-dir: /app
environment:
  HOSTNAME: '::'
  NODE_ENV: production
  PORT: "3000"
paths:
  - type: directory
    path: /usr/local/bin
    uid: 0
    gid: 0
  - type: symlink
    path: /usr/local/bin/docker-entrypoint.sh
    uid: 0
    gid: 0
    source: /usr/bin/docker-entrypoint.sh
  - type: symlink
    path: /app
    uid: 0
    gid: 0
    source: /usr/lib/homepage
  - type: directory
    path: /usr/lib/homepage/config
    uid: 65532
    gid: 65532
    mode: "0755"
annotations:
  org.opencontainers.image.description: A minimal Homepage image
  org.opencontainers.image.licenses: Apache-2.0
entrypoint:
  - docker-entrypoint.sh
cmd:
  - node
  - server.js
ports:
  - 3000/tcp
