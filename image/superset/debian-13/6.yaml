# syntax=dhi.io/build:2-debian13

name: Apache Superset 6.x
image: dhi.io/superset
variant: runtime
tags:
  - "6"
  - "6.1"
  - 6.1.0
  - 6-debian
  - 6-debian13
  - 6.1-debian
  - 6.1-debian13
  - 6.1.0-debian
  - 6.1.0-debian13
platforms:
  - linux/amd64
  - linux/arm64
dates:
  release: "2025-12-18"
vars:
  SEMVER_MAJOR_MINOR_VERSION: "6.1"
  SEMVER_MAJOR_VERSION: "6"
  SEMVER_VERSION: 6.1.0
  VERSION: 6.1.0-0
contents:
  repositories:
    - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
  keyring:
    - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
  packages:
    - base-files
    - ca-certificates
    - ca-certificates-bundle
    - dash
    - libecpg6
    - libldap2
    - libpq5
    - libsasl2-2
    - libsasl2-modules-gssapi-mit
    - libstdc++6
    - python-3.11
    - superset=6.1.0-0
    - tini
    - tzdata
accounts:
  run-as: nonroot
  users:
    - name: nonroot
      uid: 65532
      gid: 65532
  groups:
    - name: nonroot
      gid: 65532
      members:
        - nonroot
os-release:
  name: Docker Hardened Images (Debian)
  id: debian
  version-id: "13"
  version-codename: trixie
  pretty-name: Docker Hardened Images/Debian GNU/Linux 13 (trixie)
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
work-dir: /app
environment:
  FLASK_APP: superset.app:create_app()
  HOME: /app/superset_home
  PATH: /app/.venv/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
  PYTHONPATH: /app/pythonpath
  SUPERSET_ENV: production
  SUPERSET_HOME: /app/superset_home
  SUPERSET_PORT: "8088"
paths:
  - type: directory
    path: /app
    uid: 0
    gid: 0
  - type: symlink
    path: /app/.venv
    uid: 0
    gid: 0
    source: /usr/lib/superset/.venv
  - type: symlink
    path: /app/superset
    uid: 0
    gid: 0
    source: /usr/lib/superset/superset
  - type: symlink
    path: /app/superset-core
    uid: 0
    gid: 0
    source: /usr/lib/superset/superset-core
  - type: symlink
    path: /app/docker
    uid: 0
    gid: 0
    source: /usr/lib/superset/docker
  - type: symlink
    path: /app/superset-frontend
    uid: 0
    gid: 0
    source: /usr/lib/superset/superset-frontend
  - type: symlink
    path: /app/pyproject.toml
    uid: 0
    gid: 0
    source: /usr/lib/superset/pyproject.toml
  - type: symlink
    path: /app/setup.py
    uid: 0
    gid: 0
    source: /usr/lib/superset/setup.py
  - type: symlink
    path: /app/MANIFEST.in
    uid: 0
    gid: 0
    source: /usr/lib/superset/MANIFEST.in
  - type: symlink
    path: /app/README.md
    uid: 0
    gid: 0
    source: /usr/lib/superset/README.md
  - type: directory
    path: /usr/local/bin
    uid: 0
    gid: 0
  - type: symlink
    path: /usr/local/bin/run-server.sh
    uid: 0
    gid: 0
    source: /usr/bin/run-server.sh
  - type: directory
    path: /app/superset_home
    uid: 65532
    gid: 65532
    mode: "0770"
  - type: directory
    path: /app/pythonpath
    uid: 65532
    gid: 65532
    mode: "0770"
  - type: directory
    path: /app/data
    uid: 65532
    gid: 65532
    mode: "0770"
annotations:
  org.opencontainers.image.description: A minimal Apache Superset image
  org.opencontainers.image.licenses: Apache-2.0
entrypoint:
  - /usr/bin/tini
  - --
  - /usr/local/bin/run-server.sh
ports:
  - 8088/tcp
