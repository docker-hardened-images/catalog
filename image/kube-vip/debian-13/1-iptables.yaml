# syntax=dhi.io/build:2-debian13

name: kube-vip 1.x (iptables)
image: dhi.io/kube-vip
variant: runtime
flavor: iptables
tags:
  - 1-iptables
  - 1.2-iptables
  - 1.2.3-iptables
  - 1-debian-iptables
  - 1-debian13-iptables
  - 1.2-debian-iptables
  - 1.2-debian13-iptables
  - 1.2.3-debian-iptables
  - 1.2.3-debian13-iptables
platforms:
  - linux/amd64
  - linux/arm64
vars:
  FLAVORED_SUFFIX: -iptables
  SEMVER_MAJOR_MINOR_VERSION: "1.2"
  SEMVER_MAJOR_VERSION: "1"
  SEMVER_VERSION: 1.2.3
  SUFFIX: ""
  VERSION: 1.2.3-1
contents:
  repositories:
    - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
  keyring:
    - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
  packages:
    - base-files
    - ca-certificates-bundle
    - iptables
    - kube-vip=1.2.3-1
    - tzdata
accounts:
  run-as: nonroot
  users:
    - name: nonroot
      uid: 65532
      gid: 65532
  groups:
    - name: nonroot
      gid: 65532
      members:
        - nonroot
os-release:
  name: Docker Hardened Images (Debian)
  id: debian
  version-id: "13"
  version-codename: trixie
  pretty-name: Docker Hardened Images/Debian GNU/Linux 13 (trixie)
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
annotations:
  org.opencontainers.image.description: A minimal kube-vip image
  org.opencontainers.image.licenses: Apache-2.0
entrypoint:
  - /usr/bin/kube-vip
