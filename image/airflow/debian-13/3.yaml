# syntax=dhi.io/build:2-debian13

name: Airflow 3.x
image: dhi.io/airflow
variant: runtime
tags:
  - "3"
  - "3.3"
  - 3.3.2
  - 3-debian
  - 3-debian13
  - 3.3-debian
  - 3-python3.13
  - 3.3-debian13
  - 3.3.2-debian
  - 3.3-python3.13
  - 3.3.2-debian13
  - 3.3.2-python3.13
  - 3-python3.13-debian
  - 3-python3.13-debian13
  - 3.3-python3.13-debian
  - 3.3-python3.13-debian13
  - 3.3.2-python3.13-debian
  - 3.3.2-python3.13-debian13
platforms:
  - linux/amd64
  - linux/arm64
dates:
  release: "2025-04-22"
vars:
  COMMIT_SHA: aa19d2dbb9ed187ec01957a92848d9b005e9ba9d
  PYTHON_MAJOR_MINOR_VERSION: "3.13"
  SEMVER_MAJOR_MINOR_VERSION: "3.3"
  SEMVER_MAJOR_VERSION: "3"
  SEMVER_VERSION: 3.3.2
  VERSION: 3.3.2-3
contents:
  repositories:
    - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
  keyring:
    - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
  packages:
    - '!libelogind0'
    - '!mawk'
    - '!original-awk'
    - airflow=3.3.2-3
    - base-files
    - ca-certificates
    - ca-certificates-bundle
    - libc6
    - libffi8
    - libgcc-s1
    - libstdc++6
    - python-3.13
    - tzdata
accounts:
  run-as: airflow
  users:
    - name: airflow
      uid: 50000
      gid: 50000
  groups:
    - name: airflow
      gid: 50000
      members:
        - airflow
os-release:
  name: Docker Hardened Images (Debian)
  id: debian
  version-id: "13"
  version-codename: trixie
  pretty-name: Docker Hardened Images/Debian GNU/Linux 13 (trixie)
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
work-dir: /opt/airflow
environment:
  AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_PASSWORDS_FILE: /opt/airflow/auth/simple_auth_manager_passwords.json.generated
  AIRFLOW_HOME: /opt/airflow
  PATH: /opt/airflow/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
  PYTHONPATH: /opt/airflow/lib/python3.13/site-packages
paths:
  - type: symlink
    path: /opt/airflow
    uid: 0
    gid: 0
    source: /usr/lib/airflow
  - type: directory
    path: /usr/lib/airflow/auth
    uid: 50000
    gid: 50000
    mode: "0700"
  - type: directory
    path: /usr/lib/airflow/logs
    uid: 50000
    gid: 50000
    mode: "0755"
annotations:
  org.opencontainers.image.description: A minimal Airflow image
  org.opencontainers.image.licenses: Apache-2.0
entrypoint:
  - airflow
ports:
  - 8080/tcp
