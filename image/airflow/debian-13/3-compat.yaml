# syntax=dhi.io/build:2-debian13

name: Airflow 3.x (compat)
image: dhi.io/airflow
variant: runtime
flavor: compat
tags:
  - 3-compat
  - 3.3-compat
  - 3.3.0-compat
  - 3-debian-compat
  - 3-debian13-compat
  - 3.3-debian-compat
  - 3-python3.13-compat
  - 3.3-debian13-compat
  - 3.3.0-debian-compat
  - 3.3-python3.13-compat
  - 3.3.0-debian13-compat
  - 3.3.0-python3.13-compat
  - 3-python3.13-debian-compat
  - 3-python3.13-debian13-compat
  - 3.3-python3.13-debian-compat
  - 3.3-python3.13-debian13-compat
  - 3.3.0-python3.13-debian-compat
  - 3.3.0-python3.13-debian13-compat
platforms:
  - linux/amd64
  - linux/arm64
dates:
  release: "2025-04-22"
vars:
  COMMIT_SHA: 1438ea3587031417cc85d74323235cf087a058fb
  PYTHON_MAJOR_MINOR_VERSION: "3.13"
  SEMVER_MAJOR_MINOR_VERSION: "3.3"
  SEMVER_MAJOR_VERSION: "3"
  SEMVER_VERSION: 3.3.0
  VERSION: 3.3.0-1
contents:
  repositories:
    - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
  keyring:
    - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
  packages:
    - '!libelogind0'
    - '!mawk'
    - '!original-awk'
    - airflow=3.3.0-1
    - base-files
    - ca-certificates
    - ca-certificates-bundle
    - libc6
    - libffi8
    - libgcc-s1
    - libldap2
    - libmariadb3
    - libpq5
    - libsasl2-2
    - libstdc++6
    - libxml2
    - libxslt1.1
    - python-3.13
    - tzdata
    - unixodbc
  builds:
    - name: airflow compat providers
      environment:
        UV_NO_MANAGED_PYTHON: "true"
        UV_PYTHON_DOWNLOADS: never
      caches:
        - path: /root/.cache/pip
        - path: /root/.cache/uv
        - path: /root/.cargo
      contents:
        repositories:
          - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
        keyring:
          - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
        packages:
          - airflow=3.3.0-1
          - bash
          - build-essential
          - cargo-1.97
          - rustc-1.97
          - coreutils
          - diffutils
          - findutils
          - g++
          - gawk
          - gfortran
          - git
          - grep
          - libffi-dev
          - libldap2-dev
          - libmariadb-dev
          - libpq-dev
          - libsasl2-dev
          - libssl-dev
          - libstdc++6
          - libxml2-dev
          - libxslt1-dev
          - patchelf
          - pkg-config
          - python-3.13
          - python-3.13-dev
          - python3-pip
          - python3-setuptools
          - python3-wheel
          - sed
          - unixodbc-dev
        files:
          - url: git+https://github.com/apache/airflow.git#3.3.0
            checksum: 1438ea3587031417cc85d74323235cf087a058fb
            path: ${source.dir}/airflow
            spdx:
              name: airflow
              version: 3.3.0
              packages:
                - name: airflow
                  purl: pkg:dhi/airflow@3.3.0
                  license: Apache-2.0
            uid: 0
            gid: 0
          - url: https://raw.githubusercontent.com/apache/airflow/constraints-3.3.0/constraints-3.13.txt
            path: ${source.dir}/airflow/constraints.txt
            uid: 0
            gid: 0
          - url: https://repo1.maven.org/maven2/org/apache/logging/log4j/log4j-core/2.25.4/log4j-core-2.25.4.jar
            checksum: sha256:10fee2c0485d54fa44ee75d314f6295508f7b932281873db61a91b88073200e6
            path: ${source.dir}/log4j/log4j-core-2.25.4.jar
            uid: 0
            gid: 0
          - url: https://repo1.maven.org/maven2/org/apache/logging/log4j/log4j-api/2.25.4/log4j-api-2.25.4.jar
            checksum: sha256:c4b642a7f047275215de117e0e3847eb2c7711d84a0aa7433e7b3c096daf341d
            path: ${source.dir}/log4j/log4j-api-2.25.4.jar
            uid: 0
            gid: 0
          - url: https://repo1.maven.org/maven2/org/apache/logging/log4j/log4j-slf4j-impl/2.25.4/log4j-slf4j-impl-2.25.4.jar
            checksum: sha256:7ac68a0afcc83d54f48d116d79370a43f0a2a6b71b5c1d6dda943bb6a95ddbaa
            path: ${source.dir}/log4j/log4j-slf4j-impl-2.25.4.jar
            uid: 0
            gid: 0
          - url: https://repo1.maven.org/maven2/org/apache/logging/log4j/log4j-1.2-api/2.25.4/log4j-1.2-api-2.25.4.jar
            checksum: sha256:7b1a61507950ea67b3d6b11437ee37fad9db06f855c92c25c08aee074c757395
            path: ${source.dir}/log4j/log4j-1.2-api-2.25.4.jar
            uid: 0
            gid: 0
      pipeline:
        - name: install uv
          privileged: true
          runs: |
            set -eux -o pipefail

            pip install uv
        - name: edit constraints
          work-dir: ${source.dir}/airflow
          runs: |
            set -eux -o pipefail

            touch ./overrides.txt

            sed -i 's/Pygments==2\.19\.2/Pygments==2.20.0/' ./constraints.txt

            sed -i 's/^google-cloud-aiplatform==1\.148\.1/google-cloud-aiplatform==1.155.0/g' ./constraints.txt

            sed -i 's/litellm==1\.82\.6/litellm==1.85.4/' ./constraints.txt
            for pkg in importlib_metadata; do
              version=$(grep -i "^${pkg}==" ./constraints.txt | head -1 | sed 's/.*==//')
              if [ -n "$version" ]; then
                echo "${pkg}==${version}" >> ./overrides.txt
              fi
            done

            sed -i 's/^aiohttp==3\.14\.1/aiohttp==3.14.3/g' ./constraints.txt

            sed -i 's/Mako==1\.3\.11/Mako==1.3.12/' ./constraints.txt

            sed -i 's/urllib3==2\.6\.3/urllib3==2.7.0/' ./constraints.txt

            sed -i 's/Authlib==1\.6\.9/Authlib==1.6.12/' ./constraints.txt

            sed -i 's/joserfc==1\.6\.5/joserfc==1.6.8/' ./constraints.txt

            sed -i 's/GitPython==3\.1\.50/GitPython==3.1.57/' ./constraints.txt

            sed -i 's/pyasn1==0\.6\.3/pyasn1==0.6.4/' ./constraints.txt

            sed -i 's/idna==3\.11/idna==3.15/' ./constraints.txt

            sed -i 's/asyncssh==2\.22\.0/asyncssh==2.23.0/' ./constraints.txt

            sed -i 's/apache-airflow-providers-smtp==2\.4\.5/apache-airflow-providers-smtp==3.0.0/' ./constraints.txt

            sed -i 's/aiosmtplib==5\.1\.0/aiosmtplib==5.1.1/' ./constraints.txt

            sed -i 's/apache-airflow-providers-elasticsearch==6\.5\.2/apache-airflow-providers-elasticsearch==6.5.3/' ./constraints.txt

            sed -i 's/apache-airflow-providers-google==22\.1\.0/apache-airflow-providers-google==22.2.1/' ./constraints.txt

            sed -i 's/soupsieve==2\.8\.3/soupsieve==2.8.4/' ./constraints.txt

            sed -i 's/PyJWT==2\.12\.1/PyJWT==2.13.0/' ./constraints.txt

            sed -i 's/tornado==6\.5\.5/tornado==6.5.7/' ./constraints.txt

            sed -i 's/starlette==1\.1\.0/starlette==1.3.1/' ./constraints.txt

            sed -i 's/cryptography==48\.0\.1/cryptography==50.0.0/' ./constraints.txt

            sed -i 's/pyOpenSSL==26\.2\.0/pyOpenSSL==26.4.0/' ./constraints.txt
            sed -i 's/gcloud-aio-auth==5\.4\.4/gcloud-aio-auth==5.5.0/' ./constraints.txt

            sed -i 's/setuptools==82\.0\.1/setuptools==83.0.0/' ./constraints.txt

            sed -i 's/python-multipart==0\.0\.29/python-multipart==0.0.31/' ./constraints.txt

            sed -i 's/pydantic-settings==2\.14\.1/pydantic-settings==2.14.2/' ./constraints.txt

            sed -i 's/msgpack==1\.1\.2/msgpack==1.2.1/' ./constraints.txt

            sed -i 's/apache-airflow-providers-sftp==5\.8\.0/apache-airflow-providers-sftp==5.8.1/' ./constraints.txt

            sed -i 's/apache-airflow-providers-ftp==3\.15\.0/apache-airflow-providers-ftp==3.15.1/' ./constraints.txt
        - name: build providers and install extra packages
          work-dir: ${source.dir}/airflow
          privileged: true
          runs: |
            set -eux -o pipefail

            airflow_root="${target.dir}/usr/lib/airflow"

            providers="amazon celery cncf-kubernetes common-messaging docker elasticsearch fab ftp git google grpc hashicorp http microsoft-azure mysql odbc openlineage postgres redis sendgrid sftp slack snowflake ssh"
            providers_only_binary_flags=""
            for provider in $providers; do
              ${source.dir}/scripts/build-provider $provider
              providers_only_binary_flags="$providers_only_binary_flags --only-binary=apache-airflow-providers-$provider"
            done

            extra_packages="aiobotocore[boto3] authlib eventlet gevent greenlet graphviz python-ldap pandas[sql-other] statsd"

            no_source_only_binary_flags="--only-binary=redshift-connector --only-binary=ray --only-binary=protoc-wheel-0 --only-binary=openlineage-integration-common --only-binary=openlineage-python"
            annoying_only_binary_flags="--only-binary=pyarrow --only-binary=shapely --only-binary=grpcio --only-binary=scipy --only-binary=numpy --only-binary=adbc-driver-sqlite --only-binary=adbc-driver-postgresql --only-binary=hf-xet --only-binary=pandas --only-binary=cmake"

            echo '[tool.uv.extra-build-dependencies]' >> pyproject.toml
            echo 'wirerope = ["setuptools==80.8.0"]' >> pyproject.toml

            sed -i '/^exclude-newer = "4 days"$/d' ./pyproject.toml

            export UV_CONCURRENT_BUILDS="$(nproc)"
            export CMAKE_BUILD_PARALLEL_LEVEL="$(nproc)"

            uv pip install \
              --constraints constraints.txt \
              --overrides overrides.txt \
              --no-binary=:all: \
              $providers_only_binary_flags \
              $no_source_only_binary_flags \
              $annoying_only_binary_flags \
              --prefix "${airflow_root}" \
              dist/*.whl \
              $extra_packages

            git stash
        - name: patch ray bundled aiohttp and idna
          privileged: true
          runs: |
            set -eux -o pipefail

            airflow_root="${target.dir}/usr/lib/airflow"
            uv pip install -U --target "${airflow_root}/lib/python3.13/site-packages/ray/_private/runtime_env/agent/thirdparty_files" 'aiohttp>=3.14.3'
            uv pip install -U --target "${airflow_root}/lib/python3.13/site-packages/ray/_private/runtime_env/agent/thirdparty_files" 'idna>=3.15'
        - name: patch log4j jars bundled in compat image
          runs: |
            set -eux -o pipefail

            airflow_root="${target.dir}/usr/lib/airflow"
            site="${airflow_root}/lib/python3.13/site-packages"
            for artifact in log4j-core log4j-api log4j-slf4j-impl log4j-1.2-api; do
              while IFS= read -r -d '' oldjar; do
                dir=$(dirname "$oldjar")
                cp "${source.dir}/log4j/${artifact}-2.25.4.jar" "${dir}/${artifact}-2.25.4.jar"
                rm -f "$oldjar"
              done < <(find "$site" -type f -name "${artifact}-2.25.3.jar" -print0 2> /dev/null || true)
            done
      paths:
        - type: file
          path: ${source.dir}/scripts/build-provider
          uid: 0
          gid: 0
          mode: "0755"
          source: image/airflow/bin/build-provider
      outputs:
        - source: ${target.dir}/usr/lib/airflow
          target: /usr/lib/airflow
          uid: 0
          gid: 0
accounts:
  run-as: airflow
  users:
    - name: airflow
      uid: 50000
      gid: 50000
  groups:
    - name: airflow
      gid: 50000
      members:
        - airflow
os-release:
  name: Docker Hardened Images (Debian)
  id: debian
  version-id: "13"
  version-codename: trixie
  pretty-name: Docker Hardened Images/Debian GNU/Linux 13 (trixie)
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
work-dir: /opt/airflow
environment:
  AIRFLOW_HOME: /opt/airflow
  PATH: /opt/airflow/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
  PYTHONPATH: /opt/airflow/lib/python3.13/site-packages
paths:
  - type: symlink
    path: /opt/airflow
    uid: 0
    gid: 0
    source: /usr/lib/airflow
  - type: directory
    path: /usr/lib/airflow/logs
    uid: 50000
    gid: 50000
    mode: "0755"
annotations:
  org.opencontainers.image.description: A minimal Airflow image
  org.opencontainers.image.licenses: Apache-2.0
entrypoint:
  - airflow
ports:
  - 8080/tcp
