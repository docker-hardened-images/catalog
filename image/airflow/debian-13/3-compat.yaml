# syntax=dhi.io/build:2-debian13

name: Airflow 3.x (compat)
image: dhi.io/airflow
variant: runtime
flavor: compat
tags:
  - 3-compat
  - 3.3-compat
  - 3.3.1-compat
  - 3-debian-compat
  - 3-debian13-compat
  - 3.3-debian-compat
  - 3-python3.13-compat
  - 3.3-debian13-compat
  - 3.3.1-debian-compat
  - 3.3-python3.13-compat
  - 3.3.1-debian13-compat
  - 3.3.1-python3.13-compat
  - 3-python3.13-debian-compat
  - 3-python3.13-debian13-compat
  - 3.3-python3.13-debian-compat
  - 3.3-python3.13-debian13-compat
  - 3.3.1-python3.13-debian-compat
  - 3.3.1-python3.13-debian13-compat
platforms:
  - linux/amd64
  - linux/arm64
dates:
  release: "2025-04-22"
vars:
  COMMIT_SHA: 3adbbe1c58e4532df1964cb7794805e763816ee8
  HTTPCORE5_PATCH_VERSION: 5.4.3
  LOG4J_PATCH_VERSION: 2.25.5
  PYTHON_MAJOR_MINOR_VERSION: "3.13"
  SEMVER_MAJOR_MINOR_VERSION: "3.3"
  SEMVER_MAJOR_VERSION: "3"
  SEMVER_VERSION: 3.3.1
  VERSION: 3.3.1-11
contents:
  repositories:
    - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
  keyring:
    - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
  packages:
    - '!libelogind0'
    - '!mawk'
    - '!original-awk'
    - airflow=3.3.1-11
    - base-files
    - bash
    - ca-certificates
    - ca-certificates-bundle
    - coreutils
    - dumb-init
    - findutils
    - gawk
    - libc6
    - libffi8
    - libgcc-s1
    - libldap2
    - libmariadb3
    - libpq5
    - libsasl2-2
    - libstdc++6
    - libxml2
    - libxslt1.1
    - netcat-openbsd
    - python-3.13
    - tzdata
    - unixodbc
  builds:
    - name: airflow compat providers
      environment:
        UV_NO_MANAGED_PYTHON: "true"
        UV_PYTHON_DOWNLOADS: never
      caches:
        - path: /root/.cache/pip
        - path: /root/.cache/uv
        - path: /root/.cargo
      contents:
        repositories:
          - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
        keyring:
          - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
        packages:
          - airflow=3.3.1-11
          - bash
          - build-essential
          - cargo-1.97
          - rustc-1.97
          - coreutils
          - diffutils
          - findutils
          - g++
          - gawk
          - gfortran
          - git
          - grep
          - libffi-dev
          - libldap2-dev
          - libmariadb-dev
          - libpq-dev
          - libsasl2-dev
          - libssl-dev
          - libstdc++6
          - libxml2-dev
          - libxslt1-dev
          - patchelf
          - pkg-config
          - python-3.13
          - python-3.13-dev
          - python3-pip
          - python3-setuptools
          - python3-wheel
          - sed
          - unzip
          - zip
          - unixodbc-dev
        files:
          - url: git+https://github.com/apache/airflow.git#3.3.1
            checksum: 3adbbe1c58e4532df1964cb7794805e763816ee8
            path: ${source.dir}/airflow
            spdx:
              name: airflow
              version: 3.3.1
              packages:
                - name: airflow
                  purl: pkg:dhi/airflow@3.3.1
                  license: Apache-2.0
            uid: 0
            gid: 0
          - url: https://raw.githubusercontent.com/apache/airflow/constraints-3.3.1/constraints-3.13.txt
            path: ${source.dir}/airflow/constraints.txt
            uid: 0
            gid: 0
          - url: https://repo1.maven.org/maven2/org/apache/logging/log4j/log4j-api/2.25.5/log4j-api-2.25.5.jar
            checksum: sha256:64777f73ea0b3104c04eb82befbdccc30a425a19e83ad06cb2f93aa303511863
            path: ${source.dir}/log4j/log4j-api-2.25.5.jar
            uid: 0
            gid: 0
          - url: https://repo1.maven.org/maven2/org/apache/httpcomponents/core5/httpcore5/5.4.3/httpcore5-5.4.3.jar
            checksum: sha256:18bfbbabb478dfb67f31aeaf428c387f3c3df654582e1309f708ee1f3086830a
            path: ${source.dir}/log4j/httpcore5-5.4.3.jar
            uid: 0
            gid: 0
      pipeline:
        - name: install uv
          privileged: true
          runs: |
            set -eux -o pipefail

            pip install uv
        - name: edit constraints
          work-dir: ${source.dir}/airflow
          runs: |
            set -eux -o pipefail

            touch ./overrides.txt

            sed -i 's/Pygments==2\.19\.2/Pygments==2.20.0/' ./constraints.txt

            sed -i 's/^google-cloud-aiplatform==1\.148\.1/google-cloud-aiplatform==1.155.0/g' ./constraints.txt

            sed -i 's/litellm==1\.82\.6/litellm==1.85.4/' ./constraints.txt
            for pkg in importlib_metadata; do
              version=$(grep -i "^${pkg}==" ./constraints.txt | head -1 | sed 's/.*==//')
              if [ -n "$version" ]; then
                echo "${pkg}==${version}" >> ./overrides.txt
              fi
            done

            sed -i 's/^aiohttp==3\.14\.1/aiohttp==3.14.3/g' ./constraints.txt

            sed -i 's/Mako==1\.3\.11/Mako==1.3.12/' ./constraints.txt

            sed -i 's/urllib3==2\.6\.3/urllib3==2.7.0/' ./constraints.txt

            sed -i 's/Authlib==1\.6\.9/Authlib==1.6.12/' ./constraints.txt

            sed -i 's/joserfc==1\.6\.5/joserfc==1.6.8/' ./constraints.txt

            sed -i 's/GitPython==3\.1\.50/GitPython==3.1.58/' ./constraints.txt # GHSA-jm78-9fvv-mhgr, GHSA-wvpp-8hx9-p66j, GHSA-hmq2-w58f-27jc, GHSA-4gmw-gg2m-w46p, GHSA-9rj7-rf2p-w77r, GHSA-hh9p-6wh2-4mfc

            sed -i 's/pyasn1==0\.6\.3/pyasn1==0.6.4/' ./constraints.txt

            sed -i 's/idna==3\.11/idna==3.15/' ./constraints.txt

            sed -i 's/asyncssh==2\.22\.0/asyncssh==2.23.0/' ./constraints.txt

            sed -i 's/apache-airflow-providers-smtp==2\.4\.5/apache-airflow-providers-smtp==3.0.0/' ./constraints.txt

            sed -i 's/aiosmtplib==5\.1\.0/aiosmtplib==5.1.1/' ./constraints.txt

            sed -i 's/apache-airflow-providers-elasticsearch==6\.5\.2/apache-airflow-providers-elasticsearch==6.5.3/' ./constraints.txt

            sed -i 's/apache-airflow-providers-google==22\.1\.0/apache-airflow-providers-google==22.2.1/' ./constraints.txt

            sed -i 's/soupsieve==2\.8\.3/soupsieve==2.8.4/' ./constraints.txt

            sed -i 's/PyJWT==2\.12\.1/PyJWT==2.13.0/' ./constraints.txt

            sed -i 's/tornado==6\.5\.5/tornado==6.5.7/' ./constraints.txt

            sed -i 's/starlette==1\.1\.0/starlette==1.3.1/' ./constraints.txt

            sed -i 's/cryptography==48\.0\.1/cryptography==50.0.0/' ./constraints.txt

            sed -i 's/pyOpenSSL==26\.2\.0/pyOpenSSL==26.4.0/' ./constraints.txt
            sed -i 's/gcloud-aio-auth==5\.4\.4/gcloud-aio-auth==5.5.0/' ./constraints.txt

            sed -i 's/setuptools==82\.0\.1/setuptools==83.0.0/' ./constraints.txt

            sed -i 's/python-multipart==0\.0\.29/python-multipart==0.0.31/' ./constraints.txt

            sed -i 's/pydantic-settings==2\.14\.1/pydantic-settings==2.14.2/' ./constraints.txt

            sed -i 's/msgpack==1\.1\.2/msgpack==1.2.1/' ./constraints.txt

            sed -i 's/apache-airflow-providers-sftp==5\.8\.0/apache-airflow-providers-sftp==5.8.1/' ./constraints.txt

            sed -i 's/apache-airflow-providers-ftp==3\.15\.0/apache-airflow-providers-ftp==3.15.1/' ./constraints.txt

            sed -i 's/h2==4\.3\.0/h2==4.4.1/' ./constraints.txt # CVE-2026-71554

            sed -i 's/^sqlparse==0\.5\.5/sqlparse==0.6.0/' ./constraints.txt # CVE-2026-71491, CVE-2026-54284, CVE-2026-59894

            echo "apache-airflow==3.3.1" >> ./overrides.txt
            echo "apache-airflow-core==3.3.1" >> ./overrides.txt
        - name: build providers and install extra packages
          work-dir: ${source.dir}/airflow
          privileged: true
          runs: |
            set -eux -o pipefail

            airflow_root="${target.dir}/usr/lib/airflow"

            providers="amazon celery cncf-kubernetes common-messaging docker elasticsearch fab ftp git google grpc hashicorp http microsoft-azure mysql odbc openlineage postgres redis sendgrid sftp slack snowflake ssh"
            providers_only_binary_flags=""
            for provider in $providers; do
              ${source.dir}/scripts/build-provider $provider
              providers_only_binary_flags="$providers_only_binary_flags --only-binary=apache-airflow-providers-$provider"
            done

            extra_packages="aiobotocore[boto3] authlib eventlet gevent greenlet graphviz python-ldap pandas[sql-other] statsd"

            no_source_only_binary_flags="--only-binary=redshift-connector --only-binary=ray --only-binary=protoc-wheel-0 --only-binary=openlineage-integration-common --only-binary=openlineage-python --only-binary=psycopg-binary"
            annoying_only_binary_flags="--only-binary=pyarrow --only-binary=shapely --only-binary=grpcio --only-binary=scipy --only-binary=numpy --only-binary=adbc-driver-sqlite --only-binary=adbc-driver-postgresql --only-binary=hf-xet --only-binary=pandas --only-binary=cmake --only-binary=cloudpickle"

            echo '[tool.uv.extra-build-dependencies]' >> pyproject.toml
            echo 'wirerope = ["setuptools==80.8.0"]' >> pyproject.toml

            sed -i '/^exclude-newer = "4 days"$/d' ./pyproject.toml

            export UV_CONCURRENT_BUILDS="$(nproc)"
            export CMAKE_BUILD_PARALLEL_LEVEL="$(nproc)"

            uv pip install \
              --constraints constraints.txt \
              --overrides overrides.txt \
              --no-binary=:all: \
              $providers_only_binary_flags \
              $no_source_only_binary_flags \
              $annoying_only_binary_flags \
              --prefix "${airflow_root}" \
              dist/*.whl \
              $extra_packages

            git stash
        - name: patch ray bundled aiohttp and idna
          privileged: true
          runs: |
            set -eux -o pipefail

            airflow_root="${target.dir}/usr/lib/airflow"
            uv pip install -U --target "${airflow_root}/lib/python3.13/site-packages/ray/_private/runtime_env/agent/thirdparty_files" 'aiohttp>=3.14.3'
            uv pip install -U --target "${airflow_root}/lib/python3.13/site-packages/ray/_private/runtime_env/agent/thirdparty_files" 'idna>=3.15'
        - name: replace vulnerable libraries bundled in ray_dist.jar
          runs: |
            set -eux -o pipefail

            airflow_root="${target.dir}/usr/lib/airflow"
            site="${airflow_root}/lib/python3.13/site-packages"
            jars_dir="${site}/ray/jars"
            ray_jar="${jars_dir}/ray_dist.jar"
            entries="${jars_dir}/.ray_dist_entries"

            if [ ! -f "${ray_jar}" ]; then
              echo "ERROR: ${ray_jar} not found; ray layout changed, revisit this step" >&2
              exit 1
            fi

            assert_older() {
              coords="$1"
              target="$2"
              bundled="$(unzip -p "${ray_jar}" "META-INF/maven/${coords}/pom.properties" 2> /dev/null | sed -n 's/^version=//p' | head -1 || true)"
              if [ -z "${bundled}" ]; then
                echo "ERROR: ${coords} not bundled in ray_dist.jar; revisit this step" >&2
                exit 1
              fi
              older="$(printf '%s\n%s\n' "${bundled}" "${target}" | sort -V | head -1)"
              if [ "${older}" != "${bundled}" ] || [ "${bundled}" = "${target}" ]; then
                echo "ERROR: bundled ${coords} ${bundled} is already >= ${target}; revisit this step" >&2
                exit 1
              fi
            }

            assert_older org.apache.logging.log4j/log4j-api "2.25.5"
            assert_older org.apache.httpcomponents.core5/httpcore5 "5.4.3"

            zip -qd "${ray_jar}" \
              'org/apache/logging/log4j/*' \
              'Log4j-charsets.properties' \
              'META-INF/maven/org.apache.logging.log4j/log4j-api/*' \
              'META-INF/native-image/org.apache.logging.log4j/log4j-api/*' \
              'META-INF/services/org.apache.logging.log4j.util.PropertySource' \
              'org/apache/hc/*' \
              'META-INF/maven/org.apache.httpcomponents.core5/*' \
              -x 'org/apache/logging/log4j/core/*'

            unzip -Z1 "${ray_jar}" > "${entries}"

            removed="$(grep -E '^(org/apache/hc/|META-INF/maven/org\.apache\.httpcomponents\.core5/|META-INF/maven/org\.apache\.logging\.log4j/log4j-api/)' "${entries}" || true)"
            if [ -n "${removed}" ]; then
              echo "ERROR: replaced components still present in ray_dist.jar:" >&2
              printf '%s\n' "${removed}" >&2
              exit 1
            fi

            for keep in 'log4j2.xml' 'META-INF/maven/org.apache.logging.log4j/log4j-core/pom.properties' 'org/apache/logging/slf4j/Log4jLoggerFactory.class'; do
              if ! grep -qxF "${keep}" "${entries}"; then
                echo "ERROR: ${keep} was removed from ray_dist.jar; strip globs are too broad" >&2
                exit 1
              fi
            done

            rm -f "${entries}"

            cp "${source.dir}/log4j/log4j-api-2.25.5.jar" "${jars_dir}/"
            cp "${source.dir}/log4j/httpcore5-5.4.3.jar" "${jars_dir}/"
        - name: install scripts
          work-dir: ${source.dir}/airflow
          runs: |
            set -eux -o pipefail

            install -m 0775 scripts/docker/entrypoint_prod.sh ${target.dir}/entrypoint
            install -m 0775 scripts/docker/clean-logs.sh ${target.dir}/clean-logs
            install -m 0775 scripts/docker/airflow-scheduler-autorestart.sh ${target.dir}/airflow-scheduler-autorestart
      paths:
        - type: file
          path: ${source.dir}/scripts/build-provider
          uid: 0
          gid: 0
          mode: "0755"
          source: image/airflow/bin/build-provider
      outputs:
        - source: ${target.dir}/usr/lib/airflow
          target: /usr/lib/airflow
          uid: 0
          gid: 0
        - source: ${target.dir}/entrypoint
          target: /entrypoint
          uid: 0
          gid: 0
        - source: ${target.dir}/clean-logs
          target: /clean-logs
          uid: 0
          gid: 0
        - source: ${target.dir}/airflow-scheduler-autorestart
          target: /airflow-scheduler-autorestart
          uid: 0
          gid: 0
accounts:
  run-as: airflow
  users:
    - name: airflow
      uid: 50000
      gid: 50000
  groups:
    - name: airflow
      gid: 50000
      members:
        - airflow
os-release:
  name: Docker Hardened Images (Debian)
  id: debian
  version-id: "13"
  version-codename: trixie
  pretty-name: Docker Hardened Images/Debian GNU/Linux 13 (trixie)
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
work-dir: /opt/airflow
environment:
  AIRFLOW_HOME: /opt/airflow
  PATH: /opt/airflow/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
  PYTHONPATH: /opt/airflow/lib/python3.13/site-packages
paths:
  - type: symlink
    path: /opt/airflow
    uid: 0
    gid: 0
    source: /usr/lib/airflow
  - type: directory
    path: /usr/lib/airflow/logs
    uid: 50000
    gid: 50000
    mode: "0755"
annotations:
  org.opencontainers.image.description: A minimal Airflow image
  org.opencontainers.image.licenses: Apache-2.0
entrypoint:
  - /usr/bin/dumb-init
  - --
  - /entrypoint
ports:
  - 8080/tcp
