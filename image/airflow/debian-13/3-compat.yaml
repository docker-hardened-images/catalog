# syntax=dhi.io/build:2-debian13

name: Airflow 3.x (compat)
image: dhi.io/airflow
variant: runtime
flavor: compat
tags:
  - 3-compat
  - 3.4-compat
  - 3.4.0-compat
  - 3-debian-compat
  - 3-debian13-compat
  - 3.4-debian-compat
  - 3-python3.13-compat
  - 3.4-debian13-compat
  - 3.4.0-debian-compat
  - 3.4-python3.13-compat
  - 3.4.0-debian13-compat
  - 3.4.0-python3.13-compat
  - 3-python3.13-debian-compat
  - 3-python3.13-debian13-compat
  - 3.4-python3.13-debian-compat
  - 3.4-python3.13-debian13-compat
  - 3.4.0-python3.13-debian-compat
  - 3.4.0-python3.13-debian13-compat
platforms:
  - linux/amd64
  - linux/arm64
dates:
  release: "2025-04-22"
vars:
  PYTHON_MAJOR_MINOR_VERSION: "3.13"
  SEMVER_MAJOR_MINOR_VERSION: "3.4"
  SEMVER_MAJOR_VERSION: "3"
  SEMVER_VERSION: 3.4.0
  VERSION: 3.4.0-4
contents:
  repositories:
    - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
  keyring:
    - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
  packages:
    - '!libelogind0'
    - '!mawk'
    - '!original-awk'
    - airflow=3.4.0-4
    - base-files
    - bash
    - ca-certificates
    - ca-certificates-bundle
    - coreutils
    - dumb-init
    - findutils
    - gawk
    - libc6
    - libffi8
    - libgcc-s1
    - libldap2
    - libmariadb3
    - libpq5
    - libsasl2-2
    - libstdc++6
    - libxml2
    - libxslt1.1
    - netcat-openbsd
    - python-3.13
    - tzdata
    - unixodbc
accounts:
  run-as: airflow
  users:
    - name: airflow
      uid: 50000
      gid: 50000
  groups:
    - name: airflow
      gid: 50000
      members:
        - airflow
os-release:
  name: Docker Hardened Images (Debian)
  id: debian
  version-id: "13"
  version-codename: trixie
  pretty-name: Docker Hardened Images/Debian GNU/Linux 13 (trixie)
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
work-dir: /opt/airflow
environment:
  AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_PASSWORDS_FILE: /opt/airflow/auth/simple_auth_manager_passwords.json.generated
  AIRFLOW_HOME: /opt/airflow
  PATH: /opt/airflow/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
  PYTHONPATH: /opt/airflow/lib/python3.13/site-packages
paths:
  - type: symlink
    path: /opt/airflow
    uid: 0
    gid: 0
    source: /usr/lib/airflow
  - type: directory
    path: /usr/lib/airflow/auth
    uid: 50000
    gid: 50000
    mode: "0700"
  - type: directory
    path: /usr/lib/airflow/logs
    uid: 50000
    gid: 50000
    mode: "0755"
  - type: symlink
    path: /entrypoint
    uid: 0
    gid: 0
    source: /usr/lib/airflow/docker/entrypoint
  - type: symlink
    path: /clean-logs
    uid: 0
    gid: 0
    source: /usr/lib/airflow/docker/clean-logs
  - type: symlink
    path: /airflow-scheduler-autorestart
    uid: 0
    gid: 0
    source: /usr/lib/airflow/docker/airflow-scheduler-autorestart
annotations:
  org.opencontainers.image.description: A minimal Airflow image
  org.opencontainers.image.licenses: Apache-2.0
entrypoint:
  - /usr/bin/dumb-init
  - --
  - /entrypoint
ports:
  - 8080/tcp
