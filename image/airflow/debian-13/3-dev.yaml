# syntax=dhi.io/build:2-debian13

name: Airflow 3.x (dev)
image: dhi.io/airflow
variant: dev
tags:
  - 3-dev
  - 3.3-dev
  - 3.3.1-dev
  - 3-debian-dev
  - 3-debian13-dev
  - 3.3-debian-dev
  - 3-python3.13-dev
  - 3.3-debian13-dev
  - 3.3.1-debian-dev
  - 3.3-python3.13-dev
  - 3.3.1-debian13-dev
  - 3.3.1-python3.13-dev
  - 3-python3.13-debian-dev
  - 3-python3.13-debian13-dev
  - 3.3-python3.13-debian-dev
  - 3.3-python3.13-debian13-dev
  - 3.3.1-python3.13-debian-dev
  - 3.3.1-python3.13-debian13-dev
platforms:
  - linux/amd64
  - linux/arm64
dates:
  release: "2025-04-22"
vars:
  COMMIT_SHA: 3adbbe1c58e4532df1964cb7794805e763816ee8
  PYTHON_MAJOR_MINOR_VERSION: "3.13"
  SEMVER_MAJOR_MINOR_VERSION: "3.3"
  SEMVER_MAJOR_VERSION: "3"
  SEMVER_VERSION: 3.3.1
  VERSION: 3.3.1-12
contents:
  repositories:
    - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
  keyring:
    - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
  packages:
    - '!gawk'
    - '!libelogind0'
    - '!mawk'
    - '!original-awk'
    - airflow=3.3.1-12
    - apt
    - base-files
    - bash
    - ca-certificates
    - ca-certificates-bundle
    - coreutils
    - diffutils
    - dpkg
    - findutils
    - grep
    - libc-bin
    - libc6
    - libffi8
    - libgcc-s1
    - libstdc++6
    - mawk
    - perl-base
    - python-3.13
    - sed
    - tzdata
    - util-linux
  files:
    - url: https://raw.githubusercontent.com/apache/airflow/constraints-3.3.1/constraints-3.13.txt
      path: /usr/lib/airflow/constraints.txt
      uid: 0
      gid: 0
accounts:
  root: true
  run-as: root
  users:
    - name: airflow
      uid: 50000
      gid: 50000
    - name: airflow
      uid: 50000
      gid: 50000
    - name: _apt
      uid: 42
      gid: 65532
  groups:
    - name: airflow
      gid: 50000
      members:
        - airflow
    - name: airflow
      gid: 50000
      members:
        - airflow
os-release:
  name: Docker Hardened Images (Debian)
  id: debian
  version-id: "13"
  version-codename: trixie
  pretty-name: Docker Hardened Images/Debian GNU/Linux 13 (trixie)
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
work-dir: /opt/airflow
environment:
  AIRFLOW_HOME: /opt/airflow
  DEBIAN_FRONTEND: noninteractive
  PATH: /opt/airflow/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
  PYTHONPATH: /opt/airflow/lib/python3.13/site-packages
paths:
  - type: symlink
    path: /opt/airflow
    uid: 0
    gid: 0
    source: /usr/lib/airflow
  - type: directory
    path: /usr/lib/airflow/logs
    uid: 50000
    gid: 50000
    mode: "0755"
annotations:
  org.opencontainers.image.description: A minimal Airflow image
  org.opencontainers.image.licenses: Apache-2.0
entrypoint:
  - airflow
  - /usr/bin/bash
ports:
  - 8080/tcp
