# syntax=dhi.io/build:2-debian13

name: Linkerd Tap 26.x (dev)
image: dhi.io/linkerd-tap
variant: dev
tags:
  - 26-dev
  - 26.11-dev
  - 26.11.1-dev
  - 26-debian-dev
  - 26-debian13-dev
  - 26.11-debian-dev
  - edge-26.11.1-dev
  - 26.11-debian13-dev
  - 26.11.1-debian-dev
  - 26.11.1-debian13-dev
  - edge-26.11.1-debian-dev
  - edge-26.11.1-debian13-dev
platforms:
  - linux/amd64
  - linux/arm64
dates:
  release: "2018-09-18"
vars:
  EDGE_VERSION: 26.11.1
  FLAVORED_SUFFIX: -dev
  SEMVER_MAJOR_MINOR_VERSION: "26.11"
  SEMVER_MAJOR_VERSION: "26"
  SEMVER_VERSION: 26.11.1
  SUFFIX: -dev
  VERSION: 26.11.1-0
contents:
  repositories:
    - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
  keyring:
    - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
  packages:
    - '!gawk'
    - '!libelogind0'
    - '!original-awk'
    - apt
    - base-files
    - bash
    - ca-certificates
    - ca-certificates-bundle
    - coreutils
    - diffutils
    - dpkg
    - findutils
    - grep
    - libc-bin
    - linkerd-tap-dev=26.11.1-0
    - mawk
    - perl-base
    - sed
    - tzdata
    - util-linux
  builds:
    - name: locale
      contents:
        packages:
          - bash
          - locales
          - coreutils
          - gzip
      pipeline:
        - name: install locales
          runs: |
            set -eux -o pipefail

            ln -s /etc/locale.alias /usr/share/locale/locale.alias

            echo "en_US.UTF-8 UTF-8" >> /etc/locale.gen
            locale-gen en_US.UTF-8
      outputs:
        - source: /usr/share/locale
          target: /usr/share/locale
          uid: 0
          gid: 0
        - source: /usr/lib/locale
          target: /usr/lib/locale
          uid: 0
          gid: 0
accounts:
  root: true
  run-as: root
  users:
    - name: nonroot
      uid: 65532
      gid: 65532
    - name: _apt
      uid: 42
      gid: 65532
  groups:
    - name: nonroot
      gid: 65532
      members:
        - nonroot
os-release:
  name: Docker Hardened Images (Debian)
  id: debian
  version-id: "13"
  version-codename: trixie
  pretty-name: Docker Hardened Images/Debian GNU/Linux 13 (trixie)
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
environment:
  DEBIAN_FRONTEND: noninteractive
  LANG: en_US.UTF-8
  LANGUAGE: en_US:en
  LC_ALL: en_US.UTF-8
  LINKERD_CONTAINER_VERSION_OVERRIDE: edge-26.11.1
paths:
  - type: directory
    path: /linkerd
    uid: 0
    gid: 0
  - type: symlink
    path: /tap
    uid: 0
    gid: 0
    source: /usr/bin/linkerd-tap
  - type: symlink
    path: /linkerd/LICENSE
    uid: 0
    gid: 0
    source: /usr/share/linkerd-tap/LICENSE
annotations:
  org.opencontainers.image.description: A minimal Linkerd Tap image
  org.opencontainers.image.licenses: Apache-2.0
entrypoint:
  - /tap
ports:
  - 8089/tcp
  - 9998/tcp
  - 8443/tcp
  - 9995/tcp
