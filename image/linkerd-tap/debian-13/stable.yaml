# syntax=dhi.io/build:2-debian13

name: Linkerd Tap 26.x
image: dhi.io/linkerd-tap
variant: runtime
tags:
  - "26"
  - "26.11"
  - 26.11.1
  - 26-debian
  - 26-debian13
  - 26.11-debian
  - edge-26.11.1
  - 26.11-debian13
  - 26.11.1-debian
  - 26.11.1-debian13
  - edge-26.11.1-debian
  - edge-26.11.1-debian13
platforms:
  - linux/amd64
  - linux/arm64
dates:
  release: "2018-09-18"
vars:
  EDGE_VERSION: 26.11.1
  FLAVORED_SUFFIX: ""
  SEMVER_MAJOR_MINOR_VERSION: "26.11"
  SEMVER_MAJOR_VERSION: "26"
  SEMVER_VERSION: 26.11.1
  SUFFIX: ""
  VERSION: 26.11.1-0
contents:
  repositories:
    - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
  keyring:
    - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
  packages:
    - base-files
    - ca-certificates-bundle
    - linkerd-tap=26.11.1-0
    - tzdata
accounts:
  run-as: nonroot
  users:
    - name: nonroot
      uid: 65532
      gid: 65532
  groups:
    - name: nonroot
      gid: 65532
      members:
        - nonroot
os-release:
  name: Docker Hardened Images (Debian)
  id: debian
  version-id: "13"
  version-codename: trixie
  pretty-name: Docker Hardened Images/Debian GNU/Linux 13 (trixie)
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
environment:
  LINKERD_CONTAINER_VERSION_OVERRIDE: edge-26.11.1
paths:
  - type: directory
    path: /linkerd
    uid: 0
    gid: 0
  - type: symlink
    path: /tap
    uid: 0
    gid: 0
    source: /usr/bin/linkerd-tap
  - type: symlink
    path: /linkerd/LICENSE
    uid: 0
    gid: 0
    source: /usr/share/linkerd-tap/LICENSE
annotations:
  org.opencontainers.image.description: A minimal Linkerd Tap image
  org.opencontainers.image.licenses: Apache-2.0
entrypoint:
  - /tap
ports:
  - 8089/tcp
  - 9998/tcp
  - 8443/tcp
  - 9995/tcp
