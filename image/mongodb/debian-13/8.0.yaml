# syntax=dhi.io/build:2-debian13

name: MongoDB 8.0.x
image: dhi.io/mongodb
variant: runtime
tags:
  - "8.0"
  - 8.0.29
  - 8.0-debian
  - 8.0-debian13
  - 8.0.29-debian
  - 8.0.29-debian13
platforms:
  - linux/amd64
dates:
  release: "2024-10-31"
  end-of-life: "2029-10-31"
vars:
  PACKAGE_NAME: mongodb-8.0
  SEMVER_MAJOR_MINOR_VERSION: "8.0"
  SEMVER_MAJOR_VERSION: "8"
  SEMVER_VERSION: 8.0.29
  VERSION: 8.0.29-4
contents:
  repositories:
    - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
  keyring:
    - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
  packages:
    - '!libelogind0'
    - '!mawk'
    - '!original-awk'
    - base-files
    - ca-certificates
    - coreutils
    - libcurl4t64
    - mongodb-8.0=8.0.29-4
    - numactl
accounts:
  run-as: mongodb
  users:
    - name: mongodb
      uid: 999
      gid: 999
  groups:
    - name: mongodb
      gid: 999
      members:
        - mongodb
os-release:
  name: Docker Hardened Images (Debian)
  id: debian
  version-id: "13"
  version-codename: trixie
  pretty-name: Docker Hardened Images/Debian GNU/Linux 13 (trixie)
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
work-dir: /data
environment:
  HOME: /data
paths:
  - type: directory
    path: /var/log/mongodb
    uid: 999
    gid: 999
    mode: "0755"
  - type: directory
    path: /data/db
    uid: 999
    gid: 999
    mode: "0755"
  - type: directory
    path: /data/configdb
    uid: 999
    gid: 999
    mode: "0755"
annotations:
  org.opencontainers.image.description: A minimal MongoDB image
  org.opencontainers.image.licenses: SSPL-1.0
entrypoint:
  - mongod
ports:
  - 27017/tcp
