# syntax=dhi.io/build:2-debian13

name: MongoDB 8.0.x (dev)
image: dhi.io/mongodb
variant: dev
tags:
  - 8.0-dev
  - 8.0.29-dev
  - 8.0-debian-dev
  - 8.0-debian13-dev
  - 8.0.29-debian-dev
  - 8.0.29-debian13-dev
platforms:
  - linux/amd64
dates:
  release: "2024-10-31"
  end-of-life: "2029-10-31"
vars:
  PACKAGE_NAME: mongodb-8.0
  SEMVER_MAJOR_MINOR_VERSION: "8.0"
  SEMVER_MAJOR_VERSION: "8"
  SEMVER_VERSION: 8.0.29
  VERSION: 8.0.29-3
contents:
  repositories:
    - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
  keyring:
    - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
  packages:
    - '!gawk'
    - '!libelogind0'
    - '!mawk'
    - '!original-awk'
    - apt
    - base-files
    - bash
    - ca-certificates
    - coreutils
    - diffutils
    - dpkg
    - findutils
    - grep
    - libc-bin
    - libcurl4t64
    - mawk
    - mongodb-8.0-mongosh=8.0.29-3
    - mongodb-8.0-tools=8.0.29-3
    - mongodb-8.0=8.0.29-3
    - numactl
    - perl-base
    - sed
    - util-linux
    - zlib1g
accounts:
  root: true
  run-as: root
  users:
    - name: mongodb
      uid: 999
      gid: 999
    - name: _apt
      uid: 42
      gid: 65532
  groups:
    - name: mongodb
      gid: 999
      members:
        - mongodb
os-release:
  name: Docker Hardened Images (Debian)
  id: debian
  version-id: "13"
  version-codename: trixie
  pretty-name: Docker Hardened Images/Debian GNU/Linux 13 (trixie)
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
work-dir: /data
environment:
  DEBIAN_FRONTEND: noninteractive
  HOME: /data
paths:
  - type: directory
    path: /var/log/mongodb
    uid: 999
    gid: 999
    mode: "0755"
  - type: directory
    path: /data/db
    uid: 999
    gid: 999
    mode: "0755"
  - type: directory
    path: /data/configdb
    uid: 999
    gid: 999
    mode: "0755"
  - type: directory
    path: /usr/local/bin
    uid: 0
    gid: 0
  - type: symlink
    path: /usr/local/bin/bsondump
    uid: 0
    gid: 0
    source: /usr/bin/bsondump
  - type: symlink
    path: /usr/local/bin/mongodump
    uid: 0
    gid: 0
    source: /usr/bin/mongodump
  - type: symlink
    path: /usr/local/bin/mongoexport
    uid: 0
    gid: 0
    source: /usr/bin/mongoexport
  - type: symlink
    path: /usr/local/bin/mongofiles
    uid: 0
    gid: 0
    source: /usr/bin/mongofiles
  - type: symlink
    path: /usr/local/bin/mongoimport
    uid: 0
    gid: 0
    source: /usr/bin/mongoimport
  - type: symlink
    path: /usr/local/bin/mongorestore
    uid: 0
    gid: 0
    source: /usr/bin/mongorestore
  - type: symlink
    path: /usr/local/bin/mongostat
    uid: 0
    gid: 0
    source: /usr/bin/mongostat
  - type: symlink
    path: /usr/local/bin/mongotop
    uid: 0
    gid: 0
    source: /usr/bin/mongotop
annotations:
  org.opencontainers.image.description: A minimal MongoDB image
  org.opencontainers.image.licenses: SSPL-1.0
entrypoint:
  - mongod
ports:
  - 27017/tcp
