# syntax=dhi.io/build:2-debian13

name: MongoDB 8.3.x (compat)
image: dhi.io/mongodb
variant: runtime
flavor: compat
tags:
  - 8-compat
  - 8.3-compat
  - 8.3.8-compat
  - 8-debian-compat
  - 8-debian13-compat
  - 8.3-debian-compat
  - 8.3-debian13-compat
  - 8.3.8-debian-compat
  - 8.3.8-debian13-compat
platforms:
  - linux/amd64
dates:
  release: "2026-05-14"
  end-of-life: "2029-10-31"
vars:
  PACKAGE_NAME: mongodb-8.3
  SEMVER_MAJOR_MINOR_VERSION: "8.3"
  SEMVER_MAJOR_VERSION: "8"
  SEMVER_VERSION: 8.3.8
  VERSION: 8.3.8-2
contents:
  repositories:
    - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
  keyring:
    - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
  packages:
    - '!libelogind0'
    - '!mawk'
    - '!original-awk'
    - base-files
    - bash
    - ca-certificates
    - coreutils
    - findutils
    - libcurl4t64
    - mongodb-8.3-mongosh=8.3.8-2
    - mongodb-8.3-tools=8.3.8-2
    - mongodb-8.3=8.3.8-2
    - numactl
    - zlib1g
accounts:
  run-as: mongodb
  users:
    - name: mongodb
      uid: 999
      gid: 999
  groups:
    - name: mongodb
      gid: 999
      members:
        - mongodb
os-release:
  name: Docker Hardened Images (Debian)
  id: debian
  version-id: "13"
  version-codename: trixie
  pretty-name: Docker Hardened Images/Debian GNU/Linux 13 (trixie)
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
work-dir: /data
environment:
  HOME: /data
paths:
  - type: directory
    path: /var/log/mongodb
    uid: 999
    gid: 999
    mode: "0755"
  - type: directory
    path: /data/db
    uid: 999
    gid: 999
    mode: "0755"
  - type: directory
    path: /data/configdb
    uid: 999
    gid: 999
    mode: "0755"
  - type: directory
    path: /usr/local/bin
    uid: 0
    gid: 0
  - type: symlink
    path: /usr/local/bin/bsondump
    uid: 0
    gid: 0
    source: /usr/bin/bsondump
  - type: symlink
    path: /usr/local/bin/mongodump
    uid: 0
    gid: 0
    source: /usr/bin/mongodump
  - type: symlink
    path: /usr/local/bin/mongoexport
    uid: 0
    gid: 0
    source: /usr/bin/mongoexport
  - type: symlink
    path: /usr/local/bin/mongofiles
    uid: 0
    gid: 0
    source: /usr/bin/mongofiles
  - type: symlink
    path: /usr/local/bin/mongoimport
    uid: 0
    gid: 0
    source: /usr/bin/mongoimport
  - type: symlink
    path: /usr/local/bin/mongorestore
    uid: 0
    gid: 0
    source: /usr/bin/mongorestore
  - type: symlink
    path: /usr/local/bin/mongostat
    uid: 0
    gid: 0
    source: /usr/bin/mongostat
  - type: symlink
    path: /usr/local/bin/mongotop
    uid: 0
    gid: 0
    source: /usr/bin/mongotop
annotations:
  org.opencontainers.image.description: A minimal MongoDB image
  org.opencontainers.image.licenses: SSPL-1.0
entrypoint:
  - mongod
ports:
  - 27017/tcp
