# syntax=dhi.io/build:2-debian13

name: NVIDIA GDRCopy Driver 2.x
image: dhi.io/gdrdrv
variant: runtime
tags:
  - "2"
  - "2.6"
  - 2-debian
  - 2-debian13
  - 2.6-debian
  - v2.6-rhel9
  - 2.6-debian13
  - v2.6-rhel9.6
  - v2.6-rhel9.7
  - v2.6-rhel9.8
  - v2.6-rhcos4.14
  - v2.6-rhcos4.15
  - v2.6-rhcos4.16
  - v2.6-rhcos4.17
  - v2.6-rhcos4.18
  - v2.6-ubuntu22.04
  - v2.6-ubuntu24.04
  - v2.6-ubuntu26.04
platforms:
  - linux/amd64
  - linux/arm64
dates:
  release: "2019-09-16"
vars:
  BINUTILS_ARCH: '#{ target.arch == "amd64" ? "x86-64" : "aarch64" }'
  SEMVER_MAJOR_MINOR_VERSION: "2.6"
  SEMVER_MAJOR_VERSION: "2"
  SEMVER_VERSION: "2.6"
  VERSION: 2.6-1
contents:
  repositories:
    - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
  keyring:
    - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
  packages:
    - '!binutils'
    - '!binutils-aarch64-linux-gnu'
    - '!binutils-common'
    - '!binutils-x86-64-linux-gnu'
    - '!libbinutils'
    - '!libctf-nobfd0'
    - '!libctf0'
    - '!libelogind0'
    - '!libgprofng0'
    - '!libsframe1'
    - '!mawk'
    - '!original-awk'
    - base-files
    - bash
    - binutils-latest
    - binutils-latest-${BINUTILS_ARCH}-linux-gnu
    - ca-certificates-bundle
    - coreutils
    - findutils
    - gcc
    - gcc-13
    - gdrdrv-dkms-2=2.6-1
    - grep
    - kmod
    - libctf0-latest
    - libdw1t64
    - libelf1t64
    - make
    - mawk
    - sed
    - tzdata
accounts:
  root: true
  run-as: root
  users:
    - name: nonroot
      uid: 65532
      gid: 65532
  groups:
    - name: nonroot
      gid: 65532
      members:
        - nonroot
os-release:
  name: Docker Hardened Images (Debian)
  id: debian
  version-id: "13"
  version-codename: trixie
  pretty-name: Docker Hardened Images/Debian GNU/Linux 13 (trixie)
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
paths:
  - type: directory
    path: /usr/local/bin
    uid: 0
    gid: 0
    mode: "0755"
  - type: file
    path: /usr/local/bin/nvidia-gdrcopy-driver
    uid: 0
    gid: 0
    mode: "0755"
    source: image/gdrdrv/bin/nvidia-gdrcopy-driver
  - type: symlink
    path: /usr/local/bin/ocp_dtk_entrypoint
    uid: 0
    gid: 0
    source: nvidia-gdrcopy-driver
annotations:
  org.opencontainers.image.description: NVIDIA GDRCopy Driver - builds and loads the gdrdrv kernel module for the GPU Operator
  org.opencontainers.image.licenses: MIT AND Apache-2.0
entrypoint:
  - /usr/local/bin/nvidia-gdrcopy-driver
  - install
