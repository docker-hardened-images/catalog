# syntax=dhi.io/build:2-debian13

name: mongodb-exporter 0.53.x (compat)
image: dhi.io/mongodb-exporter
variant: runtime
flavor: compat
tags:
  - 0-compat
  - 0.53-compat
  - 0.53.0-compat
  - 0-debian-compat
  - 0-debian13-compat
  - 0.53-debian-compat
  - 0.53-debian13-compat
  - 0.53.0-debian-compat
  - 0.53.0-debian13-compat
platforms:
  - linux/amd64
  - linux/arm64
dates:
  release: "2016-04-13"
vars:
  COMMIT_SHA: 48208f20d75371755bf0b76af2d99e74980add00
  DEBIAN_VERSION: 0.53.0-1
  FLAVORED_SUFFIX: -compat
  SEMVER_MAJOR_MINOR_VERSION: "0.53"
  SEMVER_MAJOR_VERSION: "0"
  SEMVER_VERSION: 0.53.0
  SUFFIX: ""
  VERSION: 0.53.0
contents:
  repositories:
    - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
  keyring:
    - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
  packages:
    - '!gawk'
    - '!libelogind0'
    - '!original-awk'
    - apt
    - base-files
    - bash
    - ca-certificates
    - ca-certificates-bundle
    - coreutils
    - diffutils
    - dpkg
    - findutils
    - grep
    - libc-bin
    - mawk
    - mongodb-exporter=0.53.0-1
    - perl-base
    - sed
    - tzdata
    - util-linux
accounts:
  run-as: nonroot
  users:
    - name: nonroot
      uid: 65532
      gid: 65532
    - name: _apt
      uid: 42
      gid: 65532
  groups:
    - name: nonroot
      gid: 65532
      members:
        - nonroot
os-release:
  name: Docker Hardened Images (Debian)
  id: debian
  version-id: "13"
  version-codename: trixie
  pretty-name: Docker Hardened Images/Debian GNU/Linux 13 (trixie)
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
environment:
  DEBIAN_FRONTEND: noninteractive
paths:
  - type: directory
    path: /usr/local/bin
    uid: 0
    gid: 0
  - type: symlink
    path: /usr/local/bin/mongodb-exporter
    uid: 0
    gid: 0
    source: /usr/bin/mongodb-exporter
annotations:
  org.opencontainers.image.description: A minimal mongodb-exporter image
  org.opencontainers.image.licenses: Apache-2.0
entrypoint:
  - /usr/local/bin/mongodb-exporter
ports:
  - 9216/tcp
