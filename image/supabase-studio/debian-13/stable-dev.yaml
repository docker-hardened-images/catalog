# syntax=dhi.io/build:2-debian13

name: Supabase Studio 2026.x (dev)
image: dhi.io/supabase-studio
variant: dev
tags:
  - 2026-dev
  - 2026.08-dev
  - 2026.08.03-dev
  - 2026-debian-dev
  - 2026-debian13-dev
  - 2026.08-debian-dev
  - 2026.08-debian13-dev
  - 2026.08.03-debian-dev
  - 2026.08.03-debian13-dev
platforms:
  - linux/amd64
  - linux/arm64
dates:
  release: "2026-08-03"
vars:
  FLAVORED_SUFFIX: -dev
  SEMVER_MAJOR_MINOR_VERSION: "2026.08"
  SEMVER_MAJOR_VERSION: "2026"
  SEMVER_VERSION: 2026.08.03
  SUFFIX: -dev
  VERSION: 2026.08.03-0
contents:
  repositories:
    - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
  keyring:
    - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
  packages:
    - '!gawk'
    - '!libelogind0'
    - '!original-awk'
    - apt
    - base-files
    - bash
    - ca-certificates
    - ca-certificates-bundle
    - coreutils
    - diffutils
    - dpkg
    - dumb-init
    - findutils
    - grep
    - libc-bin
    - libc6
    - libgomp1
    - libstdc++6
    - mawk
    - netbase
    - nodejs-22
    - perl-base
    - sed
    - supabase-studio=2026.08.03-0
    - tzdata
    - util-linux
accounts:
  root: true
  run-as: root
  users:
    - name: node
      uid: 1000
      gid: 1000
    - name: _apt
      uid: 42
      gid: 65532
  groups:
    - name: node
      gid: 1000
      members:
        - node
os-release:
  name: Docker Hardened Images (Debian)
  id: debian
  version-id: "13"
  version-codename: trixie
  pretty-name: Docker Hardened Images/Debian GNU/Linux 13 (trixie)
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
work-dir: /app
environment:
  DEBIAN_FRONTEND: noninteractive
  HOSTNAME: 0.0.0.0
  NEXT_TELEMETRY_DISABLED: "1"
  NODE_ENV: production
  PORT: "3000"
paths:
  - type: file
    path: /usr/local/bin/supabase-studio-entrypoint.js
    uid: 0
    gid: 0
    mode: "0444"
    source: image/supabase-studio/entrypoint.js
  - type: symlink
    path: /app
    uid: 0
    gid: 0
    source: /usr/lib/supabase-studio
  - type: directory
    path: /usr/lib/supabase-studio/snippets
    uid: 1000
    gid: 1000
    mode: "0755"
  - type: directory
    path: /usr/lib/supabase-studio/edge-functions
    uid: 1000
    gid: 1000
    mode: "0755"
  - type: directory
    path: /usr/lib/supabase-studio
    uid: 0
    gid: 0
    mode: "0755"
annotations:
  org.opencontainers.image.description: A minimal Supabase Studio image
  org.opencontainers.image.licenses: Apache-2.0
entrypoint:
  - /usr/bin/dumb-init
  - --
  - node
  - /usr/local/bin/supabase-studio-entrypoint.js
cmd:
  - node
  - apps/studio/server.js
ports:
  - 3000/tcp
