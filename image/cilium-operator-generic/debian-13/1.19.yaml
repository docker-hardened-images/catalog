# syntax=dhi.io/build:2-debian13

name: Cilium Operator Generic 1.x
image: dhi.io/cilium-operator-generic
variant: runtime
tags:
  - "1.19"
  - 1.19.8
  - 1.19-debian
  - 1.19-debian13
  - 1.19.8-debian
  - 1.19.8-debian13
platforms:
  - linux/amd64
  - linux/arm64
dates:
  release: "2026-02-03"
vars:
  FLAVORED_SUFFIX: ""
  GOPS_VERSION: 0.3.29-5
  SEMVER_MAJOR_MINOR_VERSION: "1.19"
  SEMVER_MAJOR_VERSION: "1"
  SEMVER_VERSION: 1.19.8
  SUFFIX: ""
  VERSION: 1.19.8-2
contents:
  repositories:
    - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
  keyring:
    - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
  packages:
    - base-files
    - ca-certificates-bundle
    - cilium-operator-1.19=1.19.8-2
    - gops=0.3.29-5
    - tzdata
accounts:
  run-as: nonroot
  users:
    - name: nonroot
      uid: 65532
      gid: 65532
  groups:
    - name: nonroot
      gid: 65532
      members:
        - nonroot
os-release:
  name: Docker Hardened Images (Debian)
  id: debian
  version-id: "13"
  version-codename: trixie
  pretty-name: Docker Hardened Images/Debian GNU/Linux 13 (trixie)
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
paths:
  - type: directory
    path: /usr/local/bin
    uid: 0
    gid: 0
  - type: symlink
    path: /usr/local/bin/cilium-operator-generic
    uid: 0
    gid: 0
    source: /usr/bin/cilium-operator-generic
annotations:
  org.opencontainers.image.description: A minimal Cilium Operator Generic image
  org.opencontainers.image.licenses: Apache-2.0
entrypoint:
  - /usr/bin/cilium-operator-generic
