metadata:
  display-name: RKE2 Runtime
  short-description: Bundle of the node-level binaries and bootstrap chart manifests that RKE2 extracts onto every cluster node through its runtime-image option.
  featured: false
  home-url: https://docs.rke2.io/
  categories:
    - developer-tools
  included-tools:
    - name: containerd
      description: Container runtime daemon that RKE2 runs on every node.
    - name: containerd-shim-runc-v2
      description: containerd shim that drives runc for each pod sandbox and container.
    - name: ctr
      description: containerd command-line client for debugging the node runtime.
    - name: runc
      description: Statically linked OCI runtime that creates the containers.
    - name: crictl
      description: CRI command-line client for inspecting pods, containers and images on the node.
    - name: kubelet
      description: Kubernetes node agent.
    - name: kubectl
      description: Kubernetes command-line client bundled for node-level administration.
