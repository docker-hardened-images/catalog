            build_chart rke2-traefik "40.1.013" rke2-traefik-1.34-1.36
            build_chart rke2-traefik-crd "40.1.013" rke2-traefik-1.34-1.36
            build_chart rke2-metrics-server "3.14.001" rke2-metrics-server
            build_chart rke2-multus "v4.3.102" rke2-multus
            build_chart rke2-flannel "v0.28.907" rke2-flannel
            build_chart rancher-vsphere-cpi "1.16.200" rancher-vsphere-cpi
            build_chart rancher-vsphere-csi "3.7.3-rancher300" rancher-vsphere-csi
            build_chart harvester-cloud-provider "0.2.1500" harvester-cloud-provider
            build_chart harvester-csi-driver "0.1.3200" harvester-csi-driver
