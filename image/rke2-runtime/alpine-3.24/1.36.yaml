      pipeline:
        - runs: |
            set -eux -o pipefail

            versions="${source.dir}/charts-src/chart_versions.yaml"
            chart_flag() {
              yq ".charts[] | select(.filename == \"/charts/${1}.yaml\") | .${2} // false" "${versions}"
            }

            build_chart() {
              name="$1" version="$2" package="$3"
              out="${target.dir}/charts/${name}.yaml"
              if [ -z "${version}" ]; then
                return
              fi
              if [ "${version}" = "0.0.0" ]; then
                echo "# ${name} has been removed" > "${out}"
                return
              fi
              url="https://rke2-charts.rancher.io/assets/${package}/${name}-${version}.tgz"
              work="$(mktemp -d)"
              tar -xzf "${source.dir}/charts-src/${name}.tgz" -C "${work}"
              yq -i e ".kubeVersion = \">= v1.36.6\" | .annotations.\"fleet.cattle.io/bundle-id\" = \"rke2\"" "${work}/${name}/Chart.yaml"
              tar -C "${work}" --owner=0 --group=0 --numeric-owner --mode=gou-s+r --sort=name --mtime=@0 -cf "${work}.tar" "${name}"
              gzip -9n "${work}.tar"
              cat > "${out}" << MANIFEST
            apiVersion: helm.cattle.io/v1
            kind: HelmChart
            metadata:
              name: "${name}"
              namespace: "kube-system"
              annotations:
                helm.cattle.io/chart-url: "${url}"
                rke2.cattle.io/inject-cluster-config: "true"
            spec:
              forceConflicts: true
              failurePolicy: retry
              bootstrap: $(chart_flag "${name}" bootstrap)
              takeOwnership: $(chart_flag "${name}" takeOwnership)
              chartContent: $(base64 -w0 < "${work}.tar.gz")
            MANIFEST
              rm -rf "${work}" "${work}.tar.gz"
            }

            install -d -m 0755 "${target.dir}/charts"
            build_chart rke2-cilium "1.20.400" rke2-cilium
            build_chart rke2-canal "v3.32.2-build2026102200" rke2-canal
            build_chart rke2-calico "v3.32.200" rke2-calico
            build_chart rke2-calico-crd "v3.32.200" rke2-calico-crd
            build_chart rke2-coredns "1.49.002" rke2-coredns
            build_chart rke2-ingress-nginx "4.15.115" rke2-ingress-nginx
            build_chart rke2-traefik "40.1.022" rke2-traefik-1.34-1.36
            build_chart rke2-traefik-crd "40.1.022" rke2-traefik-1.34-1.36
            build_chart rke2-metrics-server "3.14.004" rke2-metrics-server
            build_chart rke2-multus "v4.3.118" rke2-multus
