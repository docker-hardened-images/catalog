      pipeline:
        - runs: |
            set -eux -o pipefail

            versions="${source.dir}/charts-src/chart_versions.yaml"
            chart_flag() {
              yq ".charts[] | select(.filename == \"/charts/${1}.yaml\") | .${2} // false" "${versions}"
            }

            build_chart() {
              name="$1" version="$2" package="$3"
              out="${target.dir}/charts/${name}.yaml"
              if [ -z "${version}" ]; then
                return
              fi
              if [ "${version}" = "0.0.0" ]; then
                echo "# ${name} has been removed" > "${out}"
                return
              fi
              url="https://rke2-charts.rancher.io/assets/${package}/${name}-${version}.tgz"
              work="$(mktemp -d)"
              tar -xzf "${source.dir}/charts-src/${name}.tgz" -C "${work}"
              yq -i e ".kubeVersion = \">= v1.35.8\" | .annotations.\"fleet.cattle.io/bundle-id\" = \"rke2\"" "${work}/${name}/Chart.yaml"
              tar -C "${work}" --owner=0 --group=0 --numeric-owner --mode=gou-s+r --sort=name --mtime=@0 -cf "${work}.tar" "${name}"
              gzip -9n "${work}.tar"
              cat > "${out}" << MANIFEST
            apiVersion: helm.cattle.io/v1
            kind: HelmChart
            metadata:
              name: "${name}"
              namespace: "kube-system"
              annotations:
                helm.cattle.io/chart-url: "${url}"
                rke2.cattle.io/inject-cluster-config: "true"
            spec:
              forceConflicts: true
              failurePolicy: retry
              bootstrap: $(chart_flag "${name}" bootstrap)
              takeOwnership: $(chart_flag "${name}" takeOwnership)
              chartContent: $(base64 -w0 < "${work}.tar.gz")
            MANIFEST
              rm -rf "${work}" "${work}.tar.gz"
            }

            install -d -m 0755 "${target.dir}/charts"
            build_chart rke2-cilium "1.19.601" rke2-cilium
