            build_chart rke2-traefik "40.1.010" rke2-traefik-1.34-1.36
            build_chart rke2-traefik-crd "40.1.010" rke2-traefik-1.34-1.36
            build_chart rke2-metrics-server "3.14.000" rke2-metrics-server
            build_chart rke2-multus "v4.3.008" rke2-multus
            build_chart rke2-flannel "v0.28.906" rke2-flannel
            build_chart rancher-vsphere-cpi "1.15.300" rancher-vsphere-cpi
            build_chart rancher-vsphere-csi "3.7.2-rancher700" rancher-vsphere-csi
            build_chart harvester-cloud-provider "0.2.1500" harvester-cloud-provider
