# syntax=dhi.io/build:2-debian13

name: Prometheus 3.x
image: dhi.io/prometheus
variant: runtime
tags:
  - "3.13"
  - 3.13.2
  - 3.13-debian
  - 3.13-debian13
  - 3.13.2-debian
  - 3.13.2-debian13
platforms:
  - linux/amd64
  - linux/arm64
vars:
  COMMIT_SHA: bb5dff00cf8fdfbf5c65e0531aa835fa238a43a2
  DEBIAN_EPOCH_MAJOR_MINOR_VERSION: "3.13"
  DEBIAN_EPOCH_MAJOR_VERSION: "3"
  DEBIAN_EPOCH_VERSION: 3.13.2
  PROMETHEUS_GO_MODULE_VERSION: 0.313.2
  RELEASE_TYPE: stable
  VERSION: 3.13.2
contents:
  repositories:
    - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
  keyring:
    - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
  packages:
    - base-files
    - ca-certificates-bundle
    - tzdata
  builds:
    - name: prometheus
      environment:
        USER: root
      caches:
        - path: /go/pkg/mod
      contents:
        packages:
          - make
          - curl
          - bzip2
          - gzip
          - bash
          - ca-certificates-bundle
          - coreutils
          - golang-1.26
          - findutils
          - mawk
          - sed
          - base-files
          - ca-certificates
          - git
          - libc6
          - libstdc++6
          - nodejs-24
          - node-corepack
          - npm
          - yarn-classic
          - tar
          - yq
        files:
          - url: git+https://github.com/prometheus/prometheus.git#v3.13.2
            checksum: bb5dff00cf8fdfbf5c65e0531aa835fa238a43a2
            path: /go/src/github.com/prometheus/prometheus
            spdx:
              name: prometheus
              version: 3.13.2
              packages:
                - name: prometheus
                  purl: pkg:dhi/prometheus@3.13.2
                  license: Apache-2.0
            uid: 0
            gid: 0
      pipeline:
        - name: spdx
          uses: spdx@v1
          with:
            license: Apache-2.0
            name: prometheus-go
            purl: pkg:golang/github.com/prometheus/prometheus@0.313.2
            version: 0.313.2
        - name: bump ui dependencies (3-stable only)
          work-dir: /go/src/github.com/prometheus/prometheus/web/ui/react-app
          privileged: true
          runs: |
            set -eux -o pipefail

            corepack enable pnpm

            yq -yi '.overrides."http-proxy-middleware" = "3.0.7"' pnpm-workspace.yaml # CVE-2026-55602
            yq -yi '.overrides."immutable" = "5.1.8"' pnpm-workspace.yaml             # CVE-2026-59879, CVE-2026-59880
            yq -yi '.overrides."postcss" = "8.5.18"' pnpm-workspace.yaml              # GHSA-r28c-9q8g-f849
            pnpm install --lockfile-only
        - name: install react-app dependencies for SBOM
          work-dir: /go/src/github.com/prometheus/prometheus/web/ui/react-app
          privileged: true
          runs: |
            set -eux -o pipefail

            pnpm install --prod --frozen-lockfile
        - name: create SBOM for static assests
          uses: sbom@v1
          with:
            extra-scanners: javascript-package-cataloger
            prefix: prometheus
            source: /go/src/github.com/prometheus/prometheus/web/ui/react-app/node_modules
        - name: compile static assets (3-stable only)
          work-dir: /go/src/github.com/prometheus/prometheus
          privileged: true
          runs: |
            set -eux -o pipefail

            # Install dependencies without running build scripts, then approve and rebuild
            cd web/ui && pnpm install --ignore-scripts && cd -
            cd web/ui/react-app && pnpm install --ignore-scripts && cd -
            cd web/ui/react-app && pnpm approve-builds unrs-resolver && cd -
            cd web/ui/react-app && pnpm rebuild && cd -

            make assets assets-compress
        - name: update go dependencies (3 only)
          uses: go/bump@v1
          work-dir: /go/src/github.com/prometheus/prometheus
          with:
            deps:
              - golang.org/x/text@v0.39.0
              - golang.org/x/net@v0.56.0
              - github.com/buger/jsonparser@v1.1.2
              - github.com/klauspost/compress@v1.18.7
              - google.golang.org/grpc@v1.82.1
            download: true
        - name: go build
          work-dir: /go/src/github.com/prometheus/prometheus
          environment:
            GOFLAGS: -buildvcs=false
          runs: |
            set -eux -o pipefail

            make plugins

            GOLDFLAGS="-X github.com/prometheus/common/version.Version=3.13.2
              -X github.com/prometheus/common/version.Revision=bb5dff00cf8fdfbf5c65e0531aa835fa238a43a2
              -X github.com/prometheus/common/version.Branch=HEAD
              -X github.com/prometheus/common/version.BuildUser=$USER@$HOSTNAME
              -X github.com/prometheus/common/version.BuildDate=$(date -u "+%Y%m%d-%H:%M:%S" ${SOURCE_DATE_EPOCH:+-d @$SOURCE_DATE_EPOCH})
              -X github.com/prometheus/prometheus/version.Version=3.13.2
            "

            CGO_ENABLED=0 go build \
              -mod=readonly \
              -ldflags "$GOLDFLAGS" \
              -tags netgo,builtinassets,stringlabels \
              ./cmd/prometheus

            CGO_ENABLED=0 go build \
              -mod=readonly \
              -ldflags "$GOLDFLAGS" \
              ./cmd/promtool
        - name: install
          work-dir: /go/src/github.com/prometheus/prometheus
          runs: |
            set -eux -o pipefail

            mkdir -p ${target.dir}/usr/local/bin
            cp ./prometheus ./promtool ${target.dir}/usr/local/bin/

            mkdir -p ${target.dir}/etc/prometheus
            cp ./documentation/examples/prometheus.yml ${target.dir}/etc/prometheus/
      paths:
        - type: file
          path: ${source.dir}/patch/npm-bumps.json
          uid: 0
          gid: 0
          source: image/prometheus/patch/npm-bumps.json
      outputs:
        - source: ${target.dir}/usr/local/bin/
          target: /usr/local/bin/
          uid: 0
          gid: 0
        - source: ${target.dir}/etc/prometheus
          target: /etc/prometheus
          uid: 0
          gid: 0
        - source: /opt/docker/sbom/prometheus
          target: /opt/docker/sbom/prometheus
          uid: 0
          gid: 0
        - source: /opt/docker/sbom/prometheus-go
          target: /opt/docker/sbom/prometheus-go
          uid: 0
          gid: 0
accounts:
  run-as: nonroot
  users:
    - name: nonroot
      uid: 65532
      gid: 65532
  groups:
    - name: nonroot
      gid: 65532
      members:
        - nonroot
os-release:
  name: Docker Hardened Images (Debian)
  id: debian
  version-id: "13"
  version-codename: trixie
  pretty-name: Docker Hardened Images/Debian GNU/Linux 13 (trixie)
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
paths:
  - type: directory
    path: /var/prometheus
    uid: 65532
    gid: 65532
    mode: "0755"
annotations:
  org.opencontainers.image.description: A minimal Prometheus image
  org.opencontainers.image.licenses: Apache-2.0
entrypoint:
  - prometheus
cmd:
  - --config.file=/etc/prometheus/prometheus.yml
  - --storage.tsdb.path=/var/prometheus
ports:
  - 9090/tcp
