# syntax=dhi.io/build:2-debian13

name: Linkerd Metrics API 26.x (dev)
image: dhi.io/linkerd-metrics-api
variant: dev
tags:
  - 26-dev
  - 26.10-dev
  - 26.10.3-dev
  - 26-debian-dev
  - 26-debian13-dev
  - 26.10-debian-dev
  - edge-26.10.3-dev
  - 26.10-debian13-dev
  - 26.10.3-debian-dev
  - 26.10.3-debian13-dev
  - edge-26.10.3-debian-dev
  - edge-26.10.3-debian13-dev
platforms:
  - linux/amd64
  - linux/arm64
dates:
  release: "2018-09-18"
vars:
  EDGE_VERSION: 26.10.3
  FLAVORED_SUFFIX: -dev
  SEMVER_MAJOR_MINOR_VERSION: "26.10"
  SEMVER_MAJOR_VERSION: "26"
  SEMVER_VERSION: 26.10.3
  SUFFIX: -dev
  VERSION: 26.10.3-0
contents:
  repositories:
    - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
  keyring:
    - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
  packages:
    - '!gawk'
    - '!libelogind0'
    - '!original-awk'
    - apt
    - base-files
    - bash
    - ca-certificates
    - ca-certificates-bundle
    - coreutils
    - diffutils
    - dpkg
    - findutils
    - grep
    - libc-bin
    - linkerd2-metrics-api-dev=26.10.3-0
    - mawk
    - perl-base
    - sed
    - tzdata
    - util-linux
accounts:
  root: true
  run-as: root
  users:
    - name: nonroot
      uid: 65532
      gid: 65532
    - name: _apt
      uid: 42
      gid: 65532
  groups:
    - name: nonroot
      gid: 65532
      members:
        - nonroot
os-release:
  name: Docker Hardened Images (Debian)
  id: debian
  version-id: "13"
  version-codename: trixie
  pretty-name: Docker Hardened Images/Debian GNU/Linux 13 (trixie)
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
environment:
  DEBIAN_FRONTEND: noninteractive
  LINKERD_CONTAINER_VERSION_OVERRIDE: edge-26.10.3
paths:
  - type: directory
    path: /usr/local/bin
    uid: 0
    gid: 0
  - type: symlink
    path: /usr/local/bin/linkerd2-metrics-api
    uid: 0
    gid: 0
    source: /usr/bin/linkerd2-metrics-api
  - type: symlink
    path: /metrics-api
    uid: 0
    gid: 0
    source: /usr/bin/linkerd2-metrics-api
annotations:
  org.opencontainers.image.description: A minimal Linkerd viz metrics API image
  org.opencontainers.image.licenses: Apache-2.0
entrypoint:
  - /usr/local/bin/linkerd2-metrics-api
