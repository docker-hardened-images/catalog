# syntax=dhi.io/build:2-debian13

name: oauth2-proxy 7.15.x (dev)
image: dhi.io/oauth2-proxy
variant: dev
tags:
  - 7-dev
  - 7.15-dev
  - 7.15.4-dev
  - 7-debian-dev
  - 7-debian13-dev
  - 7.15-debian-dev
  - 7.15-debian13-dev
  - 7.15.4-debian-dev
  - 7.15.4-debian13-dev
platforms:
  - linux/amd64
  - linux/arm64
vars:
  FLAVORED_SUFFIX: -dev
  GO_VERSION: 1.26.8
  GOLANG_DEB_VERSION: 1.26.8-0
  SEMVER_MAJOR_MINOR_VERSION: "7.15"
  SEMVER_MAJOR_VERSION: "7"
  SEMVER_VERSION: 7.15.4
  SUFFIX: -dev
  VERSION: 7.15.4-1
contents:
  repositories:
    - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
  keyring:
    - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
  packages:
    - '!gawk'
    - '!libelogind0'
    - '!original-awk'
    - apt
    - base-files
    - bash
    - ca-certificates
    - ca-certificates-bundle
    - coreutils
    - diffutils
    - dpkg
    - findutils
    - grep
    - libc-bin
    - mawk
    - oauth2-proxy-dev=7.15.4-1
    - perl-base
    - sed
    - tzdata
    - util-linux
accounts:
  root: true
  run-as: root
  users:
    - name: nonroot
      uid: 65532
      gid: 65532
    - name: _apt
      uid: 42
      gid: 65532
  groups:
    - name: nonroot
      gid: 65532
      members:
        - nonroot
os-release:
  name: Docker Hardened Images (Debian)
  id: debian
  version-id: "13"
  version-codename: trixie
  pretty-name: Docker Hardened Images/Debian GNU/Linux 13 (trixie)
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
environment:
  DEBIAN_FRONTEND: noninteractive
paths:
  - type: directory
    path: /usr/local/bin
    uid: 0
    gid: 0
  - type: symlink
    path: /usr/local/bin/oauth2-proxy
    uid: 0
    gid: 0
    source: /usr/bin/oauth2-proxy
annotations:
  org.opencontainers.image.description: A minimal oauth2-proxy image
  org.opencontainers.image.licenses: MIT
entrypoint:
  - /usr/local/bin/oauth2-proxy
