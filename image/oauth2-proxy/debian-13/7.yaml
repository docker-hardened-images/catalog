# syntax=dhi.io/build:2-debian13

name: oauth2-proxy 7.15.x
image: dhi.io/oauth2-proxy
variant: runtime
tags:
  - "7"
  - "7.15"
  - 7.15.4
  - 7-debian
  - 7-debian13
  - 7.15-debian
  - 7.15-debian13
  - 7.15.4-debian
  - 7.15.4-debian13
platforms:
  - linux/amd64
  - linux/arm64
vars:
  FLAVORED_SUFFIX: ""
  GO_VERSION: 1.26.8
  GOLANG_DEB_VERSION: 1.26.8-0
  SEMVER_MAJOR_MINOR_VERSION: "7.15"
  SEMVER_MAJOR_VERSION: "7"
  SEMVER_VERSION: 7.15.4
  SUFFIX: ""
  VERSION: 7.15.4-1
contents:
  repositories:
    - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
  keyring:
    - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
  packages:
    - base-files
    - ca-certificates-bundle
    - oauth2-proxy=7.15.4-1
    - tzdata
accounts:
  run-as: nonroot
  users:
    - name: nonroot
      uid: 65532
      gid: 65532
  groups:
    - name: nonroot
      gid: 65532
      members:
        - nonroot
os-release:
  name: Docker Hardened Images (Debian)
  id: debian
  version-id: "13"
  version-codename: trixie
  pretty-name: Docker Hardened Images/Debian GNU/Linux 13 (trixie)
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
paths:
  - type: directory
    path: /usr/local/bin
    uid: 0
    gid: 0
  - type: symlink
    path: /usr/local/bin/oauth2-proxy
    uid: 0
    gid: 0
    source: /usr/bin/oauth2-proxy
annotations:
  org.opencontainers.image.description: A minimal oauth2-proxy image
  org.opencontainers.image.licenses: MIT
entrypoint:
  - /usr/local/bin/oauth2-proxy
