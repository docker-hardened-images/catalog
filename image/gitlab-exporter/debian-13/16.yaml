# syntax=dhi.io/build:2-debian13

name: GitLab Exporter 16.x
image: dhi.io/gitlab-exporter
variant: runtime
tags:
  - "16"
  - "16.10"
  - 16.10.0
  - 16-debian
  - 16-debian13
  - 16.10-debian
  - 16.10-debian13
  - 16.10.0-debian
  - 16.10.0-debian13
platforms:
  - linux/amd64
  - linux/arm64
dates:
  release: "2025-07-30"
vars:
  RUBY_MAJOR_MINOR_VERSION: "3.3"
  RUBY_VERSION: 3.3.12-18
  SEMVER_MAJOR_MINOR_VERSION: "16.10"
  SEMVER_MAJOR_VERSION: "16"
  SEMVER_VERSION: 16.10.0
  VERSION: 16.10.0-8
contents:
  repositories:
    - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
  keyring:
    - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
  packages:
    - base-files
    - ca-certificates-bundle
    - dash
    - gitlab-exporter=16.10.0-8
    - libcrypt1
    - libffi8
    - libgmp10
    - libjemalloc2
    - libpq5
    - libssl3t64
    - libyaml-0-2
    - procps
    - ruby-3.3=3.3.12-18
    - tzdata
    - zlib1g
accounts:
  run-as: git
  users:
    - name: git
      uid: 1000
      gid: 1000
  groups:
    - name: git
      gid: 1000
      members:
        - git
os-release:
  name: Docker Hardened Images (Debian)
  id: debian
  version-id: "13"
  version-codename: trixie
  pretty-name: Docker Hardened Images/Debian GNU/Linux 13 (trixie)
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
environment:
  GEM_PATH: /usr/lib/gitlab-exporter/vendor/bundle/ruby/3.3.0:/usr/lib/ruby/gems/3.3.0
  LANG: C.UTF-8
  SSL_CERT_FILE: /etc/ssl/certs/ca-certificates.crt
paths:
  - type: file
    path: /usr/local/bin/gitlab-exporter
    uid: 0
    gid: 0
    mode: "0755"
    source: image/gitlab-exporter/scripts/gitlab-exporter
  - type: file
    path: /etc/gitlab-exporter/gitlab-exporter.yml
    uid: 0
    gid: 0
    mode: "0644"
    source: image/gitlab-exporter/config/gitlab-exporter.yml
annotations:
  org.opencontainers.image.description: A minimal GitLab Exporter (Prometheus) image
  org.opencontainers.image.licenses: MIT
entrypoint:
  - /usr/local/bin/gitlab-exporter
cmd:
  - web
  - -c
  - /etc/gitlab-exporter/gitlab-exporter.yml
ports:
  - 9168/tcp
