# Default gitlab-exporter configuration.
#
# Only the backing-service-free `ruby` probe is enabled, so the container boots
# and serves GET /ruby on port 9168 out of the box. This matches the probe the
# GitLab Helm chart enables for this component. To collect database (PostgreSQL)
# or sidekiq (Redis) metrics, mount your own config over this file (see the
# upstream config/gitlab-exporter.yml.example).
server:
  name: webrick
  listen_address: 0.0.0.0
  listen_port: 9168
  tls_enabled: false

probes:
  ruby:
    methods:
      - probe_gc
    opts:
      quantiles: false
