# syntax=dhi.io/build:2-debian13

name: GitHub Actions Runner 2.338.x (dev)
image: dhi.io/actions-runner
variant: dev
tags:
  - 2-dev
  - 2.338-dev
  - 2.338.0-dev
  - 2-debian-dev
  - 2-debian13-dev
  - 2.338-debian-dev
  - 2.338-debian13-dev
  - 2.338.0-debian-dev
  - 2.338.0-debian13-dev
platforms:
  - linux/amd64
  - linux/arm64
dates:
  release: "2026-08-19"
vars:
  HOOKS_VERSION: 0.8.1-0
  SEMVER_MAJOR_MINOR_VERSION: "2.338"
  SEMVER_MAJOR_VERSION: "2"
  SEMVER_VERSION: 2.338.0
  VERSION: 2.338.0-0
contents:
  repositories:
    - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
  keyring:
    - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
  packages:
    - '!gawk'
    - '!libelogind0'
    - '!original-awk'
    - actions-runner=2.338.0-0
    - apt
    - base-files
    - bash
    - ca-certificates
    - ca-certificates-bundle
    - coreutils
    - curl
    - diffutils
    - docker-buildx-plugin
    - docker-ce-cli
    - dpkg
    - findutils
    - gha-runner-container-hooks=0.8.1-0
    - git
    - grep
    - gzip
    - jq
    - libc-bin
    - libgcc-s1
    - libgssapi-krb5-2
    - libicu76
    - liblttng-ust1t64
    - libssl3t64
    - libstdc++6
    - mawk
    - perl-base
    - sed
    - tar
    - tzdata
    - unzip
    - util-linux
    - zlib1g
accounts:
  root: true
  run-as: root
  users:
    - name: nonroot
      uid: 65532
      gid: 65532
    - name: _apt
      uid: 42
      gid: 65532
  groups:
    - name: nonroot
      gid: 65532
      members:
        - nonroot
os-release:
  name: Docker Hardened Images (Debian)
  id: debian
  version-id: "13"
  version-codename: trixie
  pretty-name: Docker Hardened Images/Debian GNU/Linux 13 (trixie)
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
work-dir: /usr/lib/actions-runner
environment:
  ACTIONS_RUNNER_PRINT_LOG_TO_STDOUT: "1"
  DEBIAN_FRONTEND: noninteractive
  RUNNER_ALLOW_RUNASROOT: "1"
  RUNNER_MANUALLY_TRAP_SIG: "1"
paths:
  - type: directory
    path: /usr/lib/actions-runner
    uid: 65532
    gid: 65532
    mode: "1770"
  - type: directory
    path: /usr
    uid: 0
    gid: 0
    mode: "0755"
  - type: directory
    path: /usr/lib
    uid: 0
    gid: 0
    mode: "0755"
annotations:
  org.opencontainers.image.description: A minimal GitHub Actions Runner image
  org.opencontainers.image.licenses: MIT
entrypoint:
  - /usr/lib/actions-runner/run.sh
