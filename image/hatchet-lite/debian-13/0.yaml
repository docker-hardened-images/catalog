# syntax=dhi.io/build:2-debian13

name: Hatchet Lite 0.x
image: dhi.io/hatchet-lite
variant: runtime
tags:
  - "0"
  - "0.105"
  - 0.105.0
  - 0-debian
  - 0-debian13
  - 0.105-debian
  - 0.105-debian13
  - 0.105.0-debian
  - 0.105.0-debian13
platforms:
  - linux/amd64
  - linux/arm64
dates:
  release: "2025-08-04"
vars:
  SEMVER_MAJOR_MINOR_VERSION: "0.105"
  SEMVER_MAJOR_VERSION: "0"
  SEMVER_VERSION: 0.105.0
  VERSION: 0.105.0-2
contents:
  repositories:
    - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
  keyring:
    - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
  packages:
    - base-files
    - bash
    - ca-certificates
    - ca-certificates-bundle
    - hatchet-lite=0.105.0-2
    - tzdata
accounts:
  run-as: nonroot
  users:
    - name: nonroot
      uid: 65532
      gid: 65532
  groups:
    - name: nonroot
      gid: 65532
      members:
        - nonroot
os-release:
  name: Docker Hardened Images (Debian)
  id: debian
  version-id: "13"
  version-codename: trixie
  pretty-name: Docker Hardened Images/Debian GNU/Linux 13 (trixie)
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
environment:
  HATCHET_CONFIG_DIR: /config
  LITE_FRONTEND_PORT: "8081"
  LITE_RUNTIME_PORT: "8888"
  LITE_STATIC_ASSET_DIR: /static-assets
paths:
  - type: directory
    path: /usr/local/bin
    uid: 0
    gid: 0
  - type: symlink
    path: /usr/local/bin/hatchet-lite
    uid: 0
    gid: 0
    source: /usr/bin/hatchet-lite
  - type: symlink
    path: /usr/local/bin/hatchet-admin
    uid: 0
    gid: 0
    source: /usr/bin/hatchet-admin
  - type: symlink
    path: /usr/local/bin/hatchet-migrate
    uid: 0
    gid: 0
    source: /usr/bin/hatchet-migrate
  - type: file
    path: /usr/local/bin/docker-entrypoint.sh
    uid: 0
    gid: 0
    mode: "0755"
    source: image/hatchet-lite/bin/docker-entrypoint.sh
  - type: symlink
    path: /static-assets
    uid: 0
    gid: 0
    source: /usr/share/hatchet-lite/static-assets
  - type: directory
    path: /config
    uid: 65532
    gid: 65532
    mode: "0770"
annotations:
  org.opencontainers.image.description: A minimal Hatchet Lite image
  org.opencontainers.image.licenses: MIT
entrypoint:
  - /usr/local/bin/docker-entrypoint.sh
ports:
  - 8888/tcp
  - 7070/tcp
