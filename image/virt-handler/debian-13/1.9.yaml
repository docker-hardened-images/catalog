# syntax=dhi.io/build:2-debian13

name: Virt Handler 1.9.x
image: dhi.io/virt-handler
variant: runtime
tags:
  - "1"
  - "1.9"
  - 1.9.0
  - 1-debian
  - 1-debian13
  - 1.9-debian
  - 1.9-debian13
  - 1.9.0-debian
  - 1.9.0-debian13
platforms:
  - linux/amd64
  - linux/arm64
dates:
  release: "2026-07-27"
vars:
  COMMIT_SHA: 79d34c1762169e5b0370ec491cef5ca12e6b504c
  SEMVER_MAJOR_MINOR_VERSION: "1.9"
  SEMVER_MAJOR_VERSION: "1"
  SEMVER_VERSION: 1.9.0
  VERSION: 1.9.0
contents:
  repositories:
    - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
  keyring:
    - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
  packages:
    - base-files
    - ca-certificates-bundle
    - iproute2
    - iptables
    - libc6
    - mount
    - nftables
    - passt
    - procps
    - qemu-utils
    - selinux-utils
    - tzdata
    - util-linux
    - xorriso
  builds:
    - name: virt-handler
      work-dir: /go/src/kubevirt.io/kubevirt
      caches:
        - path: /go/pkg/mod
      contents:
        packages:
          - libnbd-dev
          - pkg-config
          - libvirt-dev
          - bash
          - ca-certificates-bundle
          - coreutils
          - golang-1.26
          - findutils
          - mawk
          - sed
        files:
          - url: git+https://github.com/kubevirt/kubevirt.git#v1.9.0
            checksum: 79d34c1762169e5b0370ec491cef5ca12e6b504c
            path: /go/src/kubevirt.io/kubevirt
            spdx:
              name: virt-handler
              version: 1.9.0
              packages:
                - name: virt-handler
                  purl: pkg:golang/kubevirt.io/kubevirt@1.9.0
                  license: Apache-2.0
            uid: 0
            gid: 0
      pipeline:
        - name: patch go dependencies (1.9 only)
          uses: go/bump@v2
          with:
            deps:
              - github.com/containernetworking/plugins@v1.9.0
              - github.com/google/cel-go@v0.29.0
              - github.com/klauspost/compress@v1.18.7
              - go.mongodb.org/mongo-driver@v1.17.7
              - golang.org/x/net@v0.56.0
              - golang.org/x/text@v0.39.0
              - google.golang.org/grpc@v1.82.1
            download: true
        - name: test
          runs: |
            set -eux -o pipefail

            # -vet=off: virt-handler v1.5.x has non-constant format strings caught by Go 1.26's linting
            # CGO_ENABLED=1: upstream requires libvirt C bindings (libvirt-dev)
            CGO_ENABLED=1 go test -vet=off ./cmd/virt-handler/... ./pkg/virt-handler/...
        - name: build
          uses: go/build@v1
          environment:
            GOFLAGS: -buildvcs=false
          with:
            cgo_enabled: 1
            ldflags:
              - -X kubevirt.io/client-go/version.gitVersion=v1.9.0
              - -X kubevirt.io/client-go/version.gitCommit=79d34c1762169e5b0370ec491cef5ca12e6b504c
            output: ${target.dir}/usr/local/bin/virt-handler
            packages: ./cmd/virt-handler
        - name: build virt-chroot
          uses: go/build@v1
          environment:
            GOFLAGS: -buildvcs=false
          with:
            cgo_enabled: 0
            output: ${target.dir}/usr/local/bin/virt-chroot
            packages: ./cmd/virt-chroot
      paths:
        - type: directory
          path: ${source.dir}/patch
          uid: 0
          gid: 0
          source: image/virt-handler/patch
      outputs:
        - source: ${target.dir}/usr/local/bin/virt-handler
          target: /usr/local/bin/virt-handler
          uid: 0
          gid: 0
        - source: ${target.dir}/usr/local/bin/virt-chroot
          target: /usr/local/bin/virt-chroot
          uid: 0
          gid: 0
        - source: /opt/docker/sbom/virt-handler
          target: /opt/docker/sbom/virt-handler
          uid: 0
          gid: 0
accounts:
  root: true
  run-as: root
  users:
    - name: qemu
      uid: 107
      gid: 107
  groups:
    - name: qemu
      gid: 107
os-release:
  name: Docker Hardened Images (Debian)
  id: debian
  version-id: "13"
  version-codename: trixie
  pretty-name: Docker Hardened Images/Debian GNU/Linux 13 (trixie)
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
