# syntax=dhi.io/build:2-debian13

name: Tomcat 10.x JDK 21.x (dev)
image: dhi.io/tomcat
variant: dev
tags:
  - 10-jdk21-dev
  - 10.1-jdk21-dev
  - 10.1.61-jdk21-dev
  - 10-jdk21-debian-dev
  - 10-jdk21-debian13-dev
  - 10.1-jdk21-debian-dev
  - 10.1-jdk21-debian13-dev
  - 10.1.61-jdk21-debian-dev
  - 10.1.61-jdk21-debian13-dev
platforms:
  - linux/amd64
  - linux/arm64
dates:
  release: "2022-01-17"
vars:
  DEBIAN_EPOCH_MAJOR_MINOR_VERSION: "10.1"
  DEBIAN_EPOCH_MAJOR_VERSION: "10"
  DEBIAN_EPOCH_VERSION: 10.1.61
  FLAVORED_SUFFIX: -dev
  JAVA_HOME: /opt/java/openjdk/21
  JAVA_RUNTIME_PACKAGE: eclipse-temurin-21-jdk
  JDK_FIPS_SUFFIX: ""
  JDK_MAJOR_VERSION: "21"
  PACKAGE_NAME: tomcat-10
  SUFFIX: -dev
  TOMCAT_MAJOR_MINOR_VERSION: "10.1"
  TOMCAT_MAJOR_VERSION: "10"
  VERSION: 10.1.61-3
contents:
  repositories:
    - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
  keyring:
    - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
  packages:
    - '!gawk'
    - '!libelogind0'
    - '!mawk'
    - '!original-awk'
    - apt
    - base-files
    - bash
    - ca-certificates
    - ca-certificates-bundle
    - coreutils
    - diffutils
    - dpkg
    - eclipse-temurin-21-jdk
    - eclipse-temurin-21-jdk-oci-config
    - findutils
    - grep
    - libapr1t64
    - libc-bin
    - libc6
    - libssl3t64
    - libstdc++6
    - mawk
    - perl-base
    - sed
    - tomcat-10=10.1.61-3
    - tzdata
    - util-linux
  builds:
    - name: locale
      contents:
        packages:
          - bash
          - locales
          - coreutils
          - gzip
      pipeline:
        - name: install locales
          runs: |
            set -eux -o pipefail

            ln -s /etc/locale.alias /usr/share/locale/locale.alias

            echo "en_US.UTF-8 UTF-8" >> /etc/locale.gen
            locale-gen en_US.UTF-8
      outputs:
        - source: /usr/share/locale
          target: /usr/share/locale
          uid: 0
          gid: 0
        - source: /usr/lib/locale
          target: /usr/lib/locale
          uid: 0
          gid: 0
accounts:
  root: true
  run-as: root
  users:
    - name: nonroot
      uid: 65532
      gid: 65532
    - name: nonroot
      uid: 65532
      gid: 65532
    - name: _apt
      uid: 42
      gid: 65532
  groups:
    - name: nonroot
      gid: 65532
      members:
        - nonroot
    - name: nonroot
      gid: 65532
      members:
        - nonroot
os-release:
  name: Docker Hardened Images (Debian)
  id: debian
  version-id: "13"
  version-codename: trixie
  pretty-name: Docker Hardened Images/Debian GNU/Linux 13 (trixie)
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
environment:
  CATALINA_HOME: /usr/local/tomcat
  DEBIAN_FRONTEND: noninteractive
  JAVA_HOME: /opt/java/openjdk/21
  LANG: en_US.UTF-8
  LANGUAGE: en_US:en
  LC_ALL: en_US.UTF-8
  LD_LIBRARY_PATH: /usr/local/tomcat/native-jni-lib
  PATH: /usr/local/tomcat/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
  TOMCAT_NATIVE_LIBDIR: /usr/local/tomcat/native-jni-lib
paths:
  - type: directory
    path: /usr/local
    uid: 0
    gid: 0
    mode: "0755"
  - type: symlink
    path: /usr/local/tomcat
    uid: 0
    gid: 0
    source: /usr/share/tomcat-10
  - type: directory
    path: /opt/java
    uid: 0
    gid: 0
    mode: "0755"
  - type: directory
    path: /opt/java/openjdk
    uid: 0
    gid: 0
    mode: "0755"
  - type: symlink
    path: /opt/java/openjdk/21-jre
    uid: 0
    gid: 0
    source: /usr/lib/jvm/temurin-21
  - type: directory
    path: /usr/share/tomcat-10/conf/Catalina/localhost
    uid: 65532
    gid: 65532
    mode: "0755"
  - type: directory
    path: /usr/share/tomcat-10/webapps
    uid: 65532
    gid: 65532
    mode: "0755"
  - type: symlink
    path: /opt/java/openjdk/21
    uid: 0
    gid: 0
    source: /usr/lib/jvm/temurin-21
annotations:
  org.opencontainers.image.description: A minimal Tomcat image
  org.opencontainers.image.licenses: Apache-2.0
cmd:
  - catalina.sh
  - run
