# syntax=dhi.io/build:2-debian13

name: Meilisearch 1.x
image: dhi.io/meilisearch
variant: runtime
tags:
  - "1"
  - "1.53"
  - 1.53.1
  - 1-debian
  - 1-debian13
  - 1.53-debian
  - 1.53-debian13
  - 1.53.1-debian
  - 1.53.1-debian13
platforms:
  - linux/amd64
  - linux/arm64
dates:
  release: "2023-02-06"
vars:
  SEMVER_MAJOR_MINOR_VERSION: "1.53"
  SEMVER_MAJOR_VERSION: "1"
  SEMVER_VERSION: 1.53.1
  VERSION: 1.53.1-0
contents:
  repositories:
    - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
  keyring:
    - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
  packages:
    - base-files
    - ca-certificates-bundle
    - libc6
    - libgcc-s1
    - libstdc++6
    - meilisearch=1.53.1-0
    - tzdata
accounts:
  run-as: nonroot
  users:
    - name: nonroot
      uid: 65532
      gid: 65532
  groups:
    - name: nonroot
      gid: 65532
      members:
        - nonroot
os-release:
  name: Docker Hardened Images (Debian)
  id: debian
  version-id: "13"
  version-codename: trixie
  pretty-name: Docker Hardened Images/Debian GNU/Linux 13 (trixie)
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
work-dir: /meili_data
environment:
  MEILI_HTTP_ADDR: 0.0.0.0:7700
  MEILI_SERVER_PROVIDER: docker
paths:
  - type: directory
    path: /usr/local/bin
    uid: 0
    gid: 0
  - type: symlink
    path: /usr/local/bin/meilisearch
    uid: 0
    gid: 0
    source: /usr/bin/meilisearch
  - type: symlink
    path: /usr/local/bin/meilitool
    uid: 0
    gid: 0
    source: /usr/bin/meilitool
  - type: symlink
    path: /meilisearch
    uid: 0
    gid: 0
    source: /usr/bin/meilisearch
  - type: directory
    path: /meili_data
    uid: 65532
    gid: 65532
    mode: "0770"
annotations:
  org.opencontainers.image.description: A minimal Meilisearch image
  org.opencontainers.image.licenses: MIT
entrypoint:
  - /bin/meilisearch
ports:
  - 7700/tcp
