# syntax=dhi.io/build:2-debian13

name: AWS Private CA Issuer 1.x
image: dhi.io/aws-privateca-issuer
variant: runtime
tags:
  - "1"
  - "1.9"
  - 1.9.1
  - 1-debian
  - 1-debian13
  - 1.9-debian
  - 1.9-debian13
  - 1.9.1-debian
  - 1.9.1-debian13
platforms:
  - linux/amd64
  - linux/arm64
dates:
  release: "2025-12-11"
vars:
  FLAVORED_SUFFIX: ""
  SEMVER_MAJOR_MINOR_VERSION: "1.9"
  SEMVER_MAJOR_VERSION: "1"
  SEMVER_VERSION: 1.9.1
  SUFFIX: ""
  VERSION: 1.9.1-3
contents:
  repositories:
    - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
  keyring:
    - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
  packages:
    - aws-privateca-issuer=1.9.1-3
    - base-files
    - ca-certificates-bundle
    - tzdata
accounts:
  run-as: nonroot
  users:
    - name: nonroot
      uid: 65532
      gid: 65532
  groups:
    - name: nonroot
      gid: 65532
      members:
        - nonroot
os-release:
  name: Docker Hardened Images (Debian)
  id: debian
  version-id: "13"
  version-codename: trixie
  pretty-name: Docker Hardened Images/Debian GNU/Linux 13 (trixie)
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
paths:
  - type: directory
    path: /usr/local/bin
    uid: 0
    gid: 0
  - type: symlink
    path: /usr/local/bin/manager
    uid: 0
    gid: 0
    source: /usr/bin/manager
  - type: symlink
    path: /manager
    uid: 0
    gid: 0
    source: /usr/local/bin/manager
annotations:
  org.opencontainers.image.description: A minimal AWS Private CA Issuer image
  org.opencontainers.image.licenses: Apache-2.0
entrypoint:
  - /manager
