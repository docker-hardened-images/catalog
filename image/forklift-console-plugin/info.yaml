metadata:
  display-name: Forklift Console Plugin
  short-description: |
    OpenShift console dynamic plugin for Forklift, the Migration Toolkit for
    Virtualization. Adds the migration UI (providers, plans, network and
    storage mappings) for moving virtual machines from VMware vSphere, oVirt,
    OpenStack, and OVA to KubeVirt.
