# syntax=dhi.io/build:2-debian13

name: Forklift Console Plugin 2.x
image: dhi.io/forklift-console-plugin
variant: runtime
tags:
  - "2"
  - "2.11"
  - 2.11.7
  - 2-debian
  - 2-debian13
  - 2.11-debian
  - 2.11-debian13
  - 2.11.7-debian
  - 2.11.7-debian13
platforms:
  - linux/amd64
  - linux/arm64
dates:
  release: "2023-05-07"
vars:
  SEMVER_MAJOR_MINOR_VERSION: "2.11"
  SEMVER_MAJOR_VERSION: "2"
  SEMVER_VERSION: 2.11.7
  VERSION: 2.11.7-1
contents:
  repositories:
    - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
  keyring:
    - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
  packages:
    - base-files
    - ca-certificates-bundle
    - forklift-console-plugin=2.11.7-1
    - libc6
    - libcrypt1
    - libpcre2-8-0
    - libssl3t64
    - nginx-mainline
    - tzdata
    - zlib1g
accounts:
  run-as: nginx
  users:
    - name: nginx
      uid: 65532
      gid: 65532
  groups:
    - name: nginx
      gid: 65532
      members:
        - nginx
os-release:
  name: Docker Hardened Images (Debian)
  id: debian
  version-id: "13"
  version-codename: trixie
  pretty-name: Docker Hardened Images/Debian GNU/Linux 13 (trixie)
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
paths:
  - type: directory
    path: /opt/app-root
    uid: 0
    gid: 0
    mode: "0755"
  - type: symlink
    path: /opt/app-root/src
    uid: 0
    gid: 0
    source: /usr/share/forklift-console-plugin
  - type: directory
    path: /var/cache/nginx
    uid: 65532
    gid: 65532
    mode: "0755"
  - type: directory
    path: /run
    uid: 65532
    gid: 65532
    mode: "0755"
  - type: symlink
    path: /var/log/nginx/access.log
    uid: 0
    gid: 0
    source: /dev/stdout
  - type: symlink
    path: /var/log/nginx/error.log
    uid: 0
    gid: 0
    source: /dev/stderr
  - type: file
    path: /etc/nginx/nginx.conf
    uid: 0
    gid: 0
    mode: "0644"
    source: image/forklift-console-plugin/config/nginx.conf
  - type: file
    path: /etc/nginx/conf.d/default.conf
    uid: 0
    gid: 0
    mode: "0644"
    source: image/forklift-console-plugin/config/default.conf
annotations:
  org.opencontainers.image.description: A minimal Forklift console plugin image
  org.opencontainers.image.licenses: Apache-2.0
entrypoint:
  - nginx
cmd:
  - -g
  - daemon off;
ports:
  - 8080/tcp
