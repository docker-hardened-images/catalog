server {
    listen 8080;
    listen [::]:8080;
    server_name localhost;

    root /opt/app-root/src;

    location = /plugin-manifest.json {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    location /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 'ok';
    }

    location / {
        try_files $uri =404;
    }
}
