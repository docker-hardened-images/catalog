# syntax=dhi.io/build:2-debian13

name: MySQL Operator 9.7.x
image: dhi.io/mysql-operator
variant: runtime
tags:
  - "9"
  - "9.7"
  - 9.7.0
  - 9-debian
  - 9-debian13
  - 9.7-debian
  - 9.7.0-2.2.8
  - 9.7-debian13
  - 9.7.0-debian
  - 9.7.0-debian13
  - 9.7.0-2.2.8-debian
  - 9.7.0-2.2.8-debian13
platforms:
  - linux/amd64
  - linux/arm64
dates:
  release: "2026-04-21"
vars:
  MYSQL_VERSION: 9.7.0
  OPERATOR_VERSION: 9.7.0-2.2.8
  SEMVER_MAJOR_MINOR_VERSION: "9.7"
  SEMVER_MAJOR_VERSION: "9"
  SEMVER_VERSION: 9.7.0
  VERSION: 9.7.0-2.2.8-0
contents:
  repositories:
    - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
  keyring:
    - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
  packages:
    - base-files
    - bash
    - ca-certificates-bundle
    - coreutils
    - curl
    - libcurl4t64
    - libssh-4
    - libssl3t64
    - libstdc++6
    - mysql-operator-9.7=9.7.0-2.2.8-0
    - python-3.13
    - python-3.13-dev
    - python3-pip
    - python3-setuptools
    - python3-wheel
    - tzdata
accounts:
  run-as: mysql-operator
  users:
    - name: mysql
      uid: 27
      gid: 27
    - name: mysql-operator
      uid: 2
      gid: 2
  groups:
    - name: mysql
      gid: 27
      members:
        - mysql
    - name: mysql-operator
      gid: 2
      members:
        - mysql-operator
os-release:
  name: Docker Hardened Images (Debian)
  id: debian
  version-id: "13"
  version-codename: trixie
  pretty-name: Docker Hardened Images/Debian GNU/Linux 13 (trixie)
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
environment:
  HOME: /mysqlsh
paths:
  - type: directory
    path: /usr/local/bin
    uid: 0
    gid: 0
  - type: symlink
    path: /usr/local/bin/mysqlsh
    uid: 0
    gid: 0
    source: /usr/bin/mysqlsh
  - type: symlink
    path: /usr/local/bin/mysql-secret-store-login-path
    uid: 0
    gid: 0
    source: /usr/bin/mysql-secret-store-login-path
  - type: directory
    path: /usr/local/lib
    uid: 0
    gid: 0
  - type: symlink
    path: /usr/local/lib/mysqlsh
    uid: 0
    gid: 0
    source: /usr/lib/mysqlsh
  - type: directory
    path: /usr/local/lib/mysql
    uid: 0
    gid: 0
  - type: symlink
    path: /usr/local/lib/mysql/plugins
    uid: 0
    gid: 0
    source: /usr/lib/mysql/plugins
  - type: directory
    path: /usr/local/share
    uid: 0
    gid: 0
  - type: symlink
    path: /usr/local/share/mysqlsh
    uid: 0
    gid: 0
    source: /usr/share/mysqlsh
  - type: directory
    path: /usr/local/libexec
    uid: 0
    gid: 0
  - type: symlink
    path: /usr/local/libexec/mysqlsh
    uid: 0
    gid: 0
    source: /usr/libexec/mysqlsh
  - type: directory
    path: /mysqlsh
    uid: 2
    gid: 2
annotations:
  org.opencontainers.image.description: A minimal MySQL Operator image
  org.opencontainers.image.licenses: UPL 1.0
