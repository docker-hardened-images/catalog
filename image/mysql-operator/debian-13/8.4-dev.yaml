# syntax=dhi.io/build:2-debian13

name: MySQL Operator 8.4.x (dev)
image: dhi.io/mysql-operator
variant: dev
tags:
  - 8-dev
  - 8.4-dev
  - 8.4.9-dev
  - 8-debian-dev
  - 8-debian13-dev
  - 8.4-debian-dev
  - 8.4-debian13-dev
  - 8.4.9-2.1.11-dev
  - 8.4.9-debian-dev
  - 8.4.9-debian13-dev
  - 8.4.9-2.1.11-debian-dev
  - 8.4.9-2.1.11-debian13-dev
platforms:
  - linux/amd64
  - linux/arm64
dates:
  release: "2024-04-10"
  end-of-life: "2032-04-30"
vars:
  MYSQL_VERSION: 8.4.9
  OPERATOR_VERSION: 8.4.9-2.1.11
  SEMVER_MAJOR_MINOR_VERSION: "8.4"
  SEMVER_MAJOR_VERSION: "8"
  SEMVER_VERSION: 8.4.9
  VERSION: 8.4.9-2.1.11-1
contents:
  repositories:
    - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
  keyring:
    - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
  packages:
    - '!gawk'
    - '!libelogind0'
    - '!original-awk'
    - apt
    - base-files
    - bash
    - ca-certificates
    - ca-certificates-bundle
    - coreutils
    - curl
    - diffutils
    - dpkg
    - findutils
    - grep
    - libc-bin
    - libcurl4t64
    - libssh-4
    - libssl3t64
    - libstdc++6
    - mawk
    - mysql-operator-8.4=8.4.9-2.1.11-1
    - perl-base
    - python-3.13
    - python-3.13-dev
    - python3-pip
    - python3-setuptools
    - python3-wheel
    - sed
    - tzdata
    - util-linux
accounts:
  root: true
  run-as: root
  users:
    - name: mysql
      uid: 27
      gid: 27
    - name: mysql-operator
      uid: 2
      gid: 2
    - name: _apt
      uid: 42
      gid: 65532
  groups:
    - name: mysql
      gid: 27
      members:
        - mysql
    - name: mysql-operator
      gid: 2
      members:
        - mysql-operator
os-release:
  name: Docker Hardened Images (Debian)
  id: debian
  version-id: "13"
  version-codename: trixie
  pretty-name: Docker Hardened Images/Debian GNU/Linux 13 (trixie)
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
environment:
  DEBIAN_FRONTEND: noninteractive
  HOME: /mysqlsh
paths:
  - type: directory
    path: /usr/local/bin
    uid: 0
    gid: 0
  - type: symlink
    path: /usr/local/bin/mysqlsh
    uid: 0
    gid: 0
    source: /usr/bin/mysqlsh
  - type: symlink
    path: /usr/local/bin/mysql-secret-store-login-path
    uid: 0
    gid: 0
    source: /usr/bin/mysql-secret-store-login-path
  - type: directory
    path: /usr/local/lib
    uid: 0
    gid: 0
  - type: symlink
    path: /usr/local/lib/mysqlsh
    uid: 0
    gid: 0
    source: /usr/lib/mysqlsh
  - type: directory
    path: /usr/local/lib/mysql
    uid: 0
    gid: 0
  - type: symlink
    path: /usr/local/lib/mysql/plugins
    uid: 0
    gid: 0
    source: /usr/lib/mysql/plugins
  - type: directory
    path: /usr/local/share
    uid: 0
    gid: 0
  - type: symlink
    path: /usr/local/share/mysqlsh
    uid: 0
    gid: 0
    source: /usr/share/mysqlsh
  - type: directory
    path: /mysqlsh
    uid: 2
    gid: 2
annotations:
  org.opencontainers.image.description: A minimal MySQL Operator image
  org.opencontainers.image.licenses: UPL 1.0
