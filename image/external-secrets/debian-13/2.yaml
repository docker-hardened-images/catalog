# syntax=dhi.io/build:2-debian13

name: External Secrets 2.x
image: dhi.io/external-secrets
variant: runtime
tags:
  - "2"
  - "2.10"
  - 2.10.0
  - 2-debian
  - 2-debian13
  - 2.10-debian
  - 2.10-debian13
  - 2.10.0-debian
  - 2.10.0-debian13
platforms:
  - linux/amd64
  - linux/arm64
dates:
  release: "2026-02-06"
vars:
  FLAVORED_SUFFIX: ""
  SEMVER_MAJOR_MINOR_VERSION: "2.10"
  SEMVER_MAJOR_VERSION: "2"
  SEMVER_VERSION: 2.10.0
  SUFFIX: ""
  VERSION: 2.10.0-1
contents:
  repositories:
    - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
  keyring:
    - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
  packages:
    - base-files
    - ca-certificates-bundle
    - esoctl=2.10.0-1
    - external-secrets-2=2.10.0-1
    - tzdata
accounts:
  run-as: nonroot
  users:
    - name: nonroot
      uid: 65532
      gid: 65532
  groups:
    - name: nonroot
      gid: 65532
      members:
        - nonroot
os-release:
  name: Docker Hardened Images (Debian)
  id: debian
  version-id: "13"
  version-codename: trixie
  pretty-name: Docker Hardened Images/Debian GNU/Linux 13 (trixie)
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
paths:
  - type: directory
    path: /usr/local/bin
    uid: 0
    gid: 0
  - type: symlink
    path: /usr/local/bin/external-secrets
    uid: 0
    gid: 0
    source: /usr/bin/external-secrets
  - type: symlink
    path: /usr/local/bin/esoctl
    uid: 0
    gid: 0
    source: /usr/bin/esoctl
annotations:
  org.opencontainers.image.description: A minimal External Secrets Operator image
  org.opencontainers.image.licenses: Apache-2.0
entrypoint:
  - external-secrets
