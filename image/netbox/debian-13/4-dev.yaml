# syntax=dhi.io/build:2-debian13

name: NetBox 4.x (dev)
image: dhi.io/netbox
variant: dev
tags:
  - 4-dev
  - 4.7-dev
  - 4.7.3-dev
  - 4-debian-dev
  - 4-debian13-dev
  - 4.7-debian-dev
  - 4.7-debian13-dev
  - 4.7.3-debian-dev
  - 4.7.3-debian13-dev
platforms:
  - linux/amd64
  - linux/arm64
dates:
  release: "2024-05-06"
vars:
  PYTHON_MAJOR_MINOR_VERSION: "3.12"
  SEMVER_MAJOR_MINOR_VERSION: "4.7"
  SEMVER_MAJOR_VERSION: "4"
  SEMVER_VERSION: 4.7.3
  VERSION: 4.7.3-4
contents:
  repositories:
    - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
  keyring:
    - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
  packages:
    - '!gawk'
    - '!libelogind0'
    - '!original-awk'
    - apt
    - base-files
    - bash
    - ca-certificates
    - ca-certificates-bundle
    - coreutils
    - diffutils
    - dpkg
    - findutils
    - grep
    - libc-bin
    - libldap-common
    - libpq5
    - libstdc++6
    - libxmlsec1t64-openssl
    - libxslt1.1
    - mawk
    - netbox=4.7.3-4
    - perl-base
    - python-3.12
    - python3-pip
    - python3-setuptools
    - python3-wheel
    - sed
    - tini
    - tzdata
    - util-linux
accounts:
  root: true
  run-as: root
  users:
    - name: nonroot
      uid: 65532
      gid: 65532
    - name: _apt
      uid: 42
      gid: 65532
  groups:
    - name: nonroot
      gid: 65532
      members:
        - nonroot
os-release:
  name: Docker Hardened Images (Debian)
  id: debian
  version-id: "13"
  version-codename: trixie
  pretty-name: Docker Hardened Images/Debian GNU/Linux 13 (trixie)
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
work-dir: /opt/netbox/netbox
environment:
  DEBIAN_FRONTEND: noninteractive
  GRANIAN_WORKERS: "4"
  HOME: /home/nonroot
  PATH: /opt/netbox/venv/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
  PYTHONDONTWRITEBYTECODE: "1"
  PYTHONPATH: /opt/netbox/netbox
  PYTHONUNBUFFERED: "1"
paths:
  - type: directory
    path: /opt/netbox
    uid: 0
    gid: 0
    mode: "0755"
  - type: symlink
    path: /opt/netbox/venv
    uid: 0
    gid: 0
    source: /usr/lib/netbox
  - type: symlink
    path: /opt/netbox/netbox
    uid: 0
    gid: 0
    source: /usr/share/netbox/netbox
  - type: symlink
    path: /opt/netbox/docker-entrypoint.sh
    uid: 0
    gid: 0
    source: /usr/share/netbox/docker-entrypoint.sh
  - type: symlink
    path: /opt/netbox/launch-netbox.sh
    uid: 0
    gid: 0
    source: /usr/share/netbox/launch-netbox.sh
  - type: symlink
    path: /opt/netbox/super_user.py
    uid: 0
    gid: 0
    source: /usr/share/netbox/super_user.py
  - type: directory
    path: /opt/netbox/netbox/media
    uid: 65532
    gid: 65532
    mode: "0775"
  - type: directory
    path: /opt/netbox/netbox/scripts
    uid: 65532
    gid: 65532
    mode: "0775"
  - type: directory
    path: /opt/netbox/netbox/reports
    uid: 65532
    gid: 65532
    mode: "0775"
  - type: directory
    path: /home/nonroot
    uid: 65532
    gid: 65532
    mode: "0755"
annotations:
  org.opencontainers.image.description: A minimal NetBox image
  org.opencontainers.image.licenses: Apache-2.0
entrypoint:
  - /usr/bin/tini
  - --
cmd:
  - /opt/netbox/docker-entrypoint.sh
  - /opt/netbox/launch-netbox.sh
ports:
  - 8080/tcp
