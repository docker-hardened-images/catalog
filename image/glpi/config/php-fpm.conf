[global]
pid = /run/php/php-fpm.pid
error_log = /proc/self/fd/2
daemonize = no

[www]
listen = /run/php/php-fpm.sock
listen.mode = 0660
; GLPI reads its GLPI_* paths with getenv(); web workers need the container
; environment as the CLI sees it.
clear_env = no
pm = dynamic
pm.max_children = 5
pm.start_servers = 2
pm.min_spare_servers = 1
pm.max_spare_servers = 3
catch_workers_output = yes
decorate_workers_output = no
