# syntax=dhi.io/build:2-debian13

name: Directus 12.x (dev)
image: dhi.io/directus
variant: dev
tags:
  - 12-dev
  - 12.4-dev
  - 12.4.1-dev
  - 12-debian-dev
  - 12-debian13-dev
  - 12.4-debian-dev
  - 12.4-debian13-dev
  - 12.4.1-debian-dev
  - 12.4.1-debian13-dev
platforms:
  - linux/amd64
  - linux/arm64
dates:
  release: "2026-06-10"
vars:
  SEMVER_MAJOR_MINOR_VERSION: "12.4"
  SEMVER_MAJOR_VERSION: "12"
  SEMVER_VERSION: 12.4.1
  VERSION: 12.4.1-2
contents:
  repositories:
    - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
  keyring:
    - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
  packages:
    - '!gawk'
    - '!libelogind0'
    - '!original-awk'
    - apt
    - base-files
    - bash
    - ca-certificates
    - ca-certificates-bundle
    - coreutils
    - diffutils
    - directus-12=12.4.1-2
    - dpkg
    - findutils
    - grep
    - libc-bin
    - mawk
    - nodejs-22
    - perl-base
    - sed
    - tzdata
    - util-linux
accounts:
  root: true
  run-as: root
  users:
    - name: node
      uid: 1000
      gid: 1000
    - name: _apt
      uid: 42
      gid: 65532
  groups:
    - name: node
      gid: 1000
      members:
        - node
os-release:
  name: Docker Hardened Images (Debian)
  id: debian
  version-id: "13"
  version-codename: trixie
  pretty-name: Docker Hardened Images/Debian GNU/Linux 13 (trixie)
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
work-dir: /directus
environment:
  DB_CLIENT: sqlite3
  DB_FILENAME: /directus/database/database.sqlite
  DEBIAN_FRONTEND: noninteractive
  NODE_ENV: production
  NPM_CONFIG_UPDATE_NOTIFIER: "false"
  PIDUSAGE_SILENT: "true"
  PM2_HOME: /directus/.pm2
  TEMP_PATH: /directus/.temp
paths:
  - type: symlink
    path: /directus
    uid: 0
    gid: 0
    source: /usr/lib/nodejs/directus
  - type: directory
    path: /usr/lib/nodejs/directus/database
    uid: 1000
    gid: 1000
    mode: "0770"
  - type: directory
    path: /usr/lib/nodejs/directus/extensions
    uid: 1000
    gid: 1000
    mode: "0770"
  - type: directory
    path: /usr/lib/nodejs/directus/uploads
    uid: 1000
    gid: 1000
    mode: "0770"
  - type: directory
    path: /usr/lib/nodejs/directus/.pm2
    uid: 1000
    gid: 1000
    mode: "0770"
  - type: directory
    path: /usr/lib/nodejs/directus/.temp
    uid: 1000
    gid: 1000
    mode: "0770"
  - type: directory
    path: /usr/local/bin
    uid: 0
    gid: 0
    mode: "0755"
  - type: symlink
    path: /usr/local/bin/pm2
    uid: 0
    gid: 0
    source: /usr/bin/pm2
annotations:
  org.opencontainers.image.description: A minimal Directus image
  org.opencontainers.image.licenses: LicenseRef-MSCL-1.0-GPL
entrypoint:
  - node
cmd:
  - docker-entrypoint.cjs
ports:
  - 8055/tcp
