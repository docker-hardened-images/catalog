# syntax=dhi.io/build:2-alpine3.24

name: Directus 12.x (dev)
image: dhi.io/directus
variant: dev
tags:
  - 12-alpine-dev
  - 12.4-alpine-dev
  - 12-alpine3.24-dev
  - 12.4.1-alpine-dev
  - 12.4-alpine3.24-dev
  - 12.4.1-alpine3.24-dev
platforms:
  - linux/amd64
  - linux/arm64
dates:
  release: "2026-06-10"
vars:
  SEMVER_MAJOR_MINOR_VERSION: "12.4"
  SEMVER_MAJOR_VERSION: "12"
  SEMVER_VERSION: 12.4.1
  VERSION: 12.4.1-r2
contents:
  repositories:
    - https://dhi.io/apk/alpine/v3.24/main
    - https://dl-cdn.alpinelinux.org/alpine/v3.24/main
    - https://dl-cdn.alpinelinux.org/alpine/v3.24/community
  keyring:
    - https://dhi.io/keyring/dhi-apk@docker-0F81AD7700D99184.rsa.pub
  packages:
    - alpine-baselayout-data
    - apk-tools
    - busybox
    - ca-certificates
    - ca-certificates-bundle
    - directus-12=12.4.1-r2
    - nodejs-22
    - tzdata
accounts:
  root: true
  run-as: root
  users:
    - name: node
      uid: 1000
      gid: 1000
  groups:
    - name: node
      gid: 1000
      members:
        - node
os-release:
  name: Docker Hardened Images (Alpine)
  id: alpine
  version-id: "3.24"
  pretty-name: Docker Hardened Images/Alpine Linux v3.24
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
work-dir: /directus
environment:
  DB_CLIENT: sqlite3
  DB_FILENAME: /directus/database/database.sqlite
  NODE_ENV: production
  NPM_CONFIG_UPDATE_NOTIFIER: "false"
  PIDUSAGE_SILENT: "true"
  PM2_HOME: /directus/.pm2
  TEMP_PATH: /directus/.temp
paths:
  - type: symlink
    path: /directus
    uid: 0
    gid: 0
    source: /usr/lib/nodejs/directus
  - type: directory
    path: /usr/lib/nodejs/directus/database
    uid: 1000
    gid: 1000
    mode: "0770"
  - type: directory
    path: /usr/lib/nodejs/directus/extensions
    uid: 1000
    gid: 1000
    mode: "0770"
  - type: directory
    path: /usr/lib/nodejs/directus/uploads
    uid: 1000
    gid: 1000
    mode: "0770"
  - type: directory
    path: /usr/lib/nodejs/directus/.pm2
    uid: 1000
    gid: 1000
    mode: "0770"
  - type: directory
    path: /usr/lib/nodejs/directus/.temp
    uid: 1000
    gid: 1000
    mode: "0770"
  - type: directory
    path: /usr/local/bin
    uid: 0
    gid: 0
    mode: "0755"
  - type: symlink
    path: /usr/local/bin/pm2
    uid: 0
    gid: 0
    source: /usr/bin/pm2
annotations:
  org.opencontainers.image.description: A minimal Directus image
  org.opencontainers.image.licenses: LicenseRef-MSCL-1.0-GPL
entrypoint:
  - node
cmd:
  - docker-entrypoint.cjs
ports:
  - 8055/tcp
