          uid: 0
          gid: 0
        - source: /opt/docker/sbom/php-ext-pdo-mysql
          target: /opt/docker/sbom/php-ext-pdo-mysql
          uid: 0
          gid: 0
        - source: /opt/docker/sbom/php-ext-redis
          target: /opt/docker/sbom/php-ext-redis
          uid: 0
          gid: 0
        - source: /opt/docker/sbom/php-ext-memcached
          target: /opt/docker/sbom/php-ext-memcached
          uid: 0
          gid: 0
    - name: production dotenv
      shell: bash
      contents:
        packages:
          - bash
          - coreutils
          - grep
          - sed
          - snipe-it-8=8.8.3-r4
      pipeline:
        - name: set production defaults
          runs: |
            set -eux -o pipefail

            f=/usr/share/snipe-it/.env
            grep -q '^#APP_ENV=develop$' "$f"
            sed -i 's/^#APP_ENV=develop$/APP_ENV=production/' "$f"
            grep -q '^#APP_DEBUG=false$' "$f"
            sed -i 's/^#APP_DEBUG=false$/APP_DEBUG=false/' "$f"
            grep -q '^APP_ENV=production$' "$f"
            grep -q '^APP_DEBUG=false$' "$f"
            mkdir -p '${target.dir}/usr/share/snipe-it'
            cp -a "$f" '${target.dir}/usr/share/snipe-it/.env'
      outputs:
        - source: ${target.dir}/usr/share/snipe-it/.env
          target: /usr/share/snipe-it/.env
          uid: 0
          gid: 0
          mode: "0644"
    - name: setcap nginx
      shell: bash
      contents:
        packages:
          - bash
          - coreutils
          - libcap-utils
          - nginx-stable=1.30.6-r5
      pipeline:
        - name: setcap
          runs: |
            set -eux -o pipefail

            setcap 'cap_net_bind_service=+ep' /usr/sbin/nginx
            setcap -v 'cap_net_bind_service=+ep' /usr/sbin/nginx
      outputs:
        - source: /usr/sbin/nginx
          target: /usr/sbin/nginx
          uid: 0
          gid: 0
