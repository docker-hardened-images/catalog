          - libjpeg-turbo-dev
          - libpng-dev
          - libzip-dev
          - pcre2-dev
          - openldap-dev
          - libmemcached-dev
        files:
          - url: https://www.php.net/distributions/php-8.3.36.tar.xz
            checksum: sha256:dd54693aa334c5c4d72e9aee96b082c2473750a18a6c1d105789c93a3b1692fd
            path: ${source.dir}/php-8.3.36.tar.xz
            spdx:
              name: php
              version: 8.3.36
              packages:
                - name: php
                  purl: pkg:generic/php@8.3.36
                  license: PHP-3.01
            uid: 0
            gid: 0
          - url: https://pecl.php.net/get/redis-6.3.0.tgz
            checksum: sha256:0d5141f634bd1db6c1ddcda053d25ecf2c4fc1c395430d534fd3f8d51dd7f0b5
            path: ${source.dir}/redis.tgz
            spdx:
              name: phpredis
              version: 6.3.0
              packages:
                - name: phpredis
                  purl: pkg:pecl/redis@6.3.0
                  license: PHP-3.01
            uid: 0
            gid: 0
          - url: https://pecl.php.net/get/memcached-3.4.0.tgz
            checksum: sha256:c163434eb0da97c8f45c7ad41d979d381f8b81c49402b1b90b063987fb37972e
            path: ${source.dir}/memcached.tgz
            spdx:
              name: php-memcached
              version: 3.4.0
              packages:
                - name: php-memcached
                  purl: pkg:pecl/memcached@3.4.0
                  license: PHP-3.01
            uid: 0
            gid: 0
      pipeline:
        - name: compile extensions
          runs: |
            set -eux -o pipefail

            export SOURCE_DIR='${source.dir}'
            export PHP_SRC_VERSION='8.3.36'
            export REDIS_VERSION='6.3.0'
            export MEMCACHED_VERSION='3.4.0'
            export BUNDLED_LIBGD_VERSION='2.0.35'
            bash '${source.dir}/build-extensions.sh'
        - uses: spdx@v1
          with:
            license: GD
            name: libgd
            purl: pkg:generic/libgd@2.0.35
            version: 2.0.35
        - uses: spdx@v1
          with:
            license: PHP-3.01
            name: php-ext-gd
            purl: pkg:generic/php/ext-gd@8.3.36
            version: 8.3.36
        - uses: spdx@v1
