            name: php-ext-exif
            purl: pkg:generic/php/ext-exif@8.3.36
            version: 8.3.36
        - uses: spdx@v1
          with:
            license: PHP-3.01
            name: php-ext-bcmath
            purl: pkg:generic/php/ext-bcmath@8.3.36
            version: 8.3.36
        - uses: spdx@v1
          with:
            license: PHP-3.01
            name: php-ext-ldap
            purl: pkg:generic/php/ext-ldap@8.3.36
            version: 8.3.36
        - uses: spdx@v1
          with:
            license: PHP-3.01
            name: php-ext-pdo-mysql
            purl: pkg:generic/php/ext-pdo-mysql@8.3.36
            version: 8.3.36
        - uses: spdx@v1
          with:
            license: PHP-3.01
            name: php-ext-redis
            purl: pkg:pecl/redis@6.3.0
            version: 6.3.0
        - uses: spdx@v1
          with:
            license: PHP-3.01
            name: php-ext-memcached
            purl: pkg:pecl/memcached@3.4.0
            version: 3.4.0
