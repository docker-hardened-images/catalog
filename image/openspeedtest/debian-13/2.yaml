# syntax=dhi.io/build:2-debian13

name: OpenSpeedTest 2.x
image: dhi.io/openspeedtest
variant: runtime
tags:
  - "2"
  - "2.5"
  - 2.5.4
  - 2-debian
  - 2-debian13
  - 2.5-debian
  - 2.5-debian13
  - 2.5.4-debian
  - 2.5.4-debian13
platforms:
  - linux/amd64
  - linux/arm64
dates:
  release: "2022-12-27"
vars:
  DEBIAN_EPOCH_MAJOR_MINOR_VERSION: "2.5"
  DEBIAN_EPOCH_MAJOR_VERSION: "2"
  DEBIAN_EPOCH_VERSION: 2.5.4
  NGINX_VERSION: 1.30.6-1
  SEMVER_MAJOR_MINOR_VERSION: "2.5"
  SEMVER_MAJOR_VERSION: "2"
  SEMVER_VERSION: 2.5.4
  VERSION: 2.5.4-1
contents:
  repositories:
    - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
  keyring:
    - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
  packages:
    - '!libelogind0'
    - '!mawk'
    - '!original-awk'
    - base-files
    - busybox
    - ca-certificates-bundle
    - libc6
    - libcrypt1
    - libpcre2-8-0
    - libssl3t64
    - nginx-stable=1.30.6-1
    - openspeedtest-2=2.5.4-1
    - tzdata
    - zlib1g
  builds:
    - name: openspeedtest
      contents:
        packages:
          - bash
          - coreutils
          - grep
          - openssl
          - sed
          - openspeedtest-2=2.5.4-1
          - nginx-stable=1.30.6-1
      pipeline:
        - name: configure
          runs: |
            set -eux -o pipefail

            /tmp/configure-nginx.sh
            rm -f /tmp/configure-nginx.sh
      paths:
        - type: file
          path: /tmp/configure-nginx.sh
          uid: 0
          gid: 0
          mode: "0755"
          source: image/openspeedtest/bin/configure-nginx.sh
      outputs:
        - source: /
          target: /
          uid: 0
          gid: 0
          diff: true
accounts:
  run-as: nginx
  users:
    - name: nginx
      uid: 65532
      gid: 65532
  groups:
    - name: nginx
      gid: 65532
      members:
        - nginx
os-release:
  name: Docker Hardened Images (Debian)
  id: debian
  version-id: "13"
  version-codename: trixie
  pretty-name: Docker Hardened Images/Debian GNU/Linux 13 (trixie)
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
work-dir: /
stop-signal: SIGQUIT
environment:
  CHANGE_CONTAINER_PORTS: "false"
  CONFIG: /etc/nginx/conf.d/OpenSpeedTest-Server.conf
  DOMAIN_NAME: "false"
  ENABLE_LETSENCRYPT: "false"
  HTTP_PORT: "3000"
  HTTPS_PORT: "3001"
  INDEX_HTML: /usr/share/nginx/html/index.html
  SET_USER: "65532"
  USER_EMAIL: "false"
paths:
  - type: file
    path: /docker-entrypoint.sh
    uid: 0
    gid: 0
    mode: "0755"
    source: image/openspeedtest/bin/docker-entrypoint.sh
  - type: file
    path: /entrypoint.sh
    uid: 0
    gid: 0
    mode: "0755"
    source: image/openspeedtest/bin/entrypoint.sh
  - type: delete
    path: /usr/share/nginx/html
    uid: 0
    gid: 0
  - type: symlink
    path: /usr/share/nginx/html
    uid: 0
    gid: 0
    source: /usr/share/openspeedtest
  - type: symlink
    path: /bin/sh
    uid: 0
    gid: 0
    source: /usr/bin/busybox
  - type: symlink
    path: /bin/sed
    uid: 0
    gid: 0
    source: /usr/bin/busybox
  - type: symlink
    path: /bin/mktemp
    uid: 0
    gid: 0
    source: /usr/bin/busybox
  - type: symlink
    path: /bin/cat
    uid: 0
    gid: 0
    source: /usr/bin/busybox
  - type: symlink
    path: /bin/rm
    uid: 0
    gid: 0
    source: /usr/bin/busybox
annotations:
  org.opencontainers.image.description: A minimal OpenSpeedTest image
  org.opencontainers.image.licenses: MIT
entrypoint:
  - /docker-entrypoint.sh
cmd:
  - /entrypoint.sh
ports:
  - 3000/tcp
  - 3001/tcp
