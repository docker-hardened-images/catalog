# syntax=dhi.io/build:2-alpine3.24

name: OpenSpeedTest 2.x
image: dhi.io/openspeedtest
variant: runtime
tags:
  - 2.5-alpine
  - 2.5.4-alpine
  - 2.5-alpine3.24
  - 2.5.4-alpine3.24
platforms:
  - linux/amd64
  - linux/arm64
dates:
  release: "2022-12-27"
vars:
  APK_MAJOR_MINOR_VERSION: "2.5"
  APK_MAJOR_VERSION: "2"
  APK_VERSION: 2.5.4
  NGINX_VERSION: 1.30.6-r5
  SEMVER_MAJOR_MINOR_VERSION: "2.5"
  SEMVER_MAJOR_VERSION: "2"
  SEMVER_VERSION: 2.5.4
  VERSION: 2.5.4-r1
contents:
  repositories:
    - https://dhi.io/apk/alpine/v3.24/main
    - https://dl-cdn.alpinelinux.org/alpine/v3.24/main
    - https://dl-cdn.alpinelinux.org/alpine/v3.24/community
  keyring:
    - https://dhi.io/keyring/dhi-apk@docker-0F81AD7700D99184.rsa.pub
  packages:
    - alpine-baselayout-data
    - busybox
    - ca-certificates-bundle
    - nginx-stable=1.30.6-r5
    - openspeedtest-2=2.5.4-r1
    - tzdata
  builds:
    - name: openspeedtest
      contents:
        packages:
          - bash
          - busybox
          - openssl
          - openspeedtest-2=2.5.4-r1
          - nginx-stable=1.30.6-r5
      pipeline:
        - name: configure
          runs: |
            set -eux -o pipefail

            /tmp/configure-nginx.sh
            rm -f /tmp/configure-nginx.sh
      paths:
        - type: file
          path: /tmp/configure-nginx.sh
          uid: 0
          gid: 0
          mode: "0755"
          source: image/openspeedtest/bin/configure-nginx.sh
      outputs:
        - source: /
          target: /
          uid: 0
          gid: 0
          diff: true
accounts:
  run-as: nginx
  users:
    - name: nginx
      uid: 65532
      gid: 65532
  groups:
    - name: nginx
      gid: 65532
      members:
        - nginx
os-release:
  name: Docker Hardened Images (Alpine)
  id: alpine
  version-id: "3.24"
  pretty-name: Docker Hardened Images/Alpine Linux v3.24
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
work-dir: /
stop-signal: SIGQUIT
environment:
  CHANGE_CONTAINER_PORTS: "false"
  CONFIG: /etc/nginx/conf.d/OpenSpeedTest-Server.conf
  DOMAIN_NAME: "false"
  ENABLE_LETSENCRYPT: "false"
  HTTP_PORT: "3000"
  HTTPS_PORT: "3001"
  INDEX_HTML: /usr/share/nginx/html/index.html
  SET_USER: "65532"
  USER_EMAIL: "false"
paths:
  - type: file
    path: /docker-entrypoint.sh
    uid: 0
    gid: 0
    mode: "0755"
    source: image/openspeedtest/bin/docker-entrypoint.sh
  - type: file
    path: /entrypoint.sh
    uid: 0
    gid: 0
    mode: "0755"
    source: image/openspeedtest/bin/entrypoint.sh
  - type: delete
    path: /usr/share/nginx/html
    uid: 0
    gid: 0
  - type: symlink
    path: /usr/share/nginx/html
    uid: 0
    gid: 0
    source: /usr/share/openspeedtest
annotations:
  org.opencontainers.image.description: A minimal OpenSpeedTest image
  org.opencontainers.image.licenses: MIT
entrypoint:
  - /docker-entrypoint.sh
cmd:
  - /entrypoint.sh
ports:
  - 3000/tcp
  - 3001/tcp
