    - lsof
    - make
    - mawk
    - nano
    - ncurses-base
    - ncurses-bin
    - net-tools
    - netcat-openbsd
    - openssh-client
    - perl-base
    - procps
    - psmisc
    - ripgrep
    - sed
    - socat
    - sudo
    - tini
    - tmux
    - traceroute
    - tree
