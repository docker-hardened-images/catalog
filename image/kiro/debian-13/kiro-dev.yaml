name: Kiro CLI (docker, dev)
image: dhi.io/kiro
output: squashed
variant: dev
flavor: docker
tags:
  - 3.2.0
  - latest
platforms:
  - linux/amd64
  - linux/arm64
vars:
  BANNER_KIT: kiro docker 3.2.0
  CENTERED_KIT_NAME: '            kiro docker 3.2.0'
  CLIPBOARD_BRIDGE_ARCH: '#{ target.arch == "amd64" ? "amd64" : "arm64" }'
  CLIPBOARD_BRIDGE_VERSION: v0.3.1
  DHI_TAGS_OVERWRITE: "true"
  KIT_NAME: kiro
  SANDBOXES_COMMIT_SHA: 54a695035350bab5f126a88c892a9bc3b5ae162a
  SEMVER_MAJOR_MINOR_VERSION: "3.2"
  SEMVER_MAJOR_VERSION: "3"
  SEMVER_VERSION: 3.2.0
  VERSION: 3.2.0
