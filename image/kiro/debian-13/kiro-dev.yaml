name: Kiro CLI (docker, dev)
image: dhi.io/kiro
output: squashed
variant: dev
flavor: docker
tags:
  - 3.5.0
  - latest
platforms:
  - linux/amd64
  - linux/arm64
vars:
  BANNER_KIT: kiro docker 3.5.0
  CENTERED_KIT_NAME: '            kiro docker 3.5.0'
  CLIPBOARD_BRIDGE_ARCH: '#{ target.arch == "amd64" ? "amd64" : "arm64" }'
  CLIPBOARD_BRIDGE_VERSION: v0.3.1
  DHI_TAGS_OVERWRITE: "true"
  KIT_NAME: kiro
  SANDBOXES_COMMIT_SHA: 54a695035350bab5f126a88c892a9bc3b5ae162a
  SEMVER_MAJOR_MINOR_VERSION: "3.5"
  SEMVER_MAJOR_VERSION: "3"
  SEMVER_VERSION: 3.5.0
  VERSION: 3.5.0
contents:
  repositories:
    - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
  keyring:
    - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
