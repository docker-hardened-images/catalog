          uid: 1000
          gid: 1000
          mode: "0755"
        - type: directory
          path: /home/agent/.docker/sandbox/locks
          uid: 1000
          gid: 1000
          mode: "0755"
        - type: directory
          path: /usr/local/share/npm-global
          uid: 1000
          gid: 1000
          mode: "0755"
        - type: directory
          path: /usr/local/share/ca-certificates
          uid: 0
          gid: 0
          mode: "0755"
        - type: directory
          path: /home/agent/.local/bin
          uid: 1000
          gid: 1000
          mode: "0755"
        - type: directory
          path: /home/agent/.local/share
          uid: 1000
          gid: 1000
          mode: "0755"
        - type: directory
          path: /home/agent/.local/state
          uid: 1000
          gid: 1000
          mode: "0755"
        - type: directory
          path: /etc/sudoers.d
