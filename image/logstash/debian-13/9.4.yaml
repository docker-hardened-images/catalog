      pipeline:
        - name: patch deps
          uses: git/patch@v1
          with:
            patch: ${source.dir}/patch/deps-9.4.patch
        - name: install default gems
          privileged: true
          secrets:
            - id: maven_user
              env: MAVEN_USER
            - id: maven_password
              env: MAVEN_PASSWORD
          runs: |
            set -eux -o pipefail

            gradle installDefaultGems
        - name: install assemble tar distro
          privileged: true
          secrets:
            - id: maven_user
              env: MAVEN_USER
            - id: maven_password
              env: MAVEN_PASSWORD
          runs: |
            set -eux -o pipefail

            gradle assembleTarDistribution
        - name: unpack
          runs: |
            set -eux -o pipefail

            tar -zxf "build/logstash-9.4.5-SNAPSHOT.tar.gz" -C /usr/share

            mkdir -p "${target.dir}/usr/share/logstash"

            # Remove bundled JDK - we use DHI Java JDK instead
            rm -rf "/usr/share/logstash-9.4.5"-SNAPSHOT/jdk

            cp -r "/usr/share/logstash-9.4.5"-SNAPSHOT/* "${target.dir}/usr/share/logstash"
        - name: replace vulnerable kafka-clients jar
          runs: |
            set -eux -o pipefail

            # CVE-2026-35554 - Ensure kafka-clients is at least 3.9.2 inside logstash-integration-kafka.
            # Newer gems may omit the maven-style .../org/apache/kafka/kafka-clients directory; locate jars directly.
            base="${target.dir}/usr/share/logstash/vendor/bundle/jruby/3.4.0/gems"
            kafka_fixed="${source.dir}/patch/deps/kafka-clients-3.9.2.jar"

            kafka_old_count=$(find "$base" -type f -name 'kafka-clients-*.jar' ! -name 'kafka-clients-3.9.2.jar' | wc -l | tr -d ' ')

            if [ "${kafka_old_count:-0}" -eq 0 ]; then
              echo "No kafka-clients JAR older than 3.9.2 found; skipping CVE-2026-35554 shim."
              exit 0
            fi

            for old_kafka_jar in $(find "$base" -type f -name 'kafka-clients-*.jar' ! -name 'kafka-clients-3.9.2.jar'); do
              version_dir=$(dirname "$old_kafka_jar")
              clients_root=$(dirname "$version_dir")

              if [ "$(basename "$clients_root")" = "kafka-clients" ]; then
                rm "$old_kafka_jar"
                rmdir "$version_dir" 2> /dev/null || true
                mkdir -p "$clients_root/3.9.2"
                cp "$kafka_fixed" "$clients_root/3.9.2/kafka-clients-3.9.2.jar"
              else
                echo "kafka-clients CVE shim: non-maven layout; replacing $old_kafka_jar"
                jar_dir=$(dirname "$old_kafka_jar")
                rm "$old_kafka_jar"
                cp "$kafka_fixed" "$jar_dir/kafka-clients-3.9.2.jar"
              fi
            done

            kafka_remain=$(find "$base" -type f -name 'kafka-clients-*.jar' ! -name 'kafka-clients-3.9.2.jar' | wc -l | tr -d ' ')
            if [ "${kafka_remain:-0}" -gt 0 ]; then
              echo "ERROR: kafka-clients CVE shim left ${kafka_remain} vulnerable jar(s)"
              exit 1
            fi
        - name: replace vulnerable lz4-java jar
          runs: |
            set -eux -o pipefail

            # CVE-2026-59949 - lz4-java 1.10.1 -> 1.11.1
            base="${target.dir}/usr/share/logstash/vendor/bundle/jruby/3.4.0/gems"
            lz4_fixed="${source.dir}/patch/deps/lz4-java-1.11.1.jar"

            # Find all lz4-java JARs older than 1.11.1
            lz4_old_count=$(find "$base" -type f -name 'lz4-java-*.jar' ! -name 'lz4-java-1.11.1.jar' | wc -l | tr -d ' ')

            if [ "${lz4_old_count:-0}" -eq 0 ]; then
              echo "No lz4-java JAR older than 1.11.1 found; skipping CVE-2026-59949 shim."
              exit 0
            fi

            for old_lz4_jar in $(find "$base" -type f -name 'lz4-java-*.jar' ! -name 'lz4-java-1.11.1.jar'); do
              version_dir=$(dirname "$old_lz4_jar")
              lz4_root=$(dirname "$version_dir")

              if [ "$(basename "$lz4_root")" = "lz4-java" ]; then
                rm "$old_lz4_jar"
                rmdir "$version_dir" 2> /dev/null || true
                mkdir -p "$lz4_root/1.11.1"
                cp "$lz4_fixed" "$lz4_root/1.11.1/lz4-java-1.11.1.jar"
              else
                echo "lz4-java CVE shim: non-maven layout; replacing $old_lz4_jar"
                jar_dir=$(dirname "$old_lz4_jar")
                rm "$old_lz4_jar"
                cp "$lz4_fixed" "$jar_dir/lz4-java-1.11.1.jar"
              fi
            done

            lz4_remain=$(find "$base" -type f -name 'lz4-java-*.jar' ! -name 'lz4-java-1.11.1.jar' | wc -l | tr -d ' ')
            if [ "${lz4_remain:-0}" -gt 0 ]; then
              echo "ERROR: lz4-java CVE shim left ${lz4_remain} vulnerable jar(s)"
              exit 1
            fi
        - name: replace vulnerable maven jars
          runs: |
            set -eux -o pipefail

            base="${target.dir}/usr/share/logstash"

            replace_jars() {
              pattern="$1"
              fixed="$2"
              find "$base" -path "$pattern" -type f | while read -r old_jar; do
                echo "Replacing $old_jar with $fixed"
                cp "$fixed" "$old_jar"
              done
            }

            replace_maven_jar_version() {
              group_path="$1"
              artifact="$2"
              fixed_version="$3"
              fixed="${source.dir}/patch/deps/${artifact}-${fixed_version}.jar"
              maven_group=$(echo "${group_path%/${artifact}}" | tr '/' '.')

              find "$base" -path "*/${group_path}/*/${artifact}-*.jar" -type f | while read -r old_jar; do
                old_version_dir=$(dirname "$old_jar")
                old_version=$(basename "$old_version_dir")
                artifact_dir=$(dirname "$old_version_dir")
                fixed_dir="$artifact_dir/${fixed_version}"

                if [ "$old_version" = "$fixed_version" ]; then
                  continue
                fi

                echo "Replacing $old_jar with $fixed_dir/${artifact}-${fixed_version}.jar"
                rm "$old_jar"
                rmdir "$old_version_dir" 2> /dev/null || true
                mkdir -p "$fixed_dir"
                cp "$fixed" "$fixed_dir/${artifact}-${fixed_version}.jar"

                find "$base/vendor/bundle" \( -name '*_jars.rb' -o -name 'Jars.lock' \) -type f | while read -r ref_file; do
                  if grep -q "${group_path}/${old_version}/${artifact}-${old_version}" "$ref_file" 2> /dev/null \
                    || grep -q "require_jar('${maven_group}', '${artifact}', '${old_version}')" "$ref_file" 2> /dev/null \
                    || grep -q "require_jar(\"${maven_group}\", \"${artifact}\", \"${old_version}\")" "$ref_file" 2> /dev/null; then
                    sed -i \
                      -e "s|${group_path}/${old_version}/${artifact}-${old_version}|${group_path}/${fixed_version}/${artifact}-${fixed_version}|g" \
                      -e "s/require_jar('${maven_group}', '${artifact}', '${old_version}')/require_jar('${maven_group}', '${artifact}', '${fixed_version}')/g" \
                      -e "s/require_jar(\"${maven_group}\", \"${artifact}\", \"${old_version}\")/require_jar(\"${maven_group}\", \"${artifact}\", \"${fixed_version}\")/g" \
                      "$ref_file"
                  fi
                done
              done
            }

            # CVE-2026-59901, CVE-2026-59903 - netty 4.1.136 -> 4.1.137 (Scout keys off maven path version)
            replace_maven_jar_version "io/netty/netty-codec" netty-codec 4.1.137.Final
            replace_maven_jar_version "io/netty/netty-codec-http" netty-codec-http 4.1.137.Final
            replace_maven_jar_version "io/netty/netty-handler" netty-handler 4.1.137.Final
            replace_maven_jar_version "io/netty/netty-transport" netty-transport 4.1.137.Final
            replace_maven_jar_version "io/netty/netty-common" netty-common 4.1.137.Final
            replace_maven_jar_version "io/netty/netty-buffer" netty-buffer 4.1.137.Final
            replace_maven_jar_version "io/netty/netty-resolver" netty-resolver 4.1.137.Final
            replace_maven_jar_version "io/netty/netty-transport-native-unix-common" netty-transport-native-unix-common 4.1.137.Final
            # CVE-2026-54399 - httpcore5 5.4 -> 5.4.3
            replace_maven_jar_version "org/apache/httpcomponents/core5/httpcore5" httpcore5 5.4.3
            # CVE-2026-54428 - httpcore5-h2 5.4 -> 5.4.3
            replace_maven_jar_version "org/apache/httpcomponents/core5/httpcore5-h2" httpcore5-h2 5.4.3
            # CVE-2026-64607 - httpclient5 -> 5.6.3
            replace_maven_jar_version "org/apache/httpcomponents/client5/httpclient5" httpclient5 5.6.3

            netty_http_remain=$(find "$base" -path "*/io/netty/netty-codec-http/4.1.136.Final/*" -type f | wc -l | tr -d ' ')
            if [ "${netty_http_remain:-0}" -gt 0 ]; then
              echo "ERROR: netty-codec-http CVE shim left ${netty_http_remain} 4.1.136.Final jar(s)"
              exit 1
            fi
            netty_http_fixed=$(find "$base" -path "*/io/netty/netty-codec-http/4.1.137.Final/*" -type f | wc -l | tr -d ' ')
            if [ "${netty_http_fixed:-0}" -eq 0 ]; then
              echo "ERROR: netty-codec-http CVE shim did not install any 4.1.137.Final jar(s)"
              exit 1
            fi

            replace_jars "*/org/bouncycastle/bcprov-jdk18on/*/bcprov-jdk18on-*.jar" "${source.dir}/patch/deps/bcprov-jdk18on-1.84.jar"
            replace_jars "*/org/bouncycastle/bcpkix-jdk18on/*/bcpkix-jdk18on-*.jar" "${source.dir}/patch/deps/bcpkix-jdk18on-1.84.jar"
            replace_jars "*/tools/jackson/core/jackson-core/*/jackson-core-*.jar" "${source.dir}/patch/deps/tools-jackson-core-3.1.6.jar"
            # CVE-2026-54512, CVE-2026-54513, CVE-2026-54514, CVE-2026-54515, CVE-2026-54516, CVE-2026-54517, CVE-2026-54518
            # CVE-2026-59888, CVE-2026-59889, GHSA-mhm7-754m-9p8w
            # jackson-databind: replace vulnerable versions with fixed versions (in-place to preserve maven paths)
            # 2.15.0/2.16.2 -> 2.18.10, 2.21.x -> 2.21.6, tools 3.1.x -> 3.1.6
            replace_jars "*/com/fasterxml/jackson/core/jackson-databind/2.1[56].*/jackson-databind-*.jar" "${source.dir}/patch/deps/jackson-databind-2.18.10.jar"
            replace_jars "*/com/fasterxml/jackson/core/jackson-databind/2.21.*/jackson-databind-*.jar" "${source.dir}/patch/deps/jackson-databind-2.21.6.jar"
            replace_jars "*/tools/jackson/core/jackson-databind/3.1.*/jackson-databind-*.jar" "${source.dir}/patch/deps/tools-jackson-databind-3.1.6.jar"

            # logstash-core/lib/jars is a flat layout (version only in the filename). Scout keys off
            # that name, so copying 2.21.6 into jackson-databind-2.21.2.jar leaves the finding open.
            jars_dir="${base}/logstash-core/lib/jars"
            if [ -d "$jars_dir" ]; then
              find "$jars_dir" -maxdepth 1 -type f -name 'jackson-databind-*.jar' ! -name 'jackson-databind-2.21.6.jar' | while read -r old_jar; do
                echo "Replacing $old_jar with jackson-databind-2.21.6.jar"
                rm "$old_jar"
                cp "${source.dir}/patch/deps/jackson-databind-2.21.6.jar" "${jars_dir}/jackson-databind-2.21.6.jar"
              done
            fi
        - name: replace vulnerable amqp-client in march_hare rabbitmq-client jar
          runs: |
            set -eux -o pipefail

            # CVE-2026-69220, CVE-2026-69219, CVE-2026-63337, CVE-2026-63335, CVE-2026-63336, CVE-2026-61634
            # march_hare ships lib/ext/rabbitmq-client.jar as a repackaged amqp-client JAR with bundled
            # Netty classes. Upstream amqp-client is thin; merge fixed amqp-client plus netty deps so
            # JRuby sees EventLoopGroup when the gem loads ext/rabbitmq-client.jar.
            amqp_fixed="${source.dir}/patch/deps/amqp-client-5.33.1.jar"
            base="${target.dir}/usr/share/logstash/vendor/bundle/jruby/3.4.0/gems"
            JAR_CMD="/opt/java/openjdk/21/bin/jar"

            rabbitmq_jar_count=$(find "$base" -path "*/march_hare-*/lib/ext/rabbitmq-client.jar" -type f | wc -l | tr -d ' ')
            if [ "${rabbitmq_jar_count:-0}" -eq 0 ]; then
              echo "ERROR: march_hare rabbitmq-client.jar not found"
              exit 1
            fi

            build_rabbitmq_client_jar() {
              local out_jar="$1"
              local patch_dir repack_dir merged
              patch_dir=$(mktemp -d)
              repack_dir="${patch_dir}/repack"
              mkdir -p "${repack_dir}"

              (cd "${repack_dir}" && "$JAR_CMD" xf "${amqp_fixed}")
              for netty_module in netty-common netty-buffer netty-resolver netty-transport netty-transport-native-unix-common netty-codec netty-handler netty-codec-http; do
                (cd "${repack_dir}" && "$JAR_CMD" xf "${source.dir}/patch/deps/${netty_module}-4.1.137.Final.jar")
              done
              find "${repack_dir}/META-INF" -maxdepth 1 \( -name '*.SF' -o -name '*.RSA' -o -name '*.DSA' \) -delete 2> /dev/null || true

              merged="${patch_dir}/rabbitmq-client-repacked.jar"
              (cd "${repack_dir}" && "$JAR_CMD" --create --file "${merged}" --manifest META-INF/MANIFEST.MF .)
              cp "${merged}" "${out_jar}"
              rm -rf "${patch_dir}"
            }

            find "$base" -path "*/march_hare-*/lib/ext/rabbitmq-client.jar" -type f | while read -r rabbitmq_jar; do
              echo "Replacing $rabbitmq_jar with repackaged amqp-client-5.33.1.jar plus netty deps"
              build_rabbitmq_client_jar "$rabbitmq_jar"
            done

            verify_dir="/tmp/amqp_client_verify"
            rm -rf "$verify_dir"
            mkdir -p "$verify_dir"
            first_jar=$(find "$base" -path "*/march_hare-*/lib/ext/rabbitmq-client.jar" -type f | head -1)
            cd "$verify_dir"
            "$JAR_CMD" xf "$first_jar" META-INF/maven/com.rabbitmq/amqp-client/pom.properties
            grep -q 'version=5.33.1' META-INF/maven/com.rabbitmq/amqp-client/pom.properties
            "$JAR_CMD" tf "$first_jar" | grep -q 'io/netty/channel/EventLoopGroup.class'
            "$JAR_CMD" tf "$first_jar" | grep -q 'io/netty/handler/ssl/SslContext.class'
            cd /
            rm -rf "$verify_dir"
        - name: replace vulnerable jackson-core jars
          runs: |
            set -eux -o pipefail

            # GHSA-r7wm-3cxj-wff9 - Replace vulnerable jackson-core JARs with fixed versions
            # We replace the JAR contents in-place to preserve the directory structure that
            # gems like jrjackson expect (they have hardcoded paths in their Ruby loader files)
            base="${target.dir}/usr/share/logstash/vendor/bundle/jruby/3.4.0/gems"
            jackson_2_18_9="${source.dir}/patch/deps/jackson-core-2.18.10.jar"
            jackson_2_21_5="${source.dir}/patch/deps/jackson-core-2.21.6.jar"

            # Find and replace jackson-core JARs based on version ranges
            # 2.18.x line: replace with 2.18.9
            find "$base" -path "*/jackson-core/2.18.*/jackson-core-*.jar" -type f | while read -r old_jar; do
              echo "Replacing $old_jar with 2.18.9"
              cp "$jackson_2_18_9" "$old_jar"
            done

            # 2.21.x line: replace with 2.21.5
            find "$base" -path "*/jackson-core/2.21.*/jackson-core-*.jar" -type f | while read -r old_jar; do
              echo "Replacing $old_jar with 2.21.5"
              cp "$jackson_2_21_5" "$old_jar"
            done

            # Also replace jackson-core in logstash-core/lib/jars if it exists (8.19+)
            # Determine which version to use based on the existing JAR name
            core_jar=$(find "${target.dir}/usr/share/logstash/logstash-core/lib/jars" -name "jackson-core-*.jar" -type f 2> /dev/null | head -1)
            if [ -n "$core_jar" ] && [ -f "$core_jar" ]; then
              jar_name=$(basename "$core_jar")
              if echo "$jar_name" | grep -q "2\.18\."; then
                echo "Replacing $core_jar with 2.18.9"
                cp "$jackson_2_18_9" "$core_jar"
              elif echo "$jar_name" | grep -q "2\.21\."; then
                echo "Replacing $core_jar with 2.21.5"
                cp "$jackson_2_21_5" "$core_jar"
              fi
            fi
        - name: patch shaded jackson-core in elastic_integration jar
          runs: |
            set -eux -o pipefail

            # The logstash-filter-elastic_integration JAR is a shaded/uber JAR that contains
            # jackson-core classes embedded directly inside it. We need to replace these.
            # GHSA-r7wm-3cxj-wff9

            JAR_CMD="/opt/java/openjdk/21/bin/jar"
            jackson_2_18_9="${source.dir}/patch/deps/jackson-core-2.18.10.jar"
            jackson_tools_3_1_5="${source.dir}/patch/deps/tools-jackson-core-3.1.6.jar"
            base="${target.dir}/usr/share/logstash/vendor/bundle/jruby/3.4.0/gems"

            # Find the elastic_integration shaded JAR (version varies by logstash version)
            ei_jar=$(find "$base" -path "*/logstash-filter-elastic_integration-*/vendor/jar-dependencies/co/elastic/logstash-filter-elastic_integration/*/logstash-filter-elastic_integration-*.jar" -type f | head -1)

            if [ -z "$ei_jar" ]; then
              echo "WARNING: No elastic_integration JAR found, skipping"
              exit 0
            fi

            echo "Patching shaded JAR: $ei_jar"
            work_dir="/tmp/ei_jar_patch"

            mkdir -p "$work_dir"
            cd "$work_dir"

            # Extract the shaded JAR
            "$JAR_CMD" xf "$ei_jar"

            # Remove the old embedded jackson-core classes at root level (com.fasterxml.jackson.core)
            rm -rf com/fasterxml/jackson/core

            # Extract the fixed jackson-core classes into the same location
            "$JAR_CMD" xf "$jackson_2_18_9" 'com/fasterxml/jackson/core'

            # Also update the pom metadata to reflect the new version
            "$JAR_CMD" xf "$jackson_2_18_9" 'META-INF/maven/com.fasterxml.jackson.core/jackson-core'

            # Replace the nested JAR in IMPL-JARS/x-content with fixed version (com.fasterxml.jackson.core)
            # Update both the directory name AND LISTING.TXT to avoid any reference to vulnerable version
            if [ -d "IMPL-JARS/x-content" ]; then
              # Find the old jackson-core directory name (e.g., jackson-core-2.17.2.jar)
              old_jackson_name=$(find IMPL-JARS/x-content -maxdepth 1 -type d -name "jackson-core-*.jar" -printf "%f\n" | head -1)

              if [ -z "$old_jackson_name" ]; then
                echo "WARNING: No existing jackson-core JAR found in IMPL-JARS/x-content, skipping"
              else
                echo "Replacing $old_jackson_name with jackson-core-2.18.10.jar"

                # Remove old version directory completely
                rm -rf "IMPL-JARS/x-content/$old_jackson_name"

                # Create new version directory with fixed version name
                mkdir -p "IMPL-JARS/x-content/jackson-core-2.18.10.jar"
                cd "IMPL-JARS/x-content/jackson-core-2.18.10.jar"

                # Extract fixed JAR contents
                "$JAR_CMD" xf "$jackson_2_18_9"

                cd "$work_dir"

                # Update LISTING.TXT to reflect the new JAR name
                if [ -f "IMPL-JARS/x-content/LISTING.TXT" ]; then
                  sed -i "s|$old_jackson_name|jackson-core-2.18.10.jar|g" IMPL-JARS/x-content/LISTING.TXT
                  echo "Updated LISTING.TXT: $old_jackson_name -> jackson-core-2.18.10.jar"
                else
                  echo "WARNING: LISTING.TXT not found in IMPL-JARS/x-content"
                fi
              fi
            fi

            # Replace tools.jackson.core classes (shaded at root level)
            # The elastic_integration JAR also contains tools.jackson.core 3.1.1 classes
            if [ -d "tools/jackson/core" ]; then
              echo "Replacing tools.jackson.core classes with 3.1.5"
              rm -rf tools/jackson/core
              "$JAR_CMD" xf "$jackson_tools_3_1_5" 'tools/jackson/core'
              "$JAR_CMD" xf "$jackson_tools_3_1_5" 'META-INF/maven/tools.jackson.core/jackson-core'
            fi

            # CVE-2026-54515, CVE-2026-59888, CVE-2026-59889, GHSA-mhm7-754m-9p8w
            # Replace shaded jackson-databind copies when present. 9.x ships both
            # com.fasterxml (2.x) and tools (3.x); 8.19 may only ship tools.
            jackson_databind_2_18_9="${source.dir}/patch/deps/jackson-databind-2.18.10.jar"
            jackson_databind_tools_3_1_5="${source.dir}/patch/deps/tools-jackson-databind-3.1.6.jar"
            patched_fasterxml_databind=0
            patched_tools_databind=0

            if [ -d "com/fasterxml/jackson/databind" ] || [ -d "META-INF/maven/com.fasterxml.jackson.core/jackson-databind" ] \
              || find . -path '*/com/fasterxml/jackson/databind/*.class' -print -quit | grep -q .; then
              echo "Replacing com.fasterxml.jackson.databind classes with 2.18.9"
              rm -rf com/fasterxml/jackson/databind
              rm -rf META-INF/maven/com.fasterxml.jackson.core/jackson-databind
              find META-INF/versions -type d -path '*/com/fasterxml/jackson/databind' -prune -exec rm -rf {} + 2> /dev/null || true
              "$JAR_CMD" xf "$jackson_databind_2_18_9" 'com/fasterxml/jackson/databind'
              "$JAR_CMD" xf "$jackson_databind_2_18_9" 'META-INF/maven/com.fasterxml.jackson.core/jackson-databind'
              "$JAR_CMD" xf "$jackson_databind_2_18_9" 'META-INF/services/com.fasterxml.jackson.core.ObjectCodec' || true
              patched_fasterxml_databind=1
            fi

            if [ -d "tools/jackson/databind" ] || [ -d "META-INF/maven/tools.jackson.core/jackson-databind" ]; then
              echo "Replacing tools.jackson.databind classes with 3.1.5"
              rm -rf tools/jackson/databind
              rm -rf META-INF/maven/tools.jackson.core/jackson-databind
              "$JAR_CMD" xf "$jackson_databind_tools_3_1_5" 'tools/jackson/databind'
              "$JAR_CMD" xf "$jackson_databind_tools_3_1_5" 'META-INF/maven/tools.jackson.core/jackson-databind'
              "$JAR_CMD" xf "$jackson_databind_tools_3_1_5" 'META-INF/services/tools.jackson.databind.ObjectMapper' || true
              patched_tools_databind=1
            fi

            # Repack the JAR (preserving manifest and other metadata)
            rm "$ei_jar"
            "$JAR_CMD" cf "$ei_jar" .

            # Verify the fix was applied before cleanup (only for components we patched / expect)
            "$JAR_CMD" tf "$ei_jar" | grep -q "com/fasterxml/jackson/core/JsonFactory.class"
            if [ "$patched_fasterxml_databind" = 1 ]; then
              "$JAR_CMD" tf "$ei_jar" | grep -q "com/fasterxml/jackson/databind/ObjectMapper.class"
              "$JAR_CMD" xf "$ei_jar" META-INF/maven/com.fasterxml.jackson.core/jackson-databind/pom.properties
              grep -q 'version=2.18.10' META-INF/maven/com.fasterxml.jackson.core/jackson-databind/pom.properties
            fi
            if [ "$patched_tools_databind" = 1 ]; then
              "$JAR_CMD" tf "$ei_jar" | grep -q "tools/jackson/databind/ObjectMapper.class"
              "$JAR_CMD" xf "$ei_jar" META-INF/maven/tools.jackson.core/jackson-databind/pom.properties
              grep -q 'version=3.1.6' META-INF/maven/tools.jackson.core/jackson-databind/pom.properties
            fi

            # Cleanup
            cd /
            rm -rf "$work_dir"
        - name: patch shaded log4j-1.2-api in elastic_integration jar
          runs: |
            set -eux -o pipefail

            # CVE-2026-34479 - The logstash-filter-elastic_integration shaded JAR embeds
            # log4j-1.2-api 2.19.0 classes from the bundled Elasticsearch distribution.
            # Replace them with the fixed version 2.25.4.

            JAR_CMD="/opt/java/openjdk/21/bin/jar"
            log4j_fixed="${source.dir}/patch/deps/log4j-1.2-api-2.25.4.jar"
            base="${target.dir}/usr/share/logstash/vendor/bundle/jruby/3.4.0/gems"

            ei_jar=$(find "$base" -path "*/logstash-filter-elastic_integration-*/vendor/jar-dependencies/co/elastic/logstash-filter-elastic_integration/*/logstash-filter-elastic_integration-*.jar" -type f | head -1)

            if [ -z "$ei_jar" ]; then
              echo "WARNING: No elastic_integration JAR found, skipping"
              exit 0
            fi

            echo "Patching log4j-1.2-api in shaded JAR: $ei_jar"
            work_dir="/tmp/ei_jar_log4j_patch"

            mkdir -p "$work_dir"
            cd "$work_dir"

            # Extract the shaded JAR
            "$JAR_CMD" xf "$ei_jar"

            # Remove the old embedded log4j-1.2-api classes
            rm -rf org/apache/log4j

            # Extract the fixed log4j-1.2-api classes into the same location
            "$JAR_CMD" xf "$log4j_fixed" 'org/apache/log4j'

            # Update the pom metadata to reflect the new version
            rm -rf META-INF/maven/org.apache.logging.log4j/log4j-1.2-api
            "$JAR_CMD" xf "$log4j_fixed" 'META-INF/maven/org.apache.logging.log4j/log4j-1.2-api'

            # Repack the JAR
            rm "$ei_jar"
            "$JAR_CMD" cf "$ei_jar" .

            # Cleanup
            cd /
            rm -rf "$work_dir"

            # Verify the fix was applied
            "$JAR_CMD" tf "$ei_jar" | grep -q "org/apache/log4j/Category.class"
        - name: patch shaded http components in elastic_integration jar
          runs: |
            set -eux -o pipefail

            # CVE-2026-54399 - httpcore5 5.4 -> 5.4.3
            # CVE-2026-54428 - httpcore5-h2 5.4 -> 5.4.3
            # CVE-2026-64607 - httpclient5 -> 5.6.3

            JAR_CMD="/opt/java/openjdk/21/bin/jar"
            httpcore5_fixed="${source.dir}/patch/deps/httpcore5-5.4.3.jar"
            httpcore5_h2_fixed="${source.dir}/patch/deps/httpcore5-h2-5.4.3.jar"
            httpclient5_fixed="${source.dir}/patch/deps/httpclient5-5.6.3.jar"
            base="${target.dir}/usr/share/logstash/vendor/bundle/jruby/3.4.0/gems"

            ei_jar=$(find "$base" -path "*/logstash-filter-elastic_integration-*/vendor/jar-dependencies/co/elastic/logstash-filter-elastic_integration/*/logstash-filter-elastic_integration-*.jar" -type f | head -1)

            if [ -z "$ei_jar" ]; then
              echo "WARNING: No elastic_integration JAR found, skipping"
              exit 0
            fi

            if ! "$JAR_CMD" tf "$ei_jar" | grep -q "org/apache/hc/"; then
              echo "No Apache HTTP components in elastic_integration JAR, skipping"
              exit 0
            fi

            echo "Patching Apache HTTP components in shaded JAR: $ei_jar"
            work_dir="/tmp/ei_jar_http_patch"

            mkdir -p "$work_dir"
            cd "$work_dir"

            "$JAR_CMD" xf "$ei_jar"

            rm -rf org/apache/hc/core5
            rm -rf org/apache/hc/client5
            rm -rf META-INF/maven/org.apache.httpcomponents.core5/httpcore5
            rm -rf META-INF/maven/org.apache.httpcomponents.core5/httpcore5-h2
            rm -rf META-INF/maven/org.apache.httpcomponents.client5/httpclient5

            "$JAR_CMD" xf "$httpcore5_fixed" 'org/apache/hc/core5'
            "$JAR_CMD" xf "$httpcore5_fixed" 'META-INF/maven/org.apache.httpcomponents.core5/httpcore5'
            "$JAR_CMD" xf "$httpcore5_h2_fixed" 'org/apache/hc/core5/http2'
            "$JAR_CMD" xf "$httpcore5_h2_fixed" 'META-INF/maven/org.apache.httpcomponents.core5/httpcore5-h2'
            "$JAR_CMD" xf "$httpclient5_fixed" 'org/apache/hc/client5'
            "$JAR_CMD" xf "$httpclient5_fixed" 'META-INF/maven/org.apache.httpcomponents.client5/httpclient5'

            rm "$ei_jar"
            "$JAR_CMD" cf "$ei_jar" .

            verify_dir="/tmp/ei_jar_http_verify"
            rm -rf "$verify_dir"
            mkdir -p "$verify_dir"
            cd "$verify_dir"
            "$JAR_CMD" xf "$ei_jar" META-INF/maven/org.apache.httpcomponents.core5/httpcore5/pom.properties
            "$JAR_CMD" xf "$ei_jar" META-INF/maven/org.apache.httpcomponents.core5/httpcore5-h2/pom.properties
            "$JAR_CMD" xf "$ei_jar" META-INF/maven/org.apache.httpcomponents.client5/httpclient5/pom.properties
            grep -q 'version=5.4.3' META-INF/maven/org.apache.httpcomponents.core5/httpcore5/pom.properties
            grep -q 'version=5.4.3' META-INF/maven/org.apache.httpcomponents.core5/httpcore5-h2/pom.properties
            grep -q 'version=5.6.3' META-INF/maven/org.apache.httpcomponents.client5/httpclient5/pom.properties

            cd /
            rm -rf "$work_dir" "$verify_dir"
        - name: fix vulnerable ruby gems
          runs: |
            set -eux -o pipefail

            bundle_dir="${target.dir}/usr/share/logstash/vendor/bundle/jruby/3.4.0"
            jruby_bin="${target.dir}/usr/share/logstash/vendor/jruby/bin"
            jruby_stdlib="${target.dir}/usr/share/logstash/vendor/jruby/lib/ruby/stdlib"
            shared_spec_dir="${target.dir}/usr/share/logstash/vendor/jruby/lib/ruby/gems/shared/specifications"
            default_spec_dir="${target.dir}/usr/share/logstash/vendor/jruby/lib/ruby/gems/shared/specifications/default"

            PATH="$jruby_bin:$PATH"

            install_default_gem() {
              gem_file="$1"
              gem_name="$2"
              fixed_spec="$3"

              unpack_dir="/tmp/${fixed_spec}-gem"
              rm -rf "$unpack_dir"
              mkdir -p "$unpack_dir"

              gem unpack "$gem_file" --target "$unpack_dir"
              cp -a "$unpack_dir/$fixed_spec/lib/." "$jruby_stdlib/"
              version="${fixed_spec#${gem_name}-}"
              cat > "$default_spec_dir/$fixed_spec.gemspec" << EOF
            Gem::Specification.new do |s|
              s.name = "$gem_name"
              s.version = "$version"
              s.summary = "$gem_name"
              s.files = []
              s.require_paths = ["lib"]
            end
            EOF

              find "$jruby_stdlib" -type f -name "$gem_name.gemspec" -delete
              find "$shared_spec_dir" -maxdepth 1 -type f -name "$gem_name-*.gemspec" -delete
              find "$default_spec_dir" -type f -name "$gem_name-*.gemspec" ! -name "$fixed_spec.gemspec" -delete
              rm -rf "$unpack_dir"
            }

            install_fixed_gem() {
              gem_file="$1"
              gem_name="$2"
              fixed_spec="$3"
              prune_bundle="$4"

              gem install "$gem_file" --local --install-dir "$bundle_dir" --no-document --ignore-dependencies --force

              if [ "$prune_bundle" = "true" ]; then
                find "$bundle_dir/gems" -maxdepth 1 -type d -name "$gem_name-*" ! -name "$fixed_spec" -exec rm -rf {} +
                find "$bundle_dir/specifications" -type f -name "$gem_name-*.gemspec" ! -name "$fixed_spec.gemspec" -delete
              fi

              find "$default_spec_dir" -type f -name "$gem_name-*.gemspec" -delete
              find "$shared_spec_dir" -maxdepth 1 -type f -name "$gem_name-*.gemspec" -delete
            }

            install_default_gem "${source.dir}/patch/deps/cgi-0.3.7.gem" cgi cgi-0.3.7
            install_default_gem "${source.dir}/patch/deps/erb-4.0.3.1.gem" erb erb-4.0.3.1
            # Logstash 8.19.17+ ships net-imap 0.5.15 in the bundle, but JRuby still ships a
            # vulnerable 0.2.5 default gem that Scout keys on unless we replace it here.
            # Logstash 9.4+ may ship net-imap 0.6.3/0.6.4; CVE-2026-47240/47241/47242 require 0.6.4.1.
            # Newer 9.4.x (for example 9.4.5) and 9.5+ already ship 0.6.4.1+ in the lock release file.
            case "9.4" in
              8.19)
                install_default_gem "${source.dir}/patch/deps/net-imap-0.5.15.gem" net-imap net-imap-0.5.15
                ;;
              9.1 | 9.2 | 9.3)
                install_default_gem "${source.dir}/patch/deps/net-imap-0.5.14.gem" net-imap net-imap-0.5.14
                install_fixed_gem "${source.dir}/patch/deps/net-imap-0.5.14.gem" net-imap net-imap-0.5.14 true
                ;;
              9.4)
                if grep -qE 'net-imap \(0\.6\.(3|4)\)' "${target.dir}/usr/share/logstash/Gemfile.lock"; then
                  install_default_gem "${source.dir}/patch/deps/net-imap-0.6.4.1.gem" net-imap net-imap-0.6.4.1
                  install_fixed_gem "${source.dir}/patch/deps/net-imap-0.6.4.1.gem" net-imap net-imap-0.6.4.1 true
                  sed -i 's/net-imap (0\.6\.[34])/net-imap (0.6.4.1)/g' "${target.dir}/usr/share/logstash/Gemfile.lock"
                fi
                ;;
            esac
            # CVE-2026-54904, CVE-2026-54905, CVE-2026-54906 - concurrent-ruby 1.1.9 -> 1.3.7
            # Logstash 9.5.2+ ships concurrent-ruby 1.3.8 in the lock release file; skip the shim.
            if grep -qE 'concurrent-ruby \(1\.1\.' "${target.dir}/usr/share/logstash/Gemfile.lock"; then
              install_fixed_gem "${source.dir}/patch/deps/concurrent-ruby-1.3.7.gem" concurrent-ruby concurrent-ruby-1.3.7 true
              sed -i 's/concurrent-ruby (1\.1\.[0-9]\+)/concurrent-ruby (1.3.7)/' "${target.dir}/usr/share/logstash/Gemfile.lock"
            fi
            # CVE-2026-54297 - faraday 2.14.2 -> 2.14.3
            install_fixed_gem "${source.dir}/patch/deps/faraday-2.14.3.gem" faraday faraday-2.14.3 true
            install_fixed_gem "${source.dir}/patch/deps/faraday-net_http-3.4.4.gem" faraday-net_http faraday-net_http-3.4.4 true
            sed -i 's/faraday (2\.14\.[0-2])/faraday (2.14.3)/' "${target.dir}/usr/share/logstash/Gemfile.lock"
            sed -i 's/faraday-net_http (3\.4\.[0-3])/faraday-net_http (3.4.4)/' "${target.dir}/usr/share/logstash/Gemfile.lock"
            # GHSA-5prr-v3j2-97mh, GHSA-5v8h-3h3q-446p, GHSA-8678-w3jw-xfc2, GHSA-9cv2-cfxc-v4v2,
            # GHSA-p67v-3w7g-wjg7, GHSA-phwj-rprq-35pp, GHSA-wfpw-mmfh-qq69, GHSA-wjv4-x9w8-wm3h - nokogiri 1.19.3 -> 1.19.4
            install_fixed_gem "${source.dir}/patch/deps/nokogiri-1.19.4-java.gem" nokogiri nokogiri-1.19.4-java true
            sed -i 's/nokogiri (1\.1[89]\.[0-9]\+-java)/nokogiri (1.19.4-java)/' "${target.dir}/usr/share/logstash/Gemfile.lock"
            sed -i 's/>= 3\.2/>= 3.1/' "$bundle_dir/specifications/nokogiri-1.19.4-java.gemspec"
            # Bundler 2.7+ (Logstash 9.4+) validates path-gem gemspecs against Gemfile.lock at runtime.
            gemspec="${target.dir}/usr/share/logstash/logstash-core/logstash-core.gemspec"
            lockfile="${target.dir}/usr/share/logstash/Gemfile.lock"
            sed -i 's/concurrent-ruby (~> 1, < 1.1.10)/concurrent-ruby (~> 1.3)/g' "$lockfile"
            sed -i 's/gem.add_runtime_dependency "concurrent-ruby", "~> 1", "< 1.1.10"/gem.add_runtime_dependency "concurrent-ruby", "~> 1.3"/' "$gemspec"
            # CVE-2026-47736, CVE-2026-47737 - remediate vulnerable puma when upstream lock is < 8.0.2
            # (9.4.4+ ships puma 8.0.2-java; do not downgrade to 7.2.1-java)
            if ! grep -qE 'puma \(8\.0\.[2-9]' "${target.dir}/usr/share/logstash/Gemfile.lock"; then
              install_fixed_gem "${source.dir}/patch/deps/puma-7.2.1-java.gem" puma puma-7.2.1-java true
              sed -i 's/puma ([67]\.[0-9]\+\.[0-9]\+-java)/puma (7.2.1-java)/' "${target.dir}/usr/share/logstash/Gemfile.lock"
              sed -i 's/puma (~> 6.3, >= 6.4.2)/puma (~> 7.2, >= 7.2.1)/g' "$lockfile"
              sed -i "s/gem.add_runtime_dependency 'puma', '~> 6.3', '>= 6.4.2'/gem.add_runtime_dependency 'puma', '~> 7.2', '>= 7.2.1'/" "$gemspec"
            fi
            install_default_gem "${source.dir}/patch/deps/rexml-3.4.4.gem" rexml rexml-3.4.4
            install_default_gem "${source.dir}/patch/deps/uri-0.12.5.gem" uri uri-0.12.5
            # CVE-2026-71847 - json 2.20.0 -> 2.21.2-java when the bundle still ships 2.20.x/2.21.0/2.21.1
            if grep -qE 'json \(2\.(20\.[0-9]+|21\.[01])(-java)?\)' "${target.dir}/usr/share/logstash/Gemfile.lock"; then
              install_fixed_gem "${source.dir}/patch/deps/json-2.21.2-java.gem" json json-2.21.2-java true
              sed -i -E 's/json \(2\.(20\.[0-9]+|21\.[01])(-java)?\)/json (2.21.2-java)/' "${target.dir}/usr/share/logstash/Gemfile.lock"
            fi
        - name: replace vulnerable bouncycastle jars
          runs: |
            set -eux -o pipefail

            base="${target.dir}/usr/share/logstash"

            replace_bouncycastle_jar() {
              artifact="$1"
              fixed="${source.dir}/patch/deps/${artifact}-1.84.jar"

              find "$base" -path "*/org/bouncycastle/$artifact/*/${artifact}-*.jar" -type f | while read -r old_jar; do
                old_version_dir=$(dirname "$old_jar")
                artifact_dir=$(dirname "$old_version_dir")
                fixed_dir="$artifact_dir/1.84"

                echo "Replacing $old_jar with $fixed_dir/${artifact}-1.84.jar"
                rm "$old_jar"
                rmdir "$old_version_dir" 2> /dev/null || true
                mkdir -p "$fixed_dir"
                cp "$fixed" "$fixed_dir/${artifact}-1.84.jar"
              done
            }

            replace_bouncycastle_jar bcprov-jdk18on
            replace_bouncycastle_jar bcpkix-jdk18on
            replace_bouncycastle_jar bcutil-jdk18on
            replace_bouncycastle_jar bctls-jdk18on

            find "$base" -path "*/jopenssl/version.rb" -type f -exec sed -i "s/BOUNCY_CASTLE_VERSION = '[0-9.]*'/BOUNCY_CASTLE_VERSION = '1.84'/" {} +
      paths:
        - type: directory
          path: ${source.dir}/patch
          uid: 0
          gid: 0
          source: image/logstash/patch
      outputs:
        - source: ${target.dir}/usr/share/logstash
          target: /usr/share/logstash
          uid: 0
          gid: 0
          mode: "0755"
        - source: /opt/docker/sbom/logstash
          target: /opt/docker/sbom/logstash
          uid: 0
          gid: 0
        - source: ${source.dir}/logstash/docker/data/logstash/bin/docker-entrypoint
          target: /usr/local/bin/docker-entrypoint
          uid: 0
          gid: 0
          mode: "0755"
        - source: ${source.dir}/logstash/docker/data/logstash/config/pipelines.yml
          target: /usr/share/logstash/config/pipelines.yml
          uid: 1000
          gid: 1000
          mode: "0644"
        - source: ${source.dir}/logstash/docker/data/logstash/config/log4j2.properties
          target: /usr/share/logstash/config/log4j2.properties
          uid: 1000
          gid: 1000
          mode: "0644"
        - source: ${source.dir}/logstash/docker/data/logstash/config/log4j2.file.properties
          target: /usr/share/logstash/config/log4j2.file.properties
          uid: 1000
          gid: 1000
          mode: "0644"
        - source: ${source.dir}/logstash/docker/data/logstash/config/logstash-oss.yml
          target: /usr/share/logstash/config/logstash.yml
          uid: 1000
          gid: 1000
          mode: "0644"
        - source: ${source.dir}/logstash/docker/data/logstash/pipeline/default.conf
          target: /usr/share/logstash/pipeline/logstash.conf
          uid: 1000
          gid: 1000
          mode: "0644"
    - name: locale
      contents:
        packages:
          - bash
          - locales
          - coreutils
          - gzip
      pipeline:
        - name: install locales
          runs: |
            set -eux -o pipefail

            ln -s /etc/locale.alias /usr/share/locale/locale.alias

            echo "en_US.UTF-8 UTF-8" >> /etc/locale.gen
            locale-gen en_US.UTF-8
      outputs:
        - source: /usr/share/locale
          target: /usr/share/locale
          uid: 0
          gid: 0
        - source: /usr/lib/locale
          target: /usr/lib/locale
          uid: 0
          gid: 0
accounts:
  run-as: logstash
  users:
    - name: logstash
      uid: 1000
      gid: 1000
  groups:
    - name: logstash
      gid: 1000
      members:
        - logstash
os-release:
  name: Docker Hardened Images (Debian)
  id: debian
  version-id: "13"
  version-codename: trixie
  pretty-name: Docker Hardened Images/Debian GNU/Linux 13 (trixie)
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
work-dir: /usr/share/logstash
environment:
  ELASTIC_CONTAINER: "true"
  LANG: en_US.UTF-8
  LANGUAGE: en_US:en
  LC_ALL: en_US.UTF-8
  PATH: /usr/share/logstash/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
paths:
  - type: directory
    path: /usr/share/logstash
    uid: 0
    gid: 0
    mode: "0755"
  - type: directory
    path: /usr/share/logstash/data
    uid: 1000
    gid: 1000
    mode: "2755"
  - type: directory
    path: /usr/share/logstash/logs
    uid: 1000
    gid: 1000
    mode: "2755"
  - type: symlink
    path: /opt/logstash
    uid: 0
    gid: 0
    source: /usr/share/logstash
  - type: symlink
    path: /usr/share/logstash/jdk
    uid: 0
    gid: 0
    source: /usr/lib/jvm/temurin-21
annotations:
  org.opencontainers.image.description: A minimal logstash image
  org.opencontainers.image.licenses: Elastic-License-2.0
entrypoint:
  - /usr/local/bin/docker-entrypoint
ports:
  - 9600/tcp
  - 5044/tcp
