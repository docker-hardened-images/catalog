# syntax=dhi.io/build:2-debian12

name: Temporal Admin Tools 1.28.x
image: dhi.io/temporalio-admin-tools
variant: runtime
tags:
  - 1.28-debian12
  - 1.28.4-debian12
  - 1.28.4-cli-1.7.3-debian12
platforms:
  - linux/amd64
  - linux/arm64
vars:
  CLI_VERSION: 1.7.3
  DEBIAN_EPOCH_MAJOR_MINOR_VERSION: "1.28"
  DEBIAN_EPOCH_MAJOR_VERSION: "1"
  DEBIAN_EPOCH_VERSION: 1.28.4
  DEBIAN_VERSION: "12"
  PYTHON_BUILD_REFERENCE: dhi/python:3.13.18-debian12-dev@sha256:27203f50737ffa93ede937572025e8e94a5531008c8d9e5f734f83b69dff286b
  PYTHON_REFERENCE: dhi/python:3.13.18-debian12@sha256:615a0b8ad5fc5d414233ac06ae82a0ef208769b186af120c2278444a52b0f2bc
  SEMVER_MAJOR_MINOR_VERSION: "1.28"
  SEMVER_MAJOR_VERSION: "1"
  SEMVER_VERSION: 1.28.4
  TEMPORALIO_SERVER_DIGEST: sha256:9533798522a794a3b69202030616eef3b45445331494d8101a6178dc0572f8c2
  VARIANT_SUFFIX: ""
  VERSION: 1.28.4
contents:
  packages:
    - bash
    - bash-completion
    - ca-certificates
    - coreutils
    - curl
    - jq
    - tini
    - tzdata
  builds:
    - name: add bash completion
      contents:
        packages:
          - bash
          - coreutils
        artifacts:
          - name: dhi.io/temporalio-server:1.28.4-debian12@sha256:9533798522a794a3b69202030616eef3b45445331494d8101a6178dc0572f8c2
            includes:
              - usr/local/bin/temporal
            uid: 0
            gid: 0
      pipeline:
        - name: install bash completion
          runs: |
            set -eux -o pipefail

            # [The OS] has a /etc/bash/bashrc that sources all files named /etc/bash/*.sh for
            # interactive shells, so we can add completion logic in /etc/bash/temporal-completion.sh
            # Completion for temporal depends on the bash-completion package.
            mkdir -p "${target.dir}"/etc/bash/
            /usr/local/bin/temporal completion bash > "${target.dir}"/etc/bash/temporal-completion.sh
      outputs:
        - source: ${target.dir}/etc/bash/temporal-completion.sh
          target: /etc/bash/temporal-completion.sh
          uid: 0
          gid: 0
    - name: add cqlsh
      uses: dhi.io/python:3.13.18-debian12-dev@sha256:27203f50737ffa93ede937572025e8e94a5531008c8d9e5f734f83b69dff286b
      contents:
        packages:
          - bash
          - ca-certificates
      pipeline:
        - name: add cqlsh
          privileged: true
          runs: |
            set -eux -o pipefail

            export VIRTUAL_ENV='/opt/cqlsh'
            python3 -m venv --without-pip "$VIRTUAL_ENV"
            PY="$VIRTUAL_ENV/bin/python3"

            python3 -m pip install --upgrade 'pip>=26.1.2'
            python3 -m pip --python "$PY" install --no-cache-dir 'zipp>=3.19.1'
            python3 -m pip --python "$PY" install --no-cache-dir --upgrade 'setuptools>=84.1.0'
            python3 -m pip --python "$PY" install --no-cache-dir cqlsh
            python3 -m pip --python "$PY" install --no-cache-dir --upgrade 'setuptools>=84.1.0'

            mkdir -p /usr/local/bin
            ln -s ../../../opt/cqlsh/bin/cqlsh /usr/local/bin
      outputs:
        - source: /opt/cqlsh
          target: /opt/cqlsh
          uid: 0
          gid: 0
        - source: /usr/local/bin/cqlsh
          target: /usr/local/bin/cqlsh
          uid: 0
          gid: 0
    - name: add yq
      uses: dhi.io/python:3.13.18-debian12-dev@sha256:27203f50737ffa93ede937572025e8e94a5531008c8d9e5f734f83b69dff286b
      contents:
        packages:
          - bash
          - ca-certificates
      pipeline:
        - name: add yq
          privileged: true
          runs: |
            set -eux -o pipefail

            export VIRTUAL_ENV='/opt/yq'
            python3 -m venv --without-pip "$VIRTUAL_ENV"
            PY="$VIRTUAL_ENV/bin/python3"

            python3 -m pip install --upgrade 'pip>=26.1.2'
            python3 -m pip --python "$PY" install --no-cache-dir 'zipp>=3.19.1'
            python3 -m pip --python "$PY" install --no-cache-dir --upgrade 'setuptools>=84.1.0'
            python3 -m pip --python "$PY" install --no-cache-dir yq
            python3 -m pip --python "$PY" install --no-cache-dir --upgrade 'setuptools>=84.1.0'

            mkdir -p /usr/local/bin
            ln -s ../../../opt/yq/bin/yq /usr/local/bin
      outputs:
        - source: /opt/yq
          target: /opt/yq
          uid: 0
          gid: 0
        - source: /usr/local/bin/yq
          target: /usr/local/bin/yq
          uid: 0
          gid: 0
  artifacts:
    - name: dhi.io/temporalio-server:1.28.4-debian12@sha256:9533798522a794a3b69202030616eef3b45445331494d8101a6178dc0572f8c2
      includes:
        - etc/temporal/schema/**
        - usr/local/bin/tdbg
        - usr/local/bin/temporal
        - usr/local/bin/temporal-cassandra-tool
        - usr/local/bin/temporal-sql-tool
      uid: 0
      gid: 0
    - name: dhi.io/python:3.13.18-debian12@sha256:615a0b8ad5fc5d414233ac06ae82a0ef208769b186af120c2278444a52b0f2bc
      includes:
        - opt/**
        - usr/**
      excludes:
        - opt/python-*/lib/python*/site-packages/pip/**
      uid: 0
      gid: 0
accounts:
  run-as: temporal
  users:
    - name: temporal
      uid: 1000
      gid: 1000
  groups:
    - name: temporal
      gid: 1000
      members:
        - temporal
os-release:
  name: Docker Hardened Images (Debian)
  id: debian
  version-id: "12"
  version-codename: bookworm
  pretty-name: Docker Hardened Images/Debian GNU/Linux 12 (bookworm)
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
work-dir: /etc/temporal
environment:
  TEMPORAL_HOME: /etc/temporal
paths:
  - type: directory
    path: /etc/temporal/config
    uid: 1000
    gid: 1000
    mode: "0770"
annotations:
  org.opencontainers.image.description: A minimal Temporal Admin Tools image
  org.opencontainers.image.licenses: MIT
entrypoint:
  - /usr/bin/tini
  - --
  - sleep
  - infinity
