# syntax=dhi.io/build:2-debian13

name: Temporal Admin Tools 1.28.x
image: dhi.io/temporalio-admin-tools
variant: runtime
tags:
  - "1.28"
  - 1.28.4
  - 1.28-debian
  - 1.28-debian13
  - 1.28.4-debian
  - 1.28.4-debian13
  - 1.28.4-cli-1.8.3
  - 1.28.4-cli-1.8.3-debian
  - 1.28.4-cli-1.8.3-debian13
platforms:
  - linux/amd64
  - linux/arm64
vars:
  CLI_COMMIT_SHA: 1ff10b1012b44ba8bc953fcaa8ce5d296bf169d0
  CLI_VERSION: 1.8.3
  COMMIT_SHA: 246f0667ac40a863186237f0f10bce13ce84efc5
  DEBIAN_EPOCH_MAJOR_MINOR_VERSION: "1.28"
  DEBIAN_EPOCH_MAJOR_VERSION: "1"
  DEBIAN_EPOCH_VERSION: 1.28.4
  SEMVER_MAJOR_MINOR_VERSION: "1.28"
  SEMVER_MAJOR_VERSION: "1"
  SEMVER_VERSION: 1.28.4
  VERSION: 1.28.4
contents:
  repositories:
    - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
  keyring:
    - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
  packages:
    - '!libpython3-stdlib'
    - '!libpython3.13-minimal'
    - '!libpython3.13-stdlib'
    - '!python3'
    - '!python3-minimal'
    - '!python3.13'
    - '!python3.13-minimal'
    - base-files
    - bash
    - bash-completion
    - ca-certificates
    - ca-certificates-bundle
    - coreutils
    - curl
    - jq
    - libstdc++6
    - python-3.13
    - python-3.13-dev
    - python3-pip
    - python3-setuptools
    - python3-wheel
    - tini
    - tzdata
  builds:
    - name: build apps
      work-dir: /go/src/go.temporal.io/temporal
      caches:
        - path: /go/pkg/mod
      contents:
        packages:
          - bash
          - ca-certificates-bundle
          - coreutils
          - golang-1.26
          - findutils
          - mawk
          - sed
        files:
          - url: git+https://github.com/temporalio/temporal.git#v1.28.4
            checksum: 246f0667ac40a863186237f0f10bce13ce84efc5
            path: /go/src/go.temporal.io/temporal
            spdx:
              name: temporalio-admin-tools
              version: 1.28.4
              packages:
                - name: temporal-cassandra-tool
                  purl: pkg:golang/go.temporal.io/server/cmd/tools/cassandra@1.28.4
                  license: MIT
                - name: temporal-sql-tool
                  purl: pkg:golang/go.temporal.io/server/cmd/tools/sql@1.28.4
                  license: MIT
                - name: tdbg
                  purl: pkg:golang/go.temporal.io/server/cmd/tools/tdbg@1.28.4
                  license: MIT
            uid: 0
            gid: 0
      pipeline:
        - name: go dependencies (1.28 only)
          uses: go/bump@v2
          work-dir: /go/src/go.temporal.io/temporal
          with:
            deps:
              - golang.org/x/crypto@v0.52.0
              - golang.org/x/net@v0.56.0
              - filippo.io/edwards25519@v1.1.1
              - github.com/apache/thrift@v0.23.0
              - github.com/go-jose/go-jose/v4@v4.1.4
              - github.com/jackc/pgx/v5@v5.9.2
              - github.com/klauspost/compress@v1.18.7
              - go.opentelemetry.io/otel@v1.44.0
              - go.opentelemetry.io/otel/sdk@v1.43.0
              - google.golang.org/grpc@v1.82.1
            download: true
        - name: build temporal-cassandra-tool
          uses: go/build@v1
          with:
            output: ${target.dir}/usr/local/bin/temporal-cassandra-tool
            packages: ./cmd/tools/cassandra
        - name: build temporal-sql-tool
          uses: go/build@v1
          with:
            output: ${target.dir}/usr/local/bin/temporal-sql-tool
            packages: ./cmd/tools/sql
        - name: build tdbg
          uses: go/build@v1
          with:
            output: ${target.dir}/usr/local/bin/tdbg
            packages: ./cmd/tools/tdbg
        - name: install schema
          shell: bash
          runs: |
            set -eux -o pipefail

            mkdir -p "${target.dir}/etc/temporal"

            # Copy configuration files and scripts
            cp -r schema "${target.dir}/etc/temporal/"
      outputs:
        - source: ${target.dir}/usr/local/bin/temporal-cassandra-tool
          target: /usr/local/bin/temporal-cassandra-tool
          uid: 0
          gid: 0
        - source: ${target.dir}/usr/local/bin/temporal-sql-tool
          target: /usr/local/bin/temporal-sql-tool
          uid: 0
          gid: 0
        - source: ${target.dir}/usr/local/bin/tdbg
          target: /usr/local/bin/tdbg
          uid: 0
          gid: 0
        - source: ${target.dir}/etc/temporal/schema
          target: /etc/temporal/schema
          uid: 0
          gid: 0
    - name: build-cli
      work-dir: /go/src/github.com/temporalio/cli
      caches:
        - path: /go/pkg/mod
      contents:
        packages:
          - bash
          - ca-certificates-bundle
          - coreutils
          - golang-1.26
          - findutils
          - mawk
          - sed
        files:
          - url: git+https://github.com/temporalio/cli.git#v1.8.3
            checksum: 1ff10b1012b44ba8bc953fcaa8ce5d296bf169d0
            path: /go/src/github.com/temporalio/cli
            spdx:
              name: temporal-cli
              version: 1.8.3
              packages:
                - name: temporal-cli
                  purl: pkg:dhi/temporal-cli@1.8.3
                  license: MIT
            uid: 0
            gid: 0
      pipeline:
        - name: go dependencies (1.28 only)
          uses: go/bump@v2
          work-dir: /go/src/github.com/temporalio/cli
          with:
            deps:
              - github.com/apache/thrift@v0.23.0
              - github.com/aws/aws-sdk-go-v2/service/lambda@v1.88.5
              - github.com/go-jose/go-jose/v4@v4.1.4
              - github.com/gomarkdown/markdown@v0.0.0-20260411013819-759bbc3e3207
              - github.com/jackc/pgx/v5@v5.9.2
              - github.com/klauspost/compress@v1.18.7
              - github.com/labstack/echo/v4@v4.15.3
              - go.opentelemetry.io/otel@v1.44.0
              - go.opentelemetry.io/otel/sdk@v1.43.0
              - google.golang.org/grpc@v1.82.1
            download: true
        - name: build temporal CLI binary
          uses: go/build@v1
          with:
            output: ${target.dir}/usr/local/bin/temporal
            packages: ./cmd/temporal
        - name: test temporal CLI binary
          shell: bash
          runs: |
            set -eux -o pipefail

            ${target.dir}/usr/local/bin/temporal --help
        - name: install bash completion
          runs: |
            set -eux -o pipefail

            # [The OS] has a /etc/bash/bashrc that sources all files named /etc/bash/*.sh for
            # interactive shells, so we can add completion logic in /etc/bash/temporal-completion.sh
            # Completion for temporal depends on the bash-completion package.
            mkdir -p "${target.dir}"/etc/bash/
            ${target.dir}/usr/local/bin/temporal completion bash > "${target.dir}"/etc/bash/temporal-completion.sh
      outputs:
        - source: ${target.dir}/usr/local/bin/temporal
          target: /usr/local/bin/temporal
          uid: 0
          gid: 0
        - source: /opt/docker/sbom/temporal-cli
          target: /opt/docker/sbom/temporal-cli
          uid: 0
          gid: 0
        - source: ${target.dir}/etc/bash/temporal-completion.sh
          target: /etc/bash/temporal-completion.sh
          uid: 0
          gid: 0
    - name: add cqlsh
      contents:
        packages:
          - bash
          - ca-certificates
          - coreutils
          - python-3.13
          - python-3.13-dev
          - python3-pip
          - python3-setuptools
          - python3-wheel
          - libstdc++6
          - '!python3'
          - '!python3.13'
          - '!python3-minimal'
          - '!python3.13-minimal'
          - '!libpython3.13-minimal'
          - '!libpython3-stdlib'
          - '!libpython3.13-stdlib'
      pipeline:
        - name: add cqlsh
          privileged: true
          runs: |
            set -eux -o pipefail

            export VIRTUAL_ENV='/opt/cqlsh'
            python3 -m venv "$VIRTUAL_ENV"

            # CVE-2024-5569: zipp 1.0.0 → 3.19.1+
            "$VIRTUAL_ENV/bin/python3" -m pip install 'zipp>=3.19.1'

            # CVE-2026-8643, CVE-2026-6357, CVE-2026-3219: pip < 26.1.2
            "$VIRTUAL_ENV/bin/python3" -m pip install --upgrade 'pip>=26.1.2'

            "$VIRTUAL_ENV/bin/python3" -m pip install cqlsh

            # Make cqlsh executable available in PATH
            mkdir -p /usr/local/bin
            ln -s ../../../opt/cqlsh/bin/cqlsh /usr/local/bin
      outputs:
        - source: /opt/cqlsh
          target: /opt/cqlsh
          uid: 0
          gid: 0
        - source: /usr/local/bin/cqlsh
          target: /usr/local/bin/cqlsh
          uid: 0
          gid: 0
    - name: add yq
      contents:
        packages:
          - bash
          - ca-certificates
          - coreutils
          - python-3.13
          - python-3.13-dev
          - python3-pip
          - python3-setuptools
          - python3-wheel
          - libstdc++6
          - '!python3'
          - '!python3.13'
          - '!python3-minimal'
          - '!python3.13-minimal'
          - '!libpython3.13-minimal'
          - '!libpython3-stdlib'
          - '!libpython3.13-stdlib'
      pipeline:
        - name: add yq
          privileged: true
          runs: |
            set -eux -o pipefail

            export VIRTUAL_ENV='/opt/yq'
            python3 -m venv "$VIRTUAL_ENV"

            # CVE-2024-5569: zipp 1.0.0 → 3.19.1+
            "$VIRTUAL_ENV/bin/python3" -m pip install 'zipp>=3.19.1'

            # CVE-2026-8643, CVE-2026-6357, CVE-2026-3219: pip < 26.1.2
            "$VIRTUAL_ENV/bin/python3" -m pip install --upgrade 'pip>=26.1.2'

            "$VIRTUAL_ENV/bin/python3" -m pip install yq

            # Make yq executable available in PATH
            mkdir -p /usr/local/bin
            ln -s ../../../opt/yq/bin/yq /usr/local/bin
      outputs:
        - source: /opt/yq
          target: /opt/yq
          uid: 0
          gid: 0
        - source: /usr/local/bin/yq
          target: /usr/local/bin/yq
          uid: 0
          gid: 0
accounts:
  run-as: temporal
  users:
    - name: temporal
      uid: 1000
      gid: 1000
  groups:
    - name: temporal
      gid: 1000
      members:
        - temporal
os-release:
  name: Docker Hardened Images (Debian)
  id: debian
  version-id: "13"
  version-codename: trixie
  pretty-name: Docker Hardened Images/Debian GNU/Linux 13 (trixie)
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
work-dir: /etc/temporal
environment:
  TEMPORAL_HOME: /etc/temporal
paths:
  - type: directory
    path: /etc/temporal/config
    uid: 1000
    gid: 1000
    mode: "0770"
annotations:
  org.opencontainers.image.description: A minimal Temporal Admin Tools image
  org.opencontainers.image.licenses: MIT
entrypoint:
  - /usr/bin/tini
  - --
  - sleep
  - infinity
