# syntax=dhi.io/build:2-debian13

name: Ceph 19.x (dev)
image: dhi.io/ceph
variant: dev
tags:
  - 19-dev
  - 19.2-dev
  - 19.2.7-dev
  - 19-debian-dev
  - 19-debian13-dev
  - 19.2-debian-dev
  - 19.2-debian13-dev
  - 19.2.7-debian-dev
  - 19.2.7-debian13-dev
platforms:
  - linux/amd64
  - linux/arm64
dates:
  release: "2023-12-04"
vars:
  SEMVER_MAJOR_MINOR_VERSION: "19.2"
  SEMVER_MAJOR_VERSION: "19"
  SEMVER_VERSION: 19.2.7
  VERSION: 19.2.7-2
contents:
  repositories:
    - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
  keyring:
    - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
  packages:
    - '!ceph'
    - '!gawk'
    - '!libcephfs2'
    - '!libelogind0'
    - '!libpython-3.13-minimal'
    - '!libpython-3.13-stdlib'
    - '!libpython3-stdlib'
    - '!librados2'
    - '!original-awk'
    - '!python-3.13'
    - '!python-3.13-minimal'
    - '!python-3.13-stdlib'
    - '!python3'
    - '!python3-minimal'
    - apt
    - base-files
    - bash
    - ca-certificates
    - ca-certificates-bundle
    - ceph-19=19.2.7-2
    - coreutils
    - cryptsetup-bin
    - curl
    - diffutils
    - dpkg
    - findutils
    - gdisk
    - grep
    - libabsl20240722
    - libaio1t64
    - libbabeltrace1
    - libblkid1
    - libboost-context1.83.0
    - libboost-filesystem1.83.0
    - libboost-program-options1.83.0
    - libboost-thread1.83.0
    - libc-bin
    - libc6
    - libcap-ng0
    - libcap2
    - libcryptsetup12
    - libcurl3t64-gnutls
    - libcurl4t64
    - libexpat1
    - libfmt10
    - libfuse2t64
    - libgcc-s1
    - libgoogle-perftools4t64
    - libibverbs1
    - libicu76
    - libkeyutils1
    - libldap2
    - liblmdb0
    - liblttng-ust1t64
    - liblua5.3-0
    - liblz4-1
    - libnbd0
    - libncurses6
    - libnuma1
    - liboath0t64
    - librabbitmq4
    - librdkafka1
    - librdmacm1t64
    - libsnappy1v5
    - libsqlite3-0
    - libssl3t64
    - libstdc++6
    - libthrift-0.19.0t64
    - libtinfo6
    - libudev1
    - logrotate
    - lvm2
    - mawk
    - nfs-ganesha-ceph
    - perl-base
    - python-3.12
    - sed
    - tzdata
    - udev
    - util-linux
  builds:
    - name: locale
      contents:
        packages:
          - bash
          - locales
          - coreutils
          - gzip
      pipeline:
        - name: install locales
          runs: |
            set -eux -o pipefail

            ln -s /etc/locale.alias /usr/share/locale/locale.alias

            echo "en_US.UTF-8 UTF-8" >> /etc/locale.gen
            locale-gen en_US.UTF-8
      outputs:
        - source: /usr/share/locale
          target: /usr/share/locale
          uid: 0
          gid: 0
        - source: /usr/lib/locale
          target: /usr/lib/locale
          uid: 0
          gid: 0
accounts:
  root: true
  run-as: root
  users:
    - name: ceph
      uid: 167
      gid: 167
    - name: ceph
      uid: 167
      gid: 167
    - name: _apt
      uid: 42
      gid: 65532
  groups:
    - name: ceph
      gid: 167
      members:
        - ceph
    - name: ceph
      gid: 167
      members:
        - ceph
os-release:
  name: Docker Hardened Images (Debian)
  id: debian
  version-id: "13"
  version-codename: trixie
  pretty-name: Docker Hardened Images/Debian GNU/Linux 13 (trixie)
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
environment:
  DEBIAN_FRONTEND: noninteractive
  LANG: en_US.UTF-8
  LANGUAGE: en_US:en
  LC_ALL: en_US.UTF-8
  REQUESTS_CA_BUNDLE: /etc/ssl/certs/ca-certificates.crt
paths:
  - type: directory
    path: /usr/local
    uid: 167
    gid: 167
  - type: symlink
    path: /usr/local/bin
    uid: 0
    gid: 0
    source: /usr/bin
  - type: symlink
    path: /usr/local/sbin
    uid: 0
    gid: 0
    source: /usr/sbin
  - type: symlink
    path: /usr/local/lib
    uid: 0
    gid: 0
    source: /usr/lib
  - type: symlink
    path: /usr/local/share
    uid: 0
    gid: 0
    source: /usr/share
  - type: directory
    path: /var/lib/ceph
    uid: 167
    gid: 167
    mode: "0755"
  - type: directory
    path: /var/lib/ceph/osd
    uid: 167
    gid: 167
    mode: "0755"
  - type: directory
    path: /var/lib/logrotate
    uid: 167
    gid: 167
    mode: "0755"
  - type: directory
    path: /var/log/ceph
    uid: 167
    gid: 167
    mode: "0755"
  - type: directory
    path: /etc/ceph
    uid: 167
    gid: 167
    mode: "0755"
  - type: directory
    path: /run/ceph
    uid: 167
    gid: 167
    mode: "0755"
  - type: directory
    path: /etc/logrotate.d
    uid: 167
    gid: 167
    mode: "0755"
  - type: file
    path: /etc/logrotate.d/ceph
    content: |
      /var/log/ceph/*.log {
          daily
          rotate 7
          compress
          delaycompress
          missingok
          notifempty
          copytruncate
      }
    uid: 0
    gid: 0
    mode: "0644"
annotations:
  org.opencontainers.image.description: A minimal Ceph image
  org.opencontainers.image.licenses: LGPL-2.1
cmd:
  - /bin/bash
