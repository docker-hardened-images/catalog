# syntax=dhi.io/build:2-debian13

name: Ceph 21.x (compat)
image: dhi.io/ceph
variant: runtime
flavor: compat
tags:
  - 21-compat
  - 21.2-compat
  - 21.2.0-compat
  - 21-debian-compat
  - 21-debian13-compat
  - 21.2-debian-compat
  - 21.2-debian13-compat
  - 21.2.0-debian-compat
  - 21.2.0-debian13-compat
platforms:
  - linux/amd64
  - linux/arm64
dates:
  release: "2026-10-21"
vars:
  SEMVER_MAJOR_MINOR_VERSION: "21.2"
  SEMVER_MAJOR_VERSION: "21"
  SEMVER_VERSION: 21.2.0
  VERSION: 21.2.0-5
contents:
  repositories:
    - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
  keyring:
    - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
  packages:
    - '!ceph'
    - '!libcephfs2'
    - '!libpython3-stdlib'
    - '!libpython3.13-minimal'
    - '!libpython3.13-stdlib'
    - '!librados2'
    - '!python3'
    - '!python3-minimal'
    - '!python3.13'
    - '!python3.13-minimal'
    - '!python3.13-stdlib'
    - base-files
    - bash
    - ca-certificates-bundle
    - ceph-21=21.2.0-5
    - coreutils
    - cryptsetup-bin
    - curl
    - findutils
    - gdisk
    - grep
    - libabsl20240722
    - libaio1t64
    - libbabeltrace1
    - libblkid1
    - libboost-context1.83.0
    - libboost-filesystem1.83.0
    - libboost-program-options1.83.0
    - libboost-thread1.83.0
    - libc6
    - libcap-ng0
    - libcap2
    - libcryptsetup12
    - libcurl3t64-gnutls
    - libcurl4t64
    - libexpat1
    - libfmt10
    - libfuse2t64
    - libgcc-s1
    - libgoogle-perftools4t64
    - libibverbs1
    - libicu76
    - libkeyutils1
    - libldap2
    - liblmdb0
    - liblttng-ust1t64
    - liblua5.3-0
    - liblz4-1
    - libnbd0
    - libncurses6
    - libnuma1
    - liboath0t64
    - librabbitmq4
    - librdkafka1
    - librdmacm1t64
    - libsnappy1v5
    - libsqlite3-0
    - libssl3t64
    - libstdc++6
    - libthrift-0.19.0t64
    - libtinfo6
    - libudev1
    - logrotate
    - lvm2
    - nfs-ganesha-ceph
    - python-3.13
    - sed
    - tzdata
    - udev
    - util-linux
accounts:
  root: true
  run-as: root
  users:
    - name: ceph
      uid: 167
      gid: 167
    - name: ceph
      uid: 167
      gid: 167
  groups:
    - name: ceph
      gid: 167
      members:
        - ceph
    - name: ceph
      gid: 167
      members:
        - ceph
os-release:
  name: Docker Hardened Images (Debian)
  id: debian
  version-id: "13"
  version-codename: trixie
  pretty-name: Docker Hardened Images/Debian GNU/Linux 13 (trixie)
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
environment:
  REQUESTS_CA_BUNDLE: /etc/ssl/certs/ca-certificates.crt
paths:
  - type: directory
    path: /usr/local
    uid: 167
    gid: 167
  - type: symlink
    path: /usr/local/bin
    uid: 0
    gid: 0
    source: /usr/bin
  - type: symlink
    path: /usr/local/sbin
    uid: 0
    gid: 0
    source: /usr/sbin
  - type: symlink
    path: /usr/local/lib
    uid: 0
    gid: 0
    source: /usr/lib
  - type: symlink
    path: /usr/local/share
    uid: 0
    gid: 0
    source: /usr/share
  - type: directory
    path: /var/lib/ceph
    uid: 167
    gid: 167
    mode: "0755"
  - type: directory
    path: /var/lib/ceph/osd
    uid: 167
    gid: 167
    mode: "0755"
  - type: directory
    path: /var/lib/logrotate
    uid: 167
    gid: 167
    mode: "0755"
  - type: directory
    path: /var/log/ceph
    uid: 167
    gid: 167
    mode: "0755"
  - type: directory
    path: /etc/ceph
    uid: 167
    gid: 167
    mode: "0755"
  - type: directory
    path: /run/ceph
    uid: 167
    gid: 167
    mode: "0755"
  - type: directory
    path: /etc/logrotate.d
    uid: 167
    gid: 167
    mode: "0755"
  - type: file
    path: /etc/logrotate.d/ceph
    content: |
      /var/log/ceph/*.log {
          daily
          rotate 7
          compress
          delaycompress
          missingok
          notifempty
          copytruncate
      }
    uid: 0
    gid: 0
    mode: "0644"
annotations:
  org.opencontainers.image.description: A minimal Ceph image
  org.opencontainers.image.licenses: LGPL-2.1
cmd:
  - /bin/bash
