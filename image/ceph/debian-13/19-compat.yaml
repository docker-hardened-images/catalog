    gid: 167
    mode: "0755"
  - type: directory
    path: /etc/ceph
    uid: 167
    gid: 167
    mode: "0755"
  - type: directory
    path: /run/ceph
    uid: 167
    gid: 167
    mode: "0755"
  - type: directory
    path: /etc/logrotate.d
    uid: 167
    gid: 167
    mode: "0755"
  - type: file
    path: /etc/logrotate.d/ceph
    content: |
      /var/log/ceph/*.log {
          daily
          rotate 7
          compress
          delaycompress
          missingok
          notifempty
          copytruncate
      }
    uid: 0
    gid: 0
    mode: "0644"
annotations:
  org.opencontainers.image.description: A minimal Ceph image
  org.opencontainers.image.licenses: LGPL-2.1
cmd:
