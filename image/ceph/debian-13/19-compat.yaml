# syntax=dhi.io/build:2-debian13

name: Ceph 19.x (compat)
image: dhi.io/ceph
variant: runtime
flavor: compat
tags:
  - 19-compat
  - 19.2-compat
  - 19.2.5-compat
  - 19-debian-compat
  - 19-debian13-compat
  - 19.2-debian-compat
  - 19.2-debian13-compat
  - 19.2.5-debian-compat
  - 19.2.5-debian13-compat
platforms:
  - linux/amd64
  - linux/arm64
dates:
  release: "2023-12-04"
vars:
  COMMIT_SHA: abc7aa7f2701e5d46878fd5e6bb7e2955f1a395a
  SEMVER_MAJOR_MINOR_VERSION: "19.2"
  SEMVER_MAJOR_VERSION: "19"
  SEMVER_VERSION: 19.2.5
  VERSION: 19.2.5
contents:
  repositories:
    - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
  keyring:
    - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
  packages:
    - '!ceph'
    - '!libcephfs2'
    - '!libpython-3.13-minimal'
    - '!libpython-3.13-stdlib'
    - '!libpython3-stdlib'
    - '!librados2'
    - '!python-3.13'
    - '!python-3.13-minimal'
    - '!python-3.13-stdlib'
    - '!python3'
    - '!python3-minimal'
    - base-files
    - bash
    - ca-certificates-bundle
    - coreutils
    - cryptsetup-bin
    - curl
    - findutils
    - gdisk
    - grep
    - libabsl20240722
    - libaio1t64
    - libbabeltrace1
    - libblkid1
    - libboost-context1.83.0
    - libboost-filesystem1.83.0
    - libboost-program-options1.83.0
    - libboost-thread1.83.0
    - libc6
    - libcap-ng0
    - libcap2
    - libcryptsetup12
    - libcurl3t64-gnutls
    - libcurl4t64
    - libexpat1
    - libfmt10
    - libfuse2t64
    - libgcc-s1
    - libgoogle-perftools4t64
    - libibverbs1
    - libicu76
    - libkeyutils1
    - libldap2
    - liblmdb0
    - liblttng-ust1t64
    - liblua5.3-0
    - liblz4-1
    - libnbd0
    - libncurses6
    - libnuma1
    - liboath0t64
    - librabbitmq4
    - librdkafka1
    - librdmacm1t64
    - libsnappy1v5
    - libsqlite3-0
    - libssl3t64
    - libstdc++6
    - libthrift-0.19.0t64
    - libtinfo6
    - libudev1
    - logrotate
    - lvm2
    - nfs-ganesha-ceph
    - python-3.12
    - sed
    - tzdata
    - udev
    - util-linux
  builds:
    - name: ceph
      work-dir: ${source.dir}/ceph
      caches:
        - path: /ccache
      contents:
        packages:
          - '!libpython3-stdlib'
          - '!libpython-3.13-minimal'
          - '!libpython-3.13-stdlib'
          - '!python3-minimal'
          - '!python3'
          - '!python-3.13-minimal'
          - '!python-3.13-stdlib'
          - '!python-3.13'
          - python-3.12
          - python-3.12-dev
          - python3-pip
          - build-essential
          - g++
          - gcc
          - cmake
          - ccache
          - ninja-build
          - automake
          - libtool
          - pkg-config
          - bison
          - flex
          - ragel
          - patch
          - cpio
          - gperf
          - rustc
          - cargo
          - ca-certificates
          - curl
          - apt-transport-https
          - git
          - bash
          - coreutils
          - findutils
          - sed
          - grep
          - gzip
          - tar
          - xmlstarlet
          - jq
          - socat
          - iproute2
          - jsonnet
          - gawk
          - '!librados2'
          - '!libcephfs2'
          - libaio-dev
          - libblkid-dev
          - libc-ares-dev
          - libcap-dev
          - libcap-ng-dev
          - libcryptsetup-dev
          - libcunit1-dev
          - libcurl4-openssl-dev
          - libevent-dev
          - libexpat1-dev
          - libffi-dev
          - libfmt-dev
          - libfuse-dev
          - libgnutls28-dev
          - libhwloc-dev
          - libicu-dev
          - libkeyutils-dev
          - libldap2-dev
          - liblz4-dev
          - libncurses-dev
          - libnss3-dev
          - libnuma-dev
          - liboath-dev
          - libpciaccess-dev
          - libsctp-dev
          - libsnappy-dev
          - libsqlite3-dev
          - libssl-dev
          - libudev-dev
          - libxml2-dev
          - libzstd-dev
          - uuid-dev
          - zlib1g-dev
          - libabsl-dev
          - libbabeltrace-dev
          - libcrypto++-dev
          - libgoogle-perftools-dev
          - libibverbs-dev
          - librdmacm-dev
          - liblttng-ust-dev
          - liblua5.3-dev
          - libnbd-dev
          - librabbitmq-dev
          - libre2-dev
          - libutf8proc-dev
          - librdkafka-dev
          - libthrift-dev
          - libyaml-cpp-dev
          - liblmdb-dev
          - libnl-genl-3-dev
          - libxmlsec1t64
          - libxmlsec1t64-nss
          - libxmlsec1t64-openssl
          - libxmlsec1-dev
          - libdaxctl-dev
          - libndctl-dev
          - libpmem-dev
          - libpmemobj-dev
          - libprotobuf-dev
          - protobuf-compiler
          - libgrpc++-dev
          - protobuf-compiler-grpc
          - nlohmann-json3-dev
          - libxsimd-dev
          - systemd
          - systemtap-sdt-dev
          - uuid-runtime
          - xfslibs-dev
          - nasm
        files:
          - url: git+https://github.com/ceph/ceph.git#v19.2.5
            checksum: abc7aa7f2701e5d46878fd5e6bb7e2955f1a395a
            path: ${source.dir}/ceph
            spdx:
              name: ceph
              version: 19.2.5
              packages:
                - name: ceph
                  purl: pkg:dhi/ceph@19.2.5
                  license: LGPL-2.1
            uid: 0
            gid: 0
      pipeline:
        - name: install Python build dependencies
          privileged: true
          runs: |
            set -eux -o pipefail

            pip install --no-cache-dir Cython
            pip install --no-cache-dir sphinx
        - name: patch ceph 19 arrow and pymodule debian13 compatibility
          uses: git/patch@v1
          work-dir: ${source.dir}/ceph
          with:
            patch: ${source.dir}/patch/19-build-arrow-and-pymodule-debian13-compat.patch
        - name: patch ceph 19 ceph-volume importlib metadata compatibility
          uses: git/patch@v1
          work-dir: ${source.dir}/ceph
          with:
            patch: ${source.dir}/patch/19-runtime-importlib-metadata-compat.patch
        - name: patch opentelemetry to use Debian abseil
          uses: git/patch@v1
          work-dir: ${source.dir}/ceph
          with:
            patch: ${source.dir}/patch/build-opentelemetry-use-system-abseil.patch
        - name: patch opentelemetry jaeger thrift compatibility
          uses: git/patch@v1
          work-dir: ${source.dir}/ceph
          with:
            patch: ${source.dir}/patch/build-opentelemetry-jaeger-thrift-compat.patch
        - name: patch distutils remove install layout deb for ceph 19/20
          uses: git/patch@v1
          work-dir: ${source.dir}/ceph
          with:
            patch: ${source.dir}/patch/build-distutils-remove-install-layout-deb.patch
        - name: patch python source
          uses: git/patch@v1
          work-dir: ${source.dir}/ceph
          with:
            patch: ${source.dir}/patch/types.patch
        - name: install missing mgr deps and fix bcrypt
          work-dir: ${source.dir}/ceph/src/pybind/mgr
          privileged: true
          runs: |
            set -eux -o pipefail

            sed -i 's,bcrypt,bcrypt<4.0.0,' requirements-required.txt
            sed -i 's,scipy,scipy<1.15.0,' requirements-required.txt
            sed -i 's,cryptography,cryptography<37,' requirements-required.txt
            sed -i 's,cherrypy,cherrypy<19,' requirements-required.txt
            sed -i 's,setuptools,setuptools<82,' requirements-required.txt
            echo "numpy<2" >> requirements-required.txt

            pip install --ignore-installed --no-binary :all: --only-binary=scipy --no-cache-dir -r requirements-required.txt
        - name: configure and create build
          work-dir: ${source.dir}/ceph
          privileged: true
          environment:
            CCACHE_DIR: /ccache
            CCACHE_MAXSIZE: 20G
          runs: |
            set -eux -o pipefail

            git submodule update --init --recursive --recommend-shallow --progress
            mkdir -p build
            ARGS=(
              -GNinja
              -DCMAKE_BUILD_TYPE=Release
              -DCMAKE_INSTALL_LIBDIR=/usr/lib
              -DWITH_PYTHON3=3.12
              -DPython3_EXECUTABLE=/usr/bin/python3.12
              -DWITH_CCACHE=ON
              -DCMAKE_CXX_COMPILER=g++
              -DCMAKE_C_COMPILER=gcc
              -DCMAKE_C_COMPILER_LAUNCHER=ccache
              -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
              -DSETUPTOOLS_DEB_LAYOUT=OFF
              -DWITH_MGR_DASHBOARD_FRONTEND=OFF
              -DWITH_TESTS=OFF
              -DWITH_MANPAGE=OFF
              -DWITH_LIBCEPHSQLITE=ON
              -DWITH_LIBCEPHFS=ON
            )

            cmake -S . -B build "${ARGS[@]}"
        - name: build
          work-dir: ${source.dir}/ceph/build
          privileged: true
          environment:
            CCACHE_DIR: /ccache
            CCACHE_MAXSIZE: 20G
          runs: |
            set -eux -o pipefail

            ccache ninja -j"$(nproc)"
        - name: install
          work-dir: ${source.dir}/ceph/build
          runs: |
            set -eux -o pipefail

            mkdir -p "${target.dir}/usr"
            ln -s "${target.dir}/usr" "${target.dir}/usr/local"

            DESTDIR="${target.dir}" ninja install

            SITE_PKG="${target.dir}/usr/local/lib/python3.12/site-packages"
            BUILD_SITE="/usr/lib/python3.12/site-packages"
            cp -r "${BUILD_SITE}"/* "${SITE_PKG}/"
      paths:
        - type: file
          path: ${source.dir}/patch/19-build-arrow-and-pymodule-debian13-compat.patch
          uid: 0
          gid: 0
          source: image/ceph/patch/19-build-arrow-and-pymodule-debian13-compat.patch
        - type: file
          path: ${source.dir}/patch/19-runtime-importlib-metadata-compat.patch
          uid: 0
          gid: 0
          source: image/ceph/patch/19-runtime-importlib-metadata-compat.patch
        - type: file
          path: ${source.dir}/patch/build-opentelemetry-use-system-abseil.patch
          uid: 0
          gid: 0
          source: image/ceph/patch/build-opentelemetry-use-system-abseil.patch
        - type: file
          path: ${source.dir}/patch/build-opentelemetry-jaeger-thrift-compat.patch
          uid: 0
          gid: 0
          source: image/ceph/patch/build-opentelemetry-jaeger-thrift-compat.patch
        - type: file
          path: ${source.dir}/patch/build-distutils-remove-install-layout-deb.patch
          uid: 0
          gid: 0
          source: image/ceph/patch/build-distutils-remove-install-layout-deb.patch
        - type: file
          path: ${source.dir}/patch/21-build-distutils-remove-install-layout-deb.patch
          uid: 0
          gid: 0
          source: image/ceph/patch/21-build-distutils-remove-install-layout-deb.patch
        - type: file
          path: ${source.dir}/patch/types.patch
          uid: 0
          gid: 0
          source: image/ceph/patch/types.patch
      outputs:
        - source: ${target.dir}/usr/bin
          target: /usr/bin
          uid: 0
          gid: 0
          mode: "0755"
        - source: ${target.dir}/usr/sbin
          target: /usr/sbin
          uid: 0
          gid: 0
          mode: "0755"
        - source: ${target.dir}/usr/lib
          target: /usr/lib
          uid: 0
          gid: 0
        - source: ${target.dir}/usr/share/ceph
          target: /usr/share/ceph
          uid: 0
          gid: 0
        - source: /opt/docker/sbom/ceph
          target: /opt/docker/sbom/ceph
          uid: 0
          gid: 0
accounts:
  root: true
  run-as: root
  users:
    - name: ceph
      uid: 167
      gid: 167
    - name: ceph
      uid: 167
      gid: 167
  groups:
    - name: ceph
      gid: 167
      members:
        - ceph
    - name: ceph
      gid: 167
      members:
        - ceph
os-release:
