# syntax=dhi.io/build:2-debian13

name: MetalLB FRR-K8s 0.x (compat)
image: dhi.io/metallb-frr-k8s
variant: runtime
flavor: compat
tags:
  - 0-compat
  - 0.0-compat
  - 0.0.27-compat
  - 0-debian-compat
  - 0-debian13-compat
  - 0.0-debian-compat
  - 0.0-debian13-compat
  - 0.0.27-debian-compat
  - 0.0.27-debian13-compat
platforms:
  - linux/amd64
  - linux/arm64
dates:
  release: "2023-11-27"
vars:
  FLAVORED_SUFFIX: -compat
  SEMVER_MAJOR_MINOR_VERSION: "0.0"
  SEMVER_MAJOR_VERSION: "0"
  SEMVER_VERSION: 0.0.27
  SUFFIX: ""
  VERSION: 0.0.27-0
contents:
  repositories:
    - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
  keyring:
    - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
  packages:
    - '!libelogind0'
    - '!mawk'
    - '!original-awk'
    - base-files
    - busybox-static
    - ca-certificates-bundle
    - metallb-frr-k8s-0=0.0.27-0
    - tzdata
accounts:
  root: true
  run-as: root
  users:
    - name: nonroot
      uid: 65532
      gid: 65532
  groups:
    - name: nonroot
      gid: 65532
      members:
        - nonroot
os-release:
  name: Docker Hardened Images (Debian)
  id: debian
  version-id: "13"
  version-codename: trixie
  pretty-name: Docker Hardened Images/Debian GNU/Linux 13 (trixie)
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
paths:
  - type: symlink
    path: /frr-k8s
    uid: 0
    gid: 0
    source: /usr/bin/frr-k8s
  - type: symlink
    path: /statuscleaner
    uid: 0
    gid: 0
    source: /usr/bin/statuscleaner
  - type: symlink
    path: /frr-metrics
    uid: 0
    gid: 0
    source: /usr/lib/metallb-frr-k8s/frr-metrics
  - type: symlink
    path: /frr-status
    uid: 0
    gid: 0
    source: /usr/lib/metallb-frr-k8s/frr-status
  - type: symlink
    path: /frr-reloader.sh
    uid: 0
    gid: 0
    source: /usr/lib/metallb-frr-k8s/frr-reloader.sh
  - type: symlink
    path: /usr/bin/sh
    uid: 0
    gid: 0
    source: /usr/bin/busybox
  - type: symlink
    path: /usr/bin/cp
    uid: 0
    gid: 0
    source: /usr/bin/busybox
annotations:
  org.opencontainers.image.description: A minimal MetalLB FRR-K8s image
  org.opencontainers.image.licenses: Apache-2.0
cmd:
  - /bin/sh
