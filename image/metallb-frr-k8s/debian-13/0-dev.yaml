# syntax=dhi.io/build:2-debian13

name: MetalLB FRR-K8s 0.x (dev)
image: dhi.io/metallb-frr-k8s
variant: dev
tags:
  - 0-dev
  - 0.0-dev
  - 0.0.27-dev
  - 0-debian-dev
  - 0-debian13-dev
  - 0.0-debian-dev
  - 0.0-debian13-dev
  - 0.0.27-debian-dev
  - 0.0.27-debian13-dev
platforms:
  - linux/amd64
  - linux/arm64
dates:
  release: "2023-11-27"
vars:
  FLAVORED_SUFFIX: -dev
  SEMVER_MAJOR_MINOR_VERSION: "0.0"
  SEMVER_MAJOR_VERSION: "0"
  SEMVER_VERSION: 0.0.27
  SUFFIX: -dev
  VERSION: 0.0.27-0
contents:
  repositories:
    - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
  keyring:
    - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
  packages:
    - '!gawk'
    - '!libelogind0'
    - '!mawk'
    - '!original-awk'
    - apt
    - base-files
    - bash
    - ca-certificates
    - ca-certificates-bundle
    - coreutils
    - diffutils
    - dpkg
    - findutils
    - grep
    - libc-bin
    - mawk
    - metallb-frr-k8s-0-dev=0.0.27-0
    - perl-base
    - sed
    - tzdata
    - util-linux
accounts:
  root: true
  run-as: root
  users:
    - name: nonroot
      uid: 65532
      gid: 65532
    - name: _apt
      uid: 42
      gid: 65532
  groups:
    - name: nonroot
      gid: 65532
      members:
        - nonroot
os-release:
  name: Docker Hardened Images (Debian)
  id: debian
  version-id: "13"
  version-codename: trixie
  pretty-name: Docker Hardened Images/Debian GNU/Linux 13 (trixie)
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
environment:
  DEBIAN_FRONTEND: noninteractive
paths:
  - type: symlink
    path: /frr-k8s
    uid: 0
    gid: 0
    source: /usr/bin/frr-k8s
  - type: symlink
    path: /statuscleaner
    uid: 0
    gid: 0
    source: /usr/bin/statuscleaner
  - type: symlink
    path: /frr-metrics
    uid: 0
    gid: 0
    source: /usr/lib/metallb-frr-k8s/frr-metrics
  - type: symlink
    path: /frr-status
    uid: 0
    gid: 0
    source: /usr/lib/metallb-frr-k8s/frr-status
  - type: symlink
    path: /frr-reloader.sh
    uid: 0
    gid: 0
    source: /usr/lib/metallb-frr-k8s/frr-reloader.sh
annotations:
  org.opencontainers.image.description: A minimal MetalLB FRR-K8s image
  org.opencontainers.image.licenses: Apache-2.0
cmd:
  - /bin/sh
