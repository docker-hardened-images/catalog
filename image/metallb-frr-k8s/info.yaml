metadata:
  display-name: MetalLB FRR-K8s
  short-description: frr-k8s controller for MetalLB renders FRRConfiguration resources into FRRouting configuration and reports conversion and reload status for each node.
  featured: false
  home-url: https://github.com/metallb/frr-k8s
  categories:
    - networking
  included-tools:
    - name: frr-k8s
      description: Kubernetes controller that reconciles FRRConfiguration resources and writes the rendered FRR configuration for the node's reloader.
    - name: statuscleaner
      description: Validating admission webhook and stale-state cleaner for FRRConfiguration resources.
    - name: frr-metrics
      description: Prometheus exporter that runs inside the FRR container and serves FRR health and metrics.
    - name: frr-status
      description: Exporter that runs inside the FRR container and produces BGPSessionState objects.
    - name: frr-reloader.sh
      description: Script that runs inside the FRR container, applies the rendered configuration and reports the reload result.
