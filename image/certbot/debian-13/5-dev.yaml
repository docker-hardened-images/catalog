# syntax=dhi.io/build:2-debian13

name: Certbot 5.x (dev)
image: dhi.io/certbot
variant: dev
tags:
  - 5-dev
  - 5.10-dev
  - 5.10.0-dev
  - 5-debian-dev
  - 5-debian13-dev
  - 5.10-debian-dev
  - 5.10-debian13-dev
  - 5.10.0-debian-dev
  - 5.10.0-debian13-dev
platforms:
  - linux/amd64
  - linux/arm64
dates:
  release: "2025-09-02"
vars:
  SEMVER_MAJOR_MINOR_VERSION: "5.10"
  SEMVER_MAJOR_VERSION: "5"
  SEMVER_VERSION: 5.10.0
  VERSION: 5.10.0-0
contents:
  repositories:
    - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
  keyring:
    - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
  packages:
    - '!gawk'
    - '!libelogind0'
    - '!original-awk'
    - apt
    - base-files
    - bash
    - ca-certificates
    - ca-certificates-bundle
    - certbot=5.10.0-0
    - coreutils
    - diffutils
    - dpkg
    - findutils
    - grep
    - libc-bin
    - libffi8
    - libstdc++6
    - mawk
    - perl-base
    - python-3.14
    - sed
    - tzdata
    - util-linux
accounts:
  root: true
  run-as: root
  users:
    - name: nonroot
      uid: 65532
      gid: 65532
    - name: _apt
      uid: 42
      gid: 65532
  groups:
    - name: nonroot
      gid: 65532
      members:
        - nonroot
os-release:
  name: Docker Hardened Images (Debian)
  id: debian
  version-id: "13"
  version-codename: trixie
  pretty-name: Docker Hardened Images/Debian GNU/Linux 13 (trixie)
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
work-dir: /opt/certbot
environment:
  DEBIAN_FRONTEND: noninteractive
  PATH: /opt/certbot/.venv/bin:/opt/python/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
  PYTHONUNBUFFERED: "1"
paths:
  - type: directory
    path: /opt
    uid: 0
    gid: 0
    mode: "0755"
  - type: symlink
    path: /opt/certbot
    uid: 0
    gid: 0
    source: /usr/lib/certbot
  - type: directory
    path: /usr/local/bin
    uid: 0
    gid: 0
    mode: "0755"
  - type: symlink
    path: /usr/local/bin/certbot
    uid: 0
    gid: 0
    source: /usr/bin/certbot
  - type: directory
    path: /etc/letsencrypt
    uid: 65532
    gid: 65532
    mode: "0770"
  - type: directory
    path: /var/lib/letsencrypt
    uid: 65532
    gid: 65532
    mode: "0770"
  - type: directory
    path: /var/log/letsencrypt
    uid: 65532
    gid: 65532
    mode: "0770"
annotations:
  org.opencontainers.image.description: Certbot - EFF's ACME client for obtaining TLS certificates from Let's Encrypt and any ACME-compatible CA
  org.opencontainers.image.licenses: Apache-2.0
entrypoint:
  - /usr/local/bin/certbot
ports:
  - 80/tcp
  - 443/tcp
