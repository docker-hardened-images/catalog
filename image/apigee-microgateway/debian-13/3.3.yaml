# syntax=dhi.io/build:2-debian13

name: Apigee Microgateway 3.3.x
image: dhi.io/apigee-microgateway
variant: runtime
tags:
  - "3.3"
  - 3.3.12
  - 3.3-debian
  - 3.3-debian13
  - 3.3.12-debian
  - 3.3.12-debian13
platforms:
  - linux/amd64
  - linux/arm64
vars:
  SEMVER_MAJOR_MINOR_VERSION: "3.3"
  SEMVER_MAJOR_VERSION: "3"
  SEMVER_VERSION: 3.3.12
  VERSION: 3.3.12-1
contents:
  repositories:
    - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
  keyring:
    - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
  packages:
    - apigee-microgateway=3.3.12-1
    - base-files
    - ca-certificates-bundle
    - libc6
    - libgomp1
    - libstdc++6
    - netbase
    - nodejs-24
    - tzdata
accounts:
  run-as: nonroot
  users:
    - name: nonroot
      uid: 65532
      gid: 65532
  groups:
    - name: nonroot
      gid: 65532
      members:
        - nonroot
os-release:
  name: Docker Hardened Images (Debian)
  id: debian
  version-id: "13"
  version-codename: trixie
  pretty-name: Docker Hardened Images/Debian GNU/Linux 13 (trixie)
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
paths:
  - type: directory
    path: /usr/lib/node_modules
    uid: 0
    gid: 0
  - type: symlink
    path: /usr/lib/node_modules/edgemicro
    uid: 0
    gid: 0
    source: /usr/lib/apigee-microgateway
  - type: directory
    path: /home/nonroot/.edgemicro
    uid: 65532
    gid: 65532
  - type: file
    path: /home/nonroot/.edgemicro/default.yaml
    uid: 65532
    gid: 65532
    mode: "0644"
    source: image/apigee-microgateway/config/default.yaml
annotations:
  org.opencontainers.image.description: A minimal apigee microgateway image
  org.opencontainers.image.licenses: Apache-2.0
entrypoint:
  - node
  - /usr/bin/edgemicro
cmd:
  - start
