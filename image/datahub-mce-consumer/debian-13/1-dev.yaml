  SEMVER_VERSION: 1.7.0.1-7
  SUFFIX: -dev
  VERSION: 1.7.0.1-7
  VERSION_MAJOR_MINOR_PATCH: 1.7.0
contents:
  repositories:
    - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
  keyring:
    - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
  packages:
    - '!gawk'
    - '!libelogind0'
    - '!mawk'
    - '!original-awk'
    - apt
    - base-files
    - bash
    - ca-certificates
    - coreutils
    - curl
    - datahub-mce-consumer=1.7.0.1-7
    - diffutils
    - dockerize-dev=0.25.4-2
    - dpkg
    - eclipse-temurin-21-jdk
    - eclipse-temurin-21-jdk-oci-config
    - findutils
    - grep
