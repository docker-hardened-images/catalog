  - 1-debian13-dev
  - 1.7-debian-dev
  - 1.7-debian13-dev
  - 1.7.0-debian-dev
  - 1.7.0-debian13-dev
  - 1.7.0.1-7-debian-dev
  - 1.7.0.1-7-debian13-dev
platforms:
