# syntax=dhi.io/build:2-debian13

name: DataHub MCE Consumer 1.x
image: dhi.io/datahub-mce-consumer
variant: runtime
tags:
  - "1"
  - "1.6"
  - 1.6.0
  - 1.6.0.2
  - 1-debian
  - 1-debian13
  - 1.6-debian
  - 1.6-debian13
  - 1.6.0-debian
  - 1.6.0-debian13
  - 1.6.0.2-debian
  - 1.6.0.2-debian13
platforms:
  - linux/amd64
  - linux/arm64
dates:
  release: "2025-10-01"
vars:
  COMMIT_SHA: b707d73c0f527dbd4c237db052a0f9a3b652af15
  DOCKERIZE_COMMIT_SHA: a21f69ff60cdf1b2d54dadb7d04f28c8b6723c19
  DOCKERIZE_VERSION: 0.24.3
  JAVA_FIPS_SUFFIX: ""
  JAVA_VARIANT: jre
  JDK_MAJOR_VERSION: "21"
  JMX_PROMETHEUS_SHA256: 8b67ed40485d475648c36d11d21464b484406f85faf912b3363f71a6a7861320
  JMX_PROMETHEUS_VERSION: 0.20.0
  OTEL_JAVAAGENT_SHA256: 130606aed07f101458fe42b8f453ef3a2536f6bce8a7ae64f222f5688ada2500
  OTEL_JAVAAGENT_VERSION: 2.28.0
  SEMVER_MAJOR_MINOR_VERSION: "1.6"
  SEMVER_MAJOR_VERSION: "1"
  SEMVER_VERSION: 1.6.0.2
  VERSION: 1.6.0.2
  VERSION_MAJOR_MINOR_PATCH: 1.6.0
contents:
  repositories:
    - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
  keyring:
    - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
  packages:
    - '!libelogind0'
    - '!mawk'
    - '!original-awk'
    - base-files
    - bash
    - ca-certificates
    - coreutils
    - curl
    - eclipse-temurin-21-jre
    - eclipse-temurin-21-jre-oci-config
    - libsnappy1v5
    - tzdata
  builds:
    - name: dockerize
      work-dir: /go/src/github.com/powerman/dockerize
      caches:
        - path: /go/pkg/mod
      contents:
        packages:
          - bash
          - ca-certificates-bundle
          - coreutils
          - golang-1.26
          - findutils
          - mawk
          - sed
        files:
          - url: git+https://github.com/powerman/dockerize.git#v0.24.3
            checksum: a21f69ff60cdf1b2d54dadb7d04f28c8b6723c19
            path: /go/src/github.com/powerman/dockerize
            spdx:
              name: dockerize
              version: 0.24.3
              packages:
                - name: dockerize
                  purl: pkg:golang/github.com/powerman/dockerize@0.24.3
                  license: MIT
            uid: 0
            gid: 0
      pipeline:
        - name: bump dockerize go deps for CVE remediation
          uses: go/bump@v2
          with:
            deps:
              - golang.org/x/crypto@v0.55.0
            download: true
        - name: test dockerize after bump
          runs: |
            set -eux -o pipefail

            go test ./...
        - name: build dockerize
          uses: go/build@v1
          with:
            output: ${target.dir}/usr/local/bin/dockerize
            packages: ./
      outputs:
        - source: ${target.dir}/usr/local/bin/dockerize
          target: /usr/local/bin/dockerize
          uid: 0
          gid: 0
          mode: "0755"
        - source: /opt/docker/sbom/dockerize
          target: /opt/docker/sbom/dockerize
          uid: 0
          gid: 0
    - name: datahub-mce-consumer
      work-dir: ${source.dir}/datahub
      caches:
        - path: /root/.gradle
      contents:
        packages:
          - bash
          - ca-certificates
          - coreutils
          - curl
          - findutils
          - git
          - grep
          - gzip
          - sed
          - tar
          - eclipse-temurin-21-jdk
          - gradle-8
        files:
          - url: git+https://github.com/datahub-project/datahub.git#v1.6.0.2
            checksum: b707d73c0f527dbd4c237db052a0f9a3b652af15
            path: ${source.dir}/datahub
            spdx:
              name: datahub
              version: 1.6.0.2
              packages:
                - name: datahub
                  purl: pkg:dhi/datahub-mce-consumer@1.6.0.2
                  license: Apache-2.0
            uid: 0
            gid: 0
      pipeline:
        - name: rewrite upstream lz4-java 1.10.1 pins to 1.11.1
          runs: |
            set -eux -o pipefail

            find . \( -name '*.gradle' -o -name '*.gradle.kts' -o -name 'gradle.lockfile' \) -print0 \
              | xargs -0 sed -i \
                -e 's|at\.yawk\.lz4:lz4-java:1\.10\.1|at.yawk.lz4:lz4-java:1.11.1|g'
        - uses: gradle/mirror@v1
        - name: bump vulnerable dependency versions
          runs: |
            set -eux -o pipefail

            cat >> build.gradle << 'GRADLE'

            allprojects {
                configurations.configureEach {
                    resolutionStrategy {
                        setForcedModules(forcedModules.findAll {
                            !(it.group == 'at.yawk.lz4' && it.name == 'lz4-java')
                        })
                        force 'at.yawk.lz4:lz4-java:1.11.1'
                        eachDependency { details ->
                        def req = details.requested
                        if (req.group == 'io.netty'
                                && req.name.startsWith('netty-')
                                && !req.name.startsWith('netty-tcnative')) {
                            details.useVersion '4.2.17.Final'
                            details.because 'DHI CVE remediation: CVE-2026-59902, CVE-2026-59903, CVE-2026-44249, CVE-2026-44250, CVE-2026-44890, CVE-2026-44891, CVE-2026-44892, CVE-2026-44893, CVE-2026-44894, CVE-2026-45416, CVE-2026-45674, CVE-2026-46340, CVE-2026-47691, CVE-2026-45536, CVE-2026-45673, CVE-2026-47244'
                        }
                        if (req.group == 'org.springframework.kafka'
                                && req.name == 'spring-kafka') {
                            details.useVersion '4.0.6'
                            details.because 'DHI CVE remediation: CVE-2026-41731'
                        }
                        if (req.group == 'com.fasterxml.jackson.core'
                                && req.name == 'jackson-core') {
                            details.useVersion '2.21.5'
                            details.because 'DHI CVE remediation: GHSA-r7wm-3cxj-wff9'
                        }
                        if (req.group == 'com.fasterxml.jackson.core'
                                && req.name == 'jackson-databind') {
                            details.useVersion '2.21.6'
                            details.because 'DHI CVE remediation: CVE-2026-54512, CVE-2026-54513, CVE-2026-54514, CVE-2026-54515, CVE-2026-54516, CVE-2026-54517, CVE-2026-54518, CVE-2026-59889, CVE-2026-68497, GHSA-mhm7-754m-9p8w'
                        }
                        if (req.group == 'tools.jackson.core'
                                && req.name == 'jackson-databind') {
                            details.useVersion '3.1.4'
                            details.because 'DHI CVE remediation: CVE-2026-54512, CVE-2026-54513, CVE-2026-54514, CVE-2026-54515, CVE-2026-54516, CVE-2026-54517, CVE-2026-54518, CVE-2026-59889, GHSA-mhm7-754m-9p8w'
                        }
                        if (req.group == 'tools.jackson.core'
                                && req.name == 'jackson-core') {
                            details.useVersion '3.1.4'
                            details.because 'DHI CVE remediation: GHSA-r7wm-3cxj-wff9'
                        }
                        if (req.group == 'org.postgresql'
                                && req.name == 'postgresql') {
                            details.useVersion '42.7.12'
                            details.because 'DHI CVE remediation: CVE-2026-54291'
                        }
                        if (req.group == 'org.eclipse.jetty'
                                && req.name.startsWith('jetty-')) {
                            details.useVersion '12.1.10'
                            details.because 'DHI CVE remediation: CVE-2026-10050, CVE-2026-5795'
                        }
                        if (req.group == 'ch.qos.logback'
                                && req.name.startsWith('logback-')) {
                            details.useVersion '1.5.35'
                            details.because 'DHI CVE remediation: CVE-2026-9828, CVE-2026-10532'
                        }
                        if (req.group == 'org.springframework'
                                && req.name == 'spring-webmvc') {
                            details.useVersion '7.0.8'
                            details.because 'DHI CVE remediation: CVE-2026-41842, CVE-2026-41845, CVE-2026-41841, CVE-2026-41843, CVE-2026-41844, CVE-2026-41846, CVE-2026-41853'
                        }
                        if ((req.group == 'org.lz4' || req.group == 'at.yawk.lz4')
                                && req.name == 'lz4-java') {
                            details.useTarget 'at.yawk.lz4:lz4-java:1.11.1'
                            details.because 'DHI CVE remediation: CVE-2026-59949'
                        }
                        if (req.group == 'io.micrometer'
                                && req.name.startsWith('micrometer-')
                                && !req.name.startsWith('micrometer-tracing')) {
                            details.useVersion '1.16.6'
                            details.because 'DHI CVE remediation: CVE-2026-40983, CVE-2026-40984'
                        }
                        if (req.group == 'org.apache.httpcomponents.core5'
                                && req.name.startsWith('httpcore5')) {
                            details.useVersion '5.4.3'
                            details.because 'DHI CVE remediation: CVE-2026-54399, CVE-2026-54428'
                        }
                        if (req.group == 'org.apache.httpcomponents.client5'
                                && req.name == 'httpclient5') {
                            details.useVersion '5.6.3'
                            details.because 'DHI CVE remediation: CVE-2026-64607'
                        }
                        if (req.group == 'org.apache.logging.log4j'
                                && req.name.startsWith('log4j-')) {
                            details.useVersion '2.25.5'
                            details.because 'DHI CVE remediation: CVE-2026-49844'
                        }
                        }
                    }
                }
            }
            GRADLE
        - name: build jar
          privileged: true
          secrets:
            - id: maven_user
              env: MAVEN_USER
              optional: true
            - id: maven_password
              env: MAVEN_PASSWORD
              optional: true
          runs: |
            set -eux -o pipefail

            export GRADLE_HOME="/usr/share/java/gradle"
            export JAVA_HOME="/usr/lib/jvm/temurin-21"
            export PATH="${GRADLE_HOME}/bin:${JAVA_HOME}/bin:${PATH}"

            find . -name 'gradle.lockfile' -delete || true

            ./gradlew --init-script ${source.dir}/files/init.gradle \
              :metadata-jobs:mce-consumer-job:assemble \
              -x test \
              --parallel --max-workers=4 \
              --update-locks 'com.fasterxml.jackson.core:*,com.fasterxml.jackson.dataformat:*,org.apache.zookeeper:*,org.eclipse.jetty:*,org.postgresql:*,org.springframework.boot:*,org.springframework:*,org.springframework.kafka:*,io.netty:*,io.airlift:*,org.apache.logging.log4j:*,org.apache.commons:*,org.apache.avro:*,com.sun.mail:*,ch.qos.logback:*,at.yawk.lz4:*,io.micrometer:*,org.apache.httpcomponents.core5:*,org.apache.httpcomponents.client5:*' \
              --no-daemon --console=plain
        - name: stage runtime files
          runs: |
            set -eux -o pipefail

            mkdir -p "${target.dir}/datahub/datahub-mce-consumer/bin"
            mkdir -p "${target.dir}/datahub/datahub-mce-consumer/scripts"
            mkdir -p "${target.dir}/datahub/datahub-mce-consumer/resources"
            mkdir -p "${target.dir}/datahub/datahub-mce-consumer/lib"

            cp metadata-jobs/mce-consumer-job/build/libs/mce-consumer-job.jar \
              "${target.dir}/datahub/datahub-mce-consumer/bin/mce-consumer-job.jar"
            cp metadata-models/src/main/resources/entity-registry.yml \
              "${target.dir}/datahub/datahub-mce-consumer/resources/entity-registry.yml"
            cp docker/monitoring/client-prometheus-config.yaml \
              "${target.dir}/datahub/datahub-mce-consumer/scripts/prometheus-config.yaml"

            cp "${source.dir}/files/start.sh" \
              "${target.dir}/datahub/datahub-mce-consumer/scripts/start.sh"
            chmod 0755 "${target.dir}/datahub/datahub-mce-consumer/scripts/start.sh"
        - name: fetch otel javaagent
          privileged: true
          runs: |
            set -eux -o pipefail

            curl -fsSL -o /tmp/opentelemetry-javaagent.jar \
              "https://github.com/open-telemetry/opentelemetry-java-instrumentation/releases/download/v2.28.0/opentelemetry-javaagent.jar"
            echo "130606aed07f101458fe42b8f453ef3a2536f6bce8a7ae64f222f5688ada2500  /tmp/opentelemetry-javaagent.jar" | sha256sum -c -
            mv /tmp/opentelemetry-javaagent.jar \
              "${target.dir}/datahub/datahub-mce-consumer/lib/opentelemetry-javaagent.jar"
        - name: fetch jmx prometheus javaagent
          privileged: true
          runs: |
            set -eux -o pipefail

            curl -fsSL -o /tmp/jmx_prometheus_javaagent.jar \
              "https://maven-central.storage-download.googleapis.com/maven2/io/prometheus/jmx/jmx_prometheus_javaagent/0.20.0/jmx_prometheus_javaagent-0.20.0.jar"
            echo "8b67ed40485d475648c36d11d21464b484406f85faf912b3363f71a6a7861320  /tmp/jmx_prometheus_javaagent.jar" | sha256sum -c -
            mv /tmp/jmx_prometheus_javaagent.jar \
              "${target.dir}/datahub/datahub-mce-consumer/lib/jmx_prometheus_javaagent.jar"
      paths:
        - type: file
          path: ${source.dir}/files/start.sh
          uid: 0
          gid: 0
          source: image/datahub-mce-consumer/files/start.sh
        - type: file
          path: ${source.dir}/files/init.gradle
          uid: 0
          gid: 0
          source: image/datahub-mce-consumer/files/init.gradle
      outputs:
        - source: ${target.dir}/datahub/datahub-mce-consumer
          target: /datahub/datahub-mce-consumer
          uid: 0
          gid: 0
        - source: /opt/docker/sbom/datahub
          target: /opt/docker/sbom/datahub
          uid: 0
          gid: 0
accounts:
  run-as: nonroot
  users:
    - name: nonroot
      uid: 65532
      gid: 65532
  groups:
    - name: nonroot
      gid: 65532
      members:
        - nonroot
os-release:
  name: Docker Hardened Images (Debian)
  id: debian
  version-id: "13"
  version-codename: trixie
  pretty-name: Docker Hardened Images/Debian GNU/Linux 13 (trixie)
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
environment:
  JAVA_OPTS: ""
  JMX_OPTS: ""
  LD_LIBRARY_PATH: /lib:/lib64
  OTEL_EXPORTER_OTLP_HTTP_COMPRESSION: gzip
  OTEL_EXPORTER_OTLP_HTTP_HTTP2_MAX_FRAME_SIZE: "8388608"
  OTEL_EXPORTER_OTLP_MAX_PAYLOAD_SIZE: "4194304"
  OTEL_EXPORTER_OTLP_TRACES_COMPRESSION: gzip
paths:
  - type: directory
    path: /datahub
    uid: 65532
    gid: 65532
    mode: "0750"
  - type: directory
    path: /datahub/datahub-mce-consumer
    uid: 65532
    gid: 65532
    mode: "0750"
annotations:
  org.opencontainers.image.description: DataHub Metadata Change Event (MCE) Consumer - the Kafka consumer that processes MetadataChangeProposal events from upstream sources and applies them to DataHub's metadata storage layer.
  org.opencontainers.image.licenses: Apache-2.0
entrypoint:
  - /datahub/datahub-mce-consumer/scripts/start.sh
ports:
  - 9090/tcp
