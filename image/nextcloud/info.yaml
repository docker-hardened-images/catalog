metadata:
  display-name: Nextcloud
  short-description: Self-hosted content collaboration platform for file sync, sharing, and groupware.
  featured: false
  home-url: https://nextcloud.com/
  categories:
    - content-management-system
  included-tools:
    - name: nextcloud
      description: Nextcloud server application files.
    - name: php
      description: PHP runtime used to execute Nextcloud code.
    - name: php-fpm
      description: PHP FastCGI Process Manager that serves Nextcloud to an upstream web server.
    - name: occ
      description: Nextcloud command line management tool.
    - name: imagemagick
      description: Image processing tools used by Nextcloud for previews and thumbnails.
