      pipeline:
        - name: verify php source GPG
          uses: gpg/verify@v1
          with:
            file: ${source.dir}/php-8.5.11.tar.xz
            keys: ${source.dir}/php-keyring.asc
            signature: ${source.dir}/php-8.5.11.tar.xz.asc
        - name: extract php source
          runs: |
            set -eux -o pipefail

            PHP_SRC_DIR="${source.dir}/php-src"
            mkdir -p "$PHP_SRC_DIR"
            tar xf "${source.dir}/php-8.5.11.tar.xz" -C "${source.dir}"
            cp -a "${source.dir}/php-8.5.11/." "$PHP_SRC_DIR"
        - name: build imagemagick
          runs: |
            set -eux -o pipefail

            cd "${source.dir}/imagemagick"
            ./configure \
              --prefix=/opt/imagemagick \
              --disable-static \
              --enable-shared \
              --with-modules \
              --with-quantum-depth=16 \
              --with-webp \
              --with-heic \
              --with-openjp2 \
              --without-magick-plus-plus \
              --without-perl \
              --disable-docs \
              --disable-opencl

            make -j$(nproc)
            make install

            mkdir -p ${target.dir}/opt
            cp -a /opt/imagemagick ${target.dir}/opt/

            find ${target.dir}/opt/imagemagick -type f -name "*.so*" -exec strip --strip-unneeded {} \; || true
        - name: build bundled extensions
          runs: |
            set -eux -o pipefail

            build_ext() {
              local ext=$1
              shift
              cd "${source.dir}/php-src/ext/$ext"
              phpize
              ./configure "$@"
              make -j$(nproc)
              make install
            }

            build_ext gd --with-freetype --with-jpeg --with-webp
            build_ext zip
            build_ext exif
            build_ext bcmath
            build_ext ftp --with-ftp-ssl
            build_ext gmp
            build_ext ldap
            build_ext pcntl
            build_ext pdo_mysql
            build_ext pdo_pgsql
            build_ext sysvsem
        - name: build pecl extensions
          runs: |
            set -eux -o pipefail

            build_pecl() {
              local name=$1
              shift
              local dir="${source.dir}/pecl/$name"
              mkdir -p "$dir"
              tar xf "${source.dir}/${name}.tgz" -C "$dir" --strip-components=1
              cd "$dir"
              phpize
              ./configure "$@"
              make -j$(nproc)
              make install
            }

            build_pecl igbinary
            build_pecl apcu
            build_pecl memcached --enable-memcached-igbinary
            build_pecl redis --enable-redis-igbinary
        - name: build imagick
          runs: |
            set -eux -o pipefail

            export PKG_CONFIG_PATH=/opt/imagemagick/lib/pkgconfig
            export CFLAGS="-I/opt/imagemagick/include/ImageMagick-7"
            export LDFLAGS="-L/opt/imagemagick/lib"

            mkdir -p "${source.dir}/pecl/imagick"
            tar xf "${source.dir}/imagick.tgz" -C "${source.dir}/pecl/imagick" --strip-components=1
            cd "${source.dir}/pecl/imagick"
            phpize
            ./configure --with-imagick=/opt/imagemagick
            make -j$(nproc)
            make install
      paths:
        - type: file
          path: ${source.dir}/php-keyring.asc
          uid: 0
          gid: 0
          source: image/nextcloud/key/php8.5.keyring.asc
      outputs:
        - source: /usr/lib/php/extensions
          target: /usr/lib/php/extensions
          uid: 0
          gid: 0
        - source: ${target.dir}/opt/imagemagick
          target: /opt/imagemagick
          uid: 0
          gid: 0
        - source: /opt/docker/sbom/imagemagick
          target: /opt/docker/sbom/imagemagick
          uid: 0
          gid: 0
        - source: /opt/docker/sbom/imagick
