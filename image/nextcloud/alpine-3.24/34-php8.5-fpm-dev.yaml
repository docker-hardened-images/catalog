  builds:
    - name: activate php-fpm config
      shell: bash
      contents:
        packages:
          - bash
          - coreutils
          - php-8.5=8.5.11-r0
          - php-8.5-fpm=8.5.11-r0
          - sed
      pipeline:
        - name: activate
          runs: |
            set -eux -o pipefail

            conf="/etc/php-8.5"
            install -d "${target.dir}${conf}/php-fpm.d"

            install -m644 "${conf}/php-fpm.conf.default" \
              "${target.dir}${conf}/php-fpm.conf"
            sed -ri \
              -e 's|^;?\s*daemonize\s*=.*|daemonize = no|' \
              -e 's|^;?\s*error_log\s*=.*|error_log = /proc/self/fd/2|' \
              "${target.dir}${conf}/php-fpm.conf"

            install -m644 "${conf}/php-fpm.d/www.conf.default" \
              "${target.dir}${conf}/php-fpm.d/www.conf"
            sed -ri \
              -e 's|^;?\s*listen\s*=.*|listen = 9000|' \
              -e 's|^;?\s*access\.log\s*=.*|access.log = /proc/self/fd/2|' \
              -e 's|^;?\s*catch_workers_output\s*=.*|catch_workers_output = yes|' \
              -e 's|^;?\s*decorate_workers_output\s*=.*|decorate_workers_output = no|' \
              -e 's|^;?\s*clear_env\s*=.*|clear_env = no|' \
              "${target.dir}${conf}/php-fpm.d/www.conf"
      outputs:
        - source: ${target.dir}/etc/php-8.5/php-fpm.conf
          target: /etc/php-8.5/php-fpm.conf
          uid: 0
          gid: 0
        - source: ${target.dir}/etc/php-8.5/php-fpm.d/www.conf
          target: /etc/php-8.5/php-fpm.d/www.conf
          uid: 0
          gid: 0
