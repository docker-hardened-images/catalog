          - url: https://pecl.php.net/get/apcu-5.1.28.tgz
            checksum: sha256:ca9c1820810a168786f8048a4c3f8c9e3fd941407ad1553259fb2e30b5f057bf
            path: ${source.dir}/apcu.tgz
