          - url: git+https://github.com/ImageMagick/ImageMagick.git#7.1.2-32
            checksum: ad98b244c995d2e3051757fa3b7855f45b550d24
            path: ${source.dir}/imagemagick
            spdx:
              name: imagemagick
              version: 7.1.2-32
              packages:
                - name: imagemagick
                  purl: pkg:dhi/imagemagick/imagemagick@7.1.2-32
                  license: ImageMagick
            uid: 0
            gid: 0
          - url: https://pecl.php.net/get/imagick-3.8.1.tgz
            checksum: sha256:3a3587c0a524c17d0dad9673a160b90cd776e836838474e173b549ed864352ee
            path: ${source.dir}/imagick.tgz
            spdx:
