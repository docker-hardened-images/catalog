# syntax=dhi.io/build:2-debian13

name: Rclone 1.x (dev)
image: dhi.io/rclone
variant: dev
tags:
  - 1-dev
  - 1.75-dev
  - 1.75.2-dev
  - 1-debian-dev
  - 1-debian13-dev
  - 1.75-debian-dev
  - 1.75-debian13-dev
  - 1.75.2-debian-dev
  - 1.75.2-debian13-dev
platforms:
  - linux/amd64
  - linux/arm64
dates:
  release: "2014-07-03"
vars:
  FLAVORED_SUFFIX: -dev
  SEMVER_MAJOR_MINOR_VERSION: "1.75"
  SEMVER_MAJOR_VERSION: "1"
  SEMVER_VERSION: 1.75.2
  SUFFIX: -dev
  VERSION: 1.75.2-2
contents:
  repositories:
    - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
  keyring:
    - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
  packages:
    - '!gawk'
    - '!libelogind0'
    - '!original-awk'
    - apt
    - base-files
    - bash
    - ca-certificates
    - ca-certificates-bundle
    - coreutils
    - diffutils
    - dpkg
    - findutils
    - grep
    - libc-bin
    - mawk
    - media-types
    - perl-base
    - rclone-1-dev=1.75.2-2
    - sed
    - tzdata
    - util-linux
accounts:
  root: true
  run-as: root
  users:
    - name: nonroot
      uid: 65532
      gid: 65532
    - name: _apt
      uid: 42
      gid: 65532
  groups:
    - name: nonroot
      gid: 65532
      members:
        - nonroot
os-release:
  name: Docker Hardened Images (Debian)
  id: debian
  version-id: "13"
  version-codename: trixie
  pretty-name: Docker Hardened Images/Debian GNU/Linux 13 (trixie)
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
work-dir: /data
environment:
  DEBIAN_FRONTEND: noninteractive
  XDG_CONFIG_HOME: /config
paths:
  - type: directory
    path: /usr/local/bin
    uid: 0
    gid: 0
  - type: symlink
    path: /usr/local/bin/rclone
    uid: 0
    gid: 0
    source: /usr/bin/rclone
  - type: directory
    path: /home/nonroot
    uid: 65532
    gid: 65532
    mode: "0700"
  - type: directory
    path: /config
    uid: 65532
    gid: 65532
    mode: "0755"
  - type: directory
    path: /config/rclone
    uid: 65532
    gid: 65532
    mode: "0755"
  - type: directory
    path: /data
    uid: 65532
    gid: 65532
    mode: "0755"
annotations:
  org.opencontainers.image.description: A minimal rclone image
  org.opencontainers.image.licenses: MIT
entrypoint:
  - /usr/local/bin/rclone
