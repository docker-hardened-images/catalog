# syntax=dhi.io/build:2-debian13

name: HAProxy 2.6.x
image: dhi.io/haproxy
variant: runtime
tags:
  - "2.6"
  - 2.6.35
  - 2.6-debian
  - 2.6-debian13
  - 2.6.35-debian
  - 2.6.35-debian13
platforms:
  - linux/amd64
  - linux/arm64
dates:
  release: "2022-05-31"
  end-of-life: "2027-04-01"
vars:
  HAPROXY_ENTRYPOINT: haproxy
  HAPROXY_PACKAGE: haproxy-2.6
  HAPROXY_PACKAGE_SUFFIX: ""
  SEMVER_MAJOR_MINOR_VERSION: "2.6"
  SEMVER_MAJOR_VERSION: "2"
  SEMVER_VERSION: 2.6.35
  VERSION: 2.6.35-1
contents:
  repositories:
    - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
  keyring:
    - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
  packages:
    - '!libelogind0'
    - '!mawk'
    - '!original-awk'
    - base-files
    - ca-certificates-bundle
    - gcc-14-base
    - haproxy-2.6=2.6.35-1
    - libc6
    - libcrypt1
    - libgcc-s1
    - liblua5.4-0
    - libpcre2-8-0
    - libssl3t64
    - tzdata
accounts:
  run-as: nonroot
  users:
    - name: nonroot
      uid: 65532
      gid: 65532
  groups:
    - name: nonroot
      gid: 65532
      members:
        - nonroot
os-release:
  name: Docker Hardened Images (Debian)
  id: debian
  version-id: "13"
  version-codename: trixie
  pretty-name: Docker Hardened Images/Debian GNU/Linux 13 (trixie)
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
environment:
  HAPROXY_VERSION: 2.6.35
  PATH: /opt/haproxy/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
paths:
  - type: directory
    path: /opt/haproxy/bin
    uid: 0
    gid: 0
  - type: symlink
    path: /opt/haproxy/bin/haproxy
    uid: 0
    gid: 0
    source: /usr/sbin/haproxy
annotations:
  org.opencontainers.image.description: A minimal HAProxy image
  org.opencontainers.image.licenses: GPL-2.0-only
entrypoint:
  - haproxy
