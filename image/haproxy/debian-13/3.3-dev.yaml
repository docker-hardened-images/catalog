# syntax=dhi.io/build:2-debian13

name: HAProxy 3.3.x (dev)
image: dhi.io/haproxy
variant: dev
tags:
  - 3.3-dev
  - 3.3.17-dev
  - 3.3-debian-dev
  - 3.3-debian13-dev
  - 3.3.17-debian-dev
  - 3.3.17-debian13-dev
platforms:
  - linux/amd64
  - linux/arm64
dates:
  release: "2025-11-26"
  end-of-life: "2027-01-01"
vars:
  HAPROXY_ENTRYPOINT: entrypoint.sh
  HAPROXY_PACKAGE: haproxy-3.3
  HAPROXY_PACKAGE_SUFFIX: ""
  SEMVER_MAJOR_MINOR_VERSION: "3.3"
  SEMVER_MAJOR_VERSION: "3"
  SEMVER_VERSION: 3.3.17
  VERSION: 3.3.17-1
contents:
  repositories:
    - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
  keyring:
    - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
  packages:
    - '!gawk'
    - '!libelogind0'
    - '!mawk'
    - '!original-awk'
    - apt
    - base-files
    - bash
    - ca-certificates
    - ca-certificates-bundle
    - coreutils
    - diffutils
    - dpkg
    - findutils
    - gawk
    - gcc-14-base
    - grep
    - haproxy-3.3=3.3.17-1
    - libc-bin
    - libc6
    - libcrypt1
    - libgcc-s1
    - liblua5.4-0
    - libpcre2-8-0
    - libssl3t64
    - mawk
    - perl-base
    - sed
    - tzdata
    - util-linux
accounts:
  root: true
  run-as: root
  users:
    - name: nonroot
      uid: 65532
      gid: 65532
    - name: _apt
      uid: 42
      gid: 65532
  groups:
    - name: nonroot
      gid: 65532
      members:
        - nonroot
os-release:
  name: Docker Hardened Images (Debian)
  id: debian
  version-id: "13"
  version-codename: trixie
  pretty-name: Docker Hardened Images/Debian GNU/Linux 13 (trixie)
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
environment:
  DEBIAN_FRONTEND: noninteractive
  HAPROXY_VERSION: 3.3.17
  PATH: /opt/haproxy/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
paths:
  - type: directory
    path: /opt/haproxy/bin
    uid: 0
    gid: 0
  - type: symlink
    path: /opt/haproxy/bin/haproxy
    uid: 0
    gid: 0
    source: /usr/sbin/haproxy
  - type: file
    path: /usr/local/bin/entrypoint.sh
    uid: 0
    gid: 0
    mode: "0755"
    source: image/haproxy/bin/entrypoint.sh
annotations:
  org.opencontainers.image.description: A minimal HAProxy image
  org.opencontainers.image.licenses: GPL-2.0-only
entrypoint:
  - entrypoint.sh
cmd:
  - haproxy
  - -f
  - /usr/local/etc/haproxy/haproxy.cfg
