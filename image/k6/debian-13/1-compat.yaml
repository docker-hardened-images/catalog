# syntax=dhi.io/build:2-debian13

name: Grafana k6 1.x (compat)
image: dhi.io/k6
variant: runtime
flavor: compat
tags:
  - 1-compat
  - 1.8-compat
  - 1.8.1-compat
  - 1-debian-compat
  - 1-debian13-compat
  - 1.8-debian-compat
  - 1.8-debian13-compat
  - 1.8.1-debian-compat
  - 1.8.1-debian13-compat
platforms:
  - linux/amd64
  - linux/arm64
vars:
  FLAVORED_SUFFIX: -compat
  SEMVER_MAJOR_MINOR_VERSION: "1.8"
  SEMVER_MAJOR_VERSION: "1"
  SEMVER_VERSION: 1.8.1
  SUFFIX: ""
  VERSION: 1.8.1-2
contents:
  repositories:
    - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
  keyring:
    - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
  packages:
    - base-files
    - ca-certificates-bundle
    - coreutils
    - dash
    - grep
    - k6-1=1.8.1-2
    - tzdata
accounts:
  run-as: nonroot
  users:
    - name: nonroot
      uid: 65532
      gid: 65532
  groups:
    - name: nonroot
      gid: 65532
      members:
        - nonroot
os-release:
  name: Docker Hardened Images (Debian)
  id: debian
  version-id: "13"
  version-codename: trixie
  pretty-name: Docker Hardened Images/Debian GNU/Linux 13 (trixie)
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
paths:
  - type: directory
    path: /usr/local/bin
    uid: 0
    gid: 0
  - type: symlink
    path: /usr/local/bin/k6
    uid: 0
    gid: 0
    source: /usr/bin/k6
annotations:
  org.opencontainers.image.description: A minimal Grafana k6 image
  org.opencontainers.image.licenses: AGPL-3.0
entrypoint:
  - /usr/local/bin/k6
