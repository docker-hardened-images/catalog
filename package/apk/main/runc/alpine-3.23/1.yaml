# syntax=dhi.io/build:2-alpine3.23

image: dhi.io/pkg-runc
variant: runtime
tags:
  - 1.5.2-alpine3.23
  - 1.5.2-r6-alpine3.23
platforms:
  - linux/amd64
  - linux/arm64
vars:
  _REL: "1"
  COMMIT_SHA: 85eb4891a904ee56a9eb5f0280e7472413c89446
  GOLANG_VERSION: 1.26.10-r0
  PACKAGE_NAME: community/runc
  REL: "6"
  SEMVER_MAJOR_MINOR_VERSION: "1.5"
  SEMVER_MAJOR_VERSION: "1"
  SEMVER_VERSION: 1.5.2
  VERSION: 1.5.2
contents:
  repositories:
    - https://dl-cdn.alpinelinux.org/alpine/edge/community
    - https://dhi.io/apk/alpine/v3.23/main
    - https://dl-cdn.alpinelinux.org/alpine/v3.23/main
    - https://dl-cdn.alpinelinux.org/alpine/v3.23/community
  keyring:
    - https://dhi.io/keyring/dhi-apk@docker-0F81AD7700D99184.rsa.pub
  packages:
    - alpine-baselayout-data
  builds:
    - name: abuild
      work-dir: ${source.dir}/aports/community/runc
      contents:
        repositories:
          - https://dl-cdn.alpinelinux.org/alpine/edge/community
          - https://dhi.io/apk/alpine/v3.23/main
          - https://dl-cdn.alpinelinux.org/alpine/v3.23/main
          - https://dl-cdn.alpinelinux.org/alpine/v3.23/community
        packages:
          - bash
          - golang-1.26=1.26.10-r0
          - golang-1.26-oci-config=1.26.10-r0
          - go-md2man
          - libpathrs-dev
          - libseccomp-dev
          - libtool
        files:
          - url: git+https://github.com/alpinelinux/aports.git#85eb4891a904ee56a9eb5f0280e7472413c89446
            path: ${source.dir}/aports
            uid: 0
            gid: 0
          - url: https://github.com/opencontainers/runc/archive/v1.5.2/runc-1.5.2.tar.gz
            path: /var/cache/distfiles/runc-1.5.2.tar.gz
            uid: 0
            gid: 0
      pipeline:
        - uses: abuild/setup@v1
        - uses: abuild/bump@v1
          with:
            rel: 6
        - name: patch go dependencies
          runs: |
            set -eux -o pipefail

            # Go writes the sumdb cache under GOPATH/pkg/sumdb during `go get`.
            # The abuild user cannot create directories there, so pre-create
            # and chmod it here (this runs as root, before abuild drops privs).
            install -d -m 0777 "$(go env GOPATH)/pkg/sumdb/sum.golang.org"

            # Inject prepare() to bump vendored Go modules for open CVEs.
            # $builddir below is an abuild-runtime variable; written literally to APKBUILD.
            # shellcheck disable=SC2154
            cat >> APKBUILD << 'EOF'

            prepare() {
                default_prepare
                cd "$builddir"
                go get golang.org/x/net@v0.62.0
                go get github.com/moby/sys/user@v0.4.1
                go get github.com/cilium/ebpf@v0.22.0
                go mod tidy
                go mod vendor
            }
            EOF
        - uses: abuild/build@v1
          privileged: true
os-release:
  name: Docker Hardened Images (Alpine)
  id: alpine
  version-id: "3.23"
  pretty-name: Docker Hardened Images/Alpine Linux v3.23
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
