# syntax=dhi.io/build:2-alpine3.23

image: dhi.io/pkg-gdk-pixbuf
variant: runtime
tags:
  - 2.44.4-alpine3.23
  - 2.44.4-r1-alpine3.23
platforms:
  - linux/amd64
  - linux/arm64
vars:
  _REL: "0"
  COMMIT_SHA: c704d7d842c18bc05dfe5e308fb562ba59e9f065
  PACKAGE_NAME: main/gdk-pixbuf
  REL: "1"
  SEMVER_MAJOR_MINOR_VERSION: "2.44"
  SEMVER_MAJOR_VERSION: "2"
  SEMVER_VERSION: 2.44.4
  VERSION: 2.44.4
contents:
  repositories:
    - https://dhi.io/apk/alpine/v3.23/main
    - https://dl-cdn.alpinelinux.org/alpine/v3.23/main
    - https://dl-cdn.alpinelinux.org/alpine/v3.23/community
  keyring:
    - https://dhi.io/keyring/dhi-apk@docker-0F81AD7700D99184.rsa.pub
  packages:
    - alpine-baselayout-data
  builds:
    - name: abuild
      work-dir: ${source.dir}/aports/main/gdk-pixbuf
      contents:
        packages:
          - shared-mime-info
          - glib-dev
          - gobject-introspection-dev
          - libjpeg-turbo-dev
          - libpng-dev
          - meson
          - py3-docutils
          - samurai
          - tiff-dev
        files:
          - url: git+https://github.com/alpinelinux/aports.git#c704d7d842c18bc05dfe5e308fb562ba59e9f065
            path: ${source.dir}/aports
            uid: 0
            gid: 0
          - url: https://download.gnome.org/sources/gdk-pixbuf/2.44/gdk-pixbuf-2.44.4.tar.xz
            path: /var/cache/distfiles/gdk-pixbuf-2.44.4.tar.xz
            uid: 0
            gid: 0
      pipeline:
        - uses: abuild/setup@v1
        - uses: abuild/disable@v1
          with:
            function: check
        - name: expand APKBUILD source list for patches
          runs: |
            set -eux -o pipefail

            if grep -qE '^source=".*"$' APKBUILD; then
              sed -i 's|^source="\(.*\)"$|source="\1|' APKBUILD
              sed -i '/^source="/a "' APKBUILD
            fi
        - uses: abuild/source@v1
          with:
            source: dhi-cve-2026-5201-reject-unsupported-components.patch
        - runs: |
            set -eux -o pipefail

            grep -q 'dhi-cve-2026-5201-reject-unsupported-components.patch' APKBUILD \
              || {
                echo "ERROR: CVE-2026-5201 patch not registered in APKBUILD source="
                exit 1
              }
        - uses: abuild/bump@v1
          with:
            rel: 1
        - uses: abuild/build@v1
      paths:
        - type: file
          path: ${source.dir}/aports/main/gdk-pixbuf/dhi-cve-2026-5201-reject-unsupported-components.patch
          uid: 0
          gid: 0
          mode: "644"
          source: package/apk/main/gdk-pixbuf/patch/dhi-cve-2026-5201-reject-unsupported-components.patch
os-release:
  name: Docker Hardened Images (Alpine)
  id: alpine
