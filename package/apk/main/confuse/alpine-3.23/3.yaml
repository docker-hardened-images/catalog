# syntax=dhi.io/build:2-alpine3.23

image: dhi.io/pkg-confuse
variant: runtime
tags:
  - 3.3-alpine3.23
  - 3.3-r5-alpine3.23
platforms:
  - linux/amd64
  - linux/arm64
vars:
  _REL: "4"
  COMMIT_SHA: fc95c59998285564fbcb0bfb2443898c62e10171
  DHI_TEST_APK_PACKAGES: confuse-3.3-r5
  PACKAGE_NAME: main/confuse
  REL: "5"
  SEMVER_MAJOR_MINOR_VERSION: "3.3"
  SEMVER_MAJOR_VERSION: "3"
  SEMVER_VERSION: "3.3"
  VERSION: "3.3"
contents:
  repositories:
    - https://dhi.io/apk/alpine/v3.23/main
    - https://dl-cdn.alpinelinux.org/alpine/v3.23/main
    - https://dl-cdn.alpinelinux.org/alpine/v3.23/community
  keyring:
    - https://dhi.io/keyring/dhi-apk@docker-0F81AD7700D99184.rsa.pub
  packages:
    - alpine-baselayout-data
  builds:
    - name: abuild
      work-dir: ${source.dir}/aports/main/confuse
      contents:
        packages:
          - flex
          - bison
        files:
          - url: git+https://github.com/alpinelinux/aports.git#fc95c59998285564fbcb0bfb2443898c62e10171
            path: ${source.dir}/aports
            uid: 0
            gid: 0
          - url: https://github.com/libconfuse/libconfuse/releases/download/v3.3/confuse-3.3.tar.xz
            path: /var/cache/distfiles/confuse-3.3.tar.xz
            uid: 0
            gid: 0
      pipeline:
        - uses: abuild/setup@v1
        - runs: |
            set -eux -o pipefail

            perl -i -pe 's/^source="([^"]+)"$/source="$1\n"/' APKBUILD
        - uses: abuild/source@v1
          with:
            source: dhi-cve-2022-40320-unterminated-username.patch
        - name: verify CVE-2022-40320 patch registered in APKBUILD
          runs: |
            set -eux -o pipefail

            patch=dhi-cve-2022-40320-unterminated-username.patch
            grep -Fq "${patch}" APKBUILD \
              || {
                echo "ERROR: ${patch} not registered in APKBUILD source="
                exit 1
              }
        - uses: abuild/build@v1
          with:
            command: checksum
        - uses: abuild/bump@v1
          with:
            rel: 5
            version: 3.3
        - uses: abuild/build@v1
      paths:
        - type: file
          path: ${source.dir}/aports/main/confuse/dhi-cve-2022-40320-unterminated-username.patch
          uid: 0
          gid: 0
          mode: "644"
          source: package/apk/main/confuse/patch/dhi-cve-2022-40320-unterminated-username.patch
os-release:
  name: Docker Hardened Images (Alpine)
  id: alpine
  version-id: "3.23"
  pretty-name: Docker Hardened Images/Alpine Linux v3.23
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
