# syntax=dhi.io/build:2-alpine3.23

image: dhi.io/pkg-docker
variant: runtime
tags:
  - 29.9.2-alpine3.24
  - 29.9.2-r2-alpine3.24
platforms:
  - linux/amd64
  - linux/arm64
vars:
  _REL: "1"
  COMMIT_SHA: 85eb4891a904ee56a9eb5f0280e7472413c89446
  GOLANG_VERSION: 1.26.10-r0
  PACKAGE_NAME: community/docker
  REL: "2"
  SEMVER_MAJOR_MINOR_VERSION: "29.9"
  SEMVER_MAJOR_VERSION: "29"
  SEMVER_VERSION: 29.9.2
  VERSION: 29.9.2
contents:
  repositories:
    - https://dhi.io/apk/alpine/v3.24/main
    - https://dhi.io/apk/alpine/v3.23/main
    - https://dl-cdn.alpinelinux.org/alpine/v3.24/main
    - https://dl-cdn.alpinelinux.org/alpine/v3.24/community
  keyring:
    - https://dhi.io/keyring/dhi-apk@docker-0F81AD7700D99184.rsa.pub
  packages:
    - alpine-baselayout-data
  builds:
    - name: abuild
      work-dir: ${source.dir}/aports/community/docker
      contents:
        packages:
          - golang-1.26=1.26.10-r0
          - golang-1.26-oci-config=1.26.10-r0
          - btrfs-progs-dev
          - bash
          - linux-headers
          - coreutils
          - lvm2-dev
          - libtool
          - libseccomp-dev
          - ca-certificates
          - containerd
          - iptables
          - tini-static
          - log_proxy
          - nftables-dev
        files:
          - url: git+https://github.com/alpinelinux/aports.git#85eb4891a904ee56a9eb5f0280e7472413c89446
            path: ${source.dir}/aports
            uid: 0
            gid: 0
          - url: https://github.com/docker/cli/archive/v29.9.2.tar.gz
            path: /var/cache/distfiles/cli-29.9.2.tar.gz
            uid: 0
            gid: 0
          - url: https://github.com/moby/moby/archive/refs/tags/docker-v29.9.2.tar.gz
            path: /var/cache/distfiles/moby-29.9.2.tar.gz
            uid: 0
            gid: 0
      pipeline:
        - uses: abuild/setup@v1
        - runs: |
            set -eux -o pipefail

            sed -i '/^source=/,/^\t"$/s/^\t"$/"/' APKBUILD
        - uses: abuild/source@v1
          with:
            source: dhi-cve-2026-85747-distribution-blob-digest.patch
        - uses: abuild/bump@v1
          with:
            rel: 2
        - name: unpack docker sources
          uses: abuild/build@v1
          with:
            command: unpack
        - name: update docker engine go dependencies
          uses: go/bump@v2
          work-dir: ${source.dir}/aports/community/docker/src/moby-docker-v29.9.2
          with:
            deps:
              - github.com/cilium/ebpf@v0.22.0
              - golang.org/x/net@v0.62.0
            download: true
        - name: make vendored distribution client writable
          work-dir: ${source.dir}/aports/community/docker/src/moby-docker-v29.9.2/vendor/github.com/docker/distribution/registry/client
          runs: |
            set -eux -o pipefail

            chown abuild:abuild . repository.go
            chmod u+w . repository.go
        - name: prepare docker sources
          uses: abuild/build@v1
          with:
            command: prepare
        - name: test docker engine after dependency updates
          work-dir: ${source.dir}/aports/community/docker/src/moby-docker-v29.9.2
          runs: |
            set -eux -o pipefail

            CGO_ENABLED=1 go test -count=1 -timeout=5m -tags seccomp ./cmd/dockerd

            mkdir -p ./dhi/distributionblob
            cp ${source.dir}/dhi-distribution-blob-digest_test.go ./dhi/distributionblob/digest_test.go
            go test -mod=vendor -count=1 -timeout=2m ./dhi/distributionblob
            rm -rf ./dhi
        - name: build package
          uses: abuild/build@v1
          with:
            command: build
        - name: package apk
          uses: abuild/build@v1
          with:
            command: rootpkg
      paths:
        - type: file
          path: ${source.dir}/aports/community/docker/dhi-cve-2026-85747-distribution-blob-digest.patch
          uid: 0
          gid: 0
          mode: "644"
          source: package/apk/main/docker/patch/dhi-cve-2026-85747-distribution-blob-digest.patch
        - type: file
          path: ${source.dir}/dhi-distribution-blob-digest_test.go
          uid: 0
          gid: 0
          mode: "644"
          source: package/apk/main/docker/tests/blob_digest_test.go
os-release:
  name: Docker Hardened Images (Alpine)
  id: alpine
  version-id: "3.24"
  pretty-name: Docker Hardened Images/Alpine Linux v3.24
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
