# syntax=dhi.io/build:2-alpine3.23

image: dhi.io/pkg-docker
variant: runtime
tags:
  - 29.7.2-alpine3.24
  - 29.7.2-r4-alpine3.24
platforms:
  - linux/amd64
  - linux/arm64
vars:
  _REL: "0"
  COMMIT_SHA: 976056d672e4ba43b35deb9e4dfa6cb8ce76dee4
  GOLANG_VERSION: 1.26.8-r0
  PACKAGE_NAME: community/docker
  REL: "4"
  SEMVER_MAJOR_MINOR_VERSION: "29.7"
  SEMVER_MAJOR_VERSION: "29"
  SEMVER_VERSION: 29.7.2
  VERSION: 29.7.2
contents:
  repositories:
    - https://dhi.io/apk/alpine/v3.24/main
    - https://dhi.io/apk/alpine/v3.23/main
    - https://dl-cdn.alpinelinux.org/alpine/v3.24/main
    - https://dl-cdn.alpinelinux.org/alpine/v3.24/community
  keyring:
    - https://dhi.io/keyring/dhi-apk@docker-0F81AD7700D99184.rsa.pub
  packages:
    - alpine-baselayout-data
  builds:
    - name: abuild
      work-dir: ${source.dir}/aports/community/docker
      contents:
        packages:
          - golang-1.26=1.26.8-r0
          - golang-1.26-oci-config=1.26.8-r0
          - btrfs-progs-dev
          - bash
          - linux-headers
          - coreutils
          - lvm2-dev
          - libtool
          - libseccomp-dev
          - ca-certificates
          - containerd
          - iptables
          - tini-static
          - log_proxy
          - nftables-dev
        files:
          - url: git+https://github.com/alpinelinux/aports.git#976056d672e4ba43b35deb9e4dfa6cb8ce76dee4
            path: ${source.dir}/aports
            uid: 0
            gid: 0
          - url: https://github.com/docker/cli/archive/v29.7.2.tar.gz
            path: /var/cache/distfiles/cli-29.7.2.tar.gz
            uid: 0
            gid: 0
          - url: https://github.com/moby/moby/archive/refs/tags/docker-v29.7.2.tar.gz
            path: /var/cache/distfiles/moby-29.7.2.tar.gz
            uid: 0
            gid: 0
      pipeline:
        - uses: abuild/setup@v1
        - uses: abuild/bump@v1
          with:
            rel: 4
        - name: unpack docker sources
          uses: abuild/build@v1
          with:
            command: unpack
        - name: prepare docker sources
          uses: abuild/build@v1
          with:
            command: prepare
        - name: update docker engine go dependencies
          uses: go/bump@v2
          work-dir: ${source.dir}/aports/community/docker/src/moby-docker-v29.7.2
          with:
            deps:
              - github.com/cilium/ebpf@v0.22.0
              - golang.org/x/mod@v0.40.0
              - golang.org/x/net@v0.58.0
              - golang.org/x/text@v0.41.0
              - google.golang.org/grpc@v1.83.0
            download: true
        - name: test docker engine after dependency updates
          work-dir: ${source.dir}/aports/community/docker/src/moby-docker-v29.7.2
          runs: |
            set -eux -o pipefail

            CGO_ENABLED=1 go test -count=1 -timeout=5m -tags seccomp ./cmd/dockerd
        - name: build package
          uses: abuild/build@v1
          with:
            command: build
        - name: package apk
          uses: abuild/build@v1
          with:
            command: rootpkg
os-release:
  name: Docker Hardened Images (Alpine)
  id: alpine
  version-id: "3.24"
  pretty-name: Docker Hardened Images/Alpine Linux v3.24
  home-url: https://docker.com/products/hardened-images/
