# syntax=dhi.io/build:2-alpine3.23

image: dhi.io/pkg-docker
variant: runtime
tags:
  - 29.9.3-alpine3.24
  - 29.9.3-r3-alpine3.24
platforms:
  - linux/amd64
  - linux/arm64
vars:
  _REL: "1"
  COMMIT_SHA: 28909be5b4a9901fb68bb5d92ac5e109454dabb2
  GOLANG_VERSION: 1.26.11-r0
  PACKAGE_NAME: community/docker
  REL: "3"
  SEMVER_MAJOR_MINOR_VERSION: "29.9"
  SEMVER_MAJOR_VERSION: "29"
  SEMVER_VERSION: 29.9.3
  VERSION: 29.9.3
contents:
  repositories:
    - https://dhi.io/apk/alpine/v3.24/main
    - https://dhi.io/apk/alpine/v3.23/main
    - https://dl-cdn.alpinelinux.org/alpine/v3.24/main
    - https://dl-cdn.alpinelinux.org/alpine/v3.24/community
  keyring:
    - https://dhi.io/keyring/dhi-apk@docker-0F81AD7700D99184.rsa.pub
  packages:
    - alpine-baselayout-data
  builds:
    - name: abuild
      work-dir: ${source.dir}/aports/community/docker
      contents:
        packages:
          - golang-1.26=1.26.11-r0
          - golang-1.26-oci-config=1.26.11-r0
          - btrfs-progs-dev
          - bash
          - linux-headers
          - coreutils
          - lvm2-dev
          - libtool
          - libseccomp-dev
          - ca-certificates
          - containerd
          - iptables
          - tini-static
          - log_proxy
          - nftables-dev
        files:
          - url: git+https://github.com/alpinelinux/aports.git#28909be5b4a9901fb68bb5d92ac5e109454dabb2
            path: ${source.dir}/aports
            uid: 0
            gid: 0
          - url: https://github.com/docker/cli/archive/v29.9.3.tar.gz
            path: /var/cache/distfiles/cli-29.9.3.tar.gz
            uid: 0
            gid: 0
          - url: https://github.com/moby/moby/archive/refs/tags/docker-v29.9.3.tar.gz
            path: /var/cache/distfiles/moby-29.9.3.tar.gz
            uid: 0
            gid: 0
      pipeline:
        - uses: abuild/setup@v1
        - runs: |
            set -eux -o pipefail

            sed -i '/^source=/,/^\t"$/s/^\t"$/"/' APKBUILD

            test "$(grep -Ec '^[[:space:]]*go-82324-ppc64-pie\.patch\.noauto$' APKBUILD)" -eq 1
            test "$(grep -Ec '^[[:space:]]*patch -p1 -i "\$srcdir"/go-82324-ppc64-pie\.patch\.noauto$' APKBUILD)" -eq 1
            test "$(grep -Ec '^[[:space:]]*go mod vendor$' APKBUILD)" -eq 1
            test "$(grep -Ec '^[0-9a-f]{128}[[:space:]]+go-82324-ppc64-pie\.patch\.noauto$' APKBUILD)" -eq 1
            test "$(grep -Fc 'go-82324-ppc64-pie.patch.noauto' APKBUILD)" -eq 3

            sed -i \
              -e '/go-82324-ppc64-pie\.patch\.noauto/d' \
              -e '/^[[:space:]]*go mod vendor$/d' \
              APKBUILD

            ! grep -Fq 'go-82324-ppc64-pie.patch.noauto' APKBUILD
            ! grep -Eq '^[[:space:]]*go mod vendor$' APKBUILD
        - uses: abuild/source@v1
          with:
            source: dhi-cve-2026-85747-distribution-blob-digest.patch
        - uses: abuild/bump@v1
          with:
            rel: 3
        - name: unpack docker sources
          uses: abuild/build@v1
          with:
            command: unpack
        - name: update docker engine go dependencies
          uses: go/bump@v2
          work-dir: ${source.dir}/aports/community/docker/src/moby-docker-v29.9.3
          with:
            deps:
              - golang.org/x/sys@v0.49.1-0.20261022125458-f5cb0306ac0e
              - github.com/cilium/ebpf@v0.22.0
              - golang.org/x/net@v0.62.0
              - github.com/klauspost/compress@v1.20.2
              - github.com/moby/buildkit@v0.34.2
            download: true
        - name: update swarmkit for CVE-2026-115539
          uses: go/bump@v2
          work-dir: ${source.dir}/aports/community/docker/src/moby-docker-v29.9.3
          with:
            deps:
              - github.com/moby/swarmkit/v2@v2.1.3
            download: true
        - name: make vendored distribution client writable
          work-dir: ${source.dir}/aports/community/docker/src/moby-docker-v29.9.3/vendor/github.com/docker/distribution/registry/client
          runs: |
            set -eux -o pipefail

            chown abuild:abuild . repository.go
            chmod u+w . repository.go
        - name: prepare docker sources
          uses: abuild/build@v1
          with:
            command: prepare
        - name: test docker engine after dependency updates
          work-dir: ${source.dir}/aports/community/docker/src/moby-docker-v29.9.3
          runs: |
            set -eux -o pipefail

            CGO_ENABLED=1 go test -count=1 -timeout=5m -tags seccomp ./cmd/dockerd

            mkdir -p ./dhi/distributionblob
            cp ${source.dir}/dhi-distribution-blob-digest_test.go ./dhi/distributionblob/digest_test.go
            go test -mod=vendor -count=1 -timeout=2m ./dhi/distributionblob
            rm -rf ./dhi
        - name: build package
          uses: abuild/build@v1
          with:
            command: build
        - name: package apk
          uses: abuild/build@v1
          with:
            command: rootpkg
      paths:
        - type: file
          path: ${source.dir}/aports/community/docker/dhi-cve-2026-85747-distribution-blob-digest.patch
          uid: 0
          gid: 0
          mode: "644"
          source: package/apk/main/docker/patch/dhi-cve-2026-85747-distribution-blob-digest.patch
        - type: file
          path: ${source.dir}/dhi-distribution-blob-digest_test.go
          uid: 0
          gid: 0
          mode: "644"
          source: package/apk/main/docker/tests/testdata/blob_digest_test.go
os-release:
  name: Docker Hardened Images (Alpine)
  id: alpine
  version-id: "3.24"
  pretty-name: Docker Hardened Images/Alpine Linux v3.24
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
