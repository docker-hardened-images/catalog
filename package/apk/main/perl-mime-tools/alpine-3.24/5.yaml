# syntax=dhi.io/build:2-alpine3.23

image: dhi.io/pkg-perl-mime-tools
variant: runtime
tags:
  - 5.517-alpine3.24
  - 5.517-r1-alpine3.24
platforms:
  - linux/amd64
  - linux/arm64
vars:
  COMMIT_SHA: a5c7e48f205310142be1f05510c9f27a08a315b8
  PACKAGE_NAME: main/perl-mime-tools
  REL: "1"
  SEMVER_MAJOR_MINOR_VERSION: "5.517"
  SEMVER_MAJOR_VERSION: "5"
  SEMVER_VERSION: "5.517"
  VERSION: "5.517"
contents:
  repositories:
    - https://dhi.io/apk/alpine/v3.24/main
    - https://dhi.io/apk/alpine/v3.23/main
    - https://dl-cdn.alpinelinux.org/alpine/v3.24/main
    - https://dl-cdn.alpinelinux.org/alpine/v3.24/community
  keyring:
    - https://dhi.io/keyring/dhi-apk@docker-0F81AD7700D99184.rsa.pub
  packages:
    - alpine-baselayout-data
  builds:
    - name: abuild
      work-dir: ${source.dir}/aports/main/perl-mime-tools
      contents:
        packages:
          - perl-mailtools
          - perl-convert-binhex
          - perl-test-deep
          - perl-test-pod
        files:
          - url: git+https://github.com/alpinelinux/aports.git#a5c7e48f205310142be1f05510c9f27a08a315b8
            path: ${source.dir}/aports
            uid: 0
            gid: 0
          - url: https://cpan.metacpan.org/authors/id/D/DS/DSKOLL/MIME-tools-5.517.tar.gz
            path: /var/cache/distfiles/MIME-tools-5.517.tar.gz
            uid: 0
            gid: 0
      pipeline:
        - uses: abuild/setup@v1
        - name: expand APKBUILD source list for patches
          runs: |
            set -eux -o pipefail

            if grep -qE '^source=".*"$' APKBUILD; then
              sed -i 's|^source="\(.*\)"$|source="\1|' APKBUILD
              sed -i '/^source="/a "' APKBUILD
            fi
        - uses: abuild/source@v1
          with:
            source: dhi-cve-2026-perl-mime-tools-security-5.517.patch
        - uses: abuild/bump@v1
          with:
            rel: 1
        - uses: abuild/build@v1
      paths:
        - type: file
          path: ${source.dir}/aports/main/perl-mime-tools/dhi-cve-2026-perl-mime-tools-security-5.517.patch
          uid: 0
          gid: 0
          mode: "644"
          source: package/apk/main/perl-mime-tools/patch/dhi-cve-2026-perl-mime-tools-security-5.517.patch
os-release:
  name: Docker Hardened Images (Alpine)
  id: alpine
