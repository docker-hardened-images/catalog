# syntax=dhi.io/build:2-alpine3.23

image: dhi.io/pkg-rust-stage0
variant: runtime
tags:
  - 1.97.0-alpine3.23
  - 1.97.0-r1-alpine3.23
platforms:
  - linux/amd64
  - linux/arm64
vars:
  COMMIT_SHA: d097b2be1ca786309981ada0be6408e5358430d4
  PACKAGE_NAME: main/rust
  REL: "1"
  SEMVER_MAJOR_MINOR_VERSION: "1.97"
  SEMVER_MAJOR_VERSION: "1"
  SEMVER_VERSION: 1.97.0
  VERSION: 1.97.0
contents:
  repositories:
    - https://dl-cdn.alpinelinux.org/alpine/v3.23/main
    - https://dl-cdn.alpinelinux.org/alpine/v3.23/community
  packages:
    - alpine-baselayout-data
  builds:
    - name: abuild
      work-dir: ${source.dir}/aports/main/rust
      contents:
        repositories:
          - https://dl-cdn.alpinelinux.org/alpine/edge/main
          - https://dl-cdn.alpinelinux.org/alpine/v3.23/main
          - https://dl-cdn.alpinelinux.org/alpine/v3.23/community
        packages:
          - clang22
          - curl-dev
          - file
          - libssh2-dev
          - llvm22-dev
          - llvm22-test-utils
          - openssl-dev
          - patchelf
          - python3
          - scudo-malloc
          - sqlite-dev
          - tar
          - wasi-libc
          - xz-dev
          - zlib-dev
          - cargo
          - rust
        files:
          - url: git+https://github.com/alpinelinux/aports.git#d097b2be1ca786309981ada0be6408e5358430d4
            path: ${source.dir}/aports
            uid: 0
            gid: 0
          - url: https://static.rust-lang.org/dist/rustc-1.97.0-src.tar.xz
            path: /var/cache/distfiles/rustc-1.97.0-src.tar.xz
            uid: 0
            gid: 0
      pipeline:
        - name: work around abuild edge directory layout changes
          runs: |
            set -eux -o pipefail

            mkdir -p /home/abuild/.config/abuild
            mkdir -p /home/abuild/packages
            chown -R 1000:1000 /home/abuild
            ln -s /home/abuild/.config/abuild /home/abuild/.abuild
            chown -h 1000:1000 /home/abuild/.abuild
        - uses: abuild/setup@v1
        - name: fix abuild config directory ownership
          runs: |
            set -eux -o pipefail

            chown -R 1000:1000 /home/abuild/.config/abuild
        - uses: abuild/build@v1
          privileged: true
          environment:
            BOOTSTRAP: "1"
os-release:
  name: Docker Hardened Images (Alpine)
  id: alpine
  version-id: "3.23"
  pretty-name: Docker Hardened Images/Alpine Linux v3.23
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
