# syntax=dhi.io/build:2-alpine3.23

image: dhi.io/pkg-gradle
variant: runtime
tags:
  - 8.14.6-alpine3.23
  - 8.14.6-r2-alpine3.23
platforms:
  - linux/amd64
vars:
  COMMIT_SHA: 88c80c1459b75a6d077d24eebe7905ffa3e1293f
  PACKAGE_NAME: gradle-8
  REL: "2"
  SEMVER_MAJOR_MINOR_VERSION: "8.14"
  SEMVER_MAJOR_VERSION: "8"
  SEMVER_VERSION: 8.14.6
  VERSION: 8.14.6
contents:
  repositories:
    - https://dhi.io/apk/alpine/v3.23/main
    - https://dl-cdn.alpinelinux.org/alpine/v3.23/main
    - https://dl-cdn.alpinelinux.org/alpine/v3.23/community
  keyring:
    - https://dhi.io/keyring/dhi-apk@docker-0F81AD7700D99184.rsa.pub
  packages:
    - alpine-baselayout-data
  builds:
    - name: gradle-8
      work-dir: ${source.dir}/gradle
      contents:
        packages:
          - unzip
          - openjdk17
        files:
          - url: git+https://github.com/gradle/gradle.git#v8.14.6
            checksum: 88c80c1459b75a6d077d24eebe7905ffa3e1293f
            path: ${source.dir}/gradle
            uid: 0
            gid: 0
          - url: https://maven-central.storage-download.googleapis.com/maven2/com/google/guava/guava/33.7.2-jre/guava-33.7.2-jre.jar
            checksum: sha256:b530942257fb935f8b2cfaa5f8eb5bd59c555fd8e8d01b8ce98912e077ea606c
            path: ${source.dir}/guava-33.7.2-jre.jar
            uid: 0
            gid: 0
      pipeline:
        - name: build gradle 8
          uses: dhi/gradle:8-jdk17-dev
          privileged: true
          runs: |
            set -eux -o pipefail

            # remove the daemon jvm properties file
            rm gradle/gradle-daemon-jvm.properties

            gradle :distributions-full:binDistributionZip -Pversion="8.14.6"
        - name: install
          runs: |
            set -eux -o pipefail

            unzip "packaging/distributions-full/build/distributions/gradle-8.14.6-bin.zip"

            cd gradle-*

            gradlehome="/usr/share/java/gradle"
            distdir="${target.dir}/${gradlehome}"

            mkdir -p "${distdir}"

            install -dm755 "${distdir}/bin"
            rm bin/*.bat
            install -m755 bin/* "${distdir}/bin"

            install -dm755 "${target.dir}/usr/bin"
            ln -sf "${gradlehome}/bin/gradle" "${target.dir}/usr/bin/gradle"

            install -dm755 "${distdir}/lib"
            cp -a lib "${distdir}/"

            install -m644 "${source.dir}/guava-33.7.2-jre.jar" \
              "${distdir}/lib/guava-33.4.6-jre.jar"

            # NOTICE file should be redistributed for derivative works
            for file in LICENSE NOTICE; do
              install -m644 -D ${file} "${target.dir}/usr/share/licenses/gradle-8/${file}"
            done
        - name: test
          runs: |
            set -eux -o pipefail

            "${target.dir}/usr/share/java/gradle/bin/gradle" --version
        - uses: sbom@v1
          privileged: true
          with:
            prefix: gradle-8-deps
            source: ${target.dir}
        - uses: abuild/setup@v1
          work-dir: ${source.dir}/aports/gradle-8
        - uses: abuild/apk@v1
          work-dir: ${source.dir}/aports/gradle-8
          with:
            arch: noarch
            description: A powerful build system for the JVM
            license: Apache-2.0
            name: gradle-8
            provider_priority: 800
            provides: gradle=8.14.6-r2
            rel: 2
            replaces: gradle
            replaces_priority: 800
            url: https://gradle.org/
            version: 8.14.6
        - uses: abuild/build@v1
          work-dir: ${source.dir}/aports/gradle-8
        - name: copy x86_64 to aarch64 packages
          run-as: abuild
          runs: |
            set -eux -o pipefail

            mkdir -p /home/abuild/packages/aports/aarch64
            cp -a /home/abuild/packages/aports/x86_64/* /home/abuild/packages/aports/aarch64
os-release:
  name: Docker Hardened Images (Alpine)
  id: alpine
  version-id: "3.23"
  pretty-name: Docker Hardened Images/Alpine Linux v3.23
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
