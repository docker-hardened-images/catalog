# syntax=dhi.io/build:2-alpine3.23

image: dhi.io/pkg-gradle
variant: runtime
tags:
  - 9.9.0-alpine3.23
  - 9.9.0-r0-alpine3.23
platforms:
  - linux/amd64
vars:
  COMMIT_SHA: dabfe84a6c2590fa6ecaab03ff6fefe5b838d558
  PACKAGE_NAME: gradle-9
  REL: "0"
  SEMVER_MAJOR_MINOR_VERSION: "9.9"
  SEMVER_MAJOR_VERSION: "9"
  SEMVER_VERSION: 9.9.0
  VERSION: 9.9.0
contents:
  repositories:
    - https://dhi.io/apk/alpine/v3.23/main
    - https://dl-cdn.alpinelinux.org/alpine/v3.23/main
    - https://dl-cdn.alpinelinux.org/alpine/v3.23/community
  keyring:
    - https://dhi.io/keyring/dhi-apk@docker-0F81AD7700D99184.rsa.pub
  packages:
    - alpine-baselayout-data
  builds:
    - name: gradle-9
      work-dir: ${source.dir}/gradle
      contents:
        packages:
          - unzip
          - openjdk17
        files:
          - url: git+https://github.com/gradle/gradle.git#v9.9.0
            checksum: dabfe84a6c2590fa6ecaab03ff6fefe5b838d558
            path: ${source.dir}/gradle
            uid: 0
            gid: 0
          - url: https://maven-central.storage-download.googleapis.com/maven2/com/google/guava/guava/33.7.2-jre/guava-33.7.2-jre.jar
            checksum: sha256:b530942257fb935f8b2cfaa5f8eb5bd59c555fd8e8d01b8ce98912e077ea606c
            path: ${source.dir}/guava-33.7.2-jre.jar
            uid: 0
            gid: 0
      pipeline:
        - name: patch disable deprecation warnings
          uses: git/patch@v1
          with:
            patch: 0004-Disable-deprecation-warnings.patch
        - name: build gradle 9
          uses: dhi/gradle:9-jdk21-dev
          privileged: true
          environment:
            GRADLE_OPTS: -Dorg.gradle.jvmargs="-Xmx2g -XX:MaxMetaspaceSize=512m"
          runs: |
            set -eux -o pipefail

            # remove the daemon jvm properties file
            rm gradle/gradle-daemon-jvm.properties

            ./gradlew :distributions-full:binDistributionZip -Pversion="9.9.0" \
              --no-daemon --max-workers=2
        - name: install
          runs: |
            set -eux -o pipefail

            unzip "packaging/distributions-full/build/distributions/gradle-9.9.0-bin.zip"

            cd gradle-*

            gradlehome="/usr/share/java/gradle"
            distdir="${target.dir}/${gradlehome}"

            mkdir -p "${distdir}"

            install -dm755 "${distdir}/bin"
            rm bin/*.bat
            install -m755 bin/* "${distdir}/bin"

            install -dm755 "${target.dir}/usr/bin"
            ln -sf "${gradlehome}/bin/gradle" "${target.dir}/usr/bin/gradle"

            install -dm755 "${distdir}/lib"
            cp -a lib "${distdir}/"

            install -m644 "${source.dir}/guava-33.7.2-jre.jar" \
              "${distdir}/lib/guava-33.4.6-jre.jar"

            # NOTICE file should be redistributed for derivative works
            for file in LICENSE NOTICE; do
              install -m644 -D ${file} "${target.dir}/usr/share/licenses/gradle-9/${file}"
            done
        - name: test
          runs: |
            set -eux -o pipefail

            "${target.dir}/usr/share/java/gradle/bin/gradle" --version
        - uses: sbom@v1
          privileged: true
          with:
            prefix: gradle-9-deps
            source: ${target.dir}
        - uses: abuild/setup@v1
          work-dir: ${source.dir}/aports/gradle-9
        - uses: abuild/apk@v1
          work-dir: ${source.dir}/aports/gradle-9
          with:
            arch: noarch
            description: A powerful build system for the JVM
            license: Apache-2.0
            name: gradle-9
            provider_priority: 900
            provides: gradle=9.9.0-r0
            rel: 0
            replaces: gradle
            replaces_priority: 900
            url: https://gradle.org/
            version: 9.9.0
        - uses: abuild/build@v1
          work-dir: ${source.dir}/aports/gradle-9
        - name: copy x86_64 to aarch64 packages
          run-as: abuild
          runs: |
            set -eux -o pipefail

            mkdir -p /home/abuild/packages/aports/aarch64
            cp -a /home/abuild/packages/aports/x86_64/* /home/abuild/packages/aports/aarch64
      paths:
        - type: file
          path: ${source.dir}/gradle/0004-Disable-deprecation-warnings.patch
          uid: 0
          gid: 0
          source: package/apk/main/gradle/patch/0004-Disable-deprecation-warnings.patch
os-release:
  name: Docker Hardened Images (Alpine)
  id: alpine
  version-id: "3.23"
  pretty-name: Docker Hardened Images/Alpine Linux v3.23
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
