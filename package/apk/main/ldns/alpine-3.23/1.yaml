# syntax=dhi.io/build:2-alpine3.23

image: dhi.io/pkg-ldns
variant: runtime
tags:
  - 1.8.4-alpine3.23
  - 1.8.4-r2-alpine3.23
platforms:
  - linux/amd64
  - linux/arm64
vars:
  _REL: "1"
  COMMIT_SHA: b1ae718cf21b0e31b44425202f1b1aedb9b40fe2
  DHI_TEST_APK_PACKAGES: ldns-1.8.4-r2 drill-1.8.4-r2 ldns-tools-1.8.4-r2 ldns-doc-1.8.4-r2
  PACKAGE_NAME: main/ldns
  REL: "2"
  SEMVER_MAJOR_MINOR_VERSION: "1.8"
  SEMVER_MAJOR_VERSION: "1"
  SEMVER_VERSION: 1.8.4
  VERSION: 1.8.4
contents:
  repositories:
    - https://dhi.io/apk/alpine/v3.23/main
    - https://dl-cdn.alpinelinux.org/alpine/v3.23/main
    - https://dl-cdn.alpinelinux.org/alpine/v3.23/community
  keyring:
    - https://dhi.io/keyring/dhi-apk@docker-0F81AD7700D99184.rsa.pub
  packages:
    - alpine-baselayout-data
  builds:
    - name: abuild
      work-dir: ${source.dir}/aports/main/ldns
      contents:
        packages:
          - openssl-dev
          - libpcap-dev
          - perl
          - autoconf
          - automake
          - libtool
        files:
          - url: git+https://github.com/alpinelinux/aports.git#b1ae718cf21b0e31b44425202f1b1aedb9b40fe2
            path: ${source.dir}/aports
            uid: 0
            gid: 0
          - url: https://nlnetlabs.nl/downloads/ldns/ldns-1.8.4.tar.gz
            path: /var/cache/distfiles/ldns-1.8.4.tar.gz
            uid: 0
            gid: 0
      pipeline:
        - uses: abuild/setup@v1
        - name: expand APKBUILD source list for patches
          runs: |
            set -eux -o pipefail

            if grep -qE '^source=".*"$' APKBUILD; then
              sed -i 's|^source="\(.*\)"$|source="\1|' APKBUILD
              sed -i '/^source="/a "' APKBUILD
            fi
        - uses: abuild/source@v1
          with:
            source: dhi-cve-2026-10846-response-validation.patch
        - uses: abuild/bump@v1
          with:
            rel: 2
            version: 1.8.4
        - uses: abuild/build@v1
      paths:
        - type: file
          path: ${source.dir}/aports/main/ldns/dhi-cve-2026-10846-response-validation.patch
          uid: 0
          gid: 0
          mode: "644"
          source: package/apk/main/ldns/patch/dhi-cve-2026-10846-response-validation.patch
os-release:
  name: Docker Hardened Images (Alpine)
  id: alpine
  version-id: "3.23"
