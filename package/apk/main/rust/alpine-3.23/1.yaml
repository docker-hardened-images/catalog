# syntax=dhi.io/build:2-alpine3.23

image: dhi.io/pkg-rust
variant: runtime
tags:
  - 1.98.1-alpine3.23
  - 1.98.1-r0-alpine3.23
platforms:
  - linux/amd64
  - linux/arm64
vars:
  COMMIT_SHA: b552ac1c49188243b310debeb3b094a94e574540
  PACKAGE_NAME: main/rust
  REL: "0"
  SEMVER_MAJOR_MINOR_VERSION: "1.98"
  SEMVER_MAJOR_VERSION: "1"
  SEMVER_VERSION: 1.98.1
  VERSION: 1.98.1
contents:
  repositories:
    - https://dl-cdn.alpinelinux.org/alpine/edge/main
    - https://dhi.io/apk/alpine/v3.23/main
    - https://dl-cdn.alpinelinux.org/alpine/v3.23/main
    - https://dl-cdn.alpinelinux.org/alpine/v3.23/community
  keyring:
    - https://dhi.io/keyring/dhi-apk@docker-0F81AD7700D99184.rsa.pub
  packages:
    - alpine-baselayout-data
  builds:
    - name: abuild
      work-dir: ${source.dir}/aports/main/rust
      contents:
        repositories:
          - https://dl-cdn.alpinelinux.org/alpine/edge/main
          - https://dhi.io/apk/alpine/v3.23/main
          - https://dl-cdn.alpinelinux.org/alpine/v3.23/main
          - https://dl-cdn.alpinelinux.org/alpine/v3.23/community
        packages:
          - clang23
          - curl-dev
          - file
          - libssh2-dev
          - llvm23-dev
          - llvm23-test-utils
          - openssl-dev
          - patchelf
          - python-3.14
          - scudo-malloc
          - sqlite-dev
          - tar
          - wasi-libc
          - xz-dev
          - zlib-dev
          - cargo-bootstrap
          - rust-bootstrap
        files:
          - url: git+https://github.com/alpinelinux/aports.git#b552ac1c49188243b310debeb3b094a94e574540
            path: ${source.dir}/aports
            uid: 0
            gid: 0
          - url: https://static.rust-lang.org/dist/rustc-1.98.1-src.tar.xz
            path: /var/cache/distfiles/rustc-1.98.1-src.tar.xz
            uid: 0
            gid: 0
      pipeline:
        - name: work around abuild edge directory layout changes
          runs: |
            set -eux -o pipefail

            mkdir -p /home/abuild/.config/abuild
            mkdir -p /home/abuild/packages
            chown -R 1000:1000 /home/abuild
            ln -s /home/abuild/.config/abuild /home/abuild/.abuild
            chown -h 1000:1000 /home/abuild/.abuild
        - uses: abuild/setup@v1
        - name: fix abuild config directory ownership
          runs: |
            set -eux -o pipefail

            chown -R 1000:1000 /home/abuild/.config/abuild
        - uses: abuild/build@v1
          privileged: true
os-release:
  name: Docker Hardened Images (Alpine)
  id: alpine
  version-id: "3.23"
  pretty-name: Docker Hardened Images/Alpine Linux v3.23
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
