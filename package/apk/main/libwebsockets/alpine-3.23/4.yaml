# syntax=dhi.io/build:2-alpine3.23

image: dhi.io/pkg-libwebsockets
variant: runtime
tags:
  - 4.3.5-alpine3.23
  - 4.3.5-r3-alpine3.23
platforms:
  - linux/amd64
  - linux/arm64
vars:
  _REL: "2"
  COMMIT_SHA: a48285c8ef0823ead78e51a5f3d04de0b4815272
  PACKAGE_NAME: main/libwebsockets
  REL: "3"
  SEMVER_MAJOR_MINOR_VERSION: "4.3"
  SEMVER_MAJOR_VERSION: "4"
  SEMVER_VERSION: 4.3.5
  VERSION: 4.3.5
contents:
  repositories:
    - https://dhi.io/apk/alpine/v3.23/main
    - https://dl-cdn.alpinelinux.org/alpine/v3.23/main
    - https://dl-cdn.alpinelinux.org/alpine/v3.23/community
  keyring:
    - https://dhi.io/keyring/dhi-apk@docker-0F81AD7700D99184.rsa.pub
  packages:
    - alpine-baselayout-data
  builds:
    - name: abuild
      work-dir: ${source.dir}/aports/main/libwebsockets
      contents:
        packages:
          - cmake
          - glib-dev
          - libev-dev
          - libevent-dev
          - libuv-dev
          - linux-headers
          - openssl-dev
          - samurai
          - zlib-dev
        files:
          - url: git+https://github.com/alpinelinux/aports.git#a48285c8ef0823ead78e51a5f3d04de0b4815272
            path: ${source.dir}/aports
            uid: 0
            gid: 0
          - url: https://github.com/warmcat/libwebsockets/archive/v4.3.5.tar.gz
            path: /var/cache/distfiles/libwebsockets-4.3.5.tar.gz
            uid: 0
            gid: 0
      pipeline:
        - uses: abuild/setup@v1
        - name: register CVE-2025-11677 patch in APKBUILD
          runs: |
            set -eux -o pipefail

            patch=dhi-cve-2025-11677-uaf-http-confirm-upgrade.patch
            test -f "${patch}"
            if ! grep -Fq "${patch}" APKBUILD; then
              sed -i "/fix-version-string.patch/a\\$(printf '\t')${patch}" APKBUILD
            fi
            grep -Fq "${patch}" APKBUILD \
              || {
                echo "ERROR: ${patch} not registered in APKBUILD source="
                exit 1
              }
        - uses: abuild/build@v1
          with:
            command: checksum
        - uses: abuild/bump@v1
          with:
            rel: 3
            version: 4.3.5
        - uses: abuild/build@v1
      paths:
        - type: file
          path: ${source.dir}/aports/main/libwebsockets/dhi-cve-2025-11677-uaf-http-confirm-upgrade.patch
          uid: 0
          gid: 0
          mode: "644"
          source: package/apk/main/libwebsockets/patch/dhi-cve-2025-11677-uaf-http-confirm-upgrade.patch
os-release:
  name: Docker Hardened Images (Alpine)
  id: alpine
  version-id: "3.23"
  pretty-name: Docker Hardened Images/Alpine Linux v3.23
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
