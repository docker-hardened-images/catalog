# syntax=dhi.io/build:2-alpine3.24

image: dhi.io/pkg-libsndfile
variant: runtime
tags:
  - 1.2.2-alpine3.24
  - 1.2.2-r3-alpine3.24
platforms:
  - linux/amd64
  - linux/arm64
vars:
  _REL: "2"
  COMMIT_SHA: 3acdcc403bf369664fa1f448972400bc9e79cb98
  DHI_TEST_APK_PACKAGES: /libsndfile-1.2.2-r3.apk /libsndfile-doc-1.2.2-r3.apk
  PACKAGE_NAME: main/libsndfile
  REL: "3"
  SEMVER_MAJOR_MINOR_VERSION: "1.2"
  SEMVER_MAJOR_VERSION: "1"
  SEMVER_VERSION: 1.2.2
  VERSION: 1.2.2
contents:
  repositories:
    - https://dhi.io/apk/alpine/v3.24/main
    - https://dhi.io/apk/alpine/v3.23/main
    - https://dl-cdn.alpinelinux.org/alpine/v3.24/main
    - https://dl-cdn.alpinelinux.org/alpine/v3.24/community
  keyring:
    - https://dhi.io/keyring/dhi-apk@docker-0F81AD7700D99184.rsa.pub
  packages:
    - alpine-baselayout-data
  builds:
    - name: abuild
      work-dir: ${source.dir}/aports/main/libsndfile
      contents:
        packages:
          - opus-dev
          - cmake
          - flac-dev
          - lame-dev
          - libogg-dev
          - libvorbis-dev
          - linux-headers
          - mpg123-dev
          - python3
          - samurai
        files:
          - url: git+https://github.com/alpinelinux/aports.git#3acdcc403bf369664fa1f448972400bc9e79cb98
            checksum: 3acdcc403bf369664fa1f448972400bc9e79cb98
            path: ${source.dir}/aports
            uid: 0
            gid: 0
          - url: https://github.com/libsndfile/libsndfile/releases/download/1.2.2/libsndfile-1.2.2.tar.xz
            path: /var/cache/distfiles/libsndfile-1.2.2.tar.xz
            uid: 0
            gid: 0
      pipeline:
        - uses: abuild/setup@v1
        - name: normalize apkbuild source list
          runs: |
            set -eux -o pipefail

            # abuild/source@v1 inserts before a bare closing quote; aports uses a tab-indented one.
            sed -i 's/^\t"$/"/' APKBUILD
        - uses: abuild/source@v1
          with:
            source: dhi-cve-2026-37555-ima-adpcm-wav-overflow.patch
        - uses: abuild/source@v1
          with:
            source: dhi-cve-2025-52194-ircam-header-harden.patch
        - uses: abuild/source@v1
          with:
            source: dhi-cve-2025-56226-mpeg-l3-encoder-init-leak.patch
        - name: prepare apkbuild
          runs: |
            set -eux -o pipefail

            sed -i '/^[[:space:]]*alsa-lib-dev$/d' APKBUILD

            sed -i 's|-DCMAKE_INSTALL_PREFIX=/usr|-DCMAKE_INSTALL_PREFIX=/usr -DCMAKE_INSTALL_LIBDIR=/usr/lib|' APKBUILD
        - uses: abuild/bump@v1
          with:
            rel: 3
            version: 1.2.2
        - uses: abuild/build@v1
      paths:
        - type: file
          path: ${source.dir}/aports/main/libsndfile/dhi-cve-2026-37555-ima-adpcm-wav-overflow.patch
          uid: 0
          gid: 0
          mode: "644"
          source: package/apk/main/libsndfile/patch/dhi-cve-2026-37555-ima-adpcm-wav-overflow.patch
        - type: file
          path: ${source.dir}/aports/main/libsndfile/dhi-cve-2025-52194-ircam-header-harden.patch
          uid: 0
          gid: 0
          mode: "644"
          source: package/apk/main/libsndfile/patch/dhi-cve-2025-52194-ircam-header-harden.patch
        - type: file
          path: ${source.dir}/aports/main/libsndfile/dhi-cve-2025-56226-mpeg-l3-encoder-init-leak.patch
          uid: 0
          gid: 0
          mode: "644"
          source: package/apk/main/libsndfile/patch/dhi-cve-2025-56226-mpeg-l3-encoder-init-leak.patch
os-release:
  name: Docker Hardened Images (Alpine)
  id: alpine
