# syntax=dhi.io/build:2-alpine3.23

image: dhi.io/pkg-rapidjson
variant: runtime
tags:
  - 1.1.0-alpine3.24
  - 1.1.0-r10-alpine3.24
platforms:
  - linux/amd64
  - linux/arm64
vars:
  _REL: "9"
  COMMIT_SHA: 3c30decf70f671a2aec711f4ce48915a3bc5ec4a
  PACKAGE_NAME: community/rapidjson
  REL: "10"
  SEMVER_MAJOR_MINOR_VERSION: "1.1"
  SEMVER_MAJOR_VERSION: "1"
  SEMVER_VERSION: 1.1.0
  VERSION: 1.1.0
contents:
  repositories:
    - https://dhi.io/apk/alpine/v3.24/main
    - https://dhi.io/apk/alpine/v3.23/main
    - https://dl-cdn.alpinelinux.org/alpine/v3.24/main
    - https://dl-cdn.alpinelinux.org/alpine/v3.24/community
  keyring:
    - https://dhi.io/keyring/dhi-apk@docker-0F81AD7700D99184.rsa.pub
  packages:
    - alpine-baselayout-data
  builds:
    - name: abuild
      work-dir: ${source.dir}/aports/community/rapidjson
      contents:
        packages:
          - gtest
          - gtest-dev
          - cmake
          - samurai
        files:
          - url: git+https://github.com/alpinelinux/aports.git#3c30decf70f671a2aec711f4ce48915a3bc5ec4a
            path: ${source.dir}/aports
            uid: 0
            gid: 0
          - url: https://github.com/miloyip/rapidjson/archive/v1.1.0.tar.gz
            path: /var/cache/distfiles/rapidjson-1.1.0.tar.gz
            uid: 0
            gid: 0
      pipeline:
        - uses: abuild/setup@v1
        - name: normalize APKBUILD source list closing quote
          runs: |
            set -eux -o pipefail

            sed -i 's/^\t"$/"/' APKBUILD
        - uses: abuild/source@v1
          with:
            source: dhi-cve-2024-39684-parse-number-overflow.patch
        - runs: |
            set -eux -o pipefail

            grep -q 'dhi-cve-2024-39684-parse-number-overflow.patch' APKBUILD \
              || {
                echo "ERROR: CVE-2024-39684 patch not registered in APKBUILD source="
                exit 1
              }
        - uses: abuild/bump@v1
          with:
            rel: 10
        - uses: abuild/build@v1
      paths:
        - type: file
          path: ${source.dir}/aports/community/rapidjson/dhi-cve-2024-39684-parse-number-overflow.patch
          uid: 0
          gid: 0
          mode: "644"
          source: package/apk/main/rapidjson/patch/dhi-cve-2024-39684-parse-number-overflow.patch
os-release:
  name: Docker Hardened Images (Alpine)
  id: alpine
  version-id: "3.24"
  pretty-name: Docker Hardened Images/Alpine Linux v3.24
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
