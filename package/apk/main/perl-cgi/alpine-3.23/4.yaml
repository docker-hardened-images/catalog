# syntax=dhi.io/build:2-alpine3.23

image: dhi.io/pkg-perl-cgi
variant: runtime
tags:
  - 4.71-alpine3.23
  - 4.71-r1-alpine3.23
platforms:
  - linux/amd64
  - linux/arm64
vars:
  _REL: "0"
  COMMIT_SHA: 7baf6f3da8c0fefe2f9145523d56ad9054ef0f3c
  PACKAGE_NAME: main/perl-cgi
  REL: "1"
  SEMVER_MAJOR_MINOR_VERSION: "4.71"
  SEMVER_MAJOR_VERSION: "4"
  SEMVER_VERSION: "4.71"
  VERSION: "4.71"
contents:
  repositories:
    - https://dhi.io/apk/alpine/v3.23/main
    - https://dl-cdn.alpinelinux.org/alpine/v3.23/main
    - https://dl-cdn.alpinelinux.org/alpine/v3.23/community
  keyring:
    - https://dhi.io/keyring/dhi-apk@docker-0F81AD7700D99184.rsa.pub
  packages:
    - alpine-baselayout-data
  builds:
    - name: abuild
      work-dir: ${source.dir}/aports/main/perl-cgi
      contents:
        packages:
          - perl-html-parser
          - perl-uri
          - perl-test-nowarnings
          - perl-test-warn
        files:
          - url: git+https://github.com/alpinelinux/aports.git#7baf6f3da8c0fefe2f9145523d56ad9054ef0f3c
            path: ${source.dir}/aports
            uid: 0
            gid: 0
          - url: https://cpan.metacpan.org/authors/id/L/LE/LEEJO/CGI-4.71.tar.gz
            path: /var/cache/distfiles/CGI-4.71.tar.gz
            uid: 0
            gid: 0
      pipeline:
        - uses: abuild/setup@v1
        - name: expand the single-line source list
          runs: |
            set -eux -o pipefail

            sed -i 's|^source="\(.*\)"$|source="\n    \1\n"|' APKBUILD
            grep -qx 'source="' APKBUILD
        - uses: abuild/source@v1
          with:
            source: dhi-cve-2026-cgi-security-4.71.patch
        - uses: abuild/bump@v1
          with:
            rel: 1
        - uses: abuild/build@v1
          privileged: true
      paths:
        - type: file
          path: ${source.dir}/aports/main/perl-cgi/dhi-cve-2026-cgi-security-4.71.patch
          uid: 0
          gid: 0
          mode: "644"
          source: package/apk/main/perl-cgi/patch/dhi-cve-2026-cgi-security-4.71.patch
