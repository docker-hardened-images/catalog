vars:
  BUNDLER_VERSION: 2.4.19
  CHECKSUM: b3eeabd6636f334531db3ffdc3229eb05e524740e6c84fdc043720573cf2f8b2
  DEBUG_VERSION: 1.7.1
  DHI_TEST_APK_PACKAGE: ruby-3.2
  DHI_TEST_APK_PACKAGES: ruby-3.2-3.2.11-r2 ruby-3.2-libs-3.2.11-r2
