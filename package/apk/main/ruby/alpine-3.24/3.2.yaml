        files:
          - url: https://cache.ruby-lang.org/pub/ruby/3.2/ruby-3.2.11.tar.gz
            checksum: sha256:b3eeabd6636f334531db3ffdc3229eb05e524740e6c84fdc043720573cf2f8b2
            path: ${source.dir}/ruby.tar.gz
            uid: 0
            gid: 0
          - url: git+https://github.com/ruby/erb.git#v4.0.4.1
            checksum: 6a2e4a76d352127135359e3420d5f42b767a0600
            path: ${source.dir}/erb
            uid: 0
            gid: 0
          - url: git+https://github.com/ruby/net-imap.git#v0.3.10
            checksum: ec89812d3c986d6394d3bc0b93048e704aec6af9
            path: ${source.dir}/net-imap
            uid: 0
            gid: 0
      pipeline:
        - name: prepare
          work-dir: ${source.dir}
          runs: |
            set -eux -o pipefail

            tar -xzf ruby.tar.gz
        - uses: git/patch@v1
          with:
            patch: ${source.dir}/patch/test_insns-lower-recursion-depth.patch
        - name: backport ruby/erb 4.0.4.1 for CVE-2026-41316
          runs: |
            set -eux -o pipefail

            target=4.0.4.1
            current=$(sed -nE "s/^[[:space:]]*VERSION = '([^']+)'.*/\1/p" lib/erb/version.rb | head -1)
            if [ -z "$current" ] || ruby -e "exit Gem::Version.new('$current') >= Gem::Version.new('$target') ? 0 : 1"; then
              echo "erb ${current:-(missing)} already >= ${target}, skipping"
              exit 0
            fi
            echo "Patching erb ${current} -> ${target}"

            rm -rf lib/erb lib/erb.rb lib/erb.gemspec libexec/erb ext/erb/escape

            cp -a "${source.dir}/erb/lib/erb.rb" lib/erb.rb
            cp -a "${source.dir}/erb/lib/erb" lib/erb
            cp -a "${source.dir}/erb/erb.gemspec" lib/erb.gemspec
            cp -a "${source.dir}/erb/libexec/erb" libexec/erb
            cp -a "${source.dir}/erb/ext/erb/escape" ext/erb/escape
            chmod +x libexec/erb

            grep -q "VERSION = '${target}'" lib/erb/version.rb
        - name: autoconf
          runs: |
            set -eux -o pipefail

            autoconf
        - name: build
          environment:
            CFLAGS: -O2 -fno-omit-frame-pointer -fno-strict-aliasing
            CPPFLAGS: -O2 -fno-omit-frame-pointer -fno-strict-aliasing
            INSTALL: install
            LIBS: -lucontext
          runs: |
            set -eux -o pipefail

            # the configure script does not detect isnan/isinf as macros
            export ac_cv_func_isinf="yes"
            export ac_cv_func_isnan="yes"

            gnuArch="$(dpkg-architecture --query DEB_BUILD_GNU_TYPE)"

            ./configure \
              --build="$gnuArch" \
              --prefix=/usr \
              --sysconfdir=/etc \
              --mandir=/usr/share/man \
              --infodir=/usr/share/info \
              --with-sitedir=/usr/local/lib/site_ruby \
              --enable-pthread \
              --disable-rpath \
              --enable-shared \
              --enable-mkmf-verbose \
              --enable-yjit \
              --with-jemalloc \
              --with-mantype=man

            ncpus=$(getconf _NPROCESSORS_ONLN)
            ncpus=$((ncpus > 6 ? 6 : ncpus))

            make -j${ncpus}
        - name: test
          runs: |
            set -eux -o pipefail

            # https://bugs.ruby-lang.org/issues/18380
            disable_tests="-n !/TestAddressResolve#test_socket_getnameinfo_domain_blocking/"

            make test TESTS="$disable_tests" TESTOPTS="--verbose"
        - name: install
          runs: |
            set -eux -o pipefail

            make DESTDIR="${target.dir}" SUDO="" install

            install -m 644 -D COPYING "${target.dir}/usr/share/licenses/ruby/COPYING"

            # Remove bundled CA certificates; they are provided by ca-certificates.
            rm "${target.dir}/usr/lib/ruby/3.2.0"/rubygems/ssl_certs/*/*.pem
            rmdir "${target.dir}/usr/lib/ruby/3.2.0"/rubygems/ssl_certs/* || true

            rm -Rf "${target.dir}/usr/lib/ruby/gems/3.2.0"/cache/*
            rm -rf "${target.dir}/usr/local"
        - name: Install net-imap 0.3.10 with command checks
          work-dir: ${source.dir}/net-imap
          runs: |
            set -eux -o pipefail

            if ruby -e "exit Gem::Version.new('0.3.9') >= Gem::Version.new('0.4.24') ? 0 : 1"; then
              echo "upstream net-imap 0.3.9 >= 0.4.24, delete this step"
              exit 0
            fi

            patch -p1 --forward --input "${source.dir}/patch/dhi-net-imap-0.3.10-command-validation.patch"

            rm -rf "${target.dir}/usr/lib/ruby/gems/3.2.0/gems/net-imap-"*
            rm -f "${target.dir}/usr/lib/ruby/gems/3.2.0/specifications/net-imap-"*.gemspec

            gem build net-imap.gemspec
            gem install \
              --local --no-document --ignore-dependencies \
              --install-dir "${target.dir}/usr/lib/ruby/gems/3.2.0" \
              net-imap-0.3.10.gem

            grep -q 'cannot end with literal continuation' \
              "${target.dir}/usr/lib/ruby/gems/3.2.0/gems/net-imap-0.3.10/lib/net/imap/command_data.rb"
        - name: remove rbs development lockfiles
          runs: |
            set -eux -o pipefail

            rm \
              "${target.dir}/usr/lib/ruby/gems/3.2.0/gems/rbs-2.8.2/Gemfile.lock" \
              "${target.dir}/usr/lib/ruby/gems/3.2.0/gems/rbs-2.8.2/steep/Gemfile.lock"
        - uses: sbom@v1
          with:
            prefix: ruby-gems
            source: ${target.dir}
        - uses: abuild/setup@v1
          work-dir: ${source.dir}/aports/ruby-3.2
        - uses: abuild/apk@v1
          work-dir: ${source.dir}/aports/ruby-3.2
          with:
