# syntax=dhi.io/build:2-alpine3.23

image: dhi.io/pkg-npm
variant: runtime
tags:
  - 12.2.3-alpine3.23
  - 12.2.3-r1-alpine3.23
platforms:
  - linux/amd64
  - linux/arm64
vars:
  _REL: "0"
  _VERSION: 11.11.0
  BOOTSTRAP_NODE_VERSION: 26.13.1-r0
  BOOTSTRAP_NPM_VERSION: 11.21.3-r0
  COMMIT_SHA: 6e6685692e442b96154e0ba05aeb5e784685ee44
  DHI_TEST_APK_PACKAGE: npm-12
  MINIMATCH_COMMIT_SHA: 693c82377d0948401be4c6d3220c9a74132ab112
  MINIMATCH_VERSION: 10.2.5
  PACKAGE_NAME: community/npm
  REL: "1"
  SEMVER_MAJOR_MINOR_VERSION: "12.2"
  SEMVER_MAJOR_VERSION: "12"
  SEMVER_VERSION: 12.2.3
  VERSION: 12.2.3
contents:
  repositories:
    - https://dhi.io/apk/alpine/v3.23/main
    - https://dl-cdn.alpinelinux.org/alpine/v3.23/main
    - https://dl-cdn.alpinelinux.org/alpine/v3.23/community
  keyring:
    - https://dhi.io/keyring/dhi-apk@docker-0F81AD7700D99184.rsa.pub
  packages:
    - alpine-baselayout-data
  builds:
    - name: abuild
      work-dir: ${source.dir}/aports/community/npm
      contents:
        packages:
          - npm=11.21.3-r0
          - nodejs-26=26.13.1-r0
        files:
          - url: git+https://github.com/isaacs/minimatch.git#v10.2.5
            checksum: 693c82377d0948401be4c6d3220c9a74132ab112
            path: ${source.dir}/minimatch
            uid: 0
            gid: 0
          - url: git+https://github.com/alpinelinux/aports.git#6e6685692e442b96154e0ba05aeb5e784685ee44
            path: ${source.dir}/aports
            uid: 0
            gid: 0
          - url: https://registry.npmjs.org/npm/-/npm-12.2.3.tgz
            path: /var/cache/distfiles/npm-12.2.3.tgz
            uid: 0
            gid: 0
          - url: https://registry.npmjs.org/glob/-/glob-13.0.7.tgz
            checksum: sha256:58342994ba61c09d9c27365d0930195c5583fe31e80c1683544805cebc065fd4
            path: ${source.dir}/aports/community/npm/glob-13.0.7.tgz
            uid: 0
            gid: 0
          - url: https://registry.npmjs.org/picomatch/-/picomatch-4.0.4.tgz
            checksum: sha256:515b5ab666558ed9a117483a310892aede54a68dd78f2d8db6604513e578571c
            path: ${source.dir}/aports/community/npm/picomatch-4.0.4.tgz
            uid: 0
            gid: 0
          - url: https://registry.npmjs.org/brace-expansion/-/brace-expansion-5.0.12.tgz
            checksum: sha256:ef8448ec78f20b692f04fa6d01f39b5ab34c66404bea3429f5a39c6c9e0be8b4
            path: ${source.dir}/aports/community/npm/brace-expansion-5.0.12.tgz
            uid: 0
            gid: 0
          - url: https://registry.npmjs.org/tar/-/tar-7.5.21.tgz
            path: ${source.dir}/aports/community/npm/tar-7.5.21.tgz
            uid: 0
            gid: 0
          - url: https://registry.npmjs.org/undici/-/undici-6.29.1.tgz
            checksum: sha256:29c4b8e0b2d86cb8795571c1959012ce057a14ecfd34858335f47c31e770a04f
            path: ${source.dir}/aports/community/npm/undici-6.29.1.tgz
            uid: 0
            gid: 0
          - url: https://registry.npmjs.org/ip-address/-/ip-address-10.7.5.tgz
            checksum: sha256:13411b6b3bb984844bd04eba6543a5adf22c1e8749f721dc2d56af4339ba93a4
            path: ${source.dir}/aports/community/npm/ip-address-10.7.5.tgz
            uid: 0
            gid: 0
      pipeline:
        - name: prepare backport output
          runs: |
            set -eux -o pipefail

            mkdir -p ${source.dir}/vendor
        - name: backport minimatch preprocessing limits
          uses: patch@v1
          work-dir: ${source.dir}/minimatch
          with:
            options: -p1
            patches:
              - ${source.dir}/patch/cve-2026-118764-minimatch-preprocess.patch
        - name: build patched minimatch
          work-dir: ${source.dir}/minimatch
          privileged: true
          runs: |
            set -eux -o pipefail

            npm ci --ignore-scripts --no-audit --no-fund
            npm run prepare
            npm exec tap -- --disable-coverage
            node ${source.dir}/tests/pattern-regressions.cjs --minimatch-only ${source.dir}/minimatch
            npm pack --ignore-scripts --pack-destination ${source.dir}/vendor
        - uses: abuild/setup@v1
        - runs: |
            set -eux -o pipefail

            # Rename the package to npm-12 so it is distinct from the npm (11.x) package
            sed -i 's,^pkgname=npm$,pkgname=npm-12,' APKBUILD

            # Provide and replace npm so npm-12 satisfies npm dependencies and owns its files
            cat >> APKBUILD << 'EOF'

            provides="npm=$pkgver-r$pkgrel"
            replaces="$replaces npm"
            EOF

            # Remove the distro patch, we disable update checking via env var
            sed -i 's,dont-check-for-last-version.patch,,' APKBUILD

            # Add _vendor_replace function to APKBUILD
            cat >> APKBUILD << 'EOF'

            _vendor_replace() {
                local pkg="$1" ver="$2" dir="$3"
                rm -rf "$dir"/"$pkg"
                tar -xzf "${source.dir}/aports/community/npm"/"$pkg"-"$ver".tgz -C "$dir"
                mv "$dir"/package "$dir"/"$pkg"
            }
            _patch_minimatch() {
                test "$(node -p 'require("./node_modules/minimatch/package.json").version')" = 10.2.5
                tar -xzf "${source.dir}/vendor/minimatch-10.2.5+dhi.1.tgz" -C node_modules/minimatch --strip-components=1
            }
            _clean_socks() {
                rm -rf node_modules/socks/.claude
            }
            EOF

            # Replace default_prepare with _vendor_replace for brace-expansion, tar, picomatch, undici, and ip-address
            # CVE-2026-69152, CVE-2026-102276, CVE-2026-102277, CVE-2026-102278: brace-expansion
            sed -i 's,default_prepare,default_prepare\n\t_vendor_replace brace-expansion 5.0.12 node_modules,' APKBUILD
            sed -i 's,default_prepare,default_prepare\n\t_vendor_replace tar 7.5.21 node_modules,' APKBUILD
            sed -i 's,default_prepare,default_prepare\n\t_vendor_replace picomatch 4.0.4 node_modules/tinyglobby/node_modules,' APKBUILD
            # CVE-2026-15157, CVE-2026-16728, CVE-2026-16729, CVE-2026-19534, CVE-2026-85024, CVE-2026-18540: undici
            sed -i 's,default_prepare,default_prepare\n\t_vendor_replace undici 6.29.1 node_modules,' APKBUILD
            # CVE-2026-54272, CVE-2026-69192, CVE-2026-69198, CVE-2026-101910, CVE-2026-101911, CVE-2026-101912, CVE-2026-101913, CVE-2026-111997: ip-address
            sed -i 's,default_prepare,default_prepare\n\t_vendor_replace ip-address 10.7.5 node_modules,' APKBUILD
            sed -i 's,default_prepare,default_prepare\n\t_vendor_replace glob 13.0.7 node_modules,' APKBUILD
            sed -i 's,default_prepare,default_prepare\n\t_patch_minimatch,' APKBUILD
            sed -i 's,default_prepare,default_prepare\n\t_clean_socks,' APKBUILD
        - uses: abuild/bump@v1
          with:
            set: 1
            version: 12.2.3
        - uses: abuild/build@v1
          with:
            command: checksum
        - uses: abuild/build@v1
      paths:
        - type: file
          path: ${source.dir}/patch/cve-2026-118764-minimatch-preprocess.patch
          uid: 0
          gid: 0
          source: package/apk/main/npm/patch/cve-2026-118764-minimatch-preprocess.patch
        - type: file
          path: ${source.dir}/tests/pattern-regressions.cjs
          uid: 0
          gid: 0
          source: package/apk/main/npm/tests/pattern-regressions.cjs
os-release:
  name: Docker Hardened Images (Alpine)
  id: alpine
  version-id: "3.23"
  pretty-name: Docker Hardened Images/Alpine Linux v3.23
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
