# syntax=dhi.io/build:2-alpine3.23

image: dhi.io/pkg-npm
variant: runtime
tags:
  - 11.21.2-alpine3.24
  - 11.21.2-r2-alpine3.24
platforms:
  - linux/amd64
  - linux/arm64
vars:
  _REL: "0"
  _VERSION: 11.12.1
  COMMIT_SHA: c331ddc80f97bde2e3ab83edb2cd645e6836e66f
  PACKAGE_NAME: community/npm
  REL: "2"
  SEMVER_MAJOR_MINOR_VERSION: "11.21"
  SEMVER_MAJOR_VERSION: "11"
  SEMVER_VERSION: 11.21.2
  VERSION: 11.21.2
contents:
  repositories:
    - https://dhi.io/apk/alpine/v3.24/main
    - https://dhi.io/apk/alpine/v3.23/main
    - https://dl-cdn.alpinelinux.org/alpine/v3.24/main
    - https://dl-cdn.alpinelinux.org/alpine/v3.24/community
  keyring:
    - https://dhi.io/keyring/dhi-apk@docker-0F81AD7700D99184.rsa.pub
  packages:
    - alpine-baselayout-data
  builds:
    - name: abuild
      work-dir: ${source.dir}/aports/community/npm
      contents:
        packages:
          - nodejs
        files:
          - url: git+https://github.com/alpinelinux/aports.git#c331ddc80f97bde2e3ab83edb2cd645e6836e66f
            path: ${source.dir}/aports
            uid: 0
            gid: 0
          - url: https://registry.npmjs.org/npm/-/npm-11.21.2.tgz
            path: /var/cache/distfiles/npm-11.21.2.tgz
            uid: 0
            gid: 0
          - url: https://registry.npmjs.org/picomatch/-/picomatch-4.0.4.tgz
            checksum: sha256:515b5ab666558ed9a117483a310892aede54a68dd78f2d8db6604513e578571c
            path: ${source.dir}/aports/community/npm/picomatch-4.0.4.tgz
            uid: 0
            gid: 0
          - url: https://registry.npmjs.org/brace-expansion/-/brace-expansion-5.0.12.tgz
            checksum: sha256:ef8448ec78f20b692f04fa6d01f39b5ab34c66404bea3429f5a39c6c9e0be8b4
            path: ${source.dir}/aports/community/npm/brace-expansion-5.0.12.tgz
            uid: 0
            gid: 0
          - url: https://registry.npmjs.org/tar/-/tar-7.5.21.tgz
            path: ${source.dir}/aports/community/npm/tar-7.5.21.tgz
            uid: 0
            gid: 0
          - url: https://registry.npmjs.org/undici/-/undici-6.29.1.tgz
            checksum: sha256:29c4b8e0b2d86cb8795571c1959012ce057a14ecfd34858335f47c31e770a04f
            path: ${source.dir}/aports/community/npm/undici-6.29.1.tgz
            uid: 0
            gid: 0
          - url: https://registry.npmjs.org/ip-address/-/ip-address-10.7.5.tgz
            checksum: sha256:13411b6b3bb984844bd04eba6543a5adf22c1e8749f721dc2d56af4339ba93a4
            path: ${source.dir}/aports/community/npm/ip-address-10.7.5.tgz
            uid: 0
            gid: 0
      pipeline:
        - uses: abuild/setup@v1
        - runs: |
            set -eux -o pipefail

            # Remove the distro patch, we disable update checking via env var
            sed -i 's,dont-check-for-last-version.patch,,' APKBUILD

            # Add _vendor_replace function to APKBUILD
            cat >> APKBUILD << 'EOF'

            _vendor_replace() {
                local pkg="$1" ver="$2" dir="$3"
                rm -rf "$dir"/"$pkg"
                tar -xzf "${source.dir}/aports/community/npm"/"$pkg"-"$ver".tgz -C "$dir"
                mv "$dir"/package "$dir"/"$pkg"
            }
            _clean_socks() {
                rm -rf node_modules/socks/.claude
            }
            EOF

            # Replace default_prepare with _vendor_replace for brace-expansion, tar, picomatch, undici, and ip-address
            # CVE-2026-69152, CVE-2026-102276, CVE-2026-102277, CVE-2026-102278: brace-expansion
            sed -i 's,default_prepare,default_prepare\n\t_vendor_replace brace-expansion 5.0.12 node_modules,' APKBUILD
            sed -i 's,default_prepare,default_prepare\n\t_vendor_replace tar 7.5.21 node_modules,' APKBUILD
            sed -i 's,default_prepare,default_prepare\n\t_vendor_replace picomatch 4.0.4 node_modules/tinyglobby/node_modules,' APKBUILD
            # CVE-2026-15157, CVE-2026-16728, CVE-2026-16729, CVE-2026-19534, CVE-2026-85024, CVE-2026-18540: undici
            sed -i 's,default_prepare,default_prepare\n\t_vendor_replace undici 6.29.1 node_modules,' APKBUILD
            # CVE-2026-54272, CVE-2026-69192, CVE-2026-69198, CVE-2026-101910, CVE-2026-101911, CVE-2026-101912, CVE-2026-101913, CVE-2026-111997: ip-address
            sed -i 's,default_prepare,default_prepare\n\t_vendor_replace ip-address 10.7.5 node_modules,' APKBUILD
            sed -i 's,default_prepare,default_prepare\n\t_clean_socks,' APKBUILD
        - uses: abuild/bump@v1
          with:
            set: 2
            version: 11.21.2
        - uses: abuild/build@v1
          with:
            command: checksum
        - uses: abuild/build@v1
os-release:
  name: Docker Hardened Images (Alpine)
  id: alpine
  version-id: "3.24"
  pretty-name: Docker Hardened Images/Alpine Linux v3.24
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
