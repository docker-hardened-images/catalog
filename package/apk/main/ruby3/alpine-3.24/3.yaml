# syntax=dhi.io/build:2-alpine3.24

image: dhi.io/pkg-ruby
variant: runtime
tags:
  - 3.4.12-alpine3.24
  - 3.4.12-r1-alpine3.24
platforms:
  - linux/amd64
  - linux/arm64
vars:
  _REL: "0"
  COMMIT_SHA: be48706efde89a97126c200afdb4beec54dc17ea
  JSON_COMMIT_SHA: 2cff2678d5af54890a49da58345ac141b571f661
  JSON_VERSION: 2.19.9
  PACKAGE_NAME: main/ruby
  REL: "1"
  SEMVER_MAJOR_MINOR_VERSION: "3.4"
  SEMVER_MAJOR_VERSION: "3"
  SEMVER_VERSION: 3.4.12
  VERSION: 3.4.12
contents:
  repositories:
    - https://dhi.io/apk/alpine/v3.24/main
    - https://dhi.io/apk/alpine/v3.23/main
    - https://dl-cdn.alpinelinux.org/alpine/v3.24/main
    - https://dl-cdn.alpinelinux.org/alpine/v3.24/community
  keyring:
    - https://dhi.io/keyring/dhi-apk@docker-0F81AD7700D99184.rsa.pub
  packages:
    - alpine-baselayout-data
  builds:
    - name: abuild
      work-dir: ${source.dir}/aports/main/ruby
      contents:
        packages:
          - gmp-dev
          - libucontext-dev
          - autoconf
          - cargo
          - gdbm-dev
          - libffi-dev
          - linux-headers
          - openssl-dev
          - readline-dev
          - yaml-dev
          - zlib-dev
        files:
          - url: git+https://github.com/alpinelinux/aports.git#be48706efde89a97126c200afdb4beec54dc17ea
            path: ${source.dir}/aports
            uid: 0
            gid: 0
          - url: https://cache.ruby-lang.org/pub/ruby/3.4/ruby-3.4.12.tar.gz
            path: /var/cache/distfiles/ruby-3.4.12.tar.gz
            uid: 0
            gid: 0
          - url: git+https://github.com/ruby/json.git#v2.19.9
            checksum: 2cff2678d5af54890a49da58345ac141b571f661
            path: ${source.dir}/json
            uid: 0
            gid: 0
      pipeline:
        - uses: abuild/setup@v1
        - name: backport ruby/json 2.19.9 for CVE-2026-54696
          runs: |
            set -eux -o pipefail

            tarball="/var/cache/distfiles/ruby-3.4.12.tar.gz"
            work="${source.dir}/ruby-json-backport"
            rm -rf "${work}"
            mkdir -p "${work}"
            tar -xzf "${tarball}" -C "${work}"
            cd "${work}/ruby-3.4.12"

            rm -rf test/json
            cp -a "${source.dir}/json/test/json" test/json

            rm -rf ext/json/fbuffer
            rm -rf ext/json/generator
            rm -rf ext/json/parser
            rm -rf ext/json/simd
            rm -rf ext/json/vendor
            rm -rf ext/json/lib
            rm -f ext/json/json.gemspec
            rm -f ext/json/json.h

            cp -a "${source.dir}/json/ext/json/ext/." ext/json/
            cp -a "${source.dir}/json/lib" ext/json/lib
            cp -a "${source.dir}/json/json.gemspec" ext/json/json.gemspec

            rm -rf ext/json/lib/json/truffle_ruby
            rm -rf ext/json/lib/json/pure
            rm -f ext/json/lib/json/pure.rb

            grep -q "VERSION = '2.19.9'" ext/json/lib/json/version.rb

            cd "${work}"
            tar -czf "${tarball}.new" "ruby-3.4.12"
            mv "${tarball}.new" "${tarball}"
        - uses: abuild/build@v1
          with:
            command: checksum
        - uses: abuild/bump@v1
          with:
            rel: 1
        - uses: abuild/build@v1
os-release:
  name: Docker Hardened Images (Alpine)
  id: alpine
  version-id: "3.24"
  pretty-name: Docker Hardened Images/Alpine Linux v3.24
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
