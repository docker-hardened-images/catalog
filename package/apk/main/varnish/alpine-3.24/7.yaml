# syntax=dhi.io/build:2-alpine3.23

image: dhi.io/pkg-varnish
variant: runtime
tags:
  - 7.7.3-alpine3.24
  - 7.7.3-r1-alpine3.24
platforms:
  - linux/amd64
  - linux/arm64
vars:
  _REL: "0"
  COMMIT_SHA: e8a876d127807fb2f20aec0753a3b29ffa537a16
  PACKAGE_NAME: main/varnish
  REL: "1"
  SEMVER_MAJOR_MINOR_VERSION: "7.7"
  SEMVER_MAJOR_VERSION: "7"
  SEMVER_VERSION: 7.7.3
  VERSION: 7.7.3
contents:
  repositories:
    - https://dhi.io/apk/alpine/v3.24/main
    - https://dhi.io/apk/alpine/v3.23/main
    - https://dl-cdn.alpinelinux.org/alpine/v3.24/main
    - https://dl-cdn.alpinelinux.org/alpine/v3.24/community
  keyring:
    - https://dhi.io/keyring/dhi-apk@docker-0F81AD7700D99184.rsa.pub
  packages:
    - alpine-baselayout-data
  builds:
    - name: abuild
      work-dir: ${source.dir}/aports/main/varnish
      contents:
        packages:
          - ncurses-dev
          - libedit-dev
          - py3-docutils
          - linux-headers
          - pcre2-dev
          - libunwind-dev
          - py3-sphinx
        files:
          - url: git+https://github.com/alpinelinux/aports.git#e8a876d127807fb2f20aec0753a3b29ffa537a16
            path: ${source.dir}/aports
            uid: 0
            gid: 0
          - url: https://varnish-cache.org/_downloads/varnish-7.7.3.tgz
            path: /var/cache/distfiles/varnish-7.7.3.tgz
            uid: 0
            gid: 0
          - url: https://github.com/varnishcache/pkg-varnish-cache/raw/7d90347be31891b338dededb318594cebb668ba7/systemd/varnishreload
            path: /var/cache/distfiles/varnishreload-7.7.3
            uid: 0
            gid: 0
      pipeline:
        - uses: abuild/setup@v1
        - name: split APKBUILD source closer
          runs: |
            set -eux -o pipefail

            grep -q 'varnishreload-$pkgver::' APKBUILD
            awk '
              /varnishreload-\$pkgver::/ && /"$/ {
                sub(/"$/, "")
                print
                print "\""
                next
              }
              { print }
            ' APKBUILD > APKBUILD.new
            mv APKBUILD.new APKBUILD
            if grep -q 'varnishreload-$pkgver::.*"' APKBUILD; then
              echo "source closer still attached to varnishreload" >&2
              exit 1
            fi
        - uses: abuild/source@v1
          with:
            source: dhi-cve-2026-50052-h2-pseudo-header-parsing.patch
        - name: require CVE patch in APKBUILD source
          runs: |
            set -eux -o pipefail

            grep -Fq 'dhi-cve-2026-50052-h2-pseudo-header-parsing.patch' APKBUILD
        - uses: abuild/bump@v1
          with:
            rel: 1
        - uses: abuild/build@v1
      paths:
        - type: file
          path: ${source.dir}/aports/main/varnish/dhi-cve-2026-50052-h2-pseudo-header-parsing.patch
          uid: 0
          gid: 0
          mode: "644"
          source: package/apk/main/varnish/patch/dhi-cve-2026-50052-h2-pseudo-header-parsing.patch
os-release:
  name: Docker Hardened Images (Alpine)
  id: alpine
  version-id: "3.24"
  pretty-name: Docker Hardened Images/Alpine Linux v3.24
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
