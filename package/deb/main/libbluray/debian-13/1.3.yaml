  DEBIAN_DSC_FILENAME: libbluray_1.3.4-1.dsc
  DEBIAN_DSC_URL: https://deb.debian.org/debian/pool/main/libb/libbluray/libbluray_1.3.4-1.dsc
  DEBIAN_FILENAME_VERSION: 1.3.4-1
  DEBIAN_ORIG_CHECKSUM: sha256:478ffd68a0f5dde8ef6ca989b7f035b5a0a22c599142e5cd3ff7b03bbebe5f2b
