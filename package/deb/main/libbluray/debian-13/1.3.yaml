contents:
  packages:
    - '!base-files'
  builds:
    - name: libbluray deb
      work-dir: ${source.dir}/libbluray
      contents:
        packages:
          - ant
          - build-essential
          - debhelper
          - default-jdk
          - doxygen
          - dpkg-dev
          - java-common
          - javahelper
          - libfontconfig-dev
          - libfreetype-dev
          - libudfread-dev
          - libxml2-dev
          - pkg-config
        files:
          - url: https://deb.debian.org/debian/pool/main/libb/libbluray/libbluray_1.3.4-1.dsc
            checksum: sha256:a1aa9cb61f3f0726eecb9d4c331c5ab43694f42c770f80775b6e6d270c485684
            path: ${source.dir}/libbluray_1.3.4-1.dsc
            uid: 0
            gid: 0
          - url: https://deb.debian.org/debian/pool/main/libb/libbluray/libbluray_1.3.4.orig.tar.bz2
            checksum: sha256:478ffd68a0f5dde8ef6ca989b7f035b5a0a22c599142e5cd3ff7b03bbebe5f2b
            path: ${source.dir}/libbluray_1.3.4.orig.tar.bz2
            uid: 0
            gid: 0
          - url: https://deb.debian.org/debian/pool/main/libb/libbluray/libbluray_1.3.4-1.debian.tar.xz
            checksum: sha256:0f78f2df8d9de559f2fb6be93c899e27c5f53fe2149cefc0691ca98181d0d500
            path: ${source.dir}/libbluray_1.3.4-1.debian.tar.xz
            uid: 0
            gid: 0
      pipeline:
        - uses: dpkg/source@v1
          work-dir: ${source.dir}
          with:
            file: libbluray_1.3.4-1.dsc
            path: libbluray
        - uses: dpkg/bump@v1
          with:
            changelog:
              - DHI Rebuild
            version: 1:1.3.4-1+dhi0
        - name: wire openjdk tools on PATH
          runs: |
            set -eux -o pipefail

            mkdir -p /usr/local/bin
            jbindir=""
            jhome=""
            for d in /usr/lib/jvm/java-*/bin; do
              if [ -x "${d}/jar" ] && [ -x "${d}/java" ] && [ -x "${d}/javac" ] && [ -x "${d}/javadoc" ]; then
                jbindir="${d}"
                jhome="${d%/bin}"
                break
              fi
            done
            test -n "${jbindir}"
            for tool in java jar javac javadoc; do
              ln -sf "${jbindir}/${tool}" "/usr/local/bin/${tool}"
            done
            ln -sfn "${jhome}" /usr/lib/jvm/default-java
        - uses: dpkg/build@v1
          environment:
            JAVA_HOME: /usr/lib/jvm/default-java
            JDK_HOME: /usr/lib/jvm/default-java
          with:
            args: -uc -us -d
