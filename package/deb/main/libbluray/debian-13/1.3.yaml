  DEBIAN_DEBIAN_FILENAME: libbluray_1.3.4-1.debian.tar.xz
  DEBIAN_DEBIAN_URL: https://deb.debian.org/debian/pool/main/libb/libbluray/libbluray_1.3.4-1.debian.tar.xz
