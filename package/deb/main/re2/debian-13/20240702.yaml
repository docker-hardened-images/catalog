contents:
  packages:
    - '!base-files'
  builds:
    - name: re2 deb
      work-dir: ${source.dir}/re2
      contents:
        packages:
          - build-essential
          - debhelper
          - dh-python
          - dpkg-dev
          - libabsl-dev
          - libbenchmark-dev
          - libgtest-dev
          - pkgconf
          - pybuild-plugin-pyproject
          - python3
          - python3-absl
          - python3-all-dev
          - python3-pybind11
          - python3-setuptools
          - unicode-data
        files:
          - url: https://deb.debian.org/debian/pool/main/r/re2/re2_20240702-3.dsc
            checksum: sha256:2021430e93176817d300d424e363c073ddc4655e45b86d42193c3714b40238e9
            path: ${source.dir}/re2_20240702-3.dsc
            uid: 0
            gid: 0
          - url: https://deb.debian.org/debian/pool/main/r/re2/re2_20240702.orig.tar.gz
            checksum: sha256:eb2df807c781601c14a260a507a5bb4509be1ee626024cb45acbd57cb9d4032b
            path: ${source.dir}/re2_20240702.orig.tar.gz
            uid: 0
            gid: 0
          - url: https://deb.debian.org/debian/pool/main/r/re2/re2_20240702-3.debian.tar.xz
            checksum: sha256:ebe0bb1b9f14a9b16bb40a8729f9c5c7df98ef9a7883a5e78716fd377ec194ef
            path: ${source.dir}/re2_20240702-3.debian.tar.xz
            uid: 0
            gid: 0
      pipeline:
        - uses: dpkg/source@v1
          work-dir: ${source.dir}
          with:
            file: re2_20240702-3.dsc
            path: re2
        - name: adapt debian/rules for abseil and DHI CXXFLAGS
          runs: |
            set -eux -o pipefail

            sed -i 's/-std=c++14/-std=c++17/' debian/rules
            sed -i '/^export CXXFLAGS=/c\export CXXFLAGS=$(shell dpkg-buildflags --get CXXFLAGS | sed s/-O2/-O3/ | sed "s/-ftrivial-auto-var-init=zero//g; s/-fno-delete-null-pointer-checks//g; s/-fno-strict-overflow//g; s/-fno-strict-aliasing//g")' debian/rules
        - uses: dpkg/bump@v1
