contents:
  packages:
    - '!base-files'
  builds:
    - name: libtorrent-rasterbar deb
      work-dir: ${source.dir}/libtorrent-rasterbar
      contents:
        packages:
          - build-essential
          - cmake
          - debhelper
          - dh-python
          - dpkg-dev
          - graphviz
          - icoutils
          - imagemagick
          - libboost-python-dev
          - libboost-system-dev
          - libssl-dev
          - ninja-build
          - pkgconf
          - python3-aafigure
          - python3-dev
          - python3-docutils
          - python3-pygments
          - python3-setuptools
          - python3-sphinxcontrib.svg2pdfconverter
          - quilt
          - util-linux
        files:
          - url: https://deb.debian.org/debian/pool/main/libt/libtorrent-rasterbar/libtorrent-rasterbar_2.0.11-1.dsc
            checksum: sha256:a6981492d0c3fc8476d39e25bb492c978ab7a4b719899c8d90f0f035820a0962
            path: ${source.dir}/libtorrent-rasterbar_2.0.11-1.dsc
            uid: 0
            gid: 0
          - url: https://deb.debian.org/debian/pool/main/libt/libtorrent-rasterbar/libtorrent-rasterbar_2.0.11.orig.tar.xz
            checksum: sha256:78ab1f98874be1a10438734f7870d8bc3bd5289e1af527d68170ed055c1f56b2
            path: ${source.dir}/libtorrent-rasterbar_2.0.11.orig.tar.xz
            uid: 0
            gid: 0
          - url: https://deb.debian.org/debian/pool/main/libt/libtorrent-rasterbar/libtorrent-rasterbar_2.0.11-1.debian.tar.xz
            checksum: sha256:f135d6c964c1d198ee0d4bc0595d77c5743c7ce8f73a828ee4d71f1ba357f73c
            path: ${source.dir}/libtorrent-rasterbar_2.0.11-1.debian.tar.xz
            uid: 0
            gid: 0
      pipeline:
        - uses: dpkg/source@v1
          work-dir: ${source.dir}
          with:
            file: libtorrent-rasterbar_2.0.11-1.dsc
            path: libtorrent-rasterbar
        - uses: dpkg/bump@v1
          with:
            changelog:
              - DHI Rebuild
            version: 2.0.11-1+dhi0
        - name: register graphviz render plugins and imagemagick convert
          runs: |
            set -eux -o pipefail

            /usr/sbin/libgvc6-config-update -c
            printf 'digraph { a -> b }\n' | dot -Tpng -o /dev/null

            if ! command -v convert > /dev/null 2>&1; then
              ln -sf /usr/bin/convert-im7.q16 /usr/bin/convert
            fi

            command -v convert
        - uses: dpkg/build@v1
          with:
            args: -uc -us -d
