image: dhi.io/pkg-mysql-defaults
variant: runtime
tags:
  - 1.1.1-dhi0
  - 1.1.1-dhi0-debian13
platforms:
  - linux/amd64
  - linux/arm64
vars:
  DEBIAN_DEBIAN_FILENAME: ${DEBIAN_DEBIAN_URL:^.+/(.+)$}
  DEBIAN_DSC_CHECKSUM: sha256:4fd91907a56a2251e2e0dc0faa37c52299a2ae8d68e457cd250ac29d160090f1
  DEBIAN_DSC_FILENAME: mysql-defaults_1.1.1.dsc
