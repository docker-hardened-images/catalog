  DEBIAN_ORIG_FILENAME: mysql-defaults_1.1.1.tar.xz
  DEBIAN_ORIG_URL: https://deb.debian.org/debian/pool/main/m/mysql-defaults/mysql-defaults_1.1.1.tar.xz
  DEBIAN_VERSION: 1.1.1
  DHI_REL: "0"
  DHI_VERSION: 1.1.1+dhi0
  TAG_VERSION: 1.1.1-dhi0
  UPSTREAM_VERSION: 1.1.1
contents:
  packages:
    - '!base-files'
  builds:
    - name: mysql-defaults deb
      work-dir: ${source.dir}/mysql
      contents:
        packages:
          - build-essential
          - debhelper
          - dpkg-dev
        files:
          - url: https://deb.debian.org/debian/pool/main/m/mysql-defaults/mysql-defaults_1.1.1.dsc
            checksum: sha256:4fd91907a56a2251e2e0dc0faa37c52299a2ae8d68e457cd250ac29d160090f1
            path: ${source.dir}/mysql-defaults_1.1.1.dsc
            uid: 0
            gid: 0
          - url: https://deb.debian.org/debian/pool/main/m/mysql-defaults/mysql-defaults_1.1.1.tar.xz
            checksum: sha256:054d8da3bfd3419081a7ccb795ad614c235e8aa06674c5588cb88973467c1cdc
            path: ${source.dir}/mysql-defaults_1.1.1.tar.xz
            uid: 0
            gid: 0
      pipeline:
        - uses: dpkg/source@v1
          work-dir: ${source.dir}
          with:
            file: mysql-defaults_1.1.1.dsc
            path: mysql
            remove-original: false
        - name: remove upstream source artifacts
          work-dir: ${source.dir}
          runs: |
            set -eux -o pipefail

            rm mysql-defaults_1.1.1.dsc mysql-defaults_1.1.1.tar.xz
        - uses: dpkg/bump@v1
          with:
            changelog:
              - DHI Rebuild
            version: 1.1.1+dhi0
        - uses: dpkg/build@v1
          with:
            args: -uc -us -d
