contents:
  packages:
    - '!base-files'
  builds:
    - name: ros2-colcon-output deb
      work-dir: ${source.dir}/ros2-colcon-output
      contents:
        packages:
          - debhelper
          - dh-python
          - dpkg-dev
          - pylint
          - python3-all
          - python3-colcon-core
          - python3-flake8
          - python3-pep8-naming
          - python3-pytest
          - python3-pytest-cov
          - python3-setuptools
        files:
          - url: https://deb.debian.org/debian/pool/main/r/ros2-colcon-output/ros2-colcon-output_0.2.13-1.dsc
            checksum: sha256:197eea86bb445321b8614e79bf1d4f057c15453460d09c6c27e73146b94a0b01
            path: ${source.dir}/ros2-colcon-output_0.2.13-1.dsc
            uid: 0
            gid: 0
          - url: https://deb.debian.org/debian/pool/main/r/ros2-colcon-output/ros2-colcon-output_0.2.13.orig.tar.gz
            checksum: sha256:cb32bcf7a88761edc925bd76a1cd2f2f91c574d565ce1063e0b6f6c3d744647e
            path: ${source.dir}/ros2-colcon-output_0.2.13.orig.tar.gz
            uid: 0
            gid: 0
          - url: https://deb.debian.org/debian/pool/main/r/ros2-colcon-output/ros2-colcon-output_0.2.13-1.debian.tar.xz
            checksum: sha256:6265ca4623753b3b25b34466b22af36126255dd00e2aef0eab088e0cd0519ec8
            path: ${source.dir}/ros2-colcon-output_0.2.13-1.debian.tar.xz
            uid: 0
            gid: 0
      pipeline:
        - uses: dpkg/source@v1
          work-dir: ${source.dir}
          with:
            file: ros2-colcon-output_0.2.13-1.dsc
            path: ros2-colcon-output
        - name: use explicit Python install destinations
          runs: |
            set -eux -o pipefail

            python3 - << 'PY'
            from pathlib import Path

            path = Path("debian/rules")
            rules = path.read_text()
            marker = "%:\n"
            assert rules.count(marker) == 1
            override = (
                "override_dh_auto_install:\n"
                "\tpython3 setup.py install --root=$(CURDIR)/debian/python3-colcon-output --prefix=/usr "
                "--install-purelib=/usr/lib/python3/dist-packages "
                "--install-platlib=/usr/lib/python3/dist-packages --install-data=/usr --install-scripts=/usr/bin\n\n"
            )
            path.write_text(rules.replace(marker, override + marker))
            PY

            grep -Fq -- '--install-purelib=/usr/lib/python3/dist-packages' debian/rules
            grep -Fq -- '--install-scripts=/usr/bin' debian/rules
        - uses: dpkg/bump@v1
          with:
            changelog:
              - DHI Rebuild
            version: 0.2.13-1+deb13u0+dhi0
        - uses: dpkg/build@v1
          with:
            args: -uc -us -d
