contents:
  packages:
    - '!base-files'
  builds:
    - name: libjpeg-turbo deb
      work-dir: ${source.dir}/libjpeg-turbo
      contents:
        packages:
          - build-essential
          - cmake
          - debhelper
          - default-jdk
          - dpkg-dev
          - help2man
          - java-common
          - javahelper
          - nasm
        files:
          - url: https://deb.debian.org/debian/pool/main/libj/libjpeg-turbo/libjpeg-turbo_2.1.5-4.dsc
            checksum: sha256:26cbf22aa3b3e327df072513f14a5ddfb4a7b9a3d78c46a5dccfd711c13ac743
            path: ${source.dir}/libjpeg-turbo_2.1.5-4.dsc
            uid: 0
            gid: 0
          - url: https://deb.debian.org/debian/pool/main/libj/libjpeg-turbo/libjpeg-turbo_2.1.5.orig.tar.gz
            checksum: sha256:254f3642b04e309fee775123133c6464181addc150499561020312ec61c1bf7c
            path: ${source.dir}/libjpeg-turbo_2.1.5.orig.tar.gz
            uid: 0
            gid: 0
          - url: https://deb.debian.org/debian/pool/main/libj/libjpeg-turbo/libjpeg-turbo_2.1.5-4.debian.tar.xz
            checksum: sha256:739e7dc22904dccdc5ab105de57a6e4c1515c0e841e68226e6410ff4976e0e91
            path: ${source.dir}/libjpeg-turbo_2.1.5-4.debian.tar.xz
            uid: 0
            gid: 0
      pipeline:
        - uses: dpkg/source@v1
          work-dir: ${source.dir}
          with:
            file: libjpeg-turbo_2.1.5-4.dsc
            path: libjpeg-turbo
        - uses: dpkg/bump@v1
          with:
            changelog:
              - DHI Rebuild
            version: 1:2.1.5-4+dhi0
        - name: wire openjdk tools on PATH
          runs: |
            set -eux -o pipefail

            mkdir -p /usr/local/bin
            jbindir=""
            for d in /usr/lib/jvm/java-*/bin; do
              if [ -x "${d}/jar" ] && [ -x "${d}/java" ] && [ -x "${d}/javac" ] && [ -x "${d}/javadoc" ]; then
                jbindir="${d}"
                break
              fi
            done
            test -n "${jbindir}"
            for tool in java jar javac javadoc; do
              ln -sf "${jbindir}/${tool}" "/usr/local/bin/${tool}"
            done
        - uses: dpkg/build@v1
          with:
            args: -uc -us -d
