# syntax=dhi.io/build:2-debian13

image: dhi.io/pkg-qdrant
variant: runtime
tags:
  - 1.19.0-2
  - 1.19.0-2-debian13
platforms:
  - linux/amd64
  - linux/arm64
dates:
  release: "2023-02-08"
vars:
  COMMIT_SHA: 74f3e85b9473c62560006c043e13737ce6b48412
  DHI_REL: "2"
  DHI_VERSION: 1.19.0-2
  NODE_REFERENCE: dhi/pkg-node:24.19.0-debian13@sha256:814b2f1ac37ef600744343a4219619eefc9c0a6517272721958ba649515fac79
  RUST_REFERENCE: dhi/rust:1.97.1-debian13-dev@sha256:55b45ee1140ee74180b9d9fb1db2edfc55d7b93ee61edf7f19c573968cb6b617
  RUST_VERSION: 1.97.1
  VERSION: 1.19.0
  WEB_UI_COMMIT_SHA: d3f7a1174933ab637d9711ea45456d32b878b50e
  WEB_UI_VERSION: 0.2.16
contents:
  packages:
    - base-files
  builds:
    - name: qdrant
      uses: dhi.io/rust:1.97.1-debian13-dev@sha256:55b45ee1140ee74180b9d9fb1db2edfc55d7b93ee61edf7f19c573968cb6b617
      work-dir: ${source.dir}/qdrant-deb
      environment:
        GIT_COMMIT_ID: 74f3e85b9473c62560006c043e13737ce6b48412
      contents:
        packages:
          - bash
          - build-essential
          - cargo-auditable
          - ca-certificates
          - clang
          - cmake
          - coreutils
          - debhelper
          - dpkg-dev
          - findutils
          - git
          - libprotobuf-dev
          - libunwind-dev
          - lld
          - pkg-config
          - protobuf-compiler
          - sed
        files:
          - url: git+https://github.com/qdrant/qdrant.git#v1.19.0
            checksum: 74f3e85b9473c62560006c043e13737ce6b48412
            path: ${source.dir}/qdrant-src
            spdx:
              name: qdrant
              version: 1.19.0
              packages:
                - name: qdrant
                  purl: pkg:cargo/qdrant@1.19.0
                  license: Apache-2.0
            uid: 0
            gid: 0
          - url: git+https://github.com/qdrant/qdrant-web-ui.git#v0.2.16
            checksum: d3f7a1174933ab637d9711ea45456d32b878b50e
            path: ${source.dir}/qdrant-web-ui
            spdx:
              name: qdrant-web-ui
              version: 0.2.16
              packages:
                - name: qdrant-web-ui
                  purl: pkg:github/qdrant/qdrant-web-ui@0.2.16
                  license: Apache-2.0
            uid: 0
            gid: 0
        artifacts:
          - name: dhi.io/pkg-node:24.19.0-debian13@sha256:814b2f1ac37ef600744343a4219619eefc9c0a6517272721958ba649515fac79
            includes:
              - opt/nodejs
              - opt/npm
              - usr/local/bin/node
              - usr/local/bin/npm
            uid: 0
            gid: 0
      pipeline:
        - name: build web ui dashboard
          work-dir: ${source.dir}/qdrant-web-ui
          privileged: true
          runs: |
            set -eux -o pipefail

            npm pkg set dependencies.axios=^1.18.0
            npm pkg set \
              'overrides[tar]=7.5.19' \
              'overrides[js-yaml]=4.3.0'
            rm -f package-lock.json
            npm install --ignore-scripts
            npm run build-qdrant

            rm -rf node_modules
        - name: web ui sbom
          uses: sbom@v1
          with:
            extra-scanners: javascript-lock-cataloger
            prefix: qdrant-web-ui
            source: ${source.dir}/qdrant-web-ui
        - name: bump cargo dependencies
          work-dir: ${source.dir}/qdrant-src
          privileged: true
          runs: |
            set -eux -o pipefail

            # RUSTSEC-2026-0190: anyhow 1.0.102 -> 1.0.103
            cargo update --package anyhow --precise 1.0.103

            # RUSTSEC-2026-0204: crossbeam-epoch 0.9.18 -> 0.9.20
            cargo update --package crossbeam-epoch --precise 0.9.20

            # RUSTSEC-2026-0221: event-listener 5.4.1 -> 5.4.2
            cargo update --package event-listener --precise 5.4.2

            # RUSTSEC-2026-0186: memmap2 0.9.10 -> 0.9.11
            cargo update --package memmap2 --precise 0.9.11
        - name: build
          work-dir: ${source.dir}/qdrant-src
          privileged: true
          runs: |
            set -eux -o pipefail

            cargo auditable build --release --locked --bin qdrant --features deb,stacktrace

            install -D -m 0755 target/release/qdrant \
              '${source.dir}/qdrant-deb/payload/usr/bin/qdrant'
        - name: stage config
          work-dir: ${source.dir}/qdrant-src
          runs: |
            set -eux -o pipefail

            install -d '${source.dir}/qdrant-deb/payload/usr/share/qdrant/config'
            cp config/config.yaml '${source.dir}/qdrant-deb/payload/usr/share/qdrant/config/'
            cp config/production.yaml '${source.dir}/qdrant-deb/payload/usr/share/qdrant/config/'
        - name: vendor web ui dashboard
          runs: |
            set -eux -o pipefail

            install -d '${source.dir}/qdrant-deb/payload/usr/share/qdrant/static'
            cp -r '${source.dir}/qdrant-web-ui/dist/'* '${source.dir}/qdrant-deb/payload/usr/share/qdrant/static/'
            cp '${source.dir}/qdrant-src/docs/redoc/master/openapi.json' \
              '${source.dir}/qdrant-deb/payload/usr/share/qdrant/static/openapi.json'
        - uses: dpkg/bump@v1
          with:
            changelog:
              - DHI Build
            version: 1.19.0-2
        - uses: dpkg/build@v1
          privileged: true
          with:
            args: -b -uc -us -d
      paths:
        - type: directory
          path: ${source.dir}/qdrant-deb/debian
          uid: 0
          gid: 0
          mode: "0600"
          source: package/deb/main/qdrant/debian-13/debian
os-release:
  name: Docker Hardened Images (Debian)
  id: debian
  version-id: "13"
  version-codename: trixie
  pretty-name: Docker Hardened Images/Debian GNU/Linux 13 (trixie)
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
