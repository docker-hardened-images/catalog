image: dhi.io/pkg-grpc
variant: runtime
tags:
  - 1.51.1-6-dhi0
  - 1.51.1-6-dhi0-debian13
platforms:
  - linux/amd64
  - linux/arm64
vars:
  DEBIAN_DEBIAN_CHECKSUM: sha256:0a4f5e2b34812cddeac7504c9173eed35ea95163f7480e1252a65f5d86b95b94
  DEBIAN_DEBIAN_FILENAME: grpc_1.51.1-6.debian.tar.xz
  DEBIAN_DEBIAN_URL: https://deb.debian.org/debian/pool/main/g/grpc/grpc_1.51.1-6.debian.tar.xz
  DEBIAN_DSC_CHECKSUM: sha256:ba7c21a2833c9a4b483135bf2e8757e3fc88fa967413c6bf00fab40392f421c5
  DEBIAN_DSC_FILENAME: grpc_1.51.1-6.dsc
  DEBIAN_DSC_URL: https://deb.debian.org/debian/pool/main/g/grpc/grpc_1.51.1-6.dsc
  DEBIAN_FILENAME_VERSION: 1.51.1-6
  DEBIAN_ORIG_CHECKSUM: sha256:b55696fb249669744de3e71acc54a9382bea0dce7cd5ba379b356b12b82d4229
  DEBIAN_ORIG_FILENAME: grpc_1.51.1.orig.tar.gz
  DEBIAN_ORIG_URL: https://deb.debian.org/debian/pool/main/g/grpc/grpc_1.51.1.orig.tar.gz
  DEBIAN_VERSION: 1.51.1-6
  DHI_REL: "0"
  DHI_VERSION: 1.51.1-6+dhi0
  TAG_VERSION: 1.51.1-6-dhi0
  UPSTREAM_VERSION: 1.51.1
contents:
  packages:
    - '!base-files'
  builds:
    - name: grpc deb
      work-dir: ${source.dir}/grpc
      contents:
        packages:
          - build-essential
          - cmake
          - debhelper
          - dpkg-dev
          - googletest
          - libabsl-dev
          - libbenchmark-dev
          - libc-ares-dev
          - libgflags-dev
          - libgoogle-perftools-dev
          - libgtest-dev
          - libprotobuf-dev
          - libprotoc-dev
          - libre2-dev
          - libssl-dev
          - pkgconf
          - protobuf-compiler
          - quilt
          - util-linux
          - zlib1g-dev
        files:
          - url: https://deb.debian.org/debian/pool/main/g/grpc/grpc_1.51.1-6.dsc
            checksum: sha256:ba7c21a2833c9a4b483135bf2e8757e3fc88fa967413c6bf00fab40392f421c5
            path: ${source.dir}/grpc_1.51.1-6.dsc
            uid: 0
            gid: 0
          - url: https://deb.debian.org/debian/pool/main/g/grpc/grpc_1.51.1.orig.tar.gz
            checksum: sha256:b55696fb249669744de3e71acc54a9382bea0dce7cd5ba379b356b12b82d4229
            path: ${source.dir}/grpc_1.51.1.orig.tar.gz
            uid: 0
            gid: 0
          - url: https://deb.debian.org/debian/pool/main/g/grpc/grpc_1.51.1-6.debian.tar.xz
            checksum: sha256:0a4f5e2b34812cddeac7504c9173eed35ea95163f7480e1252a65f5d86b95b94
            path: ${source.dir}/grpc_1.51.1-6.debian.tar.xz
            uid: 0
            gid: 0
      pipeline:
        - uses: dpkg/source@v1
          work-dir: ${source.dir}
          with:
            file: grpc_1.51.1-6.dsc
            path: grpc
        - name: omit python3-grpcio and ruby binding binary packages
          runs: |
            set -eux -o pipefail

            sed -i \
              -e 's/export GRPC_PYTHON_ENABLE_DOCUMENTATION_BUILD = 1/export GRPC_PYTHON_ENABLE_DOCUMENTATION_BUILD = 0/' \
              -e '/dh_auto_configure -O--buildsystem=pybuild/d' \
              -e '/dh_auto_build -O--buildsystem=pybuild/d' \
              -e '/dh_auto_build -O--buildsystem=ruby/d' \
              -e '/dh_auto_install -O--buildsystem=pybuild/d' \
              -e '/TOPDIR=$(CURDIR)\/debian\/tmp\/usr\/lib/d' \
              -e '/dh_auto_install -O--buildsystem=ruby/d' \
              -e '/--with=python3/d' \
              -e 's/dh $@ --builddir=$(BUILD_SHARED_DIR) --buildsystem=cmake \\$/dh $@ --builddir=$(BUILD_SHARED_DIR) --buildsystem=cmake -Npython3-grpcio -Nruby-grpc -Nruby-grpc-tools/' \
              debian/rules
        - name: adapt debian/rules for abseil and DHI CXXFLAGS
          runs: |
            set -eux -o pipefail

            sed -i '/^export V=1/a export CXXFLAGS=$(shell dpkg-buildflags --get CXXFLAGS | sed s/-O2/-O3/ | sed "s/-ftrivial-auto-var-init=zero//g; s/-fno-delete-null-pointer-checks//g; s/-fno-strict-overflow//g; s/-fno-strict-aliasing//g")' debian/rules
        - uses: dpkg/bump@v1
          with:
            changelog:
              - DHI Rebuild
            version: 1.51.1-6+dhi0
        - uses: dpkg/build@v1
          environment:
            DEB_BUILD_PROFILES: nodoc
          with:
            args: -uc -us -d
os-release:
  name: Docker Hardened Images (Debian)
  id: debian
  version-id: "13"
  version-codename: trixie
  pretty-name: Docker Hardened Images/Debian GNU/Linux 13 (trixie)
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
