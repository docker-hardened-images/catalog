          - xmlto
        files:
          - url: https://deb.debian.org/debian/pool/main/libr/librabbitmq/librabbitmq_0.15.0-1+deb13u1.dsc
            checksum: sha256:d4a801822790c68a2c37ccb3650798545bc1ed58af31acd697c103f710e11f80
            path: ${source.dir}/librabbitmq_0.15.0-1+deb13u1.dsc
            uid: 0
            gid: 0
          - url: https://deb.debian.org/debian/pool/main/libr/librabbitmq/librabbitmq_0.15.0.orig.tar.gz
            checksum: sha256:7b652df52c0de4d19ca36c798ed81378cba7a03a0f0c5d498881ae2d79b241c2
            path: ${source.dir}/librabbitmq_0.15.0.orig.tar.gz
            uid: 0
            gid: 0
          - url: https://deb.debian.org/debian/pool/main/libr/librabbitmq/librabbitmq_0.15.0-1+deb13u1.debian.tar.xz
            checksum: sha256:66f27f57957c5a2b453f845155ae8435b851c1e202e6fab922e54e358076186b
            path: ${source.dir}/librabbitmq_0.15.0-1+deb13u1.debian.tar.xz
            uid: 0
            gid: 0
      pipeline:
        - uses: dpkg/source@v1
          work-dir: ${source.dir}
          with:
            file: librabbitmq_0.15.0-1+deb13u1.dsc
            path: librabbitmq
        - name: trim autopkgtest for hermetic testbed
          runs: |
            set -eux -o pipefail

            cat > debian/tests/control << 'EOF'
            Tests: upstream
            Depends:
             @,
             cmake,
             build-essential,
             libpopt-dev,
             libssl-dev,
             libtool,
             pkgconf,
            Restrictions: allow-stderr
            EOF
            cat > debian/tests/upstream << 'EOF'
            #!/bin/sh
            set -e
            SRC=$(pwd)
            cd "${AUTOPKGTEST_TMP}"
            cmake "${SRC}" -DBUILD_TOOLS=OFF -DBUILD_TOOLS_DOCS=OFF -DRUN_SYSTEM_TESTS=OFF
            cmake --build . -j"$(nproc)"
            ctest --output-on-failure
            EOF
            chmod +x debian/tests/upstream
        - uses: dpkg/bump@v1
          with:
            changelog:
              - DHI Rebuild
            version: 0.15.0-1+deb13u1+dhi1
        - uses: dpkg/build@v1
