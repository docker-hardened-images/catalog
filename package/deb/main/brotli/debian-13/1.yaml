# syntax=dhi.io/build:2-debian13

image: dhi.io/pkg-brotli
variant: runtime
tags:
  - 1.1.0-2-deb13u1-dhi2
  - 1.1.0-2-deb13u1-dhi2-debian13
platforms:
  - linux/amd64
  - linux/arm64
vars:
  DEBIAN_DEBIAN_CHECKSUM: sha256:848994612c6eb5e413d7df0e307ec7661855f5383c8cd10507e890fb7ee809ff
  DEBIAN_DEBIAN_FILENAME: brotli_1.1.0-2+deb13u1.debian.tar.xz
  DEBIAN_DEBIAN_URL: https://deb.debian.org/debian/pool/main/b/brotli/brotli_1.1.0-2+deb13u1.debian.tar.xz
  DEBIAN_DSC_CHECKSUM: sha256:64a1cd7422150e5c639d9892d6ffa837438b341f521e68ac4e75f6ef4eca49a2
  DEBIAN_DSC_FILENAME: brotli_1.1.0-2+deb13u1.dsc
  DEBIAN_DSC_URL: https://deb.debian.org/debian/pool/main/b/brotli/brotli_1.1.0-2+deb13u1.dsc
  DEBIAN_FILENAME_VERSION: 1.1.0-2+deb13u1
  DEBIAN_ORIG_CHECKSUM: sha256:10973f4b4199eafa1d5735ef661ddb2ec2f97319ee9fd1824d4aabe08cff5265
  DEBIAN_ORIG_FILENAME: brotli_1.1.0.orig.tar.gz
  DEBIAN_ORIG_URL: https://deb.debian.org/debian/pool/main/b/brotli/brotli_1.1.0.orig.tar.gz
  DEBIAN_VERSION: 1.1.0-2+deb13u1
  DHI_REL: "2"
  DHI_VERSION: 1.1.0-2+deb13u1+dhi2
  TAG_VERSION: 1.1.0-2-deb13u1-dhi2
  UPSTREAM_VERSION: 1.1.0
contents:
  packages:
    - '!base-files'
  builds:
    - name: brotli deb
      work-dir: ${source.dir}/brotli
      contents:
        packages:
          - build-essential
          - cmake
          - debhelper
          - dh-python
          - dpkg-dev
          - libpython3-all-dev
          - mawk
          - python3-all-dev
          - python3-setuptools
          - util-linux
        files:
          - url: https://deb.debian.org/debian/pool/main/b/brotli/brotli_1.1.0-2+deb13u1.dsc
            checksum: sha256:64a1cd7422150e5c639d9892d6ffa837438b341f521e68ac4e75f6ef4eca49a2
            path: ${source.dir}/brotli_1.1.0-2+deb13u1.dsc
            uid: 0
            gid: 0
          - url: https://deb.debian.org/debian/pool/main/b/brotli/brotli_1.1.0.orig.tar.gz
            checksum: sha256:10973f4b4199eafa1d5735ef661ddb2ec2f97319ee9fd1824d4aabe08cff5265
            path: ${source.dir}/brotli_1.1.0.orig.tar.gz
            uid: 0
            gid: 0
          - url: https://deb.debian.org/debian/pool/main/b/brotli/brotli_1.1.0-2+deb13u1.debian.tar.xz
            checksum: sha256:848994612c6eb5e413d7df0e307ec7661855f5383c8cd10507e890fb7ee809ff
            path: ${source.dir}/brotli_1.1.0-2+deb13u1.debian.tar.xz
            uid: 0
            gid: 0
      pipeline:
        - uses: dpkg/source@v1
          work-dir: ${source.dir}
          with:
            file: brotli_1.1.0-2+deb13u1.dsc
            path: brotli
        - uses: dpkg/patch@v1
          with:
            apply: true
            patches:
              - ${source.dir}/patch/dhi-cve-2025-6176-size-limit-buffer.patch
              - ${source.dir}/patch/dhi-cve-2025-6176-python-max-length.patch
        - name: run python brotli regression tests
          runs: |
            set -eux -o pipefail

            testroot=$(mktemp -d)
            mkdir -p "${testroot}/testdata"
            cp "${source.dir}/patch/testdata/zerosukkanooa" "${testroot}/testdata/"
            cp "${source.dir}/patch/testdata/zerosukkanooa.compressed" "${testroot}/testdata/"
            python3 setup.py build_ext --inplace
            cd python
            BROTLI_TESTS_PATH="${testroot}" PYTHONPATH=. python3 -m unittest -v tests.decompressor_test
            cd ..
            rm -rf "${testroot}"
            find python -name '_brotli*.so' -delete
        - name: install Python bindings to dist-packages
          runs: |
            set -eux -o pipefail

            python3 - << 'PY'
            from pathlib import Path

            path = Path("debian/rules")
            rules = path.read_text()
            old = "override_dh_auto_install:\n\tdh_auto_install\n\tdh_auto_install --buildsystem=cmake\n"
            new = (
                "override_dh_auto_install:\n"
                "\tpython3 setup.py install --root=$(CURDIR)/debian/python3-brotli --prefix=/usr "
                "--install-purelib=/usr/lib/python3/dist-packages "
                "--install-platlib=/usr/lib/python3/dist-packages --install-data=/usr --install-scripts=/usr/bin\n"
                "\tdh_auto_install --buildsystem=cmake\n"
            )
            assert rules.count(old) == 1
            path.write_text(rules.replace(old, new))
            PY

            grep -Fq -- '--install-purelib=/usr/lib/python3/dist-packages' debian/rules
            grep -Fq -- 'dh_auto_install --buildsystem=cmake' debian/rules
        - uses: dpkg/bump@v1
          with:
            changelog:
              - Backport upstream fixes for CVE-2025-6176
            version: 1.1.0-2+deb13u1+dhi2
        - uses: dpkg/build@v1
          with:
            args: -uc -us -d
      paths:
        - type: file
          path: ${source.dir}/patch/dhi-cve-2025-6176-size-limit-buffer.patch
          uid: 0
          gid: 0
          source: package/deb/main/brotli/patch/dhi-cve-2025-6176-size-limit-buffer.patch
        - type: file
          path: ${source.dir}/patch/dhi-cve-2025-6176-python-max-length.patch
          uid: 0
          gid: 0
          source: package/deb/main/brotli/patch/dhi-cve-2025-6176-python-max-length.patch
        - type: file
          path: ${source.dir}/patch/testdata/zerosukkanooa
          uid: 0
          gid: 0
          source: package/deb/main/brotli/patch/testdata/zerosukkanooa
        - type: file
          path: ${source.dir}/patch/testdata/zerosukkanooa.compressed
          uid: 0
          gid: 0
          source: package/deb/main/brotli/patch/testdata/zerosukkanooa.compressed
os-release:
  name: Docker Hardened Images (Debian)
  id: debian
  version-id: "13"
  version-codename: trixie
  pretty-name: Docker Hardened Images/Debian GNU/Linux 13 (trixie)
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
