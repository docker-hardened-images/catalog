contents:
  packages:
    - '!base-files'
  builds:
    - name: thrift deb
      work-dir: ${source.dir}/thrift
      contents:
        packages:
          - bison
          - build-essential
          - bundler
          - debhelper
          - dh-golang
          - dh-python
          - dpkg-dev
          - flex
          - gem2deb
          - golang-github-golang-mock-dev
          - golang-go
          - golang-golang-x-net-dev
          - libbit-vector-perl
          - libboost-all-dev
          - libclass-accessor-perl
          - libevent-dev
          - libglib2.0-dev
          - libssl-dev
          - libtest-exception-perl
          - perl
          - php-dev
          - php8.4-cli
          - php8.4-dev
          - phpunit
          - pkg-php-tools
          - python3-all-dev
          - python3-setuptools
          - python3-six
          - qtbase5-dev
          - rake
          - ruby
          - ruby-daemons
          - ruby-dev
          - ruby-diff-lcs
          - ruby-eventmachine
          - ruby-rack
          - ruby-rack-test
          - ruby-rspec
          - ruby-rspec-core
          - ruby-rspec-expectations
          - ruby-rspec-mocks
          - util-linux
          - zlib1g-dev
        files:
          - url: https://deb.debian.org/debian/pool/main/t/thrift/thrift_0.19.0-4.dsc
            checksum: sha256:c5d11d82fa11548c401798fa4017ea90f59365e1df2ca340f7777b6f827d72be
            path: ${source.dir}/thrift_0.19.0-4.dsc
            uid: 0
            gid: 0
          - url: https://deb.debian.org/debian/pool/main/t/thrift/thrift_0.19.0.orig.tar.gz
            checksum: sha256:d49c896c2724a78701e05cfccf6cf70b5db312d82a17efe951b441d300ccf275
            path: ${source.dir}/thrift_0.19.0.orig.tar.gz
            uid: 0
            gid: 0
          - url: https://deb.debian.org/debian/pool/main/t/thrift/thrift_0.19.0.orig.tar.gz.asc
            checksum: sha256:e21c7799a51f21e5e127e2dcb9f7a0b33baf98e0da7f8663c3d0d579962f8859
            path: ${source.dir}/thrift_0.19.0.orig.tar.gz.asc
            uid: 0
            gid: 0
          - url: https://deb.debian.org/debian/pool/main/t/thrift/thrift_0.19.0-4.debian.tar.xz
            checksum: sha256:efa98f7e70e5233b1353eb895fecfaf7f9c1a947ae3ee814022979c0cfafad29
            path: ${source.dir}/thrift_0.19.0-4.debian.tar.xz
            uid: 0
            gid: 0
      pipeline:
        - uses: dpkg/source@v1
          work-dir: ${source.dir}
          with:
            file: thrift_0.19.0-4.dsc
            path: thrift
        - uses: dpkg/bump@v1
          with:
            changelog:
              - DHI Rebuild
            version: 0.19.0-4+dhi0
        - name: symlink php tooling for debian build
          runs: |
            set -eux -o pipefail
            if ! command -v php >/dev/null 2>&1; then
              ln -sf "$(command -v php8.4)" /usr/bin/php
            fi
            if ! command -v phpize >/dev/null 2>&1; then
              ln -sf "$(command -v phpize8.4)" /usr/bin/phpize
            fi
            if ! command -v php-config >/dev/null 2>&1; then
              ln -sf "$(command -v php-config8.4)" /usr/bin/php-config
            fi
        - uses: dpkg/build@v1
          with:
            args: -uc -us -d
os-release:
  name: Docker Hardened Images (Debian)
  id: debian
  version-id: "13"
  version-codename: trixie
  pretty-name: Docker Hardened Images/Debian GNU/Linux 13 (trixie)
  home-url: https://docker.com/products/hardened-images/
