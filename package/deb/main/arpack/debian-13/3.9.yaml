# syntax=dhi.io/build:2-debian13

image: dhi.io/pkg-arpack
variant: runtime
tags:
  - 3.9.1-6-deb13u0-dhi0
  - 3.9.1-6-deb13u0-dhi0-debian13
platforms:
  - linux/amd64
  - linux/arm64
vars:
  DEBIAN_DEBIAN_CHECKSUM: sha256:8b6112500d691eb94ebddea49f58a20274558ee30b8773250ec55dd07a908d9e
  DEBIAN_DEBIAN_FILENAME: arpack_3.9.1-6.debian.tar.xz
  DEBIAN_DEBIAN_URL: https://deb.debian.org/debian/pool/main/a/arpack/arpack_3.9.1-6.debian.tar.xz
  DEBIAN_DSC_CHECKSUM: sha256:9df92eff7ddb384777a13bea3a81907b804b803c757de9d8e9da97b1bf34d70b
  DEBIAN_DSC_FILENAME: arpack_3.9.1-6.dsc
  DEBIAN_DSC_URL: https://deb.debian.org/debian/pool/main/a/arpack/arpack_3.9.1-6.dsc
  DEBIAN_FILENAME_VERSION: 3.9.1-6
  DEBIAN_ORIG_CHECKSUM: sha256:f6641deb07fa69165b7815de9008af3ea47eb39b2bb97521fbf74c97aba6e844
  DEBIAN_ORIG_FILENAME: arpack_3.9.1.orig.tar.gz
  DEBIAN_ORIG_URL: https://deb.debian.org/debian/pool/main/a/arpack/arpack_3.9.1.orig.tar.gz
  DEBIAN_VERSION: 3.9.1-6
  DHI_REL: "0"
  DHI_VERSION: 3.9.1-6+deb13u0+dhi0
  TAG_VERSION: 3.9.1-6-deb13u0-dhi0
  UPSTREAM_VERSION: 3.9.1
contents:
  packages:
    - '!base-files'
  builds:
    - name: arpack deb
      work-dir: ${source.dir}/arpack
      contents:
        packages:
          - build-essential
          - cmake
          - debhelper
          - dpkg-dev
          - gfortran
          - libblas-dev
          - libblas64-dev
          - libeigen3-dev
          - liblapack-dev
          - liblapack64-dev
          - mawk
          - mpi-default-dev
        files:
          - url: https://deb.debian.org/debian/pool/main/a/arpack/arpack_3.9.1-6.dsc
            checksum: sha256:9df92eff7ddb384777a13bea3a81907b804b803c757de9d8e9da97b1bf34d70b
            path: ${source.dir}/arpack_3.9.1-6.dsc
            uid: 0
            gid: 0
          - url: https://deb.debian.org/debian/pool/main/a/arpack/arpack_3.9.1.orig.tar.gz
            checksum: sha256:f6641deb07fa69165b7815de9008af3ea47eb39b2bb97521fbf74c97aba6e844
            path: ${source.dir}/arpack_3.9.1.orig.tar.gz
            uid: 0
            gid: 0
          - url: https://deb.debian.org/debian/pool/main/a/arpack/arpack_3.9.1-6.debian.tar.xz
            checksum: sha256:8b6112500d691eb94ebddea49f58a20274558ee30b8773250ec55dd07a908d9e
            path: ${source.dir}/arpack_3.9.1-6.debian.tar.xz
            uid: 0
            gid: 0
      pipeline:
        - uses: dpkg/source@v1
          work-dir: ${source.dir}
          with:
            file: arpack_3.9.1-6.dsc
            path: arpack
        - uses: dpkg/bump@v1
          with:
            changelog:
              - DHI Rebuild
            version: 3.9.1-6+deb13u0+dhi0
        - name: wire BLAS/LAPACK dev selectors (DHI installer skips alternatives postinst)
          runs: |
            set -eux -o pipefail

            multiarch="$(dpkg-architecture -qDEB_HOST_MULTIARCH)"
            update-alternatives --install "/usr/lib/${multiarch}/libblas.so" "libblas.so-${multiarch}" "/usr/lib/${multiarch}/blas/libblas.so" 10
            update-alternatives --install "/usr/lib/${multiarch}/liblapack.so" "liblapack.so-${multiarch}" "/usr/lib/${multiarch}/lapack/liblapack.so" 10
            update-alternatives --install "/usr/lib/${multiarch}/libblas64.so" "libblas64.so-${multiarch}" "/usr/lib/${multiarch}/blas64/libblas64.so" 10
            update-alternatives --install "/usr/lib/${multiarch}/liblapack64.so" "liblapack64.so-${multiarch}" "/usr/lib/${multiarch}/lapack64/liblapack64.so" 10
            update-alternatives --install "/usr/lib/${multiarch}/libblas.so.3" "libblas.so.3-${multiarch}" "/usr/lib/${multiarch}/blas/libblas.so.3" 10
            update-alternatives --install "/usr/lib/${multiarch}/liblapack.so.3" "liblapack.so.3-${multiarch}" "/usr/lib/${multiarch}/lapack/liblapack.so.3" 10
            update-alternatives --install "/usr/lib/${multiarch}/libblas64.so.3" "libblas64.so.3-${multiarch}" "/usr/lib/${multiarch}/blas64/libblas64.so.3" 10
            update-alternatives --install "/usr/lib/${multiarch}/liblapack64.so.3" "liblapack64.so.3-${multiarch}" "/usr/lib/${multiarch}/lapack64/liblapack64.so.3" 10
        - name: register openmpi wrapper alternatives (incl. Fortran mpif77/mpif90)
          runs: |
            set -eux -o pipefail

            update-alternatives --install /usr/bin/mpirun mpirun /usr/bin/mpirun.openmpi 50 \
              --slave /usr/share/man/man1/mpirun.1.gz mpirun.1.gz /usr/share/man/man1/mpirun.openmpi.1.gz \
              --slave /usr/bin/mpiexec mpiexec /usr/bin/mpiexec.openmpi \
              --slave /usr/share/man/man1/mpiexec.1.gz mpiexec.1.gz /usr/share/man/man1/mpiexec.openmpi.1.gz

            update-alternatives --install /usr/bin/mpicc mpi /usr/bin/mpicc.openmpi 50 \
              --slave /usr/bin/mpic++ mpic++ /usr/bin/mpic++.openmpi \
              --slave /usr/bin/mpicxx mpicxx /usr/bin/mpic++.openmpi \
              --slave /usr/bin/mpiCC mpiCC /usr/bin/mpic++.openmpi \
              --slave /usr/bin/mpif77 mpif77 /usr/bin/mpif77.openmpi \
              --slave /usr/bin/mpif90 mpif90 /usr/bin/mpif90.openmpi \
              --slave /usr/bin/mpifort mpifort /usr/bin/mpifort.openmpi

            command -v mpif77
            mpif77 --version
        - uses: dpkg/build@v1
          environment:
            OMPI_ALLOW_RUN_AS_ROOT: "1"
            OMPI_ALLOW_RUN_AS_ROOT_CONFIRM: "1"
          with:
            args: -uc -us -d
os-release:
  name: Docker Hardened Images (Debian)
  id: debian
  version-id: "13"
  version-codename: trixie
  pretty-name: Docker Hardened Images/Debian GNU/Linux 13 (trixie)
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
