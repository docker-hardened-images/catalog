image: dhi.io/pkg-ocl-icd
variant: runtime
tags:
  - 2.3.3-1-dhi0
  - 2.3.3-1-dhi0-debian13
platforms:
  - linux/amd64
  - linux/arm64
vars:
  DEBIAN_DEBIAN_CHECKSUM: sha256:e74e0abbe754ac7cce79cd9c633c3bba322bf3ca69e7df16236b525ec5bce565
  DEBIAN_DEBIAN_FILENAME: ocl-icd_2.3.3-1.debian.tar.xz
  DEBIAN_DEBIAN_URL: https://deb.debian.org/debian/pool/main/o/ocl-icd/ocl-icd_2.3.3-1.debian.tar.xz
  DEBIAN_DSC_CHECKSUM: sha256:db19183087770ac58367d70c3427bf53fc3fbb61872d4ca82f3da47ecc1a46e3
  DEBIAN_DSC_FILENAME: ocl-icd_2.3.3-1.dsc
  DEBIAN_DSC_URL: https://deb.debian.org/debian/pool/main/o/ocl-icd/ocl-icd_2.3.3-1.dsc
  DEBIAN_FILENAME_VERSION: 2.3.3-1
  DEBIAN_ORIG_CHECKSUM: sha256:8cd8e8e129db3081a64090fc1252bec39dc88cdb7b3f929315e014b75069bd9d
  DEBIAN_ORIG_FILENAME: ocl-icd_2.3.3.orig.tar.gz
  DEBIAN_ORIG_URL: https://deb.debian.org/debian/pool/main/o/ocl-icd/ocl-icd_2.3.3.orig.tar.gz
