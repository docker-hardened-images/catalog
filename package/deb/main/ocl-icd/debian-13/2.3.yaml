  DHI_REL: "0"
  DHI_VERSION: 2.3.3-1+dhi0
  TAG_VERSION: 2.3.3-1-dhi0
  UPSTREAM_VERSION: 2.3.3
contents:
  packages:
    - '!base-files'
  builds:
    - name: ocl-icd deb
      work-dir: ${source.dir}/ocl-icd
      contents:
        packages:
          - asciidoc
          - autoconf
          - automake
          - build-essential
          - debhelper
          - docbook-xml
          - docbook-xsl
          - dpkg-dev
          - faketime
          - libtool
          - libxml2-utils
          - ruby
          - util-linux
          - xmlto
        files:
          - url: https://deb.debian.org/debian/pool/main/o/ocl-icd/ocl-icd_2.3.3-1.dsc
            checksum: sha256:db19183087770ac58367d70c3427bf53fc3fbb61872d4ca82f3da47ecc1a46e3
            path: ${source.dir}/ocl-icd_2.3.3-1.dsc
            uid: 0
            gid: 0
          - url: https://deb.debian.org/debian/pool/main/o/ocl-icd/ocl-icd_2.3.3.orig.tar.gz
            checksum: sha256:8cd8e8e129db3081a64090fc1252bec39dc88cdb7b3f929315e014b75069bd9d
            path: ${source.dir}/ocl-icd_2.3.3.orig.tar.gz
            uid: 0
            gid: 0
          - url: https://deb.debian.org/debian/pool/main/o/ocl-icd/ocl-icd_2.3.3-1.debian.tar.xz
            checksum: sha256:e74e0abbe754ac7cce79cd9c633c3bba322bf3ca69e7df16236b525ec5bce565
            path: ${source.dir}/ocl-icd_2.3.3-1.debian.tar.xz
            uid: 0
            gid: 0
      pipeline:
        - uses: dpkg/source@v1
          work-dir: ${source.dir}
          with:
            file: ocl-icd_2.3.3-1.dsc
            path: ocl-icd
        - uses: dpkg/bump@v1
          with:
            changelog:
              - DHI Rebuild
            version: 2.3.3-1+dhi0
        - name: bootstrap xml catalogs for offline docbook
          runs: |
            set -eux -o pipefail

            mkdir -p /etc/xml
            if [ ! -e /etc/xml/catalog ]; then
              xmlcatalog --noout --create /etc/xml/catalog
            fi
            xmlcatalog --noout --add nextCatalog "" file:///usr/share/xml/docbook/schema/dtd/4.5/catalog.xml /etc/xml/catalog
            xmlcatalog --noout --add nextCatalog "" file:///usr/share/xml/docbook/stylesheet/docbook-xsl/catalog.xml /etc/xml/catalog
        - uses: dpkg/build@v1
          environment:
            XML_CATALOG_FILES: /etc/xml/catalog /usr/share/xml/docbook/stylesheet/docbook-xsl/catalog.xml /usr/share/xml/docbook/schema/dtd/4.5/catalog.xml
          with:
            args: -uc -us -d
os-release:
  name: Docker Hardened Images (Debian)
  id: debian
  version-id: "13"
  version-codename: trixie
  pretty-name: Docker Hardened Images/Debian GNU/Linux 13 (trixie)
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
