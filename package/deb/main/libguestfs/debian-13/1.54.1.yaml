            checksum: sha256:b82931c269dfc9f8af6d916afcbfbe2cfff0ca661d4e4a73369e35a52c62a0f4
            path: ${source.dir}/libguestfs_1.54.1-2+deb13u1.debian.tar.xz
            uid: 0
            gid: 0
      pipeline:
        - uses: dpkg/source@v1
          work-dir: ${source.dir}
          with:
            file: libguestfs_1.54.1-2+deb13u1.dsc
            path: libguestfs
        - uses: dpkg/bump@v1
          with:
            changelog:
              - DHI Rebuild
            version: 1:1.54.1-2+deb13u1+dhi0
        - name: drop unused language binding packages
          runs: |
            set -eux -o pipefail

            awk -v RS="" -v ORS="\n\n" '
              BEGIN {
                n = split("python3-guestfs libguestfs-java ruby-guestfs libguestfs-gobject-1.0-0t64 libguestfs-gobject-dev gir1.2-guestfs-1.0 lua-guestfs golang-guestfs-dev php-guestfs", arr, " ")
                for (i = 1; i <= n; i++) drop[arr[i]] = 1
              }
              {
                split($0, lines, "\n")
                pkg = lines[1]
                sub(/^Package: /, "", pkg)
                if (!(lines[1] ~ /^Package: /) || !(pkg in drop)) print
              }
            ' debian/control > debian/control.new
            mv debian/control.new debian/control

            sed -i 's/--with=ocaml,python3,bash-completion,ruby,gir,lua,php/--with=ocaml,bash-completion/' debian/rules
            sed -i '/^override_dh_php:/,/^\tdh_php -p php-guestfs$/d' debian/rules
            sed -i '/^override_dh_python3:/,/^\tdh_python3 -p python3-guestfs$/d' debian/rules

            cat >> debian/not-installed << 'EOF'
            usr/include/guestfs-gobject.h
            usr/include/guestfs-gobject/*
            usr/lib/python3/*
            usr/lib/ruby/*
            usr/lib/*/ruby/*
            usr/lib/*/girepository-1.0/*
            usr/lib/*/jni/*
            usr/lib/*/libguestfs-gobject-1.0.*
            usr/lib/*/lua/*
            usr/share/gir-1.0/*
            usr/share/java/*
            usr/share/javadoc/*
            usr/share/man/*/man3/guestfs-golang.3
            usr/share/man/*/man3/guestfs-java.3
            usr/share/man/*/man3/guestfs-lua.3
            usr/share/man/*/man3/guestfs-python.3
            usr/share/man/*/man3/guestfs-ruby.3
            usr/share/man/man3/guestfs-gobject.3
            usr/share/man/man3/guestfs-golang.3
            usr/share/man/man3/guestfs-java.3
            usr/share/man/man3/guestfs-lua.3
            usr/share/man/man3/guestfs-python.3
            usr/share/man/man3/guestfs-ruby.3
            EOF
        - name: build ldconfig cache
          runs: |
            set -eux -o pipefail

            ldconfig
        - uses: dpkg/build@v1
          with:
            args: -uc -us -d
            options: nocheck
