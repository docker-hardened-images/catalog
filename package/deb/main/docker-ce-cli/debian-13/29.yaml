# syntax=dhi.io/build:2-debian13

image: dhi.io/pkg-docker-ce-cli
variant: runtime
tags:
  - 29.6.2
  - 29.6.2-r2
  - 29.6.2-debian13
  - 29.6.2-r2-debian13
platforms:
  - linux/amd64
  - linux/arm64
dates:
  release: "2026-07-16"
vars:
  COMMIT_SHA: dfc4efb1e2ab8c06d70d2a1366ad448d2f917e90
  GOLANG_MAJOR_MINOR_VERSION: "1.26"
  GOLANG_VERSION: 1.26.5-0
  REL: "2"
  SEMVER_MAJOR_MINOR_VERSION: "29.6"
  SEMVER_MAJOR_VERSION: "29"
  SEMVER_VERSION: 29.6.2
  VERSION: 29.6.2
contents:
  packages:
    - base-files
  builds:
    - name: docker-ce-cli deb
      work-dir: /go/src/github.com/docker/cli
      caches:
        - path: /go/pkg/mod
      contents:
        repositories:
          - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
        keyring:
          - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
        packages:
          - bash
          - ca-certificates-bundle
          - coreutils
          - findutils
          - gcc
          - golang-1.26=1.26.5-0
          - golang-1.26-oci-config=1.26.5-0
          - libc6-dev
        files:
          - url: git+https://github.com/docker/cli.git#v29.6.2
            checksum: dfc4efb1e2ab8c06d70d2a1366ad448d2f917e90
            path: /go/src/github.com/docker/cli
            spdx:
              name: docker-cli
              version: 29.6.2
              packages:
                - name: docker-cli
                  purl: pkg:golang/github.com/docker/cli@29.6.2
                  license: Apache-2.0
            uid: 0
            gid: 0
      pipeline:
        - name: prepare docker cli go module
          runs: |
            set -eux -o pipefail

            ln -sf vendor.mod go.mod
            ln -sf vendor.sum go.sum
        - name: update docker cli go dependencies
          uses: go/bump@v2
          with:
            deps:
              - github.com/klauspost/compress@v1.18.7
              - golang.org/x/net@v0.57.0
              - golang.org/x/text@v0.40.0
              - google.golang.org/grpc@v1.83.0
            download: true
        - name: test docker cli after dependency updates
          runs: |
            set -eux -o pipefail

            CGO_ENABLED=1 go test -count=1 -timeout=5m -tags grpcnotrace ./cmd/docker
        - name: build docker cli
          uses: go/build@v1
          with:
            cgo_enabled: 1
            extra-args: -buildmode=pie
            ldflags:
              - -X github.com/docker/cli/cli/version.GitCommit=dfc4efb1e2ab8c06d70d2a1366ad448d2f917e90
              - -X github.com/docker/cli/cli/version.BuildTime=$(date -ud @${SOURCE_DATE_EPOCH} +'%Y-%m-%dT%H:%M:%SZ')
              - -X github.com/docker/cli/cli/version.Version=29.6.2
            output: ${target.dir}/usr/bin/docker
            packages: ./cmd/docker
            tags: grpcnotrace
        - uses: dhi/build-pkg:0
          with:
            conflicts: docker-cli, docker.io
            depends:
              - libc6
            description: Docker CLI open-source application container engine
            files:
              - usr/bin/docker
            formats:
              - deb
            license: Apache-2.0
            name: docker-ce-cli
            rel: 2
            url: https://www.docker.com/
            version: 5:29.6.2
os-release:
  name: Docker Hardened Images (Debian)
  id: debian
  version-id: "13"
  version-codename: trixie
  pretty-name: Docker Hardened Images/Debian GNU/Linux 13 (trixie)
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
