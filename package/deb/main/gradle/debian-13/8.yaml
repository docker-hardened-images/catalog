# syntax=dhi.io/build:2-debian13

image: dhi.io/pkg-gradle
variant: runtime
tags:
  - 8.14.6-4
  - 8.14.6-4-debian13
platforms:
  - linux/amd64
vars:
  COMMIT_SHA: 88c80c1459b75a6d077d24eebe7905ffa3e1293f
  DHI_REL: "4"
  DHI_VERSION: 8.14.6-4
  JDK_MAJOR_VERSION: "17"
  JDK_VERSION: 17.0.19.10-0
  PACKAGE_NAME: gradle-8
  SEMVER_MAJOR_VERSION: "8"
  VERSION: 8.14.6
contents:
  packages:
    - '!base-files'
  builds:
    - name: gradle-8 deb
      work-dir: ${source.dir}/gradle
      contents:
        repositories:
          - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
        keyring:
          - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
        packages:
          - debhelper
          - dpkg-dev
          - eclipse-temurin-17-jdk=17.0.19.10-0
          - git
          - quilt
          - unzip
        files:
          - url: git+https://github.com/gradle/gradle.git#v8.14.6
            checksum: 88c80c1459b75a6d077d24eebe7905ffa3e1293f
            path: ${source.dir}/gradle
            uid: 0
            gid: 0
      pipeline:
        - name: setup
          runs: |
            set -eux -o pipefail

            sed -i -e "s/@PACKAGE_NAME@/gradle-8/g" \
              -e "s/@VERSION@/8.14.6/g" \
              -e "s/@SEMVER_MAJOR_VERSION@/8/g" \
              -e "s/@JDK_MAJOR_VERSION@/17/g" \
              debian/control.in debian/changelog debian/gradle.install.in debian/rules
            mv debian/control.in debian/control
            mv debian/gradle.install.in "debian/gradle-8.install"
            mkdir -p debian/patches
        - uses: patch@v1
          work-dir: ${source.dir}/gradle
          with:
            options: -p1
            patches:
              - ${source.dir}/patch/0002-Update-org.eclipse.jgit-org.eclipse.jgit-7.2.1.2025.patch
              - ${source.dir}/patch/0008-8-Update-com.google.guava-guava-33.7.2-jre.patch
        - uses: dpkg/bump@v1
          with:
            changelog:
              - Bump com.google.guava guava to 33.7.2-jre for CVE-2026-102554 (incl. java-api-extractor runtime pin); drop the guava-33.4.6-jre filename alias
            version: 8.14.6-4
        - name: configure gradle maven central mirror
          runs: |
            set -eux -o pipefail

            mkdir -p /root/.gradle/init.d
            cat > /root/.gradle/init.d/maven-central-mirror.gradle << 'EOF'
            def mavenCentralMirror = uri("https://maven-central.storage-download.googleapis.com/maven2/")

            def mirrorMavenCentral = { repo ->
                if (repo instanceof org.gradle.api.artifacts.repositories.MavenArtifactRepository
                        && (repo.url.host == "repo.maven.apache.org"
                            || repo.url.host == "repo1.maven.org")) {
                    repo.setUrl(mavenCentralMirror)
                }
            }

            beforeSettings { settings ->
                def pluginRepositories = settings.pluginManagement.repositories
                pluginRepositories.clear()
                pluginRepositories.maven {
                    name = "GCS Maven Central mirror"
                    url = mavenCentralMirror
                }
                pluginRepositories.gradlePluginPortal()
                pluginRepositories.configureEach(mirrorMavenCentral)
                pluginRepositories.whenObjectAdded(mirrorMavenCentral)

                def dependencyRepositories = settings.dependencyResolutionManagement.repositories
                dependencyRepositories.maven {
                    name = "GCS Maven Central mirror"
                    url = mavenCentralMirror
                }
            }

            settingsEvaluated { settings ->
                settings.pluginManagement.repositories.configureEach(mirrorMavenCentral)
                settings.dependencyResolutionManagement.repositories.configureEach(mirrorMavenCentral)
            }

            gradle.beforeProject { project ->
                project.buildscript.repositories.configureEach(mirrorMavenCentral)
                project.buildscript.repositories.whenObjectAdded(mirrorMavenCentral)
                project.repositories.configureEach(mirrorMavenCentral)
                project.repositories.whenObjectAdded(mirrorMavenCentral)
            }
            EOF
        - uses: dpkg/build@v1
          privileged: true
          with:
            args: -b -uc -us -d
      paths:
        - type: directory
          path: ${source.dir}/gradle/debian
          uid: 0
          gid: 0
          mode: "0600"
          source: package/deb/main/gradle/debian-13/debian
        - type: directory
          path: ${source.dir}/patch
          uid: 0
          gid: 0
          source: package/deb/main/gradle/patch
os-release:
  name: Docker Hardened Images (Debian)
  id: debian
  version-id: "13"
  version-codename: trixie
  pretty-name: Docker Hardened Images/Debian GNU/Linux 13 (trixie)
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
