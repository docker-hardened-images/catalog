      pipeline:
        - uses: dpkg/source@v1
          work-dir: ${source.dir}
          with:
            file: osinfo-db_0.20250606-1.dsc
            path: osinfo-db
        - name: pin SOURCE_DATE_EPOCH to the upstream changelog
          runs: |
            set -eux -o pipefail

            test -f debian/changelog
            test -f debian/rules
            head -n1 debian/rules | grep -qx '#!/usr/bin/make -f'
            epoch=$(dpkg-parsechangelog -l debian/changelog -S Timestamp)
            case "$epoch" in '' | *[!0-9]*)
              echo "bad epoch: $epoch" >&2
              exit 1
              ;;
            esac
            sed -i "1a export SOURCE_DATE_EPOCH := $epoch" debian/rules
            grep -qx "export SOURCE_DATE_EPOCH := $epoch" debian/rules
        - uses: dpkg/bump@v1
