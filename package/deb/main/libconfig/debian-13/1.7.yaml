contents:
  packages:
    - '!base-files'
  builds:
    - name: libconfig deb
      work-dir: ${source.dir}/libconfig
      contents:
        packages:
          - build-essential
          - debhelper
          - dpkg-dev
          - mawk
          - texinfo
          - texlive-fonts-recommended
          - texlive-latex-base
        files:
          - url: https://deb.debian.org/debian/pool/main/libc/libconfig/libconfig_1.7.3-2.dsc
            checksum: sha256:0bfbefdf63a12eb40c002fa97ab5c0b35ea9ef4f661c80f3c06ed6eda9f00d2b
            path: ${source.dir}/libconfig_1.7.3-2.dsc
            uid: 0
            gid: 0
          - url: https://deb.debian.org/debian/pool/main/libc/libconfig/libconfig_1.7.3.orig.tar.gz
            checksum: sha256:545166d6cac037744381d1e9cc5a5405094e7bfad16a411699bcff40bbb31ee7
            path: ${source.dir}/libconfig_1.7.3.orig.tar.gz
            uid: 0
            gid: 0
          - url: https://deb.debian.org/debian/pool/main/libc/libconfig/libconfig_1.7.3-2.debian.tar.xz
            checksum: sha256:9ed742a3c9bacc6612165945351682d5f58f9610c298308c9d51bba428921247
            path: ${source.dir}/libconfig_1.7.3-2.debian.tar.xz
            uid: 0
            gid: 0
      pipeline:
        - uses: dpkg/source@v1
          work-dir: ${source.dir}
          with:
            file: libconfig_1.7.3-2.dsc
            path: libconfig
        - uses: dpkg/bump@v1
          with:
            changelog:
              - DHI Rebuild
            version: 1.7.3-2+deb13u0+dhi0
        - name: build TeX formats texi2dvi needs
          runs: |
            set -eux -o pipefail

            mktexlsr /usr/share/texlive/texmf-dist /usr/share/texmf /var/lib/texmf
            for fmt in mf pdftex pdfetex etex; do
              fmtutil-sys --cnffile /var/lib/tex-common/fmtutil-cnf/texlive/texlive-base.cnf --byfmt "$fmt"
            done
            test -f /var/lib/texmf/web2c/pdftex/pdftex.fmt
            test -f /var/lib/texmf/web2c/pdftex/pdfetex.fmt
            test -f /var/lib/texmf/web2c/pdftex/etex.fmt
            test -f /var/lib/texmf/web2c/metafont/mf.base
        - uses: dpkg/build@v1
          with:
            args: -uc -us -d
