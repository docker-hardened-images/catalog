# syntax=dhi.io/build:2-debian13

image: dhi.io/pkg-npm
variant: runtime
tags:
  - 12.0.2-0
  - 12.0.2-0-debian13
platforms:
  - linux/amd64
  - linux/arm64
vars:
  DHI_REL: "0"
  DHI_VERSION: 12.0.2-0
  PACKAGE_NAME: npm-12
  SEMVER_MAJOR_VERSION: "12"
  VERSION: 12.0.2
contents:
  packages:
    - '!base-files'
  builds:
    - name: npm deb
      work-dir: ${source.dir}/npm-12
      contents:
        packages:
          - build-essential
          - debhelper
          - dpkg-dev
          - nodejs
        files:
          - url: https://registry.npmjs.org/npm/-/npm-12.0.2.tgz
            path: ${source.dir}/npm-12.0.2.tgz
            uid: 0
            gid: 0
          - url: https://registry.npmjs.org/picomatch/-/picomatch-4.0.4.tgz
            checksum: sha256:515b5ab666558ed9a117483a310892aede54a68dd78f2d8db6604513e578571c
            path: ${source.dir}/vendor/picomatch-4.0.4.tgz
            uid: 0
            gid: 0
          - url: https://registry.npmjs.org/brace-expansion/-/brace-expansion-5.0.9.tgz
            checksum: sha256:5d06001fddd25cbee90c96db4dc5b7b57711b984c3141e28d10f143deb52dbaf
            path: ${source.dir}/vendor/brace-expansion-5.0.9.tgz
            uid: 0
            gid: 0
          - url: https://registry.npmjs.org/tar/-/tar-7.5.21.tgz
            path: ${source.dir}/vendor/tar-7.5.21.tgz
            uid: 0
            gid: 0
          - url: https://registry.npmjs.org/undici/-/undici-6.28.0.tgz
            checksum: sha256:32a86c6fa28fd48b915555048c05bbd37ad35457d9e945953831a4374c886a9c
            path: ${source.dir}/vendor/undici-6.28.0.tgz
            uid: 0
            gid: 0
          - url: https://registry.npmjs.org/ip-address/-/ip-address-10.3.1.tgz
            checksum: sha256:ad1790063beea11a312c801df30d58e147de762f4f77787552376eb7424623e5
            path: ${source.dir}/vendor/ip-address-10.3.1.tgz
            uid: 0
            gid: 0
      pipeline:
        - name: setup
          runs: |
            set -eux -o pipefail

            sed -i \
              -e "s/@PACKAGE_NAME@/npm-12/g" \
              -e "s/@MAJOR_VERSION@/12/g" \
              debian/control.in debian/changelog
            mv debian/control.in debian/control

            mv debian/npm.install.in "debian/npm-12.install"
            mv debian/npm.links.in "debian/npm-12.links"

            chmod +x debian/vendor-replace.sh
        - uses: dpkg/bump@v1
          with:
            changelog:
              - Bump brace-expansion to 5.0.9 (CVE-2026-69152), bump undici to 6.28.0 (CVE-2026-15157, CVE-2026-16728, CVE-2026-16729), and bump ip-address to 10.3.1 (CVE-2026-54272, CVE-2026-69192, CVE-2026-69198)
            version: 12.0.2-0
        - uses: dpkg/build@v1
          with:
            args: -b -uc -us -d
      paths:
        - type: directory
          path: ${source.dir}/npm-12/debian
          uid: 0
          gid: 0
          mode: "0600"
          source: package/deb/main/npm/debian-13/debian
os-release:
  name: Docker Hardened Images (Debian)
  id: debian
  version-id: "13"
  version-codename: trixie
  pretty-name: Docker Hardened Images/Debian GNU/Linux 13 (trixie)
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
