# syntax=dhi.io/build:2-debian13

image: dhi.io/pkg-npm
variant: runtime
tags:
  - 12.2.2-0
  - 12.2.2-0-debian13
platforms:
  - linux/amd64
  - linux/arm64
vars:
  DHI_REL: "0"
  DHI_VERSION: 12.2.2-0
  PACKAGE_NAME: npm-12
  SEMVER_MAJOR_VERSION: "12"
  VERSION: 12.2.2
contents:
  packages:
    - '!base-files'
  builds:
    - name: npm deb
      work-dir: ${source.dir}/npm-12
      contents:
        packages:
          - build-essential
          - debhelper
          - dpkg-dev
          - nodejs
        files:
          - url: https://registry.npmjs.org/npm/-/npm-12.2.2.tgz
            path: ${source.dir}/npm-12.2.2.tgz
            uid: 0
            gid: 0
          - url: https://registry.npmjs.org/picomatch/-/picomatch-4.0.4.tgz
            checksum: sha256:515b5ab666558ed9a117483a310892aede54a68dd78f2d8db6604513e578571c
            path: ${source.dir}/vendor/picomatch-4.0.4.tgz
            uid: 0
            gid: 0
          - url: https://registry.npmjs.org/brace-expansion/-/brace-expansion-5.0.12.tgz
            checksum: sha256:ef8448ec78f20b692f04fa6d01f39b5ab34c66404bea3429f5a39c6c9e0be8b4
            path: ${source.dir}/vendor/brace-expansion-5.0.12.tgz
            uid: 0
            gid: 0
          - url: https://registry.npmjs.org/http-cache-semantics/-/http-cache-semantics-4.3.0.tgz
            checksum: sha256:d75e1e6a11587954da5e2f0e2b5c4b397a16d28cc2f7bdf64e9027fc2fe593ee
            path: ${source.dir}/vendor/http-cache-semantics-4.3.0.tgz
            uid: 0
            gid: 0
          - url: https://registry.npmjs.org/tar/-/tar-7.5.21.tgz
            path: ${source.dir}/vendor/tar-7.5.21.tgz
            uid: 0
            gid: 0
          - url: https://registry.npmjs.org/undici/-/undici-6.28.1.tgz
            checksum: sha256:e18191aac9c0ff43dac7fe9b10b7041a22d07addb7b66a6e8ac14a52a5b69b74
            path: ${source.dir}/vendor/undici-6.28.1.tgz
            uid: 0
            gid: 0
          - url: https://registry.npmjs.org/ip-address/-/ip-address-10.7.1.tgz
            checksum: sha256:7f99ac7abda701afe1fd1e36de462236fb4d1eb8c595d7ae0267bba7d8ee55f8
            path: ${source.dir}/vendor/ip-address-10.7.1.tgz
            uid: 0
            gid: 0
          - url: https://registry.npmjs.org/postcss-selector-parser/-/postcss-selector-parser-7.1.6.tgz
            checksum: sha256:48c903f98c5591d8d26f16f389d5cb3435459474c645209a79f6241bf4b657b6
            path: ${source.dir}/vendor/postcss-selector-parser-7.1.6.tgz
            uid: 0
            gid: 0
      pipeline:
        - name: setup
          runs: |
            set -eux -o pipefail

            sed -i \
              -e "s/@PACKAGE_NAME@/npm-12/g" \
              -e "s/@MAJOR_VERSION@/12/g" \
              debian/control.in debian/changelog
            mv debian/control.in debian/control

            mv debian/npm.install.in "debian/npm-12.install"
            mv debian/npm.links.in "debian/npm-12.links"

            chmod +x debian/vendor-replace.sh
        - uses: dpkg/bump@v1
          with:
            changelog:
              - Bump brace-expansion to 5.0.12 (CVE-2026-102276, CVE-2026-102277, CVE-2026-102278), undici to 6.28.1 (CVE-2026-19534, CVE-2026-85024, CVE-2026-18540), http-cache-semantics to 4.3.0 (CVE-2026-93748), ip-address to 10.7.1 (CVE-2026-101910, CVE-2026-101911, CVE-2026-101912, CVE-2026-101913), and postcss-selector-parser to 7.1.6 (CVE-2026-104844)
            version: 12.2.2-0
        - uses: dpkg/build@v1
          with:
            args: -b -uc -us -d
      paths:
        - type: directory
          path: ${source.dir}/npm-12/debian
          uid: 0
          gid: 0
          mode: "0600"
          source: package/deb/main/npm/debian-13/debian
os-release:
  name: Docker Hardened Images (Debian)
  id: debian
  version-id: "13"
  version-codename: trixie
  pretty-name: Docker Hardened Images/Debian GNU/Linux 13 (trixie)
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
