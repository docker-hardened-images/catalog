# syntax=dhi.io/build:2-debian13

image: dhi.io/pkg-npm
variant: runtime
tags:
  - 11.19.0-1
  - 11.19.0-1-debian13
platforms:
  - linux/amd64
  - linux/arm64
vars:
  DHI_REL: "1"
  DHI_VERSION: 11.19.0-1
  VERSION: 11.19.0
contents:
  packages:
    - '!base-files'
  builds:
    - name: npm deb
      work-dir: ${source.dir}/npm
      contents:
        packages:
          - build-essential
          - debhelper
          - dpkg-dev
          - nodejs
        files:
          - url: https://registry.npmjs.org/npm/-/npm-11.19.0.tgz
            path: ${source.dir}/npm-11.19.0.tgz
            uid: 0
            gid: 0
          - url: https://registry.npmjs.org/picomatch/-/picomatch-4.0.4.tgz
            checksum: sha256:515b5ab666558ed9a117483a310892aede54a68dd78f2d8db6604513e578571c
            path: ${source.dir}/vendor/picomatch-4.0.4.tgz
            uid: 0
            gid: 0
          - url: https://registry.npmjs.org/brace-expansion/-/brace-expansion-5.0.8.tgz
            path: ${source.dir}/vendor/brace-expansion-5.0.8.tgz
            uid: 0
            gid: 0
          - url: https://registry.npmjs.org/tar/-/tar-7.5.21.tgz
            path: ${source.dir}/vendor/tar-7.5.21.tgz
            uid: 0
            gid: 0
          - url: https://registry.npmjs.org/undici/-/undici-6.27.0.tgz
            checksum: sha256:cb4ecdf54572260fbbbd0fb03929ff04ca1be8b3d3bb41e60e8b4a72fc2b1036
            path: ${source.dir}/vendor/undici-6.27.0.tgz
            uid: 0
            gid: 0
      pipeline:
        - name: setup
          runs: |
            set -eux -o pipefail

            chmod +x debian/vendor-replace.sh
        - uses: dpkg/bump@v1
          with:
            changelog:
              - Bump picomatch to 4.0.4 (CVE-2026-33671, CVE-2026-33672), bump brace-expansion to 5.0.8 (CVE-2026-13149, CVE-2026-14257, CVE-2026-45149), bump tar to 7.5.21 (GHSA-r292-9mhp-454m), and bump undici to 6.27.0 (CVE-2026-12151, CVE-2026-9679, CVE-2026-11525, CVE-2026-6733)
            version: 11.19.0-1
        - uses: dpkg/build@v1
          with:
            args: -b -uc -us -d
      paths:
        - type: directory
          path: ${source.dir}/npm/debian
          uid: 0
          gid: 0
          mode: "0600"
          source: package/deb/main/npm/debian-13/debian
os-release:
  name: Docker Hardened Images (Debian)
  id: debian
  version-id: "13"
  version-codename: trixie
  pretty-name: Docker Hardened Images/Debian GNU/Linux 13 (trixie)
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
