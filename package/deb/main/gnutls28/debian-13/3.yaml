          with:
            file: gnutls28_3.8.9-3+deb13u4.dsc
            path: gnutls28
        - uses: dpkg/patch@v1
          with:
            apply: true
            patches:
              - ${source.dir}/patch/CVE-2026-127039.patch
              - ${source.dir}/patch/CVE-2026-127040.patch
              - ${source.dir}/patch/CVE-2011-3389.patch
              - ${source.dir}/patch/CVE-2026-88648.patch
        - name: gate gnutls-doc behind nodoc build profile
          runs: |
            set -eux -o pipefail

            grep -c '^Architecture: all$' debian/control | grep -qx 1
            sed -i 's/^Architecture: all$/&\nBuild-Profiles: <!nodoc>/' debian/control
            grep -q '^Build-Profiles: <!nodoc>$' debian/control
        - name: disable TLS 1.0, TLS 1.1 and DTLS 1.0 at configure time
          runs: |
            set -eux -o pipefail

            python3 - << 'PY'
            from pathlib import Path

            rules = Path("debian/rules")
            text = rules.read_text()
            anchor = "CONFIGUREARGS = \\\n"
            assert text.count(anchor) == 1
            rules.write_text(text.replace(anchor, anchor + "\t--disable-tls11-support \\\n"))
            PY
            grep -Fxc $'\t--disable-tls11-support \\' debian/rules | grep -qx 1
        - uses: dpkg/bump@v1
          with:
            changelog:
              - Backport upstream fix for CVE-2026-127039 (zeroize certificate list after cleanup)
              - Backport upstream fix for CVE-2026-127040 (return error from RSA-PSK username copy)
              - Backport upstream --enable-tls11-support option for CVE-2011-3389 and build with --disable-tls11-support (TLS 1.0, TLS 1.1 and DTLS 1.0 disabled)
              - Backport upstream name constraint fixes for CVE-2026-88648 and CVE-2026-95184 (unsupported constraint types fail closed)
            version: 3.8.9-3+deb13u4+dhi3
        - uses: dpkg/build@v1
          environment:
            DEB_BUILD_PROFILES: nodoc
          with:
            args: -uc -us -d
