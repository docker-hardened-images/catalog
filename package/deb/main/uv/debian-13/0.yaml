# syntax=dhi.io/build:2-debian13

image: dhi.io/pkg-uv
variant: runtime
tags:
  - 0.13.7-0
  - 0.13.7-0-debian13
platforms:
  - linux/amd64
  - linux/arm64
vars:
  COMMIT_SHA: 316c827e058c16b71d5c507a20729c2995a7bcce
  DHI_REL: "0"
  DHI_VERSION: 0.13.7-0
  RUST_MAJOR_MINOR: "1.97"
  VERSION: 0.13.7
contents:
  packages:
    - '!base-files'
  builds:
    - name: uv.deb
      work-dir: ${source.dir}/uv
      contents:
        repositories:
          - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
        keyring:
          - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
        packages:
          - build-essential
          - debhelper
          - dh-shell-completions
          - help2man
          - pkgconf
          - cargo-1.97
          - rustc-1.97
          - cargo-auditable
          - bash
          - ca-certificates
          - coreutils
          - findutils
          - gawk
          - grep
          - sed
          - libbz2-dev
          - liblzma-dev
          - libzstd-dev
        files:
          - url: git+https://github.com/astral-sh/uv.git#0.13.7
            checksum: 316c827e058c16b71d5c507a20729c2995a7bcce
            path: ${source.dir}/uv
            spdx:
              name: uv
              version: 0.13.7
              packages:
                - name: uv
                  purl: pkg:cargo/uv@0.13.7
                  license: MIT
                - name: uv
                  purl: pkg:pypi/uv@0.13.7
                  license: MIT
            uid: 0
            gid: 0
      pipeline:
        - runs: |
            set -eux -o pipefail

            ln -s ../debian .
        - name: bump cargo dependencies
          privileged: true
          runs: |
            set -eux -o pipefail

            # RUSTSEC-2026-0186 → memmap2 ≥0.9.11
            cargo update --package memmap2 --precise 0.9.11

            # RUSTSEC-2026-0190 → anyhow ≥1.0.103
            cargo update --package anyhow --precise 1.0.103

            # RUSTSEC-2026-0204 → crossbeam-epoch ≥0.9.20
            cargo update --package crossbeam-epoch --precise 0.9.20

            # RUSTSEC-2026-0221 → event-listener ≥5.4.2
            cargo update --package event-listener --precise 5.4.2

            # GHSA-q83h-524g-xf6h → h2 ≥0.4.16
            cargo update --package h2 --precise 0.4.16

            cargo update --package rustls --precise 0.23.46
            cargo update --package rustls-webpki --precise 0.103.16
            cargo update --package webpki-root-certs --precise 1.0.10
        - uses: dpkg/bump@v1
          with:
            changelog:
              - Bump rustls-webpki to 0.103.16 and webpki-root-certs to 1.0.10 for CVE-2026-111943
              - Bump rustls, memmap2, anyhow, crossbeam-epoch, event-listener, and h2 to advisory-fixed releases
            version: 0.13.7-0
        - uses: dpkg/build@v1
          privileged: true
          with:
            args: -B -uc -us
      paths:
        - type: directory
          path: ${source.dir}/debian
          uid: 0
          gid: 0
          mode: "0600"
          source: package/deb/main/uv/debian-13/debian
os-release:
  name: Docker Hardened Images (Debian)
  id: debian
  version-id: "13"
  version-codename: trixie
  pretty-name: Docker Hardened Images/Debian GNU/Linux 13 (trixie)
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
