          - cargo-auditable
          - bash
          - ca-certificates
          - coreutils
          - findutils
          - gawk
          - grep
          - sed
          - libbz2-dev
          - liblzma-dev
          - libzstd-dev
        files:
          - url: git+https://github.com/astral-sh/uv.git#0.12.13
            checksum: 0ebbd9274a55a8a53a13970be3b97e4209598e17
            path: ${source.dir}/uv
            spdx:
              name: uv
              version: 0.12.13
              packages:
