# syntax=dhi.io/build:2-debian13

image: dhi.io/pkg-amazoncorretto
variant: runtime
tags:
  - 8.512.09.1-0
  - 8.512.09.1-0-debian13
platforms:
  - linux/amd64
  - linux/arm64
vars:
  ARCH: '#{ target.arch == "amd64" ? "x64" : "aarch64" }'
  BASE_VERSION: 8.512.09.1
  DHI_REL: "0"
  DHI_VERSION: 8.512.09.1-0
  FIPS_ARCH: '#{ target.arch == "amd64" ? "x86_64" : "aarch_64" }'
  FIPS_VERSION: 2.5.0
  JAVA_BUILD_VERSION: "09"
  JAVA_DST_BASENAME: java-8-amazon-corretto
  JAVA_JDK_DOWNLOAD: https://corretto.aws/downloads/resources/8.512.09.1/amazon-corretto-8.512.09.1-linux-${ARCH}.tar.gz
  JAVA_JDK_SIG: https://corretto.aws/downloads/resources/8.512.09.1/amazon-corretto-8.512.09.1-linux-${ARCH}.tar.gz.sig
  JAVA_MAJOR_MINOR_VERSION: "8.512"
  JAVA_MAJOR_VERSION: "8"
  JAVA_RPM_RELEASE: 1.amzn2023
  JAVA_RPM_RELEASE_NUMBER: "1"
  JAVA_RPM_VERSION: 1.8.0_512.b09
  JAVA_SRC_BASENAME: amazon-corretto-8.512.09.1-linux-${ARCH}
  JAVA_UPDATE_VERSION: "512"
  JAVA_VERSION: 8.512.09
  JAVA_VERSION_SUFFIX: "1"
  PACKAGE_NAME: amazoncorretto-8
  RPM_ARCH: '#{ target.arch == "amd64" ? "x86_64" : "aarch64" }'
  VERSION: 8.512.09.1
contents:
  packages:
    - '!base-files'
  builds:
    - name: amazoncorretto-8-jdk
      work-dir: ${source.dir}/amazoncorretto-8-jdk
      contents:
        packages:
          - bash
          - coreutils
          - cpio
          - debhelper
          - dpkg-dev
          - findutils
          - rpm
          - rpm2cpio
        files:
          - url: https://cdn.amazonlinux.com/_assets/E951904AD832C631.asc
            path: ${source.dir}/amazoncorretto-8-jdk/al2023-signing-key.asc
            uid: 0
            gid: 0
          - url: https://corretto.aws/downloads/resources/8.512.09.1/java-1.8.0-amazon-corretto-devel-1.8.0_512.b09-1.amzn2023.${RPM_ARCH}.rpm
            path: ${source.dir}/amazoncorretto-8-jdk/rpms/devel.rpm
            spdx:
              name: amazoncorretto
              version: 8.512.09.1
              packages:
                - name: amazoncorretto
                  purl: pkg:dhi/amazoncorretto@8.512.09.1
                  license: GPL-2.0-only WITH Classpath-exception-2.0
            uid: 0
            gid: 0
          - url: https://corretto.aws/downloads/resources/8.512.09.1/java-1.8.0-amazon-corretto-1.8.0_512.b09-1.amzn2023.${RPM_ARCH}.rpm
            path: ${source.dir}/amazoncorretto-8-jdk/rpms/runtime.rpm
            spdx:
              name: amazoncorretto
              version: 8.512.09.1
              packages:
                - name: amazoncorretto
                  purl: pkg:dhi/amazoncorretto@8.512.09.1
                  license: GPL-2.0-only WITH Classpath-exception-2.0
            uid: 0
            gid: 0
          - url: https://repo1.maven.org/maven2/software/amazon/cryptools/AmazonCorrettoCryptoProvider-FIPS/2.5.0/AmazonCorrettoCryptoProvider-FIPS-2.5.0.jar
            checksum: https://repo1.maven.org/maven2/software/amazon/cryptools/AmazonCorrettoCryptoProvider-FIPS/2.5.0/AmazonCorrettoCryptoProvider-FIPS-2.5.0.jar.sha256
            path: ${source.dir}/amazoncorretto-8-jdk/fips/AmazonCorrettoCryptoProvider-FIPS-2.5.0.jar
            spdx:
              name: amazon-corretto-crypto-provider
              version: 2.5.0
              packages:
                - name: amazon-corretto-crypto-provider
                  purl: pkg:maven/software.amazon.cryptools/AmazonCorrettoCryptoProvider-FIPS@2.5.0
                  license: Apache-2.0
            uid: 0
            gid: 0
          - url: https://repo1.maven.org/maven2/software/amazon/cryptools/AmazonCorrettoCryptoProvider-FIPS/2.5.0/AmazonCorrettoCryptoProvider-FIPS-2.5.0-linux-${FIPS_ARCH}.jar
            checksum: https://repo1.maven.org/maven2/software/amazon/cryptools/AmazonCorrettoCryptoProvider-FIPS/2.5.0/AmazonCorrettoCryptoProvider-FIPS-2.5.0-linux-${FIPS_ARCH}.jar.sha256
            path: ${source.dir}/amazoncorretto-8-jdk/fips/AmazonCorrettoCryptoProvider-FIPS-2.5.0-linux-${FIPS_ARCH}.jar
            spdx:
              name: amazon-corretto-crypto-provider
              version: 2.5.0
              packages:
                - name: amazon-corretto-crypto-provider
                  purl: pkg:maven/software.amazon.cryptools/AmazonCorrettoCryptoProvider-FIPS@2.5.0?classifier=linux-${FIPS_ARCH}
                  license: Apache-2.0
            uid: 0
            gid: 0
          - url: https://raw.githubusercontent.com/corretto/amazon-corretto-crypto-provider/refs/heads/main/etc/amazon-corretto-crypto-provider-jdk15.security
            path: ${source.dir}/amazoncorretto-8-jdk/fips/java-fips.security
            uid: 0
            gid: 0
      pipeline:
        - name: setup
          runs: |
            set -eux -o pipefail

            rpmkeys --import al2023-signing-key.asc
            mkdir rpm-root
            for rpm in rpms/*.rpm; do
              rpmkeys --checksig "$rpm"
              (cd rpm-root && rpm2cpio "../$rpm" | cpio -idu --quiet)
            done

            jdk_root="rpm-root/usr/lib/jvm/java-1.8.0-amazon-corretto.${RPM_ARCH}"
            test -x "${jdk_root}/bin/java"
            test -x "${jdk_root}/bin/javac"
            grep -F "JAVA_VERSION=\"1.8.0_512\"" "${jdk_root}/release"
            cp -a "${jdk_root}/." .
            rm -rf rpm-root rpms al2023-signing-key.asc

            sed -i \
              -e "s/@PACKAGE_NAME@/amazoncorretto-8-jdk/g" \
              -e "s/@JAVA_MAJOR_VERSION@/8/g" \
              -e "s#@JAVA_DST_BASENAME@#java-8-amazon-corretto#g" \
              debian/control.in debian/changelog \
              debian/amazoncorretto.install.in \
              debian/amazoncorretto-oci-config.install.in \
              debian/amazoncorretto-fips.install.in \
              debian/amazoncorretto-fips-oci-config.install.in
            mv debian/control.in debian/control
            mv debian/amazoncorretto.install.in "debian/amazoncorretto-8-jdk.install"
            mv debian/amazoncorretto-oci-config.install.in "debian/amazoncorretto-8-jdk-oci-config.install"
            mv debian/amazoncorretto-fips.install.in "debian/amazoncorretto-8-jdk-fips.install"
            mv debian/amazoncorretto-fips-oci-config.install.in "debian/amazoncorretto-8-jdk-fips-oci-config.install"
        - name: generate oci config
          runs: |
            set -eux -o pipefail

            mkdir -p oci-config

            cat > "oci-config/amazoncorretto-8-jdk.yaml" << EOF
            environment:
              JAVA_HOME: /usr/lib/jvm/java-8-amazon-corretto
              JAVA_VERSION: 8.512.09.1
            EOF

            cat > "oci-config/amazoncorretto-8-jdk-fips.yaml" << EOF
            environment:
              CLASSPATH: "/opt/aws-lc/*:./*:."
              JAVA_FIPS_CLASSPATH: "/opt/aws-lc/*"
              JAVA_HOME: /usr/lib/jvm/java-8-amazon-corretto
              JAVA_TOOL_OPTIONS: "--module-path=/opt/aws-lc/*"
              JAVA_TRUSTSTORE_OPTIONS: -Djavax.net.ssl.trustStoreType=FIPS
              JAVA_VERSION: 8.512.09.1
              JDK_JAVA_FIPS_OPTIONS: -Djava.security.properties=/opt/aws-lc/java-fips.security
              JDK_JAVA_OPTIONS: -Djava.security.properties=/opt/aws-lc/java-fips.security
            EOF
        - uses: dpkg/bump@v1
          with:
            changelog:
              - DHI Build
            version: 8.512.09.1-0
        - uses: dpkg/build@v1
          environment:
            JAVA_DST_BASENAME: java-8-amazon-corretto
          with:
            args: -b -uc -us -d
      paths:
        - type: directory
          path: ${source.dir}/amazoncorretto-8-jdk/debian
          uid: 0
          gid: 0
          mode: "0600"
          source: package/deb/main/amazoncorretto/debian-13/debian
os-release:
  name: Docker Hardened Images (Debian)
  id: debian
  version-id: "13"
  version-codename: trixie
  pretty-name: Docker Hardened Images/Debian GNU/Linux 13 (trixie)
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
