contents:
  packages:
    - '!base-files'
  builds:
    - name: gupnp deb
      work-dir: ${source.dir}/gupnp
      contents:
        packages:
          - build-essential
          - debhelper
          - dh-python
          - docbook-xml
          - docbook-xsl
          - dpkg-dev
          - gobject-introspection
          - gir1.2-glib-2.0-dev
          - gi-docgen
          - libgirepository1.0-dev
          - libglib2.0-dev
          - libgssdp-1.6-dev
          - libsoup-3.0-dev
          - libxml2-dev
          - meson
          - ninja-build
          - pkgconf
          - python3
          - shared-mime-info
          - uuid-dev
          - valac
          - xsltproc
        files:
          - url: https://deb.debian.org/debian/pool/main/g/gupnp/gupnp_1.6.8-2.dsc
            checksum: sha256:cc0e9d3bc9f9759a6258a4ccfc30b479018a36510c5d66092b152fecab313aab
            path: ${source.dir}/gupnp_1.6.8-2.dsc
            uid: 0
            gid: 0
          - url: https://deb.debian.org/debian/pool/main/g/gupnp/gupnp_1.6.8.orig.tar.xz
            checksum: sha256:32e3d896f8341688aab64b76e175f58788ba3ed066b6d91c2e432c7586aa2be2
            path: ${source.dir}/gupnp_1.6.8.orig.tar.xz
            uid: 0
            gid: 0
          - url: https://deb.debian.org/debian/pool/main/g/gupnp/gupnp_1.6.8-2.debian.tar.xz
            checksum: sha256:ba54c9929c2e51fde0c87f692dc51321877962ebe40fb34a7e175dd47c420333
            path: ${source.dir}/gupnp_1.6.8-2.debian.tar.xz
            uid: 0
            gid: 0
      pipeline:
        - uses: dpkg/source@v1
          work-dir: ${source.dir}
          with:
            file: gupnp_1.6.8-2.dsc
            path: gupnp
        - uses: dpkg/bump@v1
          with:
            changelog:
              - DHI Rebuild
            version: 1.6.8-2+dhi0
        - name: disable gtk_doc and doc package install paths for offline build
          runs: |
            set -eux -o pipefail

            sed -i 's/-Dgtk_doc=true/-Dgtk_doc=false/' debian/rules
            sed -i '/usr\/share\/man\/man1\/gupnp-binding-tool/d' debian/libgupnp-1.6-dev.install
            : > debian/libgupnp-doc.install
        - uses: dpkg/build@v1
          environment:
            DEB_BUILD_PROFILES: nodoc
          with:
            args: -uc -us -d
            options: nocheck
