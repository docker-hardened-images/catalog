      pipeline:
        - uses: dpkg/source@v1
          work-dir: ${source.dir}
          with:
            file: gtk+3.0_3.24.49-3.dsc
            path: gtk+3.0
        - uses: dpkg/patch@v1
          with:
            apply: true
            patches:
              - ${source.dir}/patch/dhi-build-gresource-png-without-pixdata.patch
        - uses: dpkg/bump@v1
          with:
            changelog:
              - Skip theme PNG pixdata preprocessing in gresource XML generation
            version: 3.24.49-3+dhi0
        - name: provide which for parse-sass.sh
          runs: |
            set -eux -o pipefail

            if ! command -v which > /dev/null 2>&1; then
              ln -sf /usr/bin/which.debianutils /usr/bin/which
            fi

            which sassc
        - name: disable gtk demos for offline build
          runs: |
            set -eux -o pipefail

            sed -i 's/-Dinstalled_tests=true/-Dinstalled_tests=true -Ddemos=false/' debian/rules
            sed -i '/^Package: gtk-3-examples$/a Build-Profiles: <!nodemo>' debian/control
        - uses: dpkg/build@v1
          environment:
            DEB_BUILD_PROFILES: nodoc noudeb noinsttest nodemo
          with:
            args: -uc -us -d
            options: nocheck
      paths:
        - type: file
          path: ${source.dir}/patch/dhi-build-gresource-png-without-pixdata.patch
          uid: 0
          gid: 0
          source: package/deb/main/gtk-plus-3-0/patch/dhi-build-gresource-png-without-pixdata.patch
