contents:
  packages:
    - '!base-files'
  builds:
    - name: cairo deb
      work-dir: ${source.dir}/cairo
      contents:
        packages:
          - build-essential
          - debhelper
          - docbook-xsl
          - dpkg-dev
          - ghostscript
          - gtk-doc-tools
          - libfontconfig-dev
          - libfreetype-dev
          - libglib2.0-dev
          - liblzo2-dev
          - libpixman-1-dev
          - libpng-dev
          - libpoppler-glib-dev
          - librsvg2-dev
          - libspectre-dev
          - libx11-dev
          - libxcb-render0-dev
          - libxcb-shm0-dev
          - libxcb1-dev
          - libxext-dev
          - libxrender-dev
          - meson
          - ninja-build
          - pkgconf
          - zlib1g-dev
        files:
          - url: https://deb.debian.org/debian/pool/main/c/cairo/cairo_1.18.4-1.dsc
            checksum: sha256:717ca0717208ae5ef1ab354e47328867ee7038fe65fb75e0ce366139b34bf67f
            path: ${source.dir}/cairo_1.18.4-1.dsc
            uid: 0
            gid: 0
          - url: https://deb.debian.org/debian/pool/main/c/cairo/cairo_1.18.4.orig.tar.xz
            checksum: sha256:445ed8208a6e4823de1226a74ca319d3600e83f6369f99b14265006599c32ccb
            path: ${source.dir}/cairo_1.18.4.orig.tar.xz
            uid: 0
            gid: 0
          - url: https://deb.debian.org/debian/pool/main/c/cairo/cairo_1.18.4-1.debian.tar.xz
            checksum: sha256:bf2d9ea10097fd06faf6b4ef2149677e7aa0eb8abf85aa5d46851ea11a713f68
            path: ${source.dir}/cairo_1.18.4-1.debian.tar.xz
            uid: 0
            gid: 0
      pipeline:
        - uses: dpkg/source@v1
          work-dir: ${source.dir}
          with:
            file: cairo_1.18.4-1.dsc
            path: cairo
        - uses: dpkg/bump@v1
          with:
            changelog:
              - DHI Rebuild
            version: 1.18.4-1+dhi0
        - name: gtk-doc offline DocBook XSL (chunk.xsl)
          runs: |
            set -eux -o pipefail

            xf=/usr/share/gtk-doc/data/gtk-doc.xsl
            test -f "$xf"
            test -f /usr/share/xml/docbook/stylesheet/docbook-xsl/html/chunk.xsl
            sed -i \
              's|http://docbook.sourceforge.net/release/xsl/current/html/chunk\.xsl|file:///usr/share/xml/docbook/stylesheet/docbook-xsl/html/chunk.xsl|g' \
              "$xf"
        - uses: dpkg/build@v1
          environment:
            DEB_BUILD_PROFILES: noudeb
          with:
            args: -uc -us -d
