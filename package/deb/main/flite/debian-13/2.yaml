  DEBIAN_DEBIAN_FILENAME: flite_2.2-7.debian.tar.xz
  DEBIAN_DEBIAN_URL: https://deb.debian.org/debian/pool/main/f/flite/flite_2.2-7.debian.tar.xz
  DEBIAN_DSC_CHECKSUM: sha256:cbc1a25bf64c5f2a330454186e85bd8b2cf7d63efa627db1e79b7a60563a6660
  DEBIAN_DSC_FILENAME: flite_2.2-7.dsc
