  DEBIAN_VERSION: 2.2-7
  DHI_REL: "0"
  DHI_VERSION: 2.2-7+dhi0
  TAG_VERSION: 2.2-7-dhi0
  UPSTREAM_VERSION: "2.2"
contents:
  packages:
    - '!base-files'
  builds:
    - name: flite deb
      work-dir: ${source.dir}/flite
      contents:
        packages:
          - build-essential
          - debhelper
          - dpkg-dev
          - ed
          - libasound2-dev
          - texinfo
        files:
          - url: https://deb.debian.org/debian/pool/main/f/flite/flite_2.2-7.dsc
            checksum: sha256:cbc1a25bf64c5f2a330454186e85bd8b2cf7d63efa627db1e79b7a60563a6660
            path: ${source.dir}/flite_2.2-7.dsc
            uid: 0
            gid: 0
          - url: https://deb.debian.org/debian/pool/main/f/flite/flite_2.2.orig.tar.gz
            checksum: sha256:ab1555fe5adc3f99f1d4a1a0eb1596d329fd6d74f1464a0097c81f53c0cf9e5c
            path: ${source.dir}/flite_2.2.orig.tar.gz
            uid: 0
            gid: 0
          - url: https://deb.debian.org/debian/pool/main/f/flite/flite_2.2-7.debian.tar.xz
            checksum: sha256:aebf7dcf8fa6600c96e0aa4bb853df8eb09d3756303f3400f9f7e9e190106f7e
            path: ${source.dir}/flite_2.2-7.debian.tar.xz
            uid: 0
            gid: 0
      pipeline:
        - uses: dpkg/source@v1
          work-dir: ${source.dir}
          with:
            file: flite_2.2-7.dsc
            path: flite
        - name: skip texinfo pdf build in hermetic builder
          runs: |
            set -eux -o pipefail

            sed -i 's/flite\.pdf flite\.html/flite.html/' debian/rules
            sed -i '/^doc\/flite\.pdf$/d' debian/docs
            sed -i '/^Format: PDF$/,/^$/d' debian/flite.doc-base
        - uses: dpkg/bump@v1
          with:
            changelog:
              - DHI Rebuild
            version: 2.2-7+dhi0
        - uses: dpkg/build@v1
          with:
            args: -uc -us -d
