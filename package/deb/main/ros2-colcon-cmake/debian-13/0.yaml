contents:
  packages:
    - '!base-files'
  builds:
    - name: ros2-colcon-cmake deb
      work-dir: ${source.dir}/ros2-colcon-cmake
      contents:
        packages:
          - cmake
          - debhelper
          - dh-python
          - dpkg-dev
          - pylint
          - python3-all
          - python3-colcon-core
          - python3-colcon-library-path
          - python3-colcon-test-result
          - python3-flake8
          - python3-pep8-naming
          - python3-pytest
          - python3-pytest-cov
          - python3-setuptools
        files:
          - url: https://deb.debian.org/debian/pool/main/r/ros2-colcon-cmake/ros2-colcon-cmake_0.2.29-1.dsc
            checksum: sha256:2ce34f479e8380f13396e3b1ac6e64b47aec928958a707550f2095f95217d250
            path: ${source.dir}/ros2-colcon-cmake_0.2.29-1.dsc
            uid: 0
            gid: 0
          - url: https://deb.debian.org/debian/pool/main/r/ros2-colcon-cmake/ros2-colcon-cmake_0.2.29.orig.tar.gz
            checksum: sha256:b51f2de876703c665d0a0f196e4019effdc39bc6a6e44d00ba25e9afdc3d658d
            path: ${source.dir}/ros2-colcon-cmake_0.2.29.orig.tar.gz
            uid: 0
            gid: 0
          - url: https://deb.debian.org/debian/pool/main/r/ros2-colcon-cmake/ros2-colcon-cmake_0.2.29-1.debian.tar.xz
            checksum: sha256:d2b6c3a9e562749462ddd30c828c2bf448b340143f1c3ff233f62bba1e0b33d4
            path: ${source.dir}/ros2-colcon-cmake_0.2.29-1.debian.tar.xz
            uid: 0
            gid: 0
      pipeline:
        - uses: dpkg/source@v1
          work-dir: ${source.dir}
          with:
            file: ros2-colcon-cmake_0.2.29-1.dsc
            path: ros2-colcon-cmake
        - name: use explicit Python install destinations
          runs: |
            set -eux -o pipefail

            python3 - << 'PY'
            from pathlib import Path

            path = Path("debian/rules")
            rules = path.read_text()
            marker = "%:\n"
            assert rules.count(marker) == 1
            override = (
                "override_dh_auto_install:\n"
                "\tpython3 setup.py install --root=$(CURDIR)/debian/python3-colcon-cmake --prefix=/usr "
                "--install-purelib=/usr/lib/python3/dist-packages "
                "--install-platlib=/usr/lib/python3/dist-packages --install-data=/usr --install-scripts=/usr/bin\n\n"
            )
            path.write_text(rules.replace(marker, override + marker))
            PY

            grep -Fq -- '--install-purelib=/usr/lib/python3/dist-packages' debian/rules
            grep -Fq -- '--install-scripts=/usr/bin' debian/rules
        - uses: dpkg/bump@v1
          with:
            changelog:
              - DHI Rebuild
            version: 0.2.29-1+deb13u0+dhi0
        - uses: dpkg/build@v1
          with:
            args: -uc -us -d
