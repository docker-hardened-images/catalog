        files:
          - url: https://deb.debian.org/debian/pool/main/p/python-flake8/python-flake8_7.1.1-3.dsc
            checksum: sha256:c9bc748e6716beafae3f17b43cfca2c38aedad131442589c9f568ecedad6c505
            path: ${source.dir}/python-flake8_7.1.1-3.dsc
