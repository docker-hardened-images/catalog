            checksum: sha256:495f65d11f61d19aa678d16d2ee4d6ed834def1414751f6563db3f71afcafae3
            path: ${source.dir}/python-flake8_7.1.1-3.debian.tar.xz
            uid: 0
            gid: 0
      pipeline:
        - uses: dpkg/source@v1
          work-dir: ${source.dir}
          with:
            file: python-flake8_7.1.1-3.dsc
            path: python-flake8
        - uses: patch@v1
          work-dir: ${source.dir}/python-flake8
          with:
            options: -p1
            patches:
              - ${source.dir}/patch/dhi-python-install-dist-packages.patch
        - name: assert debian/rules uses the Debian install destinations
          runs: |
            set -eux -o pipefail

            grep -q -- '--install-purelib=/usr/lib/python3/dist-packages' debian/rules
            grep -q -- '--install-scripts=/usr/bin' debian/rules
            grep -q -- '--install-data=/usr' debian/rules
        - uses: dpkg/bump@v1
