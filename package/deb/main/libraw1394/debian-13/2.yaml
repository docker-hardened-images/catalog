contents:
  packages:
    - '!base-files'
  builds:
    - name: libraw1394 deb
      work-dir: ${source.dir}/libraw1394
      contents:
        packages:
          - build-essential
          - debhelper
          - docbook-utils
          - docbook-xml
          - dpkg-dev
          - mawk
          - debianutils
          - texlive-formats-extra
          - texlive-fonts-recommended
          - texlive-latex-base
        files:
          - url: https://deb.debian.org/debian/pool/main/libr/libraw1394/libraw1394_2.1.2-2.dsc
            checksum: sha256:682c04e351576bb77c6992af4994ed6f20e5ce5b70035a0f8774a1e613654578
            path: ${source.dir}/libraw1394_2.1.2-2.dsc
            uid: 0
            gid: 0
          - url: https://deb.debian.org/debian/pool/main/libr/libraw1394/libraw1394_2.1.2.orig.tar.gz
            checksum: sha256:ddc4e32721cdfe680d964aaede68ac606a20cd17dd2ba70e2d7e0692086ab57c
            path: ${source.dir}/libraw1394_2.1.2.orig.tar.gz
            uid: 0
            gid: 0
          - url: https://deb.debian.org/debian/pool/main/libr/libraw1394/libraw1394_2.1.2-2.debian.tar.xz
            checksum: sha256:8797ae8f8fd47971ba248e313533006dbb878dba17f239a9b8d42e471d678a77
            path: ${source.dir}/libraw1394_2.1.2-2.debian.tar.xz
            uid: 0
            gid: 0
      pipeline:
        - uses: dpkg/source@v1
          work-dir: ${source.dir}
          with:
            file: libraw1394_2.1.2-2.dsc
            path: libraw1394
        - uses: dpkg/bump@v1
          with:
            changelog:
              - DHI Rebuild
            version: 2.1.2-2+deb13u0+dhi0
        - name: Link openjade parser, which, and docbook-xml catalog for docbook-utils
          work-dir: ${source.dir}/libraw1394
          runs: |
            set -eux -o pipefail

            ln -sf /usr/bin/openjade-1.4devel /usr/bin/openjade
            ln -sf /usr/bin/which.debianutils /usr/bin/which
            mkdir -p /usr/share/sgml/dhi-docbook-xml
            printf 'CATALOG "/etc/sgml/docbook-xml.cat"\n' > /usr/share/sgml/dhi-docbook-xml/catalog
        - name: build pdfjadetex format and font map for docbook-utils
          runs: |
            set -eux -o pipefail

            mktexlsr /usr/share/texlive/texmf-dist /usr/share/texmf /var/lib/texmf
            updmap-sys
            grep -rl '^pcrro8r' /var/lib/texmf /etc/texmf 2> /dev/null | grep -q .
            for cnf in /var/lib/tex-common/fmtutil-cnf/texlive/*.cnf; do
              if grep -q '^pdfjadetex' "$cnf"; then
                fmtutil-sys --cnffile "$cnf" --byfmt pdfjadetex
              fi
            done
            test -f /var/lib/texmf/web2c/pdftex/pdfjadetex.fmt
        - uses: dpkg/build@v1
          with:
            args: -uc -us -d
