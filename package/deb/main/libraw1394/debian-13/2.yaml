  DEBIAN_DEBIAN_CHECKSUM: sha256:8797ae8f8fd47971ba248e313533006dbb878dba17f239a9b8d42e471d678a77
  DEBIAN_DEBIAN_FILENAME: libraw1394_2.1.2-2.debian.tar.xz
  DEBIAN_DEBIAN_URL: https://deb.debian.org/debian/pool/main/libr/libraw1394/libraw1394_2.1.2-2.debian.tar.xz
  DEBIAN_DSC_CHECKSUM: sha256:682c04e351576bb77c6992af4994ed6f20e5ce5b70035a0f8774a1e613654578
  DEBIAN_DSC_FILENAME: libraw1394_2.1.2-2.dsc
  DEBIAN_DSC_URL: https://deb.debian.org/debian/pool/main/libr/libraw1394/libraw1394_2.1.2-2.dsc
  DEBIAN_FILENAME_VERSION: 2.1.2-2
  DEBIAN_ORIG_CHECKSUM: sha256:ddc4e32721cdfe680d964aaede68ac606a20cd17dd2ba70e2d7e0692086ab57c
  DEBIAN_ORIG_FILENAME: libraw1394_2.1.2.orig.tar.gz
  DEBIAN_ORIG_URL: https://deb.debian.org/debian/pool/main/libr/libraw1394/libraw1394_2.1.2.orig.tar.gz
  DEBIAN_VERSION: 2.1.2-2
  DHI_REL: "0"
