          - quilt
          - util-linux
        files:
          - url: https://deb.debian.org/debian/pool/main/p/python-zipp/python-zipp_3.21.0-1.dsc
            checksum: sha256:be0a1f257273df51b3c6d46506819f107faff4ecd79ca00bab0de1605dc94743
            path: ${source.dir}/python-zipp_3.21.0-1.dsc
