            checksum: sha256:dcfa46b60a13918c014e57a2a9c55d8df969df3ee567ddab3c00a7b695f080a4
            path: ${source.dir}/python-zipp_3.21.0-1.debian.tar.xz
            uid: 0
            gid: 0
      pipeline:
        - uses: dpkg/source@v1
          work-dir: ${source.dir}
          with:
            file: python-zipp_3.21.0-1.dsc
            path: python-zipp
        - name: point python3.13 distutils shim at posix_prefix
          runs: |
            set -eux -o pipefail

            shim=/usr/lib/python3.13/_distutils_system_mod.py
            grep -Fq 'name = "posix_local"' "${shim}"
            sed -i 's/name = "posix_local"/name = "posix_prefix"/' "${shim}"
            grep -Fq 'name = "posix_prefix"' "${shim}"
