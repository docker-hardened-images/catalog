# syntax=dhi.io/build:2-debian13

image: dhi.io/pkg-dictionaries-common
variant: runtime
tags:
  - 1.30.10-dhi0
  - 1.30.10-dhi0-debian13
platforms:
  - linux/amd64
  - linux/arm64
vars:
  DEBIAN_DEBIAN_FILENAME: ${DEBIAN_DEBIAN_URL:^.+/(.+)$}
  DEBIAN_DSC_CHECKSUM: sha256:f9150a3c1650b6c9936c1071e4697b7c28236a0b50de4d0d50abd260918dd52c
  DEBIAN_DSC_FILENAME: dictionaries-common_1.30.10.dsc
  DEBIAN_DSC_URL: https://deb.debian.org/debian/pool/main/d/dictionaries-common/dictionaries-common_1.30.10.dsc
  DEBIAN_FILENAME_VERSION: 1.30.10
  DEBIAN_ORIG_CHECKSUM: sha256:3b6c408a42e7540642b5bcb5b84e6e59a34d6f700d035768710316e3d10f010f
  DEBIAN_ORIG_FILENAME: dictionaries-common_1.30.10.tar.xz
  DEBIAN_ORIG_URL: https://deb.debian.org/debian/pool/main/d/dictionaries-common/dictionaries-common_1.30.10.tar.xz
  DEBIAN_VERSION: 1.30.10
  DHI_REL: "0"
  DHI_VERSION: 1.30.10+dhi0
  TAG_VERSION: 1.30.10-dhi0
  UPSTREAM_VERSION: 1.30.10
contents:
  packages:
    - '!base-files'
  builds:
    - name: dictionaries-common deb
      work-dir: ${source.dir}/dictionaries-common
      contents:
        packages:
          - autoconf
          - build-essential
          - debhelper
          - docbook-dsssl
          - docbook-xml
          - dpkg-dev
          - openjade
          - perl
          - quilt
          - recode
          - sgml-base
          - slice
          - util-linux
          - w3m
          - xml-core
        files:
          - url: https://deb.debian.org/debian/pool/main/d/dictionaries-common/dictionaries-common_1.30.10.dsc
            checksum: sha256:f9150a3c1650b6c9936c1071e4697b7c28236a0b50de4d0d50abd260918dd52c
            path: ${source.dir}/dictionaries-common_1.30.10.dsc
            uid: 0
            gid: 0
          - url: https://deb.debian.org/debian/pool/main/d/dictionaries-common/dictionaries-common_1.30.10.tar.xz
            checksum: sha256:3b6c408a42e7540642b5bcb5b84e6e59a34d6f700d035768710316e3d10f010f
            path: ${source.dir}/dictionaries-common_1.30.10.tar.xz
            uid: 0
            gid: 0
      pipeline:
        - uses: dpkg/source@v1
          work-dir: ${source.dir}
          with:
            file: dictionaries-common_1.30.10.dsc
            path: dictionaries-common
            remove-original: false
        - name: remove upstream source artifacts
          work-dir: ${source.dir}
          runs: |
            set -eux -o pipefail

            rm dictionaries-common_1.30.10.dsc dictionaries-common_1.30.10.tar.xz
        - uses: dpkg/bump@v1
          with:
            changelog:
              - DHI Rebuild
            version: 1.30.10+dhi0
        - name: prepare docbook tooling for policy build
          work-dir: ${source.dir}/dictionaries-common
          runs: |
            set -eux -o pipefail

            ln -sf /usr/bin/openjade-1.4devel /usr/bin/openjade
            mkdir -p policy/dtd/docbook-xml
            ln -sf /usr/share/xml/docbook/schema/dtd/4.0/docbookx.dtd policy/dtd/docbook-xml/docbookx.dtd
        - uses: dpkg/build@v1
          environment:
            SGML_CATALOG_FILES: /etc/sgml/docbook-xml.cat:/etc/sgml/docbook-dsssl.cat
          with:
            args: -uc -us -d
os-release:
  name: Docker Hardened Images (Debian)
  id: debian
  version-id: "13"
  version-codename: trixie
  pretty-name: Docker Hardened Images/Debian GNU/Linux 13 (trixie)
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
