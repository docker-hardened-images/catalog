      pipeline:
        - uses: dpkg/source@v1
          work-dir: ${source.dir}
          with:
            file: luarocks_3.8.0+dfsg1-1.dsc
            path: luarocks
        - uses: dpkg/bump@v1
          with:
            changelog:
              - DHI Rebuild
            version: 3.8.0+dfsg1-1+deb13u0+dhi0
        - name: create /usr/local/lib for configure
          runs: |
            set -eux -o pipefail

            mkdir -p /usr/local/lib
        - name: upstream busted suite
          work-dir: ${source.dir}/luarocks
          runs: |
            set -eux -o pipefail

            getent group 65532 > /dev/null || groupadd -g 65532 nonroot
            getent passwd 65532 > /dev/null || useradd -u 65532 -g 65532 -M -d /home/nonroot -s /bin/sh nonroot
            mkdir -p /home/nonroot
            chown 65532:65532 /home/nonroot

            check=/tmp/luarocks-check
            rm -rf "$check"
            cp -a . "$check"
            mkdir -p "$check/testrun/binary-samples"
            tar -xzf ../binary-samples.tar.gz -C "$check/testrun/binary-samples" --strip-components=1
            mkdir -p "$check/testrun/testing_server-5.1"
            cp ../rocks/* "$check/testrun/testing_server-5.1/"
            chown -R 65532:65532 "$check"

            ssh-keygen -A
            getent passwd sshd > /dev/null || useradd -r -M -d /run/sshd -s /usr/sbin/nologin sshd
            mkdir -p /run/sshd /etc/ssh
            test -f /etc/ssh/sshd_config || printf 'Subsystem sftp /usr/lib/openssh/sftp-server\nPubkeyAuthentication yes\nPasswordAuthentication no\n' > /etc/ssh/sshd_config
            if grep -q '^nonroot:' /etc/shadow; then sed -i 's/^nonroot:!:/nonroot::/' /etc/shadow; else echo 'nonroot::19000:0:99999:7:::' >> /etc/shadow; fi
            grep -q '^nonroot::' /etc/shadow
            /usr/sbin/sshd

            ln -sf /usr/bin/lua5.1 /usr/bin/lua
            command -v busted setpriv git sshd > /dev/null

            printf '%s\n' \
              'LuaRocks build #integration more complex tests downgrades directories correctly' \
              'luarocks install #integration New install functionality based on pull request 552 break dependencies warning' \
              'luarocks install #integration New install functionality based on pull request 552 break dependencies force' \
              'luarocks install #integration New install functionality based on pull request 552 break dependencies force fast' \
              'luarocks pack #integration detects latest version version of rock' \
              'luarocks test #integration busted backend with rockspec, installing busted' \
              'luarocks test #integration busted backend prepare' \
              'luarocks unpack #integration more complex tests src' \
              'luarocks unpack #integration more complex tests git:// rockspec' > "$check/busted-skip.txt"

            cd "$check"
            rc=0
            setpriv --reuid=65532 --regid=65532 --clear-groups env HOME=/home/nonroot USER=nonroot LOGNAME=nonroot \
              GIT_CONFIG_COUNT=2 GIT_CONFIG_KEY_0=protocol.file.allow GIT_CONFIG_VALUE_0=always \
              GIT_CONFIG_KEY_1=init.defaultBranch GIT_CONFIG_VALUE_1=master \
              GIT_AUTHOR_NAME=dhi GIT_AUTHOR_EMAIL=dhi@example.invalid GIT_COMMITTER_NAME=dhi GIT_COMMITTER_EMAIL=dhi@example.invalid \
              busted -Xhelper travis,lua_dir=/usr,lua_interpreter=lua5.1 --exclude-names-file=busted-skip.txt --output=TAP > busted.tap 2>&1 || rc=$?

            echo "busted: ok=$(grep -c '^ok' busted.tap || true) not_ok=$(grep -c '^not ok' busted.tap || true) pending=$(grep -c '# SKIP' busted.tap || true)"
            tail -n 1 busted.tap
            if [ "$rc" != 0 ]; then
              grep -B20 -A4 '^not ok' busted.tap | head -n 2000
              exit 1
            fi
        - uses: dpkg/build@v1
          with:
            args: -uc -us -d
