variant: runtime
tags:
  - 3.5.7-1-deb13u3-dhi2
  - 3.5.7-1-deb13u3-dhi2-debian13
platforms:
  - linux/amd64
  - linux/arm64
vars:
  ARCH: '#{ target.arch == "amd64" ? "x86_64" : "aarch64" }'
  DEBIAN_DEBIAN_CHECKSUM: sha256:0a427fdc3e773f4119a7dd5b36d1f0903a163cf4ea15d812bb823b251ff1cbc5
  DEBIAN_DEBIAN_FILENAME: openssl_3.5.7-1~deb13u3.debian.tar.xz
  DEBIAN_DEBIAN_URL: https://deb.debian.org/debian-security/pool/updates/main/o/openssl/openssl_3.5.7-1~deb13u3.debian.tar.xz
