  DEBIAN_DSC_FILENAME: openssl_3.5.7-1~deb13u3.dsc
  DEBIAN_DSC_URL: https://deb.debian.org/debian-security/pool/updates/main/o/openssl/openssl_3.5.7-1~deb13u3.dsc
  DEBIAN_FILENAME_VERSION: 3.5.7-1~deb13u3
