  DEBIAN_VERSION: 3.5.7-1~deb13u3
  DHI_REL: "2"
  DHI_VERSION: 3.5.7-1~deb13u3+dhi2
  TAG_VERSION: 3.5.7-1-deb13u3-dhi2
  UPSTREAM_VERSION: 3.5.7
contents:
  packages:
    - '!base-files'
  builds:
    - name: openssl deb
      work-dir: ${source.dir}/openssl
      contents:
        packages:
          - debhelper
          - dpkg-dev
          - libzstd-dev
          - perl
          - mawk
          - quilt
          - util-linux
          - zlib1g-dev
        files:
          - url: https://deb.debian.org/debian-security/pool/updates/main/o/openssl/openssl_3.5.7-1~deb13u3.dsc
            checksum: sha256:9cdb0d9daf0773ca5c0f3f5ea1fc59b1106a99e005a5c048948b826e8d3b47e1
            path: ${source.dir}/openssl_3.5.7-1~deb13u3.dsc
            uid: 0
            gid: 0
          - url: https://deb.debian.org/debian-security/pool/updates/main/o/openssl/openssl_3.5.7.orig.tar.gz
            checksum: sha256:a8c0d28a529ca480f9f36cf5792e2cd21984552a3c8e4aa11a24aa31aeac98e8
            path: ${source.dir}/openssl_3.5.7.orig.tar.gz
            uid: 0
            gid: 0
          - url: https://deb.debian.org/debian-security/pool/updates/main/o/openssl/openssl_3.5.7.orig.tar.gz.asc
            checksum: sha256:d3d082bee3f658c31db53af625eceecf29d777c7010394bed5787ebcc98abdf2
            path: ${source.dir}/openssl_3.5.7.orig.tar.gz.asc
            uid: 0
            gid: 0
          - url: https://deb.debian.org/debian-security/pool/updates/main/o/openssl/openssl_3.5.7-1~deb13u3.debian.tar.xz
            checksum: sha256:0a427fdc3e773f4119a7dd5b36d1f0903a163cf4ea15d812bb823b251ff1cbc5
            path: ${source.dir}/openssl_3.5.7-1~deb13u3.debian.tar.xz
            uid: 0
            gid: 0
      pipeline:
        - uses: dpkg/source@v1
          work-dir: ${source.dir}
          with:
            file: openssl_3.5.7-1~deb13u3.dsc
            path: openssl
        - uses: dpkg/patch@v1
          with:
            apply: true
            patches:
              - ${source.dir}/patch/CVE-2026-88822-bss-dgram-peer-addr.patch
              - ${source.dir}/patch/CVE-2026-88823-aes-gcm-siv-aad.patch
              - ${source.dir}/patch/CVE-2026-95692-aes-gcm-siv-iv-length.patch
              - ${source.dir}/patch/CVE-2026-95691-quic-crypto-retransmit.patch
              - ${source.dir}/patch/CVE-2026-107496-ec-group-order-one.patch
              - ${source.dir}/patch/CVE-2026-107493-pem-x509-info-stack.patch
        - uses: dpkg/bump@v1
          with:
            changelog:
              - 'Backport upstream fix for CVE-2026-88822: initialise auto-detected QUIC peer address'
              - 'Backport upstream fix for CVE-2026-88823: AES-GCM-SIV keeps AAD on zero-length update'
              - 'Backport upstream fix for CVE-2026-95692: reject unsupported AES-GCM-SIV IV lengths'
              - 'Backport upstream fix for CVE-2026-95691: keep QUIC CRYPTO data alive during record reads'
              - 'Backport upstream fix for CVE-2026-107496: reject EC group order 1 in CMS encryption'
              - 'Backport upstream fix for CVE-2026-107493: preserve caller stack on PEM read failure'
            version: 3.5.7-1~deb13u3+dhi2
        - uses: dpkg/build@v1
          environment:
            DEB_BUILD_PROFILES: noudeb
          with:
            args: -uc -us -d
        - name: stage OCI config snippets for openssl
          runs: |
            set -eux -o pipefail

            mkdir -p "${target.dir}/opt/docker/config"
            cat > "${target.dir}/opt/docker/config/openssl-provider-fips.yaml" << EOF
            environment:
              OPENSSL_CONF: /usr/lib/ssl/openssl.cnf
              OPENSSL_MODULES: /usr/lib/${ARCH}-linux-gnu/ossl-modules
            EOF
        - name: build OCI config split .debs for openssl
          work-dir: ${source.dir}
          runs: |
            set -eux -o pipefail

            build_oci_config_deb() {
              pkg_name="$1"
              provides="$2"
              description="$3"
              yaml_src="$4"
              yaml_dest="$5"
              depends_pkg="$6"

              stage="${source.dir}/oci-config-stage/${pkg_name}"
              rm -rf "${stage}"
              mkdir -p "${stage}/DEBIAN" "${stage}/$(dirname "${yaml_dest}")"

              install -m 0644 "${yaml_src}" "${stage}/${yaml_dest}"

              cat > "${stage}/DEBIAN/control" << EOF
            Package: ${pkg_name}
            Source: openssl
            Version: 3.5.7-1~deb13u3+dhi2
            Architecture: all
            Maintainer: Docker Hardened Images <dhi@docker.com>
            Section: libs
            Priority: optional
            Depends: ${depends_pkg} (>= 3.5.7-1~deb13u3)
            Provides: ${provides}
            Homepage: https://docker.com/dhi
            Description: ${description}
             Ships a DHI build-time configuration snippet (environment) that
             downstream image definitions consume via apt-get install ${pkg_name}.
             Mirrors the apk openssl-provider-fips-oci-config subpackage.
            EOF

              dpkg-deb --root-owner-group --build "${stage}" "${source.dir}/"

              mkdir -p /debian/deb
              cp -p "${source.dir}/${pkg_name}_3.5.7-1~deb13u3+dhi2_all.deb" /debian/deb/
            }

            build_oci_config_deb \
              "openssl-provider-fips-oci-config" \
              "openssl-fips-oci-config, openssl-provider-fips-oci-config" \
              "FIPS-mode OCI build-time configuration snippet for openssl" \
              "${target.dir}/opt/docker/config/openssl-provider-fips.yaml" \
              "opt/docker/config/openssl-provider-fips.yaml" \
              "openssl-provider-fips"

            ls -la /debian/deb/openssl-provider-fips-oci-config*.deb
      paths:
        - type: file
          path: ${source.dir}/patch/CVE-2026-88822-bss-dgram-peer-addr.patch
          uid: 0
          gid: 0
          source: package/deb/main/openssl/patch/CVE-2026-88822-bss-dgram-peer-addr.patch
        - type: file
          path: ${source.dir}/patch/CVE-2026-88823-aes-gcm-siv-aad.patch
          uid: 0
          gid: 0
          source: package/deb/main/openssl/patch/CVE-2026-88823-aes-gcm-siv-aad.patch
        - type: file
          path: ${source.dir}/patch/CVE-2026-95692-aes-gcm-siv-iv-length.patch
          uid: 0
          gid: 0
          source: package/deb/main/openssl/patch/CVE-2026-95692-aes-gcm-siv-iv-length.patch
        - type: file
          path: ${source.dir}/patch/CVE-2026-95691-quic-crypto-retransmit.patch
          uid: 0
          gid: 0
          source: package/deb/main/openssl/patch/CVE-2026-95691-quic-crypto-retransmit.patch
        - type: file
          path: ${source.dir}/patch/CVE-2026-107496-ec-group-order-one.patch
          uid: 0
          gid: 0
          source: package/deb/main/openssl/patch/CVE-2026-107496-ec-group-order-one.patch
        - type: file
          path: ${source.dir}/patch/CVE-2026-107493-pem-x509-info-stack.patch
          uid: 0
          gid: 0
          source: package/deb/main/openssl/patch/CVE-2026-107493-pem-x509-info-stack.patch
