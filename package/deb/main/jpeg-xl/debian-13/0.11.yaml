contents:
  packages:
    - '!base-files'
  builds:
    - name: jpeg-xl deb
      work-dir: ${source.dir}/jpeg-xl
      contents:
        packages:
          - asciidoc-base
          - build-essential
          - cmake
          - debhelper
          - docbook-xml
          - docbook-xsl
          - dpkg-dev
          - help2man
          - libxml2-utils
          - libavif-dev
          - libbrotli-dev
          - libgdk-pixbuf-2.0-dev
          - libgflags-dev
          - libgif-dev
          - libgmock-dev
          - libgoogle-perftools-dev
          - libgtest-dev
          - libhwy-dev
          - libjpeg-dev
          - libjxl-testdata
          - liblcms2-dev
          - libopenexr-dev
          - libpng-dev
          - libwebp-dev
          - ninja-build
          - pkgconf
          - quilt
          - util-linux
        files:
          - url: https://deb.debian.org/debian/pool/main/j/jpeg-xl/jpeg-xl_0.11.2-0.1~deb13u2.dsc
            checksum: sha256:b978be4319975d73759f0737ba6935fad4f4330802835d6d9298a455c2581363
            path: ${source.dir}/jpeg-xl_0.11.2-0.1~deb13u2.dsc
            uid: 0
            gid: 0
          - url: https://deb.debian.org/debian/pool/main/j/jpeg-xl/jpeg-xl_0.11.2.orig.tar.gz
            checksum: sha256:ab38928f7f6248e2a98cc184956021acb927b16a0dee71b4d260dc040a4320ea
            path: ${source.dir}/jpeg-xl_0.11.2.orig.tar.gz
            uid: 0
            gid: 0
          - url: https://deb.debian.org/debian/pool/main/j/jpeg-xl/jpeg-xl_0.11.2-0.1~deb13u2.debian.tar.xz
            checksum: sha256:54192375c3ff271f395b815a8ea111a5f632f5db8966baeda9dabedbc86ea2d4
            path: ${source.dir}/jpeg-xl_0.11.2-0.1~deb13u2.debian.tar.xz
            uid: 0
            gid: 0
      pipeline:
        - uses: dpkg/source@v1
          work-dir: ${source.dir}
          with:
            file: jpeg-xl_0.11.2-0.1~deb13u2.dsc
            path: jpeg-xl
        - uses: dpkg/patch@v1
          with:
            apply: true
            patches:
              - ${source.dir}/patch/CVE-2026-52584.patch
        - uses: dpkg/bump@v1
          with:
            changelog:
              - Backport upstream libjxl fix for CVE-2026-52584
            version: 0.11.2-0.1~deb13u2+dhi1
        - name: bootstrap xml catalogs for offline docbook
          runs: |
            set -eux -o pipefail

            mkdir -p /etc/xml
            if [ ! -e /etc/xml/catalog ]; then
              xmlcatalog --noout --create /etc/xml/catalog
            fi
            xmlcatalog --noout --add nextCatalog "" file:///usr/share/xml/docbook/schema/dtd/4.5/catalog.xml /etc/xml/catalog
            xmlcatalog --noout --add nextCatalog "" file:///usr/share/xml/docbook/stylesheet/docbook-xsl/catalog.xml /etc/xml/catalog
        - uses: dpkg/build@v1
          environment:
            DEB_BUILD_PROFILES: nojava
            DEB_CXXFLAGS_MAINT_APPEND: -Wno-error=maybe-uninitialized
            XML_CATALOG_FILES: /etc/xml/catalog /usr/share/xml/docbook/stylesheet/docbook-xsl/catalog.xml /usr/share/xml/docbook/schema/dtd/4.5/catalog.xml
          with:
            args: --build=source,any -uc -us -d
      paths:
        - type: file
          path: ${source.dir}/patch/CVE-2026-52584.patch
          uid: 0
          gid: 0
          source: package/deb/main/jpeg-xl/patch/CVE-2026-52584.patch
