contents:
  packages:
    - '!base-files'
  builds:
    - name: lerc deb
      work-dir: ${source.dir}/lerc
      contents:
        packages:
          - build-essential
          - cmake
          - debhelper
          - dh-python
          - dpkg-dev
          - libblas3
          - liblapack3
          - pkg-kde-tools
          - python3-all
          - python3-numpy
          - python3-setuptools
        files:
          - url: https://deb.debian.org/debian/pool/main/l/lerc/lerc_4.0.0+ds-5.dsc
            checksum: sha256:84de8dac3dd5f5edc005c5c02be58c1f549f9365ad4147c138c85e07d624cc12
            path: ${source.dir}/lerc_4.0.0+ds-5.dsc
            uid: 0
            gid: 0
          - url: https://deb.debian.org/debian/pool/main/l/lerc/lerc_4.0.0+ds.orig.tar.xz
            checksum: sha256:acf855502fd3b950ee78f0b67bc9e9b39316b3526fbf6d8b8b1a9482fb756723
            path: ${source.dir}/lerc_4.0.0+ds.orig.tar.xz
            uid: 0
            gid: 0
          - url: https://deb.debian.org/debian/pool/main/l/lerc/lerc_4.0.0+ds-5.debian.tar.xz
            checksum: sha256:28ab2b1c19c845cd493e804bb9c43b47f72d5852281ebf832ed68a7576afbf6d
            path: ${source.dir}/lerc_4.0.0+ds-5.debian.tar.xz
            uid: 0
            gid: 0
      pipeline:
        - uses: dpkg/source@v1
          work-dir: ${source.dir}
          with:
            file: lerc_4.0.0+ds-5.dsc
            path: lerc
        - uses: dpkg/bump@v1
          with:
            changelog:
              - DHI Rebuild
            version: 4.0.0+ds-5+dhi1
        - name: wire BLAS/LAPACK sonames for numpy build tests
          runs: |
            set -eux -o pipefail

            multiarch="$(dpkg-architecture -qDEB_HOST_MULTIARCH)"
            update-alternatives --install "/usr/lib/${multiarch}/libblas.so.3" "libblas.so.3-${multiarch}" "/usr/lib/${multiarch}/blas/libblas.so.3" 100
            update-alternatives --install "/usr/lib/${multiarch}/liblapack.so.3" "liblapack.so.3-${multiarch}" "/usr/lib/${multiarch}/lapack/liblapack.so.3" 100
        - uses: dpkg/build@v1
          with:
            args: -uc -us -d
