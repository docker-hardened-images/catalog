        - uses: dpkg/bump@v1
          with:
            changelog:
              - DHI Rebuild
            version: 2.8.0-1+dhi0
        - name: provide which and install for mklove configure
          runs: |
            set -eux -o pipefail

            if ! command -v which > /dev/null 2>&1; then
              ln -sf /usr/bin/which.debianutils /usr/bin/which
