          with:
            changelog:
              - Backport upstream fixes for CVE-2026-53432 and CVE-2026-53433
            version: 0.60.3-1+dhi4
        - name: verify golang toolchain
          runs: |
            set -eux -o pipefail

            go version | grep -F 'go1.26.'
        - uses: dpkg/build@v1
          with:
            args: -uc -us -d
      paths:
        - type: directory
          path: ${source.dir}/patch
          uid: 0
