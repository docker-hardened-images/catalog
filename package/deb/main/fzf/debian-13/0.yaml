            checksum: sha256:bdef337774050c26c6c4a6f38bc4ccb0901450854cd7f667cb3a330166a9ada5
            path: ${source.dir}/fzf_0.60.3.orig.tar.gz
            uid: 0
            gid: 0
          - url: https://deb.debian.org/debian/pool/main/f/fzf/fzf_0.60.3-1.debian.tar.xz
            checksum: sha256:5480a5af7f45975b0533843b27a60de039d3b436b82acedb9ff66399a15a66ca
            path: ${source.dir}/fzf_0.60.3-1.debian.tar.xz
            uid: 0
            gid: 0
      pipeline:
        - uses: dpkg/source@v1
          work-dir: ${source.dir}
          with:
            file: fzf_0.60.3-1.dsc
            path: fzf
        - name: create debian patch stack directory
          runs: |
            set -eux -o pipefail

            mkdir -p debian/patches
        - uses: dpkg/patch@v1
          with:
            apply: true
            patches:
              - ${source.dir}/patch/dhi-cve-2026-53432-fuzzymatchv2-int-overflow.patch
              - ${source.dir}/patch/dhi-cve-2026-53433-listen-http-body-o2.patch
