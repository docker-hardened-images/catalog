          - golang-1.26=1.26.8-0
          - golang-1.26-oci-config=1.26.8-0
          - golang-github-charlievieth-fastwalk-dev
          - golang-github-gdamore-tcell.v2-dev
          - golang-github-junegunn-go-shellwords-dev
          - golang-github-mattn-go-isatty-dev
          - golang-github-rivo-uniseg-dev
          - golang-golang-x-sys-dev
          - golang-golang-x-term-dev
          - quilt
          - util-linux
        files:
          - url: https://deb.debian.org/debian/pool/main/f/fzf/fzf_0.60.3-1.dsc
            checksum: sha256:4f4bbdac23e0fc9e7d0fe3f0a5fbce738134b3b58a9f89a9af9a2bac2e219a70
