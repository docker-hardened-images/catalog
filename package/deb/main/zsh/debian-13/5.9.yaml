contents:
  packages:
    - '!base-files'
  builds:
    - name: zsh deb
      work-dir: ${source.dir}/zsh
      contents:
        packages:
          - build-essential
          - bsdextrautils
          - cm-super-minimal
          - debhelper
          - dpkg-dev
          - ghostscript
          - groff
          - groff-base
          - libcap-dev
          - libelf-dev
          - libgdbm-dev
          - libncurses-dev
          - libpcre2-dev
          - mawk
          - texinfo
          - texlive-fonts-recommended
          - texlive-latex-base
          - texlive-latex-recommended
          - util-linux
          - xz-utils
          - yodl
        files:
          - url: https://deb.debian.org/debian/pool/main/z/zsh/zsh_5.9-8.dsc
            checksum: sha256:70243621157eae194ccfacfc95fb22f23237f8395b0627455a6002788c7efa77
            path: ${source.dir}/zsh_5.9-8.dsc
            uid: 0
            gid: 0
          - url: https://deb.debian.org/debian/pool/main/z/zsh/zsh_5.9.orig.tar.xz
            checksum: sha256:9b8d1ecedd5b5e81fbf1918e876752a7dd948e05c1a0dba10ab863842d45acd5
            path: ${source.dir}/zsh_5.9.orig.tar.xz
            uid: 0
            gid: 0
          - url: https://deb.debian.org/debian/pool/main/z/zsh/zsh_5.9-8.debian.tar.xz
            checksum: sha256:001e005ed93c3c93fd3474ddbd473c06770ce470188a299a58aeb73106f1bcb2
            path: ${source.dir}/zsh_5.9-8.debian.tar.xz
            uid: 0
            gid: 0
      pipeline:
        - uses: dpkg/source@v1
          work-dir: ${source.dir}
          with:
            file: zsh_5.9-8.dsc
            path: zsh
        - name: skip zsh.pdf target (no TeX formats in hermetic builder)
          runs: |
            set -eux -o pipefail

            sed -i '/dh_auto_build -B obj -- pdf/d' debian/rules
            sed -i '/obj\/Doc\/zsh\.pdf/d' debian/zsh-doc.docs
            sed -i '/^Format: PDF$/,/^Files: .*zsh\.pdf$/d' debian/zsh-doc.doc-base.manual
            ! grep -q 'dh_auto_build -B obj -- pdf' debian/rules
            ! grep -q 'zsh\.pdf' debian/zsh-doc.docs
            ! grep -q 'zsh\.pdf' debian/zsh-doc.doc-base.manual
        - uses: dpkg/bump@v1
          with:
            changelog:
              - DHI Rebuild
            version: 5.9-8+deb13u0+dhi0
        - uses: dpkg/build@v1
          with:
            args: -uc -us -d
