        - uses: dpkg/source@v1
          work-dir: ${source.dir}
          with:
            file: onnxruntime_1.21.0+dfsg-1.dsc
            path: onnxruntime-1.21.0+dfsg
        - uses: dpkg/bump@v1
          with:
            changelog:
              - DHI Rebuild
            version: 1.21.0+dfsg-1+dhi0
        - name: wire BLAS/LAPACK sonames for numpy cmake targets
          runs: |
            set -eux -o pipefail

            multiarch="$(dpkg-architecture -qDEB_HOST_MULTIARCH)"
            update-alternatives --install "/usr/lib/${multiarch}/libblas.so.3" "libblas.so.3-${multiarch}" "/usr/lib/${multiarch}/blas/libblas.so.3" 100
            update-alternatives --install "/usr/lib/${multiarch}/liblapack.so.3" "liblapack.so.3-${multiarch}" "/usr/lib/${multiarch}/lapack/liblapack.so.3" 100
        - uses: dpkg/build@v1
          environment:
            DEB_BUILD_MAINT_OPTIONS: hardening=+all,-fortify
            DEB_CXXFLAGS_APPEND: -Wno-error=array-bounds
          with:
            args: -uc -us -d
