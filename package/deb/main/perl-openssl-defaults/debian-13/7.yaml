# syntax=dhi.io/build:2-debian13

image: dhi.io/pkg-perl-openssl-defaults
variant: runtime
tags:
  - 7-deb13u0-dhi0
  - 7-deb13u0-dhi0-debian13
platforms:
  - linux/amd64
  - linux/arm64
vars:
  DEBIAN_DEBIAN_FILENAME: ${DEBIAN_DEBIAN_URL:^.+/(.+)$}
  DEBIAN_DSC_CHECKSUM: sha256:c882bc770f7a6ae62f4957d4a0970cd895e18581fa772e2f69b73efb874b7933
  DEBIAN_DSC_FILENAME: perl-openssl-defaults_7.dsc
  DEBIAN_DSC_URL: https://deb.debian.org/debian/pool/main/p/perl-openssl-defaults/perl-openssl-defaults_7.dsc
  DEBIAN_FILENAME_VERSION: "7"
  DEBIAN_ORIG_CHECKSUM: sha256:af77abf3419419a082da0848247dd4b5ad31789e95c4966e58adcdb35244b61f
  DEBIAN_ORIG_FILENAME: perl-openssl-defaults_7.tar.xz
  DEBIAN_ORIG_URL: https://deb.debian.org/debian/pool/main/p/perl-openssl-defaults/perl-openssl-defaults_7.tar.xz
  DEBIAN_VERSION: "7"
  DHI_REL: "0"
  DHI_VERSION: 7+deb13u0+dhi0
  TAG_VERSION: 7-deb13u0-dhi0
  UPSTREAM_VERSION: "7"
contents:
  packages:
    - '!base-files'
  builds:
    - name: perl-openssl-defaults deb
      work-dir: ${source.dir}/perl-openssl-defaults
      contents:
        packages:
          - binutils
          - build-essential
          - debhelper
          - debianutils
          - dpkg-dev
          - libperl-dev
          - libssl-dev
          - perl
        files:
          - url: https://deb.debian.org/debian/pool/main/p/perl-openssl-defaults/perl-openssl-defaults_7.dsc
            checksum: sha256:c882bc770f7a6ae62f4957d4a0970cd895e18581fa772e2f69b73efb874b7933
            path: ${source.dir}/perl-openssl-defaults_7.dsc
            uid: 0
            gid: 0
          - url: https://deb.debian.org/debian/pool/main/p/perl-openssl-defaults/perl-openssl-defaults_7.tar.xz
            checksum: sha256:af77abf3419419a082da0848247dd4b5ad31789e95c4966e58adcdb35244b61f
            path: ${source.dir}/perl-openssl-defaults_7.tar.xz
            uid: 0
            gid: 0
      pipeline:
        - uses: dpkg/source@v1
          work-dir: ${source.dir}
          with:
            file: perl-openssl-defaults_7.dsc
            path: perl-openssl-defaults
            remove-original: false
        - name: remove upstream source artifacts
          work-dir: ${source.dir}
          runs: |
            set -eux -o pipefail

            rm perl-openssl-defaults_7.dsc perl-openssl-defaults_7.tar.xz
        - uses: dpkg/bump@v1
          with:
            changelog:
              - DHI Rebuild
            version: 7+deb13u0+dhi0
        - name: provide which for get-libssl-abi
          runs: |
            set -eux -o pipefail

            if ! command -v which > /dev/null 2>&1; then
              ln -sf /usr/bin/which.debianutils /usr/bin/which
            fi

            which "$(dpkg-architecture -qDEB_HOST_GNU_TYPE)-objdump"
        - uses: dpkg/build@v1
          with:
            args: -uc -us -d
        - name: assert perl-openssl-abi provide
          runs: |
            set -eux -o pipefail

            for deb in /debian/deb/perl-openssl-defaults_*.deb; do
              dpkg-deb -f "$deb" Provides | grep -q 'perl-openssl-abi-3'
            done
os-release:
  name: Docker Hardened Images (Debian)
  id: debian
  version-id: "13"
  version-codename: trixie
  pretty-name: Docker Hardened Images/Debian GNU/Linux 13 (trixie)
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
