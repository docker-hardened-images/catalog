        - uses: dpkg/bump@v1
          with:
            changelog:
              - DHI Rebuild
            version: 1:11.8.6-0+deb13u1+dhi0
        - name: wire openjdk tools on PATH
          runs: |
            set -eux -o pipefail

            mkdir -p /usr/local/bin
            jbindir=""
            for d in /usr/lib/jvm/java-*/bin; do
              if [ -x "${d}/jar" ] && [ -x "${d}/java" ] && [ -x "${d}/javac" ]; then
                jbindir="${d}"
                break
              fi
            done
            test -n "${jbindir}"
            for tool in java jar javac javadoc javah; do
              if [ -x "${jbindir}/${tool}" ]; then
                ln -sf "${jbindir}/${tool}" "/usr/local/bin/${tool}"
              fi
            done
        - uses: dpkg/build@v1
          environment:
            DEB_CFLAGS_APPEND: -fPIC
            DEB_CXXFLAGS_APPEND: -fPIC
          with:
            args: -uc -us -d
