# syntax=dhi.io/build:2-debian13

image: dhi.io/pkg-golang
variant: runtime
tags:
  - 1.26.11-18
  - 1.26.11-18-debian13
platforms:
  - linux/amd64
  - linux/arm64
vars:
  COMMIT_SHA: 26b4433366fce47e480679e0b5a30222b63996e0
  DHI_REL: "18"
  DHI_VERSION: 1.26.11-18
  PACKAGE_NAME: golang-1.26
  SEMVER_MAJOR_MINOR_VERSION: "1.26"
  VERSION: 1.26.11
contents:
  packages:
    - '!base-files'
  builds:
    - name: golang-1.26
      work-dir: ${source.dir}/golang-1.26
      contents:
        repositories:
          - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
        keyring:
          - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
        packages:
          - bash
          - build-essential
          - binutils
          - coreutils
          - debhelper
          - dpkg-dev
          - findutils
          - golang-1.27
          - grep
          - git
          - sed
        files:
          - url: git+https://github.com/golang/go.git#go1.26.11
            checksum: 26b4433366fce47e480679e0b5a30222b63996e0
            path: ${source.dir}/golang-1.26
            uid: 0
            gid: 0
      pipeline:
        - name: setup
          runs: |
            set -eux -o pipefail

            # Remove .git artifacts from the source
            rm -rf .git .gitattributes .github .gitignore

            # Finalize debian/ templates in-place
            sed -i -e "s/@PACKAGE_NAME@/golang-1.26/g" \
              -e "s/@MAJOR_MINOR_VERSION@/1.26/g" \
              debian/control.in debian/changelog \
              debian/golang-oci-config.install.in \
              debian/golang-fips-oci-config.install.in
            mv debian/control.in debian/control
            mv debian/golang.install.in "debian/golang-1.26.install"
            mv debian/golang-oci-config.install.in "debian/golang-1.26-oci-config.install"
            mv debian/golang-fips-oci-config.install.in "debian/golang-1.26-fips-oci-config.install"
        - name: bump bootstrap module versions
          privileged: true
          runs: |
            set -eux -o pipefail

            export PATH="/usr/lib/go/bin:/usr/bin:/usr/local/bin:${PATH}"
            export GOPROXY=https://proxy.golang.org,direct
            export GOSUMDB=sum.golang.org
            export GO111MODULE=on
            export GOWORK=off

            root="${source.dir}/golang-1.26"

            export GOTOOLCHAIN=local
            unset GOROOT
            test -x /usr/lib/go/bin/go
            go version
            export GOROOT="${root}"

            if [ "1.26" = "1.27" ]; then
              http3_overlay="$(mktemp -d)"
              cp -a "${root}/src/vendor/golang.org/x/net/http3" "${http3_overlay}/http3"
              cp -a "${root}/src/vendor/golang.org/x/net/internal/http3" "${http3_overlay}/internal-http3"

              (cd "${root}/src" && GOFLAGS=-mod=mod go mod download golang.org/x/net@v0.62.0)
              net_module_dir="$(go env GOMODCACHE)/golang.org/x/net@v0.62.0"
              test -d "${net_module_dir}"
              chmod -R u+w "${net_module_dir}"
              rm -rf "${net_module_dir}/http3" "${net_module_dir}/internal/http3"
              cp -a "${http3_overlay}/http3" "${net_module_dir}/http3"
              cp -a "${http3_overlay}/internal-http3" "${net_module_dir}/internal/http3"
              sed -i 's/quic\.ApplicationError/quic.ConnectionCloseError/g' \
                "${net_module_dir}/internal/http3/server.go" \
                "${net_module_dir}/internal/http3/transport.go"
            fi

            (
              cd "${root}/src"
              GOFLAGS=-mod=mod go get golang.org/x/net@v0.62.0
              GOFLAGS=-mod=mod go get golang.org/x/crypto@v0.58.0
              GOFLAGS=-mod=mod go get golang.org/x/text@v0.43.0
              if grep -q 'golang.org/x/sys' go.mod; then
                GOFLAGS=-mod=mod go get golang.org/x/sys@v0.49.0
              fi
              GOFLAGS=-mod=mod go mod tidy
              GOFLAGS=-mod=mod go mod vendor
            )
            (
              cd "${root}/src/cmd"
              GOFLAGS=-mod=mod go get golang.org/x/mod@v0.40.0
              GOFLAGS=-mod=mod go get golang.org/x/text@v0.41.0
              GOFLAGS=-mod=mod go mod tidy
              GOFLAGS=-mod=mod go mod vendor
            )

            while IFS= read -r -d '' gomod; do
              moddir="$(dirname "$gomod")"
              case "$moddir" in
                */_asm | */_asm/*)
                  sed -i 's|golang.org/x/mod v[^[:space:]]*|golang.org/x/mod v0.40.0|g' "$gomod"
                  ;;
              esac
            done < <(find "${root}/src" -name go.mod -type f -print0)

            for mod in "${root}/src/go.mod" "${root}/src/cmd/go.mod"; do
              sed -i "s/^go .*/go 1.26/" "$mod"
              sed -i '/^toolchain /d' "$mod"
            done

            grep -q '^# golang.org/x/net v0.62.0$' "${root}/src/vendor/modules.txt"
            grep -q '^# golang.org/x/crypto v0.58.0$' "${root}/src/vendor/modules.txt"
            if [ "1.26" = "1.27" ]; then
              test -d "${root}/src/vendor/golang.org/x/net/http3"
              test -d "${root}/src/vendor/golang.org/x/net/internal/http3"
            fi
            grep -q '^# golang.org/x/text v0.43.0$' "${root}/src/vendor/modules.txt"
            grep -q '^# golang.org/x/sys v0.49.0$' "${root}/src/vendor/modules.txt"
            grep -q '^# golang.org/x/mod v0.40.0$' "${root}/src/cmd/vendor/modules.txt"
            grep -q '^# golang.org/x/text v0.41.0$' "${root}/src/cmd/vendor/modules.txt"
        - name: generate oci config
          runs: |
            set -eux -o pipefail

            mkdir -p oci-config
            cat > oci-config/golang-1.26.yaml << 'EOF'
            environment:
              GODEBUG: "tarinsecurepath=0,zipinsecurepath=0"
              GOPATH: /go
              GOTOOLCHAIN: "local"
              PATH: /go/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
            paths:
              - type: directory
                path: /go
                uid: 65532
                gid: 65532
                mode: "1777"
              - type: directory
                path: /go/bin
                uid: 65532
                gid: 65532
                mode: "1777"
              - type: directory
                path: /go/src
                uid: 65532
                gid: 65532
                mode: "1777"
              - type: directory
                path: /usr/src
                uid: 65532
                gid: 65532
                mode: "1777"
              - type: directory
                path: /go/pkg
                uid: 65532
                gid: 65532
                mode: "1777"
            EOF
            cat > oci-config/golang-1.26-fips.yaml << 'EOF'
            environment:
              GODEBUG: "fips140=on,tarinsecurepath=0,zipinsecurepath=0"
              # https://go.dev/doc/security/fips140#the-gofips140-environment-variable
              # set to the version that is currently undergoing FIPS certification
              GOFIPS140: v1.0.0
            EOF
        - uses: dpkg/bump@v1
          with:
            changelog:
              - Bump vendored golang.org/x modules to remediate CVE-2025-47911, CVE-2025-47913, CVE-2025-47914, CVE-2025-58181, CVE-2025-58190, CVE-2026-25680, CVE-2026-25681, CVE-2026-27136, CVE-2026-33814, CVE-2026-39821, CVE-2026-39824, CVE-2026-39827, CVE-2026-39828, CVE-2026-39829, CVE-2026-39830, CVE-2026-39831, CVE-2026-39832, CVE-2026-39833, CVE-2026-39834, CVE-2026-39835, CVE-2026-42502, CVE-2026-42506, CVE-2026-42508, CVE-2026-46595, CVE-2026-46597, CVE-2026-46598, CVE-2026-46600, CVE-2026-56851, CVE-2026-56852, CVE-2026-56854, CVE-2026-56855, CVE-2026-56864, CVE-2026-56865, CVE-2026-78661, CVE-2026-78662, CVE-2026-97045
            version: 1.26.11-18
        - uses: dpkg/build@v1
          environment:
            DHI_GOROOT_BOOTSTRAP: /usr/lib/go
          with:
            args: -b -uc -us -d
      paths:
        - type: directory
          path: ${source.dir}/golang-1.26/debian
          uid: 0
          gid: 0
          mode: "0600"
          source: package/deb/main/golang/debian-13/debian
