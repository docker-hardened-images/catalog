contents:
  packages:
    - '!base-files'
  builds:
    - name: libkml deb
      work-dir: ${source.dir}/libkml
      contents:
        packages:
          - build-essential
          - cmake
          - debhelper
          - dpkg-dev
          - libboost-dev
          - libcurl4-gnutls-dev
          - libexpat1-dev
          - libgtest-dev
          - libminizip-dev
          - liburiparser-dev
          - pkg-kde-tools
          - quilt
          - util-linux
          - zlib1g-dev
        files:
          - url: https://deb.debian.org/debian/pool/main/libk/libkml/libkml_1.3.0-12.dsc
            checksum: sha256:6ab8306bd9081dd237919bb3db7a3b4cca4fbca0c8475d2723732a01b0d5606b
            path: ${source.dir}/libkml_1.3.0-12.dsc
            uid: 0
            gid: 0
          - url: https://deb.debian.org/debian/pool/main/libk/libkml/libkml_1.3.0.orig.tar.gz
            checksum: sha256:8892439e5570091965aaffe30b08631fdf7ca7f81f6495b4648f0950d7ea7963
            path: ${source.dir}/libkml_1.3.0.orig.tar.gz
            uid: 0
            gid: 0
          - url: https://deb.debian.org/debian/pool/main/libk/libkml/libkml_1.3.0-12.debian.tar.xz
            checksum: sha256:060d85625d62fcb7750140eac0a8e2f64dd83f5d19601af2865fa832d5dafc72
            path: ${source.dir}/libkml_1.3.0-12.debian.tar.xz
            uid: 0
            gid: 0
      pipeline:
        - uses: dpkg/source@v1
          work-dir: ${source.dir}
          with:
            file: libkml_1.3.0-12.dsc
            path: libkml
        - uses: dpkg/bump@v1
          with:
            changelog:
              - DHI Rebuild
            version: 1.3.0-12+deb13u0+dhi0
        - name: copy source for upstream test suite
          work-dir: ${source.dir}
          runs: |
            set -eux -o pipefail

            rm -rf /tmp/libkml-check
            cp -a libkml /tmp/libkml-check
        - name: patch CI copy for upstream test suite
          work-dir: /tmp/libkml-check
          runs: |
            set -eux -o pipefail

            sed -i 's/set(GTEST_LIBRARY ${GTEST_LIB} ${GTESTMAIN_LIB})/set(GTEST_LIBRARY ${GTESTMAIN_LIB} ${GTEST_LIB})/' cmake/FindGoogleTest.cmake
            grep -qF 'set(GTEST_LIBRARY ${GTESTMAIN_LIB} ${GTEST_LIB})' cmake/FindGoogleTest.cmake
            sed -i 's/static char a\[2\];/static char a[3];/' tests/kml/base/string_util_test.cc
            grep -qF 'static char a[3];' tests/kml/base/string_util_test.cc
        - name: upstream tests CTest
          work-dir: /tmp/libkml-check
          runs: |
            set -eux -o pipefail

            cmake -S . -B build -DBUILD_TESTING=ON -DBUILD_EXAMPLES=OFF > configure.log 2>&1 || {
              tail -n 80 configure.log
              exit 1
            }
            cmake --build build -j"$(nproc)" > make.log 2>&1 || {
              tail -n 120 make.log
              exit 1
            }
            ctest --test-dir build --output-on-failure > ctest.log 2>&1 || {
              ctest --test-dir build --rerun-failed --output-on-failure || true
              tail -n 40 ctest.log
              exit 1
            }
            tail -n 5 ctest.log
            grep -q "100% tests passed, 0 tests failed" ctest.log
        - uses: dpkg/build@v1
          with:
            args: -uc -us -d
