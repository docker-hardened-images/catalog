image: dhi.io/pkg-pycodestyle
variant: runtime
tags:
  - 2.12.1-2-deb13u0-dhi0
  - 2.12.1-2-deb13u0-dhi0-debian13
platforms:
  - linux/amd64
  - linux/arm64
vars:
  DEBIAN_DEBIAN_CHECKSUM: sha256:bf932527d8647ea9b9f2ede1f065d3a8fa1d1148aa9e52b9bedd785d1d419029
  DEBIAN_DEBIAN_FILENAME: pycodestyle_2.12.1-2.debian.tar.xz
  DEBIAN_DEBIAN_URL: https://deb.debian.org/debian/pool/main/p/pycodestyle/pycodestyle_2.12.1-2.debian.tar.xz
  DEBIAN_DSC_CHECKSUM: sha256:00b25813f3029f0326404f51d9d124ff1db7bb7258eafb7566f65422ba5e2377
  DEBIAN_DSC_FILENAME: pycodestyle_2.12.1-2.dsc
  DEBIAN_DSC_URL: https://deb.debian.org/debian/pool/main/p/pycodestyle/pycodestyle_2.12.1-2.dsc
  DEBIAN_FILENAME_VERSION: 2.12.1-2
  DEBIAN_ORIG_CHECKSUM: sha256:fc4ee85ef4942be9bcc9da138d26c027b64fef6185b5796f1edb4882b8774443
  DEBIAN_ORIG_FILENAME: pycodestyle_2.12.1.orig.tar.gz
  DEBIAN_ORIG_URL: https://deb.debian.org/debian/pool/main/p/pycodestyle/pycodestyle_2.12.1.orig.tar.gz
  DEBIAN_VERSION: 2.12.1-2
  DHI_REL: "0"
  DHI_VERSION: 2.12.1-2+deb13u0+dhi0
  TAG_VERSION: 2.12.1-2-deb13u0-dhi0
  UPSTREAM_VERSION: 2.12.1
contents:
  packages:
    - '!base-files'
  builds:
    - name: pycodestyle deb
      work-dir: ${source.dir}/pycodestyle
      contents:
        packages:
          - debhelper
          - dh-python
          - dpkg-dev
          - python3-all
          - python3-pytest
          - python3-setuptools
          - quilt
          - util-linux
        files:
          - url: https://deb.debian.org/debian/pool/main/p/pycodestyle/pycodestyle_2.12.1-2.dsc
            checksum: sha256:00b25813f3029f0326404f51d9d124ff1db7bb7258eafb7566f65422ba5e2377
            path: ${source.dir}/pycodestyle_2.12.1-2.dsc
            uid: 0
            gid: 0
          - url: https://deb.debian.org/debian/pool/main/p/pycodestyle/pycodestyle_2.12.1.orig.tar.gz
            checksum: sha256:fc4ee85ef4942be9bcc9da138d26c027b64fef6185b5796f1edb4882b8774443
            path: ${source.dir}/pycodestyle_2.12.1.orig.tar.gz
            uid: 0
            gid: 0
          - url: https://deb.debian.org/debian/pool/main/p/pycodestyle/pycodestyle_2.12.1-2.debian.tar.xz
            checksum: sha256:bf932527d8647ea9b9f2ede1f065d3a8fa1d1148aa9e52b9bedd785d1d419029
            path: ${source.dir}/pycodestyle_2.12.1-2.debian.tar.xz
            uid: 0
            gid: 0
      pipeline:
        - uses: dpkg/source@v1
          work-dir: ${source.dir}
          with:
            file: pycodestyle_2.12.1-2.dsc
            path: pycodestyle
        - name: use explicit Python install destinations
          runs: |
            set -eux -o pipefail

            python3 - << 'PY'
            from pathlib import Path

            path = Path("debian/rules")
            rules = path.read_text()
            marker = "%:\n"
            assert rules.count(marker) == 1
            override = (
                "override_dh_auto_install:\n"
                "\tpython3 setup.py install --root=$(CURDIR)/debian/python3-pycodestyle --prefix=/usr "
                "--install-purelib=/usr/lib/python3/dist-packages "
                "--install-platlib=/usr/lib/python3/dist-packages --install-data=/usr --install-scripts=/usr/bin\n\n"
            )
            path.write_text(rules.replace(marker, override + marker))
            PY

            grep -Fq -- '--install-purelib=/usr/lib/python3/dist-packages' debian/rules
            grep -Fq -- '--install-scripts=/usr/bin' debian/rules
        - uses: dpkg/bump@v1
          with:
            changelog:
              - DHI Rebuild
            version: 2.12.1-2+deb13u0+dhi0
        - uses: dpkg/build@v1
          with:
            args: -uc -us -d
