contents:
  packages:
    - '!base-files'
  builds:
    - name: dh-lua deb
      work-dir: ${source.dir}/dh-lua
      contents:
        packages:
          - debhelper
          - dpkg-dev
          - perl
          - python3-markdown
          - txt2man
        files:
          - url: https://deb.debian.org/debian/pool/main/d/dh-lua/dh-lua_33.dsc
            checksum: sha256:1a56e84339f727937c54210e06032e9d4ea56a4cea0d38ce2453f73996d8a816
            path: ${source.dir}/dh-lua_33.dsc
            uid: 0
            gid: 0
          - url: https://deb.debian.org/debian/pool/main/d/dh-lua/dh-lua_33.tar.xz
            checksum: sha256:435a249a4fd90a74d511e2ca7d4fb4b659236fa9b37f732b337d1333c9a2bed4
            path: ${source.dir}/dh-lua_33.tar.xz
            uid: 0
            gid: 0
      pipeline:
        - uses: dpkg/source@v1
          work-dir: ${source.dir}
          with:
            file: dh-lua_33.dsc
            path: dh-lua
            remove-original: false
        - name: remove upstream source artifacts
          work-dir: ${source.dir}
          runs: |
            set -eux -o pipefail

            rm dh-lua_33.dsc dh-lua_33.tar.xz
        - uses: dpkg/bump@v1
          with:
            changelog:
              - DHI Rebuild
            version: 33+deb13u0+dhi0
        - uses: dpkg/build@v1
          with:
            args: -uc -us -d
