# syntax=dhi.io/build:2-debian13

image: dhi.io/pkg-cilium-envoy
variant: runtime
tags:
  - 1.18.12
  - 1.18.12-r2
  - 1.18.12-debian13
  - 1.18.12-r2-debian13
platforms:
  - linux/amd64
  - linux/arm64
dates:
  release: "2025-07-29"
vars:
  BAZEL_ARCH: '#{ target.arch == "amd64" ? "x86_64" : "arm64" }'
  BAZEL_VERSION: 7.7.1
  CILIUM_COMMIT_SHA: c2cd21cf99352ac16f451c684ba62807b18542e3
  CILIUM_ENVOY_COMMIT_SHA: edeb3f2af56c37c407efa1f63f0b32f595399bbc
  CILIUM_ENVOY_VERSION: 1.36.9
  CLANG_VERSION: "18"
  GOLANG_MAJOR_MINOR_VERSION: "1.26"
  GOLANG_VERSION: 1.26.6-0
  PACKAGE_NAME: cilium-envoy-1.18
  REL: "2"
  SEMVER_MAJOR_MINOR_VERSION: "1.18"
  SEMVER_MAJOR_VERSION: "1"
  SEMVER_VERSION: 1.18.12
  VERSION: 1.18.12
contents:
  packages:
    - base-files
  builds:
    - name: cilium-envoy-1.18
      work-dir: /go/src/github.com/cilium/proxy
      environment:
        PATH: /opt/bazel/bin:/go/bin:/usr/local/go/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
      caches:
        - path: /bazel-disk-cache
        - path: /bazel-repo-cache
        - path: /go/pkg/mod
      contents:
        repositories:
          - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
        keyring:
          - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
        packages:
          - autoconf
          - automake
          - bash
          - build-essential
          - ca-certificates
          - clang
          - clang-18
          - clang-format-18
          - clang-tidy-18
          - clang-tools-18
          - clangd-18
          - cmake
          - coreutils
          - curl
          - diffutils
          - findutils
          - gawk
          - git
          - golang-1.26=1.26.6-0
          - golang-1.26-oci-config=1.26.6-0
          - grep
          - gzip
          - libatomic1
          - libc++-18-dev
          - libc++abi-18-dev
          - libstdc++-14-dev
          - libtool
          - lld-18
          - lldb-18
          - llvm-18-dev
          - make
          - ninja-build
          - patch
          - patchelf
          - python-3.12
          - python-3.12-dev
          - python3-pip
          - python3-setuptools
          - python3-wheel
          - sed
        files:
          - url: git+https://github.com/cilium/proxy.git#edeb3f2af56c37c407efa1f63f0b32f595399bbc
            checksum: edeb3f2af56c37c407efa1f63f0b32f595399bbc
            path: /go/src/github.com/cilium/proxy
            spdx:
              name: cilium-envoy
              version: 1.36.9
              packages:
                - name: proxy
                  purl: pkg:golang/github.com/cilium/proxy@edeb3f2af56c37c407efa1f63f0b32f595399bbc
                  license: Apache-2.0
            uid: 0
            gid: 0
          - url: https://github.com/bazelbuild/bazel/releases/download/7.7.1/bazel-7.7.1-linux-${BAZEL_ARCH}
            checksum: https://github.com/bazelbuild/bazel/releases/download/7.7.1/bazel-7.7.1-linux-${BAZEL_ARCH}.sha256
            path: /opt/bazel/bin/bazel
            uid: 0
            gid: 0
            mode: "0755"
      pipeline:
        - name: update go dependencies (1.18 only)
          uses: go/bump@v2
          work-dir: /go/src/github.com/cilium/proxy
          caches:
            - path: /go/pkg/mod
          with:
            deps:
              - golang.org/x/sys@v0.46.0
              - golang.org/x/net@v0.56.0
              - golang.org/x/text@v0.39.0
              - google.golang.org/grpc@v1.82.1
            download: true
        - name: setup
          work-dir: /go/src/github.com/cilium/proxy
          runs: |
            set -eux -o pipefail

            echo edeb3f2af56c37c407efa1f63f0b32f595399bbc > SOURCE_VERSION

            ln -sf "$(command -v clang-18)" /usr/bin/clang
            ln -sf "$(command -v clang++-18)" /usr/bin/clang++
            ln -sf "$(command -v clang-cpp-18)" /usr/bin/clang-cpp
            ln -sf "$(command -v lld-18)" /usr/bin/lld
            ln -sf "$(command -v ld.lld-18)" /usr/bin/ld.lld
            ln -sf "$(command -v lldb-18)" /usr/bin/lldb
            ln -sf "$(command -v clang-format-18)" /usr/bin/clang-format
            ln -sf "$(command -v clang-tidy-18)" /usr/bin/clang-tidy
            ln -sf "$(command -v run-clang-tidy-18)" /usr/bin/run-clang-tidy
            ln -sf "$(command -v llvm-ar-18)" /usr/bin/ar
            ln -sf "$(command -v llvm-ar-18)" /usr/bin/llvm-ar
            ln -sf "$(command -v llvm-ranlib-18)" /usr/bin/ranlib
            ln -sf "$(command -v llvm-ranlib-18)" /usr/bin/llvm-ranlib
            ln -sf "$(command -v llvm-nm-18)" /usr/bin/llvm-nm
            ln -sf "$(command -v llvm-strip-18)" /usr/bin/llvm-strip
            ln -sf "$(command -v llvm-objcopy-18)" /usr/bin/llvm-objcopy
            ln -sf "$(command -v llvm-objdump-18)" /usr/bin/llvm-objdump
            ln -sf "$(command -v llvm-dwp-18)" /usr/bin/llvm-dwp
            ln -sf "$(command -v llvm-cov-18)" /usr/bin/llvm-cov
            ln -sf "$(command -v llvm-config-18)" /usr/bin/llvm-config
        - name: build-proxylib
          work-dir: /go/src/github.com/cilium/proxy/proxylib
          runs: |
            set -eux -o pipefail

            export GOCACHE="/tmp/go-build-cilium-envoy-1.18"
            if [ "false" != "true" ]; then
              GOFLAGS=-p=1 make test
            fi

            export CC=clang
            export CGO_LDFLAGS="-fuse-ld=lld"
            GOFIPS140=off make all

            install -D libcilium.so ${target.dir}/usr/lib/libcilium.so
        - name: build-proxy
          work-dir: /go/src/github.com/cilium/proxy
          privileged: true
          runs: |
            set -eux -o pipefail

            BAZEL_BUILD_OPTS=(
              --curses=no
              --keep_going=false
              --verbose_failures
              --sandbox_debug
              --output_filter='.*'
              --jobs=auto
              --disk_cache=/bazel-disk-cache
              --repository_cache=/bazel-repo-cache
              --experimental_guard_against_concurrent_changes
              --experimental_disk_cache_gc_max_size=5G
              --experimental_disk_cache_gc_max_age=30d
            )

            if [ "false" = "true" ]; then
              BAZEL_BUILD_OPTS+=(
                --define=boringssl=fips
                --cxxopt=-stdlib=libc++
                --linkopt=-lc++
                --linkopt=-lc++abi
                --repo_env=BAZEL_USE_HOST_SYSROOT=True
              )
            fi

            test '${target.arch}' = 'arm64' && BAZEL_BUILD_OPTS+=(--cpu=aarch64)

            CARGO_BAZEL_REPIN=true BAZEL_OPTS=--batch BAZELRC_FILE="${PWD}/clang.bazelrc" DESTDIR=${target.dir}/ \
              BAZEL_BUILD_OPTS="${BAZEL_BUILD_OPTS[@]}" PKG_BUILD=1 V=1 make install
        - name: envoy bazel sbom
          work-dir: /go/src/github.com/cilium/proxy
          privileged: true
          runs: |
            set -eux -o pipefail

            BAZEL_ANALYSIS_OPTS=()
            if [ "false" = "true" ]; then
              BAZEL_ANALYSIS_OPTS+=(
                --define=boringssl=fips
                --cxxopt=-stdlib=libc++
                --linkopt=-lc++
                --linkopt=-lc++abi
                --repo_env=BAZEL_USE_HOST_SYSROOT=True
              )
            fi
            test '${target.arch}' = 'arm64' && BAZEL_ANALYSIS_OPTS+=(--cpu=aarch64)

            mkdir -p /opt/docker/sbom/envoy
            python ${source.dir}/envoy-bazel-to-spdx.py \
              "cilium-envoy-1.18-${target.arch}" \
              "1.36.9" \
              "${BAZEL_ANALYSIS_OPTS[@]}" \
              > /opt/docker/sbom/envoy/.spdx.envoy.json
        - name: test-proxy
          work-dir: /go/src/github.com/cilium/proxy
          privileged: true
          runs: |
            set -eux -o pipefail

            BAZEL_BUILD_OPTS=(
              --curses=no
              --keep_going=false
              --verbose_failures
              --sandbox_debug
              --jobs=auto
              --disk_cache=/bazel-disk-cache
              --repository_cache=/bazel-repo-cache
              --experimental_guard_against_concurrent_changes
              --experimental_disk_cache_gc_max_size=5G
              --experimental_disk_cache_gc_max_age=30d
            )

            if [ "false" = "true" ]; then
              BAZEL_BUILD_OPTS+=(
                --define=boringssl=fips
                --cxxopt=-stdlib=libc++
                --linkopt=-lc++
                --linkopt=-lc++abi
                --repo_env=BAZEL_USE_HOST_SYSROOT=True
              )
            fi

            test '${target.arch}' = 'arm64' && BAZEL_BUILD_OPTS+=(--cpu=aarch64)

            BAZEL_OPTS=--batch BAZEL_BUILD_OPTS="${BAZEL_BUILD_OPTS[@]}" PKG_BUILD=1 V=1 \
              make -f Makefile -f "${source.dir}/envoy-tests-tier-ab.mk" envoy-tests-ci
        - uses: dhi/build-pkg:0
          with:
            deb:
              depends:
                - libatomic1
                - libc6
                - libgcc-s1
            description: Cilium Envoy proxy — cilium-envoy and cilium-envoy-starter binaries
            files:
              - usr/bin/cilium-envoy
              - usr/bin/cilium-envoy-starter
              - usr/lib/libcilium.so
            formats:
              - deb
            license: Apache-2.0
            name: cilium-envoy-1.18
            rel: 2
            url: https://github.com/cilium/proxy
            version: 1.18.12
      paths:
        - type: file
          path: ${source.dir}/envoy-tests-tier-ab.mk
          uid: 0
          gid: 0
          source: package/deb/main/cilium-envoy/debian-13/envoy-tests-tier-ab.mk
        - type: file
          path: ${source.dir}/envoy-bazel-to-spdx.py
          uid: 0
          gid: 0
          source: package/deb/main/cilium-envoy/debian-13/envoy-bazel-to-spdx.py
      outputs:
        - source: /opt/docker/sbom/envoy
          target: /opt/docker/sbom/envoy
          uid: 0
          gid: 0
os-release:
  name: Docker Hardened Images (Debian)
  id: debian
  version-id: "13"
  version-codename: trixie
  pretty-name: Docker Hardened Images/Debian GNU/Linux 13 (trixie)
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
