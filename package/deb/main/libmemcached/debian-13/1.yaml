contents:
  packages:
    - '!base-files'
  builds:
    - name: libmemcached deb
      work-dir: ${source.dir}/libmemcached
      contents:
        packages:
          - bison
          - build-essential
          - cmake
          - debhelper
          - dpkg-dev
          - flex
          - libevent-dev
          - libsasl2-dev
          - libsasl2-modules
          - libssl-dev
          - memcached
          - pkgconf
          - python3-sphinx
          - sasl2-bin
        files:
          - url: https://deb.debian.org/debian/pool/main/libm/libmemcached/libmemcached_1.1.4-1.1.dsc
            checksum: sha256:535bba4242525ff7071b19d9fef30cb06721032b37d3ce7cb2cf97166db8e025
            path: ${source.dir}/libmemcached_1.1.4-1.1.dsc
            uid: 0
            gid: 0
          - url: https://deb.debian.org/debian/pool/main/libm/libmemcached/libmemcached_1.1.4.orig.tar.gz
            checksum: sha256:285b21a138fc693ea44b0ea5d050e2d796ca8ee78023724a2bd385f25fbd1da1
            path: ${source.dir}/libmemcached_1.1.4.orig.tar.gz
            uid: 0
            gid: 0
          - url: https://deb.debian.org/debian/pool/main/libm/libmemcached/libmemcached_1.1.4-1.1.debian.tar.xz
            checksum: sha256:daa656bf2c569616995bd76c9b7c11e87489650f51edab9a1b48b7c3163ae76f
            path: ${source.dir}/libmemcached_1.1.4-1.1.debian.tar.xz
            uid: 0
            gid: 0
      pipeline:
        - uses: dpkg/source@v1
          work-dir: ${source.dir}
          with:
            file: libmemcached_1.1.4-1.1.dsc
            path: libmemcached
        - uses: dpkg/bump@v1
          with:
            changelog:
              - DHI Rebuild
            version: 1.1.4-1.1+deb13u0+dhi0
        - uses: dpkg/build@v1
          with:
            args: -uc -us -d
        - name: upstream Catch test suite
          work-dir: ${source.dir}/libmemcached
          runs: |
            set -eux -o pipefail

            build=/tmp/libmemcached-tests
            cmake -S . -B "$build" -DBUILD_TESTING=ON -DBUILD_DOCS=no -DENABLE_SASL=yes -DENABLE_OPENSSL_CRYPTO=yes -DMEMCACHED_BINARY=/usr/bin/memcached
            cmake --build "$build" -j"$(nproc)" --target runtests

            pwdb="$build/support/memcached.pwdb"
            rm -f "$pwdb"
            printf 'memcached' | saslpasswd2 -c -p -u "$(uname -n)" -f "$pwdb" memcached
            chmod 0644 "$pwdb"
            printf 'mech_list: plain\nlog_level: 7\npwcheck_method: auxprop\nauxprop_plugin: sasldb\nsasldb_path: %s\n' "$pwdb" > "$build/support/memcached.conf"

            ctest --test-dir "$build" -E '^(bin/memcapable|memcached_udp|memcached_regression_lp583031)$' --timeout 900 --output-on-failure
            "$build/test/runtests" "memcached_udp" -c "compat"
            "$build/test/runtests" "bin/memcapable" -c "no servers provided"
            "$build/test/runtests" "bin/memcapable" -c=--help
            "$build/test/runtests" "bin/memcapable" -c "with server" -c "binary only"
