contents:
  packages:
    - '!base-files'
  builds:
    - name: flac deb
      work-dir: ${source.dir}/flac
      contents:
        packages:
          - build-essential
          - debhelper
          - dh-autoreconf
          - doxygen
          - dpkg-dev
          - libogg-dev
          - mawk
          - pandoc
          - util-linux
        files:
          - url: https://deb.debian.org/debian/pool/main/f/flac/flac_1.5.0+ds-2.dsc
            checksum: sha256:6104c7d69c96e7c8410248d9533bf70df71efd8365966b114c12e9e5cead041a
            path: ${source.dir}/flac_1.5.0+ds-2.dsc
            uid: 0
            gid: 0
          - url: https://deb.debian.org/debian/pool/main/f/flac/flac_1.5.0+ds.orig.tar.xz
            checksum: sha256:51d6a5bf5a37b67f9af847daa07c07091f6bf1583d5abb7fbb064bc68428b0f1
            path: ${source.dir}/flac_1.5.0+ds.orig.tar.xz
            uid: 0
            gid: 0
          - url: https://deb.debian.org/debian/pool/main/f/flac/flac_1.5.0+ds-2.debian.tar.xz
            checksum: sha256:80abb6595955cb3b590cc64d8037c0a7eba777726a23b5664d06bb1fd870fd51
            path: ${source.dir}/flac_1.5.0+ds-2.debian.tar.xz
            uid: 0
            gid: 0
      pipeline:
        - uses: dpkg/source@v1
          work-dir: ${source.dir}
          with:
            file: flac_1.5.0+ds-2.dsc
            path: flac
        - uses: dpkg/bump@v1
          with:
            changelog:
              - DHI Rebuild
            version: 1.5.0+ds-2+deb13u0+dhi0
        - name: copy source for upstream basic test suite
          work-dir: ${source.dir}
          runs: |
            set -eux -o pipefail

            rm -rf /tmp/flac-check
            cp -a flac /tmp/flac-check
        - name: regenerate build files for upstream basic test suite
          work-dir: /tmp/flac-check
          runs: |
            set -eux -o pipefail

            autoreconf -fi > autoreconf.log 2>&1
            chown -R 65532:65532 .
        - name: upstream basic test suite
          work-dir: /tmp/flac-check
          runs: |
            set -eux -o pipefail

            setpriv --reuid=65532 --regid=65532 --clear-groups env HOME=/tmp sh -c './configure --disable-rpath --disable-xmms-plugin --enable-static --disable-silent-rules --disable-thorough-tests > configure.log 2>&1 && make -j"$(nproc)" > make.log 2>&1 && make check > check.log 2>&1' || {
              echo "nproc=$(nproc)"
              for f in configure.log make.log check.log; do
                echo "== $f"
                tail -n 60 "$f" 2> /dev/null
              done
              exit 1
            }
            tail -n 3 check.log
            grep -q "All tests passed" check.log
        - uses: dpkg/build@v1
          with:
            args: -uc -us -d
