          - url: https://deb.debian.org/debian/pool/main/a/augeas/augeas_1.14.1.orig.tar.gz
            checksum: sha256:368bfdd782e4b9c7163baadd621359c82b162734864b667051ff6bcb57b9edff
            path: ${source.dir}/augeas_1.14.1.orig.tar.gz
            uid: 0
