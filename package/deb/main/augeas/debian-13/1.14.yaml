          - url: https://deb.debian.org/debian/pool/main/a/augeas/augeas_1.14.1-1.1~deb13u1.debian.tar.xz
            checksum: sha256:b672aba5fb1eb81c383f16cc1af66da3af85e0b833ac261aa84364f842964d79
            path: ${source.dir}/augeas_1.14.1-1.1~deb13u1.debian.tar.xz
            uid: 0
            gid: 0
      pipeline:
        - uses: dpkg/source@v1
          work-dir: ${source.dir}
          with:
            file: augeas_1.14.1-1.1~deb13u1.dsc
            path: augeas
        - uses: dpkg/bump@v1
          with:
            changelog:
              - DHI Rebuild
            version: 1.14.1-1.1~deb13u1+deb13u0+dhi0
        - name: build TeX formats pdflatex needs
          runs: |
            set -eux -o pipefail

            mktexlsr /usr/share/texlive/texmf-dist /usr/share/texmf /var/lib/texmf
            for fmt in mf pdflatex; do
              for cnf in /var/lib/tex-common/fmtutil-cnf/texlive/*.cnf; do
                if grep -q "^$fmt[[:space:]]" "$cnf"; then
                  fmtutil-sys --cnffile "$cnf" --byfmt "$fmt"
                fi
              done
            done
            test -f /var/lib/texmf/web2c/metafont/mf.base
            test -f /var/lib/texmf/web2c/pdftex/pdflatex.fmt
        - uses: dpkg/build@v1
          environment:
            FAKEROOTKEY: "1"
          with:
            args: -uc -us -d
