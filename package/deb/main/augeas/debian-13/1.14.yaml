          - naturaldocs
          - pkgconf
          - texlive-fonts-recommended
          - texlive-latex-base
          - util-linux
        files:
          - url: https://deb.debian.org/debian/pool/main/a/augeas/augeas_1.14.1-1.1~deb13u1.dsc
            checksum: sha256:425668a4b15e976ea2e05a96de7a08c87540db8cdf17e243c955f4c410db2b10
            path: ${source.dir}/augeas_1.14.1-1.1~deb13u1.dsc
