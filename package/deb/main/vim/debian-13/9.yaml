            checksum: sha256:b0762676a8dfeb4947f6192dfa40ea286c3cf7a204f848ca7805b1a0d6e504b3
            path: ${source.dir}/vim_9.1.1230-2+deb13u1.debian.tar.xz
            uid: 0
            gid: 0
      pipeline:
        - uses: dpkg/source@v1
          work-dir: ${source.dir}
          with:
            file: vim_9.1.1230-2+deb13u1.dsc
            path: vim
        - uses: dpkg/patch@v1
          with:
            apply: true
            patches:
              - ${source.dir}/patch/CVE-2026-73074.patch
        - name: skip debian policy docbook generation
          work-dir: ${source.dir}/vim
          runs: |
            set -eux -o pipefail

            sed -i '/debian\/policy text html/d' debian/rules
        - uses: dpkg/bump@v1
          with:
            changelog:
              - Backport upstream fix for CVE-2026-73074
            version: 2:9.1.1230-2+deb13u1+dhi0
        - name: register lua interpreter alternative for vim configure
          runs: |
            set -eux -o pipefail

            update-alternatives --install /usr/bin/lua lua-interpreter /usr/bin/lua5.1 110
        - uses: dpkg/build@v1
          environment:
