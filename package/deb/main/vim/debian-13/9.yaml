contents:
  packages:
    - '!base-files'
  builds:
    - name: vim deb
      work-dir: ${source.dir}/vim
      contents:
        packages:
          - autoconf
          - build-essential
          - debhelper
          - docbook-utils
          - docbook-xml
          - dpkg-dev
          - ghostscript
          - libacl1-dev
          - libcanberra-dev
          - libgpm-dev
          - libgtk-3-dev
          - liblua5.1-0-dev
          - libmotif-dev
          - libncurses-dev
          - libperl-dev
          - libselinux1-dev
          - libsodium-dev
          - libtool-bin
          - libwayland-dev
          - lynx
          - lua5.1
          - pdf2svg
          - pkgconf
          - python3-dev
          - quilt
          - ruby
          - ruby-dev
          - tcl-dev
        files:
          - url: https://deb.debian.org/debian/pool/main/v/vim/vim_9.1.1230-2.dsc
            checksum: sha256:10e96236a45dcf5b1fb3b6a3146072f89b7d4c0af79456b6bfa0688383b41d47
            path: ${source.dir}/vim_9.1.1230-2.dsc
            uid: 0
            gid: 0
          - url: https://deb.debian.org/debian/pool/main/v/vim/vim_9.1.1230.orig.tar.xz
            checksum: sha256:203640cca8fa97603868ef42f34eeb723803ab15fd141b68b1cba54b7993b2bf
            path: ${source.dir}/vim_9.1.1230.orig.tar.xz
            uid: 0
            gid: 0
          - url: https://deb.debian.org/debian/pool/main/v/vim/vim_9.1.1230-2.debian.tar.xz
            checksum: sha256:3f06690fe44914764a260531d71f9bf63d58c9156b86660bd323dd0e7038898d
            path: ${source.dir}/vim_9.1.1230-2.debian.tar.xz
            uid: 0
            gid: 0
      pipeline:
        - uses: dpkg/source@v1
          work-dir: ${source.dir}
          with:
            file: vim_9.1.1230-2.dsc
            path: vim
        - name: skip debian policy docbook generation
          work-dir: ${source.dir}/vim
          runs: |
            set -eux -o pipefail
            sed -i '/debian\/policy text html/d' debian/rules
        - uses: dpkg/bump@v1
          with:
            changelog:
              - DHI Rebuild
            version: 2:9.1.1230-2+dhi0
        - name: register lua interpreter alternative for vim configure
          runs: |
            set -eux -o pipefail
            update-alternatives --install /usr/bin/lua lua-interpreter /usr/bin/lua5.1 110
        - uses: dpkg/build@v1
          environment:
            DEB_BUILD_PROFILES: nodoc
          with:
            args: -uc -us -d
            options: nocheck
