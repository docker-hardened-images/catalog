          - url: https://deb.debian.org/debian/pool/main/x/xmlstarlet/xmlstarlet_1.6.1.orig.tar.gz
            checksum: sha256:15d838c4f3375332fd95554619179b69e4ec91418a3a5296e7c631b7ed19e7ca
            path: ${source.dir}/xmlstarlet_1.6.1.orig.tar.gz
            uid: 0
