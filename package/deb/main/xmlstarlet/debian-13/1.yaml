contents:
  packages:
    - '!base-files'
  builds:
    - name: xmlstarlet deb
      work-dir: ${source.dir}/xmlstarlet
      contents:
        packages:
          - automake
          - build-essential
          - debhelper
          - default-jre-headless
          - docbook-xsl-ns
          - dpkg-dev
          - fop
          - gawk
          - ghostscript
          - libxml2-dev
          - libxslt1-dev
          - pkgconf
          - xsltproc
        files:
          - url: https://deb.debian.org/debian/pool/main/x/xmlstarlet/xmlstarlet_1.6.1-4.dsc
            checksum: sha256:ed6a8dd34b050de941af90781f759a05ea7ca2e57b78d633d34f177268e4144d
            path: ${source.dir}/xmlstarlet_1.6.1-4.dsc
            uid: 0
