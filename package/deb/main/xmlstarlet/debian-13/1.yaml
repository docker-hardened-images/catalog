          - url: https://deb.debian.org/debian/pool/main/x/xmlstarlet/xmlstarlet_1.6.1-4.debian.tar.xz
            checksum: sha256:7f79ba56000a393cd35763f204618987eda0894851ce40d4f45dd7d713095658
            path: ${source.dir}/xmlstarlet_1.6.1-4.debian.tar.xz
            uid: 0
            gid: 0
      pipeline:
        - uses: dpkg/source@v1
          work-dir: ${source.dir}
          with:
            file: xmlstarlet_1.6.1-4.dsc
            path: xmlstarlet
        - uses: dpkg/bump@v1
          with:
            changelog:
              - DHI Rebuild
            version: 1.6.1-4+dhi0
        - name: wire openjdk tools on PATH
          runs: |
            set -eux -o pipefail

            mkdir -p /usr/local/bin
            jbindir=""
            for d in /usr/lib/jvm/java-*/bin; do
              if [ -x "${d}/java" ]; then
                jbindir="${d}"
                break
              fi
            done
            test -n "${jbindir}"
            ln -sf "${jbindir}/java" /usr/local/bin/java
        - uses: dpkg/build@v1
          environment:
            XML_CATALOG_FILES: /etc/xml/catalog /usr/share/xml/docbook/stylesheet/docbook-xsl-ns/catalog.xml
          with:
            args: -uc -us -d
