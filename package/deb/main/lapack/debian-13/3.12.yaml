        - uses: dpkg/bump@v1
          with:
            changelog:
              - DHI Rebuild
            version: 3.12.1-6+dhi0
        - name: register graphviz render plugins
          runs: |
            set -eux -o pipefail

            /usr/sbin/libgvc6-config-update -c
            printf 'digraph { a -> b }\n' | dot -Tpng -o /dev/null
        - name: provide rename compatibility for trixie packaging
          runs: |
            set -eux -o pipefail

