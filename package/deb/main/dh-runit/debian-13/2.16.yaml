          - url: https://deb.debian.org/debian/pool/main/d/dh-runit/dh-runit_2.16.4.tar.xz
            checksum: sha256:48cf4bd09be628c49aa3081a96a2140164b841ce60be9c91ec3070fa957157bd
            path: ${source.dir}/dh-runit_2.16.4.tar.xz
            uid: 0
            gid: 0
      pipeline:
        - uses: dpkg/source@v1
          work-dir: ${source.dir}
          with:
            file: dh-runit_2.16.4.dsc
            path: dh-runit
            remove-original: false
        - name: remove upstream source artifacts
          work-dir: ${source.dir}
          runs: |
            set -eux -o pipefail

            rm dh-runit_2.16.4.dsc dh-runit_2.16.4.tar.xz
        - uses: dpkg/bump@v1
          with:
            changelog:
              - DHI Rebuild
            version: 2.16.4+deb13u0+dhi0
        - name: refresh GHC package database
          runs: |
            set -eux -o pipefail

            ghc-pkg recache --global
        - uses: dpkg/build@v1
          with:
            args: -uc -us -d
