contents:
  packages:
    - '!base-files'
  builds:
    - name: dh-runit deb
      work-dir: ${source.dir}/dh-runit
      contents:
        packages:
          - debhelper
          - dpkg-dev
          - perl
          - perl-doc
          - libfile-copy-recursive-perl
          - libtext-hogan-perl
          - libfile-slurp-perl
          - libghc-shake-dev
        files:
          - url: https://deb.debian.org/debian/pool/main/d/dh-runit/dh-runit_2.16.4.dsc
            checksum: sha256:92be1e98f447d58e20c312e3876eaddfe78028b8b7e5c9da4e79297b6b901a96
            path: ${source.dir}/dh-runit_2.16.4.dsc
