contents:
  packages:
    - '!base-files'
  builds:
    - name: openni2 deb
      work-dir: ${source.dir}/openni2
      contents:
        packages:
          - build-essential
          - debhelper
          - default-jdk
          - doxygen
          - dpkg-dev
          - graphviz
          - libglut-dev
          - libjpeg-dev
          - libudev-dev
          - libusb-1.0-0-dev
          - python3
          - quilt
          - util-linux
        files:
          - url: https://deb.debian.org/debian/pool/main/o/openni2/openni2_2.2.0.33+dfsg-18.dsc
            checksum: sha256:104bc9d1abf81d052c18ae20d2c43c5502064c1eefc26b9a21d22e4e65cdff58
            path: ${source.dir}/openni2_2.2.0.33+dfsg-18.dsc
            uid: 0
            gid: 0
          - url: https://deb.debian.org/debian/pool/main/o/openni2/openni2_2.2.0.33+dfsg.orig.tar.gz
            checksum: sha256:abc17f5e30d6799200c69a52d34aefaef4fd567be7921e0cb68cae353ac4495a
            path: ${source.dir}/openni2_2.2.0.33+dfsg.orig.tar.gz
            uid: 0
            gid: 0
          - url: https://deb.debian.org/debian/pool/main/o/openni2/openni2_2.2.0.33+dfsg-18.debian.tar.xz
            checksum: sha256:5ea6d33fc4b6e5950a21ba57366d2289ed1de91b62a02806349618518c74517d
            path: ${source.dir}/openni2_2.2.0.33+dfsg-18.debian.tar.xz
            uid: 0
            gid: 0
      pipeline:
        - uses: dpkg/source@v1
          work-dir: ${source.dir}
          with:
            file: openni2_2.2.0.33+dfsg-18.dsc
            path: openni2
        - uses: dpkg/bump@v1
          with:
            changelog:
              - DHI Rebuild
            version: 2.2.0.33+dfsg-18+dhi0
        - name: wire openjdk tools on PATH
          runs: |
            set -eux -o pipefail

            mkdir -p /usr/local/bin
            jbindir=""
            for d in /usr/lib/jvm/java-*/bin; do
              if [ -x "${d}/jar" ] && [ -x "${d}/java" ] && [ -x "${d}/javac" ]; then
                jbindir="${d}"
                break
              fi
            done
            test -n "${jbindir}"
            for tool in java jar javac javadoc; do
              ln -sf "${jbindir}/${tool}" "/usr/local/bin/${tool}"
            done
        - uses: dpkg/build@v1
          with:
            args: -uc -us -d
