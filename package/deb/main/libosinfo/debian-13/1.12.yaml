              - DHI Rebuild
            version: 1.12.0-2+deb13u0+dhi0
        - name: disable gtk-doc HTML (no nodoc path in debian/rules)
          runs: |
            set -eux -o pipefail

            test -f debian/rules
            test -f debian/libosinfo-1.0-dev.install
            grep -q -- '-Denable-gtk-doc=true' debian/rules
            grep -qx '/usr/share/gtk-doc' debian/libosinfo-1.0-dev.install
