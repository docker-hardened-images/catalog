# syntax=dhi.io/build:2-debian13

image: dhi.io/pkg-newt
variant: runtime
tags:
  - 0.52.25-1-deb13u0-dhi0
  - 0.52.25-1-deb13u0-dhi0-debian13
platforms:
  - linux/amd64
  - linux/arm64
vars:
  DEBIAN_DEBIAN_CHECKSUM: sha256:9cca738ec014bce35aad2d7a9546f5492716f45230e5e27591aaa509959fa4d3
  DEBIAN_DEBIAN_FILENAME: newt_0.52.25-1.debian.tar.xz
  DEBIAN_DEBIAN_URL: https://deb.debian.org/debian/pool/main/n/newt/newt_0.52.25-1.debian.tar.xz
  DEBIAN_DSC_CHECKSUM: sha256:ba252653a3bc7ef6557303c728cdb1cf327956f89b7dbe6577bf0fb9343fe5db
  DEBIAN_DSC_FILENAME: newt_0.52.25-1.dsc
  DEBIAN_DSC_URL: https://deb.debian.org/debian/pool/main/n/newt/newt_0.52.25-1.dsc
  DEBIAN_FILENAME_VERSION: 0.52.25-1
  DEBIAN_ORIG_CHECKSUM: sha256:93221ec1f76c824eef797f396559d70655a5f9ed9aa57166a906857789c62bd2
  DEBIAN_ORIG_FILENAME: newt_0.52.25.orig.tar.xz
  DEBIAN_ORIG_URL: https://deb.debian.org/debian/pool/main/n/newt/newt_0.52.25.orig.tar.xz
  DEBIAN_VERSION: 0.52.25-1
  DHI_REL: "0"
  DHI_VERSION: 0.52.25-1+deb13u0+dhi0
  TAG_VERSION: 0.52.25-1-deb13u0-dhi0
  UPSTREAM_VERSION: 0.52.25
contents:
  packages:
    - '!base-files'
  builds:
    - name: newt deb
      work-dir: ${source.dir}/newt
      contents:
        packages:
          - automake
          - build-essential
          - debhelper
          - debianutils
          - dh-python
          - docbook-utils
          - dpkg-dev
          - gettext
          - libfribidi-dev
          - libpopt-dev
          - libslang2-dev
          - python3-all-dbg
          - python3-all-dev
          - libncurses-dev
          - libpython3-all-dev
          - mawk
          - openjade
          - tcl8.6-dev
        files:
          - url: https://deb.debian.org/debian/pool/main/n/newt/newt_0.52.25-1.dsc
            checksum: sha256:ba252653a3bc7ef6557303c728cdb1cf327956f89b7dbe6577bf0fb9343fe5db
            path: ${source.dir}/newt_0.52.25-1.dsc
            uid: 0
            gid: 0
          - url: https://deb.debian.org/debian/pool/main/n/newt/newt_0.52.25.orig.tar.xz
            checksum: sha256:93221ec1f76c824eef797f396559d70655a5f9ed9aa57166a906857789c62bd2
            path: ${source.dir}/newt_0.52.25.orig.tar.xz
            uid: 0
            gid: 0
          - url: https://deb.debian.org/debian/pool/main/n/newt/newt_0.52.25-1.debian.tar.xz
            checksum: sha256:9cca738ec014bce35aad2d7a9546f5492716f45230e5e27591aaa509959fa4d3
            path: ${source.dir}/newt_0.52.25-1.debian.tar.xz
            uid: 0
            gid: 0
      pipeline:
        - uses: dpkg/source@v1
          work-dir: ${source.dir}
          with:
            file: newt_0.52.25-1.dsc
            path: newt
        - uses: dpkg/bump@v1
          with:
            changelog:
              - DHI Rebuild
            version: 0.52.25-1+deb13u0+dhi0
        - name: expose which, openjade and the SGML super catalog
          runs: |
            set -eux -o pipefail

            test -x /usr/bin/which.debianutils
            test -x /usr/bin/openjade-1.4devel
            ln -sf which.debianutils /usr/bin/which
            ln -sf openjade-1.4devel /usr/bin/openjade
            command -v which openjade
            test -f /etc/sgml/docbook.cat
            {
              echo "-- Generated by this build step from /etc/sgml/*.cat, as update-catalog super would. --"
              for c in /etc/sgml/*.cat; do echo "CATALOG $c"; done
            } > /etc/sgml/catalog
            cat /etc/sgml/catalog
        - name: align python3-newt paths with the active Python platlib
          runs: |
            set -eux -o pipefail

            platlib="$(python3 -c 'import sysconfig; print(sysconfig.get_path("platlib"))')"
            platlib="${platlib#/}"
            platlib_pattern="$(printf '%s\n' "$platlib" | sed -E 's#python3\.[0-9]+#python3.*#')"
            sed -i -E \
              "s#^/?usr/(local/)?lib/python3\.\*/(dist|site)-packages/snack\.py#${platlib_pattern}/snack.py#" \
              debian/python3-newt.install
            grep -Fq "${platlib_pattern}/snack.py" debian/python3-newt.install
            printf '%s\n' "${platlib_pattern}/*" >> debian/not-installed
        - name: make libnewt-dev depend on libncurses-dev for -ltermcap
          runs: |
            set -eux -o pipefail

            sed -i '/^Package: libnewt-dev$/,/^$/ s#^Depends: libslang2-dev (>= 2.0.2), #Depends: libslang2-dev (>= 2.0.2), libncurses-dev, #' debian/control
            grep -q '^Depends: libslang2-dev (>= 2.0.2), libncurses-dev, libnewt0.52 ' debian/control
        - uses: dpkg/build@v1
          environment:
            DEB_BUILD_PROFILES: noudeb
            LIBS: -Wl,--no-as-needed -ltinfo
          with:
            args: -uc -us -d
os-release:
  name: Docker Hardened Images (Debian)
  id: debian
  version-id: "13"
  version-codename: trixie
  pretty-name: Docker Hardened Images/Debian GNU/Linux 13 (trixie)
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
