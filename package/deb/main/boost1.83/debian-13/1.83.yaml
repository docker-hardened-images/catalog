image: dhi.io/pkg-boost1.83
variant: runtime
tags:
  - 1.83.0-4.2-dhi0
  - 1.83.0-4.2-dhi0-debian13
platforms:
  - linux/amd64
  - linux/arm64
vars:
  DEBIAN_DEBIAN_CHECKSUM: sha256:680ce7ee8d1e1215d196d8820cc5d2d423fb8f7731728303e4409c6627df89c2
  DEBIAN_DEBIAN_FILENAME: boost1.83_1.83.0-4.2.debian.tar.xz
  DEBIAN_DEBIAN_URL: https://deb.debian.org/debian/pool/main/b/boost1.83/boost1.83_1.83.0-4.2.debian.tar.xz
  DEBIAN_DSC_CHECKSUM: sha256:35e2ba9d7d5b0e4d49b4a5813f0f2d9852755f970c72861b6df41a1d331185ce
  DEBIAN_DSC_FILENAME: boost1.83_1.83.0-4.2.dsc
  DEBIAN_DSC_URL: https://deb.debian.org/debian/pool/main/b/boost1.83/boost1.83_1.83.0-4.2.dsc
  DEBIAN_FILENAME_VERSION: 1.83.0-4.2
  DEBIAN_ORIG_CHECKSUM: sha256:404df4b4072fc7f2d4483d4fc2d61ff6f554dd80c9a812652684d5952e881c91
  DEBIAN_ORIG_FILENAME: boost1.83_1.83.0.orig.tar.xz
  DEBIAN_ORIG_URL: https://deb.debian.org/debian/pool/main/b/boost1.83/boost1.83_1.83.0.orig.tar.xz
  DEBIAN_VERSION: 1.83.0-4.2
  DHI_REL: "0"
  DHI_VERSION: 1.83.0-4.2+dhi0
  TAG_VERSION: 1.83.0-4.2-dhi0
  UPSTREAM_VERSION: 1.83.0
contents:
  packages:
    - '!base-files'
  builds:
    - name: boost1.83 deb
      work-dir: ${source.dir}/boost1.83-1.83.0
      contents:
        packages:
          - bison
          - build-essential
          - chrpath
          - dctrl-tools
          - debhelper
          - dh-python
          - docbook-to-man
          - docbook-xml
          - docbook-xsl
          - doxygen
          - debianutils
          - dpkg-dev
          - flex
          - ghostscript
          - graphviz
          - help2man
          - libblas3
          - libbz2-dev
          - libicu-dev
          - liblapack3
          - liblzma-dev
          - libopenmpi-dev
          - libzstd-dev
          - mpi-default-dev
          - openmpi-bin
          - python3
          - python3-all-dev
          - python3-numpy
          - python3-numpy-dev
          - quilt
          - texlive-latex-base
          - util-linux
          - xsltproc
          - zlib1g-dev
        files:
          - url: https://deb.debian.org/debian/pool/main/b/boost1.83/boost1.83_1.83.0-4.2.dsc
            checksum: sha256:35e2ba9d7d5b0e4d49b4a5813f0f2d9852755f970c72861b6df41a1d331185ce
            path: ${source.dir}/boost1.83_1.83.0-4.2.dsc
            uid: 0
            gid: 0
          - url: https://deb.debian.org/debian/pool/main/b/boost1.83/boost1.83_1.83.0.orig.tar.xz
            checksum: sha256:404df4b4072fc7f2d4483d4fc2d61ff6f554dd80c9a812652684d5952e881c91
            path: ${source.dir}/boost1.83_1.83.0.orig.tar.xz
            uid: 0
            gid: 0
          - url: https://deb.debian.org/debian/pool/main/b/boost1.83/boost1.83_1.83.0-4.2.debian.tar.xz
            checksum: sha256:680ce7ee8d1e1215d196d8820cc5d2d423fb8f7731728303e4409c6627df89c2
            path: ${source.dir}/boost1.83_1.83.0-4.2.debian.tar.xz
            uid: 0
            gid: 0
      pipeline:
        - uses: dpkg/source@v1
          work-dir: ${source.dir}
          with:
            file: boost1.83_1.83.0-4.2.dsc
            path: boost1.83-1.83.0
        - uses: dpkg/bump@v1
          with:
            changelog:
              - DHI Rebuild
            version: 1.83.0-4.2+dhi0
        - name: remove numpy source artifacts that shadow python3-numpy
          work-dir: ${source.dir}
          runs: |
            set -eux -o pipefail

            rm -f numpy_*.dsc numpy_*.debian.tar.xz numpy_*.orig.tar.xz 2> /dev/null || true
            rm -rf numpy numpy-[0-9]* numpy_[0-9]*
        - name: register graphviz render plugins
          runs: |
            set -eux -o pipefail

            /usr/sbin/libgvc6-config-update -c
            printf 'digraph { a -> b }\n' | dot -Tpng -o /dev/null
        - name: register openmpi wrapper alternatives
          runs: |
            set -eux -o pipefail

            update-alternatives --install /usr/bin/mpirun mpirun /usr/bin/mpirun.openmpi 50 \
              --slave /usr/share/man/man1/mpirun.1.gz mpirun.1.gz /usr/share/man/man1/mpirun.openmpi.1.gz \
              --slave /usr/bin/mpiexec mpiexec /usr/bin/mpiexec.openmpi \
              --slave /usr/share/man/man1/mpiexec.1.gz mpiexec.1.gz /usr/share/man/man1/mpiexec.openmpi.1.gz

            update-alternatives --install /usr/bin/mpicc mpi /usr/bin/mpicc.openmpi 50 \
              --slave /usr/bin/mpic++ mpic++ /usr/bin/mpic++.openmpi \
              --slave /usr/bin/mpicxx mpicxx /usr/bin/mpic++.openmpi \
              --slave /usr/bin/mpiCC mpiCC /usr/bin/mpic++.openmpi

            command -v mpic++
            mpic++ --version
        - name: wire BLAS/LAPACK sonames for numpy b2 detection
          runs: |
            set -eux -o pipefail

            multiarch="$(dpkg-architecture -qDEB_HOST_MULTIARCH)"
            update-alternatives --install "/usr/lib/${multiarch}/libblas.so.3" "libblas.so.3-${multiarch}" "/usr/lib/${multiarch}/blas/libblas.so.3" 100
            update-alternatives --install "/usr/lib/${multiarch}/liblapack.so.3" "liblapack.so.3-${multiarch}" "/usr/lib/${multiarch}/lapack/liblapack.so.3" 100

            unset PYTHONPATH
            export PYTHONNOUSERSITE=1
            python3.13 -c "import numpy; print(numpy.get_include())"
        - name: use explicit python interpreters in user-config
          work-dir: ${source.dir}/boost1.83-1.83.0
          runs: |
            set -eux -o pipefail

            sed -i 's|using python : $$pyver : /usr ;|using python : $$pyver : /usr/bin/python$$pyver ;|' debian/rules
        - uses: dpkg/build@v1
          environment:
            DEB_BUILD_PROFILES: nodoc
            PYTHONNOUSERSITE: "1"
            PYTHONPATH: ""
          with:
            args: -uc -us -d
os-release:
  name: Docker Hardened Images (Debian)
  id: debian
  version-id: "13"
  version-codename: trixie
  pretty-name: Docker Hardened Images/Debian GNU/Linux 13 (trixie)
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
