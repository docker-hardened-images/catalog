contents:
  packages:
    - '!base-files'
  builds:
    - name: ust deb
      work-dir: ${source.dir}/ust
      contents:
        packages:
          - build-essential
          - debhelper
          - default-jdk
          - dh-python
          - dpkg-dev
          - javahelper
          - liblog4j1.2-java
          - libnuma-dev
          - liburcu-dev
          - pkgconf
          - python3-all
          - python3-setuptools
          - texinfo
          - uuid-dev
        files:
          - url: https://deb.debian.org/debian/pool/main/u/ust/ust_2.13.9-1.dsc
            checksum: sha256:c7f39f8398b9c1bcb2350d07550be8e3a5949b0782088e536831cd96d2faa618
            path: ${source.dir}/ust_2.13.9-1.dsc
            uid: 0
            gid: 0
          - url: https://deb.debian.org/debian/pool/main/u/ust/ust_2.13.9.orig.tar.bz2
            checksum: sha256:2ad6d69a54a1d924c18a4aa7a233db104e3cc332bcdd240e196bf7adbed3f712
            path: ${source.dir}/ust_2.13.9.orig.tar.bz2
            uid: 0
            gid: 0
          - url: https://deb.debian.org/debian/pool/main/u/ust/ust_2.13.9.orig.tar.bz2.asc
            checksum: sha256:bd2ba9bfc31fcf75046d620f1e7910003dc0e4371dbacbf70be18777bedf3ae4
            path: ${source.dir}/ust_2.13.9.orig.tar.bz2.asc
            uid: 0
            gid: 0
          - url: https://deb.debian.org/debian/pool/main/u/ust/ust_2.13.9-1.debian.tar.xz
            checksum: sha256:a2f8755772adeb6522836686e660384cb7c6057d705650ce7aaf6a69caa23c33
            path: ${source.dir}/ust_2.13.9-1.debian.tar.xz
            uid: 0
            gid: 0
      pipeline:
        - uses: dpkg/source@v1
          work-dir: ${source.dir}
          with:
            file: ust_2.13.9-1.dsc
            path: ust
        - uses: dpkg/bump@v1
          with:
            changelog:
              - DHI Rebuild
            version: 2.13.9-1+dhi0
        - name: wire openjdk tools on PATH
          runs: |
            set -eux -o pipefail

            mkdir -p /usr/local/bin
            jbindir=""
            for d in /usr/lib/jvm/java-*/bin; do
              if [ -x "${d}/jar" ] && [ -x "${d}/java" ] && [ -x "${d}/javac" ]; then
                jbindir="${d}"
                break
              fi
            done
            test -n "${jbindir}"
            for tool in java jar javac; do
              ln -sf "${jbindir}/${tool}" "/usr/local/bin/${tool}"
            done
        - uses: dpkg/build@v1
          with:
            args: -uc -us -d
