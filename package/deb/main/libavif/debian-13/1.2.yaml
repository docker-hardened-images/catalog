contents:
  packages:
    - '!base-files'
  builds:
    - name: libavif deb
      work-dir: ${source.dir}/libavif
      contents:
        packages:
          - build-essential
          - cmake
          - debhelper
          - dpkg-dev
          - libaom-dev
          - libcjson-dev
          - libdav1d-dev
          - libgav1-dev
          - libgdk-pixbuf-2.0-dev
          - libjpeg-dev
          - libpng-dev
          - librav1e-dev
          - libsharpyuv-dev
          - libsvtav1enc-dev
          - libyuv-dev
          - pandoc
          - pkgconf
          - zlib1g-dev
        files:
          - url: https://deb.debian.org/debian/pool/main/liba/libavif/libavif_1.2.1-1.2.dsc
            checksum: sha256:90de5e1ccac297407723cae5444b949ce71d50abc9ec435aae50aec72fc364bf
            path: ${source.dir}/libavif_1.2.1-1.2.dsc
            uid: 0
            gid: 0
          - url: https://deb.debian.org/debian/pool/main/liba/libavif/libavif_1.2.1.orig.tar.gz
            checksum: sha256:9c859c7c12ccb0f407511bfe303e6a7247f5f6738f54852662c6df8048daddf4
            path: ${source.dir}/libavif_1.2.1.orig.tar.gz
            uid: 0
            gid: 0
          - url: https://deb.debian.org/debian/pool/main/liba/libavif/libavif_1.2.1.orig-libargparse.tar.gz
            checksum: sha256:5671faeda13789d19a228368c2004b2f3fb488a15a0718ae16e9ce0fdb74db67
            path: ${source.dir}/libavif_1.2.1.orig-libargparse.tar.gz
            uid: 0
            gid: 0
          - url: https://deb.debian.org/debian/pool/main/liba/libavif/libavif_1.2.1-1.2.debian.tar.xz
            checksum: sha256:32ca7dcd704b56c74dcabbae927cbf5f156b5f7bafcaede5e157a1400b1cea35
            path: ${source.dir}/libavif_1.2.1-1.2.debian.tar.xz
            uid: 0
            gid: 0
      pipeline:
        - uses: dpkg/source@v1
          work-dir: ${source.dir}
          with:
            file: libavif_1.2.1-1.2.dsc
            path: libavif
        - uses: dpkg/bump@v1
          with:
            changelog:
              - DHI Rebuild
            version: 1.2.1-1.2+deb13u0+dhi0
        - name: copy source for upstream test suite
          work-dir: ${source.dir}
          runs: |
            set -eux -o pipefail

            rm -rf /tmp/libavif-check
            cp -a libavif /tmp/libavif-check
        - name: prepare CI copy like debian/rules
          work-dir: /tmp/libavif-check
          runs: |
            set -eux -o pipefail

            rm -rfv third_party/libyuv/
            cp -rv libargparse ext/libargparse/
        - name: upstream tests CTest
          work-dir: /tmp/libavif-check
          runs: |
            set -eux -o pipefail

            cmake -S . -B build \
              -DAVIF_BUILD_TESTS=ON \
              -DAVIF_GTEST=OFF \
              -DAVIF_LIBYUV=SYSTEM \
              -DAVIF_BUILD_APPS=ON \
              -DAVIF_CODEC_DAV1D=SYSTEM \
              -DAVIF_CODEC_AOM=SYSTEM \
              -DAVIF_CODEC_SVT=SYSTEM \
              -DAVIF_CODEC_LIBGAV1=SYSTEM \
              -DAVIF_CODEC_RAV1E=SYSTEM \
              -DAVIF_BUILD_GDK_PIXBUF=ON \
              -DAVIF_BUILD_MAN_PAGES=OFF \
              > configure.log 2>&1 || {
              tail -n 80 configure.log
              exit 1
            }
            cmake --build build -j"$(nproc)" > make.log 2>&1 || {
              tail -n 120 make.log
              exit 1
            }
            ctest --test-dir build --output-on-failure > ctest.log 2>&1 || {
              ctest --test-dir build --rerun-failed --output-on-failure || true
              tail -n 40 ctest.log
              exit 1
            }
            tail -n 5 ctest.log
            grep -q "100% tests passed, 0 tests failed" ctest.log
        - uses: dpkg/build@v1
          with:
            args: -uc -us -d
