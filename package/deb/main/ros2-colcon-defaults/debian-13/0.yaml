contents:
  packages:
    - '!base-files'
  builds:
    - name: ros2-colcon-defaults deb
      work-dir: ${source.dir}/ros2-colcon-defaults
      contents:
        packages:
          - debhelper
          - dh-python
          - dpkg-dev
          - pylint
          - python3-all
          - python3-colcon-core
          - python3-flake8
          - python3-pep8-naming
          - python3-pytest
          - python3-pytest-cov
          - python3-setuptools
          - python3-yaml
        files:
          - url: https://deb.debian.org/debian/pool/main/r/ros2-colcon-defaults/ros2-colcon-defaults_0.2.9-1.dsc
            checksum: sha256:76f6ec7c1f9b074f97a5bf97c806f7b651bfc69eafc64e9e133a99dad913a1e0
            path: ${source.dir}/ros2-colcon-defaults_0.2.9-1.dsc
            uid: 0
            gid: 0
          - url: https://deb.debian.org/debian/pool/main/r/ros2-colcon-defaults/ros2-colcon-defaults_0.2.9.orig.tar.gz
            checksum: sha256:d25a4f859b731ec3e5484e26d53a1adecf8fd92bd16b3c9b49f62e411b5681aa
            path: ${source.dir}/ros2-colcon-defaults_0.2.9.orig.tar.gz
            uid: 0
            gid: 0
          - url: https://deb.debian.org/debian/pool/main/r/ros2-colcon-defaults/ros2-colcon-defaults_0.2.9-1.debian.tar.xz
            checksum: sha256:fbb4c4db183eebf5aec6573c85dc0fa619cc564d038105c9b39187cb861ebee7
            path: ${source.dir}/ros2-colcon-defaults_0.2.9-1.debian.tar.xz
            uid: 0
            gid: 0
      pipeline:
        - uses: dpkg/source@v1
          work-dir: ${source.dir}
          with:
            file: ros2-colcon-defaults_0.2.9-1.dsc
            path: ros2-colcon-defaults
        - name: use explicit Python install destinations
          runs: |
            set -eux -o pipefail

            python3 - << 'PY'
            from pathlib import Path

            path = Path("debian/rules")
            rules = path.read_text()
            marker = "%:\n"
            assert rules.count(marker) == 1
            override = (
                "override_dh_auto_install:\n"
                "\tpython3 setup.py install --root=$(CURDIR)/debian/python3-colcon-defaults --prefix=/usr "
                "--install-purelib=/usr/lib/python3/dist-packages "
                "--install-platlib=/usr/lib/python3/dist-packages --install-data=/usr --install-scripts=/usr/bin\n\n"
            )
            path.write_text(rules.replace(marker, override + marker))
            PY

            grep -Fq -- '--install-purelib=/usr/lib/python3/dist-packages' debian/rules
            grep -Fq -- '--install-scripts=/usr/bin' debian/rules
        - uses: dpkg/bump@v1
          with:
            changelog:
              - DHI Rebuild
            version: 0.2.9-1+deb13u0+dhi0
        - uses: dpkg/build@v1
          with:
            args: -uc -us -d
