# syntax=dhi.io/build:2-debian13

image: dhi.io/pkg-ucf
variant: runtime
tags:
  - 3.0052-dhi0
  - 3.0052-dhi0-debian13
platforms:
  - linux/amd64
  - linux/arm64
vars:
  DEBIAN_DEBIAN_FILENAME: ${DEBIAN_DEBIAN_URL:^.+/(.+)$}
  DEBIAN_DSC_CHECKSUM: sha256:9117f54533d23ad74371e91c3038e13b1aa0fabd51a382f47a5af81e9b5ee591
  DEBIAN_DSC_FILENAME: ucf_3.0052.dsc
  DEBIAN_DSC_URL: https://deb.debian.org/debian/pool/main/u/ucf/ucf_3.0052.dsc
  DEBIAN_FILENAME_VERSION: "3.0052"
  DEBIAN_ORIG_CHECKSUM: sha256:94130b4840618a65543ca4c12f4de062081008f42f36d0abfbd75098ebe9a7eb
  DEBIAN_ORIG_FILENAME: ucf_3.0052.tar.xz
  DEBIAN_ORIG_URL: https://deb.debian.org/debian/pool/main/u/ucf/ucf_3.0052.tar.xz
  DEBIAN_VERSION: "3.0052"
  DHI_REL: "0"
  DHI_VERSION: 3.0052+dhi0
  TAG_VERSION: 3.0052-dhi0
  UPSTREAM_VERSION: "3.0052"
contents:
  packages:
    - '!base-files'
  builds:
    - name: ucf deb
      work-dir: ${source.dir}/ucf
      contents:
        packages:
          - build-essential
          - debhelper
          - dpkg-dev
          - gettext
          - po-debconf
          - perl
        files:
          - url: https://deb.debian.org/debian/pool/main/u/ucf/ucf_3.0052.dsc
            checksum: sha256:9117f54533d23ad74371e91c3038e13b1aa0fabd51a382f47a5af81e9b5ee591
            path: ${source.dir}/ucf_3.0052.dsc
            uid: 0
            gid: 0
          - url: https://deb.debian.org/debian/pool/main/u/ucf/ucf_3.0052.tar.xz
            checksum: sha256:94130b4840618a65543ca4c12f4de062081008f42f36d0abfbd75098ebe9a7eb
            path: ${source.dir}/ucf_3.0052.tar.xz
            uid: 0
            gid: 0
      pipeline:
        - uses: dpkg/source@v1
          work-dir: ${source.dir}
          with:
            file: ucf_3.0052.dsc
            path: ucf
            remove-original: false
        - name: remove upstream source artifacts
          work-dir: ${source.dir}
          runs: |
            set -eux -o pipefail

            rm ucf_3.0052.dsc ucf_3.0052.tar.xz
        - uses: dpkg/bump@v1
          with:
            changelog:
              - DHI Rebuild
            version: 3.0052+dhi0
        - name: quote perl version in Makefile embed
          work-dir: ${source.dir}/ucf
          runs: |
            set -eux -o pipefail

            sed -i 's#VERSION = $(version);#VERSION = '\''$(version)'\'';#' Makefile
        - uses: dpkg/build@v1
          with:
            args: -uc -us -d
os-release:
  name: Docker Hardened Images (Debian)
  id: debian
  version-id: "13"
  version-codename: trixie
  pretty-name: Docker Hardened Images/Debian GNU/Linux 13 (trixie)
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
