vars:
  DEBIAN_DEBIAN_CHECKSUM: sha256:bcbccbc6ae715ac84bd21bb7e1175fba483abc0993a6066aa49236c473bce7df
  DEBIAN_DEBIAN_FILENAME: llvm-toolchain-19_19.1.7-3.debian.tar.xz
