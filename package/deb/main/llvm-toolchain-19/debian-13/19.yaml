contents:
  packages:
    - '!base-files'
  builds:
    - name: llvm-toolchain-19 deb
      work-dir: ${source.dir}/llvm-toolchain-19
      contents:
        packages:
          - binutils-dev
          - binutils-gold
          - build-essential
          - chrpath
          - cmake
          - debhelper
          - dh-exec
          - dh-ocaml
          - diffstat
          - dpkg-dev
          - help2man
          - libctypes-ocaml-dev
          - libedit-dev
          - libelf-dev
          - libffi-dev
          - libjsoncpp-dev
          - libncurses-dev
          - libpfm4-dev
          - libxml2-dev
          - libz3-dev
          - libzstd-dev
          - lsb-release
          - mawk
          - ninja-build
          - ocaml-findlib
          - ocaml-nox
          - patchutils
          - pkg-config
          - procps
          - python3-dev
          - python3-setuptools
          - quilt
          - sharutils
          - swig
          - texinfo
          - time
          - util-linux
          - wasi-libc
          - xz-utils
          - zlib1g-dev
          - ${LIBIPT_DEV_PKG}
        files:
          - url: https://deb.debian.org/debian/pool/main/l/llvm-toolchain-19/llvm-toolchain-19_19.1.7-3.dsc
            checksum: sha256:1559a483908ca0c8d4124448a551da5f87ab644771352a5335b1b01d07fe732f
            path: ${source.dir}/llvm-toolchain-19_19.1.7-3.dsc
            uid: 0
            gid: 0
          - url: https://deb.debian.org/debian/pool/main/l/llvm-toolchain-19/llvm-toolchain-19_19.1.7.orig.tar.xz
            checksum: sha256:ae498f3bc58ae2d9f64ef5f0c035c4240152bf015a5b7738b15c22e93bdc97ce
            path: ${source.dir}/llvm-toolchain-19_19.1.7.orig.tar.xz
            uid: 0
            gid: 0
          - url: https://deb.debian.org/debian/pool/main/l/llvm-toolchain-19/llvm-toolchain-19_19.1.7-3.debian.tar.xz
            checksum: sha256:bcbccbc6ae715ac84bd21bb7e1175fba483abc0993a6066aa49236c473bce7df
            path: ${source.dir}/llvm-toolchain-19_19.1.7-3.debian.tar.xz
            uid: 0
            gid: 0
      pipeline:
        - uses: dpkg/source@v1
          work-dir: ${source.dir}
          with:
            file: llvm-toolchain-19_19.1.7-3.dsc
            path: llvm-toolchain-19
        - name: build without documentation
          work-dir: ${source.dir}/llvm-toolchain-19
          runs: |
            set -eux -o pipefail

            sed -i 's/^DOC_GENERATION=yes$/DOC_GENERATION=no/' debian/rules
            grep -q '^DOC_GENERATION=no$' debian/rules

            sed -i 's/-DBOOTSTRAP_LLVM_ENABLE_SPHINX=ON/-DBOOTSTRAP_LLVM_ENABLE_SPHINX=OFF/' debian/rules
            grep -q 'DBOOTSTRAP_LLVM_ENABLE_SPHINX=OFF' debian/rules
        - name: drop qualify-clang autopkgtest
          work-dir: ${source.dir}/llvm-toolchain-19
          runs: |
            set -eux -o pipefail

            for file in debian/tests/control debian/tests/control.in; do
              awk -v RS= -v ORS='\n\n' '$0 !~ /(^|\n)Test-Command: bash -v \.\/debian\/qualify-clang\.sh(\n|$)/' "$file" > "$file.new"
              mv "$file.new" "$file"
              if grep -q 'qualify-clang' "$file"; then exit 1; fi
              grep -q '^Tests: integration-test-suite-test$' "$file"
            done
        - uses: dpkg/bump@v1
          with:
            changelog:
              - DHI Rebuild
            version: 1:19.1.7-3+deb13u0+dhi1
        - uses: dpkg/build@v1
          environment:
            DEB_BUILD_PROFILES: stage1
          with:
            args: -uc -us -d
            options: nocheck
