  TAG_VERSION: 1.27.1-2-dhi0
  URL: https://github.com/microsoft/go/releases/download/v1.27.1-2/go1.27.1-20260904.9.src.tar.gz
  VERSION: 1.27.1-2
contents:
  packages:
    - '!base-files'
  builds:
    - name: golang-msft-fips-1.27
