      contents:
        repositories:
          - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
        keyring:
          - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
        packages:
          - bash
          - build-essential
          - binutils
          - coreutils
          - debhelper
          - dpkg-dev
          - findutils
          - golang-1.27
          - grep
          - git
          - sed
        files:
          - url: https://github.com/microsoft/go/releases/download/v1.27.1-2/go1.27.1-20260904.9.src.tar.gz
            checksum: sha256:635f34eae0b368a8e286e8cb39c66c423ca323d1a71b5de3f4c0b2b24169e9d7
            path: ${source.dir}/golang-msft-fips-1.27/msft-go-src.tar.gz
            spdx:
              name: golang
              version: 1.27.1-2
              packages:
                - name: golang
                  purl: pkg:dhi/golang@1.27.1-2
                  license: BSD-3-Clause
            uid: 0
            gid: 0
          - url: git+https://github.com/microsoft/go.git#v1.27.1-2
            checksum: 98eeb005441466f30aae2dd4bdf5fa472b026386
            path: ${source.dir}/golang-msft-fips-1.27/msft-go-repo
            uid: 0
            gid: 0
      pipeline:
        - name: setup
          runs: |
            set -eux -o pipefail

            # Extract Microsoft Go source
            tar xf msft-go-src.tar.gz --strip-components=1
            rm -f msft-go-src.tar.gz

            # Remove .git artifacts from the source
            rm -rf .git .gitattributes .github .gitignore

            # Finalize debian/ templates in-place
            sed -i -e "s/@PACKAGE_NAME@/golang-msft-fips-1.27/g" \
              -e "s/@MAJOR_MINOR_VERSION@/1.27/g" \
              debian/control.in debian/changelog \
              debian/golang-msft-fips-oci-config.install.in
            mv debian/control.in debian/control
            mv debian/golang-msft-fips.install.in "debian/golang-msft-fips-1.27.install"
            mv debian/golang-msft-fips-oci-config.install.in "debian/golang-msft-fips-1.27-oci-config.install"
        - name: place cryptobackend module
          runs: |
            set -eux -o pipefail

            if [ -d msft-go-repo/cryptobackend ]; then
              mv msft-go-repo/cryptobackend ../cryptobackend
            fi
            rm -rf msft-go-repo
        - name: bump bootstrap module versions
          privileged: true
          runs: |
            set -eux -o pipefail

            export PATH="/usr/bin:/usr/local/bin:${PATH}"
            export GOROOT="$(go env GOROOT)"
            export PATH="${GOROOT}/bin:${PATH}"
            export GOPROXY=https://proxy.golang.org,direct

            (
              cd src
              go get golang.org/x/net@v0.56.0
              if [ "1.27" = "1.26" ]; then
                go get github.com/microsoft/go-crypto-openssl@v0.2.9
              fi
              sed -i -E 's/^go ([0-9]+\.[0-9]+)\.[0-9]+$/go \1/' go.mod
            )
            (
              cd src/cmd
              go get golang.org/x/mod@v0.40.0
              sed -i -E 's/^go ([0-9]+\.[0-9]+)\.[0-9]+$/go \1/' go.mod
            )

            while IFS= read -r -d '' gomod; do
              moddir="$(dirname "$gomod")"
              case "$moddir" in
                */_asm | */_asm/*)
                  sed -i 's|golang.org/x/mod v[^[:space:]]*|golang.org/x/mod v0.40.0|g' "$gomod"
                  ;;
              esac
            done < <(find src -name go.mod -type f -print0)
        - name: generate oci config
          runs: |
            set -eux -o pipefail

            mkdir -p oci-config
            cat > oci-config/golang-msft-fips-1.27.yaml << 'EOF'
            environment:
              CGO_ENABLED: "1"
              GODEBUG: "fips140=only,tarinsecurepath=0,zipinsecurepath=0"
              GOFLAGS: "-tags=requirefips"
              GOFIPS140: "v1.0.0"
              GOPATH: /go
              GOTOOLCHAIN: "local"
              MS_GOTOOLCHAIN_TELEMETRY_ENABLED: "0"
              PATH: /go/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
            paths:
              - type: directory
                path: /go
                uid: 65532
                gid: 65532
                mode: "0755"
              - type: directory
                path: /go/bin
                uid: 65532
                gid: 65532
                mode: "0755"
              - type: directory
                path: /go/src
                uid: 65532
                gid: 65532
                mode: "0755"
              - type: directory
                path: /usr/src
                uid: 65532
                gid: 65532
                mode: "0755"
              - type: directory
                path: /go/pkg
                uid: 65532
                gid: 65532
                mode: "0755"
            EOF
        - uses: dpkg/bump@v1
          with:
            changelog:
              - Bump bootstrap golang.org/x modules to patched releases
            version: 1.27.1-2+dhi0
        - uses: dpkg/build@v1
          environment:
            DHI_GOROOT_BOOTSTRAP: /usr/lib/go-1.27
          with:
            args: -b -uc -us -d
      paths:
        - type: directory
          path: ${source.dir}/golang-msft-fips-1.27/debian
          uid: 0
          gid: 0
          mode: "0600"
          source: package/deb/main/golang-msft-fips/debian-13/debian
