          - url: https://deb.debian.org/debian/pool/main/libs/libsecret/libsecret_0.21.7-1.debian.tar.xz
            checksum: sha256:611743e7c3e092ad8b9b7ebd819d03e01d55f3378c5e560f33b10d14e25651fc
            path: ${source.dir}/libsecret_0.21.7-1.debian.tar.xz
            uid: 0
            gid: 0
      pipeline:
        - uses: dpkg/source@v1
          work-dir: ${source.dir}
          with:
            file: libsecret_0.21.7-1.dsc
            path: libsecret
        - uses: dpkg/patch@v1
          with:
            apply: true
            patches:
              - ${source.dir}/patch/dhi-build-python-unittest-assertions.patch
        - uses: dpkg/bump@v1
          with:
            changelog:
              - Update Python unittest assertions so async test failures are reported
            version: 0.21.7-1+dhi0
        - name: disable meson docs for offline build
          runs: |
            set -eux -o pipefail

            sed -i 's/-Dauto_features=enabled/-Dauto_features=enabled -Dgtk_doc=false -Dmanpage=false/' debian/rules
            sed -i '/usr\/share\/doc\/libsecret-1/d' debian/libsecret-1-dev.install
            : > debian/libsecret-1-dev.doc-base
            : > debian/libsecret-1-dev.links
            sed -i '/usr\/share\/man/d' debian/libsecret-tools.install
        - uses: dpkg/build@v1
