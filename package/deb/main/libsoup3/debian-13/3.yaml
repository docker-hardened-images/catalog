  DEBIAN_FILENAME_VERSION: 3.6.5-3
  DEBIAN_ORIG_CHECKSUM: sha256:6891765aac3e949017945c3eaebd8cc8216df772456dc9f460976fbdb7ada234
  DEBIAN_ORIG_FILENAME: libsoup3_3.6.5.orig.tar.xz
