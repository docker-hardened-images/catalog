contents:
  packages:
    - '!base-files'
  builds:
    - name: libsoup3 deb
      work-dir: ${source.dir}/libsoup3
      contents:
        packages:
          - build-essential
          - debhelper
          - dpkg-dev
          - gi-docgen
          - gir1.2-glib-2.0-dev
          - gnome-pkg-tools
          - gobject-introspection
          - libbrotli-dev
          - libgirepository1.0-dev
          - libglib2.0-dev
          - libgnutls28-dev
          - libkrb5-dev
          - libnghttp2-dev
          - libpsl-dev
          - libsqlite3-dev
          - libsysprof-capture-4-dev
          - meson
          - ninja-build
          - pkgconf
          - valac
          - xsltproc
        files:
          - url: https://deb.debian.org/debian/pool/main/libs/libsoup3/libsoup3_3.6.5-3.dsc
            checksum: sha256:3c05b5021f78aac165e4761d7c28d76b5a281c45f3cb4abaff399ca3d9d4d310
            path: ${source.dir}/libsoup3_3.6.5-3.dsc
            uid: 0
            gid: 0
          - url: https://deb.debian.org/debian/pool/main/libs/libsoup3/libsoup3_3.6.5.orig.tar.xz
            checksum: sha256:6891765aac3e949017945c3eaebd8cc8216df772456dc9f460976fbdb7ada234
            path: ${source.dir}/libsoup3_3.6.5.orig.tar.xz
            uid: 0
            gid: 0
          - url: https://deb.debian.org/debian/pool/main/libs/libsoup3/libsoup3_3.6.5-3.debian.tar.xz
            checksum: sha256:c3941ea2f574f43d280a72bd377ee0502450cee87103c79255d9076d468881e2
            path: ${source.dir}/libsoup3_3.6.5-3.debian.tar.xz
            uid: 0
            gid: 0
      pipeline:
        - uses: dpkg/source@v1
          work-dir: ${source.dir}
          with:
            file: libsoup3_3.6.5-3.dsc
            path: libsoup3
        - name: adapt meson options for hermetic HSP builder
          runs: |
            set -eux -o pipefail

            python3 - << 'PY'
            from pathlib import Path

            rules = Path("debian/rules")
            text = rules.read_text()
            anchor = "\t\t-Dinstalled_tests=true"
            opt = "-Dtls_check=false"
            if opt not in text:
                text = text.replace(
                    anchor,
                    f"\t\t{opt} \\\n{anchor}",
                    1,
                )
            rules.write_text(text)
            PY
        - name: stub ntlm_auth for meson configure
          runs: |
            set -eux -o pipefail

            install -d /usr/bin
            printf '%s\n' '#!/bin/sh' 'exit 0' > /usr/bin/ntlm_auth
            chmod 755 /usr/bin/ntlm_auth
            command -v ntlm_auth
        - uses: dpkg/bump@v1
          with:
            changelog:
              - DHI Rebuild
            version: 3.6.5-3+dhi0
        - uses: dpkg/build@v1
          environment:
            DEB_BUILD_PROFILES: nodoc noinsttest
          with:
            args: -uc -us -d
            options: nocheck
