          - pybind11-dev
          - python3
          - python3-dev
          - python3-numpy
          - python3-opencv
          - python3-pil
        files:
          - url: https://deb.debian.org/debian/pool/main/z/zxing-cpp/zxing-cpp_2.3.0-4.dsc
            checksum: sha256:9b1cd5f190ef2fe41a7cdaa0421ff2c9096157f56d7072579263859c334dff6d
