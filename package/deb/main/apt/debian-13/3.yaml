contents:
  packages:
    - '!base-files'
  builds:
    - name: apt deb
      work-dir: ${source.dir}/apt
      contents:
        packages:
          - cmake
          - debhelper
          - dpkg-dev
          - gettext
          - googletest
          - gpgv
          - libbz2-dev
          - libdb-dev
          - liblz4-dev
          - liblzma-dev
          - libseccomp-dev
          - libssl-dev
          - libsystemd-dev
          - libudev-dev
          - libxxhash-dev
          - libzstd-dev
          - ninja-build
          - pkg-config
          - triehash
          - util-linux
          - zlib1g-dev
        files:
          - url: https://deb.debian.org/debian-security/pool/updates/main/a/apt/apt_3.0.4.dsc
            checksum: sha256:efc029dbfb0e264dfb38a8bf34398a8d3709cd35a463c270153b59e2e4ffb404
            path: ${source.dir}/apt_3.0.4.dsc
            uid: 0
            gid: 0
          - url: https://deb.debian.org/debian-security/pool/updates/main/a/apt/apt_3.0.4.tar.xz
            checksum: sha256:e853aec49afbe520ebcd4dbcbc98e1c55262c6bf1c119cf43e6aec69752443c6
            path: ${source.dir}/apt_3.0.4.tar.xz
            uid: 0
            gid: 0
          - url: https://salsa.debian.org/apt-team/apt/-/commit/dfeecf7f520b019a401c77ebba4f7547d43d9ab9.patch
            checksum: sha256:91ef371f58b69d3e9ca860a4f49e817dc443cef806bae63547be2c46c32ca336
            path: ${source.dir}/patch/upstream-fix-lingering-openssl-error.patch
            uid: 0
            gid: 0
      pipeline:
        - uses: dpkg/source@v1
          work-dir: ${source.dir}
          with:
            file: apt_3.0.4.dsc
            path: apt
            remove-original: false
        - name: remove upstream source artifacts
          work-dir: ${source.dir}
          runs: |
            set -eux -o pipefail

            rm apt_3.0.4.dsc apt_3.0.4.tar.xz
        - uses: patch@v1
          work-dir: ${source.dir}/apt
          with:
            options: -p1
            patches:
              - ${source.dir}/patch/upstream-fix-lingering-openssl-error.patch
        - uses: dpkg/bump@v1
          with:
            changelog:
              - Backport upstream fix for lingering OpenSSL errors in FIPS mode
            version: 3.0.4+dhi0
        - uses: dpkg/build@v1
          environment:
            DEB_BUILD_PROFILES: nodoc
          with:
            args: --build=source,any -uc -us -d
os-release:
  name: Docker Hardened Images (Debian)
  id: debian
  version-id: "13"
  version-codename: trixie
