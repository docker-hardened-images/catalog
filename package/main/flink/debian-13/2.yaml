# syntax=dhi.io/build:2-debian13

image: dhi.io/pkg-flink
variant: runtime
tags:
  - "2.3"
  - 2.3.0
  - 2.3.0-r2
  - 2.3-debian13
  - 2.3.0-debian13
  - 2.3.0-r2-debian13
platforms:
  - linux/amd64
  - linux/arm64
dates:
  release: "2026-07-10"
vars:
  COMMIT_SHA: c0f8d1a1e09f209885a88f9c19ceb9d9e9870283
  LOG4J_VERSION: 2.25.5
  REL: "2"
  SCALA_VERSION: "2.12"
  SEMVER_MAJOR_MINOR_VERSION: "2.3"
  SEMVER_MAJOR_VERSION: "2"
  SEMVER_VERSION: 2.3.0
  VERSION: 2.3.0
contents:
  packages:
    - base-files
  builds:
    - name: flink
      contents:
        packages:
          - bash
          - ca-certificates
          - coreutils
          - gzip
          - tar
        files:
          - url: https://downloads.apache.org/flink/flink-2.3.0/flink-2.3.0-bin-scala_2.12.tgz
            checksum: sha256:b52864b0c42a3638adb0895b97542a3ca820a0c3defda99eba6e45c2f8ca496a
            path: ${source.dir}/flink-2.3.0-bin-scala_2.12.tgz
            spdx:
              name: flink
              version: 2.3.0
              packages:
                - name: flink
                  purl: pkg:generic/apache-flink@2.3.0
                  license: Apache-2.0
            uid: 0
            gid: 0
          - url: https://repo1.maven.org/maven2/org/apache/logging/log4j/log4j-1.2-api/2.25.5/log4j-1.2-api-2.25.5.jar
            checksum: sha256:4dd812dc5a6343f542a9e0046b1ec78ecf10bdd5a8c15745101cdd8b9aa24974
            path: ${source.dir}/log4j-1.2-api-2.25.5.jar
            spdx:
              name: log4j-1.2-api
              version: 2.25.5
              packages:
                - name: log4j-1.2-api
                  purl: pkg:maven/org.apache.logging.log4j/log4j-1.2-api@2.25.5
                  license: Apache-2.0
            uid: 0
            gid: 0
          - url: https://repo1.maven.org/maven2/org/apache/logging/log4j/log4j-api/2.25.5/log4j-api-2.25.5.jar
            checksum: sha256:64777f73ea0b3104c04eb82befbdccc30a425a19e83ad06cb2f93aa303511863
            path: ${source.dir}/log4j-api-2.25.5.jar
            spdx:
              name: log4j-api
              version: 2.25.5
              packages:
                - name: log4j-api
                  purl: pkg:maven/org.apache.logging.log4j/log4j-api@2.25.5
                  license: Apache-2.0
            uid: 0
            gid: 0
          - url: https://repo1.maven.org/maven2/org/apache/logging/log4j/log4j-core/2.25.5/log4j-core-2.25.5.jar
            checksum: sha256:050c4f85deb48b055e9c041ac39043fbb79ce477841a11a1eb2969c86c6a0072
            path: ${source.dir}/log4j-core-2.25.5.jar
            spdx:
              name: log4j-core
              version: 2.25.5
              packages:
                - name: log4j-core
                  purl: pkg:maven/org.apache.logging.log4j/log4j-core@2.25.5
                  license: Apache-2.0
            uid: 0
            gid: 0
          - url: https://repo1.maven.org/maven2/org/apache/logging/log4j/log4j-layout-template-json/2.25.5/log4j-layout-template-json-2.25.5.jar
            checksum: sha256:27c37313e20c16bf0178e38d9d1a5c7320e34c03aa35bc2c66a589ea14abf545
            path: ${source.dir}/log4j-layout-template-json-2.25.5.jar
            spdx:
              name: log4j-layout-template-json
              version: 2.25.5
              packages:
                - name: log4j-layout-template-json
                  purl: pkg:maven/org.apache.logging.log4j/log4j-layout-template-json@2.25.5
                  license: Apache-2.0
            uid: 0
            gid: 0
          - url: https://repo1.maven.org/maven2/org/apache/logging/log4j/log4j-slf4j-impl/2.25.5/log4j-slf4j-impl-2.25.5.jar
            checksum: sha256:3d25b926bc6025c47ec010459749c12aa66b9d5537ba1922d67d89a098a66607
            path: ${source.dir}/log4j-slf4j-impl-2.25.5.jar
            spdx:
              name: log4j-slf4j-impl
              version: 2.25.5
              packages:
                - name: log4j-slf4j-impl
                  purl: pkg:maven/org.apache.logging.log4j/log4j-slf4j-impl@2.25.5
                  license: Apache-2.0
            uid: 0
            gid: 0
      pipeline:
        - name: install flink distribution
          runs: |
            set -eux -o pipefail

            install -d "${target.dir}/opt/flink"
            tar -xzf "${source.dir}/flink-2.3.0-bin-scala_2.12.tgz" \
              --strip-components=1 \
              -C "${target.dir}/opt/flink"

            install -m 0755 "${source.dir}/docker-entrypoint.sh" "${target.dir}/docker-entrypoint.sh"

            rm -f "${target.dir}/opt/flink/bin/"*.bat
            SOURCE_DIR="${source.dir}" LOG4J_VERSION="2.25.5" bash "${source.dir}/replace-log4j.sh" "${target.dir}/opt/flink/lib"

            case "${target.arch}" in
              amd64) arch_triplet="x86_64-linux-gnu" ;;
              arm64) arch_triplet="aarch64-linux-gnu" ;;
              *)
                echo "unsupported architecture: ${target.arch}" >&2
                exit 1
                ;;
            esac
            install -d "${target.dir}/usr/lib/${arch_triplet}"
            ln -sf "libjemalloc.so.2" "${target.dir}/usr/lib/${arch_triplet}/libjemalloc.so"

            chown -R 9999:9999 "${target.dir}/opt/flink"
            chown 0:0 "${target.dir}/docker-entrypoint.sh"
        - uses: dhi/build-pkg:0
          with:
            depends:
              - bash
              - coreutils
              - gettext-base
              - hostname
              - libjemalloc2
            description: Apache Flink stream processing framework
            files:
              - docker-entrypoint.sh
              - gid: 9999
                mode: "0644"
                path: opt/flink/conf/config.yaml
                uid: 9999
              - gid: 9999
                path: opt/flink
                uid: 9999
              - path: usr/lib
            formats:
              - deb
            license: Apache-2.0
            name: flink
            rel: 2
            url: https://flink.apache.org/
            version: 2.3.0
      paths:
        - type: file
          path: ${source.dir}/replace-log4j.sh
          uid: 0
          gid: 0
          mode: "0755"
          source: package/main/flink/replace-log4j.sh
        - type: file
          path: ${source.dir}/docker-entrypoint.sh
          uid: 0
          gid: 0
          mode: "0755"
          source: package/main/flink/docker-entrypoint.sh
      outputs:
        - source: /opt/docker/sbom/flink
          target: /opt/docker/sbom/flink
          uid: 0
          gid: 0
os-release:
  name: Docker Hardened Images (Debian)
  id: debian
  version-id: "13"
  version-codename: trixie
  pretty-name: Docker Hardened Images/Debian GNU/Linux 13 (trixie)
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
