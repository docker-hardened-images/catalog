# syntax=dhi.io/build:2-alpine3.24

image: dhi.io/pkg-influx-cli
variant: runtime
tags:
  - 2.9.1-alpine3.24
  - 2.9.1-r1-alpine3.24
platforms:
  - linux/amd64
  - linux/arm64
vars:
  COMMIT_SHA: 54431c54aa7cd7fb486740908f60cdbe3831e7d3
  GOLANG_MAJOR_MINOR_VERSION: "1.27"
  GOLANG_VERSION: 1.27.4-r1
  PACKAGE_NAME: influx-cli-2
