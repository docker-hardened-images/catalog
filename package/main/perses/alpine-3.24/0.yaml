            test -x ${target.dir}/usr/bin/percli
            test -x ${target.dir}/usr/bin/perses-dev
            test -x ${target.dir}/usr/bin/percli-dev
            test -f LICENSE
            test -f docs/examples/config.docker.yaml
            set -- plugins-archive/*.tar.gz
            test "$#" -eq 30
            install -D -m 0644 LICENSE ${target.dir}/usr/share/doc/perses/LICENSE
            install -D -m 0644 LICENSE ${target.dir}/usr/share/doc/perses-dev/LICENSE
            install -D -m 0644 docs/examples/config.docker.yaml ${target.dir}/etc/perses/config.yaml
            install -D -m 0644 docs/examples/config.docker.yaml ${target.dir}/etc/perses/config-dev.yaml
            grep -q 'folder: "/perses"' ${target.dir}/etc/perses/config.yaml
            cp -a plugins-archive ${target.dir}/etc/perses/plugins-archive
            cp -a plugins-archive ${target.dir}/etc/perses/plugins-archive-dev
            chmod 0755 ${target.dir}/etc/perses/plugins-archive ${target.dir}/etc/perses/plugins-archive-dev
            chmod 0644 ${target.dir}/etc/perses/plugins-archive/*.tar.gz ${target.dir}/etc/perses/plugins-archive-dev/*.tar.gz
            bad=$(find ${target.dir}/etc/perses/plugins-archive ${target.dir}/etc/perses/plugins-archive-dev -type f ! -perm 0644)
            test -z "$bad"
            bad=$(find ${target.dir}/etc/perses/plugins-archive ${target.dir}/etc/perses/plugins-archive-dev -type d ! -perm 0755)
            test -z "$bad"
            test -s /opt/docker/sbom/perses/.spdx.perses.json
            test -s /opt/docker/sbom/perses-ui/.spdx.perses-ui.json
            test -s /opt/docker/sbom/perses-plugin-prometheus/.spdx.perses-plugin-prometheus.json
            grep -q 'pkg:npm/%40perses-dev/prometheus-plugin@' /opt/docker/sbom/perses-plugin-prometheus/.spdx.perses-plugin-prometheus.json
            set -- /opt/docker/sbom/perses-plugin-*
            test "$#" -eq 30
            if grep -q 'perses-dev/e2e' /opt/docker/sbom/perses-ui/.spdx.perses-ui.json; then
              echo 'e2e workspace cataloged in UI SBOM' >&2
              exit 1
            fi
            grep -q 'perses-dev/app' /opt/docker/sbom/perses-ui/.spdx.perses-ui.json
            mkdir -p ${target.dir}/opt/docker
            cp -a /opt/docker/sbom ${target.dir}/opt/docker/sbom
            cp -a /opt/docker/sbom ${target.dir}/opt/docker/sbom-dev
        - uses: dhi/build-pkg:0
          with:
            description: Perses dashboard
            files:
