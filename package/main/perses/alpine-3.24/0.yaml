              - -X github.com/prometheus/common/version.Branch=HEAD
            output: ${target.dir}/usr/bin/percli
            packages: ./cmd/percli
            strip: true
        - name: build perses dev
          uses: go/build@v1
          with:
            cgo-enabled: "0"
            fips: false
            ldflags:
              - -X github.com/prometheus/common/version.Version=0.55.1
              - -X github.com/prometheus/common/version.Revision=34599751521f9b91ccffbf2fb198d727e1ccdc83
              - -X github.com/prometheus/common/version.BuildDate=$(date -u -d @${SOURCE_DATE_EPOCH} +'%Y-%m-%d')
              - -X github.com/prometheus/common/version.Branch=HEAD
            output: ${target.dir}/usr/bin/perses-dev
            packages: ./cmd/perses
            strip: false
        - name: build percli dev
          uses: go/build@v1
          with:
            cgo-enabled: "0"
            fips: false
            ldflags:
              - -X github.com/prometheus/common/version.Version=0.55.1
              - -X github.com/prometheus/common/version.Revision=34599751521f9b91ccffbf2fb198d727e1ccdc83
              - -X github.com/prometheus/common/version.BuildDate=$(date -u -d @${SOURCE_DATE_EPOCH} +'%Y-%m-%d')
              - -X github.com/prometheus/common/version.Branch=HEAD
            output: ${target.dir}/usr/bin/percli-dev
            packages: ./cmd/percli
            strip: false
        - name: install production ui deps for sbom
          work-dir: /go/src/github.com/perses/perses/ui
          privileged: true
          runs: |
            set -eux -o pipefail

            test -d e2e
            test -d node_modules
            test -f package.json
            jq '.workspaces = ["app", "core", "internal-utils"]' package.json > package.json.new
            mv package.json.new package.json
            jq -e '.workspaces == ["app", "core", "internal-utils"]' package.json > /dev/null
            rm -r e2e node_modules
            npm ci --omit=dev --ignore-scripts
            test -d node_modules
            if test -d e2e; then
              echo 'e2e workspace was reinstalled' >&2
              exit 1
            fi
            test -d node_modules/@rspack/core/compiled/tinypool
            test -d node_modules/@module-federation/dts-plugin
            test -d node_modules/adm-zip
            test -d node_modules/undici
            test -d node_modules/typescript
            test -d node_modules/@typescript
            rm -r node_modules/@rspack node_modules/@module-federation/dts-plugin node_modules/adm-zip node_modules/undici node_modules/typescript node_modules/@typescript
            test ! -e node_modules/@rspack
            test ! -e node_modules/@module-federation/dts-plugin
            test ! -e node_modules/adm-zip
            test ! -e node_modules/undici
            test ! -e node_modules/typescript
            test ! -e node_modules/@typescript
            leftovers=$(find . \( -path '*/tinypool/package.json' -o -path '*/node_modules/adm-zip/package.json' -o -path '*/node_modules/undici/package.json' \) -print)
            test -z "$leftovers"
