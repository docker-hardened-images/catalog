              - go.opentelemetry.io/otel/exporters/otlp/otlptrace@v1.47.0
              - go.opentelemetry.io/otel/sdk@v1.47.0
              - google.golang.org/grpc@v1.84.0
              - golang.org/x/mod@v0.42.0
              - github.com/labstack/echo/v4@v4.16.3
              - github.com/andybalholm/brotli@v1.2.7
              - github.com/klauspost/compress@v1.20.2
            download: true
        - name: update ui dependencies
          uses: npm/bump@v1
          work-dir: /go/src/github.com/perses/perses/ui
          privileged: true
          with:
            bumps: ${source.dir}/patch/npm-bumps.json
            npm-root: /go/src/github.com/perses/perses/ui
            omit-dev: false
        - name: build ui and generate api
          privileged: true
          runs: |
            set -eux -o pipefail

            cd ui
            npm ci
            npm run build
            test -f app/dist/index.html
            grep -q '<title>Perses</title>' app/dist/index.html
            cd /go/src/github.com/perses/perses
            bash scripts/compress_assets.sh
            if grep -q 'forget to generate the react app' ui/embed.go; then
              echo 'placeholder UI was embedded' >&2
              exit 1
            fi
            test -s ui/embed.go
            go generate ./internal/api
        - name: build perses
          uses: go/build@v1
          with:
            cgo-enabled: "0"
            fips: false
            ldflags:
              - -s -w
              - -X github.com/prometheus/common/version.Version=0.55.1
              - -X github.com/prometheus/common/version.Revision=34599751521f9b91ccffbf2fb198d727e1ccdc83
              - -X github.com/prometheus/common/version.BuildDate=$(date -u -d @${SOURCE_DATE_EPOCH} +'%Y-%m-%d')
              - -X github.com/prometheus/common/version.Branch=HEAD
            output: ${target.dir}/usr/bin/perses
            packages: ./cmd/perses
            strip: true
        - name: build percli
          uses: go/build@v1
          with:
            cgo-enabled: "0"
            fips: false
            ldflags:
              - -s -w
