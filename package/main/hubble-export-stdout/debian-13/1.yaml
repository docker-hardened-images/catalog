  VERSION: 1.2.0
contents:
  repositories:
    - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
  keyring:
    - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
  packages:
    - base-files
  builds:
    - name: hubble-export-stdout-1
      shell: bash
      contents:
        packages:
          - bash
          - coreutils
          - grep
          - sed
        files:
          - url: git+https://github.com/cilium/hubble-export-stdout.git#v1.2.0
            checksum: 16388e39bbf6919a0be34faf5cb98c865bad8040
            path: ${source.dir}/hubble-export-stdout
            spdx:
              name: hubble-export-stdout
              version: 1.2.0
              packages:
                - name: hubble-export-stdout
                  purl: pkg:github/cilium/hubble-export-stdout@1.2.0
                  license: Apache-2.0
            uid: 0
            gid: 0
      pipeline:
        - name: stage hubble-export-stdout script
          runs: |
            set -eux -o pipefail

            install -Dm755 \
              "${source.dir}/hubble-export-stdout/hubble-export-stdout" \
              "${target.dir}/usr/bin/hubble-export-stdout"
            sed -i \
              -e '1s|^#!.*|#!/bin/busybox sh|' \
              -e 's|^tail |/bin/busybox tail |' \
              "${target.dir}/usr/bin/hubble-export-stdout"
            grep -q '^#!/bin/busybox sh$' "${target.dir}/usr/bin/hubble-export-stdout"
            grep -q '^/bin/busybox tail ' "${target.dir}/usr/bin/hubble-export-stdout"
            install -Dm755 \
              "${target.dir}/usr/bin/hubble-export-stdout" \
              "${target.dir}/usr/bin/hubble-export-stdout-dev"
        - uses: dhi/build-pkg:0
          with:
            deb:
              depends:
                - base-files
            depends:
              - busybox
            description: Cilium Hubble export sidecar that tails flow logs to stdout
            files:
              - usr/bin/hubble-export-stdout
            license: Apache-2.0
            name: hubble-export-stdout-1
            rel: 0
            subpackages:
              - files:
                  - path: usr/bin/hubble-export-stdout
