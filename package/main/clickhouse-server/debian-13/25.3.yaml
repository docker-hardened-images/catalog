# syntax=dhi.io/build:2-debian13

image: dhi.io/pkg-clickhouse-server
variant: runtime
tags:
  - "25.3"
  - 25.3.14
  - 25.3.14-r0
  - 25.3-debian13
  - 25.3.14-debian13
  - 25.3.14-r0-debian13
platforms:
  - linux/amd64
  - linux/arm64
vars:
  DEBIAN_EPOCH_MAJOR_MINOR_VERSION: "25.3"
  DEBIAN_EPOCH_MAJOR_VERSION: "25"
  DEBIAN_EPOCH_VERSION: 25.3.14
  PACKAGE_NAME: clickhouse-server-25.3
  REL: "0"
  SEMVER_MAJOR_MINOR_VERSION: "25.3"
  SEMVER_MAJOR_VERSION: "25"
  SEMVER_VERSION: 25.3.14
  VERSION: 25.3.14.14
contents:
  packages:
    - base-files
  builds:
    - name: clickhouse-server
      contents:
        repositories:
          - deb [signed-by=/usr/share/keyrings/clickhouse-keyring.gpg] https://packages.clickhouse.com/deb stable main
        keyring:
          - https://keyserver.ubuntu.com/pks/lookup?op=get&search=0x3a9ea1193a97b548be1457d48919f6bd2b48d754
        packages:
          - apt
          - bash
          - ca-certificates
          - coreutils
          - debconf
          - diffutils
          - dpkg
          - findutils
          - locales
        mappings:
          clickhouse-client: pkg:deb/clickhouse/clickhouse-client@25.3.14.14?os_name=debian&os_version=13
          clickhouse-common-static: pkg:deb/clickhouse/clickhouse-common-static@25.3.14.14?os_name=debian&os_version=13
          clickhouse-server: pkg:deb/clickhouse/clickhouse-server@25.3.14.14?os_name=debian&os_version=13
      pipeline:
        - name: install and stage clickhouse packages
          privileged: true
          runs: |
            set -eux -o pipefail

            apt-get update
            mkdir -p "${source.dir}/debs"
            (
              cd "${source.dir}/debs"
              apt-get download \
                "clickhouse-client=25.3.14.14" \
                "clickhouse-server=25.3.14.14" \
                "clickhouse-common-static=25.3.14.14"
            )

            for deb in "${source.dir}/debs/"*.deb; do
              dpkg-deb -x "${deb}" "${target.dir}"
            done

            locale-gen en_US.UTF-8

            mkdir -p \
              "${target.dir}/var/lib/clickhouse" \
              "${target.dir}/var/log/clickhouse-server" \
              "${target.dir}/etc/clickhouse-client" \
              "${target.dir}/etc/clickhouse-server/config.d" \
              "${target.dir}/etc/clickhouse-server/users.d"

            touch "${target.dir}/var/lib/clickhouse/.keep"
            touch "${target.dir}/var/log/clickhouse-server/.keep"

            chmod ugo+Xrw -R "${target.dir}/etc/clickhouse-server" "${target.dir}/etc/clickhouse-client"
            chown -R 1001:1001 "${target.dir}/var/lib/clickhouse"
            chown root:1001 "${target.dir}/var/log/clickhouse-server"
            chmod ugo+Xrw -R \
              "${target.dir}/var/lib/clickhouse" \
              "${target.dir}/var/log/clickhouse-server" \
              "${target.dir}/etc/clickhouse-server" \
              "${target.dir}/etc/clickhouse-client"
        - uses: dhi/build-pkg:0
          with:
            depends:
              - bash
              - ca-certificates
              - coreutils
              - findutils
              - locales
              - tzdata
            description: ClickHouse column-oriented database server
            files:
              - etc/clickhouse-client
              - etc/clickhouse-keeper
              - etc/clickhouse-server
              - etc/init.d
              - lib
              - usr
              - var/lib/clickhouse
              - var/log/clickhouse-server
            formats:
              - deb
            license: Apache-2.0
            name: clickhouse-server-25.3
            rel: 0
            url: https://clickhouse.com/
            version: 25.3.14.14
os-release:
  name: Docker Hardened Images (Debian)
  id: debian
  version-id: "13"
  version-codename: trixie
  pretty-name: Docker Hardened Images/Debian GNU/Linux 13 (trixie)
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
