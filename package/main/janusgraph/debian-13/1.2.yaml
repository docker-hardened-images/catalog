# syntax=dhi.io/build:2-debian13

image: dhi.io/pkg-janusgraph
variant: runtime
tags:
  - 1.2.0
  - 1.2.0-r2
  - 1.2.0-debian13
  - 1.2.0-r2-debian13
platforms:
  - linux/amd64
  - linux/arm64
dates:
  release: "2026-10-25"
vars:
  COMMIT_SHA: 5e3e7bc76e3a1db983cd55475a9bc51e09bcaf23
  JDK_MAJOR_VERSION: "17"
  JDK_VERSION: 1:17.0.21+9-2
  MAVEN_VERSION: 3.10.0-1
  PACKAGE_NAME: janusgraph-1.2
  REL: "2"
  SEMVER_MAJOR_MINOR_VERSION: "1.2"
  SEMVER_MAJOR_VERSION: "1"
  SEMVER_VERSION: 1.2.0
  VERSION: 1.2.0
contents:
  repositories:
    - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
  keyring:
    - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
  packages:
    - base-files
  builds:
    - name: janusgraph
      work-dir: ${source.dir}/janusgraph
      environment:
        JAVA_HOME: /usr/lib/jvm/temurin-17
        MAVEN_ARGS: --batch-mode --no-transfer-progress
        MAVEN_HOME: /usr/share/java/maven-3
      caches:
        - path: /root/.m2/repository
      contents:
        packages:
          - bash
          - ca-certificates
          - coreutils
          - eclipse-temurin-17-jdk=1:17.0.21+9-2
          - findutils
          - git
          - grep
          - gzip
          - libstdc++6
          - maven=3.10.0-1
          - sed
          - unzip
          - yq
        files:
          - url: git+https://github.com/JanusGraph/janusgraph.git#v1.2.0
            checksum: 5e3e7bc76e3a1db983cd55475a9bc51e09bcaf23
            path: ${source.dir}/janusgraph
            spdx:
              name: janusgraph
              version: 1.2.0
              packages:
                - name: janusgraph
                  purl: pkg:github/JanusGraph/janusgraph@v1.2.0
                  license: Apache-2.0
            uid: 0
            gid: 0
      pipeline:
        - uses: mvn/mirror@v1
        - name: use maven central when mirror credentials are absent
          secrets:
            - id: maven_user
              env: MAVEN_USER
              optional: true
            - id: maven_password
              env: MAVEN_PASSWORD
              optional: true
          runs: |
            set -eux -o pipefail

            if [ -z "${MAVEN_USER:-}" ] || [ -z "${MAVEN_PASSWORD:-}" ]; then
              rm -f /root/.m2/settings.xml
            fi
        - name: patch docker entrypoint for yq-go
          uses: patch@v1
          with:
            options: -p1
            patches:
              - ${source.dir}/patch/yq-entrypoint.patch
        - name: remove duplicate netty epoll dependency
          runs: |
            set -eux -o pipefail

            patchfile="${source.dir}/patch/maven-3.10-duplicate-netty-epoll.patch"
            if patch -p1 --dry-run < "${patchfile}" > /dev/null 2>&1; then
              patch -p1 < "${patchfile}"
            elif patch -p1 -R --dry-run < "${patchfile}" > /dev/null 2>&1; then
              echo "duplicate netty-epoll dependencyManagement entry already absent"
            else
              echo "pom.xml does not match netty-epoll patch expectations"
              exit 1
            fi
        - name: remove central publishing maven extension
          runs: |
            set -eux -o pipefail

            if ! grep -q central-publishing-maven-plugin pom.xml; then
              exit 0
            fi
            patch -p1 < "${source.dir}/patch/remove-central-publishing-maven-plugin.patch"
        - name: patch maven dependencies
          uses: mvn/patch@v1
          secrets:
            - id: maven_user
              env: MAVEN_USER
              optional: true
            - id: maven_password
              env: MAVEN_PASSWORD
              optional: true
          with:
            dependencies: ${source.dir}/patch/mvn-dependencies-1.2.json
            dependencies-key: dependencyManagement.dependencies
            mvn-root: ${source.dir}/janusgraph
            properties: ${source.dir}/patch/mvn-properties-1.2.json
        - name: skip dist javadoc unpack on 1.2.x
          runs: |
            set -eux -o pipefail

            if [ "1.2" != "1.2" ]; then
              exit 0
            fi
            patch -p1 < "${source.dir}/patch/skip-dist-javadoc-1.2.patch"
        - name: short out upstream docker image build
          runs: |
            set -eux -o pipefail

            sed -i '0,/^set -e$/s//exit 0\nset -e/' janusgraph-dist/docker/build-and-push-image.sh
            grep -q '^exit 0$' janusgraph-dist/docker/build-and-push-image.sh
        - name: build distribution
          privileged: true
          secrets:
            - id: maven_user
              env: MAVEN_USER
              optional: true
            - id: maven_password
              env: MAVEN_PASSWORD
              optional: true
          runs: |
            set -eux -o pipefail

            mvn clean install -Pjanusgraph-release,skip-docker \
              -Dbuild.full=none \
              -Ddownload.plugin.skip=true \
              -DskipTests=true \
              -Dgpg.skip=true \
              -Dmaven.javadoc.skip=true
        - name: stage distribution
          runs: |
            set -eux -o pipefail

            mkdir -p "${target.dir}/usr/share/janusgraph"
            zipfile=$(find janusgraph-dist/target -maxdepth 1 -name "janusgraph-1.2.0.zip" -print -quit)
            test -n "${zipfile}"
            scratch=$(mktemp -d)
            unzip -q "${zipfile}" -d "${scratch}"
            cp -a "${scratch}/janusgraph-1.2.0/." \
              "${target.dir}/usr/share/janusgraph/"
            rm -rf "${scratch}"
            rm -rf \
              "${target.dir}/usr/share/janusgraph/elasticsearch" \
              "${target.dir}/usr/share/janusgraph/javadocs" \
              "${target.dir}/usr/share/janusgraph/log" \
              "${target.dir}/usr/share/janusgraph/examples" \
              "${target.dir}/usr/share/janusgraph"/conf/janusgraph-*.properties
            mv \
              "${target.dir}/usr/share/janusgraph/conf/gremlin-server/gremlin-server.yaml" \
              "${target.dir}/usr/share/janusgraph/conf/janusgraph-server.yaml"
            rm -rf "${target.dir}/usr/share/janusgraph/conf/gremlin-server"
            cp -a janusgraph-dist/docker/conf/. "${target.dir}/usr/share/janusgraph/conf/"
            cp -a janusgraph-dist/docker/scripts/remote-connect.groovy "${target.dir}/usr/share/janusgraph/scripts/"
            install -D -m 0755 janusgraph-dist/docker/docker-entrypoint.sh \
              "${target.dir}/usr/share/janusgraph/docker/docker-entrypoint.sh"
            install -D -m 0755 janusgraph-dist/docker/load-initdb.sh \
              "${target.dir}/usr/share/janusgraph/docker/load-initdb.sh"

            mkdir -p "${target.dir}/usr/bin"
            ln -s ../share/janusgraph/bin/janusgraph-server.sh "${target.dir}/usr/bin/janusgraph"
            ln -s ../share/janusgraph/bin/gremlin.sh "${target.dir}/usr/bin/gremlin"
        - name: maven sbom
          uses: sbom@v1
          with:
            extra-scanners: java-archive-cataloger
            prefix: janusgraph-maven
            source: ${target.dir}/usr/share/janusgraph
        - uses: dhi/build-pkg:0
          privileged: true
          with:
            depends:
              - bash
              - ca-certificates
              - coreutils
              - findutils
              - gawk
              - grep
              - krb5-user
              - sed
              - yq-go
            description: Distributed graph database optimized for large-scale graphs
            files:
              - usr/bin/gremlin
              - usr/bin/janusgraph
              - usr/share/janusgraph
            formats:
              - deb
            license: Apache-2.0
            name: janusgraph-1.2
            rel: 2
            url: https://janusgraph.org/
            version: 1.2.0
      paths:
        - type: file
          path: ${source.dir}/patch/yq-entrypoint.patch
          uid: 0
          gid: 0
          source: package/main/janusgraph/patch/yq-entrypoint.patch
        - type: file
          path: ${source.dir}/patch/maven-3.10-duplicate-netty-epoll.patch
          uid: 0
          gid: 0
          source: package/main/janusgraph/patch/maven-3.10-duplicate-netty-epoll.patch
        - type: file
          path: ${source.dir}/patch/remove-central-publishing-maven-plugin.patch
          uid: 0
          gid: 0
          source: package/main/janusgraph/patch/remove-central-publishing-maven-plugin.patch
        - type: file
          path: ${source.dir}/patch/skip-dist-javadoc-1.2.patch
          uid: 0
          gid: 0
          source: package/main/janusgraph/patch/skip-dist-javadoc-1.2.patch
        - type: file
          path: ${source.dir}/patch/mvn-dependencies-1.2.json
          uid: 0
          gid: 0
          source: package/main/janusgraph/patch/mvn-dependencies-1.2.json
        - type: file
          path: ${source.dir}/patch/mvn-properties-1.2.json
          uid: 0
          gid: 0
          source: package/main/janusgraph/patch/mvn-properties-1.2.json
os-release:
  name: Docker Hardened Images (Debian)
  id: debian
  version-id: "13"
  version-codename: trixie
  pretty-name: Docker Hardened Images/Debian GNU/Linux 13 (trixie)
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
