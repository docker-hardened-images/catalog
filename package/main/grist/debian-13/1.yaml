# syntax=dhi.io/build:2-debian13

image: dhi.io/pkg-grist
variant: runtime
tags:
  - 1.7.17
  - 1.7.17-r0
  - 1.7.17-debian13
  - 1.7.17-r0-debian13
platforms:
  - linux/amd64
  - linux/arm64
dates:
  release: "2026-07-29"
vars:
  COMMIT_SHA: fe672818f879c86d2d145f3f30cb30f106e15f1a
  NODEJS_VERSION: 24.18.1-0
  PYTHON_MAJOR_MINOR: "3.13"
  PYTHON_VERSION: 3.13.14-3
  REL: "0"
  SEMVER_MAJOR_MINOR_VERSION: "1.7"
  SEMVER_MAJOR_VERSION: "1"
  SEMVER_VERSION: 1.7.17
  VERSION: 1.7.17
contents:
  packages:
    - base-files
  builds:
    - name: grist
      environment:
        GRIST_EDITION: community
      contents:
        repositories:
          - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
        keyring:
          - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
        packages:
          - bash
          - ca-certificates
          - coreutils
          - findutils
          - git
          - gzip
          - make
          - gcc
          - g++
          - grep
          - sed
          - tar
          - mawk
          - diffutils
          - gawk
          - build-essential
          - libc6
          - libstdc++6
          - nodejs-24
          - node-corepack
          - npm
          - yarn-classic
          - python-3.13
          - python-3.13-dev
          - python3-pip
          - python3-setuptools
          - python3-wheel
        files:
          - url: git+https://github.com/gristlabs/grist-core.git#v1.7.17
            checksum: fe672818f879c86d2d145f3f30cb30f106e15f1a
            path: ${source.dir}/grist
            spdx:
              name: grist
              version: 1.7.17
              packages:
                - name: grist
                  purl: pkg:dhi/grist@1.7.17
                  license: Apache-2.0
            uid: 0
            gid: 0
      pipeline:
        - name: set-community-edition
          work-dir: ${source.dir}/grist
          runs: |
            set -eux -o pipefail

            echo community > grist-edition
        - name: patch-lockfile
          work-dir: ${source.dir}/grist
          runs: |
            set -eux -o pipefail

            grep -q 'brace-expansion-1.1.11.tgz' yarn.lock
            sed -i \
              -e '/^brace-expansion@\^1\.1\.7:/,/^$/{
                    s|^  version "1\.1\.11"|  version "1.1.16"|
                    s|^  resolved "[^"]*brace-expansion-1\.1\.11\.tgz[^"]*"|  resolved "https://registry.npmjs.org/brace-expansion/-/brace-expansion-1.1.16.tgz"|
                    s|^  integrity .*|  integrity sha512-IDw48K2/2kRkg9LdJxurvq3lV3aBgq0REY89duEqFRthjlPdXHKMj7EnQOXVckxzgisinf3nHfrcE2FufFLXMw==|
                  }' \
              yarn.lock
            grep -q 'brace-expansion-1.1.16.tgz' yarn.lock
        - name: patch-node
          uses: yarn/bump@v2
          with:
            bumps: ${source.dir}/patches/yarn-patches.json
            yarn-root: ${source.dir}/grist
        - name: patch-brace-expansion-2
          work-dir: ${source.dir}/grist
          runs: |
            set -eux -o pipefail

            grep -q 'brace-expansion-2.0.2.tgz' yarn.lock
            sed -i \
              -e '/^brace-expansion@\^2\.0\.2:/,/^$/{
                    s|^  version "2\.0\.2"|  version "2.1.2"|
                    s|^  resolved "[^"]*brace-expansion-2\.0\.2\.tgz[^"]*"|  resolved "https://registry.npmjs.org/brace-expansion/-/brace-expansion-2.1.2.tgz"|
                    s|^  integrity .*|  integrity sha512-w5JZcKgdhDOgOwm8H+KgbosopHMuGcl6qbulwjtz3SM7I7P3yW1eAjzMPLrIE+NQ9vjgANKHWeMHnrT0OXW1oA==|
                  }' \
              yarn.lock
            grep -q 'version "2.1.2"' yarn.lock
            grep -q 'brace-expansion-2.1.2.tgz' yarn.lock
            ! grep -q 'brace-expansion-2.0.2.tgz' yarn.lock
        - name: build-node
          work-dir: ${source.dir}/grist
          privileged: true
          runs: |
            set -eux -o pipefail

            yarn install --frozen-lockfile --verbose --network-timeout 600000
            yarn global add --verbose --network-timeout 600000 node-gyp node-pre-gyp node-gyp-build node-gyp-build-optional-packages
            yarn install --prod --frozen-lockfile --modules-folder=node_modules_prod --verbose --network-timeout 600000

            yarn run build:prod

            rm -rf node_modules
            mv node_modules_prod node_modules
        - name: patch-pyodide-worker
          uses: yarn/bump@v2
          with:
            bumps: ${source.dir}/patches/yarn-patches-pyodide-worker.json
            yarn-root: ${source.dir}/grist/sandbox/pyodide/worker
        - name: build-pyodide
          work-dir: ${source.dir}/grist/sandbox/pyodide
          privileged: true
          runs: |
            set -eux -o pipefail

            make setup
        - name: build-python
          work-dir: ${source.dir}/grist/sandbox
          privileged: true
          runs: |
            set -eux -o pipefail

            pip install --root "${target.dir}" --prefix /usr lazy-object-proxy==1.7.1
            grep -v "^lazy-object-proxy" requirements.txt > requirements-filtered.txt
            pip install --root "${target.dir}" --prefix /usr -r requirements-filtered.txt
        - name: stage-node-payload
          work-dir: ${source.dir}/grist
          runs: |
            set -eux -o pipefail

            chmod 755 sandbox/*

            mkdir -p "${target.dir}/usr/lib/grist"
            cp -r node_modules "${target.dir}/usr/lib/grist/node_modules"
            cp -r _build "${target.dir}/usr/lib/grist/_build"
            cp -r static "${target.dir}/usr/lib/grist/static"
            cp -r sandbox "${target.dir}/usr/lib/grist/sandbox"
            cp app/cli.sh "${target.dir}/usr/lib/grist/cli"
            cp package.json "${target.dir}/usr/lib/grist/package.json"
            cp -r bower_components "${target.dir}/usr/lib/grist/bower_components"
            cp -r plugins "${target.dir}/usr/lib/grist/plugins"
        - uses: dhi/build-pkg:0
          with:
            depends:
              - nodejs-24
              - python-3.13
              - libsqlite3-0
            description: Grist relational spreadsheet
            files:
              - usr/lib/grist
              - usr/lib/python3.13
            formats:
              - deb
            license: Apache-2.0
            name: grist
            rel: 0
            url: https://www.getgrist.com/
            version: 1.7.17
      paths:
        - type: file
          path: ${source.dir}/patches/yarn-patches.json
          uid: 0
          gid: 0
          source: package/main/grist/patch/yarn-patches.json
        - type: file
          path: ${source.dir}/patches/yarn-patches-pyodide-worker.json
          uid: 0
          gid: 0
          source: package/main/grist/patch/yarn-patches-pyodide-worker.json
os-release:
  name: Docker Hardened Images (Debian)
  id: debian
  version-id: "13"
  version-codename: trixie
  pretty-name: Docker Hardened Images/Debian GNU/Linux 13 (trixie)
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
