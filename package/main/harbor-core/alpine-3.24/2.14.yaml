# syntax=dhi.io/build:2-alpine3.24

image: dhi.io/pkg-harbor-core
variant: runtime
tags:
  - 2.14.4-alpine3.24
  - 2.14.4-r1-alpine3.24
platforms:
  - linux/amd64
  - linux/arm64
dates:
  release: "2025-09-17"
vars:
  COMMIT_SHA: 79a297f760eb9596c8693727b88c3c568f9c6302
  GO_SWAGGER_CHECKSUM: '#{ target.arch == "amd64" ? "sha256:c668a4a1f96f65fdc166fef3f89adebe15b82f34e9cdeb71bc771436f6b94b07" : "sha256:d21f57d56f3f6dcae0e801b0c47067549343b35a5234e76bfc608cae411598aa" }'
  GO_SWAGGER_VERSION: v0.33.1
  GOLANG_MAJOR_MINOR_VERSION: "1.26"
  GOLANG_VERSION: 1.26.8-r0
  PACKAGE_NAME: harbor-core-2.14
  REL: "1"
  SEMVER_MAJOR_MINOR_VERSION: "2.14"
  SEMVER_MAJOR_VERSION: "2"
  SEMVER_VERSION: 2.14.4
  VERSION: 2.14.4
contents:
  repositories:
    - https://dhi.io/apk/alpine/v3.24/main
    - https://dhi.io/apk/alpine/v3.23/main
    - https://dl-cdn.alpinelinux.org/alpine/v3.24/main
    - https://dl-cdn.alpinelinux.org/alpine/v3.24/community
  keyring:
    - https://dhi.io/keyring/dhi-apk@docker-0F81AD7700D99184.rsa.pub
  packages:
    - alpine-baselayout-data
  builds:
    - name: harbor-core-2.14
      work-dir: /go/src/github.com/goharbor/harbor
      caches:
        - path: /go/pkg/mod
      contents:
        packages:
          - busybox
          - bash
          - ca-certificates-bundle
          - coreutils
          - findutils
          - mawk
          - sed
          - golang-1.26=1.26.8-r0
          - golang-1.26-oci-config=1.26.8-r0
        files:
          - url: git+https://github.com/goharbor/harbor.git#v2.14.4
            checksum: 79a297f760eb9596c8693727b88c3c568f9c6302
            path: /go/src/github.com/goharbor/harbor
            spdx:
              name: harbor-core
              version: 2.14.4
              packages:
                - name: harbor-core
                  purl: pkg:golang/github.com/goharbor/harbor@2.14.4
                  license: Apache-2.0
            uid: 0
            gid: 0
          - url: https://github.com/go-swagger/go-swagger/releases/download/v0.33.1/swagger_linux_${target.arch}
            checksum: ${GO_SWAGGER_CHECKSUM}
            path: /usr/local/bin/swagger
            spdx:
              name: go-swagger
              version: v0.33.1
              packages:
                - name: go-swagger
                  purl: pkg:golang/github.com/go-swagger/go-swagger@v0.33.1
                  license: Apache-2.0
            uid: 0
            gid: 0
            mode: "755"
      pipeline:
        - name: generate-swagger
          runs: |
            set -eux -o pipefail

            /usr/local/bin/swagger generate server \
              --template-dir=tools/swagger/templates \
              --exclude-main \
              --additional-initialism=CVE \
              --additional-initialism=GC \
              --additional-initialism=OIDC \
              -f api/v2.0/swagger.yaml \
              -A harbor \
              --target src/server/v2.0
        - name: patch vulnerable go dependencies (2.14 only)
          uses: go/bump@v2
          work-dir: /go/src/github.com/goharbor/harbor/src
          with:
            deps:
              - golang.org/x/crypto@v0.52.0
              - golang.org/x/net@v0.55.0
              - github.com/Azure/go-ntlmssp@v0.1.1
              - github.com/go-jose/go-jose/v4@v4.1.4
              - github.com/gorilla/csrf@v1.7.3
              - github.com/klauspost/compress@v1.18.7
              - go.mongodb.org/mongo-driver@v1.17.7
              - go.opentelemetry.io/otel/exporters/otlp/otlptrace/otlptracehttp@v1.45.0
              - helm.sh/helm/v3@v3.20.2
            download: true
        - name: test
          work-dir: /go/src/github.com/goharbor/harbor/src
          privileged: true
          runs: |
            set -eux -o pipefail

            GODEBUG= go test ./core ./core/auth ./core/session \
              -run '^(TestUpdateInitPasswordWithMgr_|TestDefault|TestErrAuth|TestCodec)$' \
              -count=1
        - name: build harbor-core
          uses: go/build@v1
          work-dir: /go/src/github.com/goharbor/harbor/src/core
          with:
            fips: false
            ldflags:
              - -X github.com/goharbor/harbor/src/pkg/version.ReleaseVersion=2.14.4
              - -X github.com/goharbor/harbor/src/pkg/version.GitCommit=79a297f760eb9596c8693727b88c3c568f9c6302
            output: ${target.dir}/usr/bin/harbor-core
        - name: build harbor-core dev
          uses: go/build@v1
          work-dir: /go/src/github.com/goharbor/harbor/src/core
          with:
            fips: false
            ldflags:
              - -X github.com/goharbor/harbor/src/pkg/version.ReleaseVersion=2.14.4
              - -X github.com/goharbor/harbor/src/pkg/version.GitCommit=79a297f760eb9596c8693727b88c3c568f9c6302
            output: ${target.dir}/usr/bin/harbor-core-dev
            strip: false
        - name: stage static assets
          runs: |
            set -eux -o pipefail

            mkdir -p \
              "${target.dir}/usr/share/harbor-core" \
              "${target.dir}/usr/share/harbor-core-dev"
            cp -r src/core/views icons make/migrations "${target.dir}/usr/share/harbor-core/"
            cp -r src/core/views icons make/migrations "${target.dir}/usr/share/harbor-core-dev/"
        - uses: dhi/build-pkg:0
          with:
            description: Harbor Core server
            files:
              - usr/bin/harbor-core
              - usr/share/harbor-core
            license: Apache-2.0
            name: harbor-core-2.14
            rel: 1
            subpackages:
              - files:
                  - path: usr/bin/harbor-core
                    source: usr/bin/harbor-core-dev
                  - path: usr/share/harbor-core
                    source: usr/share/harbor-core-dev
                name: harbor-core-2.14-dev
            url: https://goharbor.io/
            version: 2.14.4
os-release:
  name: Docker Hardened Images (Alpine)
  id: alpine
  version-id: "3.24"
  pretty-name: Docker Hardened Images/Alpine Linux v3.24
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
