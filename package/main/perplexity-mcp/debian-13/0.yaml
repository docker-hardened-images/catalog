image: dhi.io/pkg-perplexity-mcp
variant: runtime
tags:
  - 1.2.0
  - 1.2.0-r0
  - 1.2.0-debian13
  - 1.2.0-r0-debian13
platforms:
  - linux/amd64
  - linux/arm64
dates:
  release: "2026-03-23"
vars:
  COMMIT_SHA: 9f7dd0b1951c7421f930d1af8ff10e92473de0f9
  REL: "0"
  SEMVER_MAJOR_MINOR_VERSION: "1.2"
  SEMVER_MAJOR_VERSION: "1"
  SEMVER_VERSION: 1.2.0
  VERSION: 1.2.0
contents:
  packages:
    - base-files
  builds:
    - name: perplexity-mcp
      work-dir: ${source.dir}/modelcontextprotocol
      caches:
        - path: /root/.npm
      contents:
        repositories:
          - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
        keyring:
          - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
        packages:
          - bash
          - ca-certificates
          - coreutils
          - findutils
          - git
          - libc6
          - libstdc++6
          - mawk
          - nodejs-24
          - node-corepack
          - npm
          - sed
          - yarn-classic
        files:
          - url: git+https://github.com/perplexityai/modelcontextprotocol.git#9f7dd0b1951c7421f930d1af8ff10e92473de0f9
            checksum: 9f7dd0b1951c7421f930d1af8ff10e92473de0f9
            path: ${source.dir}/modelcontextprotocol
            spdx:
              name: perplexity-mcp
              version: 1.2.0
              packages:
                - name: '@perplexity-ai/mcp-server'
                  purl: pkg:npm/%40perplexity-ai/mcp-server@1.2.0
                  license: MIT
            uid: 0
            gid: 0
      pipeline:
        - name: bump dependencies
          uses: npm/bump@v1
          privileged: true
          environment:
            DHI_NO_SFW: "true"
          with:
            bumps: ${source.dir}/patch/npm-bump.json
            npm-root: ${source.dir}/modelcontextprotocol
        - name: install and build
          privileged: true
          runs: |
            set -eux -o pipefail

            npm install --ignore-scripts
            npm run build

            npm prune --omit=dev
            npm pkg delete devDependencies

            mkdir -p "${target.dir}/usr/lib/perplexity-mcp"
            cp -a dist node_modules package.json "${target.dir}/usr/lib/perplexity-mcp/"
        - uses: dhi/build-pkg:0
          with:
            description: Perplexity MCP server (Model Context Protocol server for the Perplexity API)
            files:
              - usr/lib/perplexity-mcp
            formats:
              - deb
            license: MIT
            name: perplexity-mcp
            rel: 0
            url: https://github.com/perplexityai/modelcontextprotocol
            version: 1.2.0
      paths:
        - type: file
          path: ${source.dir}/patch/npm-bump.json
          uid: 0
          gid: 0
          source: package/main/perplexity-mcp/patch/npm-bump.json
os-release:
  name: Docker Hardened Images (Debian)
  id: debian
  version-id: "13"
  version-codename: trixie
  pretty-name: Docker Hardened Images/Debian GNU/Linux 13 (trixie)
