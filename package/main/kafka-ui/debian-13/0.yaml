# syntax=dhi.io/build:2-debian13

image: dhi.io/pkg-kafka-ui
variant: runtime
tags:
  - 0.7.2
  - 0.7.2-r1
  - 0.7.2-debian13
  - 0.7.2-r1-debian13
platforms:
  - linux/amd64
  - linux/arm64
dates:
  release: "2024-04-08"
vars:
  COMMIT_SHA: 83b5a60cc08501b570a0c4d0b4cdfceb1b88d6b7
  MAVEN_REFERENCE: dhi/maven:3.9.16-jdk17-debian13-dev@sha256:6bd511e5ba7a082e6a4299bef7b35b57327a5a67dde8bece3b4f1dfc6ec77776
  NODEJS_VERSION: 24.20.0-0
  PACKAGE_NAME: kafka-ui
  PNPM_VERSION: 8.6.12
  REL: "1"
  SEMVER_MAJOR_MINOR_VERSION: "0.7"
  SEMVER_MAJOR_VERSION: "0"
  SEMVER_VERSION: 0.7.2
  VERSION: 0.7.2
contents:
  packages:
    - base-files
  builds:
    - name: kafka-ui
      uses: dhi.io/maven:3.9.16-jdk17-debian13-dev@sha256:6bd511e5ba7a082e6a4299bef7b35b57327a5a67dde8bece3b4f1dfc6ec77776
      work-dir: ${source.dir}/kafka-ui
      environment:
        MAVEN_ARGS: --batch-mode --no-transfer-progress
      caches:
        - path: /root/.m2/repository
        - path: /root/.npm
      contents:
        packages:
          - bash
          - ca-certificates
          - coreutils
          - curl
          - findutils
          - git
          - nodejs-24=24.20.0-0
          - npm
          - perl
          - sed
          - tar
        files:
          - url: git+https://github.com/provectus/kafka-ui.git#v0.7.2
            checksum: 83b5a60cc08501b570a0c4d0b4cdfceb1b88d6b7
            path: ${source.dir}/kafka-ui
            spdx:
              name: kafka-ui
              version: 0.7.2
              packages:
                - name: kafka-ui
                  purl: pkg:github/provectus/kafka-ui@0.7.2
                  license: Apache-2.0
            uid: 0
            gid: 0
      pipeline:
        - uses: mvn/mirror@v1
        - name: use maven central when mirror credentials are absent
          secrets:
            - id: maven_user
              env: MAVEN_USER
              optional: true
            - id: maven_password
              env: MAVEN_PASSWORD
              optional: true
          runs: |
            set -eux -o pipefail

            if [ -z "${MAVEN_USER:-}" ] || [ -z "${MAVEN_PASSWORD:-}" ]; then
              rm -f /root/.m2/settings.xml
            fi
        - name: prepare pnpm shim for frontend-maven-plugin
          privileged: true
          runs: |
            set -eux -o pipefail

            export NPM_CONFIG_REGISTRY=https://registry.npmjs.org/
            npm install -g --prefix /usr/local pnpm@8.6.12

            mkdir -p ${source.dir}/kafka-ui/kafka-ui-react-app/node/node_modules/pnpm/bin
            ln -sf /usr/bin/node ${source.dir}/kafka-ui/kafka-ui-react-app/node/node
            ln -sf /usr/local/bin/pnpm ${source.dir}/kafka-ui/kafka-ui-react-app/node/pnpm
            ln -sf /usr/local/bin/pnpm ${source.dir}/kafka-ui/kafka-ui-react-app/node/node_modules/pnpm/bin/pnpm.cjs

            for pom in ${source.dir}/kafka-ui/kafka-ui-contract/pom.xml ${source.dir}/kafka-ui/kafka-ui-api/pom.xml; do
              sed -i '
                /<id>install node and pnpm<\/id>/,/<\/execution>/ {
                  /<\/configuration>/ i\
                                    <skip>true<\/skip>
                }
              ' "${pom}"
              grep -q '<skip>true</skip>' "${pom}"
            done
        - name: pin vulnerable dependency versions
          uses: mvn/patch@v1
          with:
            dependencies: ${source.dir}/patch/mvn-dependencies.json
            dependencies-key: dependencyManagement.dependencies
            mvn-root: ${source.dir}/kafka-ui
        - name: rewrite hardcoded commons-lang3 version in kafka-ui-api pom
          runs: |
            set -eux -o pipefail

            perl -i -0777 -pe 's|(<groupId>org\.apache\.commons</groupId>\s*<artifactId>commons-lang3</artifactId>\s*<version>)3\.12\.0(</version>)|${1}3.18.0${2}|' kafka-ui-api/pom.xml
            grep -A 3 '<artifactId>commons-lang3</artifactId>' kafka-ui-api/pom.xml | grep -q 3.18.0
        - name: rewrite hardcoded aws-msk-iam-auth version in kafka-ui-api pom
          runs: |
            set -eux -o pipefail

            perl -i -0777 -pe 's|(<groupId>software\.amazon\.msk</groupId>\s*<artifactId>aws-msk-iam-auth</artifactId>\s*<version>)1\.1\.7(</version>)|${1}2.3.7${2}|' kafka-ui-api/pom.xml
            grep -A 3 '<artifactId>aws-msk-iam-auth</artifactId>' kafka-ui-api/pom.xml | grep -q 2.3.7
        - name: patch ConsumerGroupService switch for kafka-clients 3.8+ enum values
          runs: |
            set -eux -o pipefail

            SRC=kafka-ui-api/src/main/java/com/provectus/kafka/ui/service/ConsumerGroupService.java
            perl -i -0777 -pe 's|(\n(\s+)case UNKNOWN -> 5;\n)|\n${2}case ASSIGNING -> 6;\n${2}case RECONCILING -> 7;${1}|' "$SRC"
            grep -q 'case ASSIGNING -> 6;' "$SRC"
            grep -q 'case RECONCILING -> 7;' "$SRC"
        - name: patch swagger for kafka-clients 3.7+ enum
          runs: |
            set -eux -o pipefail

            SWAGGER=${source.dir}/kafka-ui/kafka-ui-contract/src/main/resources/swagger/kafka-ui-api.yaml
            if ! grep -q '^        - DYNAMIC_CLIENT_METRICS_CONFIG$' "$SWAGGER"; then
              sed -i '/^    ConfigSource:$/,/^    [A-Z]/ s/^        - UNKNOWN$/        - DYNAMIC_CLIENT_METRICS_CONFIG\n        - UNKNOWN/' "$SWAGGER"
            fi
            grep -q '^        - DYNAMIC_CLIENT_METRICS_CONFIG$' "$SWAGGER"
        - name: prefetch openapi-generator-cli jar
          privileged: true
          secrets:
            - id: maven_user
              env: MAVEN_USER
              optional: true
            - id: maven_password
              env: MAVEN_PASSWORD
              optional: true
          runs: |
            set -eux -o pipefail

            OPENAPI_GEN_VERSION=$(sed -nE 's/.*"version": "([0-9.]+)".*/\1/p' \
              ${source.dir}/kafka-ui/kafka-ui-react-app/openapitools.json | head -n1)
            mkdir -p /openapi-jars

            JAR_PATH="org/openapitools/openapi-generator-cli/${OPENAPI_GEN_VERSION}/openapi-generator-cli-${OPENAPI_GEN_VERSION}.jar"

            if [ -n "${MAVEN_USER:-}" ] && [ -n "${MAVEN_PASSWORD:-}" ]; then
              curl -fsSL -u "${MAVEN_USER}:${MAVEN_PASSWORD}" \
                -o "/openapi-jars/${OPENAPI_GEN_VERSION}.jar" \
                "https://dl.cloudsmith.io/basic/docker/dhi-maven-central/maven/${JAR_PATH}"
            else
              curl -fsSL \
                -o "/openapi-jars/${OPENAPI_GEN_VERSION}.jar" \
                "https://maven-central.storage-download.googleapis.com/maven2/${JAR_PATH}"
            fi
            test -s "/openapi-jars/${OPENAPI_GEN_VERSION}.jar"

            sed -i 's|"version": "'"${OPENAPI_GEN_VERSION}"'",|"version": "'"${OPENAPI_GEN_VERSION}"'",\n    "storageDir": "/openapi-jars",|' \
              ${source.dir}/kafka-ui/kafka-ui-react-app/openapitools.json
            grep -q '"storageDir": "/openapi-jars"' \
              ${source.dir}/kafka-ui/kafka-ui-react-app/openapitools.json
        - name: build
          privileged: true
          secrets:
            - id: maven_user
              env: MAVEN_USER
              optional: true
            - id: maven_password
              env: MAVEN_PASSWORD
              optional: true
          runs: |
            set -eux -o pipefail

            export NPM_CONFIG_REGISTRY=https://registry.npmjs.org/

            MVN_OVERRIDES="-Dspring-boot.version=3.5.16 -Dnetty.version=4.1.137.Final -Dkafka-clients.version=3.9.2 -Djackson.version=2.21.5 -Dlog4j2.version=2.25.5 -Davro.version=1.11.4 -Dorg.json.version=20231013 -Dprotobuf-java.version=3.25.5 -Dsnakeyaml.version=2.4"

            mvn -B -V -ntp $MVN_OVERRIDES versions:set -DnewVersion=0.7.2 -DgenerateBackupPoms=false -q
            mvn -B -V -ntp $MVN_OVERRIDES -Pprod -DskipTests -Ddocker.skip=true -Dmaven.javadoc.skip=true clean package
        - name: install kafka-ui-api jar
          runs: |
            set -eux -o pipefail

            install -D -m 0644 \
              "${source.dir}/kafka-ui/kafka-ui-api/target/kafka-ui-api-0.7.2.jar" \
              "${target.dir}/usr/share/kafka-ui/kafka-ui-api.jar"
        - name: java sbom
          uses: sbom@v1
          with:
            extra-scanners: java-archive-cataloger
            prefix: kafka-ui
            source: ${target.dir}/usr/share/kafka-ui
        - uses: dhi/build-pkg:0
          privileged: true
          with:
            depends:
              - eclipse-temurin-17-jre
            description: Web UI for Apache Kafka
            files:
              - usr/share/kafka-ui
            license: Apache-2.0
            name: kafka-ui
            rel: 1
            url: https://github.com/provectus/kafka-ui
            version: 0.7.2
      paths:
        - type: file
          path: ${source.dir}/patch/mvn-dependencies.json
          uid: 0
          gid: 0
          source: package/main/kafka-ui/debian-13/patch/mvn-dependencies.json
os-release:
  name: Docker Hardened Images (Debian)
  id: debian
  version-id: "13"
  version-codename: trixie
  pretty-name: Docker Hardened Images/Debian GNU/Linux 13 (trixie)
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
