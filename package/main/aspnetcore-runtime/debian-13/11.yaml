image: dhi.io/pkg-aspnetcore-runtime
variant: runtime
tags:
  - 11.0.0
  - 11.0.0-r0
  - 11.0.0-debian13
  - 11.0.0-r0-debian13
platforms:
  - linux/amd64
  - linux/arm64
dates:
  release: "2026-11-10"
  end-of-life: "2028-11-14"
vars:
  ARCH: '#{ target.arch == "amd64" ? "x64" : "arm64" }'
  PACKAGE_NAME: aspnetcore-runtime-11
  REL: "0"
  SEMVER_MAJOR_MINOR_VERSION: "11.0"
  SEMVER_MAJOR_VERSION: "11"
  SEMVER_VERSION: 11.0.0
  SHA512: '#{ target.arch == "amd64" ? "4f94d65a7c534b82d25153e1c740d1a87d9bcbc9187935d69fb14f9dde5fb284e69302bde3fe2818ff96e9ac0c62d4385aaa68d8f6f3cb6002aa39c859a252f3" : "11a625c5a16627cfb301795670f3ee21deb40b0d1f16aca401251b3b5ab10205cb5ef84cdaa2725a4e6a9a627ecb9ee582318b76081503975fedab884ef7ea48" }'
  SHA512_ARM64: 11a625c5a16627cfb301795670f3ee21deb40b0d1f16aca401251b3b5ab10205cb5ef84cdaa2725a4e6a9a627ecb9ee582318b76081503975fedab884ef7ea48
  SHA512_X64: 4f94d65a7c534b82d25153e1c740d1a87d9bcbc9187935d69fb14f9dde5fb284e69302bde3fe2818ff96e9ac0c62d4385aaa68d8f6f3cb6002aa39c859a252f3
  VERSION: 11.0.0
contents:
  repositories:
    - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
  keyring:
    - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
  packages:
    - base-files
  builds:
    - name: aspnetcore-runtime-11
      work-dir: ${source.dir}
      contents:
        packages:
          - bash
          - coreutils
          - gzip
          - tar
        files:
          - url: https://builds.dotnet.microsoft.com/dotnet/aspnetcore/Runtime/11.0.0/aspnetcore-runtime-11.0.0-linux-${ARCH}.tar.gz
            path: ${source.dir}/aspnetcore-runtime.tar.gz
            spdx:
              name: aspnetcore-runtime
              version: 11.0.0
              packages:
                - name: aspnetcore-runtime
                  purl: pkg:dhi/microsoft/aspnetcore-runtime@11.0.0
                  license: MIT
                - name: microsoft.aspnetcore.app.runtime.linux-${ARCH}
                  purl: pkg:nuget/microsoft.aspnetcore.app.runtime.linux-${ARCH}@11.0.0
                  license: MIT
            uid: 0
            gid: 0
      pipeline:
        - name: verify
          runs: |
            set -eux -o pipefail

            echo "${SHA512}  ${source.dir}/aspnetcore-runtime.tar.gz" | sha512sum -c -
        - name: stage
          runs: |
            set -eux -o pipefail

            dest="${target.dir}/usr/lib/dotnet"
            mkdir -p "${dest}"
            tar -xzf "${source.dir}/aspnetcore-runtime.tar.gz" -C "${dest}" --no-same-owner ./shared/Microsoft.AspNetCore.App

            test "$(ls "${dest}/shared/Microsoft.AspNetCore.App")" = "11.0.0"
            test -f "${dest}/shared/Microsoft.AspNetCore.App/11.0.0/Microsoft.AspNetCore.App.deps.json"

            install -d "${target.dir}/opt/docker/sbom"
            cp -a /opt/docker/sbom/aspnetcore-runtime "${target.dir}/opt/docker/sbom/"
        - uses: dhi/build-pkg:0
          with:
            deb:
              depends:
                - dotnet-runtime-11 >= 11.0.0
            description: ASP.NET Core 11 shared framework
            files:
              - usr/lib/dotnet/shared/Microsoft.AspNetCore.App
              - opt/docker/sbom/aspnetcore-runtime
            formats:
              - deb
            license: MIT
            name: aspnetcore-runtime-11
            rel: 0
            url: https://dotnet.microsoft.com/en-us/apps/aspnet
            version: 11.0.0
os-release:
  name: Docker Hardened Images (Debian)
  id: debian
  version-id: "13"
  version-codename: trixie
  pretty-name: Docker Hardened Images/Debian GNU/Linux 13 (trixie)
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
