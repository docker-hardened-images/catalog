  VERSION: 8.0.34
contents:
  repositories:
    - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
  keyring:
    - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
  packages:
    - base-files
  builds:
    - name: aspnetcore-runtime-8
      work-dir: ${source.dir}
      contents:
        packages:
          - bash
          - coreutils
          - gzip
          - tar
        files:
          - url: https://builds.dotnet.microsoft.com/dotnet/aspnetcore/Runtime/8.0.34/aspnetcore-runtime-8.0.34-linux-${ARCH}.tar.gz
            path: ${source.dir}/aspnetcore-runtime.tar.gz
            spdx:
              name: aspnetcore-runtime
              version: 8.0.34
              packages:
                - name: aspnetcore-runtime
                  purl: pkg:dhi/microsoft/aspnetcore-runtime@8.0.34
                  license: MIT
                - name: microsoft.aspnetcore.app.runtime.linux-${ARCH}
                  purl: pkg:nuget/microsoft.aspnetcore.app.runtime.linux-${ARCH}@8.0.34
                  license: MIT
            uid: 0
            gid: 0
      pipeline:
        - name: verify
          runs: |
            set -eux -o pipefail

            echo "${SHA512}  ${source.dir}/aspnetcore-runtime.tar.gz" | sha512sum -c -
        - name: stage
          runs: |
            set -eux -o pipefail

            dest="${target.dir}/usr/lib/dotnet"
            mkdir -p "${dest}"
            tar -xzf "${source.dir}/aspnetcore-runtime.tar.gz" -C "${dest}" --no-same-owner ./shared/Microsoft.AspNetCore.App

            test "$(ls "${dest}/shared/Microsoft.AspNetCore.App")" = "8.0.34"
            test -f "${dest}/shared/Microsoft.AspNetCore.App/8.0.34/Microsoft.AspNetCore.App.deps.json"

            install -d "${target.dir}/opt/docker/sbom"
            cp -a /opt/docker/sbom/aspnetcore-runtime "${target.dir}/opt/docker/sbom/"
        - uses: dhi/build-pkg:0
          with:
            deb:
              depends:
                - dotnet-runtime-8 >= 8.0.34
            description: ASP.NET Core 8 shared framework
            files:
              - usr/lib/dotnet/shared/Microsoft.AspNetCore.App
              - opt/docker/sbom/aspnetcore-runtime
            formats:
              - deb
            license: MIT
            name: aspnetcore-runtime-8
            rel: 0
            url: https://dotnet.microsoft.com/en-us/apps/aspnet
            version: 8.0.34
