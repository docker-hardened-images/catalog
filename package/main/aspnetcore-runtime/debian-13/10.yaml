image: dhi.io/pkg-aspnetcore-runtime
variant: runtime
tags:
  - 10.0.15
  - 10.0.15-r0
  - 10.0.15-debian13
  - 10.0.15-r0-debian13
platforms:
  - linux/amd64
  - linux/arm64
dates:
  release: "2025-11-11"
  end-of-life: "2028-11-14"
vars:
  ARCH: '#{ target.arch == "amd64" ? "x64" : "arm64" }'
  PACKAGE_NAME: aspnetcore-runtime-10
  REL: "0"
  SEMVER_MAJOR_MINOR_VERSION: "10.0"
  SEMVER_MAJOR_VERSION: "10"
  SEMVER_VERSION: 10.0.15
  SHA512: '#{ target.arch == "amd64" ? "704751c6d671b720935a18849e8f10cdb6938549e9cf25493050ebc838a95eb5cb1caa9936d2edae3b85c5975778ed926e9b736e3a2582d861411babba3229c3" : "1d82a6822871c0e750d2d3d3b9b27657d24a2083eb999c2f78b39b0cd10862178cb2c6d21f941579cd521baf5738a78d3378e5754c5895a93d7546135eb40ec6" }'
  SHA512_ARM64: 1d82a6822871c0e750d2d3d3b9b27657d24a2083eb999c2f78b39b0cd10862178cb2c6d21f941579cd521baf5738a78d3378e5754c5895a93d7546135eb40ec6
  SHA512_X64: 704751c6d671b720935a18849e8f10cdb6938549e9cf25493050ebc838a95eb5cb1caa9936d2edae3b85c5975778ed926e9b736e3a2582d861411babba3229c3
  VERSION: 10.0.15
contents:
  repositories:
    - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
  keyring:
    - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
  packages:
    - base-files
  builds:
    - name: aspnetcore-runtime-10
      work-dir: ${source.dir}
      contents:
        packages:
          - bash
          - coreutils
          - gzip
          - tar
        files:
          - url: https://builds.dotnet.microsoft.com/dotnet/aspnetcore/Runtime/10.0.15/aspnetcore-runtime-10.0.15-linux-${ARCH}.tar.gz
            path: ${source.dir}/aspnetcore-runtime.tar.gz
            spdx:
              name: aspnetcore-runtime
              version: 10.0.15
              packages:
                - name: aspnetcore-runtime
                  purl: pkg:dhi/microsoft/aspnetcore-runtime@10.0.15
                  license: MIT
                - name: microsoft.aspnetcore.app.runtime.linux-${ARCH}
                  purl: pkg:nuget/microsoft.aspnetcore.app.runtime.linux-${ARCH}@10.0.15
                  license: MIT
            uid: 0
            gid: 0
      pipeline:
        - name: verify
          runs: |
            set -eux -o pipefail

            echo "${SHA512}  ${source.dir}/aspnetcore-runtime.tar.gz" | sha512sum -c -
        - name: stage
          runs: |
            set -eux -o pipefail

            dest="${target.dir}/usr/lib/dotnet"
            mkdir -p "${dest}"
            tar -xzf "${source.dir}/aspnetcore-runtime.tar.gz" -C "${dest}" --no-same-owner ./shared/Microsoft.AspNetCore.App

            test "$(ls "${dest}/shared/Microsoft.AspNetCore.App")" = "10.0.15"
            test -f "${dest}/shared/Microsoft.AspNetCore.App/10.0.15/Microsoft.AspNetCore.App.deps.json"

            install -d "${target.dir}/opt/docker/sbom"
            cp -a /opt/docker/sbom/aspnetcore-runtime "${target.dir}/opt/docker/sbom/"
        - uses: dhi/build-pkg:0
          with:
            deb:
              depends:
                - dotnet-runtime-10 >= 10.0.15
            description: ASP.NET Core 10 shared framework
            files:
              - usr/lib/dotnet/shared/Microsoft.AspNetCore.App
              - opt/docker/sbom/aspnetcore-runtime
            formats:
              - deb
            license: MIT
            name: aspnetcore-runtime-10
            rel: 0
            url: https://dotnet.microsoft.com/en-us/apps/aspnet
            version: 10.0.15
os-release:
  name: Docker Hardened Images (Debian)
  id: debian
  version-id: "13"
  version-codename: trixie
  pretty-name: Docker Hardened Images/Debian GNU/Linux 13 (trixie)
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
