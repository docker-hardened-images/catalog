  VERSION: 9.0.23
contents:
  repositories:
    - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
  keyring:
    - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
  packages:
    - base-files
  builds:
    - name: aspnetcore-runtime-9
      work-dir: ${source.dir}
      contents:
        packages:
          - bash
          - coreutils
          - gzip
          - tar
        files:
          - url: https://builds.dotnet.microsoft.com/dotnet/aspnetcore/Runtime/9.0.23/aspnetcore-runtime-9.0.23-linux-${ARCH}.tar.gz
            path: ${source.dir}/aspnetcore-runtime.tar.gz
            spdx:
              name: aspnetcore-runtime
              version: 9.0.23
              packages:
                - name: aspnetcore-runtime
                  purl: pkg:dhi/microsoft/aspnetcore-runtime@9.0.23
                  license: MIT
                - name: microsoft.aspnetcore.app.runtime.linux-${ARCH}
                  purl: pkg:nuget/microsoft.aspnetcore.app.runtime.linux-${ARCH}@9.0.23
                  license: MIT
            uid: 0
            gid: 0
      pipeline:
        - name: verify
          runs: |
            set -eux -o pipefail

            echo "${SHA512}  ${source.dir}/aspnetcore-runtime.tar.gz" | sha512sum -c -
        - name: stage
          runs: |
            set -eux -o pipefail

            dest="${target.dir}/usr/lib/dotnet"
            mkdir -p "${dest}"
            tar -xzf "${source.dir}/aspnetcore-runtime.tar.gz" -C "${dest}" --no-same-owner ./shared/Microsoft.AspNetCore.App

            test "$(ls "${dest}/shared/Microsoft.AspNetCore.App")" = "9.0.23"
            test -f "${dest}/shared/Microsoft.AspNetCore.App/9.0.23/Microsoft.AspNetCore.App.deps.json"

            install -d "${target.dir}/opt/docker/sbom"
            cp -a /opt/docker/sbom/aspnetcore-runtime "${target.dir}/opt/docker/sbom/"
        - uses: dhi/build-pkg:0
          with:
            deb:
              depends:
                - dotnet-runtime-9 >= 9.0.23
            description: ASP.NET Core 9 shared framework
            files:
              - usr/lib/dotnet/shared/Microsoft.AspNetCore.App
              - opt/docker/sbom/aspnetcore-runtime
            formats:
