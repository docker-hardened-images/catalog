        BAZEL_FLAGS: -c opt --define=grpc_no_ares=true --cxxopt=-std=c++17 --action_env=PATH --override_repository=boringssl=../third_party/boringssl --override_repository=libmysqlclient=../third_party/libmysqlclient --override_repository=org_sqlite=../third_party/org_sqlite --override_repository=postgresql=../third_party/postgresql --override_repository=zlib=../third_party/zlib
