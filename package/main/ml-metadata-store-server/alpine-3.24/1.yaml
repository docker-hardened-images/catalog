        - name: stage payload
          runs: |
            set -eux -o pipefail

            install -D -m 0755 bazel-bin/ml_metadata/metadata_store/metadata_store_server \
              "${target.dir}/usr/bin/metadata_store_server"

            licdir="${target.dir}/usr/share/licenses/ml-metadata-store-server-1"
            install -D -m 0644 LICENSE "${licdir}/LICENSE"
            bash ${source.dir}/bin/check-bazel-graph.sh notices "${licdir}/licenses"

            mkdir -p "${target.dir}/opt/docker/sbom"
            for sbom in ml-metadata-store-server grpc protobuf abseil-cpp re2 glog gflags \
              envoy-data-plane-api cncf-xds googleapis protoc-gen-validate; do
              cp -a "/opt/docker/sbom/${sbom}" "${target.dir}/opt/docker/sbom/"
            done
        - uses: dhi/build-pkg:0
