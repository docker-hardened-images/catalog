                  purl: pkg:github/google/ml-metadata@v1.21.0
                  license: Apache-2.0
            uid: 0
            gid: 0
          - url: https://github.com/bazelbuild/bazel/releases/download/7.7.3/bazel-7.7.3-dist.zip
            checksum: https://github.com/bazelbuild/bazel/releases/download/7.7.3/bazel-7.7.3-dist.zip.sha256
            path: ${source.dir}/bazel-dist.zip
            uid: 0
            gid: 0
      pipeline:
        - name: unpack bazel
          runs: |
            set -eux -o pipefail

            unzip -q ${source.dir}/bazel-dist.zip -d ${source.dir}/bazel-dist
        - name: give the bootstrap bazel its version
          uses: patch@v1
          work-dir: ${source.dir}/bazel-dist
          with:
            options: -p1
            patch: ${source.dir}/patch/bazel-bootstrap-version.patch
        - name: bootstrap bazel
          work-dir: ${source.dir}/bazel-dist
          environment:
            EMBED_LABEL: 7.7.3
            EXTRA_BAZEL_ARGS: --tool_java_runtime_version=local_jdk --java_runtime_version=local_jdk --copt=-D_LARGEFILE64_SOURCE --host_copt=-D_LARGEFILE64_SOURCE
          runs: |
            set -eux -o pipefail

            env -u BAZEL bash ./compile.sh
            install -D -m 0755 output/bazel "${BAZEL}"
            "${BAZEL}" --batch version > /tmp/bazel-version
            grep -qxF 'Build label: 7.7.3' /tmp/bazel-version
        - name: pass verify_server_cert to the mysql connector
          uses: patch@v1
          work-dir: ${source.dir}/ml-metadata
          with:
            options: -p1
            patch: ${source.dir}/patch/mysql-verify-server-cert-default.patch
        - name: build
          privileged: true
          runs: |
            set -eux -o pipefail

            grep -Eq '^7\.' .bazelversion
            command -v python3

            "${BAZEL}" --batch build ${BAZEL_FLAGS} \
              --curses=no --color=no --show_progress_rate_limit=60 \
              //ml_metadata/metadata_store:metadata_store_server 2>&1 | tee /tmp/bazel-build.log

            if grep -F 'canonical reproducible form' /tmp/bazel-build.log; then
              exit 1
            fi
        - name: check bazel graph and pins
          runs: |
            set -eux -o pipefail

            check=${source.dir}/bin/check-bazel-graph.sh
            bash "${check}" graph ${source.dir}/expected-repos.txt

            bash "${check}" pin com_github_grpc_grpc c4e85806a3a23fd2a78a9f8505771ff60b2beef38305167d50f5e8151728e426 grpc/archive/refs/tags/v1.70.1.tar.gz -
            bash "${check}" pin com_google_protobuf c3a0a9ece8932e31c3b736e2db18b1c42e7070cd9b881388b26d01aa71e24ca2 protobuf/archive/refs/tags/v31.1.tar.gz -
            bash "${check}" pin com_google_absl fd5062972ac6c5575bc8fb6fb1cd6e7c563730be96be4c17b8dcca74a9c5892d abseil-cpp/archive/9ac7062b1860d895fb5a8cbf58c3e9ef8f674b5f.tar.gz -
            bash "${check}" pin abseil-cpp d8ae9aa794a571ee39c77085ee69f1d4ac276212a7d99734974d95df7baa8d13 abseil-cpp/archive/9ac7062b1860d895fb5a8cbf58c3e9ef8f674b5f.zip protobuf_deps
            bash "${check}" pin com_googlesource_code_re2 ef516fb84824a597c4d5d0d6d330daedb18363b5a99eda87d027e6bdd9cba299 re2/archive/03da4fc0857c285e3a26782f6bc8931c4c950df4.tar.gz -
            bash "${check}" pin com_google_glog 6281aa4eeecb9e932d7091f99872e7b26fa6aacece49c15ce5b14af2b7ec050f glog/archive/96a2f23dca4cc7180821ca5f32e526314395d26a.zip -
            bash "${check}" pin com_github_gflags_gflags 017e0a91531bfc45be9eaf07e4d8fed33c488b90b58509dbd2e33a33b2648ae6 gflags/archive/a738fdf9338412f83ab3f26f31ac11ed3f3ec4bd.zip -
            bash "${check}" pin envoy_api aed4389a9cf7777df7811185770dca7352f19a2fd68a41ae04e47071dada31eb data-plane-api/archive/88a37373e3cb5e1ab09e75dfb302b083168e6654.tar.gz grpc_deps
            bash "${check}" pin com_github_cncf_xds dc305e20c9fa80822322271b50aa2ffa917bf4fd3973bcec52bfc28dc32c5927 xds/archive/3a472e524827f72d1ad621c4983dd5af54c46776.tar.gz grpc_deps
            bash "${check}" pin com_google_googleapis 0513f0f40af63bd05dc789cacc334ab6cec27cc89db596557cb2dfe8919463e4 googleapis/archive/fe8ba054ad4f7eca946c2d14a63c3f07c0b586a0.tar.gz grpc_deps
            bash "${check}" pin com_envoyproxy_protoc_gen_validate 92e29c2150675ce954c965bcaa559ca944704b75711533cfe03ce541dcf5a1dd protoc-gen-validate/archive/refs/tags/v1.0.4.tar.gz -

            bash "${check}" contains abseil-cpp/absl/base/config.h "#define ABSL_LTS_RELEASE_VERSION 20250127"
            bash "${check}" contains com_google_absl/absl/base/config.h "#define ABSL_LTS_RELEASE_VERSION 20250127"
            bash "${check}" contains com_envoyproxy_protoc_gen_validate/validate/BUILD "@com_google_protobuf//bazel:py_proto_library.bzl"

            strings -a bazel-bin/ml_metadata/metadata_store/metadata_store_server > /tmp/server-strings
            grep -qxF '45.0.0' /tmp/server-strings
