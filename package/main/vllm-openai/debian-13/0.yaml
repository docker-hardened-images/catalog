# syntax=dhi.io/build:2-debian13

name: vLLM OpenAI 0.29.x CUDA 13.0
image: dhi.io/pkg-vllm-openai
variant: runtime
tags:
  - vllm-openai-0.29-cuda13.0-python3.12-0.29.0
  - vllm-openai-0.29-cuda13.0-python3.12-0.29.0-r3
platforms:
  - linux/amd64
  - linux/arm64
dates:
  release: "2026-09-09"
vars:
  _CUDA_VERSION: 13.0.3
  _PYTHON_MINOR: "3.12"
  _PYTORCH_VERSION: 2.13.0
  _TORCHAUDIO_VERSION: 2.11.0
  _TORCHVISION_VERSION: 0.28.0
  ARCH: '#{ target.arch == "amd64" ? "x86_64" : "aarch64" }'
  COMMIT_SHA: 98dff2a81d747d1dba01a47f939f48c3526d4206
  CUDA_MAJOR_MINOR_VERSION: "13.0"
  CUDA_VERSION: 13.0.3
  PACKAGE_NAME: vllm-openai-0.29-cuda13.0-python3.12
  PYTHON_MINOR: "3.12"
  PYTHON_VERSION: 3.12.14-1
  PYTORCH_MAJOR_MINOR_VERSION: "2.13"
  PYTORCH_PACKAGE_NAME: pytorch-2.13-cuda13.0-python3.12
  PYTORCH_PACKAGE_VERSION: 2.13.0-1
  PYTORCH_VERSION: 2.13.0
  REL: "3"
  SEMVER_MAJOR_MINOR_VERSION: "0.29"
  SEMVER_MAJOR_VERSION: "0"
  SEMVER_VERSION: 0.29.0
  TORCHAUDIO_VERSION: 2.11.0
  TORCHVISION_VERSION: 0.28.0
  UV_VERSION: 0.12.16
  VERSION: 0.29.0
contents:
  packages:
    - base-files
  builds:
    - name: vllm-openai build
      work-dir: ${source.dir}/vllm-src
      environment:
        UV_HTTP_TIMEOUT: "500"
        UV_INDEX_STRATEGY: unsafe-best-match
        UV_LINK_MODE: copy
        VLLM_TARGET_DEVICE: cuda
      caches:
        - path: /root/.cache/uv
      contents:
        repositories:
          - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
        keyring:
          - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
        packages:
          - bash
          - build-essential
          - ca-certificates
          - coreutils
          - findutils
          - gawk
          - gzip
          - libffi8
          - libpython-3.12-dev=3.12.14-1
          - libpython-3.12-minimal=3.12.14-1
          - libpython-3.12-stdlib=3.12.14-1
          - libpython-3.12=3.12.14-1
          - python-3.12-dev=3.12.14-1
          - python-3.12-minimal=3.12.14-1
          - python-3.12=3.12.14-1
          - pytorch-2.13-cuda13.0-python3.12=2.13.0-1
          - sed
          - tar
        files:
          - url: https://github.com/astral-sh/uv/releases/download/0.12.16/uv-${ARCH}-unknown-linux-gnu.tar.gz
            checksum: https://github.com/astral-sh/uv/releases/download/0.12.16/uv-${ARCH}-unknown-linux-gnu.tar.gz.sha256
            path: ${source.dir}/uv-unknown-linux-gnu.tar.gz
            uid: 0
            gid: 0
          - url: git+https://github.com/vllm-project/vllm.git#v0.29.0
            checksum: 98dff2a81d747d1dba01a47f939f48c3526d4206
            path: ${source.dir}/vllm-src
            spdx:
              name: vllm
              version: 0.29.0
              packages:
                - name: vllm
                  purl: pkg:pypi/vllm@0.29.0
                  license: Apache-2.0
            uid: 0
            gid: 0
      pipeline:
        - name: setup uv
          work-dir: ${source.dir}
          runs: |
            set -eux -o pipefail

            mkdir -p /usr/local/bin
            tar -xzf uv-unknown-linux-gnu.tar.gz -C /usr/local/bin --strip-components=1
            test -x /usr/local/bin/uv
        - name: prepare vllm requirements
          runs: |
            set -eux -o pipefail

            cp requirements/common.txt "${source.dir}/requirements-common.txt"
            sed -E \
              -e '/^-r common\.txt$/d' \
              -e '/^[[:space:]]*(torch|torchaudio|torchvision)[[:space:]]*==/Id' \
              requirements/cuda.txt > "${source.dir}/requirements-cuda.txt"
            cat > "${source.dir}/requirements-excludes.txt" << 'EOF'
            torch
            torchaudio
            torchvision
            EOF
        - name: build vllm environment
          privileged: true
          runs: |
            set -eux -o pipefail

            VENV="${target.dir}/usr/lib/vllm-openai"
            uv venv --system-site-packages --python "/usr/bin/python3.12" "${VENV}"
            uv pip install --python "${VENV}/bin/python" \
              -r "${source.dir}/requirements-common.txt" \
              -r "${source.dir}/requirements-cuda.txt" \
              --excludes "${source.dir}/requirements-excludes.txt" \
              --extra-index-url https://flashinfer.ai/whl/
            uv pip install --python "${VENV}/bin/python" \
              accelerate \
              "modelscope<1.38" \
              "runai-model-streamer[s3,gcs,azure]>=0.15.7" \
              "timm>=1.0.17" \
              --excludes "${source.dir}/requirements-excludes.txt"
            uv pip install --python "${VENV}/bin/python" --no-deps "vllm==0.29.0"
        - name: verify vllm dependency contract
          work-dir: ${source.dir}
          runs: |
            set -eux -o pipefail

            VENV="${target.dir}/usr/lib/vllm-openai"
            EXPECTED_VLLM_VERSION="0.29.0" \
              EXPECTED_PYTORCH_VERSION="2.13.0" \
              EXPECTED_CUDA_VERSION="13.0.3" \
              "${VENV}/bin/python" - << 'PY'
            import os

            import torch
            import torchaudio
            import torchvision
            import vllm

            expected_cuda = ".".join(os.environ["EXPECTED_CUDA_VERSION"].split(".")[:2])
            assert vllm.__version__ == os.environ["EXPECTED_VLLM_VERSION"]
            assert torch.__version__.split("+", 1)[0] == os.environ["EXPECTED_PYTORCH_VERSION"]
            assert torch.version.cuda == expected_cuda, (torch.version.cuda, expected_cuda)
            assert torch.cuda._is_compiled()
            assert torchaudio.__version__.split("+", 1)[0] == "2.11.0"
            assert torchvision.__version__.split("+", 1)[0] == "0.28.0"
            PY
        - name: clean and stage vllm environment
          runs: |
            set -eux -o pipefail

            VENV="${target.dir}/usr/lib/vllm-openai"
            find "${VENV}" \( -type d -a \( -name __pycache__ -o -name test -o -name tests \) \) -prune -exec rm -rf '{}' + || true
            find "${VENV}" -type f \( -name '*.pyc' -o -name '*.pyo' \) -delete || true
            rm -rf \
              "${VENV}/lib/python3.12/site-packages/benchmarks" \
              "${VENV}/lib/python3.12/site-packages/samples"
            VLLM_PACKAGE_DIR="${VENV}/lib/python3.12/site-packages/vllm"
            GLOB_SAFE_DIR="${VLLM_PACKAGE_DIR}/.dhi-glob-safe"
            mkdir -p "${GLOB_SAFE_DIR}"
            find "${VLLM_PACKAGE_DIR}" -type f -print0 \
              | while IFS= read -r -d '' file; do
                case "$file" in
                  *'['* | *']'* | *'{'* | *'}'*)
                    relative="${file#${VLLM_PACKAGE_DIR}/}"
                    digest="$(printf '%s' "$relative" | sha256sum)"
                    digest="${digest%% *}"
                    mv "$file" "${GLOB_SAFE_DIR}/${digest}"
                    ln -s "/usr/lib/vllm-openai/lib/python3.12/site-packages/vllm/.dhi-glob-safe/${digest}" "$file"
                    ;;
                esac
              done
            for f in "${VENV}/bin"/*; do
              [ -f "$f" ] || continue
              read -r line < "$f" || true
              case "$line" in
                "#!${target.dir}"*) sed -i "1s|#!${target.dir}|#!|" "$f" ;;
              esac
            done
            mkdir -p "${target.dir}/usr/bin"
            test -e "${VENV}/bin/vllm"
            ln -sf ../lib/vllm-openai/bin/vllm "${target.dir}/usr/bin/vllm"
        - uses: dhi/build-pkg:0
          with:
            depends:
              - ffmpeg
              - gcc
              - libc-bin
              - libffi8
              - libgl1
              - libibverbs-dev
              - libnuma-dev
              - libsm6
              - libxext6
              - numactl
              - python-3.12
              - pytorch-2.13-cuda13.0-python3.12=2.13.0-1
            description: High-throughput LLM serving with an OpenAI-compatible API
            files:
              - usr/bin/vllm
              - usr/lib/vllm-openai
            formats:
              - deb
            license: Apache-2.0
            name: vllm-openai-0.29-cuda13.0-python3.12
            rel: 3
            url: https://docs.vllm.ai/
            version: 0.29.0
os-release:
  name: Docker Hardened Images (Debian)
  id: debian
  version-id: "13"
  version-codename: trixie
  pretty-name: Docker Hardened Images/Debian GNU/Linux 13 (trixie)
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
