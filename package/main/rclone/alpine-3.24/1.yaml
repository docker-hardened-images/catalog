# syntax=dhi.io/build:2-alpine3.24

image: dhi.io/pkg-rclone
variant: runtime
tags:
  - 1.76.0-alpine3.24
  - 1.76.0-r1-alpine3.24
platforms:
  - linux/amd64
  - linux/arm64
vars:
  COMMIT_SHA: e982ff36668f5130d94b4f70409babb3d964df42
  GOLANG_MAJOR_MINOR_VERSION: "1.26"
  GOLANG_VERSION: 1.26.11-r0
  PACKAGE_NAME: rclone-1
  REL: "1"
  SEMVER_MAJOR_MINOR_VERSION: "1.76"
  SEMVER_MAJOR_VERSION: "1"
  SEMVER_VERSION: 1.76.0
  VERSION: 1.76.0
contents:
  repositories:
    - https://dhi.io/apk/alpine/v3.24/main
    - https://dhi.io/apk/alpine/v3.23/main
    - https://dl-cdn.alpinelinux.org/alpine/v3.24/main
    - https://dl-cdn.alpinelinux.org/alpine/v3.24/community
  keyring:
    - https://dhi.io/keyring/dhi-apk@docker-0F81AD7700D99184.rsa.pub
  packages:
    - alpine-baselayout-data
  builds:
    - name: rclone-1
      work-dir: /go/src/github.com/rclone/rclone
      contents:
        packages:
          - busybox
          - bash
          - ca-certificates-bundle
          - diffutils
          - golang-1.26=1.26.11-r0
          - golang-1.26-oci-config=1.26.11-r0
          - rsync
        files:
          - url: git+https://github.com/rclone/rclone.git#v1.76.0
            checksum: e982ff36668f5130d94b4f70409babb3d964df42
            path: /go/src/github.com/rclone/rclone
            spdx:
              name: rclone
              version: 1.76.0
              packages:
                - name: rclone
                  purl: pkg:golang/github.com/rclone/rclone@1.76.0
                  license: MIT
            uid: 0
            gid: 0
      pipeline:
        - name: update go dependencies
          uses: go/bump@v2
          with:
            deps:
              - golang.org/x/net@v0.62.0
              - github.com/andybalholm/brotli@v1.2.7
        - uses: go/hermetic@v1
        - name: fetch module graph
          privileged: true
          runs: |
            set -eux -o pipefail

            go list -m all > /dev/null
        - name: test
          runs: |
            set -eux -o pipefail

            export CGO_ENABLED=0
            export GODEBUG=
            if [ "false" = "true" ]; then
              export GOFIPS140=v1.0.0
              export GODEBUG=fips140=on
            fi

            pkgs=$(go list -tags noselfupdate ./... | grep -v -x -e github.com/rclone/rclone/cmd/mount -e github.com/rclone/rclone/cmd/mount2)

            RCLONE_CONFIG=/notfound CI=true go test -tags noselfupdate -count=1 -timeout 20m \
              -skip '^TestEndToEnd(Migration|RepoLayoutCompat)?$|^TestSorterExtTempFileError$|^TestWriteFileHandleReadonly$|^TestAddPlugin$|^TestRemovePlugin$|^TestConfigFileSave$/^FailsIfNot|^TestCache$/^symlink$|^TestPathRewriterHandleStability$/^symlink$' \
              $pkgs
        - name: build
          uses: go/build@v1
          with:
            fips: false
            ldflags:
              - -s
              - -X github.com/rclone/rclone/fs.Version=v1.76.0
            output: ${target.dir}/usr/bin/rclone
            tags: noselfupdate
        - name: build dev
          uses: go/build@v1
          with:
            fips: false
            ldflags:
              - -X github.com/rclone/rclone/fs.Version=v1.76.0
            output: ${target.dir}/usr/bin/rclone-dev
            strip: false
            tags: noselfupdate
        - uses: dhi/build-pkg:0
          with:
            description: Sync files and directories to and from cloud storage
            files:
              - usr/bin/rclone
            license: MIT
            name: rclone-1
            rel: 1
            subpackages:
              - files:
                  - path: usr/bin/rclone
                    source: usr/bin/rclone-dev
                name: rclone-1-dev
            url: https://github.com/rclone/rclone
            version: 1.76.0
os-release:
  name: Docker Hardened Images (Alpine)
  id: alpine
  version-id: "3.24"
  pretty-name: Docker Hardened Images/Alpine Linux v3.24
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
