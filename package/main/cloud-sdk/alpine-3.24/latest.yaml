# syntax=dhi.io/build:2-alpine3.24

image: dhi.io/pkg-cloud-sdk
variant: runtime
tags:
  - 579.0.0-alpine3.24
  - 579.0.0-r1-alpine3.24
platforms:
  - linux/amd64
  - linux/arm64
dates:
  release: "2026-07-24"
vars:
  GCLOUD_ARCH: '#{ target.arch == "amd64" ? "x86_64" : "arm" }'
  GCLOUD_SHA256: '#{ target.arch == "amd64" ? "a9a7fbe51cda37cf6142b1bbcff12227550e60a6c67e8cf84644fb301371c4de" : "edc914b75f8c5d50e1efc78b849d6fa636c4412346784c148c4130f5dc3eba00" }'
  GCLOUD_SHA256_AMD64: a9a7fbe51cda37cf6142b1bbcff12227550e60a6c67e8cf84644fb301371c4de
  GCLOUD_SHA256_ARM64: edc914b75f8c5d50e1efc78b849d6fa636c4412346784c148c4130f5dc3eba00
  PYTHON_DEB_VERSION: 3.13.14-4
  PYTHON_VERSION: 3.13.14-r3
  REL: "1"
  SEMVER_MAJOR_MINOR_VERSION: "579.0"
  SEMVER_MAJOR_VERSION: "579"
  SEMVER_VERSION: 579.0.0
  VERSION: 579.0.0
contents:
  repositories:
    - https://dhi.io/apk/alpine/v3.24/main
    - https://dhi.io/apk/alpine/v3.23/main
    - https://dl-cdn.alpinelinux.org/alpine/v3.24/main
    - https://dl-cdn.alpinelinux.org/alpine/v3.24/community
  keyring:
    - https://dhi.io/keyring/dhi-apk@docker-0F81AD7700D99184.rsa.pub
  packages:
    - alpine-baselayout-data
  builds:
    - name: cloud-sdk
      work-dir: /work
      contents:
        packages:
          - bash
          - ca-certificates-bundle
          - coreutils
          - findutils
          - gzip
          - tar
        files:
          - url: https://dl.google.com/dl/cloudsdk/channels/rapid/downloads/google-cloud-cli-579.0.0-linux-${GCLOUD_ARCH}.tar.gz
            checksum: sha256:${GCLOUD_SHA256}
            path: ${source.dir}/google-cloud-cli.tar.gz
            spdx:
              name: google-cloud-cli
              version: 579.0.0
              packages:
                - name: google-cloud-cli
                  purl: pkg:generic/google-cloud-cli@579.0.0
                  license: Apache-2.0
            uid: 0
            gid: 0
      pipeline:
        - name: extract SDK (FHS /usr/lib)
          runs: |
            set -eux -o pipefail

            install -d ${target.dir}/usr/lib
            tar -xzf ${source.dir}/google-cloud-cli.tar.gz -C ${target.dir}/usr/lib
        - name: offline config + symlinks + slim
          runs: |
            set -eux -o pipefail

            SDK=${target.dir}/usr/lib/google-cloud-sdk
            cat > "$SDK/properties" << 'EOF'
            [component_manager]
            disable_update_check = true
            [core]
            disable_usage_reporting = true
            EOF
            install -d ${target.dir}/usr/bin
            for b in gcloud gsutil bq; do
              ln -sf ../lib/google-cloud-sdk/bin/$b ${target.dir}/usr/bin/$b
            done
            rm -rf "$SDK/platform/bundledpythonunix"
            find "$SDK" -name '*.pyc' -delete 2> /dev/null || true
            find "$SDK" -type d -name '__pycache__' -prune -exec rm -rf {} + 2> /dev/null || true
            find "$SDK" -type f \( -name '*requirements*.txt' -o -name 'constraints*.txt' -o -name 'Pipfile' -o -name 'Pipfile.lock' \) -delete 2> /dev/null || true
        - uses: dhi/build-pkg:0
          with:
            depends:
              - python-3.13
              - bash
              - coreutils
              - sed
              - grep
            description: Google Cloud CLI (gcloud, gsutil, bq)
            files:
              - usr/lib/google-cloud-sdk
              - usr/bin/gcloud
              - usr/bin/gsutil
              - usr/bin/bq
            license: Apache-2.0
            name: cloud-sdk
            rel: 1
            url: https://cloud.google.com/sdk
            version: 579.0.0
os-release:
  name: Docker Hardened Images (Alpine)
  id: alpine
  version-id: "3.24"
  pretty-name: Docker Hardened Images/Alpine Linux v3.24
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
