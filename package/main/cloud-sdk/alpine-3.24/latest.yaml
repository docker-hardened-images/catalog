# syntax=dhi.io/build:2-alpine3.24

image: dhi.io/pkg-cloud-sdk
variant: runtime
tags:
  - 594.0.0-alpine3.24
  - 594.0.0-r2-alpine3.24
platforms:
  - linux/amd64
  - linux/arm64
dates:
  release: "2026-07-24"
vars:
  GCLOUD_ARCH: '#{ target.arch == "amd64" ? "x86_64" : "arm" }'
  GCLOUD_SHA256: '#{ target.arch == "amd64" ? "1f7233537c26bba94a3ea3f9085a60396745eaf44b21b8454fc6fdd15bb6fcde" : "e58fb86fff3dfd7101e1ff138f06bd4e338c7bf12a7508a7871985e7ea886275" }'
  GCLOUD_SHA256_AMD64: 1f7233537c26bba94a3ea3f9085a60396745eaf44b21b8454fc6fdd15bb6fcde
  GCLOUD_SHA256_ARM64: e58fb86fff3dfd7101e1ff138f06bd4e338c7bf12a7508a7871985e7ea886275
  PYTHON_DEB_VERSION: 3.13.18-8
  PYTHON_VERSION: 3.13.18-r4
  REL: "2"
  SEMVER_MAJOR_MINOR_VERSION: "594.0"
  SEMVER_MAJOR_VERSION: "594"
  SEMVER_VERSION: 594.0.0
  VERSION: 594.0.0
contents:
  repositories:
    - https://dhi.io/apk/alpine/v3.24/main
    - https://dhi.io/apk/alpine/v3.23/main
    - https://dl-cdn.alpinelinux.org/alpine/v3.24/main
    - https://dl-cdn.alpinelinux.org/alpine/v3.24/community
  keyring:
    - https://dhi.io/keyring/dhi-apk@docker-0F81AD7700D99184.rsa.pub
  packages:
    - alpine-baselayout-data
  builds:
    - name: cloud-sdk
      work-dir: /work
      contents:
        packages:
          - bash
          - ca-certificates-bundle
          - coreutils
          - findutils
          - gzip
          - python-3.13
          - tar
        files:
          - url: https://dl.google.com/dl/cloudsdk/channels/rapid/downloads/google-cloud-cli-594.0.0-linux-${GCLOUD_ARCH}.tar.gz
            checksum: sha256:${GCLOUD_SHA256}
            path: ${source.dir}/google-cloud-cli.tar.gz
            spdx:
              name: google-cloud-cli
              version: 594.0.0
              packages:
                - name: google-cloud-cli
                  purl: pkg:generic/google-cloud-cli@594.0.0
                  license: Apache-2.0
            uid: 0
            gid: 0
      pipeline:
        - name: extract SDK (FHS /usr/lib)
          runs: |
            set -eux -o pipefail

            install -d ${target.dir}/usr/lib
            tar -xzf ${source.dir}/google-cloud-cli.tar.gz -C ${target.dir}/usr/lib
        - name: bump python dependencies
          uses: python/bump@v1
          privileged: true
          with:
            bumps: ${source.dir}/patch/python-bumps.json
            hashes: require
            mode: requirements
            python: /usr/bin/python3.13
            requirements: ${source.dir}/patch/gsutil-requirements.txt
            verify: none
        - name: apply gsutil httplib2 bump
          privileged: true
          runs: |
            set -eux -o pipefail

            GSUTIL=${target.dir}/usr/lib/google-cloud-sdk/platform/gsutil
            export PYTHON_BIN=/usr/bin/python3.13
            bash "${source.dir}/apply-gsutil-python-bump.sh" "$GSUTIL" "${source.dir}/patch/gsutil-requirements.txt"
        - name: offline config + symlinks + slim
          runs: |
            set -eux -o pipefail

            SDK=${target.dir}/usr/lib/google-cloud-sdk
            cat > "$SDK/properties" << 'EOF'
            [component_manager]
            disable_update_check = true
            [core]
            disable_usage_reporting = true
            EOF
            install -d ${target.dir}/usr/bin
            for b in gcloud gsutil bq; do
              ln -sf ../lib/google-cloud-sdk/bin/$b ${target.dir}/usr/bin/$b
            done
            rm -rf "$SDK/platform/bundledpythonunix"
            rm -f "$SDK/bin/gcloud-crc32c"
            find "$SDK" -name '*.pyc' -delete 2> /dev/null || true
            find "$SDK" -type d -name '__pycache__' -prune -exec rm -rf {} + 2> /dev/null || true
            find "$SDK" -type f \( -name '*requirements*.txt' -o -name 'constraints*.txt' -o -name 'Pipfile' -o -name 'Pipfile.lock' \) -delete 2> /dev/null || true
        - uses: dhi/build-pkg:0
          with:
            depends:
              - python-3.13
              - bash
              - coreutils
              - sed
              - grep
            description: Google Cloud CLI (gcloud, gsutil, bq)
            files:
              - usr/lib/google-cloud-sdk
              - usr/bin/gcloud
              - usr/bin/gsutil
              - usr/bin/bq
            license: Apache-2.0
            name: cloud-sdk
            rel: 2
            url: https://cloud.google.com/sdk
            version: 594.0.0
      paths:
        - type: file
          path: ${source.dir}/patch/python-bumps.json
          uid: 0
          gid: 0
          mode: "0644"
          source: package/main/cloud-sdk/patch/python-bumps.json
        - type: file
          path: ${source.dir}/patch/gsutil-requirements.txt
          uid: 0
          gid: 0
          mode: "0644"
          source: package/main/cloud-sdk/patch/gsutil-requirements.txt
        - type: file
          path: ${source.dir}/apply-gsutil-python-bump.sh
          uid: 0
          gid: 0
          mode: "0755"
          source: package/main/cloud-sdk/apply-gsutil-python-bump.sh
os-release:
  name: Docker Hardened Images (Alpine)
  id: alpine
  version-id: "3.24"
  pretty-name: Docker Hardened Images/Alpine Linux v3.24
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
