# syntax=dhi.io/build:2-alpine3.24

image: dhi.io/pkg-cloud-sdk
variant: runtime
tags:
  - 583.0.0-alpine3.24
  - 583.0.0-r0-alpine3.24
platforms:
  - linux/amd64
  - linux/arm64
dates:
  release: "2026-07-24"
vars:
  GCLOUD_ARCH: '#{ target.arch == "amd64" ? "x86_64" : "arm" }'
  GCLOUD_SHA256: '#{ target.arch == "amd64" ? "84c5e4798836bda13aa82c3e84fa1acd0c4e4ca5318f7141052e3a5a26a7cc97" : "8ce6287e01e54b53d2e9618d124b62ac85efe5a093904ae027b17f2057030662" }'
  GCLOUD_SHA256_AMD64: 84c5e4798836bda13aa82c3e84fa1acd0c4e4ca5318f7141052e3a5a26a7cc97
  GCLOUD_SHA256_ARM64: 8ce6287e01e54b53d2e9618d124b62ac85efe5a093904ae027b17f2057030662
  PYTHON_DEB_VERSION: 3.13.15-0
  PYTHON_VERSION: 3.13.15-r1
  REL: "0"
  SEMVER_MAJOR_MINOR_VERSION: "583.0"
  SEMVER_MAJOR_VERSION: "583"
  SEMVER_VERSION: 583.0.0
  VERSION: 583.0.0
contents:
  repositories:
    - https://dhi.io/apk/alpine/v3.24/main
    - https://dhi.io/apk/alpine/v3.23/main
    - https://dl-cdn.alpinelinux.org/alpine/v3.24/main
    - https://dl-cdn.alpinelinux.org/alpine/v3.24/community
  keyring:
    - https://dhi.io/keyring/dhi-apk@docker-0F81AD7700D99184.rsa.pub
  packages:
    - alpine-baselayout-data
  builds:
    - name: cloud-sdk
      work-dir: /work
      contents:
        packages:
          - bash
          - ca-certificates-bundle
          - coreutils
          - findutils
          - gzip
          - tar
        files:
          - url: https://dl.google.com/dl/cloudsdk/channels/rapid/downloads/google-cloud-cli-583.0.0-linux-${GCLOUD_ARCH}.tar.gz
            checksum: sha256:${GCLOUD_SHA256}
            path: ${source.dir}/google-cloud-cli.tar.gz
            spdx:
              name: google-cloud-cli
              version: 583.0.0
              packages:
                - name: google-cloud-cli
                  purl: pkg:generic/google-cloud-cli@583.0.0
                  license: Apache-2.0
            uid: 0
            gid: 0
          - url: https://files.pythonhosted.org/packages/84/f5/ccf58de92d61e3ad921119668f54ed36ca1d0cf5dcc5c1657dfb164fd78b/httplib2-0.32.0.tar.gz
            checksum: sha256:48a0ef30a42db65d8f3399045e1d09ab0ba66e3b9efc360d07f80ea55d286025
            path: ${source.dir}/httplib2-0.32.0.tar.gz
            uid: 0
            gid: 0
      pipeline:
        - name: extract SDK (FHS /usr/lib)
          runs: |
            set -eux -o pipefail

            install -d ${target.dir}/usr/lib
            tar -xzf ${source.dir}/google-cloud-cli.tar.gz -C ${target.dir}/usr/lib
        - name: upgrade gsutil httplib2
          runs: |
            set -eux -o pipefail

            SDK=${target.dir}/usr/lib/google-cloud-sdk
            tar -xzf ${source.dir}/httplib2-0.32.0.tar.gz -C ${source.dir}
            rm -rf "$SDK/platform/gsutil/third_party/httplib2/python3/httplib2"
            cp -a ${source.dir}/httplib2-0.32.0/httplib2 "$SDK/platform/gsutil/third_party/httplib2/python3/httplib2"
            sed -i 's/httplib2==0\.20\.4/httplib2==0.32.0/g' "$SDK/platform/gsutil/setup.py"
            sed -i 's/VERSION = "0\.20\.4"/VERSION = "0.32.0"/' "$SDK/platform/gsutil/third_party/httplib2/setup.py"
        - name: offline config + symlinks + slim
          runs: |
            set -eux -o pipefail

            SDK=${target.dir}/usr/lib/google-cloud-sdk
            cat > "$SDK/properties" << 'EOF'
            [component_manager]
            disable_update_check = true
            [core]
            disable_usage_reporting = true
            EOF
            install -d ${target.dir}/usr/bin
            for b in gcloud gsutil bq; do
              ln -sf ../lib/google-cloud-sdk/bin/$b ${target.dir}/usr/bin/$b
            done
            rm -rf "$SDK/platform/bundledpythonunix"
            rm -f "$SDK/bin/gcloud-crc32c"
            find "$SDK" -name '*.pyc' -delete 2> /dev/null || true
            find "$SDK" -type d -name '__pycache__' -prune -exec rm -rf {} + 2> /dev/null || true
            find "$SDK" -type f \( -name '*requirements*.txt' -o -name 'constraints*.txt' -o -name 'Pipfile' -o -name 'Pipfile.lock' \) -delete 2> /dev/null || true
        - uses: dhi/build-pkg:0
          with:
            depends:
              - python-3.13
              - bash
              - coreutils
              - sed
              - grep
            description: Google Cloud CLI (gcloud, gsutil, bq)
            files:
              - usr/lib/google-cloud-sdk
              - usr/bin/gcloud
              - usr/bin/gsutil
              - usr/bin/bq
            license: Apache-2.0
            name: cloud-sdk
            rel: 0
            url: https://cloud.google.com/sdk
            version: 583.0.0
os-release:
  name: Docker Hardened Images (Alpine)
  id: alpine
  version-id: "3.24"
  pretty-name: Docker Hardened Images/Alpine Linux v3.24
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
