# syntax=dhi.io/build:2-debian13

image: dhi.io/pkg-cp-zookeeper
variant: runtime
tags:
  - 7.6.14
  - 7.6.14-r0
  - 7.6.14-debian13
  - 7.6.14-r0-debian13
platforms:
  - linux/amd64
  - linux/arm64
dates:
  release: "2024-02-07"
vars:
  BUILD_ENTITLEMENT: ""
  COMMIT_SHA: a9306a386b1fe6de3473429c6f0c2e0f127ccddb
  COMMON_DOCKER_COMMIT_SHA: 61ba31c05f9c01db2b3215087c63d18d9b974e97
  COMMON_DOCKER_VERSION: 7.6.14
  JDK_MAJOR_VERSION: "21"
  PACKAGE_NAME: cp-zookeeper-7.6
  REL: "0"
  SEMVER_MAJOR_MINOR_VERSION: "7.6"
  SEMVER_MAJOR_VERSION: "7"
  SEMVER_VERSION: 7.6.14
  VERSION: 7.6.14
contents:
  repositories:
    - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
  keyring:
    - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
  packages:
    - base-files
  builds:
    - name: cp-zookeeper-7.6
      work-dir: ${source.dir}/kafka-images/zookeeper/include/etc/confluent/docker
      contents:
        packages:
          - bash
          - coreutils
        files:
          - url: git+https://github.com/confluentinc/kafka-images.git#v7.6.14
            checksum: a9306a386b1fe6de3473429c6f0c2e0f127ccddb
            path: ${source.dir}/kafka-images
            spdx:
              name: kafka-images
              version: 7.6.14
              packages:
                - name: kafka-images
                  purl: pkg:github/confluentinc/kafka-images@7.6.14
                  license: Apache-2.0
            uid: 0
            gid: 0
          - url: git+https://github.com/confluentinc/common-docker.git#v7.6.14
            checksum: 61ba31c05f9c01db2b3215087c63d18d9b974e97
            path: ${source.dir}/common-docker
            spdx:
              name: common-docker
              version: 7.6.14
              packages:
                - name: common-docker
                  purl: pkg:github/confluentinc/common-docker@7.6.14
                  license: Apache-2.0
            uid: 0
            gid: 0
      pipeline:
        - name: stage confluent launch scripts
          runs: |
            set -eux -o pipefail

            DEST="${target.dir}/etc/confluent/docker"
            mkdir -p "$DEST"

            for f in *; do
              case "$f" in
                configure | ensure | launch | run | *.template) ;;
                *)
                  echo "FATAL: unhandled upstream launch-script file: $f" >&2
                  exit 1
                  ;;
              esac
            done

            for f in configure ensure launch run; do
              install -m 0755 "$f" "$DEST/$f"
            done
            for f in *.template; do
              install -m 0644 "$f" "$DEST/$f"
            done

            install -m 0644 \
              "${source.dir}/common-docker/base/include/etc/confluent/docker/bash-config" \
              "$DEST/bash-config"

            test -f "$DEST/zookeeper.properties.template"

            mkdir -p "${target.dir}/etc/kafka"
            install -m 0644 "${source.dir}/dhi/config/logback.xml" "${target.dir}/etc/kafka/logback.xml"

            install -Dm755 "${source.dir}/dhi/bin/zookeeper-run-class" "${target.dir}/usr/bin/zookeeper-run-class"
            install -Dm755 "${source.dir}/dhi/bin/zookeeper-server-start" "${target.dir}/usr/bin/zookeeper-server-start"
            install -Dm755 "${source.dir}/dhi/bin/zookeeper-shell" "${target.dir}/usr/bin/zookeeper-shell"
        - uses: dhi/build-pkg:0
          with:
            apk:
              depends:
                - busybox
            deb:
              depends:
                - hostname
            depends:
              - bash
              - coreutils
              - confluent-docker-utils
              - eclipse-temurin-21-jre
              - zookeeper-3.8
            description: Confluent Platform ZooKeeper launch scripts, helper commands, and templates for kafka-images 7.6.14
            files:
              - etc/confluent/docker/configure
              - etc/confluent/docker/ensure
              - etc/confluent/docker/launch
              - etc/confluent/docker/run
              - etc/confluent/docker/bash-config
              - etc/confluent/docker/log4j.properties.template
              - etc/confluent/docker/myid.template
              - etc/confluent/docker/tools-log4j.properties.template
              - etc/confluent/docker/zookeeper.properties.template
              - etc/kafka/logback.xml
              - usr/bin/zookeeper-run-class
              - usr/bin/zookeeper-server-start
              - usr/bin/zookeeper-shell
            license: Apache-2.0
            name: cp-zookeeper-7.6
            rel: 0
            url: https://github.com/confluentinc/kafka-images
            version: 7.6.14
      paths:
        - type: file
          path: ${source.dir}/dhi/bin/zookeeper-run-class
          uid: 0
          gid: 0
          source: package/main/cp-zookeeper/bin/zookeeper-run-class
        - type: file
          path: ${source.dir}/dhi/bin/zookeeper-server-start
          uid: 0
          gid: 0
          source: package/main/cp-zookeeper/bin/zookeeper-server-start
        - type: file
          path: ${source.dir}/dhi/bin/zookeeper-shell
          uid: 0
          gid: 0
          source: package/main/cp-zookeeper/bin/zookeeper-shell
        - type: file
          path: ${source.dir}/dhi/config/logback.xml
          uid: 0
          gid: 0
          source: package/main/cp-zookeeper/config/logback.xml
os-release:
  name: Docker Hardened Images (Debian)
  id: debian
  version-id: "13"
  version-codename: trixie
  pretty-name: Docker Hardened Images/Debian GNU/Linux 13 (trixie)
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
