# syntax=dhi.io/build:2-debian13

image: dhi.io/pkg-firecrawl-mcp
variant: runtime
tags:
  - 3.24.1
  - 3.24.1-r14
  - 3.24.1-debian13
  - 3.24.1-r14-debian13
platforms:
  - linux/amd64
  - linux/arm64
vars:
  COMMIT_SHA: fbcd8c70c82a07b26402ee52502ac84f3646d86d
  NODEJS_VERSION: 24.22.2-0
  REL: "14"
  SEMVER_MAJOR_MINOR_VERSION: "3.24"
  SEMVER_MAJOR_VERSION: "3"
  SEMVER_VERSION: 3.24.1
  VERSION: 3.24.1
contents:
  repositories:
    - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
  keyring:
    - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
  packages:
    - base-files
  builds:
    - name: firecrawl-mcp
      work-dir: ${source.dir}/firecrawl-mcp
      environment:
        CI: "true"
        PNPM_HOME: /pnpm
      caches:
        - path: /pnpm/store
      contents:
        repositories:
          - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
        keyring:
          - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
        packages:
          - bash
          - ca-certificates
          - coreutils
          - findutils
          - git
          - libc6
          - libstdc++6
          - mawk
          - nodejs-24=24.22.2-0
          - node-corepack
          - sed
        files:
          - url: git+https://github.com/firecrawl/firecrawl-mcp-server.git#v3.24.1
            checksum: fbcd8c70c82a07b26402ee52502ac84f3646d86d
            path: ${source.dir}/firecrawl-mcp
            spdx:
              name: firecrawl-mcp
              version: 3.24.1
              packages:
                - name: firecrawl-mcp
                  purl: pkg:dhi/firecrawl-mcp@3.24.1
                  license: MIT
            uid: 0
            gid: 0
      pipeline:
        - name: pin vulnerable transitive dependencies
          runs: |
            set -eux -o pipefail

            cd "${source.dir}/firecrawl-mcp"

            node -e '
              const fs = require("fs");
              const p = JSON.parse(fs.readFileSync("package.json", "utf8"));
              p.pnpm = p.pnpm || {};
              Object.assign(p.pnpm.overrides = p.pnpm.overrides || {}, {
                "axios": "1.20.0", // CVE-2026-101898, CVE-2026-101899, CVE-2026-101900, CVE-2026-101901, CVE-2026-101902, CVE-2026-101903, CVE-2026-101904, CVE-2026-101905, CVE-2026-101906, CVE-2026-101907, CVE-2026-101908, CVE-2026-101909
                "file-type": "21.3.2",
                "follow-redirects": "1.16.1", // CVE-2026-111755, CVE-2026-111756
                "@modelcontextprotocol/sdk": "1.32.0", // CVE-2026-104850; CVE-2026-111767, CVE-2026-111768, CVE-2026-111769, CVE-2026-111771
                "form-data": "4.0.6",
                "@hono/node-server": "2.0.10",
                "fast-uri": "3.1.8",       // CVE-2026-18446, CVE-2026-86472
                "hono": "4.13.11",         // CVE-2026-111757, CVE-2026-69207
                "ip-address": "10.7.4",    // CVE-2026-101911, CVE-2026-101912; CVE-2026-101910, CVE-2026-101913; CVE-2026-69192, CVE-2026-54272, CVE-2026-69198; CVE-2026-111997
                "path-to-regexp": "8.4.0", // CVE-2026-4926, CVE-2026-4923
                "proxy-addr": "2.0.8",     // CVE-2026-90711
                "undici": "7.29.1",        // CVE-2026-84890, CVE-2026-84933, CVE-2026-84947, CVE-2026-84961, CVE-2026-85008, CVE-2026-85014, CVE-2026-85024, CVE-2026-18149, CVE-2026-18540, CVE-2026-19534; CVE-2026-13697, CVE-2026-14643, CVE-2026-15157, CVE-2026-16728, CVE-2026-16729
                "qs": "6.16.0",            // CVE-2026-82562, CVE-2026-82417
              });
              fs.writeFileSync("package.json", JSON.stringify(p, null, 2) + "\n");
            '
        - name: install and build
          privileged: true
          environment:
            HTTP_PROXY: ""
            HTTPS_PROXY: ""
            NO_PROXY: '*'
            http_proxy: ""
            https_proxy: ""
            no_proxy: '*'
          runs: |
            set -eux -o pipefail

            cd "${source.dir}/firecrawl-mcp"

            corepack enable
            chmod +x /usr/lib/nodejs/corepack/dist/*.js
            corepack prepare pnpm@10.17.1 --activate

            pnpm config set fetch-retries 5
            pnpm config set fetch-retry-mintimeout 20000
            pnpm config set fetch-retry-maxtimeout 120000
            pnpm config set network-concurrency 1

            pnpm install --no-frozen-lockfile --ignore-scripts
            pnpm run build

            rm -rf node_modules
            pnpm install --no-frozen-lockfile --prod --ignore-scripts

            mkdir -p "${target.dir}/usr/lib/firecrawl-mcp"
            cp -a dist node_modules package.json "${target.dir}/usr/lib/firecrawl-mcp/"
        - name: bundled node_modules sbom
          uses: sbom@v1
          with:
            extra-scanners: javascript-package-cataloger
            prefix: firecrawl-mcp-npm
            source: ${target.dir}/usr/lib/firecrawl-mcp/node_modules
        - uses: dhi/build-pkg:0
          with:
            description: Firecrawl MCP server (Model Context Protocol server for Firecrawl)
            files:
              - usr/lib/firecrawl-mcp
            formats:
              - deb
            license: MIT
            name: firecrawl-mcp
            rel: 14
            url: https://github.com/firecrawl/firecrawl-mcp-server
            version: 3.24.1
os-release:
  name: Docker Hardened Images (Debian)
  id: debian
  version-id: "13"
  version-codename: trixie
  pretty-name: Docker Hardened Images/Debian GNU/Linux 13 (trixie)
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
