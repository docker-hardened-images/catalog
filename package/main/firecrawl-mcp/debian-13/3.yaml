image: dhi.io/pkg-firecrawl-mcp
variant: runtime
tags:
  - 3.36.1
  - 3.36.1-r1
  - 3.36.1-debian13
  - 3.36.1-r1-debian13
platforms:
  - linux/amd64
  - linux/arm64
vars:
  COMMIT_SHA: 6bd077c69a0143f03de93687f5f8bb8477944845
  NODEJS_VERSION: 24.22.2-0
  REL: "1"
  SEMVER_MAJOR_MINOR_VERSION: "3.36"
