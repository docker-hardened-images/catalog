  VERSION: 3.36.1
contents:
  repositories:
    - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
  keyring:
    - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
  packages:
    - base-files
  builds:
    - name: firecrawl-mcp
      work-dir: ${source.dir}/firecrawl-mcp
      environment:
        CI: "true"
        PNPM_HOME: /pnpm
      caches:
        - path: /pnpm/store
      contents:
        repositories:
          - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
        keyring:
          - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
        packages:
          - bash
          - ca-certificates
          - coreutils
          - findutils
          - git
          - grep
          - libc6
          - libstdc++6
          - mawk
          - nodejs-24=24.22.2-0
          - node-corepack
          - sed
        files:
          - url: git+https://github.com/firecrawl/firecrawl-mcp-server.git#v3.36.1
            checksum: 6bd077c69a0143f03de93687f5f8bb8477944845
            path: ${source.dir}/firecrawl-mcp
            spdx:
              name: firecrawl-mcp
              version: 3.36.1
              packages:
                - name: firecrawl-mcp
                  purl: pkg:dhi/firecrawl-mcp@3.36.1
                  license: MIT
            uid: 0
            gid: 0
      pipeline:
        - name: enable corepack pnpm
          privileged: true
          runs: |
            set -eux -o pipefail

            corepack enable
            chmod +x /usr/lib/nodejs/corepack/dist/*.js
            corepack prepare pnpm@10.17.1 --activate

            cd "${source.dir}/firecrawl-mcp"

            pnpm config set fetch-retries 5
            pnpm config set fetch-retry-mintimeout 20000
            pnpm config set fetch-retry-maxtimeout 120000
            pnpm config set network-concurrency 1

            pnpm install --no-frozen-lockfile --ignore-scripts
        - name: bump pnpm dependencies
          uses: pnpm/bump@v1
          privileged: true
          with:
            bumps: ${source.dir}/patch/pnpm-bumps.json
            pnpm-root: ${source.dir}/firecrawl-mcp
        - name: install and build
          privileged: true
          environment:
            HTTP_PROXY: ""
            HTTPS_PROXY: ""
            NO_PROXY: '*'
            http_proxy: ""
            https_proxy: ""
            no_proxy: '*'
          runs: |
            set -eux -o pipefail

            cd "${source.dir}/firecrawl-mcp"

            corepack enable
            chmod +x /usr/lib/nodejs/corepack/dist/*.js
            corepack prepare pnpm@10.17.1 --activate

            pnpm config set fetch-retries 5
            pnpm config set fetch-retry-mintimeout 20000
            pnpm config set fetch-retry-maxtimeout 120000
            pnpm config set network-concurrency 1

            pnpm install --no-frozen-lockfile --ignore-scripts
            pnpm run build

            rm -rf node_modules
            pnpm install --no-frozen-lockfile --prod --ignore-scripts

            mkdir -p "${target.dir}/usr/lib/firecrawl-mcp"
            cp -a dist node_modules package.json "${target.dir}/usr/lib/firecrawl-mcp/"
        - name: bundled node_modules sbom
          uses: sbom@v1
          with:
            extra-scanners: javascript-package-cataloger
            prefix: firecrawl-mcp-npm
            source: ${target.dir}/usr/lib/firecrawl-mcp/node_modules
        - uses: dhi/build-pkg:0
          with:
            description: Firecrawl MCP server (Model Context Protocol server for Firecrawl)
            files:
              - usr/lib/firecrawl-mcp
            formats:
              - deb
            license: MIT
            name: firecrawl-mcp
            rel: 1
            url: https://github.com/firecrawl/firecrawl-mcp-server
            version: 3.36.1
      paths:
        - type: file
          path: ${source.dir}/patch/pnpm-bumps.json
          uid: 0
          gid: 0
          source: package/main/firecrawl-mcp/patch/pnpm-bumps.json
