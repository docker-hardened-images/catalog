# syntax=dhi.io/build:2-debian13

image: dhi.io/pkg-firecrawl-mcp
variant: runtime
tags:
  - 3.2.1
  - 3.2.1-r0
  - 3.2.1-debian13
  - 3.2.1-r0-debian13
platforms:
  - linux/amd64
  - linux/arm64
vars:
  COMMIT_SHA: d22f144eee0754fd819b5b976b32294d8d234ea5
  REL: "0"
  SEMVER_MAJOR_MINOR_VERSION: "3.2"
  SEMVER_MAJOR_VERSION: "3"
  SEMVER_VERSION: 3.2.1
  VERSION: 3.2.1
contents:
  packages:
    - base-files
  builds:
    - name: firecrawl-mcp
      work-dir: ${source.dir}/firecrawl-mcp
      caches:
        - path: /root/.npm
      contents:
        repositories:
          - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
        keyring:
          - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
        packages:
          - bash
          - ca-certificates
          - coreutils
          - findutils
          - git
          - libc6
          - libstdc++6
          - mawk
          - nodejs-24
          - node-corepack
          - npm
          - sed
          - yarn-classic
        files:
          - url: git+https://github.com/firecrawl/firecrawl-mcp-server.git#v3.2.1
            checksum: d22f144eee0754fd819b5b976b32294d8d234ea5
            path: ${source.dir}/firecrawl-mcp
            spdx:
              name: firecrawl-mcp
              version: 3.2.1
              packages:
                - name: firecrawl-mcp
                  purl: pkg:dhi/firecrawl-mcp@3.2.1
                  license: MIT
            uid: 0
            gid: 0
      pipeline:
        - name: bump dependencies
          uses: npm/bump@v1
          privileged: true
          environment:
            DHI_NO_SFW: "true"
          with:
            bumps: ${source.dir}/patch/npm-bump.json
            npm-root: ${source.dir}/firecrawl-mcp
        - name: install and build
          privileged: true
          runs: |
            set -eux -o pipefail

            cd "${source.dir}/firecrawl-mcp"

            npm pkg set "overrides.ip-address"="10.1.1"
            npm install --package-lock-only --ignore-scripts

            npm ci --ignore-scripts
            npm run build
            rm -rf node_modules
            npm ci --omit=dev --ignore-scripts

            sed -i 's|this.#capabilities.logging = {};|this.#capabilities.logging = {};\n\tthis.#capabilities.completions = {};|g' \
              node_modules/firecrawl-fastmcp/dist/FastMCP.js

            mkdir -p "${target.dir}/usr/lib/firecrawl-mcp"
            cp -a dist node_modules package.json "${target.dir}/usr/lib/firecrawl-mcp/"
        - uses: dhi/build-pkg:0
          with:
            description: Firecrawl MCP server (Model Context Protocol server for Firecrawl)
            files:
              - usr/lib/firecrawl-mcp
            formats:
              - deb
            license: MIT
            name: firecrawl-mcp
            rel: 0
            url: https://github.com/firecrawl/firecrawl-mcp-server
            version: 3.2.1
      paths:
        - type: file
          path: ${source.dir}/patch/npm-bump.json
          uid: 0
          gid: 0
          source: package/main/firecrawl-mcp/patch/npm-bump.json
os-release:
  name: Docker Hardened Images (Debian)
  id: debian
  version-id: "13"
  version-codename: trixie
  pretty-name: Docker Hardened Images/Debian GNU/Linux 13 (trixie)
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
