# syntax=dhi.io/build:2-debian13

image: dhi.io/pkg-liquibase
variant: runtime
tags:
  - 5.0.4
  - 5.0.4-r1
  - 5.0.4-debian13
  - 5.0.4-r1-debian13
platforms:
  - linux/amd64
  - linux/arm64
vars:
  COMMIT_SHA: 2c25134e198054c70da3122b6179b64d2279b1c9
  GOLANG_MAJOR_MINOR_VERSION: "1.26"
  GOLANG_VERSION: 1.26.7-1
  JDK_MAJOR_VERSION: "21"
  JDK_VERSION: 21.0.12.8-0
  LICENSE: FSL-1.1-ALv2
  LPM_COMMIT_SHA: c8e7d6862698c7eef8a03fe246b1173e15d0d551
  LPM_VERSION: 0.3.6
  MAVEN_VERSION: 3.9.16
  PACKAGE_NAME: liquibase-5
  REL: "1"
  SEMVER_MAJOR_MINOR_VERSION: "5.0"
  SEMVER_MAJOR_VERSION: "5"
  SEMVER_VERSION: 5.0.4
  VERSION: 5.0.4
contents:
  packages:
    - base-files
  builds:
    - name: liquibase
      work-dir: ${source.dir}/liquibase
      environment:
        JAVA_HOME: /usr/lib/jvm/temurin-21
        MAVEN_HOME: /opt/java/apache-maven-3.9.16
      caches:
        - path: /root/.m2/repository
      contents:
        repositories:
          - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
        keyring:
          - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
        packages:
          - bash
          - ca-certificates
          - coreutils
          - findutils
          - git
          - gzip
          - sed
          - tar
          - eclipse-temurin-21-jdk=21.0.12.8-0
          - golang-1.26=1.26.7-1
          - golang-1.26-oci-config=1.26.7-1
        files:
          - url: git+https://github.com/liquibase/liquibase.git#v5.0.4
            checksum: 2c25134e198054c70da3122b6179b64d2279b1c9
            path: ${source.dir}/liquibase
            spdx:
              name: liquibase
              version: 5.0.4
              packages:
                - name: liquibase
                  purl: pkg:dhi/liquibase@5.0.4
                  license: FSL-1.1-ALv2
            uid: 0
            gid: 0
          - url: git+https://github.com/liquibase/liquibase-package-manager.git#v0.3.6
            checksum: c8e7d6862698c7eef8a03fe246b1173e15d0d551
            path: ${source.dir}/lpm
            spdx:
              name: lpm
              version: 0.3.6
              packages:
                - name: lpm
                  purl: pkg:dhi/liquibase/package-manager@0.3.6
                  license: FSL-1.1-ALv2
            uid: 0
            gid: 0
          - url: https://dlcdn.apache.org/maven/maven-3/3.9.16/binaries/apache-maven-3.9.16-bin.tar.gz
            path: ${source.dir}/maven/apache-maven-3.9.16-bin.tar.gz
            spdx:
              name: maven
              version: 3.9.16
              packages:
                - name: maven
                  purl: pkg:generic/apache-maven@3.9.16
                  license: Apache-2.0
            uid: 0
            gid: 0
      pipeline:
        - name: install maven
          runs: |
            set -eux -o pipefail

            mkdir -p /opt/java
            tar -xzf "${source.dir}/maven/apache-maven-3.9.16-bin.tar.gz" -C /opt/java

            mkdir -p /usr/local/bin
            find "/opt/java/apache-maven-3.9.16/bin" -type f -executable -o -type l | while read -r file; do
              filename=$(basename "$file")
              ln -sf "/opt/java/apache-maven-3.9.16/bin/$filename" "/usr/local/bin/$filename"
            done
        - uses: mvn/mirror@v1
        - name: use maven central when mirror credentials are absent
          secrets:
            - id: maven_user
              env: MAVEN_USER
              optional: true
            - id: maven_password
              env: MAVEN_PASSWORD
              optional: true
          runs: |
            set -eux -o pipefail

            if [ -z "${MAVEN_USER:-}" ] || [ -z "${MAVEN_PASSWORD:-}" ]; then
              rm -f /root/.m2/settings.xml
            fi
        - name: install liquibase distribution
          privileged: true
          secrets:
            - id: maven_user
              env: MAVEN_USER
              optional: true
            - id: maven_password
              env: MAVEN_PASSWORD
              optional: true
          runs: |
            set -eux -o pipefail

            mkdir -p "${target.dir}/usr/share/liquibase"
            cd "${source.dir}/liquibase"

            sed -i -e "s/build.version=.*/build.version=5.0.4/" liquibase-standard/src/main/resources/liquibase.build.properties
            mvn versions:set -DnewVersion="5.0.4"
            mvn -B clean package -DskipTests -Dmaven.javadoc.skip=true
            tar -zxf "liquibase-dist/target/liquibase-5.0.4.tar.gz" -C "${target.dir}/usr/share/liquibase"
        - name: update lpm go dependencies
          uses: go/bump@v1
          work-dir: ${source.dir}/lpm
          with:
            deps: []
            download: true
        - name: build lpm
          work-dir: ${source.dir}/lpm
          runs: |
            set -eux -o pipefail

            echo "0.3.6" > ./internal/app/VERSION
            CGO_ENABLED=0 go build -o "${target.dir}/usr/share/liquibase/lpm" ./cmd/lpm/darwin.go
        - name: install entrypoint
          runs: |
            set -eux -o pipefail

            install -D -m 0755 "${source.dir}/entrypoint.sh" \
              "${target.dir}/usr/share/liquibase/entrypoint.sh"
        - uses: dhi/build-pkg:0
          with:
            depends:
              - bash
              - coreutils
            description: Liquibase database schema change management tool
            files:
              - usr
            formats:
              - deb
            license: FSL-1.1-ALv2
            name: liquibase-5
            rel: 1
            url: https://www.liquibase.com/
            version: 5.0.4
      paths:
        - type: file
          path: ${source.dir}/entrypoint.sh
          uid: 0
          gid: 0
          source: package/main/liquibase/bin/entrypoint.sh
os-release:
  name: Docker Hardened Images (Debian)
  id: debian
  version-id: "13"
  version-codename: trixie
  pretty-name: Docker Hardened Images/Debian GNU/Linux 13 (trixie)
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
