# syntax=dhi.io/build:2-debian13

image: dhi.io/pkg-mlflow
variant: runtime
tags:
  - 3.15.1
  - 3.15.1-r0
  - 3.15.1-debian13
  - 3.15.1-r0-debian13
platforms:
  - linux/amd64
  - linux/arm64
dates:
  release: "2026-06-10"
vars:
  COMMIT_SHA: 9a1c0d9a9827acd23c7a215f0999e4b0f97e9870
  NODEJS_MAJOR: "22"
  NODEJS_VERSION: 22.23.2-0
  PYTHON_MINOR: "3.12"
  PYTHON_VERSION: 3.12.14-0
  REL: "0"
  SEMVER_MAJOR_MINOR_VERSION: "3.15"
  SEMVER_MAJOR_VERSION: "3"
  SEMVER_VERSION: 3.15.1
  VERSION: 3.15.1
contents:
  packages:
    - base-files
  builds:
    - name: mlflow
      work-dir: ${source.dir}
      caches:
        - path: /root/.cache/pip
        - path: /root/.yarn
      contents:
        repositories:
          - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
        keyring:
          - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
        packages:
          - bash
          - build-essential
          - linux-libc-dev
          - ca-certificates
          - coreutils
          - diffutils
          - findutils
          - gawk
          - grep
          - libffi-dev
          - libpq-dev
          - libssl-dev
          - libstdc++6
          - pkg-config
          - sed
          - libpython-3.12-minimal=3.12.14-0
          - libpython-3.12-stdlib=3.12.14-0
          - libpython-3.12=3.12.14-0
          - libpython-3.12-dev=3.12.14-0
          - python-3.12-minimal=3.12.14-0
          - python-3.12=3.12.14-0
          - python-3.12-dev=3.12.14-0
          - python3-pip
          - python3-setuptools
          - python3-venv
          - python3-wheel
          - nodejs-22=22.23.2-0
          - yarn-classic
        files:
          - url: git+https://github.com/mlflow/mlflow.git#v3.15.1
            checksum: 9a1c0d9a9827acd23c7a215f0999e4b0f97e9870
            path: ${source.dir}/mlflow
            spdx:
              name: mlflow
              version: 3.15.1
              packages:
                - name: mlflow
                  purl: pkg:pypi/mlflow@3.15.1
                  license: Apache-2.0
            uid: 0
            gid: 0
      pipeline:
        - name: build venv at final path and stage it
          privileged: true
          runs: |
            set -eux -o pipefail

            export SOURCE_DIR="${source.dir}" TARGET_DIR="${target.dir}" PYTHON_BIN=/usr/bin/python3.12
            bash "${source.dir}/build-mlflow.sh"
        - uses: dhi/build-pkg:0
          with:
            depends:
              - python-3.12
              - libpq5
            description: MLflow machine learning lifecycle platform
            files:
              - usr/lib/mlflow
              - usr/bin/mlflow
            formats:
              - deb
            license: Apache-2.0
            name: mlflow
            rel: 0
            url: https://mlflow.org
            version: 3.15.1
      paths:
        - type: file
          path: ${source.dir}/build-mlflow.sh
          uid: 0
          gid: 0
          mode: "0755"
          source: package/main/mlflow/build-mlflow.sh
os-release:
  name: Docker Hardened Images (Debian)
  id: debian
  version-id: "13"
  version-codename: trixie
  pretty-name: Docker Hardened Images/Debian GNU/Linux 13 (trixie)
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
