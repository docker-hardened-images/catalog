# syntax=dhi.io/build:2-debian13

image: dhi.io/pkg-kong
variant: runtime
tags:
  - 3.9.4
  - 3.9.4-r0
  - 3.9.4-debian13
  - 3.9.4-r0-debian13
platforms:
  - linux/amd64
  - linux/arm64
dates:
  release: "2024-12-12"
vars:
  BAZEL_ARCH: '#{ target.arch == "amd64" ? "x86_64" : "arm64" }'
  BAZEL_VERSION: 7.7.2
  BUILD_ENTITLEMENT: ""
  COMMIT_SHA: ddc85be461165c9eb4506669343aa0d0c627e687
  PACKAGE_NAME: kong-3
  REL: "0"
  SEMVER_MAJOR_MINOR_VERSION: "3.9"
  SEMVER_MAJOR_VERSION: "3"
  SEMVER_VERSION: 3.9.4
  VERSION: 3.9.4
contents:
  repositories:
    - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
  keyring:
    - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
  packages:
    - base-files
  builds:
    - name: kong
      work-dir: ${source.dir}/kong
      contents:
        packages:
          - bash
          - coreutils
          - findutils
          - automake
          - build-essential
          - ca-certificates
          - curl
          - file
          - git
          - gawk
          - grep
          - gzip
          - libyaml-dev
          - libprotobuf-dev
          - m4
          - perl
          - pkg-config
          - procps
          - sed
          - unzip
          - patchelf
          - valgrind
          - zlib1g-dev
        files:
          - url: git+https://github.com/Kong/kong.git#3.9.4
            checksum: ddc85be461165c9eb4506669343aa0d0c627e687
            path: ${source.dir}/kong
            spdx:
              name: kong
              version: 3.9.4
              packages:
                - name: kong
                  purl: pkg:github/Kong/kong@3.9.4
                  license: Apache-2.0
            uid: 0
            gid: 0
          - url: https://github.com/bazelbuild/bazel/releases/download/7.7.2/bazel-7.7.2-linux-${BAZEL_ARCH}
            checksum: https://github.com/bazelbuild/bazel/releases/download/7.7.2/bazel-7.7.2-linux-${BAZEL_ARCH}.sha256
            path: /opt/bazel/bin/bazel
            uid: 0
            gid: 0
            mode: "0755"
      pipeline:
        - name: apply patch
          uses: git/patch@v1
          with:
            options: -p1
            patch: ${source.dir}/patch/no-github-cli.patch
        - name: build kong
          privileged: true
          runs: |
            set -eux -o pipefail

            BAZEL_ARGS=(
              --config=release
              --verbose_failures
              --action_env=BUILD_NAME=kong-dev
            )
            test '${target.fips}' = 'true' && BAZEL_ARGS+=("--//:fips=true")

            /opt/bazel/bin/bazel build "${BAZEL_ARGS[@]}" //build:kong //build:venv
        - name: install kong artifacts
          runs: |
            set -eux -o pipefail

            mkdir -p "${target.dir}/usr/bin" "${target.dir}/usr/lib/kong" "${target.dir}/usr/share/kong"

            cp -r bazel-bin/build/kong-dev/openresty "${target.dir}/usr/lib/kong/"
            cp -r bazel-bin/build/kong-dev/kong "${target.dir}/usr/lib/kong/kong"
            mkdir -p "${target.dir}/usr/lib/kong/kong/include"
            cp -r kong/include/* "${target.dir}/usr/lib/kong/kong/include/"
            cp -r bazel-bin/build/kong-dev/lib "${target.dir}/usr/lib/kong/lib"
            cp -r bazel-bin/build/kong-dev/share/. "${target.dir}/usr/share/kong/"

            install -D -m 755 bin/kong "${target.dir}/usr/bin/kong"
            install -D -m 755 bin/kong-health "${target.dir}/usr/bin/kong-health"

            mkdir -p "${target.dir}/etc/kong"
            cp bazel-bin/build/kong-dev/etc/kong/kong.conf.default "${target.dir}/etc/kong/"

            find "${target.dir}/usr/lib/kong/openresty" -exec chmod 0755 {} \;

            sed -i 's|/usr/local/openresty/nginx/sbin/nginx|/usr/lib/kong/openresty/nginx/sbin/nginx|' \
              "${target.dir}/usr/lib/kong/openresty/bin/resty"
            sed -i 's|"/usr/local/openresty/nginx/sbin"|"/usr/lib/kong/openresty/nginx/sbin"|' \
              "${target.dir}/usr/share/kong/lua/5.1/kong/cmd/utils/nginx_signals.lua"
            grep -q '/usr/lib/kong/openresty/nginx/sbin/nginx' "${target.dir}/usr/lib/kong/openresty/bin/resty"
            grep -q '/usr/lib/kong/openresty/nginx/sbin' "${target.dir}/usr/share/kong/lua/5.1/kong/cmd/utils/nginx_signals.lua"

            find "${target.dir}/usr/lib/kong" -type f -exec sh -c '
              set -e
              rpath="$1"
              shift
              for f do
                rp=$(patchelf --print-rpath "$f" 2>/dev/null) || continue
                case "$rp" in
                  */usr/local*)
                    patchelf --set-rpath "$rpath" "$f"
                    ;;
                esac
              done
            ' sh /usr/lib/kong/openresty/luajit/lib:/usr/lib/kong/kong/lib:/usr/lib/kong/openresty/lualib {} +

            find "${target.dir}/usr/lib/kong" -type f -exec sh -c '
              for f do
                rp=$(patchelf --print-rpath "$f" 2>/dev/null) || continue
                case "$rp" in
                  */usr/local*)
                    echo "leftover /usr/local RUNPATH in $f: $rp" >&2
                    exit 1
                    ;;
                esac
              done
            ' sh {} +

            printf '%s\n' '#!/bin/sh' 'exec /usr/lib/kong/openresty/bin/resty -I /usr/lib/kong/openresty/site/lualib -I /usr/lib/kong/openresty/lualib -I /usr/share/kong/lua/5.1 -I /usr/lib/kong/lib/lua/5.1 "$@"' > "${target.dir}/usr/bin/resty"
            chmod 755 "${target.dir}/usr/bin/resty"

            rocks_bin=$(find "${target.dir}/usr/lib/kong/lib/luarocks/rocks-5.1/luarocks" -type f -path '*/bin/luarocks' -print -quit)
            rocks_admin=$(find "${target.dir}/usr/lib/kong/lib/luarocks/rocks-5.1/luarocks" -type f -path '*/bin/luarocks-admin' -print -quit)
            test -n "$rocks_bin"
            test -n "$rocks_admin"
            ver=$(basename "$(dirname "$(dirname "$rocks_bin")")")
            rel_bin=$(printf '%s\n' "$rocks_bin" | sed "s|^${target.dir}||")
            rel_admin=$(printf '%s\n' "$rocks_admin" | sed "s|^${target.dir}||")
            lua_expr="package.path=\"/usr/share/kong/lua/5.1/?.lua;/usr/share/kong/lua/5.1/?/init.lua;/usr/lib/kong/openresty/luajit/share/luajit-2.1/?.lua;/usr/lib/kong/openresty/site/lualib/?.lua;/usr/lib/kong/openresty/lualib/?.lua;./?.lua\";package.cpath=\"/usr/lib/kong/lib/lua/5.1/?.so;/usr/lib/kong/lib/lua/5.1/?/?.so;/usr/lib/kong/openresty/lualib/?.so;/usr/lib/kong/openresty/site/lualib/?.so;./?.so\";local k,l,_=pcall(require,\"luarocks.loader\") _=k and l.add_context(\"luarocks\",\"$ver\")"
            printf '%s\n' '#!/bin/sh' "exec /usr/lib/kong/kong/bin/lua -e '$lua_expr' '$rel_bin' \"\$@\"" > "${target.dir}/usr/bin/luarocks"
            printf '%s\n' '#!/bin/sh' "exec /usr/lib/kong/kong/bin/lua -e '$lua_expr' '$rel_admin' \"\$@\"" > "${target.dir}/usr/bin/luarocks-admin"
            chmod 755 "${target.dir}/usr/bin/luarocks" "${target.dir}/usr/bin/luarocks-admin"
            grep -q '/usr/lib/kong/kong/bin/lua' "${target.dir}/usr/bin/luarocks"
            grep -q '/usr/lib/kong/kong/bin/lua' "${target.dir}/usr/bin/luarocks-admin"
            if grep -E -q '/usr/local|/root/\.cache|bazel-out' "${target.dir}/usr/bin/luarocks" "${target.dir}/usr/bin/luarocks-admin"; then
              echo "luarocks launchers still reference a non-FHS path" >&2
              exit 1
            fi
            staged_expr="package.path=\"${target.dir}/usr/share/kong/lua/5.1/?.lua;${target.dir}/usr/share/kong/lua/5.1/?/init.lua;${target.dir}/usr/lib/kong/openresty/luajit/share/luajit-2.1/?.lua;./?.lua\";package.cpath=\"${target.dir}/usr/lib/kong/lib/lua/5.1/?.so;./?.so\";local k,l,_=pcall(require,\"luarocks.loader\") _=k and l.add_context(\"luarocks\",\"$ver\")"
            "${target.dir}/usr/lib/kong/kong/bin/lua" -e "$staged_expr" "$rocks_bin" --version
            "${target.dir}/usr/lib/kong/kong/bin/lua" -e "$staged_expr" "$rocks_admin" --version
        - uses: spdx@v1
          with:
            license: Apache-2.0
            name: kong
            purl: pkg:github/Kong/kong@3.9.4
            version: 3.9.4
        - name: stage kong sbom
          runs: |
            set -eux -o pipefail

            mkdir -p "${target.dir}/opt/docker/sbom"
            cp -a /opt/docker/sbom/. "${target.dir}/opt/docker/sbom/"
        - uses: dhi/build-pkg:0
          with:
            depends:
              - libcrypt1
              - libstdc++6
              - libyaml-0-2
              - perl
              - zlib1g
            description: Kong Gateway API platform
            files:
              - usr/bin/kong
              - usr/bin/kong-health
              - usr/bin/luarocks
              - usr/bin/luarocks-admin
              - usr/bin/resty
              - usr/lib/kong/openresty
              - usr/lib/kong/kong
              - usr/lib/kong/lib
              - usr/share/kong
              - etc/kong
              - opt/docker/sbom/kong
            formats:
              - deb
            license: Apache-2.0
            name: kong-3
            rel: 0
            url: https://konghq.com/
            version: 3.9.4
      paths:
        - type: directory
          path: ${source.dir}/patch
          uid: 0
          gid: 0
          source: package/main/kong/patch
os-release:
  name: Docker Hardened Images (Debian)
  id: debian
  version-id: "13"
  version-codename: trixie
  pretty-name: Docker Hardened Images/Debian GNU/Linux 13 (trixie)
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
