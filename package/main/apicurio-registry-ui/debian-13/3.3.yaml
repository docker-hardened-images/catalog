            grep -q '<license type="expression">MIT</license>' \
              "$licensedir/kiota-wasm/Microsoft.Plugins.Manifest-0.0.19-preview/Microsoft.Plugins.Manifest.nuspec"
            test "$(find "$licensedir/kiota-wasm" -mindepth 1 -maxdepth 1 -type d | wc -l)" -eq 14
