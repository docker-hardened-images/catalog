            echo "4e05e0a725b2129f13b7254bb0f6cf50619a3b0c8c2dc807d186fdb278b4a048  public/kiota-wasm/blazor.boot.json" | sha256sum -c -
            node -e '
              const fs = require("fs"), crypto = require("crypto"), path = require("path");
              const dir = process.argv[1];
              const r = JSON.parse(fs.readFileSync(path.join(dir, "blazor.boot.json"))).resources;
              const files = {};
              for (const k of ["assembly", "wasmNative", "jsModuleNative", "jsModuleRuntime"]) Object.assign(files, r[k]);
              for (const [loc, m] of Object.entries(r.satelliteResources)) for (const [f, h] of Object.entries(m)) files[loc + "/" + f] = h;
              for (const m of Object.values(r.vfs)) Object.assign(files, m);
              for (const [f, h] of Object.entries(files)) {
                const got = "sha256-" + crypto.createHash("sha256").update(fs.readFileSync(path.join(dir, f))).digest("base64");
                if (got !== h) throw new Error(f + ": " + got + " != " + h);
              }
              if (Object.keys(files).length !== 219) throw new Error("expected 219 integrity entries, got " + Object.keys(files).length);
