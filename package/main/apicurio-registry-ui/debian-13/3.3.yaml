            licensedir="${target.dir}/usr/share/licenses/apicurio-registry-ui-3.3"
            install -D -m 0644 LICENSE "$licensedir/LICENSE"
            install -d "$licensedir/kiota-wasm"
            cp -r --no-preserve=mode,ownership "${source.dir}/licenses/." "$licensedir/kiota-wasm/"
            install -D -m 0644 ui/ui-app/node_modules/@kiota-community/kiota-wasm/LICENSE \
