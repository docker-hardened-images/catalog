# syntax=dhi.io/build:2-alpine3.24

image: dhi.io/pkg-codecov-api
variant: runtime
tags:
  - 26.9.10-alpine3.24
  - 26.9.10-r1-alpine3.24
platforms:
  - linux/amd64
  - linux/arm64
vars:
  CARGO_VERSION: 1.96.1-r0
  COMMIT_SHA: 1c2ed4e2accd4d57b65041281aa98f704c69171d
  PYTHON_MAJOR_MINOR_VERSION: "3.13"
  PYTHON_VERSION: 3.13.15-r1
  REL: "1"
  RUST_VERSION: 1.96.1-r0
  SEMVER_MAJOR_MINOR_VERSION: "26.9"
  SEMVER_MAJOR_VERSION: "26"
  SEMVER_VERSION: 26.9.10
  UV_ARCH: '#{ target.arch == "amd64" ? "x86_64-unknown-linux-musl" : "aarch64-unknown-linux-musl" }'
  UV_VERSION: 0.12.17
  VERSION: 26.9.10
contents:
  repositories:
    - https://dhi.io/apk/alpine/v3.24/main
    - https://dl-cdn.alpinelinux.org/alpine/v3.24/main
    - https://dl-cdn.alpinelinux.org/alpine/v3.24/community
  keyring:
    - https://dhi.io/keyring/dhi-apk@docker-0F81AD7700D99184.rsa.pub
  packages:
    - alpine-baselayout-data
  builds:
    - name: codecov-api
      work-dir: ${source.dir}/umbrella
      environment:
        OPENSSL_NO_VENDOR: "1"
        PYO3_USE_ABI3_FORWARD_COMPATIBILITY: "1"
        UV_CACHE_DIR: /root/.cache/uv-musl
        UV_LINK_MODE: copy
        UV_NO_MANAGED_PYTHON: "true"
        UV_PROJECT_ENVIRONMENT: /usr/lib/codecov-api
        UV_PYTHON: /usr/bin/python3.13
        UV_PYTHON_DOWNLOADS: never
      caches:
        - path: /root/.cache/uv-musl
        - path: /root/.cargo/registry
      contents:
        packages:
          - bash
          - build-base
          - ca-certificates-bundle
          - cargo=1.96.1-r0
          - coreutils
          - findutils
          - git
          - grep
          - libffi-dev
          - libpq-dev
          - openssl-dev
          - pkgconf
          - rust=1.96.1-r0
          - sed
          - python-3.13=3.13.15-r1
          - python-3.13-dev=3.13.15-r1
        files:
          - url: https://github.com/astral-sh/uv/releases/download/0.12.17/uv-${UV_ARCH}.tar.gz
            checksum: https://github.com/astral-sh/uv/releases/download/0.12.17/uv-${UV_ARCH}.tar.gz.sha256
            path: ${source.dir}/uv.tar.gz
            uid: 0
            gid: 0
          - url: git+https://github.com/codecov/umbrella.git#self-hosted-26.9.10
            checksum: 1c2ed4e2accd4d57b65041281aa98f704c69171d
            path: ${source.dir}/umbrella
            spdx:
              name: codecov-api
              version: 26.9.10
              packages:
                - name: codecov-api
                  purl: pkg:github/codecov/umbrella@self-hosted-26.9.10
                  license: FSL-1.1-ALv2
            uid: 0
            gid: 0
      pipeline:
        - name: setup uv
          runs: |
            set -eux -o pipefail

            mkdir -p /usr/local/bin
            tar -xzf "${source.dir}/uv.tar.gz" -C /usr/local/bin --strip-components=1
            chmod +x /usr/local/bin/uv
        - name: patch application
          uses: patch@v1
          with:
            options: -p1
            patches:
              - ${source.dir}/patch/md5-usedforsecurity.patch
              - ${source.dir}/patch/api-sh-shutdown-count.patch
        - name: update python dependencies
          privileged: true
          runs: |
            set -eux -o pipefail

            pins="
              anyio==4.14.2
              cffi==2.1.1
              click==8.3.3
              djangorestframework==3.17.2
            "
            /usr/bin/python3.13 - $pins << 'PY'
            import sys, tomllib
            locked = {p["name"]: p["version"] for p in tomllib.load(open("uv.lock", "rb"))["package"]}
            release = lambda v: tuple(int(x) for x in v.split("."))
            stale = [pin for pin in sys.argv[1:] for name, ver in [pin.split("==")]
                     if name in locked and release(locked[name]) >= release(ver)]
            if stale:
                sys.exit("upstream lock already at or past " + " ".join(stale) + ": drop the pin")
            PY
            upgrades=""
            for pin in $pins; do upgrades="$upgrades --upgrade-package $pin"; done
            uv lock $upgrades
            uv export --frozen --no-dev --no-emit-workspace --no-hashes --format requirements-txt > /tmp/locked.txt
            for pin in $pins; do grep -qE "^${pin}( ;|$)" /tmp/locked.txt; done
        - name: install python dependencies
          privileged: true
          runs: |
            set -eux -o pipefail

            uv export --frozen --no-dev --no-emit-workspace --format requirements-txt > /tmp/export.txt

            locked() {
              awk -v pkg="$1" '$0 ~ "^" pkg "==" { p = 1 } p { print } p && !/\\$/ { exit }' /tmp/export.txt
            }

            uv sync --frozen --no-editable --only-group codecov-api --no-install-package polars
            test ! -e /usr/lib/codecov-api/lib/python3.13/site-packages/polars
            /usr/lib/codecov-api/bin/python -c 'import cc_rustyribs'
            locked pytz > /tmp/pytz.txt
            uv pip install --python /usr/lib/codecov-api/bin/python --no-deps --require-hashes -r /tmp/pytz.txt
            locked psycopg2-binary > /tmp/psycopg2.txt
            uv pip install --python /usr/lib/codecov-api/bin/python --no-deps --require-hashes \
              --no-binary psycopg2-binary --reinstall-package psycopg2-binary -r /tmp/psycopg2.txt
            test ! -e /usr/lib/codecov-api/lib/python3.13/site-packages/psycopg2_binary.libs
            locked cryptography > /tmp/cryptography.txt
            uv pip install --python /usr/lib/codecov-api/bin/python --no-deps --require-hashes \
              --no-binary cryptography --reinstall-package cryptography -r /tmp/cryptography.txt
            test ! -e /usr/lib/codecov-api/lib/python3.13/site-packages/cryptography.libs
            /usr/lib/codecov-api/bin/python - << 'PY'
            import psycopg2, ssl
            from cryptography.hazmat.backends.openssl.backend import backend
            assert backend.openssl_version_text() == ssl.OPENSSL_VERSION, backend.openssl_version_text()
            PY
            rm -f /usr/lib/codecov-api/.lock /usr/lib/codecov-api/.gitignore /usr/lib/codecov-api/CACHEDIR.TAG \
              /usr/lib/codecov-api/bin/activate /usr/lib/codecov-api/bin/activate.* \
              /usr/lib/codecov-api/bin/activate_this.py /usr/lib/codecov-api/bin/deactivate.bat /usr/lib/codecov-api/bin/pydoc.bat
            find /usr/lib/codecov-api -depth -type d -name __pycache__ -exec rm -rf {} +
            find /usr/lib/codecov-api/lib/python3.13/site-packages -depth -type d -name tests -exec rm -rf {} +
            rm -rf /usr/lib/codecov-api/include
            find /usr/lib/codecov-api/lib/python3.13/site-packages -type f \
              \( -name '*.h' -o -name '*.hpp' -o -name '*.c' -o -name '*.cpp' \) -delete
            test -z "$(find /usr/lib/codecov-api -type f \( -name '*.h' -o -name '*.hpp' -o -name '*.c' -o -name '*.cpp' \))"
        - name: stage application
          runs: |
            set -eux -o pipefail

            install -d \
              "${target.dir}/usr/lib" \
              "${target.dir}/usr/share"
            cp -a /usr/lib/codecov-api "${target.dir}/usr/lib/codecov-api"
            cp -a apps/codecov-api "${target.dir}/usr/share/codecov-api"
            cp -a LICENSE.md "${target.dir}/usr/share/codecov-api/LICENSE.md"
            cp -a VERSION "${target.dir}/usr/share/codecov-api/VERSION"

            rm -rf "${target.dir}/usr/share/codecov-api/docker" \
              "${target.dir}/usr/share/codecov-api/Makefile" \
              "${target.dir}/usr/share/codecov-api/README.md" \
              "${target.dir}/usr/share/codecov-api/.dockerignore" \
              "${target.dir}/usr/share/codecov-api/.gitignore" \
              "${target.dir}/usr/share/codecov-api/.git-blame-ignore-revs" \
              "${target.dir}/usr/share/codecov-api/codecov.yml" \
              "${target.dir}/usr/share/codecov-api/conftest.py" \
              "${target.dir}/usr/share/codecov-api/mypy.ini" \
              "${target.dir}/usr/share/codecov-api/pytest.ini"
            find "${target.dir}/usr/share/codecov-api" -depth -type d \
              \( -name tests -o -name __pycache__ \) -exec rm -rf {} +
            chmod 0755 "${target.dir}/usr/share/codecov-api/migrate.sh" \
              "${target.dir}/usr/share/codecov-api/migrate-timeseries.sh"
        - name: collect static files
          work-dir: ${target.dir}/usr/share/codecov-api
          environment:
            PYTHONDONTWRITEBYTECODE: "1"
            RUN_ENV: ENTERPRISE
          runs: |
            set -eux -o pipefail

            /usr/lib/codecov-api/bin/python manage.py collectstatic --no-input
            /usr/lib/codecov-api/bin/python manage.py check
        - name: compile bytecode
          runs: |
            set -eux -o pipefail

            /usr/lib/codecov-api/bin/python -m compileall -q -f -j 0 --invalidation-mode unchecked-hash \
              -s "${target.dir}" -p / "${target.dir}/usr/lib/codecov-api/lib" "${target.dir}/usr/share/codecov-api"
            find "${target.dir}/usr/lib/codecov-api/lib/python3.13/site-packages/django/__pycache__" \
              "${target.dir}/usr/share/codecov-api/__pycache__" -name '*.cpython-*.pyc' | grep -q .
        - name: python dependencies sbom
          uses: sbom@v1
          with:
            extra-scanners: python-package-cataloger
            prefix: codecov-api-venv
            source: ${target.dir}/usr/lib/codecov-api
        - uses: dhi/build-pkg:0
          with:
            apk:
              depends:
                - libcrypto3
                - libgcc
                - libpq
                - libssl3
                - libstdc++
            depends:
              - bash
              - coreutils
              - python-3.13
            description: Codecov API, the Django backend of a self-hosted Codecov deployment
            files:
              - usr/lib/codecov-api
              - usr/share/codecov-api
            formats:
              - apk
            license: FSL-1.1-ALv2
            name: codecov-api
            rel: 1
            url: https://github.com/codecov/umbrella
            version: 26.9.10
      paths:
        - type: directory
          path: ${source.dir}/patch
          uid: 0
          gid: 0
          source: package/main/codecov-api/patch
os-release:
  name: Docker Hardened Images (Alpine)
  id: alpine
  version-id: "3.24"
  pretty-name: Docker Hardened Images/Alpine Linux v3.24
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
