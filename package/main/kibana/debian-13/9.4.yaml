# syntax=dhi.io/build:2-debian13

image: dhi.io/pkg-kibana
variant: runtime
tags:
  - 9.4.5
  - 9.4.5-r1
  - 9.4.5-debian13
  - 9.4.5-r1-debian13
platforms:
  - linux/amd64
  - linux/arm64
dates:
  release: "2026-05-05"
vars:
  ARCH: '#{ target.arch == "amd64" ? "amd64" : "arm64" }'
  COMMIT_SHA: bc80ff828630b51dd591207f43a54ea5ebf53270
  GO_ARCH: '#{ target.arch == "amd64" ? "x86_64" : "aarch64" }'
  NODE_ARCH: '#{ target.arch == "amd64" ? "x64" : "arm64" }'
  NODE_BINARIES_EXTRA_SUBDIR: glibc-217
  NODE_BINARIES_SUBDIR: default
  NODE_MAJOR_VERSION: "24"
  NODE_VERSION: 24.20.0-0
  PACKAGE_NAME: kibana-9.4
  REL: "1"
  SEMVER_MAJOR_MINOR_VERSION: "9.4"
  SEMVER_MAJOR_VERSION: "9"
  SEMVER_VERSION: 9.4.5
  VERSION: 9.4.5
contents:
  packages:
    - '!base-files'
  builds:
    - name: kibana
      work-dir: ${source.dir}/kibana
      caches:
        - path: /root/.yarn
      contents:
        repositories:
          - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
        keyring:
          - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
        packages:
          - bash
          - gzip
          - jq
          - base-files
          - ca-certificates
          - coreutils
          - findutils
          - git
          - libc6
          - libstdc++6
          - mawk
          - nodejs-24=24.20.0-0
          - node-corepack
          - npm
          - sed
          - yarn-classic
        files:
          - url: git+https://github.com/elastic/kibana.git#v9.4.5
            checksum: bc80ff828630b51dd591207f43a54ea5ebf53270
            path: ${source.dir}/kibana
            spdx:
              name: kibana
              version: 9.4.5
              packages:
                - name: kibana
                  purl: pkg:dhi/kibana@9.4.5
                  license: Elastic-License-2.0
            uid: 65532
            gid: 65532
      pipeline:
        - name: update node engine
          work-dir: ${source.dir}/kibana
          runs: |
            set -eux -o pipefail

            ls -la package.json

            REQUIRED_VERSION=$(sed -nr "s/\"node\": \"([0-9]+)\.[0-9]+\.[0-9]+\".*/\1/p" package.json | tr -d " ")
            if [ "$REQUIRED_VERSION" != "24" ]; then
              echo "Error: upstream requirement for Node v$REQUIRED_VERSION not met by build v24."
              echo "Error: if version change is intentional, update this version verification logic."
              exit 1
            fi

            sed -ir "s/\"node\": \"[0-9]\+\.[0-9]\+\.[0-9]\+\"/\"node\": \"$(node --version | sed 's/^v//')\"/g" package.json
        - name: bump yarn deps (9.4)
          uses: yarn/bump@v2
          run-as: "65532"
          privileged: true
          with:
            bumps: ${source.dir}/patches/yarn-patches_9.4.json
            yarn-root: ${source.dir}/kibana
        - name: force vulnerable lockfile bumps (9.4)
          run-as: "65532"
          work-dir: ${source.dir}/kibana
          privileged: true
          runs: |
            set -eux -o pipefail

            sed -i '/^undici@\^6\.21\.1, undici@\^6\.21\.2:/,/^$/{
              s|^  version "6\.[0-9.]*"$|  version "6.28.0"|
              s|^  resolved ".*undici-6\.[0-9.]*\.tgz#.*"$|  resolved "https://registry.yarnpkg.com/undici/-/undici-6.28.0.tgz#9f0e385744fef5021d6596c5bccd783f61193c1c"|
              s|^  integrity sha512-.*$|  integrity sha512-LIY910g9TI13YS95lrMFrs8Rm/u/irgHeTWoKCoteeJ04CUJ92eEfj0rVn+7VKMPBpUPiUoBKfhNyLI23EE/KA==|
            }' yarn.lock

            sed -i '/^js-yaml@[^:]*\^4\.[0-9]*\.[0-9]*[^:]*:/,/^$/d' yarn.lock

            sed -i '/^brace-expansion@\^1\.1\.7:/,/^$/{
              s|^  version "1.1.1[56]"$|  version "1.1.18"|
              s|^  resolved ".*brace-expansion-1.1.1[56].tgz#.*"$|  resolved "https://registry.yarnpkg.com/brace-expansion/-/brace-expansion-1.1.18.tgz#3ce74d89885136be1535341f8c3d4425c29a5cab"|
              s|^  integrity sha512-.*$|  integrity sha512-Edep/X9fGqVNmzKBVsDYIOtD+z1tuezV70LBjdCst9Tqu76lsnvRiZ6oTic1n+/BIwX6QDGAO94PN4N2SADvtw==|
            }' yarn.lock

            sed -i '/^brace-expansion@\^5\.0\.2, brace-expansion@\^5\.0\.5:/,/^$/{
              s|^  version "5.0.[78]"$|  version "5.0.9"|
              s|^  resolved ".*brace-expansion-5.0.[78].tgz#.*"$|  resolved "https://registry.yarnpkg.com/brace-expansion/-/brace-expansion-5.0.9.tgz#7c72438809b5fa5babf54199a1f1c281a6984fcf"|
              s|^  integrity sha512-.*$|  integrity sha512-ScQ4IuvIEF1TMlP7Zt+vjJ//9zlPb2SDcxWxM3bk8s6t6GGdJ7KO1dCcTidOPJKePW30LE/2cT7wCyPho9/Wxg==|
            }' yarn.lock

            yarn install --package-lock-only
        - name: build kibana
          work-dir: ${source.dir}/kibana
          privileged: true
          runs: |
            set -eux -o pipefail

            echo "startup --batch" > .bazelrc.user

            mkdir -p ~/.moon/plugins/toolchains
            export MOON_TOOLCHAIN_FORCE_GLOBALS=1

            yarn kbn bootstrap

            bash "${source.dir}/scripts/patch-extract-zip.sh" \
              "${source.dir}/patches/extract-zip-2.0.2" \
              "${source.dir}/kibana"

            NODE_RUNTIME_VERSION="$(node --version | sed 's/^v//')"
            populate_node_extract() {
              local variant="$1"
              local platform="$2"
              local extract="${source.dir}/kibana/.node_binaries/${NODE_RUNTIME_VERSION}/${variant}/${platform}/extract"

              mkdir -p "${extract}/bin"
              cp -a /usr/bin/node "${extract}/bin/node"
              node << EOF
            const fs = require('fs');
            const https = require('https');
            const url = 'https://raw.githubusercontent.com/nodejs/node/v${NODE_RUNTIME_VERSION}/LICENSE';
            https.get(url, (res) => {
              if (res.statusCode !== 200) {
                console.error('failed to download Node LICENSE:', res.statusCode);
                process.exit(1);
              }
              const chunks = [];
              res.on('data', (chunk) => chunks.push(chunk));
              res.on('end', () => fs.writeFileSync('${extract}/LICENSE', Buffer.concat(chunks)));
            }).on('error', (err) => {
              console.error(err);
              process.exit(1);
            });
            EOF
            }
            for node_subdir in default glibc-217; do
              if [ -z "${node_subdir}" ]; then
                continue
              fi
              populate_node_extract "${node_subdir}" "linux-x64"
              if [ ${NODE_ARCH} != "x64" ]; then
                populate_node_extract "${node_subdir}" "linux-${NODE_ARCH}"
              fi
            done

            node --no-experimental-require-module -- \
              scripts/build --skip-os-packages --skip-initialize \
              --skip-docker-cloud-fips --skip-docker-contexts --skip-docker-ubi \
              --skip-docker-wolfi --skip-docker-cloud --skip-docker-cloud-fips \
              --skip-docker-serverless --skip-docker-fips

            KBN_DIST="${source.dir}/kibana/build/default/kibana-9.4.5-SNAPSHOT-linux-${GO_ARCH}"
            if [ ! -x "${KBN_DIST}/bin/kibana" ]; then
              cd "${source.dir}/kibana"
              KBN_VERSION="9.4.5" KBN_GO_ARCH="${GO_ARCH}" \
                node --no-experimental-require-module scripts/render-bin-scripts.js
            fi

            mkdir -p "${target.dir}/usr/share/kibana"

            cp -r "${KBN_DIST}"/* "${target.dir}/usr/share/kibana"

            cd "${target.dir}/usr/share/kibana"
            rm -rf data
        - name: encode bracket paths for build-pkg
          runs: |
            set -eux -o pipefail

            find "${target.dir}/usr/share/kibana" -depth -name '*\[*' | while IFS= read -r f; do
              dir=$(dirname "$f")
              base=$(basename "$f")
              safe=$(printf '%s' "$base" | sed 's/\[/__DHI_LB__/g; s/\]/__DHI_RB__/g')
              mv "$f" "${dir}/${safe}"
            done
        - uses: dhi/build-pkg:0
          with:
            depends:
              - bash
              - coreutils
            description: Kibana data visualization and exploration platform
            files:
              - usr/share/kibana
            formats:
              - deb
            license: Elastic-License-2.0
            name: kibana-9.4
            rel: 1
            url: https://www.elastic.co/kibana/
            version: 9.4.5
      paths:
        - type: file
          path: ${source.dir}/patches/yarn-patches_9.1.json
          uid: 65532
          gid: 65532
          mode: "0444"
          source: package/main/kibana/patch/yarn-patches_9.1.json
        - type: file
          path: ${source.dir}/patches/yarn-patches_9.2.json
          uid: 65532
          gid: 65532
          mode: "0444"
          source: package/main/kibana/patch/yarn-patches_9.2.json
        - type: file
          path: ${source.dir}/patches/yarn-patches_9.3.json
          uid: 65532
          gid: 65532
          mode: "0444"
          source: package/main/kibana/patch/yarn-patches_9.3.json
        - type: file
          path: ${source.dir}/patches/yarn-patches_9.4.json
          uid: 65532
          gid: 65532
          mode: "0444"
          source: package/main/kibana/patch/yarn-patches_9.4.json
        - type: file
          path: ${source.dir}/patches/expr-eval_9.1.patch
          uid: 65532
          gid: 65532
          mode: "0444"
          source: package/main/kibana/patch/expr-eval_9.1.patch
        - type: directory
          path: ${source.dir}/patches/extract-zip-2.0.2
          uid: 65532
          gid: 65532
          mode: "0555"
          source: package/main/kibana/patch/extract-zip-2.0.2
        - type: file
          path: ${source.dir}/scripts/patch-extract-zip.sh
          uid: 65532
          gid: 65532
          mode: "0555"
          source: package/main/kibana/scripts/patch-extract-zip.sh
        - type: file
          path: ${source.dir}/kibana/scripts/render-bin-scripts.js
          uid: 65532
          gid: 65532
          mode: "0444"
          source: package/main/kibana/scripts/render-bin-scripts.js
      accounts:
        run-as: node
        users:
          - name: node
            uid: 65532
            gid: 65532
os-release:
  name: Docker Hardened Images (Debian)
  id: debian
  version-id: "13"
  version-codename: trixie
  pretty-name: Docker Hardened Images/Debian GNU/Linux 13 (trixie)
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
