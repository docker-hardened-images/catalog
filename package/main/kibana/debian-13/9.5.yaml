# syntax=dhi.io/build:2-debian13

image: dhi.io/pkg-kibana
variant: runtime
tags:
  - 9.5.5
  - 9.5.5-r8
  - 9.5.5-debian13
  - 9.5.5-r8-debian13
platforms:
  - linux/amd64
  - linux/arm64
dates:
  release: "2026-05-05"
vars:
  ARCH: '#{ target.arch == "amd64" ? "amd64" : "arm64" }'
  COMMIT_SHA: a2890159e2486503b9e3a0c6f422b153a746651a
  GO_ARCH: '#{ target.arch == "amd64" ? "x86_64" : "aarch64" }'
  KIBANA_NODE_BUILD_FLAGS: ""
  KIBANA_NODE_RENDER_FLAGS: ""
  NODE_ARCH: '#{ target.arch == "amd64" ? "x64" : "arm64" }'
  NODE_BINARIES_EXTRA_SUBDIR: glibc-217
  NODE_BINARIES_SUBDIR: default
  NODE_MAJOR_VERSION: "24"
  NODE_VERSION: 24.22.2-0
  PACKAGE_NAME: kibana-9.5
  REL: "8"
  SEMVER_MAJOR_MINOR_VERSION: "9.5"
  SEMVER_MAJOR_VERSION: "9"
  SEMVER_VERSION: 9.5.5
  VERSION: 9.5.5
contents:
  packages:
    - '!base-files'
  builds:
    - name: kibana
      work-dir: ${source.dir}/kibana
      caches:
        - path: /root/.local/share/pnpm
        - path: /root/.yarn
      contents:
        repositories:
          - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
        keyring:
          - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
        packages:
          - bash
          - gzip
          - jq
          - base-files
          - ca-certificates
          - coreutils
          - findutils
          - git
          - libc6
          - libstdc++6
          - mawk
          - nodejs-24=24.22.2-0
          - node-corepack
          - npm
          - sed
          - yarn-classic
        files:
          - url: git+https://github.com/elastic/kibana.git#v9.5.5
            checksum: a2890159e2486503b9e3a0c6f422b153a746651a
            path: ${source.dir}/kibana
            spdx:
              name: kibana
              version: 9.5.5
              packages:
                - name: kibana
                  purl: pkg:dhi/kibana@9.5.5
                  license: Elastic-License-2.0
            uid: 65532
            gid: 65532
      pipeline:
        - name: update node engine
          work-dir: ${source.dir}/kibana
          runs: |
            set -eux -o pipefail

            ls -la package.json

            REQUIRED_VERSION=$(sed -nr "s/\"node\": \"([0-9]+)\.[0-9]+\.[0-9]+\".*/\1/p" package.json | tr -d " ")
            if [ "$REQUIRED_VERSION" != "24" ]; then
              echo "Error: upstream requirement for Node v$REQUIRED_VERSION not met by build v24."
              echo "Error: if version change is intentional, update this version verification logic."
              exit 1
            fi

            sed -ir "s/\"node\": \"[0-9]\+\.[0-9]\+\.[0-9]\+\"/\"node\": \"$(node --version | sed 's/^v//')\"/g" package.json
        - name: retain security overrides after pnpm migration (9.5)
          uses: patch@v1
          work-dir: ${source.dir}/kibana
          with:
            options: -p1
            patches:
              - ${source.dir}/patches/pnpm-security-overrides_9.5.patch
        - name: drop bundled Node.js from NOTICE.txt
          uses: patch@v1
          work-dir: ${source.dir}/kibana
          with:
            options: -p1
            patches:
              - ${source.dir}/patches/kibana-notice-without-node.patch
        - name: build kibana
          work-dir: ${source.dir}/kibana
          privileged: true
          runs: |
            set -eux -o pipefail

            mkdir -p ${source.dir}/bin
            export PATH=$PATH:${source.dir}/bin
            corepack enable --install-directory ${source.dir}/bin

            echo "startup --batch" > .bazelrc.user

            mkdir -p ~/.moon/plugins/toolchains
            export MOON_TOOLCHAIN_FORCE_GLOBALS=1

            ${source.dir}/bin/pnpm kbn bootstrap

            NODE_RUNTIME_VERSION="$(node --version | sed 's/^v//')"
            populate_node_extract() {
              local variant="$1"
              local platform="$2"

              mkdir -p "${source.dir}/kibana/.node_binaries/${NODE_RUNTIME_VERSION}/${variant}/${platform}/extract"
            }
            for node_subdir in default glibc-217; do
              if [ -z "${node_subdir}" ]; then
                continue
              fi
              populate_node_extract "${node_subdir}" "linux-x64"
              if [ ${NODE_ARCH} != "x64" ]; then
                populate_node_extract "${node_subdir}" "linux-${NODE_ARCH}"
              fi
            done

            node  -- \
              scripts/build --skip-os-packages --skip-initialize \
              --skip-docker-cloud-fips --skip-docker-contexts --skip-docker-ubi \
              --skip-docker-wolfi --skip-docker-cloud --skip-docker-cloud-fips \
              --skip-docker-serverless --skip-docker-fips

            KBN_DIST="${source.dir}/kibana/build/default/kibana-9.5.5-SNAPSHOT-linux-${GO_ARCH}"
            if [ ! -x "${KBN_DIST}/bin/kibana" ]; then
              cd "${source.dir}/kibana"
              export KBN_VERSION="9.5.5" KBN_GO_ARCH="${GO_ARCH}"
              node  scripts/render-bin-scripts.js
            fi

            rm -r "${KBN_DIST}/node"

            sed -i 's|[$]{DIR}/node/[a-z0-9-]*/bin/node|/usr/bin/node|g' "${KBN_DIST}"/bin/*

            if grep -rn "/node/[a-z0-9-]*/bin/node" "${KBN_DIST}/bin"; then
              echo "Error: a launcher still references a bundled Node.js."
              exit 1
            fi
            if [ -n "$(grep -L '^NODE="/usr/bin/node"$' "${KBN_DIST}"/bin/*)" ]; then
              echo "Error: a launcher does not use the packaged Node.js."
              exit 1
            fi

            mkdir -p "${target.dir}/usr/share/kibana"

            cp -r "${KBN_DIST}"/* "${target.dir}/usr/share/kibana"

            cd "${target.dir}/usr/share/kibana"
            rm -rf data
        - name: generate SBOM for UI dependencies
          runs: |
            set -eux -o pipefail

            mkdir -p ${target.dir}/opt/docker/sbom
            ${source.dir}/bin/pnpm sbom --sbom-format spdx --prod > ${target.dir}/opt/docker/sbom/kibana-ui.spdx.json
        - uses: dhi/build-pkg:0
          with:
            depends:
              - bash
              - coreutils
              - nodejs-24=24.22.2-0
            description: Kibana data visualization and exploration platform
            disableGlobbing: true
            files:
              - usr/share/kibana
              - opt/docker/sbom/kibana-ui.spdx.json
            formats:
              - deb
            license: Elastic-License-2.0
            name: kibana-9.5
            rel: 8
            url: https://www.elastic.co/kibana/
            version: 9.5.5
      paths:
        - type: file
          path: ${source.dir}/patches/pnpm-security-overrides_9.4.patch
          uid: 65532
          gid: 65532
          mode: "0444"
          source: package/main/kibana/patch/pnpm-security-overrides_9.4.patch
        - type: file
          path: ${source.dir}/patches/pnpm-security-overrides_9.5.patch
          uid: 65532
          gid: 65532
          mode: "0444"
          source: package/main/kibana/patch/pnpm-security-overrides_9.5.patch
        - type: file
          path: ${source.dir}/patches/kibana-notice-without-node.patch
          uid: 65532
          gid: 65532
          mode: "0444"
          source: package/main/kibana/patch/kibana-notice-without-node.patch
        - type: file
          path: ${source.dir}/kibana/scripts/render-bin-scripts.js
          uid: 65532
          gid: 65532
          mode: "0444"
          source: package/main/kibana/scripts/render-bin-scripts.js
      accounts:
        run-as: node
        users:
          - name: node
            uid: 65532
            gid: 65532
os-release:
  name: Docker Hardened Images (Debian)
  id: debian
  version-id: "13"
  version-codename: trixie
  pretty-name: Docker Hardened Images/Debian GNU/Linux 13 (trixie)
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
