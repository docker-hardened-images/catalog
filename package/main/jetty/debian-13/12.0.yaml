# syntax=dhi.io/build:2-debian13

image: dhi.io/pkg-jetty
variant: runtime
tags:
  - 12.0.41
  - 12.0.41-r0
  - 12.0.41-debian13
  - 12.0.41-r0-debian13
platforms:
  - linux/amd64
  - linux/arm64
dates:
  release: "2023-08-07"
vars:
  COMMIT_SHA: 3444246ab50a5e571bc107983d80b80e1a8edb7c
  HOME_SHA256: af3c5bf96510738271a676152ddd7c749eb9a4db1511c833f128d8bbd2b3c6aa
  PACKAGE_NAME: jetty-12.0
  REL: "0"
  SEMVER_MAJOR_MINOR_VERSION: "12.0"
  SEMVER_MAJOR_VERSION: "12"
  SEMVER_VERSION: 12.0.41
  VERSION: 12.0.41
contents:
  repositories:
    - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
  keyring:
    - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
  packages:
    - base-files
  builds:
    - name: jetty-12.0
      work-dir: ${source.dir}/jetty
      contents:
        packages:
          - bash
          - ca-certificates
          - coreutils
          - findutils
          - gawk
          - gnupg
          - grep
          - gzip
          - tar
        files:
          - url: https://maven-central.storage-download.googleapis.com/maven2/org/eclipse/jetty/jetty-home/12.0.41/jetty-home-12.0.41.tar.gz
            checksum: sha256:af3c5bf96510738271a676152ddd7c749eb9a4db1511c833f128d8bbd2b3c6aa
            path: ${source.dir}/jetty/jetty-home-12.0.41.tar.gz
            spdx:
              name: jetty-home
              version: 12.0.41
              packages:
                - name: jetty-home
                  purl: pkg:maven/org.eclipse.jetty/jetty-home@12.0.41
                  license: EPL-2.0 OR Apache-2.0
            uid: 0
            gid: 0
          - url: https://maven-central.storage-download.googleapis.com/maven2/org/eclipse/jetty/jetty-home/12.0.41/jetty-home-12.0.41.tar.gz.asc
            path: ${source.dir}/jetty/jetty-home-12.0.41.tar.gz.asc
            uid: 0
            gid: 0
      pipeline:
        - name: check release keyring
          runs: |
            set -eux -o pipefail

            ring="${source.dir}/jetty/keys/jetty-release-keys.asc"
            list="${source.dir}/jetty/keys/KEYS.txt"
            test -s "$ring"
            test -s "$list"

            listed=$(gawk '{
              fp = ""
              n = 0
              for (i = 1; i <= NF; i++) {
                if ($i ~ /^[0-9A-F]{4}$/) {
                  fp = fp $i
                  n++
                }
              }
              if (n == 10) print fp
            }' "$list")
            test -n "$listed"
            test "$(printf '%s\n' "$listed" | grep -c .)" -eq 10

            shown=$(gpg --batch --show-keys --with-colons "$ring" | gawk -F: '$1 == "fpr" { print $10 }')
            test -n "$shown"
            printf '%s\n' "$listed" | while IFS= read -r fp; do
              test -n "$fp"
              printf '%s\n' "$shown" | grep -qx "$fp"
            done
        - name: verify jetty home
          uses: gpg/verify@v1
          with:
            file: ${source.dir}/jetty/jetty-home-12.0.41.tar.gz
            keys: ${source.dir}/jetty/keys/jetty-release-keys.asc
            signature: ${source.dir}/jetty/jetty-home-12.0.41.tar.gz.asc
        - name: install jetty home
          runs: |
            set -eux -o pipefail

            src="${source.dir}/jetty/jetty-home-12.0.41.tar.gz"
            home="${target.dir}/usr/share/jetty-12.0"
            test -s "$src"
            install -d "$home"
            tar -xzf "$src" -C "$home" --strip-components=1

            test -s "${home}/start.jar"
            test -s "${home}/LICENSE.txt"
            test -s "${home}/NOTICE.txt"
            test -s "${home}/VERSION.txt"
            test -s "${home}/README.adoc"
            test -x "${home}/bin/jetty.sh"
            test -s "${home}/etc/jetty.conf"
            test -d "${home}/lib"
            test -d "${home}/modules"
            grep -q "^#!/usr/bin/env bash" "${home}/bin/jetty.sh"
            grep -q "12.0.41" "${home}/VERSION.txt"
            grep -qxF -- "--module=pid,state" "${home}/etc/jetty.conf"
            if find "$home" -type f \( -name '*.so' -o -name '*.dylib' -o -name '*.dll' \) | grep -q .; then
              echo "jetty-home shipped a native library" >&2
              find "$home" -type f \( -name '*.so' -o -name '*.dylib' -o -name '*.dll' \) >&2
              exit 1
            fi
        - name: java sbom
          uses: sbom@v1
          with:
            extra-scanners: java-archive-cataloger
            prefix: jetty-12.0
            source: ${target.dir}/usr/share/jetty-12.0
        - name: stage sbom
          runs: |
            set -eux -o pipefail

            sbom="/opt/docker/sbom/jetty-12.0/.spdx.jetty-12.0.json"
            test -s "$sbom"
            grep -q "jetty-server" "$sbom"
            grep -q "12.0.41" "$sbom"
            install -d "${target.dir}/opt/docker/sbom"
            cp -a "/opt/docker/sbom/jetty-12.0" "${target.dir}/opt/docker/sbom/"
            test -s "${target.dir}/opt/docker/sbom/jetty-12.0/.spdx.jetty-12.0.json"
        - uses: dhi/build-pkg:0
          with:
            depends:
              - bash
              - coreutils
              - findutils
              - sed
            description: Eclipse Jetty web server and servlet container
            files:
              - usr/share/jetty-12.0
              - opt/docker/sbom/jetty-12.0
            license: EPL-2.0 OR Apache-2.0
            name: jetty-12.0
            rel: 0
            url: https://jetty.org/
            version: 12.0.41
      paths:
        - type: file
          path: ${source.dir}/jetty/keys/jetty-release-keys.asc
          uid: 0
          gid: 0
          source: package/main/jetty/keys/jetty-release-keys.asc
        - type: file
          path: ${source.dir}/jetty/keys/KEYS.txt
          uid: 0
          gid: 0
          source: package/main/jetty/keys/KEYS.txt
os-release:
  name: Docker Hardened Images (Debian)
  id: debian
  version-id: "13"
  version-codename: trixie
  pretty-name: Docker Hardened Images/Debian GNU/Linux 13 (trixie)
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
