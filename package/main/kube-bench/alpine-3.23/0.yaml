# syntax=dhi.io/build:2-alpine3.23

image: dhi.io/pkg-kube-bench
variant: runtime
tags:
  - 0.16.0-alpine3.23
  - 0.16.0-r0-alpine3.23
platforms:
  - linux/amd64
  - linux/arm64
vars:
  COMMIT_SHA: 5c6c22d51b926020e7414e1f1e051851d1a2feff
  GOLANG_VERSION: 1.26.11-r1
  KUBECTL_MAJOR_MINOR_VERSION: "1.36"
  PACKAGE_NAME: kube-bench
  REL: "0"
  SEMVER_MAJOR_MINOR_VERSION: "0.16"
  SEMVER_MAJOR_VERSION: "0"
  SEMVER_VERSION: 0.16.0
  VERSION: 0.16.0
contents:
  repositories:
    - https://dhi.io/apk/alpine/v3.23/main
    - https://dl-cdn.alpinelinux.org/alpine/v3.23/main
    - https://dl-cdn.alpinelinux.org/alpine/v3.23/community
  keyring:
    - https://dhi.io/keyring/dhi-apk@docker-0F81AD7700D99184.rsa.pub
  packages:
    - alpine-baselayout-data
  builds:
    - name: kube-bench
      work-dir: /go/src/github.com/aquasecurity/kube-bench
      contents:
        packages:
          - busybox
          - bash
          - ca-certificates-bundle
          - golang-1.26=1.26.11-r1
          - golang-1.26-oci-config=1.26.11-r1
        files:
          - url: git+https://github.com/aquasecurity/kube-bench.git#v0.16.0
            checksum: 5c6c22d51b926020e7414e1f1e051851d1a2feff
            path: /go/src/github.com/aquasecurity/kube-bench
            uid: 0
            gid: 0
      pipeline:
        - name: update go dependencies
          uses: go/bump@v3
          with:
            deps:
              - golang.org/x/net@v0.62.0
        - uses: go/hermetic@v1
        - name: check the kubectl line is set
          runs: |
            set -eux -o pipefail

            test -n "1.36"
        - name: test
          runs: |
            set -eux -o pipefail

            CGO_ENABLED=0 go test ./...
        - name: build
          uses: go/build@v1
          with:
            fips: false
            ldflags:
              - -X github.com/aquasecurity/kube-bench/cmd.KubeBenchVersion=v0.16.0
              - -X github.com/aquasecurity/kube-bench/cmd.cfgDir=/etc/kube-bench/cfg
            output: ${target.dir}/usr/bin/kube-bench
        - name: build dev
          uses: go/build@v1
          with:
            fips: false
            ldflags:
              - -X github.com/aquasecurity/kube-bench/cmd.KubeBenchVersion=v0.16.0
              - -X github.com/aquasecurity/kube-bench/cmd.cfgDir=/etc/kube-bench/cfg
            output: ${target.dir}/usr/bin/kube-bench-dev
            strip: false
        - name: stage benchmark config and helper script
          runs: |
            set -eux -o pipefail

            mkdir -p "${target.dir}/etc/kube-bench"
            cp -a cfg "${target.dir}/etc/kube-bench/cfg"
            cp -a cfg "${target.dir}/etc/kube-bench/cfg-dev"
            install -D -m 0755 helper_scripts/check_files_owner_in_dir.sh "${target.dir}/usr/bin/check_files_owner_in_dir.sh"
            install -D -m 0755 helper_scripts/check_files_owner_in_dir.sh "${target.dir}/usr/bin/check_files_owner_in_dir-dev.sh"
        - uses: dhi/build-pkg:0
          with:
            apk:
              depends:
                - busybox
                - procps-ng
            deb:
              depends:
                - coreutils
                - diffutils
                - grep
                - mawk
                - procps
                - sed
            depends:
              - bash
              - findutils
              - jq
              - kubectl-1.36
              - openssl
            description: Checks whether Kubernetes is deployed according to the CIS Kubernetes Benchmark
            files:
              - usr/bin/kube-bench
              - usr/bin/check_files_owner_in_dir.sh
              - etc/kube-bench/cfg
            license: Apache-2.0
            name: kube-bench
            rel: 0
            subpackages:
              - apk:
                  depends:
                    - busybox
                    - procps-ng
                deb:
                  depends:
                    - coreutils
                    - diffutils
                    - grep
                    - mawk
                    - procps
                    - sed
                depends:
                  - bash
                  - findutils
                  - jq
                  - kubectl-1.36-dev
                  - openssl
                files:
                  - path: usr/bin/kube-bench
                    source: usr/bin/kube-bench-dev
                  - path: usr/bin/check_files_owner_in_dir.sh
                    source: usr/bin/check_files_owner_in_dir-dev.sh
                  - path: etc/kube-bench/cfg
                    source: etc/kube-bench/cfg-dev
                name: kube-bench-dev
            url: https://github.com/aquasecurity/kube-bench
            version: 0.16.0
os-release:
  name: Docker Hardened Images (Alpine)
  id: alpine
  version-id: "3.23"
  pretty-name: Docker Hardened Images/Alpine Linux v3.23
  home-url: https://docker.com/products/hardened-images/
