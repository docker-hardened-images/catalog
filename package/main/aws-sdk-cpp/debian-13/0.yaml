# syntax=dhi.io/build:2-debian13

image: dhi.io/pkg-aws-sdk-cpp
variant: runtime
tags:
  - 1.11.903
  - 1.11.903-r0
  - 1.11.903-debian13
  - 1.11.903-r0-debian13
platforms:
  - linux/amd64
  - linux/arm64
vars:
  COMMIT_SHA: 24bc80d0111e1dd12fb31fd71c8acceba9a7130d
  REL: "0"
  SEMVER_MAJOR_MINOR_VERSION: "1.11"
  SEMVER_MAJOR_VERSION: "1"
  SEMVER_VERSION: 1.11.903
  VERSION: 1.11.903
contents:
  packages:
    - base-files
  builds:
    - name: aws-sdk-cpp
      work-dir: ${source.dir}/aws-sdk-cpp
      contents:
        packages:
          - base-files
          - bash
          - coreutils
          - findutils
          - sed
          - grep
          - build-essential
          - cmake
          - git
          - ca-certificates
          - pkg-config
          - libcurl4-openssl-dev
          - libssl-dev
          - zlib1g-dev
        files:
          - url: git+https://github.com/aws/aws-sdk-cpp.git#1.11.903
            checksum: 24bc80d0111e1dd12fb31fd71c8acceba9a7130d
            path: ${source.dir}/aws-sdk-cpp
            spdx:
              name: aws-sdk-cpp
              version: 1.11.903
              packages:
                - name: aws-sdk-cpp
                  purl: pkg:generic/aws/aws-sdk-cpp@1.11.903
                  license: Apache-2.0
            uid: 0
            gid: 0
      pipeline:
        - name: configure and build aws-sdk-cpp
          privileged: true
          runs: |
            set -eux -o pipefail

            git submodule update --init --recursive --depth 1

            cmake -S . -B build \
              -DCUSTOM_MEMORY_MANAGEMENT=0 \
              -DBUILD_SHARED_LIBS=OFF \
              -DBUILD_ONLY="ec2;s3" \
              -DFORCE_CURL=ON \
              -DUSE_OPENSSL=ON \
              -DENABLE_TESTING=OFF \
              -DCMAKE_BUILD_TYPE=Release \
              -DCMAKE_INSTALL_PREFIX=/usr

            make -C build -j"$(nproc)"
            DESTDIR="${target.dir}" make -C build install
        - uses: dhi/build-pkg:0
          with:
            description: AWS SDK for C++ (EC2, S3) static libraries and headers
            files:
              - usr
            formats:
              - deb
            license: Apache-2.0
            name: aws-sdk-cpp
            rel: 0
            url: https://github.com/aws/aws-sdk-cpp
            version: 1.11.903
os-release:
  name: Docker Hardened Images (Debian)
  id: debian
  version-id: "13"
  version-codename: trixie
  pretty-name: Docker Hardened Images/Debian GNU/Linux 13 (trixie)
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
