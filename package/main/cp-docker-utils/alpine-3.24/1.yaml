  VERSION: 1.0.18
contents:
  repositories:
    - https://dhi.io/apk/alpine/v3.24/main
    - https://dhi.io/apk/alpine/v3.23/main
    - https://dl-cdn.alpinelinux.org/alpine/v3.24/main
    - https://dl-cdn.alpinelinux.org/alpine/v3.24/community
  keyring:
    - https://dhi.io/keyring/dhi-apk@docker-0F81AD7700D99184.rsa.pub
  packages:
    - alpine-baselayout-data
  builds:
    - name: cp-docker-utils-1
      work-dir: /go/src/github.com/confluentinc/cp-docker-utils
      caches:
        - path: /root/.cache/go-build
      contents:
        packages:
          - bash
          - busybox
          - ca-certificates-bundle
          - coreutils
          - findutils
          - golang-1.26=1.26.9-r0
          - golang-1.26-oci-config=1.26.9-r0
          - mawk
          - sed
        files:
          - url: git+https://github.com/confluentinc/cp-docker-utils.git#v1.0.18
            checksum: c7c6b58b1a3133705bb0a54ecef00ce45dae704f
            path: /go/src/github.com/confluentinc/cp-docker-utils
            spdx:
              name: cp-docker-utils
              version: 1.0.18
              packages:
                - name: cp-docker-utils
                  purl: pkg:golang/github.com/confluentinc/cp-docker-utils@1.0.18
                  license: Apache-2.0
            uid: 0
            gid: 0
      pipeline:
        - name: update go dependencies
          uses: go/bump@v2
          with:
            deps: []
            download: true
        - uses: go/hermetic@v1
        - name: test
          runs: |
            set -eux -o pipefail

            GODEBUG= go test ./... -count=1 -skip '^Test_path$/^file_not_(readable|writable)$'
        - name: build ub
          uses: go/build@v1
          with:
            fips: false
            ldflags:
              - -s
              - -w
            output: ${target.dir}/usr/bin/ub
            packages: ./cmd/ub
        - name: build ub dev
          uses: go/build@v1
          with:
            fips: false
            output: ${target.dir}/usr/bin/ub-dev
            packages: ./cmd/ub
            strip: false
        - uses: dhi/build-pkg:0
          with:
            description: ub, the Go utility the Confluent Platform launch scripts call
            files:
              - usr/bin/ub
            license: Apache-2.0
            name: cp-docker-utils-1
            rel: 1
            subpackages:
              - files:
                  - path: usr/bin/ub
                    source: usr/bin/ub-dev
                name: cp-docker-utils-1-dev
            url: https://github.com/confluentinc/cp-docker-utils
            version: 1.0.18
