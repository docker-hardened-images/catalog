# syntax=dhi.io/build:2-debian13

image: dhi.io/pkg-langfuse
variant: runtime
tags:
  - 2.95.12-r10
  - 2.95.12-r10-debian13
platforms:
  - linux/amd64
  - linux/arm64
dates:
  release: "2024-01-30"
vars:
  COMMIT_SHA: 565ff73591365394a24e047973c15e69d6ffca93
  DHI_VERSION: 2.95.12-10
  NODEJS_VERSION: 24.22.2-0
  PACKAGE_NAME: langfuse-2
  PNPM_VERSION: 9.5.0
  PRISMA_VERSION: 5.22.0
  REL: "10"
  SEMVER_MAJOR_MINOR_VERSION: "2.95"
  SEMVER_MAJOR_VERSION: "2"
  SEMVER_VERSION: 2.95.12
  TURBO_VERSION: 1.13.4
  VERSION: 2.95.12
contents:
  repositories:
    - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
  keyring:
    - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
  packages:
    - base-files
  builds:
    - name: langfuse
      work-dir: ${source.dir}/langfuse
      environment:
        CI: "true"
        DOCKER_BUILD: "1"
        NEXT_MANUAL_SIG_HANDLE: "true"
        NEXT_TELEMETRY_DISABLED: "1"
        PNPM_HOME: /pnpm
        SEMVER_MAJOR_VERSION: "2"
      caches:
        - path: /pnpm/store
        - path: /root/.cache
      contents:
        repositories:
          - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
        keyring:
          - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
        packages:
          - base-files
          - bash
          - ca-certificates
          - coreutils
          - curl
          - debhelper
          - dpkg-dev
          - findutils
          - git
          - libc6
          - libstdc++6
          - mawk
          - nodejs-24=24.22.2-0
          - node-corepack
          - npm
          - sed
          - yarn-classic
          - yq-go
        files:
          - url: git+https://github.com/langfuse/langfuse.git#v2.95.12
            checksum: 565ff73591365394a24e047973c15e69d6ffca93
            path: ${source.dir}/langfuse
            spdx:
              name: langfuse
              version: 2.95.12
              packages:
                - name: langfuse
                  purl: pkg:github/langfuse/langfuse@2.95.12
                  license: MIT
            uid: 0
            gid: 0
      pipeline:
        - name: build and stage web (v2)
          privileged: true
          runs: |
            set -eux -o pipefail

            corepack enable
            corepack prepare pnpm@9.5.0 --activate
            npm install -g --no-package-lock --no-save turbo@1.13.4
            export PATH="$(npm config get prefix)/bin:${PATH}"
            rm -f ./web/src/middleware.ts
            turbo prune --scope=web --docker
            cd ./out
            cp -a json/. .
            node -e '
              const fs = require("fs");
              const p = JSON.parse(fs.readFileSync("package.json", "utf8"));
              p.pnpm = p.pnpm || {};
              // Remove upstream pnpm patch so next-auth can be upgraded
              if (p.pnpm.patchedDependencies) delete p.pnpm.patchedDependencies["next-auth@4.24.11"];
              Object.assign(p.pnpm.overrides = p.pnpm.overrides || {}, {
                "axios":             "1.20.0",  // CVE-2026-101898..101909, CVE-2026-101899..101908 (HIGH/MED)
                "fast-uri":          "3.1.9",   // CVE-2026-75899, CVE-2026-75931, CVE-2026-75975, CVE-2026-76172, CVE-2026-84292, CVE-2026-110180, CVE-2026-110306 (HIGH/MED)
                "langsmith":         "0.6.0",   // CVE-2026-45134 (HIGH), CVE-2026-40190, CVE-2026-41182 (MED)
                "nodemailer":        "9.1.1",   // GHSA-2x7j-588g-ccc2 (HIGH); GHSA-8m3c-c648-2xjj fixed in 9.1.1
                "brace-expansion":   "1.1.13",  // CVE-2026-33750 (MED), CVE-2025-5889 (LOW)
                "fast-xml-parser":   "5.7.0",   // CVE-2026-41650 (MED)
                "qs":                "6.16.1",  // CVE-2026-110816 (MED)
                "@tootallnate/once": "3.0.1",   // CVE-2026-3449 (LOW)
                "protobufjs":        "7.6.5",   // CVE-2026-45740 (MED), CVE-2026-44288..44294 (HIGH/MED), CVE-2026-59877 (MED)
                "@protobufjs/utf8":  "1.1.1",   // CVE-2026-44288 (MED)
                "postcss":           "8.5.23",  // CVE-2026-73646 (HIGH); CVE-2026-69153 fixed in 8.5.23
                "form-data":         "4.0.6",   // CVE-2025-7783 (CRITICAL), CVE-2026-12143 (HIGH)
                "follow-redirects":  "1.16.2",  // CVE-2026-111755, CVE-2026-111756 (HIGH); CVE-2026-116689
                "@babel/runtime":    "7.29.2",  // CVE-2025-27789 (MED)
                "@langchain/core":   "0.3.80",  // CVE-2025-68665 (HIGH); same 0.3 line as resolved 0.3.18
                "next":              "14.2.35", // CVE-2026-75604, GHSA-2464-fhr4-w9xw — fix requires Next 15+ (major)
                "next-auth":         "4.24.15", // GHSA-XMF8-CVQR-RFGJ
                "shell-quote":       "1.11.0",  // CVE-2026-102422 (CRITICAL)
                "esbuild":           "0.28.1",  // GHSA-gv7w-rqvm-qjhr (HIGH)
                "@grpc/grpc-js":     ">=1.14.5",// CVE-2026-101916 (HIGH)
                "dompurify":         "3.4.17",  // GHSA-cg2g-xh64-v4q7, GHSA-mrv2-3pqr-j5jr (CRITICAL/HIGH)
                "path-to-regexp":    "0.1.13",  // CVE-2024-52798, CVE-2026-4867 (HIGH)
                "source-map-js":     "1.2.2",   // CVE-2026-93749 (HIGH)
                "lodash":            "4.18.0",  // CVE-2026-4800, CVE-2026-2950 (HIGH/MED)
                "picomatch":         "2.3.2",   // CVE-2026-33671, CVE-2026-33672 (HIGH/MED)
                "picomatch@4":       "4.0.4",   // CVE-2026-33671, CVE-2026-33672 (HIGH/MED)
                "nanoid":            "3.3.18",  // CVE-2026-67213..67214, CVE-2026-73086 (HIGH)
                "browserslist":      "4.28.7",  // CVE-2026-73088, CVE-2026-73089 (HIGH)
                "@trpc/server":      "10.45.3", // CVE-2025-68130 (HIGH)
                "rollup":            "3.30.0",  // CVE-2026-27606 (HIGH)
                "dd-trace":          "5.131.1", // CVE-2026-116693 (HIGH)
                "kysely":            "0.28.17", // CVE-2026-32763, CVE-2026-33468, CVE-2026-44635 (HIGH)
                // CVE-2026-59892 is fixed only in @opentelemetry/propagator-jaeger 2.9.0; keep upstream 1.26.0.
                "js-yaml@3":         "3.15.2",  // CVE-2026-59869, CVE-2026-84375, GHSA-5p4m-2wfm-xmqj (HIGH)
                "js-yaml@4":         "4.3.2",   // CVE-2026-59869, CVE-2026-84375, GHSA-5p4m-2wfm-xmqj (HIGH)
                "vite":              "5.4.21",  // newest Vite 5; 7.3.7 is a major upgrade
                "vitest":            "2.1.9",
              });
              fs.writeFileSync("package.json", JSON.stringify(p, null, 2) + "\n");
            '
            pnpm install ---lockfile-only --ignore-scripts
            pnpm install ---frozen-lockfile --ignore-scripts
            cp -a full/. .
            node -e '
              const fs = require("fs");
              const f = "./web/next.config.mjs";
              let s = fs.readFileSync(f, "utf8");
              const extra = "cpus: 1, workerThreads: false, outputFileTracingExcludes: { \"*\": [\"node_modules/@esbuild/**\"] },";
              if (/experimental:\s*\{/.test(s)) {
                s = s.replace(/experimental:\s*\{/, "experimental: { " + extra);
              } else {
                s = s.replace(/const nextConfig = \{/, "const nextConfig = {\n  experimental: { " + extra + " },");
              }
              if (!/typescript:\s*\{/.test(s)) {
                s = s.replace(/const nextConfig = \{/, "const nextConfig = {\n  typescript: { ignoreBuildErrors: true },");
              }
              if (!/eslint:\s*\{/.test(s)) {
                s = s.replace(/const nextConfig = \{/, "const nextConfig = {\n  eslint: { ignoreDuringBuilds: true },");
              }
              if (/webpack\(config[^)]*\)\s*\{/.test(s)) {
                s = s.replace(/(webpack\(config[^)]*\)\s*\{)/, "$1\n    config.optimization = { ...(config.optimization || {}), minimize: false };");
              } else {
                s = s.replace(/const nextConfig = \{/, "const nextConfig = {\n  webpack: (config) => { config.optimization = { ...(config.optimization || {}), minimize: false }; return config; },");
              }
              s = s.replace(/export\s+default\s+withSentryConfig\([^]*$/, "export default nextConfig;\n");
              fs.writeFileSync(f, s);
            '
            HEAP_MB=$(node -e 'console.log(Math.min(5120, Math.floor(require("os").totalmem()/1024/1024*0.6)))')
            NODE_OPTIONS="--max-old-space-size=${HEAP_MB}" \
              turbo run build --filter=web... --concurrency=1
            mkdir -p "${target.dir}/usr/lib/langfuse-2/prisma"
            npm install -g --no-package-lock --no-save \
              --prefix "${target.dir}/usr/lib/langfuse-2/prisma" \
              prisma@5.22.0
            find "${target.dir}/usr/lib/langfuse-2/prisma" -type f \
              \( -name '*.js' -o -name 'prisma' \) \
              -exec sed -i '1s|^#!/usr/bin/env node$|#!/usr/bin/node|' {} +
            mkdir -p "${target.dir}/usr/lib/langfuse-2/web/.next" \
              "${target.dir}/usr/lib/langfuse-2/packages/shared/scripts"
            cp -a ./web/.next/standalone/. "${target.dir}/usr/lib/langfuse-2/"
            cp -a ./web/.next/static "${target.dir}/usr/lib/langfuse-2/web/.next/static"
            cp -a ./web/public "${target.dir}/usr/lib/langfuse-2/web/public"
            cp -a ./packages/shared/prisma "${target.dir}/usr/lib/langfuse-2/packages/shared/prisma"
            if [ -f ./packages/shared/clickhouse/scripts/up.sh ]; then
              sed -i -E \
                -e 's| && source | \&\& . |g' \
                -e 's|&> /dev/null|>/dev/null 2>\&1|g' \
                -e 's|" == "|" = "|g' \
                ./packages/shared/clickhouse/scripts/up.sh
            fi
            cp -a ./packages/shared/clickhouse "${target.dir}/usr/lib/langfuse-2/packages/shared/clickhouse"
            cp ./web/next.config.mjs "${target.dir}/usr/lib/langfuse-2/next.config.mjs"
            cp ./web/package.json "${target.dir}/usr/lib/langfuse-2/package.json"
            cp ./web/entrypoint.sh "${target.dir}/usr/lib/langfuse-2/web/entrypoint.sh"
            chmod +x "${target.dir}/usr/lib/langfuse-2/web/entrypoint.sh"
            cp ./packages/shared/scripts/cleanup.sql \
              "${target.dir}/usr/lib/langfuse-2/packages/shared/scripts/cleanup.sql"
        - name: generate production sbom
          uses: sbom@v1
          with:
            extra-scanners: javascript-package-cataloger
            prefix: langfuse-2-node-modules
            source: ${target.dir}/usr/lib/langfuse-2
        - name: stage built payload for dpkg
          runs: |
            set -eux -o pipefail

            rm -rf "${source.dir}/langfuse-pkg/pkg-staging"
            mkdir -p "${source.dir}/langfuse-pkg/pkg-staging"
            cp -a "${target.dir}/usr/lib/langfuse-2/." "${source.dir}/langfuse-pkg/pkg-staging/"
        - name: prepare debian metadata
          runs: |
            set -eux -o pipefail

            cd "${source.dir}/langfuse-pkg"
            sed -i "s/@MAJOR@/2/g" debian/control.in debian/changelog debian/langfuse.install
            mv debian/control.in debian/control
            mv debian/langfuse.install "debian/langfuse-2.install"
            chmod +x debian/rules
            chmod -x "debian/langfuse-2.install"
        - uses: dpkg/bump@v1
          work-dir: ${source.dir}/langfuse-pkg
          with:
            changelog:
              - DHI Build
            version: 2.95.12-10
        - uses: dpkg/build@v1
          work-dir: ${source.dir}/langfuse-pkg
          with:
            args: -b -uc -us -d
      paths:
        - type: directory
          path: ${source.dir}/langfuse-pkg/debian
          uid: 0
          gid: 0
          mode: "0644"
          source: package/main/langfuse/debian-13/debian
os-release:
  name: Docker Hardened Images (Debian)
  id: debian
  version-id: "13"
  version-codename: trixie
  pretty-name: Docker Hardened Images/Debian GNU/Linux 13 (trixie)
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
