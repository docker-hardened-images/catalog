# syntax=dhi.io/build:2-debian13

image: dhi.io/pkg-langfuse
variant: runtime
tags:
  - 3.225.1-1
  - 3.225.1-1-debian13
platforms:
  - linux/amd64
  - linux/arm64
dates:
  release: "2024-12-09"
vars:
  COMMIT_SHA: f06a773b8c1295bc1e1af788668a03c453dcd46a
  DHI_REL: "1"
  DHI_VERSION: 3.225.1-1
  NODEJS_VERSION: 24.19.0-0
  PACKAGE_NAME: langfuse-3
  PNPM_VERSION: 11.1.3
  PRISMA_VERSION: 6.19.3
  REL: "1"
  SEMVER_MAJOR_MINOR_VERSION: "3.225"
  SEMVER_MAJOR_VERSION: "3"
  SEMVER_VERSION: 3.225.1
  TURBO_VERSION: 2.9.14
  VERSION: 3.225.1
contents:
  repositories:
    - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
  keyring:
    - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
  packages:
    - base-files
  builds:
    - name: langfuse
      work-dir: ${source.dir}/langfuse
      environment:
        CI: "true"
        DOCKER_BUILD: "1"
        NEXT_MANUAL_SIG_HANDLE: "true"
        NEXT_TELEMETRY_DISABLED: "1"
        PNPM_HOME: /pnpm
        SEMVER_MAJOR_VERSION: "3"
      caches:
        - path: /pnpm/store
        - path: /root/.cache
      contents:
        repositories:
          - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
        keyring:
          - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
        packages:
          - base-files
          - bash
          - ca-certificates
          - coreutils
          - curl
          - debhelper
          - dpkg-dev
          - findutils
          - git
          - libc6
          - libstdc++6
          - mawk
          - nodejs-24=24.19.0-0
          - node-corepack
          - npm
          - sed
          - yarn-classic
          - yq-go
        files:
          - url: git+https://github.com/langfuse/langfuse.git#v3.225.1
            checksum: f06a773b8c1295bc1e1af788668a03c453dcd46a
            path: ${source.dir}/langfuse
            spdx:
              name: langfuse
              version: 3.225.1
              packages:
                - name: langfuse
                  purl: pkg:github/langfuse/langfuse@3.225.1
                  license: MIT
            uid: 0
            gid: 0
      pipeline:
        - name: build and stage web (v3)
          privileged: true
          runs: |
            set -eux -o pipefail

            ARCH=$(uname -m)
            case "$ARCH" in
              x86_64) YQ_ARCH=amd64 ;;
              aarch64) YQ_ARCH=arm64 ;;
              *)
                echo "unsupported arch: $ARCH" >&2
                exit 1
                ;;
            esac
            mkdir -p /usr/local/bin
            curl -fsSL "https://github.com/mikefarah/yq/releases/download/v4.44.6/yq_linux_${YQ_ARCH}" -o /usr/local/bin/yq
            chmod +x /usr/local/bin/yq
            export PATH="/usr/local/bin:${PATH}"
            corepack enable
            corepack prepare pnpm@11.1.3 --activate
            npm install -g --no-package-lock --no-save turbo@2.9.14
            export PATH="$(npm config get prefix)/bin:${PATH}"
            export PATH="/usr/local/bin:${PATH}"
            turbo prune --scope=web --docker
            cd ./out
            cp -a json/. .
            cp -a full/. .
            npm pkg set packageManager=pnpm@11.1.3
            yq -i '.minimumReleaseAge = 0' pnpm-workspace.yaml
            yq -i '.overrides."axios" = "1.16.0"' pnpm-workspace.yaml
            yq -i '.overrides."fast-uri" = "3.1.4"' pnpm-workspace.yaml
            yq -i '.overrides."langsmith" = "0.6.0"' pnpm-workspace.yaml
            yq -i '.overrides."nodemailer" = "9.0.1"' pnpm-workspace.yaml
            yq -i '.overrides."brace-expansion" = "5.0.5"' pnpm-workspace.yaml
            yq -i '.overrides."brace-expansion@2" = "2.1.2"' pnpm-workspace.yaml
            yq -i '.overrides."fast-xml-parser" = "5.7.0"' pnpm-workspace.yaml
            yq -i '.overrides."qs" = "6.15.2"' pnpm-workspace.yaml
            yq -i '.overrides."@tootallnate/once" = "3.0.1"' pnpm-workspace.yaml
            yq -i '.overrides."protobufjs" = "7.6.5"' pnpm-workspace.yaml
            yq -i '.overrides."@protobufjs/utf8" = "1.1.1"' pnpm-workspace.yaml
            yq -i '.overrides."postcss" = "8.5.14"' pnpm-workspace.yaml
            yq -i '.overrides."form-data" = "4.0.6"' pnpm-workspace.yaml
            yq -i '.overrides."follow-redirects" = "1.16.0"' pnpm-workspace.yaml
            yq -i '.overrides."@babel/runtime" = "7.29.2"' pnpm-workspace.yaml
            yq -i '.overrides."@babel/core" = "7.29.6"' pnpm-workspace.yaml
            yq -i '.overrides."@opentelemetry/exporter-prometheus" = "0.217.0"' pnpm-workspace.yaml
            yq -i '.overrides."@opentelemetry/sdk-node" = "0.217.0"' pnpm-workspace.yaml
            yq -i '.overrides."shell-quote" = "1.9.0"' pnpm-workspace.yaml
            yq -i '.overrides."esbuild" = "0.28.1"' pnpm-workspace.yaml
            yq -i '.overrides."@grpc/grpc-js" = ">=1.14.4"' pnpm-workspace.yaml
            yq -i '.overrides."dompurify" = "3.4.11"' pnpm-workspace.yaml
            yq -i '.overrides."@opentelemetry/core" = "2.8.0"' pnpm-workspace.yaml
            yq -i 'del(.patchedDependencies."next-auth@4.24.14")' pnpm-workspace.yaml
            yq -i '.overrides."next-auth" = "4.24.15"' pnpm-workspace.yaml
            pnpm install ---lockfile-only --ignore-scripts
            pnpm install ---frozen-lockfile --ignore-scripts
            rm -f /src/langfuse/pnpm-workspace.yaml /src/langfuse/pnpm-lock.yaml
            node -e '
              const fs = require("fs");
              const f = "./web/package.json";
              const p = JSON.parse(fs.readFileSync(f, "utf8"));
              p.scripts.build = p.scripts.build.replace(/(\s|^)next build(\s|$)/, "$1next build --webpack$2");
              fs.writeFileSync(f, JSON.stringify(p, null, 2) + "\n");
            '
            node -e '
              const fs = require("fs");
              const f = "./web/next.config.mjs";
              let s = fs.readFileSync(f, "utf8");
              const extra = "cpus: 1, workerThreads: false, esmExternals: \"loose\",";
              if (/experimental:\s*\{/.test(s)) {
                s = s.replace(/experimental:\s*\{/, "experimental: { " + extra);
              } else {
                s = s.replace(/const nextConfig = \{/, "const nextConfig = {\n  experimental: { " + extra + " },");
              }
              if (!/outputFileTracingExcludes:/.test(s)) {
                s = s.replace(/const nextConfig = \{/, "const nextConfig = {\n  outputFileTracingExcludes: { \"*\": [\"node_modules/@esbuild/**\"] },");
              }
              if (!/outputFileTracingRoot:/.test(s)) {
                s = s.replace(/const nextConfig = \{/, "const nextConfig = {\n  outputFileTracingRoot: new URL(\"..\", import.meta.url).pathname,");
              }
              if (!/typescript:\s*\{/.test(s)) {
                s = s.replace(/const nextConfig = \{/, "const nextConfig = {\n  typescript: { ignoreBuildErrors: true },");
              }
              s = s.replace(/export\s+default\s+withSentryConfig\([^]*$/, "export default nextConfig;\n");
              fs.writeFileSync(f, s);
            '
            HEAP_MB=$(node -e 'console.log(Math.min(8192, Math.floor(require("os").totalmem()/1024/1024*0.45)))')
            NODE_OPTIONS="--max-old-space-size=${HEAP_MB}" \
              NEXT_IGNORE_BUILD_ERRORS=true \
              turbo run build --filter=web... --concurrency=1
            mkdir -p "${target.dir}/usr/lib/langfuse-3/prisma"
            npm install -g --no-package-lock --no-save \
              --prefix "${target.dir}/usr/lib/langfuse-3/prisma" \
              prisma@6.19.3
            find "${target.dir}/usr/lib/langfuse-3/prisma" -type f \
              \( -name '*.js' -o -name 'prisma' \) \
              -exec sed -i '1s|^#!/usr/bin/env node$|#!/usr/bin/node|' {} +
            mkdir -p "${target.dir}/usr/lib/langfuse-3/web/.next" \
              "${target.dir}/usr/lib/langfuse-3/packages/shared/scripts"
            cp -a ./web/.next/standalone/. "${target.dir}/usr/lib/langfuse-3/"
            cp -a ./web/.next/static "${target.dir}/usr/lib/langfuse-3/web/.next/static"
            cp -a ./web/public "${target.dir}/usr/lib/langfuse-3/web/public"
            cp -a ./packages/shared/prisma "${target.dir}/usr/lib/langfuse-3/packages/shared/prisma"
            if [ -f ./packages/shared/clickhouse/scripts/up.sh ]; then
              sed -i -E \
                -e 's| && source | \&\& . |g' \
                -e 's|&> /dev/null|>/dev/null 2>\&1|g' \
                -e 's|" == "|" = "|g' \
                ./packages/shared/clickhouse/scripts/up.sh
            fi
            cp -a ./packages/shared/clickhouse "${target.dir}/usr/lib/langfuse-3/packages/shared/clickhouse"
            cp ./web/next.config.mjs "${target.dir}/usr/lib/langfuse-3/next.config.mjs"
            cp ./web/package.json "${target.dir}/usr/lib/langfuse-3/package.json"
            cp ./web/entrypoint.sh "${target.dir}/usr/lib/langfuse-3/web/entrypoint.sh"
            chmod +x "${target.dir}/usr/lib/langfuse-3/web/entrypoint.sh"
            sed -i -E \
              -e 's|_stripped=\$\(printf.*"\$_val".*sed.*\)|_stripped="$_val"|' \
              -e 's|_stripped=\$\(printf.*"\$_pass".*sed.*\)|_stripped="$_pass"|' \
              "${target.dir}/usr/lib/langfuse-3/web/entrypoint.sh"
            cp ./packages/shared/scripts/cleanup.sql \
              "${target.dir}/usr/lib/langfuse-3/packages/shared/scripts/cleanup.sql"
        - name: stage built payload for dpkg
          runs: |
            set -eux -o pipefail

            rm -rf "${source.dir}/langfuse-pkg/pkg-staging"
            mkdir -p "${source.dir}/langfuse-pkg/pkg-staging"
            cp -a "${target.dir}/usr/lib/langfuse-3/." "${source.dir}/langfuse-pkg/pkg-staging/"
        - name: prepare debian metadata
          runs: |
            set -eux -o pipefail

            cd "${source.dir}/langfuse-pkg"
            sed -i "s/@MAJOR@/3/g" debian/control.in debian/changelog debian/langfuse.install
            mv debian/control.in debian/control
            mv debian/langfuse.install "debian/langfuse-3.install"
            chmod +x debian/rules
            chmod -x "debian/langfuse-3.install"
        - uses: dpkg/bump@v1
          work-dir: ${source.dir}/langfuse-pkg
          with:
            changelog:
              - DHI Build
            version: 3.225.1-1
        - uses: dpkg/build@v1
          work-dir: ${source.dir}/langfuse-pkg
          with:
            args: -b -uc -us -d
      paths:
        - type: directory
          path: ${source.dir}/langfuse-pkg/debian
          uid: 0
          gid: 0
          mode: "0644"
          source: package/main/langfuse/debian-13/debian
os-release:
  name: Docker Hardened Images (Debian)
  id: debian
  version-id: "13"
  version-codename: trixie
  pretty-name: Docker Hardened Images/Debian GNU/Linux 13 (trixie)
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
