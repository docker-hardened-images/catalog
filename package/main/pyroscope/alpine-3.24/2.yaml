# syntax=dhi.io/build:2-alpine3.24

image: dhi.io/pkg-pyroscope
variant: runtime
tags:
  - 2.4.2-alpine3.24
  - 2.4.2-r1-alpine3.24
platforms:
  - linux/amd64
  - linux/arm64
vars:
  COMMIT_SHA: 10a78e5ef038f8b97d6966bc76f1cf21bb5616ac
  GOLANG_MAJOR_MINOR_VERSION: "1.26"
  GOLANG_VERSION: 1.26.10-r0
  PACKAGE_NAME: pyroscope-2.4
  REL: "1"
  SEMVER_MAJOR_MINOR_VERSION: "2.4"
  SEMVER_MAJOR_VERSION: "2"
  SEMVER_VERSION: 2.4.2
  VERSION: 2.4.2
contents:
  repositories:
    - https://dhi.io/apk/alpine/v3.24/main
    - https://dhi.io/apk/alpine/v3.23/main
    - https://dl-cdn.alpinelinux.org/alpine/v3.24/main
    - https://dl-cdn.alpinelinux.org/alpine/v3.24/community
  keyring:
    - https://dhi.io/keyring/dhi-apk@docker-0F81AD7700D99184.rsa.pub
  packages:
    - alpine-baselayout-data
  builds:
    - name: pyroscope-2.4
      work-dir: /go/src/github.com/grafana/pyroscope
      contents:
        packages:
          - busybox
          - bash
          - ca-certificates-bundle
          - coreutils
          - findutils
          - git
          - grep
          - mawk
          - sed
          - golang-1.26=1.26.10-r0
          - golang-1.26-oci-config=1.26.10-r0
        files:
          - url: git+https://github.com/grafana/pyroscope.git#v2.4.2
            checksum: 10a78e5ef038f8b97d6966bc76f1cf21bb5616ac
            path: /go/src/github.com/grafana/pyroscope
            spdx:
              name: pyroscope
              version: 2.4.2
              packages:
                - name: pyroscope
                  purl: pkg:golang/github.com/grafana/pyroscope@2.4.2
                  license: AGPL-3.0
            uid: 0
            gid: 0
      pipeline:
        - name: update go dependencies (2 only)
          uses: go/bump@v2
          work-dir: /go/src/github.com/grafana/pyroscope
          with:
            deps:
              - go.etcd.io/etcd/client/pkg/v3@v3.6.14
              - github.com/go-jose/go-jose/v4@v4.1.6
              - github.com/klauspost/compress@v1.18.7
              - golang.org/x/net@v0.62.0
            replaces:
              - go.etcd.io/etcd/client/pkg/v3=go.etcd.io/etcd/client/pkg/v3@v3.6.14
            tidy: true
        - name: build pyroscope (2 only)
          uses: go/build@v1
          work-dir: /go/src/github.com/grafana/pyroscope
          with:
            fips: false
            ldflags:
              - -s
              - -w
              - -X github.com/grafana/pyroscope/v2/pkg/util/build.Version=2.4.2
              - -X github.com/grafana/pyroscope/v2/pkg/util/build.Revision=10a78e5ef038f8b97d6966bc76f1cf21bb5616ac
              - -X github.com/grafana/pyroscope/v2/pkg/util/build.Branch=2.4.2
              - -X github.com/grafana/pyroscope/v2/pkg/util/build.BuildDate=$(date -ud @${SOURCE_DATE_EPOCH} +'%Y-%m-%dT%H:%M:%SZ')
            output: ${target.dir}/usr/bin/pyroscope
            packages: ./cmd/pyroscope
        - name: build profilecli (2 only)
          uses: go/build@v1
          work-dir: /go/src/github.com/grafana/pyroscope
          with:
            fips: false
            ldflags:
              - -s
              - -w
              - -X github.com/grafana/pyroscope/v2/pkg/util/build.Version=2.4.2
              - -X github.com/grafana/pyroscope/v2/pkg/util/build.Revision=10a78e5ef038f8b97d6966bc76f1cf21bb5616ac
              - -X github.com/grafana/pyroscope/v2/pkg/util/build.Branch=2.4.2
              - -X github.com/grafana/pyroscope/v2/pkg/util/build.BuildDate=$(date -ud @${SOURCE_DATE_EPOCH} +'%Y-%m-%dT%H:%M:%SZ')
            output: ${target.dir}/usr/bin/profilecli
            packages: ./cmd/profilecli
        - name: build pyroscope dev (2 only)
          uses: go/build@v1
          work-dir: /go/src/github.com/grafana/pyroscope
          with:
            fips: false
            ldflags:
              - -X github.com/grafana/pyroscope/v2/pkg/util/build.Version=2.4.2
              - -X github.com/grafana/pyroscope/v2/pkg/util/build.Revision=10a78e5ef038f8b97d6966bc76f1cf21bb5616ac
              - -X github.com/grafana/pyroscope/v2/pkg/util/build.Branch=2.4.2
              - -X github.com/grafana/pyroscope/v2/pkg/util/build.BuildDate=$(date -ud @${SOURCE_DATE_EPOCH} +'%Y-%m-%dT%H:%M:%SZ')
            output: ${target.dir}/usr/bin/pyroscope-dev
            packages: ./cmd/pyroscope
            strip: false
        - name: build profilecli dev (2 only)
          uses: go/build@v1
          work-dir: /go/src/github.com/grafana/pyroscope
          with:
            fips: false
            ldflags:
              - -X github.com/grafana/pyroscope/v2/pkg/util/build.Version=2.4.2
              - -X github.com/grafana/pyroscope/v2/pkg/util/build.Revision=10a78e5ef038f8b97d6966bc76f1cf21bb5616ac
              - -X github.com/grafana/pyroscope/v2/pkg/util/build.Branch=2.4.2
              - -X github.com/grafana/pyroscope/v2/pkg/util/build.BuildDate=$(date -ud @${SOURCE_DATE_EPOCH} +'%Y-%m-%dT%H:%M:%SZ')
            output: ${target.dir}/usr/bin/profilecli-dev
            packages: ./cmd/profilecli
            strip: false
        - name: install config
          runs: |
            set -eux -o pipefail

            mkdir -p "${target.dir}/etc/pyroscope"
            cp -a cmd/pyroscope/pyroscope.yaml "${target.dir}/etc/pyroscope/config.yaml"
        - uses: dhi/build-pkg:0
          with:
            description: Grafana Pyroscope continuous profiling system
            files:
              - usr/bin/pyroscope
              - usr/bin/profilecli
              - etc/pyroscope/config.yaml
            license: AGPL-3.0
            name: pyroscope-2.4
            rel: 1
            subpackages:
              - files:
                  - path: usr/bin/pyroscope
                    source: usr/bin/pyroscope-dev
                  - path: usr/bin/profilecli
                    source: usr/bin/profilecli-dev
                name: pyroscope-2.4-dev
            url: https://github.com/grafana/pyroscope
            version: 2.4.2
