# syntax=dhi.io/build:2-alpine3.24

image: dhi.io/pkg-pyroscope
variant: runtime
tags:
  - 1.15.3-alpine3.24
  - 1.15.3-r2-alpine3.24
platforms:
  - linux/amd64
  - linux/arm64
vars:
  COMMIT_SHA: c7f6f34e8b697db6ae09771e983638cfcdb67c1a
  GOLANG_MAJOR_MINOR_VERSION: "1.26"
  GOLANG_VERSION: 1.26.7-r0
  PACKAGE_NAME: pyroscope-1.15
  REL: "2"
  SEMVER_MAJOR_MINOR_VERSION: "1.15"
  SEMVER_MAJOR_VERSION: "1"
  SEMVER_VERSION: 1.15.3
  VERSION: 1.15.3
contents:
  repositories:
    - https://dhi.io/apk/alpine/v3.24/main
    - https://dhi.io/apk/alpine/v3.23/main
    - https://dl-cdn.alpinelinux.org/alpine/v3.24/main
    - https://dl-cdn.alpinelinux.org/alpine/v3.24/community
  keyring:
    - https://dhi.io/keyring/dhi-apk@docker-0F81AD7700D99184.rsa.pub
  packages:
    - alpine-baselayout-data
  builds:
    - name: pyroscope-1.15
      work-dir: /go/src/github.com/grafana/pyroscope
      contents:
        packages:
          - busybox
          - bash
          - ca-certificates-bundle
          - coreutils
          - findutils
          - git
          - grep
          - mawk
          - sed
          - golang-1.26=1.26.7-r0
          - golang-1.26-oci-config=1.26.7-r0
        files:
          - url: git+https://github.com/grafana/pyroscope.git#v1.15.3
            checksum: c7f6f34e8b697db6ae09771e983638cfcdb67c1a
            path: /go/src/github.com/grafana/pyroscope
            spdx:
              name: pyroscope
              version: 1.15.3
              packages:
                - name: pyroscope
                  purl: pkg:golang/github.com/grafana/pyroscope@1.15.3
                  license: AGPL-3.0
            uid: 0
            gid: 0
      pipeline:
        - name: update go dependencies (1.15 only)
          uses: go/bump@v2
          work-dir: /go/src/github.com/grafana/pyroscope
          with:
            deps:
              - go.etcd.io/etcd/client/pkg/v3@v3.6.14
              - golang.org/x/crypto@v0.52.0
              - golang.org/x/mod@v0.40.0
              - github.com/go-jose/go-jose/v4@v4.1.4
              - github.com/buger/jsonparser@v1.1.2
              - github.com/klauspost/compress@v1.18.7
              - go.mongodb.org/mongo-driver@v1.17.7
              - go.opentelemetry.io/otel/sdk@v1.43.0
              - go.opentelemetry.io/otel/log@v0.19.0
              - go.opentelemetry.io/otel/sdk/log@v0.19.0
              - go.opentelemetry.io/otel/exporters/otlp/otlplog/otlploggrpc@v0.19.0
              - go.opentelemetry.io/otel/exporters/stdout/stdoutlog@v0.19.0
              - google.golang.org/grpc@v1.83.1
              - go.opentelemetry.io/otel/exporters/otlp/otlplog/otlploghttp@v0.19.0
              - go.opentelemetry.io/otel/exporters/otlp/otlpmetric/otlpmetrichttp@v1.43.0
              - go.opentelemetry.io/otel/exporters/otlp/otlptrace/otlptracehttp@v1.43.0
              - github.com/prometheus/prometheus@v0.311.3
              - github.com/google/gnostic@v0.7.1
            replaces:
              - go.etcd.io/etcd/client/pkg/v3=go.etcd.io/etcd/client/pkg/v3@v3.6.14
              - go.opentelemetry.io/otel/log=go.opentelemetry.io/otel/log@v0.19.0
              - go.opentelemetry.io/otel/sdk/log=go.opentelemetry.io/otel/sdk/log@v0.19.0
              - go.opentelemetry.io/otel/exporters/otlp/otlplog/otlploggrpc=go.opentelemetry.io/otel/exporters/otlp/otlplog/otlploggrpc@v0.19.0
              - go.opentelemetry.io/otel/exporters/otlp/otlplog/otlploghttp=go.opentelemetry.io/otel/exporters/otlp/otlplog/otlploghttp@v0.19.0
              - go.opentelemetry.io/otel/exporters/stdout/stdoutlog=go.opentelemetry.io/otel/exporters/stdout/stdoutlog@v0.19.0
            tidy: true
        - name: patch 1.15 filterAndGroupBlocks clock
          uses: patch@v1
          work-dir: /go/src/github.com/grafana/pyroscope
          with:
            options: -p1
            patches:
              - ${source.dir}/patch/handlers-time-fix-1.15.patch
        - name: patch prometheus ParseMetricSelector compat (1.15-1.16)
          uses: patch@v1
          work-dir: /go/src/github.com/grafana/pyroscope
          with:
            options: -p1
            patches:
              - ${source.dir}/patch/prometheus-parse-metric-selector-v1.15-1.16.patch
        - name: patch prometheus relabel Validate (1.15-1.19)
          uses: patch@v1
          work-dir: /go/src/github.com/grafana/pyroscope
          with:
            options: -p1
            patches:
              - ${source.dir}/patch/prometheus-relabel-validate-1.15-1.19.patch
        - name: build pyroscope
          uses: go/build@v1
          work-dir: /go/src/github.com/grafana/pyroscope
          with:
            fips: false
            ldflags:
              - -s
              - -w
              - -X github.com/grafana/pyroscope/pkg/util/build.Version=1.15.3
              - -X github.com/grafana/pyroscope/pkg/util/build.Revision=c7f6f34e8b697db6ae09771e983638cfcdb67c1a
              - -X github.com/grafana/pyroscope/pkg/util/build.Branch=1.15.3
              - -X github.com/grafana/pyroscope/pkg/util/build.BuildDate=$(date -ud @${SOURCE_DATE_EPOCH} +'%Y-%m-%dT%H:%M:%SZ')
            output: ${target.dir}/usr/bin/pyroscope
            packages: ./cmd/pyroscope
        - name: build profilecli
          uses: go/build@v1
          work-dir: /go/src/github.com/grafana/pyroscope
          with:
            fips: false
            ldflags:
              - -s
              - -w
              - -X github.com/grafana/pyroscope/pkg/util/build.Version=1.15.3
              - -X github.com/grafana/pyroscope/pkg/util/build.Revision=c7f6f34e8b697db6ae09771e983638cfcdb67c1a
              - -X github.com/grafana/pyroscope/pkg/util/build.Branch=1.15.3
              - -X github.com/grafana/pyroscope/pkg/util/build.BuildDate=$(date -ud @${SOURCE_DATE_EPOCH} +'%Y-%m-%dT%H:%M:%SZ')
            output: ${target.dir}/usr/bin/profilecli
            packages: ./cmd/profilecli
        - name: build pyroscope dev
          uses: go/build@v1
          work-dir: /go/src/github.com/grafana/pyroscope
          with:
            fips: false
            ldflags:
              - -X github.com/grafana/pyroscope/pkg/util/build.Version=1.15.3
              - -X github.com/grafana/pyroscope/pkg/util/build.Revision=c7f6f34e8b697db6ae09771e983638cfcdb67c1a
              - -X github.com/grafana/pyroscope/pkg/util/build.Branch=1.15.3
              - -X github.com/grafana/pyroscope/pkg/util/build.BuildDate=$(date -ud @${SOURCE_DATE_EPOCH} +'%Y-%m-%dT%H:%M:%SZ')
            output: ${target.dir}/usr/bin/pyroscope-dev
            packages: ./cmd/pyroscope
            strip: false
        - name: build profilecli dev
          uses: go/build@v1
          work-dir: /go/src/github.com/grafana/pyroscope
          with:
            fips: false
            ldflags:
              - -X github.com/grafana/pyroscope/pkg/util/build.Version=1.15.3
              - -X github.com/grafana/pyroscope/pkg/util/build.Revision=c7f6f34e8b697db6ae09771e983638cfcdb67c1a
              - -X github.com/grafana/pyroscope/pkg/util/build.Branch=1.15.3
              - -X github.com/grafana/pyroscope/pkg/util/build.BuildDate=$(date -ud @${SOURCE_DATE_EPOCH} +'%Y-%m-%dT%H:%M:%SZ')
            output: ${target.dir}/usr/bin/profilecli-dev
            packages: ./cmd/profilecli
            strip: false
        - name: install config
          runs: |
            set -eux -o pipefail

            mkdir -p "${target.dir}/etc/pyroscope"
            cp -a cmd/pyroscope/pyroscope.yaml "${target.dir}/etc/pyroscope/config.yaml"
        - uses: dhi/build-pkg:0
          with:
            description: Grafana Pyroscope continuous profiling system
            files:
              - usr/bin/pyroscope
              - usr/bin/profilecli
              - etc/pyroscope/config.yaml
            license: AGPL-3.0
            name: pyroscope-1.15
            rel: 2
            subpackages:
              - files:
                  - path: usr/bin/pyroscope
                    source: usr/bin/pyroscope-dev
                  - path: usr/bin/profilecli
                    source: usr/bin/profilecli-dev
                name: pyroscope-1.15-dev
            url: https://github.com/grafana/pyroscope
            version: 1.15.3
      paths:
        - type: file
          path: ${source.dir}/patch/handlers-time-fix-1.15.patch
          uid: 0
          gid: 0
          source: package/main/pyroscope/patch/handlers-time-fix-1.15.patch
        - type: file
          path: ${source.dir}/patch/prometheus-parse-metric-selector-v1.15-1.16.patch
          uid: 0
          gid: 0
          source: package/main/pyroscope/patch/prometheus-parse-metric-selector-v1.15-1.16.patch
        - type: file
          path: ${source.dir}/patch/prometheus-relabel-validate-1.15-1.19.patch
          uid: 0
          gid: 0
          source: package/main/pyroscope/patch/prometheus-relabel-validate-1.15-1.19.patch
