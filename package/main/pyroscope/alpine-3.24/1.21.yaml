# syntax=dhi.io/build:2-alpine3.24

image: dhi.io/pkg-pyroscope
variant: runtime
tags:
  - 1.21.1-alpine3.24
  - 1.21.1-r2-alpine3.24
platforms:
  - linux/amd64
  - linux/arm64
dates:
  release: "2026-04-17"
vars:
  COMMIT_SHA: d6cb8c3db58edf6c0ea26daa1dd40d84f11a4ef0
  GOLANG_MAJOR_MINOR_VERSION: "1.26"
  GOLANG_VERSION: 1.26.8-r0
  PACKAGE_NAME: pyroscope-1.21
  REL: "2"
  SEMVER_MAJOR_MINOR_VERSION: "1.21"
  SEMVER_MAJOR_VERSION: "1"
  SEMVER_VERSION: 1.21.1
  VERSION: 1.21.1
contents:
  repositories:
    - https://dhi.io/apk/alpine/v3.24/main
    - https://dhi.io/apk/alpine/v3.23/main
    - https://dl-cdn.alpinelinux.org/alpine/v3.24/main
    - https://dl-cdn.alpinelinux.org/alpine/v3.24/community
  keyring:
    - https://dhi.io/keyring/dhi-apk@docker-0F81AD7700D99184.rsa.pub
  packages:
    - alpine-baselayout-data
  builds:
    - name: pyroscope-1.21
      work-dir: /go/src/github.com/grafana/pyroscope
      contents:
        packages:
          - busybox
          - bash
          - ca-certificates-bundle
          - coreutils
          - findutils
          - git
          - grep
          - mawk
          - sed
          - golang-1.26=1.26.8-r0
          - golang-1.26-oci-config=1.26.8-r0
        files:
          - url: git+https://github.com/grafana/pyroscope.git#v1.21.1
            checksum: d6cb8c3db58edf6c0ea26daa1dd40d84f11a4ef0
            path: /go/src/github.com/grafana/pyroscope
            spdx:
              name: pyroscope
              version: 1.21.1
              packages:
                - name: pyroscope
                  purl: pkg:golang/github.com/grafana/pyroscope@1.21.1
                  license: AGPL-3.0
            uid: 0
            gid: 0
      pipeline:
        - name: update go dependencies (1.21 only)
          uses: go/bump@v2
          work-dir: /go/src/github.com/grafana/pyroscope
          with:
            deps:
              - go.etcd.io/etcd/client/pkg/v3@v3.6.14
              - golang.org/x/crypto@v0.56.0
              - golang.org/x/mod@v0.40.0
              - golang.org/x/net@v0.58.0
              - golang.org/x/text@v0.41.0
              - github.com/klauspost/compress@v1.18.7
              - go.opentelemetry.io/otel@v1.44.0
              - google.golang.org/grpc@v1.83.1
            replaces:
              - go.etcd.io/etcd/client/pkg/v3=go.etcd.io/etcd/client/pkg/v3@v3.6.14
            tidy: true
        - name: build pyroscope
          uses: go/build@v1
          work-dir: /go/src/github.com/grafana/pyroscope
          with:
            fips: false
            ldflags:
              - -s
              - -w
              - -X github.com/grafana/pyroscope/pkg/util/build.Version=1.21.1
              - -X github.com/grafana/pyroscope/pkg/util/build.Revision=d6cb8c3db58edf6c0ea26daa1dd40d84f11a4ef0
              - -X github.com/grafana/pyroscope/pkg/util/build.Branch=1.21.1
              - -X github.com/grafana/pyroscope/pkg/util/build.BuildDate=$(date -ud @${SOURCE_DATE_EPOCH} +'%Y-%m-%dT%H:%M:%SZ')
            output: ${target.dir}/usr/bin/pyroscope
            packages: ./cmd/pyroscope
        - name: build profilecli
          uses: go/build@v1
          work-dir: /go/src/github.com/grafana/pyroscope
          with:
            fips: false
            ldflags:
              - -s
              - -w
              - -X github.com/grafana/pyroscope/pkg/util/build.Version=1.21.1
              - -X github.com/grafana/pyroscope/pkg/util/build.Revision=d6cb8c3db58edf6c0ea26daa1dd40d84f11a4ef0
              - -X github.com/grafana/pyroscope/pkg/util/build.Branch=1.21.1
              - -X github.com/grafana/pyroscope/pkg/util/build.BuildDate=$(date -ud @${SOURCE_DATE_EPOCH} +'%Y-%m-%dT%H:%M:%SZ')
            output: ${target.dir}/usr/bin/profilecli
            packages: ./cmd/profilecli
        - name: build pyroscope dev
          uses: go/build@v1
          work-dir: /go/src/github.com/grafana/pyroscope
          with:
            fips: false
            ldflags:
              - -X github.com/grafana/pyroscope/pkg/util/build.Version=1.21.1
              - -X github.com/grafana/pyroscope/pkg/util/build.Revision=d6cb8c3db58edf6c0ea26daa1dd40d84f11a4ef0
              - -X github.com/grafana/pyroscope/pkg/util/build.Branch=1.21.1
              - -X github.com/grafana/pyroscope/pkg/util/build.BuildDate=$(date -ud @${SOURCE_DATE_EPOCH} +'%Y-%m-%dT%H:%M:%SZ')
            output: ${target.dir}/usr/bin/pyroscope-dev
            packages: ./cmd/pyroscope
            strip: false
        - name: build profilecli dev
          uses: go/build@v1
          work-dir: /go/src/github.com/grafana/pyroscope
          with:
            fips: false
            ldflags:
              - -X github.com/grafana/pyroscope/pkg/util/build.Version=1.21.1
              - -X github.com/grafana/pyroscope/pkg/util/build.Revision=d6cb8c3db58edf6c0ea26daa1dd40d84f11a4ef0
              - -X github.com/grafana/pyroscope/pkg/util/build.Branch=1.21.1
              - -X github.com/grafana/pyroscope/pkg/util/build.BuildDate=$(date -ud @${SOURCE_DATE_EPOCH} +'%Y-%m-%dT%H:%M:%SZ')
            output: ${target.dir}/usr/bin/profilecli-dev
            packages: ./cmd/profilecli
            strip: false
        - name: install config
          runs: |
            set -eux -o pipefail

            mkdir -p "${target.dir}/etc/pyroscope"
            cp -a cmd/pyroscope/pyroscope.yaml "${target.dir}/etc/pyroscope/config.yaml"
        - uses: dhi/build-pkg:0
          with:
            description: Grafana Pyroscope continuous profiling system
            files:
              - usr/bin/pyroscope
              - usr/bin/profilecli
              - etc/pyroscope/config.yaml
            license: AGPL-3.0
            name: pyroscope-1.21
            rel: 2
            subpackages:
              - files:
                  - path: usr/bin/pyroscope
                    source: usr/bin/pyroscope-dev
                  - path: usr/bin/profilecli
                    source: usr/bin/profilecli-dev
                name: pyroscope-1.21-dev
            url: https://github.com/grafana/pyroscope
            version: 1.21.1
os-release:
  name: Docker Hardened Images (Alpine)
  id: alpine
  version-id: "3.24"
