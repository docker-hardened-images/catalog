# syntax=dhi.io/build:2-debian13

image: dhi.io/pkg-nifi
variant: runtime
tags:
  - 2.12.0
  - 2.12.0-r1
  - 2.12.0-debian13
  - 2.12.0-r1-debian13
platforms:
  - linux/amd64
  - linux/arm64
dates:
  release: "2026-09-13"
vars:
  COMMIT_SHA: 19f4df8e048e91d87d3e4967c69b1298f9dbe450
  JDK_MAJOR_VERSION: "21"
  JDK_VERSION: 1:21.0.12.1+1-4
  MAVEN_VERSION: 3.10.0
  PACKAGE_HOME: /usr/share/nifi
  PACKAGE_NAME: nifi
  REL: "1"
  SEMVER_MAJOR_MINOR_VERSION: "2.12"
  SEMVER_MAJOR_VERSION: "2"
  SEMVER_VERSION: 2.12.0
  UV_ARCH: '#{ target.arch == "amd64" ? "x86_64-unknown-linux-gnu" : "aarch64-unknown-linux-gnu" }'
  UV_VERSION: 0.13.7
  VERSION: 2.12.0
contents:
  repositories:
    - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
  keyring:
    - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
  packages:
    - base-files
  builds:
    - name: nifi
      work-dir: ${source.dir}/nifi
      environment:
        JAVA_HOME: /usr/lib/jvm/temurin-21
        MAVEN_HOME: /opt/java/apache-maven-3.10.0
        MAVEN_OPTS: -Xmx2g -XX:ReservedCodeCacheSize=1g
      caches:
        - path: /root/.m2/repository
      contents:
        repositories:
          - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
        keyring:
          - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
        packages:
          - bash
          - ca-certificates
          - coreutils
          - curl
          - findutils
          - git
          - gpg
          - gpg-agent
          - grep
          - gzip
          - jq
          - libstdc++6
          - sed
          - tar
          - unzip
          - xmlstarlet
          - eclipse-temurin-21-jdk=1:21.0.12.1+1-4
        files:
          - url: git+https://github.com/apache/nifi.git#rel/nifi-2.12.0
            checksum: 19f4df8e048e91d87d3e4967c69b1298f9dbe450
            path: ${source.dir}/nifi
            spdx:
              name: nifi
              version: 2.12.0
              packages:
                - name: nifi
                  purl: pkg:github/apache/nifi@2.12.0
                  license: Apache-2.0
            uid: 0
            gid: 0
          - url: https://dlcdn.apache.org/maven/maven-3/3.10.0/binaries/apache-maven-3.10.0-bin.tar.gz
            path: ${source.dir}/maven/apache-maven-3.10.0-bin.tar.gz
            spdx:
              name: maven
              version: 3.10.0
              packages:
                - name: maven
                  purl: pkg:generic/apache-maven@3.10.0
                  license: Apache-2.0
            uid: 0
            gid: 0
          - url: https://github.com/astral-sh/uv/releases/download/0.13.7/uv-${UV_ARCH}.tar.gz
            checksum: https://github.com/astral-sh/uv/releases/download/0.13.7/uv-${UV_ARCH}.tar.gz.sha256
            path: ${source.dir}/uv-${UV_ARCH}.tar.gz
            spdx:
              name: uv-binary
              version: 0.13.7
              packages:
                - name: uv
                  purl: pkg:github/astral-sh/uv@0.13.7
                  license: MIT OR Apache-2.0
            uid: 0
            gid: 0
          - url: https://maven-central.storage-download.googleapis.com/maven2/com/fasterxml/jackson/core/jackson-core/2.21.7/jackson-core-2.21.7.jar
            checksum: sha256:8c5623b98f32d5f7e1287ff61ed50e08ab7b11381e991fff89327faabba42261
            path: ${source.dir}/patch/deps/jackson-core-2.21.7.jar
            spdx:
              name: jackson-core
              version: 2.21.7
              packages:
                - name: jackson-core
                  purl: pkg:maven/com.fasterxml.jackson.core/jackson-core@2.21.7
                  license: Apache-2.0
            uid: 0
            gid: 0
          - url: https://maven-central.storage-download.googleapis.com/maven2/com/fasterxml/jackson/core/jackson-databind/2.21.7/jackson-databind-2.21.7.jar
            checksum: sha256:1290c2795e93e8a6861a6c4d9ff0d844d32f5ea178362cb2721edf5561e828b1
            path: ${source.dir}/patch/deps/jackson-databind-2.21.7.jar
            spdx:
              name: jackson-databind
              version: 2.21.7
              packages:
                - name: jackson-databind
                  purl: pkg:maven/com.fasterxml.jackson.core/jackson-databind@2.21.7
                  license: Apache-2.0
            uid: 0
            gid: 0
          - url: https://maven-central.storage-download.googleapis.com/maven2/tools/jackson/core/jackson-core/3.1.7/jackson-core-3.1.7.jar
            checksum: sha256:7608c367fd8a92666d28711519599543c180298259963184ce04d2947a8f71e7
            path: ${source.dir}/patch/deps/tools-jackson-core-3.1.7.jar
            spdx:
              name: jackson-core
              version: 3.1.7
              packages:
                - name: jackson-core
                  purl: pkg:maven/tools.jackson.core/jackson-core@3.1.7
                  license: Apache-2.0
            uid: 0
            gid: 0
          - url: https://maven-central.storage-download.googleapis.com/maven2/tools/jackson/core/jackson-databind/3.1.7/jackson-databind-3.1.7.jar
            checksum: sha256:48c781de87e2016e1f0d973748a27130f11643e7ac080173f40e2d9669d84be3
            path: ${source.dir}/patch/deps/tools-jackson-databind-3.1.7.jar
            spdx:
              name: jackson-databind
              version: 3.1.7
              packages:
                - name: jackson-databind
                  purl: pkg:maven/tools.jackson.core/jackson-databind@3.1.7
                  license: Apache-2.0
            uid: 0
            gid: 0
      pipeline:
        - name: install maven
          runs: |
            set -eux -o pipefail

            mkdir -p /opt/java
            tar -xzf "${source.dir}/maven/apache-maven-3.10.0-bin.tar.gz" -C /opt/java

            mkdir -p /usr/local/bin
            find "/opt/java/apache-maven-3.10.0/bin" -type f -executable -o -type l | while read -r file; do
              filename=$(basename "$file")
              ln -sf "/opt/java/apache-maven-3.10.0/bin/$filename" "/usr/local/bin/$filename"
            done
        - uses: mvn/mirror@v1
        - name: use maven central when mirror credentials are absent
          secrets:
            - id: maven_user
              env: MAVEN_USER
              optional: true
            - id: maven_password
              env: MAVEN_PASSWORD
              optional: true
          runs: |
            set -eux -o pipefail

            if [ -z "${MAVEN_USER:-}" ] || [ -z "${MAVEN_PASSWORD:-}" ]; then
              rm -f /root/.m2/settings.xml
            fi
        - name: setup uv
          runs: |
            set -eux -o pipefail

            mkdir -p "${target.dir}/usr/lib/nifi/.local/bin"

            UV_TAR="${source.dir}/uv-${UV_ARCH}.tar.gz"
            UV_ARCH_DIR="uv-${UV_ARCH}"
            tar -xzf "$UV_TAR" -C "${target.dir}/usr/lib/nifi/.local/bin" --strip-components=1 "${UV_ARCH_DIR}/uv"
            chmod +x "${target.dir}/usr/lib/nifi/.local/bin/uv"
            "${target.dir}/usr/lib/nifi/.local/bin/uv" --version
        - name: patch
          uses: mvn/patch@v1
          with:
            dependencies: ${source.dir}/patch/mvn-deps.json
            mvn-root: ${source.dir}/nifi
            properties: ${source.dir}/patch/mvn-properties.json
        - name: bump hadoop-shaded-guava
          work-dir: ${source.dir}/nifi
          runs: |
            set -eux -o pipefail

            pom="nifi-extension-bundles/nifi-iceberg-bundle/nifi-iceberg-parquet-writer/pom.xml"
            xmlstarlet ed -P -L \
              -N m="http://maven.apache.org/POM/4.0.0" \
              -u "//m:dependency[m:artifactId='hadoop-shaded-guava']/m:version" \
              -v "1.6.0" \
              "$pom"

            test "$(xmlstarlet sel -N m="http://maven.apache.org/POM/4.0.0" -t -v "//m:dependency[m:artifactId='hadoop-shaded-guava']/m:version" "$pom")" = "1.6.0"
        - name: remove develocity maven extension
          work-dir: ${source.dir}/nifi
          runs: |
            set -eux -o pipefail

            if [ -f ".mvn/extensions.xml" ]; then
              xmlstarlet ed -P -L \
                -d "//*[local-name()='extension'][*[local-name()='groupId'][text()='com.gradle']]" \
                .mvn/extensions.xml
            fi
        - name: patch nifi toolkit cli
          work-dir: ${source.dir}/nifi/nifi-toolkit/nifi-toolkit-cli
          runs: |
            set -eux -o pipefail

            xmlstarlet ed -P -L \
              -N m="http://maven.apache.org/POM/4.0.0" \
              -u "/m:project/m:properties/m:jline.version" \
              -v "4.3.1" \
              pom.xml

            test "$(xmlstarlet sel -N m="http://maven.apache.org/POM/4.0.0" -t -v "/m:project/m:properties/m:jline.version" pom.xml)" = "4.3.1"
        - name: patch minifi commons daemon download
          work-dir: ${source.dir}/nifi
          runs: |
            set -eux -o pipefail

            file="minifi/minifi-assembly/pom.xml"
            grep -q "https://repo1.maven.org/maven2/commons-daemon/commons-daemon/" "$file"
            sed -i 's#https://repo1.maven.org/maven2/commons-daemon/commons-daemon/#https://maven-central.storage-download.googleapis.com/maven2/commons-daemon/commons-daemon/#g' "$file"
            grep -q "https://maven-central.storage-download.googleapis.com/maven2/commons-daemon/commons-daemon/" "$file"
        - name: build nifi web api
          work-dir: ${source.dir}/nifi/nifi-framework-bundle/nifi-framework/nifi-web/nifi-web-api
          privileged: true
          secrets:
            - id: maven_user
              env: MAVEN_USER
              optional: true
            - id: maven_password
              env: MAVEN_PASSWORD
              optional: true
          runs: |
            set -eux -o pipefail

            mvn package -DskipTests
        - name: build nifi toolkit
          work-dir: ${source.dir}/nifi/nifi-toolkit
          privileged: true
          secrets:
            - id: maven_user
              env: MAVEN_USER
              optional: true
            - id: maven_password
              env: MAVEN_PASSWORD
              optional: true
          runs: |
            set -eux -o pipefail

            mvn package -DskipTests
        - name: build nifi
          work-dir: ${source.dir}/nifi
          privileged: true
          secrets:
            - id: maven_user
              env: MAVEN_USER
              optional: true
            - id: maven_password
              env: MAVEN_PASSWORD
              optional: true
          runs: |
            set -eux -o pipefail

            mvn package -T1C -DskipTests
        - name: extract nifi
          work-dir: ${source.dir}/nifi
          runs: |
            set -eux -o pipefail

            nifi_dist=$(find nifi-assembly/target -name "nifi-*-bin.zip" | head -1)
            if [ -z "$nifi_dist" ]; then
                echo "unable to find nifi zip" 1>&2
                exit 1
            fi
            mkdir -p "${target.dir}/usr/share/nifi/nifi-current"
            unzip "$nifi_dist" -d "${target.dir}/usr/share/nifi/nifi-current"

            shopt -s nullglob dotglob
            nifi_dirs=("${target.dir}"/usr/share/nifi/nifi-current/nifi-[0-9]*.[0-9]*.[0-9]*)
            case ${#nifi_dirs[@]} in
                0) echo "Error: No NiFi directory found"; exit 1 ;;
                1) mv "${nifi_dirs[0]}"/* "${target.dir}/usr/share/nifi/nifi-current/"; rmdir "${nifi_dirs[0]}" ;;
                *) echo "Error: Multiple NiFi directories found"; exit 1 ;;
            esac
        - name: extract nifi toolkit
          work-dir: ${source.dir}/nifi/nifi-toolkit
          runs: |
            set -eux -o pipefail

            TOOLKIT_DIST=$(find nifi-toolkit-assembly/target -name "nifi-toolkit-*-bin.zip" | head -1)
            mkdir -p "${target.dir}/usr/share/nifi/nifi-toolkit-current"
            unzip "$TOOLKIT_DIST" -d "${target.dir}/usr/share/nifi/nifi-toolkit-current"

            shopt -s nullglob dotglob
            toolkit_dirs=("${target.dir}"/usr/share/nifi/nifi-toolkit-current/nifi-toolkit-[0-9]*.[0-9]*.[0-9]*)
            case ${#toolkit_dirs[@]} in
                0) echo "Error: No NiFi toolkit directory found"; exit 1 ;;
                1) mv "${toolkit_dirs[0]}"/* "${target.dir}/usr/share/nifi/nifi-toolkit-current/"; rmdir "${toolkit_dirs[0]}" ;;
                *) echo "Error: Multiple NiFi toolkit directories found"; exit 1 ;;
            esac
        - name: install docker scripts
          runs: |
            set -eux -o pipefail

            install -d -m 0755 "${target.dir}/usr/share/nifi/scripts"
            cp -a "${source.dir}/nifi/nifi-docker/dockerhub/sh/." "${target.dir}/usr/share/nifi/scripts/"
        - name: patch shaded jackson in nar bundles
          runs: |
            set -eux -o pipefail

            LIB="${target.dir}/usr/share/nifi/nifi-current/lib"
            PATCH_DIR="${source.dir}/patch/deps"

            patch_nar_embedded_jar() {
              local nar="$1"
              local inner_glob="$2"
              local patch_script="$3"

              nar="$(readlink -f "$nar")"
              NAR_WORK="$(mktemp -d)"
              cd "$NAR_WORK"
              jar xf "$nar"

              inner_jar="$(find META-INF/bundled-dependencies -maxdepth 1 -type f -name "$inner_glob" | sort | head -1)"
              if [ -z "$inner_jar" ]; then
                echo "no $inner_glob in $nar" >&2
                exit 1
              fi

              bash "$patch_script" "$NAR_WORK/$inner_jar" "$PATCH_DIR"

              (cd "$NAR_WORK" && jar uf "$nar" "$inner_jar")
              rm -rf "$NAR_WORK"
            }

            hz_nar="$(find "$LIB" -maxdepth 1 -type f -name 'nifi-hazelcast-services-nar-*.nar' | sort | head -1)"
            if [ -n "$hz_nar" ]; then
              patch_nar_embedded_jar "$hz_nar" 'hazelcast-[0-9]*.jar' \
                "${source.dir}/patch/patch-hazelcast-jackson.sh"
            fi

            pq_nar="$(find "$LIB" -maxdepth 1 -type f -name 'nifi-iceberg-parquet-writer-nar-*.nar' | sort | head -1)"
            if [ -n "$pq_nar" ]; then
              patch_nar_embedded_jar "$pq_nar" 'parquet-jackson-*.jar' \
                "${source.dir}/patch/patch-parquet-jackson.sh"
            fi
        - name: final setup
          runs: |
            set -eux -o pipefail

            chmod +x "${target.dir}/usr/share/nifi/nifi-current/bin/"*.sh
            chmod +x "${target.dir}/usr/share/nifi/nifi-toolkit-current/bin/"*.sh
            chmod +x "${target.dir}/usr/share/nifi/scripts/"*.sh

            chmod -R u+rwX,g+rX,o+rX "${target.dir}/usr/share/nifi/nifi-current/conf"

            chmod o+rX "${target.dir}/usr/share/nifi/nifi-current/bin/"*.sh
            chmod o+rX "${target.dir}/usr/share/nifi/nifi-toolkit-current/bin/"*.sh

            if [ -d "${target.dir}/usr/share/nifi/nifi-current/lib" ]; then
              chmod -R u+rX,g+rX,o+rX "${target.dir}/usr/share/nifi/nifi-current/lib"
            fi

            if [ -d "${target.dir}/usr/share/nifi/nifi-toolkit-current/lib" ]; then
              chmod -R u+rX,g+rX,o+rX "${target.dir}/usr/share/nifi/nifi-toolkit-current/lib"
            fi
        - uses: dhi/build-pkg:0
          with:
            depends:
              - bash
              - coreutils
            description: Apache NiFi dataflow automation server
            files:
              - usr
            formats:
              - deb
            license: Apache-2.0
            name: nifi
            rel: 1
            url: https://nifi.apache.org/
            version: 2.12.0
      paths:
        - type: directory
          path: ${source.dir}/patch
          uid: 0
          gid: 0
          source: package/main/nifi/patch/
        - type: file
          path: ${source.dir}/patch/patch-hazelcast-jackson.sh
          uid: 0
          gid: 0
          mode: "0755"
          source: package/main/nifi/patch/patch-hazelcast-jackson.sh
        - type: file
          path: ${source.dir}/patch/patch-parquet-jackson.sh
          uid: 0
          gid: 0
          mode: "0755"
          source: package/main/nifi/patch/patch-parquet-jackson.sh
os-release:
  name: Docker Hardened Images (Debian)
  id: debian
  version-id: "13"
  version-codename: trixie
  pretty-name: Docker Hardened Images/Debian GNU/Linux 13 (trixie)
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
