# syntax=dhi.io/build:2-alpine3.24

image: dhi.io/pkg-llama-cpp
variant: runtime
tags:
  - 0.8.0-alpine3.24
  - 0.8.0-r0-alpine3.24
platforms:
  - linux/amd64
  - linux/arm64
vars:
  COMMIT_SHA: 8642541b255bfb5dc39cd351a178be09013a55d6
  GGML_SPDX_VERSION: 0.28.0
  LLAMA_BUILD_NUMBER: "11960"
  LLAMA_TAG_COMMIT_SHA: 8642541b255bfb5dc39cd351a178be09013a55d6
  LLAMA_TAG_VERSION: 0.8.0
  NODEJS_24_VERSION: 24.22.1-r1
  NPM_VERSION: 12.2.1-r1
  PACKAGE_NAME: llama-cpp-0
  REL: "0"
  SEMVER_MAJOR_MINOR_VERSION: "0.8"
  SEMVER_MAJOR_VERSION: "0"
  SEMVER_VERSION: 0.8.0
  VERSION: 0.8.0
contents:
  repositories:
    - https://dhi.io/apk/alpine/v3.24/main
    - https://dhi.io/apk/alpine/v3.23/main
    - https://dl-cdn.alpinelinux.org/alpine/v3.24/main
    - https://dl-cdn.alpinelinux.org/alpine/v3.24/community
  keyring:
    - https://dhi.io/keyring/dhi-apk@docker-0F81AD7700D99184.rsa.pub
  packages:
    - alpine-baselayout-data
  builds:
    - name: llama.cpp
      work-dir: ${source.dir}/llama.cpp
      contents:
        packages:
          - bash
          - binutils
          - build-base
          - ca-certificates
          - cmake
          - coreutils
          - findutils
          - git
          - grep
          - jq
          - sed
          - libgomp
          - linux-headers
          - nodejs-24=24.22.1-r1
          - npm-12=12.2.1-r1
          - openssl-dev
          - pkgconf
        files:
          - url: git+https://github.com/ggml-org/llama.cpp.git#v0.8.0
            checksum: 8642541b255bfb5dc39cd351a178be09013a55d6
            path: ${source.dir}/llama.cpp
            spdx:
              name: llama.cpp
              version: 0.8.0
              packages:
                - name: llama.cpp
                  purl: pkg:github/ggml-org/llama.cpp@0.8.0
                  license: MIT
            uid: 0
            gid: 0
      pipeline:
        - name: bump ui dependencies
          uses: npm/bump@v1
          work-dir: ${source.dir}/llama.cpp/tools/ui
          privileged: true
          environment:
            npm_config_allow_remote: all
            npm_config_legacy_peer_deps: "true"
          with:
            bumps: ${source.dir}/patch/npm-bumps.json
            npm-root: ${source.dir}/llama.cpp/tools/ui
            omit-dev: false
        - name: pin vendored npm tarballs
          work-dir: ${source.dir}/llama.cpp/tools/ui
          privileged: true
          environment:
            npm_config_allow_remote: all
            npm_config_legacy_peer_deps: "true"
          runs: |
            set -eux -o pipefail

            mocker_tgz="${source.dir}/patch/npm/vitest-mocker-4.1.12.tgz"
            spy_tgz="${source.dir}/patch/npm/vitest-spy-4.1.12.tgz"
            body_parser_tgz="${source.dir}/patch/npm/body-parser-2.4.0.tgz"
            fast_uri_tgz="${source.dir}/patch/npm/fast-uri-3.1.9.tgz"
            serialize_js_tgz="${source.dir}/patch/npm/serialize-javascript-7.1.3.tgz"
            test -f "$mocker_tgz"
            test -f "$spy_tgz"
            test -f "$body_parser_tgz"
            test -f "$fast_uri_tgz"
            test -f "$serialize_js_tgz"
            echo '8f9ac0144028329f5c649c031608b8877efea748cdbded0d7f41d60f9be49c52  '"$mocker_tgz" | sha256sum -c -
            echo 'eb9a67720d1082f33bfc5cf3a41ee6d297e994cf26013dae0ad807a474fa44a3  '"$spy_tgz" | sha256sum -c -
            echo '3f6e22dc9710a8bd5942fee8dfbd4632b54980cc2f33854f1ec1e314b17b2357  '"$body_parser_tgz" | sha256sum -c -
            echo '4f5a67f7b61110aae7b3ad38e806627f5712f4c150bd38eb804a562e69a9ee5e  '"$fast_uri_tgz" | sha256sum -c -
            echo '688d8b4c49347c7e275f0782e59a79cc7ad51a8902647dd91fec42a0edcaaedd  '"$serialize_js_tgz" | sha256sum -c -
            npm pkg set "overrides.@vitest/mocker=file:${mocker_tgz}"
            npm pkg set "overrides.@vitest/spy=file:${spy_tgz}"
            npm pkg set "overrides.body-parser=file:${body_parser_tgz}"
            npm pkg set "overrides.fast-uri=file:${fast_uri_tgz}"
            npm pkg set "overrides.serialize-javascript=file:${serialize_js_tgz}"
            npm install --package-lock-only
        - name: build ui
          work-dir: ${source.dir}/llama.cpp/tools/ui
          privileged: true
          environment:
            npm_config_allow_remote: all
            npm_config_legacy_peer_deps: "true"
          runs: |
            set -eux -o pipefail

            npm ci
            LLAMA_BUILD_NUMBER=b11960 npm run build
            test -f dist/index.html
            grep -qF '"version":"b11960"' dist/build.json
        - name: ui sbom
          uses: sbom@v1
          with:
            extra-scanners: javascript-package-cataloger
            prefix: llama.cpp-ui
            source: ${source.dir}/llama.cpp/tools/ui
        - name: check vendored components
          work-dir: ${source.dir}/llama.cpp
          runs: |
            set -eux -o pipefail

            grep -qF '#define CPPHTTPLIB_VERSION "0.62.0"' vendor/cpp-httplib/httplib.h
            grep -qF '#define NLOHMANN_JSON_VERSION_MAJOR 3' vendor/nlohmann/json.hpp
            grep -qF '#define NLOHMANN_JSON_VERSION_MINOR 12' vendor/nlohmann/json.hpp
            grep -qF '#define NLOHMANN_JSON_VERSION_PATCH 0' vendor/nlohmann/json.hpp
            grep -qF '#define XXH_VERSION_MAJOR    0' vendor/hash/xxhash/xxhash.h
            grep -qF '#define XXH_VERSION_MINOR    8' vendor/hash/xxhash/xxhash.h
            grep -qF '#define XXH_VERSION_RELEASE  3' vendor/hash/xxhash/xxhash.h
            grep -qF 'By Steve Reid <steve@edmweb.com>' vendor/hash/sha1/sha1.c
            grep -qF '100% Public Domain' vendor/hash/sha1/sha1.c
            grep -qF '2010-06-11 : Igor Pavlov : Public domain' vendor/hash/sha256/sha256.c
            grep -qF '#define MA_VERSION_MAJOR    0' vendor/miniaudio/miniaudio.h
            grep -qF '#define MA_VERSION_MINOR    11' vendor/miniaudio/miniaudio.h
            grep -qF '#define MA_VERSION_REVISION 25' vendor/miniaudio/miniaudio.h
            grep -qF 'stb_image - v2.30' vendor/stb/stb_image.h
            echo 'ddec448cb93c2a5096f914a5b796f707dcf0a9e91591ca13000d210200160cb1  vendor/sheredom/subprocess.h' | sha256sum -c -

            ggml_major=$(sed -n 's/^set(GGML_VERSION_MAJOR \([0-9][0-9]*\))/\1/p' ggml/CMakeLists.txt)
            ggml_minor=$(sed -n 's/^set(GGML_VERSION_MINOR \([0-9][0-9]*\))/\1/p' ggml/CMakeLists.txt)
            ggml_patch=$(sed -n 's/^set(GGML_VERSION_PATCH \([0-9][0-9]*\))/\1/p' ggml/CMakeLists.txt)
            test -n "$ggml_major"
            test -n "$ggml_minor"
            test -n "$ggml_patch"
            test "$ggml_major.$ggml_minor.$ggml_patch" = "0.28.0"
            test -f tools/ui/dist/index.html
        - name: configure and build
          work-dir: ${source.dir}/llama.cpp
          runs: |
            set -eux -o pipefail

            test "0.8.0" = "0.8.0"
            test "8642541b255bfb5dc39cd351a178be09013a55d6" = "8642541b255bfb5dc39cd351a178be09013a55d6"

            cmake -S . -B build \
              -DCMAKE_BUILD_TYPE=Release \
              -DCMAKE_INSTALL_PREFIX=/usr \
              -DCMAKE_INSTALL_LIBDIR=lib/llama.cpp \
              -DCMAKE_INSTALL_RPATH=/usr/lib/llama.cpp \
              -DGGML_BACKEND_DIR=/usr/lib/llama.cpp \
              -DGGML_NATIVE=OFF \
              -DGGML_BACKEND_DL=ON \
              -DGGML_CPU_ALL_VARIANTS=ON \
              -DLLAMA_BUILD_NUMBER=11960 \
              -DLLAMA_BUILD_TESTS=OFF \
              -DLLAMA_BUILD_EXAMPLES=OFF \
              -DLLAMA_TOOLS_INSTALL=ON \
              -DLLAMA_OPENSSL=ON \
              -DLLAMA_BUILD_UI=ON \
              -DLLAMA_USE_PREBUILT_UI=OFF \
              -DLLAMA_BUILD_IS_DEV=OFF \
              -DLLAMA_UI_GZIP=ON
            grep -qF "int LLAMA_BUILD_NUMBER = 11960;" build/common/build-info.cpp
            cmake --build build -j"$(nproc)"
        - name: install
          work-dir: ${source.dir}/llama.cpp
          runs: |
            set -eux -o pipefail

            DESTDIR='${target.dir}' cmake --install build
            test -x '${target.dir}/usr/bin/llama-server'
            test -x '${target.dir}/usr/bin/llama'
        - name: select payload
          work-dir: ${source.dir}/llama.cpp
          runs: |
            set -eux -o pipefail

            find '${target.dir}/usr/bin' -mindepth 1 -maxdepth 1 ! -name llama-server ! -name llama -print > /tmp/llama-extra-bins
            while read -r extra; do
              rm -r "$extra"
            done < /tmp/llama-extra-bins

            for extra in \
              '${target.dir}/usr/include' \
              '${target.dir}/usr/lib/llama.cpp/cmake' \
              '${target.dir}/usr/lib/llama.cpp/pkgconfig'; do
              if [ -e "$extra" ]; then
                rm -r "$extra"
              fi
            done

            find '${target.dir}/usr/lib/llama.cpp' -name '*.a' -print > /tmp/llama-static-libs
            while read -r archive; do
              rm "$archive"
            done < /tmp/llama-static-libs

            mkdir -p '${target.dir}/usr/share/doc/llama-cpp-0'
            cp -p LICENSE '${target.dir}/usr/share/doc/llama-cpp-0/LICENSE'
            test -f '${target.dir}/usr/share/doc/llama-cpp-0/LICENSE'
        - name: verify payload
          work-dir: ${source.dir}/llama.cpp
          runs: |
            set -eux -o pipefail

            libdir='${target.dir}/usr/lib/llama.cpp'
            server_impl=
            for candidate in "$libdir/libllama-server-impl.so" "$libdir"/libllama-server-impl.so.*; do
              if [ -f "$candidate" ]; then
                server_impl=$candidate
                break
              fi
            done
            test -n "$server_impl"
            common_lib=
            for candidate in "$libdir/libllama-common.so" "$libdir"/libllama-common.so.*; do
              if [ -f "$candidate" ]; then
                common_lib=$candidate
                break
              fi
            done
            test -n "$common_lib"
            mtmd_lib=
            for candidate in "$libdir/libmtmd.so" "$libdir"/libmtmd.so.*; do
              if [ -f "$candidate" ]; then
                mtmd_lib=$candidate
                break
              fi
            done
            test -n "$mtmd_lib"

            ggml_real=$(readlink -f "$libdir/libggml.so")
            test "$(basename "$ggml_real")" = "libggml.so.0.28.0"
            spdx_version='0.28.0'
            ggml_soname_major=${spdx_version%%.*}
            readelf -d "$ggml_real" > /tmp/llama-ggml-dynamic
            grep SONAME /tmp/llama-ggml-dynamic > /tmp/llama-ggml-soname
            grep -q "libggml.so.$ggml_soname_major" /tmp/llama-ggml-soname

            grep -aqF '_ZN7httplib' "$server_impl"
            grep -aqF 'json_abi_v3_12_0' "$common_lib"
            grep -aqF 'sha256_init' "$mtmd_lib"
            grep -aqF 'ma_decoder' "$mtmd_lib"
            grep -aqF 'stbi_load_gif_from_memory' "$mtmd_lib"
            grep -aqF 'subprocess_create' "$mtmd_lib"

            readelf -d '${target.dir}/usr/bin/llama-server' > /tmp/llama-server-dynamic
            grep -q '/usr/lib/llama.cpp' /tmp/llama-server-dynamic
            if grep -q '/app/build' /tmp/llama-server-dynamic; then
              echo "build-tree rpath leaked into llama-server" >&2
              exit 1
            fi
            cpu_libs=$(find "$libdir" -name 'libggml-cpu-*.so*')
            test -n "$cpu_libs"

            unexpected=$(find '${target.dir}' \( -type f -o -type l \) \
              ! -path '${target.dir}/usr/bin/llama' \
              ! -path '${target.dir}/usr/bin/llama-server' \
              ! -path '${target.dir}/usr/lib/llama.cpp/*' \
              ! -path '${target.dir}/usr/share/doc/llama-cpp-0/LICENSE')
            if [ -n "$unexpected" ]; then
              echo "unexpected payload files:" >&2
              printf '%s\n' "$unexpected" >&2
              exit 1
            fi
        - uses: spdx@v1
          with:
            license: MIT
            name: cpp-httplib
            purl: pkg:github/yhirose/cpp-httplib@0.62.0
            version: 0.62.0
        - uses: spdx@v1
          with:
            license: MIT
            name: nlohmann-json
            purl: pkg:github/nlohmann/json@3.12.0
            version: 3.12.0
        - uses: spdx@v1
          with:
            license: BSD-2-Clause
            name: xxhash
            purl: pkg:github/Cyan4973/xxHash@0.8.3
            version: 0.8.3
        - uses: spdx@v1
          with:
            license: LicenseRef-Public-Domain
            name: sha1-steve-reid
            purl: pkg:generic/sha1-steve-reid
            version: unversioned
        - uses: spdx@v1
          with:
            license: LicenseRef-Public-Domain
            name: sha256-igor-pavlov
            purl: pkg:generic/sha256-igor-pavlov@2010-06-11
            version: "2010-06-11"
        - uses: spdx@v1
          with:
            license: Unlicense
            name: miniaudio
            purl: pkg:github/mackron/miniaudio@0.11.25
            version: 0.11.25
        - uses: spdx@v1
          with:
            license: MIT OR Unlicense
            name: stb-image
            purl: pkg:github/nothings/stb@2.30
            version: "2.30"
        - uses: spdx@v1
          with:
            license: Unlicense
            name: sheredom-subprocess
            purl: pkg:github/sheredom/subprocess.h
            version: ddec448cb93c2a5096f914a5b796f707dcf0a9e91591ca13000d210200160cb1
        - uses: spdx@v1
          with:
            license: MIT
            name: ggml
            purl: pkg:github/ggml-org/ggml@0.28.0
            version: 0.28.0
        - name: install sbom
          runs: |
            set -eux -o pipefail

            test -d /opt/docker/sbom/llama.cpp-ui
            test -f /opt/docker/sbom/cpp-httplib/.spdx.cpp-httplib.json
            test -f /opt/docker/sbom/nlohmann-json/.spdx.nlohmann-json.json
            test -f /opt/docker/sbom/xxhash/.spdx.xxhash.json
            test -f /opt/docker/sbom/sha1-steve-reid/.spdx.sha1-steve-reid.json
            test -f /opt/docker/sbom/sha256-igor-pavlov/.spdx.sha256-igor-pavlov.json
            test -f /opt/docker/sbom/miniaudio/.spdx.miniaudio.json
            test -f /opt/docker/sbom/stb-image/.spdx.stb-image.json
            test -f /opt/docker/sbom/sheredom-subprocess/.spdx.sheredom-subprocess.json
            test -f /opt/docker/sbom/ggml/.spdx.ggml.json
            mkdir -p "${target.dir}/opt/docker/sbom"
            cp -a /opt/docker/sbom/. "${target.dir}/opt/docker/sbom/"
        - uses: dhi/build-pkg:0
          with:
            depends:
              - libgcc
              - libgomp
              - libssl3
              - libstdc++
              - musl
            description: LLM inference in C/C++
            files:
              - usr/bin/llama
              - usr/bin/llama-server
              - usr/lib/llama.cpp
              - usr/share/doc/llama-cpp-0
              - opt/docker/sbom
            formats:
              - apk
            license: MIT
            name: llama-cpp-0
            rel: 0
            url: https://github.com/ggml-org/llama.cpp
            version: 0.8.0
      paths:
        - type: file
          path: ${source.dir}/patch/npm-bumps.json
          uid: 0
          gid: 0
          mode: "0644"
          source: package/main/llama-cpp/patch/npm-bumps.json
        - type: file
          path: ${source.dir}/patch/npm/vitest-mocker-4.1.12.tgz
