# syntax=dhi.io/build:2-debian13

image: dhi.io/pkg-openmetadata-server
variant: runtime
tags:
  - 1.12.13
  - 1.12.13-r3
  - 1.12.13-debian13
  - 1.12.13-r3-debian13
platforms:
  - linux/amd64
  - linux/arm64
dates:
  release: "2026-02-22"
vars:
  ANTLR_VERSION: 4.9.2
  COMMIT_SHA: e6c665019a583b7938f30fbb7bafb7e1f82c5dd7
  MAVEN_REFERENCE: dhi/maven:3.9.16-jdk21-debian13-dev@sha256:16f96100d1aa78b742720607aad55b8b286ab263229816a19e3c21e2293e79d7
  PACKAGE_NAME: openmetadata-server-1.12
  REL: "3"
  SEMVER_MAJOR_MINOR_VERSION: "1.12"
  SEMVER_MAJOR_VERSION: "1"
  SEMVER_VERSION: 1.12.13
  VERSION: 1.12.13
contents:
  packages:
    - base-files
  builds:
    - name: openmetadata-server
      uses: dhi.io/maven:3.9.16-jdk21-debian13-dev@sha256:16f96100d1aa78b742720607aad55b8b286ab263229816a19e3c21e2293e79d7
      work-dir: ${source.dir}/OpenMetadata
      environment:
        NODE_OPTIONS: --max-old-space-size=6144
      caches:
        - path: /root/.m2/repository
      contents:
        packages:
          - bash
          - ca-certificates
          - coreutils
          - curl
          - findutils
          - git
          - gzip
          - jq
          - tar
          - yq
        files:
          - url: git+https://github.com/open-metadata/OpenMetadata.git#1.12.13-release
            checksum: e6c665019a583b7938f30fbb7bafb7e1f82c5dd7
            path: ${source.dir}/OpenMetadata
            spdx:
              name: openmetadata
              version: 1.12.13
              packages:
                - name: openmetadata
                  purl: pkg:github/open-metadata/OpenMetadata@1.12.13
                  license: Apache-2.0
            uid: 0
            gid: 0
          - url: https://maven-central.storage-download.googleapis.com/maven2/org/antlr/antlr4/4.9.2/antlr4-4.9.2-complete.jar
            checksum: sha256:bb117b1476691dc2915a318efd36f8957c0ad93447fb1dac01107eb15fe137cd
            path: ${source.dir}/antlr4.jar
            spdx:
              name: antlr4
              version: 4.9.2
              packages:
                - name: antlr4
                  purl: pkg:maven/org.antlr/antlr4@4.9.2
                  license: BSD-3-Clause
            uid: 0
            gid: 0
      pipeline:
        - name: install antlr cli
          runs: |
            set -eux -o pipefail

            mkdir -p /opt/antlr
            cp ${source.dir}/antlr4.jar /opt/antlr/antlr4.jar
            printf '#!/bin/sh\nexec java -jar /opt/antlr/antlr4.jar "$@"\n' > /usr/local/bin/antlr4
            chmod 0755 /usr/local/bin/antlr4
        - name: patch maven properties and dependencies
          uses: mvn/patch@v1
          with:
            dependencies: ${source.dir}/patch/mvn-dependencies.json
            dependencies-key: dependencyManagement.dependencies
            mvn-root: ${source.dir}/OpenMetadata
            properties: ${source.dir}/patch/mvn-properties.json
        - name: patch calcite-core dependency
          uses: mvn/patch@v1
          with:
            dependencies: ${source.dir}/patch/mvn-calcite-dependencies.json
            mvn-root: ${source.dir}/OpenMetadata/openmetadata-service
        - name: test
          privileged: true
          runs: |
            set -eux -o pipefail

            git config --global --add safe.directory '*'

            excludes_src="${source.dir}/surefire-excludes-1.12.txt"
            excludes_file="${source.dir}/surefire-excludes.txt"
            grep -vE '^[[:space:]]*(#|$)' "${excludes_src}" > "${excludes_file}"

            mvn -s ${source.dir}/maven-settings.xml -B package \
              -pl openmetadata-service -am \
              -DfailIfNoTests=false \
              -Dsurefire.excludesFile="${excludes_file}"
            mvn -s ${source.dir}/maven-settings.xml -B package -DskipTests \
              -pl '!openmetadata-integration-tests,!openmetadata-k8s-operator,!openmetadata-mcp,!openmetadata-clients'
        - name: build
          runs: |
            set -eux -o pipefail

            mkdir -p ${target.dir}/opt/openmetadata
            tar zxvf openmetadata-dist/target/openmetadata-*.tar.gz \
              -C ${target.dir}/opt/openmetadata --strip-components 1
            mkdir -p ${target.dir}/opt/openmetadata/logs
            mkdir -p ${target.dir}/usr/bin
            install -m 0755 docker/openmetadata-start.sh \
              ${target.dir}/usr/bin/openmetadata-start
        - uses: dhi/build-pkg:0
          privileged: true
          with:
            depends:
              - bash
              - coreutils
            description: OpenMetadata server
            files:
              - opt/openmetadata
              - usr/bin/openmetadata-start
            license: Apache-2.0
            name: openmetadata-server-1.12
            rel: 3
            url: https://open-metadata.org/
            version: 1.12.13
      paths:
        - type: file
          path: ${source.dir}/maven-settings.xml
          uid: 0
          gid: 0
          source: package/main/openmetadata-server/files/maven-settings.xml
        - type: file
          path: ${source.dir}/surefire-excludes-1.12.txt
          uid: 0
          gid: 0
          source: package/main/openmetadata-server/files/surefire-excludes-1.12.txt
        - type: file
          path: ${source.dir}/surefire-excludes-1.13.txt
          uid: 0
          gid: 0
          source: package/main/openmetadata-server/files/surefire-excludes-1.13.txt
        - type: file
          path: ${source.dir}/patch/mvn-properties.json
          uid: 0
          gid: 0
          source: package/main/openmetadata-server/patch/mvn-properties.json
        - type: file
          path: ${source.dir}/patch/mvn-dependencies.json
          uid: 0
          gid: 0
          source: package/main/openmetadata-server/patch/mvn-dependencies.json
        - type: file
          path: ${source.dir}/patch/mvn-calcite-dependencies.json
          uid: 0
          gid: 0
          source: package/main/openmetadata-server/patch/mvn-calcite-dependencies.json
os-release:
  name: Docker Hardened Images (Debian)
  id: debian
  version-id: "13"
  version-codename: trixie
  pretty-name: Docker Hardened Images/Debian GNU/Linux 13 (trixie)
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
