# syntax=dhi.io/build:2-debian13

image: dhi.io/pkg-azure-cli
variant: runtime
tags:
  - 2.91.0
  - 2.91.0-r3
  - 2.91.0-debian13
  - 2.91.0-r3-debian13
platforms:
  - linux/amd64
  - linux/arm64
vars:
  PYTHON_MINOR: "3.13"
  PYTHON_VERSION: 3.13.18-2
  REL: "3"
  SEMVER_MAJOR_MINOR_VERSION: "2.91"
  SEMVER_MAJOR_VERSION: "2"
  SEMVER_VERSION: 2.91.0
  VERSION: 2.91.0
contents:
  packages:
    - base-files
  builds:
    - name: azure-cli
      contents:
        repositories:
          - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
        keyring:
          - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
        packages:
          - bash
          - coreutils
          - findutils
          - sed
          - ca-certificates
          - libpython-3.13=3.13.18-2
          - libpython-3.13-minimal=3.13.18-2
          - libpython-3.13-stdlib=3.13.18-2
          - python-3.13-minimal=3.13.18-2
          - python-3.13=3.13.18-2
          - python3-pip-whl
          - python3-setuptools-whl
      pipeline:
        - name: create virtual environment
          runs: |
            set -eux -o pipefail

            python3 -m venv "${target.dir}/opt/azure-cli"
        - name: install azure-cli
          privileged: true
          runs: |
            set -eux -o pipefail

            "${target.dir}/opt/azure-cli/bin/pip" install --no-cache-dir \
              "pip>=26.1.2" # CVE-2025-8869 CVE-2026-1703 CVE-2026-3219 CVE-2026-6357 CVE-2026-8643
            "${target.dir}/opt/azure-cli/bin/pip" install --no-cache-dir --only-binary=:all: \
              "azure-cli==2.91.0"
            "${target.dir}/opt/azure-cli/bin/pip" install --no-cache-dir --only-binary=:all: \
              "msal>=1.37.0"
            "${target.dir}/opt/azure-cli/bin/pip" install --no-cache-dir --only-binary=:all: \
              "cryptography>=50.0.0" # CVE-2026-69247 CVE-2026-69249 CVE-2026-69248
            "${target.dir}/opt/azure-cli/bin/pip" install --no-cache-dir --only-binary=:all: \
              "oauthlib>=4.0.0" # CVE-2026-49264 CVE-2026-49265
            "${target.dir}/opt/azure-cli/bin/pip" install --no-cache-dir --only-binary=:all: \
              "pyjwt>=2.14.0" # CVE-2026-102274
            "${target.dir}/opt/azure-cli/bin/pip" install --no-cache-dir --only-binary=:all: --upgrade \
              "urllib3>=2.8.0" # CVE-2026-97687 CVE-2026-97688 CVE-2026-97689
            "${target.dir}/opt/azure-cli/bin/pip" install --no-cache-dir --only-binary=:all: --upgrade \
              "certifi>=2026.10.19" # GHSA-6q48-6c7w-9gw2
            "${target.dir}/opt/azure-cli/bin/pip" install --no-cache-dir --only-binary=:all: --upgrade \
              "msgpack>=1.2.3" # CVE-2026-114613
        - name: align pip vendored urllib3 with site packages
          runs: |
            set -eux -o pipefail

            sp=$(echo "${target.dir}/opt/azure-cli/lib"/python*/site-packages)
            rm -rf "$sp/pip/_vendor/urllib3"
            cp -a "$sp/urllib3" "$sp/pip/_vendor/urllib3"
            sed -i 's/urllib3==2\.7\.0/urllib3==2.8.0/' "$sp/pip/_vendor/vendor.txt"
            sed -i 's/pkg:pypi\/urllib3@2\.7\.0/pkg:pypi\/urllib3@2.8.0/g' "$sp/pip/_vendor/bom.cdx.json"
            sed -i 's/"version": "2.7.0"/"version": "2.8.0"/' "$sp/pip/_vendor/bom.cdx.json"
            "${target.dir}/opt/azure-cli/bin/pip" --version
        - name: align pip vendored certifi with site packages
          runs: |
            set -eux -o pipefail

            sp=$(echo "${target.dir}/opt/azure-cli/lib"/python*/site-packages)
            certifi_ver=$(basename "$(echo "$sp"/certifi-*.dist-info)" .dist-info | sed 's/^certifi-//')
            rm -rf "$sp/pip/_vendor/certifi"
            cp -a "$sp/certifi" "$sp/pip/_vendor/certifi"
            sed -i "s/certifi==2026\\.6\\.17/certifi==${certifi_ver}/" "$sp/pip/_vendor/vendor.txt"
            sed -i "s/pkg:pypi\\/certifi@2026\\.6\\.17/pkg:pypi\\/certifi@${certifi_ver}/g" "$sp/pip/_vendor/bom.cdx.json"
            sed -i "s/pkg:pypi\\/certifi@2026\\.7\\.22/pkg:pypi\\/certifi@${certifi_ver}/g" "$sp/pip/_vendor/bom.cdx.json"
            sed -i 's/"name": "certifi", "version": "2026.6.17"/"name": "certifi", "version": "'"${certifi_ver}"'"/' "$sp/pip/_vendor/bom.cdx.json"
            sed -i 's/"name": "certifi", "version": "2026.7.22"/"name": "certifi", "version": "'"${certifi_ver}"'"/' "$sp/pip/_vendor/bom.cdx.json"
            sed -i 's/"version": "2026\.6\.17"/"version": "'"${certifi_ver}"'"/' "$sp/pip/_vendor/bom.cdx.json"
            sed -i 's/"version": "2026\.7\.22"/"version": "'"${certifi_ver}"'"/' "$sp/pip/_vendor/bom.cdx.json"
        - name: align pip vendored msgpack with site packages
          runs: |
            set -eux -o pipefail

            sp=$(echo "${target.dir}/opt/azure-cli/lib"/python*/site-packages)
            msgpack_ver=$(basename "$(echo "$sp"/msgpack-*.dist-info)" .dist-info | sed 's/^msgpack-//')
            rm -rf "$sp/pip/_vendor/msgpack"
            cp -a "$sp/msgpack" "$sp/pip/_vendor/msgpack"
            if [ -f "$sp/msgpack-${msgpack_ver}.dist-info/licenses/COPYING" ]; then
              cp -a "$sp/msgpack-${msgpack_ver}.dist-info/licenses/COPYING" "$sp/pip/_vendor/msgpack/COPYING"
            fi
            sed -i "s/msgpack==1\\.1\\.2/msgpack==${msgpack_ver}/" "$sp/pip/_vendor/vendor.txt"
            "${target.dir}/opt/azure-cli/bin/python" -c 'import json, sys; path, ver = sys.argv[1], sys.argv[2]; doc = json.load(open(path, encoding="utf-8")); purl = f"pkg:pypi/msgpack@{ver}"; [c.update({"version": ver, "purl": purl, "bom-ref": purl}) for c in doc.get("components", []) if c.get("name") == "msgpack"]; [[d.__setitem__("dependsOn", [purl if "msgpack" in x else x for x in d["dependsOn"]]) for d in doc.get("dependencies", []) if "dependsOn" in d]]; json.dump(doc, open(path, "w", encoding="utf-8"), separators=(",", ":"))' \
              "$sp/pip/_vendor/bom.cdx.json" "$msgpack_ver"
        - name: drop pip vendored setuptools from SBOM
          runs: |
            set -eux -o pipefail

            sp=$(echo "${target.dir}/opt/azure-cli/lib"/python*/site-packages)
            rm -rf "$sp/pip/_vendor/pkg_resources"
            sed -i '/^setuptools==/d' "$sp/pip/_vendor/vendor.txt"
            if [ -f "$sp/pip/_vendor/bom.cdx.json" ]; then
              "${target.dir}/opt/azure-cli/bin/python" -c 'import json, sys; path=sys.argv[1]; doc=json.load(open(path, encoding="utf-8")); doc["components"]=[c for c in (doc.get("components") or []) if c.get("name") != "setuptools"]; json.dump(doc, open(path, "w", encoding="utf-8"), separators=(",", ":"))' \
                "$sp/pip/_vendor/bom.cdx.json"
            fi
            "${target.dir}/opt/azure-cli/bin/pip" --version
        - name: fix venv build paths
          runs: |
            set -eux -o pipefail

            for f in "${target.dir}/opt/azure-cli/bin"/* \
              "${target.dir}/opt/azure-cli/pyvenv.cfg"; do
              [ -f "$f" ] && [ ! -L "$f" ] || continue
              sed -i "s|${target.dir}||g" "$f"
            done

            rc=0
            for f in "${target.dir}/opt/azure-cli/bin"/* \
              "${target.dir}/opt/azure-cli/pyvenv.cfg"; do
              [ -f "$f" ] && [ ! -L "$f" ] || continue
              while read -r line || [ -n "$line" ]; do
                case "$line" in
                  *"${target.dir}"*)
                    echo "staging path leaked into ${f##*/}: $line" >&2
                    rc=1
                    ;;
                esac
              done < "$f"
            done
            [ "$rc" -eq 0 ]
        - name: strip build tooling and python cache
          runs: |
            set -eux -o pipefail

            sp=$(echo "${target.dir}/opt/azure-cli/lib"/python*/site-packages)
            rm -rf "$sp"/setuptools "$sp"/setuptools-*.dist-info \
              "$sp"/pkg_resources \
              "$sp"/_distutils_hack "$sp"/distutils-precedence.pth \
              "$sp"/wheel "$sp"/wheel-*.dist-info \
              "${target.dir}/opt/azure-cli/bin/wheel"

            find "${target.dir}/opt/azure-cli" \
              \( -type d -a \( -name test -o -name tests -o -name __pycache__ \) \) \
              -o \( -type f -a \( -name '*.pyc' -o -name '*.pyo' \) \) \
              -exec rm -rf '{}' + || true
        - name: prune unused venv console scripts
          runs: |
            set -eux -o pipefail

            for f in "${target.dir}/opt/azure-cli/bin"/*; do
              [ -e "$f" ] || continue
              case "${f##*/}" in
                az | az.completion.sh | register-python-argcomplete | activate) continue ;;
                python | python3 | python3.* | pip | pip3 | pip3.*) continue ;;
                *) rm -rf "$f" ;;
              esac
            done

            test -x "${target.dir}/opt/azure-cli/bin/az"
        - name: create usr/bin symlink
          runs: |
            set -eux -o pipefail

            mkdir -p "${target.dir}/usr/bin"
            ln -sf /opt/azure-cli/bin/az "${target.dir}/usr/bin/az"
        - uses: dhi/build-pkg:0
          with:
            depends:
              - python-3.13-minimal
              - libpython-3.13-stdlib
            description: Azure CLI - Microsoft's command-line tool for managing Azure resources
            files:
              - usr
              - opt
            formats:
              - deb
            license: MIT
            name: azure-cli
            rel: 3
            url: https://github.com/Azure/azure-cli
            version: 2.91.0
os-release:
  name: Docker Hardened Images (Debian)
  id: debian
  version-id: "13"
  version-codename: trixie
  pretty-name: Docker Hardened Images/Debian GNU/Linux 13 (trixie)
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
