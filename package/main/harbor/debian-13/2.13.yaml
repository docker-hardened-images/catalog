# syntax=dhi.io/build:2-debian13

image: dhi.io/pkg-harbor
variant: runtime
tags:
  - 2.13.5
  - 2.13.5-r4
  - 2.13.5-debian13
  - 2.13.5-r4-debian13
platforms:
  - linux/amd64
  - linux/arm64
dates:
  release: "2025-04-09"
vars:
  COMMIT_SHA: ffae54219c89f7f486f17694681232dd70787db1
  GO_SWAGGER_CHECKSUM: '#{ target.arch == "amd64" ? "sha256:94d63ada4aad825d75ead80c8dba048dbd4c4a013376df9f5b848a41899e9b04" : "sha256:b954b0b36144f2cbe65ab1477dd90d7739b5361b2b9004f73d855753c12c6594" }'
  GO_SWAGGER_VERSION: v0.31.0
  GOLANG_MAJOR_MINOR_VERSION: "1.26"
  GOLANG_VERSION: 1.26.8-0
  PACKAGE_NAME: harbor-2.13
  REL: "4"
  SEMVER_MAJOR_MINOR_VERSION: "2.13"
  SEMVER_MAJOR_VERSION: "2"
  SEMVER_VERSION: 2.13.5
  VERSION: 2.13.5
contents:
  packages:
    - base-files
  builds:
    - name: harbor
      work-dir: /go/src/github.com/goharbor/harbor
      caches:
        - path: /go/pkg/mod
      contents:
        repositories:
          - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
        keyring:
          - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
        packages:
          - bash
          - binutils
          - build-essential
          - ca-certificates-bundle
          - coreutils
          - findutils
          - golang-1.26=1.26.8-0
          - golang-1.26-oci-config=1.26.8-0
          - mawk
          - sed
          - wget
        files:
          - url: git+https://github.com/goharbor/harbor.git#v2.13.5
            checksum: ffae54219c89f7f486f17694681232dd70787db1
            path: /go/src/github.com/goharbor/harbor
            spdx:
              name: harbor
              version: 2.13.5
              packages:
                - name: harbor
                  purl: pkg:golang/github.com/goharbor/harbor@2.13.5
                  license: Apache-2.0
            uid: 0
            gid: 0
          - url: https://github.com/go-swagger/go-swagger/releases/download/v0.31.0/swagger_linux_${target.arch}
            checksum: ${GO_SWAGGER_CHECKSUM}
            path: /usr/local/bin/swagger
            spdx:
              name: go-swagger
              version: v0.31.0
              packages:
                - name: go-swagger
                  purl: pkg:golang/github.com/go-swagger/go-swagger@v0.31.0
                  license: Apache-2.0
            uid: 0
            gid: 0
            mode: "755"
      pipeline:
        - name: generate-swagger
          runs: |
            set -eux -o pipefail

            /usr/local/bin/swagger generate server \
              --template-dir=tools/swagger/templates \
              --exclude-main \
              --additional-initialism=CVE \
              --additional-initialism=GC \
              --additional-initialism=OIDC \
              -f api/v2.0/swagger.yaml \
              -A harbor \
              --target src/server/v2.0
        - name: patch vulnerable go dependencies (2.13 only)
          uses: go/bump@v2
          work-dir: /go/src/github.com/goharbor/harbor/src
          with:
            deps:
              - golang.org/x/crypto@v0.52.0
              - golang.org/x/net@v0.55.0
              - github.com/Azure/go-ntlmssp@v0.1.1
              - github.com/go-jose/go-jose/v4@v4.1.4
              - github.com/gorilla/csrf@v1.7.3
              - github.com/klauspost/compress@v1.18.7
              - go.mongodb.org/mongo-driver@v1.17.7
              - go.opentelemetry.io/otel/exporters/otlp/otlptrace/otlptracehttp@v1.45.0
              - helm.sh/helm/v3@v3.20.2
            download: true
        - name: test
          work-dir: /go/src/github.com/goharbor/harbor/src
          privileged: true
          runs: |
            set -eux -o pipefail

            GODEBUG= go test ./core ./core/auth ./core/session \
              -run '^(TestUpdateInitPasswordWithMgr_|TestDefault|TestErrAuth|TestCodec)$' \
              -count=1
        - name: build harbor-core
          uses: go/build@v1
          work-dir: /go/src/github.com/goharbor/harbor/src/core
          with:
            fips: false
            ldflags:
              - -X github.com/goharbor/harbor/src/pkg/version.ReleaseVersion=2.13.5
              - -X github.com/goharbor/harbor/src/pkg/version.GitCommit=ffae54219c89f7f486f17694681232dd70787db1
            output: ${target.dir}/usr/bin/harbor-core
        - name: build harbor-core dev
          uses: go/build@v1
          work-dir: /go/src/github.com/goharbor/harbor/src/core
          with:
            fips: false
            ldflags:
              - -X github.com/goharbor/harbor/src/pkg/version.ReleaseVersion=2.13.5
              - -X github.com/goharbor/harbor/src/pkg/version.GitCommit=ffae54219c89f7f486f17694681232dd70787db1
            output: ${target.dir}/usr/bin/harbor-core-dev
            strip: false
        - name: stage static assets
          runs: |
            set -eux -o pipefail

            mkdir -p \
              "${target.dir}/usr/share/harbor" \
              "${target.dir}/usr/share/harbor-dev"
            cp -r src/core/views icons make/migrations "${target.dir}/usr/share/harbor/"
            cp -r src/core/views icons make/migrations "${target.dir}/usr/share/harbor-dev/"
        - uses: dhi/build-pkg:0
          with:
            description: Harbor Core registry control plane
            files:
              - usr/bin/harbor-core
              - usr/share/harbor
            formats:
              - deb
            license: Apache-2.0
            name: harbor-2.13
            rel: 4
            subpackages:
              - files:
                  - path: usr/bin/harbor-core
                    source: usr/bin/harbor-core-dev
                  - path: usr/share/harbor
                    source: usr/share/harbor-dev
                name: harbor-2.13-dev
            url: https://goharbor.io/
            version: 2.13.5
os-release:
  name: Docker Hardened Images (Debian)
  id: debian
  version-id: "13"
  version-codename: trixie
  pretty-name: Docker Hardened Images/Debian GNU/Linux 13 (trixie)
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
