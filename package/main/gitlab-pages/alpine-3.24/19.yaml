image: dhi.io/pkg-gitlab-pages
variant: runtime
tags:
  - 19.5.2-alpine3.24
  - 19.5.2-r1-alpine3.24
platforms:
  - linux/amd64
  - linux/arm64
vars:
  COMMIT_SHA: 893a0a5df82ec034d148ad569377508bef2d6640
  GOLANG_VERSION: 1.26.10-r0
  PACKAGE_NAME: gitlab-pages
  REL: "1"
  SEMVER_MAJOR_MINOR_VERSION: "19.5"
  SEMVER_MAJOR_VERSION: "19"
  SEMVER_VERSION: 19.5.2
  VERSION: 19.5.2
contents:
  repositories:
    - https://dhi.io/apk/alpine/v3.24/main
    - https://dhi.io/apk/alpine/v3.23/main
    - https://dl-cdn.alpinelinux.org/alpine/v3.24/main
    - https://dl-cdn.alpinelinux.org/alpine/v3.24/community
  keyring:
    - https://dhi.io/keyring/dhi-apk@docker-0F81AD7700D99184.rsa.pub
  packages:
    - alpine-baselayout-data
  builds:
    - name: gitlab-pages
      work-dir: /go/src/gitlab.com/gitlab-org/gitlab-pages
      contents:
        packages:
          - busybox
          - bash
          - ca-certificates-bundle
          - golang-1.26=1.26.10-r0
          - golang-1.26-oci-config=1.26.10-r0
        files:
          - url: git+https://gitlab.com/gitlab-org/gitlab-pages.git#v19.5.2
            checksum: 893a0a5df82ec034d148ad569377508bef2d6640
            path: /go/src/gitlab.com/gitlab-org/gitlab-pages
            spdx:
              name: gitlab-pages
              version: 19.5.2
              packages:
                - name: gitlab-pages
                  purl: pkg:golang/gitlab.com/gitlab-org/gitlab-pages@19.5.2
                  license: MIT
            uid: 0
            gid: 0
      pipeline:
        - name: update go dependencies
          uses: go/bump@v2
          with:
            deps:
              - golang.org/x/net@v0.62.0
              - google.golang.org/grpc@v1.83.2
            download: true
        - uses: go/hermetic@v1
        - name: test
          runs: |
            set -eux -o pipefail

            CGO_ENABLED=0 go test -short $(go list ./internal/... | grep -Ev '/internal/(httprange|logging/slowlogs|source/gitlab/cache)$')
        - name: build
          uses: go/build@v1
          with:
            cgo_enabled: 0
            fips: false
            ldflags:
              - -X main.VERSION=19.5.2
              - -X main.REVISION=893a0a5df82ec034d148ad569377508bef2d6640
            output: ${target.dir}/usr/bin/gitlab-pages
            packages: .
            strip: false
            tags:
              - continuous_profiler_stackdriver
        - uses: dhi/build-pkg:0
          with:
            description: GitLab Pages daemon serving static websites from GitLab projects
            files:
              - usr/bin/gitlab-pages
            license: MIT
            name: gitlab-pages
            rel: 1
            url: https://gitlab.com/gitlab-org/gitlab-pages
            version: 19.5.2
