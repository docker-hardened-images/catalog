# syntax=dhi.io/build:2-alpine3.24

image: dhi.io/pkg-gitlab-pages
variant: runtime
tags:
  - 19.4.1-alpine3.24
  - 19.4.1-r2-alpine3.24
platforms:
  - linux/amd64
  - linux/arm64
vars:
  COMMIT_SHA: ddf88a1750ea87def401f210f17b7c63e03cf409
  GOLANG_VERSION: 1.26.8-r1
  PACKAGE_NAME: gitlab-pages
  REL: "2"
  SEMVER_MAJOR_MINOR_VERSION: "19.4"
  SEMVER_MAJOR_VERSION: "19"
  SEMVER_VERSION: 19.4.1
  VERSION: 19.4.1
contents:
  repositories:
    - https://dhi.io/apk/alpine/v3.24/main
    - https://dhi.io/apk/alpine/v3.23/main
    - https://dl-cdn.alpinelinux.org/alpine/v3.24/main
    - https://dl-cdn.alpinelinux.org/alpine/v3.24/community
  keyring:
    - https://dhi.io/keyring/dhi-apk@docker-0F81AD7700D99184.rsa.pub
  packages:
    - alpine-baselayout-data
  builds:
    - name: gitlab-pages
      work-dir: /go/src/gitlab.com/gitlab-org/gitlab-pages
      contents:
        packages:
          - busybox
          - bash
          - ca-certificates-bundle
          - golang-1.26=1.26.8-r1
          - golang-1.26-oci-config=1.26.8-r1
        files:
          - url: git+https://gitlab.com/gitlab-org/gitlab-pages.git#v19.4.1
            checksum: ddf88a1750ea87def401f210f17b7c63e03cf409
            path: /go/src/gitlab.com/gitlab-org/gitlab-pages
            spdx:
              name: gitlab-pages
              version: 19.4.1
              packages:
                - name: gitlab-pages
                  purl: pkg:golang/gitlab.com/gitlab-org/gitlab-pages@19.4.1
                  license: MIT
            uid: 0
            gid: 0
      pipeline:
        - name: update go dependencies
          uses: go/bump@v2
          with:
            deps:
              - golang.org/x/crypto@v0.56.0
              - google.golang.org/grpc@v1.83.2
            download: true
        - uses: go/hermetic@v1
        - name: fix IPv6 request test for Go 1.26
          uses: git/patch@v1
          with:
            patch: go126-ipv6-request-test.patch
        - name: test
          runs: |
            set -eux -o pipefail

            CGO_ENABLED=0 go test -short $(go list ./internal/... | grep -Ev '/internal/(httprange|logging/slowlogs|request|source/gitlab/cache)$')
        - name: build
          uses: go/build@v1
          with:
            cgo_enabled: 0
            fips: false
            ldflags:
              - -X main.VERSION=19.4.1
              - -X main.REVISION=ddf88a1750ea87def401f210f17b7c63e03cf409
            output: ${target.dir}/usr/bin/gitlab-pages
            packages: .
            strip: false
            tags:
              - continuous_profiler_stackdriver
        - uses: dhi/build-pkg:0
          with:
            description: GitLab Pages daemon serving static websites from GitLab projects
            files:
              - usr/bin/gitlab-pages
            license: MIT
            name: gitlab-pages
            rel: 2
            url: https://gitlab.com/gitlab-org/gitlab-pages
            version: 19.4.1
      paths:
        - type: file
          path: /go/src/gitlab.com/gitlab-org/gitlab-pages/go126-ipv6-request-test.patch
          uid: 0
          gid: 0
          source: package/main/gitlab-pages/patch/go126-ipv6-request-test.patch
os-release:
  name: Docker Hardened Images (Alpine)
  id: alpine
  version-id: "3.24"
  pretty-name: Docker Hardened Images/Alpine Linux v3.24
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
