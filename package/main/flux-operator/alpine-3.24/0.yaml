# syntax=dhi.io/build:2-alpine3.24

image: dhi.io/pkg-flux-operator
variant: runtime
tags:
  - 0.58.1-alpine3.24
  - 0.58.1-r1-alpine3.24
platforms:
  - linux/amd64
  - linux/arm64
dates:
  release: "2024-05-29"
vars:
  COMMIT_SHA: b3b36020aca1f8d2172c76949c0bcb6bbf688dde
  PACKAGE_NAME: flux-operator
  REL: "1"
  SEMVER_MAJOR_MINOR_VERSION: "0.58"
  SEMVER_MAJOR_VERSION: "0"
  SEMVER_VERSION: 0.58.1
  VERSION: 0.58.1
contents:
  repositories:
    - https://dhi.io/apk/alpine/v3.24/main
    - https://dhi.io/apk/alpine/v3.23/main
    - https://dl-cdn.alpinelinux.org/alpine/v3.24/main
    - https://dl-cdn.alpinelinux.org/alpine/v3.24/community
  keyring:
    - https://dhi.io/keyring/dhi-apk@docker-0F81AD7700D99184.rsa.pub
  packages:
    - alpine-baselayout-data
  builds:
    - name: flux-operator
      work-dir: /go/src/github.com/controlplaneio-fluxcd/flux-operator
      caches:
        - path: /root/.npm
      contents:
        packages:
          - bash
          - ca-certificates-bundle
          - coreutils
          - findutils
          - git
          - golang-1.26
          - golang-1.26-oci-config
          - mawk
          - nodejs-24
          - npm
          - sed
        files:
          - url: git+https://github.com/controlplaneio-fluxcd/flux-operator.git#v0.58.1
            checksum: b3b36020aca1f8d2172c76949c0bcb6bbf688dde
            path: /go/src/github.com/controlplaneio-fluxcd/flux-operator
            spdx:
              name: flux-operator
              version: 0.58.1
              packages:
                - name: flux-operator
                  purl: pkg:golang/github.com/controlplaneio-fluxcd/flux-operator@0.58.1
                  license: AGPL-3.0
            uid: 0
            gid: 0
      pipeline:
        - name: update go dependencies
          uses: go/bump@v2
          with:
            deps:
              - github.com/go-git/go-git/v5@v5.19.2
              - github.com/google/cel-go@v0.30.0
              - google.golang.org/grpc@v1.83.1
            download: true
        - uses: go/hermetic@v1
        - name: relax npm min release age
          work-dir: /go/src/github.com/controlplaneio-fluxcd/flux-operator/web
          runs: |
            set -eux -o pipefail

            echo 'min-release-age=3' > .npmrc
        - name: bump web ui dependencies
          uses: npm/bump@v1
          work-dir: /go/src/github.com/controlplaneio-fluxcd/flux-operator/web
          privileged: true
          with:
            bumps: ${source.dir}/patch/npm-bumps.json
            npm-root: /go/src/github.com/controlplaneio-fluxcd/flux-operator/web
            omit-dev: false
        - name: build web ui
          work-dir: /go/src/github.com/controlplaneio-fluxcd/flux-operator/web
          privileged: true
          runs: |
            set -eux -o pipefail

            npm ci
            npm run build
            npm prune --omit=dev
        - name: web ui sbom
          uses: sbom@v1
          with:
            extra-scanners: javascript-package-cataloger
            prefix: flux-operator-ui
            source: /go/src/github.com/controlplaneio-fluxcd/flux-operator/web/node_modules
        - name: test
          privileged: true
          runs: |
            set -eux -o pipefail

            CGO_ENABLED=0 go test ./api/...
        - name: build flux-operator
          uses: go/build@v1
          with:
            fips: true
            ldflags:
              - -X main.VERSION=0.58.1
            output: ${target.dir}/usr/bin/flux-operator
            packages: ./cmd/operator
            strip: true
        - name: build flux-operator dev
          uses: go/build@v1
          with:
            fips: true
            ldflags:
              - -X main.VERSION=0.58.1
            output: ${target.dir}/usr/bin/flux-operator-dev
            packages: ./cmd/operator
            strip: false
        - name: stage flux distribution manifests
          runs: |
            set -eux -o pipefail

            mkdir -p ${target.dir}/usr/share/flux-operator
            cp -a config/data ${target.dir}/usr/share/flux-operator/data
            cp -a config/data ${target.dir}/usr/share/flux-operator/data-dev
        - uses: dhi/build-pkg:0
          with:
            description: Kubernetes operator that manages the lifecycle of Flux CD
            files:
              - usr/bin/flux-operator
              - usr/share/flux-operator/data
            license: AGPL-3.0
            name: flux-operator
            rel: 1
            subpackages:
              - description: flux-operator binary without strip (dev)
                files:
                  - path: usr/bin/flux-operator
                    source: usr/bin/flux-operator-dev
                  - path: usr/share/flux-operator/data
                    source: usr/share/flux-operator/data-dev
                name: flux-operator-dev
            url: https://fluxoperator.dev
            version: 0.58.1
      paths:
        - type: file
          path: ${source.dir}/patch/npm-bumps.json
          uid: 0
          gid: 0
          source: package/main/flux-operator/patch/npm-bumps.json
os-release:
  name: Docker Hardened Images (Alpine)
  id: alpine
  version-id: "3.24"
  pretty-name: Docker Hardened Images/Alpine Linux v3.24
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
