                - name: forklift-api
                  purl: pkg:golang/github.com/kubev2v/forklift@2.12.7
                  license: Apache-2.0
            uid: 0
            gid: 0
      pipeline:
        - name: remove vendor directory
          runs: |
            set -eux -o pipefail

            rm -rf vendor
        - name: update go dependencies
          uses: go/bump@v2
          with:
