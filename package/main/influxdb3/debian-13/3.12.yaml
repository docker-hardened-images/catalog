# syntax=dhi.io/build:2-debian13

image: dhi.io/pkg-influxdb3
variant: runtime
tags:
  - 3.12.2
  - 3.12.2-r1
  - 3.12.2-debian13
  - 3.12.2-r1-debian13
platforms:
  - linux/amd64
  - linux/arm64
dates:
  release: "2026-10-15"
vars:
  CARGO_VERSION: 1.97.1-0
  COMMIT_SHA: cc9769917ab399ed5b48567a92b5d34ed4d918ea
  PACKAGE_NAME: influxdb3-3.12
  PYTHON_MAJOR_MINOR_VERSION: "3.13"
  PYTHON_VERSION: 3.13.18-7
  REL: "1"
  RUSTC_VERSION: 1.97.1-0
  SEMVER_MAJOR_MINOR_VERSION: "3.12"
  SEMVER_MAJOR_VERSION: "3"
  SEMVER_VERSION: 3.12.2
  VERSION: 3.12.2
contents:
  repositories:
    - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
  keyring:
    - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
  packages:
    - base-files
  builds:
    - name: influxdb3
      work-dir: ${source.dir}/influxdb3
      shell: /bin/bash
      caches:
        - path: /root/.cargo
      contents:
        packages:
          - bash
          - binutils
          - build-essential
          - ca-certificates
          - cargo-1.97=1.97.1-0
          - coreutils
          - findutils
          - gawk
          - git
          - grep
          - libbz2-1.0
          - libcrypt1
          - libcurl4t64
          - libdb5.3t64
          - libexpat1
          - libexpat1-dev
          - libffi8
          - libgcc-s1
          - libgdbm-compat4t64
          - libgdbm6
          - liblzma5
          - libncursesw6
          - libprotobuf-dev
          - libpython-3.13=3.13.18-7
          - libpython-3.13-dev=3.13.18-7
          - libpython-3.13-minimal=3.13.18-7
          - libpython-3.13-stdlib=3.13.18-7
          - libreadline8t64
          - libsqlite3-0
          - libssl3t64
          - libstdc++6
          - libtinfo6
          - libuuid1
          - libzstd1
          - lld
          - protobuf-compiler
          - python-3.13=3.13.18-7
          - python-3.13-dev=3.13.18-7
          - python-3.13-minimal=3.13.18-7
          - rustc-1.97=1.97.1-0
          - sed
          - zlib1g
          - zlib1g-dev
        files:
          - url: git+https://github.com/influxdata/influxdb.git#v3.12.2
            checksum: cc9769917ab399ed5b48567a92b5d34ed4d918ea
            path: ${source.dir}/influxdb3
            spdx:
              name: influxdb3
              version: 3.12.2
              packages:
                - name: influxdb3
                  purl: pkg:cargo/influxdb3@3.12.2
                  license: MIT OR Apache-2.0
            uid: 0
            gid: 0
      pipeline:
        - name: bump cargo dependencies
          uses: cargo/bump@v1
          with:
            deps:
              - quinn-proto@0.11.19
              - quinn-udp@0.5.16
              - serde_with@3.21.0
              - rustls-webpki@0.103.13@0.103.16
              - rustls@0.23.40@0.23.46
              - cap-primitives@3.4.6
              - webpki-roots@1.0.7@1.0.10
              - webpki-root-certs@1.0.10
              - anyhow@1.0.103
              - event-listener@5.4.2
              - pulldown-cmark@0.13.6
              - tokio@1.53.3
              - zstd-sys@2.1.2
              - zstd-safe@7.4.0
              - zstd@0.13.4
              - arrow-buffer@57.3.2
              - arrow-schema@57.3.2
              - arrow-data@57.3.2
        - name: bump rustix on 3.12
          uses: cargo/bump@v1
          with:
            deps:
              - rustix@1.1.5@1.1.6
        - name: bump wasmtime cargo dependencies
          uses: cargo/bump@v1
          with:
            deps:
              - wasmtime@48.0.9
              - wasmtime-wasi@48.0.9
              - wasmtime-wasi-http@48.0.9
        - name: cargo sbom
          uses: sbom@v1
          with:
            extra-scanners: rust-cargo-lock-cataloger
            prefix: influxdb3-cargo
            source: ${source.dir}/influxdb3
        - name: configure PYO3
          runs: |
            set -eux -o pipefail

            cat > "${source.dir}/pyo3_config_file.txt" << EOF
            implementation=CPython
            version=3.13
            shared=true
            abi3=false
            lib_name=python3.13
            lib_dir=/usr/lib
            executable=/usr/bin/python3.13
            pointer_width=64
            build_flags=
            suppress_build_script_link_lines=false
            EOF
        - name: build
          privileged: true
          runs: |
            set -eux -o pipefail

            export PYO3_CONFIG_FILE="${source.dir}/pyo3_config_file.txt"
            export CARGO_PROFILE_RELEASE_LTO=thin
            export CARGO_BUILD_JOBS="${CARGO_BUILD_JOBS:-4}"
            cargo build --release
        - name: install
          runs: |
            set -eux -o pipefail

            install -D target/release/influxdb3 \
              '${target.dir}/usr/bin/influxdb3'
        - name: stage sbom
          runs: |
            set -eux -o pipefail

            test -d /opt/docker/sbom/influxdb3
            test -d /opt/docker/sbom/influxdb3-cargo
            install -d "${target.dir}/opt/docker/sbom"
            cp -a /opt/docker/sbom/influxdb3 /opt/docker/sbom/influxdb3-cargo "${target.dir}/opt/docker/sbom/"
        - uses: dhi/build-pkg:0
          with:
            depends:
              - bash
              - coreutils
              - libc6
              - libgcc-s1
              - libpython-3.13
              - libstdc++6
              - python-3.13
            description: InfluxDB 3 Core time series database
            files:
              - usr/bin/influxdb3
              - opt/docker/sbom/influxdb3
              - opt/docker/sbom/influxdb3-cargo
            formats:
              - deb
            license: MIT OR Apache-2.0
            name: influxdb3-3.12
            rel: 1
            url: https://github.com/influxdata/influxdb
            version: 3.12.2
      paths:
        - type: file
          path: ${source.dir}/cargo-bumps.json
          uid: 0
          gid: 0
          source: package/main/influxdb3/patch/3.10/cargo-bumps.json
os-release:
  name: Docker Hardened Images (Debian)
  id: debian
  version-id: "13"
  version-codename: trixie
  pretty-name: Docker Hardened Images/Debian GNU/Linux 13 (trixie)
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
