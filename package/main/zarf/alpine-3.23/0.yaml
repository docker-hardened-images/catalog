# syntax=dhi.io/build:2-alpine3.23

image: dhi.io/pkg-zarf
variant: runtime
tags:
  - 0.89.0-alpine3.23
  - 0.89.0-r2-alpine3.23
platforms:
  - linux/amd64
  - linux/arm64
vars:
  COMMIT_SHA: 6da2a6d7867f355af281e5a33a9d849174c4c2d2
  GOLANG_VERSION: 1.26.11-r0
  PACKAGE_NAME: zarf
  REL: "2"
  SEMVER_MAJOR_MINOR_VERSION: "0.89"
  SEMVER_MAJOR_VERSION: "0"
  SEMVER_VERSION: 0.89.0
  VERSION: 0.89.0
contents:
  repositories:
    - https://dhi.io/apk/alpine/v3.23/main
    - https://dl-cdn.alpinelinux.org/alpine/v3.23/main
    - https://dl-cdn.alpinelinux.org/alpine/v3.23/community
  keyring:
    - https://dhi.io/keyring/dhi-apk@docker-0F81AD7700D99184.rsa.pub
  packages:
    - alpine-baselayout-data
  builds:
    - name: zarf
      work-dir: /go/src/github.com/zarf-dev/zarf
      contents:
        packages:
          - busybox
          - bash
          - ca-certificates-bundle
          - golang-1.26=1.26.11-r0
          - golang-1.26-oci-config=1.26.11-r0
        files:
          - url: git+https://github.com/zarf-dev/zarf.git#v0.89.0
            checksum: 6da2a6d7867f355af281e5a33a9d849174c4c2d2
            path: /go/src/github.com/zarf-dev/zarf
            uid: 0
            gid: 0
      pipeline:
        - name: migrate acr credential helper in go.mod
          uses: git/patch@v1
          with:
            patch: pin-acr-replace-go.mod.patch
        - name: remove upstream vendor tree
          runs: |
            set -eux -o pipefail

            rm -rf vendor
        - name: update go dependencies
          uses: go/bump@v2
          with:
            deps:
              - github.com/andybalholm/brotli@v1.2.7
              - github.com/containerd/containerd/v2@v2.3.6
              - github.com/go-git/go-git/v5@v5.19.2
              - github.com/hashicorp/go-getter@v1.8.6
              - github.com/in-toto/in-toto-golang@v0.11.0
              - go.opentelemetry.io/otel@v1.46.0
              - go.opentelemetry.io/otel/sdk@v1.46.0
              - go.opentelemetry.io/otel/exporters/otlp/otlptrace@v1.46.0
              - go.opentelemetry.io/otel/exporters/otlp/otlptrace/otlptracehttp@v1.46.0
              - go.opentelemetry.io/otel/exporters/otlp/otlptrace/otlptracegrpc@v1.46.0
              - google.golang.org/grpc@v1.83.2
              - golang.org/x/crypto@v0.57.0
              - golang.org/x/mod@v0.42.0
              - github.com/moby/sys/user@v0.4.1
              - github.com/go-chi/chi/v5@v5.4.0
              - golang.org/x/net@v0.62.0
            downgrade: true
            download: true
            replaces:
              - google.golang.org/grpc=google.golang.org/grpc@v1.83.2
              - golang.org/x/net=golang.org/x/net@v0.62.0
              - github.com/chrismellard/docker-credential-acr-env=github.com/osscontainertools/docker-credential-acr@v0.8.0
            tidy: true
        - name: remove stale vendor tree
          runs: |
            set -eux -o pipefail

            rm -rf vendor
        - uses: go/hermetic@v1
        - name: build
          uses: go/build@v1
          with:
            fips: false
            ldflags:
              - -X github.com/zarf-dev/zarf/src/config.CLIVersion=v0.89.0
            output: ${target.dir}/usr/bin/zarf
        - name: build dev
          uses: go/build@v1
          with:
            fips: false
            ldflags:
              - -X github.com/zarf-dev/zarf/src/config.CLIVersion=v0.89.0
            output: ${target.dir}/usr/bin/zarf-dev
            strip: false
        - uses: dhi/build-pkg:0
          with:
            description: The Airgap Native Package Manager for Kubernetes
            files:
              - usr/bin/zarf
            license: Apache-2.0
            name: zarf
            rel: 2
            subpackages:
              - files:
                  - path: usr/bin/zarf
                    source: usr/bin/zarf-dev
                name: zarf-dev
            url: https://github.com/zarf-dev/zarf
            version: 0.89.0
      paths:
        - type: file
          path: /go/src/github.com/zarf-dev/zarf/pin-acr-replace-go.mod.patch
          uid: 0
          gid: 0
          source: package/main/zarf/patch/pin-acr-replace-go.mod.patch
os-release:
  name: Docker Hardened Images (Alpine)
  id: alpine
  version-id: "3.23"
  pretty-name: Docker Hardened Images/Alpine Linux v3.23
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
