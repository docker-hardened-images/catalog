# syntax=dhi.io/build:2-alpine3.24

image: dhi.io/pkg-redisinsight
variant: runtime
tags:
  - 3.10.2-alpine3.24
  - 3.10.2-r0-alpine3.24
platforms:
  - linux/amd64
  - linux/arm64
dates:
  release: "2025-12-04"
vars:
  COMMIT_SHA: c4cf43053ff252d442e4b892ddb4b832e6199063
  NODEJS_VERSION: 24.22.3-r0
  PACKAGE_NAME: redisinsight-3
  REL: "0"
  SEMVER_MAJOR_MINOR_VERSION: "3.10"
  SEMVER_MAJOR_VERSION: "3"
  SEMVER_VERSION: 3.10.2
  VERSION: 3.10.2
contents:
  repositories:
    - https://dhi.io/apk/alpine/v3.24/main
    - https://dhi.io/apk/alpine/v3.23/main
    - https://dl-cdn.alpinelinux.org/alpine/v3.24/main
    - https://dl-cdn.alpinelinux.org/alpine/v3.24/community
  keyring:
    - https://dhi.io/keyring/dhi-apk@docker-0F81AD7700D99184.rsa.pub
  packages:
    - alpine-baselayout-data
  builds:
    - name: redisinsight
      work-dir: ${source.dir}/src
      shell: /bin/bash
      environment:
        GITHUB_SHA: c4cf43053ff252d442e4b892ddb4b832e6199063
        NODE_OPTIONS: --max-old-space-size=6144
        RI_ENCRYPTION_KEYTAR: "false"
        RI_STATICS_AUTO_UPDATE: "false"
        RI_STATICS_INIT_DEFAULTS: "false"
        SKIP_POSTINSTALL: "1"
        npm_config_cache: /root/.npm
        npm_config_python: python3
      caches:
        - path: /root/.npm
      contents:
        packages:
          - bash
          - build-base
          - ca-certificates-bundle
          - coreutils
          - findutils
          - gcompat
          - git
          - libstdc++
          - nodejs-24=24.22.3-r0
          - npm
          - pkgconf
          - py3-setuptools
          - python3
          - sed
        files:
          - url: git+https://github.com/redis/RedisInsight.git#3.10.2
            checksum: c4cf43053ff252d442e4b892ddb4b832e6199063
            path: ${source.dir}/src
            spdx:
              name: redisinsight
              version: 3.10.2
              packages:
                - name: redisinsight
                  purl: pkg:github/redis/RedisInsight@3.10.2
                  license: SSPL-1.0
            uid: 0
            gid: 0
          - url: https://raw.githubusercontent.com/redis/RedisInsight/c4cf43053ff252d442e4b892ddb4b832e6199063/docker-entry.sh
            checksum: sha256:2185da1aee7e3127713bc54d192cb464bd415c485fa0cf613ae1a2e7ed4251db
            path: ${source.dir}/docker-entry.sh
            uid: 0
            gid: 0
            mode: "0755"
      pipeline:
        - name: install
          privileged: true
          runs: |
            set -eux -o pipefail

            npm install -g node-gyp@11.5.0
            npm install --ignore-scripts --no-audit --no-fund
        - name: bump api dependencies
          uses: npm/bump@v2
          privileged: true
          with:
            bumps: ${source.dir}/patches/npm-bumps.json
            npm-root: ${source.dir}/src/redisinsight/api
            omit-dev: false
        - name: install api dependencies
          privileged: true
          runs: |
            set -eux -o pipefail

            npm ci --prefix redisinsight/api --ignore-scripts --no-audit --no-fund
        - name: build
          privileged: true
          runs: |
            set -eux -o pipefail

            (
              cd redisinsight/api
              ../../node_modules/.bin/patch-package
            )
            mod="redisinsight/api/node_modules/better-sqlite3"
            prebuild=""
            if [ -x "${mod}/node_modules/.bin/prebuild-install" ]; then
              prebuild="$(pwd)/${mod}/node_modules/.bin/prebuild-install"
            elif [ -x redisinsight/api/node_modules/.bin/prebuild-install ]; then
              prebuild="$(pwd)/redisinsight/api/node_modules/.bin/prebuild-install"
            fi
            (
              cd "${mod}"
              if [ -n "${prebuild}" ]; then
                "${prebuild}" || node-gyp rebuild --force_build=1
              else
                node-gyp rebuild --force_build=1
              fi
            )
            test -f "${mod}/build/Release/better_sqlite3.node"
            (
              cd redisinsight/api
              npm run generate:api-client
            )
            npm run build:ui
            npm run build:statics
            npm run build:api
        - name: prod install
          privileged: true
          runs: |
            set -eux -o pipefail

            rm -rf redisinsight/api/node_modules
            npm ci --prefix redisinsight/api --omit=dev --ignore-scripts --no-audit --no-fund
            (
              cd redisinsight/api
              ../../node_modules/.bin/patch-package
            )
            mod="redisinsight/api/node_modules/better-sqlite3"
            prebuild=""
            if [ -x "${mod}/node_modules/.bin/prebuild-install" ]; then
              prebuild="$(pwd)/${mod}/node_modules/.bin/prebuild-install"
            elif [ -x redisinsight/api/node_modules/.bin/prebuild-install ]; then
              prebuild="$(pwd)/redisinsight/api/node_modules/.bin/prebuild-install"
            fi
            (
              cd "${mod}"
              if [ -n "${prebuild}" ]; then
                "${prebuild}" || node-gyp rebuild --force_build=1
              else
                node-gyp rebuild --force_build=1
              fi
            )
            test -f "${mod}/build/Release/better_sqlite3.node"
        - name: patch file-type
          uses: patch@v1
          work-dir: ${source.dir}/src/redisinsight/api
          with:
            options: -p1 --batch --forward
            patches:
              - ${source.dir}/patches/file-type-asf-position-guard.patch
        - name: stage
          runs: |
            set -eux -o pipefail

            test -f redisinsight/api/node_modules/better-sqlite3/build/Release/better_sqlite3.node
            test -d redisinsight/api/dist/src
            test -f redisinsight/api/dist/src/main.js
            test -d redisinsight/ui/dist
            dest="${target.dir}/usr/lib/redisinsight-3"
            mkdir -p "${dest}/redisinsight/api" "${dest}/redisinsight/ui"
            cp -a redisinsight/api/dist "${dest}/redisinsight/api/dist"
            cp -a redisinsight/api/node_modules "${dest}/redisinsight/api/node_modules"
            cp -a redisinsight/ui/dist "${dest}/redisinsight/ui/dist"
            cp -a "${source.dir}/docker-entry.sh" "${dest}/docker-entry.sh"
        - name: api sbom
          uses: sbom@v1
          with:
            extra-scanners: javascript-package-cataloger
            prefix: redisinsight-3
            source: ${source.dir}/src/redisinsight/api/node_modules
        - uses: dhi/build-pkg:0
          with:
            depends:
              - nodejs-24
              - libstdc++
            description: Redis Insight, a Redis GUI
            files:
              - usr/lib/redisinsight-3
            formats:
              - apk
            license: SSPL-1.0
            name: redisinsight-3
            rel: 0
            url: https://github.com/redis/RedisInsight
            version: 3.10.2
      paths:
        - type: file
          path: ${source.dir}/patches/npm-bumps.json
          uid: 0
          gid: 0
          source: package/main/redisinsight/patch/npm-bumps.json
        - type: file
          path: ${source.dir}/patches/file-type-asf-position-guard.patch
          uid: 0
          gid: 0
          source: package/main/redisinsight/patch/file-type-asf-position-guard.patch
os-release:
  name: Docker Hardened Images (Alpine)
  id: alpine
  version-id: "3.24"
  pretty-name: Docker Hardened Images/Alpine Linux v3.24
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
