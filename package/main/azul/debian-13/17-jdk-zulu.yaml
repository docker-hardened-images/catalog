# syntax=dhi.io/build:2-debian13

image: dhi.io/pkg-azul
variant: runtime
tags:
  - 17.70.113.0-r0
  - 17.70.113.0-r0-debian13
  - 17-jdk-zulu-17.70.113.0-r0
  - 17-jdk-zulu-17.70.113.0-r0-debian13
platforms:
  - linux/amd64
  - linux/arm64
vars:
  JAVA_MAJOR_VERSION: "17"
  JAVA_VERSION: 17.0.0
  PACKAGE_HOME: /usr/lib/jvm
  PACKAGE_NAME: azul-zulu-17-jdk
  REL: "0"
  SEMVER_MAJOR_MINOR_VERSION: "17.70"
  SEMVER_MAJOR_VERSION: "17"
  SEMVER_VERSION: 17.70.113
  VERSION: 17.70.113.0
  ZULU_DEB_VERSION: 17.0.21.0.3-5
  ZULU17_DEB_VERSION: 17.0.21.0.3-5
contents:
  repositories:
    - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
  keyring:
    - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
  packages:
    - base-files
  builds:
    - name: azul
      contents:
        repositories:
          - deb [signed-by=/usr/share/keyrings/azul.gpg] https://repos.azul.com/zulu/deb stable main
        keyring:
          - https://repos.azul.com/azul-repo.key
        packages:
          - bash
          - coreutils
          - findutils
          - grep
          - java-common
          - libfontconfig1
          - libasound2t64
          - libx11-6
          - libxext6
          - libxi6
          - libxrender1
          - libxtst6
          - zulu17-jdk=17.0.21.0.3-5
          - zulu17-jre=17.0.21.0.3-5
          - zulu17-jdk-headless=17.0.21.0.3-5
          - zulu17-jre-headless=17.0.21.0.3-5
          - zulu17-doc=17.0.21.0.3-5
          - zulu17-ca-jdk=17.0.21.0.3-5
          - zulu17-ca-jre=17.0.21.0.3-5
          - zulu17-ca-jdk-headless=17.0.21.0.3-5
          - zulu17-ca-jre-headless=17.0.21.0.3-5
          - zulu17-ca-doc=17.0.21.0.3-5
        mappings:
          zulu17-ca-jdk: pkg:deb/azul/zulu17-jdk@17.0.21.0.3-5?os_name=debian&os_version=13
          zulu17-ca-jdk-headless: pkg:deb/azul/zulu17-jdk@17.0.21.0.3-5?os_name=debian&os_version=13
          zulu17-ca-jre: pkg:deb/azul/zulu17-jdk@17.0.21.0.3-5?os_name=debian&os_version=13
          zulu17-ca-jre-headless: pkg:deb/azul/zulu17-jdk@17.0.21.0.3-5?os_name=debian&os_version=13
          zulu17-jdk: pkg:deb/azul/zulu17-jdk@17.0.21.0.3-5?os_name=debian&os_version=13
      pipeline:
        - name: install
          runs: |
            set -eux -o pipefail

            mkdir -p "${target.dir}/usr/lib/jvm"

            if [ -d "/usr/lib/jvm" ]; then
              mv /usr/lib/jvm/zulu* "${target.dir}/usr/lib/jvm/"
            else
              mv /opt/zulu* "${target.dir}/usr/lib/jvm/"
            fi
            ZULU_JDK_DIR=$(find "${target.dir}/usr/lib/jvm" -mindepth 1 -maxdepth 1 -type d -name "zulu*" -print -quit)
            ZULU_JDK_DIR_BASENAME=$(basename "${ZULU_JDK_DIR}")
            ln -sfn "${ZULU_JDK_DIR_BASENAME}" "${target.dir}/usr/lib/jvm/zulu-jdk17"
        - name: remove compromised CA roots
          runs: |
            set -eux -o pipefail

            JAVA_HOME="$(find "${target.dir}/usr/lib/jvm" -mindepth 1 -maxdepth 1 -type d -name "zulu*" -print -quit)"
            KEYTOOL="$JAVA_HOME/bin/keytool"
            CACERTS="$JAVA_HOME/lib/security/cacerts"

            "$KEYTOOL" -list -keystore "$CACERTS" -storepass changeit > /dev/null
            for alias in \
              "comodoaaaca [jdk]" \
              "emsigneccrootcag3 [jdk]" \
              "emsignrootcag1 [jdk]" \
              "emsignrootcag2 [jdk]" \
              "cn_aaa_certificate_services,o_comodo_ca_limited,l_salford,st_greater_manchester,c_gb [jdk]" \
              "cn_emsign_ecc_root_ca__g3,o_emudhra_technologies_limited,ou_emsign_pki,c_in [jdk]" \
              "cn_emsign_root_ca__g1,o_emudhra_technologies_limited,ou_emsign_pki,c_in [jdk]" \
              "cn_emsign_root_ca__g2,o_emudhra_technologies_limited,ou_emsign_pki,c_in [jdk]"; do
              if "$KEYTOOL" -list -keystore "$CACERTS" -storepass changeit -alias "$alias" > /dev/null 2>&1; then
                "$KEYTOOL" -delete -keystore "$CACERTS" -storepass changeit -alias "$alias"
              fi
            done
        - name: stage sbom
          runs: |
            set -eux -o pipefail

            sbom="/opt/docker/sbom/zulu17-jdk/.spdx.zulu17-jdk.json"
            jdk="/opt/docker/sbom/zulu17-ca-jdk-headless/.spdx.zulu17-ca-jdk-headless.json"
            test -s "$sbom"
            test -s "$jdk"
            grep -qF "pkg:deb/azul/zulu17-jdk@17.0.21.0.3-5?os_name=debian&os_version=13" "$sbom"
            grep -qF "pkg:deb/azul/zulu17-jdk@17.0.21.0.3-5?os_name=debian&os_version=13" "$jdk"
            grep -q "bin/java" "$jdk"
            mkdir -p "${target.dir}/opt/docker/sbom"
            cp -a /opt/docker/sbom/. "${target.dir}/opt/docker/sbom/"
        - uses: dhi/build-pkg:0
          with:
            depends:
              - libc6
              - zlib1g
            description: Azul Zulu OpenJDK 17
            files:
              - usr/lib/jvm
              - opt/docker/sbom
            formats:
              - deb
            license: GPL-2.0-only WITH Classpath-exception-2.0
            name: azul-zulu-17-jdk
            rel: 0
            url: https://www.azul.com/downloads/?package=jdk
            version: 17.70.113.0
os-release:
  name: Docker Hardened Images (Debian)
  id: debian
  version-id: "13"
  version-codename: trixie
  pretty-name: Docker Hardened Images/Debian GNU/Linux 13 (trixie)
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
