# syntax=dhi.io/build:2-debian13

image: dhi.io/pkg-azul
variant: runtime
tags:
  - 17-jdk-prime-26.01.0.0-11-r0
  - 17-jdk-prime-26.01.0.0-11-r0-debian13
platforms:
  - linux/amd64
  - linux/arm64
vars:
  DHI_SKIP_PACKAGE_CHECK: "true"
  JAVA_MAJOR_VERSION: "17"
  JAVA_VERSION: 17.0.0
  PACKAGE_HOME: /usr/lib/jvm
  PACKAGE_NAME: azul-prime-17-jdk
  REL: "0"
  SEMVER_MAJOR_MINOR_VERSION: "26.01"
  SEMVER_MAJOR_VERSION: "26"
  SEMVER_VERSION: 26.01.0
  VERSION: 26.01.0.0-11
  ZING17_DEB_VERSION: 26.01.0.0-11
contents:
  repositories:
    - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
  keyring:
    - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
  packages:
    - base-files
  builds:
    - name: azul
      contents:
        repositories:
          - deb [signed-by=/usr/share/keyrings/azul.gpg] https://repos.azul.com/zing/debian bookworm main
        keyring:
          - https://repos.azul.com/azul-repo.key
        packages:
          - bash
          - coreutils
          - findutils
          - grep
          - zing-jdk17.0.0=26.01.0.0-11
        mappings:
          zing-jdk17.0.0: pkg:deb/azul/zing-jdk17.0.0@26.01.0.0-11?os_name=debian&os_version=13
      pipeline:
        - name: install
          runs: |
            set -eux -o pipefail

            mkdir -p "${target.dir}/usr/lib/jvm"

            if [ -d "/usr/lib/jvm" ]; then
              mv /usr/lib/jvm/zing* "${target.dir}/usr/lib/jvm/"
            else
              mv /opt/zing/zing* "${target.dir}/usr/lib/jvm/"
            fi
            ZING_JDK_DIR=$(find "${target.dir}/usr/lib/jvm" -mindepth 1 -maxdepth 1 -type d -name "zing-jdk*" -print -quit)
            ZING_JDK_DIR_BASENAME=$(basename "${ZING_JDK_DIR}")
            ln -sfn "${ZING_JDK_DIR_BASENAME}" "${target.dir}/usr/lib/jvm/zing-jdk17"
        - name: remove compromised CA roots
          runs: |
            set -eux -o pipefail

            JAVA_HOME="$(find "${target.dir}/usr/lib/jvm" -mindepth 1 -maxdepth 1 -type d -name "zing-jdk*" -print -quit)"
            KEYTOOL="$JAVA_HOME/bin/keytool"
            CACERTS="$JAVA_HOME/lib/security/cacerts"

            "$KEYTOOL" -list -keystore "$CACERTS" -storepass changeit > /dev/null
            for alias in \
              "comodoaaaca [jdk]" \
              "emsigneccrootcag3 [jdk]" \
              "emsignrootcag1 [jdk]" \
              "emsignrootcag2 [jdk]" \
              "cn_aaa_certificate_services,o_comodo_ca_limited,l_salford,st_greater_manchester,c_gb [jdk]" \
              "cn_emsign_ecc_root_ca__g3,o_emudhra_technologies_limited,ou_emsign_pki,c_in [jdk]" \
              "cn_emsign_root_ca__g1,o_emudhra_technologies_limited,ou_emsign_pki,c_in [jdk]" \
              "cn_emsign_root_ca__g2,o_emudhra_technologies_limited,ou_emsign_pki,c_in [jdk]"; do
              if "$KEYTOOL" -list -keystore "$CACERTS" -storepass changeit -alias "$alias" > /dev/null 2>&1; then
                "$KEYTOOL" -delete -keystore "$CACERTS" -storepass changeit -alias "$alias"
              fi
            done
        - uses: spdx@v1
          with:
            license: LicenseRef-AZUL-Platform-Prime-Evaluation
            name: azul-platform-prime-evaluation-agreement
            purl: pkg:dhi/azul-prime-17-jdk@26.01.0.0-11
            version: 26.01.0.0-11
        - uses: spdx@v1
          with:
            license: GPL-2.0-only WITH Classpath-exception-2.0
            name: azul-platform-prime-openjdk
            purl: pkg:dhi/azul-prime-17-jdk@26.01.0.0-11
            version: 26.01.0.0-11
        - name: stage sbom
          runs: |
            set -eux -o pipefail

            eval_sbom="/opt/docker/sbom/azul-platform-prime-evaluation-agreement/.spdx.azul-platform-prime-evaluation-agreement.json"
            openjdk_sbom="/opt/docker/sbom/azul-platform-prime-openjdk/.spdx.azul-platform-prime-openjdk.json"
            test -s "$eval_sbom"
            test -s "$openjdk_sbom"
            grep -q "pkg:dhi/azul-prime-17-jdk@" "$eval_sbom"
            grep -q "LicenseRef-AZUL-Platform-Prime-Evaluation" "$eval_sbom"
            grep -q "pkg:dhi/azul-prime-17-jdk@" "$openjdk_sbom"
            grep -q "GPL-2.0-only WITH Classpath-exception-2.0" "$openjdk_sbom"
            mkdir -p "${target.dir}/opt/docker/sbom"
            cp -a /opt/docker/sbom/. "${target.dir}/opt/docker/sbom/"
        - uses: dhi/build-pkg:0
          with:
            depends:
              - libc6
              - zlib1g
            description: Azul Platform Prime (Zing) JDK 17
            files:
              - usr/lib/jvm
              - opt/docker/sbom
            formats:
              - deb
            license: LicenseRef-AZUL-Platform-Prime-Evaluation AND GPL-2.0-only WITH Classpath-exception-2.0
            name: azul-prime-17-jdk
            rel: 0
            url: https://www.azul.com/products/prime/
            version: 26.01.0.0-11
os-release:
  name: Docker Hardened Images (Debian)
  id: debian
  version-id: "13"
  version-codename: trixie
  pretty-name: Docker Hardened Images/Debian GNU/Linux 13 (trixie)
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
