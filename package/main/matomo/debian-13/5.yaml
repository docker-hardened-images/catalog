      pipeline:
        - name: verify gpg signature
          uses: gpg/verify@v1
          with:
            file: ${source.dir}/matomo.zip
            keys: ${source.dir}/keys.txt
            signature: ${source.dir}/matomo.zip.asc
        - name: extract matomo source
          runs: |
            set -eux -o pipefail

            mkdir -p "${target.dir}/usr/share"
            unzip -q "${source.dir}/matomo.zip" -d "${target.dir}/usr/share"
        - name: install composer dependencies with twig 3.31.1
          work-dir: ${target.dir}/usr/share/matomo
          privileged: true
          runs: |
            set -eux -o pipefail

            export COMPOSER_HOME="$(mktemp -d)"
            export COMPOSER_ROOT_VERSION="5.14.3"

            rm -rf vendor
            cp "${source.dir}/composer.json" "${source.dir}/composer.lock" .
            php "${source.dir}/composer.phar" config platform.php "$(php -r 'echo PHP_VERSION;')" --no-interaction --no-ansi
            php "${source.dir}/composer.phar" require --no-update --no-interaction --no-ansi --no-progress "twig/twig:3.31.1"
            php "${source.dir}/composer.phar" update twig/twig --with-dependencies --no-dev --optimize-autoloader --ignore-platform-reqs --no-scripts --no-audit --no-interaction --no-ansi --no-progress
            rm -f composer.json composer.lock
        - name: prune release tree like the upstream build
          work-dir: ${target.dir}/usr/share/matomo
          runs: |
            set -eux -o pipefail

            cp vendor/composer/installed.json "${source.dir}/installed.json"
            bash "${source.dir}/clean-build.sh"
            cp "${source.dir}/installed.json" vendor/composer/installed.json
        - name: create writable runtime directories
          work-dir: ${target.dir}/usr/share/matomo
          runs: |
            set -eux -o pipefail

            for dir in \
              tmp \
              plugins/Contents/screenshots \
              vendor/symfony/string/Resources/bin \
              vendor/szymach/c-pchart/cache; do
              mkdir -p "$dir"
              touch "$dir/KEEP"
            done
        - name: restore node module manifests
          work-dir: ${target.dir}/usr/share/matomo/node_modules
          runs: |
            set -eux -o pipefail

            for lib in \
              @materializecss/materialize \
              chroma-js \
              iframe-resizer \
              jquery \
              jquery-mousewheel \
              jquery-ui-dist \
              jquery.scrollto \
              mousetrap \
              qrcodejs2 \
              sprintf-js \
              visibilityjs; do
              test -d "$lib"
              install -m 0644 "${source.dir}/node-manifests/$lib/package.json" "$lib/package.json"
            done

            VUE_VERSION="$(grep -ohE '"3\.[0-9]+\.[0-9]+"' vue/dist/vue.global.prod.js | sort -u | tr -d '"')"
            test "$(printf '%s' "$VUE_VERSION" | grep -c .)" -eq 1
            printf '{"name":"vue","version":"%s"}\n' "$VUE_VERSION" > vue/package.json
        - name: regenerate file integrity manifest
          work-dir: ${target.dir}/usr/share/matomo
          runs: |
            set -eux -o pipefail

            {
              printf '<?php\n// This file is automatically generated during the Matomo build process\nnamespace Piwik;\nclass Manifest {\n\tstatic $files=array(\n'
              find . -type f -printf '%s ' -exec sha256sum {} \; \
                | grep -v 'user/.htaccess' \
                | grep -Ev 'manifest.inc.php|vendor/autoload.php|vendor/composer/autoload_real.php' \
                | sed 's/\([0-9]*\) \([a-z0-9]*\) *\.\/\(.*\)/\t\t"\3" => array("\1", "\2"),/' \
                | sort
              printf '\t);\n}\n'
            } > config/manifest.inc.php
        - name: vendored composer packages sbom
          uses: sbom@v1
          with:
            extra-scanners: php-composer-installed-cataloger
            prefix: matomo-composer
            source: ${target.dir}/usr/share/matomo
        - uses: dhi/build-pkg:0
          with:
            depends:
              - php-8.4
            description: Open-source web analytics platform
            files:
              - usr/share/matomo
            formats:
              - apk
              - deb
            license: GPL-3.0-or-later
            name: matomo
            rel: 2
            url: https://matomo.org/
            version: 5.14.3
      paths:
        - type: file
          path: ${source.dir}/keys.txt
          uid: 0
          gid: 0
          source: package/main/matomo/debian-13/key/keys.txt
    - name: matomo php extensions
      work-dir: ${source.dir}
      shell: bash
      contents:
        repositories:
          - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
        keyring:
          - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
        packages:
          - autoconf
          - bash
          - build-essential
          - coreutils
          - dpkg-dev
          - findutils
          - gawk
          - grep
          - gzip
          - libc-bin
          - php-8.4=8.4.28-0
          - php-8.4-dev=8.4.28-0
          - ca-certificates
          - libargon2-1
          - libc6
          - libcurl4t64
          - libgcc-s1
          - libicu76
          - libonig5
          - libpcre2-8-0
          - libreadline8t64
          - libsodium23
          - libsqlite3-0
          - libssl3t64
          - libstdc++6
          - libxml2
          - zlib1g
          - libc6-dev
          - libxml2-dev
          - pkg-config
          - sed
          - tar
          - xz-utils
          - libfreetype-dev
          - libjpeg-dev
          - libldap2-dev
          - libpcre2-dev
          - libpng-dev
          - libzip-dev
          - zlib1g-dev
        files:
          - url: https://www.php.net/distributions/php-8.4.28.tar.xz
            checksum: sha256:0c8ec360e5dd8154f270b2fd50cd44ecc824e6ee39c85f911312b80d4daecd72
            path: ${source.dir}/php-8.4.28.tar.xz
            spdx:
              name: php
              version: 8.4.28
              packages:
                - name: php
                  purl: pkg:generic/php@8.4.28
                  license: PHP-3.01
            uid: 0
            gid: 0
          - url: https://pecl.php.net/get/apcu-5.1.28.tgz
            checksum: sha256:ca9c1820810a168786f8048a4c3f8c9e3fd941407ad1553259fb2e30b5f057bf
            path: ${source.dir}/apcu-5.1.28.tgz
            spdx:
              name: apcu
              version: 5.1.28
              packages:
                - name: apcu
                  purl: pkg:pecl/apcu@5.1.28
                  license: PHP-3.01
            uid: 0
            gid: 0
          - url: https://pecl.php.net/get/redis-6.3.0.tgz
            checksum: sha256:0d5141f634bd1db6c1ddcda053d25ecf2c4fc1c395430d534fd3f8d51dd7f0b5
            path: ${source.dir}/redis-6.3.0.tgz
            spdx:
              name: phpredis
              version: 6.3.0
              packages:
                - name: phpredis
                  purl: pkg:pecl/redis@6.3.0
                  license: PHP-3.01
            uid: 0
            gid: 0
      pipeline:
        - name: extract php source
          runs: |
            set -eux -o pipefail

            tar -xaf "${source.dir}/php-8.4.28.tar.xz" -C "${source.dir}"
            tar -xzf "${source.dir}/apcu-5.1.28.tgz" -C "${source.dir}"
            tar -xzf "${source.dir}/redis-6.3.0.tgz" -C "${source.dir}"

            grep -q 'Thomas Boutell' "${source.dir}/php-8.4.28/ext/gd/libgd/gd.h"
            grep -q "#define GD_VERSION_STRING \"2.0.35\"" "${source.dir}/php-8.4.28/ext/gd/libgd/gd.h"
        - name: build bundled extensions
          runs: |
            set -eux -o pipefail

            build_ext() {
              local ext=$1
              shift
              cd "${source.dir}/php-8.4.28/ext/$ext"
              phpize
              ./configure --with-php-config=/usr/bin/php-config "$@"
              make -j "$(nproc)"
              make install
            }

            multiarch="$(dpkg-architecture --query DEB_HOST_MULTIARCH)"
            build_ext bcmath
            build_ext gd --with-freetype --with-jpeg
            build_ext ldap --with-libdir="lib/${multiarch}"
            build_ext mysqli
            build_ext pdo_mysql
            build_ext zip
        - name: build pecl extensions
          runs: |
            set -eux -o pipefail

            build_pecl() {
              local dir=$1
              cd "${source.dir}/$dir"
              phpize
              ./configure --with-php-config=/usr/bin/php-config
              make -j "$(nproc)"
              make install
            }

            build_pecl "apcu-5.1.28"
            build_pecl "redis-6.3.0"
        - name: stage extensions
          runs: |
            set -eux -o pipefail

            ext_dir="$(php-config --extension-dir)"
            install -d "${target.dir}/usr/lib/matomo/php-extensions" "${target.dir}/etc/php-8.4/conf.d"
            for ext in apcu bcmath gd ldap mysqli pdo_mysql redis zip; do
              install -m 0644 "${ext_dir}/${ext}.so" "${target.dir}/usr/lib/matomo/php-extensions/${ext}.so"
              printf 'extension=%s/%s.so\n' "/usr/lib/matomo/php-extensions" "${ext}" > "${target.dir}/etc/php-8.4/conf.d/20-matomo-${ext}.ini"
              ldd "${target.dir}/usr/lib/matomo/php-extensions/${ext}.so"
              if ldd "${target.dir}/usr/lib/matomo/php-extensions/${ext}.so" | grep -q 'not found'; then
                exit 1
              fi
            done
            php -n -d "extension=${target.dir}/usr/lib/matomo/php-extensions/gd.so" -r 'exit(extension_loaded("gd") ? 0 : 1);'
        - uses: spdx@v1
          with:
            license: GD
            name: matomo-php-ext-libgd
            purl: pkg:generic/libgd@2.0.35
            version: 2.0.35
        - uses: spdx@v1
          with:
            license: LGPL-2.1-or-later
            name: matomo-php-ext-libbcmath
            purl: pkg:generic/libbcmath@8.4.28
            version: 8.4.28
        - name: stage sbom
          runs: |
            set -eux -o pipefail

            mkdir -p "${target.dir}/opt/docker/sbom"
            for doc in php apcu phpredis matomo-php-ext-libgd matomo-php-ext-libbcmath; do
              test -s "/opt/docker/sbom/${doc}/.spdx.${doc}.json"
              cp -a "/opt/docker/sbom/${doc}" "${target.dir}/opt/docker/sbom/"
            done
        - uses: dhi/build-pkg:0
          with:
            deb:
              depends:
                - php-8.4
                - libc6
                - libfreetype6
                - libjpeg62-turbo
                - libldap2
                - libpng16-16t64
                - libzip5
                - zlib1g
            description: PHP extensions Matomo requires that php-8.4 does not build (apcu, bcmath, gd, ldap, mysqli, pdo_mysql, redis, zip)
            files:
              - usr/lib/matomo/php-extensions
              - etc/php-8.4/conf.d/20-matomo-apcu.ini
              - etc/php-8.4/conf.d/20-matomo-bcmath.ini
              - etc/php-8.4/conf.d/20-matomo-gd.ini
              - etc/php-8.4/conf.d/20-matomo-ldap.ini
              - etc/php-8.4/conf.d/20-matomo-mysqli.ini
              - etc/php-8.4/conf.d/20-matomo-pdo_mysql.ini
              - etc/php-8.4/conf.d/20-matomo-redis.ini
              - etc/php-8.4/conf.d/20-matomo-zip.ini
              - opt/docker/sbom
            formats:
              - deb
            license: PHP-3.01 AND GD AND LGPL-2.1-or-later
            name: matomo-php-ext
            rel: 0
            url: https://matomo.org/
            version: 5.14.3
