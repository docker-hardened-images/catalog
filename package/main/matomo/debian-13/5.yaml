      pipeline:
        - name: verify gpg signature
          uses: gpg/verify@v1
          with:
            file: ${source.dir}/matomo.tar.gz
            keys: ${source.dir}/keys.txt
            signature: ${source.dir}/matomo.tar.gz.asc
        - name: extract matomo source
          runs: |
            set -eux -o pipefail

            mkdir -p "${target.dir}/usr/share/matomo"
            tar -xzf "${source.dir}/matomo.tar.gz" --strip-components=1 -C "${target.dir}/usr/share/matomo"
        - name: install composer dependencies with twig 3.28.0
          work-dir: ${target.dir}/usr/share/matomo
          privileged: true
          runs: |
            set -eux -o pipefail

            export COMPOSER_HOME="$(mktemp -d)"
            export COMPOSER_ROOT_VERSION="5.14.0"

            rm -rf vendor
            cp "${source.dir}/composer.json" "${source.dir}/composer.lock" .
            php "${source.dir}/composer.phar" config platform.php "$(php -r 'echo PHP_VERSION;')" --no-interaction --no-ansi
            php "${source.dir}/composer.phar" require --no-update --no-interaction --no-ansi --no-progress "twig/twig:3.28.0"
            php "${source.dir}/composer.phar" update twig/twig --with-dependencies --no-dev --optimize-autoloader --ignore-platform-reqs --no-scripts --no-audit --no-interaction --no-ansi --no-progress
            rm -f composer.json composer.lock
        - name: prune release tree like the upstream build
          work-dir: ${target.dir}/usr/share/matomo
          runs: |
            set -eux -o pipefail

            cp vendor/composer/installed.json "${source.dir}/installed.json"
            bash "${source.dir}/clean-build.sh"
            cp "${source.dir}/installed.json" vendor/composer/installed.json
        - name: create writable runtime directories
          work-dir: ${target.dir}/usr/share/matomo
          runs: |
            set -eux -o pipefail

            for dir in \
              tmp \
              plugins/Contents/screenshots \
              vendor/symfony/string/Resources/bin \
              vendor/szymach/c-pchart/cache; do
              mkdir -p "$dir"
              touch "$dir/KEEP"
            done
        - name: restore node module manifests
          work-dir: ${target.dir}/usr/share/matomo/node_modules
          runs: |
            set -eux -o pipefail

            for lib in \
              @materializecss/materialize \
              chroma-js \
              iframe-resizer \
              jquery \
              jquery-mousewheel \
              jquery-ui-dist \
              jquery.scrollto \
              mousetrap \
              qrcodejs2 \
              sprintf-js \
              visibilityjs; do
              test -d "$lib"
              install -m 0644 "${source.dir}/node-manifests/$lib/package.json" "$lib/package.json"
            done

            VUE_VERSION="$(grep -ohE '"3\.[0-9]+\.[0-9]+"' vue/dist/vue.global.prod.js | sort -u | tr -d '"')"
            test "$(printf '%s' "$VUE_VERSION" | grep -c .)" -eq 1
            printf '{"name":"vue","version":"%s"}\n' "$VUE_VERSION" > vue/package.json
        - name: regenerate file integrity manifest
          work-dir: ${target.dir}/usr/share/matomo
          runs: |
            set -eux -o pipefail

            {
              printf '<?php\n// This file is automatically generated during the Matomo build process\nnamespace Piwik;\nclass Manifest {\n\tstatic $files=array(\n'
              find . -type f -printf '%s ' -exec sha256sum {} \; \
                | grep -v 'user/.htaccess' \
                | grep -Ev 'manifest.inc.php|vendor/autoload.php|vendor/composer/autoload_real.php' \
                | sed 's/\([0-9]*\) \([a-z0-9]*\) *\.\/\(.*\)/\t\t"\3" => array("\1", "\2"),/' \
                | sort
              printf '\t);\n}\n'
            } > config/manifest.inc.php
        - name: vendored composer packages sbom
          uses: sbom@v1
          with:
            extra-scanners: php-composer-installed-cataloger
            prefix: matomo-composer
            source: ${target.dir}/usr/share/matomo
        - uses: dhi/build-pkg:0
          with:
            depends:
              - php-8.4
            description: Open-source web analytics platform
            files:
              - usr/share/matomo
            license: GPL-3.0-or-later
            name: matomo
            rel: 0
            url: https://matomo.org/
            version: 5.14.0
      paths:
        - type: file
          path: ${source.dir}/keys.txt
          uid: 0
          gid: 0
          source: package/main/matomo/debian-13/key/keys.txt
