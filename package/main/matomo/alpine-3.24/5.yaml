# syntax=dhi.io/build:2-alpine3.24

image: dhi.io/pkg-matomo
variant: runtime
tags:
  - 5.14.3-alpine3.24
  - 5.14.3-r0-alpine3.24
platforms:
  - linux/amd64
  - linux/arm64
vars:
  APCU_CHECKSUM: ca9c1820810a168786f8048a4c3f8c9e3fd941407ad1553259fb2e30b5f057bf
  APCU_VERSION: 5.1.28
  BUNDLED_LIBGD_VERSION: 2.0.35
  PHP_APK_VERSION: 8.4.28-r0
  PHP_EXT_DIR: /usr/lib/matomo/php-extensions
  PHP_EXT_PACKAGE_NAME: matomo-php-ext
  PHP_MAJOR_MINOR: "8.4"
  PHP_SRC_CHECKSUM: 0c8ec360e5dd8154f270b2fd50cd44ecc824e6ee39c85f911312b80d4daecd72
  PHP_SRC_VERSION: 8.4.28
  PHP_SYSCONFDIR: /etc/php-8.4
  REDIS_EXT_CHECKSUM: 0d5141f634bd1db6c1ddcda053d25ecf2c4fc1c395430d534fd3f8d51dd7f0b5
  REDIS_EXT_VERSION: 6.3.0
  REL: "0"
  SEMVER_MAJOR_MINOR_VERSION: "5.14"
  SEMVER_MAJOR_VERSION: "5"
  SEMVER_VERSION: 5.14.3
  VERSION: 5.14.3
contents:
  repositories:
    - https://dhi.io/apk/alpine/v3.24/main
    - https://dhi.io/apk/alpine/v3.23/main
    - https://dl-cdn.alpinelinux.org/alpine/v3.24/main
    - https://dl-cdn.alpinelinux.org/alpine/v3.24/community
  keyring:
    - https://dhi.io/keyring/dhi-apk@docker-0F81AD7700D99184.rsa.pub
  packages:
    - alpine-baselayout-data
  builds:
    - name: matomo php extensions
      work-dir: ${source.dir}
      shell: bash
      contents:
        packages:
          - autoconf
          - bash
          - build-base
          - coreutils
          - findutils
          - grep
          - gzip
          - pkgconf
          - php-8.4=8.4.28-r0
          - php-8.4-dev=8.4.28-r0
          - argon2-libs
          - ca-certificates-bundle
          - icu-libs
          - libcrypto3
          - libcurl
          - libgcc
          - libsodium
          - libssl3
          - libstdc++
          - libxml2
          - musl
          - oniguruma
          - pcre2
          - readline
          - sqlite-libs
          - zlib
          - libxml2-dev
          - sed
          - tar
          - xz
          - freetype-dev
          - libjpeg-turbo-dev
          - libpng-dev
          - libzip-dev
          - openldap-dev
          - cyrus-sasl-dev
          - pcre2-dev
          - zlib-dev
        files:
          - url: https://www.php.net/distributions/php-8.4.28.tar.xz
            checksum: sha256:0c8ec360e5dd8154f270b2fd50cd44ecc824e6ee39c85f911312b80d4daecd72
            path: ${source.dir}/php-8.4.28.tar.xz
            spdx:
              name: php
              version: 8.4.28
              packages:
                - name: php
                  purl: pkg:generic/php@8.4.28
                  license: PHP-3.01
            uid: 0
            gid: 0
          - url: https://pecl.php.net/get/apcu-5.1.28.tgz
            checksum: sha256:ca9c1820810a168786f8048a4c3f8c9e3fd941407ad1553259fb2e30b5f057bf
            path: ${source.dir}/apcu-5.1.28.tgz
            spdx:
              name: apcu
              version: 5.1.28
              packages:
                - name: apcu
                  purl: pkg:pecl/apcu@5.1.28
                  license: PHP-3.01
            uid: 0
            gid: 0
          - url: https://pecl.php.net/get/redis-6.3.0.tgz
            checksum: sha256:0d5141f634bd1db6c1ddcda053d25ecf2c4fc1c395430d534fd3f8d51dd7f0b5
            path: ${source.dir}/redis-6.3.0.tgz
            spdx:
              name: phpredis
              version: 6.3.0
              packages:
                - name: phpredis
                  purl: pkg:pecl/redis@6.3.0
                  license: PHP-3.01
            uid: 0
            gid: 0
      pipeline:
        - name: extract php source
          runs: |
            set -eux -o pipefail

            tar -xaf "${source.dir}/php-8.4.28.tar.xz" -C "${source.dir}"
            tar -xzf "${source.dir}/apcu-5.1.28.tgz" -C "${source.dir}"
            tar -xzf "${source.dir}/redis-6.3.0.tgz" -C "${source.dir}"

            grep -q 'Thomas Boutell' "${source.dir}/php-8.4.28/ext/gd/libgd/gd.h"
            grep -q "#define GD_VERSION_STRING \"2.0.35\"" "${source.dir}/php-8.4.28/ext/gd/libgd/gd.h"
        - name: build bundled extensions
          runs: |
            set -eux -o pipefail

            build_ext() {
              local ext=$1
              shift
              cd "${source.dir}/php-8.4.28/ext/$ext"
              phpize
              ./configure --with-php-config=/usr/bin/php-config "$@"
              make -j "$(nproc)"
              make install
            }

            build_ext bcmath
            build_ext gd --with-freetype --with-jpeg
            build_ext ldap
            build_ext mysqli
            build_ext pdo_mysql
            build_ext zip
        - name: build pecl extensions
          runs: |
            set -eux -o pipefail

            build_pecl() {
              local dir=$1
              cd "${source.dir}/$dir"
              phpize
              ./configure --with-php-config=/usr/bin/php-config
              make -j "$(nproc)"
              make install
            }

            build_pecl "apcu-5.1.28"
            build_pecl "redis-6.3.0"
        - name: stage extensions
          runs: |
            set -eux -o pipefail

            ext_dir="$(php-config --extension-dir)"
            install -d "${target.dir}/usr/lib/matomo/php-extensions" "${target.dir}/etc/php-8.4/conf.d"
            load_args=""
            for ext in apcu bcmath gd ldap mysqli pdo_mysql redis zip; do
              install -m 0644 "${ext_dir}/${ext}.so" "${target.dir}/usr/lib/matomo/php-extensions/${ext}.so"
              printf 'extension=%s/%s.so\n' "/usr/lib/matomo/php-extensions" "${ext}" > "${target.dir}/etc/php-8.4/conf.d/20-matomo-${ext}.ini"
              load_args="${load_args} -d extension=${target.dir}/usr/lib/matomo/php-extensions/${ext}.so"
            done
            php -n ${load_args} -r 'foreach (["apcu","bcmath","gd","ldap","mysqli","pdo_mysql","redis","zip"] as $e) { if (!extension_loaded($e)) { fwrite(STDERR, "missing $e\n"); exit(1); } }'
        - uses: spdx@v1
          with:
            license: GD
            name: matomo-php-ext-libgd
            purl: pkg:generic/libgd@2.0.35
            version: 2.0.35
        - uses: spdx@v1
          with:
            license: LGPL-2.1-or-later
            name: matomo-php-ext-libbcmath
            purl: pkg:generic/libbcmath@8.4.28
            version: 8.4.28
        - name: stage sbom
          runs: |
            set -eux -o pipefail

            mkdir -p "${target.dir}/opt/docker/sbom"
            for doc in php apcu phpredis matomo-php-ext-libgd matomo-php-ext-libbcmath; do
              test -s "/opt/docker/sbom/${doc}/.spdx.${doc}.json"
              cp -a "/opt/docker/sbom/${doc}" "${target.dir}/opt/docker/sbom/"
            done
        - uses: dhi/build-pkg:0
          with:
            depends:
              - php-8.4
              - freetype
              - libjpeg-turbo
              - libldap
              - libpng
              - libzip
              - zlib
            description: PHP extensions Matomo requires that php-8.4 does not build (apcu, bcmath, gd, ldap, mysqli, pdo_mysql, redis, zip)
            files:
              - usr/lib/matomo/php-extensions
              - etc/php-8.4/conf.d/20-matomo-apcu.ini
              - etc/php-8.4/conf.d/20-matomo-bcmath.ini
              - etc/php-8.4/conf.d/20-matomo-gd.ini
              - etc/php-8.4/conf.d/20-matomo-ldap.ini
              - etc/php-8.4/conf.d/20-matomo-mysqli.ini
              - etc/php-8.4/conf.d/20-matomo-pdo_mysql.ini
              - etc/php-8.4/conf.d/20-matomo-redis.ini
              - etc/php-8.4/conf.d/20-matomo-zip.ini
              - opt/docker/sbom
            formats:
              - apk
            license: PHP-3.01 AND GD AND LGPL-2.1-or-later
            name: matomo-php-ext
            rel: 0
            url: https://matomo.org/
            version: 5.14.3
os-release:
  name: Docker Hardened Images (Alpine)
  id: alpine
  version-id: "3.24"
  pretty-name: Docker Hardened Images/Alpine Linux v3.24
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
