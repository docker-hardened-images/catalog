# syntax=dhi.io/build:2-debian13

image: dhi.io/pkg-mapbox-mcp
variant: runtime
tags:
  - 0.16.0
  - 0.16.0-r2
  - 0.16.0-debian13
  - 0.16.0-r2-debian13
platforms:
  - linux/amd64
  - linux/arm64
dates:
  release: "2026-06-15"
vars:
  COMMIT_SHA: c257ffa02450756f8edcd8c6fa1c3fe02f7e7327
  REL: "2"
  SEMVER_MAJOR_MINOR_VERSION: "0.16"
  SEMVER_MAJOR_VERSION: "0"
  SEMVER_VERSION: 0.16.0
  VERSION: 0.16.0
contents:
  packages:
    - base-files
  builds:
    - name: mapbox-mcp
      work-dir: ${source.dir}/mapbox-mcp
      caches:
        - path: /root/.npm
      contents:
        repositories:
          - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
        keyring:
          - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
        packages:
          - bash
          - ca-certificates
          - coreutils
          - findutils
          - git
          - libc6
          - libstdc++6
          - mawk
          - nodejs-24
          - node-corepack
          - npm
          - sed
          - yarn-classic
        files:
          - url: git+https://github.com/mapbox/mcp-server.git#v0.16.0
            checksum: c257ffa02450756f8edcd8c6fa1c3fe02f7e7327
            path: ${source.dir}/mapbox-mcp
            spdx:
              name: mapbox-mcp
              version: 0.16.0
              packages:
                - name: mapbox-mcp
                  purl: pkg:npm/%40mapbox/mcp-server@0.16.0
                  license: MIT
            uid: 0
            gid: 0
      pipeline:
        - name: bump dependencies
          uses: npm/bump@v1
          privileged: true
          environment:
            DHI_NO_SFW: "true"
          with:
            bumps: ${source.dir}/patch/npm-bump.json
            npm-root: ${source.dir}/mapbox-mcp
        - name: install and build
          privileged: true
          runs: |
            set -eux -o pipefail

            cd "${source.dir}/mapbox-mcp"

            npm pkg set \
              "overrides.protobufjs@7"="7.6.5" \
              "overrides.protobufjs@8"="8.6.6"
            npm install --package-lock-only --ignore-scripts

            npm ci --ignore-scripts

            ./node_modules/.bin/tshy

            rm -rf node_modules
            npm ci --omit=dev --ignore-scripts
            ./node_modules/.bin/patch-package
            npm uninstall patch-package --omit=dev --ignore-scripts

            mkdir -p "${target.dir}/usr/lib/mapbox-mcp"
            cp -a dist node_modules package.json "${target.dir}/usr/lib/mapbox-mcp/"
        - name: production node_modules sbom
          uses: sbom@v1
          with:
            extra-scanners: javascript-package-cataloger
            prefix: mapbox-mcp-npm
            source: ${source.dir}/mapbox-mcp/node_modules
        - uses: dhi/build-pkg:0
          with:
            description: Mapbox MCP server - Model Context Protocol server for Mapbox geospatial APIs
            files:
              - usr/lib/mapbox-mcp
            formats:
              - deb
            license: MIT
            name: mapbox-mcp
            rel: 2
            url: https://github.com/mapbox/mcp-server
            version: 0.16.0
      paths:
        - type: file
          path: ${source.dir}/patch/npm-bump.json
          uid: 0
          gid: 0
          source: package/main/mapbox-mcp/patch/npm-bump.json
os-release:
  name: Docker Hardened Images (Debian)
  id: debian
  version-id: "13"
  version-codename: trixie
  pretty-name: Docker Hardened Images/Debian GNU/Linux 13 (trixie)
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
