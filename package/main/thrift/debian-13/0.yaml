# syntax=dhi.io/build:2-debian13

image: dhi.io/pkg-thrift
variant: runtime
tags:
  - 0.25.0
  - 0.25.0-r0
  - 0.25.0-debian13
  - 0.25.0-r0-debian13
platforms:
  - linux/amd64
  - linux/arm64
dates:
  release: "2026-09-30"
vars:
  COMMIT_SHA: 27e8a425ffb498e190df3a12e239326bf5ba9ed6
  PACKAGE_NAME: thrift
  REL: "0"
  SEMVER_MAJOR_MINOR_VERSION: "0.25"
  SEMVER_MAJOR_VERSION: "0"
  SEMVER_VERSION: 0.25.0
  VERSION: 0.25.0
contents:
  repositories:
    - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
  keyring:
    - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
  packages:
    - base-files
  builds:
    - name: thrift
      work-dir: ${source.dir}/thrift
      contents:
        packages:
          - base-files
          - bash
          - bison
          - build-essential
          - ca-certificates
          - cmake
          - coreutils
          - findutils
          - flex
          - git
          - grep
          - libboost-all-dev
          - libevent-dev
          - libssl-dev
          - pkg-config
          - sed
          - zlib1g-dev
        files:
          - url: git+https://github.com/apache/thrift.git#v0.25.0
            checksum: 27e8a425ffb498e190df3a12e239326bf5ba9ed6
            path: ${source.dir}/thrift
            spdx:
              name: thrift
              version: 0.25.0
              packages:
                - name: thrift
                  purl: pkg:generic/apache/thrift@0.25.0
                  license: Apache-2.0
            uid: 0
            gid: 0
      pipeline:
        - name: configure and build thrift
          runs: |
            set -eux -o pipefail

            cmake -S . -B build \
              -DCMAKE_BUILD_TYPE=Release \
              -DCMAKE_INSTALL_PREFIX=/usr \
              -DBUILD_COMPILER=ON \
              -DBUILD_LIBRARIES=ON \
              -DBUILD_TESTING=OFF \
              -DBUILD_TUTORIALS=OFF \
              -DBUILD_SHARED_LIBS=ON \
              -DWITH_CPP=ON \
              -DWITH_C_GLIB=OFF \
              -DWITH_JAVA=OFF \
              -DWITH_JAVASCRIPT=OFF \
              -DWITH_NODEJS=OFF \
              -DWITH_PYTHON=OFF \
              -DWITH_QT5=OFF \
              -DWITH_OPENSSL=ON \
              -DWITH_ZLIB=ON \
              -DWITH_LIBEVENT=ON

            cmake --build build -j"$(nproc)"
            DESTDIR="${target.dir}" cmake --install build
        - uses: dhi/build-pkg:0
          with:
            conflicts: thrift-compiler, libthrift-dev, libthrift-0.19.0t64
            depends:
              - libevent-2.1-7t64
              - libssl3t64
              - libstdc++6
              - zlib1g
            description: Apache Thrift C++ library and compiler
            files:
              - usr
            formats:
              - deb
            license: Apache-2.0
            name: thrift
            rel: 0
            replaces: thrift-compiler, libthrift-dev, libthrift-0.19.0t64
            url: https://github.com/apache/thrift
            version: 0.25.0
os-release:
  name: Docker Hardened Images (Debian)
  id: debian
  version-id: "13"
  version-codename: trixie
  pretty-name: Docker Hardened Images/Debian GNU/Linux 13 (trixie)
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
