              - py3-yaml
              - python3~3.14
              - spdlog~1.17
              - sqlite-libs
              - yaml
              - yaml-cpp~0.9
              - zstd-libs
            description: Robot Operating System 2 (ROS 2) lyrical base
            files:
              - opt/ros
              - opt/docker/sbom
            formats:
              - apk
            license: Apache-2.0 AND BSD-3-Clause AND BSL-1.0 AND LGPL-2.1-or-later AND MIT AND Zlib
            name: ros-lyrical
            rel: 2
            subpackages:
              - apk:
                  depends:
                    - fzf
