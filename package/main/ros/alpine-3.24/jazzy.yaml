            path: ${source.dir}/stage1/orocos_kinematics_dynamics
            spdx:
              name: orocos_kinematics_dynamics
              version: ce4bcb65a050615b6d7f21bc60fbb2656515791b
              packages:
                - name: orocos_kinematics_dynamics
                  purl: pkg:github/orocos/orocos_kinematics_dynamics@ce4bcb65a050615b6d7f21bc60fbb2656515791b
                  license: LGPL-2.1-or-later
            uid: 0
            gid: 0
          - url: git+https://github.com/ros/urdfdom_headers.git#1.1.3
            checksum: af0f9306bcb6b88dcc79d75f28f6c5257c883bfd
            path: ${source.dir}/stage1/urdfdom_headers
            spdx:
              name: urdfdom_headers
              version: 1.1.3
              packages:
                - name: urdfdom_headers
                  purl: pkg:github/ros/urdfdom_headers@1.1.3
                  license: BSD-3-Clause
            uid: 0
            gid: 0
          - url: git+https://github.com/foxglove/mcap.git#releases/cpp/v1.3.1
            checksum: 1a64fd40358998775b27fee516a28e07a97db27e
            path: ${source.dir}/mcap
            spdx:
              name: mcap
              version: 1.3.1
              packages:
                - name: mcap
                  purl: pkg:github/foxglove/mcap@releases/cpp/v1.3.1
                  license: MIT
            uid: 0
            gid: 0
      pipeline:
        - name: bump python dependencies
          uses: python/bump@v1
          work-dir: ${source.dir}
          privileged: true
          with:
            bumps: ${source.dir}/patch/python-bumps.json
            hashes: require
            python: /usr/bin/python3.14
            requirements:
              - requirements-build-alpine.txt
            verify: none
        - name: install colcon and the python modules alpine does not package
          privileged: true
          runs: |
            set -eux -o pipefail

            pip install --break-system-packages --no-deps --require-hashes -r "${source.dir}/requirements-build-alpine.txt"
            pip install --no-deps --require-hashes --target "/opt/ros/jazzy/lib/python3.14/site-packages" -r "${source.dir}/requirements-runtime-alpine.txt"
        - name: apply the rcutils musl strerror_r patch
          uses: patch@v1
          work-dir: ${source.dir}/src/ros2/rcutils
          with:
            options: -p1
            patches:
              - ${source.dir}/patches/rcutils-musl-strerror-r.patch
        - name: apply the urdfdom_headers gcc 15 cstdint patch
          uses: patch@v1
          work-dir: ${source.dir}/stage1/urdfdom_headers
          with:
            options: -p1
            patches:
              - ${source.dir}/patches/urdfdom-headers-cstdint.patch
        - name: apply the fast dds system sqlite patch
          uses: patch@v1
          work-dir: ${source.dir}/src/eProsima/Fast-DDS
          with:
            options: -p1
            patches:
              - ${source.dir}/patches/fastdds-system-sqlite3.patch
        - name: apply the sros2 elliptic curve patch
          uses: patch@v1
          work-dir: ${source.dir}/src/ros2/sros2
          with:
            options: -p1
            patches:
              - ${source.dir}/patches/sros2-ec-curve-instance.patch
        - name: build ros_core and ros_base with colcon
          runs: |
            set -eux -o pipefail

            export SOURCE_DIR="${source.dir}" TARGET_DIR="${target.dir}"
            bash "${source.dir}/build.sh"
        - name: install colcon, rosdep and vcstool into the -dev tree
          privileged: true
          runs: |
            set -eux -o pipefail

            pip install --break-system-packages --ignore-installed --no-deps --require-hashes --prefix "${target.dir}/dev-staging/opt/ros/jazzy" -r "${source.dir}/requirements-dev-alpine.txt"
        - name: check fast dds links the system sqlite, and the bundled header versions
          runs: |
            set -eux -o pipefail

            fastdds="${source.dir}/src/eProsima/Fast-DDS"
            for lib in "${target.dir}/opt/ros/jazzy"/lib/libfastrtps.so.*; do
              readelf -d "$lib" | grep -F '[libsqlite3.so.0]' > /dev/null
              if strings "$lib" | grep -F 'SQLite format 3' > /dev/null; then exit 1; fi
            done
            grep -E -q -x '#define BOOST_VERSION [0-9]+00' "$fastdds/thirdparty/boost/include/boost/version.hpp"
            [ "$(sed -nE 's/^#define BOOST_LIB_VERSION "([0-9]+)_([0-9]+)"$/\1.\2.0/p' "$fastdds/thirdparty/boost/include/boost/version.hpp")" = "1.73.0" ]
            [ "$(sed -nE 's/^#define TAO_PEGTL_VERSION "([0-9.]+)"$/\1/p' "$fastdds/thirdparty/taocpp-pegtl/pegtl/version.hpp")" = "2.8.3" ]
            [ "$(sed -nE 's/^#define NLOHMANN_JSON_VERSION_(MAJOR|MINOR|PATCH) +([0-9]+).*/\2/p' "$fastdds/thirdparty/nlohmann-json/nlohmann/json.hpp" | tr '\n' .)" = "3.9.1." ]
            [ "asio-1-36-0" = "asio-$(echo "1.36.0" | tr . -)" ]
            grep -E -q -x "#define ASIO_VERSION [0-9]+ // 1.36.0" /usr/include/asio/version.hpp
        - uses: spdx@v1
          with:
            license: BSL-1.0
            name: boost
            purl: pkg:github/boostorg/boost@boost-1.73.0
            version: 1.73.0
        - uses: spdx@v1
          with:
            license: MIT
            name: nlohmann-json
            purl: pkg:github/nlohmann/json@v3.9.1
            version: 3.9.1
        - uses: spdx@v1
          with:
            license: MIT
            name: pegtl
            purl: pkg:github/taocpp/pegtl@2.8.3
            version: 2.8.3
        - uses: spdx@v1
          with:
            license: BSL-1.0
            name: asio
            purl: pkg:github/chriskohlhoff/asio@asio-1-36-0
            version: 1.36.0
        - name: python sbom
          uses: sbom@v1
          with:
            extra-scanners: python-package-cataloger
            prefix: ros-jazzy-python
            source: ${target.dir}/opt/ros/jazzy/lib/python3.14/site-packages
        - name: dev python sbom
          uses: sbom@v1
          with:
            extra-scanners: python-package-cataloger
            prefix: ros-jazzy-dev-python
            source: ${target.dir}/dev-staging/opt/ros/jazzy/lib/python3.14/site-packages
        - name: stage sbom documents
          runs: |
            set -eux -o pipefail

            mkdir -p "${target.dir}/opt/docker/sbom" "${target.dir}/dev-staging/opt/docker/sbom"
            test -d /opt/docker/sbom/mcap
            test -d /opt/docker/sbom/boost
            test -d /opt/docker/sbom/nlohmann-json
            test -d /opt/docker/sbom/pegtl
            for doc in /opt/docker/sbom/*; do
              if [ "$(basename "$doc")" = ros-jazzy-dev-python ]; then
                cp -a "$doc" "${target.dir}/dev-staging/opt/docker/sbom/"
              else
                cp -a "$doc" "${target.dir}/opt/docker/sbom/"
              fi
            done
        - uses: dhi/build-pkg:0
          with:
            depends:
              - coreutils
              - libcrypto3
              - libgcc
              - libssl3
              - libstdc++
              - lttng-ust
              - lz4-libs
              - musl
              - py3-argcomplete
              - py3-cryptography
              - py3-dateutil
              - py3-distro
              - py3-docutils
              - py3-lark-parser
              - py3-lxml
              - py3-numpy
              - py3-packaging
              - py3-parsing
              - py3-psutil
              - py3-yaml
              - python3~3.14
              - spdlog~1.17
              - sqlite-libs
              - tinyxml2
              - yaml
              - yaml-cpp~0.9
              - zstd-libs
            description: Robot Operating System 2 (ROS 2) jazzy base
            files:
              - opt/ros
              - opt/docker/sbom
            formats:
              - apk
            license: Apache-2.0 AND BSD-3-Clause AND BSL-1.0 AND LGPL-2.1-or-later AND MIT AND Zlib
            name: ros-jazzy
            rel: 2
            subpackages:
              - apk:
                  depends:
                    - asio-dev
                    - bullet-dev
