# syntax=dhi.io/build:2-debian13

image: dhi.io/pkg-selenium-hub
variant: runtime
tags:
  - 4.47.0
  - 4.47.0-r0
  - 4.47.0-debian13
  - 4.47.0-r0-debian13
platforms:
  - linux/amd64
  - linux/arm64
dates:
  release: "2021-10-13"
vars:
  BAZEL_ARCH: '#{ target.arch == "amd64" ? "x86_64" : "arm64" }'
  BAZEL_VERSION: 9.1.0
  COMMIT_SHA: 9175ed94d83e87cc3abeb7c9fd91367d17849d35
  JDK_MAJOR_VERSION: "21"
  PACKAGE_NAME: selenium-hub
  REL: "0"
  SEMVER_MAJOR_MINOR_VERSION: "4.47"
  SEMVER_MAJOR_VERSION: "4"
  SEMVER_VERSION: 4.47.0
  VERSION: 4.47.0
contents:
  packages:
    - base-files
  builds:
    - name: selenium-hub
      work-dir: ${source.dir}/selenium
      caches:
        - path: /bazel-disk-cache
        - path: /bazel-repo-cache
      contents:
        packages:
          - bash
          - build-essential
          - ca-certificates
          - coreutils
          - curl
          - findutils
          - git
          - python3
          - unzip
          - zip
        files:
          - url: git+https://github.com/SeleniumHQ/selenium.git#selenium-4.47.0
            checksum: 9175ed94d83e87cc3abeb7c9fd91367d17849d35
            path: ${source.dir}/selenium
            spdx:
              name: selenium
              version: 4.47.0
              packages:
                - name: selenium-server
                  purl: pkg:maven/org.seleniumhq.selenium/selenium-server@4.47.0
                  license: Apache-2.0
            uid: 0
            gid: 0
          - url: https://github.com/bazelbuild/bazel/releases/download/9.1.0/bazel-9.1.0-linux-${BAZEL_ARCH}
            checksum: https://github.com/bazelbuild/bazel/releases/download/9.1.0/bazel-9.1.0-linux-${BAZEL_ARCH}.sha256
            path: /opt/bazel/bin/bazel
            uid: 0
            gid: 0
            mode: "0755"
      pipeline:
        - name: build selenium-server
          privileged: true
          runs: |
            set -eux -o pipefail

            cat > /tmp/bazel-downloader.cfg << 'EOF'
            rewrite repo1\.maven\.org/maven2/(.*) maven-central.storage-download.googleapis.com/maven2/$1
            EOF

            /opt/bazel/bin/bazel \
              build \
              --experimental_downloader_config=/tmp/bazel-downloader.cfg \
              --disk_cache=/bazel-disk-cache \
              --repository_cache=/bazel-repo-cache \
              --curses=no \
              --color=no \
              --repo_env=RULES_JVM_EXTERNAL_FETCH_SOURCES=false \
              //java/src/org/openqa/selenium/grid:selenium_server_deploy.jar

            install -d "${target.dir}/usr/share/selenium-hub"
            install -m 0644 \
              bazel-bin/java/src/org/openqa/selenium/grid/selenium_server_deploy.jar \
              "${target.dir}/usr/share/selenium-hub/selenium-server.jar"
        - name: install hub launcher
          runs: |
            set -eux -o pipefail

            install -D -m 0755 \
              "${source.dir}/bin/selenium-hub.sh" \
              "${target.dir}/usr/bin/selenium-hub"
        - uses: dhi/build-pkg:0
          with:
            depends:
              - bash
              - eclipse-temurin-21-jre
            description: Selenium Grid Hub — coordinates WebDriver sessions across nodes
            files:
              - usr
            formats:
              - deb
            license: Apache-2.0
            name: selenium-hub
            rel: 0
            url: https://www.selenium.dev/documentation/grid/
            version: 4.47.0
      paths:
        - type: file
          path: ${source.dir}/bin/selenium-hub.sh
          uid: 0
          gid: 0
          source: package/main/selenium-hub/bin/selenium-hub.sh
os-release:
  name: Docker Hardened Images (Debian)
  id: debian
  version-id: "13"
  version-codename: trixie
  pretty-name: Docker Hardened Images/Debian GNU/Linux 13 (trixie)
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
