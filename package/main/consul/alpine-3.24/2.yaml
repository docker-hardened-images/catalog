# syntax=dhi.io/build:2-alpine3.24

image: dhi.io/pkg-consul
variant: runtime
tags:
  - 2.1.0-alpine3.24
  - 2.1.0-r2-alpine3.24
platforms:
  - linux/amd64
  - linux/arm64
dates:
  release: "2026-08-07"
vars:
  COMMIT_SHA: 881572b49b5d4d67713fa7f8ff09ed0ff2befc0f
  GOLANG_VERSION: 1.26.10-r0
  NODEJS_VERSION: 24.22.1-r1
  PACKAGE_NAME: consul
  PNPM_VERSION: 10.16.1
  REL: "2"
  SEMVER_MAJOR_MINOR_VERSION: "2.1"
  SEMVER_MAJOR_VERSION: "2"
  SEMVER_VERSION: 2.1.0
  VERSION: 2.1.0
contents:
  repositories:
    - https://dhi.io/apk/alpine/v3.24/main
    - https://dhi.io/apk/alpine/v3.23/main
    - https://dl-cdn.alpinelinux.org/alpine/v3.24/main
    - https://dl-cdn.alpinelinux.org/alpine/v3.24/community
  keyring:
    - https://dhi.io/keyring/dhi-apk@docker-0F81AD7700D99184.rsa.pub
  packages:
    - alpine-baselayout-data
  builds:
    - name: consul
      work-dir: /go/src/github.com/hashicorp/consul
      caches:
        - path: /pnpm/store
      contents:
        packages:
          - busybox
          - bash
          - ca-certificates-bundle
          - corepack
          - git
          - make
          - python3
          - golang-1.26=1.26.10-r0
          - golang-1.26-oci-config=1.26.10-r0
          - nodejs-24=24.22.1-r1
        files:
          - url: git+https://github.com/hashicorp/consul.git#v2.1.0
            checksum: 881572b49b5d4d67713fa7f8ff09ed0ff2befc0f
            path: /go/src/github.com/hashicorp/consul
            spdx:
              name: consul
              version: 2.1.0
              packages:
                - name: consul
                  purl: pkg:golang/github.com/hashicorp/consul@2.1.0
                  license: BUSL-1.1
            uid: 0
            gid: 0
      pipeline:
        - name: update go dependencies
          uses: go/bump@v2
          with:
            deps:
              - golang.org/x/net@v0.62.0
              - github.com/go-jose/go-jose/v4@v4.1.6
            download: true
        - name: build embedded UI
          work-dir: /go/src/github.com/hashicorp/consul/ui
          privileged: true
          environment:
            CI: "true"
            CONSUL_VERSION: 2.1.0
            HUSKY: "0"
            PNPM_HOME: /pnpm
          caches:
            - path: /pnpm/store
          runs: |
            set -eux -o pipefail

            corepack enable
            corepack prepare pnpm@10.16.1 --activate
            pnpm config set store-dir /pnpm/store

            make dist

            rm -rf /go/src/github.com/hashicorp/consul/agent/uiserver/dist
            mv packages/consul-ui/dist /go/src/github.com/hashicorp/consul/agent/uiserver/
        - uses: go/hermetic@v1
        - name: build
          uses: go/build@v1
          environment:
            GOFLAGS: -buildvcs=false
          with:
            fips: false
            ldflags:
              - -X github.com/hashicorp/consul/version.fullVersion=2.1.0
              - -X github.com/hashicorp/consul/version.GitCommit=881572b49b5d4d67713fa7f8ff09ed0ff2befc0f
              - -X github.com/hashicorp/consul/version.BuildDate=$(date -ud @${SOURCE_DATE_EPOCH} +'%Y-%m-%dT%H:%M:%SZ')
            output: ${target.dir}/usr/bin/consul
            packages: .
            tags:
              - hashicorpmetrics
        - name: build dev
          uses: go/build@v1
          environment:
            GOFLAGS: -buildvcs=false
          with:
            fips: false
            ldflags:
              - -X github.com/hashicorp/consul/version.fullVersion=2.1.0
              - -X github.com/hashicorp/consul/version.GitCommit=881572b49b5d4d67713fa7f8ff09ed0ff2befc0f
              - -X github.com/hashicorp/consul/version.BuildDate=$(date -ud @${SOURCE_DATE_EPOCH} +'%Y-%m-%dT%H:%M:%SZ')
            output: ${target.dir}/usr/bin/consul-dev
            packages: .
            strip: false
            tags:
              - hashicorpmetrics
        - uses: dhi/build-pkg:0
          with:
            description: HashiCorp Consul service networking solution
            files:
              - usr/bin/consul
            license: BUSL-1.1
            name: consul
            rel: 2
            subpackages:
              - files:
                  - path: usr/bin/consul
                    source: usr/bin/consul-dev
                name: consul-dev
            url: https://github.com/hashicorp/consul
            version: 2.1.0
os-release:
  name: Docker Hardened Images (Alpine)
  id: alpine
  version-id: "3.24"
  pretty-name: Docker Hardened Images/Alpine Linux v3.24
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
