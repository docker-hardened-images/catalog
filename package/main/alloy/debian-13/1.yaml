# syntax=dhi.io/build:2-debian13

image: dhi.io/pkg-alloy
variant: runtime
tags:
  - 1.19.2
  - 1.19.2-r3
  - 1.19.2-debian13
  - 1.19.2-r3-debian13
platforms:
  - linux/amd64
  - linux/arm64
vars:
  COMMIT_SHA: becfd489a7bb459c0496893b555fb87a003296b1
  GOLANG_MAJOR_MINOR_VERSION: "1.26"
  GOLANG_VERSION: 1.26.8-0
  NODEJS_VERSION: 24.20.0-0
  PACKAGE_NAME: alloy
  REL: "3"
  SEMVER_MAJOR_MINOR_VERSION: "1.19"
  SEMVER_MAJOR_VERSION: "1"
  SEMVER_VERSION: 1.19.2
  VERSION: 1.19.2
contents:
  packages:
    - base-files
  builds:
    - name: alloy
      work-dir: /go/src/github.com/grafana/alloy/collector
      caches:
        - path: /go/pkg/mod
        - path: /root/.npm
      contents:
        repositories:
          - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
        keyring:
          - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
        packages:
          - bash
          - build-essential
          - ca-certificates-bundle
          - coreutils
          - findutils
          - gcc
          - golang-1.26=1.26.8-0
          - golang-1.26-oci-config=1.26.8-0
          - libc6-dev
          - libsystemd-dev
          - mawk
          - nodejs-24=24.20.0-0
          - npm
          - sed
        files:
          - url: git+https://github.com/grafana/alloy.git#v1.19.2
            checksum: becfd489a7bb459c0496893b555fb87a003296b1
            path: /go/src/github.com/grafana/alloy
            spdx:
              name: alloy
              version: 1.19.2
              packages:
                - name: alloy
                  purl: pkg:golang/github.com/grafana/alloy@1.19.2
                  license: Apache-2.0
            uid: 0
            gid: 0
      pipeline:
        - name: bump ui dependencies
          uses: npm/bump@v1
          work-dir: /go/src/github.com/grafana/alloy/internal/web/ui
          privileged: true
          with:
            bumps: ${source.dir}/patch/npm-bumps.json
            npm-root: /go/src/github.com/grafana/alloy/internal/web/ui
        - name: build ui
          work-dir: /go/src/github.com/grafana/alloy/internal/web/ui
          privileged: true
          runs: |
            set -eux -o pipefail

            npm install
            npm run build
        - name: update go dependencies
          uses: go/bump@v1
          with:
            deps:
              - golang.org/x/mod@v0.40.0
              - github.com/go-git/go-git/v5@v5.19.2
              - go.etcd.io/etcd/client/pkg/v3@v3.6.14
              - google.golang.org/grpc@v1.83.1
            download: true
        - name: test
          runs: |
            set -eux -o pipefail

            go test -v -count=1 ./...
        - name: build alloy
          uses: go/build@v1
          with:
            cgo_enabled: 1
            fips: false
            ldflags:
              - -w
              - -X github.com/grafana/alloy/internal/build.Version=1.19.2
              - -X github.com/grafana/alloy/syntax/internal/stdlib.Version=1.19.2
              - -X github.com/grafana/alloy/internal/build.Revision=becfd489a7bb459c0496893b555fb87a003296b1
              - -X github.com/grafana/alloy/internal/build.Branch=dhi
              - -X github.com/grafana/alloy/internal/build.BuildUser=dhi
              - -X github.com/grafana/alloy/internal/build.BuildDate=$(date -u -d @${SOURCE_DATE_EPOCH} +'%FT%TZ')
            output: ${target.dir}/usr/bin/alloy
            strip: true
            tags:
              - netgo
              - embedalloyui
              - promtail_journal_enabled
              - pyroscope_ebpf
        - name: build alloy dev
          uses: go/build@v1
          with:
            cgo_enabled: 1
            fips: false
            ldflags:
              - -X github.com/grafana/alloy/internal/build.Version=1.19.2
              - -X github.com/grafana/alloy/syntax/internal/stdlib.Version=1.19.2
              - -X github.com/grafana/alloy/internal/build.Revision=becfd489a7bb459c0496893b555fb87a003296b1
              - -X github.com/grafana/alloy/internal/build.Branch=dhi
              - -X github.com/grafana/alloy/internal/build.BuildUser=dhi
              - -X github.com/grafana/alloy/internal/build.BuildDate=$(date -u -d @${SOURCE_DATE_EPOCH} +'%FT%TZ')
            output: ${target.dir}/usr/bin/alloy-dev
            strip: false
            tags:
              - netgo
              - embedalloyui
              - promtail_journal_enabled
              - pyroscope_ebpf
        - name: install production ui deps for sbom
          work-dir: /go/src/github.com/grafana/alloy/internal/web/ui
          privileged: true
          runs: |
            set -eux -o pipefail

            rm -rf node_modules
            npm install --omit=dev --ignore-scripts
        - name: ui sbom
          uses: sbom@v1
          with:
            extra-scanners: javascript-package-cataloger
            prefix: alloy-ui
            source: /go/src/github.com/grafana/alloy/internal/web/ui
        - name: install config and sbom
          runs: |
            set -eux -o pipefail

            install -D -m 0644 /go/src/github.com/grafana/alloy/example-config.alloy \
              "${target.dir}/etc/alloy/config.alloy"
            install -d "${target.dir}/opt/docker/sbom"
            cp -a /opt/docker/sbom/alloy-ui "${target.dir}/opt/docker/sbom/"
        - uses: dhi/build-pkg:0
          with:
            depends:
              - libc6
            description: Grafana Alloy, a vendor-agnostic OpenTelemetry Collector distribution
            files:
              - usr/bin/alloy
              - etc/alloy/config.alloy
              - opt/docker/sbom/alloy-ui
            formats:
              - deb
            license: Apache-2.0
            name: alloy
            rel: 3
            subpackages:
              - files:
                  - path: usr/bin/alloy
                    source: usr/bin/alloy-dev
                name: alloy-dev
            url: https://github.com/grafana/alloy
            version: 1.19.2
      paths:
        - type: file
          path: ${source.dir}/patch/npm-bumps.json
          uid: 0
          gid: 0
          source: package/main/alloy/patch/npm-bumps.json
os-release:
  name: Docker Hardened Images (Debian)
  id: debian
  version-id: "13"
  version-codename: trixie
  pretty-name: Docker Hardened Images/Debian GNU/Linux 13 (trixie)
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
