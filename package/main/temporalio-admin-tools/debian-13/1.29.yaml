            packages: ./cmd/tools/sql
        - name: build temporal-sql-tool dev
          uses: go/build@v1
          with:
            fips: false
            output: ${target.dir}/usr/bin/temporal-sql-tool-dev
            packages: ./cmd/tools/sql
            strip: false
        - name: build tdbg
          uses: go/build@v1
          with:
            fips: false
            output: ${target.dir}/usr/bin/tdbg
            packages: ./cmd/tools/tdbg
        - name: build tdbg dev
          uses: go/build@v1
          with:
            fips: false
            output: ${target.dir}/usr/bin/tdbg-dev
            packages: ./cmd/tools/tdbg
            strip: false
        - name: install schema
          shell: bash
          runs: |
            set -eux -o pipefail

            mkdir -p "${target.dir}/etc/temporal"
            cp -r schema "${target.dir}/etc/temporal/"
        - name: update cli dependencies (1.29 only)
          uses: go/bump@v2
          work-dir: /go/src/github.com/temporalio/cli
          with:
            deps:
              - golang.org/x/net@v0.62.0
              - github.com/apache/thrift@v0.24.0
              - github.com/go-jose/go-jose/v4@v4.1.6
              - github.com/gomarkdown/markdown@v0.0.0-20260724235538-61af6e1e6971
              - go.opentelemetry.io/otel/exporters/otlp/otlptrace@v1.45.0
              - go.opentelemetry.io/otel/exporters/otlp/otlptrace/otlptracegrpc@v1.45.0
              - google.golang.org/grpc@v1.85.0-dev.0.20260825072537-93e31b48545e
