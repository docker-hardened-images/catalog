              - go.opentelemetry.io/otel/log=go.opentelemetry.io/otel/log@v0.20.0
              - go.opentelemetry.io/otel/metric=go.opentelemetry.io/otel/metric@v1.45.0
              - go.opentelemetry.io/otel/sdk=go.opentelemetry.io/otel/sdk@v1.45.0
              - go.opentelemetry.io/otel/sdk/metric=go.opentelemetry.io/otel/sdk/metric@v1.45.0
              - go.opentelemetry.io/otel/trace=go.opentelemetry.io/otel/trace@v1.45.0
        - name: build temporal CLI binary
          uses: go/build@v1
          work-dir: /go/src/github.com/temporalio/cli
          with:
            fips: false
            ldflags:
              - -s
              - -w
              - -X github.com/temporalio/cli/internal/temporalcli.Version=1.10.1
            output: ${target.dir}/usr/bin/temporal
            packages: ./cmd/temporal
        - name: build temporal CLI dev
          uses: go/build@v1
          work-dir: /go/src/github.com/temporalio/cli
          with:
            fips: false
            ldflags:
              - -s
              - -w
              - -X github.com/temporalio/cli/internal/temporalcli.Version=1.10.1
            output: ${target.dir}/usr/bin/temporal-dev
            packages: ./cmd/temporal
            strip: false
        - name: install bash completion
          shell: bash
          runs: |
            set -eux -o pipefail

            mkdir -p "${target.dir}/etc/bash"
            "${target.dir}/usr/bin/temporal" completion bash > "${target.dir}/etc/bash/temporal-completion.sh"
        - name: add cqlsh
          privileged: true
          runs: |
            set -eux -o pipefail

            export VIRTUAL_ENV="${target.dir}/usr/lib/cqlsh"
            python3 -m venv --without-pip "$VIRTUAL_ENV"

            python3 -m pip --python "$VIRTUAL_ENV/bin/python3" install --no-cache-dir "cqlsh==6.2.2"
        - name: bump cqlsh python dependencies
          uses: python/bump@v1
          privileged: true
          with:
            bumps: ${source.dir}/patch/python-bumps.json
            mode: env
            python: ${target.dir}/usr/lib/cqlsh
        - name: finalize cqlsh venv
          runs: |
            set -eux -o pipefail

            export VIRTUAL_ENV="${target.dir}/usr/lib/cqlsh"

            find "${VIRTUAL_ENV}" \( -type d \( -name test -o -name tests -o -name __pycache__ \) \) -prune -exec rm -rf {} + || true
            find "${VIRTUAL_ENV}" -type f \( -name '*.pyc' -o -name '*.pyo' \) -delete || true

            find "${VIRTUAL_ENV}/bin" -type f -executable -exec sed -i "1s|^#!${target.dir}|#!|" {} +
        - name: add yq
          privileged: true
          runs: |
            set -eux -o pipefail

            export VIRTUAL_ENV="${target.dir}/usr/lib/yq"
            python3 -m venv --without-pip "$VIRTUAL_ENV"

            python3 -m pip --python "$VIRTUAL_ENV/bin/python3" install --no-cache-dir "yq==4.4.5"
        - name: bump yq python dependencies
          uses: python/bump@v1
          privileged: true
          with:
            bumps: ${source.dir}/patch/python-bumps.json
            mode: env
            python: ${target.dir}/usr/lib/yq
        - name: finalize yq venv
          runs: |
            set -eux -o pipefail

            export VIRTUAL_ENV="${target.dir}/usr/lib/yq"

            find "${VIRTUAL_ENV}" \( -type d \( -name test -o -name tests -o -name __pycache__ \) \) -prune -exec rm -rf {} + || true
            find "${VIRTUAL_ENV}" -type f \( -name '*.pyc' -o -name '*.pyo' \) -delete || true

            find "${VIRTUAL_ENV}/bin" -type f -executable -exec sed -i "1s|^#!${target.dir}|#!|" {} +
        - name: stage usr bin symlinks for python tools
          runs: |
            set -eux -o pipefail

            ln -sf ../lib/cqlsh/bin/cqlsh "${target.dir}/usr/bin/cqlsh"
            ln -sf ../lib/yq/bin/yq "${target.dir}/usr/bin/yq"
        - uses: dhi/build-pkg:0
          with:
            depends:
              - python-3.13
            description: Temporal admin tools CLI and schema utilities
            files:
              - usr/bin/temporal-cassandra-tool
              - usr/bin/temporal-sql-tool
              - usr/bin/tdbg
              - usr/bin/temporal
              - usr/bin/cqlsh
              - usr/bin/yq
              - usr/lib/cqlsh
              - usr/lib/yq
              - etc/temporal/schema
              - etc/bash/temporal-completion.sh
            formats:
              - deb
            license: MIT
            name: temporalio-admin-tools-1.29
            rel: 15
            subpackages:
              - files:
                  - path: usr/bin/temporal-cassandra-tool
                    source: usr/bin/temporal-cassandra-tool-dev
                  - path: usr/bin/temporal-sql-tool
                    source: usr/bin/temporal-sql-tool-dev
                  - path: usr/bin/tdbg
                    source: usr/bin/tdbg-dev
                  - path: usr/bin/temporal
                    source: usr/bin/temporal-dev
                name: temporalio-admin-tools-1.29-dev
            url: https://github.com/temporalio/temporal
            version: 1.29.7
      paths:
        - type: file
          path: ${source.dir}/patch/python-bumps.json
          uid: 0
          gid: 0
          mode: "0644"
          source: package/main/temporalio-admin-tools/patch/python-bumps.json
