                  license: MIT
                - name: tdbg
                  purl: pkg:golang/go.temporal.io/server/cmd/tools/tdbg@1.29.7
                  license: MIT
            uid: 0
            gid: 0
          - url: git+https://github.com/temporalio/cli.git#v1.10.1
            checksum: 915a6e982d587c8b40feb3d82c3d8947c8e9e742
            path: /go/src/github.com/temporalio/cli
            spdx:
