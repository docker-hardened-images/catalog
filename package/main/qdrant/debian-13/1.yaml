# syntax=dhi.io/build:2-debian13

image: dhi.io/pkg-qdrant
variant: runtime
tags:
  - 1.19.1-1
  - 1.19.1-1-debian13
platforms:
  - linux/amd64
  - linux/arm64
dates:
  release: "2023-02-08"
vars:
  CARGO_VERSION: 1.97.1-0
  COMMIT_SHA: 6ab21cac18ebb6f4ae29102c7f8f5cc11affd5de
  DHI_REL: "1"
  DHI_VERSION: 1.19.1-1
  NODEJS_VERSION: 24.21.0-0
  RUSTC_VERSION: 1.97.1-0
  VERSION: 1.19.1
  WEB_UI_COMMIT_SHA: 6f8536529934672a0d2631cfaa0d0779967922bc
  WEB_UI_VERSION: 0.2.18
contents:
  packages:
    - base-files
  builds:
    - name: qdrant
      work-dir: ${source.dir}/qdrant-deb
      environment:
        GIT_COMMIT_ID: 6ab21cac18ebb6f4ae29102c7f8f5cc11affd5de
      caches:
        - path: /root/.cargo
        - path: /root/.npm
      contents:
        repositories:
          - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
        keyring:
          - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
        packages:
          - bash
          - build-essential
          - cargo-1.97=1.97.1-0
          - cargo-auditable
          - ca-certificates
          - clang
          - cmake
          - coreutils
          - debhelper
          - dpkg-dev
          - findutils
          - git
          - libprotobuf-dev
          - libunwind-dev
          - lld
          - mawk
          - nodejs-24=24.21.0-0
          - npm
          - pkg-config
          - protobuf-compiler
          - rustc-1.97=1.97.1-0
          - sed
        files:
          - url: git+https://github.com/qdrant/qdrant.git#v1.19.1
            checksum: 6ab21cac18ebb6f4ae29102c7f8f5cc11affd5de
            path: ${source.dir}/qdrant-src
            spdx:
              name: qdrant
              version: 1.19.1
              packages:
                - name: qdrant
                  purl: pkg:cargo/qdrant@1.19.1
                  license: Apache-2.0
            uid: 0
            gid: 0
          - url: git+https://github.com/qdrant/qdrant-web-ui.git#v0.2.18
            checksum: 6f8536529934672a0d2631cfaa0d0779967922bc
            path: ${source.dir}/qdrant-web-ui
            spdx:
              name: qdrant-web-ui
              version: 0.2.18
              packages:
                - name: qdrant-web-ui
                  purl: pkg:github/qdrant/qdrant-web-ui@0.2.18
                  license: Apache-2.0
            uid: 0
            gid: 0
      pipeline:
        - name: build web ui dashboard
          work-dir: ${source.dir}/qdrant-web-ui
          privileged: true
          runs: |
            set -eux -o pipefail

            npm pkg set dependencies.axios=^1.18.0
            npm pkg set \
              'overrides[tar]=7.5.19' \
              'overrides[js-yaml]=4.3.2'
            rm -f package-lock.json
            npm install --ignore-scripts
            npm run build-qdrant

            rm -rf node_modules
        - name: web ui sbom
          uses: sbom@v1
          with:
            extra-scanners: javascript-lock-cataloger
            prefix: qdrant-web-ui
            source: ${source.dir}/qdrant-web-ui
        - name: bump cargo dependencies
          work-dir: ${source.dir}/qdrant-src
          privileged: true
          runs: |
            set -eux -o pipefail

            cargo update --package crossbeam-epoch --precise 0.9.20
            cargo update --package rand@0.8.5 --precise 0.8.6
            cargo update --package rand@0.9.2 --precise 0.9.3
            cargo update --package h2@0.4.14 --precise 0.4.16
        - name: build
          work-dir: ${source.dir}/qdrant-src
          privileged: true
          runs: |
            set -eux -o pipefail

            cargo auditable build --release --locked --bin qdrant --features deb,stacktrace

            install -D -m 0755 target/release/qdrant \
              '${source.dir}/qdrant-deb/payload/usr/bin/qdrant'
        - name: stage config
          work-dir: ${source.dir}/qdrant-src
          runs: |
            set -eux -o pipefail

            install -d '${source.dir}/qdrant-deb/payload/usr/share/qdrant/config'
            cp config/config.yaml '${source.dir}/qdrant-deb/payload/usr/share/qdrant/config/'
            cp config/production.yaml '${source.dir}/qdrant-deb/payload/usr/share/qdrant/config/'
        - name: vendor web ui dashboard
          runs: |
            set -eux -o pipefail

            install -d '${source.dir}/qdrant-deb/payload/usr/share/qdrant/static'
            cp -r '${source.dir}/qdrant-web-ui/dist/'* '${source.dir}/qdrant-deb/payload/usr/share/qdrant/static/'
            cp '${source.dir}/qdrant-src/docs/redoc/master/openapi.json' \
              '${source.dir}/qdrant-deb/payload/usr/share/qdrant/static/openapi.json'
        - uses: dpkg/bump@v1
          with:
            changelog:
              - DHI Build
            version: 1.19.1-1
        - uses: dpkg/build@v1
          privileged: true
          with:
            args: -b -uc -us -d
      paths:
        - type: directory
          path: ${source.dir}/qdrant-deb/debian
          uid: 0
          gid: 0
          mode: "0600"
          source: package/main/qdrant/debian-13/debian
os-release:
  name: Docker Hardened Images (Debian)
  id: debian
  version-id: "13"
  version-codename: trixie
  pretty-name: Docker Hardened Images/Debian GNU/Linux 13 (trixie)
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
