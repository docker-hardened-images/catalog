# syntax=dhi.io/build:2-debian13

image: dhi.io/pkg-qdrant
variant: runtime
tags:
  - 1.20.0-2
  - 1.20.0-2-debian13
platforms:
  - linux/amd64
  - linux/arm64
dates:
  release: "2023-02-08"
vars:
  CARGO_VERSION: 1.98.1-0
  COMMIT_SHA: 222b2e44ab1c3f17e8246396ead6558e45041df7
  DHI_REL: "2"
  DHI_VERSION: 1.20.0-2
  GCC_VERSION: 14.2.0-19+dhi5
  NODEJS_VERSION: 24.22.2-0
  RUSTC_VERSION: 1.98.1-0
  VERSION: 1.20.0
  WEB_UI_COMMIT_SHA: 90a83dd67bb9e3f84cf62daed14a9489ae1e7fdd
  WEB_UI_VERSION: 0.2.20
contents:
  repositories:
    - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
  keyring:
    - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
  packages:
    - base-files
    - gcc-14-base=14.2.0-19+dhi5
    - libgcc-s1=14.2.0-19+dhi5
  builds:
    - name: qdrant
      work-dir: ${source.dir}/qdrant-deb
      environment:
        GIT_COMMIT_ID: 222b2e44ab1c3f17e8246396ead6558e45041df7
      caches:
        - path: /root/.cargo
        - path: /root/.npm
      contents:
        repositories:
          - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
        keyring:
          - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
        packages:
          - bash
          - build-essential
          - cargo-1.98=1.98.1-0
          - cargo-auditable
          - ca-certificates
          - clang
          - cmake
          - coreutils
          - debhelper
          - dpkg-dev
          - findutils
          - git
          - libprotobuf-dev
          - libunwind-dev
          - lld
          - mawk
          - nodejs-24=24.22.2-0
          - npm
          - pkg-config
          - protobuf-compiler
          - rustc-1.98=1.98.1-0
          - sed
        files:
          - url: git+https://github.com/qdrant/qdrant.git#v1.20.0
            checksum: 222b2e44ab1c3f17e8246396ead6558e45041df7
            path: ${source.dir}/qdrant-src
            spdx:
              name: qdrant
              version: 1.20.0
              packages:
                - name: qdrant
                  purl: pkg:cargo/qdrant@1.20.0
                  license: Apache-2.0
            uid: 0
            gid: 0
          - url: git+https://github.com/qdrant/qdrant-web-ui.git#v0.2.20
            checksum: 90a83dd67bb9e3f84cf62daed14a9489ae1e7fdd
            path: ${source.dir}/qdrant-web-ui
            spdx:
              name: qdrant-web-ui
              version: 0.2.20
              packages:
                - name: qdrant-web-ui
                  purl: pkg:github/qdrant/qdrant-web-ui@0.2.20
                  license: Apache-2.0
            uid: 0
            gid: 0
      pipeline:
        - name: build web ui dashboard
          work-dir: ${source.dir}/qdrant-web-ui
          privileged: true
          runs: |
            set -eux -o pipefail

            npm pkg set dependencies.axios=^1.18.0
            npm pkg set \
              'overrides[tar]=7.5.19' \
              'overrides[js-yaml]=4.3.2' \
              'overrides[undici]=7.30.1' \
              'overrides[source-map-js]=1.2.2'
            rm -f package-lock.json
            npm install --ignore-scripts
            npm run build-qdrant

            rm -rf node_modules
        - name: web ui sbom
          uses: sbom@v1
          with:
            extra-scanners: javascript-lock-cataloger
            prefix: qdrant-web-ui
            source: ${source.dir}/qdrant-web-ui
        - name: bump cargo dependencies
          work-dir: ${source.dir}/qdrant-src
          privileged: true
          runs: |
            set -eux -o pipefail

            cargo update --package crossbeam-epoch --precise 0.9.20
            cargo update --package rand@0.8.5 --precise 0.8.6
            cargo update --package h2@0.4.14 --precise 0.4.16
            cargo update --package rustls --precise 0.23.46
            cargo update --package xxhash-rust@0.8.15 --precise 0.8.16
            cargo update --package quinn-proto@0.11.16 --precise 0.11.18
            cargo update --package tokio@1.53.1 --precise 1.53.3

            cargo update --package jsonwebtoken@11.0.0 --precise 11.1.0
            sed -i 's|features = \["rust_crypto"\]|features = ["aws_lc_rs"]|' Cargo.toml
            cargo update --package jsonwebtoken

            cargo fetch
            pyroscope_src="$(find "${CARGO_HOME:-/root/.cargo}/registry/src" -type d -name pyroscope-2.1.1 | head -1)"
            cp -a "${pyroscope_src}" "${source.dir}/pyroscope-patched"
            sed -i 's/version = "0.39"/version = "=0.40.0"/' \
              "${source.dir}/pyroscope-patched/Cargo.toml"
            sed -i "/branch = \"v0.14.6-qdrant\" }/a pyroscope = { path = \"${source.dir}/pyroscope-patched\" }" Cargo.toml

            cargo update --package pyroscope
            cargo update --package object@0.40.0 --precise 0.40.0
            cargo update --package ruzstd --precise 0.9.1

            sed -i 's/zstd = "0.13"/zstd = "0.14"/' Cargo.toml
            cargo fetch
            foyer_storage_src="$(find "${CARGO_HOME:-/root/.cargo}/registry/src" -type d -name 'foyer-storage-0.22.6' | head -1)"
            cp -a "${foyer_storage_src}" "${source.dir}/foyer-storage-patched"
            perl -i -0pe 's/(\[dependencies\.zstd\]\nversion = )"0.13"/${1}"0.14"/s' \
              "${source.dir}/foyer-storage-patched/Cargo.toml"

            sed -i "/^tonic = { git/a foyer-storage = { path = \"${source.dir}/foyer-storage-patched\" }" Cargo.toml
            cargo update --package actix-http --precise 3.20.0
            cargo update --package foyer-storage
            cargo fetch
            include_flate_compress_src="$(find "${CARGO_HOME:-/root/.cargo}/registry/src" -type d -name 'include-flate-compress-0.3.4' | head -1)"
            cp -a "${include_flate_compress_src}" "${source.dir}/include-flate-compress-patched"
            perl -i -0pe 's/(\[dependencies\.zstd\]\nversion = )"0.13.3"/${1}"0.14.3"/s' \
              "${source.dir}/include-flate-compress-patched/Cargo.toml"
            sed -i "/foyer-storage = { path/a include-flate-compress = { path = \"${source.dir}/include-flate-compress-patched\" }" Cargo.toml
            cargo update --package include-flate-compress
        - name: build
          work-dir: ${source.dir}/qdrant-src
          privileged: true
          runs: |
            set -eux -o pipefail

            cargo auditable build --release --locked --bin qdrant --features deb,stacktrace

            install -D -m 0755 target/release/qdrant \
              '${source.dir}/qdrant-deb/payload/usr/bin/qdrant'
        - name: stage config
          work-dir: ${source.dir}/qdrant-src
          runs: |
            set -eux -o pipefail

            install -d '${source.dir}/qdrant-deb/payload/usr/share/qdrant/config'
            cp config/config.yaml '${source.dir}/qdrant-deb/payload/usr/share/qdrant/config/'
            cp config/production.yaml '${source.dir}/qdrant-deb/payload/usr/share/qdrant/config/'
        - name: vendor web ui dashboard
          runs: |
            set -eux -o pipefail

            install -d '${source.dir}/qdrant-deb/payload/usr/share/qdrant/static'
            cp -r '${source.dir}/qdrant-web-ui/dist/'* '${source.dir}/qdrant-deb/payload/usr/share/qdrant/static/'
            cp '${source.dir}/qdrant-src/docs/redoc/master/openapi.json' \
              '${source.dir}/qdrant-deb/payload/usr/share/qdrant/static/openapi.json'
        - uses: dpkg/bump@v1
          with:
            changelog:
              - Bump Cargo zstd, zstd-safe, and zstd-sys for RUSTSEC-2026-0391, RUSTSEC-2026-0395 through RUSTSEC-2026-0406, and RUSTSEC-2026-0410.
              - Use jsonwebtoken aws_lc_rs to drop vulnerable crypto-bigint 0.5.5 for RUSTSEC-2026-0387.
              - Bump Cargo tokio to 1.53.3 for RUSTSEC-2026-0386.
              - Bump npm undici override to 7.30.1 for CVE-2026-109841, CVE-2026-109869, and CVE-2026-109924.
            version: 1.20.0-2
        - uses: dpkg/build@v1
          privileged: true
          with:
            args: -b -uc -us -d
      paths:
        - type: directory
          path: ${source.dir}/qdrant-deb/debian
          uid: 0
          gid: 0
          mode: "0600"
          source: package/main/qdrant/debian-13/debian
os-release:
  name: Docker Hardened Images (Debian)
  id: debian
  version-id: "13"
  version-codename: trixie
  pretty-name: Docker Hardened Images/Debian GNU/Linux 13 (trixie)
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
