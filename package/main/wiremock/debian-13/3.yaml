# syntax=dhi.io/build:2-debian13

image: dhi.io/pkg-wiremock
variant: runtime
tags:
  - 3.13.2
  - 3.13.2-r3
  - 3.13.2-debian13
  - 3.13.2-r3-debian13
platforms:
  - linux/amd64
  - linux/arm64
vars:
  COMMIT_SHA: 88587aa13b4899da080538e1b21bec0da105491e
  GRADLE_REFERENCE: dhi/gradle:8.14.5-jdk17-debian13-dev@sha256:614c24db29d401e9cc62ad6b98ddc26d453e972c2b466f55a71e054297d6fe53
  PACKAGE_NAME: wiremock
  REL: "3"
  SEMVER_MAJOR_MINOR_VERSION: "3.13"
  SEMVER_MAJOR_VERSION: "3"
  SEMVER_VERSION: 3.13.2
  VERSION: 3.13.2
contents:
  packages:
    - base-files
  builds:
    - name: wiremock
      uses: dhi.io/gradle:8.14.5-jdk17-debian13-dev@sha256:614c24db29d401e9cc62ad6b98ddc26d453e972c2b466f55a71e054297d6fe53
      work-dir: ${source.dir}/wiremock
      caches:
        - path: /root/.gradle
      contents:
        packages:
          - bash
          - ca-certificates
          - coreutils
          - findutils
          - git
          - grep
          - nodejs-24
          - node-corepack
          - npm
          - sed
          - yarn-classic
        files:
          - url: git+https://github.com/wiremock/wiremock.git#3.13.2
            checksum: 88587aa13b4899da080538e1b21bec0da105491e
            path: ${source.dir}/wiremock
            spdx:
              name: wiremock
              version: 3.13.2
              packages:
                - name: wiremock
                  purl: pkg:maven/org.wiremock/wiremock@3.13.2
                  license: Apache-2.0
            uid: 0
            gid: 0
      pipeline:
        - name: build ui resources
          work-dir: ${source.dir}/wiremock/ui
          privileged: true
          runs: |
            set -eux -o pipefail

            npm install
            npm run swagger
        - name: relocate handlebars ext helper imports
          runs: |
            set -eux -o pipefail

            sed -i \
              -e 's|^import com\.github\.jknack\.handlebars\.helper\.AssignHelper;|import com.github.jknack.handlebars.helper.ext.AssignHelper;|' \
              -e 's|^import com\.github\.jknack\.handlebars\.helper\.NumberHelper;|import com.github.jknack.handlebars.helper.ext.NumberHelper;|' \
              src/main/java/com/github/tomakehurst/wiremock/extension/responsetemplating/TemplateEngine.java

            grep -q '^import com\.github\.jknack\.handlebars\.helper\.ext\.AssignHelper;' \
              src/main/java/com/github/tomakehurst/wiremock/extension/responsetemplating/TemplateEngine.java
            grep -q '^import com\.github\.jknack\.handlebars\.helper\.ext\.NumberHelper;' \
              src/main/java/com/github/tomakehurst/wiremock/extension/responsetemplating/TemplateEngine.java
        - name: build
          privileged: true
          environment:
            GRADLE_OPTS: -Dspotless.enabled=false
          runs: |
            set -eux -o pipefail

            gradle --init-script ${source.dir}/dhi-runtime-deps.init.gradle \
              shadowJar dhiCopyRuntimeDeps --no-daemon \
              -x spotlessCheck -x spotlessJavaCheck -x spotlessJava
        - name: stage jar and launcher
          runs: |
            set -eux -o pipefail

            install -d "${target.dir}/usr/share/wiremock"
            find build/libs -maxdepth 1 -name 'wiremock-standalone*.jar' -type f | head -1 \
              | xargs -I {} install -m 0644 {} "${target.dir}/usr/share/wiremock/wiremock-standalone.jar"

            install -d "${target.dir}/usr/bin"
            cat > "${target.dir}/usr/bin/wiremock" << 'LAUNCHER'
            #!/bin/sh
            exec java -jar /usr/share/wiremock/wiremock-standalone.jar "$@"
            LAUNCHER
            chmod 0755 "${target.dir}/usr/bin/wiremock"
        - name: runtime dependency jars sbom
          uses: sbom@v1
          with:
            extra-scanners: java-archive-cataloger
            prefix: wiremock-runtime-deps
            source: ${source.dir}/wiremock/build/dhi-runtime-deps
        - uses: dhi/build-pkg:0
          with:
            description: Flexible API mocking tool for service virtualization that simulates HTTP-based APIs
            files:
              - usr
            license: Apache-2.0
            name: wiremock
            rel: 3
            url: https://wiremock.org
            version: 3.13.2
      paths:
        - type: file
          path: ${source.dir}/dhi-runtime-deps.init.gradle
          uid: 0
          gid: 0
          source: package/main/wiremock/files/dhi-runtime-deps.init.gradle
os-release:
  name: Docker Hardened Images (Debian)
  id: debian
  version-id: "13"
  version-codename: trixie
  pretty-name: Docker Hardened Images/Debian GNU/Linux 13 (trixie)
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
