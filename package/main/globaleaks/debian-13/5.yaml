# syntax=dhi.io/build:2-debian13

image: dhi.io/pkg-globaleaks
variant: runtime
tags:
  - 5.0.101
  - 5.0.101-r0
  - 5.0.101-debian13
  - 5.0.101-r0-debian13
platforms:
  - linux/amd64
  - linux/arm64
dates:
  release: "2024-08-19"
vars:
  COMMIT_SHA: f7706fc6fa5d79c53d84a553d71adb9ce69ca3e8
  NODEJS_VERSION: 24.22.2-0
  NPM_VERSION: 11.21.2-1
  PACKAGE_NAME: globaleaks-5
  REL: "0"
  SEMVER_MAJOR_MINOR_VERSION: "5.0"
  SEMVER_MAJOR_VERSION: "5"
  SEMVER_VERSION: 5.0.101
  VERSION: 5.0.101
contents:
  repositories:
    - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
  keyring:
    - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
  packages:
    - base-files
  builds:
    - name: globaleaks-5
      work-dir: ${source.dir}/globaleaks
      environment:
        NODE_OPTIONS: --max-old-space-size=4096
      caches:
        - path: /root/.npm
      contents:
        packages:
          - bash
          - brotli
          - ca-certificates
          - coreutils
          - findutils
          - grep
          - libc6
          - libstdc++6
          - nodejs-24=24.22.2-0
          - npm=11.21.2-1
          - patch
          - sed
        files:
          - url: git+https://github.com/globaleaks/globaleaks-whistleblowing-software.git#v5.0.101
            checksum: f7706fc6fa5d79c53d84a553d71adb9ce69ca3e8
            path: ${source.dir}/globaleaks
            spdx:
              name: globaleaks
              version: 5.0.101
              packages:
                - name: globaleaks
                  purl: pkg:dhi/globaleaks@5.0.101
                  license: AGPL-3.0-or-later
            uid: 0
            gid: 0
      pipeline:
        - name: bump client dependencies
          uses: npm/bump@v1
          work-dir: ${source.dir}/globaleaks/client
          privileged: true
          with:
            bumps: ${source.dir}/patch/npm-bumps.json
            npm-root: ${source.dir}/globaleaks/client
            omit-dev: false
        - name: install client dependencies
          work-dir: ${source.dir}/globaleaks/client
          privileged: true
          runs: |
            set -eux -o pipefail

            npm ci
        - name: build client
          work-dir: ${source.dir}/globaleaks/client
          privileged: true
          runs: |
            set -eux -o pipefail

            ./node_modules/grunt/bin/grunt build
        - name: prune client dev dependencies
          work-dir: ${source.dir}/globaleaks/client
          runs: |
            set -eux -o pipefail

            npm prune --omit=dev
        - name: sbom
          uses: sbom@v1
          with:
            extra-scanners: javascript-package-cataloger
            prefix: globaleaks-client
            source: ${source.dir}/globaleaks/client/node_modules
        - name: install backend
          work-dir: ${source.dir}/globaleaks/backend
          runs: |
            set -eux -o pipefail

            dest="${target.dir}/usr/lib/python3/dist-packages/globaleaks"
            mkdir -p "${target.dir}/usr/lib/python3/dist-packages"
            cp -a globaleaks "${dest}"
            rm -r "${dest}/tests"
            find "${dest}" \
              \( -type d -name __pycache__ -o -type f -name '*.pyc' -o -type f -name '*.pyo' \) \
              -exec rm -rf '{}' + || true

            install -d "${target.dir}/usr/bin"
            install -m 0755 bin/globaleaks "${target.dir}/usr/bin/globaleaks"
            install -m 0755 bin/gl-admin "${target.dir}/usr/bin/gl-admin"
            sed -i '1s|^#!.*python3.*$|#!/usr/bin/python3|' "${target.dir}/usr/bin/globaleaks"
            head -n1 "${target.dir}/usr/bin/globaleaks" | grep -qx '#!/usr/bin/python3'

            test -f "${dest}/__init__.py"
        - name: stage shared data
          runs: |
            set -eux -o pipefail

            install -D -m 0644 "${source.dir}/globaleaks/LICENSE" "${target.dir}/usr/share/globaleaks/LICENSE"
            install -D -m 0644 "${source.dir}/globaleaks/CHANGELOG" "${target.dir}/usr/share/globaleaks/CHANGELOG"
            install -D -m 0644 "${source.dir}/globaleaks/backend/default" "${target.dir}/usr/share/globaleaks/default"
            mkdir -p "${target.dir}/usr/share/globaleaks/client"
            cp -a "${source.dir}/globaleaks/client/build/." "${target.dir}/usr/share/globaleaks/client/"
            test -f "${target.dir}/usr/share/globaleaks/client/index.html"
            test -f "${target.dir}/usr/share/globaleaks/default"
            install -d "${target.dir}/opt/docker/sbom"
            cp -a /opt/docker/sbom/globaleaks-client /opt/docker/sbom/globaleaks "${target.dir}/opt/docker/sbom/"
        - uses: dhi/build-pkg:0
          with:
            depends:
              - python3
              - python3-acme
              - python3-brotli
              - python3-cryptography
              - python3-fpdf
              - python3-gnupg
              - python3-nacl
              - python3-openssl
              - python3-packaging
              - python3-pyotp
              - python3-sqlalchemy
              - python3-twisted
              - python3-txtorcon
              - tor
              - gnupg
              - tar
              - gzip
              - dash
            description: Free and open-source whistleblowing software
            files:
              - usr/bin/globaleaks
              - usr/bin/gl-admin
              - usr/lib/python3/dist-packages/globaleaks
              - usr/share/globaleaks
              - opt/docker/sbom/globaleaks-client
              - opt/docker/sbom/globaleaks
            formats:
              - deb
            license: AGPL-3.0-or-later
            name: globaleaks-5
            rel: 0
            url: https://globaleaks.org
            version: 5.0.101
      paths:
        - type: file
          path: ${source.dir}/patch/npm-bumps.json
          uid: 0
          gid: 0
          source: package/main/globaleaks/patch/npm-bumps.json
os-release:
  name: Docker Hardened Images (Debian)
  id: debian
  version-id: "13"
  version-codename: trixie
  pretty-name: Docker Hardened Images/Debian GNU/Linux 13 (trixie)
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
