            uid: 0
            gid: 0
      pipeline:
        - name: patch entrypoint
          uses: patch@v1
          with:
            options: -p1
            patches:
              - ${source.dir}/patch/dhi-build-entrypoint.patch
        - name: install
          runs: |
            set -eux -o pipefail

            install -d -m 0755 "${target.dir}/etc/codecov-gateway" "${target.dir}/etc/haproxy" "${target.dir}/usr/bin"
