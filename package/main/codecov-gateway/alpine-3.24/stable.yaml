            install -m 0644 -t "${target.dir}/etc/haproxy" config/proxy.map config/minio.map
            install -m 0755 entrypoint.sh "${target.dir}/usr/bin/codecov-gateway"
            printf '%s\n' "f84892435ab50c2186398f6c9a417a779cf2c760" | cut -c1-7 > "${target.dir}/etc/codecov-gateway/build-id"
        - uses: dhi/build-pkg:0
