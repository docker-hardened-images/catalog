# syntax=dhi.io/build:2-debian13

image: dhi.io/pkg-sapmachine
variant: runtime
tags:
  - 17.0.20-r0
  - 17.0.20-r0-debian13
platforms:
  - linux/amd64
  - linux/arm64
dates:
  release: "2021-09-14"
  end-of-life: "2026-09-01"
vars:
  ARCH: '#{ target.arch == "amd64" ? "x64" : "aarch64" }'
  BCFIPS_VERSION: 2.1.3
  BCPKIXFIPS_VERSION: 2.1.13
  BCRNGJENT_VERSION: 1.3.6
  BCTLSFIPS_VERSION: 2.1.25
  BCUTILFIPS_VERSION: 2.1.8
  JAVA_JDK_CHECKSUM: https://github.com/sap/sapmachine/releases/download/sapmachine-17.0.20/sapmachine-jdk-17.0.20_linux-${ARCH}_bin.sha256.txt
  JAVA_JDK_DOWNLOAD: https://github.com/sap/sapmachine/releases/download/sapmachine-17.0.20/sapmachine-jdk-17.0.20_linux-${ARCH}_bin.tar.gz
  JAVA_JRE_CHECKSUM: https://github.com/sap/sapmachine/releases/download/sapmachine-17.0.20/sapmachine-jre-17.0.20_linux-${ARCH}_bin.sha256.txt
  JAVA_JRE_DOWNLOAD: https://github.com/sap/sapmachine/releases/download/sapmachine-17.0.20/sapmachine-jre-17.0.20_linux-${ARCH}_bin.tar.gz
  JAVA_MAJOR_MINOR_VERSION: "17.0"
  JAVA_MAJOR_VERSION: "17"
  JAVA_VERSION: 17.0.20
  KEYSTORE_TYPE: JKS
  PACKAGE_NAME: sapmachine-17
  REL: "0"
  SEMVER_MAJOR_MINOR_VERSION: "17.0"
  SEMVER_MAJOR_VERSION: "17"
  SEMVER_VERSION: 17.0.20
  VERSION: 17.0.20
contents:
  repositories:
    - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
  keyring:
    - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
  packages:
    - '!base-files'
  builds:
    - name: sapmachine-17-jdk
      contents:
        packages:
          - base-files
          - bash
          - coreutils
          - findutils
        files:
          - url: https://github.com/sap/sapmachine/releases/download/sapmachine-17.0.20/sapmachine-jdk-17.0.20_linux-${ARCH}_bin.tar.gz
            checksum: https://github.com/sap/sapmachine/releases/download/sapmachine-17.0.20/sapmachine-jdk-17.0.20_linux-${ARCH}_bin.sha256.txt
            path: ${target.dir}/work/sapmachine-17-jdk
            spdx:
              name: sapmachine
              version: 17.0.20.${JAVA_VERSION_SUFFIX}
              packages:
                - name: sapmachine
                  purl: pkg:dhi/sap/sapmachine-jdk@17.0.20.${JAVA_VERSION_SUFFIX}
                  license: GPL-2.0-with-classpath-exception
            uid: 0
            gid: 0
      pipeline:
        - name: create symlinks
          runs: |
            set -eux -o pipefail

            WORK=${target.dir}/work/sapmachine-17-jdk
            DEST=${target.dir}/opt/java/openjdk/17
            mkdir -p "$DEST"
            mv "$WORK"/* "$DEST"/
            rm -rf "$WORK"
            if [ ! -f "$DEST/bin/java" ]; then
              SUBDIR=$(find "$DEST" -mindepth 1 -maxdepth 1 -type d | head -1)
              mv "$SUBDIR"/* "$DEST"/
              rm -rf "$SUBDIR"
            fi

            rm -rf ${target.dir}/opt/java/openjdk/17/lib/src.zip
        - name: remove compromised CA roots
          runs: |
            set -eux -o pipefail

            JAVA_HOME="${target.dir}/opt/java/openjdk/17"
            KEYTOOL="$JAVA_HOME/bin/keytool"
            CACERTS="$JAVA_HOME/lib/security/cacerts"
            if [ "17" = "8" ]; then
              CACERTS="$JAVA_HOME/jre/lib/security/cacerts"
            fi

            "$KEYTOOL" -list -keystore "$CACERTS" -storepass changeit > /dev/null
            for alias in \
              "comodoaaaca [jdk]" \
              "emsigneccrootcag3 [jdk]" \
              "emsignrootcag1 [jdk]" \
              "emsignrootcag2 [jdk]" \
              "cn_aaa_certificate_services,o_comodo_ca_limited,l_salford,st_greater_manchester,c_gb [jdk]" \
              "cn_emsign_ecc_root_ca__g3,o_emudhra_technologies_limited,ou_emsign_pki,c_in [jdk]" \
              "cn_emsign_root_ca__g1,o_emudhra_technologies_limited,ou_emsign_pki,c_in [jdk]" \
              "cn_emsign_root_ca__g2,o_emudhra_technologies_limited,ou_emsign_pki,c_in [jdk]"; do
              if "$KEYTOOL" -list -keystore "$CACERTS" -storepass changeit -alias "$alias" > /dev/null 2>&1; then
                "$KEYTOOL" -delete -keystore "$CACERTS" -storepass changeit -alias "$alias"
              fi
            done
        - name: stage FHS package paths
          runs: |
            set -eux -o pipefail

            SRC=${target.dir}/opt/java/openjdk/17
            JVM_DIR=${target.dir}/usr/lib/jvm/sapmachine-17
            mkdir -p "${target.dir}/usr/lib/jvm"
            mv "$SRC" "$JVM_DIR"

            mkdir -p ${target.dir}/usr/bin
            find "$JVM_DIR/bin" -type f -executable -o -type l | while read -r file; do
              filename=$(basename "$file")
              ln -sf /usr/lib/jvm/sapmachine-17/bin/$filename ${target.dir}/usr/bin/$filename
            done
        - uses: dhi/build-pkg:0
          with:
            depends:
              - libc6
              - zlib1g
            description: SapMachine Java JDK
            files:
              - usr/lib/jvm
              - usr/bin
            formats:
              - deb
            license: GPL-2.0-only WITH Classpath-exception-2.0
            name: sapmachine-17-jdk
            rel: 0
            url: https://sapmachine.io/
            version: 17.0.20
      outputs:
        - source: ${target.dir}/usr/lib/jvm
          target: /usr/lib/jvm
          uid: 0
          gid: 0
        - source: ${target.dir}/usr/bin
          target: /usr/bin
          uid: 0
          gid: 0
    - name: sapmachine-17-jre
      contents:
        packages:
          - base-files
          - bash
          - coreutils
          - findutils
