          with:
            deps:
              - golang.org/x/net@v0.62.0
              - github.com/google/cel-go@v0.30.0
            download: true
        - name: merge workspace checksums
          runs: |
            set -eux -o pipefail

            go work edit -dropuse=./test/e2e
            cat $(find . -name go.sum -not -path './test/e2e/*') | sort -u > go.work.sum
