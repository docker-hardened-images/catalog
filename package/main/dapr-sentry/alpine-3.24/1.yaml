# syntax=dhi.io/build:2-alpine3.24

image: dhi.io/pkg-dapr-sentry
variant: runtime
tags:
  - 1.18.3-alpine3.24
  - 1.18.3-r2-alpine3.24
platforms:
  - linux/amd64
  - linux/arm64
dates:
  release: "2026-04-16"
vars:
  COMMIT_SHA: 2dcf2e3548faf3c740b3d29ee300e2132db65cff
  GOLANG_MAJOR_MINOR_VERSION: "1.26"
  GOLANG_VERSION: 1.26.8-r0
  REL: "2"
  SEMVER_MAJOR_MINOR_VERSION: "1.18"
  SEMVER_MAJOR_VERSION: "1"
  SEMVER_VERSION: 1.18.3
  VERSION: 1.18.3
contents:
  repositories:
    - https://dhi.io/apk/alpine/v3.24/main
    - https://dhi.io/apk/alpine/v3.23/main
    - https://dl-cdn.alpinelinux.org/alpine/v3.24/main
    - https://dl-cdn.alpinelinux.org/alpine/v3.24/community
  keyring:
    - https://dhi.io/keyring/dhi-apk@docker-0F81AD7700D99184.rsa.pub
  packages:
    - alpine-baselayout-data
  builds:
    - name: dapr-sentry
      work-dir: /go/src/github.com/dapr/dapr
      caches:
        - path: /go/pkg/mod
      contents:
        packages:
          - busybox
          - bash
          - ca-certificates-bundle
          - coreutils
          - findutils
          - mawk
          - sed
          - golang-1.26=1.26.8-r0
          - golang-1.26-oci-config=1.26.8-r0
        files:
          - url: git+https://github.com/dapr/dapr.git#v1.18.3
            checksum: 2dcf2e3548faf3c740b3d29ee300e2132db65cff
            path: /go/src/github.com/dapr/dapr
            spdx:
              name: dapr-sentry
              version: 1.18.3
              packages:
                - name: dapr-sentry
                  purl: pkg:golang/github.com/dapr/dapr@1.18.3
                  license: Apache-2.0
            uid: 0
            gid: 0
      pipeline:
        - name: update go dependencies
          uses: go/bump@v1
          with:
            deps:
              - github.com/go-jose/go-jose/v4@v4.1.4
              - go.opentelemetry.io/otel@v1.44.0
              - google.golang.org/grpc@v1.82.1
            download: true
        - name: test go dependencies
          runs: |
            set -eux -o pipefail

            unset OTEL_EXPORTER_OTLP_TRACES_ENDPOINT || true
            unset OTEL_EXPORTER_OTLP_TRACES_PROTOCOL || true

            export DAPR_HOST_IP="${DAPR_HOST_IP:-127.0.0.1}"

            go mod download

            CGO_ENABLED=0 go test -tags unit \
              $(go list -tags unit ./... \
                | grep -v 'github.com/dapr/dapr/tests/' \
                | grep -v 'github.com/dapr/dapr/pkg/actors/internal/placement/connector/dnslookup$')
        - name: build sentry
          uses: go/build@v1
          with:
            fips: false
            ldflags:
              - -X github.com/dapr/dapr/pkg/buildinfo.gitcommit=2dcf2e3548faf3c740b3d29ee300e2132db65cff
              - -X github.com/dapr/dapr/pkg/buildinfo.gitversion=1.18.3
              - -X github.com/dapr/dapr/pkg/buildinfo.version=1.18.3
            output: ${target.dir}/usr/bin/sentry
            packages: ./cmd/sentry
        - name: build sentry dev
          uses: go/build@v1
          with:
            fips: false
            ldflags:
              - -X github.com/dapr/dapr/pkg/buildinfo.gitcommit=2dcf2e3548faf3c740b3d29ee300e2132db65cff
              - -X github.com/dapr/dapr/pkg/buildinfo.gitversion=1.18.3
              - -X github.com/dapr/dapr/pkg/buildinfo.version=1.18.3
            output: ${target.dir}/usr/bin/sentry-dev
            packages: ./cmd/sentry
            strip: false
        - uses: dhi/build-pkg:0
          with:
            description: Dapr Sentry certificate authority
            files:
              - usr/bin/sentry
            license: Apache-2.0
            name: dapr-sentry
            rel: 2
            subpackages:
              - files:
                  - path: usr/bin/sentry
                    source: usr/bin/sentry-dev
                name: dapr-sentry-dev
            url: https://github.com/dapr/dapr
            version: 1.18.3
os-release:
  name: Docker Hardened Images (Alpine)
  id: alpine
  version-id: "3.24"
  pretty-name: Docker Hardened Images/Alpine Linux v3.24
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
