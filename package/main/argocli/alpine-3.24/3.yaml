# syntax=dhi.io/build:2-alpine3.24

image: dhi.io/pkg-argocli
variant: runtime
tags:
  - 3.7.18-alpine3.24
  - 3.7.18-r3-alpine3.24
platforms:
  - linux/amd64
  - linux/arm64
vars:
  COMMIT_SHA: 66e32e5cc367f223e2ecf4fbe852b95eaed83034
  GOLANG_MAJOR_MINOR_VERSION: "1.26"
  GOLANG_VERSION: 1.26.11-r0
  MODULE_MAJOR_VERSION: v3
  NODEJS_VERSION: 24.22.2-r0
  PACKAGE_NAME: argocli-3
  REL: "3"
  SEMVER_MAJOR_MINOR_VERSION: "3.7"
  SEMVER_MAJOR_VERSION: "3"
  SEMVER_VERSION: 3.7.18
  VERSION: 3.7.18
  YARN_VERSION: 1.22.22_git20260611-r1
contents:
  repositories:
    - https://dhi.io/apk/alpine/v3.24/main
    - https://dhi.io/apk/alpine/v3.23/main
    - https://dl-cdn.alpinelinux.org/alpine/v3.24/main
    - https://dl-cdn.alpinelinux.org/alpine/v3.24/community
  keyring:
    - https://dhi.io/keyring/dhi-apk@docker-0F81AD7700D99184.rsa.pub
  packages:
    - alpine-baselayout-data
  builds:
    - name: argocli-3
      work-dir: /go/src/github.com/argoproj/argo-workflows
      caches:
        - path: /go/pkg/mod
        - path: /root/.yarn
      contents:
        packages:
          - bash
          - busybox
          - ca-certificates-bundle
          - coreutils
          - findutils
          - git
          - golang-1.26=1.26.11-r0
          - golang-1.26-oci-config=1.26.11-r0
          - mawk
          - nodejs-24=24.22.2-r0
          - sed
          - yarn=1.22.22_git20260611-r1
        files:
          - url: git+https://github.com/argoproj/argo-workflows.git#v3.7.18
            checksum: 66e32e5cc367f223e2ecf4fbe852b95eaed83034
            path: /go/src/github.com/argoproj/argo-workflows
            spdx:
              name: argocli
              version: 3.7.18
              packages:
                - name: argocli
                  purl: pkg:golang/github.com/argoproj/argo-workflows@3.7.18
                  license: Apache-2.0
            uid: 0
            gid: 0
      pipeline:
        - name: patch (3 only)
          uses: go/bump@v2
          work-dir: /go/src/github.com/argoproj/argo-workflows
          with:
            deps:
              - golang.org/x/net@v0.60.0
              - github.com/cloudflare/circl@v1.6.3
              - github.com/expr-lang/expr@v1.17.7
              - github.com/go-git/go-git/v5@v5.19.2
              - github.com/go-jose/go-jose/v3@v3.0.5
              - github.com/go-jose/go-jose/v4@v4.1.6
              - github.com/jackc/pgx/v5@v5.9.2
              - github.com/klauspost/compress@v1.20.2
              - github.com/moby/spdystream@v0.5.1
              - go.opentelemetry.io/otel/sdk@v1.43.0
              - google.golang.org/grpc@v1.85.0-dev.0.20260825072537-93e31b48545e
              - go.opentelemetry.io/otel/exporters/otlp/otlpmetric/otlpmetrichttp@v1.43.0
            download: true
            tidy: true
        - name: populate module cache
          runs: |
            set -eux -o pipefail

            go mod download
        - name: test
          runs: |
            set -eux -o pipefail

            if [ "${target.fips}" = "true" ]; then
              export GODEBUG=fips140=on
            fi

            echo "Testing core functionality after patching..."

            go test -v -count=1 -timeout=3m ./workflow/validate -run="TestDAG"
            go test -v -count=1 -timeout=3m ./workflow/common

            UTIL_PACKAGES=$(go list ./util/... | grep -v './util/telemetry' | grep -v './util/sqldb')
            go test -v -count=1 -timeout=4m $UTIL_PACKAGES
        - name: build ui
          work-dir: /go/src/github.com/argoproj/argo-workflows/ui
          privileged: true
          runs: |
            set -eux -o pipefail

            export JOBS=max
            yarn install --network-timeout 1000000

            export YARN_CACHE_FOLDER=/root/.yarn
            export NODE_OPTIONS="--max-old-space-size=2048"
            yarn build
        - name: build
          uses: go/build@v1
          work-dir: /go/src/github.com/argoproj/argo-workflows
          with:
            fips: false
            ldflags:
              - -X github.com/argoproj/argo-workflows/v3.version=3.7.18
              - -X github.com/argoproj/argo-workflows/v3.gitCommit=66e32e5cc367f223e2ecf4fbe852b95eaed83034
            output: ${target.dir}/usr/bin/argo
            packages: ./cmd/argo
        - name: build dev
          uses: go/build@v1
          work-dir: /go/src/github.com/argoproj/argo-workflows
          with:
            fips: false
            ldflags:
              - -X github.com/argoproj/argo-workflows/v3.version=3.7.18
              - -X github.com/argoproj/argo-workflows/v3.gitCommit=66e32e5cc367f223e2ecf4fbe852b95eaed83034
            output: ${target.dir}/usr/bin/argo-dev
            packages: ./cmd/argo
            strip: false
        - name: stage sbom
          runs: |
            set -eux -o pipefail

            mkdir -p "${target.dir}/opt/docker/sbom"
            cp -a /opt/docker/sbom/argocli "${target.dir}/opt/docker/sbom/"
            test -s "${target.dir}/opt/docker/sbom/argocli/.spdx.argocli.json"
        - uses: dhi/build-pkg:0
          with:
            depends:
              - ca-certificates-bundle
            description: Argo Workflows CLI (argo)
            files:
              - usr/bin/argo
              - opt/docker/sbom/argocli
            license: Apache-2.0
            name: argocli-3
            rel: 3
            subpackages:
              - files:
                  - path: usr/bin/argo
                    source: usr/bin/argo-dev
                name: argocli-3-dev
            url: https://github.com/argoproj/argo-workflows
            version: 3.7.18
os-release:
  name: Docker Hardened Images (Alpine)
  id: alpine
  version-id: "3.24"
  pretty-name: Docker Hardened Images/Alpine Linux v3.24
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
