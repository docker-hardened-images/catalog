# syntax=dhi.io/build:2-alpine3.24

image: dhi.io/pkg-duckduckgo-mcp-server
variant: runtime
tags:
  - 0.6.1-alpine3.24
  - 0.6.1-r5-alpine3.24
platforms:
  - linux/amd64
  - linux/arm64
dates:
  release: "2026-07-28"
vars:
  COMMIT_SHA: ad2e681bfb4461c969d3032b47ac5b3cd513f0a9
  PYTHON_VERSION: 3.14.7-r0
  REL: "5"
  SEMVER_MAJOR_MINOR_VERSION: "0.6"
  SEMVER_MAJOR_VERSION: "0"
  SEMVER_VERSION: 0.6.1
  UV_ARCH: '#{ target.arch == "amd64" ? "x86_64-unknown-linux-musl" : "aarch64-unknown-linux-musl" }'
  UV_VERSION: 0.12.4
  VERSION: 0.6.1
contents:
  repositories:
    - https://dhi.io/apk/alpine/v3.24/main
    - https://dhi.io/apk/alpine/v3.23/main
    - https://dl-cdn.alpinelinux.org/alpine/v3.24/main
    - https://dl-cdn.alpinelinux.org/alpine/v3.24/community
  keyring:
    - https://dhi.io/keyring/dhi-apk@docker-0F81AD7700D99184.rsa.pub
  packages:
    - alpine-baselayout-data
  builds:
    - name: duckduckgo-mcp-server
      work-dir: ${source.dir}
      environment:
        UV_COMPILE_BYTECODE: "1"
      caches:
        - path: /root/.cache/uv
      contents:
        packages:
          - bash
          - build-base
          - ca-certificates-bundle
          - coreutils
          - findutils
          - git
          - libffi-dev
          - openssl-dev
          - python-3.14=3.14.7-r0
          - python-3.14-dev=3.14.7-r0
        files:
          - url: https://github.com/astral-sh/uv/releases/download/0.12.4/uv-${UV_ARCH}.tar.gz
            checksum: https://github.com/astral-sh/uv/releases/download/0.12.4/uv-${UV_ARCH}.tar.gz.sha256
            path: ${source.dir}/uv.tar.gz
            spdx:
              name: uv-binary
              version: 0.12.4
              packages:
                - name: uv
                  purl: pkg:github/astral-sh/uv@0.12.4
                  license: Apache-2.0
            uid: 0
            gid: 0
          - url: git+https://github.com/nickclyde/duckduckgo-mcp-server.git#v0.6.1
            checksum: ad2e681bfb4461c969d3032b47ac5b3cd513f0a9
            path: ${source.dir}/src
            spdx:
              name: duckduckgo-mcp-server
              version: 0.6.1
              packages:
                - name: duckduckgo-mcp-server
                  purl: pkg:github/nickclyde/duckduckgo-mcp-server@0.6.1
                  license: MIT
            uid: 0
            gid: 0
      pipeline:
        - name: setup uv
          runs: |
            set -eux -o pipefail

            mkdir -p /usr/local/bin
            tar -xzf "${source.dir}/uv.tar.gz" -C /usr/local/bin --strip-components=1
            chmod +x /usr/local/bin/uv
        - name: build venv at final path and stage it
          privileged: true
          runs: |
            set -eux -o pipefail

            export SOURCE_DIR="${source.dir}" TARGET_DIR="${target.dir}" PYTHON_BIN=/usr/bin/python3.14
            bash "${source.dir}/build-venv.sh"
        - uses: dhi/build-pkg:0
          with:
            depends:
              - python-3.14
            description: DuckDuckGo MCP server
            files:
              - usr/lib/duckduckgo-mcp-server
              - usr/bin/duckduckgo-mcp-server
            formats:
              - apk
            license: MIT
            name: duckduckgo-mcp-server
            rel: 5
            url: https://github.com/nickclyde/duckduckgo-mcp-server
            version: 0.6.1
      paths:
        - type: file
          path: ${source.dir}/build-venv.sh
          uid: 0
          gid: 0
          mode: "0755"
          source: package/main/duckduckgo-mcp-server/build-venv.sh
os-release:
  name: Docker Hardened Images (Alpine)
  id: alpine
  version-id: "3.24"
  pretty-name: Docker Hardened Images/Alpine Linux v3.24
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
