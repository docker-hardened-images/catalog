# syntax=dhi.io/build:2-debian13

image: dhi.io/pkg-duckduckgo-mcp-server
variant: runtime
tags:
  - 0.6.1
  - 0.6.1-r5
  - 0.6.1-debian13
  - 0.6.1-r5-debian13
platforms:
  - linux/amd64
  - linux/arm64
dates:
  release: "2026-07-28"
vars:
  COMMIT_SHA: ad2e681bfb4461c969d3032b47ac5b3cd513f0a9
  PYTHON_MINOR: "3.14"
  PYTHON_VERSION: 3.14.7-0
  REL: "5"
  SEMVER_MAJOR_MINOR_VERSION: "0.6"
  SEMVER_MAJOR_VERSION: "0"
  SEMVER_VERSION: 0.6.1
  UV_ARCH: '#{ target.arch == "amd64" ? "x86_64-unknown-linux-gnu" : "aarch64-unknown-linux-gnu" }'
  UV_VERSION: 0.12.4
  VERSION: 0.6.1
contents:
  packages:
    - base-files
  builds:
    - name: duckduckgo-mcp-server
      work-dir: ${source.dir}
      environment:
        UV_COMPILE_BYTECODE: "1"
      caches:
        - path: /root/.cache/uv
      contents:
        repositories:
          - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
        keyring:
          - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
        packages:
          - bash
          - ca-certificates
          - coreutils
          - findutils
          - git
          - gzip
          - sed
          - tar
          - libpython-3.14=3.14.7-0
          - libpython-3.14-minimal=3.14.7-0
          - libpython-3.14-stdlib=3.14.7-0
          - python-3.14-minimal=3.14.7-0
          - python-3.14=3.14.7-0
          - python-3.14-dev=3.14.7-0
        files:
          - url: https://github.com/astral-sh/uv/releases/download/0.12.4/uv-${UV_ARCH}.tar.gz
            checksum: https://github.com/astral-sh/uv/releases/download/0.12.4/uv-${UV_ARCH}.tar.gz.sha256
            path: ${source.dir}/uv.tar.gz
            spdx:
              name: uv-binary
              version: 0.12.4
              packages:
                - name: uv
                  purl: pkg:github/astral-sh/uv@0.12.4
                  license: Apache-2.0
            uid: 0
            gid: 0
          - url: git+https://github.com/nickclyde/duckduckgo-mcp-server.git#v0.6.1
            checksum: ad2e681bfb4461c969d3032b47ac5b3cd513f0a9
            path: ${source.dir}/src
            spdx:
              name: duckduckgo-mcp-server
              version: 0.6.1
              packages:
                - name: duckduckgo-mcp-server
                  purl: pkg:github/nickclyde/duckduckgo-mcp-server@0.6.1
                  license: MIT
            uid: 0
            gid: 0
      pipeline:
        - name: setup uv
          runs: |
            set -eux -o pipefail

            mkdir -p /usr/local/bin
            tar -xzf "${source.dir}/uv.tar.gz" -C /usr/local/bin --strip-components=1
            chmod +x /usr/local/bin/uv
        - name: build venv at final path and stage it
          privileged: true
          runs: |
            set -eux -o pipefail

            export SOURCE_DIR="${source.dir}" TARGET_DIR="${target.dir}" PYTHON_BIN=/usr/bin/python3.14
            bash "${source.dir}/build-venv.sh"
        - uses: dhi/build-pkg:0
          with:
            depends:
              - python-3.14
            description: DuckDuckGo MCP server
            files:
              - usr/lib/duckduckgo-mcp-server
              - usr/bin/duckduckgo-mcp-server
            formats:
              - deb
            license: MIT
            name: duckduckgo-mcp-server
            rel: 5
            url: https://github.com/nickclyde/duckduckgo-mcp-server
            version: 0.6.1
      paths:
        - type: file
          path: ${source.dir}/build-venv.sh
          uid: 0
          gid: 0
          mode: "0755"
          source: package/main/duckduckgo-mcp-server/build-venv.sh
os-release:
  name: Docker Hardened Images (Debian)
  id: debian
  version-id: "13"
  version-codename: trixie
  pretty-name: Docker Hardened Images/Debian GNU/Linux 13 (trixie)
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
