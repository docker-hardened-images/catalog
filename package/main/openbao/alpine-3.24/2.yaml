# syntax=dhi.io/build:2-alpine3.24

image: dhi.io/pkg-openbao
variant: runtime
tags:
  - 2.7.2-alpine3.24
  - 2.7.2-r2-alpine3.24
platforms:
  - linux/amd64
  - linux/arm64
dates:
  release: "2026-02-05"
vars:
  COMMIT_SHA: 9e0a0d3c3504a0a00b45e61355afac5e35c78379
  GOLANG_MAJOR_MINOR_VERSION: "1.27"
  GOLANG_VERSION: 1.27.4-r0
  REL: "2"
  SEMVER_MAJOR_MINOR_VERSION: "2.7"
  SEMVER_MAJOR_VERSION: "2"
  SEMVER_VERSION: 2.7.2
  VERSION: 2.7.2
contents:
  repositories:
    - https://dhi.io/apk/alpine/v3.24/main
    - https://dhi.io/apk/alpine/v3.23/main
    - https://dl-cdn.alpinelinux.org/alpine/v3.24/main
    - https://dl-cdn.alpinelinux.org/alpine/v3.24/community
  keyring:
    - https://dhi.io/keyring/dhi-apk@docker-0F81AD7700D99184.rsa.pub
  packages:
    - alpine-baselayout-data
  builds:
    - name: openbao
      work-dir: /go/src/github.com/openbao/openbao
      contents:
        packages:
          - busybox
          - bash
          - ca-certificates-bundle
          - make
          - golang-1.27=1.27.4-r0
          - golang-1.27-oci-config=1.27.4-r0
        files:
          - url: git+https://github.com/openbao/openbao.git#v2.7.2
            checksum: 9e0a0d3c3504a0a00b45e61355afac5e35c78379
            path: /go/src/github.com/openbao/openbao
            spdx:
              name: openbao
              version: 2.7.2
              packages:
                - name: openbao
                  purl: pkg:golang/openbao/openbao@2.7.2
                  license: MPL-2.0
            uid: 0
            gid: 0
      pipeline:
        - name: go dependencies
          uses: go/bump@v1
          with:
            deps:
              - golang.org/x/net@v0.62.0
              - github.com/Azure/go-ntlmssp@v0.1.1
              - github.com/cloudflare/circl@v1.6.3
              - github.com/go-jose/go-jose/v3@v3.0.6-0.20261030183946-0e502b87c7aa
              - github.com/go-jose/go-jose/v4@v4.1.6
              - github.com/moby/go-archive@v0.3.0
              - go.opentelemetry.io/otel/sdk@v1.45.0
              - google.golang.org/grpc@v1.83.2
            download: true
        - uses: go/hermetic@v1
        - name: grab static files
          runs: |
            set -eux -o pipefail

            cp /go/src/github.com/openbao/openbao/LICENSE "${target.dir}/LICENSE"
        - name: generate
          runs: |
            set -eux -o pipefail

            go generate ./...
        - name: bootstrap
          privileged: true
          runs: |
            set -eux -o pipefail

            for attempt in 1 2 3; do
              if make bootstrap; then
                break
              elif [ "$attempt" -eq 3 ]; then
                echo "Bootstrap failed after 3 attempts" >&2
                exit 1
              else
                echo "Bootstrap attempt $attempt failed, retrying..." >&2
                sleep 5
              fi
            done
        - name: build
          uses: go/build@v1
          environment:
            GOFLAGS: -buildvcs=false
          with:
            fips: false
            ldflags:
              - -X github.com/openbao/openbao/v2/internal/version.fullVersion=2.7.2
              - -X github.com/openbao/openbao/v2/internal/version.GitCommit=9e0a0d3c3504a0a00b45e61355afac5e35c78379
              - -X github.com/openbao/openbao/v2/internal/version.CommitDate=$(date -u -d @${SOURCE_DATE_EPOCH} +'%FT%TZ')
            output: ${target.dir}/usr/bin/bao
        - name: build dev
          uses: go/build@v1
          work-dir: /go/src/github.com/openbao/openbao
          with:
            fips: false
            ldflags:
              - -X github.com/openbao/openbao/v2/internal/version.fullVersion=2.7.2
              - -X github.com/openbao/openbao/v2/internal/version.GitCommit=9e0a0d3c3504a0a00b45e61355afac5e35c78379
              - -X github.com/openbao/openbao/v2/internal/version.CommitDate=$(date -u -d @${SOURCE_DATE_EPOCH} +'%FT%TZ')
            output: ${target.dir}/usr/bin/bao-dev
            packages: .
            strip: false
        - uses: dhi/build-pkg:0
          with:
            description: Openbao
            files:
              - usr/bin/bao
            license: MPL-2.0
            name: bao
            rel: 2
            subpackages:
              - files:
                  - path: usr/bin/bao
                    source: usr/bin/bao-dev
                name: bao-dev
            url: https://github.com/openbao/openbao
            version: 2.7.2
os-release:
  name: Docker Hardened Images (Alpine)
  id: alpine
  version-id: "3.24"
  pretty-name: Docker Hardened Images/Alpine Linux v3.24
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
