# syntax=dhi.io/build:2-debian13

image: dhi.io/pkg-influxdb
variant: runtime
tags:
  - 2.10.1
  - 2.10.1-r0
  - 2.10.1-debian13
  - 2.10.1-r0-debian13
platforms:
  - linux/amd64
  - linux/arm64
dates:
  release: "2020-11-09"
vars:
  CARGO_VERSION: 1.97.1-0
  COMMIT_SHA: db5102ec64d5dd3dfa87208edb054eb0721c36c9
  COREPACK_VERSION: 0.36.0-0
  GO_TAGS: libsqlite3,sqlite_foreign_keys,sqlite_json,assets,noasm
  GOLANG_VERSION: 1.26.11-18
  NODEJS_VERSION: 24.22.3-0
  NPM_VERSION: 11.21.2-1
  OPENAPI_COMMIT_SHA: 8b5f1bbb2cd388eb454dc9da19e3d2c4061cdf5f
  PACKAGE_NAME: influxdb-2
  PROTOC_GEN_GO_VERSION: v1.36.5
  REL: "0"
  RUSTC_VERSION: 1.97.1-0
  SEMVER_MAJOR_MINOR_VERSION: "2.10"
  SEMVER_MAJOR_VERSION: "2"
  SEMVER_VERSION: 2.10.1
  UI_COMMIT_SHA: fdb6b600f5daa380b268276f72301dfdb4a6027a
  UI_VERSION: 2.10.0
  VERSION: 2.10.1
  YARN_VERSION: 1.22.22-1
contents:
  repositories:
    - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
  keyring:
    - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
  packages:
    - base-files
  builds:
    - name: influxdb
      environment:
        GOBIN: /go/bin
        GODEBUG: tarinsecurepath=0,zipinsecurepath=0
        GOPATH: /go
        PATH: /go/bin:/usr/lib/go/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
      caches:
        - path: /root/.cargo
        - path: /go/pkg/mod
      contents:
        packages:
          - base-files
          - bash
          - binutils
          - build-essential
          - ca-certificates
          - ca-certificates-bundle
          - cargo-1.97=1.97.1-0
          - coreutils
          - findutils
          - git
          - golang-1.26=1.26.11-18
          - libc-bin
          - libc6
          - libcurl4t64
          - libgcc-s1
          - libprotobuf-dev
          - libsqlite3-0
          - libsqlite3-dev
          - libssl3t64
          - mawk
          - node-corepack=0.36.0-0
          - nodejs-24=24.22.3-0
          - npm=11.21.2-1
          - pkg-config
          - protobuf-compiler
          - rustc-1.97=1.97.1-0
          - sed
          - yarn-classic=1.22.22-1
          - zlib1g
        files:
          - url: https://raw.githubusercontent.com/influxdata/openapi/8b5f1bbb2cd388eb454dc9da19e3d2c4061cdf5f/contracts/oss.json
            path: ${source.dir}/swagger.json
            uid: 0
            gid: 0
          - url: git+https://github.com/influxdata/ui.git#OSS-v2.10.0
            checksum: fdb6b600f5daa380b268276f72301dfdb4a6027a
            path: ${source.dir}/ui
            uid: 0
            gid: 0
          - url: git+https://github.com/influxdata/influxdb.git#v2.10.1
            checksum: db5102ec64d5dd3dfa87208edb054eb0721c36c9
            path: /go/src/github.com/influxdata/influxdb
            spdx:
              name: influxdb
              version: 2.10.1
              packages:
                - name: influxdb
                  purl: pkg:golang/github.com/influxdata/influxdb@2.10.1
                  license: MIT
            uid: 0
            gid: 0
      pipeline:
        - name: build ui
          work-dir: ${source.dir}/ui
          privileged: true
          runs: |
            set -eux -o pipefail

            export CYPRESS_INSTALL_BINARY=0
            yarn install --network-timeout 1000000
            export NODE_OPTIONS="--max-old-space-size=2048"
            yarn build:ci
        - name: place ui into go source for embedding
          work-dir: ${source.dir}/ui
          runs: |
            set -eux -o pipefail

            mkdir -p /go/src/github.com/influxdata/influxdb/static/data
            cp -r build /go/src/github.com/influxdata/influxdb/static/data/build
        - name: place openapi into go source for embedding
          runs: |
            set -eux -o pipefail

            cp ${source.dir}/swagger.json /go/src/github.com/influxdata/influxdb/static/data/
        - name: generate embedded ui and openapi
          work-dir: /go/src/github.com/influxdata/influxdb
          privileged: true
          runs: |
            set -eux -o pipefail

            go generate --tags libsqlite3,sqlite_foreign_keys,sqlite_json,assets,noasm ./static
        - name: go generate
          work-dir: /go/src/github.com/influxdata/influxdb
          privileged: true
          runs: |
            set -eux -o pipefail

            go install "google.golang.org/protobuf/cmd/protoc-gen-go@v1.36.5"
            go install github.com/benbjohnson/tmpl
            go install golang.org/x/tools/cmd/stringer
            go install golang.org/x/tools/cmd/goimports
            go install github.com/influxdata/pkg-config

            go generate --tags libsqlite3,sqlite_foreign_keys,sqlite_json,assets,noasm ./influxql/... ./models/... ./pkg/... ./storage/... ./tsdb/... ./v1/...
        - name: update go dependencies
          uses: go/bump@v1
          work-dir: /go/src/github.com/influxdata/influxdb
          with:
            deps:
              - golang.org/x/crypto@v0.58.0
              - golang.org/x/net@v0.62.0
              - github.com/aws/aws-sdk-go-v2/aws/protocol/eventstream@v1.7.8
              - github.com/aws/aws-sdk-go-v2/service/s3@v1.97.3
              - github.com/buger/jsonparser@v1.1.2
              - github.com/eclipse/paho.mqtt.golang@v1.5.1
              - github.com/go-jose/go-jose/v4@v4.1.6
              - github.com/hashicorp/go-retryablehttp@v0.7.7
              - github.com/hashicorp/vault/api@v1.9.2
              - github.com/klauspost/compress@v1.20.2
              - go.opentelemetry.io/otel/sdk@v1.47.0
              - go.opentelemetry.io/otel/trace@v1.47.0
              - google.golang.org/grpc@v1.83.2
            download: true
        - name: patch session store test expiry window
          uses: patch@v1
          work-dir: /go/src/github.com/influxdata/influxdb
          with:
            options: -p1
            patches:
              - ${source.dir}/patch/session-store-test-expiry.patch
        - name: test
          work-dir: /go/src/github.com/influxdata/influxdb
          privileged: true
          runs: |
            set -eux -o pipefail

            export CARGO=${source.dir}/helpers/bin/cargo-wrapper.sh

            go test -vet=off --tags libsqlite3,sqlite_foreign_keys,sqlite_json,assets,noasm ./... -skip 'TestService/DryRun_-_stack/file_URL//dev/core|TestService/DryRun_-_stack/file_URL//sys/kernel/vmcoreinfo'
        - name: build
          uses: go/build@v1
          work-dir: /go/src/github.com/influxdata/influxdb
          with:
            cgo_enabled: 1
            extra-env: CARGO=${source.dir}/helpers/bin/cargo-wrapper.sh PKG_CONFIG=/go/bin/pkg-config
            ldflags:
              - -X main.commit=db5102ec64d5dd3dfa87208edb054eb0721c36c9
              - -X main.version=v2.10.1
              - -X main.date=$(date -u -d @${SOURCE_DATE_EPOCH} +'%FT%TZ')
            output: ${target.dir}/usr/bin/influxd
            packages: ./cmd/influxd
            tags: libsqlite3,sqlite_foreign_keys,sqlite_json,assets,noasm
        - name: build dev
          uses: go/build@v1
          work-dir: /go/src/github.com/influxdata/influxdb
          with:
            cgo_enabled: 1
            extra-env: CARGO=${source.dir}/helpers/bin/cargo-wrapper.sh PKG_CONFIG=/go/bin/pkg-config
            ldflags:
              - -X main.commit=db5102ec64d5dd3dfa87208edb054eb0721c36c9
              - -X main.version=v2.10.1
              - -X main.date=$(date -u -d @${SOURCE_DATE_EPOCH} +'%FT%TZ')
            output: ${target.dir}/usr/bin/influxd-dev
            packages: ./cmd/influxd
            strip: false
            tags: libsqlite3,sqlite_foreign_keys,sqlite_json,assets,noasm
        - name: stage sbom
          runs: |
            set -eux -o pipefail

            test -d /opt/docker/sbom/influxdb
            install -d "${target.dir}/opt/docker/sbom"
            cp -a /opt/docker/sbom/influxdb "${target.dir}/opt/docker/sbom/"
        - uses: dhi/build-pkg:0
          with:
            depends:
              - libc6
              - libgcc-s1
              - libsqlite3-0
            description: Scalable datastore for metrics, events, and real-time analytics
            files:
              - usr/bin/influxd
              - opt/docker/sbom/influxdb
            formats:
              - deb
            license: MIT
            name: influxdb-2
            rel: 0
            subpackages:
              - depends:
                  - libc6
                  - libgcc-s1
                  - libsqlite3-0
                files:
                  - path: usr/bin/influxd
                    source: usr/bin/influxd-dev
                name: influxdb-2-dev
            url: https://github.com/influxdata/influxdb
            version: 2.10.1
      paths:
        - type: file
          path: ${source.dir}/patch/session-store-test-expiry.patch
          uid: 0
          gid: 0
          source: package/main/influxdb/patch/session-store-test-expiry.patch
        - type: file
          path: ${source.dir}/helpers/bin/cargo-wrapper.sh
          uid: 0
          gid: 0
          mode: "0755"
          source: package/main/influxdb/bin/cargo-wrapper.sh
os-release:
  name: Docker Hardened Images (Debian)
  id: debian
  version-id: "13"
  version-codename: trixie
  pretty-name: Docker Hardened Images/Debian GNU/Linux 13 (trixie)
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
