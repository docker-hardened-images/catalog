  - linux/arm64
vars:
  BINARYEN_VERSION: 120-4
  BPF_ARCH: '#{ target.arch == "amd64" ? "x86" : "arm64" }'
  CARGO_UPDATES: pkg-config=0.3.31 rustls=0.23.45 time=0.3.47 tracing-subscriber=0.3.20 rand=0.8.6 keccak=0.1.6
  CARGO_VERSION: 1.97.1-0
  COMMIT_SHA: f11aeb122c9351028dd6e8c06b48094ab0dc91ee
  GOLANG_VERSION: 1.26.8-1
  KUBECTL_VERSION: v1.35.1
  LLVM_VERSION: 1:19.1.7-3+b1
  NODEJS_VERSION: 24.21.0-1
  PACKAGE_NAME: teleport-17
  PNPM_VERSION: 11.20.0
  RDP_CRATES: -p rdp-client
  REL: "5"
  RUST_STD_WASM32_CHECKSUM: sha256:fa0edb6e9f34faae5735554d62d50875eded839dc707d0f1c01467a918d8453b
  RUST_STD_WASM32_VERSION: 1.97.1
  RUST_TARGET: '#{ target.arch == "amd64" ? "x86_64-unknown-linux-gnu" : "aarch64-unknown-linux-gnu" }'
  RUSTC_VERSION: 1.97.1-0
  SEMVER_MAJOR_MINOR_VERSION: "17.7"
  SEMVER_MAJOR_VERSION: "17"
  SEMVER_VERSION: 17.7.29
  SOURCE_CHECKSUM: sha256:f7fc99844ab18747e14f82d5bf6ee285f69cdef1487672638eef234b3f50e7e9
  TELEPORT_MINOR: "7"
  TELEPORT_PATCH: "29"
  TELEPORT_TAGS: webassets_embed,pam,bpf,desktop_access_rdp,piv,kustomize_disable_go_plugin_support
  TSH_TAGS: libfido2,piv,kustomize_disable_go_plugin_support
  VERSION: 17.7.29
  WASM_BINDGEN_CHECKSUM: '#{ target.arch == "amd64" ? "sha256:9b968263a372a6708bb5a7784053ea1b86aa9e93d17ec4d9b1dff9fc996bc53d" : "sha256:78c8a6100d1bc26f5a7ccc64f0c2ce22d6ed69d5aab97584b57b264a9498ccd4" }'
  WASM_BINDGEN_CHECKSUM_AMD64: sha256:9b968263a372a6708bb5a7784053ea1b86aa9e93d17ec4d9b1dff9fc996bc53d
  WASM_BINDGEN_CHECKSUM_ARM64: sha256:78c8a6100d1bc26f5a7ccc64f0c2ce22d6ed69d5aab97584b57b264a9498ccd4
  WASM_BINDGEN_TRIPLE: '#{ target.arch == "amd64" ? "x86_64-unknown-linux-musl" : "aarch64-unknown-linux-gnu" }'
  WASM_BINDGEN_VERSION: 0.2.95
contents:
  repositories:
    - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
  keyring:
    - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
  packages:
    - base-files
  builds:
    - name: teleport-17
      work-dir: /go/src/github.com/gravitational/teleport
      caches:
        - path: /root/.cargo/registry
        - path: /root/.cache/pnpm
      contents:
        packages:
          - bash
          - binaryen=120-4
          - build-essential
          - ca-certificates-bundle
          - cargo-1.97=1.97.1-0
          - clang
          - clang-19=1:19.1.7-3+b1
          - coreutils
          - findutils
          - gcc
          - golang-1.26=1.26.8-1
          - golang-1.26-oci-config=1.26.8-1
          - gzip
          - libbpf-dev
          - libc6-dev
          - libcbor-dev
          - libclang-common-19-dev
          - libclang-cpp19
          - libclang1-19
          - libcurl4t64
          - libelf-dev
          - libfido2-dev
          - libgcc-14-dev
          - libllvm19
          - libobjc-14-dev
          - libpam0g-dev
          - libpcsclite-dev
          - libpfm4
          - libsqlite3-0
          - libssl3t64
          - libstdc++-14-dev
          - libstdc++6
          - libudev-dev
          - libz3-4
          - libzstd1
          - lld
          - lld-19=1:19.1.7-3+b1
          - llvm
          - llvm-19=1:19.1.7-3+b1
          - llvm-19-linker-tools
          - llvm-19-runtime
          - mawk
          - node-corepack
          - nodejs-24=24.21.0-1
          - pkg-config
          - rustc-1.97=1.97.1-0
          - sed
          - tar
          - xz-utils
          - yq
          - zlib1g
          - zlib1g-dev
        files:
          - url: https://github.com/gravitational/teleport/archive/refs/tags/v17.7.29.tar.gz
            checksum: sha256:f7fc99844ab18747e14f82d5bf6ee285f69cdef1487672638eef234b3f50e7e9
            path: ${source.dir}/teleport-17.7.29.tar.gz
            spdx:
              name: teleport
              version: 17.7.29
              packages:
                - name: teleport
                  purl: pkg:golang/github.com/gravitational/teleport@17.7.29
                  license: AGPL-3.0-only
            uid: 0
            gid: 0
          - url: https://static.rust-lang.org/dist/rust-std-1.97.1-wasm32-unknown-unknown.tar.xz
            checksum: sha256:fa0edb6e9f34faae5735554d62d50875eded839dc707d0f1c01467a918d8453b
            path: ${source.dir}/rust-std-wasm32.tar.xz
            uid: 0
            gid: 0
          - url: https://github.com/wasm-bindgen/wasm-bindgen/releases/download/0.2.95/wasm-bindgen-0.2.95-${WASM_BINDGEN_TRIPLE}.tar.gz
            checksum: ${WASM_BINDGEN_CHECKSUM}
            path: ${source.dir}/wasm-bindgen.tar.gz
            spdx:
              name: wasm-bindgen-cli
              version: 0.2.95
              packages:
                - name: wasm-bindgen-cli
                  purl: pkg:cargo/wasm-bindgen-cli@0.2.95
                  license: MIT OR Apache-2.0
            uid: 0
            gid: 0
      pipeline:
        - name: unpack source
          runs: |
            set -eux -o pipefail

            mkdir -p /go/src/github.com/gravitational/teleport
            tar -xzf "${source.dir}/teleport-17.7.29.tar.gz" --strip-components=1 \
              -C /go/src/github.com/gravitational/teleport
        - name: update go dependencies
          uses: go/bump@v2
          with:
            deps:
              - golang.org/x/crypto@v0.56.0
              - golang.org/x/image@v0.45.0
              - golang.org/x/mod@v0.40.0
              - google.golang.org/grpc@v1.83.2
              - go.etcd.io/etcd/client/pkg/v3@v3.6.14
        - name: update containerd and otel
          uses: go/bump@v2
          with:
            deps:
              - github.com/containerd/containerd@v1.7.36
              - github.com/sirupsen/logrus@v1.9.4
              - go.opentelemetry.io/otel/sdk@v1.46.0
              - go.opentelemetry.io/otel/exporters/otlp/otlptrace@v1.46.0
              - go.opentelemetry.io/otel/exporters/otlp/otlptrace/otlptracegrpc@v1.46.0
              - go.opentelemetry.io/otel/exporters/otlp/otlptrace/otlptracehttp@v1.46.0
              - github.com/go-openapi/swag/pools@v0.28.0
              - github.com/cilium/ebpf@v0.16.0
              - google.golang.org/grpc@v1.83.2
            downgrade: true
        - uses: go/hermetic@v1
        - name: stamp version
          runs: |
            set -eux -o pipefail

            short_sha=$(printf '%.8s' "f11aeb122c9351028dd6e8c06b48094ab0dc91ee")
            cat > api/version.go << EOF
            // Code generated by "make version". DO NOT EDIT.

            package api

            const Version = "17.7.29"
            const VersionMajor = 17
            const VersionMinor = 7
            const VersionPatch = 29
            const VersionPreRelease = ""
            const VersionMetadata = ""
            EOF
            cat > gitref.go << EOF
            // Code generated by "make version". DO NOT EDIT.

            package teleport

            func init() { Gitref = "v17.7.29-0-g${short_sha}" }
            EOF
            gofmt -l api/version.go gitref.go
        - name: install wasm toolchain
          runs: |
            set -eux -o pipefail

            tar -xJf "${source.dir}/rust-std-wasm32.tar.xz" -C "${source.dir}"
            "${source.dir}/rust-std-1.97.1-wasm32-unknown-unknown/install.sh" \
              --prefix=/usr --disable-ldconfig
            tar -xzf "${source.dir}/wasm-bindgen.tar.gz" -C "${source.dir}"
            install -D -m 0755 "${source.dir}"/wasm-bindgen-*/wasm-bindgen /usr/local/bin/wasm-bindgen
            rustc --print target-list | grep -x wasm32-unknown-unknown
            wasm-bindgen --version
            wasm-opt --version
        - name: bump cargo dependencies
          privileged: true
          runs: |
            set -eux -o pipefail

            for spec in pkg-config=0.3.31 rustls=0.23.45 time=0.3.47 tracing-subscriber=0.3.20 rand=0.8.6 keccak=0.1.6; do
              cargo update -p "${spec%=*}" --precise "${spec#*=}"
            done
            grep -A1 'name = "rustls-webpki"' Cargo.lock
        - name: build rust components
          privileged: true
          runs: |
            set -eux -o pipefail

            cargo build -p rdp-client --release --locked --target "${RUST_TARGET}"
            RUSTFLAGS='--cfg getrandom_backend="wasm_js" -C linker=wasm-ld' \
              cargo build --package ironrdp --lib --target wasm32-unknown-unknown --release
            wasm-opt target/wasm32-unknown-unknown/release/ironrdp.wasm \
              -o target/wasm32-unknown-unknown/release/ironrdp.wasm -O
            wasm-bindgen target/wasm32-unknown-unknown/release/ironrdp.wasm \
              --out-dir web/packages/shared/libs/ironrdp/pkg --typescript --target web
            cat > web/packages/shared/libs/ironrdp/pkg/package.json << 'EOF'
            {
              "name": "ironrdp",
              "version": "0.1.0",
              "module": "ironrdp.js",
              "types": "ironrdp.d.ts",
              "files": ["ironrdp_bg.wasm","ironrdp.js","ironrdp.d.ts"],
              "sideEffects": ["./snippets/*"]
            }
            EOF
            (cd tool/fdpass-teleport && VERSION="17.7.29" cargo build --release --locked --target "${RUST_TARGET}")
            install -D -m 0755 "tool/fdpass-teleport/target/${RUST_TARGET}/release/fdpass-teleport" \
              "${target.dir}/usr/bin/fdpass-teleport"
        - name: rust sbom
          uses: sbom@v1
          with:
            extra-scanners: rust-cargo-lock-cataloger
            prefix: teleport-cargo
            source: /go/src/github.com/gravitational/teleport
        - name: tsh rust sbom
          uses: sbom@v1
          with:
            extra-scanners: rust-cargo-lock-cataloger
            prefix: tsh-cargo
            source: /go/src/github.com/gravitational/teleport
        - name: fdpass-teleport rust sbom
          uses: sbom@v1
          with:
            extra-scanners: rust-cargo-lock-cataloger
            prefix: fdpass-teleport-cargo
            source: /go/src/github.com/gravitational/teleport/tool/fdpass-teleport
        - name: build web ui
          privileged: true
          runs: |
            set -eux -o pipefail

            export COREPACK_ENABLE_DOWNLOAD_PROMPT=0
            export COREPACK_ENABLE_STRICT=0
            corepack enable pnpm
            corepack prepare "pnpm@11.20.0" --activate
            cp web/packages/design/src/assets/images/agpl-light.svg web/packages/teleport/public/app/logo-light.svg
            cp web/packages/design/src/assets/images/agpl-dark.svg web/packages/teleport/public/app/logo-dark.svg
            yq -Y -i '.overrides."fast-uri@>=3.0.0 <3.1.8" = "3.1.8"' pnpm-workspace.yaml
            yq -Y -i '.overrides."browserslist@<4.28.7" = "4.28.7"' pnpm-workspace.yaml
            yq -Y -i '.overrides."js-yaml@>=3.0.0 <3.15.2" = "3.15.2"' pnpm-workspace.yaml
            yq -Y -i '.overrides."nanoid@<3.3.18" = "3.3.18"' pnpm-workspace.yaml
            yq -Y -i '.overrides."vite@>=6.0.0 <6.4.3" = "6.4.3"' pnpm-workspace.yaml
            yq -Y -i '.overrides."@grpc/grpc-js@>=1.11.0 <1.13.6" = "1.13.6"' pnpm-workspace.yaml
            yq -Y -i '.overrides."@grpc/grpc-js@>=1.14.0 <1.14.5" = "1.14.5"' pnpm-workspace.yaml
            yq -Y -i '.overrides."ws@>=8.0.0 <8.21.0" = "8.21.0"' pnpm-workspace.yaml
            yq -Y -i '.overrides."@babel/core@<7.29.6" = "7.29.6"' pnpm-workspace.yaml
            yq -Y -i '.overrides."undici@>=7.0.0 <7.29.1" = "7.29.1"' pnpm-workspace.yaml
            yq -Y -i '.overrides."brace-expansion@<1.1.21" = "1.1.21"' pnpm-workspace.yaml
            pnpm install --lockfile-only --ignore-scripts
            pnpm install --frozen-lockfile --ignore-scripts
            pnpm --filter=@gravitational/teleport exec vite build
            test -f webassets/teleport/index.html
        - name: prepare web ui deps for sbom
          privileged: true
          runs: |
            set -eux -o pipefail

            rm -rf node_modules web/packages/*/node_modules
            pnpm install --frozen-lockfile --ignore-scripts --prod --filter "@gravitational/teleport..."
            find node_modules -type d \( -path '*/node_modules/@esbuild' -o -path '*/node_modules/@typescript/typescript-*' \) \
              -prune -exec rm -rf {} +
        - name: web ui sbom
          uses: sbom@v1
          with:
            extra-scanners: javascript-package-cataloger
            prefix: teleport-web
            source: /go/src/github.com/gravitational/teleport/node_modules
        - name: build bpf bytecode
          runs: |
            set -eux -o pipefail

            mkdir -p lib/bpf/bytecode
            sys_includes=$(clang -v -E - < /dev/null 2>&1 \
              | sed -n '/<...> search starts here:/,/End of search list./{ s| \(/.*\)|-idirafter \1|p }')
            for prog in command disk network counter_test; do
              clang -g -O2 -target bpf "-D__TARGET_ARCH_${BPF_ARCH}" ${sys_includes} \
                -c "bpf/enhancedrecording/${prog}.bpf.c" -o "lib/bpf/bytecode/${prog}.bpf.o"
              llvm-strip -g "lib/bpf/bytecode/${prog}.bpf.o"
            done
        - name: test
          runs: |
            set -eux -o pipefail

            CGO_ENABLED=1 go test -tags pam,libfido2,piv ./lib/utils/... ./lib/tlsca/... \
              $(go list ./lib/sshutils/... | grep -v /lib/sshutils/scp)
        - name: build teleport
          uses: go/build@v1
          with:
            cgo_enabled: 1
            extra-env: CGO_LDFLAGS="-lbpf -lelf -lz"
            fips: false
            ldflags:
              - -X k8s.io/component-base/version.gitVersion=v1.35.1
            output: ${target.dir}/usr/bin/teleport
            packages: ./tool/teleport
            strip: true
            tags: webassets_embed,pam,bpf,desktop_access_rdp,piv,kustomize_disable_go_plugin_support
        - name: build teleport dev
          uses: go/build@v1
          with:
            cgo_enabled: 1
            extra-env: CGO_LDFLAGS="-lbpf -lelf -lz"
            fips: false
            ldflags:
              - -X k8s.io/component-base/version.gitVersion=v1.35.1
            output: ${target.dir}/usr/bin/teleport-dev
            packages: ./tool/teleport
            strip: false
            tags: webassets_embed,pam,bpf,desktop_access_rdp,piv,kustomize_disable_go_plugin_support
        - name: build tctl
          uses: go/build@v1
          with:
            cgo_enabled: 1
            fips: false
            ldflags:
              - -X k8s.io/component-base/version.gitVersion=v1.35.1
            output: ${target.dir}/usr/bin/tctl
            packages: ./tool/tctl
            strip: true
            tags: pam,libfido2,piv,kustomize_disable_go_plugin_support
        - name: build tctl dev
          uses: go/build@v1
          with:
            cgo_enabled: 1
            fips: false
            ldflags:
              - -X k8s.io/component-base/version.gitVersion=v1.35.1
            output: ${target.dir}/usr/bin/tctl-dev
            packages: ./tool/tctl
            strip: false
            tags: pam,libfido2,piv,kustomize_disable_go_plugin_support
        - name: build tsh
          uses: go/build@v1
          with:
            cgo_enabled: 1
            fips: false
            ldflags:
              - -X k8s.io/component-base/version.gitVersion=v1.35.1
            output: ${target.dir}/usr/bin/tsh
            packages: ./tool/tsh
            strip: true
            tags: libfido2,piv,kustomize_disable_go_plugin_support
        - name: build tsh dev
          uses: go/build@v1
          with:
            cgo_enabled: 1
            fips: false
            ldflags:
              - -X k8s.io/component-base/version.gitVersion=v1.35.1
            output: ${target.dir}/usr/bin/tsh-dev
            packages: ./tool/tsh
            strip: false
            tags: libfido2,piv,kustomize_disable_go_plugin_support
        - name: build tbot
          uses: go/build@v1
          with:
            fips: false
            ldflags:
              - -X k8s.io/component-base/version.gitVersion=v1.35.1
            output: ${target.dir}/usr/bin/tbot
            packages: ./tool/tbot
            strip: true
            tags: kustomize_disable_go_plugin_support
        - name: build tbot dev
          uses: go/build@v1
          with:
            fips: false
            ldflags:
              - -X k8s.io/component-base/version.gitVersion=v1.35.1
            output: ${target.dir}/usr/bin/tbot-dev
            packages: ./tool/tbot
            strip: false
            tags: kustomize_disable_go_plugin_support
        - name: collect sboms
          runs: |
            set -eux -o pipefail

            install -d "${target.dir}/opt/docker/sbom" "${target.dir}/opt/docker/sbom-dev"
            cp -a /opt/docker/sbom/teleport-cargo /opt/docker/sbom/teleport-web \
              /opt/docker/sbom/tsh-cargo /opt/docker/sbom/fdpass-teleport-cargo "${target.dir}/opt/docker/sbom/"
            cp -a /opt/docker/sbom/teleport-cargo /opt/docker/sbom/teleport-web "${target.dir}/opt/docker/sbom-dev/"
        - uses: dhi/build-pkg:0
          with:
            depends:
              - libc6
              - libgcc-s1
              - libpam0g
              - libbpf1
              - libpcsclite1
            description: Teleport, an identity-aware infrastructure access platform (auth, proxy and node services)
            files:
              - usr/bin/teleport
              - opt/docker/sbom/teleport-cargo
              - opt/docker/sbom/teleport-web
            formats:
              - deb
            license: AGPL-3.0-only
            name: teleport-17
            rel: 5
            subpackages:
              - files:
                  - path: usr/bin/teleport
                    source: usr/bin/teleport-dev
                  - path: opt/docker/sbom/teleport-cargo
                    source: opt/docker/sbom-dev/teleport-cargo
                  - path: opt/docker/sbom/teleport-web
                    source: opt/docker/sbom-dev/teleport-web
                name: teleport-17-dev
              - depends:
                  - libc6
                  - libpam0g
                  - libfido2-1
                  - libpcsclite1
                description: Teleport cluster administration tool
                files:
                  - usr/bin/tctl
                name: tctl-17
              - files:
                  - path: usr/bin/tctl
                    source: usr/bin/tctl-dev
                name: tctl-17-dev
              - depends:
                  - libc6
                  - libgcc-s1
                  - libfido2-1
                  - libpcsclite1
                description: Teleport client and ssh ProxyCommand helper
                files:
                  - usr/bin/tsh
                  - usr/bin/fdpass-teleport
                  - opt/docker/sbom/tsh-cargo
                  - opt/docker/sbom/fdpass-teleport-cargo
                name: tsh-17
              - files:
                  - path: usr/bin/tsh
                    source: usr/bin/tsh-dev
                  - usr/bin/fdpass-teleport
                  - opt/docker/sbom/tsh-cargo
                  - opt/docker/sbom/fdpass-teleport-cargo
                name: tsh-17-dev
              - description: Teleport Machine ID bot
                files:
                  - usr/bin/tbot
                name: tbot-17
              - files:
                  - path: usr/bin/tbot
                    source: usr/bin/tbot-dev
                name: tbot-17-dev
            url: https://github.com/gravitational/teleport
            version: 17.7.29
os-release:
  name: Docker Hardened Images (Debian)
  id: debian
  version-id: "13"
  version-codename: trixie
  pretty-name: Docker Hardened Images/Debian GNU/Linux 13 (trixie)
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
