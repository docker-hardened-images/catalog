# syntax=dhi.io/build:2-alpine3.24

image: dhi.io/pkg-socket-cli
variant: runtime
tags:
  - 2.1.0-alpine3.24
  - 2.1.0-r2-alpine3.24
platforms:
  - linux/amd64
  - linux/arm64
dates:
  release: "2025-11-03"
vars:
  COMMIT_SHA: 10189f65119e5ca84bf80e95f208cae83b405a3a
  NODEJS_VERSION: 24.22.1-r1
  PACKAGE_NAME: socket-cli-2
  PNPM_VERSION: 10.34.9
  REL: "2"
  SEMVER_MAJOR_MINOR_VERSION: "2.1"
  SEMVER_MAJOR_VERSION: "2"
  SEMVER_VERSION: 2.1.0
  VERSION: 2.1.0
contents:
  repositories:
    - https://dhi.io/apk/alpine/v3.24/main
    - https://dhi.io/apk/alpine/v3.23/main
    - https://dl-cdn.alpinelinux.org/alpine/v3.24/main
    - https://dl-cdn.alpinelinux.org/alpine/v3.24/community
  keyring:
    - https://dhi.io/keyring/dhi-apk@docker-0F81AD7700D99184.rsa.pub
  packages:
    - alpine-baselayout-data
  builds:
    - name: socket-cli-2
      work-dir: ${source.dir}/app-src
      contents:
        packages:
          - bash
          - busybox
          - ca-certificates-bundle
          - coreutils
          - corepack
          - git
          - nodejs-24=24.22.1-r1
        files:
          - url: git+https://github.com/SocketDev/socket-cli.git#v2.1.0
            checksum: 10189f65119e5ca84bf80e95f208cae83b405a3a
            path: ${source.dir}/app-src
            spdx:
              name: socket-cli
              version: 2.1.0
              packages:
                - name: socket
                  purl: pkg:npm/socket@2.1.0
                  license: MIT
            uid: 0
            gid: 0
      pipeline:
        - name: remediate bundled dependency vulnerabilities
          uses: patch@v1
          work-dir: ${source.dir}/app-src
          with:
            options: -p1
            patches:
              - ${source.dir}/socket-cli-2-braces-max-depth.patch
              - ${source.dir}/socket-cli-2-cve-dependencies.patch
        - name: build and stage socket CLI
          privileged: true
          runs: |
            set -eux -o pipefail

            corepack enable
            corepack prepare pnpm@10.34.9 --activate

            pnpm install --frozen-lockfile

            node -e '
            const fs = require("fs");
            const p = "packages/cli/.config/esbuild.cli.build.mjs";
            let s = fs.readFileSync(p, "utf8");
            const bundle = "bundle: true,";
            if (!s.includes("metafile: true")) {
              const n = (s.match(/bundle: true,/g) || []).length;
              if (n !== 1) { console.error("bundle markers " + n); process.exit(1); }
              s = s.replace(bundle, "bundle: true,\n  metafile: true,");
            }
            const old = "      if (result.outputFiles && result.outputFiles.length > 0) {\n        for (const output of result.outputFiles) {\n          writeFileSync(output.path, output.contents)\n        }\n      }";
            const neu = old + "\n      if (result.metafile) {\n        writeFileSync(\"build/esbuild-meta.json\", JSON.stringify(result.metafile))\n      }";
            if (!s.includes("esbuild-meta.json")) {
              if (!s.includes(old)) { console.error("esbuild write block missing"); process.exit(1); }
              s = s.replace(old, neu);
            }
            fs.writeFileSync(p, s);
            '

            export INLINED_SOCKET_CLI_PUBLISHED_BUILD=1
            pnpm --filter @socketsecurity/cli run build

            test -s packages/cli/build/cli.js
            test -s packages/cli/build/esbuild-meta.json
            grep -q '__SOCKET_CLI_VERSION__' packages/cli/build/cli.js && {
              echo "CLI bundle still contains an unresolved __SOCKET_CLI_VERSION__" >&2
              exit 1
            }

            mkdir -p /opt/docker/sbom/socket-cli-bundle
            node "${source.dir}/bundle-spdx.cjs" \
              packages/cli/build/esbuild-meta.json \
              /opt/docker/sbom/socket-cli-bundle/.spdx.socket-cli-bundle.json \
              "2.1.0"
            grep -q 'pkg:npm/@socketsecurity/lib@' \
              /opt/docker/sbom/socket-cli-bundle/.spdx.socket-cli-bundle.json
            grep -q "pkg:dhi/socket-cli@2.1.0" \
              /opt/docker/sbom/socket-cli-bundle/.spdx.socket-cli-bundle.json
            if grep -q 'pkg:npm/braces@' \
              /opt/docker/sbom/socket-cli-bundle/.spdx.socket-cli-bundle.json; then
              echo "braces must use the DHI purl, not an npm version" >&2
              exit 1
            fi

            help=$(CI=true timeout 60 node packages/cli/build/cli.js --help 2>&1)
            printf '%s\n' "$help"
            printf '%s\n' "$help" | grep -F "CLI: v2.1.0"
            printf '%s\n' "$help" | grep -Eiq 'referenceerror|downloading|powering up' && exit 1

            mkdir -p "${target.dir}/usr/lib/nodejs/socket-cli" "${target.dir}/usr/bin" "${target.dir}/opt/docker/sbom"
            cp packages/cli/build/cli.js "${target.dir}/usr/lib/nodejs/socket-cli/cli.js"
            sed -i '1s|^#!/usr/bin/env node|#!/usr/bin/node|' \
              "${target.dir}/usr/lib/nodejs/socket-cli/cli.js"
            chmod 755 "${target.dir}/usr/lib/nodejs/socket-cli/cli.js"
            for name in socket socket-npm socket-npx socket-pnpm socket-yarn; do
              ln -sf ../lib/nodejs/socket-cli/cli.js "${target.dir}/usr/bin/${name}"
            done
            cp -a /opt/docker/sbom/socket-cli-bundle "${target.dir}/opt/docker/sbom/"
        - uses: spdx@v1
          with:
            license: MIT
            name: socket
            purl: pkg:npm/socket@2.1.0
            version: 2.1.0
        - uses: dhi/build-pkg:0
          with:
            depends:
              - nodejs-24
            description: Socket CLI (supply-chain security scanning for npm/pnpm/yarn projects)
            files:
              - usr/lib/nodejs/socket-cli
              - usr/bin/socket
              - usr/bin/socket-npm
              - usr/bin/socket-npx
              - usr/bin/socket-pnpm
              - usr/bin/socket-yarn
              - opt/docker/sbom
            license: MIT
            name: socket-cli-2
            rel: 2
            url: https://github.com/SocketDev/socket-cli
            version: 2.1.0
      paths:
        - type: file
          path: ${source.dir}/bundle-spdx.cjs
          uid: 0
          gid: 0
          mode: "0644"
          source: package/main/socket-cli/scripts/bundle-spdx.cjs
        - type: file
          path: ${source.dir}/socket-cli-2-braces-max-depth.patch
          uid: 0
          gid: 0
          mode: "0644"
          source: package/main/socket-cli/patch/socket-cli-2-braces-max-depth.patch
        - type: file
          path: ${source.dir}/socket-cli-2-cve-dependencies.patch
          uid: 0
          gid: 0
          mode: "0644"
          source: package/main/socket-cli/patch/socket-cli-2-cve-dependencies.patch
os-release:
  name: Docker Hardened Images (Alpine)
  id: alpine
  version-id: "3.24"
  pretty-name: Docker Hardened Images/Alpine Linux v3.24
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
