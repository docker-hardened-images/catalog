# syntax=dhi.io/build:2-alpine3.24

image: dhi.io/pkg-socket-cli
variant: runtime
tags:
  - 2.1.0-alpine3.24
  - 2.1.0-r1-alpine3.24
platforms:
  - linux/amd64
  - linux/arm64
dates:
  release: "2025-10-30"
vars:
  COMMIT_SHA: 10189f65119e5ca84bf80e95f208cae83b405a3a
  NODEJS_VERSION: 24.20.0-r0
  PNPM_VERSION: 10.33.0
  REL: "1"
  SEMVER_MAJOR_MINOR_VERSION: "2.1"
  SEMVER_MAJOR_VERSION: "2"
  SEMVER_VERSION: 2.1.0
  VERSION: 2.1.0
contents:
  repositories:
    - https://dhi.io/apk/alpine/v3.24/main
    - https://dhi.io/apk/alpine/v3.23/main
    - https://dl-cdn.alpinelinux.org/alpine/v3.24/main
    - https://dl-cdn.alpinelinux.org/alpine/v3.24/community
  keyring:
    - https://dhi.io/keyring/dhi-apk@docker-0F81AD7700D99184.rsa.pub
  packages:
    - alpine-baselayout-data
  builds:
    - name: socket-cli
      work-dir: ${source.dir}/app-src
      contents:
        packages:
          - bash
          - busybox
          - ca-certificates-bundle
          - coreutils
          - corepack
          - git
          - nodejs-24=24.20.0-r0
          - npm
        files:
          - url: git+https://github.com/SocketDev/socket-cli.git#v2.1.0
            checksum: 10189f65119e5ca84bf80e95f208cae83b405a3a
            path: ${source.dir}/app-src
            spdx:
              name: socket-cli
              version: 2.1.0
              packages:
                - name: socket
                  purl: pkg:npm/socket@2.1.0
                  license: MIT
            uid: 0
            gid: 0
      pipeline:
        - name: build and stage payload
          privileged: true
          runs: |
            set -eux -o pipefail

            corepack enable
            corepack prepare pnpm@10.33.0 --activate

            pnpm install --frozen-lockfile --ignore-scripts

            node scripts/update-socketbin-versions.mjs
            node scripts/prepare-package-for-publish.mjs packages/socket

            pnpm run build --target socket

            mkdir -p "${target.dir}/usr/lib/nodejs/socket-cli"
            cd packages/socket
            PUBLISH_SET="$(node -p 'require("./package.json").files.map(f => f.split("/")[0]).join(" ")')"
            cp -a $PUBLISH_SET package.json \
              "${target.dir}/usr/lib/nodejs/socket-cli/"

            sed -i '1s|^#!/usr/bin/env node$|#!/usr/bin/node|' \
              "${target.dir}/usr/lib/nodejs/socket-cli/dist/bootstrap.js"
        - uses: spdx@v1
          with:
            license: MIT
            name: socket
            purl: pkg:npm/socket@2.1.0
            version: 2.1.0
        - uses: dhi/build-pkg:0
          with:
            description: Socket CLI (supply-chain security scanning for npm/pnpm/yarn projects)
            files:
              - usr/lib/nodejs/socket-cli
            license: MIT
            name: socket-cli
            rel: 1
            url: https://github.com/SocketDev/socket-cli
            version: 2.1.0
os-release:
  name: Docker Hardened Images (Alpine)
  id: alpine
  version-id: "3.24"
  pretty-name: Docker Hardened Images/Alpine Linux v3.24
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
