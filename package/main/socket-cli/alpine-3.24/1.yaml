# syntax=dhi.io/build:2-alpine3.24

image: dhi.io/pkg-socket-cli
variant: runtime
tags:
  - 1.11.1-alpine3.24
  - 1.11.1-r1-alpine3.24
platforms:
  - linux/amd64
  - linux/arm64
dates:
  release: "2025-06-13"
vars:
  COMMIT_SHA: 1dfdd0488968b6a2c4a223a9ba0400d7a6c4caca
  NODEJS_VERSION: 24.22.1-r1
  PACKAGE_NAME: socket-cli-1
  REL: "1"
  SEMVER_MAJOR_MINOR_VERSION: "1.11"
  SEMVER_MAJOR_VERSION: "1"
  SEMVER_VERSION: 1.11.1
  VERSION: 1.11.1
contents:
  repositories:
    - https://dhi.io/apk/alpine/v3.24/main
    - https://dhi.io/apk/alpine/v3.23/main
    - https://dl-cdn.alpinelinux.org/alpine/v3.24/main
    - https://dl-cdn.alpinelinux.org/alpine/v3.24/community
  keyring:
    - https://dhi.io/keyring/dhi-apk@docker-0F81AD7700D99184.rsa.pub
  packages:
    - alpine-baselayout-data
  builds:
    - name: socket-cli-1
      work-dir: ${source.dir}/app-src
      caches:
        - path: /root/.local/share/pnpm/store
      contents:
        packages:
          - bash
          - busybox
          - ca-certificates-bundle
          - coreutils
          - corepack
          - git
          - jq
          - nodejs-24=24.22.1-r1
          - openjdk17
        files:
          - url: git+https://github.com/SocketDev/socket-cli.git#v1.11.1
            checksum: 1dfdd0488968b6a2c4a223a9ba0400d7a6c4caca
            path: ${source.dir}/app-src
            spdx:
              name: socket-cli
              version: 1.11.1
              packages:
                - name: socket
                  purl: pkg:npm/socket@1.11.1
                  license: MIT
            uid: 0
            gid: 0
      pipeline:
        - name: bump pnpm dependencies
          work-dir: ${source.dir}/app-src
          privileged: true
          runs: |
            set -eux -o pipefail

            corepack enable
            corepack prepare "$(node -p 'require("./package.json").packageManager')" --activate

            bumps="${source.dir}/patch/pnpm-bumps.json"
            while IFS= read -r bump; do
              package=$(echo "$bump" | jq -r '.package')
              version=$(echo "$bump" | jq -r '.version')
              echo "$bump" | jq -e '.overrides' > /dev/null
              for key in $(echo "$bump" | jq -r '.overrides[]'); do
                tmp=package.json.$$
                jq --arg key "$key" --arg ver "$version" \
                  '.pnpm.overrides[$key] = $ver' package.json > "$tmp"
                mv "$tmp" package.json
              done
            done < <(jq -c '.[]' "$bumps")

            pnpm install --lockfile-only --ignore-scripts
        - name: build socket-cli dist
          privileged: true
          runs: |
            set -eux -o pipefail

            corepack enable
            corepack prepare "$(node -p 'require("./package.json").packageManager')" --activate

            pnpm install --frozen-lockfile --ignore-scripts

            export JAVA_HOME="$(dirname "$(dirname "$(readlink -f "$(command -v javac)")")")"
            export MVNW_REPOURL=https://maven-central.storage-download.googleapis.com/maven2

            mkdir -p /root/.m2
            cat > /root/.m2/settings.xml << 'SETTINGS'
            <?xml version="1.0" encoding="UTF-8"?>
            <settings xmlns="http://maven.apache.org/SETTINGS/1.0.0">
              <mirrors>
                <mirror>
                  <id>google-maven-central</id>
                  <name>GCS Maven Central mirror</name>
                  <url>https://maven-central.storage-download.googleapis.com/maven2/</url>
                  <mirrorOf>central</mirrorOf>
                </mirror>
              </mirrors>
            </settings>
            SETTINGS

            for attempt in 1 2 3; do
              bash src/commands/manifest/scripts/maven-extension/build-jar.sh && break
              [ "$attempt" -eq 3 ] && exit 1
              sleep $((attempt * 15))
            done

            INLINED_SOCKET_CLI_PUBLISHED_BUILD=1 pnpm run build:dist
        - name: catalog undici override
          uses: sbom@v1
          with:
            extra-scanners: javascript-package-cataloger
            prefix: socket-cli-undici
            source: ${source.dir}/app-src/node_modules/.pnpm/undici@6.29.1/node_modules/undici
        - name: catalog ip-address override
          uses: sbom@v1
          with:
            extra-scanners: javascript-package-cataloger
            prefix: socket-cli-ip-address
            source: ${source.dir}/app-src/node_modules/.pnpm/ip-address@10.7.4/node_modules/ip-address
        - name: stage pruned payload
          runs: |
            set -eux -o pipefail

            corepack enable
            corepack prepare "$(node -p 'require("./package.json").packageManager')" --activate

            pnpm prune --prod --ignore-scripts

            if ls -d node_modules/.pnpm/zod@3.* > /dev/null 2>&1; then
              echo "[ERROR] vulnerable zod 3.x still present after override" >&2
              ls -d node_modules/.pnpm/zod@3.*
              exit 1
            fi
            node bin/cli.js --version

            mkdir -p "${target.dir}/usr/lib/nodejs/socket-cli"
            PUBLISH_SET="$(node -p 'require("./package.json").files.map(f => f.split("/")[0]).join(" ")')"
            cp -a $PUBLISH_SET package.json node_modules \
              "${target.dir}/usr/lib/nodejs/socket-cli/"

            sed -i '1s|^#!/usr/bin/env node$|#!/usr/bin/node|' \
              "${target.dir}/usr/lib/nodejs/socket-cli/bin/"*.js
        - uses: spdx@v1
          with:
            license: MIT
            name: socket
            purl: pkg:npm/socket@1.11.1
            version: 1.11.1
        - uses: dhi/build-pkg:0
          with:
            description: Socket CLI (supply-chain security scanning for npm/pnpm/yarn projects)
            files:
              - usr/lib/nodejs/socket-cli
            license: MIT
            name: socket-cli-1
            rel: 1
            url: https://github.com/SocketDev/socket-cli
            version: 1.11.1
      paths:
        - type: file
          path: ${source.dir}/patch/pnpm-bumps.json
          uid: 0
          gid: 0
          mode: "0755"
          source: package/main/socket-cli/patch/pnpm-bumps.json
os-release:
  name: Docker Hardened Images (Alpine)
  id: alpine
  version-id: "3.24"
  pretty-name: Docker Hardened Images/Alpine Linux v3.24
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
