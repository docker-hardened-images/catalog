# syntax=dhi.io/build:2-debian13

image: dhi.io/pkg-haproxy
variant: runtime
tags:
  - 3.3.14
  - 3.3.14-r0
  - 3.3.14-debian13
  - 3.3.14-r0-debian13
platforms:
  - linux/amd64
  - linux/arm64
dates:
  release: "2025-11-26"
  end-of-life: "2027-01-01"
vars:
  OPENSSL_ARCH: '#{ target.arch == "amd64" ? "x86_64" : "aarch64" }'
  OPENSSL_FIPS_VERSION: 3.5.7-1~deb13u2+fips+dhi0
  PACKAGE_NAME: haproxy-3.3
  REL: "0"
  SEMVER_MAJOR_MINOR_VERSION: "3.3"
  SEMVER_MAJOR_VERSION: "3"
  SEMVER_VERSION: 3.3.14
  SHA256: sha256:6279bc9a5b4423a734bdf280d66533382c663d551daf4aa053c39900771748b0
  VERSION: 3.3.14
contents:
  repositories:
    - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
  keyring:
    - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
  packages:
    - base-files
  builds:
    - name: haproxy-3.3
      contents:
        repositories:
          - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
          - deb [signed-by=/usr/share/keyrings/dhi-deb-security.gpg] http://dhi.io/deb/debian/security trixie main
        keyring:
          - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
          - https://dhi.io/keyring/dhi-deb-sec-gpg.D46852F6925E9F71.key
        packages:
          - bash
          - coreutils
          - diffutils
          - gcc
          - grep
          - gzip
          - libc6-dev
          - liblua5.4-dev
          - libpcre2-dev
          - libssl-dev
          - make
          - openssl
          - openssl-provider-fips=3.5.7-1~deb13u2+fips+dhi0
          - tar
        files:
          - url: https://www.haproxy.org/download/3.3/src/haproxy-3.3.14.tar.gz
            checksum: sha256:6279bc9a5b4423a734bdf280d66533382c663d551daf4aa053c39900771748b0
            path: ${source.dir}/haproxy.tar.gz
            spdx:
              name: haproxy
              version: 3.3.14
              packages:
                - name: haproxy
                  purl: pkg:dhi/haproxy@3.3.14
                  license: GPL-2.0-only
            uid: 0
            gid: 0
      pipeline:
        - name: extract
          runs: |
            set -eux -o pipefail

            tar -xzvf haproxy.tar.gz
        - name: compile
          runs: |
            set -eux -o pipefail

            nproc="$(nproc)"
            make -C "haproxy-3.3.14" -j "$nproc" \
              TARGET=linux-glibc \
              CC=gcc \
              \
              USE_GETADDRINFO=1 \
              USE_LUA=1 LUA_LIB_NAME=lua5.4 LUA_INC=/usr/include/lua5.4 \
              USE_OPENSSL=1 \
              USE_PCRE2=1 USE_PCRE2_JIT=1 \
              USE_PROMEX=1 \
              \
              EXTRA_OBJS='' \
              \
              all
        - name: install
          runs: |
            set -eux -o pipefail

            make -C "haproxy-3.3.14" \
              \
              PREFIX="${target.dir}/usr" \
              SBINDIR="${target.dir}/usr/sbin" \
              \
              install-bin
        - uses: dhi/build-pkg:0
          with:
            depends:
              - libc6
              - libgcc-s1
              - liblua5.4-0
              - libpcre2-8-0
              - libssl3t64
            description: HAProxy - The Reliable, High Performance TCP/HTTP Load Balancer
            files:
              - usr/sbin/haproxy
            formats:
              - deb
            license: GPL-2.0-only
            name: haproxy-3.3
            rel: 0
            url: https://www.haproxy.org/
            version: 3.3.14
