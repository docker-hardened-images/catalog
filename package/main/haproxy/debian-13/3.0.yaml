# syntax=dhi.io/build:2-debian13

image: dhi.io/pkg-haproxy
variant: runtime
tags:
  - 3.0.26
  - 3.0.26-r1
  - 3.0.26-debian13
  - 3.0.26-r1-debian13
platforms:
  - linux/amd64
  - linux/arm64
dates:
  release: "2024-05-29"
  end-of-life: "2029-04-01"
vars:
  OPENSSL_ARCH: '#{ target.arch == "amd64" ? "x86_64" : "aarch64" }'
  OPENSSL_FIPS_VERSION: 3.5.7-1~deb13u2+fips+dhi0
  PACKAGE_NAME: haproxy-3.0
  REL: "1"
  SEMVER_MAJOR_MINOR_VERSION: "3.0"
  SEMVER_MAJOR_VERSION: "3"
  SEMVER_VERSION: 3.0.26
  SHA256: sha256:8a5b31ca881b7d714d228acccc7ac61b132bc7bcb9c3b76adc846e800917fe3a
  VERSION: 3.0.26
contents:
  repositories:
    - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
  keyring:
    - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
  packages:
    - base-files
  builds:
    - name: haproxy-3.0
      contents:
        repositories:
          - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
          - deb [signed-by=/usr/share/keyrings/dhi-deb-security.gpg] http://dhi.io/deb/debian/security trixie main
        keyring:
          - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
          - https://dhi.io/keyring/dhi-deb-sec-gpg.D46852F6925E9F71.key
        packages:
          - bash
          - coreutils
          - diffutils
          - gcc
          - grep
          - gzip
          - libc6-dev
          - liblua5.4-dev
          - libpcre2-dev
          - libssl-dev
          - make
          - openssl
          - openssl-provider-fips=3.5.7-1~deb13u2+fips+dhi0
          - tar
        files:
          - url: https://www.haproxy.org/download/3.0/src/haproxy-3.0.26.tar.gz
            checksum: sha256:8a5b31ca881b7d714d228acccc7ac61b132bc7bcb9c3b76adc846e800917fe3a
            path: ${source.dir}/haproxy.tar.gz
            spdx:
              name: haproxy
              version: 3.0.26
              packages:
                - name: haproxy
                  purl: pkg:dhi/haproxy@3.0.26
                  license: GPL-2.0-only
            uid: 0
            gid: 0
      pipeline:
        - name: extract
          runs: |
            set -eux -o pipefail

            tar -xzvf haproxy.tar.gz
        - name: compile
          runs: |
            set -eux -o pipefail

            nproc="$(nproc)"
            make -C "haproxy-3.0.26" -j "$nproc" \
              TARGET=linux-glibc \
              CC=gcc \
              \
              USE_GETADDRINFO=1 \
              USE_LUA=1 LUA_LIB_NAME=lua5.4 LUA_INC=/usr/include/lua5.4 \
              USE_OPENSSL=1 \
              USE_PCRE2=1 USE_PCRE2_JIT=1 \
              USE_PROMEX=1 \
              \
              EXTRA_OBJS='' \
              \
              all
        - name: install
          runs: |
            set -eux -o pipefail

            make -C "haproxy-3.0.26" \
              \
              PREFIX="${target.dir}/usr" \
              SBINDIR="${target.dir}/usr/sbin" \
              \
              install-bin
        - uses: dhi/build-pkg:0
          with:
            depends:
              - libc6
              - libgcc-s1
              - liblua5.4-0
              - libpcre2-8-0
              - libssl3t64
            description: HAProxy - The Reliable, High Performance TCP/HTTP Load Balancer
            files:
              - usr/sbin/haproxy
            formats:
              - deb
            license: GPL-2.0-only
            name: haproxy-3.0
            rel: 1
            url: https://www.haproxy.org/
            version: 3.0.26
os-release:
  name: Docker Hardened Images (Debian)
  id: debian
  version-id: "13"
  version-codename: trixie
  pretty-name: Docker Hardened Images/Debian GNU/Linux 13 (trixie)
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
