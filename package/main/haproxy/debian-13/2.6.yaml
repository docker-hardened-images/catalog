  VERSION: 2.6.32
contents:
  repositories:
    - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
  keyring:
    - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
  packages:
    - base-files
  builds:
    - name: haproxy-2.6
      contents:
        repositories:
          - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
          - deb [signed-by=/usr/share/keyrings/dhi-deb-security.gpg] http://dhi.io/deb/debian/security trixie main
        keyring:
          - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
          - https://dhi.io/keyring/dhi-deb-sec-gpg.D46852F6925E9F71.key
        packages:
          - bash
          - coreutils
          - diffutils
          - gcc
          - grep
          - gzip
          - libc6-dev
          - liblua5.4-dev
          - libpcre2-dev
          - libssl-dev
          - make
          - openssl
          - openssl-provider-fips=3.5.6-1~deb13u2+fips+dhi1
          - tar
        files:
          - url: https://www.haproxy.org/download/2.6/src/haproxy-2.6.32.tar.gz
            checksum: sha256:8791585ee3bd24cde652d1d840ac7b1f73f086d5e9ec41c5e079592703ea52a4
            path: ${source.dir}/haproxy.tar.gz
            spdx:
              name: haproxy
              version: 2.6.32
              packages:
                - name: haproxy
                  purl: pkg:dhi/haproxy@2.6.32
                  license: GPL-2.0-only
            uid: 0
            gid: 0
      pipeline:
        - name: extract
          runs: |
            set -eux -o pipefail

            tar -xzvf haproxy.tar.gz
        - name: compile
          runs: |
            set -eux -o pipefail

            nproc="$(nproc)"
            make -C "haproxy-2.6.32" -j "$nproc" \
              TARGET=linux-glibc \
              CC=gcc \
              \
              USE_GETADDRINFO=1 \
              USE_LUA=1 LUA_LIB_NAME=lua5.4 LUA_INC=/usr/include/lua5.4 \
              USE_OPENSSL=1 \
              USE_PCRE2=1 USE_PCRE2_JIT=1 \
              USE_PROMEX=1 \
              \
              EXTRA_OBJS='' \
              \
              all
        - name: install
          runs: |
            set -eux -o pipefail

            make -C "haproxy-2.6.32" \
              \
              PREFIX="${target.dir}/usr" \
              SBINDIR="${target.dir}/usr/sbin" \
              \
              install-bin
        - uses: dhi/build-pkg:0
          with:
            depends:
              - libc6
              - libgcc-s1
              - liblua5.4-0
              - libpcre2-8-0
              - libssl3t64
            description: HAProxy - The Reliable, High Performance TCP/HTTP Load Balancer
            files:
              - usr/sbin/haproxy
            formats:
              - deb
            license: GPL-2.0-only
            name: haproxy-2.6
            rel: 0
            url: https://www.haproxy.org/
            version: 2.6.32
