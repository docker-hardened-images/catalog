  - 2.6.32-r0-debian13
platforms:
  - linux/amd64
  - linux/arm64
dates:
  release: "2022-05-31"
  end-of-life: "2027-04-01"
vars:
  OPENSSL_ARCH: '#{ target.arch == "amd64" ? "x86_64" : "aarch64" }'
  OPENSSL_FIPS_VERSION: 3.5.6-1~deb13u2+fips+dhi1
  PACKAGE_NAME: haproxy-2.6
  REL: "0"
  SEMVER_MAJOR_MINOR_VERSION: "2.6"
  SEMVER_MAJOR_VERSION: "2"
