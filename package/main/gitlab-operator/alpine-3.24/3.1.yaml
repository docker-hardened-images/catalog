              ${source.dir}/charts/gitlab-10.0.10.tgz \
              ${source.dir}/charts/gitlab-9.11.14.tgz \
              ${target.dir}/usr/share/gitlab-operator/charts/
        - name: stage sbom documents
          runs: |
            set -eux -o pipefail

            install -d "${target.dir}/opt/docker/sbom"
            for d in gitlab-operator gitlab-chart-10.1.9 gitlab-chart-10.0.10 gitlab-chart-9.11.14; do
              test -d "/opt/docker/sbom/$d"
              cp -a "/opt/docker/sbom/$d" "${target.dir}/opt/docker/sbom/"
            done
