              ${source.dir}/charts/gitlab-10.2.11.tgz \
              ${source.dir}/charts/gitlab-10.1.11.tgz \
              ${target.dir}/usr/share/gitlab-operator/charts/
        - name: stage sbom documents
          runs: |
            set -eux -o pipefail

            install -d "${target.dir}/opt/docker/sbom"
            for d in gitlab-operator gitlab-chart-10.3.12 gitlab-chart-10.2.11 gitlab-chart-10.1.11; do
              test -d "/opt/docker/sbom/$d"
              cp -a "/opt/docker/sbom/$d" "${target.dir}/opt/docker/sbom/"
            done
