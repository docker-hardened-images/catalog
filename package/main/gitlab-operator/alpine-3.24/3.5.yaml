              - go.opentelemetry.io/otel/exporters/otlp/otlptrace/otlptracegrpc@v1.47.0
              - github.com/google/cel-go@v0.31.0
            download: true
        - uses: go/hermetic@v1
        - name: verify bundled chart versions
          runs: |
            set -eux -o pipefail

            printf '%s\n' "10.5.5" "10.4.7" "10.3.10" > /tmp/expected-charts
            awk 'NF { print $1 }' CHART_VERSIONS > /tmp/upstream-charts
            diff -u /tmp/expected-charts /tmp/upstream-charts
        - name: test
          environment:
            CHART_VERSION: 10.5.5
            GODEBUG: ""
            SKIP_ENVTEST: "yes"
          runs: |
            set -eux -o pipefail

            export HELM_CHARTS=${source.dir}/charts
            packages=$(go list ./... | grep -Ev '/internal/controller/(orbit|siphon)$')
            CGO_ENABLED=0 go test -count=1 -timeout 30m ${packages}
        - name: build gitlab-operator
          uses: go/build@v1
          with:
