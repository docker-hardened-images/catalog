      pipeline:
        - name: update go dependencies
          uses: go/bump@v2
          with:
            deps:
              - golang.org/x/crypto@v0.58.0
              - golang.org/x/net@v0.62.0
              - golang.org/x/mod@v0.41.0
              - golang.org/x/sys@v0.49.0
              - golang.org/x/text@v0.43.0
