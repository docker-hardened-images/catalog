              - usr/share/gitlab-operator/charts
              - opt/docker/sbom/gitlab-operator
              - opt/docker/sbom/gitlab-chart-10.5.5
              - opt/docker/sbom/gitlab-chart-10.4.7
              - opt/docker/sbom/gitlab-chart-10.3.10
