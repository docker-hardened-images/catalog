              ${source.dir}/charts/gitlab-10.5.5.tgz \
              ${source.dir}/charts/gitlab-10.4.7.tgz \
              ${source.dir}/charts/gitlab-10.3.10.tgz \
              ${target.dir}/usr/share/gitlab-operator/charts/
        - name: stage sbom documents
          runs: |
            set -eux -o pipefail

            install -d "${target.dir}/opt/docker/sbom"
            for d in gitlab-operator gitlab-chart-10.5.5 gitlab-chart-10.4.7 gitlab-chart-10.3.10; do
              test -d "/opt/docker/sbom/$d"
              cp -a "/opt/docker/sbom/$d" "${target.dir}/opt/docker/sbom/"
            done
