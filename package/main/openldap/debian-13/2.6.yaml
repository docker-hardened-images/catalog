# syntax=dhi.io/build:2-debian13

image: dhi.io/pkg-openldap-upstream
variant: runtime
tags:
  - "2.6"
  - 2.6.16
  - 2.6.16-r0
  - 2.6-debian13
  - 2.6.16-debian13
  - 2.6.16-r0-debian13
platforms:
  - linux/amd64
  - linux/arm64
vars:
  CHECKSUM: 8d8452bc3f56aa7a392c62dd377733f83d1314eed6c52fe44028439a3bb4df18
  LMDB_VERSION: 0.9.37
  PACKAGE_NAME: openldap-2.6
  REL: "0"
  SEMVER_MAJOR_MINOR_VERSION: "2.6"
  SEMVER_MAJOR_VERSION: "2"
  SEMVER_VERSION: 2.6.16
  SIGNATURE_CHECKSUM: 2ca7a171d73750d121a70282d4bd6c55fea31257d51ee4afaf12f77cc8d0ee81
  VERSION: 2.6.16
contents:
  repositories:
    - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
  keyring:
    - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
  packages:
    - base-files
  builds:
    - name: openldap
      work-dir: ${source.dir}
      contents:
        packages:
          - bash
          - build-essential
          - coreutils
          - diffutils
          - findutils
          - gawk
          - grep
          - groff-base
          - gzip
          - libargon2-dev
          - libltdl-dev
          - libperl-dev
          - libsasl2-dev
          - libssl-dev
          - sed
          - tar
          - unixodbc-dev
        files:
          - url: https://www.openldap.org/software/download/OpenLDAP/openldap-release/openldap-2.6.16.tgz
            checksum: sha256:8d8452bc3f56aa7a392c62dd377733f83d1314eed6c52fe44028439a3bb4df18
            path: ${source.dir}/openldap.tgz
            spdx:
              name: openldap
              version: 2.6.16
              packages:
                - name: openldap
                  purl: pkg:dhi/openldap@2.6.16
                  license: OLDAP-2.8
            uid: 0
            gid: 0
          - url: https://www.openldap.org/software/download/OpenLDAP/openldap-release/openldap-2.6.16.tgz.asc
            checksum: sha256:2ca7a171d73750d121a70282d4bd6c55fea31257d51ee4afaf12f77cc8d0ee81
            path: ${source.dir}/openldap.tgz.asc
            uid: 0
            gid: 0
      pipeline:
        - name: verify
          uses: gpg/verify@v1
          with:
            file: ${source.dir}/openldap.tgz
            keys: ${source.dir}/keys/openldap-release.asc
            signature: ${source.dir}/openldap.tgz.asc
        - name: build and install
          runs: |
            set -eux -o pipefail

            mkdir -p openldap
            tar -xzf openldap.tgz -C openldap --strip-components=1
            cd openldap

            CPPFLAGS='-DLDAPI_SOCK=\"/run/openldap/ldapi\"' ./configure \
              --prefix=/usr \
              --libdir=/usr/lib \
              --libexecdir=/usr/lib \
              --sysconfdir=/etc \
              --localstatedir=/var/lib/openldap \
              --enable-dynamic \
              --enable-crypt \
              --enable-spasswd \
              --enable-slapd \
              --enable-modules \
              --enable-asyncmeta=mod \
              --enable-dnssrv=mod \
              --enable-ldap=mod \
              --enable-mdb=mod \
              --enable-meta=mod \
              --enable-null=mod \
              --enable-passwd=mod \
              --enable-relay=mod \
              --enable-sock=mod \
              --enable-overlays=mod \
              --enable-perl=mod \
              --enable-sql=mod \
              --enable-argon2 \
              --with-argon2=libargon2 \
              --with-tls=openssl \
              --with-cyrus-sasl \
              --with-systemd=no

            make depend
            make -j"$(nproc)"
            make DESTDIR="${target.dir}" install

            for module in passwd/sha2 passwd/pbkdf2; do
              make -C contrib/slapd-modules/${module} prefix=/usr libexecdir=/usr/lib
              make -C contrib/slapd-modules/${module} DESTDIR="${target.dir}" prefix=/usr libexecdir=/usr/lib install
            done
        - name: test
          work-dir: ${source.dir}/openldap/tests
          runs: |
            set -eux -o pipefail

            make
            ./run -b mdb all
        - name: fix slapd layout
          work-dir: ${target.dir}
          runs: |
            set -eux -o pipefail

            mv usr/lib/slapd usr/sbin/slapd
            for tool in usr/sbin/slap*; do
              [ "${tool}" = usr/sbin/slapd ] && continue
              ln -sf slapd "${tool}"
            done

            rm usr/lib/openldap/*.la usr/lib/openldap/*.a
            find usr/lib -type f -name '*.so.*' -exec strip --strip-unneeded {} +
            grep -aqF "LMDB 0.9.37:" usr/lib/openldap/back_mdb.so.2.*
            mkdir -p var/lib/openldap/openldap-data
            touch var/lib/openldap/openldap-data/.keep

            mkdir -p stage/libs stage/dev/lib
            mv usr/lib/liblber.so.* usr/lib/libldap.so.* stage/libs/
            mv usr/lib/liblber.so usr/lib/libldap.so usr/lib/pkgconfig stage/dev/lib/
            mv usr/include stage/dev/include
        - uses: spdx@v1
          with:
            license: OLDAP-2.8
            name: lmdb
            purl: pkg:github/lmdb/lmdb@LMDB_0.9.37
            version: 0.9.37
        - name: ship sbom
          runs: |
            set -eux -o pipefail

            find /opt/docker/sbom -type f
            mkdir -p ${target.dir}/opt/docker/sbom
            cp -a /opt/docker/sbom/openldap /opt/docker/sbom/lmdb ${target.dir}/opt/docker/sbom/
        - uses: dhi/build-pkg:0
          with:
            deb:
              conflicts:
                - slapd
                - openldap-2.7
              depends:
                - openldap-2.6-libs
                - libargon2-1
                - libc6
                - libcrypt1
                - libltdl7
                - libodbc2
                - libperl5.40
                - libsasl2-2
                - libssl3t64
              replaces:
                - slapd
            description: OpenLDAP standalone LDAP server (slapd), tools, backends and overlays
            files:
              - opt/docker/sbom/lmdb
              - usr/sbin
              - usr/lib/openldap
              - etc/openldap/schema
              - var/lib/openldap
            formats:
              - deb
            license: OLDAP-2.8
            name: openldap-2.6
            rel: 0
            subpackages:
              - deb:
                  conflicts:
                    - libldap2
                    - openldap-2.7-libs
                  depends:
                    - libc6
                    - libsasl2-2
                    - libssl3t64
                  provides:
                    - libldap2=2.6.16-0
                  replaces:
                    - libldap2
                files:
                  - path: usr/lib
                    source: stage/libs
                  - path: etc/openldap/ldap.conf
                  - path: opt/docker/sbom/openldap
                name: openldap-2.6-libs
              - deb:
                  conflicts:
                    - ldap-utils
                    - openldap-2.7-clients
                  depends:
                    - openldap-2.6-libs
                    - libc6
                    - libsasl2-2
                    - libssl3t64
                  replaces:
                    - ldap-utils
                files:
                  - path: usr/bin
                name: openldap-2.6-clients
              - deb:
                  conflicts:
                    - libldap-dev
                    - libldap2-dev
                    - openldap-2.7-dev
                  depends:
                    - openldap-2.6-libs
                  replaces:
                    - libldap-dev
                    - libldap2-dev
                files:
                  - path: usr/include
                    source: stage/dev/include
                  - path: usr/lib
                    source: stage/dev/lib
                name: openldap-2.6-dev
            url: https://www.openldap.org/
            version: 2.6.16
      paths:
        - type: file
          path: ${source.dir}/keys/openldap-release.asc
          uid: 0
          gid: 0
          mode: "0444"
          source: package/main/openldap/keys/openldap-release.asc
os-release:
  name: Docker Hardened Images (Debian)
  id: debian
  version-id: "13"
  version-codename: trixie
  pretty-name: Docker Hardened Images/Debian GNU/Linux 13 (trixie)
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
