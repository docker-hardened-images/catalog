# syntax=dhi.io/build:2-debian13

image: dhi.io/pkg-aws-observability-aws-for-fluent-bit
variant: runtime
tags:
  - 3.5.5
  - 3.5.5-r0
  - 3.5.5-debian13
  - 3.5.5-r0-debian13
platforms:
  - linux/amd64
  - linux/arm64
vars:
  CLOUDWATCH_COMMIT_SHA: eba24827191e496dc8e4cae25e8cce9cc264f0bf
  CLOUDWATCH_VERSION: 1.9.5
  COMMIT_SHA: b757a49512c0f2991ff793f429af0a03ca9c236a
  FIREHOSE_COMMIT_SHA: 73be3b21e06bedd1a1dd9a830b512c1bcbcff537
  FIREHOSE_VERSION: 1.7.3
  FLUENT_BIT_COMMIT_SHA: 66910c10a4d7eafa810b84229cf2dcf7b0f26f97
  FLUENT_BIT_VERSION: 5.1.2
  GOLANG_VERSION: 1.27.3-0
  KINESIS_COMMIT_SHA: cfe06d78e31002ed2b2c977034cf283e02ec55a3
  KINESIS_VERSION: 1.10.4
  PACKAGE_NAME: aws-for-fluent-bit-3
  REL: "0"
  SEMVER_MAJOR_MINOR_VERSION: "3.5"
  SEMVER_MAJOR_VERSION: "3"
  SEMVER_VERSION: 3.5.5
  VERSION: 3.5.5
contents:
  repositories:
    - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
  keyring:
    - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
  packages:
    - base-files
  builds:
    - name: aws-for-fluent-bit-3
      environment:
        GOTOOLCHAIN: local
      contents:
        packages:
          - bash
          - binutils
          - bison
          - build-essential
          - ca-certificates
          - cmake
          - coreutils
          - flex
          - git
          - golang-1.27=1.27.3-0
          - golang-1.27-oci-config=1.27.3-0
          - grep
          - libc-ares-dev
          - libcurl4-openssl-dev
          - libjemalloc-dev
          - liblz4-dev
          - libnghttp2-dev
          - librdkafka-dev
          - libsasl2-dev
          - libsqlite3-dev
          - libssl-dev
          - libsystemd-dev
          - libyaml-dev
          - libzstd-dev
          - mawk
          - pkg-config
          - sed
          - zlib1g-dev
        files:
          - url: git+https://github.com/aws/aws-for-fluent-bit.git#v3.5.5
            checksum: b757a49512c0f2991ff793f429af0a03ca9c236a
            path: ${source.dir}/aws
            spdx:
              name: aws-for-fluent-bit
              version: 3.5.5
              packages:
                - name: aws-for-fluent-bit
                  purl: pkg:github/aws/aws-for-fluent-bit@b757a49512c0f2991ff793f429af0a03ca9c236a
                  license: Apache-2.0
            uid: 0
            gid: 0
          - url: git+https://github.com/fluent/fluent-bit.git#v5.1.2
            checksum: 66910c10a4d7eafa810b84229cf2dcf7b0f26f97
            path: ${source.dir}/fluent-bit
            spdx:
              name: fluent-bit
              version: 5.1.2
              packages:
                - name: fluent-bit
                  purl: pkg:github/fluent/fluent-bit@66910c10a4d7eafa810b84229cf2dcf7b0f26f97
                  license: Apache-2.0
            uid: 0
            gid: 0
          - url: git+https://github.com/aws/amazon-kinesis-streams-for-fluent-bit.git#v1.10.4
            checksum: cfe06d78e31002ed2b2c977034cf283e02ec55a3
            path: ${source.dir}/kinesis
            spdx:
              name: amazon-kinesis-streams-for-fluent-bit
              version: 1.10.4
              packages:
                - name: amazon-kinesis-streams-for-fluent-bit
                  purl: pkg:golang/github.com/aws/amazon-kinesis-streams-for-fluent-bit@v1.10.4
                  license: Apache-2.0
            uid: 0
            gid: 0
          - url: git+https://github.com/aws/amazon-kinesis-firehose-for-fluent-bit.git#v1.7.3
            checksum: 73be3b21e06bedd1a1dd9a830b512c1bcbcff537
            path: ${source.dir}/firehose
            spdx:
              name: amazon-kinesis-firehose-for-fluent-bit
              version: 1.7.3
              packages:
                - name: amazon-kinesis-firehose-for-fluent-bit
                  purl: pkg:golang/github.com/aws/amazon-kinesis-firehose-for-fluent-bit@v1.7.3
                  license: Apache-2.0
            uid: 0
            gid: 0
          - url: git+https://github.com/aws/amazon-cloudwatch-logs-for-fluent-bit.git#v1.9.5
            checksum: eba24827191e496dc8e4cae25e8cce9cc264f0bf
            path: ${source.dir}/cloudwatch
            spdx:
              name: amazon-cloudwatch-logs-for-fluent-bit
              version: 1.9.5
              packages:
                - name: amazon-cloudwatch-logs-for-fluent-bit
                  purl: pkg:golang/github.com/aws/amazon-cloudwatch-logs-for-fluent-bit@v1.9.5
                  license: Apache-2.0
            uid: 0
            gid: 0
      pipeline:
        - name: bump kinesis modules
          uses: go/bump@v2
          work-dir: ${source.dir}/kinesis
          with:
            deps:
              - golang.org/x/sys@v0.44.0
        - name: build kinesis plugin
          uses: go/build@v1
          work-dir: ${source.dir}/kinesis
          with:
            cgo_enabled: 1
            extra-args: -buildmode=c-shared
            fips: false
            ldflags:
              - -w
            output: ${target.dir}/usr/lib/aws-for-fluent-bit/kinesis.so
            packages: .
        - name: bump firehose modules
          uses: go/bump@v2
          work-dir: ${source.dir}/firehose
          with:
            deps:
              - golang.org/x/sys@v0.44.0
        - name: build firehose plugin
          uses: go/build@v1
          work-dir: ${source.dir}/firehose
          with:
            cgo_enabled: 1
            extra-args: -buildmode=c-shared
            fips: false
            ldflags:
              - -w
            output: ${target.dir}/usr/lib/aws-for-fluent-bit/firehose.so
            packages: .
        - name: bump cloudwatch modules
          uses: go/bump@v2
          work-dir: ${source.dir}/cloudwatch
          with:
            deps:
              - golang.org/x/sys@v0.44.0
        - name: build cloudwatch plugin
          uses: go/build@v1
          work-dir: ${source.dir}/cloudwatch
          with:
            cgo_enabled: 1
            extra-args: -buildmode=c-shared
            fips: false
            ldflags:
              - -w
            output: ${target.dir}/usr/lib/aws-for-fluent-bit/cloudwatch.so
            packages: .
        - name: assert vendored headers
          runs: |
            set -eux -o pipefail

            src="${source.dir}/fluent-bit"
            test -d "${src}/.git"
            wamr="${src}/lib/wasm-micro-runtime-WAMR-2.4.1/core/version.h"
            test -f "${wamr}"
            grep -q '#define WAMR_VERSION_MAJOR 2' "${wamr}"
            grep -q '#define WAMR_VERSION_MINOR 4' "${wamr}"
            grep -q '#define WAMR_VERSION_PATCH 1' "${wamr}"
            msgpack="${src}/lib/msgpack-c/include/msgpack/version_master.h"
            test -f "${msgpack}"
            grep -q '#define MSGPACK_VERSION_MAJOR    3' "${msgpack}"
            grep -q '#define MSGPACK_VERSION_MINOR    3' "${msgpack}"
            grep -q '#define MSGPACK_VERSION_REVISION 0' "${msgpack}"
            yyjson="${src}/lib/yyjson-0.12.0/src/yyjson.h"
            test -f "${yyjson}"
            grep -q '#define YYJSON_VERSION_STRING "0.12.0"' "${yyjson}"
            mpack="${src}/lib/mpack-amalgamation-1.1.1/src/mpack/mpack.h"
            test -f "${mpack}"
            grep -q '#define MPACK_VERSION_MAJOR 1' "${mpack}"
            grep -q '#define MPACK_VERSION_MINOR 1' "${mpack}"
            grep -q '#define MPACK_VERSION_PATCH 1' "${mpack}"
            miniz="${src}/lib/miniz/miniz.h"
            test -f "${miniz}"
            grep -q '#define MZ_VERSION "11.0.0"' "${miniz}"
            snappy="${src}/lib/snappy-fef67ac/snappy.h"
            test -f "${snappy}"
            grep -q 'snappy_compress' "${snappy}"
            jsmn="${src}/lib/jsmn/VERSION"
            test -f "${jsmn}"
            grep -q '^commit 053d3cd29200edb1bfd181d917d140c16c1f8834' "${jsmn}"
            onigmo="${src}/lib/onigmo/configure.ac"
            test -f "${onigmo}"
            grep -q 'AC_INIT(onigmo, 6.2.0)' "${onigmo}"
            monkey="${src}/lib/monkey/CMakeLists.txt"
            test -f "${monkey}"
            grep -q 'set(MK_VERSION_MAJOR  1)' "${monkey}"
            grep -q 'set(MK_VERSION_MINOR  8)' "${monkey}"
            grep -q 'set(MK_VERSION_PATCH  9)' "${monkey}"
            cmt="${src}/lib/cmetrics/CMakeLists.txt"
            test -f "${cmt}"
            grep -q 'set(CMT_VERSION_MAJOR  2)' "${cmt}"
            grep -q 'set(CMT_VERSION_MINOR  2)' "${cmt}"
            grep -q 'set(CMT_VERSION_PATCH  2)' "${cmt}"
            ctr="${src}/lib/ctraces/CMakeLists.txt"
            test -f "${ctr}"
            grep -q 'set(CTR_VERSION_MAJOR  0)' "${ctr}"
            grep -q 'set(CTR_VERSION_MINOR  7)' "${ctr}"
            grep -q 'set(CTR_VERSION_PATCH  1)' "${ctr}"
            cio="${src}/lib/chunkio/CMakeLists.txt"
            test -f "${cio}"
            grep -q 'set(CIO_VERSION_MAJOR  1)' "${cio}"
            grep -q 'set(CIO_VERSION_MINOR  5)' "${cio}"
            grep -q 'set(CIO_VERSION_PATCH  4)' "${cio}"
            cfl="${src}/lib/cfl/CMakeLists.txt"
            test -f "${cfl}"
            grep -q 'set(CFL_VERSION_MAJOR  1)' "${cfl}"
            grep -q 'set(CFL_VERSION_MINOR  0)' "${cfl}"
            grep -q 'set(CFL_VERSION_PATCH  0)' "${cfl}"
            xxhash="${src}/lib/cfl/lib/xxhash/xxhash.h"
            test -f "${xxhash}"
            grep -q '#define XXH_VERSION_MAJOR    0' "${xxhash}"
            grep -q '#define XXH_VERSION_MINOR    8' "${xxhash}"
            grep -q '#define XXH_VERSION_RELEASE  3' "${xxhash}"
            lwrb="${src}/lib/lwrb/library.json"
            test -f "${lwrb}"
            grep -q '"version": "2.0.3"' "${lwrb}"
            simd="${src}/lib/simdutf-amalgamation-5.5.0/src/simdutf/simdutf.h"
            test -f "${simd}"
            grep -q 'SIMDUTF_VERSION "5.5.0"' "${simd}"
            ripser="${src}/lib/ripser-1.2.1/README.md"
            test -f "${ripser}"
            grep -q '1.2.1' "${ripser}"
            test -d "${src}/lib/cprofiles"
            test -f "${src}/lib/cprofiles/include/cprofiles/cprof_version.h.in"
            test -f "${src}/lib/tutf8e/include/tutf8e.h"
            test -f "${src}/lib/flb_libco/libco.h"
            test -d "${src}/lib/fluent-otel-proto"

            lj="${src}/lib/luajit-7152e154/src/luajit_rolling.h"
            test -f "${lj}"
            grep -q 'LuaJIT 2.1.ROLLING' "${lj}"
        - name: compile fluent-bit
          runs: |
            set -eux -o pipefail

            mkdir -p "${source.dir}/fluent-bit/build"
            cd "${source.dir}/fluent-bit/build"
            cmake \
              -DFLB_SIMD=On \
              -DFLB_JEMALLOC=On \
              -DFLB_TLS=On \
              -DFLB_HTTP_SERVER=On \
              -DFLB_IN_SYSTEMD=On \
              -DFLB_OUT_KAFKA=On \
              -DFLB_ARROW=Off \
              -DFLB_SHARED_LIB=Off \
              -DFLB_EXAMPLES=Off \
              -DFLB_RELEASE=On \
              -DFLB_DEBUG=Off \
              -DFLB_DEV=Off \
              -DFLB_VALGRIND=Off \
              -DFLB_TRACE=Off \
              -DFLB_MTRACE=Off \
              -DFLB_BACKTRACE=Off \
              -DFLB_PREFER_SYSTEM_LIB_JEMALLOC=On \
              -DFLB_PREFER_SYSTEM_LIB_KAFKA=On \
              -DFLB_PREFER_SYSTEM_LIB_CARES=On \
              -DFLB_PREFER_SYSTEM_LIB_NGHTTP2=On \
              -DFLB_PREFER_SYSTEM_LIB_SQLITE=On \
              -DFLB_PREFER_SYSTEM_LIB_ZSTD=On \
              -DFLB_PREFER_SYSTEM_LIB_LUAJIT=Off \
              ..
            make -j"$(nproc)"
            grep -E '^FLB_(ARROW|BACKTRACE|PREFER_SYSTEM_LIB_KAFKA|PREFER_SYSTEM_LIB_ZSTD|IN_SYSTEMD):' CMakeCache.txt
            grep -E -q '^FLB_ARROW:(BOOL|STRING)=(OFF|Off)$' CMakeCache.txt
            grep -E -q '^FLB_BACKTRACE:(BOOL|STRING)=(OFF|Off)$' CMakeCache.txt
            grep -E -q '^FLB_PREFER_SYSTEM_LIB_KAFKA:(BOOL|STRING)=(ON|On)$' CMakeCache.txt
            grep -E -q '^FLB_PREFER_SYSTEM_LIB_ZSTD:(BOOL|STRING)=(ON|On)$' CMakeCache.txt
            grep -E -q '^FLB_IN_SYSTEMD:(BOOL|STRING)=(ON|On)$' CMakeCache.txt
        - name: stage payload
          runs: |
            set -eux -o pipefail

            mkdir -p "${target.dir}/usr/bin" "${target.dir}/usr/lib/aws-for-fluent-bit"
            cp --preserve=mode "${source.dir}/fluent-bit/build/bin/fluent-bit" "${target.dir}/usr/bin/fluent-bit"
            cp --preserve=mode "${source.dir}/aws/entrypoint.sh" "${target.dir}/usr/lib/aws-for-fluent-bit/entrypoint.sh"
            mkdir -p "${target.dir}/usr/share/aws-for-fluent-bit"
            printf '%s\n' "3.5.5" > "${target.dir}/usr/share/aws-for-fluent-bit/AWS_FOR_FLUENT_BIT_VERSION"
            mkdir -p "${target.dir}/etc/aws-for-fluent-bit"
            cp "${source.dir}/aws/fluent-bit.conf" "${target.dir}/etc/aws-for-fluent-bit/fluent-bit.conf"
            cp "${source.dir}/fluent-bit/conf"/parsers*.conf "${target.dir}/etc/aws-for-fluent-bit/"
            mkdir -p "${target.dir}/usr/share/aws-for-fluent-bit/parsers"
            cp "${source.dir}/fluent-bit/conf"/parsers*.conf "${target.dir}/usr/share/aws-for-fluent-bit/parsers/"
            cp -a "${source.dir}/aws/configs" "${target.dir}/usr/share/aws-for-fluent-bit/configs"
            cp -a "${source.dir}/aws/filters" "${target.dir}/usr/share/aws-for-fluent-bit/filters"
            mkdir -p "${target.dir}/usr/share/aws-for-fluent-bit/ecs"
            cp "${source.dir}/aws/ecs/"*.conf "${target.dir}/usr/share/aws-for-fluent-bit/ecs/"

            entry="${target.dir}/usr/lib/aws-for-fluent-bit/entrypoint.sh"
            share="${target.dir}/usr/share/aws-for-fluent-bit"
            sed -i \
              -e 's|cat /AWS_FOR_FLUENT_BIT_VERSION|cat /usr/share/aws-for-fluent-bit/AWS_FOR_FLUENT_BIT_VERSION|' \
              -e 's|/fluent-bit/bin/fluent-bit|/usr/bin/fluent-bit|' \
              -e 's|/fluent-bit/firehose.so|/usr/lib/aws-for-fluent-bit/firehose.so|' \
              -e 's|/fluent-bit/cloudwatch.so|/usr/lib/aws-for-fluent-bit/cloudwatch.so|' \
              -e 's|/fluent-bit/kinesis.so|/usr/lib/aws-for-fluent-bit/kinesis.so|' \
              -e 's|/fluent-bit/etc/fluent-bit.conf|/etc/aws-for-fluent-bit/fluent-bit.conf|' \
              "$entry"
            grep -q 'cat /usr/share/aws-for-fluent-bit/AWS_FOR_FLUENT_BIT_VERSION' "$entry"
            grep -q 'exec /usr/bin/fluent-bit -e /usr/lib/aws-for-fluent-bit/firehose.so -e /usr/lib/aws-for-fluent-bit/cloudwatch.so -e /usr/lib/aws-for-fluent-bit/kinesis.so -c /etc/aws-for-fluent-bit/fluent-bit.conf' "$entry"
            sed -i 's|/fluent-bit/parsers/parsers.conf|/usr/share/aws-for-fluent-bit/parsers/parsers.conf|' \
              "${share}/configs/parse-json.conf"
            grep -q '/usr/share/aws-for-fluent-bit/parsers/parsers.conf' "${share}/configs/parse-json.conf"
            sed -i 's|/fluent-bit/configs/plugin-metrics-parser.conf|/usr/share/aws-for-fluent-bit/configs/plugin-metrics-parser.conf|' \
              "${share}/configs/plugin-metrics-to-cloudwatch.conf" \
              "${share}/configs/plugin-and-storage-metrics-to-cloudwatch.conf"
            grep -q '/usr/share/aws-for-fluent-bit/configs/plugin-metrics-parser.conf' "${share}/configs/plugin-metrics-to-cloudwatch.conf"
            grep -q '/usr/share/aws-for-fluent-bit/configs/plugin-metrics-parser.conf' "${share}/configs/plugin-and-storage-metrics-to-cloudwatch.conf"
            sed -i 's/^   \([^ ]\)/    \1/' "${share}/configs/plugin-and-storage-metrics-to-cloudwatch.conf"
            if grep -E -q '^   [^ ]' "${share}/configs/plugin-and-storage-metrics-to-cloudwatch.conf"; then
              echo "plugin-and-storage-metrics-to-cloudwatch.conf still has three-space keys" >&2
              exit 1
            fi
            grep -q '^    Name exec$' "${share}/configs/plugin-and-storage-metrics-to-cloudwatch.conf"
            sed -i 's|@INCLUDE /ecs/|@INCLUDE /usr/share/aws-for-fluent-bit/ecs/|' "${share}/ecs/"*.conf
            grep -q '@INCLUDE /usr/share/aws-for-fluent-bit/ecs/service.conf' "${share}/ecs/cloudwatch.conf"
            sed -i 's|/fluent-bit/filters/replace_dots.lua|/usr/share/aws-for-fluent-bit/filters/replace_dots.lua|' \
              "${share}/filters/replace_dots.lua"
            grep -q '/usr/share/aws-for-fluent-bit/filters/replace_dots.lua' "${share}/filters/replace_dots.lua"
            if grep -R -E -n '/fluent-bit/|@INCLUDE /ecs/' \
              "$entry" "$share" "${target.dir}/etc/aws-for-fluent-bit" | grep -v 'https://'; then
              echo "shipped payload still references upstream image paths" >&2
              exit 1
            fi

            mkdir -p \
              "${target.dir}/usr/share/aws-for-fluent-bit/licenses/aws-for-fluent-bit" \
              "${target.dir}/usr/share/aws-for-fluent-bit/licenses/fluent-bit" \
              "${target.dir}/usr/share/aws-for-fluent-bit/licenses/kinesis" \
              "${target.dir}/usr/share/aws-for-fluent-bit/licenses/firehose" \
              "${target.dir}/usr/share/aws-for-fluent-bit/licenses/cloudwatch"
            cp --preserve=mode "${source.dir}/aws/LICENSE" "${target.dir}/usr/share/aws-for-fluent-bit/licenses/aws-for-fluent-bit/LICENSE"
            cp --preserve=mode "${source.dir}/aws/THIRD-PARTY" "${target.dir}/usr/share/aws-for-fluent-bit/licenses/fluent-bit/THIRD-PARTY"
            cp --preserve=mode "${source.dir}/fluent-bit/LICENSE" "${target.dir}/usr/share/aws-for-fluent-bit/licenses/fluent-bit/LICENSE"
            test -s "${target.dir}/usr/share/aws-for-fluent-bit/licenses/aws-for-fluent-bit/LICENSE"
            test -s "${target.dir}/usr/share/aws-for-fluent-bit/licenses/fluent-bit/LICENSE"
            cp "${source.dir}/kinesis/LICENSE" "${source.dir}/kinesis/THIRD-PARTY" "${target.dir}/usr/share/aws-for-fluent-bit/licenses/kinesis/"
            cp "${source.dir}/firehose/LICENSE" "${source.dir}/firehose/THIRD-PARTY" "${target.dir}/usr/share/aws-for-fluent-bit/licenses/firehose/"
            cp "${source.dir}/cloudwatch/LICENSE" "${source.dir}/cloudwatch/THIRD-PARTY" "${target.dir}/usr/share/aws-for-fluent-bit/licenses/cloudwatch/"
            test -s "${target.dir}/usr/bin/fluent-bit"
            test -s "${target.dir}/usr/lib/aws-for-fluent-bit/kinesis.so"
            test -s "${target.dir}/usr/lib/aws-for-fluent-bit/firehose.so"
            test -s "${target.dir}/usr/lib/aws-for-fluent-bit/cloudwatch.so"
            test -f "${target.dir}/usr/lib/aws-for-fluent-bit/kinesis.h"
            rm "${target.dir}/usr/lib/aws-for-fluent-bit/kinesis.h"
            test -f "${target.dir}/usr/lib/aws-for-fluent-bit/firehose.h"
            rm "${target.dir}/usr/lib/aws-for-fluent-bit/firehose.h"
            test -f "${target.dir}/usr/lib/aws-for-fluent-bit/cloudwatch.h"
            rm "${target.dir}/usr/lib/aws-for-fluent-bit/cloudwatch.h"
            test ! -e "${target.dir}/fluent-bit"
            test ! -e /fluent-bit
            readelf -d "${target.dir}/usr/bin/fluent-bit" | tee /tmp/fluent-bit.ldd
            grep -q 'libjemalloc' /tmp/fluent-bit.ldd
            grep -q 'librdkafka' /tmp/fluent-bit.ldd
            grep -Eq 'libcares|libcares\.so' /tmp/fluent-bit.ldd
            grep -q 'libnghttp2' /tmp/fluent-bit.ldd
            grep -q 'libsqlite3' /tmp/fluent-bit.ldd
            grep -q 'libzstd' /tmp/fluent-bit.ldd
            grep -q 'libssl' /tmp/fluent-bit.ldd
            grep -q 'libyaml' /tmp/fluent-bit.ldd
            if grep -Eq 'libarrow|libparquet|libglib-2|libgobject|libcurl|liblz4|libsasl|libz\.so' /tmp/fluent-bit.ldd; then
              echo "unexpected direct NEEDED library" >&2
              exit 1
            fi

            if grep -q 'libluajit' /tmp/fluent-bit.ldd; then
              echo "debian fluent-bit unexpectedly links libluajit" >&2
              exit 1
            fi
            strings "${target.dir}/usr/bin/fluent-bit" > /tmp/fluent-bit.strings
            grep -q 'LuaJIT 2.1.1788551275' /tmp/fluent-bit.strings

            grep -q 'libsystemd' /tmp/fluent-bit.ldd
        - name: assert plugin fips marker
          runs: |
            set -eux -o pipefail

            for so in kinesis firehose cloudwatch; do
              bin="${target.dir}/usr/lib/aws-for-fluent-bit/${so}.so"
              strings "${bin}" > "/tmp/${so}.strings"
              go version -m "${bin}" > "/tmp/${so}.mod" 2>&1 || true
              echo "---- ${so} buildinfo ----"
              cat "/tmp/${so}.mod"
              echo "---- ${so} fips tokens ----"
              grep -a -o -E '.{0,12}fips140.{0,24}' "/tmp/${so}.strings" | sort -u > "/tmp/${so}.fips-tokens" || true
              head -30 "/tmp/${so}.fips-tokens"
              case "${so}" in
                kinesis) want="v1.10.4" ;;
                firehose) want="v1.7.3" ;;
                cloudwatch) want="v1.9.5" ;;
                *) echo "unknown plugin ${so}" >&2; exit 1 ;;
              esac
              grep -q "${want}" "/tmp/${so}.mod"
              if [ "false" = "true" ]; then
                grep -q 'fips140' "/tmp/${so}.mod"
              else
                if grep -q 'fips140' "/tmp/${so}.mod"; then
                  echo "non-fips ${so}.so buildinfo contains fips140" >&2
                  exit 1
                fi
              fi
            done
        - name: record bundled wamr
          uses: spdx@v1
          with:
