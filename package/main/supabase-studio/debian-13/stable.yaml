# syntax=dhi.io/build:2-debian13

image: dhi.io/pkg-supabase-studio
variant: runtime
tags:
  - 2026.11.02
  - 2026.11.02-r6
  - 2026.11.02-debian13
  - 2026.11.02-r6-debian13
platforms:
  - linux/amd64
  - linux/arm64
dates:
  release: "2026-08-03"
vars:
  COMMIT_SHA: a05e7ec1d79e67cba65e3871b7caf105db27f8b1
  DHI_TEST_DEB_EXPECTED_FILES: /usr/lib/supabase-studio/apps/studio/server.js
  NODEJS_VERSION: 22.23.5-1
  PACKAGE_NAME: supabase-studio
  PNPM_VERSION: 11.13.1
  REL: "6"
  SEMVER_MAJOR_MINOR_VERSION: "2026.11"
  SEMVER_MAJOR_VERSION: "2026"
  SEMVER_VERSION: 2026.11.02
  STUDIO_SHORT_SHA: a05e7ec
  STUDIO_UNTIL: "2026-11-02"
  TURBO_VERSION: 2.9.14
  VERSION: 2026.11.02
contents:
  repositories:
    - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
  keyring:
    - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
  packages:
    - base-files
  builds:
    - name: supabase-studio
      work-dir: ${source.dir}/supabase
      environment:
        CI: "true"
        DOCKER_BUILD: "1"
        NEXT_TELEMETRY_DISABLED: "1"
        PNPM_HOME: /pnpm
        npm_config_python: /usr/bin/python3.13
      caches:
        - path: /pnpm/store
        - path: /root/.cache
      contents:
        repositories:
          - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
        keyring:
          - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
        packages:
          - base-files
          - bash
          - ca-certificates
          - coreutils
          - dpkg
          - findutils
          - g++
          - gcc
          - git
          - grep
          - jq
          - libc6
          - libc6-dev
          - libstdc++6
          - make
          - mawk
          - nodejs-22=22.23.5-1
          - node-corepack
          - npm
          - pkgconf
          - python-3.13
          - sed
        files:
          - url: git+https://github.com/supabase/supabase.git#a05e7ec1d79e67cba65e3871b7caf105db27f8b1
            checksum: a05e7ec1d79e67cba65e3871b7caf105db27f8b1
            path: ${source.dir}/supabase
            spdx:
              name: supabase-studio
              version: 2026.11.02
              packages:
                - name: supabase-studio
                  purl: pkg:github/supabase/supabase@a05e7ec1d79e67cba65e3871b7caf105db27f8b1
                  license: Apache-2.0
            uid: 0
            gid: 0
      pipeline:
        - name: prune studio workspace
          privileged: true
          runs: |
            set -eux -o pipefail

            export PNPM_HOME=/pnpm
            export PATH="${PNPM_HOME}:${PATH}"

            corepack enable
            corepack prepare pnpm@11.13.1 --activate

            pnpm dlx turbo@2.9.14 prune studio --docker
        - name: stage pruned studio tree
          work-dir: ${source.dir}/supabase/out
          runs: |
            set -eux -o pipefail

            cp -a json/. .
            cp -a full/. .
            if [ -d "${source.dir}/supabase/patches" ]; then
              cp -a "${source.dir}/supabase/patches" ./patches
            fi

            rm -f apps/studio/.env
        - name: prepare pnpm for bump
          work-dir: ${source.dir}/supabase/out
          privileged: true
          runs: |
            set -eux -o pipefail

            export PNPM_HOME=/pnpm
            export PATH="${PNPM_HOME}:${PATH}"

            corepack enable
            corepack prepare pnpm@11.13.1 --activate

            pnpm install --frozen-lockfile
        - name: bump pnpm dependencies
          uses: pnpm/bump@v1
          privileged: true
          with:
            bumps: ${source.dir}/patch/pnpm-bumps.json
            downgrade: true
            pnpm-root: ${source.dir}/supabase/out
        - name: build and stage studio
          work-dir: ${source.dir}/supabase/out
          privileged: true
          runs: |
            set -eux -o pipefail

            export PNPM_HOME=/pnpm
            export PATH="${PNPM_HOME}:${PATH}"
            export PNPM_CONFIG_MINIMUM_RELEASE_AGE=0

            corepack enable
            corepack prepare pnpm@11.13.1 --activate

            pnpm install --frozen-lockfile

            rm -f "${source.dir}/supabase/pnpm-workspace.yaml" "${source.dir}/supabase/pnpm-lock.yaml"

            HEAP_MB=$(node -e 'console.log(Math.min(8192, Math.floor(require("os").totalmem()/1024/1024*0.6)))')
            NODE_OPTIONS="--max-old-space-size=${HEAP_MB}" \
              pnpm --filter studio exec next build

            DEST="${target.dir}/usr/lib/supabase-studio"
            mkdir -p "${DEST}/apps/studio/.next"
            cp -a apps/studio/.next/standalone/. "${DEST}/"
            cp -a apps/studio/.next/static "${DEST}/apps/studio/.next/static"
            cp -a apps/studio/public "${DEST}/apps/studio/public"

            test -f "${DEST}/apps/studio/server.js"
            test -z "$(find "${DEST}/node_modules" -path '*/node_modules/sharp' -type d -print -quit)"
            test -z "$(find "${DEST}/node_modules" -path '*/node_modules/@img' -type d -print -quit)"
        - name: verify packaged configuration
          runs: |
            set -eux -o pipefail

            DEST="${target.dir}/usr/lib/supabase-studio"
            test -z "$(find "${DEST}" -name '.env' -type f -print -quit)"

            set +x
            UPSTREAM_DASHBOARD_PASSWORD=$(sed -n 's/^DASHBOARD_PASSWORD=//p' apps/studio/.env)
            UPSTREAM_ANON_KEY=$(sed -n 's/^SUPABASE_ANON_KEY=//p' apps/studio/.env)
            UPSTREAM_SERVICE_KEY=$(sed -n 's/^SUPABASE_SERVICE_KEY=//p' apps/studio/.env)
            UPSTREAM_AI_ANON_KEY=$(sed -n 's/^NEXT_PUBLIC_SUPABASE_ANON_KEY=//p' apps/studio/.env)
            UPSTREAM_AI_URL=$(sed -n 's/^NEXT_PUBLIC_SUPABASE_URL=//p' apps/studio/.env)
            UPSTREAM_HCAPTCHA_SITE_KEY=$(sed -n 's/^NEXT_PUBLIC_HCAPTCHA_SITE_KEY=//p' apps/studio/.env)
            UPSTREAM_POSTGRES_PASSWORD=$(sed -n 's/^POSTGRES_PASSWORD=//p' apps/studio/.env)
            UPSTREAM_LOGFLARE_TOKEN=$(sed -n 's/^LOGFLARE_PRIVATE_ACCESS_TOKEN=//p' apps/studio/.env)
            test -n "${UPSTREAM_DASHBOARD_PASSWORD}"
            test -n "${UPSTREAM_ANON_KEY}"
            test -n "${UPSTREAM_SERVICE_KEY}"
            test -n "${UPSTREAM_AI_ANON_KEY}"
            test -n "${UPSTREAM_AI_URL}"
            test -n "${UPSTREAM_HCAPTCHA_SITE_KEY}"
            test -n "${UPSTREAM_POSTGRES_PASSWORD}"
            test -n "${UPSTREAM_LOGFLARE_TOKEN}"
            if UPSTREAM_AI_URL_MATCHES=$(grep -r -a -F -l -- "${UPSTREAM_AI_URL}" "${DEST}"); then
              for match in ${UPSTREAM_AI_URL_MATCHES}; do
                case "${match}" in
                  "${DEST}"/node_modules/.pnpm/@supabase+mcp-server-supabase@*/node_modules/@supabase/mcp-server-supabase/dist/*) ;;
                  *)
                    echo "upstream development configuration NEXT_PUBLIC_SUPABASE_URL remained in the packaged payload" >&2
                    printf '%s\n' "${match}" >&2
                    exit 1
                    ;;
                esac
              done
            else
              test "$?" -eq 1
            fi
            for upstream_pair in \
              "DASHBOARD_PASSWORD=${UPSTREAM_DASHBOARD_PASSWORD}" \
              "SUPABASE_ANON_KEY=${UPSTREAM_ANON_KEY}" \
              "SUPABASE_SERVICE_KEY=${UPSTREAM_SERVICE_KEY}" \
              "NEXT_PUBLIC_SUPABASE_ANON_KEY=${UPSTREAM_AI_ANON_KEY}" \
              "NEXT_PUBLIC_HCAPTCHA_SITE_KEY=${UPSTREAM_HCAPTCHA_SITE_KEY}" \
              "POSTGRES_PASSWORD=${UPSTREAM_POSTGRES_PASSWORD}" \
              "LOGFLARE_PRIVATE_ACCESS_TOKEN=${UPSTREAM_LOGFLARE_TOKEN}"; do
              upstream_name=${upstream_pair%%=*}
              upstream_value=${upstream_pair#*=}
              if grep -r -a -F -q -- "${upstream_value}" "${DEST}"; then
                echo "upstream development configuration ${upstream_name} remained in the packaged payload" >&2
                grep -r -a -F -l -- "${upstream_value}" "${DEST}" >&2
                exit 1
              fi
            done
            set -x
        - name: generate production sbom
          uses: sbom@v1
          with:
            extra-scanners: javascript-package-cataloger
            prefix: supabase-studio-node-modules
            source: ${target.dir}/usr/lib/supabase-studio
        - name: encode next.js bracket routes
          runs: |
            set -eux -o pipefail

            find "${target.dir}/usr/lib/supabase-studio" -depth -name '*\[*' | while IFS= read -r f; do
              dir=$(dirname "$f")
              base=$(basename "$f")
              safe=$(printf '%s' "$base" | sed 's/\[/__DHI_LB__/g; s/\]/__DHI_RB__/g')
              mv "$f" "${dir}/${safe}"
            done
        - uses: dhi/build-pkg:0
          with:
            depends:
              - ca-certificates-bundle
              - libc6
              - libgomp1
              - libstdc++6
              - netbase
              - nodejs-22
              - tzdata
            description: Supabase Studio self-hosted dashboard (web)
            files:
              - usr/lib/supabase-studio
            formats:
              - deb
            license: Apache-2.0
            name: supabase-studio
            priority: optional
            rel: 6
            section: misc
            url: https://github.com/supabase/supabase
            version: 2026.11.02
        - name: restore next.js bracket routes in the deb
          runs: |
            set -eux -o pipefail

            restore_brackets() {
              find "$1" -depth -name '*__DHI_LB__*' | while IFS= read -r f; do
                dir=$(dirname "$f")
                base=$(basename "$f")
                real=$(printf '%s' "$base" | sed 's#__DHI_LB__#[#g; s#__DHI_RB__#]#g')
                mv "$f" "${dir}/${real}"
              done
            }

            find "${target.dir}/packages/deb" -name '*.deb' ! -name '*-dbgsym*' | while IFS= read -r deb; do
              tmp=$(mktemp -d)
              dpkg-deb -R "$deb" "$tmp"
              restore_brackets "$tmp"
              dpkg-deb -b "$tmp" "$deb"
              rm -rf "$tmp"
            done
      paths:
        - type: file
          path: ${source.dir}/patch/pnpm-bumps.json
          uid: 0
          gid: 0
          source: package/main/supabase-studio/patch/pnpm-bumps.json
os-release:
  name: Docker Hardened Images (Debian)
  id: debian
  version-id: "13"
  version-codename: trixie
  pretty-name: Docker Hardened Images/Debian GNU/Linux 13 (trixie)
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
