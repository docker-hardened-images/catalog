# syntax=dhi.io/build:2-alpine3.24

image: dhi.io/pkg-kubeflow-profile-controller
variant: runtime
tags:
  - 2.0.1-alpine3.24
  - 2.0.1-r0-alpine3.24
platforms:
  - linux/amd64
  - linux/arm64
vars:
  COMMIT_SHA: 7628a2f559bca364c71a42b4f33dcc8f0956be96
  GO_STDLIB_VERSION: 1.26.11
  GOLANG_VERSION: 1.26.11-r1
  REL: "0"
  SEMVER_MAJOR_MINOR_VERSION: "2.0"
  SEMVER_MAJOR_VERSION: "2"
  SEMVER_VERSION: 2.0.1
  VERSION: 2.0.1
contents:
  repositories:
    - https://dhi.io/apk/alpine/v3.24/main
    - https://dhi.io/apk/alpine/v3.23/main
    - https://dl-cdn.alpinelinux.org/alpine/v3.24/main
    - https://dl-cdn.alpinelinux.org/alpine/v3.24/community
  keyring:
    - https://dhi.io/keyring/dhi-apk@docker-0F81AD7700D99184.rsa.pub
  packages:
    - alpine-baselayout-data
  builds:
    - name: kubeflow-profile-controller
      work-dir: /go/src/github.com/kubeflow/dashboard/components/profile-controller
      contents:
        packages:
          - busybox
          - bash
          - ca-certificates-bundle
          - coreutils
          - findutils
          - jq
          - mawk
          - sed
          - golang-1.26=1.26.11-r1
          - golang-1.26-oci-config=1.26.11-r1
        files:
          - url: git+https://github.com/kubeflow/dashboard.git#v2.0.1
            checksum: 7628a2f559bca364c71a42b4f33dcc8f0956be96
            path: /go/src/github.com/kubeflow/dashboard
            spdx:
              name: kubeflow-profile-controller
              version: 2.0.1
              packages:
                - name: kubeflow-profile-controller
                  purl: pkg:golang/github.com/kubeflow/dashboard/components/profile-controller@2.0.1
                  license: Apache-2.0
            uid: 0
            gid: 0
          - url: https://raw.githubusercontent.com/golang/go/go1.26.11/LICENSE
            checksum: sha256:911f8f5782931320f5b8d1160a76365b83aea6447ee6c04fa6d5591467db9dad
            path: /go-stdlib/LICENSE
            uid: 0
            gid: 0
          - url: https://raw.githubusercontent.com/golang/go/go1.26.11/PATENTS
            checksum: sha256:96f408bfae65bf137fc2525d3ecb030271c50c1e90799f87abf8846d8dd505cc
            path: /go-stdlib/PATENTS
            uid: 0
            gid: 0
      pipeline:
        - name: update go dependencies
          uses: go/bump@v3
          with:
            deps:
              - go.opentelemetry.io/otel/trace@v1.47.0
              - golang.org/x/net@v0.62.0
              - golang.org/x/crypto@v0.58.0
              - golang.org/x/text@v0.43.0
              - google.golang.org/grpc@v1.83.2
            download: true
        - uses: go/hermetic@v1
        - name: test
          runs: |
            set -eux -o pipefail

            if [ "false" = "true" ]; then
              export GOFIPS140=v1.0.0
              export GODEBUG=fips140=on
            fi

            go test ./... -count=1
        - name: build
          uses: go/build@v1
          with:
            cgo_enabled: 0
            fips: false
            ldflags:
              - -checklinkname=1
            output: ${target.dir}/usr/bin/kubeflow-profile-controller
            packages: .
        - name: build dev
          uses: go/build@v1
          with:
            cgo_enabled: 0
            fips: false
            ldflags:
              - -checklinkname=1
            output: ${target.dir}/usr/bin/kubeflow-profile-controller-dev
            packages: .
            strip: false
        - name: verify build info
          runs: |
            set -eux -o pipefail

            runtime="${target.dir}/usr/bin/kubeflow-profile-controller"
            dev="${target.dir}/usr/bin/kubeflow-profile-controller-dev"
            test -x "$runtime"
            test -x "$dev"

            go version -m "$runtime" > /tmp/runtime-buildinfo.txt
            go version -m "$dev" > /tmp/dev-buildinfo.txt
            grep -F "$(printf 'path\tgithub.com/kubeflow/dashboard/components/profile-controller')" /tmp/runtime-buildinfo.txt
            grep -F "$(printf 'path\tgithub.com/kubeflow/dashboard/components/profile-controller')" /tmp/dev-buildinfo.txt
            grep -q 'CGO_ENABLED=0' /tmp/runtime-buildinfo.txt
            grep -q 'CGO_ENABLED=0' /tmp/dev-buildinfo.txt

            runtime_ldflags=$(grep -F -- '-ldflags=' /tmp/runtime-buildinfo.txt || true)
            dev_ldflags=$(grep -F -- '-ldflags=' /tmp/dev-buildinfo.txt || true)
            printf '%s\n' "$runtime_ldflags" | grep -Eq '(^|[[:space:]="])-w([[:space:]"]|$)'
            if printf '%s\n' "$runtime_ldflags" "$dev_ldflags" | grep -Eq -- '(^|[[:space:]="])-X[[:space:]]'; then
              echo "no build may pass -X: package main has no such variables at this tag" >&2
              exit 1
            fi
            if printf '%s\n' "$dev_ldflags" | grep -Eq '(^|[[:space:]="])-(s|w)([[:space:]"]|$)'; then
              echo "dev binary must not be built with -s or -w" >&2
              exit 1
            fi
            if grep -F -q -- '-trimpath=true' /tmp/dev-buildinfo.txt; then
              echo "dev binary must not be built with -trimpath" >&2
              exit 1
            fi

            if [ "false" = "true" ]; then
              grep -q 'GOFIPS140=v1.0.0' /tmp/runtime-buildinfo.txt
              grep -q 'GOFIPS140=v1.0.0' /tmp/dev-buildinfo.txt
            else
              if grep -q 'GOFIPS140' /tmp/runtime-buildinfo.txt /tmp/dev-buildinfo.txt; then
                echo "non-FIPS build must not set GOFIPS140" >&2
                exit 1
              fi
            fi
        - name: record module sbom
          uses: spdx@v1
          with:
            license: Apache-2.0
            name: kubeflow-profile-controller
            purl: pkg:golang/github.com/kubeflow/dashboard/components/profile-controller@2.0.1
            version: 2.0.1
        - name: stage sbom
          runs: |
            set -eux -o pipefail

            sbom=/opt/docker/sbom/kubeflow-profile-controller
            test -s "$sbom/.spdx.kubeflow-profile-controller.json"
            install -d "${target.dir}/opt/docker/sbom" "${target.dir}/dev-stage/opt/docker/sbom"
            cp -a "$sbom" "${target.dir}/opt/docker/sbom/"
            cp -a "$sbom" "${target.dir}/dev-stage/opt/docker/sbom/"
            test -s "${target.dir}/opt/docker/sbom/kubeflow-profile-controller/.spdx.kubeflow-profile-controller.json"
            test -s "${target.dir}/dev-stage/opt/docker/sbom/kubeflow-profile-controller/.spdx.kubeflow-profile-controller.json"
        - name: stage licenses
          runs: |
            set -eux -o pipefail

            src=/go/src/github.com/kubeflow/dashboard
            root=$src/components/profile-controller
            bin="${target.dir}/usr/bin/kubeflow-profile-controller"
            devbin="${target.dir}/usr/bin/kubeflow-profile-controller-dev"
            lic="${target.dir}/usr/share/licenses/kubeflow-profile-controller"
            parity="${target.dir}/usr/share/kubeflow-profile-controller/third_party/library"
            devstage="${target.dir}/dev-stage"
            tmp=$(mktemp -d)
            trap 'rm -rf "$tmp"' EXIT

            test -x "$bin"
            test -x "$devbin"

            test -s "$src/LICENSE"
            grep -q 'Apache License' "$src/LICENSE"
            grep -q 'Version 2.0' "$src/LICENSE"
            install -d "$lic"
            install -m644 "$src/LICENSE" "$lic/LICENSE"
            test -s "$lic/LICENSE"

            modules() {
              go version -m "$1" | awk -F'\t' '
                $2 == "dep" { n++; m[n] = $3 "@" $4; next }
                $2 == "=>" {
                  if ($4 == "") { print "local replacement is not supported: " $3 > "/dev/stderr"; exit 1 }
                  m[n] = $3 "@" $4; next
                }
                END { for (i = 1; i <= n; i++) print m[i] }
              '
            }
            modules "$bin" | sort > "$tmp/modules.txt"
            modules "$devbin" | sort > "$tmp/modules-dev.txt"
            test -s "$tmp/modules.txt"
            diff "$tmp/modules.txt" "$tmp/modules-dev.txt"

            cd "$root"
            staged=0
            while IFS=@ read -r mod ver; do
              dir=$(go mod download -json "$mod@$ver" | jq -er .Dir)
              test -d "$dir"
              find "$dir" -mindepth 1 -maxdepth 1 -type f \( -iname 'LICEN[CS]E*' -o -iname 'COPYING*' \) > "$tmp/core"
              test -s "$tmp/core"
              dest="$lic/third_party/$mod@$ver"
              install -d "$dest"
              find "$dir" -mindepth 1 -maxdepth 1 -type f \( -iname 'LICEN[CS]E*' -o -iname 'COPYING*' -o -iname 'COPYRIGHT*' -o -iname 'NOTICE*' -o -iname 'PATENTS*' \) > "$tmp/found"
              while IFS= read -r f; do
                install -m644 "$f" "$dest/"
              done < "$tmp/found"
              notice_expected=$(find "$dir" -mindepth 1 -maxdepth 1 -type f -iname 'NOTICE*' | wc -l)
              notice_copied=$(find "$dest" -mindepth 1 -maxdepth 1 -type f -iname 'NOTICE*' | wc -l)
              test "$notice_expected" -eq "$notice_copied"
              staged=$((staged + 1))
            done < "$tmp/modules.txt"

            test "$staged" -eq "$(wc -l < "$tmp/modules.txt")"

            gover=$(go version -m "$bin" | awk 'NR==1{print $2}' | sed 's/^go//')
            test -n "$gover"
            hostver=$(go env GOVERSION | awk '{print $1}' | sed 's/^go//')
            test "$gover" = "$hostver"
            stdlib="$lic/third_party/go@$gover"
            test -s /go-stdlib/LICENSE
            test -s /go-stdlib/PATENTS
            grep -q 'Copyright 2009 The Go Authors' /go-stdlib/LICENSE
            install -d "$stdlib"
            install -m644 /go-stdlib/LICENSE "$stdlib/LICENSE"
            install -m644 /go-stdlib/PATENTS "$stdlib/PATENTS"
            test -s "$stdlib/LICENSE"
            test -s "$stdlib/PATENTS"

            install -d "$parity"
            install -m644 "$root/third_party/library/license.txt" "$parity/license.txt"
            cmp "$root/third_party/library/license.txt" "$parity/license.txt"
            test -s "$parity/license.txt"

            install -d "$devstage/usr/share/licenses" "$devstage/usr/share"
            rm -rf "$devstage/usr/share/licenses/kubeflow-profile-controller" "$devstage/usr/share/kubeflow-profile-controller"
            cp -a "$lic" "$devstage/usr/share/licenses/"
            cp -a "${target.dir}/usr/share/kubeflow-profile-controller" "$devstage/usr/share/"
            diff -r "$lic" "$devstage/usr/share/licenses/kubeflow-profile-controller"
            diff -r "${target.dir}/usr/share/kubeflow-profile-controller" "$devstage/usr/share/kubeflow-profile-controller"
        - uses: dhi/build-pkg:0
          with:
            description: Kubeflow profile controller, which reconciles Profiles into tenant namespaces
            files:
              - usr/bin/kubeflow-profile-controller
              - usr/share/licenses/kubeflow-profile-controller
              - usr/share/kubeflow-profile-controller
              - opt/docker/sbom/kubeflow-profile-controller
            license: Apache-2.0
            name: kubeflow-profile-controller-2
            rel: 0
            subpackages:
              - files:
                  - path: usr/bin/kubeflow-profile-controller
                    source: usr/bin/kubeflow-profile-controller-dev
                  - path: usr/share/licenses/kubeflow-profile-controller
                    source: dev-stage/usr/share/licenses/kubeflow-profile-controller
                  - path: usr/share/kubeflow-profile-controller
                    source: dev-stage/usr/share/kubeflow-profile-controller
                  - path: opt/docker/sbom/kubeflow-profile-controller
                    source: dev-stage/opt/docker/sbom/kubeflow-profile-controller
                name: kubeflow-profile-controller-2-dev
            url: https://github.com/kubeflow/dashboard
            version: 2.0.1
os-release:
  name: Docker Hardened Images (Alpine)
  id: alpine
  version-id: "3.24"
  pretty-name: Docker Hardened Images/Alpine Linux v3.24
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
