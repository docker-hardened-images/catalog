# syntax=dhi.io/build:2-debian13

image: dhi.io/pkg-kubeflow-pipelines-metadata-writer
variant: runtime
tags:
  - 2.17.0
  - 2.17.0-r2
  - 2.17.0-debian13
  - 2.17.0-r2-debian13
platforms:
  - linux/amd64
vars:
  COMMIT_SHA: 4a3592cb2dd0a91a4652ab93893ec8beda1f3158
  PYTHON_MINOR: "3.11"
  PYTHON_VERSION: 3.11.15-13
  REL: "2"
  SEMVER_MAJOR_MINOR_VERSION: "2.17"
  SEMVER_MAJOR_VERSION: "2"
  SEMVER_VERSION: 2.17.0
  VERSION: 2.17.0
contents:
  packages:
    - base-files
  builds:
    - name: kubeflow-pipelines-metadata-writer
      work-dir: ${source.dir}
      contents:
        repositories:
          - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
        keyring:
          - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
        packages:
          - bash
          - build-essential
          - ca-certificates
          - coreutils
          - findutils
          - gawk
          - grep
          - libffi-dev
          - libssl-dev
          - libstdc++6
          - sed
          - libpython-3.11-minimal=3.11.15-13
          - libpython-3.11-stdlib=3.11.15-13
          - libpython-3.11=3.11.15-13
          - python-3.11-minimal=3.11.15-13
          - python-3.11=3.11.15-13
          - python-3.11-dev=3.11.15-13
          - python3-pip
          - python3-setuptools
          - python3-venv
          - python3-wheel
        files:
          - url: git+https://github.com/kubeflow/pipelines.git#2.17.0
            checksum: 4a3592cb2dd0a91a4652ab93893ec8beda1f3158
            path: ${source.dir}/kubeflow-pipelines
            spdx:
              name: kubeflow-pipelines
              version: 2.17.0
              packages:
                - name: kubeflow-pipelines
                  purl: pkg:github/kubeflow/pipelines@2.17.0#backend/metadata_writer
                  license: Apache-2.0
            uid: 0
            gid: 0
      pipeline:
        - name: apply dependency CVE pins
          work-dir: ${source.dir}/kubeflow-pipelines/backend/metadata_writer
          runs: |
            set -eux -o pipefail

            sed -i \
              's/pyasn1==0\.6\.3/pyasn1==0.6.4/g; s/cryptography==.*/cryptography==50.0.0/g' \
              requirements.txt
        - name: build venv at final path and stage it
          privileged: true
          runs: |
            set -eux -o pipefail

            export SOURCE_DIR="${source.dir}" \
              TARGET_DIR="${target.dir}" \
              PYTHON_BIN=/usr/bin/python3.11 \
              METADATA_WRITER_DIR="${source.dir}/kubeflow-pipelines/backend/metadata_writer"
            bash "${source.dir}/build-metadata-writer.sh"
        - uses: dhi/build-pkg:0
          with:
            deb:
              depends:
                - libstdc++6
                - libgcc-s1
            depends:
              - python-3.11
            description: Kubeflow Pipelines metadata writer service
            files:
              - usr/lib/kubeflow-pipelines-metadata-writer
            formats:
              - deb
            license: Apache-2.0
            name: kubeflow-pipelines-metadata-writer
            rel: 2
            url: https://www.kubeflow.org/docs/components/pipelines/
            version: 2.17.0
      paths:
        - type: file
          path: ${source.dir}/build-metadata-writer.sh
          uid: 0
          gid: 0
          mode: "0755"
          source: package/main/kubeflow-pipelines-metadata-writer/build-metadata-writer.sh
os-release:
  name: Docker Hardened Images (Debian)
  id: debian
  version-id: "13"
  version-codename: trixie
  pretty-name: Docker Hardened Images/Debian GNU/Linux 13 (trixie)
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
