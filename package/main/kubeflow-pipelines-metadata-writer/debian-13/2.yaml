# syntax=dhi.io/build:2-debian13

image: dhi.io/pkg-kubeflow-pipelines-metadata-writer
variant: runtime
tags:
  - 2.18.1
  - 2.18.1-r1
  - 2.18.1-debian13
  - 2.18.1-r1-debian13
platforms:
  - linux/amd64
vars:
  COMMIT_SHA: 7dd28116ad652bfb7b6c282e7920be84e6a7634a
  PYTHON_MINOR: "3.11"
  PYTHON_VERSION: 3.11.18-8
  REL: "1"
  SEMVER_MAJOR_MINOR_VERSION: "2.18"
  SEMVER_MAJOR_VERSION: "2"
  SEMVER_VERSION: 2.18.1
  VERSION: 2.18.1
contents:
  repositories:
    - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
  keyring:
    - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
  packages:
    - base-files
  builds:
    - name: kubeflow-pipelines-metadata-writer
      work-dir: ${source.dir}
      contents:
        repositories:
          - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
        keyring:
          - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
        packages:
          - bash
          - build-essential
          - ca-certificates
          - coreutils
          - findutils
          - gawk
          - grep
          - libffi-dev
          - libssl-dev
          - libstdc++6
          - sed
          - libpython-3.11-minimal=3.11.18-8
          - libpython-3.11-stdlib=3.11.18-8
          - libpython-3.11=3.11.18-8
          - python-3.11-minimal=3.11.18-8
          - python-3.11=3.11.18-8
          - python-3.11-dev=3.11.18-8
          - python3-pip
          - python3-setuptools
          - python3-venv
          - python3-wheel
        files:
          - url: git+https://github.com/kubeflow/pipelines.git#2.18.1
            checksum: 7dd28116ad652bfb7b6c282e7920be84e6a7634a
            path: ${source.dir}/kubeflow-pipelines
            spdx:
              name: kubeflow-pipelines
              version: 2.18.1
              packages:
                - name: kubeflow-pipelines
                  purl: pkg:github/kubeflow/pipelines@2.18.1#backend/metadata_writer
                  license: Apache-2.0
            uid: 0
            gid: 0
      pipeline:
        - name: bump python dependencies
          uses: python/bump@v1
          work-dir: ${source.dir}/kubeflow-pipelines/backend/metadata_writer
          privileged: true
          with:
            bumps: ${source.dir}/patch/python-bumps.json
        - name: build venv at final path and stage it
          privileged: true
          runs: |
            set -eux -o pipefail

            export SOURCE_DIR="${source.dir}" \
              TARGET_DIR="${target.dir}" \
              PYTHON_BIN=/usr/bin/python3.11 \
              METADATA_WRITER_DIR="${source.dir}/kubeflow-pipelines/backend/metadata_writer"
            bash "${source.dir}/build-metadata-writer.sh"
        - uses: dhi/build-pkg:0
          with:
            deb:
              depends:
                - libstdc++6
                - libgcc-s1
            depends:
              - python-3.11
            description: Kubeflow Pipelines metadata writer service
            files:
              - usr/lib/kubeflow-pipelines-metadata-writer
            formats:
              - deb
            license: Apache-2.0
            name: kubeflow-pipelines-metadata-writer
            rel: 1
            url: https://www.kubeflow.org/docs/components/pipelines/
            version: 2.18.1
      paths:
        - type: file
          path: ${source.dir}/build-metadata-writer.sh
          uid: 0
          gid: 0
          mode: "0755"
          source: package/main/kubeflow-pipelines-metadata-writer/build-metadata-writer.sh
        - type: file
          path: ${source.dir}/patch/python-bumps.json
          uid: 0
          gid: 0
          source: package/main/kubeflow-pipelines-metadata-writer/patch/python-bumps.json
os-release:
  name: Docker Hardened Images (Debian)
  id: debian
  version-id: "13"
  version-codename: trixie
  pretty-name: Docker Hardened Images/Debian GNU/Linux 13 (trixie)
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
