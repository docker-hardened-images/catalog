      caches:
        - path: /root/.npm
      contents:
        packages:
          - bash
          - busybox
          - ca-certificates-bundle
          - coreutils
          - nodejs-24=24.19.0-r0
          - npm
        files:
          - url: git+https://github.com/brave/brave-search-mcp-server.git#v2.1.0
