            npm ci --ignore-scripts
            npm run build

            rm -rf node_modules

            npm ci --ignore-scripts --omit=dev

            mkdir -p "${target.dir}/usr/lib/nodejs/brave-search-mcp"
            cp -a dist node_modules package.json "${target.dir}/usr/lib/nodejs/brave-search-mcp/"
