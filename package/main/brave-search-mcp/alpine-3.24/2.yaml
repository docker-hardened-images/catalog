# syntax=dhi.io/build:2-alpine3.24

image: dhi.io/pkg-brave-search-mcp
variant: runtime
tags:
  - 2.1.4-alpine3.24
  - 2.1.4-r2-alpine3.24
platforms:
  - linux/amd64
  - linux/arm64
dates:
  release: "2026-06-15"
vars:
  COMMIT_SHA: 8bcb302657b0f072612c2f3e53182ff17912013c
  NODEJS_VERSION: 24.22.1-r1
  REL: "2"
  SEMVER_MAJOR_MINOR_VERSION: "2.1"
  SEMVER_MAJOR_VERSION: "2"
  SEMVER_VERSION: 2.1.4
  VERSION: 2.1.4
contents:
  repositories:
    - https://dhi.io/apk/alpine/v3.24/main
    - https://dhi.io/apk/alpine/v3.23/main
    - https://dl-cdn.alpinelinux.org/alpine/v3.24/main
    - https://dl-cdn.alpinelinux.org/alpine/v3.24/community
  keyring:
    - https://dhi.io/keyring/dhi-apk@docker-0F81AD7700D99184.rsa.pub
  packages:
    - alpine-baselayout-data
  builds:
    - name: brave-search-mcp
      work-dir: ${source.dir}/brave-search-mcp
      caches:
        - path: /root/.npm
      contents:
        packages:
          - bash
          - busybox
          - ca-certificates-bundle
          - coreutils
          - nodejs-24=24.22.1-r1
          - npm
        files:
          - url: git+https://github.com/brave/brave-search-mcp-server.git#v2.1.4
            checksum: 8bcb302657b0f072612c2f3e53182ff17912013c
            path: ${source.dir}/brave-search-mcp
            spdx:
              name: brave-search-mcp
              version: 2.1.4
              packages:
                - name: brave-search-mcp
                  purl: pkg:npm/%40brave/brave-search-mcp-server@2.1.4
                  license: MIT
            uid: 0
            gid: 0
      pipeline:
        - name: bump
          uses: npm/bump@v1
          privileged: true
          environment:
            DHI_NO_SFW: "true"
          with:
            bumps: ${source.dir}/patch/npm-bumps.json
            npm-root: ${source.dir}/brave-search-mcp
        - name: build
          privileged: true
          runs: |
            set -eux -o pipefail

            cd "${source.dir}/brave-search-mcp"

            npm ci --ignore-scripts
            npm run build

            rm -rf node_modules

            npm ci --ignore-scripts --omit=dev
        - name: production node_modules sbom
          uses: sbom@v1
          with:
            extra-scanners: javascript-package-cataloger
            prefix: brave-search-mcp-npm
            source: ${source.dir}/brave-search-mcp/node_modules
        - name: stage payload
          runs: |
            set -eux -o pipefail

            mkdir -p "${target.dir}/usr/lib/nodejs/brave-search-mcp"
            cp -a "${source.dir}/brave-search-mcp/dist" \
              "${source.dir}/brave-search-mcp/node_modules" \
              "${source.dir}/brave-search-mcp/package.json" \
              "${target.dir}/usr/lib/nodejs/brave-search-mcp/"
        - uses: dhi/build-pkg:0
          with:
            description: Brave Search MCP server (Model Context Protocol server for the Brave Search API)
            files:
              - usr/lib/nodejs/brave-search-mcp
            license: MIT
            name: brave-search-mcp
            rel: 2
            url: https://github.com/brave/brave-search-mcp-server
            version: 2.1.4
      paths:
        - type: file
          path: ${source.dir}/patch/npm-bumps.json
          uid: 0
          gid: 0
          source: package/main/brave-search-mcp/patch/npm-bumps.json
os-release:
  name: Docker Hardened Images (Alpine)
  id: alpine
  version-id: "3.24"
  pretty-name: Docker Hardened Images/Alpine Linux v3.24
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
