# syntax=dhi.io/build:2-alpine3.24

image: dhi.io/pkg-valkey-operator
variant: runtime
tags:
  - 0.8.0-alpine3.24
  - 0.8.0-r3-alpine3.24
platforms:
  - linux/amd64
  - linux/arm64
vars:
  COMMIT_SHA: c41fb27b4314cb9d21d0adfd9277df509bd3fc06
  GOLANG_MAJOR_MINOR_VERSION: "1.26"
  GOLANG_VERSION: 1.26.10-r0
  PACKAGE_NAME: valkey-operator
  REDIS_EXPORTER_REFERENCE: dhi/redis-exporter:1.96.0-debian13@sha256:2dbb1f3ab55ce1d070fcd6810d2ffb72935d94c4648aa88346f63b86744828b2
  REL: "3"
  SEMVER_MAJOR_MINOR_VERSION: "0.8"
  SEMVER_MAJOR_VERSION: "0"
  SEMVER_VERSION: 0.8.0
  VALKEY_REFERENCE: dhi/valkey:9.1.3-debian13@sha256:05423c4d5017523814fb66cb1ee7cf50c34bff94a35b03aecb71e331e41790d5
  VERSION: 0.8.0
contents:
  repositories:
    - https://dhi.io/apk/alpine/v3.24/main
    - https://dhi.io/apk/alpine/v3.23/main
    - https://dl-cdn.alpinelinux.org/alpine/v3.24/main
    - https://dl-cdn.alpinelinux.org/alpine/v3.24/community
  keyring:
    - https://dhi.io/keyring/dhi-apk@docker-0F81AD7700D99184.rsa.pub
  packages:
    - alpine-baselayout-data
  builds:
    - name: valkey-operator
      work-dir: /go/src/github.com/valkey-io/valkey-operator
      contents:
        packages:
          - busybox
          - bash
          - ca-certificates-bundle
          - coreutils
          - findutils
          - gettext-envsubst
          - mawk
          - golang-1.26=1.26.10-r0
          - golang-1.26-oci-config=1.26.10-r0
        files:
          - url: git+https://github.com/valkey-io/valkey-operator.git#v0.8.0
            checksum: c41fb27b4314cb9d21d0adfd9277df509bd3fc06
            path: /go/src/github.com/valkey-io/valkey-operator
            spdx:
              name: valkey-operator
              version: 0.8.0
              packages:
                - name: valkey-operator
                  purl: pkg:golang/github.com/valkey-io/valkey-operator@0.8.0
                  license: Apache-2.0
            uid: 0
            gid: 0
      pipeline:
        - name: default the exporter and server sidecars to DHI images
          uses: patch@v1
          with:
            options: -p1
            patches:
              - ${source.dir}/patch/dhi-default-images.patch
        - name: interpolate DHI image references into patched defaults
          runs: |
            set -eux -o pipefail

            export VALKEY_REFERENCE="dhi/valkey:9.1.3-debian13@sha256:05423c4d5017523814fb66cb1ee7cf50c34bff94a35b03aecb71e331e41790d5"
            export REDIS_EXPORTER_REFERENCE="dhi/redis-exporter:1.96.0-debian13@sha256:2dbb1f3ab55ce1d070fcd6810d2ffb72935d94c4648aa88346f63b86744828b2"

            file=internal/controller/valkeycluster_controller.go
            envsubst '$VALKEY_REFERENCE $REDIS_EXPORTER_REFERENCE' < "$file" > "$file.tmp"
            mv "$file.tmp" "$file"

            grep -qF "$VALKEY_REFERENCE" "$file"
            grep -qF "$REDIS_EXPORTER_REFERENCE" "$file"
        - name: update go dependencies
          uses: go/bump@v2
          with:
            deps:
              - golang.org/x/net@v0.60.0
              - github.com/google/cel-go@v0.30.0
              - google.golang.org/grpc@v1.83.2
              - go.opentelemetry.io/otel@v1.45.0
              - go.opentelemetry.io/otel/sdk@v1.45.0
              - go.opentelemetry.io/otel/exporters/otlp/otlptrace@v1.45.0
              - go.opentelemetry.io/otel/exporters/otlp/otlptrace/otlptracegrpc@v1.45.0
            replaces:
              - google.golang.org/grpc=google.golang.org/grpc@v1.83.2
              - go.opentelemetry.io/contrib/instrumentation/net/http/otelhttp=go.opentelemetry.io/contrib/instrumentation/net/http/otelhttp@v0.69.0
            tidy: true
        - uses: go/hermetic@v1
        - name: test
          runs: |
            set -eux -o pipefail

            go test -v -count=1 ./api/... ./internal/valkey/...
        - name: build
          uses: go/build@v1
          with:
            fips: false
            output: ${target.dir}/usr/bin/manager
            packages: ./cmd
        - name: build dev
          uses: go/build@v1
          with:
            fips: false
            output: ${target.dir}/usr/bin/manager-dev
            packages: ./cmd
            strip: false
        - uses: dhi/build-pkg:0
          with:
            description: Kubernetes operator for managing Valkey on Kubernetes
            files:
              - usr/bin/manager
            license: Apache-2.0
            name: valkey-operator
            rel: 3
            subpackages:
              - files:
                  - path: usr/bin/manager
                    source: usr/bin/manager-dev
                name: valkey-operator-dev
            url: https://github.com/valkey-io/valkey-operator
            version: 0.8.0
      paths:
        - type: file
          path: ${source.dir}/patch/dhi-default-images.patch
          uid: 0
          gid: 0
          source: package/main/valkey-operator/alpine-3.24/patch/dhi-default-images.patch
os-release:
  name: Docker Hardened Images (Alpine)
  id: alpine
  version-id: "3.24"
  pretty-name: Docker Hardened Images/Alpine Linux v3.24
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
