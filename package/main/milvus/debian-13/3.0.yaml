# syntax=dhi.io/build:2-debian13

image: dhi.io/pkg-milvus
variant: runtime
tags:
  - 3.0.5
  - 3.0.5-r2
  - 3.0.5-debian13
  - 3.0.5-r2-debian13
platforms:
  - linux/amd64
  - linux/arm64
dates:
  release: "2026-07-29"
vars:
  CARGO_VERSION: 1.97.1-0
  COMMIT_SHA: af15c807513eb6508ae22d0f3a6484e8937be1a5
  GOLANG_VERSION: 1.26.10-0
  MILVUS_ENTITLEMENT: ""
  MILVUS_PACKAGE_SUFFIX: ""
  MILVUS_STORAGE_COMMIT_SHA: f38765d83a35d729a7cbfe8e1caed6246d45e06d
  MILVUS_STORAGE_PIN: f38765d
  PACKAGE_NAME: milvus-3.0
  REL: "2"
  RUSTC_VERSION: 1.97.1-0
  SEMVER_MAJOR_MINOR_VERSION: "3.0"
  SEMVER_MAJOR_VERSION: "3"
  SEMVER_VERSION: 3.0.5
  VERSION: 3.0.5
contents:
  repositories:
    - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
  keyring:
    - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
  packages:
    - base-files
  builds:
    - name: milvus-3.0
      work-dir: ${source.dir}/milvus
      environment:
        GOFLAGS: -mod=mod
        GOTOOLCHAIN: local
      contents:
        packages:
          - bash
          - coreutils
          - libc-bin
          - findutils
          - diffutils
          - sed
          - grep
          - gawk
          - tar
          - gzip
          - bzip2
          - xz-utils
          - unzip
          - file
          - make
          - gcc
          - g++
          - binutils
          - pkgconf
          - autoconf
          - automake
          - libtool
          - m4
          - patch
          - patchelf
          - linux-libc-dev
          - git
          - ca-certificates
          - curl
          - perl
          - python3
          - python3-venv
          - golang-1.26=1.26.10-0
          - libc6-dev
          - cargo-1.97=1.97.1-0
          - rustc-1.97=1.97.1-0
          - libcurl4t64
          - libsqlite3-0
          - libssl3t64
          - zlib1g
          - libssl-dev
          - libclang-dev
          - libaio-dev
        files:
          - url: git+https://github.com/milvus-io/milvus#v3.0.5
            checksum: af15c807513eb6508ae22d0f3a6484e8937be1a5
            path: ${source.dir}/milvus
            uid: 0
            gid: 0
          - url: git+https://github.com/milvus-io/milvus-storage#f38765d83a35d729a7cbfe8e1caed6246d45e06d
            checksum: f38765d83a35d729a7cbfe8e1caed6246d45e06d
            path: ${source.dir}/milvus-storage
            uid: 0
            gid: 0
      pipeline:
        - name: install conan toolchain
          privileged: true
          runs: |
            set -eux -o pipefail

            python3 -m venv /opt/conan-venv
            /opt/conan-venv/bin/pip install conan==2.25.1 cmake==3.31.10

            /opt/conan-venv/bin/conan remote add default-conan-local2 https://milvus01.jfrog.io/artifactory/api/conan/default-conan-local2
            /opt/conan-venv/bin/conan download 'aws-sdk-cpp/1.11.842@milvus/dev#363556887f622db23a10168c108dd55d' -r default-conan-local2 --only-recipe
            aws_cache="$(/opt/conan-venv/bin/conan cache path 'aws-sdk-cpp/1.11.842@milvus/dev#363556887f622db23a10168c108dd55d')"
            mkdir -p "${source.dir}/aws-sdk-cpp-recipe"
            cp "$aws_cache/conanfile.py" "$aws_cache/conandata.yml" "${source.dir}/aws-sdk-cpp-recipe/"
        - name: apply dhi patches
          uses: patch@v1
          with:
            options: -p1
            patches:
              - ${source.dir}/patch/3.0/dhi-build-gcc14-third-party-flags.patch
              - ${source.dir}/patch/3.0/dhi-cve-conan-third-party-pins.patch
              - ${source.dir}/patch/3.0/dhi-build-tantivy-system-cargo.patch
              - ${source.dir}/patch/dhi-cve-avro-map-alloc-cap.patch
        - name: patch the aws-sdk-cpp conan recipe
          uses: patch@v1
          work-dir: ${source.dir}/aws-sdk-cpp-recipe
          with:
            options: -p1
            patches:
              - ${source.dir}/patch/3.0/dhi-build-aws-sdk-cpp-conan-zlib.patch
        - name: export the patched aws-sdk-cpp conan recipe
          runs: |
            set -eux -o pipefail

            /opt/conan-venv/bin/conan export "${source.dir}/aws-sdk-cpp-recipe" --name aws-sdk-cpp --version 1.11.842 --user milvus --channel dev 2>&1 | tee /tmp/aws-sdk-cpp-export.log
            grep -q 'Exported: aws-sdk-cpp/1.11.842@milvus/dev#aa0f9d1c24c8d33e75e9d0369a7f1c8f' /tmp/aws-sdk-cpp-export.log
        - name: update go dependencies
          uses: go/bump@v3
          with:
            add:
              - github.com/iskorotkov/avro/v2@v2.33.1
            deps:
              - golang.org/x/crypto@v0.58.0
              - golang.org/x/net@v0.62.0
              - github.com/go-jose/go-jose/v4@v4.1.6
              - github.com/klauspost/compress@v1.20.2
              - github.com/andybalholm/brotli@v1.2.7
            pin-only: true
            replaces:
              - github.com/hamba/avro/v2=github.com/iskorotkov/avro/v2@v2.34.0
        - name: fetch milvus-proto and protoc plugins
          privileged: true
          runs: |
            set -eux -o pipefail

            make download-milvus-proto get-proto-deps
        - name: update tantivy binding dependencies
          uses: cargo/bump@v1
          work-dir: ${source.dir}/milvus/internal/core/thirdparty/tantivy/tantivy-binding
          with:
            deps:
              - rustls-webpki@0.103.16
              - rustls@0.23.46
              - oneshot@0.1.13
              - tar@0.4.46
              - bytes@1.11.1
              - time@0.3.47
              - rand@0.9.2@0.9.3
              - rand@0.8.5@0.8.6
              - anyhow@1.0.103
              - h2@0.4.16
              - event-listener@5.4.2
              - memmap2@0.9.8@0.9.11
              - crossbeam-epoch@0.9.20
              - tokio@1.51.6
              - webpki-roots@1.0.10
        - name: update storage bridge dependencies
          uses: cargo/bump@v1
          work-dir: ${source.dir}/milvus-storage/cpp/src/format/bridge/rust
          with:
            deps:
              - rustls-webpki@0.103.16
              - rustls@0.23.46
              - lz4_flex@0.11.5@0.11.6
              - serde_with@3.21.0
              - cxx@1.0.195
              - rsa@0.9.10
              - rand@0.9.2@0.9.3
              - rand@0.8.5@0.8.6
              - anyhow@1.0.103
              - h2@0.4.16
              - event-listener@5.4.2
              - crossbeam-epoch@0.9.20
              - tokio@1.53.3
              - webpki-roots@1.0.10
              - zstd@0.13.4
              - zstd-safe@7.4.0
              - zstd-sys@2.1.2+zstd.1.5.7
              - xxhash-rust@0.8.16
              - ctutils@0.4.4
              - arrow-data@57.3.0@57.3.2
              - arrow-data@58.3.0@58.4.1
        - name: build milvus c++ core
          privileged: true
          runs: |
            set -eux -o pipefail

            export PATH="/opt/conan-venv/bin:$PATH"

            grep -q "^set( milvus-storage_VERSION f38765d)" internal/core/thirdparty/milvus-storage/CMakeLists.txt
            case "f38765d83a35d729a7cbfe8e1caed6246d45e06d" in
              "f38765d"*) ;;
              *)
                echo "milvus-storage checkout f38765d83a35d729a7cbfe8e1caed6246d45e06d is not the pinned f38765d"
                exit 1
                ;;
            esac

            mem_gb=$(awk '/MemTotal/ { printf "%d", $2 / 1048576 }' /proc/meminfo)
            jobs=$((mem_gb / 6))
            [ "$jobs" -ge 1 ] || jobs=1
            [ "$jobs" -le "$(nproc)" ] || jobs=$(nproc)
            export jobs
            export CARGO_BUILD_JOBS="$jobs"
            export CMAKE_EXTRA_ARGS="-DFETCHCONTENT_SOURCE_DIR_MILVUS-STORAGE=${source.dir}/milvus-storage"
            echo "core build jobs: $jobs (${mem_gb} GiB, $(nproc) cpus)"

            make build-cpp print-build-info 2>&1 | tee /tmp/core-build.log || {
              grep -n -B2 -A12 -E '(^|[^[:alnum:]_./-])error(\[|:)|Error [0-9]+$|FAILED|undefined reference|collect2|Killed|could not compile|failed to run custom build|signal: 9' /tmp/core-build.log | tail -n 200
              exit 1
            }
        - name: migrate avro imports to maintained fork
          uses: patch@v1
          with:
            options: -p1
            patches:
              - ${source.dir}/patch/3.0/dhi-cve-avro-import-migration.patch
        - name: build milvus binary
          privileged: true
          runs: |
            set -eux -o pipefail

            export PATH="/opt/conan-venv/bin:$PATH"

            make build-go MILVUS_VERSION=3.0.5 BUILD_TAGS=v3.0.5

            install -D -m 0755 bin/milvus "${target.dir}/usr/bin/milvus"
        - name: assemble install tree
          runs: |
            set -eux -o pipefail

            mkdir -p "${target.dir}/usr/lib/milvus"
            cp -a internal/core/output/lib/*.so* "${target.dir}/usr/lib/milvus/"
            if [ -d internal/core/output/lib64 ]; then
              cp -a internal/core/output/lib64/*.so* "${target.dir}/usr/lib/milvus/"
            fi
            rm -f "${target.dir}"/usr/lib/milvus/libssl.so* "${target.dir}"/usr/lib/milvus/libcrypto.so*
            rm -f "${target.dir}"/usr/lib/milvus/libfollybenchmark.so*
            rm -f "${target.dir}"/usr/lib/milvus/libevent_extra*.so* "${target.dir}"/usr/lib/milvus/libevent_openssl*.so* "${target.dir}"/usr/lib/milvus/libevent_pthreads*.so*
            rm -f "${target.dir}"/usr/lib/milvus/librdkafka++*.so*

            mkdir -p "${target.dir}/usr/share/milvus"
            cp -a configs "${target.dir}/usr/share/milvus/configs"
            rm -rf "${target.dir}/usr/share/milvus/configs/pgo" "${target.dir}/usr/share/milvus/configs/cert"

            patchelf --force-rpath --set-rpath /usr/lib/milvus "${target.dir}/usr/bin/milvus"
            find "${target.dir}/usr/lib/milvus" -name '*.so*' ! -type l -exec patchelf --force-rpath --set-rpath /usr/lib/milvus {} +

            LD_LIBRARY_PATH="${target.dir}/usr/lib/milvus" ldd "${target.dir}/usr/bin/milvus" | tee /tmp/ldd-milvus.txt
            if grep -q 'not found' /tmp/ldd-milvus.txt; then
              echo "unresolved shared object in milvus"
              exit 1
            fi
            for lib in "${target.dir}"/usr/lib/milvus/*.so*; do
              [ -L "$lib" ] && continue
              LD_LIBRARY_PATH="${target.dir}/usr/lib/milvus" ldd "$lib" | tee "/tmp/ldd-lib.txt"
              if grep -q 'not found' /tmp/ldd-lib.txt; then
                echo "unresolved shared object in $lib"
                exit 1
              fi
            done
        - name: generate third-party sbom fragments
          runs: |
            set -eux -o pipefail

            export PATH="/opt/conan-venv/bin:$PATH"

            conan graph info internal/core --format=json --no-remote -s build_type=Release -s compiler.version="$(gcc -dumpversion)" -s compiler.libcxx=libstdc++11 -s compiler.cppstd=20 -s:b compiler.cppstd=20 > /tmp/conan-graph.json
            python3 - /tmp/conan-graph.json /tmp/conan-components.txt << 'PY'
            import json, sys
            graph, out = sys.argv[1:3]
            nodes = json.load(open(graph))["graph"]["nodes"]
            with open(out, "w") as f:
                for key, node in nodes.items():
                    if key == "0" or node.get("context") != "host" or not node.get("name"):
                        continue
                    lic = node.get("license") or []
                    lic = " AND ".join(lic) if isinstance(lic, list) else str(lic)
                    f.write("\t".join((node["name"], node["version"], lic, node.get("homepage") or "")) + "\n")
            PY

            {
              (cd internal/core/thirdparty/tantivy/tantivy-binding && cargo tree --locked --offline -e normal --prefix none --format '{p}')
              (cd "${source.dir}/milvus-storage/cpp/src/format/bridge/rust" && cargo tree --locked --offline -e normal --prefix none --format '{p}')
            } | sed 's/ (\*)$//' | sort -u > /tmp/cargo-tree.txt
            wc -l /tmp/conan-components.txt /tmp/cargo-tree.txt

            python3 - "${target.dir}/opt/docker/sbom/milvus-3.0-thirdparty" /tmp/conan-components.txt /tmp/cargo-tree.txt << 'PY'
            import json, os, re, sys

            out, components_path, tree_path = sys.argv[1:4]
            os.makedirs(out, exist_ok=True)

            def write(kind, name, version, purl, license, homepage):
                slug = re.sub(r'[^A-Za-z0-9.-]+', '-', f"{name}-{version}")
                doc = {
                    "spdxVersion": "SPDX-2.3",
                    "dataLicense": "CC0-1.0",
                    "SPDXID": "SPDXRef-DOCUMENT",
                    "name": f"SPDX document for {name} {version}",
                    "documentNamespace": f"https://dhi.io/spdx/milvus-thirdparty/{kind}-{slug}",
                    "creationInfo": {"creators": ["Organization: Docker, Inc.", "Tool: dhi/build"], "created": "1970-01-01T00:00:00Z"},
                    "packages": [{
                        "name": name,
                        "SPDXID": f"SPDXRef-{kind}-{slug}",
                        "versionInfo": version,
                        "downloadLocation": homepage or "NOASSERTION",
                        "filesAnalyzed": False,
                        "licenseConcluded": "NOASSERTION",
                        "licenseDeclared": license or "NOASSERTION",
                        "externalRefs": [{"referenceCategory": "PACKAGE-MANAGER", "referenceType": "purl", "referenceLocator": purl}],
                    }],
                }
                path = os.path.join(out, f".spdx.{kind}-{slug}.json")
                if os.path.exists(path):
                    raise SystemExit(f"duplicate fragment {path}")
                with open(path, "w") as f:
                    json.dump(doc, f, indent=2)
                    f.write("\n")

            count = 0
            for line in open(components_path):
                name, version, lic, homepage = line.rstrip("\n").split("\t")
                if name in ("gtest", "benchmark", "openssl"):
                    continue
                write("conan", name, version, f"pkg:conan/{name}@{version}", lic, homepage)
                count += 1
            print(f"conan components: {count}")

            crates = 0
            for line in open(tree_path):
                m = re.match(r'^(\S+) v(\S+)$', line.strip())
                if not m:
                    continue
                name, version = m.group(1), m.group(2)
                write("cargo", name, version, f"pkg:cargo/{name}@{version}", None, f"https://crates.io/crates/{name}")
                crates += 1
            if crates == 0:
                raise SystemExit("cargo tree produced no registry crates")
            print(f"cargo crates: {crates}")
            PY

            ls -A "${target.dir}/opt/docker/sbom/milvus-3.0-thirdparty" | wc -l
        - name: strip debug symbols
          runs: |
            set -eux -o pipefail

            strip -s "${target.dir}/usr/bin/milvus"
            find "${target.dir}/usr/lib/milvus" -name '*.so*' ! -name 'libmilvus-planparser.so' -exec strip --strip-unneeded {} +
        - uses: dhi/build-pkg:0
          with:
            conflicts: milvus-3.0-fips
            deb:
              depends:
                - milvus-3.0-libs
                - libstdc++6
                - libgomp1
                - libatomic1
                - libaio1t64
                - libssl3t64
                - zlib1g
                - libzstd1
            description: Milvus high-performance, cloud-native vector database
            files:
              - usr/bin/milvus
            formats:
              - deb
            license: Apache-2.0
            name: milvus-3.0
            rel: 2
            subpackages:
              - deb:
                  depends:
                    - libstdc++6
                    - libgomp1
                    - libatomic1
                    - libaio1t64
                    - libssl3t64
                    - zlib1g
                    - libzstd1
                description: Milvus shared C++ core libraries and default configuration
                files:
                  - path: usr/lib/milvus
                  - path: usr/share/milvus
                  - path: opt/docker/sbom/milvus-3.0-thirdparty
                name: milvus-3.0-libs
            url: https://github.com/milvus-io/milvus
            version: 3.0.5
      paths:
        - type: file
          path: ${source.dir}/patch/3.0/dhi-build-gcc14-third-party-flags.patch
          uid: 0
          gid: 0
          source: package/main/milvus/patch/3.0/dhi-build-gcc14-third-party-flags.patch
        - type: file
          path: ${source.dir}/patch/3.0/dhi-cve-conan-third-party-pins.patch
          uid: 0
          gid: 0
          source: package/main/milvus/patch/3.0/dhi-cve-conan-third-party-pins.patch
        - type: file
          path: ${source.dir}/patch/3.0/dhi-build-tantivy-system-cargo.patch
          uid: 0
          gid: 0
          source: package/main/milvus/patch/3.0/dhi-build-tantivy-system-cargo.patch
        - type: file
          path: ${source.dir}/patch/3.0/dhi-build-aws-sdk-cpp-conan-zlib.patch
          uid: 0
          gid: 0
          source: package/main/milvus/patch/3.0/dhi-build-aws-sdk-cpp-conan-zlib.patch
        - type: file
          path: ${source.dir}/patch/dhi-cve-avro-map-alloc-cap.patch
          uid: 0
          gid: 0
          source: package/main/milvus/patch/dhi-cve-avro-map-alloc-cap.patch
        - type: file
          path: ${source.dir}/patch/3.0/dhi-cve-avro-import-migration.patch
          uid: 0
          gid: 0
          source: package/main/milvus/patch/3.0/dhi-cve-avro-import-migration.patch
os-release:
  name: Docker Hardened Images (Debian)
  id: debian
  version-id: "13"
  version-codename: trixie
  pretty-name: Docker Hardened Images/Debian GNU/Linux 13 (trixie)
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
