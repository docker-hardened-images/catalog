# syntax=dhi.io/build:2-alpine3.24

image: dhi.io/pkg-kubeflow-pvcviewer-controller
variant: runtime
tags:
  - 1.11.1-alpine3.24
  - 1.11.1-r0-alpine3.24
platforms:
  - linux/amd64
  - linux/arm64
dates:
  release: "2026-06-04"
vars:
  COMMIT_SHA: 88fbd77f777ceea627101699879b7ed5677b8c09
  GOLANG_VERSION: 1.26.10-r0
  PACKAGE_NAME: kubeflow-pvcviewer-controller-1
  REL: "0"
  SEMVER_MAJOR_MINOR_VERSION: "1.11"
  SEMVER_MAJOR_VERSION: "1"
  SEMVER_VERSION: 1.11.1
  VERSION: 1.11.1
contents:
  repositories:
    - https://dhi.io/apk/alpine/v3.24/main
    - https://dhi.io/apk/alpine/v3.23/main
    - https://dl-cdn.alpinelinux.org/alpine/v3.24/main
    - https://dl-cdn.alpinelinux.org/alpine/v3.24/community
  keyring:
    - https://dhi.io/keyring/dhi-apk@docker-0F81AD7700D99184.rsa.pub
  packages:
    - alpine-baselayout-data
  builds:
    - name: kubeflow-pvcviewer-controller-1
      work-dir: /go/src/github.com/kubeflow/notebooks/components/pvcviewer-controller
      contents:
        packages:
          - busybox
          - bash
          - ca-certificates-bundle
          - coreutils
          - findutils
          - mawk
          - golang-1.26=1.26.10-r0
          - golang-1.26-oci-config=1.26.10-r0
        files:
          - url: git+https://github.com/kubeflow/notebooks.git#v1.11.1
            checksum: 88fbd77f777ceea627101699879b7ed5677b8c09
            path: /go/src/github.com/kubeflow/notebooks
            spdx:
              name: kubeflow-pvcviewer-controller
              version: 1.11.1
              packages:
                - name: kubeflow-pvcviewer-controller
                  purl: pkg:golang/github.com/kubeflow/notebooks/components/pvcviewer-controller@1.11.1
                  license: Apache-2.0
            uid: 0
            gid: 0
          - url: https://raw.githubusercontent.com/golang/go/go1.26.10/LICENSE
            checksum: sha256:911f8f5782931320f5b8d1160a76365b83aea6447ee6c04fa6d5591467db9dad
            path: /go/src/go-license/LICENSE
            uid: 0
            gid: 0
      pipeline:
        - name: update go dependencies
          uses: go/bump@v2
          with:
            deps:
              - golang.org/x/net@v0.62.0
            download: true
        - uses: go/hermetic@v1
        - name: vet
          runs: |
            set -eux -o pipefail

            go vet ./...
        - name: build
          uses: go/build@v1
          with:
            cgo_enabled: 0
            fips: false
            ldflags:
              - -w
            output: ${target.dir}/usr/bin/pvcviewer-controller
            packages: .
        - name: build dev
          uses: go/build@v1
          with:
            cgo_enabled: 0
            fips: false
            ldflags:
              - -buildid=
            output: ${target.dir}/usr/bin/pvcviewer-controller-dev
            packages: .
            strip: false
        - name: verify build info
          runs: |
            set -eux -o pipefail

            runtime=${target.dir}/usr/bin/pvcviewer-controller
            devbin=${target.dir}/usr/bin/pvcviewer-controller-dev
            test -x "$runtime"
            test -x "$devbin"

            go version -m "$runtime" > /tmp/runtime-buildinfo.txt
            go version -m "$devbin" > /tmp/dev-buildinfo.txt

            grep -F -- 'ldflags=-w' /tmp/runtime-buildinfo.txt
            grep -F -- 'trimpath=true' /tmp/runtime-buildinfo.txt
            grep -F -- 'ldflags=-buildid=' /tmp/dev-buildinfo.txt
            if grep -E -- '-X' /tmp/runtime-buildinfo.txt /tmp/dev-buildinfo.txt; then
              echo "no -X may reach the link" >&2
              exit 1
            fi

            for mod in golang.org/x/net:v0.62.0 golang.org/x/text:v0.43.0 golang.org/x/sys:v0.49.0; do
              path=${mod%%:*}
              version=${mod#*:}
              awk -v p="$path" -v v="$version" '$1=="dep" && $2==p && $3==v {found=1} END {exit !found}' /tmp/runtime-buildinfo.txt
            done

            awk '$1=="dep"{print $2, $3}' /tmp/runtime-buildinfo.txt | sort > /tmp/runtime-mods.txt
            awk '$1=="dep"{print $2, $3}' /tmp/dev-buildinfo.txt | sort > /tmp/dev-mods.txt
            diff /tmp/runtime-mods.txt /tmp/dev-mods.txt

            if [ "false" = "true" ]; then
              grep -F 'GOFIPS140' /tmp/runtime-buildinfo.txt
            fi
        - name: stage licenses
          runs: |
            set -eux -o pipefail

            src=/go/src/github.com/kubeflow/notebooks
            comp=$src/components/pvcviewer-controller
            runtime=${target.dir}/usr/bin/pvcviewer-controller
            lic=${target.dir}/usr/share/licenses/kubeflow-pvcviewer-controller
            devlic=${target.dir}/usr/share/licenses/kubeflow-pvcviewer-controller-dev

            test -s "$src/LICENSE"
            grep -q 'Apache License' "$src/LICENSE"

            go version -m "$runtime" | awk '$1=="dep"{print $2, $3}' | sort -u > /tmp/bin-mods.txt
            (cd "$comp" && go list -deps -f '{{with .Module}}{{if not .Main}}{{.Path}} {{.Version}} {{.Dir}}{{end}}{{end}}' .) \
              | awk 'NF' | sort -u > /tmp/dep-mods-dirs.txt
            awk '{print $1, $2}' /tmp/dep-mods-dirs.txt | sort -u > /tmp/dep-mods.txt
            diff /tmp/bin-mods.txt /tmp/dep-mods.txt

            test "$(go env GOVERSION)" = go1.26.10
            grep -q 'Copyright 2009 The Go Authors' /go/src/go-license/LICENSE

            install -d "$lic/third_party/go"
            install -m 0644 "$src/LICENSE" "$lic/LICENSE"
            install -m 0644 /go/src/go-license/LICENSE "$lic/third_party/go/LICENSE"

            while read -r path version dir; do
              test -n "$dir"
              test -d "$dir"
              dest="$lic/third_party/$path"
              install -d "$dest"
              found=$(find "$dir" -maxdepth 1 -type f \( -iname 'LICENSE*' -o -iname 'COPYING*' -o -iname 'NOTICE*' -o -iname 'PATENTS*' \) | wc -l)
              if [ "$found" -lt 1 ]; then
                echo "no license files for $path $version" >&2
                exit 1
              fi
              find "$dir" -maxdepth 1 -type f \( -iname 'LICENSE*' -o -iname 'COPYING*' -o -iname 'NOTICE*' -o -iname 'PATENTS*' \) \
                -exec install -m 0644 {} "$dest/" \;
              test -d "$lic/third_party/$path"
            done < /tmp/dep-mods-dirs.txt

            test -s "$lic/LICENSE"
            grep -q 'Apache License' "$lic/LICENSE"
            test "$(find "$lic/third_party" -mindepth 1 -maxdepth 3 -type d | wc -l)" -ge "$(wc -l < /tmp/dep-mods.txt)"

            install -d "$(dirname "$devlic")"
            cp -a "$lic" "$devlic"
        - name: stage sbom
          runs: |
            set -eux -o pipefail

            test -s /opt/docker/sbom/kubeflow-pvcviewer-controller/.spdx.kubeflow-pvcviewer-controller.json
            install -d "${target.dir}/opt/docker/sbom"
            cp -a /opt/docker/sbom/kubeflow-pvcviewer-controller "${target.dir}/opt/docker/sbom/"
            cp -a "${target.dir}/opt/docker/sbom/kubeflow-pvcviewer-controller" "${target.dir}/opt/docker/sbom/kubeflow-pvcviewer-controller-dev"
            test -s "${target.dir}/opt/docker/sbom/kubeflow-pvcviewer-controller/.spdx.kubeflow-pvcviewer-controller.json"
        - uses: dhi/build-pkg:0
          with:
            commit: 88fbd77f777ceea627101699879b7ed5677b8c09
            description: Kubeflow PVC Viewer controller, reconciles PVCViewer resources into viewer workloads
            files:
              - usr/bin/pvcviewer-controller
              - usr/share/licenses/kubeflow-pvcviewer-controller
              - opt/docker/sbom/kubeflow-pvcviewer-controller
            license: Apache-2.0
            name: kubeflow-pvcviewer-controller-1
            rel: 0
            subpackages:
              - description: Kubeflow PVC Viewer controller debug build
                files:
                  - path: usr/bin/pvcviewer-controller
                    source: usr/bin/pvcviewer-controller-dev
                  - path: usr/share/licenses/kubeflow-pvcviewer-controller
                    source: usr/share/licenses/kubeflow-pvcviewer-controller-dev
                  - path: opt/docker/sbom/kubeflow-pvcviewer-controller
                    source: opt/docker/sbom/kubeflow-pvcviewer-controller-dev
                name: kubeflow-pvcviewer-controller-1-dev
            url: https://github.com/kubeflow/notebooks
            version: 1.11.1
