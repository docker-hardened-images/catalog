image: dhi.io/pkg-ansible-operator
variant: runtime
tags:
  - 1.42.3-alpine3.24
  - 1.42.3-r4-alpine3.24
platforms:
  - linux/amd64
  - linux/arm64
dates:
  release: "2023-09-26"
vars:
  COMMIT_SHA: 292a56a4877c8093037c0533f3ef3c7a6bbd78e2
  GOLANG_MAJOR_MINOR_VERSION: "1.26"
  GOLANG_VERSION: 1.26.8-r0
  KUBERNETES_VERSION: 1.32.0
  PACKAGE_NAME: ansible-operator
  REL: "4"
  SEMVER_MAJOR_MINOR_VERSION: "1.42"
  SEMVER_MAJOR_VERSION: "1"
  SEMVER_VERSION: 1.42.3
  VERSION: 1.42.3
contents:
  repositories:
    - https://dhi.io/apk/alpine/v3.24/main
    - https://dhi.io/apk/alpine/v3.23/main
    - https://dl-cdn.alpinelinux.org/alpine/v3.24/main
    - https://dl-cdn.alpinelinux.org/alpine/v3.24/community
  keyring:
    - https://dhi.io/keyring/dhi-apk@docker-0F81AD7700D99184.rsa.pub
  packages:
    - alpine-baselayout-data
  builds:
    - name: ansible-operator
      work-dir: /go/src/github.com/operator-framework/ansible-operator-plugins
      caches:
        - path: /go/pkg/mod
      contents:
        packages:
          - busybox
          - bash
          - ca-certificates-bundle
          - coreutils
          - findutils
          - golang-1.26
          - golang-1.26-oci-config
        files:
          - url: git+https://github.com/operator-framework/ansible-operator-plugins.git#v1.42.3
            checksum: 292a56a4877c8093037c0533f3ef3c7a6bbd78e2
            path: /go/src/github.com/operator-framework/ansible-operator-plugins
            spdx:
              name: ansible-operator
              version: 1.42.3
              packages:
                - name: ansible-operator
                  purl: pkg:golang/github.com/operator-framework/ansible-operator-plugins@1.42.3
                  license: Apache-2.0
            uid: 0
            gid: 0
      pipeline:
        - name: update go dependencies
          uses: go/bump@v2
          with:
            deps:
              - golang.org/x/net@v0.56.0
              - golang.org/x/text@v0.39.0
              - go.opentelemetry.io/otel@v1.44.0
              - github.com/google/cel-go@v0.30.0
              - google.golang.org/grpc@v1.83.1
            download: true
        - name: test
          environment:
            GODEBUG: ""
          runs: |
            set -eux -o pipefail

            CGO_ENABLED=0 go test -short -count=1 -timeout 5m \
              ./internal/cmd/ansible-operator/version/... \
              ./internal/ansible/paramconv/... \
              ./internal/ansible/flags/... \
              ./internal/ansible/watches/... \
              ./internal/ansible/runner/...
        - name: build ansible-operator
          uses: go/build@v1
          with:
            fips: false
            ldflags:
              - -X 'github.com/operator-framework/ansible-operator-plugins/internal/version.Version=v1.42.3'
              - -X 'github.com/operator-framework/ansible-operator-plugins/internal/version.GitVersion=v1.42.3'
              - -X 'github.com/operator-framework/ansible-operator-plugins/internal/version.GitCommit=292a56a4877c8093037c0533f3ef3c7a6bbd78e2'
              - -X 'github.com/operator-framework/ansible-operator-plugins/internal/version.KubernetesVersion=v1.32.0'
              - -X 'github.com/operator-framework/ansible-operator-plugins/internal/version.ImageVersion=v1.42.3'
            output: ${target.dir}/usr/bin/ansible-operator
            packages: ./cmd/ansible-operator
        - name: build ansible-operator dev
          uses: go/build@v1
          with:
            fips: false
            ldflags:
              - -X 'github.com/operator-framework/ansible-operator-plugins/internal/version.Version=v1.42.3'
              - -X 'github.com/operator-framework/ansible-operator-plugins/internal/version.GitVersion=v1.42.3'
              - -X 'github.com/operator-framework/ansible-operator-plugins/internal/version.GitCommit=292a56a4877c8093037c0533f3ef3c7a6bbd78e2'
              - -X 'github.com/operator-framework/ansible-operator-plugins/internal/version.KubernetesVersion=v1.32.0'
              - -X 'github.com/operator-framework/ansible-operator-plugins/internal/version.ImageVersion=v1.42.3'
            output: ${target.dir}/usr/bin/ansible-operator-dev
            packages: ./cmd/ansible-operator
            strip: false
        - name: verify binaries
          environment:
            GODEBUG: ""
          runs: |
            set -eux -o pipefail

            for binary in \
              "${target.dir}/usr/bin/ansible-operator" \
              "${target.dir}/usr/bin/ansible-operator-dev"; do
              output="$("${binary}" version)"
              printf '%s\n' "${output}"
              printf '%s\n' "${output}" | grep -F 'ansible-operator version: "v1.42.3"'
              printf '%s\n' "${output}" | grep -F 'commit: "292a56a4877c8093037c0533f3ef3c7a6bbd78e2"'
              printf '%s\n' "${output}" | grep -F 'kubernetes version: "v1.32.0"'
            done
        - uses: dhi/build-pkg:0
          with:
            description: Ansible operator runtime binary from the Operator SDK ansible plugins
            files:
              - usr/bin/ansible-operator
            license: Apache-2.0
            name: ansible-operator
            rel: 4
            subpackages:
              - files:
                  - path: usr/bin/ansible-operator
                    source: usr/bin/ansible-operator-dev
                name: ansible-operator-dev
            url: https://github.com/operator-framework/ansible-operator-plugins
            version: 1.42.3
