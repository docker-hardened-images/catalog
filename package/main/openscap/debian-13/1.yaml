# syntax=dhi.io/build:2-debian13

image: dhi.io/pkg-openscap
variant: runtime
tags:
  - 1.4.4
  - 1.4.4-r3
  - 1.4.4-debian13
  - 1.4.4-r3-debian13
platforms:
  - linux/amd64
  - linux/arm64
dates:
  release: "2026-04-09"
vars:
  COMMIT_SHA: 4ac56ce0e6dfdea7215b5ad202b3db20855d2507
  PYTHON_MINOR: "3.13"
  PYTHON_VERSION: 3.13.15-1
  REL: "3"
  SEMVER_MAJOR_MINOR_VERSION: "1.4"
  SEMVER_MAJOR_VERSION: "1"
  SEMVER_VERSION: 1.4.4
  VERSION: 1.4.4
contents:
  packages:
    - base-files
  builds:
    - name: openscap
      work-dir: ${source.dir}/openscap
      contents:
        repositories:
          - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
        keyring:
          - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
        packages:
          - bash
          - coreutils
          - findutils
          - sed
          - grep
          - git
          - ca-certificates
          - gcc
          - g++
          - cmake
          - dpkg-dev
          - pkgconf
          - swig
          - asciidoc
          - doxygen
          - graphviz
          - libacl1-dev
          - libattr1-dev
          - libblkid-dev
          - libbz2-dev
          - libcap-dev
          - libcurl4-openssl-dev
          - libdbus-1-dev
          - libgcrypt20-dev
          - libglib2.0-dev
          - libldap2-dev
          - libpcre2-dev
          - libpopt-dev
          - librpm-dev
          - libselinux1-dev
          - libxml2-dev
          - libxmlsec1-dev
          - libxslt1-dev
          - libyaml-dev
          - libperl-dev
          - libxml-parser-perl
          - libxml-xpath-perl
          - dh-python
          - libpython-3.13=3.13.15-1
          - libpython-3.13-minimal=3.13.15-1
          - libpython-3.13-stdlib=3.13.15-1
          - python-3.13-minimal=3.13.15-1
          - python-3.13=3.13.15-1
          - python-3.13-dev=3.13.15-1
        files:
          - url: git+https://github.com/OpenSCAP/openscap#1.4.4
            checksum: 4ac56ce0e6dfdea7215b5ad202b3db20855d2507
            path: ${source.dir}/openscap
            spdx:
              name: openscap
              version: 1.4.4
              packages:
                - name: openscap
                  purl: pkg:dhi/openscap@1.4.4
                  license: LGPL-2.1-only
            uid: 0
            gid: 0
      pipeline:
        - name: build and install openscap
          privileged: true
          runs: |
            set -eux -o pipefail

            mkdir -p "${target.dir}/usr"
            PYTHON_DESTDIR=/usr/lib/python3/dist-packages
            cmake -B build \
              -DPYTHON_SITE_PACKAGES_INSTALL_DIR="${PYTHON_DESTDIR}" \
              -DENABLE_PYTHON3=ON \
              -DCMAKE_INSTALL_PREFIX=/usr \
              -DCMAKE_INSTALL_LIBDIR=lib \
              -DCMAKE_BUILD_TYPE=Release \
              -DENABLE_PERL=OFF \
              -DENABLE_TESTS=OFF
            VERBOSE=1 cmake --build build
            DESTDIR="${target.dir}" cmake --install build
        - name: prune development payload
          runs: |
            set -eux -o pipefail

            rm -rf "${target.dir}/usr/include" \
              "${target.dir}/usr/lib/pkgconfig"
        - uses: dhi/build-pkg:0
          with:
            depends:
              - libacl1
              - libblkid1
              - libbz2-1.0
              - libcap2
              - libcurl4t64
              - libdbus-1-3
              - libgcrypt20
              - libpcre2-8-0
              - librpm10
              - librpmio10
              - libselinux1
              - libxml2
              - libxmlsec1t64-openssl
              - libxslt1.1
              - libyaml-0-2
            description: OpenSCAP command line tool (oscap) for SCAP content evaluation
            files:
              - usr
            formats:
              - deb
            license: LGPL-2.1-only
            name: openscap
            rel: 3
            subpackages:
              - depends:
                  - openscap
                  - python-3.13
                description: Python bindings for OpenSCAP
                files:
                  - path: usr/lib/python3
                name: openscap-python
              - depends:
                  - bash
                  - openscap-python
                description: OpenSCAP helpers for scanning containers and images
                files:
                  - path: usr/bin/oscap-docker
                  - path: usr/bin/oscap-podman
                name: openscap-container-tools
            url: https://github.com/OpenSCAP/openscap
            version: 1.4.4
os-release:
  name: Docker Hardened Images (Debian)
  id: debian
  version-id: "13"
  version-codename: trixie
  pretty-name: Docker Hardened Images/Debian GNU/Linux 13 (trixie)
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
