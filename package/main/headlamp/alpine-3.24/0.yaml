# syntax=dhi.io/build:2-alpine3.24

image: dhi.io/pkg-headlamp
variant: runtime
tags:
  - 0.46.0-alpine3.24
  - 0.46.0-r4-alpine3.24
platforms:
  - linux/amd64
  - linux/arm64
dates:
  release: "2026-07-29"
vars:
  COMMIT_SHA: 825604fdadbe7ed94b8e61f615d7917c743e9083
  GOLANG_VERSION: 1.26.10-r0
  PACKAGE_NAME: headlamp
  REL: "4"
  SEMVER_MAJOR_MINOR_VERSION: "0.46"
  SEMVER_MAJOR_VERSION: "0"
  SEMVER_VERSION: 0.46.0
  VERSION: 0.46.0
contents:
  repositories:
    - https://dhi.io/apk/alpine/v3.24/main
    - https://dhi.io/apk/alpine/v3.23/main
    - https://dl-cdn.alpinelinux.org/alpine/v3.24/main
    - https://dl-cdn.alpinelinux.org/alpine/v3.24/community
  keyring:
    - https://dhi.io/keyring/dhi-apk@docker-0F81AD7700D99184.rsa.pub
  packages:
    - alpine-baselayout-data
  builds:
    - name: headlamp
      work-dir: /go/src/github.com/kubernetes-sigs/headlamp
      caches:
        - path: /go/pkg/mod
        - path: /root/.cache/go-build
        - path: /root/.npm
      contents:
        packages:
          - bash
          - ca-certificates-bundle
          - coreutils
          - findutils
          - git
          - golang-1.26=1.26.10-r0
          - golang-1.26-oci-config=1.26.10-r0
          - nodejs-22
          - npm
        files:
          - url: git+https://github.com/kubernetes-sigs/headlamp.git#v0.46.0
            checksum: 825604fdadbe7ed94b8e61f615d7917c743e9083
            path: /go/src/github.com/kubernetes-sigs/headlamp
            spdx:
              name: headlamp
              version: 0.46.0
              packages:
                - name: headlamp
                  purl: pkg:golang/github.com/kubernetes-sigs/headlamp/backend@0.46.0
                  license: Apache-2.0
            uid: 0
            gid: 0
      pipeline:
        - name: update go dependencies
          uses: go/bump@v2
          work-dir: /go/src/github.com/kubernetes-sigs/headlamp/backend
          with:
            deps:
              - golang.org/x/crypto@v0.57.0
              - go.opentelemetry.io/otel@v1.45.0
              - go.opentelemetry.io/otel/sdk@v1.45.0
              - go.opentelemetry.io/otel/exporters/otlp/otlptrace@v1.45.0
              - go.opentelemetry.io/otel/exporters/otlp/otlptrace/otlptracegrpc@v1.45.0
              - go.opentelemetry.io/otel/exporters/otlp/otlptrace/otlptracehttp@v1.45.0
              - github.com/containerd/containerd@v1.7.36
              - oras.land/oras-go/v2@v2.6.2
              - google.golang.org/grpc@v1.85.0-dev.0.20260825072537-93e31b48545e
              - golang.org/x/net@v0.62.0
              - github.com/go-jose/go-jose/v4@v4.1.6
            download: true
            replaces:
              - go.opentelemetry.io/otel=go.opentelemetry.io/otel@v1.45.0
              - go.opentelemetry.io/otel/sdk=go.opentelemetry.io/otel/sdk@v1.45.0
              - go.opentelemetry.io/otel/metric=go.opentelemetry.io/otel/metric@v1.45.0
              - go.opentelemetry.io/otel/trace=go.opentelemetry.io/otel/trace@v1.45.0
              - go.opentelemetry.io/otel/sdk/metric=go.opentelemetry.io/otel/sdk/metric@v1.45.0
              - go.opentelemetry.io/otel/exporters/otlp/otlptrace=go.opentelemetry.io/otel/exporters/otlp/otlptrace@v1.45.0
              - go.opentelemetry.io/otel/exporters/otlp/otlptrace/otlptracegrpc=go.opentelemetry.io/otel/exporters/otlp/otlptrace/otlptracegrpc@v1.45.0
              - go.opentelemetry.io/otel/exporters/otlp/otlptrace/otlptracehttp=go.opentelemetry.io/otel/exporters/otlp/otlptrace/otlptracehttp@v1.45.0
        - name: build frontend
          work-dir: /go/src/github.com/kubernetes-sigs/headlamp/frontend
          privileged: true
          runs: |
            set -eux -o pipefail

            npm pkg set dependencies.js-yaml=4.3.2 overrides.js-yaml=4.3.2 overrides.execa=^2.0.0 overrides.fast-uri=^3.1.5 overrides.postcss=^8.5.25 overrides.brace-expansion=^5.0.9 overrides.seroval=1.6.3 overrides.zod=4.6.6
            npm pkg set 'overrides.minimatch@^3.brace-expansion=^1.1.18'
            node -e 'const fs=require("fs");const j=JSON.parse(fs.readFileSync("package.json"));j.overrides=j.overrides||{};j.overrides["ws@>=8.0.0 <8.21.0"]="8.21.0";fs.writeFileSync("package.json",JSON.stringify(j,null,2)+"\n");'
            rm -f package-lock.json
            npm install
            hoisted_ws_ver=$(node -e "process.stdout.write(require('./node_modules/ws/package.json').version)")
            echo "hoisted ws ${hoisted_ws_ver}"
            case "$hoisted_ws_ver" in 8.21.*) ;; *)
              echo "unexpected hoisted ws version ${hoisted_ws_ver}"
              exit 1
              ;;
            esac
            # @rsbuild/core vendors ws under compiled/; npm overrides do not replace it.
            find node_modules -type f -path '*/compiled/ws/package.json' | while read -r compiled_pkg; do
              compiled_dir=$(dirname "$compiled_pkg")
              rm -rf "$compiled_dir"
              cp -a node_modules/ws "$compiled_dir"
            done
            ws_files=$(find node_modules -type f -path '*/ws/package.json' | sort)
            test -n "$ws_files"
            for f in $ws_files; do
              ver=$(node -e "process.stdout.write(require('./' + process.argv[1]).version)" "$f")
              echo "ws ${f} ${ver}"
              case "$ver" in 8.21.*) ;; *)
                echo "unexpected ws version ${ver} in ${f}"
                exit 1
                ;;
              esac
            done
            files=$(find node_modules -type f -path '*/seroval/package.json' | sort)
            test -n "$files"
            for f in $files; do
              ver=$(node -e "process.stdout.write(require('./' + process.argv[1]).version)" "$f")
              echo "seroval ${f} ${ver}"
              test "$ver" = "1.6.3"
            done
            zod_files=$(find node_modules -type f -path '*/zod/package.json' | sort)
            test -n "$zod_files"
            for f in $zod_files; do
              ver=$(node -e "process.stdout.write(require('./' + process.argv[1]).version)" "$f")
              echo "zod ${f} ${ver}"
              case "$ver" in 4.6.*) ;; *)
                echo "unexpected zod version ${ver} in ${f}"
                exit 1
                ;;
              esac
            done
            npm run build
            npm prune --production

            # Strip esbuild/tsgo native binaries so their Go stdlib is not cataloged as phantom CVEs in the sbom.
            rm -rf node_modules/@esbuild node_modules/@typescript
            find node_modules -type d -name esbuild -exec rm -rf {} + 2> /dev/null || true
        - name: frontend sbom
          uses: sbom@v1
          with:
            extra-scanners: javascript-package-cataloger
            prefix: headlamp-frontend
            source: /go/src/github.com/kubernetes-sigs/headlamp/frontend
        - name: test
          work-dir: /go/src/github.com/kubernetes-sigs/headlamp/backend
          runs: |
            set -eux -o pipefail

            CGO_ENABLED=0 go test -short $(go list ./... | grep -vE '/pkg/helm$')
        - name: build headlamp
          uses: go/build@v1
          work-dir: /go/src/github.com/kubernetes-sigs/headlamp/backend
          with:
            fips: false
            ldflags:
              - -X github.com/kubernetes-sigs/headlamp/backend/pkg/kubeconfig.Version=0.46.0
              - -X github.com/kubernetes-sigs/headlamp/backend/pkg/kubeconfig.AppName=Headlamp
            output: ${target.dir}/usr/bin/headlamp-server
            packages: ./cmd
            strip: true
        - name: stage frontend
          runs: |
            set -eux -o pipefail

            mkdir -p ${target.dir}/usr/share/headlamp
            cp -a frontend/build ${target.dir}/usr/share/headlamp/frontend
        - uses: dhi/build-pkg:0
          with:
            description: Headlamp, a fully-featured Kubernetes web UI
            files:
              - usr/bin/headlamp-server
              - usr/share/headlamp/frontend
            license: Apache-2.0
            name: headlamp
            rel: 4
            url: https://headlamp.dev/
            version: 0.46.0
os-release:
  name: Docker Hardened Images (Alpine)
  id: alpine
  version-id: "3.24"
  pretty-name: Docker Hardened Images/Alpine Linux v3.24
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
