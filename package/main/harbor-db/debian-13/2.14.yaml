      pipeline:
        - name: stage harbor-db payload
          runs: |
            set -eux -o pipefail

            mkdir -p "${target.dir}/usr/share/harbor-db/docker-entrypoint-initdb.d"

            install -m 0755 "${source.dir}/docker-entrypoint.sh" "${target.dir}/usr/share/harbor-db/docker-entrypoint.sh"
            install -m 0755 "${source.dir}/docker-healthcheck.sh" "${target.dir}/usr/share/harbor-db/docker-healthcheck.sh"
            install -m 0755 "${source.dir}/initdb.sh" "${target.dir}/usr/share/harbor-db/initdb.sh"
            install -m 0755 "${source.dir}/upgrade.sh" "${target.dir}/usr/share/harbor-db/upgrade.sh"
            install -m 0644 "${source.dir}/initial-registry.sql" "${target.dir}/usr/share/harbor-db/docker-entrypoint-initdb.d/initial-registry.sql"

            sed -i 's|/docker-entrypoint-initdb.d/\*|"${HARBOR_DB_HOME}/docker-entrypoint-initdb.d"/*|g' "${target.dir}/usr/share/harbor-db/initdb.sh"
        - name: verify harbor-db shell scripts
          runs: |
            set -eux -o pipefail

            for script in docker-entrypoint.sh docker-healthcheck.sh initdb.sh upgrade.sh; do
              bash -n "${target.dir}/usr/share/harbor-db/${script}"
            done
        - uses: dhi/build-pkg:0
          with:
            depends:
              - bash
              - coreutils
              - findutils
              - gzip
              - sed
              - tzdata
            description: Harbor registry database scripts and configuration
            files:
              - usr/share/harbor-db
            formats:
              - deb
            license: Apache-2.0
            name: harbor-db-2.14
            rel: 1
            url: https://goharbor.io/
            version: 2.14.4
      paths:
        - type: file
          path: ${source.dir}/docker-entrypoint.sh
          uid: 0
          gid: 0
          mode: "0755"
          source: package/main/harbor-db/bin/docker-entrypoint.sh
