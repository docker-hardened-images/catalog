            gid: 0
          - url: https://raw.githubusercontent.com/goharbor/harbor/79a297f760eb9596c8693727b88c3c568f9c6302/make/photon/db/initial-registry.sql
            checksum: sha256:b3b781de96844a5629f24690a4e7c383dc7929c3ec696a88e5d1afc46fc49ae2
            path: ${source.dir}/initial-registry.sql
            spdx:
              name: harbor-db-initial-registry
              version: 2.14.4
              packages:
                - name: harbor-db-initial-registry
                  purl: pkg:github/goharbor/harbor@2.14.4
                  license: Apache-2.0
            uid: 0
