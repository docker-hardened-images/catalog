# syntax=dhi.io/build:2-alpine3.23

image: dhi.io/pkg-external-snapshotter
variant: runtime
tags:
  - 8.7.0-alpine3.23
  - 8.7.0-r2-alpine3.23
platforms:
  - linux/amd64
  - linux/arm64
dates:
  release: "2026-10-13"
vars:
  COMMIT_SHA: 9cc6050ab00a0c56d84ba0279e518a00367363e7
  GOLANG_MAJOR_MINOR_VERSION: "1.26"
  GOLANG_VERSION: 1.26.10-r0
  PACKAGE_NAME: external-snapshotter-8.7
  REL: "2"
  SEMVER_MAJOR_MINOR_VERSION: "8.7"
  SEMVER_MAJOR_VERSION: "8"
  SEMVER_VERSION: 8.7.0
  VERSION: 8.7.0
contents:
  repositories:
    - https://dhi.io/apk/alpine/v3.23/main
    - https://dl-cdn.alpinelinux.org/alpine/v3.23/main
    - https://dl-cdn.alpinelinux.org/alpine/v3.23/community
  keyring:
    - https://dhi.io/keyring/dhi-apk@docker-0F81AD7700D99184.rsa.pub
  packages:
    - alpine-baselayout-data
  builds:
    - name: external-snapshotter-8.7
      work-dir: /go/src/github.com/kubernetes-csi/external-snapshotter
      caches:
        - path: /go/pkg/mod
      contents:
        packages:
          - busybox
          - bash
          - ca-certificates-bundle
          - coreutils
          - findutils
          - mawk
          - sed
          - golang-1.26=1.26.10-r0
          - golang-1.26-oci-config=1.26.10-r0
        files:
          - url: git+https://github.com/kubernetes-csi/external-snapshotter.git#v8.7.0
            checksum: 9cc6050ab00a0c56d84ba0279e518a00367363e7
            path: /go/src/github.com/kubernetes-csi/external-snapshotter
            spdx:
              name: csi-snapshotter
              version: 8.7.0
              packages:
                - name: csi-snapshotter
                  purl: pkg:golang/github.com/kubernetes-csi/external-snapshotter/v8@8.7.0
                  license: Apache-2.0
            uid: 0
            gid: 0
      pipeline:
        - name: remove vendor directory
          runs: |
            set -eux -o pipefail

            rm -rf vendor
        - name: update go dependencies (8.7 only)
          uses: go/bump@v1
          work-dir: /go/src/github.com/kubernetes-csi/external-snapshotter
          with:
            deps:
              - golang.org/x/net@v0.62.0
              - github.com/google/cel-go@v0.30.0
              - google.golang.org/grpc@v1.85.0-dev.0.20260825072537-93e31b48545e
            download: true
        - name: test snapshot-controller
          runs: |
            set -eux -o pipefail

            CGO_ENABLED=0 go test ./pkg/common-controller ./pkg/metrics -count=1 -v
        - name: build csi-snapshotter
          uses: go/build@v1
          work-dir: /go/src/github.com/kubernetes-csi/external-snapshotter
          with:
            fips: false
            ldflags:
              - -X main.version=8.7.0
            output: ${target.dir}/usr/bin/csi-snapshotter
            packages: ./cmd/csi-snapshotter
        - name: build csi-snapshotter dev
          uses: go/build@v1
          work-dir: /go/src/github.com/kubernetes-csi/external-snapshotter
          with:
            fips: false
            ldflags:
              - -X main.version=8.7.0
            output: ${target.dir}/usr/bin/csi-snapshotter-dev
            packages: ./cmd/csi-snapshotter
            strip: false
        - name: build snapshot-controller
          uses: go/build@v1
          work-dir: /go/src/github.com/kubernetes-csi/external-snapshotter
          with:
            fips: false
            ldflags:
              - -X main.version=8.7.0
            output: ${target.dir}/usr/bin/snapshot-controller
            packages: ./cmd/snapshot-controller
        - name: build snapshot-controller dev
          uses: go/build@v1
          work-dir: /go/src/github.com/kubernetes-csi/external-snapshotter
          with:
            fips: false
            ldflags:
              - -X main.version=8.7.0
            output: ${target.dir}/usr/bin/snapshot-controller-dev
            packages: ./cmd/snapshot-controller
            strip: false
        - uses: dhi/build-pkg:0
          with:
            description: External-snapshotter binaries
            files:
              - usr/bin/csi-snapshotter
            license: Apache-2.0
            name: external-snapshotter-8.7
            rel: 2
            subpackages:
              - files:
                  - path: usr/bin/snapshot-controller
                name: snapshot-controller
              - files:
                  - path: usr/bin/csi-snapshotter
                    source: usr/bin/csi-snapshotter-dev
                name: external-snapshotter-8.7-dev
              - files:
                  - path: usr/bin/snapshot-controller
                    source: usr/bin/snapshot-controller-dev
                name: snapshot-controller-dev
            url: https://github.com/kubernetes-csi/external-snapshotter
            version: 8.7.0
os-release:
  name: Docker Hardened Images (Alpine)
  id: alpine
  version-id: "3.23"
  pretty-name: Docker Hardened Images/Alpine Linux v3.23
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
