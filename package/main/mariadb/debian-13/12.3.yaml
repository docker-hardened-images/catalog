# syntax=dhi.io/build:2-debian13

image: dhi.io/pkg-mariadb
variant: runtime
tags:
  - 12.3.3
  - 12.3.3-r2
  - 12.3.3-debian13
  - 12.3.3-r2-debian13
platforms:
  - linux/amd64
  - linux/arm64
dates:
  release: "2026-02-16"
vars:
  COMMIT_SHA: 83e909fc2a0dbc394b4b683fb3fa2d7dcf26cc5e
  PACKAGE_NAME: mariadb-12.3
  REL: "2"
  SEMVER_MAJOR_MINOR_VERSION: "12.3"
  SEMVER_MAJOR_VERSION: "12"
  SEMVER_VERSION: 12.3.3
  VERSION: 12.3.3
contents:
  repositories:
    - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
  keyring:
    - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
  packages:
    - base-files
  builds:
    - name: mariadb
      work-dir: ${source.dir}/mariadb
      contents:
        packages:
          - bash
          - bison
          - build-essential
          - ca-certificates
          - cmake
          - coreutils
          - diffutils
          - file
          - findutils
          - git
          - gzip
          - libaio-dev
          - libfmt-dev
          - libjemalloc-dev
          - libncurses-dev
          - libnuma-dev
          - libpcre2-dev
          - libssl-dev
          - pkg-config
          - sed
          - tar
          - wget
          - xz-utils
          - zlib1g-dev
        files:
          - url: git+https://github.com/MariaDB/server#mariadb-12.3.3
            checksum: 83e909fc2a0dbc394b4b683fb3fa2d7dcf26cc5e
            path: ${source.dir}/mariadb
            spdx:
              name: mariadb
              version: 12.3.3
              packages:
                - name: mariadb
                  purl: pkg:github/MariaDB/server@mariadb-12.3.3
                  license: GPL-2.0-only
            uid: 0
            gid: 0
      pipeline:
        - name: build
          work-dir: ${source.dir}/mariadb
          runs: |
            set -eux -o pipefail

            cmake -S . -B build \
              -DCMAKE_BUILD_TYPE=Release \
              -DCMAKE_INSTALL_PREFIX=/usr \
              -DCMAKE_INSTALL_LIBDIR=/usr/lib \
              -DMYSQL_DATADIR=/var/lib/mysql \
              -DMYSQL_UNIX_ADDR=/run/mariadb/mariadb.sock \
              -DWITH_DEBUG=OFF \
              -DWITH_UNIT_TESTS=OFF \
              -DINSTALL_MYSQLTESTDIR= \
              -DWITH_JEMALLOC=system \
              -DWITH_PCRE=system \
              -DWITH_LIBFMT=system \
              -DWITH_SSL=system \
              -DWITH_ZLIB=system \
              -DPLUGIN_MROONGA=NO

            cmake --build build --parallel "$(nproc)"

            DESTDIR="${target.dir}" cmake --install build
        - name: split dev payload from install tree
          runs: |
            set -eux -o pipefail

            mkdir -p "${target.dir}/dev"

            mv "${target.dir}/usr/include" "${target.dir}/dev/include"
            mv "${target.dir}/usr/lib/pkgconfig" "${target.dir}/dev/pkgconfig"

            # cmake's standalone layout puts sql-bench at the prefix root; RPM/DEB
            # layouts put it under share/mariadb. Accept whichever this build made.
            for d in usr/sql-bench usr/share/mariadb/sql-bench; do
              if [ -d "${target.dir}/${d}" ]; then
                mv "${target.dir}/${d}" "${target.dir}/dev/sql-bench"
                break
              fi
            done

            find "${target.dir}/usr/lib" -name '*.a' -delete

            for f in COPYING CREDITS INSTALL-BINARY README.md THIRDPARTY; do
              rm -f "${target.dir}/usr/${f}"
            done
        - name: strip
          runs: |
            set -eux -o pipefail

            for dir in "${target.dir}/usr/bin" "${target.dir}/usr/sbin"; do
              [ -d "${dir}" ] || continue
              find "${dir}" -type f -perm /111 | while read -r bin; do
                if file -b "${bin}" | grep -q '^ELF'; then
                  strip "${bin}"
                fi
              done
            done
        - uses: dhi/build-pkg:0
          with:
            depends:
              - libaio1t64
              - libcrypt1
              - libfmt10
              - libjemalloc2
              - libncurses6
              - libnuma1
              - libpcre2-8-0
              - libssl3t64
              - libstdc++6
              - zlib1g
            description: MariaDB open source relational database server
            files:
              - usr
            formats:
              - deb
            license: GPL-2.0-only
            name: mariadb-12.3
            rel: 2
            subpackages:
              - depends:
                  - mariadb-12.3
                description: MariaDB development headers, pkg-config metadata, and sql-bench suite
                files:
                  - path: usr/include
                    source: dev/include
                  - path: usr/lib/pkgconfig
                    source: dev/pkgconfig
                  - path: usr/share/mariadb/sql-bench
                    source: dev/sql-bench
                name: mariadb-12.3-dev
            url: https://mariadb.org/
            version: 12.3.3
os-release:
  name: Docker Hardened Images (Debian)
  id: debian
  version-id: "13"
  version-codename: trixie
  pretty-name: Docker Hardened Images/Debian GNU/Linux 13 (trixie)
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
