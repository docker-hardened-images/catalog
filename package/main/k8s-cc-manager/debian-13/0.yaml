        - name: build venv and stage application tree
          privileged: true
          runs: |
            set -eux -o pipefail

            export SOURCE_DIR="${source.dir}" TARGET_DIR="${target.dir}" \
              PYTHON_BIN=/usr/bin/python3.13 \
              REQUIREMENTS_LOCK="${source.dir}/requirements-lock-deb.txt"
            bash "${source.dir}/build-venv.sh"
        - name: python dependencies sbom
          uses: sbom@v1
          with:
            extra-scanners: python-package-cataloger
            prefix: k8s-cc-manager-python
            source: ${target.dir}/usr/lib/k8s-cc-manager/.venv
        - name: verify python dependencies sbom
          runs: |
            set -eux -o pipefail

            sbom=/opt/docker/sbom/k8s-cc-manager-python/.spdx.k8s-cc-manager-python.json
            test -s "${sbom}"
            jq -e '.packages[] | select(.name == "kubernetes")' "${sbom}" > /dev/null
        - name: stage sbom trees into package root
          runs: |
            set -eux -o pipefail

            install -d "${target.dir}/opt/docker/sbom"
            for d in /opt/docker/sbom/k8s-cc-manager /opt/docker/sbom/k8s-cc-manager-python; do
              test -d "${d}"
              cp -a "${d}" "${target.dir}/opt/docker/sbom/"
            done
            find "${target.dir}/opt/docker/sbom" -type d -exec chmod 0755 {} +
            find "${target.dir}/opt/docker/sbom" -type f -exec chmod 0644 {} +
        - uses: dhi/build-pkg:0
