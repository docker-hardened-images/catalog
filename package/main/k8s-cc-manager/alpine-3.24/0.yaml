          - py3.13-wheel=0.47.0-r0
        files:
          - url: git+https://github.com/NVIDIA/k8s-cc-manager.git#v0.4.3
            checksum: 785d77ea1ab758287c253a9202cf75b3fc85778d
            path: ${source.dir}/k8s-cc-manager
            spdx:
              name: k8s-cc-manager
              version: 0.4.3
              packages:
                - name: k8s-cc-manager
                  purl: pkg:github/NVIDIA/k8s-cc-manager@0.4.3
                  license: Apache-2.0
            uid: 0
            gid: 0
          - url: git+https://github.com/NVIDIA/gpu-admin-tools.git#v2026.09.29
            checksum: 44f261a7ebff96559488230b420e4a3035b30d58
            path: ${source.dir}/gpu-admin-tools
            spdx:
              name: gpu-admin-tools
              version: 2026.09.29
              packages:
                - name: gpu-admin-tools
                  purl: pkg:github/NVIDIA/gpu-admin-tools@2026.09.29
                  license: MIT
            uid: 0
            gid: 0
      pipeline:
        - name: fix watch reconnect sleep import
          uses: patch@v1
          work-dir: ${source.dir}/k8s-cc-manager
          with:
            options: -p1
            patch: ${source.dir}/import-time.patch
        - name: build venv and stage application tree
          privileged: true
          runs: |
            set -eux -o pipefail

            export SOURCE_DIR="${source.dir}" TARGET_DIR="${target.dir}" \
              PYTHON_BIN=/usr/bin/python3.13 \
              REQUIREMENTS_LOCK="${source.dir}/requirements-lock-alpine.txt"
            bash "${source.dir}/build-venv.sh"
        - name: python dependencies sbom
          uses: sbom@v1
          with:
            extra-scanners: python-package-cataloger
            prefix: k8s-cc-manager-python
            source: ${target.dir}/usr/lib/k8s-cc-manager/.venv
        - name: verify python dependencies sbom
          runs: |
            set -eux -o pipefail

            sbom=/opt/docker/sbom/k8s-cc-manager-python/.spdx.k8s-cc-manager-python.json
            test -s "${sbom}"
            jq -e '.packages[] | select(.name == "kubernetes")' "${sbom}" > /dev/null
        - name: stage sbom trees into package root
          runs: |
            set -eux -o pipefail

            install -d "${target.dir}/opt/docker/sbom"
            for d in /opt/docker/sbom/k8s-cc-manager /opt/docker/sbom/k8s-cc-manager-python; do
              test -d "${d}"
              cp -a "${d}" "${target.dir}/opt/docker/sbom/"
            done
            find "${target.dir}/opt/docker/sbom" -type d -exec chmod 0755 {} +
            find "${target.dir}/opt/docker/sbom" -type f -exec chmod 0644 {} +
        - uses: dhi/build-pkg:0
          with:
            apk:
              depends:
                - libffi
                - libstdc++
                - libgcc
            depends:
              - python-3.13
            description: NVIDIA Kubernetes GPU Confidential Computing mode manager
            files:
