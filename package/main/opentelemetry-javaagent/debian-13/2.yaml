# syntax=dhi.io/build:2-debian13

image: dhi.io/pkg-opentelemetry-javaagent
variant: runtime
tags:
  - 2.34.0
  - 2.34.0-r2
  - 2.34.0-debian13
  - 2.34.0-r2-debian13
platforms:
  - linux/amd64
  - linux/arm64
dates:
  release: "2024-01-12"
vars:
  COMMIT_SHA: c220c0c83d8bdf04be7d41276624dfb83b1c91fd
  GRADLE_VERSION: 9.9.1-2
  INSTRUMENTATION_JDK_MAJOR_VERSION: "21"
  INSTRUMENTATION_JDK_VERSION: 1:21.0.13+9-3
  JDK_MAJOR_VERSION: "25"
  JDK_VERSION: 1:25.0.5.1+2-0
  PACKAGE_HOME: /usr/share/opentelemetry-javaagent
  PACKAGE_NAME: opentelemetry-javaagent
  PLUGINS_JDK_MAJOR_VERSION: "17"
  PLUGINS_JDK_VERSION: 1:17.0.21.1+2-0
  REL: "2"
  SEMVER_MAJOR_MINOR_VERSION: "2.34"
  SEMVER_MAJOR_VERSION: "2"
  SEMVER_VERSION: 2.34.0
  VERSION: 2.34.0
contents:
  repositories:
    - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
  keyring:
    - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
  packages:
    - base-files
  builds:
    - name: opentelemetry-javaagent
      work-dir: ${source.dir}/opentelemetry-java-instrumentation
      environment:
        GRADLE_USER_HOME: /root/.gradle
        JAVA_HOME: /usr/lib/jvm/temurin-25
      caches:
        - path: /root/.gradle/caches
      contents:
        repositories:
          - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
        keyring:
          - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
        packages:
          - bash
          - ca-certificates
          - ca-certificates-bundle
          - coreutils
          - findutils
          - grep
          - sed
          - eclipse-temurin-25-jdk=1:25.0.5.1+2-0
          - eclipse-temurin-21-jdk=1:21.0.13+9-3
          - eclipse-temurin-17-jdk=1:17.0.21.1+2-0
          - gradle-9=9.9.1-2
        files:
          - url: git+https://github.com/open-telemetry/opentelemetry-java-instrumentation.git#v2.34.0
            checksum: c220c0c83d8bdf04be7d41276624dfb83b1c91fd
            path: ${source.dir}/opentelemetry-java-instrumentation
            spdx:
              name: opentelemetry-javaagent
              version: 2.34.0
              packages:
                - name: opentelemetry-javaagent
                  purl: pkg:maven/io.opentelemetry.javaagent/opentelemetry-javaagent@2.34.0
                  license: Apache-2.0
            uid: 0
            gid: 0
      pipeline:
        - name: build
          privileged: true
          runs: |
            set -eux -o pipefail

            unset CI

            gradle --init-script ${source.dir}/files/dhi-agent-deps.init.gradle \
              :javaagent:assemble :javaagent:dhiCopyAgentDeps \
              -Dorg.gradle.java.installations.auto-download=false \
              -Dorg.gradle.java.installations.paths=/usr/lib/jvm/temurin-17,/usr/lib/jvm/temurin-21,/usr/lib/jvm/temurin-25 \
              --max-workers=4 \
              --no-daemon \
              --no-build-cache \
              --no-configuration-cache \
              --console=plain
        - name: install
          runs: |
            set -eux -o pipefail

            install -D -m 0644 \
              "javaagent/build/libs/opentelemetry-javaagent-2.34.0.jar" \
              "${target.dir}/usr/share/opentelemetry-javaagent/opentelemetry-javaagent.jar"

            "/usr/lib/jvm/temurin-25/bin/java" \
              -jar "${target.dir}/usr/share/opentelemetry-javaagent/opentelemetry-javaagent.jar" | grep -Fx "2.34.0"
        - name: bundled dependency jars sbom
          uses: sbom@v1
          with:
            extra-scanners: java-archive-cataloger
            prefix: opentelemetry-javaagent-deps
            source: ${source.dir}/opentelemetry-java-instrumentation/javaagent/build/dhi-agent-deps
        - uses: dhi/build-pkg:0
          with:
            description: OpenTelemetry Java instrumentation agent
            files:
              - usr/share/opentelemetry-javaagent
            formats:
              - deb
            license: Apache-2.0
            name: opentelemetry-javaagent
            rel: 2
            url: https://opentelemetry.io/docs/zero-code/java/agent/
            version: 2.34.0
      paths:
        - type: file
          path: ${source.dir}/files/dhi-agent-deps.init.gradle
          uid: 0
          gid: 0
          source: package/main/opentelemetry-javaagent/files/dhi-agent-deps.init.gradle
os-release:
  name: Docker Hardened Images (Debian)
  id: debian
  version-id: "13"
  version-codename: trixie
  pretty-name: Docker Hardened Images/Debian GNU/Linux 13 (trixie)
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
