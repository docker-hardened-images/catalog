# syntax=dhi.io/build:2-debian13

image: dhi.io/pkg-git-mcp
variant: runtime
tags:
  - 2026.7.10
  - 2026.7.10-r4
  - 2026.7.10-debian13
  - 2026.7.10-r4-debian13
platforms:
  - linux/amd64
  - linux/arm64
vars:
  ARCH: '#{ target.arch == "amd64" ? "x86_64" : "aarch64" }'
  COMMIT_SHA: 9a96ea6e5913736f92b88345bf51caeaaa8e719f
  PYTHON_MINOR: "3.14"
  PYTHON_VERSION: 3.14.7-0
  REL: "4"
  SEMVER_MAJOR_MINOR_VERSION: "2026.7"
  SEMVER_MAJOR_VERSION: "2026"
  SEMVER_VERSION: 2026.7.10
  UV_VERSION: 0.12.4
  VERSION: 2026.7.10
contents:
  packages:
    - base-files
  builds:
    - name: git-mcp
      work-dir: ${source.dir}
      environment:
        UV_COMPILE_BYTECODE: "1"
      caches:
        - path: /root/.cache/uv
      contents:
        repositories:
          - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
        keyring:
          - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
        packages:
          - bash
          - ca-certificates
          - coreutils
          - findutils
          - git
          - grep
          - gzip
          - sed
          - tar
          - libpython-3.14=3.14.7-0
          - libpython-3.14-minimal=3.14.7-0
          - libpython-3.14-stdlib=3.14.7-0
          - python-3.14-minimal=3.14.7-0
          - python-3.14=3.14.7-0
          - python-3.14-dev=3.14.7-0
        files:
          - url: https://github.com/astral-sh/uv/releases/download/0.12.4/uv-${ARCH}-unknown-linux-gnu.tar.gz
            path: ${source.dir}/uv-unknown-linux-gnu.tar.gz
            uid: 0
            gid: 0
          - url: git+https://github.com/modelcontextprotocol/servers.git#2026.7.10
            checksum: 9a96ea6e5913736f92b88345bf51caeaaa8e719f
            path: ${source.dir}/servers
            spdx:
              name: git-mcp
              version: 2026.7.10
              packages:
                - name: git-mcp
                  purl: pkg:dhi/git-mcp@2026.7.10
                  license: MIT
            uid: 0
            gid: 0
      pipeline:
        - name: setup uv
          runs: |
            set -eux -o pipefail

            mkdir -p /usr/local/bin
            tar -xzf "${source.dir}/uv-unknown-linux-gnu.tar.gz" -C /usr/local/bin --strip-components=1
            chmod +x /usr/local/bin/uv
        - name: build venv at final path and stage it
          privileged: true
          runs: |
            set -eux -o pipefail

            export SOURCE_DIR="${source.dir}" TARGET_DIR="${target.dir}" PYTHON_BIN=/usr/bin/python3.14 VERSION="2026.7.10"
            bash "${source.dir}/build-venv.sh"
        - uses: dhi/build-pkg:0
          with:
            depends:
              - git
              - python-3.14
            description: Git MCP server (Model Context Protocol tools for Git repositories)
            files:
              - usr/lib/git-mcp
              - usr/bin/mcp-server-git
            formats:
              - deb
            license: MIT
            name: git-mcp
            rel: 4
            url: https://github.com/modelcontextprotocol/servers/tree/main/src/git
            version: 2026.7.10
      paths:
        - type: file
          path: ${source.dir}/build-venv.sh
          uid: 0
          gid: 0
          mode: "0755"
          source: package/main/git-mcp/build-venv.sh
os-release:
  name: Docker Hardened Images (Debian)
  id: debian
  version-id: "13"
  version-codename: trixie
  pretty-name: Docker Hardened Images/Debian GNU/Linux 13 (trixie)
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
