# syntax=dhi.io/build:2-alpine3.24

image: dhi.io/pkg-runc-static
variant: runtime
tags:
  - 1.5.2-alpine3.24
  - 1.5.2-r6-alpine3.24
platforms:
  - linux/amd64
  - linux/arm64
vars:
  CARGO_VERSION: 1.96.1-r0
  COMMIT_SHA: 29dd3dc2b13b4123162e5fe132504bb4b15569f1
  GOLANG_VERSION: 1.26.11-r0
  LIBPATHRS_VERSION: 0.2.6
  PACKAGE_NAME: runc-static-1.5
  REL: "6"
  RUNC_FEATURE_TAGS: seccomp,urfave_cli_no_docs,libpathrs
  RUST_VERSION: 1.96.1-r0
  SEMVER_MAJOR_MINOR_VERSION: "1.5"
  SEMVER_MAJOR_VERSION: "1"
  SEMVER_VERSION: 1.5.2
  VERSION: 1.5.2
contents:
  repositories:
    - https://dhi.io/apk/alpine/v3.24/main
    - https://dhi.io/apk/alpine/v3.23/main
    - https://dl-cdn.alpinelinux.org/alpine/v3.24/main
    - https://dl-cdn.alpinelinux.org/alpine/v3.24/community
  keyring:
    - https://dhi.io/keyring/dhi-apk@docker-0F81AD7700D99184.rsa.pub
  packages:
    - alpine-baselayout-data
  builds:
    - name: runc-static-1.5
      work-dir: /go/src/github.com/opencontainers/runc
      contents:
        packages:
          - busybox
          - bash
          - ca-certificates-bundle
          - file
          - gcc
          - musl-dev
          - libseccomp-dev
          - libseccomp-static
          - golang-1.26=1.26.11-r0
          - golang-1.26-oci-config=1.26.11-r0
          - cargo=1.96.1-r0
          - rust=1.96.1-r0
          - gnupg
          - tar
          - xz
          - zstd
        files:
          - url: git+https://github.com/opencontainers/runc.git#v1.5.2
            checksum: 29dd3dc2b13b4123162e5fe132504bb4b15569f1
            path: /go/src/github.com/opencontainers/runc
            spdx:
              name: runc
              version: 1.5.2
              packages:
                - name: runc
                  purl: pkg:golang/github.com/opencontainers/runc@1.5.2
                  license: Apache-2.0
            uid: 0
            gid: 0
          - url: https://github.com/cyphar/libpathrs/releases/download/v0.2.6/libpathrs-0.2.6.tar.xz
            checksum: https://github.com/cyphar/libpathrs/releases/download/v0.2.6/libpathrs.sha256sum
            path: ${source.dir}/libpathrs-0.2.6.tar.xz
            spdx:
              name: libpathrs
              version: 0.2.6
              packages:
                - name: libpathrs
                  purl: pkg:cargo/libpathrs@0.2.6
                  license: MPL-2.0 OR LGPL-3.0-or-later
            uid: 0
            gid: 0
          - url: https://github.com/cyphar/libpathrs/releases/download/v0.2.6/libpathrs-0.2.6.tar.xz.asc
            path: ${source.dir}/libpathrs-0.2.6.tar.xz.asc
            uid: 0
            gid: 0
          - url: https://github.com/cyphar/libpathrs/releases/download/v0.2.6/libpathrs.vendor.tar.zst
            checksum: https://github.com/cyphar/libpathrs/releases/download/v0.2.6/libpathrs.sha256sum
            path: ${source.dir}/libpathrs.vendor.tar.zst
            uid: 0
            gid: 0
          - url: https://github.com/cyphar/libpathrs/releases/download/v0.2.6/libpathrs.vendor.tar.zst.asc
            path: ${source.dir}/libpathrs.vendor.tar.zst.asc
            uid: 0
            gid: 0
      pipeline:
        - name: update go dependencies (1.5 only)
          uses: go/bump@v2
          with:
            deps:
              - golang.org/x/net@v0.62.0
              - github.com/cilium/ebpf@v0.22.0
              - github.com/moby/sys/user@v0.4.1
        - uses: go/hermetic@v1
        - name: verify libpathrs
          uses: gpg/verify@v1
          with:
            file: ${source.dir}/libpathrs-0.2.6.tar.xz
            keys: ${source.dir}/key/C9C370B246B09F6DBCFC744C34401015D1D2D386.asc
            signature: ${source.dir}/libpathrs-0.2.6.tar.xz.asc
        - name: verify libpathrs vendored sources
          uses: gpg/verify@v1
          with:
            file: ${source.dir}/libpathrs.vendor.tar.zst
            keys: ${source.dir}/key/C9C370B246B09F6DBCFC744C34401015D1D2D386.asc
            signature: ${source.dir}/libpathrs.vendor.tar.zst.asc
        - name: extract libpathrs
          runs: |
            set -eux -o pipefail

            mkdir -p "${source.dir}/libpathrs"
            tar -xJf "${source.dir}/libpathrs-0.2.6.tar.xz" -C "${source.dir}/libpathrs" --strip-components=1
            zstd -dc "${source.dir}/libpathrs.vendor.tar.zst" | tar -x -C "${source.dir}/libpathrs"
        - name: build libpathrs
          work-dir: ${source.dir}/libpathrs
          runs: |
            set -eux -o pipefail

            mkdir -p .cargo
            cat > .cargo/config.toml << 'EOF'
            [source.crates-io]
            replace-with = "vendored-sources"

            [source.vendored-sources]
            directory = "vendor"
            EOF

            cargo rustc --features=capi --release --frozen --crate-type=staticlib -- -C panic=abort

            ./install.sh --enable-static --disable-dynamic
        - name: test
          runs: |
            set -eux -o pipefail

            CGO_ENABLED=1 go test -count=1 -timeout=10m -tags "seccomp,urfave_cli_no_docs,libpathrs" \
              -skip TestValidateSysctlWithBindHostNetNS \
              $(go list ./... | grep -v -E '/libcontainer(/nsenter|/integration)?$|/tests/')
        - name: build runc
          uses: go/build@v1
          with:
            cgo_enabled: 1
            extra-args: -buildmode=pie
            fips: false
            ldflags:
              - -linkmode=external
              - -extldflags=-static-pie
              - -X main.gitCommit=29dd3dc2b13b4123162e5fe132504bb4b15569f1
            output: ${target.dir}/usr/bin/runc
            packages: .
            tags: seccomp,urfave_cli_no_docs,libpathrs,netgo,osusergo
        - name: build runc dev
          uses: go/build@v1
          with:
            cgo_enabled: 1
            extra-args: -buildmode=pie
            fips: false
            ldflags:
              - -linkmode=external
              - -extldflags=-static-pie
              - -X main.gitCommit=29dd3dc2b13b4123162e5fe132504bb4b15569f1
            output: ${target.dir}/usr/bin/runc-dev
            packages: .
            strip: false
            tags: seccomp,urfave_cli_no_docs,libpathrs,netgo,osusergo
        - name: verify binary
          runs: |
            set -eux -o pipefail

            file "${target.dir}/usr/bin/runc" > /tmp/runc-file.txt
            grep -qE "statically linked|static-pie linked" /tmp/runc-file.txt
            GODEBUG="" "${target.dir}/usr/bin/runc" --version > /tmp/runc-version.txt
            grep -qF "runc version 1.5.2" /tmp/runc-version.txt
            grep -qF "seccomp" /tmp/runc-version.txt
        - name: verify libpathrs linked
          runs: |
            set -eux -o pipefail

            GODEBUG="" "${target.dir}/usr/bin/runc" --version > /tmp/runc-libpathrs.txt
            grep -qF "libpathrs: 0.2.6" /tmp/runc-libpathrs.txt
        - uses: dhi/build-pkg:0
          with:
            description: Statically linked OCI container runtime for host installation by Kubernetes distributions
            files:
              - usr/bin/runc
            license: Apache-2.0
            name: runc-static-1.5
            provides: runc-static=$pkg_full_version
            rel: 6
            replaces: runc-static
            subpackages:
              - files:
                  - path: usr/bin/runc
                    source: usr/bin/runc-dev
                name: runc-static-1.5-dev
            url: https://github.com/opencontainers/runc
            version: 1.5.2
      paths:
        - type: directory
          path: ${source.dir}/key
          uid: 0
          gid: 0
          source: package/main/runc-static/alpine-3.24/key
os-release:
  name: Docker Hardened Images (Alpine)
  id: alpine
  version-id: "3.24"
  pretty-name: Docker Hardened Images/Alpine Linux v3.24
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
