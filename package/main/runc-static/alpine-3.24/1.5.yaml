# syntax=dhi.io/build:2-alpine3.24

image: dhi.io/pkg-runc-static
variant: runtime
tags:
  - 1.5.2-alpine3.24
  - 1.5.2-r1-alpine3.24
platforms:
  - linux/amd64
  - linux/arm64
vars:
  COMMIT_SHA: 29dd3dc2b13b4123162e5fe132504bb4b15569f1
  GOLANG_VERSION: 1.26.8-r1
  PACKAGE_NAME: runc-static-1.5
  REL: "1"
  SEMVER_MAJOR_MINOR_VERSION: "1.5"
  SEMVER_MAJOR_VERSION: "1"
  SEMVER_VERSION: 1.5.2
  VERSION: 1.5.2
contents:
  repositories:
    - https://dhi.io/apk/alpine/v3.24/main
    - https://dhi.io/apk/alpine/v3.23/main
    - https://dl-cdn.alpinelinux.org/alpine/v3.24/main
    - https://dl-cdn.alpinelinux.org/alpine/v3.24/community
  keyring:
    - https://dhi.io/keyring/dhi-apk@docker-0F81AD7700D99184.rsa.pub
  packages:
    - alpine-baselayout-data
  builds:
    - name: runc-static-1.5
      work-dir: /go/src/github.com/opencontainers/runc
      contents:
        packages:
          - busybox
          - bash
          - ca-certificates-bundle
          - file
          - gcc
          - musl-dev
          - libseccomp-dev
          - libseccomp-static
          - golang-1.26=1.26.8-r1
          - golang-1.26-oci-config=1.26.8-r1
        files:
          - url: git+https://github.com/opencontainers/runc.git#v1.5.2
            checksum: 29dd3dc2b13b4123162e5fe132504bb4b15569f1
            path: /go/src/github.com/opencontainers/runc
            spdx:
              name: runc
              version: 1.5.2
              packages:
                - name: runc
                  purl: pkg:golang/github.com/opencontainers/runc@1.5.2
                  license: Apache-2.0
            uid: 0
            gid: 0
      pipeline:
        - name: update go dependencies
          uses: go/bump@v2
          with:
            deps:
              - golang.org/x/net@v0.56.0
              - github.com/cilium/ebpf@v0.22.0
              - github.com/opencontainers/cgroups@v0.1.0
        - uses: go/hermetic@v1
        - name: test
          runs: |
            set -eux -o pipefail

            CGO_ENABLED=1 go test -count=1 -timeout=10m -tags "seccomp urfave_cli_no_docs" \
              -skip TestValidateSysctlWithBindHostNetNS \
              $(go list ./... | grep -v -E '/libcontainer(/nsenter|/integration)?$|/tests/')
        - name: build runc
          uses: go/build@v1
          with:
            cgo_enabled: 1
            extra-args: -buildmode=pie
            fips: false
            ldflags:
              - -linkmode=external
              - -extldflags=-static-pie
              - -X main.gitCommit=29dd3dc2b13b4123162e5fe132504bb4b15569f1
            output: ${target.dir}/usr/bin/runc
            packages: .
            tags: seccomp,urfave_cli_no_docs,netgo,osusergo
        - name: build runc dev
          uses: go/build@v1
          with:
            cgo_enabled: 1
            extra-args: -buildmode=pie
            fips: false
            ldflags:
              - -linkmode=external
              - -extldflags=-static-pie
              - -X main.gitCommit=29dd3dc2b13b4123162e5fe132504bb4b15569f1
            output: ${target.dir}/usr/bin/runc-dev
            packages: .
            strip: false
            tags: seccomp,urfave_cli_no_docs,netgo,osusergo
        - name: verify binary
          runs: |
            set -eux -o pipefail

            file "${target.dir}/usr/bin/runc" > /tmp/runc-file.txt
            grep -qE "statically linked|static-pie linked" /tmp/runc-file.txt
            GODEBUG="" "${target.dir}/usr/bin/runc" --version > /tmp/runc-version.txt
            grep -qF "runc version 1.5.2" /tmp/runc-version.txt
            grep -qF "seccomp" /tmp/runc-version.txt
        - uses: dhi/build-pkg:0
          with:
            description: Statically linked OCI container runtime for host installation by Kubernetes distributions
            files:
              - usr/bin/runc
            license: Apache-2.0
            name: runc-static-1.5
            provides: runc-static=$pkg_full_version
            rel: 1
            replaces: runc-static
            subpackages:
              - files:
                  - path: usr/bin/runc
                    source: usr/bin/runc-dev
                name: runc-static-1.5-dev
            url: https://github.com/opencontainers/runc
            version: 1.5.2
os-release:
  name: Docker Hardened Images (Alpine)
  id: alpine
  version-id: "3.24"
  pretty-name: Docker Hardened Images/Alpine Linux v3.24
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
