# syntax=dhi.io/build:2-alpine3.24

image: dhi.io/pkg-runc-static
variant: runtime
tags:
  - 1.4.4-alpine3.24
  - 1.4.4-r2-alpine3.24
platforms:
  - linux/amd64
  - linux/arm64
vars:
  CARGO_VERSION: 1.96.1-r0
  COMMIT_SHA: 6d1032fdfb7d3432125806826b50b37ac42b6b23
  GOLANG_VERSION: 1.26.11-r1
  PACKAGE_NAME: runc-static-1.4
  REL: "2"
  RUNC_FEATURE_TAGS: seccomp,urfave_cli_no_docs
  RUST_VERSION: 1.96.1-r0
  SEMVER_MAJOR_MINOR_VERSION: "1.4"
  SEMVER_MAJOR_VERSION: "1"
  SEMVER_VERSION: 1.4.4
  VERSION: 1.4.4
contents:
  repositories:
    - https://dhi.io/apk/alpine/v3.24/main
    - https://dhi.io/apk/alpine/v3.23/main
    - https://dl-cdn.alpinelinux.org/alpine/v3.24/main
    - https://dl-cdn.alpinelinux.org/alpine/v3.24/community
  keyring:
    - https://dhi.io/keyring/dhi-apk@docker-0F81AD7700D99184.rsa.pub
  packages:
    - alpine-baselayout-data
  builds:
    - name: runc-static-1.4
      work-dir: /go/src/github.com/opencontainers/runc
      contents:
        packages:
          - busybox
          - bash
          - ca-certificates-bundle
          - file
          - gcc
          - musl-dev
          - libseccomp-dev
          - libseccomp-static
          - golang-1.26=1.26.11-r1
          - golang-1.26-oci-config=1.26.11-r1
          - cargo=1.96.1-r0
          - rust=1.96.1-r0
          - gnupg
          - tar
          - xz
          - zstd
        files:
          - url: git+https://github.com/opencontainers/runc.git#v1.4.4
            checksum: 6d1032fdfb7d3432125806826b50b37ac42b6b23
            path: /go/src/github.com/opencontainers/runc
            spdx:
              name: runc
              version: 1.4.4
              packages:
                - name: runc
                  purl: pkg:golang/github.com/opencontainers/runc@1.4.4
                  license: Apache-2.0
            uid: 0
            gid: 0
      pipeline:
        - name: update go dependencies (1.4 only)
          uses: go/bump@v3
          with:
            deps:
              - golang.org/x/net@v0.62.0
              - github.com/cilium/ebpf@v0.22.0
              - github.com/moby/sys/user@v0.4.1
              - github.com/opencontainers/cgroups@v0.1.0
        - uses: go/hermetic@v1
        - name: test
          runs: |
            set -eux -o pipefail

            CGO_ENABLED=1 go test -count=1 -timeout=10m -tags "seccomp,urfave_cli_no_docs" \
              -skip TestValidateSysctlWithBindHostNetNS \
              $(go list ./... | grep -v -E '/libcontainer(/nsenter|/integration)?$|/tests/')
        - name: build runc
          uses: go/build@v1
          with:
            cgo_enabled: 1
            extra-args: -buildmode=pie
            fips: false
            ldflags:
              - -linkmode=external
              - -extldflags=-static-pie
              - -X main.gitCommit=6d1032fdfb7d3432125806826b50b37ac42b6b23
            output: ${target.dir}/usr/bin/runc
            packages: .
            tags: seccomp,urfave_cli_no_docs,netgo,osusergo
        - name: build runc dev
          uses: go/build@v1
          with:
            cgo_enabled: 1
            extra-args: -buildmode=pie
            fips: false
            ldflags:
              - -linkmode=external
              - -extldflags=-static-pie
              - -X main.gitCommit=6d1032fdfb7d3432125806826b50b37ac42b6b23
            output: ${target.dir}/usr/bin/runc-dev
            packages: .
            strip: false
            tags: seccomp,urfave_cli_no_docs,netgo,osusergo
        - name: verify binary
          runs: |
            set -eux -o pipefail

            file "${target.dir}/usr/bin/runc" > /tmp/runc-file.txt
            grep -qE "statically linked|static-pie linked" /tmp/runc-file.txt
            GODEBUG="" "${target.dir}/usr/bin/runc" --version > /tmp/runc-version.txt
            grep -qF "runc version 1.4.4" /tmp/runc-version.txt
            grep -qF "seccomp" /tmp/runc-version.txt
        - uses: dhi/build-pkg:0
          with:
            description: Statically linked OCI container runtime for host installation by Kubernetes distributions
            files:
              - usr/bin/runc
            license: Apache-2.0
            name: runc-static-1.4
            provides: runc-static=$pkg_full_version
            rel: 2
            replaces: runc-static
            subpackages:
              - files:
                  - path: usr/bin/runc
                    source: usr/bin/runc-dev
                name: runc-static-1.4-dev
            url: https://github.com/opencontainers/runc
            version: 1.4.4
os-release:
  name: Docker Hardened Images (Alpine)
  id: alpine
  version-id: "3.24"
  pretty-name: Docker Hardened Images/Alpine Linux v3.24
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
