  REL: "1"
  VERSION: 3391.va_37fa_a_305d6d
contents:
  packages:
    - base-files
  builds:
    - name: jenkins-inbound-agent
      work-dir: ${source.dir}/remoting
      environment:
        JAVA_HOME: /usr/lib/jvm/temurin-21
        MAVEN_HOME: /opt/java/apache-maven-3.10.0
      caches:
        - path: /root/.m2/repository
      contents:
        repositories:
          - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
        keyring:
          - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
        packages:
          - bash
          - ca-certificates
          - coreutils
          - curl
          - findutils
          - git
          - grep
          - gzip
          - sed
          - tar
          - xmlstarlet
          - eclipse-temurin-21-jdk=1:21.0.12.1+1-4
        files:
          - url: git+https://github.com/jenkinsci/remoting.git#3391.va_37fa_a_305d6d
            checksum: a37faa305d6de11901911082432e6d72746eae20
            path: ${source.dir}/remoting
            spdx:
              name: jenkins-remoting
              version: 3391.va_37fa_a_305d6d
              packages:
                - name: jenkins-remoting
                  purl: pkg:dhi/jenkins-remoting@3391.va_37fa_a_305d6d
                  license: MIT
            uid: 0
            gid: 0
          - url: git+https://github.com/jenkinsci/docker-agent.git#3391.va_37fa_a_305d6d-4
            checksum: 531a048ed66574ae6e93b73fa8defbe5fd6e69c1
            path: ${source.dir}/docker-agent-531a048ed66574ae6e93b73fa8defbe5fd6e69c1
            spdx:
              name: jenkins-docker-agent
              version: 3391.va_37fa_a_305d6d
              packages:
                - name: jenkins-docker-agent
                  purl: pkg:github/jenkinsci/docker-agent@531a048ed66574ae6e93b73fa8defbe5fd6e69c1
                  license: MIT
            uid: 0
            gid: 0
          - url: https://dlcdn.apache.org/maven/maven-3/3.9.16/binaries/apache-maven-3.9.16-bin.tar.gz
            checksum: sha256:80ffca22aed9e8b9713a232f3394fd81d7f20322df75efdb2b047dbd3e3a23bb
            path: ${source.dir}/maven/apache-maven-bootstrap-bin.tar.gz
            uid: 0
            gid: 0
          - url: git+https://github.com/apache/maven.git#maven-3.10.0
            checksum: c43a36b8d67be7e0805a411bc0898af1a51f5472
            path: ${source.dir}/maven-src
            spdx:
              name: maven
              version: 3.10.0
              packages:
                - name: maven
                  purl: pkg:generic/apache-maven@3.10.0
                  license: Apache-2.0
            uid: 0
            gid: 0
      pipeline:
        - name: install maven
          privileged: true
          runs: |
            set -eux -o pipefail

            mkdir -p /opt/java /tmp/maven-bootstrap
            tar -xzf "${source.dir}/maven/apache-maven-bootstrap-bin.tar.gz" -C /tmp/maven-bootstrap
            export PATH="/tmp/maven-bootstrap/apache-maven-3.9.16/bin:${PATH}"

            cd "${source.dir}/maven-src"
            mvn -B -DskipTests -pl apache-maven -am package
            tar -xzf "apache-maven/target/apache-maven-3.10.0-bin.tar.gz" -C /opt/java

            mkdir -p /usr/local/bin
            find "/opt/java/apache-maven-3.10.0/bin" -type f -executable -o -type l | while read -r file; do
              filename=$(basename "$file")
              ln -sf "/opt/java/apache-maven-3.10.0/bin/$filename" "/usr/local/bin/$filename"
            done
        - uses: mvn/mirror@v1
        - name: use maven central when mirror credentials are absent
          secrets:
            - id: maven_user
              env: MAVEN_USER
              optional: true
            - id: maven_password
              env: MAVEN_PASSWORD
              optional: true
          runs: |
            set -eux -o pipefail

            if [ -z "${MAVEN_USER:-}" ] || [ -z "${MAVEN_PASSWORD:-}" ]; then
              rm -f /root/.m2/settings.xml
            fi
        - name: remove git-changelist-maven-extension
          work-dir: ${source.dir}/remoting
          runs: |
            set -eux -o pipefail

            ext_xml=".mvn/extensions.xml"
            if [ -f "${ext_xml}" ]; then
              xmlstarlet ed -L \
                -d "//*[local-name()='extension'][*[local-name()='artifactId']='git-changelist-maven-extension']" \
                "${ext_xml}"
            fi
        - name: build remoting
          work-dir: ${source.dir}/remoting
          privileged: true
          secrets:
            - id: maven_user
              env: MAVEN_USER
              optional: true
            - id: maven_password
              env: MAVEN_PASSWORD
              optional: true
          runs: |
            set -eux -o pipefail

            sed -i "s|<changelist>.*</changelist>|<changelist>3391.va_37fa_a_305d6d</changelist>|" pom.xml

            mvn clean install -DskipTests -Dmaven.test.skip=true -Dspotless.check.skip=true

            jar_file="target/remoting-3391.va_37fa_a_305d6d.jar"
            if [ ! -f "$jar_file" ]; then
              echo "ERROR: JAR file not found: $jar_file" >&2
              exit 1
            fi
            jar xf "$jar_file" META-INF/MANIFEST.MF 2> /dev/null || {
              echo "ERROR: Could not extract manifest from JAR: $jar_file" >&2
              exit 1
            }
            if ! grep -q "Main-Class:" META-INF/MANIFEST.MF; then
              echo "ERROR: JAR file missing Main-Class in manifest: $jar_file" >&2
              cat META-INF/MANIFEST.MF
              rm -rf META-INF
              exit 1
            fi
            rm -rf META-INF
        - name: stage agent payload
          runs: |
            set -eux -o pipefail

            mkdir -p "${target.dir}/usr/share/jenkins"
            install -D -m 0644 "${source.dir}/remoting/target/remoting-3391.va_37fa_a_305d6d.jar" \
              "${target.dir}/usr/share/jenkins/agent.jar"
            ln -sf agent.jar "${target.dir}/usr/share/jenkins/slave.jar"
        - name: install entrypoint script
          work-dir: ${source.dir}/docker-agent-531a048ed66574ae6e93b73fa8defbe5fd6e69c1
          runs: |
            set -eux -o pipefail

            mkdir -p "${target.dir}/usr/bin"
            install -m 0755 jenkins-agent "${target.dir}/usr/bin/jenkins-agent"
        - uses: dhi/build-pkg:0
          with:
            depends:
              - bash
              - ca-certificates
              - coreutils
              - git
              - libc6
              - openssh-client
              - eclipse-temurin-21-jre
            description: Jenkins inbound agent for Kubernetes and containerized environments
            files:
              - usr
            formats:
              - deb
            license: MIT
            name: jenkins-inbound-agent
            rel: 1
            url: https://www.jenkins.io/doc/book/using/using-agents/
            version: 3391.va~37fa~a~305d6d
