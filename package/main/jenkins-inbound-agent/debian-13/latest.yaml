            gid: 0
          - url: https://dlcdn.apache.org/maven/maven-3/3.9.16/binaries/apache-maven-3.9.16-bin.tar.gz
            path: ${source.dir}/maven/apache-maven-3.9.16-bin.tar.gz
            spdx:
              name: maven
              version: 3.9.16
              packages:
                - name: maven
                  purl: pkg:generic/apache-maven@3.9.16
                  license: Apache-2.0
            uid: 0
            gid: 0
      pipeline:
        - name: install maven
          runs: |
            set -eux -o pipefail

            mkdir -p /opt/java
            tar -xzf "${source.dir}/maven/apache-maven-3.9.16-bin.tar.gz" -C /opt/java

            mkdir -p /usr/local/bin
            find "/opt/java/apache-maven-3.9.16/bin" -type f -executable -o -type l | while read -r file; do
              filename=$(basename "$file")
              ln -sf "/opt/java/apache-maven-3.9.16/bin/$filename" "/usr/local/bin/$filename"
            done
        - uses: mvn/mirror@v1
        - name: use maven central when mirror credentials are absent
          secrets:
            - id: maven_user
              env: MAVEN_USER
              optional: true
            - id: maven_password
              env: MAVEN_PASSWORD
              optional: true
          runs: |
            set -eux -o pipefail

            if [ -z "${MAVEN_USER:-}" ] || [ -z "${MAVEN_PASSWORD:-}" ]; then
              rm -f /root/.m2/settings.xml
            fi
        - name: remove git-changelist-maven-extension
          work-dir: ${source.dir}/remoting
          runs: |
            set -eux -o pipefail

            ext_xml=".mvn/extensions.xml"
            if [ -f "${ext_xml}" ]; then
              xmlstarlet ed -L \
                -d "//*[local-name()='extension'][*[local-name()='artifactId']='git-changelist-maven-extension']" \
                "${ext_xml}"
            fi
        - name: build remoting
          work-dir: ${source.dir}/remoting
          privileged: true
          secrets:
            - id: maven_user
              env: MAVEN_USER
              optional: true
            - id: maven_password
              env: MAVEN_PASSWORD
              optional: true
          runs: |
            set -eux -o pipefail

            sed -i "s|<changelist>.*</changelist>|<changelist>3390.v3381cf39b_501</changelist>|" pom.xml

            mvn clean install -DskipTests -Dmaven.test.skip=true -Dspotless.check.skip=true

            jar_file="target/remoting-3390.v3381cf39b_501.jar"
            if [ ! -f "$jar_file" ]; then
              echo "ERROR: JAR file not found: $jar_file" >&2
              exit 1
            fi
            jar xf "$jar_file" META-INF/MANIFEST.MF 2> /dev/null || {
              echo "ERROR: Could not extract manifest from JAR: $jar_file" >&2
              exit 1
            }
            if ! grep -q "Main-Class:" META-INF/MANIFEST.MF; then
              echo "ERROR: JAR file missing Main-Class in manifest: $jar_file" >&2
              cat META-INF/MANIFEST.MF
              rm -rf META-INF
              exit 1
            fi
            rm -rf META-INF
        - name: stage agent payload
          runs: |
            set -eux -o pipefail

            mkdir -p "${target.dir}/usr/share/jenkins"
            install -D -m 0644 "${source.dir}/remoting/target/remoting-3390.v3381cf39b_501.jar" \
              "${target.dir}/usr/share/jenkins/agent.jar"
            ln -sf agent.jar "${target.dir}/usr/share/jenkins/slave.jar"
        - name: install entrypoint script
          work-dir: ${source.dir}/docker-agent-76681d1855814bd830ebfee0a0fe985dec075c32
          runs: |
            set -eux -o pipefail

            mkdir -p "${target.dir}/usr/bin"
            install -m 0755 jenkins-agent "${target.dir}/usr/bin/jenkins-agent"
        - uses: dhi/build-pkg:0
          with:
            depends:
