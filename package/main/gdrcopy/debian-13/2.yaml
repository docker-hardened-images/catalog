# syntax=dhi.io/build:2-debian13

image: dhi.io/pkg-gdrcopy
variant: runtime
tags:
  - "2.6"
  - 2.6-r1
  - 2.6-debian13
  - 2.6-r1-debian13
platforms:
  - linux/amd64
  - linux/arm64
vars:
  COMMIT_SHA: 93c606bbcaa10457cbbab93163aa446d902b983d
  DHI_TEST_DEB_EXPECTED_FILES: /usr/lib/*-linux-gnu/libgdrapi.so.2
  GCC_VERSION: 14.2.0-19+deb13u0+dhi5
  PACKAGE_NAME: gdrcopy-2
  REL: "1"
  SEMVER_MAJOR_MINOR_VERSION: "2.6"
  SEMVER_MAJOR_VERSION: "2"
  SEMVER_VERSION: "2.6"
  VERSION: "2.6"
contents:
  repositories:
    - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
  keyring:
    - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
  packages:
    - base-files
  builds:
    - name: gdrcopy
      work-dir: ${source.dir}
      contents:
        packages:
          - bash
          - binutils
          - coreutils
          - gcc
          - gcc-14=14.2.0-19+deb13u0+dhi5
          - grep
          - libc-bin
          - libc6-dev
          - make
          - mawk
          - sed
        files:
          - url: git+https://github.com/NVIDIA/gdrcopy.git#v2.6
            checksum: 93c606bbcaa10457cbbab93163aa446d902b983d
            path: ${source.dir}
            spdx:
              name: gdrcopy
              version: "2.6"
              packages:
                - name: gdrcopy
                  purl: pkg:github/nvidia/gdrcopy@v2.6
                  license: MIT
            uid: 0
            gid: 0
      pipeline:
        - name: build libgdrapi
          runs: |
            set -eux -o pipefail

            make lib
        - name: install libgdrapi
          runs: |
            set -eux -o pipefail

            libdir="/usr/lib/$(gcc -dumpmachine)"
            make lib_install DESTDIR="${target.dir}" prefix=/usr libdir="${libdir}"

            mkdir -p "${target.dir}/dev-staging${libdir}"
            mv "${target.dir}${libdir}/libgdrapi.so" "${target.dir}/dev-staging${libdir}/libgdrapi.so"
        - name: stage gdrdrv build tree
          runs: |
            set -eux -o pipefail

            tree="${target.dir}/usr/src/gdrdrv-2.6"
            module_subdir="$(awk '/MODULE_SUBDIR \?=/ { print $3 }' src/gdrdrv/Makefile)"
            test -n "${module_subdir}"

            mkdir -p "${tree}"
            cp -a src/gdrdrv/. "${tree}/"
            cp -a scripts "${tree}/scripts"
            sed -e "s/@FULL_VERSION@/2.6/g" \
              -e "s/@VERSION@/2.6/g" \
              -e "s|@MODULE_LOCATION@|${module_subdir}|g" \
              packages/dkms.conf > "${tree}/dkms.conf"
            if grep -q '@[A-Z_]*@' "${tree}/dkms.conf"; then exit 1; fi
        - uses: spdx@v1
          with:
            license: MIT
            name: gdrdrv-dkms
            purl: pkg:github/nvidia/gdrcopy@v2.6
            version: 2.6
        - name: stage sbom fragments
          runs: |
            set -eux -o pipefail

            mkdir -p "${target.dir}/opt/docker/sbom" "${target.dir}/dkms-staging/opt/docker/sbom"
            cp -a /opt/docker/sbom/gdrcopy "${target.dir}/opt/docker/sbom/"
            cp -a /opt/docker/sbom/gdrdrv-dkms "${target.dir}/dkms-staging/opt/docker/sbom/"
        - uses: dhi/build-pkg:0
          with:
            depends:
              - libc6
            description: GDRCopy low-latency GPU memory copy library (libgdrapi)
            files:
              - mode: "0644"
                path: usr/lib
              - opt/docker/sbom
            formats:
              - deb
            license: MIT
            name: gdrcopy-2
            rel: 1
            subpackages:
              - deb:
                  depends:
                    - gdrcopy-2
                files:
                  - mode: "0644"
                    path: usr/include/gdrapi.h
                  - mode: "0644"
                    path: usr/include/gdrconfig.h
                  - path: usr/lib
                    source: dev-staging/usr/lib
                name: gdrcopy-2-dev
              - deb:
                  depends:
                    - coreutils
                    - findutils
                    - gcc
                    - grep
                    - make
                    - mawk
                description: GDRCopy gdrdrv kernel module build tree in DKMS layout, compiled by its consumer against the running kernel
                files:
                  - mode: "0755"
                    path: usr/src/gdrdrv-2.6/scripts
                  - mode: "0644"
                    path: usr/src/gdrdrv-2.6
                  - path: opt/docker/sbom
                    source: dkms-staging/opt/docker/sbom
                name: gdrdrv-dkms-2
            url: https://github.com/NVIDIA/gdrcopy
            version: 2.6
os-release:
  name: Docker Hardened Images (Debian)
  id: debian
  version-id: "13"
  version-codename: trixie
  pretty-name: Docker Hardened Images/Debian GNU/Linux 13 (trixie)
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
