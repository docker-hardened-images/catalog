# syntax=dhi.io/build:2-debian13

image: dhi.io/pkg-duckdb
variant: runtime
tags:
  - 2.0.0
  - 2.0.0-r0
  - 2.0.0-debian13
  - 2.0.0-r0-debian13
platforms:
  - linux/amd64
  - linux/arm64
dates:
  release: "2026-10-21"
  end-of-life: "2027-10-21"
vars:
  BROTLI_VERSION: 1.1.0
  COMMIT_SHA: d54cbbe3df17e8e5ce68312f483b4155836112aa
  DISTRO_CMAKE_FLAGS: ""
  FASTPFOR_REVISION: 6d8bf4509ced1cd4dfdf017c70621ae534532d0da433a48d2a29726cdd1527f6
  FMT_VERSION: 6.1.2
  FSST_COMMIT: 0f0f9057048412da1ee48e35d516155cb7edd155
  HAS_AUTOINSTALL: "false"
  HAS_EMBEDDED_TZDATA: "true"
  HAS_LIBPG_QUERY: "false"
  HAS_OPTIMIZATION_PROFILE: "true"
  HAS_VENDORED_ICU: "false"
  HTTPLIB_VERSION: 0.53.1
  HYPERLOGLOG_REVISION: d7c2336205532651935792a1bb16d38784726eb77018d9dc32c276e0ee3807b2
  JEMALLOC_VERSION: 5.3.0-196-ga25b9b8ba91881964be3083db349991bbbbf1661
  LINE_CMAKE_FLAGS: -DDUCKDB_OPTIMIZATION_PROFILE=NONE
  LINK_JEMALLOC: "true"
  LZ4_VERSION: 1.9.4
  MBEDTLS_VERSION: 3.6.7
  MINIZ_VERSION: 10.0.3
  PACKAGE_NAME: duckdb-2.0
  RE2_REVISION: 4252f47f79003eca03cf0658775edbc900f12582adc279a3d8b06724b3dd5784
  RE2_VERSION: "2023-02-01"
  REL: "0"
  SEMVER_MAJOR_MINOR_VERSION: "2.0"
  SEMVER_MAJOR_VERSION: "2"
  SEMVER_VERSION: 2.0.0
  SKIPLIST_REVISION: 1a58be5ddc642b4dcbd2a0d6ae7fc321f3d41b1fe73ab6d0e5e8411df4d6bb7d
  SNAPPY_VERSION: 1.1.7
  THRIFT_REVISION: eb3a2a16927690891df3b4e04b092047952a509c83f8972a103d0c6a53a9f142
  THRIFT_VERSION: 0.22.0
  TZ_DATA_VERSION: 2026e
  UTF8PROC_VERSION: 2.9.0
  VERSION: 2.0.0
  YYJSON_VERSION: 0.9.0
  ZSTD_VERSION: 1.5.6
contents:
  repositories:
    - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
  keyring:
    - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
  packages:
    - base-files
  builds:
    - name: duckdb
      work-dir: ${source.dir}/duckdb
      contents:
        packages:
          - bash
          - binutils
          - build-essential
          - ca-certificates
          - cmake
          - coreutils
          - findutils
          - gawk
          - git
          - grep
          - ninja-build
          - sed
        files:
          - url: git+https://github.com/duckdb/duckdb.git#v2.0.0
            checksum: d54cbbe3df17e8e5ce68312f483b4155836112aa
            path: ${source.dir}/duckdb
            spdx:
              name: duckdb
              version: 2.0.0
              packages:
                - name: duckdb
                  purl: pkg:github/duckdb/duckdb@2.0.0
                  license: MIT
            uid: 0
            gid: 0
      pipeline:
        - name: check vendored versions
          runs: |
            set -eux -o pipefail

            mbedtls=$(tr -d '[:space:]' < third_party/mbedtls/VERSION)
            test "$mbedtls" = "3.6.7"
            brotli=$(tr -d '[:space:]' < third_party/brotli/VERSION)
            test "$brotli" = "1.1.0"

            zstd_maj=$(sed -n 's/^#define ZSTD_VERSION_MAJOR[[:space:]]*\([0-9][0-9]*\).*/\1/p' third_party/zstd/include/zstd.h)
            zstd_min=$(sed -n 's/^#define ZSTD_VERSION_MINOR[[:space:]]*\([0-9][0-9]*\).*/\1/p' third_party/zstd/include/zstd.h)
            zstd_rel=$(sed -n 's/^#define ZSTD_VERSION_RELEASE[[:space:]]*\([0-9][0-9]*\).*/\1/p' third_party/zstd/include/zstd.h)
            test -n "$zstd_maj"
            test -n "$zstd_min"
            test -n "$zstd_rel"
            test "$zstd_maj.$zstd_min.$zstd_rel" = "1.5.6"

            yyjson=$(sed -n 's/^#define YYJSON_VERSION_STRING "\([^"]*\)".*/\1/p' third_party/yyjson/include/yyjson.hpp)
            test "$yyjson" = "0.9.0"

            utf_maj=$(sed -n 's/^#define UTF8PROC_VERSION_MAJOR \([0-9][0-9]*\).*/\1/p' third_party/utf8proc/include/utf8proc.hpp)
            utf_min=$(sed -n 's/^#define UTF8PROC_VERSION_MINOR \([0-9][0-9]*\).*/\1/p' third_party/utf8proc/include/utf8proc.hpp)
            utf_pat=$(sed -n 's/^#define UTF8PROC_VERSION_PATCH \([0-9][0-9]*\).*/\1/p' third_party/utf8proc/include/utf8proc.hpp)
            test -n "$utf_maj"
            test -n "$utf_min"
            test -n "$utf_pat"
            test "$utf_maj.$utf_min.$utf_pat" = "2.9.0"

            fmt_raw=$(sed -n 's/^#define FMT_VERSION \([0-9][0-9]*\).*/\1/p' third_party/fmt/include/fmt/core.h)
            test -n "$fmt_raw"
            fmt_ver=$(printf '%s\n' "$fmt_raw" | awk '{ v=$1; printf "%d.%d.%d", int(v/10000), int((v%10000)/100), v%100 }')
            test "$fmt_ver" = "6.1.2"

            miniz=$(sed -n 's/^#define MZ_VERSION "\([^"]*\)".*/\1/p' third_party/miniz/miniz.hpp)
            test "$miniz" = "10.0.3"

            lz_maj=$(sed -n 's/^#define LZ4_VERSION_MAJOR[[:space:]]*\([0-9][0-9]*\).*/\1/p' third_party/lz4/lz4.hpp)
            lz_min=$(sed -n 's/^#define LZ4_VERSION_MINOR[[:space:]]*\([0-9][0-9]*\).*/\1/p' third_party/lz4/lz4.hpp)
            lz_rel=$(sed -n 's/^#define LZ4_VERSION_RELEASE[[:space:]]*\([0-9][0-9]*\).*/\1/p' third_party/lz4/lz4.hpp)
            test -n "$lz_maj"
            test -n "$lz_min"
            test -n "$lz_rel"
            test "$lz_maj.$lz_min.$lz_rel" = "1.9.4"

            snappy=$(awk 'BEGIN{p=0} /^#else/ {p=1} p && /^#define SNAPPY_MAJOR / {maj=$3} p && /^#define SNAPPY_MINOR / {min=$3} p && /^#define SNAPPY_PATCHLEVEL / {pat=$3} END{if (maj=="" || min=="" || pat=="") exit 1; printf "%s.%s.%s", maj, min, pat}' third_party/snappy/snappy-stubs-public.h)
            test "$snappy" = "1.1.7"

            jemalloc=$(sed -n 's/^#define JEMALLOC_VERSION "\([^"]*\)".*/\1/p' third_party/jemalloc/include/jemalloc/jemalloc.h)
            test "$jemalloc" = "5.3.0-196-ga25b9b8ba91881964be3083db349991bbbbf1661"

            fsst=$(sed -n 's/.*@ commit \([0-9a-f][0-9a-f]*\).*/\1/p' third_party/fsst/README.md)
            test "$fsst" = "0f0f9057048412da1ee48e35d516155cb7edd155"

            re2=$(sha256sum third_party/re2/re2/re2.h | awk '{print $1}')
            test -n "$re2"
            test "$re2" = "4252f47f79003eca03cf0658775edbc900f12582adc279a3d8b06724b3dd5784"
            thrift=$(sha256sum third_party/thrift/thrift/Thrift.h | awk '{print $1}')
            test -n "$thrift"
            test "$thrift" = "eb3a2a16927690891df3b4e04b092047952a509c83f8972a103d0c6a53a9f142"
            hll=$(sha256sum third_party/hyperloglog/hyperloglog.hpp | awk '{print $1}')
            test -n "$hll"
            test "$hll" = "d7c2336205532651935792a1bb16d38784726eb77018d9dc32c276e0ee3807b2"
            fastpfor=$(sha256sum third_party/fastpforlib/bitpacking.h | awk '{print $1}')
            test -n "$fastpfor"
            test "$fastpfor" = "6d8bf4509ced1cd4dfdf017c70621ae534532d0da433a48d2a29726cdd1527f6"
            skiplist=$(sha256sum third_party/skiplist/SkipList.h | awk '{print $1}')
            test -n "$skiplist"
            test "$skiplist" = "1a58be5ddc642b4dcbd2a0d6ae7fc321f3d41b1fe73ab6d0e5e8411df4d6bb7d"

            httplib=$(sed -n 's/^#define CPPHTTPLIB_VERSION "\([^"]*\)".*/\1/p' third_party/httplib/httplib.hpp)
            test "$httplib" = "0.53.1"

            if [ "false" = true ]; then
              icu=$(sed -n 's/^#define U_ICU_VERSION "\([^"]*\)".*/\1/p' extension/icu/third_party/icu/common/unicode/uvernum.h)
              test "$icu" = "${ICU_VERSION}"
            else
              test ! -f extension/icu/third_party/icu/common/unicode/uvernum.h
            fi
            if [ "true" = true ]; then
              grep -qF "IANA release 2026e" extension/icu/datetime/generated/tz_data.cpp
            else
              test ! -f extension/icu/datetime/generated/tz_data.cpp
            fi
            if [ "false" = true ]; then
              libpg=$(sha256sum third_party/libpg_query/grammar/grammar.hpp | awk '{print $1}')
              test -n "$libpg"
              test "$libpg" = "${LIBPG_QUERY_REVISION}"
              grep -qF 'namespace duckdb_libpgquery' third_party/libpg_query/grammar/grammar.hpp
            else
              test ! -d third_party/libpg_query
            fi
        - name: configure and build
          runs: "set -eux -o pipefail\n\ncmake -B build -G Ninja \\\n  -DCMAKE_BUILD_TYPE=Release \\\n  -DCMAKE_INSTALL_PREFIX=/usr \\\n  -DBUILD_SHELL=TRUE \\\n  -DBUILD_UNITTESTS=FALSE \\\n  -DENABLE_SANITIZER=FALSE \\\n  -DOVERRIDE_GIT_DESCRIBE=v2.0.0 \\\n  -DDUCKDB_EXTENSION_CONFIGS=.github/config/bundled_extensions.cmake \\\n  -DDUCKDB_OPTIMIZATION_PROFILE=NONE \ngrep -E '^BUILD_UNITTESTS:BOOL=(OFF|FALSE)$' build/CMakeCache.txt\ngrep -E '^ENABLE_SANITIZER:BOOL=(OFF|FALSE)$' build/CMakeCache.txt\ngrep -E '^BUILD_SHELL:BOOL=(ON|TRUE)$' build/CMakeCache.txt\nif [ \"true\" = true ]; then\n  grep -q '^DUCKDB_OPTIMIZATION_PROFILE:STRING=NONE$' build/CMakeCache.txt\nelse\n  test ! -e build/CMakeCache.txt || ! grep -q '^DUCKDB_OPTIMIZATION_PROFILE:' build/CMakeCache.txt\nfi\nif [ \"false\" = true ]; then\n  grep -E '^ENABLE_EXTENSION_AUTOINSTALL:BOOL=(ON|TRUE)$' build/CMakeCache.txt\n  grep -E '^ENABLE_EXTENSION_AUTOLOADING:BOOL=(ON|TRUE)$' build/CMakeCache.txt\nfi\nif [ \"true\" = true ]; then\n  grep -E '^MUSL_ENABLED:BOOL=(OFF|FALSE)$' build/CMakeCache.txt\n  grep -E '^ENABLE_JEMALLOC:BOOL=(ON|TRUE)$' build/CMakeCache.txt\nelse\n  grep -E '^MUSL_ENABLED:BOOL=(ON|TRUE)$' build/CMakeCache.txt\nfi\ncmake --build build -j\"$(nproc)\"\n"
        - name: install payload
          runs: |
            set -eux -o pipefail

            DESTDIR='${target.dir}' cmake --install build
            test -x '${target.dir}/usr/bin/duckdb'
            mkdir -p /tmp/duckdb-keep
            mv '${target.dir}/usr/bin/duckdb' /tmp/duckdb-keep/duckdb
            find '${target.dir}' -mindepth 1 -maxdepth 1 -exec rm -rf {} +
            mkdir -p '${target.dir}/usr/bin' '${target.dir}/usr/share/doc/duckdb-2.0'
            mv /tmp/duckdb-keep/duckdb '${target.dir}/usr/bin/duckdb'
            cp -p LICENSE '${target.dir}/usr/share/doc/duckdb-2.0/LICENSE'
            test -x '${target.dir}/usr/bin/duckdb'
            test -f '${target.dir}/usr/share/doc/duckdb-2.0/LICENSE'
            grep -q 'Permission is hereby granted' '${target.dir}/usr/share/doc/duckdb-2.0/LICENSE'
            grep -q 'Stichting DuckDB Foundation' '${target.dir}/usr/share/doc/duckdb-2.0/LICENSE'
        - name: verify linkage
          runs: |
            set -eux -o pipefail

            bin='${target.dir}/usr/bin/duckdb'
            nm "$bin" > /tmp/duckdb.nm
            test -s /tmp/duckdb.nm
            missing=0
            for sym in mbedtls_ ZSTD_ yyjson_ utf8proc_ Brotli LZ4_ duckdb_snappy duckdb_fsst_ duckdb_miniz; do
              if ! grep -q "$sym" /tmp/duckdb.nm; then
                echo "missing symbol $sym" >&2
                missing=1
              fi
            done
            nm -C "$bin" > /tmp/duckdb.demangled
            for sym in 'duckdb_re2::' 'duckdb_fmt::' 'duckdb_apache::' 'duckdb_fastpforlib::' 'duckdb_skiplistlib::' 'duckdb_hll::' 'duckdb_httplib::' 'duckdb::ICU'; do
              if ! grep -q "$sym" /tmp/duckdb.demangled; then
                echo "missing symbol $sym" >&2
                missing=1
              fi
            done
            if [ "$missing" -ne 0 ]; then
              exit 1
            fi
            if [ "true" = true ]; then
              grep -q jemalloc /tmp/duckdb.nm
            else
              if grep -q jemalloc /tmp/duckdb.nm; then
                echo "jemalloc symbols linked into musl binary" >&2
                exit 1
              fi
            fi
            if grep -q 'httpfs' /tmp/duckdb.nm; then
              echo "httpfs symbols linked into CLI" >&2
              exit 1
            fi
        - uses: spdx@v1
          with:
            license: Apache-2.0
            name: mbedtls
            purl: pkg:github/Mbed-TLS/mbedtls@3.6.7
            version: 3.6.7
        - uses: spdx@v1
          with:
            license: BSD-3-Clause
            name: zstd
            purl: pkg:github/facebook/zstd@1.5.6
            version: 1.5.6
        - uses: spdx@v1
          with:
            license: MIT
            name: yyjson
            purl: pkg:github/ibireme/yyjson@0.9.0
            version: 0.9.0
        - uses: spdx@v1
          with:
            license: MIT
            name: cpp-httplib
            purl: pkg:github/yhirose/cpp-httplib@0.53.1
            version: 0.53.1
        - uses: spdx@v1
          with:
            license: MIT
            name: utf8proc
            purl: pkg:github/JuliaStrings/utf8proc@2.9.0
            version: 2.9.0
        - uses: spdx@v1
          with:
            license: MIT
            name: fmt
            purl: pkg:github/fmtlib/fmt@6.1.2
            version: 6.1.2
        - uses: spdx@v1
          with:
            license: Unlicense
            name: miniz
            purl: pkg:github/richgel999/miniz@10.0.3
            version: 10.0.3
        - uses: spdx@v1
          with:
            license: MIT
            name: brotli
            purl: pkg:github/google/brotli@1.1.0
            version: 1.1.0
        - uses: spdx@v1
          with:
            license: BSD-2-Clause
            name: lz4
            purl: pkg:github/lz4/lz4@1.9.4
            version: 1.9.4
        - uses: spdx@v1
          with:
            license: BSD-3-Clause
            name: snappy
            purl: pkg:github/google/snappy@1.1.7
            version: 1.1.7
        - uses: spdx@v1
          with:
            license: BSD-2-Clause
            name: jemalloc
            purl: pkg:github/jemalloc/jemalloc@5.3.0-196-ga25b9b8ba91881964be3083db349991bbbbf1661
            version: 5.3.0-196-ga25b9b8ba91881964be3083db349991bbbbf1661
        - uses: spdx@v1
          with:
            license: MIT
            name: fsst
            purl: pkg:github/cwida/fsst@0f0f9057048412da1ee48e35d516155cb7edd155
            version: 0f0f9057048412da1ee48e35d516155cb7edd155
        - uses: spdx@v1
          with:
            license: BSD-3-Clause
            name: re2
            purl: pkg:github/google/re2@2023-02-01
            version: 2023-02-01T00:00:00Z
        - uses: spdx@v1
          with:
            license: Apache-2.0
            name: thrift
            purl: pkg:github/apache/thrift@0.22.0
            version: 0.22.0
        - uses: spdx@v1
          with:
            license: MIT
            name: hyperloglog
            purl: pkg:dhi/duckdb-hyperloglog@2.0.0
            version: 2.0.0
        - uses: spdx@v1
          with:
            license: Apache-2.0
            name: fastpforlib
            purl: pkg:dhi/duckdb-fastpforlib@2.0.0
            version: 2.0.0
        - uses: spdx@v1
          with:
            license: MIT
            name: skiplist
            purl: pkg:dhi/duckdb-skiplist@2.0.0
            version: 2.0.0
        - uses: spdx@v1
          with:
            license: LicenseRef-Public-Domain
            name: iana-tzdata
            purl: pkg:generic/tzdata@2026e
            version: 2026e
        - name: install sbom
          runs: |
            set -eux -o pipefail

            test -f /opt/docker/sbom/duckdb/.spdx.duckdb.json
            test -f /opt/docker/sbom/mbedtls/.spdx.mbedtls.json
            test -f /opt/docker/sbom/zstd/.spdx.zstd.json
            test -f /opt/docker/sbom/yyjson/.spdx.yyjson.json
            test -f /opt/docker/sbom/cpp-httplib/.spdx.cpp-httplib.json
            test -f /opt/docker/sbom/utf8proc/.spdx.utf8proc.json
            test -f /opt/docker/sbom/fmt/.spdx.fmt.json
            test -f /opt/docker/sbom/miniz/.spdx.miniz.json
            test -f /opt/docker/sbom/brotli/.spdx.brotli.json
            test -f /opt/docker/sbom/lz4/.spdx.lz4.json
            test -f /opt/docker/sbom/snappy/.spdx.snappy.json
            test -f /opt/docker/sbom/fsst/.spdx.fsst.json
            test -f /opt/docker/sbom/re2/.spdx.re2.json
            grep -q "pkg:github/google/re2@2023-02-01" /opt/docker/sbom/re2/.spdx.re2.json
            test -f /opt/docker/sbom/thrift/.spdx.thrift.json
            grep -q "pkg:github/apache/thrift@0.22.0" /opt/docker/sbom/thrift/.spdx.thrift.json
            test -f /opt/docker/sbom/hyperloglog/.spdx.hyperloglog.json
            grep -q "pkg:dhi/duckdb-hyperloglog@2.0.0" /opt/docker/sbom/hyperloglog/.spdx.hyperloglog.json
            test -f /opt/docker/sbom/fastpforlib/.spdx.fastpforlib.json
            grep -q "pkg:dhi/duckdb-fastpforlib@2.0.0" /opt/docker/sbom/fastpforlib/.spdx.fastpforlib.json
            test -f /opt/docker/sbom/skiplist/.spdx.skiplist.json
            grep -q "pkg:dhi/duckdb-skiplist@2.0.0" /opt/docker/sbom/skiplist/.spdx.skiplist.json
            if [ "true" = true ]; then
              test -f /opt/docker/sbom/jemalloc/.spdx.jemalloc.json
            else
              test ! -e /opt/docker/sbom/jemalloc
            fi
            if [ "false" = true ]; then
              test -f /opt/docker/sbom/icu/.spdx.icu.json
            fi
            if [ "true" = true ]; then
              test -f /opt/docker/sbom/iana-tzdata/.spdx.iana-tzdata.json
            fi
            if [ "false" = true ]; then
              test -f /opt/docker/sbom/libpg-query/.spdx.libpg-query.json
              grep -q "pkg:dhi/duckdb-libpg-query@2.0.0" /opt/docker/sbom/libpg-query/.spdx.libpg-query.json
            fi
            mkdir -p '${target.dir}/opt/docker/sbom'
            cp -a /opt/docker/sbom/. '${target.dir}/opt/docker/sbom/'
        - uses: dhi/build-pkg:0
          with:
            depends:
              - libc6
              - libgcc-s1
              - libstdc++6
            description: In-process analytical SQL database
            files:
              - usr/bin/duckdb
              - usr/share/doc/duckdb-2.0
              - opt/docker/sbom
            formats:
              - deb
            license: MIT
            name: duckdb-2.0
            rel: 0
            url: https://github.com/duckdb/duckdb
            version: 2.0.0
os-release:
  name: Docker Hardened Images (Debian)
  id: debian
  version-id: "13"
  version-codename: trixie
  pretty-name: Docker Hardened Images/Debian GNU/Linux 13 (trixie)
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
