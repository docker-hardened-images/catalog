# syntax=dhi.io/build:2-debian13

name: Percona Server for MongoDB 8.3.x
image: dhi.io/pkg-percona-server-mongodb
variant: runtime
tags:
  - "8.3"
  - 8.3.13
  - 8.3.13-r1
  - 8.3-debian13
  - 8.3.13-debian13
  - 8.3.13-r1-debian13
platforms:
  - linux/amd64
  - linux/arm64
dates:
  release: "2026-07-29"
vars:
  COMMIT_SHA: 7536fd7f3d67f5115de3eb2e271b327b7ce329b9
  DEB_ARCH: '#{ target.arch == "amd64" ? "amd64" : "arm64" }'
  GOLANG_MAJOR_MINOR_VERSION: "1.26"
  GOLANG_VERSION: 1.26.10-0
  MONGO_TOOLS_VERSION: 100.20.0
  MONGOSH_ARCH: '#{ target.arch == "amd64" ? "x64" : "arm64" }'
  MONGOSH_VERSION: 2.14.0
  PACKAGE_NAME: percona-server-mongodb-8.3
  PSMDB_APT_REPO: https://repo.percona.com/psmdb-83/apt
  PSMDB_DEB_POOL: https://repo.percona.com/psmdb-83/apt/pool/main/p/percona-server-mongodb
  PSMDB_MONGOS_SHA256: '#{ target.arch == "amd64" ? definition.vars.PSMDB_MONGOS_SHA256_AMD64 : definition.vars.PSMDB_MONGOS_SHA256_ARM64 }'
  PSMDB_MONGOS_SHA256_AMD64: a1bd870447d69adca0c4a068ad9a07054329c27cea1ec6d2df419fd75fc08182
  PSMDB_MONGOS_SHA256_ARM64: 9a2a13ba574af5e50bf76bfd85ee38934d96bedb3fa4a38010a09c9f3ffcba93
  PSMDB_SERVER_SHA256: '#{ target.arch == "amd64" ? definition.vars.PSMDB_SERVER_SHA256_AMD64 : definition.vars.PSMDB_SERVER_SHA256_ARM64 }'
  PSMDB_SERVER_SHA256_AMD64: fdc1877186f29fc7806717d997c643a02f9693341c6b295b49e13f3dca59e022
  PSMDB_SERVER_SHA256_ARM64: 4cdebb1eaf9e02c2daf7f22150d28f30c645e6c0796326a1075cb533c225e828
  REL: "1"
  SEMVER_MAJOR_MINOR_VERSION: "8.3"
  SEMVER_MAJOR_VERSION: "8"
  SEMVER_VERSION: 8.3.13
  VERSION: 8.3.13-4
contents:
  packages:
    - base-files
  builds:
    - name: percona-server-mongodb
      work-dir: /go/src/github.com/mongodb/mongo-tools
      contents:
        repositories:
          - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
        keyring:
          - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
        packages:
          - bash
          - ca-certificates
          - ca-certificates-bundle
          - coreutils
          - dpkg
          - gcc
          - golang-1.26=1.26.10-0
          - golang-1.26-oci-config=1.26.10-0
          - gpg
          - gpg-agent
          - gzip
          - libc6-dev
          - libkrb5-dev
          - tar
        files:
          - url: https://repo.percona.com/psmdb-83/apt/pool/main/p/percona-server-mongodb/percona-server-mongodb-server_8.3.13-4.noble_${DEB_ARCH}.deb
            checksum: sha256:${PSMDB_SERVER_SHA256}
            path: ${source.dir}/psmdb-server.deb
            spdx:
              name: percona-server-mongodb
              version: 8.3.13-4
              packages:
                - name: percona-server-mongodb
                  purl: pkg:github/percona/percona-server-mongodb@8.3.13-4
                  license: SSPL-1.0
            uid: 0
            gid: 0
          - url: https://repo.percona.com/psmdb-83/apt/pool/main/p/percona-server-mongodb/percona-server-mongodb-mongos_8.3.13-4.noble_${DEB_ARCH}.deb
            checksum: sha256:${PSMDB_MONGOS_SHA256}
            path: ${source.dir}/psmdb-mongos.deb
            uid: 0
            gid: 0
          - url: https://pgp.mongodb.com/mongosh.asc
            path: ${source.dir}/keys/mongosh.asc
            uid: 0
            gid: 0
          - url: https://downloads.mongodb.com/compass/mongosh-2.14.0-linux-${MONGOSH_ARCH}-openssl3.tgz
            path: ${source.dir}/mongosh.tgz
            spdx:
              name: mongosh
              version: 2.14.0
              packages:
                - name: mongosh
                  purl: pkg:npm/mongosh@2.14.0
                  license: Apache-2.0
            uid: 0
            gid: 0
          - url: https://downloads.mongodb.com/compass/mongosh-2.14.0-linux-${MONGOSH_ARCH}-openssl3.tgz.sig
            path: ${source.dir}/mongosh.tgz.sig
            uid: 0
            gid: 0
          - url: git+https://github.com/mongodb/mongo-tools.git#100.20.0
            checksum: 7536fd7f3d67f5115de3eb2e271b327b7ce329b9
            path: /go/src/github.com/mongodb/mongo-tools
            spdx:
              name: mongo-tools
              version: 100.20.0
              packages:
                - name: mongo-tools
                  purl: pkg:golang/github.com/mongodb/mongo-tools@100.20.0
                  license: Apache-2.0
            uid: 0
            gid: 0
      pipeline:
        - name: install percona server
          runs: |
            set -eux -o pipefail

            dpkg-deb -x "${source.dir}/psmdb-server.deb" "${source.dir}/psmdb-server"
            dpkg-deb -x "${source.dir}/psmdb-mongos.deb" "${source.dir}/psmdb-mongos"
            for bin in mongod mongobridge perconadecrypt; do
              install -D -m 0755 "${source.dir}/psmdb-server/usr/bin/${bin}" "${target.dir}/usr/bin/${bin}"
            done
            install -D -m 0755 "${source.dir}/psmdb-mongos/usr/bin/mongos" "${target.dir}/usr/bin/mongos"
        - name: verify mongosh GPG
          uses: gpg/verify@v1
          with:
            file: ${source.dir}/mongosh.tgz
            keys: ${source.dir}/keys/mongosh.asc
            signature: ${source.dir}/mongosh.tgz.sig
        - name: install mongosh
          runs: |
            set -eux -o pipefail

            tar -xzf "${source.dir}/mongosh.tgz" -C "${source.dir}"
            install -D -m 0755 \
              "${source.dir}/mongosh-2.14.0-linux-${MONGOSH_ARCH}-openssl3/bin/mongosh" \
              "${target.dir}/usr/bin/mongosh"
        - name: update go dependencies (8.3 only)
          uses: go/bump@v2
          with:
            deps:
              - golang.org/x/net@v0.62.0
        - uses: go/hermetic@v1
        - name: test
          runs: |
            set -eux -o pipefail

            go test ./common/json/... ./common/bsonutil/... ./common/util/... -count=1
        - name: build bsondump
          uses: go/build@v1
          with:
            cgo_enabled: 1
            ldflags:
              - -X main.VersionStr=100.20.0
              - -X main.GitCommit=7536fd7f3d67f5115de3eb2e271b327b7ce329b9
            output: ${target.dir}/usr/bin/bsondump
            packages: ./bsondump/main
            tags: gssapi
        - name: build mongodump
          uses: go/build@v1
          with:
            cgo_enabled: 1
            ldflags:
              - -X main.VersionStr=100.20.0
              - -X main.GitCommit=7536fd7f3d67f5115de3eb2e271b327b7ce329b9
            output: ${target.dir}/usr/bin/mongodump
            packages: ./mongodump/main
            tags: gssapi
        - name: build mongoexport
          uses: go/build@v1
          with:
            cgo_enabled: 1
            ldflags:
              - -X main.VersionStr=100.20.0
              - -X main.GitCommit=7536fd7f3d67f5115de3eb2e271b327b7ce329b9
            output: ${target.dir}/usr/bin/mongoexport
            packages: ./mongoexport/main
            tags: gssapi
        - name: build mongofiles
          uses: go/build@v1
          with:
            cgo_enabled: 1
            ldflags:
              - -X main.VersionStr=100.20.0
              - -X main.GitCommit=7536fd7f3d67f5115de3eb2e271b327b7ce329b9
            output: ${target.dir}/usr/bin/mongofiles
            packages: ./mongofiles/main
            tags: gssapi
        - name: build mongoimport
          uses: go/build@v1
          with:
            cgo_enabled: 1
            ldflags:
              - -X main.VersionStr=100.20.0
              - -X main.GitCommit=7536fd7f3d67f5115de3eb2e271b327b7ce329b9
            output: ${target.dir}/usr/bin/mongoimport
            packages: ./mongoimport/main
            tags: gssapi
        - name: build mongorestore
          uses: go/build@v1
          with:
            cgo_enabled: 1
            ldflags:
              - -X main.VersionStr=100.20.0
              - -X main.GitCommit=7536fd7f3d67f5115de3eb2e271b327b7ce329b9
            output: ${target.dir}/usr/bin/mongorestore
            packages: ./mongorestore/main
            tags: gssapi
        - name: build mongostat
          uses: go/build@v1
          with:
            cgo_enabled: 1
            ldflags:
              - -X main.VersionStr=100.20.0
              - -X main.GitCommit=7536fd7f3d67f5115de3eb2e271b327b7ce329b9
            output: ${target.dir}/usr/bin/mongostat
            packages: ./mongostat/main
            tags: gssapi
        - name: build mongotop
          uses: go/build@v1
          with:
            cgo_enabled: 1
            ldflags:
              - -X main.VersionStr=100.20.0
              - -X main.GitCommit=7536fd7f3d67f5115de3eb2e271b327b7ce329b9
            output: ${target.dir}/usr/bin/mongotop
            packages: ./mongotop/main
            tags: gssapi
        - uses: dhi/build-pkg:0
          with:
            depends:
              - ca-certificates-bundle
              - libcurl4t64
              - libgssapi-krb5-2
              - libldap2
              - libsasl2-2
              - libssl3t64
            description: Percona Server for MongoDB database server
            files:
              - usr/bin/mongod
              - usr/bin/perconadecrypt
            formats:
              - deb
            license: SSPL-1.0
            name: percona-server-mongodb-8.3
            rel: 1
            subpackages:
              - depends:
                  - ca-certificates-bundle
                  - libcurl4t64
                  - libgssapi-krb5-2
                  - libldap2
                  - libsasl2-2
                  - libssl3t64
                description: Percona Server for MongoDB sharded cluster query router
                files:
                  - path: usr/bin/mongos
                name: percona-server-mongodb-8.3-mongos
              - depends:
                  - libsasl2-2
                  - libssl3t64
                description: Percona Server for MongoDB network bridge for testing
                files:
                  - path: usr/bin/mongobridge
                name: percona-server-mongodb-8.3-mongobridge
              - depends:
                  - libssl3t64
                  - zlib1g
                description: MongoDB Shell (mongosh)
                files:
                  - path: usr/bin/mongosh
                name: percona-server-mongodb-8.3-mongosh
              - depends:
                  - ca-certificates-bundle
                  - libgssapi-krb5-2
                  - libkrb5-3
                description: MongoDB database tools
                files:
                  - path: usr/bin/bsondump
                  - path: usr/bin/mongodump
                  - path: usr/bin/mongoexport
                  - path: usr/bin/mongofiles
                  - path: usr/bin/mongoimport
                  - path: usr/bin/mongorestore
                  - path: usr/bin/mongostat
                  - path: usr/bin/mongotop
                name: percona-server-mongodb-8.3-tools
            url: https://www.percona.com/mongodb/software/percona-server-for-mongodb
            version: 8.3.13-4
os-release:
  name: Docker Hardened Images (Debian)
  id: debian
  version-id: "13"
  version-codename: trixie
  pretty-name: Docker Hardened Images/Debian GNU/Linux 13 (trixie)
  home-url: https://docker.com/products/hardened-images/
