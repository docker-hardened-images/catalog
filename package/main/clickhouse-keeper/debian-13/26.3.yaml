# syntax=dhi.io/build:2-debian13

image: dhi.io/pkg-clickhouse-keeper
variant: runtime
tags:
  - "26.3"
  - 26.3.31
  - 26.3.31-r0
  - 26.3-debian13
  - 26.3.31-debian13
  - 26.3.31-r0-debian13
platforms:
  - linux/amd64
  - linux/arm64
vars:
  DEBIAN_EPOCH_MAJOR_MINOR_VERSION: "26.3"
  DEBIAN_EPOCH_MAJOR_VERSION: "26"
  DEBIAN_EPOCH_VERSION: 26.3.31
  PACKAGE_NAME: clickhouse-keeper-26.3
  REL: "0"
  SEMVER_MAJOR_MINOR_VERSION: "26.3"
  SEMVER_MAJOR_VERSION: "26"
  SEMVER_VERSION: 26.3.31
  VERSION: 26.3.31.5
contents:
  packages:
    - base-files
  builds:
    - name: clickhouse-keeper
      contents:
        repositories:
          - deb [signed-by=/usr/share/keyrings/clickhouse-keyring.gpg] https://packages.clickhouse.com/deb stable main
        keyring:
          - https://keyserver.ubuntu.com/pks/lookup?op=get&search=0x3a9ea1193a97b548be1457d48919f6bd2b48d754
        packages:
          - apt
          - bash
          - ca-certificates
          - coreutils
          - debconf
          - diffutils
          - dpkg
          - findutils
          - locales
        mappings:
          clickhouse-keeper: pkg:deb/clickhouse/clickhouse-keeper@26.3.31.5?os_name=debian&os_version=13
      pipeline:
        - name: install and stage clickhouse-keeper package
          privileged: true
          runs: |
            set -eux -o pipefail

            apt-get update
            mkdir -p "${source.dir}/debs"
            (
              cd "${source.dir}/debs"
              apt-get download "clickhouse-keeper=26.3.31.5"
            )

            for deb in "${source.dir}/debs/"*.deb; do
              dpkg-deb -x "${deb}" "${target.dir}"
            done

            locale-gen en_US.UTF-8

            mkdir -p \
              "${target.dir}/var/lib/clickhouse-keeper" \
              "${target.dir}/var/log/clickhouse-keeper"

            touch "${target.dir}/var/lib/clickhouse-keeper/.keep"
            touch "${target.dir}/var/log/clickhouse-keeper/.keep"

            chown -R 65532:65532 "${target.dir}/var/lib/clickhouse-keeper"
            chown -R 65532:65532 "${target.dir}/var/log/clickhouse-keeper"
            chmod ugo+Xrw -R "${target.dir}/etc/clickhouse-keeper"
        - uses: dhi/build-pkg:0
          with:
            depends:
              - bash
              - ca-certificates
              - coreutils
              - findutils
              - locales
              - tzdata
            description: ClickHouse Keeper coordination service
            files:
              - etc/clickhouse-keeper
              - lib
              - usr
              - var/lib/clickhouse-keeper
              - var/log/clickhouse-keeper
            formats:
              - deb
            license: Apache-2.0
            name: clickhouse-keeper-26.3
            rel: 0
            url: https://clickhouse.com/docs/guides/sre/keeper/clickhouse-keeper
            version: 26.3.31.5
os-release:
  name: Docker Hardened Images (Debian)
  id: debian
  version-id: "13"
  version-codename: trixie
  pretty-name: Docker Hardened Images/Debian GNU/Linux 13 (trixie)
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
