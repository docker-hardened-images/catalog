# syntax=dhi.io/build:2-debian13

image: dhi.io/pkg-valkey
variant: runtime
tags:
  - 9.2.0-0
  - 9.2.0-0-debian13
platforms:
  - linux/amd64
  - linux/arm64
dates:
  release: "2026-11-19"
  end-of-life: "2031-11-19"
vars:
  COMMIT_SHA: d23684e3ec302240754664417e3b99df23e8e4c9
  DHI_REL: "0"
  DHI_VERSION: 9.2.0-0
  LZ4_VERSION: 1.10.0
  PACKAGE_NAME: valkey-9.2
  SEMVER_MAJOR_MINOR: "9.2"
  VERSION: 9.2.0
contents:
  packages:
    - '!base-files'
  builds:
    - name: valkey deb
      work-dir: ${source.dir}/valkey
      contents:
        packages:
          - build-essential
          - debhelper
          - dpkg-dev
          - libgmock-dev
          - libgtest-dev
          - libssl-dev
          - mawk
          - pkg-config
          - python3
        files:
          - url: git+https://github.com/valkey-io/valkey.git#9.2.0
            checksum: d23684e3ec302240754664417e3b99df23e8e4c9
            path: ${source.dir}/valkey
            spdx:
              name: valkey
              version: 9.2.0
              packages:
                - name: valkey
                  purl: pkg:dhi/valkey@9.2.0
                  license: BSD-3-Clause
                - name: jemalloc
                  purl: pkg:generic/jemalloc@5.3.0
                  license: BSD-2-Clause
                - name: lua
                  purl: pkg:generic/lua@5.1
                  license: MIT
                - name: hdr_histogram
                  purl: pkg:github/HdrHistogram/HdrHistogram_c
                  license: BSD-2-Clause
                - name: linenoise
                  purl: pkg:github/antirez/linenoise
                  license: BSD-2-Clause
                - name: fpconv
                  purl: pkg:github/night-shift/fpconv
                  license: BSL-1.0
                - name: fast_float
                  purl: pkg:github/fastfloat/fast_float
                  license: Apache-2.0
                - name: libvalkey
                  purl: pkg:github/valkey-io/libvalkey
                  license: BSD-3-Clause
            uid: 0
            gid: 0
      pipeline:
        - name: prepare debian packaging
          runs: |
            set -eux -o pipefail

            sed -i "s/@PKG@/valkey-9.2/g" debian/control.in debian/changelog
            mv debian/control.in debian/control
            mv debian/server.install "debian/valkey-9.2-server.install"
            mv debian/server.links "debian/valkey-9.2-server.links"
            mv debian/tools.install "debian/valkey-9.2-tools.install"
            mv debian/tools.links "debian/valkey-9.2-tools.links"
            mv debian/sentinel.install "debian/valkey-9.2-sentinel.install"
            mv debian/sentinel.links "debian/valkey-9.2-sentinel.links"
        - uses: dpkg/bump@v1
          with:
            changelog:
              - DHI Build
            version: 9.2.0-0
        - uses: spdx@v1
          with:
            license: BSD-2-Clause
            name: lz4
            purl: pkg:github/lz4/lz4@v1.10.0
            version: 1.10.0
        - uses: dpkg/build@v1
          with:
            args: -b -uc -us -d
      paths:
        - type: directory
          path: ${source.dir}/valkey/debian
          uid: 0
          gid: 0
          mode: "0600"
          source: package/main/valkey/debian-13/debian
os-release:
  name: Docker Hardened Images (Debian)
  id: debian
  version-id: "13"
  version-codename: trixie
  pretty-name: Docker Hardened Images/Debian GNU/Linux 13 (trixie)
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
