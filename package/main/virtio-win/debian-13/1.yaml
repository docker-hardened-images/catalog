image: dhi.io/pkg-virtio-win
variant: runtime
tags:
  - 1.9.45
  - 1.9.45-r0
  - 1.9.45-debian13
  - 1.9.45-r0-debian13
platforms:
  - linux/amd64
  - linux/arm64
dates:
  release: "2025-02-25"
vars:
  CHECKSUM: 1036c2f17d7d24a1227c9f0df62a3de0ca55cb63aa7396a1cc1c57c4e036a949
  DHI_TEST_DEB_EXPECTED_FILES: /usr/share/virtio-win/drivers/amd64/Win2022/viostor.sys /usr/share/virtio-win/drivers/i386/Win10/viostor.sys
  REL: "0"
  RPM_RELEASE: 1.el10
  SEMVER_MAJOR_MINOR_VERSION: "1.9"
  SEMVER_MAJOR_VERSION: "1"
  SEMVER_VERSION: 1.9.45
  VERSION: 1.9.45
contents:
  packages:
    - base-files
  builds:
    - name: virtio-win
      contents:
        repositories:
          - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
        keyring:
          - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
        packages:
          - bash
          - coreutils
          - libarchive-tools
        files:
          - url: https://kojihub.stream.centos.org/kojifiles/packages/virtio-win/1.9.45/1.el10/noarch/virtio-win-1.9.45-1.el10.noarch.rpm
            checksum: sha256:1036c2f17d7d24a1227c9f0df62a3de0ca55cb63aa7396a1cc1c57c4e036a949
            path: /tmp/virtio-win.rpm
            spdx:
              name: virtio-win
              version: 1.9.45
              packages:
                - name: virtio-win
                  purl: pkg:rpm/centos/virtio-win@1.9.45
                  license: Apache-2.0 AND BSD-3-Clause AND GPL-2.0-only AND GPL-2.0-or-later
            uid: 0
            gid: 0
      pipeline:
        - name: extract virtio drivers
          runs: |
            set -eux -o pipefail

            mkdir -p /tmp/vw "${target.dir}"/usr/share/virtio-win/drivers
            bsdtar -xf /tmp/virtio-win.rpm -C /tmp/vw ./usr/share/virtio-win/drivers

            cp -r /tmp/vw/usr/share/virtio-win/drivers/amd64 \
              /tmp/vw/usr/share/virtio-win/drivers/i386 \
              "${target.dir}"/usr/share/virtio-win/drivers/
            rm -rf /tmp/vw

            test -f "${target.dir}"/usr/share/virtio-win/drivers/amd64/Win2022/viostor.sys
            test -f "${target.dir}"/usr/share/virtio-win/drivers/i386/Win10/viostor.sys
        - uses: dhi/build-pkg:0
          with:
            description: VirtIO drivers for Windows guests converted by virt-v2v
            files:
              - usr/share/virtio-win/drivers/amd64
              - usr/share/virtio-win/drivers/i386
            formats:
              - deb
            license: Apache-2.0 AND BSD-3-Clause AND GPL-2.0-only AND GPL-2.0-or-later
            name: virtio-win
            priority: optional
            rel: 0
            section: admin
            url: https://github.com/virtio-win/kvm-guest-drivers-windows
            version: 1.9.45
