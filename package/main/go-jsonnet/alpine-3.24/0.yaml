# syntax=dhi.io/build:2-alpine3.24

image: dhi.io/pkg-go-jsonnet
variant: runtime
tags:
  - 0.22.0-alpine3.24
  - 0.22.0-r4-alpine3.24
platforms:
  - linux/amd64
  - linux/arm64
vars:
  COMMIT_SHA: 567b61ac4a6c23546a62d79324bb4aaed6bdc941
  GOLANG_MAJOR_MINOR_VERSION: "1.26"
  GOLANG_VERSION: 1.26.8-r0
  PACKAGE_NAME: go-jsonnet
  REL: "4"
  SEMVER_MAJOR_MINOR_VERSION: "0.22"
  SEMVER_MAJOR_VERSION: "0"
  SEMVER_VERSION: 0.22.0
  VERSION: 0.22.0
contents:
  repositories:
    - https://dhi.io/apk/alpine/v3.24/main
    - https://dhi.io/apk/alpine/v3.23/main
    - https://dl-cdn.alpinelinux.org/alpine/v3.24/main
    - https://dl-cdn.alpinelinux.org/alpine/v3.24/community
  keyring:
    - https://dhi.io/keyring/dhi-apk@docker-0F81AD7700D99184.rsa.pub
  packages:
    - alpine-baselayout-data
  builds:
    - name: go-jsonnet
      work-dir: /go/src/github.com/google/go-jsonnet
      caches:
        - path: /go/pkg/mod
      contents:
        packages:
          - busybox
          - bash
          - ca-certificates-bundle
          - coreutils
          - findutils
          - g++
          - gcc
          - mawk
          - musl-dev
          - sed
          - golang-1.26=1.26.8-r0
          - golang-1.26-oci-config=1.26.8-r0
        files:
          - url: git+https://github.com/google/go-jsonnet.git#v0.22.0
            checksum: 567b61ac4a6c23546a62d79324bb4aaed6bdc941
            path: /go/src/github.com/google/go-jsonnet
            spdx:
              name: go-jsonnet
              version: 0.22.0
              packages:
                - name: go-jsonnet
                  purl: pkg:golang/github.com/google/go-jsonnet@0.22.0
                  license: Apache-2.0
            uid: 0
            gid: 0
      pipeline:
        - name: update go dependencies
          uses: go/bump@v1
          with:
            deps:
              - golang.org/x/crypto@v0.56.0
            download: true
        - name: test
          privileged: true
          runs: |
            set -eux -o pipefail

            export SKIP_PYTHON_BINDINGS_TESTS=1
            ./tests.sh
        - name: build jsonnet
          uses: go/build@v1
          with:
            fips: false
            output: ${target.dir}/usr/bin/jsonnet
            packages: ./cmd/jsonnet
        - name: build jsonnet dev
          uses: go/build@v1
          with:
            fips: false
            output: ${target.dir}/usr/bin/jsonnet-dev
            packages: ./cmd/jsonnet
            strip: false
        - name: build jsonnetfmt
          uses: go/build@v1
          with:
            fips: false
            output: ${target.dir}/usr/bin/jsonnetfmt
            packages: ./cmd/jsonnetfmt
        - name: build jsonnetfmt dev
          uses: go/build@v1
          with:
            fips: false
            output: ${target.dir}/usr/bin/jsonnetfmt-dev
            packages: ./cmd/jsonnetfmt
            strip: false
        - name: build jsonnet-deps
          uses: go/build@v1
          with:
            fips: false
            output: ${target.dir}/usr/bin/jsonnet-deps
            packages: ./cmd/jsonnet-deps
        - name: build jsonnet-deps dev
          uses: go/build@v1
          with:
            fips: false
            output: ${target.dir}/usr/bin/jsonnet-deps-dev
            packages: ./cmd/jsonnet-deps
            strip: false
        - name: build jsonnet-lint
          uses: go/build@v1
          with:
            fips: false
            output: ${target.dir}/usr/bin/jsonnet-lint
            packages: ./cmd/jsonnet-lint
        - name: build jsonnet-lint dev
          uses: go/build@v1
          with:
            fips: false
            output: ${target.dir}/usr/bin/jsonnet-lint-dev
            packages: ./cmd/jsonnet-lint
            strip: false
        - uses: dhi/build-pkg:0
          with:
            description: Jsonnet command-line tools
            files:
              - usr/bin/jsonnet
              - usr/bin/jsonnetfmt
              - usr/bin/jsonnet-deps
              - usr/bin/jsonnet-lint
            license: Apache-2.0
            name: go-jsonnet
            rel: 4
            subpackages:
              - files:
                  - path: usr/bin/jsonnet
                    source: usr/bin/jsonnet-dev
                  - path: usr/bin/jsonnetfmt
                    source: usr/bin/jsonnetfmt-dev
                  - path: usr/bin/jsonnet-deps
                    source: usr/bin/jsonnet-deps-dev
                  - path: usr/bin/jsonnet-lint
                    source: usr/bin/jsonnet-lint-dev
                name: go-jsonnet-dev
            url: https://github.com/google/go-jsonnet
            version: 0.22.0
os-release:
  name: Docker Hardened Images (Alpine)
  id: alpine
  version-id: "3.24"
  pretty-name: Docker Hardened Images/Alpine Linux v3.24
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
