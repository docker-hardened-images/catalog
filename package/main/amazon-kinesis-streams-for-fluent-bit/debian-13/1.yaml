vars:
  COMMIT_SHA: cfe06d78e31002ed2b2c977034cf283e02ec55a3
  GOLANG_MAJOR_MINOR_VERSION: "1.27"
  GOLANG_VERSION: 1.27.4-18
  PACKAGE_NAME: amazon-kinesis-streams-for-fluent-bit-1
