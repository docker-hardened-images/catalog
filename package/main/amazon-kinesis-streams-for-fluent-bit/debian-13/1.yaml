  VERSION: 1.10.4
contents:
  repositories:
    - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
  keyring:
    - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
  packages:
    - base-files
  builds:
    - name: amazon-kinesis-streams-for-fluent-bit-1
      work-dir: /go/src/github.com/aws/amazon-kinesis-streams-for-fluent-bit
      contents:
        packages:
          - bash
          - ca-certificates-bundle
          - coreutils
          - findutils
          - gcc
          - libc6-dev
          - mawk
          - sed
          - golang-1.27=1.27.4-18
          - golang-1.27-oci-config=1.27.4-18
        files:
          - url: git+https://github.com/aws/amazon-kinesis-streams-for-fluent-bit.git#v1.10.4
            checksum: cfe06d78e31002ed2b2c977034cf283e02ec55a3
            path: /go/src/github.com/aws/amazon-kinesis-streams-for-fluent-bit
            spdx:
              name: amazon-kinesis-streams-for-fluent-bit
              version: 1.10.4
              packages:
                - name: amazon-kinesis-streams-for-fluent-bit
                  purl: pkg:golang/github.com/aws/amazon-kinesis-streams-for-fluent-bit@v1.10.4
                  license: Apache-2.0
            uid: 0
            gid: 0
      pipeline:
        - name: update go dependencies
          uses: go/bump@v2
          with:
            deps:
              - golang.org/x/sys@v0.44.0
            download: true
        - name: test
          runs: |
            set -eux -o pipefail

            go test -timeout=120s ./...
        - name: build kinesis plugin
          uses: go/build@v1
          with:
            cgo_enabled: 1
            extra-args: -buildmode=c-shared
            fips: false
            output: ${target.dir}/usr/lib/amazon-kinesis-streams-for-fluent-bit/kinesis.so
        - name: stage license files
          runs: |
            set -eux -o pipefail

            install -D -m 0644 LICENSE "${target.dir}/usr/share/licenses/amazon-kinesis-streams-for-fluent-bit/LICENSE"
            install -D -m 0644 THIRD-PARTY "${target.dir}/usr/share/licenses/amazon-kinesis-streams-for-fluent-bit/THIRD-PARTY"
            install -D -m 0644 NOTICE "${target.dir}/usr/share/licenses/amazon-kinesis-streams-for-fluent-bit/NOTICE"

            install -d "${target.dir}/opt/docker/sbom"
            cp -a /opt/docker/sbom/amazon-kinesis-streams-for-fluent-bit "${target.dir}/opt/docker/sbom/"
            test -s "${target.dir}/opt/docker/sbom/amazon-kinesis-streams-for-fluent-bit/.spdx.amazon-kinesis-streams-for-fluent-bit.json"
        - uses: dhi/build-pkg:0
          with:
            conflicts: amazon-kinesis-streams-for-fluent-bit-1-fips
            depends:
              - libc6
            description: Amazon Kinesis Data Streams output plugin for Fluent Bit
            files:
              - usr/lib/amazon-kinesis-streams-for-fluent-bit/kinesis.so
              - usr/share/licenses/amazon-kinesis-streams-for-fluent-bit
              - opt/docker/sbom/amazon-kinesis-streams-for-fluent-bit
            formats:
              - deb
            license: Apache-2.0
            name: amazon-kinesis-streams-for-fluent-bit-1
            rel: 18
            url: https://github.com/aws/amazon-kinesis-streams-for-fluent-bit
            version: 1.10.4
