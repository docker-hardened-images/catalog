            download: true
        - name: package gateway-helm chart
          runs: |
            set -eux -o pipefail

            chart=/go/src/github.com/envoyproxy/gateway/charts/gateway-helm
            sed \
              -e "s|\${GatewayImage}|docker.io/envoyproxy/gateway:v1.8.2|g" \
              -e "s|\${GatewayImagePullPolicy}|IfNotPresent|g" \
              "$chart/values.tmpl.yaml" > "$chart/values.yaml"
            helm dependency update "$chart"
            out=$(mktemp -d)
            helm package "$chart" \
              --app-version "v1.8.2" \
              --version "v1.8.2" \
              --destination "$out"
            mkdir -p /go/src/github.com/tigera/operator/pkg/render/gatewayapi
            mv "$out"/gateway-helm-*.tgz \
              /go/src/github.com/tigera/operator/pkg/render/gatewayapi/gateway-helm.tgz
