          runs: |
            set -eux -o pipefail

            for i in {1..3}; do
              if CGO_ENABLED=0 go test $(go list ./pkg/... | grep -v -E 'pkg/(crds|controller)'); then
                exit 0
              fi
              echo "Retry $i/3..."
              sleep 2
            done

            exit 1
