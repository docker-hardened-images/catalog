# syntax=dhi.io/build:2-alpine3.24

image: dhi.io/pkg-linkerd-tap
variant: runtime
tags:
  - 26.10.3-alpine3.24
  - 26.10.3-r0-alpine3.24
platforms:
  - linux/amd64
  - linux/arm64
vars:
  COMMIT_SHA: 1408ae4afa76154be420001e99de13de594bad5e
  GOLANG_VERSION: 1.26.10-r0
  PACKAGE_NAME: linkerd-tap
  REL: "0"
  SEMVER_MAJOR_MINOR_VERSION: "26.10"
  SEMVER_MAJOR_VERSION: "26"
  SEMVER_VERSION: 26.10.3
  VERSION: 26.10.3
contents:
  repositories:
    - https://dhi.io/apk/alpine/v3.24/main
    - https://dhi.io/apk/alpine/v3.23/main
    - https://dl-cdn.alpinelinux.org/alpine/v3.24/main
    - https://dl-cdn.alpinelinux.org/alpine/v3.24/community
  keyring:
    - https://dhi.io/keyring/dhi-apk@docker-0F81AD7700D99184.rsa.pub
  packages:
    - alpine-baselayout-data
  builds:
    - name: linkerd-tap
      work-dir: /go/src/github.com/linkerd/linkerd2
      contents:
        packages:
          - busybox
          - bash
          - ca-certificates-bundle
          - golang-1.26=1.26.10-r0
          - golang-1.26-oci-config=1.26.10-r0
        files:
          - url: git+https://github.com/linkerd/linkerd2.git#edge-26.10.3
            checksum: 1408ae4afa76154be420001e99de13de594bad5e
            path: /go/src/github.com/linkerd/linkerd2
            spdx:
              name: linkerd2
              version: 26.10.3
              packages:
                - name: linkerd2
                  purl: pkg:golang/github.com/linkerd/linkerd2@26.10.3
                  license: Apache-2.0
            uid: 0
            gid: 0
      pipeline:
        - name: update go dependencies
          uses: go/bump@v2
          with:
            deps:
              - golang.org/x/net@v0.62.0
            download: true
        - uses: go/hermetic@v1
        - name: test
          runs: |
            set -eux -o pipefail

            go test -count=1 -mod=readonly -timeout 30m ./viz/tap/...
        - name: build linkerd-tap
          uses: go/build@v1
          with:
            cgo_enabled: 0
            fips: false
            ldflags:
              - -s
              - -w
            output: ${target.dir}/usr/bin/linkerd-tap
            packages: ./viz/tap/cmd
            tags: prod
        - name: build linkerd-tap dev
          uses: go/build@v1
          with:
            cgo_enabled: 0
            fips: false
            ldflags:
              - -X github.com/linkerd/linkerd2/pkg/version.Version=dev-undefined
            output: ${target.dir}/usr/bin/linkerd-tap-dev
            packages: ./viz/tap/cmd
            strip: false
            tags: prod
        - name: stage license and source provenance
          runs: |
            set -eux -o pipefail

            test -s LICENSE
            grep -q "Apache License" LICENSE
            test -s /opt/docker/sbom/linkerd2/.spdx.linkerd2.json
            grep -q "pkg:golang/github.com/linkerd/linkerd2@26.10.3" /opt/docker/sbom/linkerd2/.spdx.linkerd2.json

            for root in "${target.dir}" "${target.dir}/dev"; do
              install -D LICENSE "${root}/usr/share/linkerd-tap/LICENSE"
              test -s "${root}/usr/share/linkerd-tap/LICENSE"
              grep -q "Apache License" "${root}/usr/share/linkerd-tap/LICENSE"
              install -d "${root}/opt/docker/sbom"
              cp -a /opt/docker/sbom/linkerd2 "${root}/opt/docker/sbom/"
              test -s "${root}/opt/docker/sbom/linkerd2/.spdx.linkerd2.json"
            done
        - uses: dhi/build-pkg:0
          with:
            description: Linkerd viz tap APIService and injector webhook
            files:
              - usr/bin/linkerd-tap
              - mode: "0644"
                path: usr/share/linkerd-tap/LICENSE
              - opt/docker/sbom/linkerd2
            license: Apache-2.0
            name: linkerd-tap
            rel: 0
            subpackages:
              - description: Linkerd viz tap binary without strip (dev)
                files:
                  - path: usr/bin/linkerd-tap
                    source: usr/bin/linkerd-tap-dev
                  - mode: "0644"
                    path: usr/share/linkerd-tap/LICENSE
                    source: dev/usr/share/linkerd-tap/LICENSE
                  - path: opt/docker/sbom/linkerd2
                    source: dev/opt/docker/sbom/linkerd2
                name: linkerd-tap-dev
            url: https://github.com/linkerd/linkerd2
            version: 26.10.3
os-release:
  name: Docker Hardened Images (Alpine)
  id: alpine
  version-id: "3.24"
  pretty-name: Docker Hardened Images/Alpine Linux v3.24
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
