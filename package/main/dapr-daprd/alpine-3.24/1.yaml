# syntax=dhi.io/build:2-alpine3.24

image: dhi.io/pkg-dapr-daprd
variant: runtime
tags:
  - 1.19.0-alpine3.24
  - 1.19.0-r0-alpine3.24
platforms:
  - linux/amd64
  - linux/arm64
dates:
  release: "2025-09-16"
vars:
  COMMIT_SHA: cd59bfba89c39344bfaca73f1eb7c76ec411c258
  GOLANG_MAJOR_MINOR_VERSION: "1.26"
  GOLANG_VERSION: 1.26.10-r0
  PACKAGE_NAME: dapr-daprd
  REL: "0"
  SEMVER_MAJOR_MINOR_VERSION: "1.19"
  SEMVER_MAJOR_VERSION: "1"
  SEMVER_VERSION: 1.19.0
  VERSION: 1.19.0
contents:
  repositories:
    - https://dhi.io/apk/alpine/v3.24/main
    - https://dhi.io/apk/alpine/v3.23/main
    - https://dl-cdn.alpinelinux.org/alpine/v3.24/main
    - https://dl-cdn.alpinelinux.org/alpine/v3.24/community
  keyring:
    - https://dhi.io/keyring/dhi-apk@docker-0F81AD7700D99184.rsa.pub
  packages:
    - alpine-baselayout-data
  builds:
    - name: dapr-daprd
      work-dir: /go/src/github.com/dapr/dapr
      caches:
        - path: /go/pkg/mod
      contents:
        packages:
          - busybox
          - bash
          - ca-certificates-bundle
          - coreutils
          - findutils
          - mawk
          - sed
          - golang-1.26=1.26.10-r0
          - golang-1.26-oci-config=1.26.10-r0
        files:
          - url: git+https://github.com/dapr/dapr.git#v1.19.0
            checksum: cd59bfba89c39344bfaca73f1eb7c76ec411c258
            path: /go/src/github.com/dapr/dapr
            spdx:
              name: dapr-daprd
              version: 1.19.0
              packages:
                - name: dapr-daprd
                  purl: pkg:golang/github.com/dapr/dapr@1.19.0
                  license: Apache-2.0
            uid: 0
            gid: 0
      pipeline:
        - name: update go dependencies
          uses: go/bump@v1
          work-dir: /go/src/github.com/dapr/dapr
          with:
            deps:
              - filippo.io/edwards25519@v1.1.1
              - github.com/go-jose/go-jose/v4@v4.1.4
              - github.com/jackc/pgx/v5@v5.9.2
              - go.mongodb.org/mongo-driver@v1.17.7
              - google.golang.org/grpc@v1.83.2
              - go.etcd.io/etcd/server/v3@v3.5.33
            download: true
            replaces:
              - go.opentelemetry.io/contrib/instrumentation/google.golang.org/grpc/otelgrpc=go.opentelemetry.io/contrib/instrumentation/google.golang.org/grpc/otelgrpc@v0.60.0
              - google.golang.org/grpc=google.golang.org/grpc@v1.83.2
              - go.etcd.io/etcd/api/v3=go.etcd.io/etcd/api/v3@v3.5.33
              - go.etcd.io/etcd/client/pkg/v3=go.etcd.io/etcd/client/pkg/v3@v3.5.33
              - go.etcd.io/etcd/client/v3=go.etcd.io/etcd/client/v3@v3.5.33
              - go.etcd.io/etcd/pkg/v3=go.etcd.io/etcd/pkg/v3@v3.5.33
              - go.etcd.io/etcd/raft/v3=go.etcd.io/etcd/raft/v3@v3.5.33
              - go.etcd.io/etcd/server/v3=go.etcd.io/etcd/server/v3@v3.5.33
        - name: test go dependencies
          work-dir: /go/src/github.com/dapr/dapr
          runs: |
            set -eux -o pipefail

            unset OTEL_EXPORTER_OTLP_TRACES_ENDPOINT || true
            unset OTEL_EXPORTER_OTLP_TRACES_PROTOCOL || true
            export DAPR_HOST_IP="${DAPR_HOST_IP:-127.0.0.1}"

            GOMAXPROCS=1 CGO_ENABLED=0 go test -tags unit -count=1 -p 1 -timeout=30m \
              $(go list -tags unit ./... \
                | grep -v 'github.com/dapr/dapr/tests/' \
                | grep -v 'github.com/dapr/dapr/pkg/actors/internal/placement/connector/dnslookup$')
        - name: build daprd
          uses: go/build@v1
          work-dir: /go/src/github.com/dapr/dapr/cmd/daprd
          with:
            fips: false
            ldflags:
              - -X github.com/dapr/dapr/pkg/buildinfo.gitcommit=cd59bfba89c39344bfaca73f1eb7c76ec411c258
              - -X github.com/dapr/dapr/pkg/buildinfo.gitversion=1.19.0
              - -X github.com/dapr/dapr/pkg/buildinfo.version=1.19.0
            output: ${target.dir}/usr/bin/daprd
            tags: allcomponents
        - name: build daprd dev
          uses: go/build@v1
          work-dir: /go/src/github.com/dapr/dapr/cmd/daprd
          with:
            fips: false
            ldflags:
              - -X github.com/dapr/dapr/pkg/buildinfo.gitcommit=cd59bfba89c39344bfaca73f1eb7c76ec411c258
              - -X github.com/dapr/dapr/pkg/buildinfo.gitversion=1.19.0
              - -X github.com/dapr/dapr/pkg/buildinfo.version=1.19.0
            output: ${target.dir}/usr/bin/daprd-dev
            strip: false
            tags: allcomponents
        - uses: dhi/build-pkg:0
          with:
            description: Dapr sidecar runtime (daprd)
            files:
              - usr/bin/daprd
            license: Apache-2.0
            name: dapr-daprd
            rel: 0
            subpackages:
              - files:
                  - path: usr/bin/daprd
                    source: usr/bin/daprd-dev
                name: dapr-daprd-dev
            url: https://github.com/dapr/dapr
            version: 1.19.0
