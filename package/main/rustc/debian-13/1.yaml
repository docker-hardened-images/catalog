# syntax=dhi.io/build:2-debian13

image: dhi.io/pkg-rustc
variant: runtime
tags:
  - 1.100.0-4
  - 1.100.0-4-debian13
platforms:
  - linux/amd64
  - linux/arm64
vars:
  ARCH: '#{ target.arch == "amd64" ? "x86_64" : "aarch64" }'
  COMMIT_SHA: 0ef1bc386059596dada8fb65b50425aab2ea637a
  DHI_REL: "4"
  DHI_VERSION: 1.100.0-4
  PACKAGE_NAME: rustc
  PYTHON_VERSION: 3.14.10-8
  VERSION: 1.100.0
contents:
  repositories:
    - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
  keyring:
    - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
  packages:
    - base-files
  builds:
    - name: rustc
      work-dir: ${source.dir}/rustc
      environment:
        ARCH: ${ARCH}
        VERSION: 1.100.0
      contents:
        packages:
          - bash
          - binutils
          - coreutils
          - debhelper
          - dpkg-dev
          - findutils
          - grep
          - sed
          - git
          - gcc
          - pkg-config
          - libc6
          - libc-bin
          - cmake
          - curl
          - libcurl4-openssl-dev
          - libssh2-1-dev
          - libssl-dev
          - libsqlite3-dev
          - zlib1g-dev
          - python-3.14=3.14.10-8
          - python-3.14-minimal=3.14.10-8
          - libpython-3.14=3.14.10-8
          - libpython-3.14-minimal=3.14.10-8
          - libpython-3.14-stdlib=3.14.10-8
          - python3-pip-whl
          - python3-setuptools-whl
          - libbz2-1.0
          - libcrypt1
          - libdb5.3t64
          - libexpat1
          - libffi8
          - libgdbm-compat4t64
          - libgdbm6t64
          - liblzma5
          - libncursesw6
          - libreadline8t64
          - libsqlite3-0
          - libssl3t64
          - libstdc++6
          - libtinfo6
          - libuuid1
          - libzstd1
          - readline-common
        files:
          - url: git+https://github.com/rust-lang/rust.git#1.100.0
            checksum: 0ef1bc386059596dada8fb65b50425aab2ea637a
            path: ${source.dir}/rustc
            spdx:
              name: rust-upstream
              version: 1.100.0
              packages:
                - name: rustc
                  purl: pkg:dhi/rust@1.100.0
                  license: MIT OR Apache-2.0
            uid: 0
            gid: 0
      pipeline:
        - name: configure bootstrapping
          runs: |
            set -eux -o pipefail

            cat > bootstrap.toml << EOF
            change-id = 154508

            [build]
            build-stage = 2
            test-stage = 2
            doc-stage = 2
            docs = false
            target = [ "${ARCH}-unknown-linux-gnu" ]
            extended = true
            tools = ["cargo", "clippy", "llvm-bitcode-linker", "llvm-tools", "rust-analyzer", "rustdoc", "rustfmt"]

            [llvm]
            download-ci-llvm = true

            [gcc]
            download-ci-gcc = false

            [rust]
            channel = "auto-detect"
            download-rustc = false
            llvm-bitcode-linker = true
            remap-debuginfo = true

            [dist]
            compression-profile = "balanced"

            [install]
            prefix = "/usr"
            sysconfdir = "/etc"
            EOF
        - uses: spdx@v1
          with:
            license: MIT OR Apache-2.0
            name: cargo-upstream
            purl: pkg:dhi/cargo@1.100.0
            version: 1.100.0
        - uses: spdx@v1
          with:
            license: MIT OR Apache-2.0
            name: rustfmt-upstream
            purl: pkg:dhi/rustfmt@1.100.0
            version: 1.100.0
        - uses: spdx@v1
          with:
            license: MIT OR Apache-2.0
            name: clippy-upstream
            purl: pkg:dhi/clippy@1.100.0
            version: 1.100.0
        - uses: spdx@v1
          with:
            license: MIT OR Apache-2.0
            name: rust-analyzer-upstream
            purl: pkg:dhi/rust-analyzer@1.100.0
            version: 1.100.0
        - uses: spdx@v1
          with:
            license: MIT OR Apache-2.0
            name: rust-gdb-upstream
            purl: pkg:dhi/rust-gdb@1.100.0
            version: 1.100.0
        - uses: spdx@v1
          with:
            license: MIT OR Apache-2.0
            name: rust-lldb-upstream
            purl: pkg:dhi/rust-lldb@1.100.0
            version: 1.100.0
        - name: rust-analyzer cargo sbom
          uses: sbom@v1
          with:
            extra-scanners: rust-cargo-lock-cataloger
            prefix: rust-analyzer-cargo
            source: ${source.dir}/rustc/src/tools/rust-analyzer
        - uses: dpkg/bump@v1
          with:
            changelog:
              - DHI Build
            version: 1.100.0-4
        - uses: dpkg/build@v1
          privileged: true
          environment:
            LIBSQLITE3_SYS_USE_PKG_CONFIG: "1"
            LIBSSH2_SYS_USE_PKG_CONFIG: "1"
            OPENSSL_NO_VENDOR: "1"
            SRC: ${source.dir}
          with:
            args: -b -uc -us -d
      paths:
        - type: directory
          path: ${source.dir}/rustc/debian
          uid: 0
          gid: 0
          mode: "0600"
          source: package/main/rustc/debian-13/debian
os-release:
  name: Docker Hardened Images (Debian)
  id: debian
  version-id: "13"
  version-codename: trixie
  pretty-name: Docker Hardened Images/Debian GNU/Linux 13 (trixie)
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
