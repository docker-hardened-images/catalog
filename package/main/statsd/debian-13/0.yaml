# syntax=dhi.io/build:2-debian13

image: dhi.io/pkg-statsd
variant: runtime
tags:
  - 0.10.2
  - 0.10.2-r1
  - 0.10.2-debian13
  - 0.10.2-r1-debian13
platforms:
  - linux/amd64
  - linux/arm64
dates:
  release: "2012-02-17"
vars:
  COMMIT_SHA: 0e20be57d4918dadf5b5fad61b5c61ef382f8860
  NODEJS_VERSION: 24.22.2-0
  NPM_VERSION: 11.21.2-1
  REL: "1"
  SEMVER_MAJOR_MINOR_VERSION: "0.10"
  SEMVER_MAJOR_VERSION: "0"
  SEMVER_VERSION: 0.10.2
  VERSION: 0.10.2
contents:
  repositories:
    - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
  keyring:
    - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
  packages:
    - base-files
  builds:
    - name: statsd
      work-dir: ${source.dir}/statsd
      caches:
        - path: /root/.npm
      contents:
        packages:
          - bash
          - ca-certificates
          - coreutils
          - g++
          - git
          - make
          - nodejs-24=24.22.2-0
          - nodejs-24-dev=24.22.2-0
          - npm=11.21.2-1
          - python3
          - sed
        files:
          - url: git+https://github.com/statsd/statsd.git#v0.10.2
            checksum: 0e20be57d4918dadf5b5fad61b5c61ef382f8860
            path: ${source.dir}/statsd
            spdx:
              name: statsd
              version: 0.10.2
              packages:
                - name: statsd
                  purl: pkg:npm/statsd@0.10.2
                  license: MIT
            uid: 0
            gid: 0
      pipeline:
        - name: restore util.log
          uses: patch@v1
          with:
            options: -p1
            patches:
              - ${source.dir}/patch/dhi-util-log.patch
        - name: bump nan for Node 24
          uses: npm/bump@v1
          privileged: true
          with:
            bumps: ${source.dir}/patch/npm-bumps.json
            npm-root: ${source.dir}/statsd
        - name: install, test, and prune
          privileged: true
          runs: |
            set -eux -o pipefail

            npm ci --foreground-scripts
            test -d node_modules/nodeunit
            if ! npm test; then
              npm test
            fi
            rm -rf node_modules
            npm ci --omit=dev --foreground-scripts
            npm rebuild modern-syslog --foreground-scripts
            rm -r node_modules/winser node_modules/commander node_modules/keypress node_modules/sequence node_modules/.bin
            test -f node_modules/modern-syslog/build/Release/core.node
            test -d node_modules/generic-pool
            test -d node_modules/hashring
            test ! -e node_modules/nyc
            test ! -e node_modules/typescript
            test ! -e node_modules/request
            test ! -e node_modules/nodeunit
            test ! -e node_modules/winser
        - name: stage payload
          runs: |
            set -eux -o pipefail

            dest="${target.dir}/usr/lib/statsd-0"
            mkdir -p "${dest}"
            cp -a stats.js proxy.js package.json exampleConfig.js exampleProxyConfig.js dhi-util-log.js lib backends servers node_modules "${dest}/"
        - name: npm dependencies sbom
          uses: sbom@v1
          with:
            extra-scanners: javascript-package-cataloger
            prefix: statsd-npm
            source: ${source.dir}/statsd/node_modules
        - name: stage npm sbom
          runs: |
            set -eux -o pipefail

            test -f /opt/docker/sbom/statsd-npm/.spdx.statsd-npm.json
            install -d "${target.dir}/opt/docker/sbom"
            cp -a /opt/docker/sbom/statsd-npm "${target.dir}/opt/docker/sbom/"
            test -f "${target.dir}/opt/docker/sbom/statsd-npm/.spdx.statsd-npm.json"
        - uses: dhi/build-pkg:0
          with:
            deb:
              depends:
                - libc6
                - libstdc++6
            depends:
              - nodejs-24
            description: Network daemon for aggregating realtime application metrics
            files:
              - usr/lib/statsd-0
              - opt/docker/sbom/statsd-npm
            formats:
              - deb
            license: MIT
            name: statsd-0
            rel: 1
            url: https://github.com/statsd/statsd
            version: 0.10.2
      paths:
        - type: file
          path: ${source.dir}/patch/dhi-util-log.patch
          uid: 0
          gid: 0
          source: package/main/statsd/patch/dhi-util-log.patch
        - type: file
          path: ${source.dir}/patch/npm-bumps.json
          uid: 0
          gid: 0
          source: package/main/statsd/patch/npm-bumps.json
os-release:
  name: Docker Hardened Images (Debian)
  id: debian
  version-id: "13"
  version-codename: trixie
  pretty-name: Docker Hardened Images/Debian GNU/Linux 13 (trixie)
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
