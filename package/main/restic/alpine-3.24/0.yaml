# syntax=dhi.io/build:2-alpine3.24

image: dhi.io/pkg-restic
variant: runtime
tags:
  - 0.19.1-alpine3.24
  - 0.19.1-r2-alpine3.24
platforms:
  - linux/amd64
  - linux/arm64
vars:
  COMMIT_SHA: 6aa3a516ce654808a1f28f9fa21e9b7c8e6e90bf
  GOLANG_MAJOR_MINOR_VERSION: "1.26"
  GOLANG_VERSION: 1.26.5-r0
  PACKAGE_NAME: restic
  REL: "2"
  SEMVER_MAJOR_MINOR_VERSION: "0.19"
  SEMVER_MAJOR_VERSION: "0"
  SEMVER_VERSION: 0.19.1
  VERSION: 0.19.1
contents:
  repositories:
    - https://dhi.io/apk/alpine/v3.24/main
    - https://dhi.io/apk/alpine/v3.23/main
    - https://dl-cdn.alpinelinux.org/alpine/v3.24/main
    - https://dl-cdn.alpinelinux.org/alpine/v3.24/community
  keyring:
    - https://dhi.io/keyring/dhi-apk@docker-0F81AD7700D99184.rsa.pub
  packages:
    - alpine-baselayout-data
  builds:
    - name: restic
      work-dir: /go/src/github.com/restic/restic
      caches:
        - path: /go/pkg/mod
      contents:
        packages:
          - busybox
          - bash
          - ca-certificates-bundle
          - coreutils
          - findutils
          - mawk
          - sed
          - golang-1.26=1.26.5-r0
          - golang-1.26-oci-config=1.26.5-r0
        files:
          - url: git+https://github.com/restic/restic.git#v0.19.1
            checksum: 6aa3a516ce654808a1f28f9fa21e9b7c8e6e90bf
            path: /go/src/github.com/restic/restic
            spdx:
              name: restic
              version: 0.19.1
              packages:
                - name: restic
                  purl: pkg:golang/github.com/restic/restic@0.19.1
                  license: BSD-2-Clause
            uid: 0
            gid: 0
      pipeline:
        - name: update go dependencies
          uses: go/bump@v1
          with:
            deps:
              - github.com/klauspost/compress@v1.18.7
              - golang.org/x/crypto@v0.53.0
              - golang.org/x/net@v0.56.0
              - golang.org/x/text@v0.39.0
              - github.com/go-jose/go-jose/v4@v4.1.4
              - go.opentelemetry.io/otel/sdk@v1.43.0
              - google.golang.org/grpc@v1.82.1
              - go.opentelemetry.io/otel@v1.44.0
              - github.com/klauspost/compress@v1.18.7
            download: true
        - name: build
          uses: go/build@v1
          with:
            fips: false
            ldflags:
              - -X main.Version=0.19.1
            output: ${target.dir}/usr/bin/restic
            packages: ./cmd/restic
            tags:
              - disable_grpc_modules
        - name: build dev
          uses: go/build@v1
          with:
            fips: false
            ldflags:
              - -X main.Version=0.19.1
            output: ${target.dir}/usr/bin/restic-dev
            packages: ./cmd/restic
            strip: false
            tags:
              - disable_grpc_modules
        - uses: dhi/build-pkg:0
          with:
            description: Restic backup program
            files:
              - usr/bin/restic
            license: BSD-2-Clause
            name: restic
            rel: 2
            subpackages:
              - files:
                  - path: usr/bin/restic
                    source: usr/bin/restic-dev
                name: restic-dev
            url: https://github.com/restic/restic
            version: 0.19.1
os-release:
  name: Docker Hardened Images (Alpine)
  id: alpine
  version-id: "3.24"
  pretty-name: Docker Hardened Images/Alpine Linux v3.24
