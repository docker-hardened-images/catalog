contents:
  repositories:
    - https://dhi.io/apk/alpine/v3.24/main
    - https://dl-cdn.alpinelinux.org/alpine/v3.24/main
    - https://dl-cdn.alpinelinux.org/alpine/v3.24/community
  keyring:
    - https://dhi.io/keyring/dhi-apk@docker-0F81AD7700D99184.rsa.pub
  packages:
    - alpine-baselayout-data
  builds:
    - name: prefect
      work-dir: ${source.dir}/prefect
      environment:
        BUILD_GRPCIO: "0"
        DEPEND_DISTRO_SQLITE: "0"
        OPENSSL_NO_VENDOR: "1"
        PACKAGE_LINE: "2"
        PYTHONDONTWRITEBYTECODE: "1"
        UV_LINK_MODE: copy
        UV_NO_MANAGED_PYTHON: "true"
        UV_PYTHON: /usr/bin/python3.12
        UV_PYTHON_DOWNLOADS: never
        VERSION: 2.20.27
      caches:
        - path: /root/.cache/uv-musl
        - path: /root/.cargo/registry
      contents:
        packages:
          - bash
          - binutils
          - build-base
          - ca-certificates-bundle
          - cargo=1.96.1-r0
          - coreutils
          - findutils
          - git
          - grep
          - libffi-dev
          - openssl-dev
          - pkgconf
          - rust=1.96.1-r0
          - sed
          - zlib-dev
          - python-3.12=3.12.16-r3
          - python-3.12-dev=3.12.16-r3
        files:
          - url: https://github.com/astral-sh/uv/releases/download/0.13.7/uv-${UV_ARCH}.tar.gz
            checksum: https://github.com/astral-sh/uv/releases/download/0.13.7/uv-${UV_ARCH}.tar.gz.sha256
            path: ${source.dir}/uv.tar.gz
            spdx:
              name: uv-binary
              version: 0.13.7
              packages:
                - name: uv
                  purl: pkg:github/astral-sh/uv@0.13.7
                  license: Apache-2.0
            uid: 0
            gid: 0
          - url: git+https://github.com/PrefectHQ/prefect.git#2.20.27
            checksum: 7dbb06c9f5196ce516e42fbb45902e1bdf5011b1
            path: ${source.dir}/prefect
            uid: 0
            gid: 0
          - url: https://files.pythonhosted.org/packages/1e/51/e0876286c13e1c0b55389d52013371bce0229651ecb6624aabbcd0c4c796/prefect-2.20.27-py3-none-any.whl
            checksum: sha256:777af074f97c2fec5eb32b707292170f6e65d562672abaec725afa4e416231ca
            path: ${source.dir}/prefect.whl
            spdx:
              name: prefect
              version: 2.20.27
              packages:
                - name: prefect
                  purl: pkg:pypi/prefect@2.20.27
                  license: Apache-2.0
            uid: 0
            gid: 0
      pipeline:
        - name: setup uv
          runs: |
            set -eux -o pipefail

            mkdir -p /usr/local/bin
            tar -xzf "${source.dir}/uv.tar.gz" -C /usr/local/bin --strip-components=1
            chmod 0755 /usr/local/bin/uv
            test -x /usr/local/bin/uv
        - name: install prefect
          work-dir: ${source.dir}/prefect
          privileged: true
          environment:
            UV_CACHE_DIR: /root/.cache/uv-musl
          runs: |
            set -eux -o pipefail

            export TARGET_DIR="${target.dir}"
            export WHEEL_PATH="${source.dir}/prefect.whl"
            export LOCK_PATH="${source.dir}/requirements-2.lock"
            export PYTHON_MAJOR_MINOR_VERSION="3.12"
            bash "${source.dir}/build-prefect.sh"
        - name: python dependencies sbom
          uses: sbom@v1
          with:
            extra-scanners: python-package-cataloger
            prefix: prefect
            source: ${target.dir}/usr/lib/prefect
        - name: stage sbom
          runs: |
            set -eux -o pipefail

            install -d "${target.dir}/opt/docker/sbom"
            cp -a /opt/docker/sbom/prefect "${target.dir}/opt/docker/sbom/prefect"
            test -s "${target.dir}/opt/docker/sbom/prefect/.spdx.prefect.json"
        - uses: dhi/build-pkg:0
          with:
            depends:
              - ca-certificates-bundle
              - git
              - libcrypto3
              - libffi
              - libgcc
              - libssl3
              - libstdc++
              - python-3.12
              - sqlite-libs
              - tzdata
              - zlib
            description: Prefect workflow orchestration
            files:
              - usr/bin/prefect
              - usr/lib/prefect
              - usr/share/prefect
              - opt/docker/sbom/prefect
            formats:
              - apk
            license: Apache-2.0
            name: prefect-2
            rel: 1
            url: https://www.prefect.io/
            version: 2.20.27
      paths:
        - type: file
          path: ${source.dir}/build-prefect.sh
          uid: 0
          gid: 0
          mode: "0755"
          source: package/main/prefecthq-prefect/build-prefect.sh
        - type: file
          path: ${source.dir}/requirements-2.lock
          uid: 0
          gid: 0
          source: package/main/prefecthq-prefect/requirements-2.lock
