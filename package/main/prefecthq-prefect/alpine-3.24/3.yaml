  - linux/arm64
dates:
  release: "2024-09-03"
vars:
  BUILD_GRPCIO: "1"
  CARGO_VERSION: 1.96.1-r0
  COMMIT_SHA: b0479c0c26045b06321191bbad0cdfbb334d7380
  DEPEND_DISTRO_SQLITE: "1"
  PREFECT_EXTRAS: redis otel
