  SEMVER_MAJOR_MINOR_VERSION: "3.9"
  SEMVER_MAJOR_VERSION: "3"
  SEMVER_VERSION: 3.9.2
  SQLITE_VERSION: 3.50.4
  UV_ARCH: '#{ target.arch == "amd64" ? "x86_64-unknown-linux-musl" : "aarch64-unknown-linux-musl" }'
  UV_VERSION: 0.13.7
  VERSION: 3.9.2
  WHEEL_SHA256: sha256:0ad0c16a4ef1c9270d8449c97a3ece28a47e24e497db94cc752814c6c7869954
  WHEEL_URL: https://files.pythonhosted.org/packages/9b/15/8aa41eff42f601f820fd967f933f1b528aa39b4cc8cb09dc3aefa81ade12/prefect-3.9.2-py3-none-any.whl
contents:
  repositories:
    - https://dhi.io/apk/alpine/v3.24/main
    - https://dl-cdn.alpinelinux.org/alpine/v3.24/main
    - https://dl-cdn.alpinelinux.org/alpine/v3.24/community
  keyring:
    - https://dhi.io/keyring/dhi-apk@docker-0F81AD7700D99184.rsa.pub
  packages:
    - alpine-baselayout-data
  builds:
    - name: prefect
      work-dir: ${source.dir}/prefect
      environment:
        BUILD_GRPCIO: "1"
        DEPEND_DISTRO_SQLITE: "1"
        GRPC_PYTHON_BUILD_SYSTEM_ABSL: "1"
        GRPC_PYTHON_BUILD_SYSTEM_CARES: "1"
        GRPC_PYTHON_BUILD_SYSTEM_OPENSSL: "1"
        GRPC_PYTHON_BUILD_SYSTEM_RE2: "1"
        GRPC_PYTHON_BUILD_SYSTEM_ZLIB: "1"
        GRPC_PYTHON_CFLAGS: -std=c++17 -fvisibility=hidden -fno-wrapv -fno-exceptions -fdelete-null-pointer-checks
        OPENSSL_NO_VENDOR: "1"
        PACKAGE_LINE: "3"
        PREFECT_EXTRAS: redis otel
        PYTHONDONTWRITEBYTECODE: "1"
        SQLITE_VERSION: 3.50.4
        UV_LINK_MODE: copy
        UV_NO_MANAGED_PYTHON: "true"
        UV_PYTHON: /usr/bin/python3.12
        UV_PYTHON_DOWNLOADS: never
        VERSION: 3.9.2
      caches:
        - path: /root/.cache/uv-musl
        - path: /root/.cargo/registry
      contents:
        packages:
          - bash
          - binutils
          - build-base
          - abseil-cpp-dev
          - c-ares-dev
          - ca-certificates-bundle
          - cargo=1.96.1-r0
          - cmake
          - coreutils
          - findutils
          - git
          - grep
          - libffi-dev
          - openssl-dev
          - pkgconf
          - re2-dev
          - rust=1.96.1-r0
          - sed
          - zlib-dev
          - python-3.12=3.12.16-r3
          - python-3.12-dev=3.12.16-r3
        files:
          - url: https://github.com/astral-sh/uv/releases/download/0.13.7/uv-${UV_ARCH}.tar.gz
            checksum: https://github.com/astral-sh/uv/releases/download/0.13.7/uv-${UV_ARCH}.tar.gz.sha256
            path: ${source.dir}/uv.tar.gz
            spdx:
              name: uv-binary
              version: 0.13.7
              packages:
                - name: uv
                  purl: pkg:github/astral-sh/uv@0.13.7
                  license: Apache-2.0
            uid: 0
            gid: 0
          - url: git+https://github.com/PrefectHQ/prefect.git#3.9.2
            checksum: b0479c0c26045b06321191bbad0cdfbb334d7380
            path: ${source.dir}/prefect
            uid: 0
            gid: 0
          - url: https://files.pythonhosted.org/packages/9b/15/8aa41eff42f601f820fd967f933f1b528aa39b4cc8cb09dc3aefa81ade12/prefect-3.9.2-py3-none-any.whl
            checksum: sha256:0ad0c16a4ef1c9270d8449c97a3ece28a47e24e497db94cc752814c6c7869954
            path: ${source.dir}/prefect.whl
            spdx:
              name: prefect
              version: 3.9.2
              packages:
                - name: prefect
                  purl: pkg:pypi/prefect@3.9.2
                  license: Apache-2.0
            uid: 0
            gid: 0
      pipeline:
        - name: setup uv
          runs: |
            set -eux -o pipefail

            mkdir -p /usr/local/bin
            tar -xzf "${source.dir}/uv.tar.gz" -C /usr/local/bin --strip-components=1
            chmod 0755 /usr/local/bin/uv
            test -x /usr/local/bin/uv
        - name: install prefect
          work-dir: ${source.dir}/prefect
          privileged: true
          environment:
            UV_CACHE_DIR: /root/.cache/uv-musl
          runs: |
            set -eux -o pipefail

            export TARGET_DIR="${target.dir}"
            export WHEEL_PATH="${source.dir}/prefect.whl"
            export PYTHON_MAJOR_MINOR_VERSION="3.12"
            bash "${source.dir}/build-prefect.sh"
        - name: python dependencies sbom
          uses: sbom@v1
          with:
            extra-scanners: python-package-cataloger
            prefix: prefect
            source: ${target.dir}/usr/lib/prefect
        - name: stage sbom
          runs: |
            set -eux -o pipefail

            install -d "${target.dir}/opt/docker/sbom"
            cp -a /opt/docker/sbom/prefect "${target.dir}/opt/docker/sbom/prefect"
            test -s "${target.dir}/opt/docker/sbom/prefect/.spdx.prefect.json"
        - uses: dhi/build-pkg:0
          with:
            depends:
              - abseil-cpp-base
              - abseil-cpp-cord
              - abseil-cpp-cordz-info
              - abseil-cpp-flags-internal
              - abseil-cpp-flags-marshalling
              - abseil-cpp-flags-parse
              - abseil-cpp-flags-reflection
              - abseil-cpp-hash
              - abseil-cpp-kernel-timeout-internal
              - abseil-cpp-log-globals
              - abseil-cpp-log-internal-check-op
              - abseil-cpp-log-internal-conditions
              - abseil-cpp-log-internal-globals
              - abseil-cpp-log-internal-message
              - abseil-cpp-log-internal-nullguard
              - abseil-cpp-random-internal-entropy-pool
              - abseil-cpp-random-internal-randen
              - abseil-cpp-random-internal-randen-hwaes-impl
              - abseil-cpp-random-internal-randen-slow
              - abseil-cpp-raw-hash-set
              - abseil-cpp-spinlock-wait
              - abseil-cpp-status
              - abseil-cpp-statusor
              - abseil-cpp-str-format-internal
              - abseil-cpp-strings
              - abseil-cpp-synchronization
              - abseil-cpp-throw-delegate
              - abseil-cpp-time
              - abseil-cpp-time-zone
              - abseil-cpp-vlog-config-internal
              - c-ares
              - ca-certificates-bundle
              - git
              - libcrypto3
              - libffi
              - libgcc
              - libssl3
              - libstdc++
              - python-3.12
              - re2
              - sqlite
              - sqlite-libs
              - tzdata
              - zlib
            description: Prefect workflow orchestration
            files:
              - usr/bin/prefect
              - usr/lib/prefect
              - usr/share/prefect
              - opt/docker/sbom/prefect
            formats:
              - apk
            license: Apache-2.0
            name: prefect-3
            rel: 0
            url: https://www.prefect.io/
            version: 3.9.2
      paths:
        - type: file
          path: ${source.dir}/build-prefect.sh
          uid: 0
          gid: 0
          mode: "0755"
          source: package/main/prefecthq-prefect/build-prefect.sh
