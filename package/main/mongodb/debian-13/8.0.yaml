# syntax=dhi.io/build:2-debian13

name: MongoDB 8.0.x
image: dhi.io/pkg-mongodb
variant: runtime
tags:
  - "8.0"
  - 8.0.29
  - 8.0-debian13
  - 8.0.29-debian13
platforms:
  - linux/amd64
dates:
  release: "2024-10-31"
  end-of-life: "2029-10-31"
vars:
  COMMIT_SHA: 21a342dfee6468ad9350d156d25086da64dd03b1
  GOLANG_MAJOR_MINOR_VERSION: "1.26"
  GOLANG_VERSION: 1.26.7-1
  MONGO_TOOLS_VERSION: 100.18.0
  MONGODB_ARCH: x86_64
  MONGOSH_ARCH: x64
  MONGOSH_VERSION: 2.10.0
  PACKAGE_NAME: mongodb-8.0
  REL: "3"
  SEMVER_MAJOR_MINOR_VERSION: "8.0"
  SEMVER_MAJOR_VERSION: "8"
  SEMVER_VERSION: 8.0.29
  VERSION: 8.0.29
contents:
  packages:
    - base-files
  builds:
    - name: mongodb
      work-dir: ${source.dir}
      caches:
        - path: /go/pkg/mod
      contents:
        repositories:
          - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
        keyring:
          - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
        packages:
          - bash
          - ca-certificates
          - ca-certificates-bundle
          - coreutils
          - diffutils
          - findutils
          - golang-1.26=1.26.7-1
          - golang-1.26-oci-config=1.26.7-1
          - gpg
          - gpg-agent
          - gzip
          - libc-bin
          - mawk
          - procps
          - sed
          - tar
          - tzdata
        files:
          - url: https://pgp.mongodb.com/server-8.0.asc
            path: ${source.dir}/keys/mongodb-server.asc
            uid: 0
            gid: 0
          - url: https://fastdl.mongodb.org/linux/mongodb-linux-x86_64-debian12-8.0.29.tgz
            path: ${source.dir}/mongodb-server-and-mongos.tgz
            spdx:
              name: mongodb
              version: 8.0.29
              packages:
                - name: mongodb
                  purl: pkg:dhi/mongodb@8.0.29
                  license: SSPL-1.0
            uid: 0
            gid: 0
          - url: https://fastdl.mongodb.org/linux/mongodb-linux-x86_64-debian12-8.0.29.tgz.sig
            path: ${source.dir}/mongodb-server-and-mongos.tgz.sig
            uid: 0
            gid: 0
          - url: https://pgp.mongodb.com/mongosh.asc
            path: ${source.dir}/keys/mongosh.asc
            uid: 0
            gid: 0
          - url: https://downloads.mongodb.com/compass/mongosh-2.10.0-linux-x64-openssl3.tgz
            path: ${source.dir}/mongosh.tgz
            spdx:
              name: mongosh
              version: 2.10.0
              packages:
                - name: mongosh
                  purl: pkg:generic/mongodb/mongosh@2.10.0
                  license: Apache-2.0
            uid: 0
            gid: 0
          - url: https://downloads.mongodb.com/compass/mongosh-2.10.0-linux-x64-openssl3.tgz.sig
            path: ${source.dir}/mongosh.tgz.sig
            uid: 0
            gid: 0
          - url: git+https://github.com/mongodb/mongo-tools.git#100.18.0
            checksum: 21a342dfee6468ad9350d156d25086da64dd03b1
            path: /go/src/github.com/mongodb/mongo-tools
            spdx:
              name: mongo-tools
              version: 100.18.0
              packages:
                - name: mongo-tools
                  purl: pkg:golang/github.com/mongodb/mongo-tools@100.18.0
                  license: Apache-2.0
            uid: 0
            gid: 0
      pipeline:
        - name: verify server GPG
          uses: gpg/verify@v1
          with:
            file: ${source.dir}/mongodb-server-and-mongos.tgz
            keys: ${source.dir}/keys/mongodb-server.asc
            signature: ${source.dir}/mongodb-server-and-mongos.tgz.sig
        - name: install mongodb server
          runs: |
            set -eux -o pipefail

            tar -xzf "${source.dir}/mongodb-server-and-mongos.tgz" -C "${source.dir}"
            install -D -m 0755 \
              "${source.dir}/mongodb-linux-x86_64-debian12-8.0.29/bin/mongod" \
              "${target.dir}/usr/bin/mongod"
        - name: verify mongosh GPG
          uses: gpg/verify@v1
          with:
            file: ${source.dir}/mongosh.tgz
            keys: ${source.dir}/keys/mongosh.asc
            signature: ${source.dir}/mongosh.tgz.sig
        - name: install mongosh
          runs: |
            set -eux -o pipefail

            tar -xzf "${source.dir}/mongosh.tgz" -C "${source.dir}"
            install -D -m 0755 \
              "${source.dir}/mongosh-2.10.0-linux-x64-openssl3/bin/mongosh" \
              "${target.dir}/usr/bin/mongosh"
        - name: update go dependencies (8.0 only)
          uses: go/bump@v2
          work-dir: /go/src/github.com/mongodb/mongo-tools
          with:
            deps:
              - golang.org/x/crypto@v0.55.0
              - golang.org/x/net@v0.57.0
              - github.com/klauspost/compress@v1.18.7
            download: true
        - name: build mongo-tools
          work-dir: /go/src/github.com/mongodb/mongo-tools
          runs: |
            set -eux -o pipefail

            GOLDFLAGS="-X main.VersionStr=100.18.0
                       -X main.GitCommit=21a342dfee6468ad9350d156d25086da64dd03b1"

            install -d "${target.dir}/usr/bin"
            for tool in bsondump mongodump mongoexport mongofiles mongoimport mongorestore mongostat mongotop; do
              CGO_ENABLED=0 go build \
                -ldflags="$GOLDFLAGS" \
                -o "${target.dir}/usr/bin/${tool}" \
                "./${tool}/main/${tool}.go"
            done
        - uses: dhi/build-pkg:0
          with:
            depends:
              - ca-certificates
              - libcurl4t64
              - libssl3t64
              - numactl
            description: MongoDB document database server
            files:
              - usr/bin/mongod
            formats:
              - deb
            license: SSPL-1.0
            name: mongodb-8.0
            rel: 3
            subpackages:
              - depends:
                  - libssl3t64
                  - zlib1g
                description: MongoDB Shell (mongosh)
                files:
                  - path: usr/bin/mongosh
                name: mongodb-8.0-mongosh
              - description: MongoDB database tools
                files:
                  - path: usr/bin/bsondump
                  - path: usr/bin/mongodump
                  - path: usr/bin/mongoexport
                  - path: usr/bin/mongofiles
                  - path: usr/bin/mongoimport
                  - path: usr/bin/mongorestore
                  - path: usr/bin/mongostat
                  - path: usr/bin/mongotop
                name: mongodb-8.0-tools
            url: https://www.mongodb.com/
            version: 8.0.29
os-release:
  name: Docker Hardened Images (Debian)
  id: debian
  version-id: "13"
  version-codename: trixie
  pretty-name: Docker Hardened Images/Debian GNU/Linux 13 (trixie)
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
