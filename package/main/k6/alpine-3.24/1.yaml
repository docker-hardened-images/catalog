# syntax=dhi.io/build:2-alpine3.24

image: dhi.io/pkg-k6
variant: runtime
tags:
  - 1.8.1-alpine3.24
  - 1.8.1-r2-alpine3.24
platforms:
  - linux/amd64
  - linux/arm64
dates:
  release: "2026-08-12"
vars:
  COMMIT_SHA: 73b044f9f99a7dc432c17e0ab291b5280c131103
  GOLANG_MAJOR_MINOR_VERSION: "1.26"
  GOLANG_VERSION: 1.26.8-r0
  PACKAGE_NAME: k6-1
  REL: "2"
  SEMVER_MAJOR_MINOR_VERSION: "1.8"
  SEMVER_MAJOR_VERSION: "1"
  SEMVER_VERSION: 1.8.1
  VERSION: 1.8.1
contents:
  repositories:
    - https://dhi.io/apk/alpine/v3.24/main
    - https://dhi.io/apk/alpine/v3.23/main
    - https://dl-cdn.alpinelinux.org/alpine/v3.24/main
    - https://dl-cdn.alpinelinux.org/alpine/v3.24/community
  keyring:
    - https://dhi.io/keyring/dhi-apk@docker-0F81AD7700D99184.rsa.pub
  packages:
    - alpine-baselayout-data
  builds:
    - name: k6-1
      work-dir: /go/src/github.com/grafana/k6
      caches:
        - path: /go/pkg/mod
      contents:
        packages:
          - busybox
          - bash
          - ca-certificates-bundle
          - coreutils
          - findutils
          - mawk
          - sed
          - golang-1.26=1.26.8-r0
          - golang-1.26-oci-config=1.26.8-r0
        files:
          - url: git+https://github.com/grafana/k6.git#v1.8.1
            checksum: 73b044f9f99a7dc432c17e0ab291b5280c131103
            path: /go/src/github.com/grafana/k6
            spdx:
              name: k6
              version: 1.8.1
              packages:
                - name: k6
                  purl: pkg:golang/github.com/grafana/k6@1.8.1
                  license: AGPL-3.0
            uid: 0
            gid: 0
      pipeline:
        - name: update go dependencies (1 only)
          uses: go/bump@v2
          with:
            deps:
              - github.com/Azure/go-ntlmssp@v0.1.1
              - github.com/klauspost/compress@v1.18.7
              - go.opentelemetry.io/otel/sdk@v1.43.0
              - google.golang.org/grpc@v1.82.1
              - go.opentelemetry.io/otel/exporters/otlp/otlpmetric/otlpmetrichttp@v1.43.0
              - go.opentelemetry.io/otel/exporters/otlp/otlptrace/otlptracehttp@v1.43.0
              - go.yaml.in/yaml/v3@v3.0.5
        - name: test
          shell: /bin/bash
          privileged: true
          runs: |
            set -eux -o pipefail

            PKGS=$(go list ./... | grep -v "internal/js/modules/k6/browser")

            SKIP_TESTS="TestMachineReadableSummary|TestEventSystemError|TestEventLoopDoesntCrossIterations|TestEventLoopCrossScenario|TestEventLoop|TestRelativeLogPathWithSetupAndTeardown|TestAbortedByUserWithRestAPI|TestEventSystemOK|TestActiveVUsCount|TestRampingVUsHandleRemainingVUs|TestVURunInterrupt|TestVUStateTagsSafeConcurrent|TestConstantArrivalRateRunCorrectTiming|TestWrongEnvVarIterations|TestExecutionInfoVUSharing"
            if [ "false" = "true" ]; then
              export GODEBUG=fips140=on
              SKIP_TESTS="${SKIP_TESTS}|TestRequestAndBatchTLS"
              SKIP_TESTS="${SKIP_TESTS}|TestUploadTest"
            fi

            for i in {1..5}; do
              if GOMAXPROCS=1 CGO_ENABLED=0 go test -count=1 $PKGS -skip "$SKIP_TESTS"; then
                exit 0
              fi
              echo "Retry $i/5..."
              sleep 2
            done

            exit 1
        - name: build k6
          uses: go/build@v1
          with:
            fips: false
            output: ${target.dir}/usr/bin/k6
        - name: build k6 dev
          uses: go/build@v1
          with:
            fips: false
            output: ${target.dir}/usr/bin/k6-dev
            strip: false
            trimpath: false
        - uses: dhi/build-pkg:0
          with:
            description: Grafana k6 load testing tool
            files:
              - usr/bin/k6
            license: AGPL-3.0
            name: k6-1
            rel: 2
            subpackages:
              - files:
                  - path: usr/bin/k6
                    source: usr/bin/k6-dev
                name: k6-1-dev
            url: https://github.com/grafana/k6
            version: 1.8.1
os-release:
  name: Docker Hardened Images (Alpine)
  id: alpine
  version-id: "3.24"
  pretty-name: Docker Hardened Images/Alpine Linux v3.24
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
