# syntax=dhi.io/build:2-debian13

image: dhi.io/pkg-kubeflow-pipelines-cache-deployer
variant: runtime
tags:
  - 2.18.0
  - 2.18.0-r0
  - 2.18.0-debian13
  - 2.18.0-r0-debian13
platforms:
  - linux/amd64
  - linux/arm64
dates:
  release: "2026-10-28"
vars:
  BUILD_ENTITLEMENT: ""
  COMMIT_SHA: 555bfa60a70da88c594960bdacfd78fa7c061043
  DEPLOYER_KUBECTL_PATCH: disable-runtime-kubectl-download.patch
  KUBECTL_MAJOR_MINOR_VERSION: "1.37"
  KUBECTL_PACKAGE: kubectl-1.37
  PACKAGE_NAME: kubeflow-pipelines-cache-deployer-2.18
  REL: "0"
  SEMVER_MAJOR_MINOR_VERSION: "2.18"
  SEMVER_MAJOR_VERSION: "2"
  SEMVER_VERSION: 2.18.0
  VERSION: 2.18.0
contents:
  repositories:
    - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
  keyring:
    - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
  packages:
    - base-files
  builds:
    - name: kubeflow-pipelines-cache-deployer-2.18
      shell: bash
      contents:
        packages:
          - bash
          - coreutils
          - findutils
          - grep
          - patch
        files:
          - url: git+https://github.com/kubeflow/pipelines.git#2.18.0
            checksum: 555bfa60a70da88c594960bdacfd78fa7c061043
            path: ${source.dir}/pipelines
            spdx:
              name: kubeflow-pipelines
              version: 2.18.0
              packages:
                - name: kubeflow-pipelines
                  purl: pkg:github/kubeflow/pipelines@2.18.0
                  license: Apache-2.0
            uid: 0
            gid: 0
      pipeline:
        - name: apply DHI deployer patches
          uses: patch@v1
          work-dir: ${source.dir}/pipelines
          with:
            options: -p1 --fuzz=0
            patches:
              - ${source.dir}/patch/disable-runtime-kubectl-download.patch
              - ${source.dir}/patch/posix-test-operators.patch
              - ${source.dir}/patch/fhs-layout-state-dir.patch
        - name: verify patched deployer
          work-dir: ${source.dir}/pipelines/backend/src/cache/deployer
          runs: |
            set -eux -o pipefail

            if grep -nE '^[[:space:]]*install_version_matched_kubectl[[:space:]]*$' deploy-cache-service.sh; then
              exit 1
            fi
            if grep -nF 'curl -L -o' deploy-cache-service.sh; then
              exit 1
            fi
            if grep -nE '\[ [^]]* == [^]]* \]' deploy-cache-service.sh; then
              exit 1
            fi
            if grep -nE '\./webhook-|<\./' deploy-cache-service.sh; then
              exit 1
            fi
            grep -qx 'KFP_CACHE_DEPLOYER_LIB_DIR=/usr/lib/kubeflow-pipelines-cache-deployer' deploy-cache-service.sh
            grep -qx 'KFP_CACHE_DEPLOYER_DATA_DIR=/usr/share/kubeflow-pipelines-cache-deployer' deploy-cache-service.sh
            grep -qF 'KFP_CACHE_DEPLOYER_STATE_DIR:-/var/lib/kubeflow-pipelines-cache-deployer' deploy-cache-service.sh
        - name: stage deployer payload
          work-dir: ${source.dir}/pipelines/backend/src/cache/deployer
          runs: |
            set -eux -o pipefail

            install -d -m 0755 \
              "${target.dir}/usr/lib/kubeflow-pipelines-cache-deployer" \
              "${target.dir}/usr/share/kubeflow-pipelines-cache-deployer" \
              "${target.dir}/usr/share/licenses/kubeflow-pipelines-cache-deployer"
            install -m 0755 \
              deploy-cache-service.sh \
              webhook-create-signed-cert.sh \
              webhook-patch-ca-bundle.sh \
              "${target.dir}/usr/lib/kubeflow-pipelines-cache-deployer/"
            install -m 0644 \
              cache-webhook-config.v1.yaml.template \
              cache-webhook-config.v1beta1.v1.15.yaml.template \
              cache-webhook-config.v1beta1.yaml.template \
              "${target.dir}/usr/share/kubeflow-pipelines-cache-deployer/"
            install -m 0644 \
              "${source.dir}/pipelines/LICENSE" \
              "${target.dir}/usr/share/licenses/kubeflow-pipelines-cache-deployer/LICENSE"
            test "$(find "${target.dir}/usr/lib/kubeflow-pipelines-cache-deployer" -type f | wc -l)" -eq 3
            test "$(find "${target.dir}/usr/share/kubeflow-pipelines-cache-deployer" -type f | wc -l)" -eq 3
            test -z "$(find "${target.dir}/usr" -perm /022 ! -type l)"
        - uses: dhi/build-pkg:0
          with:
            apk:
              depends:
                - busybox
                - busybox-binsh
            deb:
              depends:
                - base-files
                - coreutils
                - dash
                - grep
                - sed
            depends:
              - bash
              - kubectl-1.37
              - openssl
            description: Kubeflow Pipelines cache webhook deployer scripts
            files:
              - usr/lib/kubeflow-pipelines-cache-deployer
              - usr/share/kubeflow-pipelines-cache-deployer
              - usr/share/licenses/kubeflow-pipelines-cache-deployer
            license: Apache-2.0
            name: kubeflow-pipelines-cache-deployer-2.18
            rel: 0
            url: https://github.com/kubeflow/pipelines
            version: 2.18.0
      paths:
        - type: file
          path: ${source.dir}/patch/disable-runtime-kubectl-download.patch
          uid: 0
          gid: 0
          mode: "0644"
          source: package/main/kubeflow-pipelines-cache-deployer/patch/disable-runtime-kubectl-download.patch
        - type: file
          path: ${source.dir}/patch/disable-runtime-kubectl-download-2.17.patch
          uid: 0
          gid: 0
          mode: "0644"
          source: package/main/kubeflow-pipelines-cache-deployer/patch/disable-runtime-kubectl-download-2.17.patch
        - type: file
          path: ${source.dir}/patch/posix-test-operators.patch
          uid: 0
          gid: 0
          mode: "0644"
          source: package/main/kubeflow-pipelines-cache-deployer/patch/posix-test-operators.patch
        - type: file
          path: ${source.dir}/patch/fhs-layout-state-dir.patch
          uid: 0
          gid: 0
          mode: "0644"
          source: package/main/kubeflow-pipelines-cache-deployer/patch/fhs-layout-state-dir.patch
os-release:
  name: Docker Hardened Images (Debian)
  id: debian
  version-id: "13"
  version-codename: trixie
  pretty-name: Docker Hardened Images/Debian GNU/Linux 13 (trixie)
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
