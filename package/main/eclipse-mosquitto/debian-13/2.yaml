# syntax=dhi.io/build:2-debian13

image: dhi.io/pkg-eclipse-mosquitto
variant: runtime
tags:
  - 2.1.2
  - 2.1.2-r0
  - 2.1.2-debian13
  - 2.1.2-r0-debian13
platforms:
  - linux/amd64
  - linux/arm64
dates:
  release: "2020-12-03"
vars:
  REL: "0"
  SEMVER_MAJOR_MINOR_VERSION: "2.1"
  SEMVER_MAJOR_VERSION: "2"
  SEMVER_VERSION: 2.1.2
  VERSION: 2.1.2
contents:
  packages:
    - base-files
  builds:
    - name: eclipse-mosquitto
      work-dir: ${source.dir}/mosquitto
      contents:
        packages:
          - bash
          - build-essential
          - ca-certificates
          - cmake
          - coreutils
          - findutils
          - gpg
          - gpg-agent
          - grep
          - gzip
          - libc-ares-dev
          - libc-bin
          - libcap-dev
          - libcjson-dev
          - libedit-dev
          - libmicrohttpd-dev
          - libsqlite3-dev
          - libssl-dev
          - libwebsockets-dev
          - sed
        files:
          - url: https://mosquitto.org/files/source/mosquitto-2.1.2.tar.gz.asc
            path: ${source.dir}/sigs/mosquitto.tar.gz.asc
            uid: 0
            gid: 0
          - url: https://mosquitto.org/files/source/mosquitto-2.1.2.tar.gz
            path: ${source.dir}/mosquitto/mosquitto.tar.gz
            spdx:
              name: mosquitto
              version: 2.1.2
              packages:
                - name: mosquitto
                  purl: pkg:generic/eclipse-mosquitto/mosquitto@2.1.2
                  license: EPL-2.0
                - name: mosquitto
                  purl: pkg:generic/eclipse-mosquitto/mosquitto@2.1.2
                  license: EDL-1.0
            uid: 0
            gid: 0
      pipeline:
        - name: verify and unpack
          runs: |
            set -eux -o pipefail

            GNUPGHOME="$(mktemp -d)"
            export GNUPGHOME

            gpg --import "${source.dir}/key/mosquitto-key.asc"
            gpg --batch --verify "${source.dir}/sigs/mosquitto.tar.gz.asc" mosquitto.tar.gz

            tar -xvf mosquitto.tar.gz --strip-components=1
        - name: build and install
          runs: |
            set -eux -o pipefail

            make -j "$(nproc)" \
              CFLAGS="-Wall -O2" \
              WITH_ADNS=no \
              WITH_DOCS=no \
              WITH_SHARED_LIBRARIES=yes \
              WITH_SRV=no \
              WITH_STRIP=yes \
              WITH_WEBSOCKETS=yes \
              prefix=/usr \
              binary

            make DESTDIR="${target.dir}" install

            mkdir -p \
              "${target.dir}/usr/bin" \
              "${target.dir}/usr/sbin" \
              "${target.dir}/usr/lib" \
              "${target.dir}/etc/mosquitto" \
              "${target.dir}/usr/share/doc/eclipse-mosquitto"

            for bin in mosquitto_pub mosquitto_rr mosquitto_sub mosquitto_ctrl mosquitto_passwd; do
              mv "${target.dir}/usr/local/bin/${bin}" "${target.dir}/usr/bin/${bin}"
            done

            mv "${target.dir}/usr/local/sbin/mosquitto" "${target.dir}/usr/sbin/mosquitto"
            mv "${target.dir}/usr/local/lib/libmosquitto.so.1" "${target.dir}/usr/lib/libmosquitto.so.1"
            mv "${target.dir}/usr/local/lib/mosquitto_dynamic_security.so" "${target.dir}/usr/lib/mosquitto_dynamic_security.so"

            cp mosquitto.conf "${target.dir}/etc/mosquitto/mosquitto.conf"
            cp epl-v20 edl-v10 "${target.dir}/usr/share/doc/eclipse-mosquitto/"

            rm -rf "${target.dir}/usr/local"
        - uses: dhi/build-pkg:0
          with:
            depends:
              - libcjson1
              - libedit2
              - libmicrohttpd12t64
              - libssl3t64
            description: Eclipse Mosquitto MQTT broker
            files:
              - usr/bin/mosquitto_pub
              - usr/bin/mosquitto_rr
              - usr/bin/mosquitto_sub
              - usr/bin/mosquitto_ctrl
              - usr/bin/mosquitto_passwd
              - usr/sbin/mosquitto
              - usr/lib/libmosquitto.so.1
              - usr/lib/mosquitto_dynamic_security.so
              - etc/mosquitto/mosquitto.conf
              - usr/share/doc/eclipse-mosquitto/epl-v20
              - usr/share/doc/eclipse-mosquitto/edl-v10
            formats:
              - deb
            license: EPL-2.0
            name: eclipse-mosquitto
            rel: 0
            url: https://mosquitto.org/
            version: 2.1.2
      paths:
        - type: file
          path: ${source.dir}/key/mosquitto-key.asc
          uid: 0
          gid: 0
          source: package/main/eclipse-mosquitto/debian-13/key/mosquitto-key.asc
os-release:
  name: Docker Hardened Images (Debian)
  id: debian
  version-id: "13"
  version-codename: trixie
  pretty-name: Docker Hardened Images/Debian GNU/Linux 13 (trixie)
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
