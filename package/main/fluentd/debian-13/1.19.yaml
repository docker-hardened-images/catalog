# syntax=dhi.io/build:2-debian13

image: dhi.io/pkg-fluentd
variant: runtime
tags:
  - 1.19.3
  - 1.19.3-r11
  - 1.19.3-debian13
  - 1.19.3-r11-debian13
platforms:
  - linux/amd64
  - linux/arm64
vars:
  JEMALLOC_VERSION: 5.3.1
  REL: "11"
  RUBY_MAJOR_MINOR_VERSION: "3.4"
  RUBY_VERSION: 3.4.10-37
  SEMVER_MAJOR_MINOR_VERSION: "1.19"
  SEMVER_MAJOR_VERSION: "1"
  SEMVER_VERSION: 1.19.3
  VERSION: 1.19.3
contents:
  packages:
    - '!base-files'
  builds:
    - name: fluentd
      contents:
        repositories:
          - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
        keyring:
          - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
        packages:
          - bash
          - ca-certificates
          - coreutils
          - findutils
          - mawk
          - grep
          - libc-bin
          - sed
          - ruby-3.4-dev=3.4.10-37
          - ruby-3.4=3.4.10-37
          - libc6-dev
          - libcrypt-dev
          - libffi-dev
          - libgmp-dev
          - libjemalloc-dev
          - libssl-dev
          - libyaml-dev
          - zlib1g-dev
          - build-essential
          - make
        files:
          - url: https://github.com/jemalloc/jemalloc/releases/download/5.3.1/jemalloc-5.3.1.tar.bz2
            path: ${source.dir}/jemalloc.tar.bz2
            spdx:
              name: jemalloc
              version: 5.3.1
              packages:
                - name: jemalloc
                  purl: pkg:dhi/jemalloc@5.3.1
                  license: MIT
            uid: 0
            gid: 0
      pipeline:
        - name: install jemalloc
          runs: |
            set -eux -o pipefail

            build_dir="${source.dir}/jemalloc-build"
            mkdir -p "${build_dir}"
            tar -xjf ${source.dir}/jemalloc.tar.bz2 -C "${build_dir}" --strip-components=1
            cd "${build_dir}"

            echo "je_cv_madv_free=no" > config.cache

            ncpus=$(getconf _NPROCESSORS_ONLN)
            ncpus=$((ncpus > 6 ? 6 : ncpus))

            ./configure -C
            make -j${ncpus}

            mkdir -p ${target.dir}/usr/lib/libjemalloc
            cp -a lib/. ${target.dir}/usr/lib/libjemalloc/
        - name: install fluentd gems
          privileged: true
          runs: |
            set -eux -o pipefail

            gem_home="${target.dir}/usr/lib/fluentd/bundle"
            export GEM_HOME="${gem_home}"
            export BUNDLE_APP_CONFIG="${gem_home}"
            export BUNDLE_SILENCE_ROOT_WARNING=true
            export PATH="${gem_home}/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin"
            mkdir -p "${gem_home}"

            gem install oj
            gem install json
            gem install rexml
            gem install async
            gem install async-http
            gem install fluentd -v 1.19.3 --no-doc

            "${gem_home}/bin/fluentd" --version
        - name: prune native-extension build residue
          runs: |
            set -eux -o pipefail

            bundle_root="${target.dir}/usr/lib/fluentd/bundle"
            find "${bundle_root}" -type f \( -name '*.c' -o -name '*.h' -o -name '*.o' \
              -o -name 'mkmf.log' -o -name 'gem_make.out' \) -delete 2> /dev/null || true
        - name: prune gem cache and documentation
          runs: |
            set -eux -o pipefail

            bundle_root="${target.dir}/usr/lib/fluentd/bundle"
            rm -rf "${bundle_root}/cache"
            find "${bundle_root}" -type d -name cache -prune -exec rm -rf {} +
            find "${bundle_root}" -path '*/gems/*' -maxdepth 5 -type f -name '*.gemspec' -delete
            find "${bundle_root}" -path '*/gems/*' -maxdepth 5 -type f \
              \( -iname 'README*' -o -iname 'CHANGELOG*' -o -iname 'CHANGES*' \
              -o -iname 'History*' -o -iname '*.md' -o -iname '*.rdoc' \) \
              ! -iname '*licen[cs]e*' ! -iname '*notice*' ! -iname '*copying*' \
              -delete 2> /dev/null || true
        - name: stage dev bundle
          runs: |
            set -eux -o pipefail

            mkdir -p "${target.dir}/usr/lib/fluentd-dev"
            cp -a "${target.dir}/usr/lib/fluentd/bundle" "${target.dir}/usr/lib/fluentd-dev/bundle"
        - name: stage runtime binaries
          runs: |
            set -eux -o pipefail

            bundle_bin="${target.dir}/usr/lib/fluentd/bundle/bin"
            gem_home="${target.dir}/usr/lib/fluentd/bundle"
            mkdir -p "${target.dir}/usr/bin"

            ln -sf ../lib/fluentd/bundle/bin/fluentd "${target.dir}/usr/bin/fluentd"

            for f in "${bundle_bin}"/*; do
              [[ -f "$f" ]] || continue
              [[ "${f##*/}" != "fluentd" ]] && rm -v "$f"
            done

            GEM_HOME="${gem_home}" "${bundle_bin}/fluentd" --version
        - name: stage dev binaries
          runs: |
            set -eux -o pipefail

            dev_bundle_bin="${target.dir}/usr/lib/fluentd-dev/bundle/bin"
            mkdir -p "${target.dir}/usr/bin"

            for f in "${dev_bundle_bin}"/*; do
              [[ -f "$f" ]] || continue
              base="${f##*/}"
              [[ "$base" == "fluentd" ]] && continue
              ln -sf "../lib/fluentd-dev/bundle/bin/${base}" "${target.dir}/usr/bin/${base}"
            done
        - uses: dhi/build-pkg:0
          with:
            depends:
              - ruby-3.4
              - libc6
              - libcrypt1
              - libffi8
              - libgcc-s1
              - libgmp10
              - libjemalloc2
              - libstdc++6
              - libssl3t64
              - libyaml-0-2
              - zlib1g
            description: Fluentd log collector
            files:
              - usr/lib/fluentd
              - usr/lib/libjemalloc
              - usr/bin/fluentd
            formats:
              - deb
            license: Apache-2.0
            name: fluentd
            oci-config:
              environment:
                BUNDLE_APP_CONFIG: /usr/lib/fluentd/bundle
                BUNDLE_SILENCE_ROOT_WARNING: "true"
                GEM_HOME: /usr/lib/fluentd/bundle
                PATH: /usr/lib/fluentd/bundle/bin:/usr/sbin:/usr/bin:/sbin:/bin
            rel: 11
            subpackages:
              - files:
                  - usr/lib/fluentd-dev
                  - usr/bin/fluent-binlog-reader
                  - usr/bin/fluent-ca-generate
                  - usr/bin/fluent-cat
                  - usr/bin/fluent-ctl
                  - usr/bin/fluent-debug
                  - usr/bin/fluent-gem
                  - usr/bin/fluent-plugin-config-format
                  - usr/bin/fluent-plugin-generate
                name: fluentd-dev
            url: https://github.com/fluent/fluentd
            version: 1.19.3
os-release:
  name: Docker Hardened Images (Debian)
  id: debian
  version-id: "13"
  version-codename: trixie
  pretty-name: Docker Hardened Images/Debian GNU/Linux 13 (trixie)
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
