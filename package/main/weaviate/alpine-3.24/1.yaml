# syntax=dhi.io/build:2-alpine3.24

image: dhi.io/pkg-weaviate
variant: runtime
tags:
  - 1.41.0-alpine3.24
  - 1.41.0-r0-alpine3.24
platforms:
  - linux/amd64
  - linux/arm64
dates:
  release: "2021-01-14"
vars:
  BUILD_DATE: "2026-11-23T12:14:45Z"
  COMMIT_SHA: 4026ba9c88ff36c9b3595dc79b18f07a372314a7
  GOLANG_MAJOR_MINOR_VERSION: "1.27"
  GOLANG_VERSION: 1.27.4-r1
  REL: "0"
  SEMVER_MAJOR_MINOR_VERSION: "1.41"
  SEMVER_MAJOR_VERSION: "1"
  SEMVER_VERSION: 1.41.0
  VERSION: 1.41.0
contents:
  repositories:
    - https://dhi.io/apk/alpine/v3.24/main
    - https://dhi.io/apk/alpine/v3.23/main
    - https://dl-cdn.alpinelinux.org/alpine/v3.24/main
    - https://dl-cdn.alpinelinux.org/alpine/v3.24/community
  keyring:
    - https://dhi.io/keyring/dhi-apk@docker-0F81AD7700D99184.rsa.pub
  packages:
    - alpine-baselayout-data
  builds:
    - name: weaviate
      work-dir: /go/src/github.com/weaviate/weaviate
      contents:
        packages:
          - busybox
          - bash
          - ca-certificates-bundle
          - coreutils
          - findutils
          - grep
          - mawk
          - sed
          - golang-1.27=1.27.4-r1
          - golang-1.27-oci-config=1.27.4-r1
        files:
          - url: git+https://github.com/weaviate/weaviate.git#v1.41.0
            checksum: 4026ba9c88ff36c9b3595dc79b18f07a372314a7
            path: /go/src/github.com/weaviate/weaviate
            spdx:
              name: weaviate
              version: 1.41.0
              packages:
                - name: weaviate
                  purl: pkg:golang/github.com/weaviate/weaviate@1.41.0
                  license: BSD-3-Clause AND LicenseRef-Weaviate
            uid: 0
            gid: 0
      pipeline:
        - name: update go dependencies
          uses: go/bump@v2
          with:
            deps:
              - github.com/klauspost/compress@v1.20.2
              - go.opentelemetry.io/otel@v1.47.0
              - go.opentelemetry.io/otel/sdk@v1.47.0
              - go.opentelemetry.io/otel/trace@v1.47.0
            download: true
        - uses: go/hermetic@v1
        - name: verify version
          runs: |
            set -eux -o pipefail

            grep -qF '"version": "1.41.0"' adapters/handlers/rest/embedded_spec.go \
              || {
                echo "embedded_spec.go does not declare version 1.41.0" >&2
                exit 1
              }
        - name: test
          runs: |
            set -eux -o pipefail

            CGO_ENABLED=0 go test -short -count=1 ./usecases/config/
        - name: build weaviate
          uses: go/build@v1
          environment:
            GOFLAGS: -buildvcs=false
          with:
            cgo_enabled: 0
            fips: false
            ldflags:
              - -X github.com/weaviate/weaviate/usecases/build.Branch=v1.41.0
              - -X github.com/weaviate/weaviate/usecases/build.Revision=4026ba9
              - -X github.com/weaviate/weaviate/usecases/build.BuildUser=dhi
              - -X github.com/weaviate/weaviate/usecases/build.BuildDate=2026-11-23T12:14:45Z
            output: ${target.dir}/usr/bin/weaviate
            packages: ./cmd/weaviate-server
            strip: true
            trimpath: true
        - name: build weaviate dev
          uses: go/build@v1
          environment:
            GOFLAGS: -buildvcs=false
          with:
            cgo_enabled: 0
            fips: false
            ldflags:
              - -X github.com/weaviate/weaviate/usecases/build.Branch=v1.41.0
              - -X github.com/weaviate/weaviate/usecases/build.Revision=4026ba9
              - -X github.com/weaviate/weaviate/usecases/build.BuildUser=dhi
              - -X github.com/weaviate/weaviate/usecases/build.BuildDate=2026-11-23T12:14:45Z
            output: ${target.dir}/usr/bin/weaviate-dev
            packages: ./cmd/weaviate-server
            strip: false
            trimpath: true
        - name: stage license files
          runs: |
            set -eux -o pipefail

            install -D -m 0644 LICENSE '${target.dir}/usr/share/licenses/weaviate/LICENSE'
            install -D -m 0644 LICENSE-BSD '${target.dir}/usr/share/licenses/weaviate/LICENSE-BSD'
        - uses: dhi/build-pkg:0
          with:
            description: Weaviate vector database server
            files:
              - usr/bin/weaviate
              - usr/share/licenses/weaviate/LICENSE
              - usr/share/licenses/weaviate/LICENSE-BSD
            formats:
              - apk
            license: BSD-3-Clause AND LicenseRef-Weaviate
            name: weaviate
            rel: 0
            subpackages:
              - files:
                  - path: usr/bin/weaviate
                    source: usr/bin/weaviate-dev
                  - path: usr/share/licenses/weaviate/LICENSE
                  - path: usr/share/licenses/weaviate/LICENSE-BSD
                name: weaviate-dev
            url: https://github.com/weaviate/weaviate
            version: 1.41.0
os-release:
  name: Docker Hardened Images (Alpine)
  id: alpine
  version-id: "3.24"
  pretty-name: Docker Hardened Images/Alpine Linux v3.24
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
