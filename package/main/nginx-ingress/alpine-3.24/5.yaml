image: dhi.io/pkg-nginx-ingress
variant: runtime
tags:
  - 5.6.0-alpine3.24
  - 5.6.0-r0-alpine3.24
platforms:
  - linux/amd64
  - linux/arm64
dates:
  release: "2025-04-16"
vars:
  COMMIT_SHA: 99a5d02f03b3e88a29143abe95d2e0edf0aae1c5
  GOLANG_MAJOR_MINOR_VERSION: "1.26"
  GOLANG_VERSION: 1.26.8-r0
  NGINX_AGENT_COMMIT_SHA: 4a95e5301c7d06a6b7c75971868bd508b724dfab
  NGINX_AGENT_VERSION: 3.8.0
  REL: "0"
  SEMVER_MAJOR_MINOR_VERSION: "5.6"
  SEMVER_MAJOR_VERSION: "5"
  SEMVER_VERSION: 5.6.0
  VERSION: 5.6.0
contents:
  repositories:
    - https://dhi.io/apk/alpine/v3.24/main
    - https://dhi.io/apk/alpine/v3.23/main
    - https://dl-cdn.alpinelinux.org/alpine/v3.24/main
    - https://dl-cdn.alpinelinux.org/alpine/v3.24/community
  keyring:
    - https://dhi.io/keyring/dhi-apk@docker-0F81AD7700D99184.rsa.pub
  packages:
    - alpine-baselayout-data
  builds:
    - name: nginx-ingress
      work-dir: /go/src/github.com/nginx/kubernetes-ingress
      caches:
        - path: /go/pkg/mod
      contents:
        packages:
          - busybox
          - bash
          - ca-certificates-bundle
          - ca-certificates
          - coreutils
          - findutils
          - git
          - libcap-utils
          - mawk
          - sed
          - golang-1.26=1.26.8-r0
          - golang-1.26-oci-config=1.26.8-r0
        files:
          - url: git+https://github.com/nginx/kubernetes-ingress.git#v5.6.0
            checksum: 99a5d02f03b3e88a29143abe95d2e0edf0aae1c5
            path: /go/src/github.com/nginx/kubernetes-ingress
            spdx:
              name: nginx-ingress
              version: 5.6.0
              packages:
                - name: nginx-ingress
                  purl: pkg:golang/nginx/nginx-ingress@5.6.0
                  license: Apache-2.0
            uid: 0
            gid: 0
          - url: git+https://github.com/nginx/agent.git#v3.8.0
            checksum: 4a95e5301c7d06a6b7c75971868bd508b724dfab
            path: /go/src/github.com/nginx/agent
            spdx:
              name: nginx-agent
              version: 3.8.0
              packages:
                - name: nginx-agent
                  purl: pkg:golang/nginx/agent@3.8.0
                  license: Apache-2.0
            uid: 0
            gid: 0
      pipeline:
        - name: bump nginx-agent go dependencies
          uses: go/bump@v2
          work-dir: /go/src/github.com/nginx/agent
          with:
            deps:
              - golang.org/x/crypto@v0.56.0
              - github.com/antchfx/xpath@v1.3.6
              - github.com/google/cel-go@v0.30.0
              - github.com/klauspost/compress@v1.18.7
              - go.opentelemetry.io/collector/pdata/xpdata@v0.148.0
              - go.opentelemetry.io/otel/log@v0.21.0
              - go.opentelemetry.io/contrib/bridges/otelzap@v0.20.0
              - go.opentelemetry.io/otel/sdk@v1.44.0
              - go.opentelemetry.io/otel/exporters/otlp/otlpmetric/otlpmetrichttp@v1.45.0
              - go.opentelemetry.io/otel/exporters/otlp/otlptrace/otlptracehttp@v1.45.0
              - github.com/prometheus/prometheus@v0.311.3
              - go.opentelemetry.io/otel/sdk/log@v0.21.0
              - go.opentelemetry.io/otel/exporters/otlp/otlplog/otlploggrpc@v0.21.0
              - go.opentelemetry.io/otel/exporters/otlp/otlplog/otlploghttp@v0.21.0
              - go.opentelemetry.io/otel/exporters/stdout/stdoutlog@v0.21.0
            download: true
            replaces:
              - go.opentelemetry.io/otel/log=go.opentelemetry.io/otel/log@v0.21.0
              - go.opentelemetry.io/otel/sdk/log=go.opentelemetry.io/otel/sdk/log@v0.21.0
              - go.opentelemetry.io/otel/exporters/otlp/otlplog/otlploggrpc=go.opentelemetry.io/otel/exporters/otlp/otlplog/otlploggrpc@v0.21.0
              - go.opentelemetry.io/otel/exporters/otlp/otlplog/otlploghttp=go.opentelemetry.io/otel/exporters/otlp/otlplog/otlploghttp@v0.21.0
              - go.opentelemetry.io/otel/exporters/stdout/stdoutlog=go.opentelemetry.io/otel/exporters/stdout/stdoutlog@v0.21.0
        - name: build nginx-agent
          uses: go/build@v1
          work-dir: /go/src/github.com/nginx/agent
          with:
            extra-args: -pgo=default.pgo
            fips: false
            ldflags:
              - -X main.version=3.8.0
              - -X main.commit=4a95e5301c7d06a6b7c75971868bd508b724dfab
              - -X main.date=$(date -ud @${SOURCE_DATE_EPOCH} +'%Y-%m-%dT%H:%M:%SZ')
            output: ${target.dir}/usr/bin/nginx-agent
            packages: ./cmd/agent
        - name: setup nginx-agent config
          runs: |
            set -eux -o pipefail

            mkdir -p "${target.dir}/etc/nginx-agent"
            cp -a /go/src/github.com/nginx/agent/nginx-agent.conf \
              "${target.dir}/etc/nginx-agent/nginx-agent.conf"
        - name: bump nginx-ingress go dependencies
          uses: go/bump@v2
          with:
            deps:
              - golang.org/x/crypto@v0.56.0
              - github.com/go-jose/go-jose/v4@v4.1.4
              - github.com/google/cel-go@v0.30.0
              - go.etcd.io/etcd/client/pkg/v3@v3.6.14
              - google.golang.org/grpc@v1.83.1
            download: true
        - name: build nginx-ingress
          uses: go/build@v1
          with:
            fips: false
            output: ${target.dir}/usr/bin/nginx-ingress
            packages: ./cmd/nginx-ingress
        - name: setcap nginx-ingress
          runs: |
            set -eux -o pipefail

            setcap 'cap_net_bind_service=+ep' "${target.dir}/usr/bin/nginx-ingress"
            setcap -v 'cap_net_bind_service=+ep' "${target.dir}/usr/bin/nginx-ingress"
        - name: setup nginx-ingress configs
          runs: |
            set -eux -o pipefail

            mkdir -p "${target.dir}/etc/nginx/njs"
            cp -a internal/configs/njs/* "${target.dir}/etc/nginx/njs"

            mkdir -p "${target.dir}/usr/share/nginx-ingress"
            cp -a internal/configs/version1/nginx.ingress.tmpl \
              internal/configs/version1/nginx.tmpl \
              internal/configs/version2/nginx.virtualserver.tmpl \
              internal/configs/version2/nginx.transportserver.tmpl \
              "${target.dir}/usr/share/nginx-ingress/"
        - name: build nginx-agent dev
          uses: go/build@v1
          work-dir: /go/src/github.com/nginx/agent
          with:
            extra-args: -pgo=default.pgo
            fips: false
            ldflags:
              - -X main.version=3.8.0
              - -X main.commit=4a95e5301c7d06a6b7c75971868bd508b724dfab
              - -X main.date=$(date -ud @${SOURCE_DATE_EPOCH} +'%Y-%m-%dT%H:%M:%SZ')
            output: ${target.dir}/usr/bin/nginx-agent-dev
            packages: ./cmd/agent
            strip: false
        - name: build nginx-ingress dev
          uses: go/build@v1
          with:
            fips: false
            output: ${target.dir}/usr/bin/nginx-ingress-dev
            packages: ./cmd/nginx-ingress
            strip: false
        - uses: dhi/build-pkg:0
          with:
            description: NGINX Ingress Controller for Kubernetes
            files:
              - usr/bin/nginx-ingress
              - usr/bin/nginx-agent
              - etc/nginx-agent/nginx-agent.conf
              - etc/nginx/njs
              - usr/share/nginx-ingress
            license: Apache-2.0
            name: nginx-ingress
            rel: 0
            subpackages:
              - files:
                  - path: usr/bin/nginx-ingress
                    source: usr/bin/nginx-ingress-dev
                  - path: usr/bin/nginx-agent
                    source: usr/bin/nginx-agent-dev
                name: nginx-ingress-dev
            url: https://github.com/nginx/kubernetes-ingress
            version: 5.6.0
