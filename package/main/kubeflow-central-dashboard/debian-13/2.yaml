# syntax=dhi.io/build:2-debian13

image: dhi.io/pkg-kubeflow-central-dashboard
variant: runtime
tags:
  - 2.0.1
  - 2.0.1-r0
  - 2.0.1-debian13
  - 2.0.1-r0-debian13
platforms:
  - linux/amd64
  - linux/arm64
dates:
  release: "2026-06-02"
vars:
  COMMIT_SHA: 7628a2f559bca364c71a42b4f33dcc8f0956be96
  CSS_LOADER_VERSION: 7.1.4
  DHI_TEST_DEB_EXPECTED_FILES: /usr/lib/kubeflow-central-dashboard/dist/server.js /usr/lib/kubeflow-central-dashboard/dist/public/index.html /usr/lib/kubeflow-central-dashboard/dist/public/app.bundle.js /usr/lib/kubeflow-central-dashboard/package.json /usr/lib/kubeflow-central-dashboard/third_party/license.txt /usr/share/doc/kubeflow-central-dashboard-2/copyright
  NODEJS_VERSION: 22.23.5-1
  NPM_VERSION: 11.21.2-1
  PACKAGE_NAME: kubeflow-central-dashboard-2
  PUG_RUNTIME_VERSION: 3.0.1
  REL: "0"
  SEMVER_MAJOR_MINOR_VERSION: "2.0"
  SEMVER_MAJOR_VERSION: "2"
  SEMVER_VERSION: 2.0.1
  VERSION: 2.0.1
contents:
  repositories:
    - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
  keyring:
    - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
  packages:
    - base-files
  builds:
    - name: kubeflow-central-dashboard
      work-dir: ${source.dir}/dashboard/components/centraldashboard
      caches:
        - path: /root/.npm
      contents:
        packages:
          - bash
          - ca-certificates
          - coreutils
          - diffutils
          - findutils
          - grep
          - libc6
          - libstdc++6
          - nodejs-22=22.23.5-1
          - npm=11.21.2-1
        files:
          - url: git+https://github.com/kubeflow/dashboard.git#v2.0.1
            checksum: 7628a2f559bca364c71a42b4f33dcc8f0956be96
            path: ${source.dir}/dashboard
            spdx:
              name: kubeflow-central-dashboard
              version: 2.0.1
              packages:
                - name: kubeflow-central-dashboard
                  purl: pkg:github/kubeflow/dashboard@v2.0.1#components/centraldashboard
                  license: Apache-2.0
            uid: 0
            gid: 0
      pipeline:
        - name: bump dependencies
          uses: npm/bump@v2
          privileged: true
          with:
            bumps: ${source.dir}/patch/npm-bumps.json
            npm-root: ${source.dir}/dashboard/components/centraldashboard
        - name: install dependencies
          privileged: true
          environment:
            PUPPETEER_SKIP_CHROMIUM_DOWNLOAD: "true"
            PUPPETEER_SKIP_DOWNLOAD: "true"
          runs: |
            set -eux -o pipefail

            npm ci --fund=false --audit=false
        - name: build dashboard
          environment:
            BUILD_COMMIT: 7628a2f559bca364c71a42b4f33dcc8f0956be96
            BUILD_VERSION: v2.0.1
          runs: |
            set -eux -o pipefail

            npm run build
        - name: check bundled dev-only packages
          runs: |
            set -eux -o pipefail

            test "$(node -p 'require("./node_modules/css-loader/package.json").version')" = "7.1.4"
            test "$(node -p 'require("./node_modules/pug-runtime/package.json").version')" = "3.0.1"
            bundled=$(
              node - << 'EOF'
            const fs = require("fs");
            const lock = JSON.parse(fs.readFileSync("package-lock.json", "utf8")).packages;
            const re = /node_modules\/(?:@[^/]+\/)?[^/]+(?:\/node_modules\/(?:@[^/]+\/)?[^/]+)*/;
            const dev = new Set();
            for (const map of fs.readdirSync("dist/public").filter((f) => f.endsWith(".js.map"))) {
              for (const src of JSON.parse(fs.readFileSync("dist/public/" + map, "utf8")).sources) {
                const m = src.match(re);
                if (!m) continue;
                const entry = lock[m[0]];
                if (!entry) throw new Error("source map path missing from package-lock.json: " + m[0]);
                if (entry.dev === true) dev.add(m[0].split("node_modules/").pop() + "@" + entry.version);
              }
            }
            console.log([...dev].sort().join(" "));
            EOF
            )
            test "$bundled" = "css-loader@7.1.4 pug-runtime@3.0.1"
        - name: prune dev dependencies
          privileged: true
          runs: |
            set -eux -o pipefail

            npm prune --omit=dev --fund=false --audit=false
        - name: verify runtime tree
          runs: |
            set -eux -o pipefail

            cmp node_modules/@vaadin/vaadin-usage-statistics/vaadin-usage-statistics.js \
              node_modules/@vaadin/vaadin-usage-statistics/vaadin-usage-statistics-optout.js
            if grep -rqF tools.vaadin.com dist/public; then
              exit 1
            fi
            test -z "$(find node_modules dist \( -name '*.node' -o -name '*.so' -o -name '*.so.*' \) -print)"
            grep -qF 'v2.0.1' dist/public/app.bundle.js
            test "$(node -p 'require("./node_modules/request/package.json").name')" = "@cypress/request"
            test ! -e node_modules/webpack
            test ! -e node_modules/typescript
        - name: stage payload
          runs: |
            set -eux -o pipefail

            rm -r node_modules/.cache
            install -d -m 0755 "${target.dir}/usr/lib/kubeflow-central-dashboard"
            cp -a dist node_modules package.json "${target.dir}/usr/lib/kubeflow-central-dashboard/"
            install -D -m 0644 third_party/license.txt \
              "${target.dir}/usr/lib/kubeflow-central-dashboard/third_party/license.txt"
            install -D -m 0644 ${source.dir}/dashboard/LICENSE \
              "${target.dir}/usr/share/doc/kubeflow-central-dashboard-2/copyright"
        - name: generate sbom
          uses: sbom@v1
          with:
            extra-scanners: javascript-package-cataloger
            prefix: kubeflow-central-dashboard
            source: ${target.dir}/usr/lib/kubeflow-central-dashboard
        - uses: spdx@v1
          with:
            license: MIT
            name: kubeflow-central-dashboard-css-loader
            purl: pkg:npm/css-loader@7.1.4
            version: 7.1.4
        - uses: spdx@v1
          with:
            license: MIT
            name: kubeflow-central-dashboard-pug-runtime
            purl: pkg:npm/pug-runtime@3.0.1
            version: 3.0.1
        - name: stage sbom
          runs: |
            set -eux -o pipefail

            install -d -m 0755 "${target.dir}/opt/docker/sbom"
            cp -a /opt/docker/sbom/kubeflow-central-dashboard \
              /opt/docker/sbom/kubeflow-central-dashboard-css-loader \
              /opt/docker/sbom/kubeflow-central-dashboard-pug-runtime \
              "${target.dir}/opt/docker/sbom/"
        - uses: dhi/build-pkg:0
          with:
            depends:
              - nodejs-22
            description: Kubeflow Central Dashboard web UI and API server (Node.js)
            files:
              - usr/lib/kubeflow-central-dashboard
              - usr/share/doc/kubeflow-central-dashboard-2
              - opt/docker/sbom/kubeflow-central-dashboard
              - opt/docker/sbom/kubeflow-central-dashboard-css-loader
              - opt/docker/sbom/kubeflow-central-dashboard-pug-runtime
            license: Apache-2.0
            name: kubeflow-central-dashboard-2
            rel: 0
            url: https://github.com/kubeflow/dashboard
            version: 2.0.1
      paths:
        - type: directory
          path: ${source.dir}/patch
          uid: 0
          gid: 0
          source: package/main/kubeflow-central-dashboard/patch
os-release:
  name: Docker Hardened Images (Debian)
  id: debian
  version-id: "13"
  version-codename: trixie
  pretty-name: Docker Hardened Images/Debian GNU/Linux 13 (trixie)
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
