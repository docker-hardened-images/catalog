# syntax=dhi.io/build:2-alpine3.23

image: dhi.io/pkg-argo-rollouts
variant: runtime
tags:
  - 1.10.0-alpine3.23
  - 1.10.0-r4-alpine3.23
platforms:
  - linux/amd64
  - linux/arm64
dates:
  release: "2025-06-05"
vars:
  COMMIT_SHA: d90700ae8d71d141561f0c546e19f999bb335cbd
  GOLANG_MAJOR_MINOR_VERSION: "1.26"
  GOLANG_VERSION: 1.26.8-r0
  NODEJS_VERSION: 24.20.0-r0
  REL: "4"
  SEMVER_MAJOR_MINOR_VERSION: "1.10"
  SEMVER_MAJOR_VERSION: "1"
  SEMVER_VERSION: 1.10.0
  VERSION: 1.10.0
contents:
  repositories:
    - https://dhi.io/apk/alpine/v3.23/main
    - https://dl-cdn.alpinelinux.org/alpine/v3.23/main
    - https://dl-cdn.alpinelinux.org/alpine/v3.23/community
  keyring:
    - https://dhi.io/keyring/dhi-apk@docker-0F81AD7700D99184.rsa.pub
  packages:
    - alpine-baselayout-data
  builds:
    - name: argo-rollouts
      work-dir: /go/src/github.com/argoproj/argo-rollouts
      caches:
        - path: /go/pkg/mod
      contents:
        packages:
          - busybox
          - bash
          - ca-certificates-bundle
          - binutils-gold
          - git
          - golang-1.26=1.26.8-r0
          - golang-1.26-oci-config=1.26.8-r0
          - nodejs-24=24.20.0-r0
          - corepack
          - npm
        files:
          - url: git+https://github.com/argoproj/argo-rollouts.git#v1.10.0
            checksum: d90700ae8d71d141561f0c546e19f999bb335cbd
            path: /go/src/github.com/argoproj/argo-rollouts
            spdx:
              name: argo-rollouts
              version: 1.10.0
              packages:
                - name: argo-rollouts
                  purl: pkg:golang/argoproj/argo-rollouts@1.10.0
                  license: Apache-2.0
            uid: 0
            gid: 0
      pipeline:
        - name: update go dependencies
          uses: go/bump@v1
          work-dir: /go/src/github.com/argoproj/argo-rollouts
          with:
            deps:
              - golang.org/x/crypto@v0.55.0
              - github.com/expr-lang/expr@v1.17.7
              - github.com/klauspost/compress@v1.18.7
              - github.com/moby/spdystream@v0.5.1
              - go.opentelemetry.io/otel@v1.44.0
              - go.opentelemetry.io/otel/sdk@v1.40.0
              - google.golang.org/grpc@v1.83.1
            download: true
            replaces:
              - github.com/whilp/git-urls=github.com/chainguard-dev/git-urls@v1.0.2
        - name: test
          runs: |
            set -eux -o pipefail

            export GOMAXPROCS=1

            if [ "${target.fips}" = "true" ]; then
              export GODEBUG=fips140=on
            fi

            go test -skip 'TestListWithWatch' $(go list ./... | grep -v -e ./test/cmd/metrics-plugin-sample -e github.com/argoproj/argo-rollouts/rollout$)
        - name: build rollouts-controller
          uses: go/build@v1
          work-dir: /go/src/github.com/argoproj/argo-rollouts
          with:
            fips: false
            ldflags:
              - -X github.com/argoproj/argo-rollouts/utils/version.version=1.10.0
              - -X github.com/argoproj/argo-rollouts/utils/version.buildDate=$(date -ud @${SOURCE_DATE_EPOCH} +'%Y-%m-%dT%H:%M:%SZ')
              - -X github.com/argoproj/argo-rollouts/utils/version.gitCommit=d90700ae8d71d141561f0c546e19f999bb335cbd
              - -X github.com/argoproj/argo-rollouts/utils/version.gitTreeState=clean
            output: ${target.dir}/usr/bin/rollouts-controller
            packages: ./cmd/rollouts-controller
        - name: build rollouts-controller dev
          uses: go/build@v1
          work-dir: /go/src/github.com/argoproj/argo-rollouts
          with:
            fips: false
            ldflags:
              - -X github.com/argoproj/argo-rollouts/utils/version.version=1.10.0
              - -X github.com/argoproj/argo-rollouts/utils/version.buildDate=$(date -ud @${SOURCE_DATE_EPOCH} +'%Y-%m-%dT%H:%M:%SZ')
              - -X github.com/argoproj/argo-rollouts/utils/version.gitCommit=d90700ae8d71d141561f0c546e19f999bb335cbd
              - -X github.com/argoproj/argo-rollouts/utils/version.gitTreeState=clean
            output: ${target.dir}/usr/bin/rollouts-controller-dev
            packages: ./cmd/rollouts-controller
            strip: false
        - name: build ui
          work-dir: /go/src/github.com/argoproj/argo-rollouts/ui
          privileged: true
          runs: |
            set -eux -o pipefail

            corepack enable
            corepack prepare pnpm@11.9.0 --activate

            pnpm install --frozen-lockfile --ignore-scripts
            NODE_ENV='production' pnpm build

            cp -r dist/app/* ../server/static
        - name: build kubectl-argo-rollouts
          uses: go/build@v1
          work-dir: /go/src/github.com/argoproj/argo-rollouts
          with:
            fips: false
            ldflags:
              - -X github.com/argoproj/argo-rollouts/utils/version.version=1.10.0
              - -X github.com/argoproj/argo-rollouts/utils/version.buildDate=$(date -ud @${SOURCE_DATE_EPOCH} +'%Y-%m-%dT%H:%M:%SZ')
              - -X github.com/argoproj/argo-rollouts/utils/version.gitCommit=d90700ae8d71d141561f0c546e19f999bb335cbd
              - -X github.com/argoproj/argo-rollouts/utils/version.gitTreeState=clean
            output: ${target.dir}/usr/bin/kubectl-argo-rollouts
            packages: ./cmd/kubectl-argo-rollouts
        - name: build kubectl-argo-rollouts dev
          uses: go/build@v1
          work-dir: /go/src/github.com/argoproj/argo-rollouts
          with:
            fips: false
            ldflags:
              - -X github.com/argoproj/argo-rollouts/utils/version.version=1.10.0
              - -X github.com/argoproj/argo-rollouts/utils/version.buildDate=$(date -ud @${SOURCE_DATE_EPOCH} +'%Y-%m-%dT%H:%M:%SZ')
              - -X github.com/argoproj/argo-rollouts/utils/version.gitCommit=d90700ae8d71d141561f0c546e19f999bb335cbd
              - -X github.com/argoproj/argo-rollouts/utils/version.gitTreeState=clean
            output: ${target.dir}/usr/bin/kubectl-argo-rollouts-dev
            packages: ./cmd/kubectl-argo-rollouts
            strip: false
        - uses: dhi/build-pkg:0
          with:
            description: Argo-rollouts binaries
            files:
              - usr/bin/rollouts-controller
            license: Apache-2.0
            name: argo-rollouts
            rel: 4
            subpackages:
              - files:
                  - path: usr/bin/kubectl-argo-rollouts
                name: kubectl-argo-rollouts
              - files:
                  - path: usr/bin/rollouts-controller
                    source: usr/bin/rollouts-controller-dev
                name: argo-rollouts-dev
              - files:
                  - path: usr/bin/kubectl-argo-rollouts
                    source: usr/bin/kubectl-argo-rollouts-dev
                name: kubectl-argo-rollouts-dev
            url: https://github.com/argoproj/argo-rollouts
            version: 1.10.0
os-release:
  name: Docker Hardened Images (Alpine)
  id: alpine
  version-id: "3.23"
  pretty-name: Docker Hardened Images/Alpine Linux v3.23
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
