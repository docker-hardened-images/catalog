# syntax=dhi.io/build:2-debian13

image: dhi.io/pkg-kubeflow-pipelines-apiserver
variant: runtime
tags:
  - 2.17.1
  - 2.17.1-r2
  - 2.17.1-debian13
  - 2.17.1-r2-debian13
platforms:
  - linux/amd64
  - linux/arm64
vars:
  ARCH: '#{ target.arch == "amd64" ? "amd64" : "arm64" }'
  ARGO_VERSION: 3.6.7
  COMMIT_SHA: 3487bc4c1ab141e76b2f8d9bba71f2b1d54a964f
  GOLANG_MAJOR_MINOR_VERSION: "1.26"
  GOLANG_VERSION: 1.26.8-0
  PACKAGE_NAME: kubeflow-pipelines-apiserver
  REL: "2"
  SEMVER_MAJOR_MINOR_VERSION: "2.17"
  SEMVER_MAJOR_VERSION: "2"
  SEMVER_VERSION: 2.17.1
  VERSION: 2.17.1
contents:
  packages:
    - base-files
  builds:
    - name: kubeflow-pipelines-apiserver
      work-dir: /go/src/github.com/kubeflow/pipelines
      environment:
        GIT_BRANCH: 3487bc4c1ab141e76b2f8d9bba71f2b1d54a964f
      caches:
        - path: /go/pkg/mod
      contents:
        repositories:
          - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
        keyring:
          - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
        packages:
          - bash
          - build-essential
          - ca-certificates-bundle
          - coreutils
          - diffutils
          - findutils
          - gawk
          - gcc
          - grep
          - jq
          - libc6-dev
          - mawk
          - python-3.10
          - python-3.10-dev
          - python3-pip
          - python3-setuptools
          - python3-wheel
          - sed
          - golang-1.26=1.26.8-0
          - golang-1.26-oci-config=1.26.8-0
        files:
          - url: git+https://github.com/kubeflow/pipelines.git#2.17.1
            checksum: 3487bc4c1ab141e76b2f8d9bba71f2b1d54a964f
            path: /go/src/github.com/kubeflow/pipelines
            spdx:
              name: kubeflow-pipelines
              version: 2.17.1
              packages:
                - name: kubeflow-pipelines
                  purl: pkg:golang/github.com/kubeflow/pipelines@2.17.1
                  license: Apache-2.0
            uid: 0
            gid: 0
          - url: https://github.com/argoproj/argo-workflows/releases/download/v3.6.7/argo-linux-${ARCH}.gz
            checksum: https://github.com/argoproj/argo-workflows/releases/download/v3.6.7/argo-workflows-cli-checksums.txt
            path: /usr/local/bin/argo
            uid: 0
            gid: 0
            mode: "0755"
      pipeline:
        - name: bump go dependencies
          uses: go/bump@v1
          with:
            deps:
              - golang.org/x/crypto@v0.56.0
              - filippo.io/edwards25519@v1.1.1
              - github.com/aws/aws-sdk-go-v2/aws/protocol/eventstream@v1.7.8
              - github.com/aws/aws-sdk-go-v2/service/s3@v1.97.3
              - github.com/go-jose/go-jose/v4@v4.1.4
              - github.com/jackc/pgx/v5@v5.9.2
              - github.com/klauspost/compress@v1.18.7
              - go.opentelemetry.io/otel/sdk@v1.44.0
              - google.golang.org/grpc@v1.83.2
              - go.opentelemetry.io/otel/exporters/otlp/otlpmetric/otlpmetrichttp@v1.44.0
              - k8s.io/api@v0.37.0
              - k8s.io/apimachinery@v0.37.0
              - k8s.io/client-go@v0.37.0
              - github.com/argoproj/argo-workflows/v4@v4.0.6
              - sigs.k8s.io/controller-runtime@v0.24.0
            download: true
        - name: test
          privileged: true
          runs: |
            set -eux -o pipefail

            # -skip names: tests broken by argo-workflows/v3 3.7.3 -> 3.7.5 bump (extra
            #   creationTimestamp in return values). TODO drop once upstream tests follow.
            # -vet=off: upstream has non-constant / wrong-type fmt format strings that Go 1.26
            #   auto-vet flags as build failures.
            # Skip ./agent/persistence/worker: upstream's *_test.go fake handler does not
            #   implement HasSyncedChecker required by client-go v0.36+. Production code unaffected.
            # Skip ./v2/driver: container_test.go references undefined mockCacheClient (upstream
            #   test bug introduced in 2.16.1). Production code unaffected.
            PKGS=$(go list ./backend/src/... | grep -v -e '/agent/persistence/worker$' -e '/v2/driver$')
            CGO_ENABLED=1 go test -C /go/src/github.com/kubeflow/pipelines -vet=off \
              -skip='TestDeletePipelineVersion|TestUploadPipeline_Tarball|TestUploadPipeline_SpecifyFileName|TestUploadPipeline_SpecifyFileDescription|TestCreateRunV1Patch|TestToStringForStore|TestToStringForSchedule|Test_executeV2_publishLogs' \
              $PKGS
        - name: build apiserver
          uses: go/build@v1
          with:
            cgo_enabled: 1
            fips: false
            output: ${target.dir}/usr/bin/apiserver
            packages: ./backend/src/apiserver
        - name: build apiserver dev
          uses: go/build@v1
          with:
            cgo_enabled: 1
            fips: false
            output: ${target.dir}/usr/bin/apiserver-dev
            packages: ./backend/src/apiserver
            strip: false
        - name: install config
          runs: |
            set -eux -o pipefail

            sed -E -e 's#/(blob|tree)/master/#/\1/3487bc4c1ab141e76b2f8d9bba71f2b1d54a964f/#g' -e 's/%252Fmaster/%252F3487bc4c1ab141e76b2f8d9bba71f2b1d54a964f/#g' -i backend/src/apiserver/config/*.json

            install -d '${target.dir}/usr/share/kubeflow-pipelines-apiserver/config'
            install -m 0644 -t '${target.dir}/usr/share/kubeflow-pipelines-apiserver/config' backend/src/apiserver/config/*.json
        - name: install python dependencies
          privileged: true
          runs: |
            set -eux -o pipefail

            python3 -m venv .venv
            .venv/bin/python3 -m pip install -r backend/requirements.txt
        - name: build and install samples
          runs: |
            set -eux -o pipefail

            jq -r '.pipelines[].file' < backend/src/apiserver/config/sample_config.json | while read -r pipeline_yaml; do
              pipeline_py=".${pipeline_yaml%.yaml}"
              .venv/bin/python3 "$pipeline_py"
              install -D -m 0644 ".${pipeline_yaml}" "${target.dir}/usr/share/kubeflow-pipelines-apiserver${pipeline_yaml}"
            done
        - uses: dhi/build-pkg:0
          with:
            depends:
              - libc6
            description: Kubeflow Pipelines API Server
            files:
              - usr/bin/apiserver
              - usr/share/kubeflow-pipelines-apiserver/config
              - usr/share/kubeflow-pipelines-apiserver/samples
            formats:
              - deb
            license: Apache-2.0
            name: kubeflow-pipelines-apiserver
            rel: 2
            subpackages:
              - files:
                  - path: usr/bin/apiserver
                    source: usr/bin/apiserver-dev
                name: kubeflow-pipelines-apiserver-dev
            url: https://github.com/kubeflow/pipelines
            version: 2.17.1
os-release:
  name: Docker Hardened Images (Debian)
  id: debian
  version-id: "13"
  version-codename: trixie
  pretty-name: Docker Hardened Images/Debian GNU/Linux 13 (trixie)
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
