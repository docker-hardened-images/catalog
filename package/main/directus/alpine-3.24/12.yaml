# syntax=dhi.io/build:2-alpine3.24

image: dhi.io/pkg-directus
variant: runtime
tags:
  - 12.4.1-alpine3.24
  - 12.4.1-r2-alpine3.24
platforms:
  - linux/amd64
  - linux/arm64
vars:
  COMMIT_SHA: d52fd4b29ecdd4d260aa47ca8cee58d9d62bf486
  DHI_TEST_APK_EXPECTED_FILES: /usr/bin/directus /usr/bin/pm2 /usr/lib/nodejs/directus/cli.js /usr/lib/nodejs/directus/docker-entrypoint.cjs /usr/lib/nodejs/directus/node_modules/@directus/api/dist/cli/run.js
  NODEJS_VERSION: 22.23.3-r0
  PYTHON_VERSION: 3.13.16-r0
  REL: "2"
  SEMVER_MAJOR_MINOR_VERSION: "12.4"
  SEMVER_MAJOR_VERSION: "12"
  SEMVER_VERSION: 12.4.1
  VERSION: 12.4.1
contents:
  repositories:
    - https://dhi.io/apk/alpine/v3.24/main
    - https://dhi.io/apk/alpine/v3.23/main
    - https://dl-cdn.alpinelinux.org/alpine/v3.24/main
    - https://dl-cdn.alpinelinux.org/alpine/v3.24/community
  keyring:
    - https://dhi.io/keyring/dhi-apk@docker-0F81AD7700D99184.rsa.pub
  packages:
    - alpine-baselayout-data
  builds:
    - name: directus
      work-dir: ${source.dir}/directus
      environment:
        npm_config_python: /usr/bin/python3.13
      caches:
        - path: /root/.local/share/pnpm/store
        - path: /root/.cache
      contents:
        packages:
          - bash
          - busybox
          - ca-certificates-bundle
          - build-base
          - python-3.13=3.13.16-r0
          - nodejs-22=22.23.3-r0
          - nodejs-22-dev=22.23.3-r0
          - corepack
        files:
          - url: git+https://github.com/directus/directus.git#v12.4.1
            checksum: d52fd4b29ecdd4d260aa47ca8cee58d9d62bf486
            path: ${source.dir}/directus
            spdx:
              name: directus
              version: 12.4.1
              packages:
                - name: directus
                  purl: pkg:github/directus/directus@12.4.1
                  license: LicenseRef-MSCL-1.0-GPL
            uid: 0
            gid: 0
      pipeline:
        - name: hash the process id with sha-256
          uses: patch@v1
          with:
            options: -p1
            patches:
              - ${source.dir}/patch/dhi-build-fips-process-id.patch
        - name: install, build, test and stage
          privileged: true
          runs: |
            set -eux -o pipefail

            export SOURCE_DIR="${source.dir}" TARGET_DIR="${target.dir}"
            bash "${source.dir}/build.sh"
        - uses: dhi/build-pkg:0
          with:
            depends:
              - nodejs-22
            description: Directus, a real-time REST and GraphQL API and admin app for SQL databases
            files:
              - usr/lib/nodejs/directus
              - usr/bin/directus
              - usr/bin/pm2
            formats:
              - apk
            license: LicenseRef-MSCL-1.0-GPL
            name: directus-12
            rel: 2
            url: https://directus.com
            version: 12.4.1
      paths:
        - type: file
          path: ${source.dir}/build.sh
          uid: 0
          gid: 0
          mode: "0755"
          source: package/main/directus/build.sh
        - type: file
          path: ${source.dir}/patch/dhi-build-fips-process-id.patch
          uid: 0
          gid: 0
          source: package/main/directus/patch/dhi-build-fips-process-id.patch
        - type: file
          path: ${source.dir}/patch/isolated-vm-cstdint.patch
          uid: 0
          gid: 0
          mode: "0644"
          source: package/main/directus/patch/isolated-vm-cstdint.patch
os-release:
  name: Docker Hardened Images (Alpine)
  id: alpine
  version-id: "3.24"
  pretty-name: Docker Hardened Images/Alpine Linux v3.24
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
