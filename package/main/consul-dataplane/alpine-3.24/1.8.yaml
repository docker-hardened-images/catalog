                  - path: usr/bin/discover
                    source: usr/bin/discover-dev
                  - path: opt/docker/sbom/consul-dataplane
                    source: dev/opt/docker/sbom/consul-dataplane
                  - path: opt/docker/sbom/go-discover
                    source: dev/opt/docker/sbom/go-discover
                  - path: usr/share/licenses/consul-dataplane
                    source: dev/usr/share/licenses/consul-dataplane
                name: consul-dataplane-1.8-dev
            url: https://github.com/hashicorp/consul-dataplane
            version: 1.8.18
