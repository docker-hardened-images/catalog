        - name: verify build info
          runs: |
            set -eux -o pipefail

            grep -qxF "$(printf '\tVersion = "%s"' "1.8.18")" /go/src/github.com/hashicorp/consul-dataplane/pkg/version/version.go
            for name in consul-dataplane discover; do
              runtime=${target.dir}/usr/bin/$name
              devbin=${target.dir}/usr/bin/$name-dev
              want=""
              verflag="-X main.version=1.2.1-0.20260522071849-ca13b81fe744"
              if [ "$name" = consul-dataplane ]; then
                want="hashicorpmetrics"
                verflag="-X github.com/hashicorp/consul-dataplane/pkg/version.Version=1.8.18"
              fi
              if [ "false" = "true" ]; then
                want=$(printf '%s\n' $want fips140v1.0 | paste -sd, -)
              fi
              for bin in "$runtime" "$devbin"; do
                test -x "$bin"
                go version -m "$bin" > /tmp/buildinfo.txt
                head -n1 /tmp/buildinfo.txt | grep -qE ": go1.26\.[0-9]+$"
                grep -qxF "$(printf '\tbuild\tCGO_ENABLED=0')" /tmp/buildinfo.txt
                grep -E '^[[:space:]]+build[[:space:]]+-ldflags=' /tmp/buildinfo.txt | grep -qF -- "$verflag"
                if [ -n "$want" ]; then
                  grep -qxF "$(printf '\tbuild\t-tags=%s' "$want")" /tmp/buildinfo.txt
                elif grep -q -- '-tags=' /tmp/buildinfo.txt; then
                  echo "$bin: unexpected build tags" >&2
                  exit 1
                fi
                if [ "false" = "true" ]; then
                  grep -qE '^[[:space:]]+build[[:space:]]+GOFIPS140=' /tmp/buildinfo.txt
                elif grep -q 'GOFIPS140' /tmp/buildinfo.txt; then
                  echo "$bin: FIPS build settings on a non-FIPS build" >&2
                  exit 1
                fi
                readelf -lW "$bin" > /tmp/phdr.txt
                if grep -q INTERP /tmp/phdr.txt; then
                  echo "$bin: dynamically linked" >&2
                  exit 1
                fi
                grep '^[[:space:]]*dep[[:space:]]' /tmp/buildinfo.txt > "/tmp/deps-$(basename "$bin")"
              done
              cmp "/tmp/deps-$name" "/tmp/deps-$name-dev"
            done

            suffix=""
            if [ "false" = "true" ]; then
              suffix="+fips1403"
            fi
            for bin in consul-dataplane consul-dataplane-dev; do
              ${target.dir}/usr/bin/$bin -version > /tmp/version.txt
              test "$(sed -n 1p /tmp/version.txt)" = "Consul Dataplane v1.8.18$suffix"
              test "$(sed -n 2p /tmp/version.txt)" = "Revision db85dd38"
            done
            go version -m ${target.dir}/usr/bin/discover > /tmp/buildinfo.txt
            grep -qE "^[[:space:]]+mod[[:space:]]+github.com/hashicorp/go-discover[[:space:]]" /tmp/buildinfo.txt
        - name: check licenses
