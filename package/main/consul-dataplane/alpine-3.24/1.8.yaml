              - go.opentelemetry.io/otel@v1.47.0
              - go.opentelemetry.io/otel/trace@v1.47.0
            downgrade: true
        - uses: go/hermetic@v1
          work-dir: /go/src/github.com/hashicorp/go-discover
        - name: test discover
          work-dir: /go/src/github.com/hashicorp/go-discover
          runs: |
            set -eux -o pipefail

            CGO_ENABLED=0 go test ./... -p 2 -count=1 -json > /tmp/discover-test.json || true
            jq -r 'select(.Test == null and (.Action == "pass" or .Action == "fail")) | "\(.Action) \(.Package)"' \
              /tmp/discover-test.json | sort -k2 | tee /tmp/discover-results
            if grep -E '^fail ' /tmp/discover-results \
              | grep -vxE 'fail github.com/hashicorp/go-discover/provider/(mdns|srv|tencentcloud)'; then
              exit 1
            fi
            find . -name '*_test.go' -not -path '*/vendor/*' -not -path './provider/gce/*' -exec dirname {} + | sort -u \
              | sed 's#^\.#pass github.com/hashicorp/go-discover#' \
              | grep -vxE 'pass github.com/hashicorp/go-discover/provider/(mdns|srv|tencentcloud)' > /tmp/discover-expected
            if grep -vxFf /tmp/discover-results /tmp/discover-expected; then
              exit 1
            fi
        - name: build discover
          uses: go/build@v1
          work-dir: /go/src/github.com/hashicorp/go-discover
          with:
