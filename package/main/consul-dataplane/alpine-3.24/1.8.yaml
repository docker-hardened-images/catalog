        - name: update discover dependencies
          uses: go/bump@v3
          work-dir: /go/src/github.com/hashicorp/go-discover
          with:
            deps:
              - golang.org/x/net@v0.62.0
              - golang.org/x/crypto@v0.59.0
              - golang.org/x/text@v0.44.0
