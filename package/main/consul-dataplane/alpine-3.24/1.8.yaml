            set -eux -o pipefail

            test -s /opt/docker/sbom/consul-dataplane/.spdx.consul-dataplane.json
            test -s /opt/docker/sbom/go-discover/.spdx.go-discover.json
            grep -qF 'Mozilla Public License Version 2.0' /go/src/github.com/hashicorp/consul-dataplane/LICENSE
            grep -qiF 'Mozilla Public License, version 2.0' /go/src/github.com/hashicorp/go-discover/LICENSE
            install -m 0644 /go/src/github.com/hashicorp/consul-dataplane/LICENSE ${target.dir}/usr/share/licenses/consul-dataplane/LICENSE
            install -m 0644 /go/src/github.com/hashicorp/go-discover/LICENSE ${target.dir}/usr/share/licenses/consul-dataplane/go-discover-LICENSE
            install -d ${target.dir}/opt/docker/sbom ${target.dir}/dev/opt/docker/sbom ${target.dir}/dev/usr/share/licenses
            cp -a /opt/docker/sbom/consul-dataplane /opt/docker/sbom/go-discover ${target.dir}/opt/docker/sbom/
            cp -a /opt/docker/sbom/consul-dataplane /opt/docker/sbom/go-discover ${target.dir}/dev/opt/docker/sbom/
            cp -a ${target.dir}/usr/share/licenses/consul-dataplane ${target.dir}/dev/usr/share/licenses/
        - uses: dhi/build-pkg:0
          with:
            deb:
              depends:
                - envoy-1.38
            depends:
              - ca-certificates-bundle
            description: Consul Dataplane, the Envoy lifecycle manager for Consul service mesh, with go-discover
