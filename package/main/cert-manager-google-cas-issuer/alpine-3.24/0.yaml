                  - path: opt/docker/sbom/google-cas-issuer
                    source: opt/docker/sbom-dev/google-cas-issuer
                  - path: usr/share/licenses/cert-manager-google-cas-issuer/LICENSE
                    source: usr/share/licenses/cert-manager-google-cas-issuer-dev/LICENSE
                name: cert-manager-google-cas-issuer-0-dev
