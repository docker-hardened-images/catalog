            download: true
        - uses: go/hermetic@v1
        - name: test
          runs: |
            set -eux -o pipefail

            if [ "false" = "true" ]; then
              export GOFIPS140=v1.0.0
              export GODEBUG=fips140=on
            fi

            go test -count=1 ./api/... ./cmd/... ./pkg/...
        - name: stamp module version
          runs: |
            set -eux -o pipefail

            src=/go/src/github.com/cert-manager/google-cas-issuer
            if grep -qE '^[[:space:]]*(replace|exclude|godebug)([[:space:]]|\()' "$src/go.mod"; then
              echo "$src/go.mod has replace, exclude or godebug directives, which the wrapper module drops" >&2
              exit 1
            fi
            go_line=$(awk '$1=="go"{print $2; exit}' "$src/go.mod")
            test -n "$go_line"
            mkdir -p /go/src/dhi-google-cas-issuer-build
            cd /go/src/dhi-google-cas-issuer-build
            go mod init dhi.build.google-cas-issuer
            go mod edit -go="$go_line"
            go mod edit -require=github.com/cert-manager/google-cas-issuer@v0.13.0
            go mod edit -replace=github.com/cert-manager/google-cas-issuer="$src"
            cp "$src/go.sum" go.sum
        - name: build
          uses: go/build@v1
          work-dir: /go/src/dhi-google-cas-issuer-build
          with:
            extra-env: GOPROXY=off GOSUMDB=off GOFLAGS=-mod=mod
