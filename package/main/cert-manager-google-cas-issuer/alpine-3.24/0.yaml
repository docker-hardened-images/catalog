              - -w
            output: ${target.dir}/usr/bin/google-cas-issuer
            packages: github.com/cert-manager/google-cas-issuer
        - name: build dev
          uses: go/build@v1
          work-dir: /go/src/dhi-google-cas-issuer-build
          with:
            extra-env: GOPROXY=off GOSUMDB=off GOFLAGS=-mod=mod
            fips: false
            ldflags:
              - -linkmode=internal
            output: ${target.dir}/usr/bin/google-cas-issuer-dev
            packages: github.com/cert-manager/google-cas-issuer
            strip: false
        - name: verify build info
          runs: |
            set -eux -o pipefail

            src=/go/src/github.com/cert-manager/google-cas-issuer
            runtime=${target.dir}/usr/bin/google-cas-issuer
            devbin=${target.dir}/usr/bin/google-cas-issuer-dev
            mod=$(printf 'mod\tgithub.com/cert-manager/google-cas-issuer\tv%s' '0.13.0')

            awk '/^require \($/{r=1; next} r && /^\)$/{r=0; next} r && NF >= 2 {print $1, $2} /^require [^(]/{print $2, $3}' "$src/go.mod" | LC_ALL=C sort -u > /tmp/requires.txt
            test -s /tmp/requires.txt

            for bin in "$runtime" "$devbin"; do
              test -x "$bin"
              go version -m "$bin" > /tmp/buildinfo.txt
              grep -F "$mod" /tmp/buildinfo.txt
              grep -qE '^[[:space:]]+build[[:space:]]+CGO_ENABLED=0$' /tmp/buildinfo.txt
              awk '$1 == "dep" {print $2, $3}' /tmp/buildinfo.txt | LC_ALL=C sort -u > /tmp/deps.txt
              test -s /tmp/deps.txt
              if LC_ALL=C comm -13 /tmp/requires.txt /tmp/deps.txt | grep .; then
                echo "$bin: module versions differ from $src/go.mod" >&2
                exit 1
              fi
              if [ "false" = "true" ]; then
                grep -qE '^[[:space:]]+build[[:space:]]+GOFIPS140=v1\.0\.0(-[0-9a-f]+)?$' /tmp/buildinfo.txt
                grep -qE '^[[:space:]]+build[[:space:]]+DefaultGODEBUG=(.*,)?fips140=on(,|$)' /tmp/buildinfo.txt
              elif grep -q fips140 /tmp/buildinfo.txt; then
                echo "$bin: FIPS build settings on a non-FIPS build" >&2
                exit 1
              fi
            done

            go version -m "$runtime" | grep -qF -- '-ldflags="-s -w"'
            go version -m "$runtime" | grep -qxF "$(printf '\tbuild\t-trimpath=true')"
            if go version -m "$devbin" | grep -E -- '-ldflags=.*-(s|w)( |"|$)|-trimpath=true'; then
              echo "$devbin: dev binary must keep symbols and paths" >&2
              exit 1
            fi
        - name: stage sbom and license
          runs: |
            set -eux -o pipefail

            license=/go/src/github.com/cert-manager/google-cas-issuer/LICENSE
            test -s /opt/docker/sbom/google-cas-issuer/.spdx.google-cas-issuer.json
            grep -q 'Apache License' "$license"
            grep -q 'Version 2.0' "$license"
            install -d "${target.dir}/opt/docker/sbom" "${target.dir}/opt/docker/sbom-dev"
            cp -a /opt/docker/sbom/google-cas-issuer "${target.dir}/opt/docker/sbom/"
            cp -a /opt/docker/sbom/google-cas-issuer "${target.dir}/opt/docker/sbom-dev/"
            install -D -m 0644 "$license" "${target.dir}/usr/share/licenses/cert-manager-google-cas-issuer/LICENSE"
            install -D -m 0644 "$license" "${target.dir}/usr/share/licenses/cert-manager-google-cas-issuer-dev/LICENSE"
        - uses: dhi/build-pkg:0
