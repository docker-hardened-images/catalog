# syntax=dhi.io/build:2-debian13

image: dhi.io/pkg-mongodb-mcp
variant: runtime
tags:
  - 3.1.0
  - 3.1.0-r4
  - 3.1.0-debian13
  - 3.1.0-r4-debian13
platforms:
  - linux/amd64
  - linux/arm64
dates:
  release: "2026-09-17"
vars:
  COMMIT_SHA: f369482783bdef116c35d352fd9d92f6c984242f
  REL: "4"
  SEMVER_MAJOR_MINOR_VERSION: "3.1"
  SEMVER_MAJOR_VERSION: "3"
  SEMVER_VERSION: 3.1.0
  VERSION: 3.1.0
contents:
  repositories:
    - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
  keyring:
    - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
  packages:
    - base-files
  builds:
    - name: mongodb-mcp
      work-dir: ${source.dir}/mongodb-mcp-server
      caches:
        - path: /root/.local/share/pnpm
        - path: /root/.npm
      contents:
        repositories:
          - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
        keyring:
          - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
        packages:
          - bash
          - ca-certificates
          - coreutils
          - findutils
          - git
          - grep
          - libc6
          - libstdc++6
          - mawk
          - nodejs-24
          - node-corepack
          - npm
          - sed
          - yarn-classic
          - yq
        files:
          - url: git+https://github.com/mongodb-js/mongodb-mcp-server.git#v3.1.0
            checksum: f369482783bdef116c35d352fd9d92f6c984242f
            path: ${source.dir}/mongodb-mcp-server
            spdx:
              name: mongodb-mcp-server
              version: 3.1.0
              packages:
                - name: mongodb-mcp-server
                  purl: pkg:dhi/mongodb-mcp@3.1.0
                  license: Apache-2.0
            uid: 0
            gid: 0
      pipeline:
        - name: bump pnpm dependencies
          privileged: true
          runs: |
            set -eux -o pipefail

            yq -Y -i '.overrides.minimatch = "10.2.6"' pnpm-workspace.yaml                                        # CVE-2026-26996, CVE-2026-27903, CVE-2026-27904
            yq -Y -i '.overrides.qs = "6.16.1"' pnpm-workspace.yaml                                               # CVE-2026-2391, CVE-2026-8723, CVE-2026-82417, CVE-2026-82562, CVE-2026-110816
            yq -Y -i '.overrides."body-parser" = "2.4.0"' pnpm-workspace.yaml                                     # CVE-2026-111181
            yq -Y -i '.overrides.hono = "4.13.11"' pnpm-workspace.yaml                                            # CVE-2026-54290, CVE-2026-54288, CVE-2026-54286, CVE-2026-54287, CVE-2026-54289, CVE-2026-84363, CVE-2026-84364, CVE-2026-84365, CVE-2026-93981, CVE-2026-111757
            yq -Y -i '.overrides."fast-xml-parser" = "5.7.0"' pnpm-workspace.yaml                                 # CVE-2026-41650
            yq -Y -i '.overrides."ip-address" = "10.7.4"' pnpm-workspace.yaml                                     # CVE-2026-69192, CVE-2026-54272, CVE-2026-69198, CVE-2026-101910, CVE-2026-101913, CVE-2026-101911, CVE-2026-101912, CVE-2026-111997
            yq -Y -i '.overrides."@mongodb-js/socksv5" = "0.0.11"' pnpm-workspace.yaml                            # pulls ip-address@10.7.4 (CVE-2026-69192 transitive)
            yq -Y -i '.overrides."fast-uri" = "3.1.9"' pnpm-workspace.yaml                                        # CVE-2026-16221, CVE-2026-18446, CVE-2026-75899, CVE-2026-75931, CVE-2026-75975, CVE-2026-76172, CVE-2026-84394, CVE-2026-86472, CVE-2026-110180, CVE-2026-110306, CVE-2026-110095, CVE-2026-110725
            yq -Y -i '.overrides."basic-ftp" = "6.2.1"' pnpm-workspace.yaml                                       # CVE-2026-102990
            yq -Y -i '.overrides."@hono/node-server" = "2.1.3"' pnpm-workspace.yaml                               # CVE-2026-118663, GHSA-frvp-7c67-39w9
            yq -Y -i '.overrides."hono>@hono/node-server" = "2.1.3"' pnpm-workspace.yaml                          # CVE-2026-118663
            yq -Y -i '.packageExtensions.hono.peerDependencies."@hono/node-server" = "2.1.3"' pnpm-workspace.yaml # CVE-2026-118663 (force peer dependency version)
        - name: build and stage payload
          privileged: true
          runs: |
            set -eux -o pipefail

            corepack enable
            corepack prepare pnpm@11.5.1 --activate

            rm -f pnpm-lock.yaml

            pnpm install

            npm run build

            pnpm --filter mongodb-mcp-server deploy --prod --legacy --ignore-scripts "${target.dir}/usr/lib/mongodb-mcp"

            rm -f "${target.dir}/usr/lib/mongodb-mcp/node_modules/.pnpm/node_modules/mongodb-mcp-server"

            node "${target.dir}/usr/lib/mongodb-mcp/dist/esm/index.js" --version | grep -Fx "3.1.0"

            mkdir -p "${target.dir}/usr/bin"
            printf '#!/bin/sh\nexec node /usr/lib/mongodb-mcp/dist/esm/index.js "$@"\n' > "${target.dir}/usr/bin/mongodb-mcp-server"
            chmod 0755 "${target.dir}/usr/bin/mongodb-mcp-server"
        - uses: dhi/build-pkg:0
          with:
            depends:
              - nodejs-24
            description: MongoDB MCP Server (Model Context Protocol server for MongoDB)
            files:
              - usr/lib/mongodb-mcp
              - usr/bin/mongodb-mcp-server
            formats:
              - deb
            license: Apache-2.0
            name: mongodb-mcp
            rel: 4
            url: https://github.com/mongodb-js/mongodb-mcp-server
            version: 3.1.0
os-release:
  name: Docker Hardened Images (Debian)
  id: debian
  version-id: "13"
  version-codename: trixie
  pretty-name: Docker Hardened Images/Debian GNU/Linux 13 (trixie)
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
