# syntax=dhi.io/build:2-debian13

image: dhi.io/pkg-mongodb-mcp
variant: runtime
tags:
  - 3.0.4
  - 3.0.4-r0
  - 3.0.4-debian13
  - 3.0.4-r0-debian13
platforms:
  - linux/amd64
  - linux/arm64
dates:
  release: "2026-09-17"
vars:
  COMMIT_SHA: fa19a8670449ef892a130abdfc1b49fb1dafba6e
  LIBC6_VERSION: 2.41-12+deb13u4+dhi0
  REL: "0"
  SEMVER_MAJOR_MINOR_VERSION: "3.0"
  SEMVER_MAJOR_VERSION: "3"
  SEMVER_VERSION: 3.0.4
  VERSION: 3.0.4
contents:
  packages:
    - base-files
  builds:
    - name: mongodb-mcp
      work-dir: ${source.dir}/mongodb-mcp-server
      caches:
        - path: /root/.local/share/pnpm
        - path: /root/.npm
      contents:
        repositories:
          - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
        keyring:
          - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
        packages:
          - bash
          - ca-certificates
          - coreutils
          - findutils
          - git
          - grep
          - libc6=2.41-12+deb13u4+dhi0
          - libstdc++6
          - mawk
          - nodejs-24
          - node-corepack
          - npm
          - sed
          - yarn-classic
          - yq
        files:
          - url: git+https://github.com/mongodb-js/mongodb-mcp-server.git#v3.0.4
            checksum: fa19a8670449ef892a130abdfc1b49fb1dafba6e
            path: ${source.dir}/mongodb-mcp-server
            spdx:
              name: mongodb-mcp-server
              version: 3.0.4
              packages:
                - name: mongodb-mcp-server
                  purl: pkg:dhi/mongodb-mcp@3.0.4
                  license: Apache-2.0
            uid: 0
            gid: 0
      pipeline:
        - name: bump pnpm dependencies
          privileged: true
          runs: |
            set -eux -o pipefail

            yq -Y -i '.overrides.minimatch = "10.2.6"' pnpm-workspace.yaml                 # CVE-2026-26996, CVE-2026-27903, CVE-2026-27904
            yq -Y -i '.overrides.qs = "6.15.2"' pnpm-workspace.yaml                        # CVE-2026-2391, CVE-2026-8723
            yq -Y -i '.overrides.hono = "4.12.34"' pnpm-workspace.yaml                     # CVE-2026-54290, CVE-2026-54288, CVE-2026-54286, CVE-2026-54287, CVE-2026-54289
            yq -Y -i '.overrides."fast-xml-parser" = "5.7.0"' pnpm-workspace.yaml          # CVE-2026-41650
            yq -Y -i '.overrides."ip-address" = "10.3.1"' pnpm-workspace.yaml              # CVE-2026-69192, CVE-2026-54272, CVE-2026-69198
            yq -Y -i '.overrides."@mongodb-js/socksv5" = "0.0.11"' pnpm-workspace.yaml     # pulls ip-address@10.3.1 (CVE-2026-69192 transitive)
            yq -Y -i '.overrides."fast-uri" = "3.1.5"' pnpm-workspace.yaml                 # CVE-2026-16221, CVE-2026-18446
            yq -Y -i '.overrides."@hono/node-server" = "1.19.15"' pnpm-workspace.yaml      # GHSA-frvp-7c67-39w9
            yq -Y -i '.overrides."hono>@hono/node-server" = "1.19.15"' pnpm-workspace.yaml # GHSA-frvp-7c67-39w9
        - name: build and stage payload
          privileged: true
          runs: |
            set -eux -o pipefail

            corepack enable
            corepack prepare pnpm@11.5.1 --activate

            rm -f pnpm-lock.yaml

            pnpm install

            npm run build

            pnpm --filter mongodb-mcp-server deploy --prod --legacy --ignore-scripts "${target.dir}/usr/lib/mongodb-mcp"

            rm -f "${target.dir}/usr/lib/mongodb-mcp/node_modules/.pnpm/node_modules/mongodb-mcp-server"

            node "${target.dir}/usr/lib/mongodb-mcp/dist/esm/index.js" --version | grep -Fx "3.0.4"

            mkdir -p "${target.dir}/usr/bin"
            printf '#!/bin/sh\nexec node /usr/lib/mongodb-mcp/dist/esm/index.js "$@"\n' > "${target.dir}/usr/bin/mongodb-mcp-server"
            chmod 0755 "${target.dir}/usr/bin/mongodb-mcp-server"
        - uses: dhi/build-pkg:0
          with:
            depends:
              - nodejs-24
            description: MongoDB MCP Server (Model Context Protocol server for MongoDB)
            files:
              - usr/lib/mongodb-mcp
              - usr/bin/mongodb-mcp-server
            formats:
              - deb
            license: Apache-2.0
            name: mongodb-mcp
            rel: 0
            url: https://github.com/mongodb-js/mongodb-mcp-server
            version: 3.0.4
os-release:
  name: Docker Hardened Images (Debian)
  id: debian
  version-id: "13"
  version-codename: trixie
  pretty-name: Docker Hardened Images/Debian GNU/Linux 13 (trixie)
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
