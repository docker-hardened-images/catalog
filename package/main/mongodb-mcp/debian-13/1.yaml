# syntax=dhi.io/build:2-debian13

image: dhi.io/pkg-mongodb-mcp
variant: runtime
tags:
  - 1.14.0
  - 1.14.0-r9
  - 1.14.0-debian13
  - 1.14.0-r9-debian13
platforms:
  - linux/amd64
  - linux/arm64
vars:
  COMMIT_SHA: b7d2a8ea682f99e794215415c71407ba96114f7d
  REL: "9"
  SEMVER_MAJOR_MINOR_VERSION: "1.14"
  SEMVER_MAJOR_VERSION: "1"
  SEMVER_VERSION: 1.14.0
  VERSION: 1.14.0
contents:
  repositories:
    - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
  keyring:
    - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
  packages:
    - base-files
  builds:
    - name: mongodb-mcp
      work-dir: ${source.dir}/mongodb-mcp-server
      caches:
        - path: /root/.local/share/pnpm
        - path: /root/.npm
      contents:
        repositories:
          - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
        keyring:
          - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
        packages:
          - bash
          - ca-certificates
          - coreutils
          - findutils
          - git
          - libc6
          - libstdc++6
          - mawk
          - nodejs-24
          - node-corepack
          - npm
          - sed
          - yarn-classic
          - yq
        files:
          - url: git+https://github.com/mongodb-js/mongodb-mcp-server.git#v1.14.0
            checksum: b7d2a8ea682f99e794215415c71407ba96114f7d
            path: ${source.dir}/mongodb-mcp-server
            spdx:
              name: mongodb-mcp-server
              version: 1.14.0
              packages:
                - name: mongodb-mcp-server
                  purl: pkg:dhi/mongodb-mcp@1.14.0
                  license: Apache-2.0
            uid: 0
            gid: 0
      pipeline:
        - name: bump pnpm dependencies
          privileged: true
          runs: |
            set -eux -o pipefail

            yq -Y -i '.overrides.minimatch = "10.2.6"' pnpm-workspace.yaml                                         # CVE-2026-26996, CVE-2026-27903, CVE-2026-27904
            yq -Y -i '.overrides.qs = "6.16.1"' pnpm-workspace.yaml                                                # CVE-2026-2391, CVE-2026-8723, CVE-2026-82417, CVE-2026-82562, CVE-2026-110816
            yq -Y -i '.overrides."@modelcontextprotocol/sdk" = "1.32.0"' pnpm-workspace.yaml                       # CVE-2026-25536, CVE-2026-104850, CVE-2026-111767, CVE-2026-111768, CVE-2026-111769, CVE-2026-111771
            yq -Y -i '.overrides.hono = "4.13.11"' pnpm-workspace.yaml                                             # CVE-2026-54290, CVE-2026-54288, CVE-2026-54286, CVE-2026-54287, CVE-2026-54289, CVE-2026-84363, CVE-2026-84364, CVE-2026-84365, CVE-2026-93981, CVE-2026-111757
            yq -Y -i '.overrides."fast-xml-parser" = "5.7.0"' pnpm-workspace.yaml                                  # CVE-2026-41650
            yq -Y -i '.overrides."ip-address" = "10.7.4"' pnpm-workspace.yaml                                      # CVE-2026-69192, CVE-2026-54272, CVE-2026-69198, CVE-2026-101910, CVE-2026-101913, CVE-2026-101911, CVE-2026-101912, CVE-2026-111997
            yq -Y -i '.overrides."@mongodb-js/socksv5" = "0.0.11"' pnpm-workspace.yaml                             # pulls ip-address@10.7.4 (CVE-2026-69192 transitive)
            yq -Y -i '.overrides."fast-uri" = "3.1.9"' pnpm-workspace.yaml                                         # CVE-2026-16221, CVE-2026-18446, CVE-2026-75899, CVE-2026-75931, CVE-2026-75975, CVE-2026-76172, CVE-2026-84394, CVE-2026-86472, CVE-2026-110180, CVE-2026-110306, CVE-2026-110095, CVE-2026-110725
            yq -Y -i '.overrides."basic-ftp" = "6.2.1"' pnpm-workspace.yaml                                        # CVE-2026-102990
            yq -Y -i '.overrides."@hono/node-server" = "2.0.10"' pnpm-workspace.yaml                               # GHSA-frvp-7c67-39w9
            yq -Y -i '.overrides."hono>@hono/node-server" = "2.0.10"' pnpm-workspace.yaml                          # GHSA-frvp-7c67-39w9 (peer dependency override)
            yq -Y -i '.packageExtensions.hono.peerDependencies."@hono/node-server" = "2.0.10"' pnpm-workspace.yaml # GHSA-frvp-7c67-39w9 (force peer dependency version)
        - name: build and stage payload
          privileged: true
          runs: |
            set -eux -o pipefail

            corepack enable
            corepack prepare pnpm@11.5.1 --activate

            rm -f pnpm-lock.yaml

            pnpm install

            npm run build

            export CI=true
            pnpm prune --prod --ignore-scripts

            test -d node_modules/.pnpm/@mongodb-js+socksv5@0.0.11
            test -d node_modules/.pnpm/ip-address@10.7.4
            if ls -d node_modules/.pnpm/ip-address@9.* > /dev/null 2>&1; then
              echo "[ERROR] vulnerable ip-address@9.x still present after override" >&2
              exit 1
            fi

            mkdir -p "${target.dir}/usr/lib/mongodb-mcp/packages"
            cp -a node_modules "${target.dir}/usr/lib/mongodb-mcp/"
            cp -a dist "${target.dir}/usr/lib/mongodb-mcp/"
            cp -a packages/metrics "${target.dir}/usr/lib/mongodb-mcp/packages/"
            cp -a packages/types "${target.dir}/usr/lib/mongodb-mcp/packages/"

            mkdir -p "${target.dir}/usr/bin"
            printf '#!/bin/sh\nexec node /usr/lib/mongodb-mcp/dist/esm/index.js "$@"\n' > "${target.dir}/usr/bin/mongodb-mcp-server"
            chmod 0755 "${target.dir}/usr/bin/mongodb-mcp-server"
        - uses: dhi/build-pkg:0
          with:
            depends:
              - nodejs-24
            description: MongoDB MCP Server (Model Context Protocol server for MongoDB)
            files:
              - usr/lib/mongodb-mcp
              - usr/bin/mongodb-mcp-server
            formats:
              - deb
            license: Apache-2.0
            name: mongodb-mcp
            rel: 9
            url: https://github.com/mongodb-js/mongodb-mcp-server
            version: 1.14.0
os-release:
  name: Docker Hardened Images (Debian)
  id: debian
  version-id: "13"
  version-codename: trixie
  pretty-name: Docker Hardened Images/Debian GNU/Linux 13 (trixie)
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
