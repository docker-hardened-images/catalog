# syntax=dhi.io/build:2-debian13

image: dhi.io/pkg-piraeus-server
variant: runtime
tags:
  - 1.35.0
  - 1.35.0-r0
  - 1.35.0-debian13
  - 1.35.0-r0-debian13
platforms:
  - linux/amd64
  - linux/arm64
dates:
  release: "2019-08-08"
vars:
  CARGO_VERSION: 1.97.1-0
  COMMIT_SHA: c8c5ad1bbd02992d1e3fc8003ec0cedd2f7e21bb
  GOLANG_VERSION: 1.26.7-1
  GRADLE_VERSION: 8.14.5-1
  JDK_MAJOR_VERSION: "21"
  JDK_VERSION: 21.0.12.8-0
  K8S_AWAIT_ELECTION_COMMIT_SHA: f4eada1c7520d1e5dc11f5887cc199e07b3bd6cd
  K8S_AWAIT_ELECTION_VERSION: v0.5.0
  LINSTOR_CLIENT_COMMIT_SHA: 9c57f040eb3834500db508e4f04d361d006cb6b5
  LINSTOR_CLIENT_VERSION: 1.27.1
  LINSTOR_COMMIT_SHA: c8c5ad1bbd02992d1e3fc8003ec0cedd2f7e21bb
  LINSTOR_VERSION: 1.35.0
  LOSETUP_CONTAINER_COMMIT_SHA: c1b24da76a9eaa95a0d3561f6a4f995e3a28c0d2
  LOSETUP_CONTAINER_VERSION: v1.1.0
  PACKAGE_NAME: piraeus-server
  PIRAEUS_COMMIT_SHA: 4f78b2e2550bd5f0e6a06bd9bbc6bc46ee348edb
  PROTOC_ARCH: '#{ target.arch == "amd64" ? "x86_64" : "aarch_64" }'
  PROTOC_CHECKSUM: '#{ target.arch == "amd64" ? "sha256:96553041f1a91ea0efee963cb16f462f5985b4d65365f3907414c360044d8065" : "sha256:6c554de11cea04c56ebf8e45b54434019b1cd85223d4bbd25c282425e306ecc2" }'
  PROTOC_COMMIT_SHA: 74211c0dfc2777318ab53c2cd2c317a2ef9012de
  PROTOC_VERSION: "31.1"
  PYTHON_LINSTOR_COMMIT_SHA: 578e45c998938a7696fe9258cd6b9e22a3941738
  PYTHON_LINSTOR_VERSION: 1.27.1
  PYTHON_MAJOR_MINOR_VERSION: "3.13"
  PYTHON_VERSION: 3.13.15-0
  REL: "0"
  RUSTC_VERSION: 1.97.1-0
  SEMVER_MAJOR_MINOR_VERSION: "1.35"
  SEMVER_MAJOR_VERSION: "1"
  SEMVER_VERSION: 1.35.0
  VERSION: 1.35.0
contents:
  packages:
    - '!base-files'
  builds:
    - name: piraeus-server
      environment:
        PIP_BREAK_SYSTEM_PACKAGES: "1"
      caches:
        - path: /go/pkg/mod
        - path: /root/.cargo
        - path: /root/.gradle/caches
        - path: /root/.gradle/wrapper
      contents:
        repositories:
          - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
        keyring:
          - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
        packages:
          - bash
          - build-essential
          - ca-certificates
          - ca-certificates-bundle
          - cargo-1.97=1.97.1-0
          - cmake
          - coreutils
          - diffutils
          - eclipse-temurin-21-jdk=21.0.12.8-0
          - findutils
          - gawk
          - git
          - golang-1.26=1.26.7-1
          - gradle-8=8.14.5-1
          - grep
          - jq
          - libclang-dev
          - libstdc++6
          - make
          - mawk
          - protobuf-compiler
          - python-3.13=3.13.15-0
          - python-3.13-dev=3.13.15-0
          - python3-pip
          - python3-setuptools
          - python3-wheel
          - rustc-1.97=1.97.1-0
          - sed
          - tar
          - unzip
          - wget
          - zlib1g
          - zlib1g-dev
        files:
          - url: git+https://github.com/LINBIT/k8s-await-election.git#v0.5.0
            checksum: f4eada1c7520d1e5dc11f5887cc199e07b3bd6cd
            path: /go/src/github.com/linbit/k8s-await-election
            spdx:
              name: k8s-await-election
              version: v0.5.0
              packages:
                - name: k8s-await-election
                  purl: pkg:golang/github.com/linbit/k8s-await-election@v0.5.0
                  license: Apache-2.0
            uid: 0
            gid: 0
          - url: git+https://github.com/LINBIT/losetup-container.git#v1.1.0
            checksum: c1b24da76a9eaa95a0d3561f6a4f995e3a28c0d2
            path: ${source.dir}/losetup
            spdx:
              name: losetup-container
              version: v1.1.0
              packages:
                - name: losetup-container
                  purl: pkg:github/LINBIT/losetup-container@v1.1.0
                  license: GPL-2.0
            uid: 0
            gid: 0
          - url: git+https://github.com/piraeusdatastore/piraeus.git#4f78b2e2550bd5f0e6a06bd9bbc6bc46ee348edb
            checksum: 4f78b2e2550bd5f0e6a06bd9bbc6bc46ee348edb
            path: ${source.dir}/piraeus
            spdx:
              name: piraeus
              version: 1.35.0
              packages:
                - name: piraeus
                  purl: pkg:github/piraeusdatastore/piraeus@1.35.0
                  license: Apache-2.0
            uid: 0
            gid: 0
          - url: git+https://github.com/LINBIT/linstor-api-py.git#v1.27.1
            checksum: 578e45c998938a7696fe9258cd6b9e22a3941738
            path: ${source.dir}/linstor-api-py
            spdx:
              name: python-linstor
              version: 1.27.1
              packages:
                - name: python-linstor
                  purl: pkg:github/LINBIT/linstor-api-py@1.27.1
                  license: LGPL-3.0
            uid: 0
            gid: 0
          - url: git+https://github.com/LINBIT/linstor-client.git#v1.27.1
            checksum: 9c57f040eb3834500db508e4f04d361d006cb6b5
            path: ${source.dir}/linstor-client
            spdx:
              name: linstor-client
              version: 1.27.1
              packages:
                - name: linstor-client
                  purl: pkg:github/LINBIT/linstor-client@1.27.1
                  license: GPL-3.0
            uid: 0
            gid: 0
          - url: git+https://github.com/LINBIT/linstor-server.git#v1.35.0
            checksum: c8c5ad1bbd02992d1e3fc8003ec0cedd2f7e21bb
            path: ${source.dir}/linstor-server
            spdx:
              name: linstor-server
              version: 1.35.0
              packages:
                - name: linstor-server
                  purl: pkg:github/LINBIT/linstor-server@1.35.0
                  license: GPL-2.0
            uid: 0
            gid: 0
          - url: https://github.com/protocolbuffers/protobuf/releases/download/v31.1/protoc-31.1-linux-${PROTOC_ARCH}.zip
            checksum: ${PROTOC_CHECKSUM}
            path: ${source.dir}/protoc-31.1-linux-${PROTOC_ARCH}.zip
            spdx:
              name: protoc
              version: "31.1"
              packages:
                - name: protoc
                  purl: pkg:github/protocolbuffers/protobuf@31.1
                  license: BSD-3-Clause
            uid: 0
            gid: 0
      pipeline:
        - name: update-go-dependencies
          uses: go/bump@v1
          work-dir: /go/src/github.com/linbit/k8s-await-election
          with:
            deps:
              - golang.org/x/net@v0.58.0
              - golang.org/x/text@v0.41.0
            download: true
        - name: build-k8s-await-election
          uses: go/build@v1
          work-dir: /go/src/github.com/linbit/k8s-await-election
          with:
            output: ${target.dir}/usr/bin/k8s-await-election
        - name: losetup ui sbom
          uses: sbom@v1
          work-dir: ${source.dir}/losetup
          with:
            extra-scanners: rust-cargo-lock-cataloger
            prefix: losetup-cargo
            source: ${source.dir}/losetup
        - name: build losetup-container
          work-dir: ${source.dir}/losetup
          privileged: true
          runs: |
            set -eux -o pipefail

            cargo build --release -vv
            install -D target/release/losetup-container \
              '${target.dir}/usr/sbin/losetup-container'
            mkdir -p ${target.dir}/usr/lib/piraeus-server/bin
            printf '#!/bin/sh\nLOSETUP_CONTAINER_ORIGINAL_LOSETUP=/usr/sbin/losetup exec /usr/sbin/losetup-container "$@"\n' \
              > ${target.dir}/usr/lib/piraeus-server/bin/losetup
            chmod 0755 ${target.dir}/usr/lib/piraeus-server/bin/losetup
        - name: copy-entrypoint-script
          work-dir: ${source.dir}/piraeus
          runs: |
            set -eux -o pipefail

            mkdir -p ${target.dir}/usr/bin
            install -m 0755 dockerfiles/piraeus-server/entry.sh ${target.dir}/usr/bin/piraeus-entry.sh
        - name: initialize-python-linstor-submodules
          work-dir: ${source.dir}/linstor-api-py
          runs: |
            set -eux -o pipefail

            git submodule update --init --recursive
        - name: patch-python-linstor-for-python312
          work-dir: ${source.dir}/linstor-api-py
          runs: |
            set -eux -o pipefail

            sed -i 's/from distutils\.version import StrictVersion/from packaging.version import Version as StrictVersion/' linstor/linstorapi.py
        - name: build-python-linstor
          work-dir: ${source.dir}/linstor-api-py
          privileged: true
          runs: |
            set -eux -o pipefail

            python3 -m pip install --no-cache-dir setuptools wheel packaging
            python3 setup.py build
        - name: install-python-linstor
          work-dir: ${source.dir}/linstor-api-py
          privileged: true
          runs: |
            set -eux -o pipefail

            PYTHON_SITE_PACKAGES=$(python3 -c "import site; print(site.getsitepackages()[0])")
            PYTHON_PREFIX=$(python3 -c "import sys; print(sys.prefix)")
            SITE_PACKAGES_RELATIVE="${PYTHON_SITE_PACKAGES#${PYTHON_PREFIX}/}"
            TEMP_INSTALL_DIR="/tmp/python-linstor-install"
            TEMP_SITE_PACKAGES="/tmp/python-site-packages"

            python3 setup.py install --prefix="${TEMP_INSTALL_DIR}" --root=/ --single-version-externally-managed

            mkdir -p "${TEMP_SITE_PACKAGES}"
            INSTALL_PATH="${TEMP_INSTALL_DIR}/${SITE_PACKAGES_RELATIVE}/linstor"
            INSTALL_SITE_PACKAGES="${TEMP_INSTALL_DIR}/${SITE_PACKAGES_RELATIVE}"
            cp -r "${INSTALL_PATH}" "${TEMP_SITE_PACKAGES}/"
            cp -r "${INSTALL_SITE_PACKAGES}"/python_linstor*.egg-info "${TEMP_SITE_PACKAGES}/"
            export PYTHONPATH="${TEMP_SITE_PACKAGES}${PYTHONPATH:+:${PYTHONPATH}}"
            python3 -m pip install --no-cache-dir --target "${TEMP_SITE_PACKAGES}" setuptools packaging
        - name: build-linstor-client
          work-dir: ${source.dir}/linstor-client
          privileged: true
          runs: |
            set -eux -o pipefail

            python3 -m pip install --no-cache-dir setuptools wheel
            TEMP_SITE_PACKAGES="/tmp/python-site-packages"
            export PYTHONPATH="${TEMP_SITE_PACKAGES}${PYTHONPATH:+:${PYTHONPATH}}"
            python3 setup.py build
        - name: install-linstor-components
          runs: |
            set -eux -o pipefail

            PYTHON_SITE_PACKAGES=$(python3 -c "import site; print(site.getsitepackages()[0])")
            PYTHON_PREFIX=$(python3 -c "import sys; print(sys.prefix)")
            PYTHON_BIN_DIR=$(python3 -c "import sys; print(sys.prefix + '/bin')")
            SITE_PACKAGES_RELATIVE="${PYTHON_SITE_PACKAGES#${PYTHON_PREFIX}/}"
            TEMP_CLIENT_INSTALL_DIR="/tmp/linstor-client-install"
            TEMP_SITE_PACKAGES="/tmp/python-site-packages"
            STAGING_DIR="/tmp/staging-python-packages"
            PYTHON_PACKAGES_DIR="${target.dir}/usr/lib/python3.13/site-packages"

            export PYTHONPATH="${PYTHON_SITE_PACKAGES}${PYTHONPATH:+:${PYTHONPATH}}"

            cd ${source.dir}/linstor-client
            python3 setup.py install --prefix="${TEMP_CLIENT_INSTALL_DIR}" --root=/ --single-version-externally-managed

            mkdir -p "${target.dir}/usr/bin"
            mkdir -p "${STAGING_DIR}"
            mkdir -p "${PYTHON_PACKAGES_DIR}"

            cp -r "${TEMP_SITE_PACKAGES}/linstor" "${STAGING_DIR}/"
            cp -r "${TEMP_SITE_PACKAGES}"/python_linstor*.egg-info "${STAGING_DIR}/"
            cp -r "${TEMP_SITE_PACKAGES}/setuptools" "${STAGING_DIR}/"
            cp -r "${TEMP_SITE_PACKAGES}/packaging" "${STAGING_DIR}/"

            CLIENT_INSTALL_PATH="${TEMP_CLIENT_INSTALL_DIR}/${SITE_PACKAGES_RELATIVE}/linstor_client"
            CLIENT_MAIN_PY_PATH="${TEMP_CLIENT_INSTALL_DIR}/${SITE_PACKAGES_RELATIVE}/linstor_client_main.py"
            CLIENT_INSTALL_SITE_PACKAGES="${TEMP_CLIENT_INSTALL_DIR}/${SITE_PACKAGES_RELATIVE}"

            cp -r "${CLIENT_INSTALL_PATH}" "${STAGING_DIR}/"
            cp "${CLIENT_MAIN_PY_PATH}" "${STAGING_DIR}/"
            cp -r "${CLIENT_INSTALL_SITE_PACKAGES}"/linstor_client*.egg-info "${STAGING_DIR}/"
            cp -r "${STAGING_DIR}"/* "${PYTHON_PACKAGES_DIR}/"

            PYTHON_BIN_RELATIVE="${PYTHON_BIN_DIR#${PYTHON_PREFIX}/}"
            if [ -x "${TEMP_CLIENT_INSTALL_DIR}/local/bin/linstor" ]; then
              LINSTOR_SCRIPT_PATH="${TEMP_CLIENT_INSTALL_DIR}/local/bin/linstor"
            else
              LINSTOR_SCRIPT_PATH="${TEMP_CLIENT_INSTALL_DIR}/${PYTHON_BIN_RELATIVE}/linstor"
            fi
            cp "${LINSTOR_SCRIPT_PATH}" "${target.dir}/usr/bin/linstor"
        - name: initialize linstor-server submodules
          work-dir: ${source.dir}/linstor-server
          runs: |
            set -eux -o pipefail

            git config --global user.email "build@dhi.io" || true
            git config --global user.name "DHI Build" || true
            git fetch --tags --unshallow 2> /dev/null || git fetch --tags || true
            git submodule init
            git submodule update
        - uses: gradle/mirror@v1
        - name: upgrade vulnerable dependencies
          work-dir: ${source.dir}/linstor-server
          runs: |
            set -eux -o pipefail

            SCRIPT_DIR="${source.dir}/scripts"
            PATCH_DIR="${source.dir}/patch"
            SED_BUMP_SCRIPT="${SCRIPT_DIR}/sed_bump.sh"

            BUMPS_FILE="${PATCH_DIR}/dependency_bumps_build.gradle.json"
            export DHI_WITH_FILE="./build.gradle"
            export DHI_WITH_BUMPS="$BUMPS_FILE"
            "$SED_BUMP_SCRIPT"

            sed -i 's/2\.21\.4\.+/2.21.4/g' ./build.gradle || sed -i '' 's/2\.21\.4\.+/2.21.4/g' ./build.gradle

            cat << 'GRADLE_APPEND' >> ./build.gradle

            allprojects {
                configurations.all {
                    resolutionStrategy.force(
                        "com.google.guava:guava:32.0.1-jre",
                        "com.fasterxml.jackson.core:jackson-databind:2.22.1",
                        "io.vertx:vertx-core:4.5.27",
                        "io.vertx:vertx-auth-common:4.5.27",
                        "io.vertx:vertx-web-client:4.5.27",
                        "io.vertx:vertx-web-common:4.5.27",
                        "io.netty:netty-codec:4.2.17.Final",
                        "io.netty:netty-codec-dns:4.2.17.Final",
                        "io.netty:netty-codec-http:4.2.17.Final",
                        "io.netty:netty-codec-http2:4.2.17.Final",
                        "io.netty:netty-codec-compression:4.2.17.Final",
                        "io.netty:netty-handler:4.2.17.Final",
                        "io.netty:netty-handler-proxy:4.2.17.Final",
                        "io.netty:netty-resolver-dns:4.1.135.Final",
                        "io.netty:netty-transport-native-epoll:4.2.17.Final",
                        "org.apache.httpcomponents.core5:httpcore5:5.4.3",
                        "org.apache.httpcomponents.core5:httpcore5-h2:5.4.3",
                        "org.apache.httpcomponents.client5:httpclient5:5.6.3",
                        "org.postgresql:postgresql:42.7.12"
                    )
                }
            }
            GRADLE_APPEND

            BUMPS_FILE="${PATCH_DIR}/dependency_bumps_gradle.lockfile.json"
            export DHI_WITH_FILE="./gradle.lockfile"
            export DHI_WITH_BUMPS="$BUMPS_FILE"
            "$SED_BUMP_SCRIPT"
        - name: patch linstor-server source
          work-dir: ${source.dir}/linstor-server
          runs: |
            set -eux -o pipefail

            sed -i 's|stmt.executeUpdate("SET COMPRESS_LOB LZF");||' server/src/main/java/com/linbit/linstor/logging/H2ErrorReporter.java
        - name: build LINSTOR
          work-dir: ${source.dir}/linstor-server
          privileged: true
          secrets:
            - id: maven_user
              env: MAVEN_USER
              optional: true
            - id: maven_password
              env: MAVEN_PASSWORD
              optional: true
          runs: |
            set -eux -o pipefail

            export GRADLE_HOME="/usr/share/java/gradle"
            export JAVA_HOME="/usr/lib/jvm/temurin-21"
            export PATH="${GRADLE_HOME}/bin:${JAVA_HOME}/bin:${PATH}"

            PROTOC_DIR="tools/protoc-31.1"
            mkdir -p "${PROTOC_DIR}"
            unzip -o "${source.dir}/protoc-31.1-linux-${PROTOC_ARCH}.zip" -d "${PROTOC_DIR}"
            chmod +x "${PROTOC_DIR}/bin/protoc"
            "${PROTOC_DIR}/bin/protoc" --version

            gradle dependencies --write-locks --no-daemon -PversionOverride=v1.35.0 || true
            gradle install --no-daemon -x test -PversionOverride=v1.35.0
        - name: install LINSTOR artifacts
          work-dir: ${source.dir}/linstor-server
          runs: |
            set -eux -o pipefail

            mkdir -p "${target.dir}/usr/share/linstor-server/lib"
            mkdir -p "${target.dir}/usr/share/linstor-server/bin"

            cp -r controller/build/install/controller/lib/* "${target.dir}/usr/share/linstor-server/lib/"
            cp satellite/build/install/satellite/lib/satellite*.jar "${target.dir}/usr/share/linstor-server/lib/"

            find "controller/build/install/controller/bin/" -type f -executable | while read -r file; do
              filename="$(basename "$file")"
              cp "controller/build/install/controller/bin/$filename" "${target.dir}/usr/share/linstor-server/bin/$filename"
            done
            find "satellite/build/install/satellite/bin/" -type f -executable | while read -r file; do
              filename="$(basename "$file")"
              cp "satellite/build/install/satellite/bin/$filename" "${target.dir}/usr/share/linstor-server/bin/$filename"
            done
            mkdir -p "${target.dir}/usr/share/linstor-server/lib/conf"
        - name: create config
          runs: |
            set -eux -o pipefail

            DEF_DB="/var/lib/linstor/linstordb"
            DEF_DB_TYPE="h2"

            mkdir -p "${target.dir}/etc/linstor"
            "${target.dir}/usr/share/linstor-server/bin/linstor-config" create-db-file --dbtype=${DEF_DB_TYPE} ${DEF_DB} > "${target.dir}/etc/linstor/linstor.toml"
        - uses: dhi/build-pkg:0
          with:
            deb:
              depends:
                - libstdc++6
                - zlib1g
            depends:
              - bash
              - coreutils
              - findutils
              - python-3.13
              - sed
            description: Piraeus Server LINSTOR controller and satellite components
            files:
              - usr/bin/k8s-await-election
              - usr/bin/piraeus-entry.sh
              - usr/bin/linstor
              - usr/sbin/losetup-container
              - usr/lib/piraeus-server
              - usr/lib/python3.13/site-packages
              - usr/share/linstor-server
              - etc/linstor
              - opt/docker/sbom
            formats:
              - deb
            license: Apache-2.0
            name: piraeus-server
            rel: 0
            url: https://github.com/piraeusdatastore/piraeus
            version: 1.35.0
      paths:
        - type: file
          path: ${source.dir}/scripts/sed_bump.sh
          uid: 0
          gid: 0
          mode: "0755"
          source: package/main/piraeus-server/scripts/sed_bump.sh
        - type: file
          path: ${source.dir}/patch/dependency_bumps_build.gradle.json
          uid: 0
          gid: 0
          mode: "0644"
          source: package/main/piraeus-server/patch/dependency_bumps_build.gradle.json
        - type: file
          path: ${source.dir}/patch/dependency_bumps_gradle.lockfile.json
          uid: 0
          gid: 0
          mode: "0644"
          source: package/main/piraeus-server/patch/dependency_bumps_gradle.lockfile.json
os-release:
  name: Docker Hardened Images (Debian)
  id: debian
  version-id: "13"
  version-codename: trixie
  pretty-name: Docker Hardened Images/Debian GNU/Linux 13 (trixie)
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
