# syntax=dhi.io/build:2-debian13

image: dhi.io/pkg-flyway
variant: runtime
tags:
  - 12.11.0
  - 12.11.0-r2
  - 12.11.0-debian13
  - 12.11.0-r2-debian13
platforms:
  - linux/amd64
  - linux/arm64
vars:
  COMMIT_SHA: a3550bfd20b962fb44e6273cd86fff08ab8e92e7
  GITHUB_USERNAME: docker-hardened-images
  JDK_VERSION: 1:21.0.13+9-2
  LICENSE: Apache-2.0
  MAVEN_VERSION: 3.10.0-1
  PACKAGE_HOME: /usr/share/flyway
  PACKAGE_NAME: flyway-12
  REL: "2"
  SEMVER_MAJOR_MINOR_VERSION: "12.11"
  SEMVER_MAJOR_VERSION: "12"
  SEMVER_VERSION: 12.11.0
  VERSION: 12.11.0
contents:
  repositories:
    - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
  keyring:
    - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
  packages:
    - base-files
  builds:
    - name: flyway
      work-dir: ${source.dir}/src/flyway
      caches:
        - path: /root/.m2/repository
      contents:
        packages:
          - bash
          - ca-certificates
          - coreutils
          - gawk
          - eclipse-temurin-21-jdk=1:21.0.13+9-2
          - maven=3.10.0-1
          - findutils
          - gzip
          - hostname
          - sed
          - unzip
          - zip
          - yq
        files:
          - url: git+https://github.com/flyway/flyway.git#flyway-12.11.0
            checksum: a3550bfd20b962fb44e6273cd86fff08ab8e92e7
            path: ${source.dir}/src/flyway
            spdx:
              name: flyway
              version: 12.11.0
              packages:
                - name: flyway
                  purl: pkg:dhi/flyway@12.11.0
                  license: Apache-2.0
            uid: 0
            gid: 0
          - url: https://repo1.maven.org/maven2/org/postgresql/postgresql/42.7.12/postgresql-42.7.12.jar
            checksum: sha256:31fbf6f06b2217fb51d5100cee51b22625cc81640da0679b47914e54c1e6377c
            path: ${source.dir}/patch/deps/postgresql-42.7.12.jar
            spdx:
              name: postgresql
              version: 42.7.12
              packages:
                - name: postgresql
                  purl: pkg:maven/org.postgresql/postgresql@42.7.12
                  license: BSD-2-Clause
            uid: 0
            gid: 0
          - url: https://repo1.maven.org/maven2/software/amazon/awssdk/apache5-client/2.53.3/apache5-client-2.53.3.jar
            checksum: sha256:cd1f50f978ced5b28878c490e97ab3c39b2e401fed7828e66f660f23ebc44fa2
            path: ${source.dir}/patch/deps/apache5-client-2.53.3.jar
            spdx:
              name: apache5-client
              version: 2.53.3
              packages:
                - name: apache5-client
                  purl: pkg:maven/software.amazon.awssdk/apache5-client@2.53.3
                  license: Apache-2.0
            uid: 0
            gid: 0
          - url: https://repo1.maven.org/maven2/io/opentelemetry/opentelemetry-api/1.62.0/opentelemetry-api-1.62.0.jar
            checksum: sha256:d58143928c049233653e6bf1282ff8a767ebdd5e6a82b3f336158c30e40b431d
            path: ${source.dir}/patch/deps/opentelemetry-api-1.62.0.jar
            spdx:
              name: opentelemetry-api
              version: 1.62.0
              packages:
                - name: opentelemetry-api
                  purl: pkg:maven/io.opentelemetry/opentelemetry-api@1.62.0
                  license: Apache-2.0
            uid: 0
            gid: 0
      pipeline:
        - uses: mvn/mirror@v1
          environment:
            MAVEN_MIRROR_OF: external:*,!flyway-community-db-support
        - name: patch properties
          uses: mvn/patch@v1
          with:
            mvn-root: ${source.dir}/src/flyway
            properties: ${source.dir}/patch/mvn-properties.json
        - name: patch postgresql property
          uses: mvn/patch@v1
          with:
            mvn-root: ${source.dir}/src/flyway
            properties: ${source.dir}/patch/mvn-properties-postgresql.json
        - name: patch jackson properties
          uses: mvn/patch@v1
          with:
            mvn-root: ${source.dir}/src/flyway
            properties: ${source.dir}/patch/mvn-properties-jackson-12x.json
        - name: patch cassandra jdbc
          uses: mvn/patch@v1
          with:
            mvn-root: ${source.dir}/src/flyway
            properties: ${source.dir}/patch/mvn-properties-cassandra-12.json
        - name: patch
          uses: mvn/patch@v1
          with:
            dependencies: ${source.dir}/patch/mvn-dependencies.json
            mvn-root: ${source.dir}/src/flyway
        - name: patch postgresql dependency
          uses: mvn/patch@v1
          with:
            dependencies: ${source.dir}/patch/mvn-dependencies-postgresql.json
            mvn-root: ${source.dir}/src/flyway
        - name: patch
          uses: mvn/patch@v1
          with:
            dependencies: ${source.dir}/patch/mvn-dependencies-netty.json
            mvn-root: ${source.dir}/src/flyway
        - name: patch
          uses: mvn/patch@v1
          with:
            dependencies: ${source.dir}/patch/mvn-dependencies-jackson-12x.json
            downgrade: true
            mvn-root: ${source.dir}/src/flyway
        - name: exclude unmirrored aws http client
          runs: |
            set -eux -o pipefail

            pom="${source.dir}/src/flyway/flyway-commandline/pom.xml"
            xq-python -x 'walk(
              if type == "object" and .artifactId == "cassandra-jdbc-wrapper" then
                .exclusions.exclusion = (
                  ((.exclusions.exclusion // []) | if type == "array" then . else [.] end)
                  + [{"groupId": "software.amazon.awssdk", "artifactId": "apache5-client"}]
                )
              else
                .
              end
            )' "${pom}" > /tmp/flyway-commandline-pom.xml
            mv /tmp/flyway-commandline-pom.xml "${pom}"
        - name: test
          privileged: true
          secrets:
            - id: maven_user
              env: MAVEN_USER
              optional: true
            - id: maven_password
              env: MAVEN_PASSWORD
              optional: true
            - id: github_token
              env: GITHUB_TOKEN
          runs: |
            set -eux -o pipefail

            export MAVEN_VERSION="3.10.0-1"
            export JAVA_HOME=/usr/lib/jvm/temurin-21

            cd "${source.dir}/src/flyway"

            combined="${source.dir}/maven-settings.xml"
            if [ -f /root/.m2/settings.xml ]; then
              cp /root/.m2/settings.xml "${combined}"
            else
              cat > "${combined}" << 'EOF'
            <settings>
              <servers>
              </servers>
            </settings>
            EOF
            fi
            export COMBINED_SETTINGS="${combined}"
            if [ -n "${MAVEN_USER:-}" ] && [ -n "${MAVEN_PASSWORD:-}" ]; then
              python3 - << 'PY'
            import os

            path = os.environ["COMBINED_SETTINGS"]
            maven_user = os.environ["MAVEN_USER"]
            maven_password = os.environ["MAVEN_PASSWORD"]
            with open(path, encoding="utf-8") as fh:
                text = fh.read()
            text = text.replace("${env.MAVEN_USER}", maven_user)
            text = text.replace("${env.MAVEN_PASSWORD}", maven_password)
            with open(path, "w", encoding="utf-8") as fh:
                fh.write(text)
            PY
            fi

            cat > "${source.dir}/gpr-settings.xml" << EOF
            <settings>
              <servers>
                <server>
                  <id>flyway-community-db-support</id>
                  <username>docker-hardened-images</username>
                  <password>${GITHUB_TOKEN}</password>
                </server>
              </servers>
            </settings>
            EOF

            mvn test \
              -pl flyway-core \
              -am \
              --settings "${combined}" \
              --global-settings "${source.dir}/gpr-settings.xml"
            rm "${source.dir}/gpr-settings.xml"
        - name: install
          privileged: true
          secrets:
            - id: maven_user
              env: MAVEN_USER
              optional: true
            - id: maven_password
              env: MAVEN_PASSWORD
              optional: true
            - id: github_token
              env: GITHUB_TOKEN
          runs: |
            set -eux -o pipefail

            export MAVEN_VERSION="3.10.0-1"
            export JAVA_HOME=/usr/lib/jvm/temurin-21

            pkg_root="${target.dir}/usr/share/flyway"
            mkdir -p "${pkg_root}/lib/flyway"
            cd "${source.dir}/src/flyway"

            cat > "${source.dir}/gpr-settings.xml" << EOF
            <settings>
              <servers>
                <server>
                  <id>flyway-community-db-support</id>
                  <username>docker-hardened-images</username>
                  <password>${GITHUB_TOKEN}</password>
                </server>
              </servers>
            </settings>
            EOF

            mvn clean install \
              -DskipTests \
              -pl flyway-commandline,flyway-core \
              -am \
              --global-settings "${source.dir}/gpr-settings.xml"

            cp \
              "flyway-commandline/target/flyway-commandline-12.11.0.jar" \
              "${pkg_root}/lib/flyway/flyway-commandline-12.11.0.jar"

            mvn dependency:copy-dependencies \
              -pl flyway-commandline \
              -DoutputDirectory="${pkg_root}/lib" \
              --global-settings "${source.dir}/gpr-settings.xml"
            rm "${source.dir}/gpr-settings.xml"

            lib="${pkg_root}/lib"
            for jar in \
              "${lib}"/jackson-databind-*.jar \
              "${lib}"/jackson-core-*.jar \
              "${lib}"/jackson-annotations-*.jar; do
              [ -e "${jar}" ] || continue
              case "$(basename "${jar}")" in
                jackson-annotations-2.21.jar | jackson-annotations-2.22.jar) continue ;;
                jackson-databind-2.21.7.jar | jackson-core-2.21.7.jar | *-2.22.3.jar | *-3.1.7.jar) continue ;;
                *) rm -f "${jar}" ;;
              esac
            done

            for artifact in \
              com.fasterxml.jackson.core:jackson-databind:2.21.7 \
              com.fasterxml.jackson.core:jackson-core:2.21.7 \
              com.fasterxml.jackson.core:jackson-annotations:2.21 \
              tools.jackson.core:jackson-databind:3.1.7 \
              tools.jackson.core:jackson-core:3.1.7 \
              tools.jackson.dataformat:jackson-dataformat-toml:3.1.7; do
              mvn dependency:copy \
                -Dartifact="${artifact}" \
                -DoutputDirectory="${lib}" \
                -q
            done

            if [ "12" = "12" ] || [ "12" = "13" ]; then
              for artifact in \
                com.fasterxml.jackson.core:jackson-databind:2.22.3 \
                com.fasterxml.jackson.core:jackson-core:2.22.3 \
                com.fasterxml.jackson.core:jackson-annotations:2.22; do
                mvn dependency:copy \
                  -Dartifact="${artifact}" \
                  -DoutputDirectory="${lib}" \
                  -q
              done
              install -m 0644 \
                "${source.dir}/patch/deps/apache5-client-2.53.3.jar" \
                "${lib}/apache5-client-2.53.3.jar"
            fi

            for jar in \
              "${lib}"/httpcore5-*.jar \
              "${lib}"/httpcore5-h2-*.jar; do
              [ -e "${jar}" ] || continue
              case "$(basename "${jar}")" in
                httpcore5-5.4.3.jar | httpcore5-h2-5.4.3.jar) continue ;;
                *) rm -f "${jar}" ;;
              esac
            done

            for artifact in \
              org.apache.httpcomponents.core5:httpcore5:5.4.3 \
              org.apache.httpcomponents.core5:httpcore5-h2:5.4.3; do
              mvn dependency:copy \
                -Dartifact="${artifact}" \
                -DoutputDirectory="${lib}" \
                -q
            done

            for jar in \
              "${lib}"/httpclient5-*.jar; do
              [ -e "${jar}" ] || continue
              case "$(basename "${jar}")" in
                httpclient5-5.6.3.jar) continue ;;
                *) rm -f "${jar}" ;;
              esac
            done

            for artifact in \
              org.apache.httpcomponents.client5:httpclient5:5.6.3; do
              mvn dependency:copy \
                -Dartifact="${artifact}" \
                -DoutputDirectory="${lib}" \
                -q
            done

            if [ "12" = "11" ] || [ "12" = "12" ]; then
              if [ -e "${pkg_root}/lib/postgresql-42.7.2.jar" ]; then
                rm "${pkg_root}/lib/postgresql-42.7.2.jar"
              fi
              install -m 0644 "${source.dir}/patch/deps/postgresql-42.7.12.jar" "${pkg_root}/lib/postgresql-42.7.12.jar"
            fi

            if [ "12" = "11" ]; then

              rm -f "${pkg_root}/lib/opentelemetry-api-1.52.0.jar"
              install -m 0644 "${source.dir}/patch/deps/opentelemetry-api-1.62.0.jar" "${pkg_root}/lib/opentelemetry-api-1.62.0.jar"

              netty_version="4.2.17.Final"

              for arch in x86_64 aarch_64; do
                stale_epoll=$(find "${lib}" \
                  -maxdepth 1 \
                  -name "netty-transport-native-epoll-*-linux-${arch}.jar" \
                  ! -name "netty-transport-native-epoll-${netty_version}-linux-${arch}.jar" \
                  -print)
                if [ -n "${stale_epoll}" ]; then
                  find "${lib}" \
                    -maxdepth 1 \
                    -name "netty-transport-native-epoll-*-linux-${arch}.jar" \
                    ! -name "netty-transport-native-epoll-${netty_version}-linux-${arch}.jar" \
                    -delete
                  install -m 0644 \
                    "${source.dir}/patch/deps/netty-transport-native-epoll-${netty_version}-linux-${arch}.jar" \
                    "${lib}/netty-transport-native-epoll-${netty_version}-linux-${arch}.jar"
                fi
              done

              for arch in x86_64 aarch_64; do
                find "${lib}" \
                  -maxdepth 1 \
                  -name "netty-transport-native-kqueue-*-osx-${arch}.jar" \
                  ! -name "netty-transport-native-kqueue-${netty_version}-osx-${arch}.jar" \
                  -delete
                install -m 0644 \
                  "${source.dir}/patch/deps/netty-transport-native-kqueue-${netty_version}-osx-${arch}.jar" \
                  "${lib}/netty-transport-native-kqueue-${netty_version}-osx-${arch}.jar"
              done
            fi

            for jar in \
              "${lib}"/mariadb-java-client-*.jar; do
              [ -e "${jar}" ] || continue
              case "$(basename "${jar}")" in
                mariadb-java-client-2.7.14.jar) continue ;;
                *) rm -f "${jar}" ;;
              esac
            done

            mvn dependency:copy \
              -Dartifact=org.mariadb.jdbc:mariadb-java-client:2.7.14 \
              -DoutputDirectory="${lib}" \
              -q

            for jar in \
              "${lib}"/lz4-java-*.jar; do
              [ -e "${jar}" ] || continue
              case "$(basename "${jar}")" in
                lz4-java-1.11.4.jar) continue ;;
                *) rm -f "${jar}" ;;
              esac
            done

            mvn dependency:copy \
              -Dartifact=at.yawk.lz4:lz4-java:1.11.4 \
              -DoutputDirectory="${lib}" \
              -q

            for jar in \
              "${lib}"/snowflake-jdbc-*.jar; do
              [ -e "${jar}" ] || continue
              case "$(basename "${jar}")" in
                snowflake-jdbc-4.3.4.jar) continue ;;
                *) rm -f "${jar}" ;;
              esac
            done

            mvn dependency:copy \
              -Dartifact=net.snowflake:snowflake-jdbc:4.3.4 \
              -DoutputDirectory="${lib}" \
              -q

            core_io_jar=$(find "${pkg_root}/lib" -name 'core-io-*.jar' | head -1)
            if [ -n "${core_io_jar}" ]; then
              echo "Stripping embedded netty classes from ${core_io_jar}..."
              netty_entries=$(mktemp)
              unzip -Z1 "${core_io_jar}" | awk '/^(io\/netty\/|META-INF\/maven\/io.netty\/|META-INF\/native-image\/io.netty\/)/ {print}' > "${netty_entries}"
              if [ -s "${netty_entries}" ]; then
                zip -qd "${core_io_jar}" -@ < "${netty_entries}"
              fi
              rm -f "${netty_entries}"
            fi

            cat > "${pkg_root}/flyway" << EOF
            #!/bin/sh
            exec java -cp "/usr/share/flyway/lib/flyway/*:/usr/share/flyway/lib/*" org.flywaydb.commandline.Main "\$@"
            EOF
            chmod +x "${pkg_root}/flyway"

            mkdir -p "${target.dir}/usr/bin"
            ln -sf ../share/flyway/flyway "${target.dir}/usr/bin/flyway"
        - uses: dhi/build-pkg:0
          with:
            depends:
              - bash
              - coreutils
              - eclipse-temurin-21-jre
            description: Database migration tool
            files:
              - usr
            formats:
              - deb
            license: Apache-2.0
            name: flyway-12
            rel: 2
            url: https://github.com/flyway/flyway
            version: 12.11.0
      paths:
        - type: directory
          path: ${source.dir}/patch
          uid: 0
          gid: 0
          source: package/main/flyway/patch
os-release:
  name: Docker Hardened Images (Debian)
  id: debian
  version-id: "13"
  version-codename: trixie
  pretty-name: Docker Hardened Images/Debian GNU/Linux 13 (trixie)
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
