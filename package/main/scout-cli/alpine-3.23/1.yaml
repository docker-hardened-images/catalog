# syntax=dhi.io/build:2-alpine3.23

image: dhi.io/pkg-scout-cli
variant: runtime
tags:
  - 1.23.1-alpine3.23
  - 1.23.1-r8-alpine3.23
platforms:
  - linux/amd64
  - linux/arm64
vars:
  COMMIT_SHA: 1f5f7a51d7dbbd427feccfa2e133aa51ec702c22
  DHI_TEST_APK_PACKAGES: scout-cli_
  GOLANG_VERSION: 1.26.8-r0
  PACKAGE_NAME: scout-cli
  REL: "8"
  SEMVER_MAJOR_MINOR_VERSION: "1.23"
  SEMVER_MAJOR_VERSION: "1"
  SEMVER_VERSION: 1.23.1
  VERSION: 1.23.1
contents:
  repositories:
    - https://dhi.io/apk/alpine/v3.23/main
    - https://dl-cdn.alpinelinux.org/alpine/v3.23/main
    - https://dl-cdn.alpinelinux.org/alpine/v3.23/community
  keyring:
    - https://dhi.io/keyring/dhi-apk@docker-0F81AD7700D99184.rsa.pub
  packages:
    - alpine-baselayout-data
  builds:
    - name: scout-cli
      work-dir: /go/src/github.com/docker/scout-cli-plugin
      contents:
        packages:
          - busybox
          - bash
          - ca-certificates-bundle
          - golang-1.26=1.26.8-r0
          - golang-1.26-oci-config=1.26.8-r0
        files:
          - url: git+https://github.com/docker/scout-cli-plugin.git#v1.23.1
            checksum: 1f5f7a51d7dbbd427feccfa2e133aa51ec702c22
            path: /go/src/github.com/docker/scout-cli-plugin
            uid: 0
            gid: 0
      pipeline:
        - name: update go dependencies
          uses: go/bump@v1
          with:
            deps:
              - github.com/aquasecurity/trivy@v0.72.0
              - github.com/moby/buildkit@v0.31.1
              - github.com/cloudflare/circl@v1.6.3
              - github.com/containerd/containerd/v2@v2.3.2
              - github.com/go-git/go-git/v5@v5.19.2
              - github.com/hashicorp/go-getter@v1.8.6
              - github.com/in-toto/in-toto-golang@v0.11.0
              - github.com/sigstore/sigstore/pkg/signature/kms/aws@v1.10.9
              - github.com/sigstore/sigstore/pkg/signature/kms/azure@v1.10.9
              - github.com/sigstore/sigstore/pkg/signature/kms/gcp@v1.10.9
              - github.com/sigstore/sigstore/pkg/signature/kms/hashivault@v1.10.9
              - github.com/sigstore/fulcio@v1.8.6
              - github.com/sigstore/rekor@v1.5.2
              - github.com/sigstore/timestamp-authority/v2@v2.1.2
              - github.com/sigstore/sigstore-go@v1.2.1
              - github.com/yuin/goldmark@v1.7.17
              - oras.land/oras-go/v2@v2.6.2
              - helm.sh/helm/v3@v3.20.2
              - golang.org/x/crypto@v0.56.0
            replaces:
              - github.com/sigstore/sigstore=github.com/sigstore/sigstore@v1.10.9
              - github.com/docker/cli=github.com/docker/cli@v29.5.2+incompatible
            tidy: true
        - uses: go/hermetic@v1
        - name: patch trivy applier api
          runs: |
            set -eux -o pipefail

            sed -i 's/a\.ApplyLayers(/a.ApplyLayers(context.Background(), /' internal/sbom/trivy/trivy.go
            grep -q '"context"' internal/sbom/trivy/trivy.go || sed -i '/^import (/a\    "context"' internal/sbom/trivy/trivy.go
            sed -i 's/xhttp\.SetDefaultTransport(desktop\.ProxyTransport())/xhttp.SetDefaultTransport(desktopTransport{})/' internal/sbom/trivy/trivy.go
            if ! grep -q 'type desktopTransport struct' internal/sbom/trivy/trivy.go; then
              awk '/^func initializeCache\(\)/ && !done { print "type desktopTransport struct{}\n"; print "func (desktopTransport) Build(opts ...xhttp.TransportOption) http.RoundTripper {\n\treturn desktop.ProxyTransport()\n}\n"; done=1 } { print }' internal/sbom/trivy/trivy.go > internal/sbom/trivy/trivy.go.tmp
              mv internal/sbom/trivy/trivy.go.tmp internal/sbom/trivy/trivy.go
            fi
            grep -q '"net/http"' internal/sbom/trivy/trivy.go || sed -i '/^import (/a\    "net/http"' internal/sbom/trivy/trivy.go
            gofmt -w internal/sbom/trivy/trivy.go
        - name: build
          uses: go/build@v1
          with:
            experiments: jsonv2
            fips: false
            ldflags:
              - -X github.com/docker/scout-cli-plugin/internal/version.version=1.23.1
              - -X github.com/docker/scout-cli-plugin/internal/version.commit=1f5f7a51d7dbbd427feccfa2e133aa51ec702c22
            output: ${target.dir}/usr/bin/docker-scout
            packages: ./cmd/docker-scout
        - name: build dev
          uses: go/build@v1
          with:
            experiments: jsonv2
            fips: false
            ldflags:
              - -X github.com/docker/scout-cli-plugin/internal/version.version=1.23.1
              - -X github.com/docker/scout-cli-plugin/internal/version.commit=1f5f7a51d7dbbd427feccfa2e133aa51ec702c22
            output: ${target.dir}/usr/bin/docker-scout-dev
            packages: ./cmd/docker-scout
            strip: false
        - name: create docker cli symlink
          runs: |
            set -eux -o pipefail

            mkdir -p "${target.dir}/usr/local/libexec/docker/cli-plugins"
            ln -s /usr/bin/docker-scout "${target.dir}/usr/local/libexec/docker/cli-plugins/docker-scout"
        - uses: dhi/build-pkg:0
          with:
            description: Docker Scout CLI
            files:
              - usr/bin/docker-scout
            license: Apache-2.0
            name: scout-cli
            rel: 8
            subpackages:
              - files:
                  - path: usr/bin/docker-scout
                    source: usr/bin/docker-scout-dev
                name: scout-cli-dev
              - depends:
                  - scout-cli
                description: Docker CLI plugin for scout-cli
                files:
                  - path: usr/local/libexec/docker/cli-plugins/docker-scout
                    source: usr/local/libexec/docker/cli-plugins/docker-scout
                name: docker-cli-scout-cli
            url: https://github.com/docker/scout-cli-plugin
            version: 1.23.1
os-release:
  name: Docker Hardened Images (Alpine)
  id: alpine
  version-id: "3.23"
  pretty-name: Docker Hardened Images/Alpine Linux v3.23
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
