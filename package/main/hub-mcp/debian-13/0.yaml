  SEMVER_MAJOR_VERSION: "0"
  SEMVER_VERSION: 0.18.0
  VERSION: 0.18.0
contents:
  packages:
    - base-files
  builds:
    - name: hub-mcp
      work-dir: ${source.dir}/hub-mcp-98cf1b9cbec64316ea2b465462468a2d2204a406
      caches:
        - path: /root/.npm
      contents:
        repositories:
          - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
        keyring:
          - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
        packages:
          - bash
          - ca-certificates
          - coreutils
          - findutils
          - git
          - gzip
          - libc6
          - libstdc++6
          - mawk
          - nodejs-24
          - node-corepack
          - npm
          - sed
          - tar
        files:
          - url: git+https://github.com/docker/hub-mcp.git#dockerhub-mcp/v0.18.0
            checksum: 98cf1b9cbec64316ea2b465462468a2d2204a406
            path: ${source.dir}/hub-mcp-98cf1b9cbec64316ea2b465462468a2d2204a406
            spdx:
              name: hub-mcp
              version: 0.18.0
              packages:
                - name: hub-mcp
                  purl: pkg:dhi/hub-mcp@0.18.0
                  license: Apache-2.0
            uid: 0
            gid: 0
          - url: https://registry.npmjs.org/minimatch/-/minimatch-10.2.3.tgz
            path: ${source.dir}/minimatch-10.2.3.tgz
            uid: 0
            gid: 0
      pipeline:
        - name: bump
          uses: npm/bump@v1
          privileged: true
          environment:
            DHI_NO_SFW: "true"
          with:
            bumps: ${source.dir}/patch/npm-bumps.json
            npm-root: ${source.dir}/hub-mcp-98cf1b9cbec64316ea2b465462468a2d2204a406
        - name: install and build
          work-dir: ${source.dir}/hub-mcp-98cf1b9cbec64316ea2b465462468a2d2204a406
          privileged: true
          runs: |
            set -eux -o pipefail

            npm install --package-lock-only
            npm ci
            npm run build

            rm -rf node_modules
            npm ci --omit=dev --ignore-scripts
        - name: patch nested minimatch packages
          work-dir: ${source.dir}/hub-mcp-98cf1b9cbec64316ea2b465462468a2d2204a406
          runs: |
            set -eux -o pipefail

            mkdir -p /tmp/minimatch-fix
            tar -xzf ${source.dir}/minimatch-10.2.3.tgz -C /tmp/minimatch-fix

            find node_modules -type d -name "minimatch" -exec test -f {}/package.json \; -print0 | while IFS= read -r -d '' minimatch_dir; do
              echo "Replacing ${minimatch_dir}"
              rm -rf "${minimatch_dir}"
              cp -r /tmp/minimatch-fix/package "${minimatch_dir}"
            done

            rm -rf /tmp/minimatch-fix
        - name: stage payload
          work-dir: ${source.dir}/hub-mcp-98cf1b9cbec64316ea2b465462468a2d2204a406
          runs: |
            set -eux -o pipefail

            mkdir -p "${target.dir}/usr/lib/hub-mcp"
            cp -a dist node_modules "${target.dir}/usr/lib/hub-mcp/"
        - uses: dhi/build-pkg:0
          with:
            description: Docker Hub MCP server (Model Context Protocol server for Docker Hub)
            files:
              - usr/lib/hub-mcp
            formats:
              - deb
            license: Apache-2.0
            name: hub-mcp
            rel: 0
            url: https://github.com/docker/hub-mcp
            version: 0.18.0
      paths:
        - type: file
          path: ${source.dir}/patch/npm-bumps.json
          uid: 0
          gid: 0
          source: package/main/hub-mcp/patch/npm-bumps.json
