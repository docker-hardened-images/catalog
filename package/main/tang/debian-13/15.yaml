# syntax=dhi.io/build:2-debian13

image: dhi.io/pkg-tang
variant: runtime
tags:
  - "15"
  - 15-r1
  - 15-debian13
  - 15-r1-debian13
platforms:
  - linux/amd64
  - linux/arm64
dates:
  release: "2024-02-14"
vars:
  COMMIT_SHA: 02105756ee2a3afbd7065a47664d202788c9b584
  JANSSON_VERSION: 2.14-2+deb13u0+dhi1
  JOSE_COMMIT_SHA: 6ef9a79821a4252efd12490d34607e3db9d0615a
  JOSE_VERSION: "15"
  LLHTTP_COMMIT_SHA: 0e815792b167a9bd8ace259b95b7da953776c288
  LLHTTP_VERSION: 9.4.3
  OPENSSL_VERSION: 3.5.7-1~deb13u3+dhi0
  PACKAGE_NAME: tang-15
  REL: "1"
  SEMVER_MAJOR_MINOR_VERSION: "15"
  SEMVER_MAJOR_VERSION: "15"
  SEMVER_VERSION: "15"
  VERSION: "15"
contents:
  repositories:
    - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
  keyring:
    - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
  packages:
    - base-files
  builds:
    - name: tang
      work-dir: ${source.dir}/tang
      contents:
        packages:
          - bash
          - binutils
          - build-essential
          - cmake
          - coreutils
          - grep
          - libjansson-dev
          - libssl-dev
          - meson
          - ninja-build
          - patch
          - pkg-config
          - zlib1g-dev
        files:
          - url: git+https://github.com/latchset/tang.git#v15
            checksum: 02105756ee2a3afbd7065a47664d202788c9b584
            path: ${source.dir}/tang
            spdx:
              name: tang
              version: "15"
              packages:
                - name: tang
                  purl: pkg:github/latchset/tang@15
                  license: GPL-3.0-or-later
            uid: 0
            gid: 0
          - url: git+https://github.com/latchset/jose.git#v15
            checksum: 6ef9a79821a4252efd12490d34607e3db9d0615a
            path: ${source.dir}/jose
            spdx:
              name: jose
              version: "15"
              packages:
                - name: jose
                  purl: pkg:github/latchset/jose@15
                  license: Apache-2.0
            uid: 0
            gid: 0
          - url: git+https://github.com/nodejs/llhttp.git#release/v9.4.3
            checksum: 0e815792b167a9bd8ace259b95b7da953776c288
            path: ${source.dir}/llhttp
            spdx:
              name: llhttp
              version: 9.4.3
              packages:
                - name: llhttp
                  purl: pkg:github/nodejs/llhttp@9.4.3
                  license: MIT
            uid: 0
            gid: 0
      pipeline:
        - name: Apply listen_port leak fix
          uses: patch@v1
          work-dir: ${source.dir}/tang
          with:
            options: -p1
            patches:
              - ${source.dir}/patch/listen-port-leak.patch
        - name: Build and install
          runs: |
            set -eux -o pipefail

            export PKG_CONFIG_PATH=/usr/lib/pkgconfig

            cmake -S "${source.dir}/llhttp" -B /tmp/llhttp-build \
              -DCMAKE_BUILD_TYPE=Release \
              -DCMAKE_INSTALL_PREFIX=/usr \
              -DCMAKE_INSTALL_LIBDIR=lib \
              -DLLHTTP_BUILD_SHARED_LIBS=OFF \
              -DLLHTTP_BUILD_STATIC_LIBS=ON
            cmake --build /tmp/llhttp-build
            cmake --install /tmp/llhttp-build

            meson setup /tmp/jose-build "${source.dir}/jose" \
              --prefix=/usr \
              --libdir=lib \
              --buildtype=release \
              -Ddocs=disabled
            meson compile -C /tmp/jose-build
            meson install -C /tmp/jose-build --destdir "${target.dir}"
            meson install -C /tmp/jose-build

            meson setup /tmp/tang-build "${source.dir}/tang" \
              --prefix=/usr \
              --libdir=lib \
              --buildtype=release
            meson compile -C /tmp/tang-build
            meson install -C /tmp/tang-build --destdir "${target.dir}"

            install -d "${target.dir}/usr/share/licenses/llhttp"
            install -m644 \
              "${source.dir}/llhttp/LICENSE" \
              "${source.dir}/llhttp/LICENSE-MIT" \
              "${target.dir}/usr/share/licenses/llhttp/"

            test -f "${target.dir}/usr/share/licenses/tang/COPYING"
            test -f "${target.dir}/usr/share/licenses/jose/COPYING"
            test -f "${target.dir}/usr/share/licenses/llhttp/LICENSE-MIT"
            test -x "${target.dir}/usr/libexec/tangd"
            test -x "${target.dir}/usr/libexec/tangd-keygen"
            test -x "${target.dir}/usr/libexec/tangd-rotate-keys"
            test -x "${target.dir}/usr/bin/jose"
            test -x "${target.dir}/usr/bin/tang-show-keys"
            test -e "${target.dir}/usr/lib/libjose.so.0"
            test -e "${target.dir}/usr/lib/libjose.so.0.0.0"
            nm "${target.dir}/usr/libexec/tangd" > /tmp/tangd.nm
            grep -q llhttp_ /tmp/tangd.nm
            readelf -d "${target.dir}/usr/libexec/tangd" > /tmp/tangd.dyn
            if grep -E 'NEEDED.*lib(llhttp|http_parser)' /tmp/tangd.dyn; then
              echo "tangd should link llhttp statically" >&2
              exit 1
            fi
            echo "tangd NEEDED:"
            grep NEEDED /tmp/tangd.dyn
            echo "libjose NEEDED:"
            readelf -d "${target.dir}/usr/lib/libjose.so.0.0.0" > /tmp/jose.dyn
            grep NEEDED /tmp/jose.dyn
        - uses: dhi/build-pkg:0
          with:
            depends:
              - coreutils
              - curl
              - dash
              - libc6
              - libjansson4
              - libssl3t64
              - zlib1g
            description: Network presence binding server
            files:
              - usr/libexec/tangd
              - usr/libexec/tangd-keygen
              - usr/libexec/tangd-rotate-keys
              - usr/bin/jose
              - usr/bin/tang-show-keys
              - usr/lib/libjose.so.0
              - usr/lib/libjose.so.0.0.0
              - usr/share/licenses/tang/COPYING
              - usr/share/licenses/jose/COPYING
              - usr/share/licenses/llhttp/LICENSE
              - usr/share/licenses/llhttp/LICENSE-MIT
            formats:
              - deb
            license: GPL-3.0-or-later
            name: tang-15
            rel: 1
            url: https://github.com/latchset/tang
            version: 15
      paths:
        - type: directory
          path: ${source.dir}/patch
          uid: 0
          gid: 0
          source: package/main/tang/patch
os-release:
  name: Docker Hardened Images (Debian)
  id: debian
  version-id: "13"
  version-codename: trixie
  pretty-name: Docker Hardened Images/Debian GNU/Linux 13 (trixie)
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
