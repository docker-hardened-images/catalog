# syntax=dhi.io/build:2-debian13

image: dhi.io/pkg-envoy
variant: runtime
tags:
  - 1.38.9
  - 1.38.9-r3
  - 1.38.9-debian13
  - 1.38.9-r3-debian13
platforms:
  - linux/amd64
  - linux/arm64
dates:
  release: "2026-04-23"
  end-of-life: "2027-01-13"
vars:
  BAZEL_ARCH: '#{ target.arch == "amd64" ? "x86_64" : "arm64" }'
  BAZEL_VERSION: 7.7.1
  BUILD_ENTITLEMENT: ""
  CLANG_VERSION: "18"
  COMMIT_SHA: 17e27840396c1fa3196f184fcb5db1ab13850504
  GOLANG_VERSION: 1.26.11-18
  PACKAGE_NAME: envoy-1.38
  PYTHON_VERSION: 3.13.18-10
  REL: "3"
  SEMVER_MAJOR_MINOR_VERSION: "1.38"
  SEMVER_MAJOR_VERSION: "1"
  SEMVER_VERSION: 1.38.9
  VERSION: 1.38.9
contents:
  repositories:
    - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
  keyring:
    - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
  packages:
    - base-files
  builds:
    - name: envoy-1.38
      work-dir: ${source.dir}/envoy
      shell: /bin/bash
      caches:
        - path: /bazel-disk-cache
        - path: /bazel-repo-cache
      contents:
        packages:
          - autoconf
          - automake
          - bash
          - build-essential
          - ca-certificates
          - clang-18
          - cmake
          - coreutils
          - curl
          - findutils
          - git
          - golang-1.26=1.26.11-18
          - grep
          - gzip
          - libc++-18-dev
          - libc++abi-18-dev
          - libclang-18-dev
          - lld-18
          - llvm-18-dev
          - libtool
          - mawk
          - ninja-build
          - patch
          - patchelf
          - pkg-config
          - python-3.13=3.13.18-10
          - python-3.13-minimal=3.13.18-10
          - libpython-3.13=3.13.18-10
          - libpython-3.13-minimal=3.13.18-10
          - libpython-3.13-stdlib=3.13.18-10
          - python3-pip-whl
          - python3-setuptools-whl
          - libbz2-1.0
          - libcrypt1
          - libdb5.3t64
          - libexpat1
          - libffi8
          - libgdbm-compat4t64
          - libgdbm6
          - liblzma5
          - libncursesw6
          - libreadline8t64
          - libsqlite3-0
          - libssl3t64
          - libtinfo6
          - libuuid1
          - libzstd1
          - zlib1g
          - sed
          - unzip
          - zip
        files:
          - url: git+https://github.com/envoyproxy/envoy.git#v1.38.9
            checksum: 17e27840396c1fa3196f184fcb5db1ab13850504
            path: ${source.dir}/envoy
            spdx:
              name: envoy
              version: 1.38.9
              packages:
                - name: envoy
                  purl: pkg:dhi/envoy@1.38.9
                  license: Apache-2.0
            uid: 0
            gid: 0
          - url: https://github.com/bazelbuild/bazel/releases/download/7.7.1/bazel-7.7.1-linux-${BAZEL_ARCH}
            checksum: https://github.com/bazelbuild/bazel/releases/download/7.7.1/bazel-7.7.1-linux-${BAZEL_ARCH}.sha256
            path: /opt/bazel/bin/bazel
            uid: 0
            gid: 0
            mode: "0755"
      pipeline:
        - name: test sbom generator
          runs: |
            set -eux -o pipefail

            python3 -m unittest discover -s "${source.dir}/tests" -p 'test_*.py'
        - name: build
          privileged: true
          runs: |
            set -eux -o pipefail

            export CC="clang-18" CXX="clang++-18"

            BAZEL_BUILD_OPTS=(
              -c opt
              --curses=no
              --verbose_failures
              --sandbox_debug
              --jobs=auto
              --experimental_ui_max_stdouterr_bytes=11712829
              --disk_cache=/bazel-disk-cache
              --repository_cache=/bazel-repo-cache
              --experimental_disk_cache_gc_max_size=5G
              --experimental_disk_cache_gc_max_age=30d
            )

            if grep -q "clang-local" .bazelrc; then
              BAZEL_BUILD_OPTS+=(
                --config=clang-local
                --repo_env=BAZEL_LLVM_PATH=/usr/lib/llvm-18
                --repo_env=BAZEL_USE_HOST_SYSROOT=True
              )
            fi

            if [ "${target.fips}" = "true" ]; then
              if grep -q "boringssl-fips" .bazelrc; then
                BAZEL_BUILD_OPTS+=(--config=boringssl-fips)
              else
                BAZEL_BUILD_OPTS+=(--define=boringssl=fips)
              fi
            fi

            test "${target.arch}" = "arm64" && BAZEL_BUILD_OPTS+=(--cpu=aarch64)

            /opt/bazel/bin/bazel --batch build "${BAZEL_BUILD_OPTS[@]}" \
              //source/exe:envoy-static.stripped

            install -D -m0755 bazel-bin/source/exe/envoy-static.stripped \
              "${target.dir}/usr/bin/envoy"

            mkdir -p /opt/docker/sbom/envoy-dependencies
            ENVOY_SBOM_BINARY="${target.dir}/usr/bin/envoy" \
              python3 "${source.dir}/bin/envoy-bazel-to-spdx.py" envoy-dependencies "1.38.9" \
              "${BAZEL_BUILD_OPTS[@]}" \
              > /opt/docker/sbom/envoy-dependencies/.spdx.envoy-dependencies.json
        - name: stage sbom
          runs: |
            set -eux -o pipefail

            install -d "${target.dir}/opt/docker/sbom"
            cp -a /opt/docker/sbom/. "${target.dir}/opt/docker/sbom/"
            test -s "${target.dir}/opt/docker/sbom/envoy-dependencies/.spdx.envoy-dependencies.json"
        - uses: dhi/build-pkg:0
          with:
            depends:
              - libc6
            description: Envoy edge and service proxy
            files:
              - usr/bin/envoy
              - opt/docker/sbom
            formats:
              - deb
            license: Apache-2.0
            name: envoy-1.38
            rel: 3
            url: https://www.envoyproxy.io/
            version: 1.38.9
      paths:
        - type: file
          path: ${source.dir}/bin/envoy-bazel-to-spdx.py
          uid: 0
          gid: 0
          source: package/main/envoy/bin/envoy-bazel-to-spdx.py
        - type: file
          path: ${source.dir}/tests/test_envoy_bazel_to_spdx.py
          uid: 0
          gid: 0
          source: package/main/envoy/tests/test_envoy_bazel_to_spdx.py
os-release:
  name: Docker Hardened Images (Debian)
  id: debian
  version-id: "13"
  version-codename: trixie
  pretty-name: Docker Hardened Images/Debian GNU/Linux 13 (trixie)
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
