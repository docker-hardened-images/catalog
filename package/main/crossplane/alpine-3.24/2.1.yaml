# syntax=dhi.io/build:2-alpine3.24

image: dhi.io/pkg-crossplane
variant: runtime
tags:
  - 2.1.8-alpine3.24
  - 2.1.8-r2-alpine3.24
platforms:
  - linux/amd64
  - linux/arm64
dates:
  release: "2025-11-05"
vars:
  COMMIT_SHA: cb47d74e798f470214c51592d553527fa70e02a3
  CROSSPLANE_MODULE_BASE: github.com/crossplane/crossplane/v2
  CROSSPLANE_VERSION_LDFLAG: github.com/crossplane/crossplane/v2/internal/version.version
  GOLANG_VERSION: 1.26.8-r0
  PACKAGE_NAME: crossplane-2.1
  REL: "2"
  SEMVER_MAJOR_MINOR_VERSION: "2.1"
  SEMVER_MAJOR_VERSION: "2"
  SEMVER_VERSION: 2.1.8
  VERSION: 2.1.8
contents:
  repositories:
    - https://dhi.io/apk/alpine/v3.24/main
    - https://dhi.io/apk/alpine/v3.23/main
    - https://dl-cdn.alpinelinux.org/alpine/v3.24/main
    - https://dl-cdn.alpinelinux.org/alpine/v3.24/community
  keyring:
    - https://dhi.io/keyring/dhi-apk@docker-0F81AD7700D99184.rsa.pub
  packages:
    - alpine-baselayout-data
  builds:
    - name: crossplane-2.1
      work-dir: /go/src/github.com/crossplane/crossplane
      caches:
        - path: /go/pkg/mod
      contents:
        packages:
          - busybox
          - bash
          - ca-certificates-bundle
          - coreutils
          - findutils
          - mawk
          - sed
          - golang-1.26=1.26.8-r0
          - golang-1.26-oci-config=1.26.8-r0
        files:
          - url: git+https://github.com/crossplane/crossplane.git#v2.1.8
            checksum: cb47d74e798f470214c51592d553527fa70e02a3
            path: /go/src/github.com/crossplane/crossplane
            spdx:
              name: crossplane
              version: 2.1.8
              packages:
                - name: crossplane
                  purl: pkg:golang/github.com/crossplane/crossplane/v2@2.1.8
                  license: Apache-2.0
            uid: 0
            gid: 0
      pipeline:
        - name: update go dependencies (2.1 only)
          uses: go/bump@v1
          with:
            deps:
              - golang.org/x/mod@v0.40.0
              - github.com/go-jose/go-jose/v4@v4.1.4
              - github.com/in-toto/in-toto-golang@v0.11.0
              - github.com/klauspost/compress@v1.18.7
              - github.com/sigstore/rekor@v1.5.2
              - github.com/sigstore/sigstore-go@v1.2.1
            download: true
        - name: build crossplane
          uses: go/build@v1
          with:
            fips: false
            ldflags:
              - -X github.com/crossplane/crossplane/v2/internal/version.version=2.1.8
            output: ${target.dir}/usr/bin/crossplane
            packages: ./cmd/crossplane
            tidy: true
        - name: build crossplane dev
          uses: go/build@v1
          with:
            fips: false
            ldflags:
              - -X github.com/crossplane/crossplane/v2/internal/version.version=2.1.8
            output: ${target.dir}/usr/bin/crossplane-dev
            packages: ./cmd/crossplane
            strip: false
            tidy: true
        - name: install cluster assets
          runs: |
            set -eux -o pipefail

            install -d "${target.dir}/usr/share/crossplane/crds"
            install -d "${target.dir}/usr/share/crossplane/webhookconfigurations"
            cp -a cluster/crds/. "${target.dir}/usr/share/crossplane/crds/"
            install -m 0644 cluster/webhookconfigurations/usage.yaml \
              "${target.dir}/usr/share/crossplane/webhookconfigurations/usage.yaml"
        - uses: dhi/build-pkg:0
          with:
            description: Crossplane control plane
            files:
              - usr/bin/crossplane
              - usr/share/crossplane/crds
              - usr/share/crossplane/webhookconfigurations
            license: Apache-2.0
            name: crossplane-2.1
            rel: 2
            subpackages:
              - files:
                  - path: usr/bin/crossplane
                    source: usr/bin/crossplane-dev
                name: crossplane-2.1-dev
            url: https://crossplane.io/
            version: 2.1.8
os-release:
  name: Docker Hardened Images (Alpine)
  id: alpine
  version-id: "3.24"
  pretty-name: Docker Hardened Images/Alpine Linux v3.24
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
