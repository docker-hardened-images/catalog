# syntax=dhi.io/build:2-alpine3.24

image: dhi.io/pkg-crossplane
variant: runtime
tags:
  - 2.3-alpine3.24
  - 2.3.6-alpine3.24
  - 2.3.6-r2-alpine3.24
platforms:
  - linux/amd64
  - linux/arm64
dates:
  release: "2026-05-21"
vars:
  COMMIT_SHA: 6b926e71c6ad5a05779accf6708fddf4d0af62c9
  CROSSPLANE_MODULE_BASE: github.com/crossplane/crossplane/v2
  CROSSPLANE_VERSION_LDFLAG: github.com/crossplane/crossplane-runtime/v2/pkg/version.version
  GOLANG_VERSION: 1.26.8-r1
  PACKAGE_NAME: crossplane-2.3
  REL: "2"
  SEMVER_MAJOR_MINOR_VERSION: "2.3"
  SEMVER_MAJOR_VERSION: "2"
  SEMVER_VERSION: 2.3.6
  VERSION: 2.3.6
contents:
  repositories:
    - https://dhi.io/apk/alpine/v3.24/main
    - https://dhi.io/apk/alpine/v3.23/main
    - https://dl-cdn.alpinelinux.org/alpine/v3.24/main
    - https://dl-cdn.alpinelinux.org/alpine/v3.24/community
  keyring:
    - https://dhi.io/keyring/dhi-apk@docker-0F81AD7700D99184.rsa.pub
  packages:
    - alpine-baselayout-data
  builds:
    - name: crossplane-2.3
      work-dir: /go/src/github.com/crossplane/crossplane
      caches:
        - path: /go/pkg/mod
      contents:
        packages:
          - busybox
          - bash
          - ca-certificates-bundle
          - coreutils
          - findutils
          - mawk
          - sed
          - golang-1.26=1.26.8-r1
          - golang-1.26-oci-config=1.26.8-r1
        files:
          - url: git+https://github.com/crossplane/crossplane.git#v2.3.6
            checksum: 6b926e71c6ad5a05779accf6708fddf4d0af62c9
            path: /go/src/github.com/crossplane/crossplane
            spdx:
              name: crossplane
              version: 2.3.6
              packages:
                - name: crossplane
                  purl: pkg:golang/github.com/crossplane/crossplane/v2@2.3.6
                  license: Apache-2.0
            uid: 0
            gid: 0
      pipeline:
        - name: update go dependencies (2.3 only)
          uses: go/bump@v1
          with:
            deps:
              - golang.org/x/crypto@v0.56.0
              - golang.org/x/mod@v0.40.0
              - github.com/klauspost/compress@v1.18.7
              - github.com/sigstore/rekor@v1.5.2
              - github.com/sigstore/sigstore-go@v1.2.1
              - google.golang.org/grpc@v1.83.2
            download: true
            replaces:
              - github.com/chrismellard/docker-credential-acr-env=github.com/osscontainertools/docker-credential-acr@v0.8.0
        - name: build crossplane
          uses: go/build@v1
          with:
            fips: false
            ldflags:
              - -X github.com/crossplane/crossplane-runtime/v2/pkg/version.version=2.3.6
            output: ${target.dir}/usr/bin/crossplane
            packages: ./cmd/crossplane
            tidy: true
        - name: build crossplane dev
          uses: go/build@v1
          with:
            fips: false
            ldflags:
              - -X github.com/crossplane/crossplane-runtime/v2/pkg/version.version=2.3.6
            output: ${target.dir}/usr/bin/crossplane-dev
            packages: ./cmd/crossplane
            strip: false
            tidy: true
        - name: install cluster assets
          runs: |
            set -eux -o pipefail

            install -d "${target.dir}/usr/share/crossplane/crds"
            install -d "${target.dir}/usr/share/crossplane/webhookconfigurations"
            cp -a cluster/crds/. "${target.dir}/usr/share/crossplane/crds/"
            install -m 0644 cluster/webhookconfigurations/usage.yaml \
              "${target.dir}/usr/share/crossplane/webhookconfigurations/usage.yaml"
        - uses: dhi/build-pkg:0
          with:
            description: Crossplane control plane
            files:
              - usr/bin/crossplane
              - usr/share/crossplane/crds
              - usr/share/crossplane/webhookconfigurations
            license: Apache-2.0
            name: crossplane-2.3
            rel: 2
            subpackages:
              - files:
                  - path: usr/bin/crossplane
                    source: usr/bin/crossplane-dev
                name: crossplane-2.3-dev
            url: https://crossplane.io/
            version: 2.3.6
os-release:
  name: Docker Hardened Images (Alpine)
  id: alpine
  version-id: "3.24"
  pretty-name: Docker Hardened Images/Alpine Linux v3.24
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
