            uid: 0
            gid: 0
      pipeline:
        - name: build host
          work-dir: ${source.dir}/azure-functions-host
          privileged: true
          runs: |
            set -eux -o pipefail

            export DOTNET_ROOT=/usr/lib/dotnet
            export DOTNET_CLI_HOME=/tmp/dotnet
            export DOTNET_CLI_TELEMETRY_OPTOUT=1
            mkdir -p "${DOTNET_CLI_HOME}"

            dotnet publish -v q \
              /p:Version='4.1055.100' /p:BuildNumber='100' /p:FileVersion='4.1055.100.100' /p:CommitHash='0a6bdc2f9c179c8b42984cc1e8a7e2c01a150451' \
              /p:RuntimeFrameworkVersion='10.0.15' \
              src/WebJobs.Script.WebHost/WebJobs.Script.WebHost.csproj \
              -c Release \
              --output '${target.dir}/usr/share/azure-functions-host' \
              --runtime linux-x64 --self-contained

            deps='${target.dir}/usr/share/azure-functions-host/Microsoft.Azure.WebJobs.Script.WebHost.deps.json'
            for pack in Microsoft.NETCore.App Microsoft.AspNetCore.App; do
              grep -qF "\"runtimepack.$pack.Runtime.linux-x64/10.0.15\"" "$deps" || {
                echo "$pack runtime pack is not 10.0.15; DOTNET_RUNTIME_VERSION no longer matches the SDK" >&2
                exit 1
              }
            done

            grep -qF '"Microsoft.Azure.WebJobs.Script.WebHost/4.1055.100"' "$deps" || {
              echo "host assembly version is not 4.1055.100; the Version property no longer takes effect" >&2
              exit 1
            }
        - name: install node worker payload
          runs: |
            set -eux -o pipefail

            host='${target.dir}/usr/share/azure-functions-host'
            node="$host/workers/node"
            mkdir -p "$host/workers"

            if [ ! -f "$node/dist/src/nodejsWorker.js" ]; then
              worker_js=$(find /root/.nuget/packages -path '*/microsoft.azure.functions.nodejsworker/*/contentfiles/any/any/workers/node/dist/src/nodejsWorker.js' 2> /dev/null | head -1)
              if [ -z "$worker_js" ]; then
                echo "Microsoft.Azure.Functions.NodeJsWorker is missing from the NuGet cache after publish" >&2
                exit 1
              fi
              rm -rf "$node"
              node_src=$(dirname "$(dirname "$(dirname "$worker_js")")")
              cp -a "$node_src" "$node"
            fi

            ln -sf dist/src/nodejsWorker.js "$node/worker.js"
            test -f "$node/worker.js"
            test -f "$node/dist/src/worker-bundle.js"
            test -f "$node/package.json"

            name=$(sed -nE 's/.*"name"[[:space:]]*:[[:space:]]*"([^"]+)".*/\1/p' "$node/package.json" | head -1)
            ver=$(sed -nE 's/.*"version"[[:space:]]*:[[:space:]]*"([^"]+)".*/\1/p' "$node/package.json" | head -1)
            if [ "$name" != azure-functions-nodejs-worker ] || [ "$ver" != '3.16.1' ]; then
              echo "node worker package.json is ${name}@${ver}, expected azure-functions-nodejs-worker@3.16.1" >&2
              exit 1
            fi
        - name: snapshot host for node package
          runs: |
            set -eux -o pipefail

            cp -a '${target.dir}/usr/share/azure-functions-host' '${target.dir}/azure-functions-node-host'
        - name: strip language workers
          runs: |
            set -eux -o pipefail

            workers='${target.dir}/usr/share/azure-functions-host/workers'
            find "$workers" -mindepth 1 -maxdepth 1 -exec rm -rf '{}' \;
            touch "$workers/.keep"
        - name: extract templates
          work-dir: ${source.dir}/azure-functions-extension-bundles
          runs: |
            set -eux -o pipefail

            unzip ${source.dir}/templatesArtifacts.zip
            mv drop templatesArtifacts
        - name: verify templates artifact
          work-dir: ${source.dir}/azure-functions-extension-bundles/templatesArtifacts
          runs: |
            set -eux -o pipefail

            grep -Eq '"commitId" *: *"3aeddc17a40f14d7159f61a71aa432224a10b627"' version.json

            for archive in *.zip *.nupkg; do
              unzip -tq "$archive"
            done
        - name: normalize line endings for patches
          work-dir: ${source.dir}/azure-functions-extension-bundles
          runs: |
            set -eux -o pipefail

            find . -type f \( -name '*.cs' -o -name '*.json' \) -exec sed -i 's/\r$//' '{}' +
        - name: patch extension bundles
          uses: patch@v1
          work-dir: ${source.dir}/azure-functions-extension-bundles
          with:
            options: -p1 -l
            patches:
              - ${source.dir}/patch/linux_bundles.patch
              - ${source.dir}/patch/nuget_config.patch
        - name: build extension bundles
          work-dir: ${source.dir}/azure-functions-extension-bundles/build
          privileged: true
          runs: |
            set -eux -o pipefail

            export DOTNET_ROOT=/usr/lib/dotnet
            export DOTNET_CLI_HOME=/tmp/dotnet
            export DOTNET_CLI_TELEMETRY_OPTOUT=1
            mkdir -p "${DOTNET_CLI_HOME}"

            TEMPLATES_ARTIFACTS_DIRECTORY=1 dotnet run \
              skip:GenerateVulnerabilityReport,PackageNetCoreV3BundlesWindows,CreateRUPackage,CreateCDNStoragePackage,CreateCDNStoragePackageWindows,BuildBundleBinariesForWindows
        - name: install extension bundles
          work-dir: ${source.dir}/azure-functions-extension-bundles/artifacts
          runs: |
            set -eux -o pipefail

            mkdir -p ${target.dir}/usr/share/FuncExtensionBundles/Microsoft.Azure.Functions.ExtensionBundle/4.41.1
            unzip Microsoft.Azure.Functions.ExtensionBundle.4.41.1_linux-x64.zip \
              -d ${target.dir}/usr/share/FuncExtensionBundles/Microsoft.Azure.Functions.ExtensionBundle/4.41.1
        - name: spdx netcore runtime
          uses: spdx@v1
          with:
            license: MIT
            name: microsoft.netcore.app.runtime.linux-x64
            purl: pkg:nuget/microsoft.netcore.app.runtime.linux-x64@10.0.15
            version: 10.0.15
        - name: spdx aspnetcore runtime
          uses: spdx@v1
          with:
            license: MIT
            name: microsoft.aspnetcore.app.runtime.linux-x64
            purl: pkg:nuget/microsoft.aspnetcore.app.runtime.linux-x64@10.0.15
            version: 10.0.15
        - uses: dhi/build-pkg:0
          with:
            depends:
              - libc6
              - libgcc-s1
              - libgssapi-krb5-2
              - libicu76
              - libssl3t64
              - libstdc++6
              - zlib1g
            description: Azure Functions host and extension bundles, no language worker
            files:
              - usr/share/azure-functions-host
              - usr/share/FuncExtensionBundles
            formats:
              - deb
            license: MIT
            name: azure-functions-base-4
            rel: 12
            url: https://learn.microsoft.com/en-us/azure/azure-functions/functions-overview
            version: 4.1055.100
        - name: spdx nodejs worker nuget
          uses: spdx@v1
          with:
            license: MIT
            name: Microsoft.Azure.Functions.NodeJsWorker
            purl: pkg:nuget/Microsoft.Azure.Functions.NodeJsWorker@3.16.1
            version: 3.16.1
        - name: spdx nodejs worker npm
          uses: spdx@v1
          with:
            license: MIT
            name: azure-functions-nodejs-worker
            purl: pkg:npm/azure-functions-nodejs-worker@3.16.1
            version: 3.16.1
        - name: stage node language package
          runs: |
            set -eux -o pipefail

            rm -rf '${target.dir}/usr/share/azure-functions-host'
            cp -a '${target.dir}/azure-functions-node-host' '${target.dir}/usr/share/azure-functions-host'
            find '${target.dir}/usr/share/azure-functions-host/workers' -type d -mindepth 1 -maxdepth 1 -not -name 'node' -exec rm -rf '{}' \;
            test -L '${target.dir}/usr/share/azure-functions-host/workers/node/worker.js' -o -f '${target.dir}/usr/share/azure-functions-host/workers/node/worker.js'
            cp /opt/docker/sbom/Microsoft.Azure.Functions.NodeJsWorker/.spdx.Microsoft.Azure.Functions.NodeJsWorker.json \
              '${target.dir}/usr/share/azure-functions-host/workers/node/'
            cp /opt/docker/sbom/azure-functions-nodejs-worker/.spdx.azure-functions-nodejs-worker.json \
              '${target.dir}/usr/share/azure-functions-host/workers/node/'
        - uses: dhi/build-pkg:0
          with:
            depends:
              - libc6
              - libgcc-s1
              - libgssapi-krb5-2
              - libicu76
              - libssl3t64
              - libstdc++6
              - zlib1g
              - nodejs-22 | nodejs-24
            description: Azure Functions host and extension bundles for Node workers
            files:
              - usr/share/azure-functions-host
              - usr/share/FuncExtensionBundles
            formats:
              - deb
            license: MIT
            name: azure-functions-node
            rel: 12
            url: https://learn.microsoft.com/en-us/azure/azure-functions/functions-overview
            version: 4.1055.100
      paths:
