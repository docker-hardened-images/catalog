                "$root/usr/share/ibm-finops-agent/static" \
                "$root/usr/share/licenses/ibm-finops-agent" \
                "$root/opt/docker/sbom"
              for f in default.json aws.json azure.json gcp.json alibaba.json; do
                install -m 0644 "$src/opencost/configs/$f" "$root/usr/share/ibm-finops-agent/models/$f"
                test -s "$root/usr/share/ibm-finops-agent/models/$f"
              done
              install -m 0644 "$src/opencost/configs/awsreservationofferings.json" \
                "$root/usr/share/ibm-finops-agent/static/awsreservationofferings.json"
              test -s "$root/usr/share/ibm-finops-agent/static/awsreservationofferings.json"
              install -m 0644 "$src/LICENSE" "$root/usr/share/licenses/ibm-finops-agent/LICENSE"
              test -s "$root/usr/share/licenses/ibm-finops-agent/LICENSE"
              cp -a "/opt/docker/sbom/$sbom" "$root/opt/docker/sbom/"
              test -s "$root/opt/docker/sbom/$sbom/.spdx.$sbom.json"
            done
