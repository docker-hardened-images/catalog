            go version -m "$bin" > /tmp/ibm-finops-agent-runtime.txt
            go version -m "$dev" > /tmp/ibm-finops-agent-dev.txt

            grep -F 'CGO_ENABLED=0' /tmp/ibm-finops-agent-runtime.txt
            grep -F 'pkg/version.Version=v1.0.33' /tmp/ibm-finops-agent-runtime.txt
            grep -F 'pkg/version.GitCommit=806744ae2ceeb12702d3711aee5b42b32f04719b' /tmp/ibm-finops-agent-runtime.txt
            grep -F -- '-trimpath=true' /tmp/ibm-finops-agent-runtime.txt
            grep -F -- '-ldflags=' /tmp/ibm-finops-agent-runtime.txt | grep -F -- '-w'
            if grep -F -- '-ldflags=' /tmp/ibm-finops-agent-runtime.txt | grep -Eq '(^|[[:space:]])-s([[:space:]]|$)'; then
              echo "runtime ldflags must not include -s" >&2
              exit 1
            fi
            if grep -F -- '-trimpath=true' /tmp/ibm-finops-agent-dev.txt; then
              echo "dev binary must not be built with -trimpath" >&2
              exit 1
            fi
            if grep -F -- '-ldflags=' /tmp/ibm-finops-agent-dev.txt | grep -F -- '-w'; then
              echo "dev binary must not pass -w" >&2
              exit 1
            fi
            if [ "false" = "true" ]; then
              grep -E 'GOFIPS140=v1\.0\.0|-gofips140=v1\.0\.0' /tmp/ibm-finops-agent-runtime.txt
