            set -eux -o pipefail

            src=/go/src/github.com/ibm/finops-agent
            sbom="ibm-finops-agent-1"
            for f in default.json aws.json azure.json gcp.json alibaba.json; do
              test -s "$src/opencost/configs/$f"
            done
            test -s "$src/opencost/configs/awsreservationofferings.json"
            test -s "$src/LICENSE"
            grep -q 'Apache License' "$src/LICENSE"
            grep -q 'Version 2.0' "$src/LICENSE"
            test -s "/opt/docker/sbom/$sbom/.spdx.$sbom.json"

            for root in "${target.dir}" "${target.dir}/dev"; do
              install -d \
