                  - path: usr/share/ibm-finops-agent
                    source: dev/usr/share/ibm-finops-agent
                  - path: usr/share/licenses/ibm-finops-agent/LICENSE
                    source: dev/usr/share/licenses/ibm-finops-agent/LICENSE
                  - path: opt/docker/sbom/ibm-finops-agent-1
