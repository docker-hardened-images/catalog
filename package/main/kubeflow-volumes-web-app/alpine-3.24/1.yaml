            source: ${source.dir}/cargo-sbom
        - name: build venv at final path and stage it
          privileged: true
          runs: |
            set -eux -o pipefail

            export SOURCE_DIR="${source.dir}" TARGET_DIR="${target.dir}" PYTHON_BIN=/usr/bin/python3.12
            bash "${source.dir}/build-venv.sh"
        - name: stage app
          work-dir: ${source.dir}/notebooks/components/crud-web-apps/volumes
          runs: |
            set -eux -o pipefail

            APP="${target.dir}/usr/lib/kubeflow-volumes-web-app/src"
            mkdir -p "${APP}"
            cp -a backend/apps "${APP}/apps"
            install -m 0755 backend/entrypoint.py "${APP}/entrypoint.py"
            test ! -e "${APP}/apps/default/static"
            mkdir -p "${APP}/apps/default/static"
            cp -a frontend/dist/default/. "${APP}/apps/default/static/"
            install -D -m 0644 "${source.dir}/notebooks/LICENSE" \
              "${target.dir}/usr/share/licenses/kubeflow-volumes-web-app/LICENSE"
        - name: stage notices
          runs: |
            set -eux -o pipefail

            export SOURCE_DIR="${source.dir}" TARGET_DIR="${target.dir}"
            bash "${source.dir}/stage-notices.sh"
        - name: python sbom
          uses: sbom@v1
          with:
            extra-scanners: python-package-cataloger
            prefix: kubeflow-volumes-web-app-python
            source: ${target.dir}/usr/lib/kubeflow-volumes-web-app/venv
        - name: stage sbom documents
          runs: |
            set -eux -o pipefail

            mkdir -p "${target.dir}/opt/docker/sbom"
            for d in kubeflow-volumes-web-app kubeflow-volumes-web-app-python kubeflow-volumes-web-app-cargo; do
              test -d "/opt/docker/sbom/$d"
              cp -a "/opt/docker/sbom/$d" "${target.dir}/opt/docker/sbom/"
            done
        - name: verify notices and sbom
          runs: |
            set -eux -o pipefail

            export SOURCE_DIR="${source.dir}" TARGET_DIR="${target.dir}"
            bash "${source.dir}/verify-payload.sh"
