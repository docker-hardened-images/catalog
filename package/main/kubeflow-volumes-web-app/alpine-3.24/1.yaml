            mkdir -p /usr/local/bin
            tar -xzf "${source.dir}/uv-unknown-linux-musl.tar.gz" -C /usr/local/bin --strip-components=1
            /usr/local/bin/uv --version
        - name: bump npm dependencies
          uses: npm/bump@v2
          privileged: true
          with:
            bumps: ${source.dir}/patch/npm-bumps.json
            lockfile-only: "true"
            npm-root: ${source.dir}/notebooks/components/crud-web-apps/volumes/frontend
        - name: build frontend
