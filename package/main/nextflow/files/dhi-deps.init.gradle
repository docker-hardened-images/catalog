// Force patched releases of libraries shaded into the one-jar.
// jackson-databind 2.21.1 -> 2.21.7: CVE-2026-54512, CVE-2026-54513,
// CVE-2026-54514, CVE-2026-54515, CVE-2026-54516, CVE-2026-54517,
// CVE-2026-54518, CVE-2026-59888, CVE-2026-59889, GHSA-mhm7-754m-9p8w,
// CVE-2026-68497, CVE-2026-83557, CVE-2026-19032, CVE-2026-91777,
// CVE-2026-91776
// jackson-core 2.21.1 -> 2.21.7: GHSA-r7wm-3cxj-wff9
// jsoup 1.15.4 -> 1.23.1: CVE-2026-71497
// jline 2.9 -> 2.11: CVE-2013-2035
// logback-core 1.5.32 -> 1.5.35 (classic kept on the same version):
// CVE-2026-9828, CVE-2026-10532
// pf4j 3.12.0 (25 line) -> 3.14.1: CVE-2025-70952. 26 already resolves 3.14.1.
// commons-lang:commons-lang:2.6 has CVE-2025-48924 with no fixed release.
allprojects {
    configurations.all {
        resolutionStrategy {
            force(
                'com.fasterxml.jackson.core:jackson-core:2.21.7',
                'com.fasterxml.jackson.core:jackson-databind:2.21.7',
                'org.jsoup:jsoup:1.23.1',
                'jline:jline:2.11',
                'ch.qos.logback:logback-core:1.5.35',
                'ch.qos.logback:logback-classic:1.5.35',
                'org.pf4j:pf4j:3.14.1',
            )
        }
    }
}
