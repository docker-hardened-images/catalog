# syntax=dhi.io/build:2-alpine3.23

image: dhi.io/pkg-beyla
variant: runtime
tags:
  - 2.5.8-alpine3.23
  - 2.5.8-r5-alpine3.23
platforms:
  - linux/amd64
  - linux/arm64
dates:
  release: "2025-07-22"
vars:
  COMMIT_SHA: cec5b98ecce9eaa6411fc4287a5d4943d4960e78
  GOLANG_VERSION: 1.26.5-r0
  OBI_COMMIT: cd1ae11e0c9429c3b27538c17a6ce19e5003cdde
