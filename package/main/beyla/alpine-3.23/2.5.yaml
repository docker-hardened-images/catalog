  VERSION: 2.5.8
contents:
  repositories:
    - https://dhi.io/apk/alpine/v3.23/main
    - https://dl-cdn.alpinelinux.org/alpine/v3.23/main
    - https://dl-cdn.alpinelinux.org/alpine/v3.23/community
  keyring:
    - https://dhi.io/keyring/dhi-apk@docker-0F81AD7700D99184.rsa.pub
  packages:
    - alpine-baselayout-data
  builds:
    - name: beyla-2.5
      work-dir: /go/src/github.com/grafana/beyla
      contents:
        packages:
          - busybox
          - bash
          - ca-certificates-bundle
          - golang-1.26=1.26.5-r0
          - golang-1.26-oci-config=1.26.5-r0
        files:
          - url: git+https://github.com/grafana/beyla.git#v2.5.8
            checksum: cec5b98ecce9eaa6411fc4287a5d4943d4960e78
            path: /go/src/github.com/grafana/beyla
            spdx:
              name: beyla
              version: 2.5.8
              packages:
                - name: beyla
                  purl: pkg:golang/github.com/grafana/beyla/v2@2.5.8
                  license: Apache-2.0
            uid: 0
            gid: 0
          - url: git+https://github.com/grafana/opentelemetry-ebpf-instrumentation.git#cd1ae11e0c9429c3b27538c17a6ce19e5003cdde
            checksum: cd1ae11e0c9429c3b27538c17a6ce19e5003cdde
            path: /go/src/obi-src
            spdx:
              name: opentelemetry-ebpf-instrumentation
              version: cd1ae11e0c9429c3b27538c17a6ce19e5003cdde
              packages:
                - name: opentelemetry-ebpf-instrumentation
                  purl: pkg:golang/github.com/open-telemetry/opentelemetry-ebpf-instrumentation@cd1ae11e0c9429c3b27538c17a6ce19e5003cdde
                  license: Apache-2.0
            uid: 0
            gid: 0
      pipeline:
        - name: stage OBI source into the go.mod replace path
          runs: |
            set -eux -o pipefail

            rm -rf .obi-src
            cp -a /go/src/obi-src .obi-src
        - name: bump dependencies to fix CVEs (2.5 only)
          uses: go/bump@v2
          with:
            deps:
              - golang.org/x/net@v0.56.0
              - github.com/go-viper/mapstructure/v2@v2.5.0
              - github.com/klauspost/compress@v1.18.7
              - go.mongodb.org/mongo-driver/v2@v2.6.0
              - go.opentelemetry.io/otel@v1.44.0
              - google.golang.org/grpc@v1.82.1
              - go.opentelemetry.io/otel/exporters/otlp/otlpmetric/otlpmetrichttp@v1.44.0
              - go.opentelemetry.io/otel/exporters/otlp/otlptrace/otlptracehttp@v1.44.0
            download: true
            tidy: true
        - name: re-vendor and verify the bumped tree builds
          runs: |
            set -eux -o pipefail

            go mod vendor
            CGO_ENABLED=0 go test -mod=vendor -run '^$' ./pkg/...
        - name: build beyla
          uses: go/build@v1
          with:
            cgo_enabled: 0
            extra-args: -mod=vendor
            fips: false
            ldflags:
              - -X github.com/grafana/beyla/v2/pkg/buildinfo.Version=v2.5.8
              - -X github.com/grafana/beyla/v2/pkg/buildinfo.Revision=cec5b98ecce9eaa6411fc4287a5d4943d4960e78
              - -X github.com/open-telemetry/opentelemetry-ebpf-instrumentation/pkg/buildinfo.Version=2.5.8
              - -X github.com/open-telemetry/opentelemetry-ebpf-instrumentation/pkg/buildinfo.Revision=cec5b98ecce9eaa6411fc4287a5d4943d4960e78
            output: ${target.dir}/usr/bin/beyla
            packages: ./cmd/beyla
        - name: build beyla dev
          uses: go/build@v1
          with:
            cgo_enabled: 0
            extra-args: -mod=vendor
            fips: false
            ldflags:
              - -X github.com/grafana/beyla/v2/pkg/buildinfo.Version=v2.5.8
              - -X github.com/grafana/beyla/v2/pkg/buildinfo.Revision=cec5b98ecce9eaa6411fc4287a5d4943d4960e78
              - -X github.com/open-telemetry/opentelemetry-ebpf-instrumentation/pkg/buildinfo.Version=2.5.8
              - -X github.com/open-telemetry/opentelemetry-ebpf-instrumentation/pkg/buildinfo.Revision=cec5b98ecce9eaa6411fc4287a5d4943d4960e78
            output: ${target.dir}/usr/bin/beyla-dev
            packages: ./cmd/beyla
            strip: false
        - uses: dhi/build-pkg:0
          with:
            description: eBPF-based autoinstrumentation of web applications and network metrics
            files:
              - usr/bin/beyla
            license: Apache-2.0
            name: beyla-2.5
            rel: 5
            subpackages:
              - files:
                  - path: usr/bin/beyla
                    source: usr/bin/beyla-dev
                name: beyla-2.5-dev
            url: https://github.com/grafana/beyla
            version: 2.5.8
