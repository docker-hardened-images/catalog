        files:
          - url: git+https://github.com/grafana/beyla.git#v3.40.0
            checksum: 786c08ea5050d5a33581cfc2e1f313559ed93de0
            path: /go/src/github.com/grafana/beyla
            spdx:
              name: beyla
              version: 3.40.0
              packages:
