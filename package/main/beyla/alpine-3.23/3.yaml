              - -X github.com/open-telemetry/opentelemetry-ebpf-instrumentation/pkg/buildinfo.Revision=786c08ea5050d5a33581cfc2e1f313559ed93de0
            output: ${target.dir}/usr/bin/beyla
            packages: ./cmd/beyla
        - name: build beyla dev
          uses: go/build@v1
          with:
            cgo_enabled: 0
            extra-args: -mod=vendor
            fips: false
            ldflags:
              - -X github.com/grafana/beyla/v2/pkg/buildinfo.Version=v3.40.0
              - -X github.com/grafana/beyla/v2/pkg/buildinfo.Revision=786c08ea5050d5a33581cfc2e1f313559ed93de0
              - -X github.com/open-telemetry/opentelemetry-ebpf-instrumentation/pkg/buildinfo.Version=3.40.0
              - -X github.com/open-telemetry/opentelemetry-ebpf-instrumentation/pkg/buildinfo.Revision=786c08ea5050d5a33581cfc2e1f313559ed93de0
            output: ${target.dir}/usr/bin/beyla-dev
            packages: ./cmd/beyla
            strip: false
        - uses: dhi/build-pkg:0
          with:
