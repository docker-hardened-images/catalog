                  purl: pkg:golang/github.com/grafana/beyla/v2@3.40.0
                  license: Apache-2.0
            uid: 0
            gid: 0
          - url: git+https://github.com/grafana/opentelemetry-ebpf-instrumentation.git#4838a24c32f99da1ecb0990233dee1f2fffceafb
