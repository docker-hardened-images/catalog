                  license: Apache-2.0
            uid: 0
            gid: 0
      pipeline:
        - name: stage OBI source into the go.mod replace path
          runs: |
            set -eux -o pipefail

            rm -rf .obi-src
            cp -a /go/src/obi-src .obi-src
        - name: bump dependencies to fix CVEs (3 only)
          uses: go/bump@v2
          with:
            deps:
              - golang.org/x/mod@v0.41.0
              - golang.org/x/net@v0.62.0
              - github.com/go-viper/mapstructure/v2@v2.5.0
              - google.golang.org/grpc@v1.85.0-dev.0.20260825072537-93e31b48545e
            download: true
            tidy: true
        - name: generate Beyla eBPF bindings
          runs: |
            set -eux -o pipefail

            if [ ! -x /usr/bin/clang ]; then
              for clang_bin in /usr/bin/clang-[0-9]*; do
                [ -x "$clang_bin" ] || continue
                ln -s "${clang_bin##*/}" /usr/bin/clang
                break
              done
            fi
            command -v clang

            make generate-beyla
        - name: re-vendor and verify the bumped tree builds
          runs: |
            set -eux -o pipefail

            go mod vendor
            CGO_ENABLED=0 go test -mod=vendor -run '^$' ./pkg/...
        - name: build beyla
          uses: go/build@v1
          with:
            cgo_enabled: 0
            extra-args: -mod=vendor
            fips: false
            ldflags:
              - -X github.com/grafana/beyla/v2/pkg/buildinfo.Version=v3.40.0
