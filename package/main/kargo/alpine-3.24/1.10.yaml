          - busybox
          - ca-certificates-bundle
          - coreutils
          - findutils
          - git
          - golang-1.27=1.27.1-r1
          - golang-1.27-oci-config=1.27.1-r1
          - nodejs-24=24.21.0-r0
          - npm-12=12.2.0-r0
        files:
          - url: git+https://github.com/akuity/kargo.git#v1.10.14
            checksum: ca40fc4839f62707a634e42eb609c319c9f774cf
            path: /go/src/github.com/akuity/kargo
            spdx:
              name: kargo
              version: 1.10.14
              packages:
                - name: kargo
                  purl: pkg:golang/github.com/akuity/kargo@1.10.14
                  license: Apache-2.0
            uid: 0
            gid: 0
          - url: git+https://github.com/grpc-ecosystem/grpc-health-probe.git#v0.4.57
            checksum: 82e04432a7344c01c56406a6ddf5c8b6841d5a65
            path: /go/src/github.com/grpc-ecosystem/grpc-health-probe
            spdx:
              name: grpc-health-probe
              version: 0.4.57
              packages:
                - name: grpc-health-probe
                  purl: pkg:golang/github.com/grpc-ecosystem/grpc-health-probe@0.4.57
                  license: Apache-2.0
            uid: 0
            gid: 0
          - url: git+https://github.com/helm/helm.git#v3.22.0
            checksum: 144ca65f8501953fa8b41cd1d37c7223051c85b7
            path: /go/src/github.com/helm/helm
            uid: 0
            gid: 0
      pipeline:
        - name: update go dependencies
          uses: go/bump@v2
          with:
