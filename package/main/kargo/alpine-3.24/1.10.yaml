              - k8s.io/apiextensions-apiserver=k8s.io/apiextensions-apiserver@v0.34.3
              - k8s.io/apimachinery=k8s.io/apimachinery@v0.34.3
              - k8s.io/apiserver=k8s.io/apiserver@v0.34.3
              - k8s.io/cli-runtime=k8s.io/cli-runtime@v0.34.3
              - k8s.io/client-go=k8s.io/client-go@v0.34.3
              - k8s.io/component-base=k8s.io/component-base@v0.34.3
              - k8s.io/kubectl=k8s.io/kubectl@v0.34.2
              - k8s.io/kube-openapi=k8s.io/kube-openapi@v0.0.0-20250710124328-f3f2b991d03b
              - k8s.io/utils=k8s.io/utils@v0.0.0-20250604170112-4c0f3b243397
        - uses: go/hermetic@v1
        - name: install pnpm
          privileged: true
          runs: |
            set -eux -o pipefail

            npm install -g pnpm@9.0.3
            pnpm --version
        - name: build ui
          work-dir: /go/src/github.com/akuity/kargo/ui
          privileged: true
          runs: |
            set -eux -o pipefail

            pnpm install --frozen-lockfile
            NODE_ENV=production VERSION=v1.10.14 pnpm run build
            test -f build/index.html
            rm -rf /go/src/github.com/akuity/kargo/pkg/server/ui
            mkdir -p /go/src/github.com/akuity/kargo/pkg/server/ui
            cp -a build/. /go/src/github.com/akuity/kargo/pkg/server/ui/
            rm -rf node_modules
        - name: test
          runs: |
            set -eux -o pipefail

            pkgs="./pkg/x/version ./cmd/credential-helper ./pkg/conditions"
            for p in ./pkg/cache ./pkg/component ./pkg/credentials/basic; do
              if [ -d "$p" ]; then
                pkgs="${pkgs} ${p}"
              fi
            done
            go test -count=1 ${pkgs}
        - name: build credential-helper
          uses: go/build@v1
          environment:
            GOFLAGS: -buildvcs=false
          with:
            cgo_enabled: 0
            fips: false
            ldflags:
              - -w -s
            output: ${target.dir}/usr/bin/credential-helper
            packages: ./cmd/credential-helper
        - name: build kargo
          uses: go/build@v1
          environment:
            GOFLAGS: -buildvcs=false
          with:
            cgo_enabled: 0
            fips: false
            ldflags:
              - -w
              - -X github.com/akuity/kargo/pkg/x/version.version=v1.10.14
              - -X github.com/akuity/kargo/pkg/x/version.buildDate=$(date -ud @${SOURCE_DATE_EPOCH} +'%Y-%m-%dT%H:%M:%SZ')
              - -X github.com/akuity/kargo/pkg/x/version.gitCommit=ca40fc4839f62707a634e42eb609c319c9f774cf
              - -X github.com/akuity/kargo/pkg/x/version.gitTreeState=clean
            output: ${target.dir}/usr/bin/kargo
            packages: ./cmd/controlplane
        - name: build kargo dev
          uses: go/build@v1
          environment:
            GOFLAGS: -buildvcs=false
          with:
            cgo_enabled: 0
            fips: false
            ldflags:
              - -X github.com/akuity/kargo/pkg/x/version.version=v1.10.14
              - -X github.com/akuity/kargo/pkg/x/version.buildDate=$(date -ud @${SOURCE_DATE_EPOCH} +'%Y-%m-%dT%H:%M:%SZ')
              - -X github.com/akuity/kargo/pkg/x/version.gitCommit=ca40fc4839f62707a634e42eb609c319c9f774cf
              - -X github.com/akuity/kargo/pkg/x/version.gitTreeState=clean
            output: ${target.dir}/usr/bin/kargo-dev
            packages: ./cmd/controlplane
            strip: false
        - name: update helm dependencies
          uses: go/bump@v2
          work-dir: /go/src/github.com/helm/helm
          with:
            deps:
              - golang.org/x/crypto@v0.57.0
            tidy: true
        - name: helm kubernetes version
          work-dir: /go/src/github.com/helm/helm
          privileged: true
          runs: |
            set -eux -o pipefail

            k8s_version="$(go list -f '{{.Version}}' -m k8s.io/client-go)"
            major="$(echo "${k8s_version}" | cut -d. -f1 | tr -d v)"
            echo "$((major + 1))" > /tmp/k8s-major
            echo "${k8s_version}" | cut -d. -f2 > /tmp/k8s-minor
        - name: build helm
          uses: go/build@v1
          work-dir: /go/src/github.com/helm/helm
          environment:
            GOFLAGS: -buildvcs=false
          with:
            cgo_enabled: 0
            fips: false
            ldflags:
              - -w -s
              - -X helm.sh/helm/v3/internal/version.version=3.22.0
              - -X helm.sh/helm/v3/internal/version.gitCommit=144ca65f8501953fa8b41cd1d37c7223051c85b7
              - -X helm.sh/helm/v3/internal/version.gitTreeState=clean
              - -X helm.sh/helm/v3/internal/version.metadata=
              - -X helm.sh/helm/v3/pkg/chartutil.k8sVersionMajor=$(cat /tmp/k8s-major)
              - -X helm.sh/helm/v3/pkg/chartutil.k8sVersionMinor=$(cat /tmp/k8s-minor)
              - -X helm.sh/helm/v3/pkg/lint/rules.k8sVersionMajor=$(cat /tmp/k8s-major)
              - -X helm.sh/helm/v3/pkg/lint/rules.k8sVersionMinor=$(cat /tmp/k8s-minor)
            output: ${target.dir}/usr/bin/helm
            packages: ./cmd/helm
        - uses: spdx@v1
          with:
            license: Apache-2.0
            name: helm
            purl: pkg:golang/helm.sh/helm/v3@3.22.0
            version: 3.22.0
        - uses: spdx@v1
          with:
            license: Apache-2.0
            name: grpc-health-probe
            purl: pkg:golang/github.com/grpc-ecosystem/grpc-health-probe@0.4.57
            version: 0.4.57
        - name: update grpc-health-probe go dependencies
          uses: go/bump@v2
          work-dir: /go/src/github.com/grpc-ecosystem/grpc-health-probe
          with:
            deps: []
            tidy: true
        - name: build grpc-health-probe
          uses: go/build@v1
          work-dir: /go/src/github.com/grpc-ecosystem/grpc-health-probe
          with:
            fips: false
            ldflags:
              - -X main.versionTag=0.4.57
            output: ${target.dir}/usr/bin/grpc_health_probe
            packages: .
            tags: netgo
        - name: build grpc-health-probe dev
          uses: go/build@v1
          work-dir: /go/src/github.com/grpc-ecosystem/grpc-health-probe
          with:
            fips: false
            ldflags:
              - -X main.versionTag=0.4.57
            output: ${target.dir}/usr/bin/grpc_health_probe-dev
            packages: .
            strip: false
            tags: netgo
        - name: sbom
          uses: sbom@v1
          with:
            prefix: kargo
            source: /go/src/github.com/akuity/kargo
        - uses: dhi/build-pkg:0
          with:
            description: Kargo application lifecycle orchestrator
            files:
              - usr/bin/kargo
              - usr/bin/credential-helper
              - usr/bin/helm
              - usr/bin/grpc_health_probe
            license: Apache-2.0
            name: kargo-1.10
            rel: 0
            subpackages:
              - files:
                  - path: usr/bin/kargo
                    source: usr/bin/kargo-dev
                  - path: usr/bin/grpc_health_probe
                    source: usr/bin/grpc_health_probe-dev
                name: kargo-1.10-dev
            url: https://github.com/akuity/kargo
            version: 1.10.14
