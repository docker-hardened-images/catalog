          with:
            bumps: ${source.dir}/patch/npm-bumps.json
            npm-root: ${source.dir}/smartbear-mcp
            omit-dev: false
        - name: install and build
          privileged: true
          runs: |
            set -eux -o pipefail

            npm ci
            npm run build

            rm -rf node_modules
            npm ci --ignore-scripts --omit=dev
            npm install-scripts approve tree-sitter
            CXXFLAGS="-std=c++20" npm rebuild tree-sitter

            found=0
            for f in $(find node_modules -type f -path '*/minimatch/package.json'); do
              found=1
              v=$(node -p "require('./${f}').version")
              echo "minimatch ${v} at ${f}"
              test "$v" = "11.0.1"
            done
            test "$found" = 1

            mkdir -p "${target.dir}/usr/lib/smartbear-mcp"
            cp -a dist node_modules package.json "${target.dir}/usr/lib/smartbear-mcp/"
        - name: bundled node_modules sbom
          uses: sbom@v1
          with:
            extra-scanners: javascript-package-cataloger
            prefix: smartbear-mcp-npm
            source: ${target.dir}/usr/lib/smartbear-mcp/node_modules
        - uses: dhi/build-pkg:0
          with:
