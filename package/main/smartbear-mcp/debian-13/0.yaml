vars:
  BUILD_ENTITLEMENT: ""
  COMMIT_SHA: de5615368cc2252f73da275b8b581e8f5d4e20b6
  NODEJS_VERSION: 24.22.2-0
  NPM_VERSION: 11.21.2-1
  PACKAGE_NAME: smartbear-mcp-0
  REL: "2"
  SEMVER_MAJOR_MINOR_VERSION: "0.43"
  SEMVER_MAJOR_VERSION: "0"
  SEMVER_VERSION: 0.43.0
  VERSION: 0.43.0
contents:
  repositories:
    - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
  keyring:
    - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
  packages:
    - base-files
  builds:
    - name: smartbear-mcp
      work-dir: ${source.dir}/smartbear-mcp
      caches:
        - path: /root/.npm
      contents:
        repositories:
          - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
        keyring:
          - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
        packages:
          - base-files
          - bash
          - build-essential
          - ca-certificates
          - coreutils
          - findutils
          - git
          - libc6
          - libstdc++6
          - mawk
          - nodejs-24=24.22.2-0
          - npm=11.21.2-1
          - python3
          - sed
        files:
          - url: git+https://github.com/SmartBear/smartbear-mcp.git#v0.43.0
            checksum: de5615368cc2252f73da275b8b581e8f5d4e20b6
            path: ${source.dir}/smartbear-mcp
            spdx:
              name: smartbear-mcp
              version: 0.43.0
              packages:
                - name: '@smartbear/mcp'
                  purl: pkg:npm/%40smartbear/mcp@0.43.0
                  license: MIT
            uid: 0
            gid: 0
      pipeline:
        - name: bump dependencies
          uses: npm/bump@v1
          privileged: true
          environment:
            DHI_NO_SFW: "true"
          with:
            bumps: ${source.dir}/patch/npm-bumps.json
            npm-root: ${source.dir}/smartbear-mcp
            omit-dev: false
        - name: install and build
          privileged: true
          runs: |
            set -eux -o pipefail

            npm ci
            npm run build

            rm -rf node_modules
            npm ci --ignore-scripts --omit=dev
            npm install-scripts approve tree-sitter
            CXXFLAGS="-std=c++20" npm rebuild tree-sitter

            found=0
            for f in $(find node_modules -type f -path '*/minimatch/package.json'); do
              found=1
              v=$(node -p "require('./${f}').version")
              echo "minimatch ${v} at ${f}"
              test "$v" = "11.0.1"
            done
            test "$found" = 1

            mkdir -p "${target.dir}/usr/lib/smartbear-mcp"
            cp -a dist node_modules package.json "${target.dir}/usr/lib/smartbear-mcp/"
        - name: bundled node_modules sbom
          uses: sbom@v1
          with:
            extra-scanners: javascript-package-cataloger
            prefix: smartbear-mcp-npm
            source: ${target.dir}/usr/lib/smartbear-mcp/node_modules
        - uses: dhi/build-pkg:0
          with:
            depends:
              - nodejs-24
            description: SmartBear MCP Server (Model Context Protocol server for SmartBear tools)
            files:
              - usr/lib/smartbear-mcp
            formats:
              - deb
            license: MIT
            name: smartbear-mcp-0
            rel: 2
            url: https://github.com/SmartBear/smartbear-mcp
            version: 0.43.0
      paths:
        - type: file
          path: ${source.dir}/patch/npm-bumps.json
          uid: 0
          gid: 0
          source: package/main/smartbear-mcp/patch/npm-bumps.json
os-release:
  name: Docker Hardened Images (Debian)
  id: debian
