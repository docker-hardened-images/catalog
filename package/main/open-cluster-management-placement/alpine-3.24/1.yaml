# syntax=dhi.io/build:2-alpine3.24

image: dhi.io/pkg-open-cluster-management-placement
variant: runtime
tags:
  - 1.4.0-alpine3.24
  - 1.4.0-r1-alpine3.24
platforms:
  - linux/amd64
  - linux/arm64
dates:
  release: "2025-06-16"
vars:
  COMMIT_SHA: 45ecb6233fb316302a428d1d258e68a9cc2e7040
  GOLANG_MAJOR_MINOR_VERSION: "1.26"
  GOLANG_VERSION: 1.26.11-r0
  PACKAGE_NAME: open-cluster-management-placement-1
  REL: "1"
  SEMVER_MAJOR_MINOR_VERSION: "1.4"
  SEMVER_MAJOR_VERSION: "1"
  SEMVER_VERSION: 1.4.0
  VERSION: 1.4.0
contents:
  repositories:
    - https://dhi.io/apk/alpine/v3.24/main
    - https://dhi.io/apk/alpine/v3.23/main
    - https://dl-cdn.alpinelinux.org/alpine/v3.24/main
    - https://dl-cdn.alpinelinux.org/alpine/v3.24/community
  keyring:
    - https://dhi.io/keyring/dhi-apk@docker-0F81AD7700D99184.rsa.pub
  packages:
    - alpine-baselayout-data
  builds:
    - name: open-cluster-management-placement-1
      work-dir: /go/src/open-cluster-management.io/ocm
      caches:
        - path: /go/pkg/mod
      contents:
        packages:
          - bash
          - busybox
          - ca-certificates-bundle
          - coreutils
          - findutils
          - golang-1.26=1.26.11-r0
          - golang-1.26-oci-config=1.26.11-r0
          - mawk
          - sed
        files:
          - url: git+https://github.com/open-cluster-management-io/ocm.git#v1.4.0
            checksum: 45ecb6233fb316302a428d1d258e68a9cc2e7040
            path: /go/src/open-cluster-management.io/ocm
            spdx:
              name: open-cluster-management-placement
              version: 1.4.0
              packages:
                - name: ocm
                  purl: pkg:golang/open-cluster-management.io/ocm@1.4.0
                  license: Apache-2.0
            uid: 0
            gid: 0
      pipeline:
        - name: remove vendor directory
          runs: |
            set -eux -o pipefail

            rm -rf vendor
        - name: patch cves
          uses: go/bump@v2
          with:
            deps:
              - golang.org/x/net@v0.62.0
              - github.com/google/cel-go@v0.30.0
              - google.golang.org/grpc@v1.85.0
            download: true
        - name: adjust cel-go v0.30 test expectation
          runs: |
            set -eux -o pipefail

            sed -i '/name: "nil cluster"/,/expectedCost/ s/expectedCost:       3,/expectedCost:       2,/' pkg/placement/helpers/cel_test.go
        - name: re-vendor
          runs: |
            set -eux -o pipefail

            go mod vendor
        - name: test
          runs: |
            set -eux -o pipefail

            go test -short $(go list ./pkg/placement/... | grep -v /controllers) -count=1 -v
        - name: build placement
          uses: go/build@v1
          environment:
            GOFLAGS: -buildvcs=false
          with:
            fips: false
            ldflags:
              - -X open-cluster-management.io/ocm/pkg/version.versionFromGit=v1.4.0
              - -X open-cluster-management.io/ocm/pkg/version.commitFromGit=45ecb6233fb316302a428d1d258e68a9cc2e7040
            output: ${target.dir}/usr/bin/placement
            packages: ./cmd/placement
        - name: build placement dev
          uses: go/build@v1
          environment:
            GOFLAGS: -buildvcs=false
          with:
            fips: false
            ldflags:
              - -X open-cluster-management.io/ocm/pkg/version.versionFromGit=v1.4.0
              - -X open-cluster-management.io/ocm/pkg/version.commitFromGit=45ecb6233fb316302a428d1d258e68a9cc2e7040
            output: ${target.dir}/usr/bin/placement-dev
            packages: ./cmd/placement
            strip: false
        - name: stage sbom
          runs: |
            set -eux -o pipefail

            mkdir -p "${target.dir}/opt/docker/sbom"
            if [ -d /opt/docker/sbom/open-cluster-management-placement ]; then
              cp -a /opt/docker/sbom/open-cluster-management-placement "${target.dir}/opt/docker/sbom/"
            fi
        - uses: dhi/build-pkg:0
          with:
            description: Open Cluster Management placement controller
            files:
              - usr/bin/placement
              - opt/docker/sbom/open-cluster-management-placement
            license: Apache-2.0
            name: open-cluster-management-placement-1
            rel: 1
            subpackages:
              - files:
                  - path: usr/bin/placement
                    source: usr/bin/placement-dev
                name: open-cluster-management-placement-1-dev
            url: https://github.com/open-cluster-management-io/ocm
            version: 1.4.0
os-release:
  name: Docker Hardened Images (Alpine)
  id: alpine
  version-id: "3.24"
  pretty-name: Docker Hardened Images/Alpine Linux v3.24
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
