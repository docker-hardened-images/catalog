# syntax=dhi.io/build:2-debian13

image: dhi.io/pkg-cabal-install
variant: runtime
tags:
  - 3.18.2.0
  - 3.18.2.0-r1
  - 3.18.2.0-debian13
  - 3.18.2.0-r1-debian13
platforms:
  - linux/amd64
  - linux/arm64
vars:
  BOOTSTRAP_GHC_NAME: ghc-9.12
  BOOTSTRAP_GHC_SEMVER: 9.12.4
  BOOTSTRAP_GHC_VERSION: 9.12.4-3
  BOOTSTRAP_PLAN: linux-9.12.4.json
  COMMIT_SHA: 45f982c12ef78ea8ec5beb43cb8c71c8e8f237c1
  REL: "1"
  VERSION: 3.18.2.0
contents:
  packages:
    - '!base-files'
  builds:
    - name: cabal-install
      work-dir: ${source.dir}/cabal
      contents:
        repositories:
          - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] https://dhi.io/deb/debian/main trixie main
        keyring:
          - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
        packages:
          - ghc-9.12=9.12.4-3
          - bash
          - binutils
          - ca-certificates
          - coreutils
          - diffutils
          - findutils
          - g++
          - gcc
          - grep
          - gzip
          - libc6-dev
          - libffi-dev
          - libgmp-dev
          - libnuma-dev
          - libtinfo6
          - make
          - mawk
          - pkg-config
          - python3
          - sed
          - tar
          - xz-utils
          - zlib1g-dev
        files:
          - url: git+https://github.com/haskell/cabal.git#cabal-install-v3.18.2.0
            checksum: 45f982c12ef78ea8ec5beb43cb8c71c8e8f237c1
            path: ${source.dir}/cabal
            uid: 0
            gid: 0
      pipeline:
        - name: prepare release dependencies
          privileged: true
          runs: |
            set -eux -o pipefail

            python3 "${source.dir}/source-metadata.py" fetch --source . --plan "linux-9.12.4.json"
        - name: bootstrap cabal
          runs: |
            set -eux -o pipefail

            ghc="/usr/lib/ghc-9.12/bin/ghc"
            test "$("${ghc}" --numeric-version)" = "9.12.4"

            ./bootstrap/bootstrap.py -d "./bootstrap/linux-9.12.4.json" -w "${ghc}"
            install -Dm0755 _build/bin/cabal "${target.dir}/usr/bin/cabal"
        - name: record Cabal library components
          runs: |
            set -eux -o pipefail

            python3 "${source.dir}/source-metadata.py" sbom \
              --source . --plan "linux-9.12.4.json" \
              --compiler-root "/usr/lib/ghc-9.12" --compiler-version "9.12.4" \
              --version "3.18.2.0" --commit "45f982c12ef78ea8ec5beb43cb8c71c8e8f237c1" \
              --output "${target.dir}/opt/docker/sbom/cabal-install/.spdx.cabal-install.json"
        - uses: dhi/build-pkg:0
          with:
            depends:
              - ca-certificates
              - curl
              - libc6
              - libgmp10
              - libnuma1
              - zlib1g
            description: Command-line interface for Cabal and Hackage
            files:
              - usr/bin/cabal
              - opt/docker/sbom/cabal-install
            formats:
              - deb
            license: BSD-3-Clause
            name: cabal-install
            rel: 1
            url: https://www.haskell.org/cabal/
            version: 3.18.2.0
      paths:
        - type: file
          path: ${source.dir}/source-metadata.py
          uid: 0
          gid: 0
          mode: "0644"
          source: package/main/cabal-install/source-metadata.py
os-release:
  name: Docker Hardened Images (Debian)
  id: debian
  version-id: "13"
  version-codename: trixie
  pretty-name: Docker Hardened Images/Debian GNU/Linux 13 (trixie)
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
