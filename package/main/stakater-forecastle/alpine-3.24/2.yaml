# syntax=dhi.io/build:2-alpine3.24

image: dhi.io/pkg-stakater-forecastle
variant: runtime
tags:
  - 2.0.3-alpine3.24
  - 2.0.3-r0-alpine3.24
platforms:
  - linux/amd64
  - linux/arm64
vars:
  COMMIT_SHA: 09e1ee69697bd597dd24cf46a6b2e90eb08449cd
  GOLANG_VERSION: 1.26.10-r0
  NODEJS_VERSION: 22.23.4-r1
  PACKAGE_NAME: stakater-forecastle-2
  REL: "0"
  SEMVER_MAJOR_MINOR_VERSION: "2.0"
  SEMVER_MAJOR_VERSION: "2"
  SEMVER_VERSION: 2.0.3
  VERSION: 2.0.3
  YARN_VERSION: 1.22.22_git20260611-r1
contents:
  repositories:
    - https://dhi.io/apk/alpine/v3.24/main
    - https://dhi.io/apk/alpine/v3.23/main
    - https://dl-cdn.alpinelinux.org/alpine/v3.24/main
    - https://dl-cdn.alpinelinux.org/alpine/v3.24/community
  keyring:
    - https://dhi.io/keyring/dhi-apk@docker-0F81AD7700D99184.rsa.pub
  packages:
    - alpine-baselayout-data
  builds:
    - name: stakater-forecastle-2
      work-dir: /go/src/github.com/stakater/Forecastle/v1
      environment:
        CI: "true"
        YARN_CACHE_FOLDER: /usr/local/share/.cache/yarn
      caches:
        - path: /root/.cache/go-build
        - path: /usr/local/share/.cache/yarn
      contents:
        packages:
          - busybox
          - bash
          - ca-certificates-bundle
          - coreutils
          - findutils
          - git
          - mawk
          - sed
          - golang-1.26=1.26.10-r0
          - golang-1.26-oci-config=1.26.10-r0
          - nodejs-22=22.23.4-r1
          - yarn=1.22.22_git20260611-r1
        files:
          - url: git+https://github.com/stakater/Forecastle.git#v2.0.3
            checksum: 09e1ee69697bd597dd24cf46a6b2e90eb08449cd
            path: /go/src/github.com/stakater/Forecastle/v1
            spdx:
              name: forecastle-source
              version: 2.0.3
              packages:
                - name: forecastle
                  purl: pkg:golang/github.com/stakater/Forecastle/v1@2.0.3
                  license: Apache-2.0
            uid: 0
            gid: 0
      pipeline:
        - name: install frontend
          work-dir: /go/src/github.com/stakater/Forecastle/v1/frontend
          privileged: true
          runs: |
            set -eux -o pipefail

            yarn config set disable-self-update-check true
            yarn install --frozen-lockfile --network-timeout 1000000
        - name: bump frontend dependencies
          uses: yarn/bump@v2
          privileged: true
          with:
            bumps: ${source.dir}/patch/yarn-bumps.json
            yarn-root: /go/src/github.com/stakater/Forecastle/v1/frontend
        - name: build frontend
          work-dir: /go/src/github.com/stakater/Forecastle/v1/frontend
          privileged: true
          runs: |
            set -eux -o pipefail

            node -e 'const v=require("./node_modules/axios/package.json").version; if (v!=="1.20.0") { console.error("axios "+v); process.exit(1) }'
            yarn build
            test -f build/index.html
            grep -q '<html' build/index.html

            cd /go/src/github.com/stakater/Forecastle/v1
            test -f internal/web/build/.gitkeep
            rm -r internal/web/build
            mkdir internal/web/build
            cp -a frontend/build/. internal/web/build/
            test -f internal/web/build/index.html
            grep -q '<html' internal/web/build/index.html
            test ! -e internal/web/build/.gitkeep
        - name: production frontend modules
          work-dir: /go/src/github.com/stakater/Forecastle/v1/frontend
          privileged: true
          runs: |
            set -eux -o pipefail

            test -d node_modules
            rm -r node_modules
            yarn install --frozen-lockfile --production --network-timeout 1000000
            test -d node_modules
            find node_modules -type d \( -name esbuild -o -name @esbuild -o -name typescript \) -prune -exec rm -r {} +
            leftover=$(find node_modules -type d \( -name esbuild -o -name @esbuild -o -name typescript \) -print -quit)
            test -z "${leftover}"

            node << 'NODE'
            const fs = require("fs");
            const path = require("path");

            const root = "/go/src/github.com/stakater/Forecastle/v1/frontend";
            const stageRoot = "/tmp/forecastle-frontend-runtime";
            const stage = path.join(stageRoot, "node_modules");
            fs.rmSync(stageRoot, { recursive: true, force: true });
            fs.mkdirSync(stage, { recursive: true });

            const pkg = JSON.parse(fs.readFileSync(path.join(root, "package.json"), "utf8"));
            const skip = new Set(["react-scripts"]);
            const seen = new Set();

            function resolveFrom(startDir, name) {
              let dir = startDir;
              for (;;) {
                const candidate = path.join(dir, "node_modules", name);
                if (fs.existsSync(path.join(candidate, "package.json"))) {
                  return fs.realpathSync(candidate);
                }
                const parent = path.dirname(dir);
                if (parent === dir) {
                  console.error("missing package " + name + " from " + startDir);
                  process.exit(1);
                }
                dir = parent;
              }
            }

            function copyPkg(src) {
              const meta = JSON.parse(fs.readFileSync(path.join(src, "package.json"), "utf8"));
              const name = meta.name;
              if (!name || seen.has(src)) {
                return;
              }
              seen.add(src);
              const dest = path.join(stage, name);
              fs.mkdirSync(path.dirname(dest), { recursive: true });
              fs.cpSync(src, dest, {
                recursive: true,
                dereference: true,
                filter: (from) => {
                  const rel = path.relative(src, from);
                  return rel === "" || !rel.split(path.sep).includes("node_modules");
                },
              });
              const deps = Object.assign({}, meta.dependencies || {}, meta.optionalDependencies || {});
              for (const dep of Object.keys(deps)) {
                copyPkg(resolveFrom(src, dep));
              }
            }

            for (const name of Object.keys(pkg.dependencies || {})) {
              if (skip.has(name)) {
                continue;
              }
              copyPkg(resolveFrom(root, name));
            }

            function versionOf(name) {
              const manifest = path.join(stage, name, "package.json");
              if (!fs.existsSync(manifest)) {
                console.error("staged package missing " + name);
                process.exit(1);
              }
              return JSON.parse(fs.readFileSync(manifest, "utf8")).version;
            }

            const expect = {
              axios: "1.20.0",
              "form-data": "4.0.6",
              "follow-redirects": "1.16.2",
              yaml: "1.10.3",
            };
            for (const [name, ver] of Object.entries(expect)) {
              const got = versionOf(name);
              if (got !== ver) {
                console.error(name + " is " + got + ", want " + ver);
                process.exit(1);
              }
            }
            versionOf("react");
            if (fs.existsSync(path.join(stage, "react-scripts"))) {
              console.error("react-scripts must not be cataloged");
              process.exit(1);
            }
            if (seen.size < 10) {
              console.error("runtime closure is too small: " + seen.size);
              process.exit(1);
            }
            console.log("cataloged frontend packages " + seen.size);
            NODE
        - name: frontend sbom
          uses: sbom@v1
          with:
            extra-scanners: javascript-package-cataloger
            prefix: forecastle-frontend
            source: /tmp/forecastle-frontend-runtime/node_modules
        - name: update go dependencies
          uses: go/bump@v2
          with:
            deps:
              - github.com/traefik/traefik/v2@v2.11.57
              - github.com/go-acme/lego/v4@v4.34.0
              - github.com/go-jose/go-jose/v4@v4.1.6
              - golang.org/x/net@v0.62.0
            download: true
        - uses: go/hermetic@v1
        - name: build forecastle
          uses: go/build@v1
          with:
            fips: false
            ldflags:
              - -s
              - -w
            output: ${target.dir}/usr/bin/forecastle
            packages: ./cmd/forecastle
        - name: build forecastle dev
          uses: go/build@v1
          with:
            fips: false
            ldflags:
              - -linkmode=internal
            output: ${target.dir}/usr/bin/forecastle-dev
            packages: ./cmd/forecastle
            strip: false
        - name: verify build info
          runs: |
            set -eux -o pipefail

            runtime="${target.dir}/usr/bin/forecastle"
            dev="${target.dir}/usr/bin/forecastle-dev"
            test -x "${runtime}"
            test -x "${dev}"

            go version -m "${runtime}" | grep -F "vcs.revision=09e1ee69697bd597dd24cf46a6b2e90eb08449cd"
            go version -m "${runtime}" | grep -F $'mod\tgithub.com/stakater/Forecastle/v1\t(devel)'
            go version -m "${dev}" | grep -F "vcs.revision=09e1ee69697bd597dd24cf46a6b2e90eb08449cd"
            go version -m "${dev}" | grep -F $'mod\tgithub.com/stakater/Forecastle/v1\t(devel)'
            go version -m "${runtime}" | grep -F $'dep\tgolang.org/x/crypto\tv0.58.0'
            go version -m "${runtime}" | grep -F $'dep\tgolang.org/x/net\tv0.62.0'
            go version -m "${runtime}" | grep -F $'dep\tgolang.org/x/text\tv0.43.0'
            go version -m "${runtime}" | grep -F $'dep\tgolang.org/x/sys\tv0.49.0'
            go version -m "${runtime}" | grep -F $'dep\tgithub.com/traefik/traefik/v2\tv2.11.57'
            go version -m "${runtime}" | grep -F $'dep\tgithub.com/go-jose/go-jose/v4\tv4.1.6'
            go version -m "${runtime}" | grep -F $'dep\tgithub.com/go-acme/lego/v5\tv5.2.2'

            runtime_ldflags=$(go version -m "${runtime}" | grep -F -- '-ldflags=')
            printf '%s\n' "${runtime_ldflags}" | grep -F -- '-s -w'
            dev_ldflags=$(go version -m "${dev}" | grep -F -- '-ldflags=')
            if printf '%s\n' "${dev_ldflags}" | grep -F -- '-s'; then
              echo "dev binary ldflags must not include -s" >&2
              exit 1
            fi

            if [ "false" = "true" ]; then
              grep -aqF 'crypto/internal/fips140/v' "${runtime}"
              grep -aqF 'crypto/internal/fips140/v' "${dev}"
            else
              if grep -aqF 'crypto/internal/fips140/v' "${runtime}"; then
                echo "runtime binary must not link the Go FIPS module" >&2
                exit 1
              fi
            fi
        - name: forecastle sbom
          uses: spdx@v1
          with:
            license: Apache-2.0
            name: forecastle
            purl: pkg:golang/github.com/stakater/Forecastle/v1@2.0.3
            version: 2.0.3
        - name: stage sbom
          runs: |
            set -eux -o pipefail

            test -f /opt/docker/sbom/forecastle/.spdx.forecastle.json
            test -f /opt/docker/sbom/forecastle-frontend/.spdx.forecastle-frontend.json
            install -d "${target.dir}/opt/docker/sbom" "${target.dir}/opt/docker/sbom-dev"
            cp -a /opt/docker/sbom/forecastle /opt/docker/sbom/forecastle-frontend "${target.dir}/opt/docker/sbom/"
            cp -a /opt/docker/sbom/forecastle /opt/docker/sbom/forecastle-frontend "${target.dir}/opt/docker/sbom-dev/"
        - uses: dhi/build-pkg:0
          with:
            description: Forecastle Kubernetes application dashboard
            files:
              - usr/bin/forecastle
              - opt/docker/sbom/forecastle
              - opt/docker/sbom/forecastle-frontend
            license: Apache-2.0
            name: stakater-forecastle-2
            rel: 0
            subpackages:
              - files:
                  - path: usr/bin/forecastle
                    source: usr/bin/forecastle-dev
                  - path: opt/docker/sbom/forecastle
                    source: opt/docker/sbom-dev/forecastle
                  - path: opt/docker/sbom/forecastle-frontend
                    source: opt/docker/sbom-dev/forecastle-frontend
                name: stakater-forecastle-2-dev
            url: https://github.com/stakater/Forecastle
            version: 2.0.3
      paths:
        - type: file
          path: ${source.dir}/patch/yarn-bumps.json
          uid: 0
          gid: 0
          source: package/main/stakater-forecastle/patch/yarn-bumps.json
os-release:
  name: Docker Hardened Images (Alpine)
  id: alpine
  version-id: "3.24"
  pretty-name: Docker Hardened Images/Alpine Linux v3.24
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
