# syntax=dhi.io/build:2-debian13

image: dhi.io/pkg-datascience-notebook
variant: runtime
tags:
  - 2026.07.28
  - 2026.07.28-r2
  - 2026.07.28-debian13
  - 2026.07.28-r2-debian13
platforms:
  - linux/amd64
  - linux/arm64
dates:
  release: "2026-07-28"
vars:
  COMMIT_SHA: c49624e35d4ffa670e5650f623880d1e210d980e
  JULIA_LINUX_ARCH: '#{ target.arch == "amd64" ? "x64" : "aarch64" }'
  JULIA_MAJOR_MINOR: "1.12"
  JULIA_SHA256: '#{ target.arch == "amd64" ? "bbabf3bef19421a9dbd24a767d807606ab85e444323b5a1c73ffe293fa3d079a" : "029b93b857bd0ffd627f9a8580d3bbaa63daf008d7b7aed02fbceb8fd57c4899" }'
  JULIA_SHA256_AARCH64: 029b93b857bd0ffd627f9a8580d3bbaa63daf008d7b7aed02fbceb8fd57c4899
  JULIA_SHA256_AMD64: bbabf3bef19421a9dbd24a767d807606ab85e444323b5a1c73ffe293fa3d079a
  JULIA_TRIPLET: '#{ target.arch == "amd64" ? "x86_64" : "aarch64" }'
  JULIA_VERSION: 1.12.6
  MAMBA_LINUX_ARCH: '#{ target.arch == "amd64" ? "64" : "aarch64" }'
  MAMBA_SHA256: '#{ target.arch == "amd64" ? "366cd9cd8be14df1ab8ed50352a82111082a36686b2d389fdb79a92c3fafb3e3" : "9f93b974adcb4d166996af969b6cd371287d1a3e52733704727884d9b74cb7a7" }'
  MAMBA_SHA256_AARCH64: 9f93b974adcb4d166996af969b6cd371287d1a3e52733704727884d9b74cb7a7
  MAMBA_SHA256_AMD64: 366cd9cd8be14df1ab8ed50352a82111082a36686b2d389fdb79a92c3fafb3e3
  MICROMAMBA_VERSION: 2.9.0-0
  PYTHON_MINOR: "3.13"
  PYTHON_VERSION: 3.13.15-1
  REL: "2"
  VERSION: 2026.07.28
contents:
  packages:
    - base-files
  builds:
    - name: datascience-notebook
      work-dir: ${source.dir}
      environment:
        CONDA_DIR: /opt/conda
        CONDA_PKGS_DIRS: /var/cache/conda-pkgs
        MAMBA_ROOT_PREFIX: /opt/conda
        PATH: /opt/conda/bin:/opt/julia-1.12.6/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
      caches:
        - path: /var/cache/conda-pkgs
      contents:
        repositories:
          - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
        keyring:
          - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
        packages:
          - bash
          - ca-certificates
          - coreutils
          - curl
          - git
          - gzip
          - tar
          - libpython-3.13-minimal=3.13.15-1
          - libpython-3.13-stdlib=3.13.15-1
          - libpython-3.13=3.13.15-1
          - python-3.13-minimal=3.13.15-1
          - python-3.13=3.13.15-1
          - python-3.13-dev=3.13.15-1
          - python3-pip
          - python3-setuptools
          - python3-wheel
          - libstdc++6
          - diffutils
          - findutils
          - gawk
          - grep
          - sed
          - build-essential
        files:
          - url: https://github.com/mamba-org/micromamba-releases/releases/download/2.9.0-0/micromamba-linux-${MAMBA_LINUX_ARCH}
            checksum: sha256:${MAMBA_SHA256}
            path: ${source.dir}/micromamba
            spdx:
              name: micromamba
              version: 2.9.0-0
              packages:
                - name: micromamba
                  purl: pkg:github/mamba-org/micromamba-releases@2.9.0-0
                  license: BSD-3-Clause
            uid: 0
            gid: 0
          - url: https://julialang-s3.julialang.org/bin/linux/${JULIA_LINUX_ARCH}/1.12/julia-1.12.6-linux-${JULIA_TRIPLET}.tar.gz
            checksum: sha256:${JULIA_SHA256}
            path: ${source.dir}/julia.tar.gz
            spdx:
              name: julia
              version: 1.12.6
              packages:
                - name: julia
                  purl: pkg:generic/julialang/julia@1.12.6
                  license: MIT
            uid: 0
            gid: 0
          - url: git+https://github.com/jupyter/docker-stacks.git#c49624e35d4ffa670e5650f623880d1e210d980e
            checksum: c49624e35d4ffa670e5650f623880d1e210d980e
            path: ${source.dir}/docker-stacks
            spdx:
              name: jupyter-docker-stacks
              version: c49624e35d4ffa670e5650f623880d1e210d980e
              packages:
                - name: jupyter-docker-stacks
                  purl: pkg:github/jupyter/docker-stacks@c49624e35d4ffa670e5650f623880d1e210d980e
                  license: BSD-3-Clause
            uid: 0
            gid: 0
      pipeline:
        - name: bootstrap micromamba
          runs: |
            set -eux -o pipefail

            install -m 0755 "${source.dir}/micromamba" /usr/bin/micromamba
            /usr/bin/micromamba --version
        - name: bootstrap conda env
          privileged: true
          runs: |
            set -eux -o pipefail

            mkdir -p /opt/conda
            cat > /opt/conda/.condarc << 'EOF'
            channels:
              - conda-forge
            channel_priority: strict
            EOF

            /usr/bin/micromamba install --yes \
              --root-prefix /opt/conda \
              --prefix /opt/conda \
              -c conda-forge \
              python=3.13 \
              mamba \
              'conda<26'

            rm -f /usr/bin/micromamba
        - name: install base-notebook packages
          privileged: true
          runs: |
            set -eux -o pipefail

            mamba install --yes -c conda-forge \
              fonts-conda-ecosystem \
              jupyterhub-singleuser \
              jupyterlab \
              nbclassic \
              "notebook>=7.2.2" \
              pandoc
        - name: install scipy-notebook packages
          privileged: true
          runs: |
            set -eux -o pipefail

            mamba install --yes -c conda-forge \
              altair \
              beautifulsoup4 \
              bokeh \
              bottleneck \
              cloudpickle \
              "conda-forge::blas=*=openblas" \
              cython \
              dask \
              dill \
              h5py \
              ipympl \
              ipywidgets \
              jupyterlab-git \
              matplotlib-base \
              numba \
              numexpr \
              openpyxl \
              pandas \
              patsy \
              protobuf \
              pytables \
              scikit-image \
              scikit-learn \
              scipy \
              seaborn \
              sqlalchemy \
              statsmodels \
              sympy \
              widgetsnbextension \
              xlrd
        - name: install R packages
          privileged: true
          runs: |
            set -eux -o pipefail

            mamba install --yes -c conda-forge \
              r-base \
              r-caret \
              r-crayon \
              r-devtools \
              r-e1071 \
              r-forecast \
              r-hexbin \
              r-htmltools \
              r-htmlwidgets \
              r-irkernel \
              r-nycflights13 \
              r-randomforest \
              r-rcurl \
              r-rmarkdown \
              r-rodbc \
              r-rsqlite \
              r-shiny \
              r-tidymodels \
              r-tidyverse \
              rpy2 \
              unixodbc \
              which
        - name: bump python deps for cve fixes
          privileged: true
          runs: |
            set -eux -o pipefail

            /opt/conda/bin/pip install --no-deps --upgrade 'python-json-logger>=3.3.0,<4.0.0'
            rm -f /opt/conda/conda-meta/python-json-logger-3.2.*.json

            /opt/conda/bin/pip install --no-deps --upgrade 'pyjwt>=2.13.0,<3.0.0'
            rm -f /opt/conda/conda-meta/pyjwt-2.12.*.json

            /opt/conda/bin/pip install --no-deps --upgrade 'aiohttp>=3.14.0'
            rm -f /opt/conda/conda-meta/aiohttp-3.13.*.json

            /opt/conda/bin/pip install --no-deps --upgrade 'msgpack>=1.2.1,<2.0.0'
            rm -f /opt/conda/conda-meta/msgpack-1.2.0.json

            /opt/conda/bin/pip install --no-deps --upgrade 'gitpython>=3.1.58,<4.0.0'
            rm -f /opt/conda/conda-meta/gitpython-3.1.5*.json

            /opt/conda/bin/pip install --no-deps --upgrade 'jupyterlab>=4.6.2,<5.0.0'
            rm -f /opt/conda/conda-meta/jupyterlab-4.6.1.json

            /opt/conda/bin/pip install --no-deps --upgrade 'h2>=4.4.1,<5.0.0'
            rm -f /opt/conda/conda-meta/h2-4.4.0.json

            /opt/conda/bin/pip install --no-deps --upgrade 'cryptography>=50.0.0'
            rm -f /opt/conda/conda-meta/cryptography-47.0.*.json
        - name: install julia
          runs: |
            set -eux -o pipefail

            mkdir -p /opt/julia-1.12.6
            tar -xf "${source.dir}/julia.tar.gz" \
              -C /opt/julia-1.12.6 \
              --strip-components=1
            /opt/julia-1.12.6/bin/julia --version
        - name: install julia packages
          privileged: true
          runs: |
            set -eux -o pipefail

            export JULIA_DEPOT_PATH=/opt/julia
            export JULIA_PKGDIR=/opt/julia
            export JULIA_NUM_THREADS=1
            export JULIA_PKG_PRECOMPILE_AUTO=0

            mkdir -p "$JULIA_DEPOT_PATH"

            julia -e 'using Pkg; Pkg.add(["HDF5", "IJulia", "Pluto"])'

            julia --compiled-modules=no -e '
              using IJulia
              IJulia.installkernel(
                "Julia",
                "--depwarn=no",
                env=Dict("JULIA_DEPOT_PATH"=>"/opt/julia:"),
                specname="julia",
              )
            '

            mkdir -p /opt/conda/share/jupyter/kernels
            if compgen -G "/root/.local/share/jupyter/kernels/julia*" > /dev/null; then
              mv /root/.local/share/jupyter/kernels/julia* /opt/conda/share/jupyter/kernels/
              chmod -R go+rx /opt/conda/share/jupyter
            fi

            mamba install --yes -c conda-forge jupyter-pluto-proxy
        - name: install start scripts and configs
          runs: |
            set -eux -o pipefail

            SRC=${source.dir}/docker-stacks/images
            PKG_LIB=/usr/lib/datascience-notebook

            mkdir -p \
              "${PKG_LIB}/bin" \
              "${PKG_LIB}/start-notebook.d" \
              "${PKG_LIB}/before-notebook.d"

            install -m 0755 -t "${PKG_LIB}/bin" \
              "$SRC/docker-stacks-foundation/start.sh" \
              "$SRC/docker-stacks-foundation/run-hooks.sh" \
              "$SRC/docker-stacks-foundation/fix-permissions" \
              "$SRC/docker-stacks-foundation/_docker_stacks_log.sh" \
              "$SRC/base-notebook/start-notebook.py" \
              "$SRC/base-notebook/start-notebook.sh" \
              "$SRC/base-notebook/start-singleuser.py" \
              "$SRC/base-notebook/start-singleuser.sh"

            install -m 0755 \
              "$SRC/docker-stacks-foundation/10activate-conda-env.sh" \
              "${PKG_LIB}/before-notebook.d/"

            for f in "${PKG_LIB}/bin/"*.sh "${PKG_LIB}/bin/"*.py; do
              [ -f "$f" ] || continue
              sed -i \
                -e 's|/usr/local/bin/start-notebook.d|/usr/lib/datascience-notebook/start-notebook.d|g' \
                -e 's|/usr/local/bin/before-notebook.d|/usr/lib/datascience-notebook/before-notebook.d|g' \
                -e 's|/usr/local/bin/|/usr/lib/datascience-notebook/bin/|g' \
                "$f"
            done

            mkdir -p /etc/jupyter
            install -m 0644 -t /etc/jupyter \
              "$SRC/base-notebook/jupyter_server_config.py" \
              "$SRC/base-notebook/docker_healthcheck.py"

            install -m 0644 \
              "$SRC/docker-stacks-foundation/initial-condarc" \
              /opt/conda/.condarc

            mkdir -p /opt/conda/lib/R/etc
            install -m 0644 \
              "$SRC/minimal-notebook/Rprofile.site" \
              /opt/conda/lib/R/etc/
        - name: prepare jovyan home
          runs: |
            set -eux -o pipefail

            mkdir -p /home/jovyan/work
            chown -R 1000:100 /home/jovyan
            chown -R 1000:100 /opt/julia
        - name: warm caches
          runs: |
            set -eux -o pipefail

            python -c 'import matplotlib.pyplot' || true
        - name: cleanup
          runs: |
            set -eux -o pipefail

            mamba clean --all --yes

            find /opt/conda \
              \( -type d -a \( -name __pycache__ -o -name tests -o -name test \) \
              -prune -exec rm -rf '{}' + \) \
              -o \( -type f -a \( -name '*.pyc' -o -name '*.pyo' \) \
              -exec rm -f '{}' + \)

            rm -rf \
              /opt/conda/pkgs \
              /opt/conda/share/doc/* \
              /opt/conda/share/man/* \
              /root/.cache \
              /opt/conda/lib/python*/site-packages/jupyterlab/staging \
              /opt/conda/lib/python*/site-packages/nbclassic/static/components

            find /opt/julia \
              \( -type d -name frontend-bundler -o -path '*/test/frontend' \) \
              -prune -exec rm -rf '{}' +
        - name: conda packages sbom
          uses: sbom@v1
          with:
            prefix: datascience-notebook-conda
            source: /opt/conda
        - name: create which symlink
          runs: |
            set -eux -o pipefail

            mkdir -p /usr/bin
            ln -sf /opt/conda/bin/which /usr/bin/which
        - name: stage package payload
          runs: |
            set -eux -o pipefail

            PKG_LIB=/usr/lib/datascience-notebook

            mkdir -p \
              "${target.dir}/opt" \
              "${target.dir}/usr/lib/datascience-notebook" \
              "${target.dir}/etc" \
              "${target.dir}/usr/bin" \
              "${target.dir}/opt/docker/sbom"

            cp -a /opt/conda "${target.dir}/opt/"
            cp -a "/opt/julia-1.12.6" "${target.dir}/opt/"
            cp -a /opt/julia "${target.dir}/opt/"
            cp -a "${PKG_LIB}/." "${target.dir}/usr/lib/datascience-notebook/"
            cp -a /etc/jupyter "${target.dir}/etc/"
            cp -a /opt/docker/sbom/. "${target.dir}/opt/docker/sbom/" 2> /dev/null || true
            ln -sf /opt/conda/bin/which "${target.dir}/usr/bin/which"

            for cmd in \
              start.sh \
              start-notebook.sh \
              start-singleuser.sh \
              start-notebook.py \
              start-singleuser.py; do
              ln -sf "../lib/datascience-notebook/bin/${cmd}" \
                "${target.dir}/usr/bin/${cmd}"
            done
        - uses: dhi/build-pkg:0
          with:
            depends:
              - bash
              - ca-certificates
              - coreutils
              - tini
            description: Jupyter Data Science Notebook with Python, R, and Julia
            files:
              - opt/conda
              - opt/julia
              - gid: 100
                path: opt/julia-1.12.6
                uid: 1000
              - usr/lib/datascience-notebook
              - usr/bin/start.sh
              - usr/bin/start-notebook.sh
              - usr/bin/start-singleuser.sh
              - usr/bin/start-notebook.py
              - usr/bin/start-singleuser.py
              - etc/jupyter
              - usr/bin/which
              - opt/docker/sbom
            formats:
              - deb
            license: BSD-3-Clause
            name: datascience-notebook
            rel: 2
            url: https://jupyter-docker-stacks.readthedocs.io/
            version: 2026.07.28
os-release:
  name: Docker Hardened Images (Debian)
  id: debian
  version-id: "13"
  version-codename: trixie
  pretty-name: Docker Hardened Images/Debian GNU/Linux 13 (trixie)
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
