        - name: bump python deps for cve fixes
          privileged: true
          runs: |
            set -eux -o pipefail

            /opt/conda/bin/pip install --no-deps --upgrade 'python-json-logger>=3.3.0,<4.0.0'
            rm -f /opt/conda/conda-meta/python-json-logger-3.2.*.json

            /opt/conda/bin/pip install --no-deps --upgrade 'pyjwt>=2.15.0,<3.0.0' # CVE-2026-101918
            rm -f /opt/conda/conda-meta/pyjwt-2.12.*.json /opt/conda/conda-meta/pyjwt-2.14.*.json

            /opt/conda/bin/pip install --no-deps --upgrade 'urllib3==2.8.0' # CVE-2026-97687 CVE-2026-97688 CVE-2026-97689
            rm -f /opt/conda/conda-meta/urllib3-2.7.*.json

            /opt/conda/bin/pip install --no-deps --upgrade 'multidict==6.9.1' # CVE-2026-104874
            rm -f /opt/conda/conda-meta/multidict-6.7.*.json /opt/conda/conda-meta/multidict-6.8.*.json /opt/conda/conda-meta/multidict-6.9.0*.json

            /opt/conda/bin/pip install --no-deps --upgrade 'aiohttp>=3.14.0'
            rm -f /opt/conda/conda-meta/aiohttp-3.13.*.json

            /opt/conda/bin/pip install --no-deps --upgrade 'msgpack>=1.2.3,<2.0.0' # CVE-2026-114613
            for _meta in /opt/conda/conda-meta/msgpack-1.1.*.json; do
              [ -e "$_meta" ] && rm -f "$_meta"
            done
            rm -f /opt/conda/conda-meta/msgpack-1.2.0.json

            /opt/conda/bin/pip install --no-deps --upgrade 'gitpython>=3.1.58,<4.0.0'
            rm -f /opt/conda/conda-meta/gitpython-3.1.5*.json

            /opt/conda/bin/pip install --no-deps --upgrade 'jupyterlab>=4.6.2,<5.0.0'
            rm -f /opt/conda/conda-meta/jupyterlab-4.6.1.json

            /opt/conda/bin/pip install --no-deps --upgrade 'h2>=4.4.1,<5.0.0'
            rm -f /opt/conda/conda-meta/h2-4.4.0.json

            /opt/conda/bin/pip install --no-deps --upgrade 'cryptography>=50.0.0'
            rm -f /opt/conda/conda-meta/cryptography-47.0.*.json

            /opt/conda/bin/pip install --no-deps --upgrade 'oauthlib>=4.0.0,<5.0.0' # CVE-2026-49264 CVE-2026-49265
            rm -f /opt/conda/conda-meta/oauthlib-3.*.json

            /opt/conda/bin/pip install --no-deps --upgrade 'certifi==2026.10.19' # GHSA-6q48-6c7w-9gw2
            rm -f /opt/conda/conda-meta/certifi-2026.6.*.json /opt/conda/conda-meta/certifi-2026.7.*.json /opt/conda/conda-meta/certifi-2026.8.*.json /opt/conda/conda-meta/certifi-2026.9.*.json

            /opt/conda/bin/pip install --no-deps --upgrade 'brotli==1.2.1' # CVE-2026-111497 GHSA-9v8h-qqgm-4m35
            rm -f /opt/conda/conda-meta/brotli-1.2.0*.json /opt/conda/conda-meta/brotli-1.1.*.json

            /opt/conda/bin/pip install --no-deps --upgrade 'pillow==13.0.0' # CVE-2026-96636 CVE-2026-96637 CVE-2026-96638 CVE-2026-96639 CVE-2026-96640 CVE-2026-96641 CVE-2026-96642 CVE-2026-96643 CVE-2026-96644 CVE-2026-96778 CVE-2026-112390 CVE-2026-112391 CVE-2026-112392 CVE-2026-112393 CVE-2026-112394 CVE-2026-112395 CVE-2026-112396 CVE-2026-112397 CVE-2026-112398 CVE-2026-112399 CVE-2026-112400 CVE-2026-112401 CVE-2026-112402 CVE-2026-112403 CVE-2026-112404 CVE-2026-112405 CVE-2026-112406 CVE-2026-114501 CVE-2026-112891 CVE-2026-112892 CVE-2026-112893 CVE-2026-112894 CVE-2026-112895 CVE-2026-112896 CVE-2026-112897 CVE-2026-112898 CVE-2026-112899 CVE-2026-112900 CVE-2026-112901 CVE-2026-112902 GHSA-78G4-XQWV-Q3G8
            rm -f /opt/conda/conda-meta/pillow-12.*.json

            /opt/conda/bin/pip install --no-deps --upgrade 'setuptools==84.2.1' # GHSA-XMJ3-9GF7-H52W
            rm -f /opt/conda/conda-meta/setuptools-7*.json /opt/conda/conda-meta/setuptools-8[0-3]*.json
            sp=$(echo /opt/conda/lib/python*/site-packages)
            for meta in /opt/conda/conda-meta/setuptools-*.json; do
              [ -e "$meta" ] || continue
              case "$meta" in
                *84.2.1*) ;;
                *) rm -f "$meta" ;;
              esac
            done
            for dist in "$sp"/setuptools-*.dist-info; do
              [ -e "$dist" ] || continue
              case "$dist" in
                *84.2.1*) ;;
                *) rm -rf "$dist" ;;
              esac
            done

            /opt/conda/bin/pip install --no-deps --upgrade 'tornado==6.6' # CVE-2026-115927 CVE-2026-116577 CVE-2026-116578
            rm -f /opt/conda/conda-meta/tornado-6.5.*.json
        - name: align pip vendored urllib3 and msgpack with site packages
          runs: |
            set -eux -o pipefail

            sp=$(echo /opt/conda/lib/python*/site-packages)
            urllib3_ver=$(python3 -c 'import importlib.metadata as m; print(m.version("urllib3"))')
            msgpack_ver=$(python3 -c 'import importlib.metadata as m; print(m.version("msgpack"))')

            rm -rf "$sp/pip/_vendor/urllib3"
            cp -a "$sp/urllib3" "$sp/pip/_vendor/urllib3"
            sed -i "s/urllib3==.*/urllib3==${urllib3_ver}/" "$sp/pip/_vendor/vendor.txt"

            rm -rf "$sp/pip/_vendor/msgpack"
            cp -a "$sp/msgpack" "$sp/pip/_vendor/msgpack"
            sed -i "s/^msgpack==.*/msgpack==${msgpack_ver}/" "$sp/pip/_vendor/vendor.txt"

            if [ -f "$sp/pip/_vendor/bom.cdx.json" ]; then
              python3 - "$sp/pip/_vendor/bom.cdx.json" "$urllib3_ver" "$msgpack_ver" << 'PY'
            import json
            import sys

            path, urllib3_ver, msgpack_ver = sys.argv[1:4]
            with open(path, encoding="utf-8") as handle:
                doc = json.load(handle)

            def bump(component, new_ver):
                old_ref = None
                new_ref = f"pkg:pypi/{component}@{new_ver}"
                for comp in doc.get("components") or []:
                    if comp.get("name") != component:
                        continue
                    old_purl = comp.get("purl") or ""
                    if old_purl.startswith(f"pkg:pypi/{component}@") and old_purl != new_ref:
                        old_ref = old_purl
                    comp["version"] = new_ver
                    comp["purl"] = new_ref
                    comp["bom-ref"] = new_ref
                if old_ref is None:
                    return
                for dep in doc.get("dependencies") or []:
                    if dep.get("ref") == old_ref:
                        dep["ref"] = new_ref
                    depends = dep.get("dependsOn")
                    if isinstance(depends, list):
                        dep["dependsOn"] = [
                            new_ref if item == old_ref else item for item in depends
                        ]
                rendered = json.dumps(doc)
                if old_ref in rendered:
                    raise SystemExit(f"stale {old_ref} remains in pip vendor bom")

            bump("urllib3", urllib3_ver)
            bump("msgpack", msgpack_ver)
            with open(path, "w", encoding="utf-8") as handle:
                json.dump(doc, handle, indent=2)
                handle.write("\n")
            PY
            fi
            grep -F "urllib3==${urllib3_ver}" "$sp/pip/_vendor/vendor.txt"
            grep -F "msgpack==${msgpack_ver}" "$sp/pip/_vendor/vendor.txt"
            grep -F "pkg:pypi/msgpack@${msgpack_ver}" "$sp/pip/_vendor/bom.cdx.json"
            if grep -E 'msgpack@1\.1\.2|pkg:pypi/msgpack@1\.1\.2' "$sp/pip/_vendor/bom.cdx.json"; then
              echo "pip vendor bom still names msgpack 1.1.2" >&2
              exit 1
            fi
        - name: drop pip vendored pkg_resources
          runs: |
            set -eux -o pipefail

            sp=$(echo /opt/conda/lib/python*/site-packages)
            rm -rf "$sp/pip/_vendor/pkg_resources" "$sp/pip/_vendor/setuptools"
            sed -i '/^setuptools==/d' "$sp/pip/_vendor/vendor.txt"
            python3 - "$sp/pip/_vendor/bom.cdx.json" << 'PY'
            import json
            import sys

            path = sys.argv[1]
            with open(path, encoding="utf-8") as handle:
                doc = json.load(handle)

            def is_setuptools_ref(value):
                return isinstance(value, str) and value.startswith("pkg:pypi/setuptools@")

            doc["components"] = [
                comp for comp in (doc.get("components") or [])
                if comp.get("name") != "setuptools"
            ]
            kept = []
            for dep in doc.get("dependencies") or []:
                if is_setuptools_ref(dep.get("ref")):
                    continue
                depends = dep.get("dependsOn")
                if isinstance(depends, list):
                    dep["dependsOn"] = [item for item in depends if not is_setuptools_ref(item)]
                kept.append(dep)
            doc["dependencies"] = kept
            rendered = json.dumps(doc)
            if "setuptools" in rendered:
                raise SystemExit("setuptools remains in pip vendor bom")
            with open(path, "w", encoding="utf-8") as handle:
                json.dump(doc, handle, indent=2)
                handle.write("\n")
            PY
            if grep -E 'setuptools==|pkg:pypi/setuptools@' "$sp/pip/_vendor/vendor.txt" "$sp/pip/_vendor/bom.cdx.json"; then
              echo "pip vendor metadata still names setuptools" >&2
              exit 1
            fi
            test ! -e "$sp/pip/_vendor/pkg_resources"
            PYTHONPATH="$sp" python3 -m pip --version
        - name: install julia
          runs: |
            set -eux -o pipefail

            mkdir -p /opt/julia-1.12.6
            tar -xf "${source.dir}/julia.tar.gz" \
              -C /opt/julia-1.12.6 \
              --strip-components=1
            /opt/julia-1.12.6/bin/julia --version
        - name: install julia packages
          privileged: true
          runs: |
            set -eux -o pipefail

            export JULIA_DEPOT_PATH=/opt/julia
            export JULIA_PKGDIR=/opt/julia
            export JULIA_NUM_THREADS=1
            export JULIA_PKG_PRECOMPILE_AUTO=0

            mkdir -p "$JULIA_DEPOT_PATH"

            julia -e 'using Pkg; Pkg.add(["HDF5", "IJulia", "Pluto"])'

            julia --compiled-modules=no -e '
              using IJulia
              IJulia.installkernel(
                "Julia",
                "--depwarn=no",
                env=Dict("JULIA_DEPOT_PATH"=>"/opt/julia:"),
                specname="julia",
              )
            '

            mkdir -p /opt/conda/share/jupyter/kernels
            if compgen -G "/root/.local/share/jupyter/kernels/julia*" > /dev/null; then
              mv /root/.local/share/jupyter/kernels/julia* /opt/conda/share/jupyter/kernels/
              chmod -R go+rx /opt/conda/share/jupyter
            fi

            mamba install --yes -c conda-forge jupyter-pluto-proxy
        - name: install start scripts and configs
          runs: |
            set -eux -o pipefail

            SRC=${source.dir}/docker-stacks/images
            PKG_LIB=/usr/lib/datascience-notebook

            mkdir -p \
              "${PKG_LIB}/bin" \
              "${PKG_LIB}/start-notebook.d" \
              "${PKG_LIB}/before-notebook.d"

            install -m 0755 -t "${PKG_LIB}/bin" \
              "$SRC/docker-stacks-foundation/start.sh" \
              "$SRC/docker-stacks-foundation/run-hooks.sh" \
              "$SRC/docker-stacks-foundation/fix-permissions" \
              "$SRC/docker-stacks-foundation/_docker_stacks_log.sh" \
              "$SRC/base-notebook/start-notebook.py" \
              "$SRC/base-notebook/start-notebook.sh" \
              "$SRC/base-notebook/start-singleuser.py" \
              "$SRC/base-notebook/start-singleuser.sh"

            install -m 0755 \
              "$SRC/docker-stacks-foundation/10activate-conda-env.sh" \
              "${PKG_LIB}/before-notebook.d/"

            for f in "${PKG_LIB}/bin/"*.sh "${PKG_LIB}/bin/"*.py; do
              [ -f "$f" ] || continue
              sed -i \
                -e 's|/usr/local/bin/start-notebook.d|/usr/lib/datascience-notebook/start-notebook.d|g' \
                -e 's|/usr/local/bin/before-notebook.d|/usr/lib/datascience-notebook/before-notebook.d|g' \
                -e 's|/usr/local/bin/|/usr/lib/datascience-notebook/bin/|g' \
                "$f"
            done

            mkdir -p /etc/jupyter
            install -m 0644 -t /etc/jupyter \
              "$SRC/base-notebook/jupyter_server_config.py" \
              "$SRC/base-notebook/docker_healthcheck.py"

            install -m 0644 \
              "$SRC/docker-stacks-foundation/initial-condarc" \
              /opt/conda/.condarc

            mkdir -p /opt/conda/lib/R/etc
            install -m 0644 \
              "$SRC/minimal-notebook/Rprofile.site" \
              /opt/conda/lib/R/etc/
        - name: prepare jovyan home
          runs: |
            set -eux -o pipefail

            mkdir -p /home/jovyan/work
            chown -R 1000:100 /home/jovyan
            chown -R 1000:100 /opt/julia
        - name: warm caches
          runs: |
            set -eux -o pipefail

            python -c 'import matplotlib.pyplot' || true
        - name: cleanup
          runs: |
            set -eux -o pipefail

            mamba clean --all --yes

            find /opt/conda \
              \( -type d -a \( -name __pycache__ -o -name tests -o -name test \) \
              -prune -exec rm -rf '{}' + \) \
              -o \( -type f -a \( -name '*.pyc' -o -name '*.pyo' \) \
              -exec rm -f '{}' + \)

            rm -rf \
              /opt/conda/pkgs \
              /opt/conda/share/doc/* \
              /opt/conda/share/man/* \
              /root/.cache \
              /opt/conda/lib/python*/site-packages/jupyterlab/staging \
              /opt/conda/lib/python*/site-packages/nbclassic/static/components

            find /opt/julia \
              \( -type d -name frontend-bundler -o -path '*/test/frontend' \) \
              -prune -exec rm -rf '{}' +
        - name: conda packages sbom
          uses: sbom@v1
          with:
            extra-scanners: python-package-cataloger,javascript-package-cataloger
            prefix: datascience-notebook-conda
            source: /opt/conda
        - name: create which symlink
          runs: |
            set -eux -o pipefail

            mkdir -p /usr/bin
            ln -sf /opt/conda/bin/which /usr/bin/which
        - name: stage package payload
          runs: |
            set -eux -o pipefail

            PKG_LIB=/usr/lib/datascience-notebook

            mkdir -p \
              "${target.dir}/opt" \
              "${target.dir}/usr/lib/datascience-notebook" \
              "${target.dir}/etc" \
