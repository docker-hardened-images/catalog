# syntax=dhi.io/build:2-alpine3.24

image: dhi.io/pkg-go-kube-downscaler
variant: runtime
tags:
  - 1.4.2-alpine3.24
  - 1.4.2-r2-alpine3.24
platforms:
  - linux/amd64
  - linux/arm64
vars:
  COMMIT_SHA: 00510b00514550d221a0743fdc2bf484e167fc86
  GOLANG_VERSION: 1.26.10-r0
  REL: "2"
  SEMVER_MAJOR_MINOR_VERSION: "1.4"
  SEMVER_MAJOR_VERSION: "1"
  SEMVER_VERSION: 1.4.2
  VERSION: 1.4.2
contents:
  repositories:
    - https://dhi.io/apk/alpine/v3.24/main
    - https://dhi.io/apk/alpine/v3.23/main
    - https://dl-cdn.alpinelinux.org/alpine/v3.24/main
    - https://dl-cdn.alpinelinux.org/alpine/v3.24/community
  keyring:
    - https://dhi.io/keyring/dhi-apk@docker-0F81AD7700D99184.rsa.pub
  packages:
    - alpine-baselayout-data
  builds:
    - name: go-kube-downscaler
      work-dir: /go/src/github.com/caas-team/gokubedownscaler
      contents:
        packages:
          - busybox
          - bash
          - ca-certificates-bundle
          - coreutils
          - findutils
          - mawk
          - sed
          - golang-1.26=1.26.10-r0
          - golang-1.26-oci-config=1.26.10-r0
        files:
          - url: git+https://github.com/caas-team/GoKubeDownscaler.git#v1.4.2
            checksum: 00510b00514550d221a0743fdc2bf484e167fc86
            path: /go/src/github.com/caas-team/gokubedownscaler
            spdx:
              name: gokubedownscaler
              version: 1.4.2
              packages:
                - name: gokubedownscaler
                  purl: pkg:golang/github.com/caas-team/gokubedownscaler@1.4.2
                  license: GPL-3.0-only
            uid: 0
            gid: 0
      pipeline:
        - name: update go dependencies
          uses: go/bump@v2
          with:
            deps:
              - golang.org/x/net@v0.62.0
            download: true
        - uses: go/hermetic@v1
        - name: stamp module version
          runs: |
            set -eux -o pipefail

            src=/go/src/github.com/caas-team/gokubedownscaler
            test -f "$src/go.mod"
            test -f "$src/go.sum"
            go_line=$(awk '$1=="go"{print $2; exit}' "$src/go.mod")
            test -n "$go_line"

            mkdir -p /go/src/dhi-gokubedownscaler-build
            cd /go/src/dhi-gokubedownscaler-build
            go mod init dhi.build.gokubedownscaler
            go mod edit -go="$go_line"
            go mod edit -require=github.com/caas-team/gokubedownscaler@v1.4.2
            go mod edit -replace=github.com/caas-team/gokubedownscaler="$src"
            cp "$src/go.sum" go.sum
            grep -q 'github.com/caas-team/gokubedownscaler v1.4.2' go.mod
        - name: build
          uses: go/build@v1
          work-dir: /go/src/dhi-gokubedownscaler-build
          with:
            cgo_enabled: 0
            extra-env: GOPROXY=off GOSUMDB=off GOFLAGS=-mod=mod
            fips: false
            ldflags:
              - -s
              - -w
            output: ${target.dir}/usr/bin/gokubedownscaler
            packages: github.com/caas-team/gokubedownscaler/cmd/kubedownscaler
        - name: build dev
          uses: go/build@v1
          work-dir: /go/src/dhi-gokubedownscaler-build
          with:
            cgo_enabled: 0
            extra-env: GOPROXY=off GOSUMDB=off GOFLAGS=-mod=mod
            fips: false
            ldflags:
              - -checklinkname=1
            output: ${target.dir}/usr/bin/gokubedownscaler-dev
            packages: github.com/caas-team/gokubedownscaler/cmd/kubedownscaler
            strip: false
        - name: verify module version and ldflags
          runs: |
            set -eux -o pipefail

            runtime=${target.dir}/usr/bin/gokubedownscaler
            devbin=${target.dir}/usr/bin/gokubedownscaler-dev
            test -x "$runtime"
            test -x "$devbin"

            go version -m "$runtime" | grep -F "$(printf 'mod\tgithub.com/caas-team/gokubedownscaler\tv%s' '1.4.2')"
            go version -m "$runtime" | grep -F -- '-s'
            go version -m "$runtime" | grep -F -- '-w'
            go version -m "$runtime" | grep -F -- '-trimpath'

            go version -m "$devbin" | grep -F "$(printf 'mod\tgithub.com/caas-team/gokubedownscaler\tv%s' '1.4.2')"
            if go version -m "$devbin" | grep -E -- '-ldflags=.*-s|-ldflags=.*-w'; then
              echo "dev binary must not be built with -s or -w" >&2
              exit 1
            fi
        - name: record module sbom
          uses: spdx@v1
          with:
            license: GPL-3.0-only
            name: gokubedownscaler
            purl: pkg:golang/github.com/caas-team/gokubedownscaler@1.4.2
            version: 1.4.2
        - name: stage sbom
          runs: |
            set -eux -o pipefail

            test -s /opt/docker/sbom/gokubedownscaler/.spdx.gokubedownscaler.json
            install -d "${target.dir}/opt/docker/sbom"
            cp -a /opt/docker/sbom/gokubedownscaler "${target.dir}/opt/docker/sbom/"
            test -s "${target.dir}/opt/docker/sbom/gokubedownscaler/.spdx.gokubedownscaler.json"
        - name: stage license
          runs: |
            set -eux -o pipefail

            src=/go/src/github.com/caas-team/gokubedownscaler/LICENSE
            dest="${target.dir}/usr/share/licenses/go-kube-downscaler/LICENSE"
            devdest="${target.dir}/usr/share/licenses/go-kube-downscaler-dev/LICENSE"
            test -s "$src"
            grep -q 'GNU GENERAL PUBLIC LICENSE' "$src"
            grep -q 'Version 3' "$src"
            install -d "$(dirname "$dest")" "$(dirname "$devdest")"
            install -m644 "$src" "$dest"
            install -m644 "$src" "$devdest"
            test -s "$dest"
            test -s "$devdest"
            grep -q 'GNU GENERAL PUBLIC LICENSE' "$dest"
            grep -q 'GNU GENERAL PUBLIC LICENSE' "$devdest"
        - uses: dhi/build-pkg:0
          with:
            description: Scale Kubernetes workloads down during downtime
            files:
              - usr/bin/gokubedownscaler
              - opt/docker/sbom/gokubedownscaler
              - usr/share/licenses/go-kube-downscaler/LICENSE
            license: GPL-3.0-only
            name: go-kube-downscaler-1
            rel: 2
            subpackages:
              - files:
                  - path: usr/bin/gokubedownscaler
                    source: usr/bin/gokubedownscaler-dev
                  - path: usr/share/licenses/go-kube-downscaler/LICENSE
                    source: usr/share/licenses/go-kube-downscaler-dev/LICENSE
                name: go-kube-downscaler-1-dev
            url: https://github.com/caas-team/GoKubeDownscaler
            version: 1.4.2
os-release:
  name: Docker Hardened Images (Alpine)
  id: alpine
  version-id: "3.24"
  pretty-name: Docker Hardened Images/Alpine Linux v3.24
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
