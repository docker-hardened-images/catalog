# syntax=dhi.io/build:2-debian13

image: dhi.io/pkg-langfuse-worker
variant: runtime
tags:
  - 4.71.0-0
  - 4.71.0-0-debian13
platforms:
  - linux/amd64
  - linux/arm64
dates:
  release: "2026-07-29"
vars:
  CARGO_VERSION: 1.98.1-0
  COMMIT_SHA: d89f49b82620dc9a773bd2f97449289f4f6c199e
  DHI_REL: "0"
  DHI_VERSION: 4.71.0-0
  NODEJS_MAJOR: "24"
  NODEJS_VERSION: 24.22.2-0
  PNPM_VERSION: 12.8.2
  RUSTC_VERSION: 1.98.1-0
  SEMVER_MAJOR_MINOR_VERSION: "4.71"
  SEMVER_MAJOR_VERSION: "4"
  SEMVER_VERSION: 4.71.0
  TURBO_VERSION: 2.11.6
  VERSION: 4.71.0
contents:
  packages:
    - '!base-files'
  builds:
    - name: langfuse-worker deb
      work-dir: ${source.dir}/langfuse-worker
      environment:
        CI: "true"
        DOCKER_BUILD: "1"
        PNPM_HOME: /pnpm
        PNPM_VERSION: 12.8.2
        SEMVER_MAJOR_VERSION: "4"
      caches:
        - path: /pnpm/store
        - path: /root/.cache
        - path: /root/.cargo
      contents:
        repositories:
          - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
        keyring:
          - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
        packages:
          - bash
          - build-essential
          - ca-certificates
          - cargo-1.98=1.98.1-0
          - coreutils
          - curl
          - debhelper
          - dpkg-dev
          - findutils
          - git
          - nodejs-24=24.22.2-0
          - npm
          - node-corepack
          - patch
          - rustc-1.98=1.98.1-0
          - tar
          - yq
        files:
          - url: git+https://github.com/langfuse/langfuse.git#v4.71.0
            checksum: d89f49b82620dc9a773bd2f97449289f4f6c199e
            path: ${source.dir}/src
            spdx:
              name: langfuse-worker
              version: 4.71.0
              packages:
                - name: langfuse-worker
                  purl: pkg:github/langfuse/langfuse@4.71.0
                  license: MIT
            uid: 0
            gid: 0
      pipeline:
        - name: prune and patch worker source
          privileged: true
          runs: |
            set -eux -o pipefail

            # Install turbo before entering the source tree: npm 11 enforces the
            # repo's devEngines (pnpm) on any npm command run inside it and would
            # refuse `npm config get prefix` with EBADDEVENGINES.
            npm install -g --no-package-lock --no-save turbo@2.11.6
            export PATH="$(npm config get prefix)/bin:${PATH}"

            cd "${source.dir}/src"

            corepack enable
            corepack prepare pnpm@12.8.2 --activate

            turbo prune --scope=worker --docker

            cd ./out
            cp -a json/. .
            # overlay full source before patching package.json, else it clobbers the override
            cp -a full/. .

            # CVE remediation via pnpm overrides; build installs non-frozen
            node -e '
              const fs = require("fs");
              const p = JSON.parse(fs.readFileSync("package.json", "utf8"));
              p.pnpm = p.pnpm || {};
              Object.assign(p.pnpm.overrides = p.pnpm.overrides || {}, {
                "axios@>=1.0.0 <1.20.0": "1.20.0", // CVE-2026-101898 through CVE-2026-101909
                // range selector: bare @0.1 missed the express-nested 0.1.10 on pnpm 9
                "path-to-regexp@<0.1.13": "0.1.13", // CVE-2024-52798, CVE-2026-4867 (HIGH, ReDoS)
                "handlebars": "4.7.9", // CVE-2026-33937 (CRIT),33938,33939,33940,33941 (HIGH)
                "kysely": "0.28.17", // CVE-2026-32763,33468,44635 (HIGH, SQLi)
                "next-auth@>=4.0.0 <4.24.15": "4.24.15", // GHSA-7rqj-j65f-68wh (CRIT), GHSA-xmf8-cvqr-rfgj (HIGH), GHSA-x445-f3h2-j279 (MEDIUM)
                "path-to-regexp@8": "8.4.0", // CVE-2026-4926 (HIGH, ReDoS), CVE-2026-4923
                "js-yaml@4": "4.3.2", // CVE-2026-84375 and earlier js-yaml advisories
                "zod@>=4.0.0 <4.6.6": "4.6.6", // CVE-2023-54404
                "uuid@>=9.0.0 <11.1.1": "11.1.1", // CVE-2026-41907
                "uuid@>=13.0.0 <13.0.1": "13.0.1", // CVE-2026-41907
                "nanoid@>=3.0.0 <3.3.18": "3.3.18", // CVE-2026-67213 (HIGH, infinite loop DoS)
                "@opentelemetry/core@2": "2.8.0", // CVE-2026-54285 (DoS)
                "protobufjs@7": "7.6.5", // CVE-2026-54269 (uncontrolled recursion), CVE-2026-59877
                "lodash": "4.18.1", // CVE-2025-13465, CVE-2026-2950 (MEDIUM, prototype pollution)
                "postcss@>=8.0.0 <8.5.25": "8.5.25", // CVE-2026-41305 (MEDIUM, XSS), CVE-2026-45623, CVE-2026-69153, GHSA-r28c-9q8g-f849 (HIGH)
                "@babel/runtime@7": "7.26.10", // CVE-2025-27789 (MEDIUM, ReDoS)
                "cookie@<0.7.0": "0.7.0", // CVE-2024-47764 (LOW, CRLF injection)
                "qs@<6.16.1": "6.16.1", // CVE-2026-82417, CVE-2026-82562, CVE-2025-15284, CVE-2026-2391, CVE-2026-8723, CVE-2026-110816
                "fast-xml-parser@>=4.0.0 <5.7.0": "5.7.0", // CVE-2026-27942, CVE-2026-33349, CVE-2026-41650 (MEDIUM, comment/CDATA injection)
                "fast-uri@>=3.0.0 <3.1.9": "3.1.9", // CVE-2026-75899,75931,75975,76172,84292,86472 and later advisories
                "sharp@<0.35.5": "0.35.5", // GHSA-wq5f-xc86-pv6w
                "@modelcontextprotocol/sdk@>=1.12.0 <1.32.0": "1.32.0", // CVE-2026-104850 and later SDK advisories
                "nodemailer@>=9.0.0 <10.1.4": "10.1.4", // lifts vulnerable 9.x and 10.0.x copies
                "next@>=16.0.0 <16.4.1": "16.4.1", // GHSA-2464-fhr4-w9xw, GHSA-673q-mjm6-r5xr (CRITICAL), CVE-2026-94482 (HIGH)
                "undici@7": "7.30.1", // CVE-2026-19534, CVE-2026-84961 and later undici advisories
                "follow-redirects@>=1.0.0 <1.16.1": "1.16.1", // CVE-2026-111755, CVE-2026-111756
                "yaml@>=1.0.0 <1.10.3": "1.10.3", // CVE-2026-33532 (MEDIUM, stack overflow)
                "yaml@>=2.0.0 <2.8.3": "2.8.3", // CVE-2026-33532 (MEDIUM, stack overflow)
                "dd-trace@>=5.0.0 <5.131.1": "5.131.1", // CVE-2026-50272, CVE-2026-116693 (HIGH)
                "@hono/node-server@<1.19.15": "1.19.17", // GHSA-frvp-7c67-39w9
                "brace-expansion@>=2.0.0 <2.1.4": "2.1.4", // CVE-2026-13149, CVE-2026-14257, CVE-2026-69152 (HIGH)
                "body-parser@>=1.0.0 <1.20.6": "1.20.6", // CVE-2026-12590 (LOW)
                "body-parser@>=2.0.0 <2.4.0": "2.4.0", // CVE-2026-111181
                "@smithy/config-resolver@>=4.0.0 <4.4.0": "4.4.0", // GHSA-6475-r3vj-m8vf (LOW)
              });
              const patchedDependencies = p.pnpm.patchedDependencies || {};
              if (patchedDependencies["next-auth@4.24.11"]) {
                patchedDependencies["next-auth@4.24.15"] = patchedDependencies["next-auth@4.24.11"];
                delete patchedDependencies["next-auth@4.24.11"];
                p.pnpm.patchedDependencies = patchedDependencies;
              }
              fs.writeFileSync("package.json", JSON.stringify(p, null, 2) + "\n");
            '

            # pnpm 10+ reads overrides from pnpm-workspace.yaml, not package.json.
            # Mirror the map, then drop package.json pnpm.overrides: pnpm 12 refuses
            # to run while that field is still present.
            PNPM_OVERRIDES="$(
              node -e '
                const fs = require("fs");
                const p = JSON.parse(fs.readFileSync("package.json", "utf8"));
                process.stdout.write(JSON.stringify((p.pnpm || {}).overrides || {}));
              '
            )"
            export PNPM_OVERRIDES
            yq -y -i \
              '.overrides = ((.overrides // {}) * (env.PNPM_OVERRIDES | fromjson))' \
              pnpm-workspace.yaml
            if yq -e '.patchedDependencies."next-auth@4.24.14"' pnpm-workspace.yaml > /dev/null; then
              yq -y -i \
                '.patchedDependencies."next-auth@4.24.15" = .patchedDependencies."next-auth@4.24.14" | del(.patchedDependencies."next-auth@4.24.14")' \
                pnpm-workspace.yaml
            fi

            node -e '
              const fs = require("fs");
              const p = JSON.parse(fs.readFileSync("package.json", "utf8"));
              if (p.pnpm && p.pnpm.overrides) {
                delete p.pnpm.overrides;
                if (Object.keys(p.pnpm).length === 0) delete p.pnpm;
                fs.writeFileSync("package.json", JSON.stringify(p, null, 2) + "\n");
              }
            '

            # stage pruned workspace as the deb source tree
            rm -rf "${source.dir}/langfuse-worker/worker-src"
            mkdir -p "${source.dir}/langfuse-worker/worker-src"
            cp -a . "${source.dir}/langfuse-worker/worker-src/"
        - name: prepare debian metadata
          runs: |
            set -eux -o pipefail

            cd "${source.dir}/langfuse-worker"
            # per-major name: substitute in control + changelog (dpkg reads the
            # source name from changelog), then rename the matching .install
            sed -i "s/@MAJOR@/4/g" debian/control.in debian/changelog
            mv debian/control.in debian/control
            mv debian/langfuse-worker.install "debian/langfuse-worker-4.install"
        - name: strip Go-native TypeScript from the production bundle
          uses: patch@v1
          work-dir: ${source.dir}/langfuse-worker
          with:
            options: -p1
            patches:
              - ${source.dir}/patch/langfuse-worker-4-strip-go-native-typescript.patch
        - uses: dpkg/bump@v1
          with:
            version: 4.71.0-0
        - name: configure pnpm to allow recently-published packages
          runs: |
            set -eux -o pipefail

            # pnpm minimumReleaseAge policy can block newly-published CVE fixes;
            # allow the fixed versions pinned above.
            # pnpm >=10 reads minimumReleaseAge from pnpm-workspace.yaml, not .npmrc.
            yq -y -i '.minimumReleaseAgeExclude += ["axios@1.20.0", "body-parser@2.4.0", "dd-trace@5.131.1", "fast-uri@3.1.9", "follow-redirects@1.16.1", "@hono/node-server@1.19.17", "js-yaml@4.3.2", "nanoid@3.3.18", "sharp@0.35.5", "@modelcontextprotocol/sdk@1.32.0", "undici@7.30.1", "nodemailer@10.1.4", "next@16.4.1", "postcss@8.5.25", "qs@6.16.1", "zod@4.6.6"]' "${source.dir}/langfuse-worker/worker-src/pnpm-workspace.yaml"
        - uses: dpkg/build@v1
          privileged: true
          with:
            args: -b -uc -us -d
      paths:
        - type: directory
          path: ${source.dir}/langfuse-worker/debian
          uid: 0
          gid: 0
          mode: "0600"
          source: package/main/langfuse-worker/debian-13/debian
        - type: file
          path: ${source.dir}/patch/langfuse-worker-4-strip-go-native-typescript.patch
          uid: 0
          gid: 0
          source: package/main/langfuse-worker/patch/langfuse-worker-4-strip-go-native-typescript.patch
os-release:
  name: Docker Hardened Images (Debian)
  id: debian
  version-id: "13"
  version-codename: trixie
  pretty-name: Docker Hardened Images/Debian GNU/Linux 13 (trixie)
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
