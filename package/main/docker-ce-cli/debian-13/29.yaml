# syntax=dhi.io/build:2-debian13

image: dhi.io/pkg-docker-ce-cli
variant: runtime
tags:
  - 29.10.1
  - 29.10.1-r1
  - 29.10.1-debian13
  - 29.10.1-r1-debian13
platforms:
  - linux/amd64
  - linux/arm64
dates:
  release: "2026-07-16"
vars:
  COMMIT_SHA: c48360f51c53d2029ab6721ad4d012f9e14df846
  GOLANG_MAJOR_MINOR_VERSION: "1.26"
  GOLANG_VERSION: 1.26.11-18
  REL: "1"
  SEMVER_MAJOR_MINOR_VERSION: "29.10"
  SEMVER_MAJOR_VERSION: "29"
  SEMVER_VERSION: 29.10.1
  VERSION: 29.10.1
contents:
  repositories:
    - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
  keyring:
    - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
  packages:
    - base-files
  builds:
    - name: docker-ce-cli
      work-dir: /go/src/github.com/docker/cli
      caches:
        - path: /go/pkg/mod
      contents:
        repositories:
          - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
        keyring:
          - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
        packages:
          - bash
          - ca-certificates-bundle
          - coreutils
          - findutils
          - gcc
          - golang-1.26=1.26.11-18
          - golang-1.26-oci-config=1.26.11-18
          - libc6-dev
          - patch
        files:
          - url: git+https://github.com/docker/cli.git#v29.10.1
            checksum: c48360f51c53d2029ab6721ad4d012f9e14df846
            path: /go/src/github.com/docker/cli
            spdx:
              name: docker-cli
              version: 29.10.1
              packages:
                - name: docker-cli
                  purl: pkg:golang/github.com/docker/cli@29.10.1
                  license: Apache-2.0
            uid: 0
            gid: 0
      pipeline:
        - name: prepare docker cli go module
          runs: |
            set -eux -o pipefail

            ln -sf vendor.mod go.mod
            ln -sf vendor.sum go.sum
        - name: update docker cli go dependencies
          uses: go/bump@v2
          with:
            deps:
              - golang.org/x/net@v0.62.0
            download: true
        - name: backport distribution digest verification for CVE-2026-85747
          uses: patch@v1
          with:
            options: -p1
            patches:
              - ${source.dir}/patch/dhi-cve-2026-85747-distribution-blob-digest.patch
        - name: test docker cli after dependency updates
          runs: |
            set -eux -o pipefail

            CGO_ENABLED=1 go test -count=1 -timeout=5m -tags grpcnotrace ./cmd/docker

            mkdir -p ./dhi/distributionblob
            cp "${source.dir}/tests/blob_digest_test.go" ./dhi/distributionblob/digest_test.go
            go test -mod=vendor -count=1 -timeout=2m ./dhi/distributionblob
            rm -r ./dhi
        - name: build docker cli
          uses: go/build@v1
          with:
            cgo_enabled: 1
            extra-args: -buildmode=pie
            fips: false
            ldflags:
              - -X github.com/docker/cli/cli/version.GitCommit=c48360f51c53d2029ab6721ad4d012f9e14df846
              - -X github.com/docker/cli/cli/version.BuildTime=$(date -ud @${SOURCE_DATE_EPOCH} +'%Y-%m-%dT%H:%M:%SZ')
              - -X github.com/docker/cli/cli/version.Version=29.10.1
            output: ${target.dir}/usr/bin/docker
            packages: ./cmd/docker
            tags: grpcnotrace
        - uses: dhi/build-pkg:0
          with:
            conflicts: docker-cli, docker.io
            depends:
              - libc6
            description: Docker CLI open-source application container engine
            files:
              - usr/bin/docker
            formats:
              - deb
            license: Apache-2.0
            name: docker-ce-cli
            rel: 1
            url: https://www.docker.com/
            version: 5:29.10.1
      paths:
        - type: directory
          path: ${source.dir}/patch
          uid: 0
          gid: 0
          source: package/main/docker-ce-cli/patch
        - type: file
          path: ${source.dir}/tests/blob_digest_test.go
          uid: 0
          gid: 0
          mode: "644"
          source: package/main/docker-ce-cli/tests/testdata/blob_digest_test.go
os-release:
  name: Docker Hardened Images (Debian)
  id: debian
  version-id: "13"
  version-codename: trixie
  pretty-name: Docker Hardened Images/Debian GNU/Linux 13 (trixie)
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
