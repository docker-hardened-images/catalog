# syntax=dhi.io/build:2-debian13

image: dhi.io/pkg-kafdrop
variant: runtime
tags:
  - 4.3.1
  - 4.3.1-r0
  - 4.3.1-debian13
  - 4.3.1-r0-debian13
platforms:
  - linux/amd64
  - linux/arm64
vars:
  COMMIT_SHA: ab6507e860313b0be893a6d5558f956f7e3fafdc
  GUAVA_VERSION: 33.8.0-jre
  JDK_MAJOR_VERSION: "25"
  JDK_VERSION: 1:25.0.5+8-3
  MAVEN_VERSION: 3.9.16-1
  PACKAGE_HOME: /usr/share/kafdrop
  PACKAGE_NAME: kafdrop-4
  REL: "0"
  SEMVER_MAJOR_MINOR_VERSION: "4.3"
  SEMVER_MAJOR_VERSION: "4"
  SEMVER_VERSION: 4.3.1
  SNAPPY_JAVA_VERSION: 1.1.10.12
  VERSION: 4.3.1
contents:
  repositories:
    - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
  keyring:
    - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
  packages:
    - base-files
  builds:
    - name: kafdrop-4
      work-dir: ${source.dir}/kafdrop
      shell: /bin/bash
      environment:
        JAVA_HOME: /usr/lib/jvm/temurin-25
        MAVEN_ARGS: --batch-mode --no-transfer-progress
      caches:
        - path: /root/.m2/repository
      contents:
        packages:
          - bash
          - ca-certificates
          - coreutils
          - findutils
          - grep
          - libasound2t64
          - libc6
          - libgcc-s1
          - libstdc++6
          - sed
          - tzdata
          - unzip
          - eclipse-temurin-25-jdk=1:25.0.5+8-3
          - maven=3.9.16-1
        files:
          - url: git+https://github.com/obsidiandynamics/kafdrop.git#4.3.1
            checksum: ab6507e860313b0be893a6d5558f956f7e3fafdc
            path: ${source.dir}/kafdrop
            spdx:
              name: kafdrop
              version: 4.3.1
              packages:
                - name: kafdrop
                  purl: pkg:maven/com.obsidiandynamics.kafdrop/kafdrop@4.3.1
                  license: Apache-2.0
            uid: 0
            gid: 0
      pipeline:
        - uses: mvn/mirror@v1
        - name: bump dependency versions
          uses: mvn/patch@v1
          secrets:
            - id: maven_user
              env: MAVEN_USER
              optional: true
            - id: maven_password
              env: MAVEN_PASSWORD
              optional: true
          with:
            dependencies: ${source.dir}/patch/mvn-dependencies.json
            dependencies-key: dependencyManagement.dependencies
            mvn-root: ${source.dir}/kafdrop
        - name: build and test kafdrop
          privileged: true
          secrets:
            - id: maven_user
              env: MAVEN_USER
              optional: true
            - id: maven_password
              env: MAVEN_PASSWORD
              optional: true
          runs: |
            set -eux -o pipefail

            mvn -Dmaven.javadoc.skip=true -Dtest='!KafdropTest,!KafdropIT' -Dsurefire.failIfNoSpecifiedTests=false -DskipITs \
              -Dspring-boot.excludes=org.projectlombok:lombok verify

            test -f "target/kafdrop-4.3.1.jar"
        - name: stage kafdrop jar
          runs: |
            set -eux -o pipefail

            install -D -m 0644 "target/kafdrop-4.3.1.jar" "${target.dir}/usr/share/kafdrop/kafdrop-4.3.1.jar"
            ln -s "kafdrop-4.3.1.jar" "${target.dir}/usr/share/kafdrop/kafdrop.jar"
            install -D -m 0644 LICENSE "${target.dir}/usr/share/licenses/kafdrop-4/LICENSE"

            unzip -p "${target.dir}/usr/share/kafdrop/kafdrop-4.3.1.jar" META-INF/build-info.properties \
              | grep -Fx "build.version=4.3.1"
        - name: verify dependency versions
          runs: |
            set -eux -o pipefail

            libs="$(unzip -Z1 "${target.dir}/usr/share/kafdrop/kafdrop-4.3.1.jar" 'BOOT-INF/lib/*')"
            test "$(grep -c '^BOOT-INF/lib/guava-' <<< "${libs}")" -eq 1
            grep -Fx "BOOT-INF/lib/guava-33.8.0-jre.jar" <<< "${libs}"
            test "$(grep -c '^BOOT-INF/lib/snappy-java-' <<< "${libs}")" -eq 1
            grep -Fx "BOOT-INF/lib/snappy-java-1.1.10.12.jar" <<< "${libs}"
            test "$(grep -c '^BOOT-INF/lib/lombok-' <<< "${libs}")" -eq 0
        - name: java sbom
          uses: sbom@v1
          with:
            extra-scanners: java-archive-cataloger
            prefix: kafdrop
            source: ${target.dir}/usr/share/kafdrop
        - uses: dhi/build-pkg:0
          with:
            depends:
              - eclipse-temurin-25-jre
            description: Kafka web UI for viewing topics and browsing consumer groups
            files:
              - usr/share/kafdrop
              - usr/share/licenses/kafdrop-4
            license: Apache-2.0
            name: kafdrop-4
            rel: 0
            url: https://github.com/obsidiandynamics/kafdrop
            version: 4.3.1
      paths:
        - type: file
          path: ${source.dir}/patch/mvn-dependencies.json
          content: |
            [
              {
                "groupId": "com.google.guava",
                "artifactId": "guava",
                "version": "33.8.0-jre",
                "comment": "The newest guava 33.x; protobuf-java-util pins 32.0.1-jre. CVE-2026-102554"
              },
              {
                "groupId": "org.xerial.snappy",
                "artifactId": "snappy-java",
                "version": "1.1.10.12",
                "comment": "The newest snappy-java 1.1.10.x; kafka-clients pins 1.1.10.7. CVE-2026-93451 CVE-2026-108106 CVE-2026-116590"
              }
            ]
          uid: 0
          gid: 0
          mode: "0444"
os-release:
  name: Docker Hardened Images (Debian)
  id: debian
  version-id: "13"
  version-codename: trixie
  pretty-name: Docker Hardened Images/Debian GNU/Linux 13 (trixie)
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
