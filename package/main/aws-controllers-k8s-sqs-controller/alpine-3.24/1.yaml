# syntax=dhi.io/build:2-alpine3.24

image: dhi.io/pkg-aws-controllers-k8s-sqs-controller
variant: runtime
tags:
  - 1.9.0-alpine3.24
  - 1.9.0-r0-alpine3.24
platforms:
  - linux/amd64
  - linux/arm64
vars:
  COMMIT_SHA: 0810c99dd5b0c45939727e0ca04e4810ced1fdfa
  GOLANG_VERSION: 1.27.3-r0
  PACKAGE_NAME: aws-controllers-k8s-sqs-controller-1
  REL: "0"
  SEMVER_MAJOR_MINOR_VERSION: "1.9"
  SEMVER_MAJOR_VERSION: "1"
  SEMVER_VERSION: 1.9.0
  VERSION: 1.9.0
contents:
  repositories:
    - https://dhi.io/apk/alpine/v3.24/main
    - https://dhi.io/apk/alpine/v3.23/main
    - https://dl-cdn.alpinelinux.org/alpine/v3.24/main
    - https://dl-cdn.alpinelinux.org/alpine/v3.24/community
  keyring:
    - https://dhi.io/keyring/dhi-apk@docker-0F81AD7700D99184.rsa.pub
  packages:
    - alpine-baselayout-data
  builds:
    - name: aws-controllers-k8s-sqs-controller-1
      work-dir: /go/src/github.com/aws-controllers-k8s/sqs-controller
      contents:
        packages:
          - bash
          - binutils
          - busybox
          - ca-certificates-bundle
          - coreutils
          - findutils
          - mawk
          - golang-1.27=1.27.3-r0
          - golang-1.27-oci-config=1.27.3-r0
        files:
          - url: git+https://github.com/aws-controllers-k8s/sqs-controller.git#v1.9.0
            checksum: 0810c99dd5b0c45939727e0ca04e4810ced1fdfa
            path: /go/src/github.com/aws-controllers-k8s/sqs-controller
            spdx:
              name: sqs-controller
              version: 1.9.0
              packages:
                - name: sqs-controller
                  purl: pkg:golang/github.com/aws-controllers-k8s/sqs-controller@1.9.0
                  license: Apache-2.0
            uid: 0
            gid: 0
      pipeline:
        - name: update go dependencies
          uses: go/bump@v2
          with:
            deps:
              - golang.org/x/net@v0.62.0
              - golang.org/x/text@v0.43.0
            download: true
        - uses: go/hermetic@v1
        - name: test
          runs: |
            set -eux -o pipefail

            if [ "false" = "true" ]; then
              export GOFIPS140=v1.0.0
              export GODEBUG=fips140=on
            fi

            CGO_ENABLED=0 go test -count=1 ./apis/... ./pkg/... ./cmd/...
        - name: build
          uses: go/build@v1
          with:
            extra-env: GOPROXY=off GOSUMDB=off
            fips: false
            ldflags:
              - -X github.com/aws-controllers-k8s/sqs-controller/pkg/version.GitVersion=1.9.0
              - -X github.com/aws-controllers-k8s/sqs-controller/pkg/version.GitCommit=0810c99dd5b0c45939727e0ca04e4810ced1fdfa
              - -X github.com/aws-controllers-k8s/sqs-controller/pkg/version.BuildDate=$(date -ud @${SOURCE_DATE_EPOCH} +%Y-%m-%dT%H:%M)
            output: ${target.dir}/usr/bin/ack-sqs-controller
            packages: ./cmd/controller
        - name: build dev
          uses: go/build@v1
          with:
            extra-env: GOPROXY=off GOSUMDB=off
            fips: false
            ldflags:
              - -X github.com/aws-controllers-k8s/sqs-controller/pkg/version.GitVersion=1.9.0
              - -X github.com/aws-controllers-k8s/sqs-controller/pkg/version.GitCommit=0810c99dd5b0c45939727e0ca04e4810ced1fdfa
              - -X github.com/aws-controllers-k8s/sqs-controller/pkg/version.BuildDate=$(date -ud @${SOURCE_DATE_EPOCH} +%Y-%m-%dT%H:%M)
            output: ${target.dir}/usr/bin/ack-sqs-controller-dev
            packages: ./cmd/controller
            strip: false
        - name: verify build info
          runs: |
            set -eux -o pipefail

            src=/go/src/github.com/aws-controllers-k8s/sqs-controller
            runtime=${target.dir}/usr/bin/ack-sqs-controller
            devbin=${target.dir}/usr/bin/ack-sqs-controller-dev

            awk '/^require \($/{r=1; next} r && /^\)$/{r=0; next} r && NF >= 2 {print $1, $2} /^require [^(]/{print $2, $3}' "$src/go.mod" | LC_ALL=C sort -u > /tmp/requires.txt
            test -s /tmp/requires.txt

            for bin in "$runtime" "$devbin"; do
              test -x "$bin"
              go version -m "$bin" > /tmp/buildinfo.txt
              grep -qE '^[[:space:]]+build[[:space:]]+CGO_ENABLED=0$' /tmp/buildinfo.txt
              grep -qF "pkg/version.GitVersion=1.9.0" /tmp/buildinfo.txt
              grep -qF "pkg/version.GitCommit=0810c99dd5b0c45939727e0ca04e4810ced1fdfa" /tmp/buildinfo.txt
              grep -qE 'pkg/version\.BuildDate=[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}([[:space:]]|")' /tmp/buildinfo.txt
              awk '$1 == "dep" {print $2, $3}' /tmp/buildinfo.txt | LC_ALL=C sort -u > /tmp/deps.txt
              test -s /tmp/deps.txt
              if LC_ALL=C comm -13 /tmp/requires.txt /tmp/deps.txt | grep .; then
                echo "$bin: module versions differ from $src/go.mod" >&2
                exit 1
              fi
              if [ "false" = "true" ]; then
                grep -qE '^[[:space:]]+build[[:space:]]+GOFIPS140=v1\.0\.0(-[0-9a-f]+)?$' /tmp/buildinfo.txt
                grep -qE '^[[:space:]]+build[[:space:]]+DefaultGODEBUG=(.*,)?fips140=on(,|$)' /tmp/buildinfo.txt
              elif grep -q fips140 /tmp/buildinfo.txt; then
                echo "$bin: FIPS build settings on a non-FIPS build" >&2
                exit 1
              fi
              readelf -d "$bin" > /tmp/ack.dyn
              if grep -q NEEDED /tmp/ack.dyn; then
                echo "$bin: dynamically linked" >&2
                cat /tmp/ack.dyn >&2
                exit 1
              fi
            done

            go version -m "$runtime" | grep -qxF "$(printf '\tbuild\t-trimpath=true')"
            go version -m "$runtime" | grep -E -- '-ldflags=.*-w( |")'
            if go version -m "$runtime" | grep -E -- '-ldflags=.*-s( |")'; then
              echo "$runtime: upstream does not strip, so -s must not be set" >&2
              exit 1
            fi
            if go version -m "$devbin" | grep -E -- '-ldflags=.*-(s|w)( |"|$)|-trimpath=true'; then
              echo "$devbin: dev binary must keep symbols and paths" >&2
              exit 1
            fi
        - name: stage sbom and licenses
          runs: |
            set -eux -o pipefail

            src=/go/src/github.com/aws-controllers-k8s/sqs-controller
            sbom=/opt/docker/sbom/sqs-controller

            test -s "$sbom/.spdx.sqs-controller.json"
            grep -q 'pkg:golang/github.com/aws-controllers-k8s/sqs-controller@' "$sbom/.spdx.sqs-controller.json"
            install -d "${target.dir}/opt/docker/sbom" "${target.dir}/opt/docker/sbom-dev"
            cp -a "$sbom" "${target.dir}/opt/docker/sbom/"
            cp -a "$sbom" "${target.dir}/opt/docker/sbom-dev/"

            grep -q 'Apache License' "$src/LICENSE"
            grep -q 'Version 2.0' "$src/LICENSE"
            grep -q 'Copyright 2019 Amazon.com' "$src/NOTICE"
            test -s "$src/ATTRIBUTION.md"
            for f in LICENSE NOTICE ATTRIBUTION.md; do
              install -D -m 0644 "$src/$f" "${target.dir}/usr/share/licenses/aws-controllers-k8s-sqs-controller/$f"
              install -D -m 0644 "$src/$f" "${target.dir}/usr/share/licenses/aws-controllers-k8s-sqs-controller-dev/$f"
            done
        - uses: dhi/build-pkg:0
          with:
            description: AWS Controllers for Kubernetes (ACK) service controller for Amazon SQS
            files:
              - usr/bin/ack-sqs-controller
              - opt/docker/sbom/sqs-controller
              - usr/share/licenses/aws-controllers-k8s-sqs-controller/LICENSE
              - usr/share/licenses/aws-controllers-k8s-sqs-controller/NOTICE
              - usr/share/licenses/aws-controllers-k8s-sqs-controller/ATTRIBUTION.md
            license: Apache-2.0
            name: aws-controllers-k8s-sqs-controller-1
            rel: 0
            subpackages:
              - files:
                  - path: usr/bin/ack-sqs-controller
                    source: usr/bin/ack-sqs-controller-dev
                  - path: opt/docker/sbom/sqs-controller
                    source: opt/docker/sbom-dev/sqs-controller
                  - path: usr/share/licenses/aws-controllers-k8s-sqs-controller/LICENSE
                    source: usr/share/licenses/aws-controllers-k8s-sqs-controller-dev/LICENSE
                  - path: usr/share/licenses/aws-controllers-k8s-sqs-controller/NOTICE
                    source: usr/share/licenses/aws-controllers-k8s-sqs-controller-dev/NOTICE
                  - path: usr/share/licenses/aws-controllers-k8s-sqs-controller/ATTRIBUTION.md
                    source: usr/share/licenses/aws-controllers-k8s-sqs-controller-dev/ATTRIBUTION.md
                name: aws-controllers-k8s-sqs-controller-1-dev
            url: https://github.com/aws-controllers-k8s/sqs-controller
            version: 1.9.0
os-release:
  name: Docker Hardened Images (Alpine)
  id: alpine
  version-id: "3.24"
  pretty-name: Docker Hardened Images/Alpine Linux v3.24
