contents:
  repositories:
    - https://dhi.io/apk/alpine/v3.24/main
    - https://dhi.io/apk/alpine/v3.23/main
    - https://dl-cdn.alpinelinux.org/alpine/v3.24/main
    - https://dl-cdn.alpinelinux.org/alpine/v3.24/community
  keyring:
    - https://dhi.io/keyring/dhi-apk@docker-0F81AD7700D99184.rsa.pub
  packages:
    - alpine-baselayout-data
  builds:
    - name: ascender
      work-dir: ${source.dir}
      caches:
        - path: /root/.npm
        - path: /root/.cargo
      contents:
        packages:
          - bash
          - build-base
          - coreutils
          - cyrus-sasl-dev
          - findutils
          - gettext
          - git
          - grep
          - gzip
          - libffi-dev
          - libpq-dev
          - libsodium-dev
          - libxml2-dev
          - libxslt-dev
          - linux-headers
          - openldap-dev
          - openssl
          - openssl-dev
          - pcre2-dev
          - pkgconf
          - sed
          - tar
          - tzdata
          - xmlsec-dev=1.3.11-r0
          - yaml-dev
          - zlib-dev
          - cargo=1.96.1-r0
          - rust=1.96.1-r0
          - nodejs-22=22.23.5-r0
          - npm=11.21.3-r0
          - python-3.12-dev=3.12.16-r4
        files:
          - url: https://github.com/astral-sh/uv/releases/download/0.13.9/uv-${UV_ARCH}.tar.gz
            checksum: https://github.com/astral-sh/uv/releases/download/0.13.9/uv-${UV_ARCH}.tar.gz.sha256
            path: ${source.dir}/uv.tar.gz
            uid: 0
            gid: 0
          - url: git+https://github.com/ctrliq/ascender.git#c06d0ed51fdc06bebc0e04bdc6f6b0675f353c46
            checksum: c06d0ed51fdc06bebc0e04bdc6f6b0675f353c46
            path: ${source.dir}/src
            spdx:
              name: ascender
              version: 25.6.3
              packages:
                - name: ascender
                  purl: pkg:github/ctrliq/ascender@25.6.3
                  license: Apache-2.0
            uid: 0
            gid: 0
          - url: https://files.pythonhosted.org/packages/source/c/cryptography/cryptography-50.0.1.tar.gz
            checksum: sha256:5dd9bda1c12b4162f6ff568eeb5e0ff956c28d14406e875cfe8a63a2d414ff20
            path: ${source.dir}/sdists/cryptography.tar.gz
            uid: 0
            gid: 0
          - url: https://files.pythonhosted.org/packages/source/r/rpds-py/rpds_py-2026.6.3.tar.gz
            checksum: sha256:1cebd1337c242e4ec2293e541f712b2da849b29f48f0c293684b71c0632625d4
            path: ${source.dir}/sdists/rpds-py.tar.gz
            uid: 0
            gid: 0
          - url: https://files.pythonhosted.org/packages/source/c/cbor2/cbor2-6.1.5.tar.gz
            checksum: sha256:6eb06160c42315ac0c4ded461c7d84d92fa18c69d13d17fc1dfc1fae96580c95
            path: ${source.dir}/sdists/cbor2.tar.gz
            uid: 0
            gid: 0
          - url: https://files.pythonhosted.org/packages/source/l/libvalkey/libvalkey-4.0.1.tar.gz
            checksum: sha256:fe60ef535bc826fc35f4019228a0a46bdce8b41fd6013a7591e822a8a17c3170
            path: ${source.dir}/sdists/libvalkey.tar.gz
            uid: 0
            gid: 0
          - url: https://files.pythonhosted.org/packages/source/u/ujson/ujson-6.0.0.tar.gz
            checksum: sha256:80e23393feb707582e0ad495c397a4477b646d08094d2df64f7316f9fafd8aae
            path: ${source.dir}/sdists/ujson.tar.gz
            uid: 0
            gid: 0
      pipeline:
        - name: setup uv
          runs: |
            set -eux -o pipefail

            mkdir -p /usr/local/bin
            tar -xzf "${source.dir}/uv.tar.gz" -C /usr/local/bin --strip-components=1
        - name: build ui, venv and static files at final paths and stage them
          privileged: true
          runs: |
            set -eux -o pipefail

            export SOURCE_DIR="${source.dir}" TARGET_DIR="${target.dir}" PYTHON_BIN=/usr/bin/python3.12 ASCENDER_VERSION="25.6.3" PINNED_RELEASE="25.6.3@c06d0ed51fdc06bebc0e04bdc6f6b0675f353c46" BUNDLED_FROM="aiohttp==3.14.5 libvalkey==4.0.1 ujson==6.0.0"
            export EXTRA_NO_BINARY="autobahn cbor2 rpds-py ujson pyyaml pynacl" SODIUM_INSTALL=system
            export LINK_CHECKS="yaml/_yaml.cpython-*.so=libyaml-0.so.2 nacl/_sodium.abi3.so=libsodium.so xmlsec.cpython-*.so=libxmlsec1.so.10311"
            export NOTICE_FILE="/usr/share/licenses/ascender-25/copyright" UJSON_NOTICE=yes
            export RUST_SDISTS="cryptography rpds-py cbor2" RUST_LOCK_DIR="${source.dir}/rust-crates"
            export D3_VERSIONS="d3-collection=1.0.7 d3-dispatch=1.0.6 d3-force=1.2.1 d3-quadtree=1.0.7 d3-timer=1.0.10"
            bash "${source.dir}/build-ascender.sh"
        - name: web ui sbom
          uses: sbom@v1
          with:
            extra-scanners: javascript-package-cataloger
            prefix: ascender-ui
            source: ${source.dir}/src/awx/ui
        - name: rust crates in the cryptography, rpds-py and cbor2 extensions sbom
          uses: sbom@v1
          with:
            extra-scanners: rust-cargo-lock-cataloger
            prefix: ascender-rust-crates
            source: ${source.dir}/rust-crates
        - name: d3-collection in the web ui sbom
          uses: spdx@v1
          with:
            license: BSD-3-Clause
            name: d3-collection
            purl: pkg:npm/d3-collection@1.0.7
            version: 1.0.7
        - name: d3-dispatch in the web ui sbom
          uses: spdx@v1
          with:
            license: BSD-3-Clause
            name: d3-dispatch
            purl: pkg:npm/d3-dispatch@1.0.6
            version: 1.0.6
        - name: d3-force in the web ui sbom
          uses: spdx@v1
          with:
            license: BSD-3-Clause
            name: d3-force
            purl: pkg:npm/d3-force@1.2.1
            version: 1.2.1
        - name: d3-quadtree in the web ui sbom
          uses: spdx@v1
          with:
            license: BSD-3-Clause
            name: d3-quadtree
            purl: pkg:npm/d3-quadtree@1.0.7
            version: 1.0.7
        - name: d3-timer in the web ui sbom
          uses: spdx@v1
          with:
            license: BSD-3-Clause
            name: d3-timer
            purl: pkg:npm/d3-timer@1.0.10
            version: 1.0.10
        - name: llhttp in the aiohttp wheel sbom
          uses: spdx@v1
          with:
            license: MIT
            name: llhttp
            purl: pkg:github/nodejs/llhttp@9.4.2
            version: 9.4.2
        - name: libvalkey in the libvalkey wheel sbom
          uses: spdx@v1
          with:
            license: BSD-3-Clause
            name: libvalkey-c
            purl: pkg:github/valkey-io/libvalkey@0635b070448825f10c27611189363d633ca75527
            version: 0635b070448825f10c27611189363d633ca75527
        - name: double-conversion in the ujson build sbom
          uses: spdx@v1
          with:
            license: BSD-3-Clause
            name: double-conversion
            purl: pkg:github/google/double-conversion@3.2.1
            version: 3.2.1
        - name: stage sbom documents into the package
          runs: |
            set -eux -o pipefail

            install -d "${target.dir}/opt/docker/sbom"
            for d in ascender-ui ascender-rust-crates d3-collection d3-dispatch d3-force d3-quadtree d3-timer llhttp libvalkey-c double-conversion; do
              cp -a "/opt/docker/sbom/$d" "${target.dir}/opt/docker/sbom/"
            done
        - uses: dhi/build-pkg:0
          with:
            apk:
              depends:
                - busybox-binsh
                - sed
                - gawk
                - libpq
                - libldap
                - so:libxmlsec1.so.10311
                - libxslt
                - libffi
                - libssl3
                - libcrypto3
                - libgcc
                - libstdc++
                - pcre2
                - zlib
                - libuuid
                - libsodium
                - yaml
                - rsyslog
                - rsyslog-http
              release_keys:
                - "3.24"
            depends:
              - python-3.12
              - bash
              - coreutils
              - grep
              - git
              - tzdata
              - ca-certificates-bundle
              - nginx-mainline
              - libxml2
            description: Ascender automation controller (CIQ fork of AWX) - Django API and task services, built web UI, launch scripts and supervisord configs
            files:
              - etc/supervisord_rsyslog.conf
              - etc/supervisord_task.conf
              - etc/supervisord_web.conf
              - etc/tower
              - opt/docker/sbom
              - usr/bin
              - usr/share/licenses/ascender-25
              - var/lib/awx
              - var/log/tower
            formats:
              - apk
            license: Apache-2.0
            name: ascender-25
            rel: 1
            url: https://github.com/ctrliq/ascender
            version: 25.6.3
      paths:
        - type: file
          path: ${source.dir}/requirements.txt
          uid: 0
          gid: 0
          source: package/main/ascender/requirements.txt
        - type: file
          path: ${source.dir}/requirements-build.txt
          uid: 0
          gid: 0
          source: package/main/ascender/requirements-build.txt
        - type: file
          path: ${source.dir}/requirements-git.txt
          uid: 0
          gid: 0
          source: package/main/ascender/requirements-git.txt
        - type: file
          path: ${source.dir}/requirements-runtime.txt
          uid: 0
          gid: 0
          source: package/main/ascender/requirements-runtime.txt
        - type: file
          path: ${source.dir}/requirements-security.txt
          uid: 0
          gid: 0
          source: package/main/ascender/requirements-security.txt
        - type: file
          path: ${source.dir}/requirements-test.txt
          uid: 0
          gid: 0
          source: package/main/ascender/requirements-test.txt
        - type: file
          path: ${source.dir}/build-ascender.sh
          uid: 0
          gid: 0
          mode: "0755"
          source: package/main/ascender/build-ascender.sh
