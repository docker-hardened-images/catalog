# syntax=dhi.io/build:2-debian13

image: dhi.io/pkg-ascender
variant: runtime
tags:
  - 25.6.3
  - 25.6.3-r6
  - 25.6.3-debian13
  - 25.6.3-r6-debian13
platforms:
  - linux/amd64
  - linux/arm64
vars:
  AIOHTTP_VERSION: 3.14.5
  AUTOBAHN_PINS_COMMIT: 28e2c598cd89723dca5d342c2221ac32a4c84f8e
  CARGO_VERSION: 1.100.0-4
  CBOR2_CHECKSUM: sha256:6eb06160c42315ac0c4ded461c7d84d92fa18c69d13d17fc1dfc1fae96580c95
  CBOR2_VERSION: 6.1.5
  COMMIT_SHA: c06d0ed51fdc06bebc0e04bdc6f6b0675f353c46
  CRYPTOGRAPHY_CHECKSUM: sha256:5dd9bda1c12b4162f6ff568eeb5e0ff956c28d14406e875cfe8a63a2d414ff20
  CRYPTOGRAPHY_VERSION: 50.0.1
  D3_COLLECTION_VERSION: 1.0.7
  D3_DISPATCH_VERSION: 1.0.6
  D3_FORCE_VERSION: 1.2.1
  D3_QUADTREE_VERSION: 1.0.7
  D3_TIMER_VERSION: 1.0.10
  LIBESTR_CHECKSUM: sha256:46632b2785ff4a231dcf241eeb0dcb5fc0c7d4da8ee49cf5687722cdbe8b2024
  LIBESTR_VERSION: 0.1.11
  LIBFASTJSON_CHECKSUM: sha256:7cd6f78c1c07f4140f6976a9a0e0048bcaa7292329c6ac2c0e070383d83d8edd
  LIBFASTJSON_VERSION: 1.2609.0
  LIBSODIUM_VERSION: 1.0.20
  LIBVALKEY_C_VERSION: 0635b070448825f10c27611189363d633ca75527
  LIBVALKEY_PY_CHECKSUM: sha256:fe60ef535bc826fc35f4019228a0a46bdce8b41fd6013a7591e822a8a17c3170
  LIBVALKEY_PY_VERSION: 4.0.1
  LLHTTP_VERSION: 9.4.2
  NODEJS_VERSION: 22.23.5-1
  NOTICE_FILE: /usr/share/doc/ascender-25/copyright
  NPM_VERSION: 11.21.3-2
  PACKAGE_NAME: ascender-25
  PINNED_RELEASE: 25.6.3@c06d0ed51fdc06bebc0e04bdc6f6b0675f353c46
  PYNACL_VERSION: 1.6.2
  PYTHON_MINOR: "3.12"
  PYTHON_VERSION: 3.12.16-9
  REL: "6"
  RPDS_PY_CHECKSUM: sha256:1cebd1337c242e4ec2293e541f712b2da849b29f48f0c293684b71c0632625d4
  RPDS_PY_VERSION: 2026.6.3
  RSYSLOG_CHECKSUM: sha256:7bdf95e81ea6c0ee5d586342d57d2a6e395b089fb3c67318a0dc555816de404b
  RSYSLOG_VERSION: 8.2610.0
  RUSTC_VERSION: 1.100.0-4
  SEMVER_MAJOR_MINOR_VERSION: "25.6"
  SEMVER_MAJOR_VERSION: "25"
  SEMVER_VERSION: 25.6.3
  UV_ARCH: '#{ target.arch == "amd64" ? "x86_64-unknown-linux-gnu" : "aarch64-unknown-linux-gnu" }'
  UV_VERSION: 0.13.10
  VERSION: 25.6.3
contents:
  repositories:
    - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
  keyring:
    - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
  packages:
    - base-files
  builds:
    - name: ascender
      work-dir: ${source.dir}
      caches:
        - path: /root/.npm
        - path: /root/.cargo
      contents:
        packages:
          - bash
          - build-essential
          - ca-certificates
          - coreutils
          - diffutils
          - findutils
          - gettext
          - git
          - grep
          - gzip
          - libcurl4-openssl-dev
          - libdouble-conversion-dev
          - libffi-dev
          - libldap2-dev
          - libpcre2-dev
          - libpq-dev
          - libpq5
          - libsasl2-dev
          - libssl-dev
          - libxml2-dev
          - libxmlsec1-dev
          - libxslt1-dev
          - libyaml-dev
          - mawk
          - openssl
          - pkg-config
          - sed
          - tar
          - tzdata
          - zlib1g-dev
          - cargo=1.100.0-4
          - rustc=1.100.0-4
          - libcurl4t64
          - libgcc-s1
          - libsqlite3-0
          - libstdc++6
          - zlib1g
          - nodejs-22=22.23.5-1
          - npm=11.21.3-2
          - libpython-3.12-minimal=3.12.16-9
          - libpython-3.12-stdlib=3.12.16-9
          - libpython-3.12=3.12.16-9
          - libpython-3.12-dev=3.12.16-9
          - python-3.12-minimal=3.12.16-9
          - python-3.12=3.12.16-9
          - python-3.12-dev=3.12.16-9
        files:
          - url: https://github.com/astral-sh/uv/releases/download/0.13.10/uv-${UV_ARCH}.tar.gz
            checksum: https://github.com/astral-sh/uv/releases/download/0.13.10/uv-${UV_ARCH}.tar.gz.sha256
            path: ${source.dir}/uv.tar.gz
            uid: 0
            gid: 0
          - url: git+https://github.com/ctrliq/ascender.git#c06d0ed51fdc06bebc0e04bdc6f6b0675f353c46
            checksum: c06d0ed51fdc06bebc0e04bdc6f6b0675f353c46
            path: ${source.dir}/src
            spdx:
              name: ascender
              version: 25.6.3
              packages:
                - name: ascender
                  purl: pkg:github/ctrliq/ascender@25.6.3
                  license: Apache-2.0
            uid: 0
            gid: 0
          - url: https://github.com/rsyslog/rsyslog/releases/download/v8.2610.0/rsyslog-8.2610.0.tar.gz
            checksum: sha256:7bdf95e81ea6c0ee5d586342d57d2a6e395b089fb3c67318a0dc555816de404b
            path: ${source.dir}/rsyslog.tar.gz
            uid: 0
            gid: 0
          - url: https://libestr.adiscon.com/files/download/libestr-0.1.11.tar.gz
            checksum: sha256:46632b2785ff4a231dcf241eeb0dcb5fc0c7d4da8ee49cf5687722cdbe8b2024
            path: ${source.dir}/libestr.tar.gz
            uid: 0
            gid: 0
          - url: https://github.com/rsyslog/libfastjson/releases/download/v1.2609.0/libfastjson-1.2609.0.tar.gz
            checksum: sha256:7cd6f78c1c07f4140f6976a9a0e0048bcaa7292329c6ac2c0e070383d83d8edd
            path: ${source.dir}/libfastjson.tar.gz
            uid: 0
            gid: 0
          - url: https://files.pythonhosted.org/packages/source/c/cryptography/cryptography-50.0.1.tar.gz
            checksum: sha256:5dd9bda1c12b4162f6ff568eeb5e0ff956c28d14406e875cfe8a63a2d414ff20
            path: ${source.dir}/sdists/cryptography.tar.gz
            uid: 0
            gid: 0
          - url: https://files.pythonhosted.org/packages/source/r/rpds-py/rpds_py-2026.6.3.tar.gz
            checksum: sha256:1cebd1337c242e4ec2293e541f712b2da849b29f48f0c293684b71c0632625d4
            path: ${source.dir}/sdists/rpds-py.tar.gz
            uid: 0
            gid: 0
          - url: https://files.pythonhosted.org/packages/source/c/cbor2/cbor2-6.1.5.tar.gz
            checksum: sha256:6eb06160c42315ac0c4ded461c7d84d92fa18c69d13d17fc1dfc1fae96580c95
            path: ${source.dir}/sdists/cbor2.tar.gz
            uid: 0
            gid: 0
          - url: https://files.pythonhosted.org/packages/source/l/libvalkey/libvalkey-4.0.1.tar.gz
            checksum: sha256:fe60ef535bc826fc35f4019228a0a46bdce8b41fd6013a7591e822a8a17c3170
            path: ${source.dir}/sdists/libvalkey.tar.gz
            uid: 0
            gid: 0
      pipeline:
        - name: setup uv
          runs: |
            set -eux -o pipefail

            mkdir -p /usr/local/bin
            tar -xzf "${source.dir}/uv.tar.gz" -C /usr/local/bin --strip-components=1
        - name: build ui, venv and static files at final paths and stage them
          privileged: true
          runs: |
            set -eux -o pipefail

            export SOURCE_DIR="${source.dir}" TARGET_DIR="${target.dir}" PYTHON_BIN=/usr/bin/python3.12 ASCENDER_VERSION="25.6.3" PINNED_RELEASE="25.6.3@c06d0ed51fdc06bebc0e04bdc6f6b0675f353c46" BUNDLED_FROM="aiohttp==3.14.5 libvalkey==4.0.1 pynacl==1.6.2"
            export EXTRA_NO_BINARY="pyyaml ujson" UJSON_BUILD_DC_INCLUDES=/usr/include/double-conversion UJSON_BUILD_DC_LIBS=-ldouble-conversion
            export LINK_CHECKS="yaml/_yaml.cpython-*.so=libyaml-0.so.2 ujson.cpython-*.so=libdouble-conversion.so"
            export NOTICE_FILE="/usr/share/doc/ascender-25/copyright"
            export RUST_SDISTS="cryptography rpds-py cbor2" RUST_LOCK_DIR="${source.dir}/rust-crates"
            export D3_VERSIONS="d3-collection=1.0.7 d3-dispatch=1.0.6 d3-force=1.2.1 d3-quadtree=1.0.7 d3-timer=1.0.10"
            bash "${source.dir}/build-ascender.sh"
        - name: build rsyslogd and the modules the rsyslog role loads
          runs: |
            set -eux -o pipefail

            export SOURCE_DIR="${source.dir}" TARGET_DIR="${target.dir}" PACKAGE_LIBDIR="/usr/lib/ascender-25" NOTICE_FILE="/usr/share/doc/ascender-25/copyright"
            export RSYSLOG_VERSION="8.2610.0" LIBESTR_VERSION="0.1.11" LIBFASTJSON_VERSION="1.2609.0"
            export RSYSLOG_MODULES="imuxsock imptcp omhttp lmnet lmnetstrms lmnsd_ptcp lmtcpclt lmregexp"
            export LINK_CHECKS="usr/sbin/rsyslogd=libz.so.1"
            bash "${source.dir}/build-rsyslog.sh"
        - name: web ui sbom
          uses: sbom@v1
          with:
            extra-scanners: javascript-package-cataloger
            prefix: ascender-ui
            source: ${source.dir}/src/awx/ui
        - name: rust crates in the cryptography, rpds-py and cbor2 extensions sbom
          uses: sbom@v1
          with:
            extra-scanners: rust-cargo-lock-cataloger
            prefix: ascender-rust-crates
            source: ${source.dir}/rust-crates
        - name: d3-collection in the web ui sbom
          uses: spdx@v1
          with:
            license: BSD-3-Clause
            name: d3-collection
            purl: pkg:npm/d3-collection@1.0.7
            version: 1.0.7
        - name: d3-dispatch in the web ui sbom
          uses: spdx@v1
          with:
            license: BSD-3-Clause
            name: d3-dispatch
            purl: pkg:npm/d3-dispatch@1.0.6
            version: 1.0.6
        - name: d3-force in the web ui sbom
          uses: spdx@v1
          with:
            license: BSD-3-Clause
            name: d3-force
            purl: pkg:npm/d3-force@1.2.1
            version: 1.2.1
        - name: d3-quadtree in the web ui sbom
          uses: spdx@v1
          with:
            license: BSD-3-Clause
            name: d3-quadtree
            purl: pkg:npm/d3-quadtree@1.0.7
            version: 1.0.7
        - name: d3-timer in the web ui sbom
          uses: spdx@v1
          with:
            license: BSD-3-Clause
            name: d3-timer
            purl: pkg:npm/d3-timer@1.0.10
            version: 1.0.10
        - name: libsodium in the pynacl wheel sbom
          uses: spdx@v1
          with:
            license: ISC
            name: libsodium
            purl: pkg:github/jedisct1/libsodium@1.0.20
            version: 1.0.20
        - name: llhttp in the aiohttp wheel sbom
          uses: spdx@v1
          with:
            license: MIT
            name: llhttp
            purl: pkg:github/nodejs/llhttp@9.4.2
            version: 9.4.2
        - name: libvalkey in the libvalkey wheel sbom
          uses: spdx@v1
          with:
            license: BSD-3-Clause
            name: libvalkey-c
            purl: pkg:github/valkey-io/libvalkey@0635b070448825f10c27611189363d633ca75527
            version: 0635b070448825f10c27611189363d633ca75527
        - name: rsyslog in the payload sbom
          uses: spdx@v1
          with:
            license: GPL-3.0-or-later AND LGPL-3.0-or-later AND Apache-2.0 AND BSD-3-Clause
            name: rsyslog
            purl: pkg:dhi/rsyslog@8.2610.0
            version: 8.2610.0
        - name: libestr in the payload sbom
          uses: spdx@v1
          with:
            license: LGPL-2.1-or-later
            name: libestr
            purl: pkg:github/rsyslog/libestr@0.1.11
            version: 0.1.11
        - name: libfastjson in the payload sbom
          uses: spdx@v1
          with:
            license: MIT AND Apache-2.0
            name: libfastjson
            purl: pkg:github/rsyslog/libfastjson@1.2609.0
            version: 1.2609.0
        - name: stage sbom documents into the package
          runs: |
            set -eux -o pipefail

            install -d "${target.dir}/opt/docker/sbom"
            for d in ascender-ui ascender-rust-crates d3-collection d3-dispatch d3-force d3-quadtree d3-timer libsodium llhttp libvalkey-c rsyslog libestr libfastjson; do
              cp -a "/opt/docker/sbom/$d" "${target.dir}/opt/docker/sbom/"
            done
        - uses: dhi/build-pkg:0
          with:
            deb:
              conflicts:
                - rsyslog
              depends:
                - dash
                - sed
                - mawk
                - libpq5
                - libldap2
                - libxmlsec1t64
                - libxmlsec1t64-openssl
                - libxslt1.1
                - libffi8
                - libssl3t64
                - libpcre2-8-0
                - zlib1g
                - libcrypt1
                - libgcc-s1
                - libstdc++6
                - libdouble-conversion3
                - libyaml-0-2
                - libpython-3.12
                - libcurl4t64
            depends:
              - python-3.12
              - bash
              - coreutils
              - grep
              - git
              - tzdata
              - ca-certificates-bundle
              - nginx-mainline
              - libxml2
            description: Ascender automation controller (CIQ fork of AWX) - Django API and task services, built web UI, launch scripts, supervisord configs and rsyslogd
            files:
              - etc/supervisord_rsyslog.conf
              - etc/supervisord_task.conf
              - etc/supervisord_web.conf
              - etc/tower
              - opt/docker/sbom
              - usr/bin
              - usr/lib/ascender-25
              - usr/sbin
              - usr/share/doc/ascender-25
              - var/lib/awx
              - var/log/tower
            formats:
              - deb
            license: Apache-2.0
            name: ascender-25
            rel: 6
            url: https://github.com/ctrliq/ascender
            version: 25.6.3
      paths:
        - type: file
          path: ${source.dir}/requirements.txt
          uid: 0
          gid: 0
          source: package/main/ascender/requirements.txt
        - type: file
          path: ${source.dir}/requirements-build.txt
          uid: 0
          gid: 0
          source: package/main/ascender/requirements-build.txt
        - type: file
          path: ${source.dir}/requirements-git.txt
          uid: 0
          gid: 0
          source: package/main/ascender/requirements-git.txt
        - type: file
          path: ${source.dir}/requirements-runtime.txt
          uid: 0
          gid: 0
          source: package/main/ascender/requirements-runtime.txt
        - type: file
          path: ${source.dir}/requirements-security.txt
          uid: 0
          gid: 0
          source: package/main/ascender/requirements-security.txt
        - type: file
          path: ${source.dir}/requirements-test.txt
          uid: 0
          gid: 0
          source: package/main/ascender/requirements-test.txt
        - type: file
          path: ${source.dir}/build-ascender.sh
          uid: 0
          gid: 0
          mode: "0755"
          source: package/main/ascender/build-ascender.sh
        - type: file
          path: ${source.dir}/build-rsyslog.sh
          uid: 0
          gid: 0
          mode: "0755"
          source: package/main/ascender/build-rsyslog.sh
os-release:
  name: Docker Hardened Images (Debian)
  id: debian
  version-id: "13"
  version-codename: trixie
  pretty-name: Docker Hardened Images/Debian GNU/Linux 13 (trixie)
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
