      pipeline:
        - name: assemble SDK tree offline (core + components, FHS /usr/lib)
          runs: |
            set -eux -o pipefail

            install -d ${target.dir}/usr/lib
            SDK=${target.dir}/usr/lib/google-cloud-sdk
            tar -xzf ${source.dir}/google-cloud-cli.tar.gz -C ${target.dir}/usr/lib
            for c in beta datastore firestore pubsub; do
              tar -xzf ${source.dir}/comp-$c.tar.gz -C "$SDK"
            done
            if [ "${target.arch}" = "amd64" ]; then
              tar -xzf ${source.dir}/comp-spanner.tar.gz -C "$SDK"
            fi
        - name: patch pubsub emulator embedded jackson
          runs: |
            set -eux -o pipefail

            SDK=${target.dir}/usr/lib/google-cloud-sdk
            fatjar="${SDK}/platform/pubsub-emulator/lib/cloud-pubsub-emulator-0.8.37-all.jar"
            test -f "${fatjar}"

            PATCH=${source.dir}/patch/deps
            echo "8c5623b98f32d5f7e1287ff61ed50e08ab7b11381e991fff89327faabba42261  ${PATCH}/jackson-core-2.21.7.jar" | sha256sum -c -
            echo "1290c2795e93e8a6861a6c4d9ff0d844d32f5ea178362cb2721edf5561e828b1  ${PATCH}/jackson-databind-2.21.7.jar" | sha256sum -c -
            echo "53ca085f4a150f703f49e1aabd935bd03b43e1ea3d55d135438292af22cef56b  ${PATCH}/jackson-annotations-2.21.jar" | sha256sum -c -

            jackson_pom_version() {
              unzip -p "${fatjar}" "$1" 2> /dev/null | grep '^version=' | cut -d= -f2 || true
            }
            jackson_xyz() {
              printf '%s\n' "$1" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'
            }
            jackson_ge() {
              printf '%s\n%s\n' "$2" "$1" | sort -C -V
            }

            core_ver="$(jackson_pom_version 'META-INF/maven/com.fasterxml.jackson.core/jackson-core/pom.properties')"
            databind_ver="$(jackson_pom_version 'META-INF/maven/com.fasterxml.jackson.core/jackson-databind/pom.properties')"
            floor="2.21.7"

            if ! jackson_xyz "${core_ver}" || ! jackson_xyz "${databind_ver}"; then
              echo "pubsub emulator jackson version is unfamiliar (core=${core_ver} databind=${databind_ver}); refusing to replace it" >&2
              exit 1
            fi

            core_ge=0
            databind_ge=0
            if jackson_ge "${core_ver}" "${floor}"; then
              core_ge=1
            fi
            if jackson_ge "${databind_ver}" "${floor}"; then
              databind_ge=1
            fi

            if [ "${core_ge}" -eq 1 ] || [ "${databind_ge}" -eq 1 ]; then
              if [ "${core_ge}" -ne 1 ] || [ "${databind_ge}" -ne 1 ]; then
                echo "pubsub emulator jackson versions are mixed (core=${core_ver} databind=${databind_ver}); refusing to replace a component at or above ${floor}" >&2
                exit 1
              fi
              if ! unzip -Z1 "${fatjar}" 'com/fasterxml/jackson/annotation/JsonSerializeAs.class' > /dev/null; then
                echo "pubsub emulator jackson is at or above ${floor} but jackson-annotations is missing; refusing to downgrade" >&2
                exit 1
              fi
              echo "pubsub emulator jackson core ${core_ver} and databind ${databind_ver} are at or above ${floor}; leaving bundled jars in place"
              exit 0
            fi

            tmp=$(mktemp -d)
            zip -qd "${fatjar}" \
              'com/fasterxml/jackson/*' \
              'META-INF/maven/com.fasterxml.jackson.core/*' \
              'META-INF/maven/com.fasterxml.jackson.core/*/*' \
              'META-INF/maven/com.fasterxml.jackson.datatype/*' \
              'META-INF/maven/com.fasterxml.jackson.datatype/*/*' \
              'META-INF/services/com.fasterxml.jackson.databind.Module' \
              'META-INF/versions/*/com/fasterxml/jackson/*' 2> /dev/null || true

            unzip -q "${PATCH}/jackson-core-2.21.7.jar" -d "${tmp}/core" \
              'com/fasterxml/jackson/core/*' \
              'META-INF/versions/*/com/fasterxml/jackson/core/*'
            unzip -q "${PATCH}/jackson-databind-2.21.7.jar" -d "${tmp}/databind" 'com/fasterxml/jackson/databind/*'
            unzip -q "${PATCH}/jackson-annotations-2.21.jar" -d "${tmp}/annotations" \
              'com/fasterxml/jackson/annotation/*' \
              'META-INF/maven/com.fasterxml.jackson.core/jackson-annotations/*'
            (
              cd "${tmp}/core"
              zip -r "${fatjar}" com META-INF
            )
            (
              cd "${tmp}/databind"
              zip -r "${fatjar}" com
            )
            (
              cd "${tmp}/annotations"
              zip -r "${fatjar}" com META-INF
            )

            unzip -p "${fatjar}" com/fasterxml/jackson/core/json/PackageVersion.class | grep -aq '2\.21\.7'
            unzip -p "${fatjar}" com/fasterxml/jackson/databind/cfg/PackageVersion.class | grep -aq '2\.21\.7'
            test "$(unzip -l "${fatjar}" | grep -c 'com/fasterxml/jackson/annotation/')" -gt 0
        - name: patch pubsub emulator embedded guava
          runs: |
            set -eux -o pipefail

            SDK=${target.dir}/usr/lib/google-cloud-sdk
            fatjar="${SDK}/platform/pubsub-emulator/lib/cloud-pubsub-emulator-0.8.37-all.jar"
            test -f "${fatjar}"

            PATCH=${source.dir}/patch/deps
            echo "b530942257fb935f8b2cfaa5f8eb5bd59c555fd8e8d01b8ce98912e077ea606c  ${PATCH}/guava-33.7.2-jre.jar" | sha256sum -c -

            guava_ver="$(unzip -p "${fatjar}" 'META-INF/maven/com.google.guava/guava/pom.properties' 2> /dev/null | grep '^version=' | cut -d= -f2 || true)"
            floor="33.7.2-jre"

            guava_jre_xyz() {
              printf '%s\n' "$1" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+-jre$'
            }
            guava_ge() {
              printf '%s\n%s\n' "$2" "$1" | sort -C -V
            }

            if [ -n "${guava_ver}" ] && guava_jre_xyz "${guava_ver}" && guava_ge "${guava_ver}" "${floor}"; then
              echo "pubsub emulator guava ${guava_ver} is at or above ${floor}; leaving bundled jar in place"
              exit 0
            fi

            if [ -n "${guava_ver}" ] && ! guava_jre_xyz "${guava_ver}"; then
              echo "pubsub emulator guava version is unfamiliar (${guava_ver}); refusing to replace it" >&2
              exit 1
            fi

            tmp=$(mktemp -d)
            zip -qd "${fatjar}" \
              'com/google/common/*' \
              'com/google/thirdparty/*' \
              'META-INF/maven/com.google.guava/guava/*' \
              'META-INF/maven/com.google.guava/guava/*/*' 2> /dev/null || true

            unzip -q "${PATCH}/guava-33.7.2-jre.jar" -d "${tmp}/guava" \
              'com/google/common/*' \
              'com/google/thirdparty/*' \
              'META-INF/maven/com.google.guava/guava/*'
            (
              cd "${tmp}/guava"
              zip -r "${fatjar}" com META-INF
            )

            unzip -p "${fatjar}" 'META-INF/maven/com.google.guava/guava/pom.properties' | grep -q '^version=33.7.2-jre'
            unzip -Z1 "${fatjar}" 'com/google/thirdparty/publicsuffix/PublicSuffixTrie.class' > /dev/null
            if unzip -Z1 "${fatjar}" 'com/google/thirdparty/publicsuffix/TrieParser.class' > /dev/null 2>&1; then
              echo "pubsub emulator still ships pre-33.7.2 publicsuffix TrieParser after guava replace" >&2
              exit 1
            fi
        - name: update bigtable emulator go deps
          uses: go/bump@v2
          work-dir: /go/src/google-cloud-go/bigtable
          with:
            deps:
              - google.golang.org/grpc@v1.83.2
            download: true
        - name: build cbtemulator from source (replaces Google's stale prebuilt)
          uses: go/build@v1
          work-dir: /go/src/google-cloud-go/bigtable
          with:
            output: ${target.dir}/usr/lib/google-cloud-sdk/platform/bigtable-emulator/cbtemulator
            packages: ./cmd/emulator
        - name: register components offline (.install manifests + snapshots)
          runs: |
            set -eux -o pipefail

            export SDK=${target.dir}/usr/lib/google-cloud-sdk
            export SRC=${source.dir}
            export ARCH=${target.arch}
            export BIGTABLE_SUBID=bigtable-linux-${GCLOUD_ARCH}
            python3 - << 'PY'
            import json, os, tarfile
            SDK, SRC = os.environ["SDK"], os.environ["SRC"]
            arch, bt_sub = os.environ["ARCH"], os.environ["BIGTABLE_SUBID"]
            man = json.load(open(os.path.join(SRC, "components-2.json")))
            top = {k: man[k] for k in ("revision", "schema_version", "version")}
            byid = {c["id"]: c for c in man["components"]}
            reg = {
                "beta": "comp-beta.tar.gz",
                "cloud-datastore-emulator": "comp-datastore.tar.gz",
                "cloud-firestore-emulator": "comp-firestore.tar.gz",
                "pubsub-emulator": "comp-pubsub.tar.gz",
                "bigtable": None,
                bt_sub: None,
            }
            fixed = {bt_sub: ["platform/bigtable-emulator/cbtemulator"]}
            if arch == "amd64":
                reg["cloud-spanner-emulator"] = None
                reg["cloud-spanner-emulator-linux-x86_64"] = "comp-spanner.tar.gz"
            d = os.path.join(SDK, ".install")
            os.makedirs(d, exist_ok=True)
            for cid, arc in reg.items():
                json.dump({"components": [byid[cid]], **top},
                          open(os.path.join(d, cid + ".snapshot.json"), "w"))
                files = list(fixed.get(cid, []))
                if arc:
                    with tarfile.open(os.path.join(SRC, arc)) as t:
                        files = sorted(m.name for m in t.getmembers() if m.isfile())
                open(os.path.join(d, cid + ".manifest"), "w").write(
                    "\n".join(files) + ("\n" if files else ""))
            print("registered components:", sorted(reg))
            PY
        - name: offline config + symlinks + slim
          runs: |
            set -eux -o pipefail

            SDK=${target.dir}/usr/lib/google-cloud-sdk
            cat > "$SDK/properties" << 'EOF'
            [component_manager]
            disable_update_check = true
            [core]
            disable_usage_reporting = true
            EOF
            install -d ${target.dir}/usr/bin
            for b in gcloud gsutil bq; do
              ln -sf ../lib/google-cloud-sdk/bin/$b ${target.dir}/usr/bin/$b
            done
            rm -rf "$SDK/platform/bundledpythonunix"
            rm -f "$SDK/bin/gcloud-crc32c"
            find "$SDK" -name '*.pyc' -delete 2> /dev/null || true
            find "$SDK" -type d -name '__pycache__' -prune -exec rm -rf {} + 2> /dev/null || true
            find "$SDK" -type f \( -name '*requirements*.txt' -o -name 'constraints*.txt' -o -name 'Pipfile' -o -name 'Pipfile.lock' \) -delete 2> /dev/null || true
        - uses: dhi/build-pkg:0
          with:
            depends:
              - libc6
              - eclipse-temurin-21-jre
              - python-3.13
              - bash
              - coreutils
              - sed
              - grep
            description: Google Cloud CLI with local emulators (datastore, firestore, pub/sub, bigtable; spanner amd64-only)
            files:
              - usr/lib/google-cloud-sdk
              - usr/bin/gcloud
              - usr/bin/gsutil
              - usr/bin/bq
            formats:
              - deb
            license: Apache-2.0
            name: cloud-sdk-emulators
            rel: 1
            url: https://cloud.google.com/sdk
            version: 591.0.0
os-release:
  name: Docker Hardened Images (Debian)
  id: debian
  version-id: "13"
  version-codename: trixie
  pretty-name: Docker Hardened Images/Debian GNU/Linux 13 (trixie)
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
