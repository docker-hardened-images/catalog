contents:
  packages:
    - base-files
  builds:
    - name: cloud-sdk-emulators
      work-dir: /work
      contents:
        repositories:
          - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
        keyring:
          - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
        packages:
          - bash
          - ca-certificates-bundle
          - coreutils
          - findutils
          - git
          - gzip
          - tar
          - python3
          - golang-1.26=1.26.5-0
          - golang-1.26-oci-config=1.26.5-0
        files:
          - url: https://dl.google.com/dl/cloudsdk/channels/rapid/downloads/google-cloud-cli-580.0.0-linux-${GCLOUD_ARCH}.tar.gz
            checksum: sha256:${GCLOUD_SHA256}
            path: ${source.dir}/google-cloud-cli.tar.gz
            spdx:
              name: google-cloud-cli
              version: 580.0.0
              packages:
                - name: google-cloud-cli
                  purl: pkg:generic/google-cloud-cli@580.0.0
                  license: Apache-2.0
            uid: 0
            gid: 0
          - url: https://dl.google.com/dl/cloudsdk/channels/rapid/components/google-cloud-sdk-beta-20260807154943.tar.gz
            checksum: sha256:0034138f7ee8d13690dae0a1443a09ecbdae1e45497360c14dabd2c57a79c8a2
            path: ${source.dir}/comp-beta.tar.gz
            spdx:
              name: gcloud-beta
              version: 580.0.0
              packages:
                - name: gcloud-beta
                  purl: pkg:generic/google-cloud-cli-beta@580.0.0
                  license: Apache-2.0
            uid: 0
            gid: 0
          - url: https://dl.google.com/dl/cloudsdk/channels/rapid/components/google-cloud-sdk-cloud-datastore-emulator-20230707144938.tar.gz
            checksum: sha256:8a04a91169264f831ef8ab01507b505579f9216c223d16f33429c39be5a16ce2
            path: ${source.dir}/comp-datastore.tar.gz
            spdx:
              name: cloud-datastore-emulator
              version: 2.3.1
              packages:
                - name: cloud-datastore-emulator
                  purl: pkg:generic/cloud-datastore-emulator@2.3.1
                  license: Apache-2.0
            uid: 0
            gid: 0
          - url: https://dl.google.com/dl/cloudsdk/channels/rapid/components/google-cloud-sdk-cloud-firestore-emulator-20260717053915.tar.gz
            checksum: sha256:e962450b637827664094959571fd92c3680de863936bd481bd0a050f76ca91ba
            path: ${source.dir}/comp-firestore.tar.gz
            spdx:
              name: cloud-firestore-emulator
              version: 1.22.0
              packages:
                - name: cloud-firestore-emulator
                  purl: pkg:generic/cloud-firestore-emulator@1.22.0
                  license: Apache-2.0
            uid: 0
            gid: 0
          - url: https://dl.google.com/dl/cloudsdk/channels/rapid/components/google-cloud-sdk-pubsub-emulator-20260710150251.tar.gz
            checksum: sha256:ce429db6453c95aee8d801cfa27486f9aca691be5b176f80223be0126280ba96
            path: ${source.dir}/comp-pubsub.tar.gz
            spdx:
              name: pubsub-emulator
              version: 0.8.34
              packages:
                - name: pubsub-emulator
                  purl: pkg:generic/pubsub-emulator@0.8.34
                  license: Apache-2.0
            uid: 0
            gid: 0
          - url: git+https://github.com/googleapis/google-cloud-go.git#bigtable/v1.52.0
            checksum: f6dae8ddd8ecb28e2955e47b70b51a419c6d3f64
            path: /go/src/google-cloud-go
            spdx:
              name: cbtemulator
              version: 1.52.0
              packages:
                - name: cbtemulator
                  purl: pkg:golang/cloud.google.com/go/bigtable@v1.52.0
                  license: Apache-2.0
            uid: 0
            gid: 0
          - url: https://dl.google.com/dl/cloudsdk/channels/rapid/components/google-cloud-sdk-cloud-spanner-emulator-linux-x86_64-20260807154943.tar.gz
            checksum: sha256:2249fc658438d2434c1cf7f0e444107cfc24ce1b894bcdad3e8a7dc947fe62dd
            path: ${source.dir}/comp-spanner.tar.gz
            platforms:
              - linux/amd64
            spdx:
              name: cloud-spanner-emulator
              version: 1.5.56
              packages:
                - name: cloud-spanner-emulator
                  purl: pkg:generic/cloud-spanner-emulator@1.5.56
                  license: Apache-2.0
            uid: 0
            gid: 0
          - url: https://dl.google.com/dl/cloudsdk/channels/rapid/components-v580.0.0.json
            checksum: sha256:8ada0d2ecebe67d9c66fcf0528312250ad868f85c4264e9b8a0c5d64adce12e0
            path: ${source.dir}/components-2.json
            uid: 0
            gid: 0
      pipeline:
        - name: assemble SDK tree offline (core + components, FHS /usr/lib)
          runs: |
            set -eux -o pipefail

            install -d ${target.dir}/usr/lib
            SDK=${target.dir}/usr/lib/google-cloud-sdk
            tar -xzf ${source.dir}/google-cloud-cli.tar.gz -C ${target.dir}/usr/lib
            for c in beta datastore firestore pubsub; do
              tar -xzf ${source.dir}/comp-$c.tar.gz -C "$SDK"
            done
            if [ "${target.arch}" = "amd64" ]; then
              tar -xzf ${source.dir}/comp-spanner.tar.gz -C "$SDK"
            fi
        - name: update bigtable emulator go deps
          uses: go/bump@v2
          work-dir: /go/src/google-cloud-go/bigtable
          with:
            deps:
              - google.golang.org/grpc@v1.82.1
              - golang.org/x/net@v0.57.0
              - golang.org/x/text@v0.40.0
            download: true
        - name: build cbtemulator from source (replaces Google's stale prebuilt)
          uses: go/build@v1
          work-dir: /go/src/google-cloud-go/bigtable
          with:
            output: ${target.dir}/usr/lib/google-cloud-sdk/platform/bigtable-emulator/cbtemulator
            packages: ./cmd/emulator
        - name: register components offline (.install manifests + snapshots)
          runs: |
            set -eux -o pipefail

            export SDK=${target.dir}/usr/lib/google-cloud-sdk
            export SRC=${source.dir}
            export ARCH=${target.arch}
            export BIGTABLE_SUBID=bigtable-linux-${GCLOUD_ARCH}
            python3 - << 'PY'
            import json, os, tarfile
            SDK, SRC = os.environ["SDK"], os.environ["SRC"]
            arch, bt_sub = os.environ["ARCH"], os.environ["BIGTABLE_SUBID"]
            man = json.load(open(os.path.join(SRC, "components-2.json")))
            top = {k: man[k] for k in ("revision", "schema_version", "version")}
            byid = {c["id"]: c for c in man["components"]}
            reg = {
                "beta": "comp-beta.tar.gz",
                "cloud-datastore-emulator": "comp-datastore.tar.gz",
                "cloud-firestore-emulator": "comp-firestore.tar.gz",
                "pubsub-emulator": "comp-pubsub.tar.gz",
                "bigtable": None,
                bt_sub: None,
            }
            fixed = {bt_sub: ["platform/bigtable-emulator/cbtemulator"]}
            if arch == "amd64":
                reg["cloud-spanner-emulator"] = None
                reg["cloud-spanner-emulator-linux-x86_64"] = "comp-spanner.tar.gz"
            d = os.path.join(SDK, ".install")
            os.makedirs(d, exist_ok=True)
            for cid, arc in reg.items():
                json.dump({"components": [byid[cid]], **top},
                          open(os.path.join(d, cid + ".snapshot.json"), "w"))
                files = list(fixed.get(cid, []))
                if arc:
                    with tarfile.open(os.path.join(SRC, arc)) as t:
                        files = sorted(m.name for m in t.getmembers() if m.isfile())
                open(os.path.join(d, cid + ".manifest"), "w").write(
                    "\n".join(files) + ("\n" if files else ""))
            print("registered components:", sorted(reg))
            PY
        - name: offline config + symlinks + slim
          runs: |
            set -eux -o pipefail

            SDK=${target.dir}/usr/lib/google-cloud-sdk
            cat > "$SDK/properties" << 'EOF'
            [component_manager]
            disable_update_check = true
            [core]
            disable_usage_reporting = true
            EOF
            install -d ${target.dir}/usr/bin
            for b in gcloud gsutil bq; do
              ln -sf ../lib/google-cloud-sdk/bin/$b ${target.dir}/usr/bin/$b
            done
            rm -rf "$SDK/platform/bundledpythonunix"
            find "$SDK" -name '*.pyc' -delete 2> /dev/null || true
            find "$SDK" -type d -name '__pycache__' -prune -exec rm -rf {} + 2> /dev/null || true
            find "$SDK" -type f \( -name '*requirements*.txt' -o -name 'constraints*.txt' -o -name 'Pipfile' -o -name 'Pipfile.lock' \) -delete 2> /dev/null || true
        - uses: dhi/build-pkg:0
          with:
            depends:
              - libc6
              - eclipse-temurin-21-jre
              - python-3.13
              - bash
              - coreutils
              - sed
              - grep
            description: Google Cloud CLI with local emulators (datastore, firestore, pub/sub, bigtable; spanner amd64-only)
            files:
              - usr/lib/google-cloud-sdk
              - usr/bin/gcloud
              - usr/bin/gsutil
              - usr/bin/bq
            formats:
              - deb
            license: Apache-2.0
            name: cloud-sdk-emulators
            rel: 0
            url: https://cloud.google.com/sdk
            version: 580.0.0
