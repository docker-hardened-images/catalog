# syntax=dhi.io/build:2-debian13

image: dhi.io/pkg-datahub-actions
variant: runtime
tags:
  - 1.7.0.1
  - 1.7.0.1-r16
  - 1.7.0.1-debian13
  - 1.7.0.1-r16-debian13
platforms:
  - linux/amd64
  - linux/arm64
dates:
  release: "2025-10-01"
vars:
  ARCH: '#{ target.arch == "amd64" ? "x86_64" : "aarch64" }'
  COMMIT_SHA: e99431ec510d7a2001f815c6bf70913c493af76e
  EXTRAS: all
  PYTHON_MAJOR_MINOR_VERSION: "3.10"
  PYTHON_MINOR: "3.10"
  PYTHON_VERSION: 3.10.22-2
  REL: "16"
  SEMVER_MAJOR_MINOR_VERSION: "1.7"
  SEMVER_MAJOR_VERSION: "1"
  SEMVER_VERSION: 1.7.0.1
  UV_VERSION: 0.13.6
  VERSION: 1.7.0.1
  VERSION_MAJOR_MINOR_PATCH: 1.7.0
contents:
  repositories:
    - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
  keyring:
    - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
  packages:
    - base-files
  builds:
    - name: datahub-actions
      work-dir: ${source.dir}
      environment:
        UV_NO_MANAGED_PYTHON: "true"
        UV_PYTHON_DOWNLOADS: never
      caches:
        - path: /root/.cache/uv
      contents:
        packages:
          - bash
          - build-essential
          - ca-certificates
          - cargo
          - coreutils
          - diffutils
          - findutils
          - g++
          - grep
          - gzip
          - libaio-dev
          - libffi-dev
          - libkrb5-dev
          - libldap2-dev
          - librdkafka-dev
          - libsasl2-dev
          - libssl-dev
          - libstdc++6
          - libxml2-dev
          - libxslt1-dev
          - pkg-config
          - sed
          - tar
          - unixodbc-dev
          - libpython-3.10-minimal=3.10.22-2
          - libpython-3.10-stdlib=3.10.22-2
          - libpython-3.10=3.10.22-2
          - libpython-3.10-dev=3.10.22-2
          - python-3.10-minimal=3.10.22-2
          - python-3.10=3.10.22-2
          - python-3.10-dev=3.10.22-2
          - python3-pip
          - python3-setuptools
          - python3-wheel
        files:
          - url: https://github.com/astral-sh/uv/releases/download/0.13.6/uv-${ARCH}-unknown-linux-gnu.tar.gz
            path: ${source.dir}/uv-unknown-linux-gnu.tar.gz
            uid: 0
            gid: 0
          - url: git+https://github.com/datahub-project/datahub.git#v1.7.0.1
            checksum: e99431ec510d7a2001f815c6bf70913c493af76e
            path: ${source.dir}/datahub-src
            spdx:
              name: datahub
              version: 1.7.0.1
              packages:
                - name: datahub
                  purl: pkg:github/datahub-project/datahub@v1.7.0.1
                  license: Apache-2.0
            uid: 0
            gid: 0
      pipeline:
        - name: setup uv
          runs: |
            set -eux -o pipefail

            mkdir -p /usr/local/bin
            tar -xzf "${source.dir}/uv-unknown-linux-gnu.tar.gz" -C /usr/local/bin --strip-components=1
            chmod +x /usr/local/bin/uv
        - name: build venv at final path and stage it
          privileged: true
          runs: |
            set -eux -o pipefail

            export SOURCE_DIR="${source.dir}" TARGET_DIR="${target.dir}" \
              PYTHON_BIN=/usr/bin/python3.10 EXTRAS="all"
            bash "${source.dir}/build-venv.sh"
        - name: install datahub-actions configs from the monorepo checkout
          work-dir: ${source.dir}/datahub-src/docker/datahub-actions
          runs: |
            set -eux -o pipefail

            mkdir -p ${target.dir}/etc/datahub/actions/system/conf \
              ${target.dir}/usr/share/datahub-actions/scripts

            install -m 0755 start.sh ${target.dir}/usr/share/datahub-actions/scripts/start.sh

            install -m 0644 config/executor.yaml \
              config/doc_propagation_action.yaml \
              config/slack_action.yaml \
              config/teams_action.yaml \
              ${target.dir}/etc/datahub/actions/system/conf/
        - name: use importlib metadata backend for pip
          privileged: true
          runs: |
            set -eux -o pipefail

            sp="${target.dir}/usr/lib/datahub-actions/lib/python3.10/site-packages"
            rm -rf "$sp/pip/_vendor/pkg_resources"
            sed -i '/^setuptools==/d' "$sp/pip/_vendor/vendor.txt"
            python3.10 - "$sp/pip/_vendor/bom.cdx.json" "$sp/pip/_internal/metadata/__init__.py" << 'PY'
            import json
            import pathlib
            import sys

            bom_path, meta_path = sys.argv[1:]
            with open(bom_path, encoding="utf-8") as handle:
                doc = json.load(handle)

            def is_setuptools_ref(value):
                return isinstance(value, str) and value.startswith("pkg:pypi/setuptools@")

            doc["components"] = [
                comp for comp in (doc.get("components") or [])
                if comp.get("name") != "setuptools"
            ]
            kept = []
            for dep in doc.get("dependencies") or []:
                if is_setuptools_ref(dep.get("ref")):
                    continue
                depends = dep.get("dependsOn")
                if isinstance(depends, list):
                    dep["dependsOn"] = [item for item in depends if not is_setuptools_ref(item)]
                kept.append(dep)
            doc["dependencies"] = kept
            rendered = json.dumps(doc)
            if "setuptools" in rendered:
                raise SystemExit("setuptools remains in pip vendor bom")
            with open(bom_path, "w", encoding="utf-8") as handle:
                json.dump(doc, handle, indent=2)
                handle.write("\n")

            meta = pathlib.Path(meta_path)
            text = meta.read_text(encoding="utf-8")
            needle = "if sys.version_info < (3, 11):"
            start = text.find(needle)
            if start < 0:
                raise SystemExit("pip metadata backend selector not found")
            window = text[start:start + 500]
            old = "return False"
            idx = window.find(old)
            if idx < 0:
                raise SystemExit("pip metadata backend return not found")
            abs_idx = start + idx
            text = text[:abs_idx] + "return True" + text[abs_idx + len(old):]
            meta.write_text(text, encoding="utf-8")
            PY
            if grep -E 'setuptools==|pkg:pypi/setuptools@' "$sp/pip/_vendor/vendor.txt" "$sp/pip/_vendor/bom.cdx.json"; then
              echo "pip vendor metadata still names setuptools" >&2
              exit 1
            fi
            test ! -e "$sp/pip/_vendor/pkg_resources"
            venv_py="${target.dir}/usr/lib/datahub-actions/bin/python"
            "$venv_py" -c 'from pip._internal.metadata import select_backend; backend = select_backend(); assert backend.NAME == "importlib", backend.NAME'
            rm -rf /tmp/dhi-pip-download
            "$venv_py" -m pip download --only-binary=:all: --dest /tmp/dhi-pip-download 'setuptools==84.1.0'
            test -n "$(find /tmp/dhi-pip-download -name 'setuptools-84.1.0*.whl' -print -quit)"
        - name: python dependencies sbom
          uses: sbom@v1
          with:
            extra-scanners: python-package-cataloger
            prefix: datahub-actions
            source: ${target.dir}/usr/lib/datahub-actions
        - uses: dhi/build-pkg:0
          with:
            depends:
              - python-3.10
              - bash
              - curl
              - libaio1t64
              - libffi8
              - libkrb5-3
              - libldap2
              - libodbc2
              - librdkafka1
              - libsasl2-2
              - unixodbc
            description: DataHub Actions framework
            files:
              - usr/lib/datahub-actions
              - usr/bin/datahub-actions
              - etc/datahub
              - usr/share/datahub-actions
            formats:
              - deb
            license: Apache-2.0
            name: datahub-actions
            rel: 16
            url: https://github.com/datahub-project/datahub
            version: 1.7.0.1
      paths:
        - type: file
          path: ${source.dir}/build-venv.sh
          uid: 0
          gid: 0
          mode: "0755"
          source: package/main/datahub-actions/build-venv.sh
os-release:
  name: Docker Hardened Images (Debian)
  id: debian
  version-id: "13"
  version-codename: trixie
  pretty-name: Docker Hardened Images/Debian GNU/Linux 13 (trixie)
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
