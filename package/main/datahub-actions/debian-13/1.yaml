# syntax=dhi.io/build:2-debian13

image: dhi.io/pkg-datahub-actions
variant: runtime
tags:
  - 1.7.0.1
  - 1.7.0.1-r24
  - 1.7.0.1-debian13
  - 1.7.0.1-r24-debian13
platforms:
  - linux/amd64
  - linux/arm64
dates:
  release: "2025-10-01"
vars:
  ACRYL_DATAHUB_SDIST_CHECKSUM: sha256:4d8c7227bda8ab75bf76a125e28c8f7314f4cd596ab0fb5f0723b7b2a82bbd92
  ARCH: '#{ target.arch == "amd64" ? "x86_64" : "aarch64" }'
  COMMIT_SHA: e99431ec510d7a2001f815c6bf70913c493af76e
  EXTRAS: all
  PACKAGE_DEB_NAME: datahub-actions
  PUBLISH_REL: "24"
  PYPI_VERSION: 1.7.0.19
  PYTHON_MAJOR_MINOR_VERSION: "3.11"
  PYTHON_MINOR: "3.11"
  PYTHON_VERSION: 3.11.18-7
  REL: "24"
  SEMVER_MAJOR_MINOR_VERSION: "1.7"
  SEMVER_MAJOR_VERSION: "1"
  SEMVER_VERSION: 1.7.0.1
  UV_VERSION: 0.13.7
  VERSION: 1.7.0.1
  VERSION_MAJOR_MINOR_PATCH: 1.7.0
contents:
  repositories:
    - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
  keyring:
    - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
  packages:
    - base-files
  builds:
    - name: datahub-actions
      work-dir: ${source.dir}
      environment:
        UV_NO_MANAGED_PYTHON: "true"
        UV_PYTHON_DOWNLOADS: never
      caches:
        - path: /root/.cache/uv
      contents:
        packages:
          - bash
          - build-essential
          - ca-certificates
          - cargo
          - coreutils
          - diffutils
          - findutils
          - g++
          - grep
          - gzip
          - libaio-dev
          - libffi-dev
          - libkrb5-dev
          - libldap2-dev
          - librdkafka-dev
          - libsasl2-dev
          - libssl-dev
          - libstdc++6
          - libxml2-dev
          - libxslt1-dev
          - pkg-config
          - sed
          - tar
          - unixodbc-dev
          - libpython-3.11-minimal=3.11.18-7
          - libpython-3.11-stdlib=3.11.18-7
          - libpython-3.11=3.11.18-7
          - libpython-3.11-dev=3.11.18-7
          - python-3.11-minimal=3.11.18-7
          - python-3.11=3.11.18-7
          - python-3.11-dev=3.11.18-7
          - python3-pip
          - python3-setuptools
          - python3-wheel
        files:
          - url: https://github.com/astral-sh/uv/releases/download/0.13.7/uv-${ARCH}-unknown-linux-gnu.tar.gz
            path: ${source.dir}/uv-unknown-linux-gnu.tar.gz
            uid: 0
            gid: 0
          - url: https://files.pythonhosted.org/packages/source/a/acryl-datahub/acryl_datahub-1.7.0.19.tar.gz
            checksum: sha256:4d8c7227bda8ab75bf76a125e28c8f7314f4cd596ab0fb5f0723b7b2a82bbd92
            path: ${source.dir}/acryl_datahub.tar.gz
            spdx:
              name: acryl-datahub
              version: 1.7.0.19
              packages:
                - name: acryl-datahub
                  purl: pkg:pypi/acryl-datahub@1.7.0.19
                  license: Apache-2.0
            uid: 0
            gid: 0
          - url: git+https://github.com/datahub-project/datahub.git#v1.7.0.1
            checksum: e99431ec510d7a2001f815c6bf70913c493af76e
            path: ${source.dir}/datahub-src
            spdx:
              name: datahub
              version: 1.7.0.1
              packages:
                - name: datahub
                  purl: pkg:github/datahub-project/datahub@v1.7.0.1
                  license: Apache-2.0
            uid: 0
            gid: 0
      pipeline:
        - name: setup uv
          runs: |
            set -eux -o pipefail

            mkdir -p /usr/local/bin
            tar -xzf "${source.dir}/uv-unknown-linux-gnu.tar.gz" -C /usr/local/bin --strip-components=1
            chmod +x /usr/local/bin/uv
        - name: build venv at final path and stage it
          privileged: true
          runs: |
            set -eux -o pipefail

            export SOURCE_DIR="${source.dir}" TARGET_DIR="${target.dir}" \
              PYTHON_BIN=/usr/bin/python3.11 EXTRAS="all" \
              ACTIONS_VERSION="1.7.0.1" ACRYL_DATAHUB_VERSION="1.7.0.19"
            bash "${source.dir}/build-venv.sh"
        - name: install datahub-actions configs from the monorepo checkout
          work-dir: ${source.dir}/datahub-src/docker/datahub-actions
          runs: |
            set -eux -o pipefail

            mkdir -p ${target.dir}/etc/datahub/actions/system/conf \
              ${target.dir}/usr/share/datahub-actions/scripts

            install -m 0755 start.sh ${target.dir}/usr/share/datahub-actions/scripts/start.sh

            install -m 0644 config/executor.yaml \
              config/doc_propagation_action.yaml \
              config/slack_action.yaml \
              config/teams_action.yaml \
              ${target.dir}/etc/datahub/actions/system/conf/
        - name: drop pip vendored pkg_resources
          runs: |
            set -eux -o pipefail

            sp="${target.dir}/usr/lib/datahub-actions/lib/python3.11/site-packages"
            rm -rf "$sp/pip/_vendor/pkg_resources"
            sed -i '/^setuptools==/d' "$sp/pip/_vendor/vendor.txt"
            python3.11 - "$sp/pip/_vendor/bom.cdx.json" << 'PY'
            import json
            import sys

            path = sys.argv[1]
            with open(path, encoding="utf-8") as handle:
                doc = json.load(handle)

            def is_setuptools_ref(value):
                return isinstance(value, str) and value.startswith("pkg:pypi/setuptools@")

            doc["components"] = [
                comp for comp in (doc.get("components") or [])
                if comp.get("name") != "setuptools"
            ]
            kept = []
            for dep in doc.get("dependencies") or []:
                if is_setuptools_ref(dep.get("ref")):
                    continue
                depends = dep.get("dependsOn")
                if isinstance(depends, list):
                    dep["dependsOn"] = [item for item in depends if not is_setuptools_ref(item)]
                kept.append(dep)
            doc["dependencies"] = kept
            rendered = json.dumps(doc)
            if "setuptools" in rendered:
                raise SystemExit("setuptools remains in pip vendor bom")
            with open(path, "w", encoding="utf-8") as handle:
                json.dump(doc, handle, indent=2)
                handle.write("\n")
            PY
            if grep -E 'setuptools==|pkg:pypi/setuptools@' "$sp/pip/_vendor/vendor.txt" "$sp/pip/_vendor/bom.cdx.json"; then
              echo "pip vendor metadata still names setuptools" >&2
              exit 1
            fi
            test ! -e "$sp/pip/_vendor/pkg_resources"
            PYTHONPATH="$sp" python3.11 -m pip --version
        - name: python dependencies sbom
          uses: sbom@v1
          with:
            extra-scanners: python-package-cataloger
            prefix: datahub-actions
            source: ${target.dir}/usr/lib/datahub-actions
        - name: stage python dependencies sbom
          runs: |
            set -eux -o pipefail

            test -s /opt/docker/sbom/datahub-actions/.spdx.datahub-actions.json
            mkdir -p "${target.dir}/opt/docker/sbom"
            cp -a /opt/docker/sbom/datahub-actions "${target.dir}/opt/docker/sbom/"
        - uses: dhi/build-pkg:0
          with:
            depends:
              - python-3.11
              - bash
              - curl
              - libaio1t64
              - libffi8
              - libkrb5-3
              - libldap2
              - libodbc2
              - librdkafka1
              - libsasl2-2
              - unixodbc
            description: DataHub Actions framework
            files:
              - usr/lib/datahub-actions
              - usr/bin/datahub-actions
              - etc/datahub
              - usr/share/datahub-actions
              - opt/docker/sbom/datahub-actions
            formats:
              - deb
            license: Apache-2.0
            name: datahub-actions
            rel: 24
            url: https://github.com/datahub-project/datahub
            version: 1.7.0.1
      paths:
        - type: file
          path: ${source.dir}/build-venv.sh
          uid: 0
          gid: 0
          mode: "0755"
          source: package/main/datahub-actions/build-venv.sh
os-release:
  name: Docker Hardened Images (Debian)
  id: debian
  version-id: "13"
  version-codename: trixie
  pretty-name: Docker Hardened Images/Debian GNU/Linux 13 (trixie)
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
