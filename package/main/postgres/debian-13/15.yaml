# syntax=dhi.io/build:2-debian13

image: dhi.io/pkg-postgres
variant: runtime
tags:
  - 15-r2
  - 15.20-r2
  - 15-r2-debian13
  - 15.20-r2-debian13
platforms:
  - linux/amd64
  - linux/arm64
dates:
  release: "2022-10-13"
  end-of-life: "2027-11-11"
vars:
  DHI_VERSION: 15.20-2+dhi
  EXPECTED_PACKAGES: postgresql-15,postgresql-client-15,postgresql-server-dev-15,postgresql-plperl-15,postgresql-plpython3-15,postgresql-pltcl-15
  LIBPQ_OWNER: "false"
  MAJOR_VERSION: "15"
  MINOR_VERSION: "20"
  PACKAGE_NAME: postgresql-15
  REL: "2"
  VERSION: "15.20"
contents:
  repositories:
    - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
  keyring:
    - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
  packages:
    - '!base-files'
  builds:
    - name: postgresql-15 deb
      work-dir: ${source.dir}/postgresql-15.20
      contents:
        packages:
          - autoconf
          - automake
          - bash
          - bison
          - build-essential
          - ca-certificates
          - clang
          - coreutils
          - debhelper
          - dpkg-dev
          - flex
          - grep
          - libcurl4-openssl-dev
          - libicu-dev
          - libkrb5-dev
          - libldap2-dev
          - liblz4-dev
          - libnuma-dev
          - libpam0g-dev
          - libperl-dev
          - libreadline-dev
          - libselinux1-dev
          - libssl-dev
          - liburing-dev
          - libxml2-dev
          - libxslt1-dev
          - libzstd-dev
          - llvm-dev
          - lz4
          - mawk
          - perl
          - pkgconf
          - python3-dev
          - sed
          - tcl-dev
          - tzdata
          - uuid-dev
          - zlib1g-dev
          - zstd
        files:
          - url: https://ftp.postgresql.org/pub/source/v15.20/postgresql-15.20.tar.gz
            checksum: https://ftp.postgresql.org/pub/source/v15.20/postgresql-15.20.tar.gz.sha256
            path: ${source.dir}/
            spdx:
              name: postgresql
              version: "15.20"
              packages:
                - name: postgresql
                  purl: pkg:dhi/postgresql@15.20
                  license: PostgreSQL
            uid: 0
            gid: 0
      pipeline:
        - name: patch source
          uses: patch@v1
          with:
            options: -p1
            patches:
              - ${source.dir}/patch/initdb.patch
              - ${source.dir}/patch/pager-less.patch
        - name: render debian templates
          shell: /bin/bash
          runs: |
            set -eux -o pipefail

            for f in debian/*MAJOR*; do
              mv "$f" "${f//MAJOR/15}"
            done
            sed "s/@MAJOR@/15/g" debian/control.in > debian/control
            if [ "false" = "true" ]; then
              printf '\n' >> debian/control
              sed "s/@MAJOR@/15/g" debian/control.libs.in >> debian/control
            else
              rm debian/lib*.install
            fi
            sed "s/@MAJOR@/15/g" debian/changelog.in > debian/changelog
            rm debian/control.in debian/control.libs.in debian/changelog.in
        - uses: dpkg/bump@v1
          with:
            changelog:
              - Use the Debian per-version install layout and /var/run/postgresql as the default socket directory
              - Print a shorter initdb success message for container images
              - Use less as the default psql pager
            version: 15.20-2+dhi
        - uses: dpkg/build@v1
          environment:
            DHI_PG_MAJOR: "15"
          with:
            args: -b -uc -us -d
      paths:
        - type: directory
          path: ${source.dir}/postgresql-15.20/debian
          uid: 0
          gid: 0
          mode: "0600"
          source: package/main/postgres/debian-13/debian
        - type: file
          path: ${source.dir}/patch/initdb.patch
          uid: 0
          gid: 0
          source: package/main/postgres/patch/initdb.patch
        - type: file
          path: ${source.dir}/patch/pager-less.patch
          uid: 0
          gid: 0
          source: package/main/postgres/patch/pager-less.patch
os-release:
  name: Docker Hardened Images (Debian)
  id: debian
  version-id: "13"
  version-codename: trixie
  pretty-name: Docker Hardened Images/Debian GNU/Linux 13 (trixie)
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
