# syntax=dhi.io/build:2-debian13

image: dhi.io/pkg-postgres
variant: runtime
tags:
  - 18-r3
  - 18.7-r3
  - 18-r3-debian13
  - 18.7-r3-debian13
platforms:
  - linux/amd64
  - linux/arm64
dates:
  release: "2025-09-25"
  end-of-life: "2030-11-14"
vars:
  DHI_VERSION: 18.7-3+dhi
  EXPECTED_PACKAGES: libpq-dev,libpq5,libpq-oauth,libecpg6,libecpg-dev,libecpg-compat3,libpgtypes3,postgresql-18,postgresql-client-18,postgresql-server-dev-18,postgresql-plperl-18,postgresql-plpython3-18,postgresql-pltcl-18
  LIBPQ_OWNER: "true"
  MAJOR_VERSION: "18"
  MINOR_VERSION: "7"
  PACKAGE_NAME: postgresql-18
  REL: "3"
  VERSION: "18.7"
contents:
  repositories:
    - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
  keyring:
    - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
  packages:
    - '!base-files'
  builds:
    - name: postgresql-18 deb
      work-dir: ${source.dir}/postgresql-18.7
      contents:
        packages:
          - autoconf
          - automake
          - bash
          - bison
          - build-essential
          - ca-certificates
          - clang
          - coreutils
          - debhelper
          - dpkg-dev
          - flex
          - grep
          - libcurl4-openssl-dev
          - libicu-dev
          - libkrb5-dev
          - libldap2-dev
          - liblz4-dev
          - libnuma-dev
          - libpam0g-dev
          - libperl-dev
          - libreadline-dev
          - libselinux1-dev
          - libssl-dev
          - liburing-dev
          - libxml2-dev
          - libxslt1-dev
          - libzstd-dev
          - llvm-dev
          - lz4
          - mawk
          - perl
          - pkgconf
          - python3-dev
          - sed
          - tcl-dev
          - tzdata
          - uuid-dev
          - zlib1g-dev
          - zstd
        files:
          - url: https://ftp.postgresql.org/pub/source/v18.7/postgresql-18.7.tar.gz
            checksum: https://ftp.postgresql.org/pub/source/v18.7/postgresql-18.7.tar.gz.sha256
            path: ${source.dir}/
            spdx:
              name: postgresql
              version: "18.7"
              packages:
                - name: postgresql
                  purl: pkg:dhi/postgresql@18.7
                  license: PostgreSQL
            uid: 0
            gid: 0
      pipeline:
        - name: patch source
          uses: patch@v1
          with:
            options: -p1
            patches:
              - ${source.dir}/patch/initdb.patch
              - ${source.dir}/patch/pager-less.patch
        - name: render debian templates
          shell: /bin/bash
          runs: |
            set -eux -o pipefail

            for f in debian/*MAJOR*; do
              mv "$f" "${f//MAJOR/18}"
            done
            sed "s/@MAJOR@/18/g" debian/control.in > debian/control
            if [ "true" = "true" ]; then
              printf '\n' >> debian/control
              sed "s/@MAJOR@/18/g" debian/control.libs.in >> debian/control
            else
              rm debian/lib*.install
            fi
            sed "s/@MAJOR@/18/g" debian/changelog.in > debian/changelog
            rm debian/control.in debian/control.libs.in debian/changelog.in
        - uses: dpkg/bump@v1
          with:
            changelog:
              - Use the Debian per-version install layout and /var/run/postgresql as the default socket directory
              - Print a shorter initdb success message for container images
              - Use less as the default psql pager
            version: 18.7-3+dhi
        - uses: dpkg/build@v1
          environment:
            DHI_PG_MAJOR: "18"
          with:
            args: -b -uc -us -d
      paths:
        - type: directory
          path: ${source.dir}/postgresql-18.7/debian
          uid: 0
          gid: 0
          mode: "0600"
          source: package/main/postgres/debian-13/debian
        - type: file
          path: ${source.dir}/patch/initdb.patch
          uid: 0
          gid: 0
          source: package/main/postgres/patch/initdb.patch
        - type: file
          path: ${source.dir}/patch/pager-less.patch
          uid: 0
          gid: 0
          source: package/main/postgres/patch/pager-less.patch
os-release:
  name: Docker Hardened Images (Debian)
  id: debian
  version-id: "13"
  version-codename: trixie
  pretty-name: Docker Hardened Images/Debian GNU/Linux 13 (trixie)
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
