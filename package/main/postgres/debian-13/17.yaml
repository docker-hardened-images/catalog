# syntax=dhi.io/build:2-debian13

image: dhi.io/pkg-postgres
variant: runtime
tags:
  - 17-r1
  - 17.11-r1
  - 17-r1-debian13
  - 17.11-r1-debian13
platforms:
  - linux/amd64
  - linux/arm64
dates:
  release: "2024-09-26"
  end-of-life: "2029-11-08"
vars:
  MAJOR_VERSION: "17"
  MINOR_VERSION: "11"
  PACKAGE_NAME: postgresql-17
  REL: "1"
  VERSION: "17.11"
contents:
  packages:
    - base-files
  builds:
    - name: postgresql-17
      work-dir: ${source.dir}/postgresql-17.11
      contents:
        packages:
          - autoconf
          - automake
          - bash
          - bison
          - build-essential
          - ca-certificates
          - clang
          - coreutils
          - flex
          - grep
          - libcurl4-openssl-dev
          - libgss-dev
          - libicu-dev
          - libldap2-dev
          - liblz4-dev
          - libnuma-dev
          - libpam0g-dev
          - libreadline-dev
          - libselinux1-dev
          - libssl-dev
          - liburing-dev
          - libxml2-dev
          - libxslt1-dev
          - libzstd-dev
          - llvm-dev
          - lz4
          - pkgconf
          - sed
          - tzdata
          - uuid-dev
          - zlib1g-dev
          - zstd
        files:
          - url: https://ftp.postgresql.org/pub/source/v17.11/postgresql-17.11.tar.gz
            checksum: https://ftp.postgresql.org/pub/source/v17.11/postgresql-17.11.tar.gz.sha256
            path: ${source.dir}/
            spdx:
              name: postgresql
              version: "17.11"
              packages:
                - name: postgresql
                  purl: pkg:dhi/postgresql@17.11
                  license: PostgreSQL
            uid: 0
            gid: 0
      pipeline:
        - name: patch source
          uses: patch@v1
          with:
            options: -p1
            patches:
              - ${source.dir}/patch/initdb.patch
              - ${source.dir}/patch/pager-less.patch
        - name: build and install
          runs: |
            set -eux -o pipefail

            ./configure \
              --prefix='/usr/lib/postgresql/17' \
              --bindir='/usr/bin' \
              --with-gssapi \
              --with-icu \
              --with-ldap \
              --with-libcurl \
              --with-libnuma \
              --with-liburing \
              --with-libxml \
              --with-libxslt \
              --with-llvm \
              --with-lz4 \
              --with-pam \
              --with-selinux \
              --with-ssl=openssl \
              --with-uuid=e2fs \
              --with-zstd \
              --with-system-tzdata=/usr/share/zoneinfo

            make world-bin -j"$(nproc)"

            make install-world-bin DESTDIR='${target.dir}'
        - name: configure defaults
          work-dir: ${target.dir}/usr/lib/postgresql/17/share
          runs: |
            set -eux -o pipefail

            sed -E -i postgresql.conf.sample \
              -e "s|^#?(listen_addresses)\s*=\s*\S+.*|\1 = '*'|"
        - uses: dhi/build-pkg:0
          with:
            conflicts: postgresql-common, postgresql-client-common, postgresql-client-17
            depends:
              - libcurl4t64
              - libgssapi-krb5-2
              - libicu76
              - libldap2
              - liblz4-1
              - libnuma1
              - libpam0g
              - libreadline8t64
              - libselinux1
              - libssl3t64
              - liburing2
              - libuuid1
              - libxml2
              - libxslt1.1
              - libzstd1
              - llvm
              - tzdata
              - zlib1g
            description: PostgreSQL object-relational database system
            files:
              - usr/bin
              - usr/lib/postgresql/17
            formats:
              - deb
            license: PostgreSQL
            name: postgresql-17
            rel: 1
            url: https://www.postgresql.org/
            version: 17.11
      paths:
        - type: file
          path: ${source.dir}/patch/initdb.patch
          uid: 0
          gid: 0
          source: package/main/postgres/patch/initdb.patch
        - type: file
          path: ${source.dir}/patch/pager-less.patch
          uid: 0
          gid: 0
          source: package/main/postgres/patch/pager-less.patch
os-release:
  name: Docker Hardened Images (Debian)
  id: debian
  version-id: "13"
  version-codename: trixie
  pretty-name: Docker Hardened Images/Debian GNU/Linux 13 (trixie)
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
