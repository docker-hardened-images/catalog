# syntax=dhi.io/build:2-debian13

image: dhi.io/pkg-certbot
variant: runtime
tags:
  - 5.8.0
  - 5.8.0-r1
  - 5.8.0-debian13
  - 5.8.0-r1-debian13
platforms:
  - linux/amd64
  - linux/arm64
vars:
  CARGO_VERSION: 1.97.1-0
  COMMIT_SHA: d050f5ced828d90faf4304a752c9a6848416216a
  PYTHON_MINOR: "3.14"
  PYTHON_VERSION: 3.14.7-1
  REL: "1"
  RUSTC_VERSION: 1.97.1-0
  SEMVER_MAJOR_MINOR_VERSION: "5.8"
  SEMVER_MAJOR_VERSION: "5"
  SEMVER_VERSION: 5.8.0
  VERSION: 5.8.0
contents:
  packages:
    - base-files
  builds:
    - name: certbot
      work-dir: ${source.dir}
      environment:
        CARGO_NET_GIT_FETCH_WITH_CLI: "true"
      caches:
        - path: /root/.cache/pip
        - path: /root/.cargo
      contents:
        repositories:
          - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
        keyring:
          - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
        packages:
          - bash
          - build-essential
          - ca-certificates
          - cargo-1.97=1.97.1-0
          - coreutils
          - diffutils
          - findutils
          - gawk
          - git
          - grep
          - libffi-dev
          - libssl-dev
          - libstdc++6
          - pkg-config
          - rustc-1.97=1.97.1-0
          - sed
          - libpython-3.14-minimal=3.14.7-1
          - libpython-3.14-stdlib=3.14.7-1
          - libpython-3.14-dev=3.14.7-1
          - libpython-3.14=3.14.7-1
          - python-3.14-minimal=3.14.7-1
          - python-3.14=3.14.7-1
          - python-3.14-dev=3.14.7-1
          - python3-pip
          - python3-setuptools
          - python3-wheel
        files:
          - url: git+https://github.com/certbot/certbot.git#d050f5ced828d90faf4304a752c9a6848416216a
            checksum: d050f5ced828d90faf4304a752c9a6848416216a
            path: ${source.dir}/certbot-src
            spdx:
              name: certbot
              version: 5.8.0
              packages:
                - name: certbot
                  purl: pkg:pypi/certbot@5.8.0
                  license: Apache-2.0
                - name: acme
                  purl: pkg:pypi/acme@5.8.0
                  license: Apache-2.0
            uid: 0
            gid: 0
      pipeline:
        - name: build venv at final path and stage it
          privileged: true
          runs: |
            set -eux -o pipefail

            export SOURCE_DIR="${source.dir}" \
              TARGET_DIR="${target.dir}" \
              PYTHON_BIN=/usr/bin/python3.14
            bash "${source.dir}/build-certbot.sh"
        - uses: dhi/build-pkg:0
          with:
            deb:
              depends:
                - libffi8
                - libssl3t64
                - libstdc++6
            depends:
              - python-3.14
            description: Certbot - EFF's ACME client for obtaining TLS certificates
            files:
              - usr/lib/certbot
              - usr/bin/certbot
            formats:
              - deb
            license: Apache-2.0
            name: certbot
            rel: 1
            url: https://github.com/certbot/certbot
            version: 5.8.0
      paths:
        - type: file
          path: ${source.dir}/build-certbot.sh
          uid: 0
          gid: 0
          mode: "0755"
          source: package/main/certbot/build-certbot.sh
os-release:
  name: Docker Hardened Images (Debian)
  id: debian
  version-id: "13"
  version-codename: trixie
  pretty-name: Docker Hardened Images/Debian GNU/Linux 13 (trixie)
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
