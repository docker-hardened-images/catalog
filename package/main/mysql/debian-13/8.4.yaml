# syntax=dhi.io/build:2-debian13

image: dhi.io/pkg-mysql
variant: runtime
tags:
  - 8.4.11
  - 8.4.11-r0
  - 8.4.11-debian13
  - 8.4.11-r0-debian13
platforms:
  - linux/amd64
  - linux/arm64
dates:
  release: "2024-04-10"
  end-of-life: "2032-04-30"
vars:
  COMMIT_SHA: 99960bf74fa919347e4f4e3ca47672f333d6e91f
  PACKAGE_NAME: mysql-8.4
  REL: "0"
  SEMVER_MAJOR_MINOR_VERSION: "8.4"
  SEMVER_MAJOR_VERSION: "8"
  SEMVER_VERSION: 8.4.11
  VERSION: 8.4.11
contents:
  packages:
    - '!base-files'
  builds:
    - name: mysql
      work-dir: ${source.dir}/mysql
      contents:
        packages:
          - bash
          - bison
          - build-essential
          - ca-certificates
          - cmake
          - coreutils
          - diffutils
          - file
          - findutils
          - gzip
          - libabsl-dev
          - libaio-dev
          - libboost-all-dev
          - libcurl4-openssl-dev
          - libncurses-dev
          - libssl-dev
          - libtirpc-dev
          - pkg-config
          - sed
          - tar
          - wget
          - xz-utils
          - zlib1g-dev
        files:
          - url: git+https://github.com/mysql/mysql-server#mysql-8.4.11
            checksum: 99960bf74fa919347e4f4e3ca47672f333d6e91f
            path: ${source.dir}/mysql
            spdx:
              name: mysql
              version: 8.4.11
              packages:
                - name: mysql
                  purl: pkg:github/mysql/mysql-server@8.4.11
                  license: GPL-2.0-only
            uid: 0
            gid: 0
      pipeline:
        - name: build
          work-dir: ${source.dir}/mysql
          runs: |
            set -eux -o pipefail

            cmake -S . -B build \
              -DCMAKE_BUILD_TYPE=Release \
              -DCMAKE_INSTALL_PREFIX=/usr \
              -DCMAKE_INSTALL_LIBDIR=/usr/lib \
              -DINSTALL_LAYOUT=DEB \
              -DMYSQL_DATADIR=/var/lib/mysql \
              -DMYSQL_UNIX_ADDR=/run/mysqld/mysqld.sock \
              -DWITH_DEBUG=OFF \
              -DWITH_UNIT_TESTS=OFF \
              -DWITH_ARCHIVE_STORAGE_ENGINE=OFF \
              -DWITH_BLACKHOLE_STORAGE_ENGINE=OFF \
              -DWITH_FEDERATED_STORAGE_ENGINE=OFF \
              -DWITH_EXAMPLE_STORAGE_ENGINE=OFF \
              -DWITH_NDBCLUSTER_STORAGE_ENGINE=OFF \
              -DWITH_ROUTER=OFF \
              -DINSTALL_MYSQLTESTDIR= \
              -DWITH_NDB=OFF

            cmake --build build --parallel "$(nproc)"

            DESTDIR="${target.dir}" cmake --install build
        - name: prune install-tree cruft
          runs: |
            set -eux -o pipefail

            rm -rf "${target.dir}/usr/include"
            rm -rf "${target.dir}/usr/lib/pkgconfig"
            find "${target.dir}/usr/lib" -name '*.a' -delete
            rm -rf "${target.dir}/usr/cmake"
            rm -rf "${target.dir}/usr/share/aclocal"

            for f in COPYING CREDITS INSTALL-BINARY README; do
              rm -f "${target.dir}/usr/${f}"
            done
        - name: strip
          runs: |
            set -eux -o pipefail

            for dir in "${target.dir}/usr/bin" "${target.dir}/usr/sbin"; do
              [ -d "${dir}" ] || continue
              find "${dir}" -type f -perm /111 | while read -r bin; do
                if file -b "${bin}" | grep -q '^ELF'; then
                  strip "${bin}"
                fi
              done
            done
        - uses: dhi/build-pkg:0
          with:
            depends:
              - libaio1t64
              - libcurl4t64
              - libncurses6
              - libnuma1
              - libssl3t64
              - libstdc++6
              - libtirpc3t64
              - zlib1g
            description: MySQL open source relational database server
            files:
              - usr
            formats:
              - deb
            license: GPL-2.0-only
            name: mysql-8.4
            rel: 0
            url: https://www.mysql.com/
            version: 8.4.11
os-release:
  name: Docker Hardened Images (Debian)
  id: debian
  version-id: "13"
  version-codename: trixie
  pretty-name: Docker Hardened Images/Debian GNU/Linux 13 (trixie)
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
