# syntax=dhi.io/build:2-alpine3.24

image: dhi.io/pkg-telepresence
variant: runtime
tags:
  - 2.32.3-alpine3.24
  - 2.32.3-r1-alpine3.24
platforms:
  - linux/amd64
  - linux/arm64
vars:
  COMMIT_SHA: 870876baf5e17a9b6a5e5e8b6a1271f473723130
  GOLANG_MAJOR_MINOR_VERSION: "1.27"
  GOLANG_VERSION: 1.27.3-r0
  K8S_SCHEMA_CHECKSUM: sha256:e1d22fd4a24696a48ed62cbc5facd39b3ff64293f8605b0dc6e7df0f32ed0c40
  K8S_VERSION: v1.37.1
  PACKAGE_NAME: telepresence-2
  REL: "1"
  SEMVER_MAJOR_MINOR_VERSION: "2.32"
  SEMVER_MAJOR_VERSION: "2"
  SEMVER_VERSION: 2.32.3
  VERSION: 2.32.3
contents:
  repositories:
    - https://dhi.io/apk/alpine/v3.24/main
    - https://dhi.io/apk/alpine/v3.23/main
    - https://dl-cdn.alpinelinux.org/alpine/v3.24/main
    - https://dl-cdn.alpinelinux.org/alpine/v3.24/community
  keyring:
    - https://dhi.io/keyring/dhi-apk@docker-0F81AD7700D99184.rsa.pub
  packages:
    - alpine-baselayout-data
  builds:
    - name: telepresence-2
      work-dir: /go/src/github.com/telepresenceio/telepresence
      contents:
        packages:
          - busybox
          - bash
          - ca-certificates-bundle
          - golang-1.27=1.27.3-r0
          - golang-1.27-oci-config=1.27.3-r0
        files:
          - url: git+https://github.com/telepresenceio/telepresence.git#v2.32.3
            checksum: 870876baf5e17a9b6a5e5e8b6a1271f473723130
            path: /go/src/github.com/telepresenceio/telepresence
            spdx:
              name: telepresence
              version: 2.32.3
              packages:
                - name: telepresence
                  purl: pkg:golang/github.com/telepresenceio/telepresence/v2@2.32.3
                  license: Apache-2.0
            uid: 0
            gid: 0
          - url: https://raw.githubusercontent.com/yannh/kubernetes-json-schema/master/v1.37.1-standalone/_definitions.json
            checksum: sha256:e1d22fd4a24696a48ed62cbc5facd39b3ff64293f8605b0dc6e7df0f32ed0c40
            path: /opt/telepresence/k8s-defs.json
            uid: 0
            gid: 0
      pipeline:
        - name: update go dependencies
          uses: go/bump@v2
          with:
            deps:
              - golang.org/x/net@v0.62.0
            download: true
        - uses: go/hermetic@v1
        - name: check local module versions
          runs: |
            set -eux -o pipefail

            grep -q "github.com/telepresenceio/telepresence/rpc/v2 v2.32.3$" go.mod
            grep -q '^replace github.com/telepresenceio/telepresence/rpc/v2 => ./rpc$' go.mod
            grep -q '^replace github.com/telepresenceio/telepresence/cmd/cobraparser/v2 => ./cmd/cobraparser$' go.mod
            test -s rpc/LICENSE
            test -s cmd/cobraparser/LICENSE
            cmp LICENSE rpc/LICENSE
            cmp LICENSE cmd/cobraparser/LICENSE
        - name: record rpc module sbom
          uses: spdx@v1
          with:
            license: Apache-2.0
            name: telepresence-rpc
            purl: pkg:golang/github.com/telepresenceio/telepresence/rpc/v2@2.32.3
            version: 2.32.3
        - name: record cobraparser module sbom
          uses: spdx@v1
          with:
            license: Apache-2.0
            name: telepresence-cobraparser
            purl: pkg:golang/github.com/telepresenceio/telepresence/cmd/cobraparser/v2@2.32.3
            version: 2.32.3
        - name: stage chart schema definitions
          runs: |
            set -eux -o pipefail

            client_go="$(go list -m -f '{{.Version}}' k8s.io/client-go)"
            test -n "$client_go"
            test "$(echo "$client_go" | sed 's/^v0\./v1./')" = "v1.37.1"

            test -s /opt/telepresence/k8s-defs.json
            grep -q '"io.k8s.api.core.v1.Affinity"' /opt/telepresence/k8s-defs.json
            install -m 0644 /opt/telepresence/k8s-defs.json charts/telepresence-oss/k8s-defs.json
            test -s charts/telepresence-oss/k8s-defs.json
        - name: test
          runs: |
            set -eux -o pipefail

            if [ "false" = "true" ]; then
              export GODEBUG=fips140=on
            fi

            pkgs="$(go list -tags docker ./pkg/... ./cmd/... | grep -v \
              -e '/pkg/vif$' \
              -e '/pkg/routing$' \
              -e '/pkg/dnsproxy$' \
              -e '/pkg/client/rootd/dns$' \
              -e '/pkg/client/cli/setup$')"
            test -n "$pkgs"
            CGO_ENABLED=0 go test -tags docker -count=1 -timeout 20m $pkgs
        - name: check helm version
          runs: |
            set -eux -o pipefail

            helm_version="$(go list -m -f '{{.Version}}' helm.sh/helm/v3)"
            test -n "$helm_version"
            echo "$helm_version" | grep -Eq '^v3\.[0-9]+\.[0-9]+'
        - name: build
          uses: go/build@v1
          with:
            fips: false
            ldflags:
              - -s
              - -X github.com/telepresenceio/telepresence/v2/pkg/version.Version=v2.32.3
              - -X github.com/telepresenceio/telepresence/v2/pkg/version.HelmVersion=$(go list -m -f '{{.Version}}' helm.sh/helm/v3)
            output: ${target.dir}/usr/bin/telepresence
            packages: ./cmd/telepresence
            tags: docker
        - name: build dev
          uses: go/build@v1
          with:
            fips: false
            ldflags:
              - -X github.com/telepresenceio/telepresence/v2/pkg/version.Version=v2.32.3
              - -X github.com/telepresenceio/telepresence/v2/pkg/version.HelmVersion=$(go list -m -f '{{.Version}}' helm.sh/helm/v3)
            output: ${target.dir}/usr/bin/telepresence-dev
            packages: ./cmd/telepresence
            strip: false
            tags: docker
        - name: verify binary
          runs: |
            set -eux -o pipefail

            for bin in telepresence telepresence-dev; do
              go version -m "${target.dir}/usr/bin/$bin" > /tmp/buildinfo.txt
              grep -q 'CGO_ENABLED=0' /tmp/buildinfo.txt
              grep -q -- '-tags=docker' /tmp/buildinfo.txt
              grep -q 'pkg/version.Version=v2.32.3' /tmp/buildinfo.txt
              echo "$bin: build info matches"
            done
            "${target.dir}/usr/bin/telepresence" version > /tmp/version.txt
            grep -q "v2.32.3" /tmp/version.txt
            "${target.dir}/usr/bin/telepresence" helm version > /tmp/helm-version.txt
            grep -Eq '^v3\.[0-9]+\.[0-9]+' /tmp/helm-version.txt
        - name: binary sbom
          uses: sbom@v1
          with:
            prefix: telepresence
            source: ${target.dir}/usr/bin/telepresence
        - name: stage payload
          runs: |
            set -eux -o pipefail

            src=/go/src/github.com/telepresenceio/telepresence/LICENSE
            test -s "$src"
            grep -q 'Apache License' "$src"
            grep -q 'Version 2.0' "$src"

            for root in "${target.dir}" "${target.dir}/dev"; do
              install -D -m 0644 "$src" "$root/usr/share/licenses/telepresence-2/LICENSE"
              install -d "$root/opt/docker/sbom"
              for sbom in telepresence telepresence-rpc telepresence-cobraparser; do
                test -s "/opt/docker/sbom/$sbom/.spdx.$sbom.json"
                cp -a "/opt/docker/sbom/$sbom" "$root/opt/docker/sbom/"
                test -s "$root/opt/docker/sbom/$sbom/.spdx.$sbom.json"
              done
              install -D -m 0644 /dev/null "$root/etc/telepresence/usage-opt-out"

              test -s "$root/usr/share/licenses/telepresence-2/LICENSE"
              test -e "$root/etc/telepresence/usage-opt-out"
              test ! -s "$root/etc/telepresence/usage-opt-out"
            done
        - uses: dhi/build-pkg:0
          with:
            depends:
              - ca-certificates-bundle
              - iptables
            description: Telepresence, a local development client for Kubernetes
            files:
              - usr/bin/telepresence
              - etc/telepresence/usage-opt-out
              - opt/docker/sbom/telepresence
              - opt/docker/sbom/telepresence-rpc
              - opt/docker/sbom/telepresence-cobraparser
              - usr/share/licenses/telepresence-2/LICENSE
            license: Apache-2.0
            name: telepresence-2
            rel: 1
            subpackages:
              - depends:
                  - ca-certificates-bundle
                  - iptables
                files:
                  - path: usr/bin/telepresence
                    source: usr/bin/telepresence-dev
                  - path: etc/telepresence/usage-opt-out
                    source: dev/etc/telepresence/usage-opt-out
                  - path: opt/docker/sbom/telepresence
                    source: dev/opt/docker/sbom/telepresence
                  - path: opt/docker/sbom/telepresence-rpc
                    source: dev/opt/docker/sbom/telepresence-rpc
                  - path: opt/docker/sbom/telepresence-cobraparser
                    source: dev/opt/docker/sbom/telepresence-cobraparser
                  - path: usr/share/licenses/telepresence-2/LICENSE
                    source: dev/usr/share/licenses/telepresence-2/LICENSE
                name: telepresence-2-dev
            url: https://github.com/telepresenceio/telepresence
            version: 2.32.3
os-release:
  name: Docker Hardened Images (Alpine)
  id: alpine
  version-id: "3.24"
  pretty-name: Docker Hardened Images/Alpine Linux v3.24
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
