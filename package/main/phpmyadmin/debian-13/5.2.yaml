# syntax=dhi.io/build:2-debian13

image: dhi.io/pkg-phpmyadmin
variant: runtime
tags:
  - 5.2.3
  - 5.2.3-r0
  - 5.2.3-debian13
  - 5.2.3-r0-debian13
platforms:
  - linux/amd64
  - linux/arm64
dates:
  release: "2022-05-11"
vars:
  COMMIT_SHA: 962857e4f63d42e38f11ff4d63f5e722018add76
  COMPOSER_PHAR_SHA256: 7a2d379d5b8ffdaa028580ef26494c36d2feef4b178d3dd1473a4dbc5e17c8d6
  COMPOSER_VERSION: 2.10.3
  DHI_TEST_DEB_EXPECTED_FILES: /usr/share/phpmyadmin/index.php /usr/share/phpmyadmin/js/dist/common.js /usr/share/phpmyadmin/themes/pmahomme/css/theme.css /usr/share/phpmyadmin/locale/de/LC_MESSAGES/phpmyadmin.mo /usr/share/phpmyadmin/vendor/autoload.php /usr/share/phpmyadmin/doc/html/index.html /usr/share/phpmyadmin/libraries/cache/routes.cache.php
  PHP_VERSION: 8.3.35-0
  REL: "0"
  SEMVER_MAJOR_MINOR_VERSION: "5.2"
  SEMVER_MAJOR_VERSION: "5"
  SEMVER_VERSION: 5.2.3
  TAG: RELEASE_5_2_3
  VERSION: 5.2.3
contents:
  packages:
    - base-files
  builds:
    - name: phpmyadmin
      work-dir: ${source.dir}/phpmyadmin
      contents:
        repositories:
          - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
        keyring:
          - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
        packages:
          - base-files
          - bash
          - ca-certificates
          - coreutils
          - findutils
          - gettext
          - git
          - grep
          - make
          - node-corepack
          - nodejs-24
          - python3-sphinx
          - sed
          - tar
          - unzip
          - xz-utils
          - php-8.3=8.3.35-0
          - libargon2-1
          - libcurl4t64
          - libicu76
          - libonig5
          - libreadline8t64
          - libsodium23
          - libsqlite3-0
          - libssl3t64
          - libxml2
          - zlib1g
        files:
          - url: git+https://github.com/phpmyadmin/phpmyadmin.git#RELEASE_5_2_3
            checksum: 962857e4f63d42e38f11ff4d63f5e722018add76
            path: ${source.dir}/phpmyadmin
            spdx:
              name: phpmyadmin
              version: 5.2.3
              packages:
                - name: phpmyadmin
                  purl: pkg:composer/phpmyadmin/phpmyadmin@5.2.3
                  license: GPL-2.0-only
            uid: 0
            gid: 0
          - url: https://getcomposer.org/download/2.10.3/composer.phar
            checksum: sha256:7a2d379d5b8ffdaa028580ef26494c36d2feef4b178d3dd1473a4dbc5e17c8d6
            path: ${source.dir}/composer.phar
            uid: 0
            gid: 0
      pipeline:
        - name: build front end
          privileged: true
          environment:
            COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
          runs: |
            set -eux -o pipefail

            corepack enable yarn
            yarn install --production --frozen-lockfile --non-interactive
            test -s js/dist/common.js
            test -s themes/pmahomme/css/theme.css
            test -s themes/pmahomme/css/theme.rtl.css
            rm -rf node_modules
        - name: compile locales
          runs: |
            set -eux -o pipefail

            ./scripts/generate-mo --quiet
            ./scripts/remove-incomplete-mo
            test -s locale/de/LC_MESSAGES/phpmyadmin.mo
            test -s libraries/language_stats.inc.php
        - name: install composer dependencies
          privileged: true
          runs: |
            set -eux -o pipefail

            php ${source.dir}/composer.phar config --no-interaction version 5.2.3
            php ${source.dir}/composer.phar require --no-interaction --no-ansi --no-progress --no-update twig/twig:^3.27
            php ${source.dir}/composer.phar require --no-interaction --no-ansi --no-progress --no-update symfony/cache:^5.4.52
            php ${source.dir}/composer.phar require --no-interaction --no-ansi --no-progress --no-update slim/psr7:^1.8
            php ${source.dir}/composer.phar require --no-interaction --no-ansi --no-progress --no-update paragonie/sodium_compat:^1.24
            php ${source.dir}/composer.phar update --no-interaction --no-ansi --no-progress --no-dev --prefer-dist \
              --ignore-platform-req=ext-mysqli --ignore-platform-req=ext-zip \
              twig/twig symfony/cache slim/psr7 paragonie/sodium_compat
            php ${source.dir}/composer.phar require --no-interaction --no-ansi --no-progress --update-no-dev --prefer-dist \
              --ignore-platform-req=ext-mysqli --ignore-platform-req=ext-zip \
              tecnickcom/tcpdf:^6.4.4 pragmarx/google2fa-qrcode:^2.1 'bacon/bacon-qr-code:^2.0 || ^3.0' \
              code-lts/u2f-php-server:^1.2 web-auth/webauthn-lib:^3.3.2 thecodingmachine/safe:1.3.3.1 \
              symfony/process:^5.4.51
            find vendor -mindepth 2 -maxdepth 3 -type d \( -name tests -o -name test -o -name .github -o -name examples \) -prune -exec rm -rf {} +
            find vendor -mindepth 2 -maxdepth 3 -type f \( -name 'phpunit.xml*' -o -name .travis.yml -o -name .scrutinizer.yml \) -delete
            php ${source.dir}/composer.phar dump-autoload --no-interaction --no-ansi --no-dev --optimize
            test -s vendor/autoload.php
            test -d vendor/tecnickcom/tcpdf
            test ! -d vendor/phpunit
        - name: warm the routing cache
          runs: |
            set -eux -o pipefail

            php -r 'define("PHPMYADMIN", true); define("ROOT_PATH", getcwd() . "/"); require ROOT_PATH . "libraries/constants.php"; require AUTOLOAD_FILE; PhpMyAdmin\Routing::getDispatcher();'
            test -s libraries/cache/routes.cache.php
            php -l libraries/cache/routes.cache.php
        - name: build documentation
          runs: |
            set -eux -o pipefail

            LC_ALL=C sphinx-build -q -b html -d doc/build/doctrees doc doc/html
            test -s doc/html/index.html
            find doc -mindepth 1 -maxdepth 1 ! -name html -exec rm -rf {} +
            rm -rf doc/html/_sources
        - name: configure application layout
          runs: |
            set -eux -o pipefail

            grep -q -F "'configFile' => ROOT_PATH . 'config.inc.php'," libraries/vendor_config.php
            sed -i "s@'configFile' => .*@'configFile' => '/etc/phpmyadmin/config.inc.php',@" libraries/vendor_config.php
            grep -q -F "'configFile' => '/etc/phpmyadmin/config.inc.php'," libraries/vendor_config.php
            grep -q -F "'tempDir' => ROOT_PATH . 'tmp' . DIRECTORY_SEPARATOR," libraries/vendor_config.php
            sed -i "s@'tempDir' => .*@'tempDir' => '/var/lib/phpmyadmin/tmp/',@" libraries/vendor_config.php
            grep -q -F "'tempDir' => '/var/lib/phpmyadmin/tmp/'," libraries/vendor_config.php
            php -l libraries/vendor_config.php
        - name: remove build inputs
          runs: |
            set -eux -o pipefail

            rm -rf .git .github po scripts setup examples test js/src templates/test vendor/bin
            rm -f .browserslistrc .editorconfig .eslintignore .eslintrc.json .jshintrc .scrutinizer.yml \
              .stylelintrc.json .weblate CODE_OF_CONDUCT.md CONTRIBUTING.md DCO README.rst babel.config.json \
              codecov.yml config.sample.inc.php infection.json.dist jest.config.js package.json phpcs.xml.dist \
              phpstan-baseline.neon phpstan.neon.dist phpunit.xml.dist psalm-baseline.xml psalm.xml yarn.lock
            find . \( -name .gitignore -o -name .gitattributes \) -type f -delete
            test ! -e node_modules
        - name: stage application
          runs: |
            set -eux -o pipefail

            find . -type d -exec chmod 755 {} +
            find . -type f -exec chmod 644 {} +
            mkdir -p ${target.dir}/usr/share/phpmyadmin
            cp -a . ${target.dir}/usr/share/phpmyadmin/
        - name: generate sbom
          uses: sbom@v1
          with:
            prefix: phpmyadmin-composer
            source: ${source.dir}/phpmyadmin
        - uses: dhi/build-pkg:0
          with:
            depends:
              - php-8.3-fpm
            description: phpMyAdmin web application tree
            files:
              - usr/share/phpmyadmin
            formats:
              - deb
            license: GPL-2.0-only
            name: dhi-phpmyadmin
            rel: 0
            url: https://www.phpmyadmin.net
            version: 5.2.3
os-release:
  name: Docker Hardened Images (Debian)
  id: debian
  version-id: "13"
  version-codename: trixie
  pretty-name: Docker Hardened Images/Debian GNU/Linux 13 (trixie)
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
