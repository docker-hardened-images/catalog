# syntax=dhi.io/build:2-debian13

image: dhi.io/pkg-emissary
variant: runtime
tags:
  - 4.1.0
  - 4.1.0-r5
  - 4.1.0-debian13
  - 4.1.0-r5-debian13
platforms:
  - linux/amd64
  - linux/arm64
dates:
  release: "2026-05-19"
vars:
  ARCH: '#{ target.arch == "amd64" ? "x86_64" : "aarch64" }'
  COMMIT_SHA: 5497a66908186400d16de0a4fba3e467f4b55e46
  GOLANG_VERSION: 1.26.8-0
  PACKAGE_HOME: /usr/lib/emissary
  PACKAGE_NAME: emissary-4.1
  PYTHON_MINOR: "3.11"
  PYTHON_VERSION: 3.11.16-1
  REL: "5"
  SEMVER_MAJOR_MINOR_VERSION: "4.1"
  SEMVER_MAJOR_VERSION: "4"
  SEMVER_VERSION: 4.1.0
  VERSION: 4.1.0
contents:
  packages:
    - base-files
  builds:
    - name: emissary
      work-dir: ${source.dir}/emissary
      environment:
        PATH: /go/bin:/usr/local/go/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
      caches:
        - path: /go/pkg/mod
      contents:
        repositories:
          - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
        keyring:
          - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
        packages:
          - bash
          - binutils
          - binutils-gold
          - build-essential
          - ca-certificates-bundle
          - cargo
          - coreutils
          - diffutils
          - findutils
          - gawk
          - gcc
          - golang-1.26=1.26.8-0
          - golang-1.26-oci-config=1.26.8-0
          - grep
          - jq
          - libcap-dev
          - libcap2-bin
          - libffi-dev
          - libncurses6
          - libpython-3.11-minimal=3.11.16-1
          - libpython-3.11-stdlib=3.11.16-1
          - libpython-3.11=3.11.16-1
          - libstdc++6
          - libyaml-dev
          - make
          - mawk
          - openssl
          - patchelf
          - python-3.11-minimal=3.11.16-1
          - python-3.11=3.11.16-1
          - python-3.11-dev=3.11.16-1
          - python3-pip
          - python3-pip-whl
          - python3-setuptools
          - python3-setuptools-whl
          - python3-wheel
          - rsync
          - sed
        files:
          - url: git+https://github.com/emissary-ingress/emissary.git#v4.1.0
            checksum: 5497a66908186400d16de0a4fba3e467f4b55e46
            path: ${source.dir}/emissary
            spdx:
              name: emissary
              version: 4.1.0
              packages:
                - name: emissary
                  purl: pkg:golang/github.com/emissary-ingress/emissary@4.1.0
                  license: Apache-2.0
            uid: 0
            gid: 0
      pipeline:
        - name: set emissary version
          runs: |
            set -eux -o pipefail

            cat > ./python/ambassador.version << EOF
            4.1.0
            5497a66908186400d16de0a4fba3e467f4b55e46
            EOF
        - name: update go dependencies (4 only)
          uses: go/bump@v1
          with:
            deps:
              - golang.org/x/oauth2@v0.34.0
              - github.com/go-openapi/swag@v0.23.0
              - github.com/go-openapi/jsonpointer@v0.21.0
              - github.com/go-openapi/jsonreference@v0.21.0
              - github.com/go-openapi/spec@v0.21.0
              - github.com/moby/spdystream@v0.5.1
              - go.opentelemetry.io/otel@v1.41.0
              - google.golang.org/grpc@v1.82.1
              - github.com/gorilla/websocket@v1.5.3
              - k8s.io/kubernetes@v1.30.10
            download: true
        - name: commit bumped go modules
          runs: |
            set -eux -o pipefail

            git config --global --add safe.directory "$(pwd)"
            git config user.email "dhi@docker.com"
            git config user.name "Docker Hardened Images"
            if ! git diff --quiet go.mod go.sum 2> /dev/null; then
              git add go.mod go.sum
              git commit -m "dhi: bump dependencies" --no-gpg-sign
            fi
        - name: retag for go module version
          runs: |
            set -eux -o pipefail

            git config --global --add safe.directory "$(pwd)"
            if [ "4" = "4" ]; then
              git tag -f "v3.4.1"
            else
              git tag -f "v4.1.0"
            fi
        - name: build apiext
          uses: go/build@v1
          with:
            cgo_enabled: 0
            output: ${target.dir}/usr/bin/apiext
            packages: ./cmd/apiext
        - name: build busyambassador
          uses: go/build@v1
          with:
            cgo_enabled: 0
            output: ${target.dir}/usr/bin/busyambassador
            packages: ./cmd/busyambassador
        - name: build wrapper
          uses: go/build@v1
          with:
            cgo_enabled: 0
            output: ${target.dir}/usr/bin/wrapper
            packages: ./cmd/capabilities_wrapper
        - name: set wrapper capabilities
          runs: |
            set -eux -o pipefail

            setcap cap_net_bind_service=p "${target.dir}/usr/bin/wrapper"
        - name: patch diagd (4 only)
          uses: git/patch@v1
          with:
            patch: ${source.dir}/patch/diagd.4.patch
        - name: install python projects (4 only)
          privileged: true
          runs: |
            set -eux -o pipefail

            for pkg in ambassador ambassador-diag; do
              sed -i 's|readme = "../README.md"|readme = "README.md"|' "python/${pkg}/pyproject.toml"
              sed -i "s|^version = \".*\"|version = \"4.1.0\"|" "python/${pkg}/pyproject.toml"
              cp README.md "python/${pkg}/README.md"
            done

            python3 -m venv "${target.dir}/usr/lib/emissary"

            "${target.dir}/usr/lib/emissary/bin/python3" -m pip install --upgrade 'pip>=25.0'
            "${target.dir}/usr/lib/emissary/bin/python3" -m pip install --upgrade 'wheel>=0.46.2'
            "${target.dir}/usr/lib/emissary/bin/python3" -m pip install --no-binary=pyyaml ./python/ambassador ./python/ambassador-diag
            "${target.dir}/usr/lib/emissary/bin/python3" -m pip install --upgrade 'msgpack>=1.2.1'
            find "${target.dir}/usr/lib/emissary/lib/python"*/site-packages/setuptools/_vendor -name 'wheel-0.45.*' -type d -exec rm -rf {} + 2> /dev/null || true
            find "${target.dir}/usr/lib/emissary/bin" -type f -executable -exec sed -i "1s|^#!${target.dir}|#!|" {} +
        - name: clean python venv
          runs: |
            set -eux -o pipefail

            venv="${target.dir}/usr/lib/emissary"

            find "${venv}" \( -type d \( -name test -o -name tests -o -name __pycache__ \) \) -prune -exec rm -rf {} + || true
            find "${venv}" -type f \( -name '*.pyc' -o -name '*.pyo' \) -delete || true

            if [ -x "${venv}/bin/python3" ]; then
              "${venv}/bin/python3" -m pip uninstall -y pip setuptools wheel || true
            fi

            rm -f "${venv}/bin"/activate "${venv}/bin"/activate.csh "${venv}/bin"/activate.fish \
              "${venv}/bin"/Activate.ps1 "${venv}/bin"/deactivate \
              "${venv}/bin"/pip "${venv}/bin"/pip3 "${venv}/bin"/wheel "${venv}/bin"/wheel3
            find "${venv}/bin" -maxdepth 1 \( -name 'pip3.*' -o -name 'wheel3.*' \) -delete
        - name: stage ambassador version metadata
          runs: |
            set -eux -o pipefail

            install -D -m 0644 \
              "${source.dir}/emissary/python/ambassador.version" \
              "${target.dir}/usr/share/emissary/ambassador/python/ambassador.version"
        - name: stage usr bin symlinks for python tools
          runs: |
            set -eux -o pipefail

            ln -sf ../lib/emissary/bin/diagd "${target.dir}/usr/bin/diagd"
        - uses: dhi/build-pkg:0
          with:
            depends:
              - python-3.11
              - libcap2
            description: Emissary Ingress API gateway control plane
            files:
              - usr/lib/emissary
              - usr/bin/apiext
              - usr/bin/busyambassador
              - usr/bin/wrapper
              - usr/bin/diagd
              - usr/share/emissary
            formats:
              - deb
            license: Apache-2.0
            name: emissary-4.1
            rel: 5
            url: https://www.getambassador.io/
            version: 4.1.0
      paths:
        - type: directory
          path: ${source.dir}/patch
          uid: 0
          gid: 0
          source: package/main/emissary/patch
os-release:
  name: Docker Hardened Images (Debian)
  id: debian
  version-id: "13"
  version-codename: trixie
  pretty-name: Docker Hardened Images/Debian GNU/Linux 13 (trixie)
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
