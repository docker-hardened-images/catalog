# syntax=dhi.io/build:2-alpine3.24

image: dhi.io/pkg-hubble-ui
variant: runtime
tags:
  - 0.13.6-alpine3.24
  - 0.13.6-r11-alpine3.24
platforms:
  - linux/amd64
  - linux/arm64
vars:
  COMMIT_SHA: d6eb0dd9ff8e684a6a6bd6da7b6cb304497a2e26
  GOLANG_MAJOR_MINOR_VERSION: "1.27"
  GOLANG_VERSION: 1.27.4-r0
  NODEJS_VERSION: 24.22.2-r0
  NPM_VERSION: 12.2.2-r2
  REL: "11"
  SEMVER_MAJOR_MINOR_VERSION: "0.13"
  SEMVER_MAJOR_VERSION: "0"
  SEMVER_VERSION: 0.13.6
  VERSION: 0.13.6
contents:
  repositories:
    - https://dhi.io/apk/alpine/v3.24/main
    - https://dhi.io/apk/alpine/v3.23/main
    - https://dl-cdn.alpinelinux.org/alpine/v3.24/main
    - https://dl-cdn.alpinelinux.org/alpine/v3.24/community
  keyring:
    - https://dhi.io/keyring/dhi-apk@docker-0F81AD7700D99184.rsa.pub
  packages:
    - alpine-baselayout-data
  builds:
    - name: hubble-ui
      work-dir: /go/src/github.com/cilium/hubble-ui/backend
      caches:
        - path: /root/.npm
      contents:
        packages:
          - busybox
          - bash
          - ca-certificates-bundle
          - coreutils
          - findutils
          - jq
          - mawk
          - nodejs-24=24.22.2-r0
          - npm-12=12.2.2-r2
          - sed
          - golang-1.27=1.27.4-r0
          - golang-1.27-oci-config=1.27.4-r0
        files:
          - url: git+https://github.com/cilium/hubble-ui.git#v0.13.6
            checksum: d6eb0dd9ff8e684a6a6bd6da7b6cb304497a2e26
            path: /go/src/github.com/cilium/hubble-ui
            uid: 0
            gid: 0
      pipeline:
        - name: prepare for sbom
          work-dir: /go/src/github.com/cilium/hubble-ui
          runs: |
            set -eux -o pipefail

            tmp=$(mktemp)
            jq --arg version "0.13.6" '.version = $version' package.json > "$tmp" && mv "$tmp" package.json
        - name: bump npm dependencies
          uses: npm/bump@v1
          work-dir: /go/src/github.com/cilium/hubble-ui
          privileged: true
          with:
            bumps: /go/src/patch/npm-bumps.json
            npm-root: /go/src/github.com/cilium/hubble-ui
        - name: build frontend
          work-dir: /go/src/github.com/cilium/hubble-ui
          privileged: true
          runs: |
            set -eux -o pipefail

            npm ci

            NODE_ENV=production npm run build:webpack

            mkdir -p "${target.dir}/app"
            cp -r server/public/* "${target.dir}/app/"
        - name: reinstall dependencies for sbom
          work-dir: /go/src/github.com/cilium/hubble-ui
          privileged: true
          runs: |
            set -eux -o pipefail

            rm -rf node_modules
            npm install --omit=dev --ignore-scripts
        - name: generate frontend sbom
          uses: sbom@v1
          with:
            prefix: hubble-ui
            source: /go/src/github.com/cilium/hubble-ui
        - name: stage frontend sbom
          runs: |
            set -eux -o pipefail

            install -d "${target.dir}/opt/docker/sbom"
            cp -a /opt/docker/sbom/hubble-ui "${target.dir}/opt/docker/sbom/"
            test -s "${target.dir}/opt/docker/sbom/hubble-ui/.spdx.hubble-ui.json"
        - name: patch
          uses: go/bump@v2
          work-dir: /go/src/github.com/cilium/hubble-ui/backend
          with:
            deps:
              - golang.org/x/net@v0.62.0
            download: true
        - name: test
          work-dir: /go/src/github.com/cilium/hubble-ui/backend
          runs: |
            set -eux -o pipefail

            GOMAXPROCS=1 CGO_ENABLED=0 go test -v -count=1 -p 1 -parallel=1 \
              -skip 'TestEverything|TestBlockedPushBlockedPop|TestLimited' ./...
        - uses: dhi/build-pkg:0
          with:
            description: Hubble-ui
            files:
              - app
              - opt/docker/sbom/hubble-ui
            license: Apache-2.0
            name: hubble-ui
            rel: 11
            url: https://github.com/cilium/hubble-ui
            version: 0.13.6
      paths:
        - type: file
          path: /go/src/patch/npm-bumps.json
          uid: 0
          gid: 0
          source: package/main/hubble-ui/patch/npm-bumps.json
os-release:
  name: Docker Hardened Images (Alpine)
  id: alpine
  version-id: "3.24"
  pretty-name: Docker Hardened Images/Alpine Linux v3.24
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
