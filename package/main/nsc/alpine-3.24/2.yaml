# syntax=dhi.io/build:2-alpine3.24

image: dhi.io/pkg-nsc
variant: runtime
tags:
  - 2.15.0-alpine3.24
  - 2.15.0-r2-alpine3.24
platforms:
  - linux/amd64
  - linux/arm64
vars:
  COMMIT_SHA: c8d67c23c187ed0db496ce5b2b66e96715bb72bf
  GOLANG_MAJOR_MINOR_VERSION: "1.26"
  GOLANG_VERSION: 1.26.5-r0
  PACKAGE_NAME: nsc
  REL: "2"
  SEMVER_MAJOR_MINOR_VERSION: "2.15"
  SEMVER_MAJOR_VERSION: "2"
  SEMVER_VERSION: 2.15.0
  VERSION: 2.15.0
contents:
  repositories:
    - https://dhi.io/apk/alpine/v3.24/main
    - https://dhi.io/apk/alpine/v3.23/main
    - https://dl-cdn.alpinelinux.org/alpine/v3.24/main
    - https://dl-cdn.alpinelinux.org/alpine/v3.24/community
  keyring:
    - https://dhi.io/keyring/dhi-apk@docker-0F81AD7700D99184.rsa.pub
  packages:
    - alpine-baselayout-data
  builds:
    - name: nsc
      work-dir: /go/src/github.com/nats-io/nsc/v2
      caches:
        - path: /go/pkg/mod
      contents:
        packages:
          - busybox
          - bash
          - ca-certificates-bundle
          - coreutils
          - findutils
          - mawk
          - sed
          - golang-1.26=1.26.5-r0
          - golang-1.26-oci-config=1.26.5-r0
        files:
          - url: git+https://github.com/nats-io/nsc.git#v2.15.0
            checksum: c8d67c23c187ed0db496ce5b2b66e96715bb72bf
            path: /go/src/github.com/nats-io/nsc/v2
            spdx:
              name: nsc
              version: 2.15.0
              packages:
                - name: nsc
                  purl: pkg:golang/github.com/nats-io/nsc/v2@2.15.0
                  license: Apache-2.0
            uid: 0
            gid: 0
      pipeline:
        - name: update go dependencies
          uses: go/bump@v1
          with:
            deps:
              - github.com/klauspost/compress@v1.18.7
              - golang.org/x/crypto@v0.54.0
              - golang.org/x/net@v0.56.0
              - golang.org/x/text@v0.40.0
            download: true
        - name: test
          privileged: true
          runs: |
            set -eux -o pipefail

            CGO_ENABLED=0 go test -vet=off -skip=TestUpgradeBackup ./...
        - name: build
          uses: go/build@v1
          with:
            fips: false
            ldflags:
              - -s -w
              - -X main.version=2.15.0
              - -X main.commit=c8d67c23c187ed0db496ce5b2b66e96715bb72bf
              - -X main.date=${SOURCE_DATE_EPOCH}
            output: ${target.dir}/usr/bin/nsc
            packages: .
        - name: build dev
          uses: go/build@v1
          with:
            fips: false
            ldflags:
              - -s -w
              - -X main.version=2.15.0
              - -X main.commit=c8d67c23c187ed0db496ce5b2b66e96715bb72bf
              - -X main.date=${SOURCE_DATE_EPOCH}
            output: ${target.dir}/usr/bin/nsc-dev
            packages: .
            strip: false
        - uses: dhi/build-pkg:0
          with:
            description: NATS nsc JWT account management CLI
            files:
              - usr/bin/nsc
            license: Apache-2.0
            name: nsc
            rel: 2
            subpackages:
              - files:
                  - path: usr/bin/nsc
                    source: usr/bin/nsc-dev
                name: nsc-dev
            url: https://github.com/nats-io/nsc
            version: 2.15.0
os-release:
  name: Docker Hardened Images (Alpine)
  id: alpine
  version-id: "3.24"
