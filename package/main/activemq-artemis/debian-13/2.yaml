# syntax=dhi.io/build:2-debian13

image: dhi.io/pkg-activemq-artemis
variant: runtime
tags:
  - 2.56.0
  - 2.56.0-r0
  - 2.56.0-debian13
  - 2.56.0-r0-debian13
platforms:
  - linux/amd64
  - linux/arm64
vars:
  ARCH: '#{ target.arch == "amd64" ? "x64" : "aarch64" }'
  COMMIT_SHA: 002fc7a0848edb8e2440748b2241c3983ecc0f89
  JDK_MAJOR_VERSION: "21"
  JDK_VERSION: 21.0.12.8-0
  MAVEN_VERSION: 3.9.16
  PACKAGE_NAME: activemq-artemis
  REL: "0"
  SEMVER_MAJOR_MINOR_VERSION: "2.56"
  SEMVER_MAJOR_VERSION: "2"
  SEMVER_VERSION: 2.56.0
  VERSION: 2.56.0
contents:
  packages:
    - base-files
  builds:
    - name: activemq-artemis
      work-dir: ${source.dir}/activemq-artemis
      environment:
        JAVA_HOME: /usr/lib/jvm/temurin-21
        MAVEN_HOME: /opt/java/apache-maven-3.9.16
      caches:
        - path: /root/.m2/repository
      contents:
        repositories:
          - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
        keyring:
          - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
        packages:
          - bash
          - ca-certificates
          - coreutils
          - findutils
          - git
          - gzip
          - sed
          - tar
          - eclipse-temurin-21-jdk=21.0.12.8-0
        files:
          - url: git+https://github.com/apache/activemq-artemis.git#2.56.0
            checksum: 002fc7a0848edb8e2440748b2241c3983ecc0f89
            path: ${source.dir}/activemq-artemis
            spdx:
              name: activemq-artemis
              version: 2.56.0
              packages:
                - name: activemq-artemis
                  purl: pkg:dhi/activemq-artemis@2.56.0
                  license: Apache-2.0
            uid: 0
            gid: 0
          - url: https://dlcdn.apache.org/maven/maven-3/3.9.16/binaries/apache-maven-3.9.16-bin.tar.gz
            path: ${source.dir}/maven/apache-maven-3.9.16-bin.tar.gz
            spdx:
              name: maven
              version: 3.9.16
              packages:
                - name: maven
                  purl: pkg:generic/apache-maven@3.9.16
                  license: Apache-2.0
            uid: 0
            gid: 0
          - url: https://repo1.maven.org/maven2/io/netty/netty-transport-native-epoll/4.1.137.Final/netty-transport-native-epoll-4.1.137.Final-linux-x86_64.jar
            checksum: sha256:185db6053e0e9573d36fa4eb6567b26139afaa4daa7bf5a068e661568304542b
            path: ${source.dir}/patch/deps/netty-transport-native-epoll-4.1.137.Final-linux-x86_64.jar
            uid: 0
            gid: 0
          - url: https://repo1.maven.org/maven2/io/netty/netty-transport-native-epoll/4.1.137.Final/netty-transport-native-epoll-4.1.137.Final-linux-aarch_64.jar
            checksum: sha256:82fb63a2dc90c0bddb81e04065a1c06fb4c5be722ad5d64b46491daf8b6f9a01
            path: ${source.dir}/patch/deps/netty-transport-native-epoll-4.1.137.Final-linux-aarch_64.jar
            uid: 0
            gid: 0
          - url: https://repo1.maven.org/maven2/io/netty/netty-transport-native-kqueue/4.1.137.Final/netty-transport-native-kqueue-4.1.137.Final-osx-x86_64.jar
            checksum: sha256:29f96e4f350df9467e5cf49e83c0be27a094a6a1f6dfc1bf0e0be9af84333729
            path: ${source.dir}/patch/deps/netty-transport-native-kqueue-4.1.137.Final-osx-x86_64.jar
            uid: 0
            gid: 0
          - url: https://repo1.maven.org/maven2/io/netty/netty-transport-native-kqueue/4.1.137.Final/netty-transport-native-kqueue-4.1.137.Final-osx-aarch_64.jar
            checksum: sha256:6745bb54be0a9105c40c045dcc322b107ac16abf82716963fd64ee921dc5408a
            path: ${source.dir}/patch/deps/netty-transport-native-kqueue-4.1.137.Final-osx-aarch_64.jar
            uid: 0
            gid: 0
      pipeline:
        - name: install maven
          runs: |
            set -eux -o pipefail

            mkdir -p /opt/java
            tar -xzf "${source.dir}/maven/apache-maven-3.9.16-bin.tar.gz" -C /opt/java

            mkdir -p /usr/local/bin
            find "/opt/java/apache-maven-3.9.16/bin" -type f -executable -o -type l | while read -r file; do
              filename=$(basename "$file")
              ln -sf "/opt/java/apache-maven-3.9.16/bin/$filename" "/usr/local/bin/$filename"
            done
        - name: configure maven mirror
          runs: |
            set -eux -o pipefail

            mkdir -p /root/.m2
            cat > /root/.m2/settings.xml << 'EOF'
            <?xml version="1.0" encoding="UTF-8"?>
            <settings xmlns="http://maven.apache.org/SETTINGS/1.0.0">
              <mirrors>
                <mirror>
                  <id>google-maven-central</id>
                  <name>GCS Maven Central mirror</name>
                  <url>https://maven-central.storage-download.googleapis.com/maven2/</url>
                  <mirrorOf>central</mirrorOf>
                </mirror>
              </mirrors>
            </settings>
            EOF
        - name: patch dependencies
          uses: mvn/patch@v1
          with:
            dependencies: ${source.dir}/patch/mvn-dependencies.json
            mvn-root: ${source.dir}/activemq-artemis
            properties: ${source.dir}/patch/mvn-properties.json
        - name: build
          privileged: true
          runs: |
            set -eux -o pipefail

            if [ "${ARCH}" = "aarch64" ]; then
              export MAVEN_OPTS="-Dos.arch=aarch64 -Dos.name=Linux -Dos.version=arm64"
              export JAVA_OPTS="-Dos.arch=aarch64"
            fi

            mvn clean install -DskipTests -Dmaven.javadoc.skip=true
        - name: patch native netty classifier jars
          runs: |
            set -eux -o pipefail

            dist_lib="${source.dir}/activemq-artemis/artemis-distribution/target/apache-artemis-2.56.0-bin/apache-artemis-2.56.0/lib"
            netty_version="4.1.137.Final"

            for arch in x86_64 aarch_64; do
              find "${dist_lib}" \
                -name "netty-transport-native-epoll-*-linux-${arch}.jar" \
                ! -name "netty-transport-native-epoll-${netty_version}-linux-${arch}.jar" \
                -delete
              install -m 0644 \
                "${source.dir}/patch/deps/netty-transport-native-epoll-${netty_version}-linux-${arch}.jar" \
                "${dist_lib}/netty-transport-native-epoll-${netty_version}-linux-${arch}.jar"
            done

            for arch in x86_64 aarch_64; do
              stale_kqueue=$(find "${dist_lib}" \
                -name "netty-transport-native-kqueue-*-osx-${arch}.jar" \
                ! -name "netty-transport-native-kqueue-${netty_version}-osx-${arch}.jar" \
                -print)
              if [ -z "${stale_kqueue}" ]; then
                continue
              fi
              find "${dist_lib}" \
                -name "netty-transport-native-kqueue-*-osx-${arch}.jar" \
                ! -name "netty-transport-native-kqueue-${netty_version}-osx-${arch}.jar" \
                -delete
              install -m 0644 \
                "${source.dir}/patch/deps/netty-transport-native-kqueue-${netty_version}-osx-${arch}.jar" \
                "${dist_lib}/netty-transport-native-kqueue-${netty_version}-osx-${arch}.jar"
            done
        - name: stage distribution
          runs: |
            set -eux -o pipefail

            dist="${source.dir}/activemq-artemis/artemis-distribution/target/apache-artemis-2.56.0-bin/apache-artemis-2.56.0"
            install -d "${target.dir}/usr/share/activemq-artemis"
            cp -a "${dist}/." "${target.dir}/usr/share/activemq-artemis/"
            install -D -m 0755 "${source.dir}/entrypoint.sh" \
              "${target.dir}/usr/share/activemq-artemis/bin/entrypoint.sh"
        - uses: dhi/build-pkg:0
          with:
            depends:
              - bash
              - coreutils
            description: Apache ActiveMQ Artemis high-performance messaging broker
            files:
              - usr
            formats:
              - deb
            license: Apache-2.0
            name: activemq-artemis
            rel: 0
            url: https://activemq.apache.org/components/artemis/
            version: 2.56.0
      paths:
        - type: file
          path: ${source.dir}/entrypoint.sh
          uid: 0
          gid: 0
          source: package/main/activemq-artemis/bin/entrypoint.sh
        - type: file
          path: ${source.dir}/patch/mvn-dependencies.json
          uid: 0
          gid: 0
          source: package/main/activemq-artemis/patch/mvn-dependencies.json
        - type: file
          path: ${source.dir}/patch/mvn-properties.json
          uid: 0
          gid: 0
          source: package/main/activemq-artemis/patch/mvn-properties.json
os-release:
  name: Docker Hardened Images (Debian)
  id: debian
  version-id: "13"
  version-codename: trixie
  pretty-name: Docker Hardened Images/Debian GNU/Linux 13 (trixie)
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
