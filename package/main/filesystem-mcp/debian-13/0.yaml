# syntax=dhi.io/build:2-debian13

image: dhi.io/pkg-filesystem-mcp
variant: runtime
tags:
  - 2026.7.10
  - 2026.7.10-r0
  - 2026.7.10-debian13
  - 2026.7.10-r0-debian13
platforms:
  - linux/amd64
  - linux/arm64
vars:
  COMMIT_SHA: 9a96ea6e5913736f92b88345bf51caeaaa8e719f
  REL: "0"
  SEMVER_MAJOR_MINOR_VERSION: "2026.7"
  SEMVER_MAJOR_VERSION: "2026"
  SEMVER_VERSION: 2026.7.10
  VERSION: 2026.7.10
contents:
  packages:
    - base-files
  builds:
    - name: filesystem-mcp
      work-dir: ${source.dir}/servers/src/filesystem
      caches:
        - path: /root/.npm
      contents:
        repositories:
          - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
        keyring:
          - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
        packages:
          - bash
          - ca-certificates
          - coreutils
          - findutils
          - git
          - gzip
          - libc6
          - libstdc++6
          - mawk
          - nodejs-24
          - node-corepack
          - npm
          - sed
          - yarn-classic
        files:
          - url: git+https://github.com/modelcontextprotocol/servers.git#2026.7.10
            checksum: 9a96ea6e5913736f92b88345bf51caeaaa8e719f
            path: ${source.dir}/servers
            spdx:
              name: filesystem-mcp
              version: 2026.7.10
              packages:
                - name: filesystem-mcp
                  purl: pkg:dhi/filesystem-mcp@2026.7.10
                  license: MIT
            uid: 0
            gid: 0
      pipeline:
        - name: bump dependencies
          uses: npm/bump@v1
          privileged: true
          environment:
            DHI_NO_SFW: "true"
          with:
            bumps: ${source.dir}/patch/npm-bumps.json
            npm-root: ${source.dir}/servers/src/filesystem
        - name: install and build
          privileged: true
          runs: |
            set -eux -o pipefail

            rm -rf ../../package.json
            rm -rf ../../package-lock.json

            npm install
            npm run build

            rm -rf node_modules

            npm ci --ignore-scripts --omit=dev

            mkdir -p "${target.dir}/usr/lib/filesystem-mcp"
            cp -a dist node_modules package.json "${target.dir}/usr/lib/filesystem-mcp/"
        - uses: dhi/build-pkg:0
          with:
            description: Filesystem MCP server (Model Context Protocol server for filesystem access)
            files:
              - usr/lib/filesystem-mcp
            formats:
              - deb
            license: MIT
            name: filesystem-mcp
            rel: 0
            url: https://github.com/modelcontextprotocol/servers
            version: 2026.7.10
      paths:
        - type: file
          path: ${source.dir}/patch/npm-bumps.json
          uid: 0
          gid: 0
          source: package/main/filesystem-mcp/patch/npm-bumps.json
os-release:
  name: Docker Hardened Images (Debian)
  id: debian
  version-id: "13"
  version-codename: trixie
  pretty-name: Docker Hardened Images/Debian GNU/Linux 13 (trixie)
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
