# syntax=dhi.io/build:2-debian13

image: dhi.io/pkg-data-prepper
variant: runtime
tags:
  - 2.16.0
  - 2.16.0-r10
  - 2.16.0-debian13
  - 2.16.0-r10-debian13
platforms:
  - linux/amd64
  - linux/arm64
dates:
  release: "2022-10-10"
vars:
  COMMIT_SHA: 5e82c95a35bb7286eb6b15dad1966fbd4c82791a
  JDK_MAJOR_VERSION: "11"
  JDK_VERSION: 1:11.0.32.1+1-5
  PACKAGE_HOME: /usr/share/data-prepper
  PACKAGE_NAME: data-prepper
  REL: "10"
  SEMVER_MAJOR_MINOR_VERSION: "2.16"
  SEMVER_MAJOR_VERSION: "2"
  SEMVER_VERSION: 2.16.0
  VERSION: 2.16.0
contents:
  packages:
    - base-files
  builds:
    - name: data-prepper
      work-dir: ${source.dir}/data-prepper
      environment:
        GRADLE_OPTS: -Dorg.gradle.jvmargs="-Xmx3g -XX:MaxMetaspaceSize=512m"
        JAVA_HOME: /usr/lib/jvm/temurin-11
        JAVA_TOOL_OPTIONS: -Dfile.encoding=UTF-8
        LANG: C.UTF-8
        LC_ALL: C.UTF-8
      caches:
        - path: /root/.gradle
      contents:
        repositories:
          - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
        keyring:
          - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
        packages:
          - bash
          - ca-certificates
          - coreutils
          - eclipse-temurin-11-jdk=1:11.0.32.1+1-5
          - findutils
          - grep
          - gzip
          - patch
          - sed
          - tar
        files:
          - url: git+https://github.com/opensearch-project/data-prepper.git#2.16.0
            checksum: 5e82c95a35bb7286eb6b15dad1966fbd4c82791a
            path: ${source.dir}/data-prepper
            spdx:
              name: opensearch-data-prepper
              version: 2.16.0
              packages:
                - name: opensearch-data-prepper
                  purl: pkg:github/opensearch-project/data-prepper@2.16.0
                  license: Apache-2.0
            uid: 0
            gid: 0
          - url: https://repo1.maven.org/maven2/com/fasterxml/jackson/core/jackson-core/2.22.3/jackson-core-2.22.3.jar
            checksum: sha256:8a501126a385b25841915d839508f8a66e2a0dbc8a6709d055ef3b3e852b094c
            path: ${source.dir}/patch/deps/jackson-core-2.22.3.jar
            uid: 0
            gid: 0
          - url: https://repo1.maven.org/maven2/com/fasterxml/jackson/core/jackson-databind/2.22.3/jackson-databind-2.22.3.jar
            checksum: sha256:556db5439e206114346043f68d200497dc96a0bca62a360a81784092ebd0e0a9
            path: ${source.dir}/patch/deps/jackson-databind-2.22.3.jar
            uid: 0
            gid: 0
          - url: https://repo1.maven.org/maven2/com/fasterxml/jackson/core/jackson-annotations/2.22/jackson-annotations-2.22.jar
            checksum: sha256:21ddb598807d3a51a876704eb979d9296e1c6a6f47ab1826ff88c6d6a127a2d0
            path: ${source.dir}/patch/deps/jackson-annotations-2.22.3.jar
            uid: 0
            gid: 0
          - url: https://repo1.maven.org/maven2/com/eed3si9n/jarjar/jarjar-assembly/1.14.1/jarjar-assembly-1.14.1.jar
            checksum: sha256:270fe285e399e298fb08c5daf1486648203a5bd5e90eaba4a6466097be7dd50f
            path: ${source.dir}/patch/deps/jarjar-assembly-1.14.1.jar
            uid: 0
            gid: 0
      pipeline:
        - name: apply cve-bump patch
          uses: patch@v1
          with:
            options: -p1
            patch: ${source.dir}/cve-bumps.patch
        - name: build distribution
          privileged: true
          runs: |
            set -eux -o pipefail

            ./gradlew --no-daemon --console=plain :release:archives:linux:assemble
        - name: stage distribution
          runs: |
            set -eux -o pipefail

            mkdir -p "${target.dir}/usr/share/data-prepper"
            INSTALL=$(find "${source.dir}/data-prepper/release/archives/linux/build/install" \
              -maxdepth 1 -type d -name 'opensearch-data-prepper-*-linux-*' | head -1)
            test -n "${INSTALL}"
            cp -a "${INSTALL}/." "${target.dir}/usr/share/data-prepper/"
        - name: repack parquet shaded jackson
          runs: |
            set -eux -o pipefail

            JARS_DIR="${target.dir}/usr/share/data-prepper/lib"
            PATCH_DIR="${source.dir}/patch/deps"
            JACKSON_VERSION="2.22.3"

            bash "${source.dir}/patch/remediate-parquet-jackson.sh" \
              "${JARS_DIR}" "${PATCH_DIR}" "${JACKSON_VERSION}"
        - name: generate default keystore
          runs: |
            set -eux -o pipefail

            keytool -genkeypair \
              -alias data-prepper \
              -keyalg RSA -keysize 2048 \
              -storetype PKCS12 \
              -storepass password -keypass password \
              -dname "CN=data-prepper" \
              -validity 3650 \
              -keystore "${target.dir}/usr/share/data-prepper/keystore.p12"

            chmod 0644 "${target.dir}/usr/share/data-prepper/keystore.p12"
        - uses: dhi/build-pkg:0
          with:
            depends:
              - bash
              - bc
              - coreutils
            description: OpenSearch Data Prepper observability pipeline
            files:
              - usr/share/data-prepper
            formats:
              - deb
            license: Apache-2.0
            name: data-prepper
            rel: 10
            url: https://opensearch.org/docs/latest/data-prepper/
            version: 2.16.0
      paths:
        - type: file
          path: ${source.dir}/cve-bumps.patch
          uid: 0
          gid: 0
          source: package/main/data-prepper/patches/cve-bumps.patch
        - type: file
          path: ${source.dir}/patch/remediate-parquet-jackson.sh
          uid: 0
          gid: 0
          source: package/main/data-prepper/patch/remediate-parquet-jackson.sh
os-release:
  name: Docker Hardened Images (Debian)
  id: debian
  version-id: "13"
  version-codename: trixie
  pretty-name: Docker Hardened Images/Debian GNU/Linux 13 (trixie)
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
