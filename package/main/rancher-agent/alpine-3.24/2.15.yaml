                  - usr/share/licenses/rancher-agent-2.15/LICENSE
                  - usr/share/licenses/rancher-agent-2.15/kontainer-driver-metadata
                  - usr/share/licenses/rancher-agent-2.15/catatonit
                  - opt/docker/sbom/rancher-agent
