  RANCHER_PKG_APIS_VERSION: v0.0.0-20260520140148-1f22fcaec55b
  RANCHER_PKG_CLIENT_VERSION: v0.0.0
  RANCHER_PKG_MODULES: apis=v0.0.0-20260520140148-1f22fcaec55b client=v0.0.0 plan=v0.0.0-20260428222332-2696373f4152
  RANCHER_PKG_PLAN_VERSION: v0.0.0-20260428222332-2696373f4152
  REL: "0"
  SBOM_DOCUMENTS: rancher-agent rancher-pkg-apis rancher-pkg-client rancher-pkg-plan kontainer-driver-metadata catatonit
  SEMVER_MAJOR_MINOR_VERSION: "2.15"
  SEMVER_MAJOR_VERSION: "2"
  SEMVER_VERSION: 2.15.4
  VERSION: 2.15.4
contents:
  repositories:
