# syntax=dhi.io/build:2-alpine3.24

image: dhi.io/pkg-rancher-agent
variant: runtime
tags:
  - 2.14-alpine3.24
  - 2.14.8-alpine3.24
  - 2.14.8-r0-alpine3.24
platforms:
  - linux/amd64
  - linux/arm64
vars:
  COMMIT_SHA: 5739c205f8655b2b4ebc61361410a1b20f1f4aab
  GOLANG_MAJOR_MINOR_VERSION: "1.26"
  GOLANG_VERSION: 1.26.11-r1
  INIT: tini
  KDM_COMMIT_SHA: 6975bb145eba98954c802b6d8efe2de838707214
  KDM_DATA_SHA256: dd79200ff905e39f488b324f5656f9528195c7d2fb1f503476738996a268b758
  KUBECTL_MAJOR_MINOR_VERSION: "1.35"
  LICENSE_DIR: usr/share/licenses/rancher-agent-2.14
  PACKAGE_NAME: rancher-agent-2.14
  RANCHER_COMMIT_TIME: "2026-11-24T22:30:04Z"
  RANCHER_PKG_APIS_VERSION: v0.0.0
  RANCHER_PKG_CLIENT_VERSION: v0.0.0
  RANCHER_PKG_MODULES: apis=v0.0.0 client=v0.0.0
  REL: "0"
  SBOM_DOCUMENTS: rancher-agent rancher-pkg-apis rancher-pkg-client kontainer-driver-metadata
  SEMVER_MAJOR_MINOR_VERSION: "2.14"
  SEMVER_MAJOR_VERSION: "2"
  SEMVER_VERSION: 2.14.8
  VERSION: 2.14.8
contents:
  repositories:
    - https://dhi.io/apk/alpine/v3.24/main
    - https://dhi.io/apk/alpine/v3.23/main
    - https://dl-cdn.alpinelinux.org/alpine/v3.24/main
    - https://dl-cdn.alpinelinux.org/alpine/v3.24/community
  keyring:
    - https://dhi.io/keyring/dhi-apk@docker-0F81AD7700D99184.rsa.pub
  packages:
    - alpine-baselayout-data
  builds:
    - name: rancher-agent-2.14
      work-dir: /go/src/github.com/rancher/rancher
      environment:
        GOFLAGS: -buildvcs=false
        GOTOOLCHAIN: local
      contents:
        packages:
          - autoconf
          - automake
          - build-base
          - busybox
          - ca-certificates-bundle
          - coreutils
          - findutils
          - git
          - grep
          - libtool
          - golang-1.26=1.26.11-r1
          - golang-1.26-oci-config=1.26.11-r1
        files:
          - url: git+https://github.com/rancher/rancher.git#v2.14.8
            checksum: 5739c205f8655b2b4ebc61361410a1b20f1f4aab
            path: /go/src/github.com/rancher/rancher
            spdx:
              name: rancher-agent
              version: 2.14.8
              packages:
                - name: rancher-agent
                  purl: pkg:golang/github.com/rancher/rancher@2.14.8
                  license: Apache-2.0
            uid: 0
            gid: 0
          - url: git+https://github.com/rancher/kontainer-driver-metadata.git#6975bb145eba98954c802b6d8efe2de838707214
            checksum: 6975bb145eba98954c802b6d8efe2de838707214
            path: ${source.dir}/kontainer-driver-metadata
            spdx:
              name: kontainer-driver-metadata
              version: 6975bb145eba98954c802b6d8efe2de838707214
              packages:
                - name: kontainer-driver-metadata
                  purl: pkg:github/rancher/kontainer-driver-metadata@6975bb145eba98954c802b6d8efe2de838707214
                  license: Apache-2.0
            uid: 0
            gid: 0
      pipeline:
        - name: update go dependencies
          uses: go/bump@v3
          with:
            deps: []
            download: true
        - uses: go/hermetic@v1
        - name: test
          runs: |
            set -eux -o pipefail

            GODEBUG='' CGO_ENABLED=0 go test -tags k8s -count=1 \
              -skip '^Test_(Ensure|Head|Update)$' \
              ./cmd/agent/... ./pkg/agent/... ./pkg/catalogv2/git/...
        - name: build
          uses: go/build@v1
          with:
            fips: false
            ldflags:
              - -X main.VERSION=v2.14.8
              - -s
            output: ${target.dir}/usr/bin/agent
            packages: ./cmd/agent
            tags: k8s
        - name: build dev
          uses: go/build@v1
          with:
            fips: false
            ldflags:
              - -X main.VERSION=v2.14.8
            output: ${target.dir}/usr/bin/agent-dev
            packages: ./cmd/agent
            strip: false
            tags: k8s
        - name: verify build info
          runs: |
            set -eux -o pipefail

            fips='false'
            expected=$(printf '%s\n' apis=v0.0.0 client=v0.0.0 | cut -d= -f1 | sort | tr '\n' ' ')
            for bin in ${target.dir}/usr/bin/agent ${target.dir}/usr/bin/agent-dev; do
              go version -m "$bin" > /tmp/buildinfo
              grep -E '^[[:space:]]+build[[:space:]]' /tmp/buildinfo
              actual=$(awk '$1 == "dep" && $2 ~ /^github\.com\/rancher\/rancher\/pkg\// { sub(/^github\.com\/rancher\/rancher\/pkg\//, "", $2); print $2 }' /tmp/buildinfo | sort | tr '\n' ' ')
              test "$actual" = "$expected"
              for module in apis=v0.0.0 client=v0.0.0; do
                name=${module%%=*}
                version=${module#*=}
                awk -v mod="github.com/rancher/rancher/pkg/$name" -v ver="$version" -v dir="./pkg/$name" '
                  $1 == "dep" && $2 == mod { found = ($3 == ver); getline; ok = found && $1 == "=>" && $2 == dir && $3 == "(devel)" }
                  END { exit ok ? 0 : 1 }
                ' /tmp/buildinfo
              done
              grep -qE '^[[:space:]]+build[[:space:]]+CGO_ENABLED=0$' /tmp/buildinfo
              if [ "$fips" = "true" ]; then
                grep -qE '^[[:space:]]+build[[:space:]]+-tags=k8s,fips140v[0-9.]+$' /tmp/buildinfo
                grep -qE '^[[:space:]]+build[[:space:]]+GOFIPS140=v' /tmp/buildinfo
              else
                grep -qE '^[[:space:]]+build[[:space:]]+-tags=k8s$' /tmp/buildinfo
                if grep -qE '^[[:space:]]+build[[:space:]]+GOFIPS140=' /tmp/buildinfo; then
                  echo "$bin was built with GOFIPS140" >&2
                  exit 1
                fi
              fi
            done
        - name: install scripts, driver metadata and licenses
          runs: |
            set -eux -o pipefail

            install -D -m 0755 package/run.sh ${target.dir}/usr/bin/run.sh
            install -D -m 0755 package/loglevel ${target.dir}/usr/bin/loglevel
            grep -qx 'exec tini -- agent' ${target.dir}/usr/bin/run.sh

            kdm=${source.dir}/kontainer-driver-metadata
            echo "dd79200ff905e39f488b324f5656f9528195c7d2fb1f503476738996a268b758  $kdm/data/data.json" | sha256sum -c -
            install -D -m 0644 $kdm/data/data.json ${target.dir}/var/lib/rancher-data/driver-metadata/data.json

            install -D -m 0644 LICENSE ${target.dir}/usr/share/licenses/rancher-agent-2.14/LICENSE
            install -D -m 0644 $kdm/LICENSE ${target.dir}/usr/share/licenses/rancher-agent-2.14/kontainer-driver-metadata/LICENSE
        - uses: spdx@v1
          with:
            license: Apache-2.0
            name: rancher-pkg-apis
            purl: pkg:golang/github.com/rancher/rancher/pkg/apis@v0.0.0
            version: v0.0.0
        - uses: spdx@v1
          with:
            license: Apache-2.0
            name: rancher-pkg-client
            purl: pkg:golang/github.com/rancher/rancher/pkg/client@v0.0.0
            version: v0.0.0
        - name: stage sbom documents
          runs: |
            set -eux -o pipefail

            mkdir -p ${target.dir}/opt/docker/sbom
            for d in rancher-agent rancher-pkg-apis rancher-pkg-client kontainer-driver-metadata; do
              test -d /opt/docker/sbom/$d
              cp -a /opt/docker/sbom/$d ${target.dir}/opt/docker/sbom/
            done
        - name: package
          uses: dhi/build-pkg:0
          with:
            apk:
              depends:
                - rancher-agent-2.14-common
            deb:
              depends:
                - rancher-agent-2.14-common
            description: Rancher agent, which connects a downstream cluster or node to Rancher
            files:
              - usr/bin/agent
            license: Apache-2.0
            name: rancher-agent-2.14
            rel: 0
            subpackages:
              - apk:
                  depends:
                    - bash
                    - ca-certificates-bundle
                    - coreutils
                    - curl
                    - findutils
                    - gawk
                    - git
                    - grep
                    - iproute2-minimal
                    - jq
                    - kubectl-1.35
                    - musl-utils
                    - net-tools
                    - openssh-client-default
                    - openssl
                    - sed
                    - tini
                deb:
                  depends:
                    - bash
                    - ca-certificates
                    - coreutils
                    - curl
                    - findutils
                    - gawk
                    - git
                    - grep
                    - hostname
                    - iproute2
                    - jq
                    - kubectl-1.35
                    - libc-bin
                    - openssh-client
                    - openssl
                    - sed
                    - tini
                files:
                  - usr/bin/run.sh
                  - usr/bin/loglevel
                  - var/lib/rancher-data/driver-metadata/data.json
                  - usr/share/licenses/rancher-agent-2.14
                  - opt/docker/sbom
                name: rancher-agent-2.14-common
              - apk:
                  depends:
                    - rancher-agent-2.14-common
                deb:
                  depends:
                    - rancher-agent-2.14-common
                files:
                  - path: usr/bin/agent
                    source: usr/bin/agent-dev
                name: rancher-agent-2.14-dev
            url: https://github.com/rancher/rancher
            version: 2.14.8
