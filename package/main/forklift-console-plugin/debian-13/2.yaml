# syntax=dhi.io/build:2-debian13

image: dhi.io/pkg-forklift-console-plugin
variant: runtime
tags:
  - 2.12.10
  - 2.12.10-r2
  - 2.12.10-debian13
  - 2.12.10-r2-debian13
platforms:
  - linux/amd64
  - linux/arm64
dates:
  release: "2026-05-18"
vars:
  COMMIT_SHA: c0aebef2b6b3f6b5e45b82a5598a264c776a2927
  DHI_TEST_DEB_EXPECTED_FILES: /usr/share/forklift-console-plugin/plugin-manifest.json
  NODEJS_VERSION: 24.21.0-1
  REL: "2"
  SEMVER_MAJOR_MINOR_VERSION: "2.12"
  SEMVER_MAJOR_VERSION: "2"
  SEMVER_VERSION: 2.12.10
  VERSION: 2.12.10
contents:
  repositories:
    - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
  keyring:
    - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
  packages:
    - base-files
  builds:
    - name: forklift-console-plugin
      work-dir: ${source.dir}/forklift-console-plugin
      caches:
        - path: /root/.npm
      contents:
        repositories:
          - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
        keyring:
          - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
        packages:
          - base-files
          - bash
          - ca-certificates
          - coreutils
          - findutils
          - git
          - libc6
          - libstdc++6
          - mawk
          - nodejs-24=24.21.0-1
          - npm
          - sed
        files:
          - url: git+https://github.com/kubev2v/forklift-console-plugin.git#c0aebef2b6b3f6b5e45b82a5598a264c776a2927
            checksum: c0aebef2b6b3f6b5e45b82a5598a264c776a2927
            path: ${source.dir}/forklift-console-plugin
            spdx:
              name: forklift-console-plugin
              version: 2.12.10
              packages:
                - name: forklift-console-plugin
                  purl: pkg:github/kubev2v/forklift-console-plugin@c0aebef2b6b3f6b5e45b82a5598a264c776a2927
                  license: Apache-2.0
            uid: 0
            gid: 0
      pipeline:
        - name: bump dependencies
          uses: npm/bump@v1
          privileged: true
          environment:
            DHI_NO_SFW: "true"
          with:
            bumps: ${source.dir}/patch/npm-bumps.json
            npm-root: ${source.dir}/forklift-console-plugin
        - name: install dependencies
          privileged: true
          runs: |
            set -eux -o pipefail

            HUSKY=0 npm ci
        - name: build plugin
          runs: |
            set -eux -o pipefail

            VERSION="2.12.10" npm run build
            mkdir -p "${target.dir}/usr/share/forklift-console-plugin"
            cp -r dist/. "${target.dir}/usr/share/forklift-console-plugin/"
        - name: prepare for sbom
          runs: |
            set -eux -o pipefail

            tmp=$(mktemp)
            jq --arg version "2.12.10" '.version = $version' package.json > "$tmp" && mv "$tmp" package.json
        - name: reinstall dependencies for sbom
          privileged: true
          runs: |
            set -eux -o pipefail

            rm -rf node_modules
            npm install --omit=dev --ignore-scripts
        - name: generate sbom
          uses: sbom@v1
          with:
            prefix: forklift-console-plugin
            source: ${source.dir}/forklift-console-plugin
        - uses: dhi/build-pkg:0
          with:
            description: Forklift console plugin static frontend assets
            files:
              - usr/share/forklift-console-plugin
            formats:
              - deb
            license: Apache-2.0
            name: forklift-console-plugin
            rel: 2
            url: https://github.com/kubev2v/forklift-console-plugin
            version: 2.12.10
      paths:
        - type: directory
          path: ${source.dir}/patch
          uid: 0
          gid: 0
          source: package/main/forklift-console-plugin/patch
os-release:
  name: Docker Hardened Images (Debian)
  id: debian
  version-id: "13"
  version-codename: trixie
  pretty-name: Docker Hardened Images/Debian GNU/Linux 13 (trixie)
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
