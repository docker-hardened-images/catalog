# syntax=dhi.io/build:2-alpine3.23

image: dhi.io/pkg-source-controller
variant: runtime
tags:
  - 1.10.1-alpine3.23
  - 1.10.1-r2-alpine3.23
platforms:
  - linux/amd64
  - linux/arm64
dates:
  release: "2023-07-03"
vars:
  COMMIT_SHA: 1e5c7c19b869b78b9a46cda940fa49bfc49c8ddb
  GOLANG_MAJOR_MINOR_VERSION: "1.27"
  GOLANG_VERSION: 1.27.4-r0
  PACKAGE_NAME: fluxcd-source-controller-1.10
  REL: "2"
  SEMVER_MAJOR_MINOR_VERSION: "1.10"
  SEMVER_MAJOR_VERSION: "1"
  SEMVER_VERSION: 1.10.1
  VERSION: 1.10.1
contents:
  repositories:
    - https://dhi.io/apk/alpine/v3.23/main
    - https://dl-cdn.alpinelinux.org/alpine/v3.23/main
    - https://dl-cdn.alpinelinux.org/alpine/v3.23/community
  keyring:
    - https://dhi.io/keyring/dhi-apk@docker-0F81AD7700D99184.rsa.pub
  packages:
    - alpine-baselayout-data
  builds:
    - name: fluxcd-source-controller-1.10
      work-dir: /go/src/github.com/fluxcd/source-controller
      contents:
        packages:
          - busybox
          - bash
          - ca-certificates-bundle
          - coreutils
          - findutils
          - mawk
          - sed
          - golang-1.27=1.27.4-r0
          - golang-1.27-oci-config=1.27.4-r0
        files:
          - url: git+https://github.com/fluxcd/source-controller#v1.10.1
            checksum: 1e5c7c19b869b78b9a46cda940fa49bfc49c8ddb
            path: /go/src/github.com/fluxcd/source-controller
            spdx:
              name: fluxcd-source-controller
              version: 1.10.1
              packages:
                - name: fluxcd-source-controller
                  purl: pkg:golang/github.com/fluxcd/source-controller@1.10.1
                  license: Apache-2.0
            uid: 0
            gid: 0
      pipeline:
        - name: patch (1 only)
          uses: go/bump@v2
          with:
            deps:
              - golang.org/x/net@v0.62.0
            download: true
            replaces:
              - github.com/chrismellard/docker-credential-acr-env=github.com/osscontainertools/docker-credential-acr@v0.8.0
        - name: test
          runs: |
            set -eux -o pipefail

            CGO_ENABLED=0 go test $(go list ./internal/... | grep -vE '/internal/(controller|bucket/(azure|gcp|minio)|oci/cosign|oci/notation|fs)')
        - name: build
          uses: go/build@v1
          environment:
            GOFLAGS: -buildvcs=false
          with:
            fips: false
            output: ${target.dir}/usr/bin/fluxcd-source-controller
        - name: build dev
          uses: go/build@v1
          work-dir: /go/src/github.com/fluxcd/source-controller
          with:
            fips: false
            output: ${target.dir}/usr/bin/fluxcd-source-controller-dev
            packages: .
            strip: false
        - uses: dhi/build-pkg:0
          with:
            description: Source-controller
            files:
              - usr/bin/fluxcd-source-controller
            license: Apache-2.0
            name: fluxcd-source-controller-1.10
            provides: fluxcd-source-controller=$pkg_full_version
            rel: 2
            replaces: fluxcd-source-controller
            subpackages:
              - files:
                  - path: usr/bin/fluxcd-source-controller
                    source: usr/bin/fluxcd-source-controller-dev
                name: fluxcd-source-controller-1.10-dev
            url: https://github.com/fluxcd/source-controller
            version: 1.10.1
os-release:
  name: Docker Hardened Images (Alpine)
  id: alpine
  version-id: "3.23"
  pretty-name: Docker Hardened Images/Alpine Linux v3.23
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
