# syntax=dhi.io/build:2-debian13

image: dhi.io/pkg-falco
variant: runtime
tags:
  - 0.44.1
  - 0.44.1-r4
  - 0.44.1-debian13
  - 0.44.1-r4-debian13
platforms:
  - linux/amd64
  - linux/arm64
dates:
  release: "2026-07-24"
vars:
  COMMIT_SHA: f1ac5eb1a1c9da9f797f799121ab700263621443
  CONTAINER_PLUGIN_COMMIT_SHA: 88f3c41817a1614f4215b1beb24af7b07be23a8a
  CONTAINER_PLUGIN_VERSION: 0.7.2
  REL: "4"
  SEMVER_MAJOR_MINOR_VERSION: "0.44"
  SEMVER_MAJOR_VERSION: "0"
  SEMVER_VERSION: 0.44.1
  VERSION: 0.44.1
contents:
  repositories:
    - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
  keyring:
    - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
  packages:
    - base-files
  builds:
    - name: falco
      work-dir: ${source.dir}/falco
      contents:
        packages:
          - bash
          - sed
          - grep
          - gawk
          - cmake
          - make
          - gcc
          - g++
          - clang
          - binutils
          - bpftool
          - libelf-dev
          - libssl-dev
          - libcurl4-openssl-dev
          - zlib1g-dev
          - pkgconf
          - git
          - ca-certificates
          - patch
          - linux-libc-dev
          - coreutils
          - findutils
          - golang-go
        files:
          - url: git+https://github.com/falcosecurity/falco#0.44.1
            checksum: f1ac5eb1a1c9da9f797f799121ab700263621443
            path: ${source.dir}/falco
            uid: 0
            gid: 0
          - url: git+https://github.com/falcosecurity/plugins#plugins/container/v0.7.2
            checksum: 88f3c41817a1614f4215b1beb24af7b07be23a8a
            path: ${source.dir}/plugins
            uid: 0
            gid: 0
      pipeline:
        - name: configure and build falco
          privileged: true
          runs: |
            set -eux -o pipefail

            cmake -S . -B build \
              -DCMAKE_BUILD_TYPE=Release \
              -DUSE_BUNDLED_DEPS=ON \
              -DUSE_BUNDLED_OPENSSL=OFF \
              -DADD_FALCOCTL_DEPENDENCY=OFF \
              -DBUILD_DRIVER=OFF \
              -DBUILD_WARNINGS_AS_ERRORS=OFF \
              -DFALCO_ETC_DIR=/etc/falco

            make -C build falco -j"$(nproc)"
            DESTDIR="${target.dir}" make -C build install
        - name: build container plugin from source
          privileged: true
          runs: |
            set -eux -o pipefail

            export GOTOOLCHAIN=go1.25.13 # CVE-2026-39821, CVE-2026-56862, CVE-2026-56859, CVE-2026-56853, CVE-2026-33818, CVE-2026-56858, CVE-2026-56860

            cd ../plugins/plugins/container/go-worker
            go get golang.org/x/crypto@v0.55.0 \
              golang.org/x/net@v0.58.0 \
              golang.org/x/sys@v0.47.0 \
              golang.org/x/text@v0.41.0
            go get github.com/containerd/containerd/v2@v2.1.9 \
              github.com/opencontainers/runc@v1.3.6 \
              github.com/containers/buildah@v1.43.2 \
              github.com/sigstore/fulcio@v1.8.6 \
              google.golang.org/grpc@v1.83.1 \
              go.opentelemetry.io/otel@v1.44.0 \
              github.com/klauspost/compress@v1.18.7
            go mod tidy

            cd ..
            cmake -B build -S . -DCMAKE_BUILD_TYPE=Release -DENABLE_TESTS=OFF
            cmake --build build --target container --parallel "$(nproc)"
            install -D -m 0644 build/libcontainer.so \
              "${target.dir}/usr/share/falco/plugins/libcontainer.so"
        - name: prune install-tree cruft
          runs: |
            set -eux -o pipefail

            rm -rf "${target.dir}/usr/share/doc"
            rm -rf "${target.dir}/usr/src"
            rm -rf "${target.dir}/usr/lib"
            rm -rf "${target.dir}/usr/include"
            rm -rf "${target.dir}/etc/falcoctl"
        - name: strip falco binary
          runs: |
            set -eux -o pipefail

            strip -s "${target.dir}/usr/bin/falco"
        - uses: dhi/build-pkg:0
          with:
            depends:
              - libssl3t64
              - libstdc++6
              - zlib1g
              - libzstd1
            description: Falco cloud-native runtime security (syscall monitoring via modern eBPF)
            files:
              - usr
              - etc
            formats:
              - deb
            license: Apache-2.0
            name: falco
            rel: 4
            url: https://github.com/falcosecurity/falco
            version: 0.44.1
os-release:
  name: Docker Hardened Images (Debian)
  id: debian
  version-id: "13"
  version-codename: trixie
  pretty-name: Docker Hardened Images/Debian GNU/Linux 13 (trixie)
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
