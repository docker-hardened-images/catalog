      pipeline:
        - uses: mvn/mirror@v1
        - name: patch schema-registry dependencies
          uses: mvn/patch@v1
          with:
            dependencies: ${source.dir}/patch/mvn-dependencies.json
            dependencies-key: dependencyManagement.dependencies
            mvn-root: ${source.dir}/schema-registry
        - name: patch utility-belt dependencies
          uses: mvn/patch@v1
          with:
            dependencies: ${source.dir}/patch/mvn-dependencies-utility-belt.json
            dependencies-key: dependencyManagement.dependencies
            mvn-root: ${source.dir}/utility-belt
        - name: build schema registry
          privileged: true
          secrets:
            - id: maven_user
              env: MAVEN_USER
              optional: true
            - id: maven_password
              env: MAVEN_PASSWORD
              optional: true
          runs: |
            set -eux -o pipefail

            mkdir -p /root/.m2/repository/io/confluent
            cp -a ${source.dir}/m2-seed/io/confluent/. /root/.m2/repository/io/confluent/

            mvn -B package \
              -DskipTests \
              -Dmaven.javadoc.skip=true \
              -Djackson.version=2.23.0 -Djackson.tools.jackson.version=3.3.0 -Dnetty.version=4.1.141.Final -Dguava.version=33.8.0-jre \
              -pl package-schema-registry,package-kafka-serde-tools -am
        - name: test client and serializers
          privileged: true
          secrets:
            - id: maven_user
              env: MAVEN_USER
              optional: true
            - id: maven_password
              env: MAVEN_PASSWORD
              optional: true
          runs: |
            set -eux -o pipefail

            mvn -B test \
              -Dmaven.javadoc.skip=true \
              -Djackson.version=2.23.0 -Djackson.tools.jackson.version=3.3.0 -Dnetty.version=4.1.141.Final -Dguava.version=33.8.0-jre \
              -pl client,schema-rules,avro-serializer,json-schema-provider,json-schema-serializer,protobuf-provider -am
        - name: stage package
          privileged: true
          secrets:
            - id: maven_user
              env: MAVEN_USER
              optional: true
            - id: maven_password
              env: MAVEN_PASSWORD
              optional: true
          runs: |
            set -eux -o pipefail

            ASSEMBLY="package-schema-registry/target/kafka-schema-registry-package-8.2.5-package"
            SERDE="package-kafka-serde-tools/target/kafka-serde-tools-package-8.2.5-package"
            SEED="${source.dir}/m2-seed/io/confluent"
            test -d "${ASSEMBLY}"
            test -d "${SERDE}"

            install -d \
              "${target.dir}/usr/bin" \
              "${target.dir}/usr/share/java/schema-registry" \
              "${target.dir}/usr/share/java/kafka-serde-tools" \
              "${target.dir}/usr/share/java/rest-utils" \
              "${target.dir}/usr/share/java/confluent-common" \
              "${target.dir}/usr/share/doc/schema-registry" \
              "${target.dir}/etc/schema-registry" \
              "${target.dir}/etc/confluent/docker"

            find "${ASSEMBLY}/bin" -maxdepth 1 -type f -exec install -m 0755 {} "${target.dir}/usr/bin/" \;
            cp -a "${ASSEMBLY}/share/java/schema-registry/." "${target.dir}/usr/share/java/schema-registry/"
            cp -a "${ASSEMBLY}/share/doc/schema-registry/." "${target.dir}/usr/share/doc/schema-registry/"
            cp -a "${ASSEMBLY}/etc/schema-registry/." "${target.dir}/etc/schema-registry/"
            cp -a "${SERDE}/share/java/kafka-serde-tools/." "${target.dir}/usr/share/java/kafka-serde-tools/"
            printf '%s\n' "8.2.5" > "${target.dir}/usr/share/doc/schema-registry/version.txt"

            install -m 0644 "${SEED}/rest-utils/8.2.5/rest-utils-8.2.5.jar" "${target.dir}/usr/share/java/rest-utils/"
            install -m 0644 "${SEED}/common-utils/8.2.5/common-utils-8.2.5.jar" "${target.dir}/usr/share/java/confluent-common/"
            install -m 0644 "${SEED}/build-tools/8.2.5/build-tools-8.2.5.jar" "${target.dir}/usr/share/java/confluent-common/"
            install -m 0644 "${SEED}/common-config/8.2.5/common-config-8.2.5.jar" "${target.dir}/usr/share/java/confluent-common/"
            install -m 0644 "${SEED}/common-metrics/8.2.5/common-metrics-8.2.5.jar" "${target.dir}/usr/share/java/confluent-common/"
            install -m 0644 "${target.dir}"/usr/share/java/schema-registry/slf4j-api-1.7.36.jar "${target.dir}/usr/share/java/confluent-common/"

            io_jar=$(find "${ASSEMBLY}/share/java/schema-registry" -name 'jetty-io-*.jar' -print -quit)
            test -n "${io_jar}"
            jetty_ver=$(basename "${io_jar}")
            jetty_ver=${jetty_ver#jetty-io-}
            jetty_ver=${jetty_ver%.jar}
            find /root/.m2/repository/org/eclipse -type f -name "*-${jetty_ver}.jar" \
              ! -name '*sources*' ! -name '*javadoc*' ! -name '*tests*' | while read -r jar; do
              install -m 0644 "${jar}" "${target.dir}/usr/share/java/rest-utils/$(basename "${jar}")"
            done
            test -n "$(find "${target.dir}/usr/share/java/rest-utils" -name "jetty-server-${jetty_ver}.jar" -print -quit)"

            dep_dir=$(mktemp -d)
            mvn -pl package-schema-registry \
              org.apache.maven.plugins:maven-dependency-plugin:3.8.1:copy-dependencies \
              -DincludeScope=runtime \
              -Djackson.version=2.23.0 -Djackson.tools.jackson.version=3.3.0 -Dnetty.version=4.1.141.Final -Dguava.version=33.8.0-jre \
              -DoutputDirectory="${dep_dir}"
            for jar in "${dep_dir}"/*.jar; do
              base=$(basename "${jar}")
              if [ -f "${target.dir}/usr/share/java/schema-registry/${base}" ] \
                || [ -f "${target.dir}/usr/share/java/confluent-common/${base}" ]; then
                continue
              fi
              install -m 0644 "${jar}" "${target.dir}/usr/share/java/rest-utils/${base}"
            done
            rm -rf "${dep_dir}"
            test -n "$(find "${target.dir}/usr/share/java/rest-utils" -name 'jersey-container-servlet-*.jar' -print -quit)"
            test "$(find "${target.dir}/usr/share/java" -name 'jakarta.servlet-api-*.jar' | wc -l)" -eq 1

            install -d "${target.dir}/usr/share/java/utility-belt"
            mvn -B -f "${source.dir}/utility-belt/pom.xml" \
              org.apache.maven.plugins:maven-dependency-plugin:3.8.1:copy-dependencies \
              -Dutility.belt.version=8.2.5 \
              -Djackson.version=2.23.0 -Djackson.tools.jackson.version=3.3.0 -Dnetty.version=4.1.141.Final -Dguava.version=33.8.0-jre \
              -DincludeScope=runtime \
              -DexcludeGroupIds=org.junit.jupiter,org.junit.platform,org.opentest4j,org.apiguardian \
              -DexcludeArtifactIds=kafka-test-common-runtime,kafka-test-common-internal-api \
              -DoutputDirectory="${target.dir}/usr/share/java/utility-belt"
            install -m 0644 "${SEED}/utility-belt/8.2.5/utility-belt-8.2.5.jar" "${target.dir}/usr/share/java/utility-belt/"
            test -n "$(find "${target.dir}/usr/share/java/utility-belt" -name 'argparse4j-*.jar' -print -quit)"
            install -m 0644 "${source.dir}"/agents/*.jar "${target.dir}/usr/share/java/utility-belt/"
            install -m 0644 "$(find "${target.dir}/usr/share/java/utility-belt" -name 'commons-beanutils-*.jar' -print -quit)" "${target.dir}/usr/share/java/rest-utils/"

            IMG="${source.dir}/schema-registry-images/schema-registry/include/etc/confluent/docker"
            install -m 0755 \
              "${IMG}/run" \
              "${IMG}/configure" \
              "${IMG}/ensure" \
              "${IMG}/launch" \
              "${IMG}/apply-mesos-overrides" \
              "${IMG}/setup-jmx-security.sh" \
              "${target.dir}/etc/confluent/docker/"
            install -m 0644 \
              "${IMG}/admin.properties.template" \
              "${IMG}/schema-registry.properties.template" \
              "${IMG}/log4j2.yaml.template" \
              "${target.dir}/etc/confluent/docker/"

            COMMON="${source.dir}/common-docker/base-java/include/etc/confluent/docker"
            install -m 0644 "${COMMON}/bash-config" "${target.dir}/etc/confluent/docker/bash-config"
            install -m 0644 "${COMMON}/mesos-setup.sh" "${target.dir}/etc/confluent/docker/mesos-setup.sh"
        - name: java sbom
          uses: sbom@v1
          with:
            extra-scanners: java-archive-cataloger
            prefix: schema-registry
            source: ${target.dir}/usr/share/java
        - name: create sbom directory
          runs: |
            set -eux -o pipefail

            install -d "${target.dir}/opt/docker/sbom"
        - name: ship jmx agent sbom document
          runs: |
            set -eux -o pipefail

            cp -a /opt/docker/sbom/jmx_prometheus_javaagent "${target.dir}/opt/docker/sbom/"
            test -f "${target.dir}/opt/docker/sbom/jmx_prometheus_javaagent/.spdx.jmx_prometheus_javaagent.json"
        - uses: dhi/build-pkg:0
          with:
            apk:
              depends:
                - busybox
                - eclipse-temurin-21-jre
                - gcompat
            deb:
              depends:
                - eclipse-temurin-21-jre
                - hostname
                - procps
            depends:
              - bash
              - coreutils
              - cp-docker-utils-1
              - grep
              - sed
            description: Confluent Schema Registry for storing and serving Kafka schemas
            files:
              - usr
              - etc
              - opt/docker/sbom
            license: LicenseRef-Confluent-Community-1.0 AND Apache-2.0
            name: schema-registry-8.2
            rel: 1
            url: https://github.com/confluentinc/schema-registry
            version: 8.2.5
      paths:
        - type: file
          path: ${source.dir}/patch/mvn-dependencies.json
          uid: 0
          gid: 0
          source: package/main/schema-registry/patch/mvn-dependencies.json
        - type: file
          path: ${source.dir}/patch/mvn-dependencies-utility-belt.json
