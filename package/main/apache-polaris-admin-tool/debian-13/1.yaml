# syntax=dhi.io/build:2-debian13

image: dhi.io/pkg-apache-polaris-admin-tool
variant: runtime
tags:
  - 1.8.0
  - 1.8.0-r1
  - 1.8.0-debian13
  - 1.8.0-r1-debian13
platforms:
  - linux/amd64
  - linux/arm64
dates:
  release: "2026-04-21"
vars:
  AWS_SHADED_JACKSON_VERSION: 2.21.7
  CEL_SHADED_AGRONA_VERSION: 2.5.0
  CEL_SHADED_PROTOBUF_VERSION: 4.35.1
  CEL_STANDALONE_VERSION: 0.8.0
  COMMIT_SHA: 821d2a2357ba338a32a5e20b9ca3a247ad15ed68
  GRADLE_VERSION: 9.7.1-0
  GRADLE_WRAPPER_MINOR: "9.7"
  GRPC_NETTY_SHADED_VERSION: 1.85.0
  GRPC_SHADED_NETTY_VERSION: 4.2.17.Final
  GRPC_SHADED_TCNATIVE_VERSION: 2.0.81.Final
  JDK_MAJOR_VERSION: "21"
  JDK_VERSION: 1:21.0.13+9-1
  PACKAGE_HOME: /usr/share/apache-polaris-admin-tool
  PACKAGE_NAME: apache-polaris-admin-tool-1
  PGJDBC_SHADED_SCRAM_VERSION: "3.2"
  PGJDBC_SHADED_STRINGPREP_VERSION: "2.2"
  REL: "1"
  SEMVER_MAJOR_MINOR_VERSION: "1.8"
  SEMVER_MAJOR_VERSION: "1"
  SEMVER_VERSION: 1.8.0
  VERSION: 1.8.0
contents:
  repositories:
    - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
  keyring:
    - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
  packages:
    - base-files
  builds:
    - name: apache-polaris-admin-tool-1
      work-dir: ${source.dir}/polaris
      environment:
        GRADLE_USER_HOME: /root/.gradle
        JAVA_HOME: /usr/lib/jvm/temurin-21
      caches:
        - path: /root/.gradle/caches
      contents:
        packages:
          - bash
          - ca-certificates-bundle
          - coreutils
          - findutils
          - grep
          - sed
          - unzip
          - eclipse-temurin-21-jdk=1:21.0.13+9-1
          - gradle-9=9.7.1-0
        files:
          - url: git+https://github.com/apache/polaris.git#apache-polaris-1.8.0
            checksum: 821d2a2357ba338a32a5e20b9ca3a247ad15ed68
            path: ${source.dir}/polaris
            spdx:
              name: apache-polaris
              version: 1.8.0
              packages:
                - name: apache-polaris
                  purl: pkg:github/apache/polaris@1.8.0
                  license: Apache-2.0
            uid: 0
            gid: 0
      pipeline:
        - name: install gradle init scripts
          runs: |
            set -eux -o pipefail

            install -D -m 0644 "${source.dir}/files/maven-central-mirror.init.gradle" \
              /root/.gradle/init.d/maven-central-mirror.init.gradle
            install -D -m 0644 "${source.dir}/files/cve-pins.init.gradle" \
              /root/.gradle/init.d/cve-pins.init.gradle
        - name: build admin tool
          privileged: true
          runs: |
            set -eux -o pipefail

            unset CI

            gradle :polaris-admin:quarkusBuild \
              --no-daemon \
              --no-build-cache \
              --no-scan \
              --console=plain \
              --warning-mode=summary \
              --stacktrace

            test -f runtime/admin/build/quarkus-app/quarkus-run.jar
            test -f "runtime/admin/build/quarkus-app/app/polaris-admin-1.8.0.jar"
        - name: stage quarkus app
          runs: |
            set -eux -o pipefail

            app=runtime/admin/build/quarkus-app
            dest="${target.dir}/usr/share/apache-polaris-admin-tool"

            install -d "${dest}"
            install -m 0644 "${app}/quarkus-run.jar" "${dest}/polaris-admin-tool.jar"
            cp -a "${app}/app" "${app}/lib" "${app}/quarkus" "${dest}/"
            install -m 0644 runtime/admin/distribution/LICENSE "${dest}/LICENSE"
            install -m 0644 runtime/admin/distribution/NOTICE "${dest}/NOTICE"

            test -f "${dest}/quarkus/quarkus-application.dat"
            test -d "${dest}/lib/boot"
            test -d "${dest}/lib/main"
        - name: verify forced dependency versions
          runs: |
            set -eux -o pipefail

            lib="${target.dir}/usr/share/apache-polaris-admin-tool/lib/main"
            expect() {
              found="$(find "${lib}" -maxdepth 1 -name "$1-[0-9]*.jar" -printf '%f\n')"
              test -n "${found}"
              test "$(printf '%s\n' "${found}" | wc -l)" -eq 1
              version="${found#"$1-"}"
              version="${version%.jar}"
              test "$(printf '%s\n%s\n' "$2" "${version}" | sort -V | head -n 1)" = "$2"
              [ "$#" -lt 3 ] || test -z "$(find "${lib}" -maxdepth 1 -name "$3" ! -name "*-${version}.jar")"
            }

            expect com.fasterxml.jackson.core.jackson-core 2.22.4
            expect com.fasterxml.jackson.core.jackson-databind 2.22.4
            expect com.fasterxml.jackson.dataformat.jackson-dataformat-smile 2.22.4
            expect tools.jackson.core.jackson-core 3.2.4
            expect tools.jackson.core.jackson-databind 3.2.4
            expect tools.jackson.dataformat.jackson-dataformat-smile 3.2.4 'tools.jackson.*.jar'
            expect software.amazon.awssdk.third-party-jackson-core 2.56.0 'software.amazon.awssdk.*.jar'
            expect io.grpc.grpc-netty-shaded 1.85.0 'io.grpc.*.jar'
            expect org.postgresql.postgresql 42.7.14
            expect io.netty.netty-codec-http 4.1.139.Final 'io.netty.netty-codec*.jar'
            expect io.vertx.vertx-core 4.5.35 'io.vertx.vertx-*.jar'
            expect org.mongodb.mongodb-driver-core 5.11.1 'org.mongodb.*.jar'
            expect com.google.guava.guava 33.7.2-jre
            expect com.auth0.java-jwt 4.6.2
            expect io.opentelemetry.opentelemetry-api 1.67.0 'io.opentelemetry.opentelemetry-*.jar'
            expect com.aayushatharva.brotli4j.brotli4j 1.24.0 'com.aayushatharva.brotli4j.*.jar'
        - name: run upstream admin tests
          privileged: true
          runs: |
            set -eux -o pipefail

            unset CI

            gradle :polaris-admin:test \
              --tests org.apache.polaris.admintool.BootstrapCommandTest \
              --tests org.apache.polaris.admintool.PurgeCommandTest \
              --tests org.apache.polaris.admintool.nosql.NoSqlInMemoryBootstrapCommandTest \
              --tests org.apache.polaris.admintool.nosql.NoSqlInMemoryPurgeCommandTest \
              --tests org.apache.polaris.admintool.nosql.TestNoSqlMaintenanceRunCommand \
              --no-daemon \
              --no-build-cache \
              --no-scan \
              --console=plain \
              --warning-mode=summary

            ls runtime/admin/build/test-results/test/
            test "$(find runtime/admin/build/test-results/test -name 'TEST-*.xml' | wc -l)" -eq 5
        - name: verify bundled library versions
          runs: |
            set -eux -o pipefail

            lib="${target.dir}/usr/share/apache-polaris-admin-tool/lib/main"
            pick() {
              found="$(find "${lib}" -maxdepth 1 -name "$1-[0-9]*.jar")"
              test -n "${found}"
              test "$(printf '%s\n' "${found}" | wc -l)" -eq 1
            }

            pick io.grpc.grpc-netty-shaded
            unzip -p "${found}" META-INF/io.grpc.netty.shaded.io.netty.versions.properties \
              | grep -Fx "netty-common.version=4.2.17.Final"
            test "${found##*/}" = "io.grpc.grpc-netty-shaded-1.85.0.jar"

            pick software.amazon.awssdk.third-party-jackson-core
            "${JAVA_HOME}/bin/javap" -c -cp "${found}" software.amazon.awssdk.thirdparty.jackson.core.json.PackageVersion \
              | grep -wF "String 2.21.7"

            pick org.projectnessie.cel.cel-standalone
            test "${found##*/}" = "org.projectnessie.cel.cel-standalone-0.8.0.jar"
            test "$("${JAVA_HOME}/bin/javap" -constants -cp "${found}" org.projectnessie.cel.relocated.com.google.protobuf.RuntimeVersion \
              | sed -n -E 's/^  public static final int (MAJOR|MINOR|PATCH) = ([0-9]+);$/\2/p' | paste -sd.)" = "4.35.1"

            pick org.postgresql.postgresql
            unzip -l "${found}" "META-INF/licenses/com.ongres.scram/scram-client-3.2/*"
            unzip -l "${found}" "META-INF/licenses/com.ongres.scram/scram-common-3.2/*"
            unzip -l "${found}" "META-INF/licenses/com.ongres.stringprep/stringprep-2.2/*"
            unzip -l "${found}" "META-INF/licenses/com.ongres.stringprep/saslprep-2.2/*"
        - uses: spdx@v1
          with:
            license: Apache-2.0
            name: apache-polaris-admin-tool-1-grpc-netty-buffer
            purl: pkg:maven/io.netty/netty-buffer@4.2.17.Final
            version: 4.2.17.Final
        - uses: spdx@v1
          with:
            license: Apache-2.0
            name: apache-polaris-admin-tool-1-grpc-netty-codec-base
            purl: pkg:maven/io.netty/netty-codec-base@4.2.17.Final
            version: 4.2.17.Final
        - uses: spdx@v1
          with:
            license: Apache-2.0
            name: apache-polaris-admin-tool-1-grpc-netty-codec-compression
            purl: pkg:maven/io.netty/netty-codec-compression@4.2.17.Final
            version: 4.2.17.Final
        - uses: spdx@v1
          with:
            license: Apache-2.0
            name: apache-polaris-admin-tool-1-grpc-netty-codec-http
            purl: pkg:maven/io.netty/netty-codec-http@4.2.17.Final
            version: 4.2.17.Final
        - uses: spdx@v1
          with:
            license: Apache-2.0
            name: apache-polaris-admin-tool-1-grpc-netty-codec-http2
            purl: pkg:maven/io.netty/netty-codec-http2@4.2.17.Final
            version: 4.2.17.Final
        - uses: spdx@v1
          with:
            license: Apache-2.0
            name: apache-polaris-admin-tool-1-grpc-netty-codec-socks
            purl: pkg:maven/io.netty/netty-codec-socks@4.2.17.Final
            version: 4.2.17.Final
        - uses: spdx@v1
          with:
            license: Apache-2.0
            name: apache-polaris-admin-tool-1-grpc-netty-common
            purl: pkg:maven/io.netty/netty-common@4.2.17.Final
            version: 4.2.17.Final
        - uses: spdx@v1
          with:
            license: Apache-2.0
            name: apache-polaris-admin-tool-1-grpc-netty-handler
            purl: pkg:maven/io.netty/netty-handler@4.2.17.Final
            version: 4.2.17.Final
        - uses: spdx@v1
          with:
            license: Apache-2.0
            name: apache-polaris-admin-tool-1-grpc-netty-handler-proxy
            purl: pkg:maven/io.netty/netty-handler-proxy@4.2.17.Final
            version: 4.2.17.Final
        - uses: spdx@v1
          with:
            license: Apache-2.0
            name: apache-polaris-admin-tool-1-grpc-netty-resolver
            purl: pkg:maven/io.netty/netty-resolver@4.2.17.Final
            version: 4.2.17.Final
        - uses: spdx@v1
          with:
            license: Apache-2.0
            name: apache-polaris-admin-tool-1-grpc-netty-transport
            purl: pkg:maven/io.netty/netty-transport@4.2.17.Final
            version: 4.2.17.Final
        - uses: spdx@v1
          with:
            license: Apache-2.0
            name: apache-polaris-admin-tool-1-grpc-netty-transport-classes-epoll
            purl: pkg:maven/io.netty/netty-transport-classes-epoll@4.2.17.Final
            version: 4.2.17.Final
        - uses: spdx@v1
          with:
            license: Apache-2.0
            name: apache-polaris-admin-tool-1-grpc-netty-transport-native-epoll
            purl: pkg:maven/io.netty/netty-transport-native-epoll@4.2.17.Final
            version: 4.2.17.Final
        - uses: spdx@v1
          with:
            license: Apache-2.0
            name: apache-polaris-admin-tool-1-grpc-netty-transport-native-unix-common
            purl: pkg:maven/io.netty/netty-transport-native-unix-common@4.2.17.Final
            version: 4.2.17.Final
        - uses: spdx@v1
          with:
            license: Apache-2.0
            name: apache-polaris-admin-tool-1-awssdk-jackson-core
            purl: pkg:maven/com.fasterxml.jackson.core/jackson-core@2.21.7
            version: 2.21.7
        - uses: spdx@v1
          with:
            license: Apache-2.0
            name: apache-polaris-admin-tool-1-grpc-netty-tcnative-boringssl-static
            purl: pkg:maven/io.netty/netty-tcnative-boringssl-static@2.0.81.Final
            version: 2.0.81.Final
        - uses: spdx@v1
          with:
            license: Apache-2.0
            name: apache-polaris-admin-tool-1-grpc-netty-tcnative-classes
            purl: pkg:maven/io.netty/netty-tcnative-classes@2.0.81.Final
            version: 2.0.81.Final
        - uses: spdx@v1
          with:
            license: Apache-2.0
            name: apache-polaris-admin-tool-1-cel-agrona
            purl: pkg:maven/org.agrona/agrona@2.5.0
            version: 2.5.0
        - uses: spdx@v1
          with:
            license: BSD-3-Clause
            name: apache-polaris-admin-tool-1-cel-protobuf-java
            purl: pkg:maven/com.google.protobuf/protobuf-java@4.35.1
            version: 4.35.1
        - uses: spdx@v1
          with:
            license: BSD-2-Clause
            name: apache-polaris-admin-tool-1-pgjdbc-scram-client
            purl: pkg:maven/com.ongres.scram/scram-client@3.2
            version: 3.2
        - uses: spdx@v1
          with:
            license: BSD-2-Clause
            name: apache-polaris-admin-tool-1-pgjdbc-scram-common
            purl: pkg:maven/com.ongres.scram/scram-common@3.2
            version: 3.2
        - uses: spdx@v1
          with:
            license: BSD-2-Clause
            name: apache-polaris-admin-tool-1-pgjdbc-stringprep
            purl: pkg:maven/com.ongres.stringprep/stringprep@2.2
            version: 2.2
        - uses: spdx@v1
          with:
            license: BSD-2-Clause
            name: apache-polaris-admin-tool-1-pgjdbc-saslprep
            purl: pkg:maven/com.ongres.stringprep/saslprep@2.2
            version: 2.2
        - name: stage bundled library sbom
          runs: |
            set -eux -o pipefail

            install -d "${target.dir}/opt/docker/sbom"
            cp -a /opt/docker/sbom/apache-polaris-admin-tool-1-* "${target.dir}/opt/docker/sbom/"
        - name: java sbom
          uses: sbom@v1
          with:
            extra-scanners: java-archive-cataloger
            prefix: apache-polaris-admin-tool
            source: ${target.dir}/usr/share/apache-polaris-admin-tool
        - uses: dhi/build-pkg:0
          with:
            depends:
              - eclipse-temurin-21-jre
            description: Apache Polaris admin tool for bootstrapping, purging and maintaining Polaris persistence
            files:
              - opt/docker/sbom
              - usr/share/apache-polaris-admin-tool
            license: Apache-2.0
            name: apache-polaris-admin-tool-1
            rel: 1
            url: https://polaris.apache.org/
            version: 1.8.0
      paths:
        - type: file
          path: ${source.dir}/files/maven-central-mirror.init.gradle
          uid: 0
          gid: 0
          mode: "0444"
          source: package/main/apache-polaris-admin-tool/files/maven-central-mirror.init.gradle
        - type: file
          path: ${source.dir}/files/cve-pins.init.gradle
          uid: 0
          gid: 0
          mode: "0444"
          source: package/main/apache-polaris-admin-tool/files/cve-pins.init.gradle
os-release:
  name: Docker Hardened Images (Debian)
  id: debian
  version-id: "13"
  version-codename: trixie
  pretty-name: Docker Hardened Images/Debian GNU/Linux 13 (trixie)
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
