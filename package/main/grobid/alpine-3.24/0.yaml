# syntax=dhi.io/build:2-alpine3.24

image: dhi.io/pkg-grobid
variant: runtime
tags:
  - 0.9.1-alpine3.24
  - 0.9.1-r0-alpine3.24
platforms:
  - linux/amd64
  - linux/arm64
dates:
  release: "2017-11-09"
vars:
  BUNDLED_PDFALTO_VERSION: 0.6.2
  COMMIT_SHA: 523bb8e97f357e93682dc4eaa6d22faa8b5b93de
  GRADLE_VERSION: 9.8.0-r1
  JDK_VERSION: 21.0.12.8.1.1-r2
  PACKAGE_NAME: grobid-0
  PDFALTO_COMMIT_SHA: c830572fc1e9e8c55e796307ff441e56db895827
  PDFALTO_VERSION: v0.6.2
  REL: "0"
  SEMVER_MAJOR_MINOR_VERSION: "0.9"
  SEMVER_MAJOR_VERSION: "0"
  SEMVER_VERSION: 0.9.1
  VERSION: 0.9.1
  WAPITI_CHECKSUM: sha256:a732f6bcd911e73f4fa7adc2e345424c0fb40e6c2e81d4c2e74b2bd0e19c4f92
  WAPITI_COMMIT: a9c25d2bcccd60f1a54a7019689bd5229e866f00
  WAPITI_JAR_NAME: wapiti-1.5.0.jar
  WAPITI_VERSION: 1.5.0
  XPDF_CHECKSUM: sha256:8e88ceb48178cd543fc6679b1cd1090840daa46d06740c1d0f306968cf2b1e43
  XPDF_COMMIT: eb5f2194a2ce034a8a1ab74c41fff33895cb6507
contents:
  repositories:
    - https://dhi.io/apk/alpine/v3.24/main
    - https://dhi.io/apk/alpine/v3.23/main
    - https://dl-cdn.alpinelinux.org/alpine/v3.24/main
    - https://dl-cdn.alpinelinux.org/alpine/v3.24/community
  keyring:
    - https://dhi.io/keyring/dhi-apk@docker-0F81AD7700D99184.rsa.pub
  packages:
    - alpine-baselayout-data
  builds:
    - name: grobid
      environment:
        GRADLE_OPTS: -Xmx4g
        GRADLE_USER_HOME: /root/.gradle
        JAVA_HOME: /usr/lib/jvm/temurin-21
      caches:
        - path: /root/.gradle
      contents:
        repositories:
          - https://dhi.io/apk/alpine/v3.24/main
        keyring:
          - https://dhi.io/keyring/dhi-apk@docker-0F81AD7700D99184.rsa.pub
        packages:
          - bash
          - ca-certificates-bundle
          - cmake
          - coreutils
          - findutils
          - fontconfig-dev
          - freetype-dev
          - g++
          - gcc
          - git
          - icu-dev
          - libpng-dev
          - linux-headers
          - libxml2-dev
          - make
          - musl-dev
          - patch
          - pkgconf
          - unzip
          - zlib-dev
          - eclipse-temurin-21-jdk=21.0.12.8.1.1-r2
          - gradle-9=9.8.0-r1
        files:
          - url: git+https://github.com/grobidOrg/grobid.git#0.9.1
            checksum: 523bb8e97f357e93682dc4eaa6d22faa8b5b93de
            path: ${source.dir}/grobid
            spdx:
              name: grobid
              version: 0.9.1
              packages:
                - name: grobid
                  purl: pkg:maven/org.grobid/grobid-core@0.9.1
                  license: Apache-2.0
            uid: 0
            gid: 0
          - url: git+https://github.com/kermitt2/pdfalto.git#v0.6.2
            checksum: c830572fc1e9e8c55e796307ff441e56db895827
            path: ${source.dir}/pdfalto
            spdx:
              name: pdfalto
              version: 0.6.2
              packages:
                - name: pdfalto
                  purl: pkg:github/kermitt2/pdfalto@v0.6.2
                  license: GPL-2.0-only
            uid: 0
            gid: 0
          - url: https://github.com/lfoppiano/xpdf-4.05/archive/eb5f2194a2ce034a8a1ab74c41fff33895cb6507.tar.gz
            checksum: sha256:8e88ceb48178cd543fc6679b1cd1090840daa46d06740c1d0f306968cf2b1e43
            path: ${source.dir}/xpdf
            spdx:
              name: xpdf
              version: eb5f2194a2ce034a8a1ab74c41fff33895cb6507
              packages:
                - name: xpdf
                  purl: pkg:github/lfoppiano/xpdf-4.05@eb5f2194a2ce034a8a1ab74c41fff33895cb6507
                  license: GPL-2.0-only OR GPL-3.0-only
            uid: 0
            gid: 0
          - url: https://github.com/kermitt2/Wapiti/archive/a9c25d2bcccd60f1a54a7019689bd5229e866f00.tar.gz
            checksum: sha256:a732f6bcd911e73f4fa7adc2e345424c0fb40e6c2e81d4c2e74b2bd0e19c4f92
            path: ${source.dir}/wapiti
            spdx:
              name: wapiti
              version: 1.5.0
              packages:
                - name: wapiti
                  purl: pkg:github/kermitt2/Wapiti@a9c25d2bcccd60f1a54a7019689bd5229e866f00
                  license: BSD-2-Clause
            uid: 0
            gid: 0
      pipeline:
        - name: lock gradle resolution
          uses: patch@v1
          work-dir: ${source.dir}/grobid
          with:
            options: -p1
            patches:
              - ${source.dir}/patch/gradle-dependency-lock.patch
        - name: link pdfalto against alpine shared libraries
          uses: patch@v1
          work-dir: ${source.dir}/pdfalto
          with:
            options: -p1
            patches:
              - ${source.dir}/patch/pdfalto-system-libs.patch
        - name: build musl pdfalto
          runs: |
            set -eux -o pipefail

            if [ -f "${source.dir}/xpdf/CMakeLists.txt" ]; then
              xsrc="${source.dir}/xpdf"
            else
              xsrc=$(find "${source.dir}/xpdf" -mindepth 1 -maxdepth 1 -type d)
            fi
            test -f "$xsrc/CMakeLists.txt"
            dest="${source.dir}/pdfalto/xpdf-4.05"
            if [ -e "$dest" ]; then
              rm -r "$dest"
            fi
            mkdir -p "$dest"
            cp -a "$xsrc"/. "$dest"/
            test -f "$dest/CMakeLists.txt"
            cmake -S "${source.dir}/pdfalto" -B "${source.dir}/pdfalto/build"
            aconf="${source.dir}/pdfalto/build/xpdf-4.05/aconf.h"
            test -f "$aconf"
            mkdir -p "${source.dir}/pdfalto/xpdf-4.05/build"
            cp "$aconf" "${source.dir}/pdfalto/xpdf-4.05/build/aconf.h"
            cmake --build "${source.dir}/pdfalto/build" -j"$(nproc)"
            test -x "${source.dir}/pdfalto/build/pdfalto"
        - name: build musl libwapiti
          runs: |
            set -eux -o pipefail

            if [ -f "${source.dir}/wapiti/CMakeLists.txt" ]; then
              wsrc="${source.dir}/wapiti"
            else
              wsrc=$(find "${source.dir}/wapiti" -mindepth 1 -maxdepth 1 -type d)
            fi
            test -f "$wsrc/src/swig/wapiti-1.5.0.jar"
            cmake -S "$wsrc" -B "${source.dir}/wapiti-build" -DCMAKE_POLICY_VERSION_MINIMUM=3.5
            cmake --build "${source.dir}/wapiti-build" -j"$(nproc)"
            test -f "${source.dir}/wapiti-build/libwapiti.so"
        - name: drop foreign natives and deep-learning models
          work-dir: ${source.dir}/grobid
          runs: |
            set -eux -o pipefail

            rm -r grobid-home/lib/win-32
            rm -r grobid-home/lib/win-64
            rm -r grobid-home/lib/mac-64
            rm -r grobid-home/lib/mac_arm-64
            rm -r grobid-home/lib/lin-32
            rm -r grobid-home/pdfalto/mac-64
            rm -r grobid-home/pdfalto/mac_arm-64
            rm -r grobid-home/models/*-BidLSTM_*
            if [ "$(uname -m)" = "aarch64" ]; then
              rm -r grobid-home/pdfalto/lin-64
              rm -r grobid-home/lib/lin-64
            else
              rm -r grobid-home/pdfalto/lin_arm-64
              rm -r grobid-home/lib/lin_arm-64
            fi
        - name: route maven central through the dhi proxy
          secrets:
            - id: maven_user
              env: MAVEN_USER
              optional: true
            - id: maven_password
              env: MAVEN_PASSWORD
              optional: true
          runs: |
            set -eux -o pipefail

            rm -f /root/.gradle/init.d/gradle-mirror.init.gradle
            init=/root/.gradle/init.d/dhi-central-proxy.init.gradle
            case "${MAVEN_USER:+set}${MAVEN_PASSWORD:+set}" in
              setset) ;;
              *)
                rm -f "$init"
                echo "no MAVEN_USER or MAVEN_PASSWORD present; resolving from public repositories"
                exit 0
                ;;
            esac
            mkdir -p /root/.gradle/init.d
            cat > "$init" << 'EOF'
            def rawBase = System.getenv("DHI_MAVEN_PROXY_URL") ?: "https://dl.cloudsmith.io/basic/docker/dhi-maven-central/maven"
            def mirrorUrl = (rawBase - ~/\/+$/) + "/"
            def mavenUser = System.getenv("MAVEN_USER")
            def mavenPassword = System.getenv("MAVEN_PASSWORD")

            def isCentral = { repo ->
                if (!(repo instanceof org.gradle.api.artifacts.repositories.MavenArtifactRepository)) {
                    return false
                }
                def parsed
                try {
                    parsed = new URI(repo.url?.toString() ?: "")
                } catch (Exception ignored) {
                    return false
                }
                def host = parsed.host
                def path = parsed.path ?: ""
                return (host == "repo.maven.apache.org" || host == "repo1.maven.org") && path.startsWith("/maven2")
            }

            def useProxy = { repo ->
                repo.setUrl(mirrorUrl)
                repo.credentials {
                    username = mavenUser
                    password = mavenPassword
                }
                repo.authentication {
                    basic(org.gradle.authentication.http.BasicAuthentication)
                }
            }

            def rewriteCentral = { handler ->
                handler.all { repo ->
                    if (isCentral(repo)) {
                        useProxy(repo)
                    }
                }
            }

            settingsEvaluated { settings ->
                def repos = settings.pluginManagement.repositories
                def declared = repos.collect { it }
                repos.clear()
                repos.maven { repo ->
                    repo.name = "dhiMavenProxy"
                    useProxy(repo)
                }
                if (declared.isEmpty()) {
                    repos.gradlePluginPortal()
                } else {
                    declared.each { repos.add(it) }
                }
                rewriteCentral(repos)
            }

            gradle.allprojects { project ->
                rewriteCentral(project.buildscript.repositories)
                rewriteCentral(project.repositories)
            }
            EOF
            chmod 0600 "$init"
            echo "MAVEN_USER and MAVEN_PASSWORD present; Maven Central resolves through the DHI proxy"
        - name: assemble distributions
          work-dir: ${source.dir}/grobid
          privileged: true
          secrets:
            - id: maven_user
              env: MAVEN_USER
              optional: true
            - id: maven_password
              env: MAVEN_PASSWORD
              optional: true
          runs: |
            set -eux -o pipefail

            test -f gradle.lockfile
            gradle assemble --no-daemon --stacktrace -Dorg.gradle.java.home="${JAVA_HOME}"
        - name: stage service and home
          work-dir: ${source.dir}/grobid
          runs: |
            set -eux -o pipefail

            svc=$(find grobid-service/build -type f -name 'grobid-service-*.zip')
            home=$(find grobid-home/build -type f -name 'grobid-home*.zip')
            test -f "$svc"
            test -f "$home"
            stage=$(mktemp -d)
            unzip -q "$svc" -d "$stage/svc"
            unzip -q "$home" -d "$stage/home"
            svc_dir=$(find "$stage/svc" -mindepth 1 -maxdepth 1 -type d)
            home_dir=$(find "$stage/home" -mindepth 1 -maxdepth 1 -type d -name grobid-home)
            test -d "$svc_dir"
            test -d "$home_dir"
            arch=lin-64
            if [ "$(uname -m)" = "aarch64" ]; then
              arch=lin_arm-64
            fi
            root="${target.dir}/usr/lib/grobid"
            mkdir -p "$root"
            mv "$svc_dir" "$root/grobid-service"
            mv "$home_dir" "$root/grobid-home"
            pdf="$root/grobid-home/pdfalto/$arch"
            lib="$root/grobid-home/lib/$arch"
            bundled=$(sed -n '/Updated pdfalto to [0-9]/{s/.*Updated pdfalto to \([0-9][0-9.]*[0-9]\).*/\1/p;q;}' CHANGELOG.md)
            test -n "$bundled"
            test "v$bundled" = "v0.6.2"
            test "$bundled" = "0.6.2"
            rm "$pdf/pdfalto"
            cp -a "${source.dir}/pdfalto/build/pdfalto" "$pdf/pdfalto"
            chmod 755 "$pdf/pdfalto" "$pdf/pdfalto_server"
            test -x "$pdf/pdfalto_server"
            grep -q '/bin/bash' "$pdf/pdfalto_server"
            rm "$lib/libwapiti.so"
            cp -a "${source.dir}/wapiti-build/libwapiti.so" "$lib/libwapiti.so"
            if [ "$arch" = lin-64 ]; then
              rm "$lib/libcrfpp.so"
            fi
            test ! -e "$lib/libcrfpp.so"
            chmod -R a+rX "$root/grobid-home/pdfalto"
            test -x "$root/grobid-service/bin/grobid-service"
            test -f "$root/grobid-service/lib/grobid-trainer-0.9.1.jar"
            lic="$root/licenses"
            mkdir -p "$lic/adobe-cmaps"
            install -m 644 "${source.dir}/grobid/LICENSE" "$lic/LICENSE.grobid"
            install -m 644 "${source.dir}/pdfalto/LICENSE" "$lic/LICENSE.pdfalto"
            wcopy=$(find "${source.dir}/wapiti" -type f -name COPYING -print -quit)
            xcopy=$(find "${source.dir}/xpdf" -type f -name COPYING -print -quit)
            xcopy3=$(find "${source.dir}/xpdf" -type f -name COPYING3 -print -quit)
            test -n "$wcopy"
            test -n "$xcopy"
            test -n "$xcopy3"
            install -m 644 "$wcopy" "$lic/COPYING.wapiti"
            install -m 644 "$xcopy" "$lic/COPYING.xpdf"
            install -m 644 "$xcopy3" "$lic/COPYING3.xpdf"
            find "$root/grobid-home/pdfalto/languages" -type f -name LICENSE.md | while read -r cmap; do
              lang=$(basename "$(dirname "$(dirname "$cmap")")")
              install -m 644 "$cmap" "$lic/adobe-cmaps/${lang}-LICENSE.md"
            done
            test -f "$lic/LICENSE.grobid"
            test ! -e "$lic/NOTICE.grobid"
            test -f "$lic/LICENSE.pdfalto"
            test -f "$lic/COPYING.wapiti"
            test -f "$lic/COPYING.xpdf"
            test -f "$lic/COPYING3.xpdf"
            test -f "$lic/adobe-cmaps/xpdf-chinese-simplified-LICENSE.md"
            test -f "$lic/adobe-cmaps/xpdf-chinese-traditional-LICENSE.md"
            test -f "$lic/adobe-cmaps/xpdf-japanese-LICENSE.md"
            test -f "$lic/adobe-cmaps/xpdf-korean-LICENSE.md"
            test ! -e "$lic/COPYING.crfpp"
        - name: service jars sbom
          uses: sbom@v1
          with:
            extra-scanners: java-archive-cataloger
            prefix: grobid-service
            source: ${target.dir}/usr/lib/grobid/grobid-service/lib
        - name: stage native sboms
          runs: |
            set -eux -o pipefail

            install -d "${target.dir}/opt/docker/sbom"
            cp -a \
              /opt/docker/sbom/pdfalto \
              /opt/docker/sbom/xpdf \
              /opt/docker/sbom/wapiti \
              /opt/docker/sbom/grobid \
              /opt/docker/sbom/grobid-service \
              "${target.dir}/opt/docker/sbom/"
            test -f "${target.dir}/opt/docker/sbom/pdfalto/.spdx.pdfalto.json"
            test -f "${target.dir}/opt/docker/sbom/xpdf/.spdx.xpdf.json"
            test -f "${target.dir}/opt/docker/sbom/wapiti/.spdx.wapiti.json"
            test -f "${target.dir}/opt/docker/sbom/grobid/.spdx.grobid.json"
            test -f "${target.dir}/opt/docker/sbom/grobid-service/.spdx.grobid-service.json"
        - uses: dhi/build-pkg:0
          with:
            depends:
              - eclipse-temurin-21-jre
              - fontconfig
              - freetype
              - libpng
              - zlib
              - libxml2
              - icu-libs
              - icu-data-en
              - libstdc++
              - bash
              - findutils
              - sed
              - coreutils
              - musl
            description: GROBID bibliographic data extraction service
            files:
              - usr/lib/grobid
              - opt/docker/sbom/pdfalto
              - opt/docker/sbom/xpdf
              - opt/docker/sbom/wapiti
              - opt/docker/sbom/grobid
              - opt/docker/sbom/grobid-service
            formats:
              - apk
            license: Apache-2.0 AND GPL-2.0-only AND BSD-2-Clause AND BSD-3-Clause
            name: grobid-0
            rel: 0
            url: https://github.com/grobidOrg/grobid
            version: 0.9.1
      paths:
        - type: file
          path: ${source.dir}/patch/gradle-dependency-lock.patch
          uid: 0
          gid: 0
          source: package/main/grobid/patch/gradle-dependency-lock.patch
        - type: file
          path: ${source.dir}/patch/pdfalto-system-libs.patch
          uid: 0
          gid: 0
          source: package/main/grobid/patch/pdfalto-system-libs.patch
