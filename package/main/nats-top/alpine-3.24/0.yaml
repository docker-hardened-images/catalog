contents:
  repositories:
    - https://dhi.io/apk/alpine/v3.24/main
    - https://dhi.io/apk/alpine/v3.23/main
    - https://dl-cdn.alpinelinux.org/alpine/v3.24/main
    - https://dl-cdn.alpinelinux.org/alpine/v3.24/community
  keyring:
    - https://dhi.io/keyring/dhi-apk@docker-0F81AD7700D99184.rsa.pub
  packages:
    - alpine-baselayout-data
  builds:
    - name: nats-top
      work-dir: /go/src/github.com/nats-io/nats-top
      caches:
        - path: /go/pkg/mod
      contents:
        packages:
          - busybox
          - bash
          - ca-certificates-bundle
          - coreutils
          - findutils
          - jq
          - mawk
          - sed
          - golang-1.26=1.26.5-r0
          - golang-1.26-oci-config=1.26.5-r0
        files:
          - url: git+https://github.com/nats-io/nats-top.git#v0.6.4
            checksum: 8d79e0bb87577ed33fc9aba5415cc41b22b63a9b
            path: /go/src/github.com/nats-io/nats-top
            spdx:
              name: nats-top
              version: 0.6.4
              packages:
                - name: nats-top
                  purl: pkg:golang/github.com/nats-io/nats-top@0.6.4
                  license: MIT
            uid: 0
            gid: 0
      pipeline:
        - name: update go dependencies
          uses: go/bump@v1
          with:
            deps:
              - golang.org/x/crypto@v0.52.0
              - github.com/nats-io/nats-server/v2@v2.12.6
            download: true
        - name: test
          privileged: true
          runs: |
            set -eux -o pipefail

            go install github.com/cloudflare/cfssl/cmd/...@latest
            export PATH="$(go env GOPATH)/bin:$PATH"
            cd ./util/test
            ./make-new-certs.sh
            cd ../..

            CGO_ENABLED=0 go test ./...
        - name: build
          uses: go/build@v1
          with:
            fips: false
            ldflags:
              - -s -w
              - -X main.version=0.6.4
              - -X main.commit=8d79e0bb87577ed33fc9aba5415cc41b22b63a9b
              - -X main.date=${SOURCE_DATE_EPOCH}
            output: ${target.dir}/usr/bin/nats-top
            packages: .
        - name: build dev
          uses: go/build@v1
          with:
            fips: false
            ldflags:
              - -s -w
              - -X main.version=0.6.4
              - -X main.commit=8d79e0bb87577ed33fc9aba5415cc41b22b63a9b
              - -X main.date=${SOURCE_DATE_EPOCH}
            output: ${target.dir}/usr/bin/nats-top-dev
            packages: .
            strip: false
        - uses: dhi/build-pkg:0
          with:
            description: NATS top-like monitor
            files:
              - usr/bin/nats-top
            license: MIT
            name: nats-top
            rel: 1
            subpackages:
              - files:
                  - path: usr/bin/nats-top
                    source: usr/bin/nats-top-dev
                name: nats-top-dev
            url: https://github.com/nats-io/nats-top
            version: 0.6.4
