# syntax=dhi.io/build:2-alpine3.24

image: dhi.io/pkg-fleet
variant: runtime
tags:
  - 0.17-alpine3.24
  - 0.17.0-alpine3.24
  - 0.17.0-r0-alpine3.24
platforms:
  - linux/amd64
  - linux/arm64
vars:
  COMMIT_SHA: 816ee3f7f31269bfb120f8cd130b6c3bbad66106
  GOLANG_MAJOR_MINOR_VERSION: "1.27"
  GOLANG_VERSION: 1.27.4-r1
  PACKAGE_NAME: fleet-0.17
  REL: "0"
  SEMVER_MAJOR_MINOR_VERSION: "0.17"
  SEMVER_MAJOR_VERSION: "0"
  SEMVER_VERSION: 0.17.0
  VERSION: 0.17.0
  X_CRYPTO_VERSION: v0.59.0
contents:
  repositories:
    - https://dhi.io/apk/alpine/v3.24/main
    - https://dhi.io/apk/alpine/v3.23/main
    - https://dl-cdn.alpinelinux.org/alpine/v3.24/main
    - https://dl-cdn.alpinelinux.org/alpine/v3.24/community
  keyring:
    - https://dhi.io/keyring/dhi-apk@docker-0F81AD7700D99184.rsa.pub
  packages:
    - alpine-baselayout-data
  builds:
    - name: fleet-0.17
      work-dir: /go/src/github.com/rancher/fleet
      contents:
        packages:
          - busybox
          - ca-certificates-bundle
          - git
          - golang-1.27=1.27.4-r1
          - golang-1.27-oci-config=1.27.4-r1
        files:
          - url: git+https://github.com/rancher/fleet.git#v0.17.0
            checksum: 816ee3f7f31269bfb120f8cd130b6c3bbad66106
            path: /go/src/github.com/rancher/fleet
            spdx:
              name: fleet
              version: 0.17.0
              packages:
                - name: fleet
                  purl: pkg:golang/github.com/rancher/fleet@0.17.0
                  license: Apache-2.0
                - name: fleet-apis
                  purl: pkg:golang/github.com/rancher/fleet/pkg/apis@0.17.0
                  license: Apache-2.0
            uid: 0
            gid: 0
      pipeline:
        - name: update go dependencies (0.17)
          uses: go/bump@v3
          with:
            deps:
              - golang.org/x/net@v0.62.0
              - github.com/klauspost/compress@v1.20.3
              - golang.org/x/crypto@v0.59.0
              - go.opentelemetry.io/otel/trace@v1.47.0
            tidy: true
        - uses: go/hermetic@v1
        - name: test
          environment:
            GODEBUG: zipinsecurepath=1
          runs: |
            set -eux -o pipefail

            go test -shuffle=on -skip '^(TestGetContent|TestGetContentOCI|Test_ChartURL|TestStrategiesWithExpectedCounts|TestGitHubApp_GetToken_NonGithubDotCom)$' $(go list ./... | grep -v -e /e2e -e /integrationtests -e /benchmarks)
            go test -shuffle=on ./internal/bundlereader -run '^TestGetContent$' -skip '^TestGetContent$/^ensure_panic'
        - name: download helmvalues modules
          work-dir: /go/src/github.com/rancher/fleet/pkg/helmvalues
          privileged: true
          runs: |
            set -eux -o pipefail

            go mod download
        - name: test helmvalues
          work-dir: /go/src/github.com/rancher/fleet/pkg/helmvalues
          environment:
            GODEBUG: zipinsecurepath=1
          runs: |
            set -eux -o pipefail

            go test -shuffle=on ./...
        - name: build fleetagent
          uses: go/build@v1
          with:
            fips: false
            ldflags:
              - -s -w
              - -X github.com/rancher/fleet/pkg/version.GitCommit=816ee3f7f31269bfb120f8cd130b6c3bbad66106
              - -X github.com/rancher/fleet/pkg/version.Version=v0.17.0
            output: ${target.dir}/usr/bin/fleetagent
            packages: ./cmd/fleetagent
        - name: build fleetagent dev
          uses: go/build@v1
          with:
            fips: false
            ldflags:
              - -X github.com/rancher/fleet/pkg/version.GitCommit=816ee3f7f31269bfb120f8cd130b6c3bbad66106
              - -X github.com/rancher/fleet/pkg/version.Version=v0.17.0
            output: ${target.dir}/usr/bin/fleetagent-dev
            packages: ./cmd/fleetagent
            strip: false
        - name: add helmvalues sbom
          uses: spdx@v1
          with:
            license: Apache-2.0
            name: fleet-helmvalues
            purl: pkg:golang/github.com/rancher/fleet/pkg/helmvalues@0.17.0
            version: 0.17.0
        - name: stage source sbom
          runs: |
            set -eux -o pipefail

            test -f /opt/docker/sbom/fleet/.spdx.fleet.json
            mkdir -p "${target.dir}/opt/docker/sbom" "${target.dir}/opt/docker/sbom-dev"
            for component in fleet fleet-helmvalues; do
              [ -d "/opt/docker/sbom/${component}" ] || continue
              cp -a "/opt/docker/sbom/${component}" "${target.dir}/opt/docker/sbom/"
              cp -a "/opt/docker/sbom/${component}" "${target.dir}/opt/docker/sbom-dev/"
            done
        - uses: dhi/build-pkg:0
          with:
            depends:
              - ca-certificates-bundle
            description: Fleet agent, the GitOps and HelmOps deployment agent that runs on managed Kubernetes clusters
            files:
              - usr/bin/fleetagent
              - opt/docker/sbom
            license: Apache-2.0
            name: fleet-0.17
            rel: 0
            subpackages:
              - depends:
                  - ca-certificates-bundle
                files:
                  - path: usr/bin/fleetagent
                    source: usr/bin/fleetagent-dev
                  - path: opt/docker/sbom
                    source: opt/docker/sbom-dev
                name: fleet-0.17-dev
            url: https://github.com/rancher/fleet
            version: 0.17.0
os-release:
  name: Docker Hardened Images (Alpine)
  id: alpine
  version-id: "3.24"
  pretty-name: Docker Hardened Images/Alpine Linux v3.24
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
