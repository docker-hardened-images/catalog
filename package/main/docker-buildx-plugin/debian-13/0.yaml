image: dhi.io/pkg-docker-buildx-plugin
variant: runtime
tags:
  - 0.37.0
  - 0.37.0-r0
  - 0.37.0-debian13
  - 0.37.0-r0-debian13
platforms:
  - linux/amd64
  - linux/arm64
dates:
  release: "2026-06-17"
vars:
  COMMIT_SHA: ac30b249211430b85fb8f37b6e7154b5c47ba0b6
  GOLANG_MAJOR_MINOR_VERSION: "1.26"
  GOLANG_VERSION: 1.26.8-0
  REL: "0"
  SEMVER_MAJOR_MINOR_VERSION: "0.37"
  SEMVER_MAJOR_VERSION: "0"
  SEMVER_VERSION: 0.37.0
  VERSION: 0.37.0
contents:
  packages:
    - base-files
  builds:
    - name: docker-buildx-plugin deb
      work-dir: /go/src/github.com/docker/buildx
      caches:
        - path: /go/pkg/mod
      contents:
        repositories:
          - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
        keyring:
          - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
        packages:
          - bash
          - ca-certificates-bundle
          - coreutils
          - findutils
          - golang-1.26=1.26.8-0
          - golang-1.26-oci-config=1.26.8-0
        files:
          - url: git+https://github.com/docker/buildx.git#v0.37.0
            checksum: ac30b249211430b85fb8f37b6e7154b5c47ba0b6
            path: /go/src/github.com/docker/buildx
            spdx:
              name: docker-buildx
              version: 0.37.0
              packages:
                - name: docker-buildx
                  purl: pkg:golang/github.com/docker/buildx@0.37.0
                  license: Apache-2.0
            uid: 0
            gid: 0
      pipeline:
        - name: update buildx go dependencies
          uses: go/bump@v2
          with:
            deps:
              - github.com/moby/go-archive@v0.3.0
              - golang.org/x/mod@v0.40.0
              - golang.org/x/net@v0.58.0
              - golang.org/x/text@v0.41.0
              - golang.org/x/crypto@v0.56.0
            download: true
        - name: test buildx after dependency updates
          runs: |
            set -eux -o pipefail

            go test -count=1 -timeout=5m ./cmd/buildx
        - name: build buildx
          uses: go/build@v1
          with:
            ldflags:
              - -X github.com/docker/buildx/version.Version=v0.37.0
              - -X github.com/docker/buildx/version.Revision=ac30b249211430b85fb8f37b6e7154b5c47ba0b6
              - -X github.com/docker/buildx/version.Package=github.com/docker/buildx
            output: ${target.dir}/usr/libexec/docker/cli-plugins/docker-buildx
            packages: ./cmd/buildx
        - uses: dhi/build-pkg:0
          with:
            description: Docker Buildx CLI plugin
            files:
              - usr/libexec/docker/cli-plugins/docker-buildx
            formats:
              - deb
            license: Apache-2.0
            name: docker-buildx-plugin
            rel: 0
            replaces: docker-ce-cli
            url: https://github.com/docker/buildx
            version: 0.37.0
os-release:
  name: Docker Hardened Images (Debian)
  id: debian
  version-id: "13"
  version-codename: trixie
  pretty-name: Docker Hardened Images/Debian GNU/Linux 13 (trixie)
