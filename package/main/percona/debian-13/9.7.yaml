# syntax=dhi.io/build:2-debian13

image: dhi.io/pkg-percona
variant: runtime
tags:
  - 9.7.2-2-0
  - 9.7.2-2-0-debian13
platforms:
  - linux/amd64
  - linux/arm64
vars:
  BOOST_VERSION: 1.87.0
  COMMIT_SHA: 91438a0430fbcd52dd85472edf3b357484484c22
  DHI_REL: "0"
  DHI_VERSION: 9.7.2-2-0
  PACKAGE_NAME: percona-server-9.7
  REL: "0"
  SEMVER_MAJOR_MINOR_VERSION: "9.7"
  VERSION: 9.7.2-2
contents:
  packages:
    - '!base-files'
  builds:
    - name: percona-server deb
      work-dir: ${source.dir}/percona-server
      contents:
        packages:
          - bison
          - build-essential
          - cmake
          - debhelper
          - dpkg-dev
          - libaio-dev
          - libcurl4-openssl-dev
          - libicu-dev
          - liblz4-dev
          - libncurses-dev
          - libprotobuf-dev
          - libprotoc-dev
          - libssl-dev
          - libtirpc-dev
          - libzstd-dev
          - pkg-config
          - protobuf-compiler
          - python3
          - zlib1g-dev
        files:
          - url: git+https://github.com/percona/percona-server.git#Percona-Server-9.7.2-2
            checksum: 91438a0430fbcd52dd85472edf3b357484484c22
            path: ${source.dir}/percona-server
            spdx:
              name: percona-server
              version: 9.7.2-2
              packages:
                - name: percona-server
                  purl: pkg:github/percona/percona-server@9.7.2-2
                  license: GPL-2.0
            uid: 0
            gid: 0
      pipeline:
        - name: finalize debian packaging templates
          runs: |
            set -eux -o pipefail

            sed -i -e "s/@PACKAGE_NAME@/percona-server-9.7/g" \
              -e "s/@MAJOR_MINOR_VERSION@/9.7/g" \
              debian/control.in debian/changelog
            mv debian/control.in debian/control

            mv debian/percona-server.install.in "debian/percona-server-9.7.install"
            mv debian/percona-server.dirs.in "debian/percona-server-9.7.dirs"
        - uses: dpkg/bump@v1
          with:
            changelog:
              - DHI Build
            version: 9.7.2-2-0
        - uses: dpkg/build@v1
          with:
            args: -b -uc -us -d
        - uses: spdx@v1
          with:
            license: BSL-1.0
            name: boost
            purl: pkg:generic/boost@1.87.0
            version: 1.87.0
      paths:
        - type: directory
          path: ${source.dir}/percona-server/debian
          uid: 0
          gid: 0
          mode: "0600"
          source: package/main/percona/debian-13/debian
os-release:
  name: Docker Hardened Images (Debian)
  id: debian
  version-id: "13"
  version-codename: trixie
  pretty-name: Docker Hardened Images/Debian GNU/Linux 13 (trixie)
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
