# syntax=dhi.io/build:2-debian13

image: dhi.io/pkg-percona
variant: runtime
tags:
  - 8.4.10-10-0
  - 8.4.10-10-0-debian13
platforms:
  - linux/amd64
  - linux/arm64
vars:
  BOOST_VERSION: 1.84.0
  COMMIT_SHA: d76e81f492e19c31022071220ad811efe977f5ed
  DHI_REL: "0"
  DHI_VERSION: 8.4.10-10-0
  VERSION: 8.4.10-10
contents:
  packages:
    - '!base-files'
  builds:
    - name: percona-server deb
      work-dir: ${source.dir}/percona-server
      contents:
        packages:
          - bison
          - build-essential
          - cmake
          - debhelper
          - dpkg-dev
          - libaio-dev
          - libcurl4-openssl-dev
          - libicu-dev
          - liblz4-dev
          - libncurses-dev
          - libprotobuf-dev
          - libprotoc-dev
          - libssl-dev
          - libtirpc-dev
          - libzstd-dev
          - pkg-config
          - protobuf-compiler
          - python3
          - zlib1g-dev
        files:
          - url: git+https://github.com/percona/percona-server.git#Percona-Server-8.4.10-10
            checksum: d76e81f492e19c31022071220ad811efe977f5ed
            path: ${source.dir}/percona-server
            spdx:
              name: percona-server
              version: 8.4.10-10
              packages:
                - name: percona-server
                  purl: pkg:github/percona/percona-server@8.4.10-10
                  license: GPL-2.0
            uid: 0
            gid: 0
      pipeline:
        - uses: dpkg/bump@v1
          with:
            changelog:
              - DHI Build
            version: 8.4.10-10-0
        - uses: dpkg/build@v1
          with:
            args: -b -uc -us -d
        - uses: spdx@v1
          with:
            license: BSL-1.0
            name: boost
            purl: pkg:generic/boost@1.84.0
            version: 1.84.0
      paths:
        - type: directory
          path: ${source.dir}/percona-server/debian
          uid: 0
          gid: 0
          mode: "0600"
          source: package/main/percona/debian-13/debian
os-release:
  name: Docker Hardened Images (Debian)
  id: debian
  version-id: "13"
  version-codename: trixie
  pretty-name: Docker Hardened Images/Debian GNU/Linux 13 (trixie)
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
