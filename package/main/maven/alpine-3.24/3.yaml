# syntax=dhi.io/build:2-alpine3.24

image: dhi.io/pkg-maven
variant: runtime
tags:
  - 3.9.16-alpine3.24
  - 3.9.16-r1-alpine3.24
platforms:
  - linux/amd64
  - linux/arm64
dates:
  release: "2023-01-31"
vars:
  PACKAGE_NAME: maven
  REL: "1"
  SEMVER_MAJOR_MINOR_VERSION: "3.9"
  SEMVER_MAJOR_VERSION: "3"
  SEMVER_VERSION: 3.9.16
  TARBALL_SHA256: 80ffca22aed9e8b9713a232f3394fd81d7f20322df75efdb2b047dbd3e3a23bb
  VERSION: 3.9.16
contents:
  repositories:
    - https://dhi.io/apk/alpine/v3.24/main
    - https://dhi.io/apk/alpine/v3.23/main
    - https://dl-cdn.alpinelinux.org/alpine/v3.24/main
    - https://dl-cdn.alpinelinux.org/alpine/v3.24/community
  keyring:
    - https://dhi.io/keyring/dhi-apk@docker-0F81AD7700D99184.rsa.pub
  packages:
    - alpine-baselayout-data
  builds:
    - name: maven
      work-dir: ${source.dir}/maven
      contents:
        packages:
          - bash
          - coreutils
          - findutils
          - gzip
          - tar
        files:
          - url: https://archive.apache.org/dist/maven/maven-3/3.9.16/binaries/apache-maven-3.9.16-bin.tar.gz
            checksum: sha256:80ffca22aed9e8b9713a232f3394fd81d7f20322df75efdb2b047dbd3e3a23bb
            path: ${source.dir}/maven/apache-maven-3.9.16-bin.tar.gz
            spdx:
              name: maven
              version: 3.9.16
              packages:
                - name: maven
                  purl: pkg:maven/org.apache.maven/apache-maven@3.9.16
                  license: Apache-2.0
            uid: 0
            gid: 0
      pipeline:
        - name: install
          runs: |
            set -eux -o pipefail

            tar -xzf "apache-maven-3.9.16-bin.tar.gz"
            src="apache-maven-3.9.16"
            home="${target.dir}/usr/share/java/maven-3"

            mkdir -p "${home}" "${target.dir}/usr/bin" "${target.dir}/etc" \
              "${target.dir}/usr/share/licenses/maven"

            cp -a "${src}/bin" "${src}/boot" "${src}/conf" "${src}/lib" \
              "${src}/README.txt" "${home}/"
            rm -f "${home}/bin"/*.cmd
            rm -rf "${home}/lib/jansi-native/Windows"

            install -m644 -t "${target.dir}/usr/share/licenses/maven" \
              "${src}/LICENSE" "${src}/NOTICE"

            for file in mvn mvnDebug mvnyjp; do
              ln -sf "../share/java/maven-3/bin/${file}" "${target.dir}/usr/bin/${file}"
            done

            printf 'M2_HOME="/usr/share/java/maven-3"\n' > "${target.dir}/etc/mavenrc"
        - name: maven sbom
          uses: sbom@v1
          with:
            extra-scanners: java-archive-cataloger
            prefix: maven-libs
            source: ${target.dir}/usr/share/java/maven-3
        - uses: dhi/build-pkg:0
          with:
            apk:
              depends:
                - java-jdk
            description: Java project management and project comprehension tool
            files:
              - usr/bin/mvn
              - usr/bin/mvnDebug
              - usr/bin/mvnyjp
              - usr/share/java/maven-3
              - usr/share/licenses/maven
              - etc/mavenrc
            formats:
              - apk
            license: Apache-2.0
            name: maven
            rel: 1
            url: https://maven.apache.org/
            version: 3.9.16
os-release:
  name: Docker Hardened Images (Alpine)
  id: alpine
  version-id: "3.24"
  pretty-name: Docker Hardened Images/Alpine Linux v3.24
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
