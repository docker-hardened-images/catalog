# syntax=dhi.io/build:2-debian13

image: dhi.io/pkg-maven
variant: runtime
tags:
  - 3.9.16
  - 3.9.16-r0
  - 3.9.16-debian13
  - 3.9.16-r0-debian13
platforms:
  - linux/amd64
  - linux/arm64
dates:
  release: "2013-10-22"
vars:
  PACKAGE_NAME: maven
  REL: "0"
  SEMVER_MAJOR_MINOR_VERSION: "3.9"
  SEMVER_MAJOR_VERSION: "3"
  SEMVER_VERSION: 3.9.16
  TARBALL_SHA256: sha256:80ffca22aed9e8b9713a232f3394fd81d7f20322df75efdb2b047dbd3e3a23bb
  VERSION: 3.9.16
contents:
  repositories:
    - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
  keyring:
    - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
  packages:
    - base-files
  builds:
    - name: maven
      work-dir: ${source.dir}/maven
      contents:
        packages:
          - bash
          - ca-certificates
          - coreutils
          - findutils
          - gzip
          - tar
        files:
          - url: https://archive.apache.org/dist/maven/maven-3/3.9.16/binaries/apache-maven-3.9.16-bin.tar.gz
            checksum: sha256:80ffca22aed9e8b9713a232f3394fd81d7f20322df75efdb2b047dbd3e3a23bb
            path: ${source.dir}/maven/apache-maven-3.9.16-bin.tar.gz
            spdx:
              name: maven
              version: 3.9.16
              packages:
                - name: maven
                  purl: pkg:maven/org.apache.maven/apache-maven@3.9.16
                  license: Apache-2.0
            uid: 0
            gid: 0
      pipeline:
        - name: install
          runs: |
            set -eux -o pipefail

            tar -xzf "apache-maven-3.9.16-bin.tar.gz"
            src="apache-maven-3.9.16"
            home="${target.dir}/usr/share/java/maven-3"

            mkdir -p "${home}/bin" "${home}/boot" "${home}/lib" \
              "${target.dir}/usr/bin" "${target.dir}/etc" \
              "${target.dir}/usr/share/licenses/maven"

            install -m644 -t "${home}/bin" "${src}"/bin/*.conf
            install -m755 -t "${home}/bin" \
              "${src}/bin/mvn" "${src}/bin/mvnDebug" "${src}/bin/mvnyjp"
            install -m644 -t "${home}/boot" "${src}"/boot/*.jar
            install -m644 -t "${home}/lib" "${src}"/lib/*.jar
            cp -a "${src}/conf" "${home}/"
            install -m644 -t "${target.dir}/usr/share/licenses/maven" \
              "${src}/LICENSE" "${src}/NOTICE"

            for file in mvn mvnDebug mvnyjp; do
              ln -sf "../share/java/maven-3/bin/${file}" "${target.dir}/usr/bin/${file}"
            done

            printf 'M2_HOME="/usr/share/java/maven-3"\n' > "${target.dir}/etc/mavenrc"
        - name: maven sbom
          uses: sbom@v1
          with:
            extra-scanners: java-archive-cataloger
            prefix: maven-libs
            source: ${target.dir}/usr/share/java/maven-3
        - uses: dhi/build-pkg:0
          with:
            description: Java project management and project comprehension tool
            files:
              - usr/bin/mvn
              - usr/bin/mvnDebug
              - usr/bin/mvnyjp
              - usr/share/java/maven-3
              - usr/share/licenses/maven
              - etc/mavenrc
            formats:
              - deb
            license: Apache-2.0
            name: maven
            rel: 0
            url: https://maven.apache.org/
            version: 3.9.16
os-release:
  name: Docker Hardened Images (Debian)
  id: debian
  version-id: "13"
  version-codename: trixie
  pretty-name: Docker Hardened Images/Debian GNU/Linux 13 (trixie)
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
