# syntax=dhi.io/build:2-debian13

image: dhi.io/pkg-druid
variant: runtime
tags:
  - 36.0.0
  - 36.0.0-r31
  - 36.0.0-debian13
  - 36.0.0-r31-debian13
platforms:
  - linux/amd64
  - linux/arm64
dates:
  release: "2026-02-09"
vars:
  BCFIPS_VERSION: 2.1.3
  BCPKIXFIPS_VERSION: 2.1.13
  BCRNGJENT_VERSION: 1.3.6
  BCTLSFIPS_VERSION: 2.1.25
  BCUTILFIPS_VERSION: 2.1.8
  COMMIT_SHA: 18ee9bce703ff13bf62094b07b1ebd9257225655
  JDK_MAJOR_VERSION: "21"
  JDK_VERSION: 1:21.0.13+9-3
  MAVEN_VERSION: 3.10.0
  NODEJS_VERSION: 24.22.2-0
  PACKAGE_HOME: /usr/share/druid
  PACKAGE_NAME: druid-36
  REL: "31"
  SEMVER_MAJOR_MINOR_VERSION: "36.0"
  SEMVER_MAJOR_VERSION: "36"
  SEMVER_VERSION: 36.0.0
  VERSION: 36.0.0
contents:
  packages:
    - base-files
  builds:
    - name: druid-36
      work-dir: ${source.dir}/druid
      environment:
        JAVA_HOME: /usr/lib/jvm/temurin-21
        MAVEN_ARGS: -Dmaven.wagon.http.retryHandler.class=standard -Dmaven.wagon.http.retryHandler.count=5 -Dmaven.wagon.http.retryHandler.requestSentEnabled=true -Dmaven.wagon.httpconnectionManager.ttlSeconds=120 -Daether.connector.http.retryHandler.count=5
        MAVEN_HOME: /opt/java/apache-maven-3.10.0
        MAVEN_OPTS: -Xmx3g
      caches:
        - path: /root/.m2/repository
      contents:
        repositories:
          - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
        keyring:
          - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
        packages:
          - bash
          - ca-certificates
          - coreutils
          - curl
          - eclipse-temurin-21-jdk=1:21.0.13+9-3
          - findutils
          - grep
          - gzip
          - node-corepack
          - nodejs-24=24.22.2-0
          - npm
          - python3
          - python3-yaml
          - sed
          - tar
          - unzip
        files:
          - url: git+https://github.com/apache/druid.git#druid-36.0.0
            checksum: 18ee9bce703ff13bf62094b07b1ebd9257225655
            path: ${source.dir}/druid
            spdx:
              name: druid
              version: 36.0.0
              packages:
                - name: druid
                  purl: pkg:github/apache/druid@36.0.0
                  license: Apache-2.0
            uid: 0
            gid: 0
          - url: https://dlcdn.apache.org/maven/maven-3/3.10.0/binaries/apache-maven-3.10.0-bin.tar.gz
            path: ${source.dir}/maven/apache-maven-3.10.0-bin.tar.gz
            spdx:
              name: maven
              version: 3.10.0
              packages:
                - name: maven
                  purl: pkg:generic/apache-maven@3.10.0
                  license: Apache-2.0
            uid: 0
            gid: 0
          - url: https://repo1.maven.org/maven2/io/airlift/aircompressor/2.0.3/aircompressor-2.0.3.jar
            checksum: sha256:b86bb66f610079e0bf790d62e2ff68853eb0dc4748a6d68ae28bce92b68094aa
            path: ${source.dir}/patch/deps/aircompressor-2.0.3.jar
            spdx:
              name: aircompressor
              version: 2.0.3
              packages:
                - name: aircompressor
                  purl: pkg:maven/io.airlift/aircompressor@2.0.3
                  license: Apache-2.0
            uid: 0
            gid: 0
      pipeline:
        - name: install maven
          runs: |
            set -eux -o pipefail

            mkdir -p /opt/java
            tar -xzf "${source.dir}/maven/apache-maven-3.10.0-bin.tar.gz" -C /opt/java

            mkdir -p /usr/local/bin
            find "/opt/java/apache-maven-3.10.0/bin" -type f -executable -o -type l | while read -r file; do
              filename=$(basename "$file")
              ln -sf "/opt/java/apache-maven-3.10.0/bin/$filename" "/usr/local/bin/$filename"
            done
        - uses: mvn/mirror@v1
        - name: use gcs mirror when mirror credentials are absent
          secrets:
            - id: maven_user
              env: MAVEN_USER
              optional: true
            - id: maven_password
              env: MAVEN_PASSWORD
              optional: true
          runs: |
            set -eux -o pipefail

            if [ -z "${MAVEN_USER:-}" ] || [ -z "${MAVEN_PASSWORD:-}" ]; then
              mkdir -p /root/.m2
              printf '%s\n' \
                '<?xml version="1.0" encoding="UTF-8"?>' \
                '<settings xmlns="http://maven.apache.org/SETTINGS/1.0.0">' \
                '  <mirrors>' \
                '    <mirror>' \
                '      <id>google-maven-central</id>' \
                '      <name>GCS Maven Central mirror</name>' \
                '      <url>https://maven-central.storage-download.googleapis.com/maven2/</url>' \
                '      <mirrorOf>central</mirrorOf>' \
                '    </mirror>' \
                '  </mirrors>' \
                '</settings>' \
                > /root/.m2/settings.xml
            fi
        - name: patch deps
          uses: mvn/patch@v1
          with:
            dependencies: ${source.dir}/patch/mvn-deps-36.0.json
            dependencies-key: dependencyManagement.dependencies
            downgrade: false
            mvn-root: ${source.dir}/druid
            properties: ${source.dir}/patch/mvn-properties-36.0.json
        - name: backport libthrift 0.24 compatibility
          uses: git/patch@v1
          work-dir: ${source.dir}/druid
          with:
            patch: ${source.dir}/patch/libthrift-0.24-compat.patch
        - name: patch parquet-extensions version
          uses: mvn/patch@v1
          with:
            downgrade: false
            mvn-root: ${source.dir}/druid/extensions-core/parquet-extensions
            properties: ${source.dir}/patch/mvn-properties-parquet-36.0.json
        - name: patch druid-pac4j versions for CVE-2026-40458
          uses: mvn/patch@v1
          with:
            downgrade: false
            mvn-root: ${source.dir}/druid/extensions-core/druid-pac4j
            properties: ${source.dir}/patch/mvn-properties-druid-pac4j.json
        - name: patch opentelemetry-emitter shaded guava
          uses: mvn/patch@v1
          with:
            downgrade: false
            mvn-root: ${source.dir}/druid/extensions-contrib/opentelemetry-emitter
            properties: ${source.dir}/patch/mvn-properties-opentelemetry-emitter.json
        - name: bump vertx-core for CVE-2026-6860 and CVE-2026-1002
          uses: git/patch@v1
          work-dir: ${source.dir}/druid
          with:
            patch: ${source.dir}/patch/vertx-core-36.0.patch
        - name: prune unused extensions from build
          runs: |
            set -eux -o pipefail

            EXCLUDE_MODULES=(
              "extensions-contrib/cassandra-storage"
              "extensions-contrib/aliyun-oss-extensions"
              "extensions-contrib/cloudfiles-extensions"
              "extensions-core/testing-tools"
              "extensions-core/hdfs-storage"
              "extensions-core/druid-kerberos"
            )

            EXCLUDE_ARTIFACTS=(
              "druid-cassandra-storage"
              "druid-cloudfiles-extensions"
              "aliyun-oss-extensions"
              "druid-testing-tools"
              "druid-hdfs-storage"
              "druid-kerberos"
            )

            for m in "${EXCLUDE_MODULES[@]}"; do
              esc=${m//\//\\/}
              sed -i "/<module>${esc}<\/module>/d" pom.xml
            done

            for a in "${EXCLUDE_ARTIFACTS[@]}"; do
              sed -i "/<argument>-c<\/argument>/{N;/<argument>org\.apache\.druid\.extensions[^<]*:${a}<\/argument>/d}" distribution/pom.xml
            done
        - name: build druid
          privileged: true
          secrets:
            - id: maven_user
              env: MAVEN_USER
              optional: true
            - id: maven_password
              env: MAVEN_PASSWORD
              optional: true
          runs: |
            set -eux -o pipefail

            mvn install -B -ff -U --no-transfer-progress \
              -Pdist,bundle-contrib-exts \
              -Pskip-static-checks,skip-tests \
              -Dmaven.javadoc.skip=true \
              -T1C
        - name: extract distribution
          runs: |
            set -eux -o pipefail

            DIST_FILE=$(find distribution/target -name "apache-druid-36.0.0-bin.tar.gz" | head -1)
            if [ -z "$DIST_FILE" ]; then
              echo "Distribution tarball not found" >&2
              exit 1
            fi

            mkdir -p "${target.dir}/usr/share/druid"
            tar -xzf "$DIST_FILE" \
              --strip-components=1 \
              -C "${target.dir}/usr/share/druid"
        - name: remove unused extensions
          runs: |
            set -eux -o pipefail

            for ext in \
              druid-testing-tools \
              druid-cassandra-storage \
              aliyun-oss-extensions \
              druid-cloudfiles-extensions \
              druid-hdfs-storage \
              druid-kerberos; do
              rm -rf "${target.dir}/usr/share/druid/extensions/${ext}"

              find "${target.dir}/usr/share/druid/conf" \
                -type f -name common.runtime.properties \
                -exec sed -i \
                -e "s/\"${ext}\", *//g" \
                -e "s/, *\"${ext}\"//g" \
                -e "s/\"${ext}\"//g" \
                {} +
            done
        - name: remove legacy transitive jars
          runs: |
            set -eux -o pipefail

            find "${target.dir}/usr/share/druid" \
              \( -name 'netty-3*.jar' \
              -o -name 'derby-*.jar' \
              -o -name 'derbyclient-*.jar' \
              -o -name 'derbynet-*.jar' \
              -o -name 'derbytools-*.jar' \
              -o -name 'log4j-1.2.17.jar' \
              \) -delete

            home="${target.dir}/usr/share/druid"
            fixed_jar=snappy-java-1.1.10.9.jar
            snappy=$(find "$home" -name 'snappy-java-*.jar' -print | sort)
            printf '%s\n' "snappy-java jars before cleanup:" "$snappy"
            fixed_src=$(find "$home" -name "$fixed_jar" -print -quit)
            if [ -z "$fixed_src" ]; then
              echo "snappy-java 1.1.10.9 was not packaged" >&2
              exit 1
            fi
            if [ -d "$home/hadoop-dependencies" ]; then
              find "$home/hadoop-dependencies" -name 'snappy-java-*.jar' -print > /tmp/snappy-hadoop.list
              while IFS= read -r jar; do
                [ -n "$jar" ] || continue
                dir=$(dirname "$jar")
                if [ ! -f "$dir/$fixed_jar" ]; then
                  install -m 0644 "$fixed_src" "$dir/$fixed_jar"
                fi
              done < /tmp/snappy-hadoop.list
              rm -f /tmp/snappy-hadoop.list
            fi
            find "$home" -name 'snappy-java-*.jar' ! -name "$fixed_jar" -delete
            fixed=$(find "$home" -name "$fixed_jar" -print)
            if [ -z "$fixed" ]; then
              echo "snappy-java 1.1.10.9 was not packaged" >&2
              exit 1
            fi
            stale=$(find "$home" -name 'snappy-java-*.jar' ! -name "$fixed_jar" -print)
            if [ -n "$stale" ]; then
              echo "superseded snappy-java jars remain:" >&2
              printf '%s\n' "$stale" >&2
              exit 1
            fi
            if [ -d "$home/hadoop-dependencies/hadoop-client-api" ] || [ -d "$home/hadoop-dependencies/hadoop-client-runtime" ]; then
              missing=0
              for coord in hadoop-client-api hadoop-client-runtime; do
                coord_dir="$home/hadoop-dependencies/$coord"
                if [ ! -d "$coord_dir" ]; then
                  echo "missing isolated classpath $coord_dir" >&2
                  missing=1
                  continue
                fi
                found=0
                for dir in "$coord_dir"/*; do
                  if [ ! -d "$dir" ]; then
                    continue
                  fi
                  found=1
                  if [ ! -f "$dir/$fixed_jar" ]; then
                    echo "isolated classpath $dir is missing $fixed_jar" >&2
                    missing=1
                  fi
                done
                if [ "$found" -eq 0 ]; then
                  echo "isolated classpath $coord_dir has no version directory" >&2
                  missing=1
                fi
              done
              if [ "$missing" -ne 0 ]; then
                exit 1
              fi
            fi
            printf '%s\n' "snappy-java jars after cleanup:"
            find "$home" -name 'snappy-java-*.jar' -print | sort
        - name: replace aircompressor for CVE-2025-67721
          runs: |
            set -eux -o pipefail

            AIRCOMPRESSOR_VERSION="2.0.3"
            fixed_jar="aircompressor-${AIRCOMPRESSOR_VERSION}.jar"
            fixed_src="${source.dir}/patch/deps/${fixed_jar}"
            home="${target.dir}/usr/share/druid"

            test -f "$fixed_src"
            before=$(find "$home" -name 'aircompressor-*.jar' -print | sort)
            if [ -z "$before" ]; then
              echo "expected aircompressor jars in distribution extensions" >&2
              exit 1
            fi
            printf '%s\n' "aircompressor jars before cleanup:" "$before"
            find "$home" -name 'aircompressor-*.jar' -print | while IFS= read -r jar; do
              dir=$(dirname "$jar")
              install -m 0644 "$fixed_src" "$dir/$fixed_jar"
              if [ "$(basename "$jar")" != "$fixed_jar" ]; then
                rm -f "$jar"
              fi
            done
            stale=$(find "$home" -name 'aircompressor-*.jar' ! -name "$fixed_jar" -print)
            if [ -n "$stale" ]; then
              echo "superseded aircompressor jars remain:" >&2
              printf '%s\n' "$stale" >&2
              exit 1
            fi
            fixed=$(find "$home" -name "$fixed_jar" -print)
            if [ -z "$fixed" ]; then
              echo "aircompressor ${AIRCOMPRESSOR_VERSION} was not packaged" >&2
              exit 1
            fi
            printf '%s\n' "aircompressor jars after cleanup:"
            find "$home" -name 'aircompressor-*.jar' -print | sort
        - name: replace calcite-core for CVE-2026-46718
          privileged: true
          runs: |
            set -eux -o pipefail

            LIB="${target.dir}/usr/share/druid/lib"
            CALCITE_VERSION="1.42.0"
            CALCITE_SHA256="2ed5489201baab842001c95f939a0829849cf3cdaed9cdbf4b9078633c35792b"
            URL="https://repo1.maven.org/maven2/org/apache/calcite/calcite-core/${CALCITE_VERSION}/calcite-core-${CALCITE_VERSION}.jar"
            TMP="$(mktemp)"

            curl -fsSL "$URL" -o "$TMP"
            echo "${CALCITE_SHA256}  $TMP" | sha256sum -c -
            rm -f "${LIB}"/calcite-core-*.jar
            install -m 0644 "$TMP" "${LIB}/calcite-core-${CALCITE_VERSION}.jar"
            rm -f "$TMP"
        - name: install scripts
          runs: |
            set -eux -o pipefail

            mkdir -p "${target.dir}/usr/bin"
            install -m 0755 distribution/docker/druid.sh "${target.dir}/usr/bin/druid.sh"
            install -m 0755 distribution/docker/peon.sh "${target.dir}/usr/bin/peon.sh"
        - name: druid distribution sbom
          uses: sbom@v1
          with:
            extra-scanners: java-archive-cataloger
            prefix: pkg-druid-payload
            source: ${target.dir}/usr/share/druid
        - name: stage sbom documents
          runs: |
            set -eux -o pipefail

            mkdir -p "${target.dir}/opt/docker/sbom"
            cp -a "/opt/docker/sbom/pkg-druid-payload" "${target.dir}/opt/docker/sbom/"
        - uses: dhi/build-pkg:0
          with:
            depends:
              - bash
              - coreutils
            description: Apache Druid real-time analytics database
            files:
              - usr
            formats:
              - deb
            license: Apache-2.0
            name: druid-36
            rel: 31
            url: https://druid.apache.org/
            version: 36.0.0
        - name: fipsify
          runs: |
            set -eux -o pipefail

            BC_CLASSPATH="/usr/lib/bouncycastle/bc-fips-2.1.3.jar:\
            /usr/lib/bouncycastle/bctls-fips-2.1.25.jar:\
            /usr/lib/bouncycastle/bcutil-fips-2.1.8.jar:\
            /usr/lib/bouncycastle/bc-rng-jent-1.3.6.jar:\
            /usr/lib/bouncycastle/bcpkix-fips-2.1.13.jar"

            printf '%s\n' \
              "-Xbootclasspath/a:${BC_CLASSPATH}" \
              '--add-exports=java.base/sun.security.internal.spec=ALL-UNNAMED' \
              '--add-exports=java.base/sun.security.provider=ALL-UNNAMED' \
              '-Dorg.bouncycastle.fips.approved_only=true' \
              '-Djavax.net.ssl.trustStore=/usr/lib/bouncycastle/cacerts.bcfks' \
              '-Djavax.net.ssl.trustStoreType=BCFKS' \
              '-Djavax.net.ssl.trustStorePassword=changeit' \
              > "${target.dir}/usr/share/druid/conf/druid-fips.properties"
        - uses: dhi/build-pkg:0
          with:
            depends:
              - bash
              - coreutils
            description: Apache Druid real-time analytics database (FIPS)
            files:
              - usr
            formats:
              - deb
            license: Apache-2.0
            name: druid-36-fips
            rel: 31
            url: https://druid.apache.org/
            version: 36.0.0
      paths:
        - type: file
          path: ${source.dir}/patch/mvn-properties-36.0.json
          uid: 0
          gid: 0
          source: package/main/druid/patch/mvn-properties-36.0.json
        - type: file
          path: ${source.dir}/patch/mvn-deps-36.0.json
          uid: 0
          gid: 0
          source: package/main/druid/patch/mvn-deps-36.0.json
        - type: file
          path: ${source.dir}/patch/libthrift-0.24-compat.patch
          uid: 0
          gid: 0
          source: package/main/druid/patch/libthrift-0.24-compat.patch
        - type: file
          path: ${source.dir}/patch/mvn-properties-parquet-36.0.json
          uid: 0
          gid: 0
          source: package/main/druid/patch/mvn-properties-parquet-36.0.json
        - type: file
          path: ${source.dir}/patch/mvn-properties-druid-pac4j.json
          uid: 0
          gid: 0
          source: package/main/druid/patch/mvn-properties-druid-pac4j.json
        - type: file
          path: ${source.dir}/patch/mvn-properties-opentelemetry-emitter.json
          uid: 0
          gid: 0
          source: package/main/druid/patch/mvn-properties-opentelemetry-emitter.json
        - type: file
          path: ${source.dir}/patch/vertx-core-36.0.patch
          uid: 0
          gid: 0
          source: package/main/druid/patch/vertx-core-36.0.patch
os-release:
  name: Docker Hardened Images (Debian)
  id: debian
  version-id: "13"
  version-codename: trixie
  pretty-name: Docker Hardened Images/Debian GNU/Linux 13 (trixie)
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
