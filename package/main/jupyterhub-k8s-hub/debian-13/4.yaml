# syntax=dhi.io/build:2-debian13

image: dhi.io/pkg-jupyterhub-k8s-hub
variant: runtime
tags:
  - 4.4.1
  - 4.4.1-r0
  - 4.4.1-debian13
  - 4.4.1-r0-debian13
platforms:
  - linux/amd64
  - linux/arm64
dates:
  release: "2024-11-07"
vars:
  COMMIT_SHA: d7c085dc7ff3c35be652286cc19c7564c5f49aa7
  JUPYTERHUB_VERSION: 5.5.1
  PYTHON_MINOR: "3.14"
  PYTHON_VERSION: 3.14.7-0
  REL: "0"
  SEMVER_MAJOR_MINOR_VERSION: "4.4"
  SEMVER_MAJOR_VERSION: "4"
  SEMVER_VERSION: 4.4.1
  VERSION: 4.4.1
contents:
  packages:
    - base-files
  builds:
    - name: jupyterhub-k8s-hub
      work-dir: ${source.dir}/zero-to-jupyterhub-k8s/images/hub
      environment:
        PATH: /usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
      caches:
        - path: /root/.cache/pip
      contents:
        repositories:
          - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
        keyring:
          - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
        packages:
          - bash
          - build-essential
          - ca-certificates
          - coreutils
          - findutils
          - git
          - grep
          - libcurl4-openssl-dev
          - libffi-dev
          - libpq-dev
          - libssl-dev
          - python3-pip
          - python3-setuptools
          - python3-venv
          - python3-wheel
          - zlib1g-dev
          - libpython-3.14=3.14.7-0
          - libpython-3.14-dev=3.14.7-0
          - libpython-3.14-minimal=3.14.7-0
          - libpython-3.14-stdlib=3.14.7-0
          - python-3.14-minimal=3.14.7-0
          - python-3.14=3.14.7-0
          - python-3.14-dev=3.14.7-0
          - sed
        files:
          - url: git+https://github.com/jupyterhub/zero-to-jupyterhub-k8s.git#4.4.1
            checksum: d7c085dc7ff3c35be652286cc19c7564c5f49aa7
            path: ${source.dir}/zero-to-jupyterhub-k8s
            spdx:
              name: zero-to-jupyterhub-k8s
              version: 4.4.1
              packages:
                - name: zero-to-jupyterhub-k8s
                  purl: pkg:github/jupyterhub/zero-to-jupyterhub-k8s@4.4.1
                  license: BSD-3-Clause
            uid: 0
            gid: 0
      pipeline:
        - name: build venv at final path and stage it
          privileged: true
          runs: |
            set -eux -o pipefail

            export SOURCE_DIR="${source.dir}" TARGET_DIR="${target.dir}" PYTHON_BIN=/usr/bin/python3.14
            bash "${source.dir}/build-venv.sh"
        - name: python dependencies sbom
          uses: sbom@v1
          with:
            extra-scanners: python-package-cataloger
            prefix: jupyterhub-k8s-hub-python
            source: ${target.dir}/usr/lib/jupyterhub-k8s-hub
        - uses: dhi/build-pkg:0
          with:
            depends:
              - python-3.14
              - libffi8
              - libcurl4t64
              - libpq5
            description: JupyterHub hub image for Zero to JupyterHub on Kubernetes
            files:
              - usr/lib/jupyterhub-k8s-hub
              - usr/bin/jupyterhub
            formats:
              - deb
            license: BSD-3-Clause
            name: jupyterhub-k8s-hub
            rel: 0
            url: https://github.com/jupyterhub/zero-to-jupyterhub-k8s
            version: 4.4.1
      paths:
        - type: file
          path: ${source.dir}/build-venv.sh
          uid: 0
          gid: 0
          mode: "0755"
          source: package/main/jupyterhub-k8s-hub/build-venv.sh
os-release:
  name: Docker Hardened Images (Debian)
  id: debian
  version-id: "13"
  version-codename: trixie
  pretty-name: Docker Hardened Images/Debian GNU/Linux 13 (trixie)
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
