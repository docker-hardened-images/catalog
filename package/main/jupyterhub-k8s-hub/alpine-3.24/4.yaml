# syntax=dhi.io/build:2-alpine3.24

image: dhi.io/pkg-jupyterhub-k8s-hub
variant: runtime
tags:
  - 4.4.2-alpine3.24
  - 4.4.2-r0-alpine3.24
platforms:
  - linux/amd64
  - linux/arm64
dates:
  release: "2024-11-07"
vars:
  COMMIT_SHA: ec77affd8cf847ad95b2bbcdb57aa17fb5c23c8b
  JUPYTERHUB_VERSION: 5.5.2
  PYTHON_VERSION: 3.14.7-r1
  REL: "0"
  SEMVER_MAJOR_MINOR_VERSION: "4.4"
  SEMVER_MAJOR_VERSION: "4"
  SEMVER_VERSION: 4.4.2
  VERSION: 4.4.2
contents:
  repositories:
    - https://dhi.io/apk/alpine/v3.24/main
    - https://dhi.io/apk/alpine/v3.23/main
    - https://dl-cdn.alpinelinux.org/alpine/v3.24/main
    - https://dl-cdn.alpinelinux.org/alpine/v3.24/community
  keyring:
    - https://dhi.io/keyring/dhi-apk@docker-0F81AD7700D99184.rsa.pub
  packages:
    - alpine-baselayout-data
  builds:
    - name: jupyterhub-k8s-hub
      work-dir: ${source.dir}/zero-to-jupyterhub-k8s/images/hub
      environment:
        PATH: /usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
      caches:
        - path: /root/.cache/pip
      contents:
        packages:
          - bash
          - build-base
          - ca-certificates-bundle
          - coreutils
          - curl-dev
          - findutils
          - git
          - grep
          - libffi-dev
          - openssl-dev
          - postgresql-dev
          - py3-pip
          - py3-setuptools
          - py3-virtualenv
          - py3-wheel
          - python-3.14=3.14.7-r1
          - python-3.14-dev=3.14.7-r1
          - sed
          - zlib-dev
        files:
          - url: git+https://github.com/jupyterhub/zero-to-jupyterhub-k8s.git#4.4.2
            checksum: ec77affd8cf847ad95b2bbcdb57aa17fb5c23c8b
            path: ${source.dir}/zero-to-jupyterhub-k8s
            spdx:
              name: zero-to-jupyterhub-k8s
              version: 4.4.2
              packages:
                - name: zero-to-jupyterhub-k8s
                  purl: pkg:github/jupyterhub/zero-to-jupyterhub-k8s@4.4.2
                  license: BSD-3-Clause
            uid: 0
            gid: 0
      pipeline:
        - name: build venv at final path and stage it
          privileged: true
          runs: |
            set -eux -o pipefail

            export SOURCE_DIR="${source.dir}" TARGET_DIR="${target.dir}" PYTHON_BIN=/usr/bin/python3.14
            bash "${source.dir}/build-venv.sh"
        - name: python dependencies sbom
          uses: sbom@v1
          with:
            extra-scanners: python-package-cataloger
            prefix: jupyterhub-k8s-hub-python
            source: ${target.dir}/usr/lib/jupyterhub-k8s-hub
        - uses: dhi/build-pkg:0
          with:
            depends:
              - python-3.14
              - libffi
              - curl
              - postgresql-libs
            description: JupyterHub hub image for Zero to JupyterHub on Kubernetes
            files:
              - usr/lib/jupyterhub-k8s-hub
              - usr/bin/jupyterhub
            formats:
              - apk
            license: BSD-3-Clause
            name: jupyterhub-k8s-hub
            rel: 0
            url: https://github.com/jupyterhub/zero-to-jupyterhub-k8s
            version: 4.4.2
      paths:
        - type: file
          path: ${source.dir}/build-venv.sh
          uid: 0
          gid: 0
          mode: "0755"
          source: package/main/jupyterhub-k8s-hub/build-venv.sh
os-release:
  name: Docker Hardened Images (Alpine)
  id: alpine
  version-id: "3.24"
  pretty-name: Docker Hardened Images/Alpine Linux v3.24
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
