            ldflags:
              - -X github.com/aws-controllers-k8s/sns-controller/pkg/version.GitVersion=1.13.0
              - -X github.com/aws-controllers-k8s/sns-controller/pkg/version.GitCommit=a1f0e5b19582a199ae3e6fbb071ced23b40d9655
              - -X github.com/aws-controllers-k8s/sns-controller/pkg/version.BuildDate=$(date -ud @${SOURCE_DATE_EPOCH} +'%Y-%m-%dT%H:%M')
            output: ${target.dir}/usr/bin/ack-sns-controller
            packages: ./cmd/controller
        - name: build dev
          uses: go/build@v1
          with:
            fips: false
            ldflags:
              - -X github.com/aws-controllers-k8s/sns-controller/pkg/version.GitVersion=1.13.0
              - -X github.com/aws-controllers-k8s/sns-controller/pkg/version.GitCommit=a1f0e5b19582a199ae3e6fbb071ced23b40d9655
              - -X github.com/aws-controllers-k8s/sns-controller/pkg/version.BuildDate=$(date -ud @${SOURCE_DATE_EPOCH} +'%Y-%m-%dT%H:%M')
            output: ${target.dir}/usr/bin/ack-sns-controller-dev
            packages: ./cmd/controller
            strip: false
        - name: verify build info
          runs: |
            set -eux -o pipefail

            runtime=${target.dir}/usr/bin/ack-sns-controller
            devbin=${target.dir}/usr/bin/ack-sns-controller-dev
            for bin in "$runtime" "$devbin"; do
              test -x "$bin"
              go version -m "$bin" > /tmp/buildinfo.txt
              grep -qxF "$(printf '\tbuild\tCGO_ENABLED=0')" /tmp/buildinfo.txt
              grep -qF "pkg/version.GitVersion=1.13.0" /tmp/buildinfo.txt
              grep -qF "pkg/version.GitCommit=a1f0e5b19582a199ae3e6fbb071ced23b40d9655" /tmp/buildinfo.txt
              if grep -qF "pkg/version.GitVersion=v" /tmp/buildinfo.txt; then
                echo "$bin: GitVersion must not carry a v prefix" >&2
                exit 1
              fi
              if [ "false" = "true" ]; then
                grep -qE '^[[:space:]]+build[[:space:]]+GOFIPS140=' /tmp/buildinfo.txt
              elif grep -q 'GOFIPS140' /tmp/buildinfo.txt; then
                echo "$bin: FIPS build settings on a non-FIPS build" >&2
                exit 1
              fi
            done
            go version -m "$runtime" | grep -qxF "$(printf '\tbuild\t-trimpath=true')"
            if go version -m "$devbin" | grep -E -- '-trimpath=true|-w( |"|$)'; then
              echo "$devbin: dev binary must keep symbols and paths" >&2
              exit 1
            fi
        - name: stage sbom and license
          runs: |
            set -eux -o pipefail

            src=/go/src/github.com/aws-controllers-k8s/sns-controller
            test -s /opt/docker/sbom/sns-controller/.spdx.sns-controller.json
            grep -q 'Apache License' "$src/LICENSE"
            grep -q 'Version 2.0' "$src/LICENSE"
            grep -q 'Copyright 2019 Amazon.com' "$src/NOTICE"
            test -s "$src/ATTRIBUTION.md"
            install -d "${target.dir}/opt/docker/sbom" "${target.dir}/opt/docker/sbom-dev"
            cp -a /opt/docker/sbom/sns-controller "${target.dir}/opt/docker/sbom/"
            cp -a /opt/docker/sbom/sns-controller "${target.dir}/opt/docker/sbom-dev/"
            for f in LICENSE NOTICE ATTRIBUTION.md; do
              install -D -m 0644 "$src/$f" "${target.dir}/usr/share/licenses/aws-controllers-k8s-sns-controller/$f"
              install -D -m 0644 "$src/$f" "${target.dir}/usr/share/licenses/aws-controllers-k8s-sns-controller-dev/$f"
