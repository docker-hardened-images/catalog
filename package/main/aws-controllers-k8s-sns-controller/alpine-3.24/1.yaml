                  - path: opt/docker/sbom/sns-controller
                    source: opt/docker/sbom-dev/sns-controller
                  - path: usr/share/licenses/aws-controllers-k8s-sns-controller/LICENSE
                    source: usr/share/licenses/aws-controllers-k8s-sns-controller-dev/LICENSE
                  - path: usr/share/licenses/aws-controllers-k8s-sns-controller/NOTICE
                    source: usr/share/licenses/aws-controllers-k8s-sns-controller-dev/NOTICE
                  - path: usr/share/licenses/aws-controllers-k8s-sns-controller/ATTRIBUTION.md
