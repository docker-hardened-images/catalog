            download: true
        - uses: go/hermetic@v1
        - name: test
          environment:
            CGO_ENABLED: "0"
            GODEBUG: ""
          runs: |
            set -eux -o pipefail

            go test -count=1 ./...
        - name: build
          uses: go/build@v1
          with:
