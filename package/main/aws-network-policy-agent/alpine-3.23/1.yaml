# syntax=dhi.io/build:2-alpine3.23

image: dhi.io/pkg-aws-network-policy-agent
variant: runtime
tags:
  - 1.5.0-alpine3.23
  - 1.5.0-r0-alpine3.23
platforms:
  - linux/amd64
  - linux/arm64
dates:
  release: "2025-12-19"
vars:
  CLANG_VERSION: 22.1.8-r1
  COMMIT_SHA: e497e298e72ccb2ab3dc6542f31c0827235da3fb
  GOLANG_MAJOR_MINOR_VERSION: "1.27"
  GOLANG_VERSION: 1.27.4-r0
  REL: "0"
  SEMVER_MAJOR_MINOR_VERSION: "1.5"
  SEMVER_MAJOR_VERSION: "1"
  SEMVER_VERSION: 1.5.0
  VERSION: 1.5.0
contents:
  repositories:
    - https://dhi.io/apk/alpine/v3.23/main
    - https://dl-cdn.alpinelinux.org/alpine/v3.23/main
    - https://dl-cdn.alpinelinux.org/alpine/v3.23/community
  keyring:
    - https://dhi.io/keyring/dhi-apk@docker-0F81AD7700D99184.rsa.pub
  packages:
    - alpine-baselayout-data
  builds:
    - name: aws-network-policy-agent
      work-dir: /go/src/github.com/aws/aws-network-policy-agent
      contents:
        packages:
          - busybox
          - bash
          - ca-certificates-bundle
          - bpftool
          - clang22=22.1.8-r1
          - clang22-headers=22.1.8-r1
          - clang22-libs=22.1.8-r1
          - libbpf-dev
          - llvm
          - coreutils
          - findutils
          - mawk
          - sed
          - golang-1.27=1.27.4-r0
          - golang-1.27-oci-config=1.27.4-r0
        files:
          - url: git+https://github.com/aws/aws-network-policy-agent.git#v1.5.0
            checksum: e497e298e72ccb2ab3dc6542f31c0827235da3fb
            path: /go/src/github.com/aws/aws-network-policy-agent
            spdx:
              name: aws-network-policy-agent
              version: 1.5.0
              packages:
                - name: aws-network-policy-agent
                  purl: pkg:golang/github.com/aws/aws-network-policy-agent@1.5.0
                  license: Apache-2.0
            uid: 0
            gid: 0
      pipeline:
        - name: update go dependencies
          uses: go/bump@v1
          work-dir: /go/src/github.com/aws/aws-network-policy-agent
          with:
            deps:
              - golang.org/x/net@v0.62.0
            download: true
        - name: run go tests
          runs: |
            set -eux -o pipefail

            go test $(go list ./... | grep -v 'test/integration')
        - name: generate vmlinux.h
          privileged: true
          runs: |
            set -eux -o pipefail

            if [ -r /sys/kernel/btf/vmlinux ]; then
              bpftool btf dump file /sys/kernel/btf/vmlinux format c > pkg/ebpf/c/vmlinux.h
              exit 0
            fi

            case "$(uname -m)" in
              x86_64) BTF_ARCHIVE="${source.dir}/vmlinux-amd64.btf.tar.xz" ;;
              aarch64) BTF_ARCHIVE="${source.dir}/vmlinux-arm64.btf.tar.xz" ;;
              *)
                echo "unsupported architecture for ebpf build: $(uname -m)" >&2
                exit 1
                ;;
            esac

            tar -xJf "$BTF_ARCHIVE" -C /tmp
            BTF_FILE="$(find /tmp -maxdepth 1 -name '*.btf' -print -quit)"
            bpftool btf dump file "$BTF_FILE" format c > pkg/ebpf/c/vmlinux.h
        - name: build BPF programs
          runs: |
            set -eux -o pipefail

            ARCH=$(uname -m | sed 's/x86_64/amd64/g; s/aarch64/arm64/g')
            EBPF_DIR=./pkg/ebpf/c
            CLANG_INCLUDE="-I../../."
            CLANG_FLAGS="${CLANG_INCLUDE} -g -O2 -Wall -fpie -target bpf -DCORE -D__BPF_TRACING__"

            clang-22 ${CLANG_FLAGS} -D__TARGET_ARCH_x86 -c ${EBPF_DIR}/v4events.bpf.c -o ${EBPF_DIR}/v4events.bpf.o
            clang-22 ${CLANG_FLAGS} -D__TARGET_ARCH_x86 -c ${EBPF_DIR}/v6events.bpf.c -o ${EBPF_DIR}/v6events.bpf.o

            clang-22 ${CLANG_FLAGS} -D__TARGET_ARCH_${ARCH} -c ${EBPF_DIR}/tc.v4ingress.bpf.c -o ${EBPF_DIR}/tc.v4ingress.bpf.o
            clang-22 ${CLANG_FLAGS} -D__TARGET_ARCH_${ARCH} -c ${EBPF_DIR}/tc.v4egress.bpf.c -o ${EBPF_DIR}/tc.v4egress.bpf.o
            clang-22 ${CLANG_FLAGS} -D__TARGET_ARCH_${ARCH} -c ${EBPF_DIR}/tc.v6ingress.bpf.c -o ${EBPF_DIR}/tc.v6ingress.bpf.o
            clang-22 ${CLANG_FLAGS} -D__TARGET_ARCH_${ARCH} -c ${EBPF_DIR}/tc.v6egress.bpf.c -o ${EBPF_DIR}/tc.v6egress.bpf.o
        - name: stage ebpf object files for packaging
          runs: |
            set -eux -o pipefail

            EBPF_DIR=./pkg/ebpf/c
            STAGE_DIR="${target.dir}/usr/lib/aws-network-policy-agent"
            for obj in tc.v4ingress.bpf.o tc.v4egress.bpf.o tc.v6ingress.bpf.o tc.v6egress.bpf.o v4events.bpf.o v6events.bpf.o; do
              install -Dm644 "${EBPF_DIR}/${obj}" "${STAGE_DIR}/${obj}"
            done
        - name: build aws-network-policy-agent
          uses: go/build@v1
          work-dir: /go/src/github.com/aws/aws-network-policy-agent
          with:
            fips: false
            output: ${target.dir}/usr/bin/aws-network-policy-agent
            packages: .
        - name: build aws-network-policy-agent dev
          uses: go/build@v1
          work-dir: /go/src/github.com/aws/aws-network-policy-agent
          with:
            fips: false
            output: ${target.dir}/usr/bin/aws-network-policy-agent-dev
            packages: .
            strip: false
        - name: build cliv6
          uses: go/build@v1
          work-dir: /go/src/github.com/aws/aws-network-policy-agent
          with:
            fips: false
            output: ${target.dir}/usr/bin/cliv6
            packages: ./cmd/cliv6
        - name: build cliv6 dev
          uses: go/build@v1
          work-dir: /go/src/github.com/aws/aws-network-policy-agent
          with:
            fips: false
            output: ${target.dir}/usr/bin/cliv6-dev
            packages: ./cmd/cliv6
            strip: false
        - name: build cli
          uses: go/build@v1
          work-dir: /go/src/github.com/aws/aws-network-policy-agent
          with:
            fips: false
            output: ${target.dir}/usr/bin/cli
            packages: ./cmd/cli
        - name: build cli dev
          uses: go/build@v1
          work-dir: /go/src/github.com/aws/aws-network-policy-agent
          with:
            fips: false
            output: ${target.dir}/usr/bin/cli-dev
            packages: ./cmd/cli
            strip: false
        - name: copy ebpf objects for the dev package
          runs: |
            set -eux -o pipefail

            SRC="${target.dir}/usr/lib/aws-network-policy-agent"
            DST="${target.dir}/usr/lib/aws-network-policy-agent-dev-bpf"
            for obj in tc.v4ingress.bpf.o tc.v4egress.bpf.o tc.v6ingress.bpf.o tc.v6egress.bpf.o v4events.bpf.o v6events.bpf.o; do
              install -Dm644 "${SRC}/${obj}" "${DST}/${obj}"
            done
        - uses: dhi/build-pkg:0
          with:
            description: Aws-network-policy-agent binaries
            files:
              - usr/bin/aws-network-policy-agent
              - usr/lib/aws-network-policy-agent/tc.v4ingress.bpf.o
              - usr/lib/aws-network-policy-agent/tc.v4egress.bpf.o
              - usr/lib/aws-network-policy-agent/tc.v6ingress.bpf.o
              - usr/lib/aws-network-policy-agent/tc.v6egress.bpf.o
              - usr/lib/aws-network-policy-agent/v4events.bpf.o
              - usr/lib/aws-network-policy-agent/v6events.bpf.o
            license: Apache-2.0
            name: aws-network-policy-agent
            rel: 0
            subpackages:
              - files:
                  - path: usr/bin/cliv6
                name: aws-network-policy-agent-cliv6
              - files:
                  - path: usr/bin/cli
                name: aws-network-policy-agent-cli
              - files:
                  - path: usr/bin/aws-network-policy-agent
                    source: usr/bin/aws-network-policy-agent-dev
                  - path: usr/lib/aws-network-policy-agent/tc.v4ingress.bpf.o
                    source: usr/lib/aws-network-policy-agent-dev-bpf/tc.v4ingress.bpf.o
                  - path: usr/lib/aws-network-policy-agent/tc.v4egress.bpf.o
                    source: usr/lib/aws-network-policy-agent-dev-bpf/tc.v4egress.bpf.o
                  - path: usr/lib/aws-network-policy-agent/tc.v6ingress.bpf.o
                    source: usr/lib/aws-network-policy-agent-dev-bpf/tc.v6ingress.bpf.o
                  - path: usr/lib/aws-network-policy-agent/tc.v6egress.bpf.o
                    source: usr/lib/aws-network-policy-agent-dev-bpf/tc.v6egress.bpf.o
                  - path: usr/lib/aws-network-policy-agent/v4events.bpf.o
                    source: usr/lib/aws-network-policy-agent-dev-bpf/v4events.bpf.o
                  - path: usr/lib/aws-network-policy-agent/v6events.bpf.o
                    source: usr/lib/aws-network-policy-agent-dev-bpf/v6events.bpf.o
                name: aws-network-policy-agent-dev
              - files:
                  - path: usr/bin/cliv6
                    source: usr/bin/cliv6-dev
                name: aws-network-policy-agent-cliv6-dev
              - files:
                  - path: usr/bin/cli
                    source: usr/bin/cli-dev
                name: aws-network-policy-agent-cli-dev
            url: https://github.com/aws/aws-network-policy-agent
            version: 1.5.0
      paths:
        - type: file
          path: ${source.dir}/vmlinux-amd64.btf.tar.xz
          uid: 0
          gid: 0
          source: package/main/aws-network-policy-agent/bpf/vmlinux-amd64.btf.tar.xz
        - type: file
          path: ${source.dir}/vmlinux-arm64.btf.tar.xz
          uid: 0
          gid: 0
          source: package/main/aws-network-policy-agent/bpf/vmlinux-arm64.btf.tar.xz
os-release:
  name: Docker Hardened Images (Alpine)
  id: alpine
  version-id: "3.23"
  pretty-name: Docker Hardened Images/Alpine Linux v3.23
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
