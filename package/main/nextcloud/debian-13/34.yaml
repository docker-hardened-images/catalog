# syntax=dhi.io/build:2-debian13

image: dhi.io/pkg-nextcloud
variant: runtime
tags:
  - 34.0.4
  - 34.0.4-r0
  - 34.0.4-debian13
  - 34.0.4-r0-debian13
platforms:
  - linux/amd64
  - linux/arm64
dates:
  release: "2026-08-13"
vars:
  PACKAGE_NAME: nextcloud-34
  PHP_MAJOR_MINOR: "8.5"
  REL: "0"
  SEMVER_MAJOR_MINOR_VERSION: "34.0"
  SEMVER_MAJOR_VERSION: "34"
  SEMVER_VERSION: 34.0.4
  VERSION: 34.0.4
contents:
  repositories:
    - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
  keyring:
    - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
  packages:
    - base-files
  builds:
    - name: nextcloud
      work-dir: ${source.dir}
      shell: bash
      contents:
        packages:
          - bash
          - bzip2
          - ca-certificates
          - coreutils
          - findutils
          - tar
        files:
          - url: https://github.com/nextcloud-releases/server/releases/download/v34.0.4/nextcloud-34.0.4.tar.bz2
            path: ${source.dir}/nextcloud.tar.bz2
            spdx:
              name: nextcloud
              version: 34.0.4
              packages:
                - name: nextcloud
                  purl: pkg:github/nextcloud/server@34.0.4
                  license: AGPL-3.0-or-later
            uid: 0
            gid: 0
          - url: https://github.com/nextcloud-releases/server/releases/download/v34.0.4/nextcloud-34.0.4.tar.bz2.asc
            path: ${source.dir}/nextcloud.tar.bz2.asc
            uid: 0
            gid: 0
      pipeline:
        - name: verify nextcloud-34.0.4.tar.bz2
          uses: gpg/verify@v1
          with:
            file: ${source.dir}/nextcloud.tar.bz2
            keys: ${source.dir}/keys.asc
            signature: ${source.dir}/nextcloud.tar.bz2.asc
        - name: stage payload
          runs: |
            set -eux -o pipefail

            install -d "${target.dir}/usr/share/nextcloud"
            tar -xjf "${source.dir}/nextcloud.tar.bz2" \
              -C "${target.dir}/usr/share/nextcloud" --strip-components=1

            rm -rf "${target.dir}/usr/share/nextcloud/updater"

            find "${target.dir}/usr/share/nextcloud" \
              -type d \( -name .github -o -name node_modules \) -prune -exec rm -rf {} +

            find "${target.dir}/usr/share/nextcloud" \
              \( -name package.json -o -name package-lock.json \) -delete

            chmod 0755 "${target.dir}/usr/share/nextcloud/occ"

            test -z "$(find "${target.dir}/usr/share/nextcloud" -type d -name node_modules)"
            test -z "$(find "${target.dir}/usr/share/nextcloud" -type d -name .github)"

            test -s "${target.dir}/usr/share/nextcloud/version.php"
            test -x "${target.dir}/usr/share/nextcloud/occ"
            test -f "${target.dir}/usr/share/nextcloud/lib/composer/autoload.php"
            test -d "${target.dir}/usr/share/nextcloud/3rdparty"
            test -d "${target.dir}/usr/share/nextcloud/dist"
        - uses: dhi/build-pkg:0
          with:
            depends:
              - php-8.5
              - php-8.5-fpm
            description: Nextcloud server, a self-hosted file sync, share, and collaboration platform
            files:
              - usr/share/nextcloud
            license: AGPL-3.0-or-later
            name: nextcloud-34
            rel: 0
            url: https://nextcloud.com/
            version: 34.0.4
      paths:
        - type: file
          path: ${source.dir}/keys.asc
          uid: 0
          gid: 0
          source: package/main/nextcloud/debian-13/key/nextcloud.asc
os-release:
  name: Docker Hardened Images (Debian)
  id: debian
  version-id: "13"
  version-codename: trixie
  pretty-name: Docker Hardened Images/Debian GNU/Linux 13 (trixie)
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
