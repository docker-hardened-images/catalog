# syntax=dhi.io/build:2-debian13

image: dhi.io/pkg-nextcloud
variant: runtime
tags:
  - 35.0.2
  - 35.0.2-r3
  - 35.0.2-debian13
  - 35.0.2-r3-debian13
platforms:
  - linux/amd64
  - linux/arm64
dates:
  release: "2026-09-15"
vars:
  COMPOSER_PHAR_SHA256: 6f1b891e1d4927d62740276c540fb490e47689e19e102c49e8da849794882f8c
  COMPOSER_VERSION: 2.11.1
  PACKAGE_NAME: nextcloud-35
  PHP_MAJOR_MINOR: "8.5"
  PHP_VERSION: 8.5.12-0
  REL: "3"
  SEMVER_MAJOR_MINOR_VERSION: "35.0"
  SEMVER_MAJOR_VERSION: "35"
  SEMVER_VERSION: 35.0.2
  SYMFONY_HTTP_FOUNDATION_VERSION: 7.4.19
  VERSION: 35.0.2
contents:
  repositories:
    - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
  keyring:
    - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
  packages:
    - base-files
  builds:
    - name: nextcloud
      work-dir: ${source.dir}
      shell: bash
      contents:
        repositories:
          - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
        keyring:
          - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
        packages:
          - bash
          - bzip2
          - ca-certificates
          - coreutils
          - findutils
          - git
          - tar
          - unzip
          - php-8.5=8.5.12-0
          - libargon2-1
          - libcurl4t64
          - libicu76
          - libonig5
          - libpcre2-8-0
          - libreadline8t64
          - libsodium23
          - libsqlite3-0
          - libssl3t64
          - libxml2
          - zlib1g
        files:
          - url: https://getcomposer.org/download/2.11.1/composer.phar
            checksum: sha256:6f1b891e1d4927d62740276c540fb490e47689e19e102c49e8da849794882f8c
            path: ${source.dir}/composer.phar
            uid: 0
            gid: 0
          - url: https://github.com/nextcloud-releases/server/releases/download/v35.0.2/nextcloud-35.0.2.tar.bz2
            path: ${source.dir}/nextcloud.tar.bz2
            spdx:
              name: nextcloud
              version: 35.0.2
              packages:
                - name: nextcloud
                  purl: pkg:github/nextcloud/server@35.0.2
                  license: AGPL-3.0-or-later
            uid: 0
            gid: 0
          - url: https://github.com/nextcloud-releases/server/releases/download/v35.0.2/nextcloud-35.0.2.tar.bz2.asc
            path: ${source.dir}/nextcloud.tar.bz2.asc
            uid: 0
            gid: 0
      pipeline:
        - name: verify nextcloud-35.0.2.tar.bz2
          uses: gpg/verify@v1
          with:
            file: ${source.dir}/nextcloud.tar.bz2
            keys: ${source.dir}/keys.asc
            signature: ${source.dir}/nextcloud.tar.bz2.asc
        - name: stage payload
          runs: |
            set -eux -o pipefail

            install -d "${target.dir}/usr/share/nextcloud"
            tar -xjf "${source.dir}/nextcloud.tar.bz2" \
              -C "${target.dir}/usr/share/nextcloud" --strip-components=1

            rm -rf "${target.dir}/usr/share/nextcloud/updater"

            find "${target.dir}/usr/share/nextcloud" \
              -type d \( -name .github -o -name node_modules \) -prune -exec rm -rf {} +

            find "${target.dir}/usr/share/nextcloud" \
              \( -name package.json -o -name package-lock.json \) -delete

            chmod 0755 "${target.dir}/usr/share/nextcloud/occ"

            test -z "$(find "${target.dir}/usr/share/nextcloud" -type d -name node_modules)"
            test -z "$(find "${target.dir}/usr/share/nextcloud" -type d -name .github)"

            test -s "${target.dir}/usr/share/nextcloud/version.php"
            test -x "${target.dir}/usr/share/nextcloud/occ"
            test -f "${target.dir}/usr/share/nextcloud/lib/composer/autoload.php"
            test -d "${target.dir}/usr/share/nextcloud/3rdparty"
            test -d "${target.dir}/usr/share/nextcloud/dist"
        - name: bump 3rdparty composer dependencies for CVE fixes
          work-dir: ${target.dir}/usr/share/nextcloud/3rdparty
          privileged: true
          environment:
            COMPOSER_ALLOW_SUPERUSER: "1"
            SYMFONY_HTTP_FOUNDATION_VERSION: 7.4.19
          runs: |
            set -eux -o pipefail

            export COMPOSER_HOME="$(mktemp -d)"
            export SYMFONY_HTTP_FOUNDATION_VERSION
            test -f composer.json
            test -f composer.lock

            php "${source.dir}/composer.phar" require --no-update --no-interaction --no-ansi --no-progress \
              "symfony/http-foundation:7.4.19"

            php "${source.dir}/composer.phar" update symfony/http-foundation \
              --with-all-dependencies \
              --no-dev --prefer-dist --no-scripts --no-interaction --no-ansi --no-progress

            php -r '
            $lock = json_decode(file_get_contents("composer.lock"), true);
            $want = getenv("SYMFONY_HTTP_FOUNDATION_VERSION");
            $got = null;
            foreach ($lock["packages"] as $package) {
              if ($package["name"] === "symfony/http-foundation") {
                $got = ltrim($package["version"], "v");
                break;
              }
            }
            if ($got !== $want) {
              fwrite(STDERR, "dependency symfony/http-foundation is ".($got ?? "missing").", need $want\n");
              exit(1);
            }
            '
        - uses: dhi/build-pkg:0
          with:
            depends:
              - php-8.5
              - php-8.5-fpm
            description: Nextcloud server, a self-hosted file sync, share, and collaboration platform
            files:
              - usr/share/nextcloud
            license: AGPL-3.0-or-later
            name: nextcloud-35
            rel: 3
            url: https://nextcloud.com/
            version: 35.0.2
      paths:
        - type: file
          path: ${source.dir}/keys.asc
          uid: 0
          gid: 0
          source: package/main/nextcloud/debian-13/key/nextcloud.asc
os-release:
  name: Docker Hardened Images (Debian)
  id: debian
  version-id: "13"
  version-codename: trixie
  pretty-name: Docker Hardened Images/Debian GNU/Linux 13 (trixie)
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
