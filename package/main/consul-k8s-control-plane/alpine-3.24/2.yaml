              if grep -E -- '-trimpath=true|-w( |"|$)' /tmp/buildinfo.txt; then
                echo "$devbin: dev binary must keep symbols and paths" >&2
                exit 1
              fi
              cmp "/tmp/deps-$name" "/tmp/deps-$name-dev"
