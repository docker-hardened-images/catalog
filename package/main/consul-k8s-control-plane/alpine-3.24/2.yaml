            install -m 0644 /go/src/github.com/hashicorp/go-discover/LICENSE ${target.dir}/usr/share/licenses/consul-k8s-control-plane/go-discover-LICENSE
            install -d ${target.dir}/opt/docker/sbom ${target.dir}/dev/opt/docker/sbom ${target.dir}/dev/usr/share/licenses
            cp -a /opt/docker/sbom/consul-k8s-control-plane /opt/docker/sbom/go-discover ${target.dir}/opt/docker/sbom/
            cp -a /opt/docker/sbom/consul-k8s-control-plane /opt/docker/sbom/go-discover ${target.dir}/dev/opt/docker/sbom/
            cp -a ${target.dir}/usr/share/licenses/consul-k8s-control-plane ${target.dir}/dev/usr/share/licenses/
        - uses: dhi/build-pkg:0
          with:
            depends:
              - ca-certificates-bundle
