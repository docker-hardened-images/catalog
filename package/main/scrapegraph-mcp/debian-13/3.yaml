# syntax=dhi.io/build:2-debian13

image: dhi.io/pkg-scrapegraph-mcp
variant: runtime
tags:
  - 3.0.0
  - 3.0.0-r1
  - 3.0.0-debian13
  - 3.0.0-r1-debian13
platforms:
  - linux/amd64
  - linux/arm64
dates:
  release: "2026-06-24"
vars:
  COMMIT_SHA: 21435183b85264804157c0cdfaefc309160f0737
  PYTHON_MINOR: "3.14"
  PYTHON_VERSION: 3.14.7-1
  REL: "1"
  SEMVER_MAJOR_MINOR_VERSION: "3.0"
  SEMVER_MAJOR_VERSION: "3"
  SEMVER_VERSION: 3.0.0
  VERSION: 3.0.0
contents:
  packages:
    - base-files
  builds:
    - name: scrapegraph-mcp
      work-dir: ${source.dir}/scrapegraph-mcp
      environment:
        UV_COMPILE_BYTECODE: "1"
      caches:
        - path: /root/.cache/uv
        - path: /root/.cargo
      contents:
        repositories:
          - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
        keyring:
          - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
        packages:
          - bash
          - build-essential
          - ca-certificates
          - cargo
          - coreutils
          - findutils
          - git
          - libffi-dev
          - libssl-dev
          - pkg-config
          - libpython-3.14=3.14.7-1
          - libpython-3.14-dev=3.14.7-1
          - libpython-3.14-minimal=3.14.7-1
          - libpython-3.14-stdlib=3.14.7-1
          - python-3.14=3.14.7-1
          - python-3.14-dev=3.14.7-1
          - python-3.14-minimal=3.14.7-1
          - rustc
          - sed
          - uv
        files:
          - url: git+https://github.com/ScrapeGraphAI/scrapegraph-mcp.git#21435183b85264804157c0cdfaefc309160f0737
            checksum: 21435183b85264804157c0cdfaefc309160f0737
            path: ${source.dir}/scrapegraph-mcp
            spdx:
              name: scrapegraph-mcp
              version: 3.0.0
              packages:
                - name: scrapegraph-mcp
                  purl: pkg:github/ScrapeGraphAI/scrapegraph-mcp@21435183b85264804157c0cdfaefc309160f0737
                  license: MIT
            uid: 0
            gid: 0
      pipeline:
        - name: patch dhi runtime behavior
          uses: patch@v1
          with:
            options: -p1
            patches:
              - ${source.dir}/patch/dhi-runtime-behavior.patch
        - name: build venv at final path and stage it
          privileged: true
          runs: |
            set -eux -o pipefail

            export SOURCE_DIR="${source.dir}" TARGET_DIR="${target.dir}" PYTHON_BIN=/usr/bin/python3.14
            bash "${source.dir}/build-venv.sh"
        - uses: dhi/build-pkg:0
          with:
            depends:
              - python-3.14
            description: ScrapeGraph MCP Server
            files:
              - usr/lib/scrapegraph-mcp
              - usr/bin/scrapegraph-mcp
            formats:
              - deb
            license: MIT
            name: scrapegraph-mcp
            rel: 1
            url: https://github.com/ScrapeGraphAI/scrapegraph-mcp
            version: 3.0.0
      paths:
        - type: file
          path: ${source.dir}/build-venv.sh
          uid: 0
          gid: 0
          mode: "0755"
          source: package/main/scrapegraph-mcp/build-venv.sh
        - type: file
          path: ${source.dir}/patch/dhi-runtime-behavior.patch
          uid: 0
          gid: 0
          mode: "0644"
          source: package/main/scrapegraph-mcp/patch/dhi-runtime-behavior.patch
os-release:
  name: Docker Hardened Images (Debian)
  id: debian
  version-id: "13"
  version-codename: trixie
  pretty-name: Docker Hardened Images/Debian GNU/Linux 13 (trixie)
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
