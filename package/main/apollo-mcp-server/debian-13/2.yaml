# syntax=dhi.io/build:2-debian13

image: dhi.io/pkg-apollo-mcp-server
variant: runtime
tags:
  - 2.1.0-2
  - 2.1.0-2-debian13
platforms:
  - linux/amd64
  - linux/arm64
dates:
  release: "2026-10-06"
vars:
  COMMIT_SHA: beba1c63e4be128ae8bc8d4ad24a931ae3e8194f
  DHI_REL: "2"
  DHI_VERSION: 2.1.0-2
  PACKAGE_NAME: apollo-mcp-server-2
  SEMVER_MAJOR_MINOR_VERSION: "2.1"
  SEMVER_MAJOR_VERSION: "2"
  SEMVER_VERSION: 2.1.0
  VERSION: 2.1.0
contents:
  repositories:
    - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
  keyring:
    - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
  packages:
    - base-files
  builds:
    - name: apollo-mcp-server
      work-dir: ${source.dir}/apollo-mcp-server-pkg
      caches:
        - path: /root/.cargo
      contents:
        repositories:
          - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
        keyring:
          - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
        packages:
          - bash
          - build-essential
          - cargo-1.97
          - cargo-auditable
          - rustc-1.97
          - ca-certificates
          - coreutils
          - debhelper
          - dpkg-dev
          - findutils
          - libssl-dev
          - perl
          - pkg-config
          - sed
        files:
          - url: git+https://github.com/apollographql/apollo-mcp-server.git#v2.1.0
            checksum: beba1c63e4be128ae8bc8d4ad24a931ae3e8194f
            path: ${source.dir}/apollo-mcp-server-src
            spdx:
              name: apollo-mcp-server
              version: 2.1.0
              packages:
                - name: apollo-mcp-server
                  purl: pkg:cargo/apollo-mcp-server@2.1.0
                  license: MIT
            uid: 0
            gid: 0
      pipeline:
        - name: bump vulnerable crates
          work-dir: ${source.dir}/apollo-mcp-server-src
          privileged: true
          runs: |
            set -eux -o pipefail

            lock_has() {
              local name="$1" ver="$2"
              grep -F -A1 "name = \"${name}\"" Cargo.lock \
                | grep -F -q "version = \"${ver}\""
            }

            bump_crate() {
              local name="$1" from="$2" to="$3"
              if lock_has "${name}" "${from}"; then
                cargo update --package "${name}@${from}" --precise "${to}"
              elif lock_has "${name}" "${to}"; then
                echo "skip ${name}@${from}: already at ${to}"
              else
                echo "error: expected ${name}@${from} or ${name}@${to} in Cargo.lock; locked:" >&2
                grep -F -A1 "name = \"${name}\"" Cargo.lock \
                  | grep -F "version = " >&2 || true
                exit 1
              fi
            }

            axum_otel_metrics_floor=0.14.1
            axum_otel_metrics_manifest=crates/apollo-mcp-server/Cargo.toml
            axum_otel_metrics_version="$(
              sed -n 's/^axum-otel-metrics = "\([^"]*\)"$/\1/p' \
                "${axum_otel_metrics_manifest}"
            )"
            test -n "${axum_otel_metrics_version}"
            if dpkg --compare-versions \
              "${axum_otel_metrics_version}" lt "${axum_otel_metrics_floor}"; then
              sed -i \
                "s|^axum-otel-metrics = \"${axum_otel_metrics_version}\"$|axum-otel-metrics = \"${axum_otel_metrics_floor}\"|" \
                "${axum_otel_metrics_manifest}"
              cargo update --package axum-otel-metrics --precise "${axum_otel_metrics_floor}"
            fi

            bump_crate rand 0.8.5 0.8.6
            bump_crate rand 0.9.2 0.9.3
            bump_crate rand 0.10.0 0.10.1

            bump_crate anyhow 1.0.101 1.0.103
            bump_crate aws-lc-rs 1.16.0 1.17.3
            bump_crate crossbeam-epoch 0.9.18 0.9.20
            bump_crate memmap2 0.9.9 0.9.11
            bump_crate openssl 0.10.75 0.10.80
            bump_crate quinn-proto 0.11.13 0.11.18
            bump_crate quinn-proto 0.11.15 0.11.18
            bump_crate rustls-webpki 0.103.9 0.103.16
            bump_crate rustls-webpki 0.103.13 0.103.16
            bump_crate webpki-root-certs 1.0.6 1.0.10
            bump_crate rustls 0.23.36 0.23.46
            bump_crate h2 0.4.13 0.4.16
            bump_crate thin-vec 0.2.14 0.2.16

            cargo fetch
            tantivy_src="$(find "${CARGO_HOME:-/root/.cargo}/registry/src" -type d -name 'tantivy-0.26.2' | head -1)"
            test -n "${tantivy_src}"
            cp -a "${tantivy_src}" "${source.dir}/tantivy-patched"
            sed -i '/\[dependencies\.lru\]/,/^\[/{s/^version = "0.16.3"/version = "0.18.2"/}' \
              "${source.dir}/tantivy-patched/Cargo.toml"
            sed -i '/\[dependencies\.zstd\]/,/^\[/{s/^version = "0.13"/version = "0.14"/}' \
              "${source.dir}/tantivy-patched/Cargo.toml"
            sstable_src="$(find "${CARGO_HOME:-/root/.cargo}/registry/src" -type d -name 'tantivy-sstable-0.7.0' | head -1)"
            test -n "${sstable_src}"
            cp -a "${sstable_src}" "${source.dir}/tantivy-sstable-patched"
            sed -i '/\[dependencies\.zstd\]/,/^\[/{s/^version = "0.13"/version = "0.14"/}' \
              "${source.dir}/tantivy-sstable-patched/Cargo.toml"
            sed -i '/\[dependencies\.sstable\]/,/^\[/{s|^version = "0.7"|path = "'"${source.dir}"'/tantivy-sstable-patched"|}' \
              "${source.dir}/tantivy-patched/Cargo.toml"
            columnar_src="$(find "${CARGO_HOME:-/root/.cargo}/registry/src" -type d -name 'tantivy-columnar-0.7.0' | head -1)"
            test -n "${columnar_src}"
            cp -a "${columnar_src}" "${source.dir}/tantivy-columnar-patched"
            sed -i '/\[dependencies\.sstable\]/,/^\[/{s|^version = "0.7"|path = "'"${source.dir}"'/tantivy-sstable-patched"|}' \
              "${source.dir}/tantivy-columnar-patched/Cargo.toml"
            sed -i '/\[dependencies\.columnar\]/,/^\[/{s|^version = "0.7"|path = "'"${source.dir}"'/tantivy-columnar-patched"|}' \
              "${source.dir}/tantivy-patched/Cargo.toml"
            sed -i \
              's|tantivy = "0.26.2"|tantivy = { path = "'"${source.dir}"'/tantivy-patched" }|' \
              crates/apollo-schema-index/Cargo.toml
            cargo update --package tantivy

            bump_crate tokio 1.49.0 1.51.6

            jsonwebtoken_manifest=crates/apollo-mcp-server/Cargo.toml
            sed -i 's|features = \["rust_crypto"\]|features = ["aws_lc_rs"]|' \
              "${jsonwebtoken_manifest}"
            cargo update --package jsonwebtoken

            bump_crate zstd 0.13.3 0.14.3
            bump_crate zstd-safe 7.2.4 8.2.0
            bump_crate zstd-sys 2.0.16+zstd.1.5.7 2.1.2+zstd.1.5.7
        - name: build
          work-dir: ${source.dir}/apollo-mcp-server-src
          privileged: true
          runs: |
            set -eux -o pipefail

            export OPENSSL_NO_VENDOR=1
            export CARGO_PROFILE_RELEASE_STRIP=symbols

            cargo auditable build --release --locked \
              --package apollo-mcp-server --bin apollo-mcp-server

            ldd target/release/apollo-mcp-server | grep -q 'libssl\.so\.3'

            install -D -m 0755 target/release/apollo-mcp-server \
              '${source.dir}/apollo-mcp-server-pkg/payload/usr/bin/apollo-mcp-server'
        - name: cargo sbom
          uses: sbom@v1
          with:
            extra-scanners: rust-cargo-lock-cataloger
            prefix: apollo-mcp-server-cargo
            source: ${source.dir}/apollo-mcp-server-src
        - name: prepare debian metadata
          runs: |
            set -eux -o pipefail

            cd "${source.dir}/apollo-mcp-server-pkg"
            sed -i "s/@MAJOR@/2/g" debian/control.in debian/changelog debian/apollo-mcp-server.install
            mv debian/control.in debian/control
            mv debian/apollo-mcp-server.install "debian/apollo-mcp-server-2.install"
            chmod -x "debian/apollo-mcp-server-2.install"
        - uses: dpkg/bump@v1
          with:
            changelog:
              - Bump anyhow, crossbeam-epoch, h2, memmap2, openssl, quinn-proto, rand, rustls, rustls-webpki and thin-vec to their advisory-fixed releases.
              - Bump aws-lc-rs to 1.17.3, carrying aws-lc-sys past the advisories affecting 0.37.1, which its own dependency requirement pinned in place.
              - Link the system OpenSSL rather than upstream's vendored copy, so OpenSSL fixes reach consumers as a libssl3t64 update.
              - Raise axum-otel-metrics to 0.14.1 so the build no longer carries the opentelemetry_sdk 0.30 line affected by CVE-2026-48504.
              - Bump tokio, zstd, zstd-safe, and zstd-sys for RUSTSEC-2026-0386, RUSTSEC-2026-0391, RUSTSEC-2026-0395 through RUSTSEC-2026-0406, and RUSTSEC-2026-0410.
              - Switch jsonwebtoken from rust_crypto to aws_lc_rs so JWT verification uses aws-lc-rs; RUSTSEC-2026-0387 on crypto-bigint 0.5.5 remains (rsa/elliptic-curve).
              - Bump quinn-proto to 0.11.18 and rustls-webpki to 0.103.16, including when the lock already moved to 0.11.15 or 0.103.13 after rand or rustls updates.
              - Bump webpki-root-certs to 1.0.10 for CVE-2026-111943 (distinct from the rustls-webpki line).
              - Path-patch tantivy 0.26.2 and tantivy-sstable 0.7.0 so lru and zstd dependency floors accept advisory-fixed releases.
            version: 2.1.0-2
        - uses: dpkg/build@v1
          with:
            args: -b -uc -us -d
      paths:
        - type: directory
          path: ${source.dir}/apollo-mcp-server-pkg/debian
          uid: 0
          gid: 0
          mode: "0600"
          source: package/main/apollo-mcp-server/debian-13/debian
os-release:
  name: Docker Hardened Images (Debian)
  id: debian
  version-id: "13"
  version-codename: trixie
  pretty-name: Docker Hardened Images/Debian GNU/Linux 13 (trixie)
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
