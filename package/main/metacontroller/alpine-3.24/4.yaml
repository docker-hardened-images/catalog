# syntax=dhi.io/build:2-alpine3.24

image: dhi.io/pkg-metacontroller
variant: runtime
tags:
  - 4.17.11-alpine3.24
  - 4.17.11-r0-alpine3.24
platforms:
  - linux/amd64
  - linux/arm64
vars:
  COMMIT_SHA: f2670fbfce03e2ee58f3aa1b58fe996a7aaa3014
  GOLANG_VERSION: 1.27.4-r1
  PACKAGE_NAME: metacontroller-4
  REL: "0"
  SEMVER_MAJOR_MINOR_VERSION: "4.17"
  SEMVER_MAJOR_VERSION: "4"
  SEMVER_VERSION: 4.17.11
  VERSION: 4.17.11
contents:
  repositories:
    - https://dhi.io/apk/alpine/v3.24/main
    - https://dhi.io/apk/alpine/v3.23/main
    - https://dl-cdn.alpinelinux.org/alpine/v3.24/main
    - https://dl-cdn.alpinelinux.org/alpine/v3.24/community
  keyring:
    - https://dhi.io/keyring/dhi-apk@docker-0F81AD7700D99184.rsa.pub
  packages:
    - alpine-baselayout-data
  builds:
    - name: metacontroller-4
      work-dir: /go/src/github.com/metacontroller/metacontroller
      contents:
        packages:
          - busybox
          - bash
          - ca-certificates-bundle
          - coreutils
          - findutils
          - mawk
          - sed
          - golang-1.27=1.27.4-r1
          - golang-1.27-oci-config=1.27.4-r1
        files:
          - url: git+https://github.com/metacontroller/metacontroller.git#v4.17.11
            checksum: f2670fbfce03e2ee58f3aa1b58fe996a7aaa3014
            path: /go/src/github.com/metacontroller/metacontroller
            spdx:
              name: metacontroller
              version: 4.17.11
              packages:
                - name: metacontroller
                  purl: pkg:golang/metacontroller@4.17.11
                  license: Apache-2.0 AND MIT
            uid: 0
            gid: 0
      pipeline:
        - name: update go dependencies
          uses: go/bump@v2
          with:
            deps: []
            download: true
        - uses: go/hermetic@v1
        - name: test
          runs: |
            set -eux -o pipefail

            export GOPROXY=off GOSUMDB=off GOTOOLCHAIN=local
            if [ "false" = "true" ]; then
              export GOFIPS140=v1.0.0
              export GODEBUG=fips140=on
            fi

            go test -count=1 ./pkg/...
        - name: build
          uses: go/build@v1
          with:
            extra-env: GOPROXY=off GOSUMDB=off GOTOOLCHAIN=local
            fips: false
            ldflags:
              - -s
              - -w
              - -X main.version=4.17.11
            output: ${target.dir}/usr/bin/metacontroller
            packages: ./pkg/cmd/metacontroller
        - name: build dev
          uses: go/build@v1
          with:
            extra-env: GOPROXY=off GOSUMDB=off GOTOOLCHAIN=local
            fips: false
            ldflags:
              - -X main.version=4.17.11
            output: ${target.dir}/usr/bin/metacontroller-dev
            packages: ./pkg/cmd/metacontroller
            strip: false
        - name: verify build info
          runs: |
            set -eux -o pipefail

            src=/go/src/github.com/metacontroller/metacontroller
            runtime=${target.dir}/usr/bin/metacontroller
            devbin=${target.dir}/usr/bin/metacontroller-dev

            test -s "$src/go.mod"
            grep -qE '^go 1\.[0-9]+(\.[0-9]+)?$' "$src/go.mod"

            for bin in "$runtime" "$devbin"; do
              test -x "$bin"
              go version -m "$bin" > "/tmp/buildinfo.$(basename "$bin").txt"
              info="/tmp/buildinfo.$(basename "$bin").txt"
              grep -qE '^[[:space:]]+build[[:space:]]+CGO_ENABLED=0$' "$info"
              awk '$1 == "mod" && $2 == "metacontroller" {found=1} END {exit !found}' "$info"
              grep -qF 'golang.org/x/net' "$info"
              awk '$1 == "=>" && $2 == "golang.org/x/net" {print $3}' "$info" > "$info.netver"
              test "$(LC_ALL=C sort -u "$info.netver")" = "v0.62.0"
              grep -qaF "4.17.11" "$bin"
              if [ "false" = "true" ]; then
                grep -qE '^[[:space:]]+build[[:space:]]+GOFIPS140=v1\.0\.0(-[0-9a-f]+)?$' "$info"
                grep -qE '^[[:space:]]+build[[:space:]]+DefaultGODEBUG=(.*,)?fips140=on(,|$)' "$info"
              elif grep -q fips140 "$info"; then
                echo "$bin: FIPS build settings on a non-FIPS build" >&2
                exit 1
              fi
            done

            grep -qE '^[[:space:]]+build[[:space:]]+-trimpath=true[[:space:]]*$' /tmp/buildinfo.metacontroller.txt
            if go tool nm "$runtime" > /dev/null 2>&1; then
              echo "$runtime: runtime binary must be stripped (-s -w)" >&2
              exit 1
            fi
            go tool nm "$devbin" > /dev/null
            if grep -qE '^[[:space:]]+build[[:space:]]+-trimpath=true' /tmp/buildinfo.metacontroller-dev.txt; then
              echo "$devbin: dev binary must keep paths" >&2
              exit 1
            fi
        - name: stage licenses
          runs: |
            set -eux -o pipefail

            export GOPROXY=off GOSUMDB=off GOTOOLCHAIN=local
            src=/go/src/github.com/metacontroller/metacontroller
            runtime=${target.dir}/usr/bin/metacontroller
            devbin=${target.dir}/usr/bin/metacontroller-dev
            out=${target.dir}/usr/share/licenses/metacontroller
            work=$(mktemp -d)

            cd "$src"
            rm -rf "$out"
            install -d "$out/modules"

            go list -deps -f '{{if not .Standard}}{{with .Module}}{{if not .Main}}{{.Path}}|{{with .Replace}}{{.Version}}{{else}}{{.Version}}{{end}}|{{with .Replace}}{{.Dir}}{{else}}{{.Dir}}{{end}}|{{$.Dir}}{{end}}{{end}}{{end}}' ./pkg/cmd/metacontroller \
              | grep . | LC_ALL=C sort -u > "$work/rows"
            test -s "$work/rows"

            cut -d'|' -f1,2 "$work/rows" | tr '|' '@' | LC_ALL=C sort -u > "$work/modules.txt"
            test -s "$work/modules.txt"

            : > "$work/files"
            while IFS='|' read -r mod ver moddir pkgdir; do
              case "$pkgdir" in
                "$moddir" | "$moddir"/*) ;;
                *)
                  echo "package dir $pkgdir is outside module dir $moddir" >&2
                  exit 1
                  ;;
              esac
              d=$pkgdir
              while :; do
                for f in $(find "$d" -maxdepth 1 -type f \( -iname 'LICENSE*' -o -iname 'LICENCE*' -o -iname 'COPYING*' -o -iname 'NOTICE*' -o -iname 'PATENTS*' \) ! -name '*.go' | LC_ALL=C sort); do
                  printf '%s\t%s\t%s\n' "$mod@$ver" "${f#"$moddir"/}" "$f" >> "$work/files"
                done
                [ "$d" = "$moddir" ] && break
                d=$(dirname "$d")
              done
            done < "$work/rows"
            LC_ALL=C sort -u "$work/files" > "$work/files.txt"
            test -s "$work/files.txt"

            while IFS=$'\t' read -r key rel abs; do
              install -D -m 0644 "$abs" "$out/modules/$key/$rel"
            done < "$work/files.txt"

            install -m 0644 "$work/modules.txt" "$out/modules.txt"

            install -D -m 0644 "$src/LICENSE" "$out/LICENSE"
            install -D -m 0644 "$src/pkg/third_party/kubernetes/LICENSE" "$out/pkg/third_party/kubernetes/LICENSE"
            install -d "$out/pkg/metrics"
            sed -n '/^\/\/  MIT License/,/SOFTWARE\.$/p' "$src/pkg/metrics/http.go" | sed 's#^// \{0,2\}##' > "$out/pkg/metrics/http.go.LICENSE"
            test -s "$out/pkg/metrics/http.go.LICENSE"
            grep -q 'Permission is hereby granted' "$out/pkg/metrics/http.go.LICENSE"
            grep -q 'travel audience' "$out/pkg/metrics/http.go.LICENSE"
            grep -q 'SOFTWARE\.' "$out/pkg/metrics/http.go.LICENSE"
            grep -q 'Apache License' "$out/LICENSE"
            grep -q 'Apache License' "$out/pkg/third_party/kubernetes/LICENSE"

            bin_deps() {
              go version -m "$1" | awk '
                function emit() { if (p != "") print p "@" v }
                $1 == "dep" { emit(); p = $2; v = $3; next }
                $1 == "=>" { v = $3; next }
                END { emit() }' | LC_ALL=C sort -u
            }
            bin_deps "$runtime" > "$work/runtime.txt"
            bin_deps "$devbin" > "$work/dev.txt"
            test -s "$work/runtime.txt"

            for set in runtime dev; do
              LC_ALL=C comm -3 "$work/modules.txt" "$work/$set.txt" > "$work/diff.$set"
              if [ -s "$work/diff.$set" ]; then
                echo "module set differs between modules.txt and the $set binary:" >&2
                cat "$work/diff.$set" >&2
                exit 1
              fi
            done

            while IFS= read -r m; do
              if [ -z "$(find "$out/modules/$m" -maxdepth 1 -type f \( -iname 'LICENSE*' -o -iname 'LICENCE*' -o -iname 'COPYING*' \) 2> /dev/null)" ]; then
                echo "no module-root license for $m" >&2
                exit 1
              fi
            done < "$work/modules.txt"

            for p in github.com/go-openapi/jsonpointer github.com/go-openapi/jsonreference github.com/prometheus/client_golang github.com/prometheus/client_model github.com/prometheus/common github.com/prometheus/procfs go.yaml.in/yaml/v2 go.yaml.in/yaml/v3 sigs.k8s.io/randfill; do
              m=$(awk -v p="$p" 'index($0, p "@") == 1' "$work/modules.txt")
              test -n "$m"
              if [ -z "$(find "$out/modules/$m" -maxdepth 1 -type f -iname 'NOTICE*')" ]; then
                echo "no NOTICE for $m" >&2
                exit 1
              fi
            done

            if grep -rlE 'GNU (Lesser )?General Public License|Mozilla Public License' "$out" >&2; then
              echo "copyleft license text in the bundle; decide before shipping" >&2
              exit 1
            fi
        - name: stage sbom and license
          runs: |
            set -eux -o pipefail

            sbom=/opt/docker/sbom/metacontroller
            test -d "$sbom"
            test -n "$(find "$sbom" -maxdepth 1 -type f -name '*.json')"
            install -d "${target.dir}/opt/docker/sbom" "${target.dir}/opt/docker/sbom-dev"
            cp -a "$sbom" "${target.dir}/opt/docker/sbom/"
            cp -a "$sbom" "${target.dir}/opt/docker/sbom-dev/"
            cp -a "${target.dir}/usr/share/licenses/metacontroller" "${target.dir}/usr/share/licenses/metacontroller-dev"
        - uses: dhi/build-pkg:0
          with:
            description: Kubernetes add-on for writing custom controllers as webhooks
            files:
              - usr/bin/metacontroller
              - opt/docker/sbom/metacontroller
              - usr/share/licenses/metacontroller
            license: Apache-2.0 AND BSD-3-Clause AND ISC AND MIT
            name: metacontroller-4
            rel: 0
            subpackages:
              - files:
                  - path: usr/bin/metacontroller
                    source: usr/bin/metacontroller-dev
                  - path: opt/docker/sbom/metacontroller
                    source: opt/docker/sbom-dev/metacontroller
                  - path: usr/share/licenses/metacontroller
                    source: usr/share/licenses/metacontroller-dev
                name: metacontroller-4-dev
            url: https://github.com/metacontroller/metacontroller
            version: 4.17.11
os-release:
  name: Docker Hardened Images (Alpine)
  id: alpine
  version-id: "3.24"
  pretty-name: Docker Hardened Images/Alpine Linux v3.24
