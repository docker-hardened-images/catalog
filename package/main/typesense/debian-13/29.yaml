            uid: 0
            gid: 0
          - url: https://github.com/bazelbuild/bazel/releases/download/6.2.0/bazel-6.2.0-linux-${BAZEL_ARCH}
            checksum: https://github.com/bazelbuild/bazel/releases/download/6.2.0/bazel-6.2.0-linux-${BAZEL_ARCH}.sha256
            path: /usr/local/bin/bazel
            uid: 0
            gid: 0
            mode: "0755"
          - url: https://github.com/openssl/openssl/releases/download/openssl-3.5.9/openssl-3.5.9.tar.gz
            checksum: sha256:603f5602e2eef00d77fbd429d34dcd5822bb301757a1bc9cdb24c670f1eb859a
            path: ${source.dir}/openssl.tar.gz
            uid: 0
            gid: 0
          - url: https://github.com/curl/curl/releases/download/curl-8_22_0/curl-8.22.0.tar.gz
            checksum: sha256:d54dd598bf05927a726deb38df31c6a255ba83ff1de57c5d1464dac3ed8f44a1
            path: ${source.dir}/curl.tar.gz
            uid: 0
            gid: 0
          - url: https://github.com/madler/zlib/archive/da607da739fa6047df13e66a2af6b8bec7c2a498.tar.gz
            checksum: sha256:b9258cf6254e7f7c37f1cd61dba943a1c5ea3cff5718c789834dac359094f5f7
            path: ${source.dir}/zlib.tar.gz
            uid: 0
            gid: 0
      pipeline:
        - name: patch workspace pins
          uses: patch@v1
          work-dir: ${source.dir}/typesense
          with:
            options: -p1
            patches:
              - ${source.dir}/patch/openssl-local.patch
              - ${source.dir}/patch/zlib-local.patch
              - ${source.dir}/patch/snowball-commit.patch
              - ${source.dir}/patch/rocksdb-werror.patch
              - ${source.dir}/patch/curl-local.patch
              - ${source.dir}/patch/onnxruntime-glob.patch
              - ${source.dir}/patch/sentencepiece-protoc.patch
        - name: stage tracked libraries
          runs: |
            set -eux -o pipefail

            rm -rf /opt/dhi/openssl /opt/dhi/curl /opt/dhi/zlib
            mkdir -p /opt/dhi/openssl /opt/dhi/curl /opt/dhi/zlib
            tar -xzf "${source.dir}/openssl.tar.gz" -C /opt/dhi/openssl --strip-components=1
            tar -xzf "${source.dir}/curl.tar.gz" -C /opt/dhi/curl --strip-components=1
            tar -xzf "${source.dir}/zlib.tar.gz" -C /opt/dhi/zlib --strip-components=1
            test -f /opt/dhi/openssl/config
            test -f /opt/dhi/curl/CMakeLists.txt
            test -f /opt/dhi/zlib/zlib.h
        - name: compile typesense-server
          privileged: true
          runs: |
            set -eux -o pipefail

            mkdir -p /tmp/bazel-out /tmp/bazel-repo
            export LANG=C.UTF-8
            export LC_ALL=C.UTF-8
            update-alternatives --install /usr/bin/gcc gcc /usr/bin/gcc-12 200
            update-alternatives --install /usr/bin/g++ g++ /usr/bin/g++-12 200
            update-alternatives --set gcc /usr/bin/gcc-12
            update-alternatives --set g++ /usr/bin/g++-12
            gcc -dumpversion
            cat > /usr/local/bin/gcc-dhi << 'EOF'
            #!/bin/sh
            exec /usr/bin/gcc-12 "$@" -Wno-error=array-bounds -Wno-array-bounds
            EOF
            cat > /usr/local/bin/g++-dhi << 'EOF'
            #!/bin/sh
            exec /usr/bin/g++-12 "$@" -Wno-error=array-bounds -Wno-array-bounds
            EOF
            chmod 755 /usr/local/bin/gcc-dhi /usr/local/bin/g++-dhi
            update-alternatives --install /usr/bin/gcc gcc /usr/local/bin/gcc-dhi 300
            update-alternatives --install /usr/bin/g++ g++ /usr/local/bin/g++-dhi 300
            update-alternatives --set gcc /usr/local/bin/gcc-dhi
            update-alternatives --set g++ /usr/local/bin/g++-dhi
            rm /usr/lib/*/libz.so
            bazel --output_user_root=/tmp/bazel-out build \
              --verbose_failures \
              --jobs=6 \
              --repository_cache=/tmp/bazel-repo \
              --define=TYPESENSE_VERSION=\"29.1\" \
              //:typesense-server
            install -D -m 0755 bazel-bin/typesense-server "${target.dir}/usr/bin/typesense-server"
            strings "${target.dir}/usr/bin/typesense-server" | grep -F "OpenSSL 3.5.9"
            strings "${target.dir}/usr/bin/typesense-server" | grep -F "CLIENT libcurl 8.22.0"
            strings "${target.dir}/usr/bin/typesense-server" | grep -F "deflate 1.3.2"
        - uses: spdx@v1
          with:
