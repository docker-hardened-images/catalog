# syntax=dhi.io/build:2-alpine3.24

image: dhi.io/pkg-argoexec
variant: runtime
tags:
  - 4.1.6-alpine3.24
  - 4.1.6-r2-alpine3.24
platforms:
  - linux/amd64
  - linux/arm64
vars:
  ARGOEXEC_ENTITLEMENT: ""
  ARGOEXEC_PACKAGE_SUFFIX: ""
  COMMIT_SHA: 43021573c5a35cbafae009043c132dfcef43a112
  GOLANG_MAJOR_MINOR_VERSION: "1.26"
  GOLANG_VERSION: 1.26.11-r0
  MODULE_MAJOR_VERSION: v4
  PACKAGE_NAME: argoexec-4
  REL: "2"
  SEMVER_MAJOR_MINOR_VERSION: "4.1"
  SEMVER_MAJOR_VERSION: "4"
  SEMVER_VERSION: 4.1.6
  VERSION: 4.1.6
contents:
  repositories:
    - https://dhi.io/apk/alpine/v3.24/main
    - https://dhi.io/apk/alpine/v3.23/main
    - https://dl-cdn.alpinelinux.org/alpine/v3.24/main
    - https://dl-cdn.alpinelinux.org/alpine/v3.24/community
  keyring:
    - https://dhi.io/keyring/dhi-apk@docker-0F81AD7700D99184.rsa.pub
  packages:
    - alpine-baselayout-data
  builds:
    - name: argoexec-4
      work-dir: /go/src/github.com/argoproj/argo-workflows
      caches:
        - path: /go/pkg/mod
      contents:
        packages:
          - bash
          - busybox
          - ca-certificates-bundle
          - coreutils
          - findutils
          - golang-1.26=1.26.11-r0
          - golang-1.26-oci-config=1.26.11-r0
          - mawk
          - sed
        files:
          - url: git+https://github.com/argoproj/argo-workflows.git#v4.1.6
            checksum: 43021573c5a35cbafae009043c132dfcef43a112
            path: /go/src/github.com/argoproj/argo-workflows
            spdx:
              name: argoexec
              version: 4.1.6
              packages:
                - name: argoexec
                  purl: pkg:golang/github.com/argoproj/argo-workflows@4.1.6
                  license: Apache-2.0
            uid: 0
            gid: 0
      pipeline:
        - name: patch (4 only)
          uses: go/bump@v2
          work-dir: /go/src/github.com/argoproj/argo-workflows
          with:
            deps:
              - golang.org/x/net@v0.62.0
              - github.com/go-jose/go-jose/v4@v4.1.6
              - go.opentelemetry.io/otel/sdk@v1.45.0
              - go.opentelemetry.io/otel/exporters/otlp/otlptrace@v1.45.0
              - google.golang.org/grpc@v1.83.2
              - go.opentelemetry.io/otel/exporters/otlp/otlptrace/otlptracegrpc@v1.45.0
              - go.opentelemetry.io/otel/exporters/otlp/otlptrace/otlptracehttp@v1.45.0
              - github.com/andybalholm/brotli@v1.2.7
              - github.com/klauspost/compress@v1.20.2
            downgrade: true
            download: true
            replaces:
              - google.golang.org/grpc=google.golang.org/grpc@v1.83.2
            tidy: true
        - name: test
          work-dir: /go/src/github.com/argoproj/argo-workflows
          runs: |
            set -eux -o pipefail

            if [ "${target.fips}" = "true" ]; then
              export GODEBUG=fips140=on
            fi

            echo "Testing core functionality after patching..."

            go test -v -count=1 -timeout=3m ./workflow/validate -run="TestDAG"
            go test -v -count=1 -timeout=3m ./workflow/common

            UTIL_PACKAGES=$(go list ./util/... | grep -v './util/telemetry' | grep -v './util/sqldb')
            go test -v -count=1 -timeout=4m $UTIL_PACKAGES
        - name: build
          uses: go/build@v1
          work-dir: /go/src/github.com/argoproj/argo-workflows
          with:
            fips: '#{ definition["fips-compliant"] ? true : false }'
            ldflags:
              - -X github.com/argoproj/argo-workflows/v4.version=4.1.6
              - -X github.com/argoproj/argo-workflows/v4.gitCommit=43021573c5a35cbafae009043c132dfcef43a112
            output: ${target.dir}/usr/bin/argoexec
            packages: ./cmd/argoexec
        - name: build dev
          uses: go/build@v1
          work-dir: /go/src/github.com/argoproj/argo-workflows
          with:
            fips: '#{ definition["fips-compliant"] ? true : false }'
            ldflags:
              - -X github.com/argoproj/argo-workflows/v4.version=4.1.6
              - -X github.com/argoproj/argo-workflows/v4.gitCommit=43021573c5a35cbafae009043c132dfcef43a112
            output: ${target.dir}/usr/bin/argoexec-dev
            packages: ./cmd/argoexec
            strip: false
        - name: stage sbom
          runs: |
            set -eux -o pipefail

            mkdir -p "${target.dir}/opt/docker/sbom"
            cp -a /opt/docker/sbom/argoexec "${target.dir}/opt/docker/sbom/"
            test -s "${target.dir}/opt/docker/sbom/argoexec/.spdx.argoexec.json"
        - uses: dhi/build-pkg:0
          with:
            depends:
              - ca-certificates-bundle
            description: Argo Workflows executor (argoexec)
            files:
              - usr/bin/argoexec
              - opt/docker/sbom/argoexec
            license: Apache-2.0
            name: argoexec-4
            rel: 2
            subpackages:
              - files:
                  - path: usr/bin/argoexec
                    source: usr/bin/argoexec-dev
                name: argoexec-4-dev
            url: https://github.com/argoproj/argo-workflows
            version: 4.1.6
os-release:
  name: Docker Hardened Images (Alpine)
  id: alpine
  version-id: "3.24"
  pretty-name: Docker Hardened Images/Alpine Linux v3.24
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
