# syntax=dhi.io/build:2-debian13

image: dhi.io/pkg-linkerd2-proxy
variant: runtime
tags:
  - 2.372.0
  - 2.372.0-r1
  - 2.372.0-debian13
  - 2.372.0-r1-debian13
platforms:
  - linux/amd64
  - linux/arm64
vars:
  AWS_LC_FIPS_VERSION: 4.1.0
  AWS_LC_VERSION: 5.5.0
  CARGO_VERSION: 1.97.1-0
  COMMIT_SHA: a901f208c336bf16a993fd80997d6119ceb912c6
  EDGE_VERSION: 26.11.1
  GOLANG_VERSION: 1.26.11-0
  JEMALLOC_VERSION: 5.3.1
  PACKAGE_NAME: linkerd2-proxy-2
  PINNED_VERSION: 2.372.0
  REL: "1"
  RUSTC_VERSION: 1.97.1-0
  SEMVER_MAJOR_MINOR_VERSION: "2.372"
  SEMVER_MAJOR_VERSION: "2"
  SEMVER_VERSION: 2.372.0
  VERSION: 2.372.0
contents:
  repositories:
    - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
  keyring:
    - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
  packages:
    - base-files
  builds:
    - name: linkerd2-proxy-2
      work-dir: ${source.dir}/linkerd2-proxy
      caches:
        - path: /root/.cargo
      contents:
        packages:
          - bash
          - binutils
          - build-essential
          - ca-certificates-bundle
          - cargo-1.97=1.97.1-0
          - clang
          - cmake
          - coreutils
          - findutils
          - gawk
          - golang-1.26=1.26.11-0
          - grep
          - libcurl4t64
          - libgcc-s1
          - libsqlite3-0
          - libssl3t64
          - mawk
          - pkg-config
          - protobuf-compiler
          - rustc-1.97=1.97.1-0
          - sed
          - zlib1g
        files:
          - url: git+https://github.com/linkerd/linkerd2-proxy.git#release/v2.372.0
            checksum: a901f208c336bf16a993fd80997d6119ceb912c6
            path: ${source.dir}/linkerd2-proxy
            spdx:
              name: linkerd2-proxy
              version: 2.372.0
              packages:
                - name: linkerd2-proxy
                  purl: pkg:github/linkerd/linkerd2-proxy@2.372.0
                  license: Apache-2.0
            uid: 0
            gid: 0
      pipeline:
        - name: patch build stamps
          uses: patch@v1
          with:
            options: -p1
            patches:
              - ${source.dir}/patch/dhi-build-reproducible-stamps.patch
        - name: update cargo dependencies
          privileged: true
          runs: |
            set -eux -o pipefail

            raise_to() {
              locked=$(cargo pkgid "$1" | sed 's/.*[#@]//')
              if [ "$locked" != "$2" ] && [ "$(printf '%s\n%s\n' "$locked" "$2" | sort -V | head -n 1)" = "$locked" ]; then
                cargo update -p "$1@$locked" --precise "$2"
              fi
            }

            raise_to rustls 0.23.46
            raise_to rustls-webpki 0.103.16
            raise_to memmap2 0.9.11
            raise_to anyhow 1.0.103
            raise_to h2 0.4.16
            raise_to hickory-resolver 0.26.3
        - name: cargo sbom
          uses: sbom@v1
          with:
            extra-scanners: rust-cargo-lock-cataloger
            prefix: linkerd2-proxy-cargo
            source: ${source.dir}/linkerd2-proxy
        - name: build
          privileged: true
          environment:
            CARGO_PROFILE_RELEASE_DEBUG: "0"
            LINKERD2_PROXY_VENDOR: dhi
            LINKERD2_PROXY_VERSION: 2.372.0
            PROTOC_NO_VENDOR: "1"
            RUSTFLAGS: --cfg tokio_unstable
          runs: "set -eux -o pipefail\n\nexport GIT_SHA_OVERRIDE=$(printf '%.7s' \"a901f208c336bf16a993fd80997d6119ceb912c6\")\nexport LINKERD2_PROXY_BUILD_DATE_OVERRIDE=$(date -u -d \"@${SOURCE_DATE_EPOCH}\" +%Y-%m-%dT%H:%M:%SZ)\ncargo build --release --locked --package linkerd2-proxy \ninstall -D -m 755 target/release/linkerd2-proxy \"${target.dir}/usr/bin/linkerd2-proxy-dev\"\ninstall -D -m 755 target/release/linkerd2-proxy \"${target.dir}/usr/bin/linkerd2-proxy\"\nstrip --strip-unneeded \"${target.dir}/usr/bin/linkerd2-proxy\"\n"
        - name: verify bundled library versions
          privileged: true
          runs: |
            set -eux -o pipefail

            if [ "false" = true ]; then
              grep -aqF "AWS-LC FIPS 4.1.0" target/release/linkerd2-proxy
            else
              grep -qF "AWSLC_VERSION_NUMBER_STRING \"5.5.0\"" \
                /root/.cargo/registry/src/*/aws-lc-sys-$(cargo pkgid aws-lc-sys | sed 's/.*[#@]//')/aws-lc/include/openssl/base.h
            fi
        - uses: spdx@v1
          with:
            license: ISC AND (Apache-2.0 OR ISC) AND Apache-2.0 AND MIT AND BSD-3-Clause AND (Apache-2.0 OR ISC OR MIT)
            name: aws-lc
            purl: pkg:github/aws/aws-lc@v5.5.0
            version: 5.5.0
        - uses: spdx@v1
          with:
            license: BSD-2-Clause
            name: jemalloc
            purl: pkg:github/jemalloc/jemalloc@5.3.1
            version: 5.3.1
        - name: keep the jemalloc sbom entry only where jemalloc is linked
          privileged: true
          runs: |
            set -eux -o pipefail

            if ls -d target/release/build/tikv-jemalloc-sys-* > /dev/null 2>&1; then
              cargo pkgid tikv-jemalloc-sys | grep -qF "+5.3.1-"
            else
              rm -r /opt/docker/sbom/jemalloc
            fi
        - uses: dhi/build-pkg:0
          with:
            depends:
              - libc6
              - libgcc-s1
            description: Linkerd2 service mesh data plane proxy
            files:
              - usr/bin/linkerd2-proxy
            formats:
              - deb
            license: Apache-2.0
            name: linkerd2-proxy-2
            rel: 1
            subpackages:
              - depends:
                  - libc6
                  - libgcc-s1
                files:
                  - path: usr/bin/linkerd2-proxy
                    source: usr/bin/linkerd2-proxy-dev
                name: linkerd2-proxy-2-dev
            url: https://github.com/linkerd/linkerd2-proxy
            version: 2.372.0
      paths:
        - type: file
          path: ${source.dir}/patch/dhi-build-reproducible-stamps.patch
          uid: 0
          gid: 0
          source: package/main/linkerd2-proxy/patch/dhi-build-reproducible-stamps.patch
os-release:
  name: Docker Hardened Images (Debian)
  id: debian
  version-id: "13"
  version-codename: trixie
  pretty-name: Docker Hardened Images/Debian GNU/Linux 13 (trixie)
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
