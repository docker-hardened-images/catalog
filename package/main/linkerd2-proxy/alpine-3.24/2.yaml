    - alpine-baselayout-data
  builds:
    - name: linkerd2-proxy-2
      work-dir: ${source.dir}/linkerd2-proxy
      caches:
        - path: /root/.cargo
      contents:
        packages:
          - bash
          - binutils
          - build-base
          - ca-certificates-bundle
          - cargo=1.96.1-r0
          - clang22
          - cmake
          - golang-1.26=1.26.10-r0
          - perl
          - protobuf-dev
          - rust=1.96.1-r0
        files:
          - url: git+https://github.com/linkerd/linkerd2-proxy.git#release/v2.372.0
            checksum: a901f208c336bf16a993fd80997d6119ceb912c6
            path: ${source.dir}/linkerd2-proxy
            spdx:
              name: linkerd2-proxy
              version: 2.372.0
              packages:
                - name: linkerd2-proxy
                  purl: pkg:github/linkerd/linkerd2-proxy@2.372.0
                  license: Apache-2.0
            uid: 0
            gid: 0
      pipeline:
        - name: patch build stamps
          uses: patch@v1
          with:
            options: -p1
            patches:
              - ${source.dir}/patch/dhi-build-reproducible-stamps.patch
        - name: update cargo dependencies
          privileged: true
          runs: |
            set -eux -o pipefail

            raise_to() {
              locked=$(cargo pkgid "$1" | sed 's/.*[#@]//')
              if [ "$locked" != "$2" ] && [ "$(printf '%s\n%s\n' "$locked" "$2" | sort -V | head -n 1)" = "$locked" ]; then
                cargo update -p "$1@$locked" --precise "$2"
              fi
            }

            raise_to rustls 0.23.46
            raise_to rustls-webpki 0.103.16
            raise_to memmap2 0.9.11
            raise_to anyhow 1.0.103
            raise_to h2 0.4.16
            raise_to hickory-resolver 0.26.3
        - name: cargo sbom
          uses: sbom@v1
          with:
            extra-scanners: rust-cargo-lock-cataloger
            prefix: linkerd2-proxy-cargo
            source: ${source.dir}/linkerd2-proxy
        - name: build
          privileged: true
          environment:
            CARGO_PROFILE_RELEASE_DEBUG: "0"
            LINKERD2_PROXY_VENDOR: dhi
            LINKERD2_PROXY_VERSION: 2.372.0
            PROTOC_NO_VENDOR: "1"
            RUSTFLAGS: --cfg tokio_unstable
          runs: "set -eux -o pipefail\n\nexport GIT_SHA_OVERRIDE=$(printf '%.7s' \"a901f208c336bf16a993fd80997d6119ceb912c6\")\nexport LINKERD2_PROXY_BUILD_DATE_OVERRIDE=$(date -u -d \"@${SOURCE_DATE_EPOCH}\" +%Y-%m-%dT%H:%M:%SZ)\ncargo build --release --locked --package linkerd2-proxy \ninstall -D -m 755 target/release/linkerd2-proxy \"${target.dir}/usr/bin/linkerd2-proxy-dev\"\ninstall -D -m 755 target/release/linkerd2-proxy \"${target.dir}/usr/bin/linkerd2-proxy\"\nstrip --strip-unneeded \"${target.dir}/usr/bin/linkerd2-proxy\"\n"
        - name: verify bundled library versions
          privileged: true
          runs: |
            set -eux -o pipefail

            if [ "false" = true ]; then
              grep -aqF "AWS-LC FIPS 4.1.0" target/release/linkerd2-proxy
            else
              grep -qF "AWSLC_VERSION_NUMBER_STRING \"5.5.0\"" \
                /root/.cargo/registry/src/*/aws-lc-sys-$(cargo pkgid aws-lc-sys | sed 's/.*[#@]//')/aws-lc/include/openssl/base.h
            fi
        - uses: spdx@v1
          with:
            license: ISC AND (Apache-2.0 OR ISC) AND Apache-2.0 AND MIT AND BSD-3-Clause AND (Apache-2.0 OR ISC OR MIT)
            name: aws-lc
            purl: pkg:github/aws/aws-lc@v5.5.0
            version: 5.5.0
        - uses: dhi/build-pkg:0
          with:
            depends:
              - libgcc
            description: Linkerd2 service mesh data plane proxy
            files:
              - usr/bin/linkerd2-proxy
            formats:
              - apk
            license: Apache-2.0
            name: linkerd2-proxy-2
            rel: 0
            subpackages:
              - depends:
                  - libgcc
                files:
                  - path: usr/bin/linkerd2-proxy
                    source: usr/bin/linkerd2-proxy-dev
                name: linkerd2-proxy-2-dev
            url: https://github.com/linkerd/linkerd2-proxy
            version: 2.372.0
      paths:
        - type: file
          path: ${source.dir}/patch/dhi-build-reproducible-stamps.patch
          uid: 0
          gid: 0
          source: package/main/linkerd2-proxy/patch/dhi-build-reproducible-stamps.patch
