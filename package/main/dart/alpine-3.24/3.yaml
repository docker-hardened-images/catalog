# syntax=dhi.io/build:2-alpine3.24

image: dhi.io/pkg-dart
variant: runtime
tags:
  - 3.14.1-alpine3.24
  - 3.14.1-r0-alpine3.24
platforms:
  - linux/amd64
  - linux/arm64
vars:
  ARCH: '#{ target.arch == "amd64" ? "x64" : "arm64" }'
  ARCH_UPPER: '#{ target.arch == "amd64" ? "X64" : "ARM64" }'
  COMMIT_SHA: c8a0db5978a68d4037f7e5294ffc79867935c8c2
  DART_STAGE0_VERSION: 3.14.1-r0
  DEPOT_TOOLS_COMMIT_SHA: 026f541177cb49a44bcc5118e384949b73ffc43e
  HTTPLIB2_SHA256: sha256:8b6a905cb1c79eefd03f8669fd993c36dc341f7c558f056cb5a33b5c2f458543
  HTTPLIB2_URL: https://files.pythonhosted.org/packages/59/0f/29725a9caf4b2618f524e0f28e2bda91aca8f880123ec77426ede6ea1ea4/httplib2-0.20.4-py3-none-any.whl
  PACKAGE_NAME: dart-3
  PYPARSING_SHA256: sha256:ece8c00a69cf01b45d0b1dedabb469c90d8caf996d4fda40f147627a122849a4
  PYPARSING_URL: https://files.pythonhosted.org/packages/38/bb/d215ee7c73b61497b28a5503f9f53523f294fcc936762b7caf90e0c1c2b5/pyparsing-3.3.3-py3-none-any.whl
  REL: "0"
  SEMVER_MAJOR_MINOR_VERSION: "3.14"
  SEMVER_MAJOR_VERSION: "3"
  SEMVER_VERSION: 3.14.1
  VERSION: 3.14.1
contents:
  repositories:
    - https://dhi.io/apk/alpine/v3.24/main
    - https://dhi.io/apk/alpine/v3.23/main
    - https://dl-cdn.alpinelinux.org/alpine/v3.24/main
    - https://dl-cdn.alpinelinux.org/alpine/v3.24/community
  keyring:
    - https://dhi.io/keyring/dhi-apk@docker-0F81AD7700D99184.rsa.pub
  packages:
    - alpine-baselayout-data
  builds:
    - name: dart
      environment:
        CC: gcc
        CXX: g++
        DEPOT_TOOLS_UPDATE: "0"
        PATH: /src/depot_tools:/usr/local/bin:/usr/bin:/bin
      contents:
        packages:
          - bash
          - build-base
          - busybox
          - clang
          - compiler-rt
          - dart-stage0=3.14.1-r0
          - git
          - gn
          - gzip
          - icu-dev
          - linux-headers
          - lld
          - llvm
          - musl-dev
          - openssl-dev
          - py3-pip
          - python3
          - ripgrep
          - samurai
          - tar
          - wget
          - zlib-dev
          - zstd
        files:
          - url: git+https://chromium.googlesource.com/chromium/tools/depot_tools.git#026f541177cb49a44bcc5118e384949b73ffc43e
            checksum: 026f541177cb49a44bcc5118e384949b73ffc43e
            path: ${source.dir}/depot_tools
            uid: 0
            gid: 0
          - url: git+https://github.com/dart-lang/sdk.git#3.14.1
            checksum: c8a0db5978a68d4037f7e5294ffc79867935c8c2
            path: ${source.dir}/dart-sdk/sdk
            spdx:
              name: dart
              version: 3.14.1
              packages:
                - name: dart
                  purl: pkg:dhi/dart@3.14.1
                  license: BSD-3-Clause
            uid: 0
            gid: 0
          - url: https://files.pythonhosted.org/packages/59/0f/29725a9caf4b2618f524e0f28e2bda91aca8f880123ec77426ede6ea1ea4/httplib2-0.20.4-py3-none-any.whl
            checksum: sha256:8b6a905cb1c79eefd03f8669fd993c36dc341f7c558f056cb5a33b5c2f458543
            path: ${source.dir}/httplib2-0.20.4-py3-none-any.whl
            uid: 0
            gid: 0
          - url: https://files.pythonhosted.org/packages/38/bb/d215ee7c73b61497b28a5503f9f53523f294fcc936762b7caf90e0c1c2b5/pyparsing-3.3.3-py3-none-any.whl
            checksum: sha256:ece8c00a69cf01b45d0b1dedabb469c90d8caf996d4fda40f147627a122849a4
            path: ${source.dir}/pyparsing-3.3.3-py3-none-any.whl
            uid: 0
            gid: 0
      pipeline:
        - name: sync-dependencies
          work-dir: ${source.dir}/dart-sdk
          privileged: true
          runs: |
            set -eux -o pipefail

            export PATH="${source.dir}/depot_tools:${PATH}"

            python3 -m pip install --break-system-packages --no-index --no-deps \
              "${source.dir}/pyparsing-3.3.3-py3-none-any.whl" \
              "${source.dir}/httplib2-0.20.4-py3-none-any.whl"

            printf 'solutions = [\n  {\n    "name": "sdk",\n    "url": "https://github.com/dart-lang/sdk.git@%s",\n    "managed": False,\n    "custom_deps": {},\n  },\n]\n' "c8a0db5978a68d4037f7e5294ffc79867935c8c2" > .gclient

            python3 "${source.dir}/depot_tools/gclient.py" sync --no-history --nohooks
        - name: use clang for sanitizer runtimes
          uses: patch@v1
          work-dir: ${source.dir}/dart-sdk/sdk
          with:
            options: -p1
            patches:
              - ${source.dir}/patch/arm64-clang-sanitizer-runtimes.patch
        - name: setup-bootstrap-dart
          work-dir: ${source.dir}/dart-sdk/sdk
          runs: |
            set -eux -o pipefail

            mkdir -p tools/sdks
            rm -rf tools/sdks/dart-sdk
            ln -s /usr/lib/dart tools/sdks/dart-sdk
            tools/sdks/dart-sdk/bin/dart --version
        - name: setup-buildtools
          work-dir: ${source.dir}/dart-sdk/sdk
          runs: |
            set -eux -o pipefail

            mkdir -p buildtools
            rm -f buildtools/gn
            ln -s /usr/bin/gn buildtools/gn

            mkdir -p buildtools/ninja
            rm -f buildtools/ninja/ninja
            ln -s /usr/bin/samu buildtools/ninja/ninja
        - name: setup-sanitizer-clang
          work-dir: ${source.dir}/dart-sdk/sdk
          runs: |
            set -eux -o pipefail

            case "${ARCH}" in
              arm64) root="buildtools/linux-arm64/clang" ;;
              x64) root="buildtools/linux-x64/clang" ;;
              *) exit 0 ;;
            esac

            mkdir -p "$root/bin"
            for tool in llvm-ar llvm-nm llvm-readelf llvm-objcopy llvm-strip; do
              ln -sfn "/usr/bin/$tool" "$root/bin/$tool"
            done

            resource="$(/usr/bin/clang -print-resource-dir)"
            rm -f "$root/bin/clang" "$root/bin/clang++"
            RESOURCE="$resource" ROOT="$root" python3 - << 'PY'
            import os
            from pathlib import Path

            root = Path(os.environ["ROOT"])
            resource = os.environ["RESOURCE"]
            bindir = root / "bin"
            clang = """#!/bin/bash
            extra=()
            for a in "$@"; do
              case "$a" in
                *.c) extra=(-x c) ;;
              esac
            done
            exec /usr/bin/clang --driver-mode=gcc "${extra[@]}" "$@" -resource-dir=%s
            """ % resource
            clangxx = """#!/bin/bash
            exec /usr/bin/clang++ --driver-mode=g++ "$@" -resource-dir=%s
            """ % resource
            (bindir / "clang").write_text(clang)
            (bindir / "clang++").write_text(clangxx)
            for name in ("clang", "clang++"):
                (bindir / name).chmod(0o755)
            PY
        - name: setup-toolchain-wrappers
          work-dir: ${source.dir}/dart-sdk/sdk
          runs: |
            set -eux -o pipefail

            mkdir -p "${target.dir}/toolchain_wrappers"
            for prefix in aarch64-linux-gnu x86_64-linux-gnu; do
              printf '#!/bin/sh\nexec /usr/bin/gcc "$@"\n' > "${target.dir}/toolchain_wrappers/${prefix}-gcc"
              printf '#!/bin/sh\nexec /usr/bin/g++ "$@"\n' > "${target.dir}/toolchain_wrappers/${prefix}-g++"
              chmod +x "${target.dir}/toolchain_wrappers/${prefix}-gcc" "${target.dir}/toolchain_wrappers/${prefix}-g++"

              for tool in nm strip objcopy objdump readelf ar ranlib; do
                printf '#!/bin/sh\nexec /usr/bin/%s "$@"\n' "$tool" > "${target.dir}/toolchain_wrappers/${prefix}-$tool"
                chmod +x "${target.dir}/toolchain_wrappers/${prefix}-$tool"
              done

              printf '#!/bin/sh\nexec /usr/bin/gcc "$@"\n' > "/usr/bin/${prefix}-gcc"
              printf '#!/bin/sh\nexec /usr/bin/g++ "$@"\n' > "/usr/bin/${prefix}-g++"
              chmod +x "/usr/bin/${prefix}-gcc" "/usr/bin/${prefix}-g++"
              for tool in nm strip objcopy objdump readelf ar ranlib; do
                printf '#!/bin/sh\nexec /usr/bin/%s "$@"\n' "$tool" > "/usr/bin/${prefix}-$tool"
                chmod +x "/usr/bin/${prefix}-$tool"
              done
            done
        - name: setup-build-environment
          work-dir: ${source.dir}/dart-sdk/sdk
          runs: |
            set -eux -o pipefail

            export PATH="${target.dir}/toolchain_wrappers:${source.dir}/depot_tools:${PATH}"

            mkdir -p "out/Release${ARCH_UPPER}"
            touch "out/Release${ARCH_UPPER}/args.gn"

            mkdir -p .git/logs
            echo '' > .git/logs/HEAD

            python3 tools/generate_package_config.py
            python3 tools/generate_sdk_version_file.py
        - name: disable-analytics
          work-dir: ${source.dir}/dart-sdk/sdk
          runs: |
            set -eux -o pipefail

            mkdir -p tools/bots
            echo '' > tools/bots/dartdoc_footer.html
            rm -f third_party/devtools/web/devtools_analytics.js

            JOBS="${JOBS:-2}"
            rg --no-ignore -l 'google-analytics\.com' . \
              | rg -v "\.map$" \
              | xargs -t -n 1 -P "${JOBS}" sed -i -E 's|([^/]+\.)?google-analytics\.com|0\.0\.0\.0|g' || true
            rg --no-ignore -l 'UA-[0-9]+-[0-9]+' . \
              | xargs -t -n 1 -P "${JOBS}" sed -i -E 's|UA-[0-9]+-[0-9]+|UA-2137-0|g' || true
        - name: prepare-build
          work-dir: ${source.dir}/dart-sdk/sdk
          runs: |
            set -eux -o pipefail

            sed -i "s/Unknown timestamp/$(date -uIm)/" tools/make_version.py

            mkdir -p .dart_tool
            if [ ! -f ".dart_tool/package_config.json" ]; then
              echo '{"configVersion":2,"packages":[],"generated":"2024-01-01T00:00:00.000Z","generator":"manual","generatorVersion":"0.0.0"}' > .dart_tool/package_config.json
            fi
        - name: build-dart-sdk
          work-dir: ${source.dir}/dart-sdk/sdk
          runs: |
            set -eux -o pipefail

            export PATH="${target.dir}/toolchain_wrappers:${source.dir}/depot_tools:${PATH}"

            ./tools/build.py \
              --no-clang \
              --mode release \
              --arch ${ARCH} \
              --no-verify-sdk-hash \
              --gn-args='dart_snapshot_kind="app-jit" dart_sysroot=""' \
              create_sdk
        - name: install-sdk
          runs: |
            set -eux -o pipefail

            mkdir -p "${target.dir}/usr/lib/dart-sdk"
            cp -r "${source.dir}/dart-sdk/sdk/out/Release${ARCH_UPPER}/dart-sdk"/* "${target.dir}/usr/lib/dart-sdk/"
            test -x "${target.dir}/usr/lib/dart-sdk/bin/dartaotruntime_asan"
            test -x "${target.dir}/usr/lib/dart-sdk/bin/dartaotruntime_tsan"
            test -x "${target.dir}/usr/lib/dart-sdk/bin/dartcliruntime_asan"
            test -x "${target.dir}/usr/lib/dart-sdk/bin/dartcliruntime_tsan"
            for bin in dartaotruntime_asan dartaotruntime_tsan dartcliruntime_asan dartcliruntime_tsan; do
              if llvm-readelf -d "${target.dir}/usr/lib/dart-sdk/bin/${bin}" | grep -qE '\[lib(asan|tsan)\.so'; then
                echo "sanitizer binary still DT_NEEDED libasan/libtsan: ${bin}" >&2
                llvm-readelf -d "${target.dir}/usr/lib/dart-sdk/bin/${bin}"
                exit 1
              fi
            done

            mkdir -p "${target.dir}/opt/docker/sbom"
            cp -a /opt/docker/sbom/dart "${target.dir}/opt/docker/sbom/"
        - uses: dhi/build-pkg:0
          with:
            description: Dart programming language SDK
            files:
              - usr/lib/dart-sdk
              - opt/docker/sbom
            formats:
              - apk
            license: BSD-3-Clause
            name: dart-3
            rel: 0
            url: https://dart.dev
            version: 3.14.1
      paths:
        - type: file
          path: ${source.dir}/patch/arm64-clang-sanitizer-runtimes.patch
          uid: 0
          gid: 0
          source: package/main/dart/patch/arm64-clang-sanitizer-runtimes.patch
os-release:
  name: Docker Hardened Images (Alpine)
  id: alpine
  version-id: "3.24"
  pretty-name: Docker Hardened Images/Alpine Linux v3.24
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
