              - libibverbs1
              - libicu76
              - libkeyutils1
              - libldap2
              - liblmdb0
              - liblttng-ust1t64
              - liblua5.3-0
              - liblz4-1
              - libnbd0
              - libncurses6
              - libnuma1
              - liboath0t64
              - librabbitmq4
              - librdkafka1
              - librdmacm1t64
              - libsnappy1v5
              - libsqlite3-0
              - libssl3t64
              - libstdc++6
              - libthrift-0.19.0t64
              - libtinfo6
              - libudev1
              - python-3.13
            description: Ceph distributed storage system
            files:
              - usr/bin
              - usr/sbin
              - usr/lib
              - usr/share/ceph
              - usr/lib/python3.13/site-packages
              - opt/docker/sbom/ceph
            formats:
