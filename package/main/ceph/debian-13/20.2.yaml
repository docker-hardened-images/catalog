        files:
          - url: git+https://github.com/ceph/ceph.git#v20.2.5
            checksum: ed27c686770872022f4c1de04f6b0ac5d5384ded
            path: ${source.dir}/ceph
            spdx:
              name: ceph
              version: 20.2.5
              packages:
                - name: ceph
                  purl: pkg:dhi/ceph@20.2.5
                  license: LGPL-2.1
            uid: 0
            gid: 0
      pipeline:
        - name: patch opentelemetry to use Debian abseil
          uses: git/patch@v1
          work-dir: ${source.dir}/ceph
          with:
            patch: ${source.dir}/patch/build-opentelemetry-use-system-abseil.patch
        - name: patch opentelemetry jaeger thrift compatibility
          uses: git/patch@v1
          work-dir: ${source.dir}/ceph
          with:
            patch: ${source.dir}/patch/build-opentelemetry-jaeger-thrift-compat.patch
        - name: patch distutils remove install layout deb for ceph 19/20
          uses: git/patch@v1
          work-dir: ${source.dir}/ceph
          with:
            patch: ${source.dir}/patch/build-distutils-remove-install-layout-deb.patch
        - name: patch python source
          uses: git/patch@v1
          work-dir: ${source.dir}/ceph
          with:
            patch: ${source.dir}/patch/types.patch
        - name: bump python mgr requirements
          uses: python/bump@v1
          work-dir: ${source.dir}/ceph/src/pybind/mgr
          privileged: true
          with:
            bumps: ${source.dir}/patch/python-bumps.json
            constraints: ${source.dir}/patch/mgr-requirements-constraints.txt
            python: /usr/bin/python3.13
            requirements: requirements-required.txt
            verify: none
        - name: install missing mgr deps
          work-dir: ${source.dir}/ceph/src/pybind/mgr
          privileged: true
          runs: |
            set -eux -o pipefail

            sed -i '/^setuptools/d' requirements-required.txt

            python3.13 -m venv /tmp/ceph-pip
            VENV_PYTHON=/tmp/ceph-pip/bin/python

            export OPENSSL_NO_VENDOR=1 OPENSSL_STATIC=0

            "${VENV_PYTHON}" -m pip install --prefix /usr --ignore-installed --only-binary=:all: --no-cache-dir wheel flit-core maturin

            "${VENV_PYTHON}" -m pip install --prefix /usr --ignore-installed --no-binary cryptography --no-cache-dir cryptography

            "${VENV_PYTHON}" -m pip install --prefix /usr --ignore-installed --no-binary :all: --only-binary=scipy,requests-mock,cheroot,pytest,setuptools,setuptools-scm,vcs-versioning,pytest-runner,wheel,flit-core,maturin,cython,pydantic,pydantic-core --no-cache-dir -c "${source.dir}/patch/mgr-requirements-constraints.txt" -r requirements-required.txt

            CRYPTO_SO="$(python3.13 -c 'import importlib.util; spec = importlib.util.find_spec("cryptography.hazmat.bindings._rust"); print(spec.origin if spec else "")')"
            test -f "${CRYPTO_SO}"
            CRYPTO_NEEDED="$(readelf -d "${CRYPTO_SO}")"
            echo "${CRYPTO_NEEDED}" | grep -q 'libssl\.so\.3'
            echo "${CRYPTO_NEEDED}" | grep -q 'libcrypto\.so\.3'

            rm -rf /tmp/ceph-pip
        - name: configure and create build
          work-dir: ${source.dir}/ceph
          privileged: true
          environment:
            CCACHE_DIR: /ccache
            CCACHE_MAXSIZE: 20G
          runs: |
            set -eux -o pipefail

            git submodule update --init --recursive --recommend-shallow --progress
            mkdir -p build
            ARGS=(
              -GNinja
              -DCMAKE_BUILD_TYPE=Release
              -DCMAKE_INSTALL_LIBDIR=/usr/lib
              -DWITH_PYTHON3=3.13
              -DPython3_EXECUTABLE=/usr/bin/python3.13
              -DWITH_CCACHE=ON
              -DCMAKE_CXX_COMPILER=g++
              -DCMAKE_C_COMPILER=gcc
              -DCMAKE_C_COMPILER_LAUNCHER=ccache
              -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
              -DSETUPTOOLS_DEB_LAYOUT=OFF
              -DWITH_MGR_DASHBOARD_FRONTEND=OFF
              -DWITH_TESTS=OFF
              -DWITH_MANPAGE=OFF
              -DWITH_LIBCEPHSQLITE=ON
              -DWITH_LIBCEPHFS=ON
            )

            cmake -S . -B build "${ARGS[@]}"
        - name: build
          work-dir: ${source.dir}/ceph/build
          privileged: true
          environment:
            CCACHE_DIR: /ccache
            CCACHE_MAXSIZE: 20G
          runs: |
            set -eux -o pipefail

            ccache ninja -j"$(nproc)"
        - name: install
          work-dir: ${source.dir}/ceph/build
          runs: |
            set -eux -o pipefail

            mkdir -p "${target.dir}/usr"
            ln -s "${target.dir}/usr" "${target.dir}/usr/local"

            sed -i 's/name = "posix_local"/name = "posix_prefix"/' /usr/lib/python3.13/_distutils_system_mod.py

            DESTDIR="${target.dir}" ninja install

            SITE_PKG="${target.dir}/usr/lib/python3.13/site-packages"
            BUILD_SITE="/usr/lib/python3.13/site-packages"
            mkdir -p "${SITE_PKG}"
            for name in pytest _pytest pytest_cov pytest-cov.pth maturin flit_core wheel setuptools _distutils_hack pkg_resources distutils-precedence.pth; do
              rm -rf "${BUILD_SITE}/${name}"
            done
            for dist in pytest pytest_cov maturin flit_core wheel setuptools; do
              rm -rf "${BUILD_SITE}/${dist}"-*.dist-info
            done
            cp -r "${BUILD_SITE}"/* "${SITE_PKG}/"
            rm -f "${SITE_PKG}/README.txt" "${SITE_PKG}/dhi-distpackages.pth"

            install -d "${target.dir}/opt/docker/sbom"
            cp -a /opt/docker/sbom/ceph "${target.dir}/opt/docker/sbom/"
        - uses: dhi/build-pkg:0
          with:
            depends:
              - libaio1t64
              - libabsl20240722
