# syntax=dhi.io/build:2-debian13

image: dhi.io/pkg-notion-mcp
variant: runtime
tags:
  - 2.5.0
  - 2.5.0-r0
  - 2.5.0-debian13
  - 2.5.0-r0-debian13
platforms:
  - linux/amd64
  - linux/arm64
dates:
  release: "2025-12-24"
vars:
  COMMIT_SHA: 9beb1c352bc24a1e5c6deafa2afbac9c81ee2572
  REL: "0"
  SEMVER_MAJOR_MINOR_VERSION: "2.5"
  SEMVER_MAJOR_VERSION: "2"
  SEMVER_VERSION: 2.5.0
  VERSION: 2.5.0
contents:
  packages:
    - base-files
  builds:
    - name: notion-mcp
      work-dir: ${source.dir}/notion-mcp
      caches:
        - path: /root/.npm
      contents:
        repositories:
          - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
        keyring:
          - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
        packages:
          - bash
          - ca-certificates
          - coreutils
          - findutils
          - git
          - libc6
          - libstdc++6
          - mawk
          - nodejs-24
          - node-corepack
          - npm
          - sed
          - yarn-classic
        files:
          - url: git+https://github.com/makenotion/notion-mcp-server.git#v2.5.0
            checksum: 9beb1c352bc24a1e5c6deafa2afbac9c81ee2572
            path: ${source.dir}/notion-mcp
            spdx:
              name: notion-mcp
              version: 2.5.0
              packages:
                - name: notion-mcp
                  purl: pkg:npm/%40notionhq/notion-mcp-server@2.5.0
                  license: MIT
            uid: 0
            gid: 0
      pipeline:
        - name: bump dependencies
          uses: npm/bump@v1
          privileged: true
          environment:
            DHI_NO_SFW: "true"
            NPM_CONFIG_IGNORE_SCRIPTS: "true"
          with:
            bumps: ${source.dir}/patch/npm-bumps.json
            npm-root: ${source.dir}/notion-mcp
        - name: install and build
          privileged: true
          runs: |
            set -eux -o pipefail

            npm install
            npm run build

            rm -rf node_modules

            npm ci --ignore-scripts --omit=dev

            mkdir -p "${target.dir}/usr/lib/notion-mcp/bin" "${target.dir}/usr/lib/notion-mcp/scripts"
            cp -a bin/cli.mjs "${target.dir}/usr/lib/notion-mcp/bin/cli.mjs"
            cp -a scripts/notion-openapi.json "${target.dir}/usr/lib/notion-mcp/scripts/notion-openapi.json"
            cp -a node_modules "${target.dir}/usr/lib/notion-mcp/node_modules"
        - uses: dhi/build-pkg:0
          with:
            description: Notion MCP server (Model Context Protocol server for Notion API)
            files:
              - usr/lib/notion-mcp
            formats:
              - deb
            license: MIT
            name: notion-mcp
            rel: 0
            url: https://github.com/makenotion/notion-mcp-server
            version: 2.5.0
      paths:
        - type: file
          path: ${source.dir}/patch/npm-bumps.json
          uid: 0
          gid: 0
          source: package/main/notion-mcp/patch/npm-bumps.json
os-release:
  name: Docker Hardened Images (Debian)
  id: debian
  version-id: "13"
  version-codename: trixie
  pretty-name: Docker Hardened Images/Debian GNU/Linux 13 (trixie)
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
