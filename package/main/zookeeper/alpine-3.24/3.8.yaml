# syntax=dhi.io/build:2-alpine3.24

image: dhi.io/pkg-zookeeper
variant: runtime
tags:
  - 3.8.7-alpine3.24
  - 3.8.7-r10-alpine3.24
platforms:
  - linux/amd64
  - linux/arm64
vars:
  COMMIT_SHA: 9085db92dd679e1e90a63bfe6ae6345ab6cbc4ae
  JDK_MAJOR_VERSION: "21"
  MAVEN_REFERENCE: dhi/maven:3.10.0-jdk21-debian13-dev@sha256:0adc31a2ab0c8de549a260e13ccad83e2cb03cc5456308b6532554745669aab7
  MAVEN_VERSION: 3.10.0
  PACKAGE_HOME: /usr/share/zookeeper
  PACKAGE_NAME: zookeeper-3.8
  REL: "10"
  SEMVER_MAJOR_MINOR_VERSION: "3.8"
  SEMVER_MAJOR_VERSION: "3"
  SEMVER_VERSION: 3.8.7
  VERSION: 3.8.7
contents:
  repositories:
    - https://dhi.io/apk/alpine/v3.24/main
    - https://dhi.io/apk/alpine/v3.23/main
    - https://dl-cdn.alpinelinux.org/alpine/v3.24/main
    - https://dl-cdn.alpinelinux.org/alpine/v3.24/community
  keyring:
    - https://dhi.io/keyring/dhi-apk@docker-0F81AD7700D99184.rsa.pub
  packages:
    - alpine-baselayout-data
  builds:
    - name: zookeeper
      work-dir: ${source.dir}/zookeeper
      environment:
        JAVA_HOME: /usr/lib/jvm/temurin-21
        MAVEN_ARGS: --batch-mode --no-transfer-progress
        MAVEN_HOME: /opt/java/apache-maven-3.10.0
      caches:
        - path: /root/.m2/repository
      contents:
        packages:
          - apk-tools
          - bash
          - ca-certificates
          - coreutils
          - eclipse-temurin-21-jdk
          - findutils
          - git
          - gzip
          - net-tools
          - sed
          - tar
        files:
          - url: git+https://github.com/apache/zookeeper.git#release-3.8.7
            checksum: 9085db92dd679e1e90a63bfe6ae6345ab6cbc4ae
            path: ${source.dir}/zookeeper
            spdx:
              name: zookeeper
              version: 3.8.7
              packages:
                - name: zookeeper
                  purl: pkg:maven/org.apache.zookeeper/zookeeper@3.8.7
                  license: Apache-2.0
            uid: 0
            gid: 0
        artifacts:
          - name: dhi.io/maven:3.10.0-jdk21-debian13-dev@sha256:0adc31a2ab0c8de549a260e13ccad83e2cb03cc5456308b6532554745669aab7
            includes:
              - opt/**
              - usr/local/bin/**
            uid: 0
            gid: 0
      pipeline:
        - uses: mvn/mirror@v1
        - name: configure xq-python for the pom patch
          privileged: true
          runs: |
            set -eux -o pipefail

            apk del yq yq-go
            apk add --no-cache yq-python
            ln -sf /usr/bin/xq /usr/local/bin/xq-python
            command -v xq-python
        - name: pin vulnerable dependency versions
          uses: mvn/patch@v1
          with:
            mvn-root: ${source.dir}/zookeeper
            properties: ${source.dir}/patch/mvn-properties-3.8.json
        - name: build distribution
          privileged: true
          secrets:
            - id: maven_user
              env: MAVEN_USER
              optional: true
            - id: maven_password
              env: MAVEN_PASSWORD
              optional: true
          runs: |
            set -eux -o pipefail

            mvn clean install -DskipTests -Dmaven.javadoc.skip=true
        - name: stage distribution
          runs: |
            set -eux -o pipefail

            STAGE="${target.dir}/usr/share/zookeeper"
            mkdir -p "$STAGE"

            tar -zxf "zookeeper-assembly/target/apache-zookeeper-3.8.7-bin.tar.gz" \
              -C "$STAGE" --strip-components=1

            find "$STAGE/bin" -name '*.cmd' -delete

            rm -rf "$STAGE/docs"

            find "$STAGE/lib" \( -name '*-osx-*.jar' -o -name '*-windows-*.jar' \) -delete

            mkdir -p "${target.dir}/usr/bin"
            for cli in zkCli.sh zkServer.sh zkCleanup.sh zkServer-initialize.sh zkSnapshotComparer.sh zkSnapShotToolkit.sh zkTxnLogToolkit.sh; do
              test -f "$STAGE/bin/$cli"
              printf '#!/bin/bash\nexec %s/bin/%s "$@"\n' "/usr/share/zookeeper" "$cli" \
                > "${target.dir}/usr/bin/$cli"
              chmod 0755 "${target.dir}/usr/bin/$cli"
            done
        - name: java sbom
          uses: sbom@v1
          with:
            extra-scanners: java-archive-cataloger
            prefix: zookeeper
            source: ${target.dir}/usr/share/zookeeper
        - uses: dhi/build-pkg:0
          with:
            depends:
              - bash
              - coreutils
              - grep
              - sed
            description: Apache ZooKeeper distributed coordination service
            files:
              - usr/share/zookeeper
              - usr/bin
            license: Apache-2.0
            name: zookeeper-3.8
            rel: 10
            url: https://zookeeper.apache.org/
            version: 3.8.7
      paths:
        - type: file
          path: ${source.dir}/patch/mvn-properties-3.8.json
          uid: 0
          gid: 0
          source: package/main/zookeeper/alpine-3.24/patch/mvn-properties-3.8.json
os-release:
  name: Docker Hardened Images (Alpine)
  id: alpine
  version-id: "3.24"
  pretty-name: Docker Hardened Images/Alpine Linux v3.24
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
