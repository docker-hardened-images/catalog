// gradle/mirror@v1 rewrites repositories in settingsEvaluated, which is after
// pluginManagement and the root buildscript classpath have already requested
// repo.maven.apache.org. That request is what returns HTTP 429 in CI.
//
// This script still does not see buildscript { repositories { mavenCentral() } }
// inside a file applied with `apply from:` (Solr 9 gradle/testing/randomization.gradle).
// Those repositories live on the script classpath handler, not
// project.buildscript.repositories. The pipeline rewrites mavenCentral() in
// *.gradle to the GCS mirror before ./gradlew. Keep this script for
// repositories added later in project evaluation.
def mavenCentralMirror = uri("https://maven-central.storage-download.googleapis.com/maven2/")

def mirrorMavenCentral = { repo ->
    if (repo instanceof org.gradle.api.artifacts.repositories.MavenArtifactRepository) {
        def url = repo.url.toString()
        if (url.startsWith("https://repo.maven.apache.org/maven2")
                || url.startsWith("https://repo1.maven.org/maven2")) {
            repo.setUrl(mavenCentralMirror)
        }
    }
}

beforeSettings { settings ->
    settings.pluginManagement.repositories.whenObjectAdded(mirrorMavenCentral)
    // The Plugin Portal hosts plugin marker artifacts that Maven Central does
    // not. Keep it available after putting the Central mirror first so plugins
    // such as com.palantir.consistent-versions can still resolve.
    settings.pluginManagement.repositories.maven {
        name = "GCS Maven Central mirror"
        url = mavenCentralMirror
    }
    settings.pluginManagement.repositories.gradlePluginPortal()
}

settingsEvaluated { settings ->
    settings.pluginManagement.repositories.configureEach(mirrorMavenCentral)
    settings.dependencyResolutionManagement.repositories.configureEach(mirrorMavenCentral)
    settings.dependencyResolutionManagement.repositories.whenObjectAdded(mirrorMavenCentral)
}

// The root buildscript classpath is resolved while build.gradle is evaluated.
// allprojects runs too late for repositories declared in that block, so attach
// the repository listeners before Gradle starts evaluating each project.
gradle.beforeProject { project ->
    project.buildscript.repositories.configureEach(mirrorMavenCentral)
    project.buildscript.repositories.whenObjectAdded(mirrorMavenCentral)
    project.repositories.configureEach(mirrorMavenCentral)
    project.repositories.whenObjectAdded(mirrorMavenCentral)
}

allprojects {
    buildscript.repositories.configureEach(mirrorMavenCentral)
    buildscript.repositories.whenObjectAdded(mirrorMavenCentral)
    repositories.configureEach(mirrorMavenCentral)
    repositories.whenObjectAdded(mirrorMavenCentral)
}
