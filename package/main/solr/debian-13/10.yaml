# syntax=dhi.io/build:2-debian13

image: dhi.io/pkg-solr
variant: runtime
tags:
  - 10.1.0
  - 10.1.0-r0
  - 10.1.0-debian13
  - 10.1.0-r0-debian13
platforms:
  - linux/amd64
  - linux/arm64
dates:
  release: "2026-03-03"
vars:
  COMMIT_SHA: 749712b71940c9f96d824c533f32f5c56dcd3924
  GRADLE_VERSION: 8.14.6-1
  JDK_MAJOR_VERSION: "21"
  JDK_VERSION: 1:21.0.13+9-2
  PACKAGE_HOME: /usr/share/solr
  PACKAGE_NAME: solr-10
  REL: "0"
  SEMVER_MAJOR_MINOR_VERSION: "10.1"
  SEMVER_MAJOR_VERSION: "10"
  SEMVER_VERSION: 10.1.0
  VERSION: 10.1.0
contents:
  repositories:
    - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
  keyring:
    - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
  packages:
    - base-files
  builds:
    - name: solr-10
      work-dir: ${source.dir}/solr
      environment:
        GRADLE_USER_HOME: /root/.gradle
        JAVA_HOME: /usr/lib/jvm/temurin-21
      caches:
        - path: /root/.gradle/caches
        - path: /root/.gradle/wrapper
      contents:
        packages:
          - bash
          - ca-certificates
          - curl
          - coreutils
          - findutils
          - grep
          - gzip
          - libstdc++6
          - patch
          - sed
          - tar
          - eclipse-temurin-21-jdk=1:21.0.13+9-2
          - gradle-8=8.14.6-1
        files:
          - url: git+https://github.com/apache/solr.git#releases/solr/10.1.0
            checksum: 749712b71940c9f96d824c533f32f5c56dcd3924
            path: ${source.dir}/solr
            spdx:
              name: solr
              version: 10.1.0
              packages:
                - name: solr
                  purl: pkg:github/apache/solr@10.1.0
                  license: Apache-2.0
            uid: 0
            gid: 0
      pipeline:
        - name: strip develocity
          runs: |
            set -eux -o pipefail

            sed -i \
              -e "/id 'com\.gradle\.develocity'/d" \
              -e "/id 'com\.gradle\.common-custom-user-data-gradle-plugin'/d" \
              -e "/apply from: file('gradle\/develocity\.gradle')/d" \
              settings.gradle
            sed -i \
              -e "/apply from: file('gradle\/testing\/retry-test\.gradle')/d" \
              build.gradle
        - name: apply jetty test http compliance patch
          uses: git/patch@v1
          with:
            patch: ${source.dir}/patch/jetty-test-http-compliance.patch
        - name: skip missing-doclet composite build for packaging
          runs: |
            set -eux -o pipefail

            sed -i 's/^[[:space:]]*includeBuild("build-tools\/missing-doclet")/\/\/ DHI package build: missing-doclet is doc-only tooling/' settings.gradle
            grep -q 'missing-doclet is doc-only tooling' settings.gradle
        - name: skip placement sysload test in containers
          runs: |
            set -eux -o pipefail

            file=solr/core/src/test/org/apache/solr/cluster/placement/impl/PlacementPluginIntegrationTest.java
            marker='SYSLOAD_AVG node metric is unavailable in nested DHI package build containers'
            if ! grep -q "$marker" "$file"; then
              sed -i '/import org.junit.BeforeClass;/a import org.junit.Ignore;' "$file"
              perl -i -0pe \
                's/  \@Test\n  public void testAttributeFetcherImpl\(\)/  \@Ignore("'"${marker}"'")\n  public void testAttributeFetcherImpl()/s' \
                "$file"
              grep -q "$marker" "$file"
            fi
        - name: mirror gradle repositories
          uses: gradle/mirror@v1
        - name: apply cve dependency remediation (10.x)
          uses: git/patch@v1
          with:
            patch: ${source.dir}/patch/cve-remediation-10.patch
        - name: rewrite mavenCentral to the gcs mirror
          runs: |
            set -eux -o pipefail

            MIRROR='https://maven-central.storage-download.googleapis.com/maven2/'
            find . -type f -name '*.gradle' -print0 | xargs -0 sed -i \
              -e "s|mavenCentral()|maven { url '${MIRROR}' }|g" \
              -e "s|gradlePluginPortal()|maven { url '${MIRROR}' }; gradlePluginPortal()|g"
            if grep -R --include='*.gradle' -n 'mavenCentral()' .; then
              echo "mavenCentral() remains after the mirror rewrite" >&2
              exit 1
            fi
        - name: unit tests
          privileged: true
          secrets:
            - id: maven_user
              env: MAVEN_USER
              optional: true
            - id: maven_password
              env: MAVEN_PASSWORD
              optional: true
          runs: |
            set -eux -o pipefail

            export GRADLE_HOME="/usr/share/java/gradle"
            export PATH="${GRADLE_HOME}/bin:${JAVA_HOME}/bin:${PATH}"
            export SOLR_MAVEN_REPO_URL="https://maven-central.storage-download.googleapis.com/maven2/"

            ./gradlew \
              --init-script ${source.dir}/dhi-maven-central.init.gradle \
              -Pversion.release=10.1.0 \
              :solr:core:test \
              :solr:solrj:test \
              --no-daemon \
              --console=plain \
              --warning-mode=summary
        - name: build solr distribution
          privileged: true
          secrets:
            - id: maven_user
              env: MAVEN_USER
              optional: true
            - id: maven_password
              env: MAVEN_PASSWORD
              optional: true
          runs: |
            set -eux -o pipefail

            export GRADLE_HOME="/usr/share/java/gradle"
            export PATH="${GRADLE_HOME}/bin:${JAVA_HOME}/bin:${PATH}"
            export SOLR_MAVEN_REPO_URL="https://maven-central.storage-download.googleapis.com/maven2/"

            ./gradlew \
              --init-script ${source.dir}/dhi-maven-central.init.gradle \
              -Pversion.release=10.1.0 \
              :solr:packaging:assemble \
              --no-daemon \
              --console=plain \
              --warning-mode=summary
        - name: extract distribution
          runs: |
            set -eux -o pipefail

            mkdir -p "${target.dir}/usr/share/solr"
            tarball=$(find solr/packaging/build/distributions -maxdepth 1 -name "solr-*.tgz" ! -name "*-src.tgz" ! -name "*-slim.tgz" -print -quit)
            test -n "$tarball"
            tar -xzf "$tarball" --strip-components=1 -C "${target.dir}/usr/share/solr"
            rm -rf \
              "${target.dir}/usr/share/solr/modules" \
              "${target.dir}/usr/share/solr/prometheus-exporter" \
              "${target.dir}/usr/share/solr/cross-dc-manager"

            mkdir -p "${target.dir}/etc/default"
            cp "${target.dir}/usr/share/solr/bin/solr.in.sh" "${target.dir}/etc/default/solr.in.sh"
        - uses: dhi/build-pkg:0
          with:
            depends:
              - bash
              - coreutils
              - eclipse-temurin-21-jre
              - procps
            description: Apache Solr search platform
            files:
              - usr/share/solr
              - etc/default
            formats:
              - deb
            license: Apache-2.0
            name: solr-10
            rel: 0
            url: https://solr.apache.org/
            version: 10.1.0
      paths:
        - type: file
          path: ${source.dir}/dhi-maven-central.init.gradle
          uid: 0
          gid: 0
          mode: "0644"
          source: package/main/solr/files/dhi-maven-central.init.gradle
        - type: file
          path: ${source.dir}/patch/jetty-test-http-compliance.patch
          uid: 0
          gid: 0
          source: package/main/solr/patch/jetty-test-http-compliance.patch
        - type: file
          path: ${source.dir}/patch/cve-remediation-10.patch
          uid: 0
          gid: 0
          source: package/main/solr/patch/cve-remediation-10.patch
os-release:
  name: Docker Hardened Images (Debian)
  id: debian
  version-id: "13"
  version-codename: trixie
  pretty-name: Docker Hardened Images/Debian GNU/Linux 13 (trixie)
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
