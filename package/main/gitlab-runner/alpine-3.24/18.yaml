              - go.opentelemetry.io/otel@v1.44.0
              - google.golang.org/grpc@v1.83.2
            download: true
        - name: test after bump
          privileged: true
          runs: |
            set -eux -o pipefail

            CGO_ENABLED=0 go test -run='^$' ./...
        - name: build gitlab-runner
          uses: go/build@v1
          with:
            fips: false
            ldflags:
              - -X gitlab.com/gitlab-org/gitlab-runner/common.NAME=gitlab-runner
              - -X gitlab.com/gitlab-org/gitlab-runner/common.VERSION=18.11.4
              - -w
            output: ${target.dir}/usr/bin/gitlab-runner
            packages: .
        - name: build gitlab-runner dev
          uses: go/build@v1
          with:
            fips: false
            ldflags:
              - -X gitlab.com/gitlab-org/gitlab-runner/common.NAME=gitlab-runner
              - -X gitlab.com/gitlab-org/gitlab-runner/common.VERSION=18.11.4
              - -w
            output: ${target.dir}/usr/bin/gitlab-runner-dev
            packages: .
            strip: false
        - name: build docker-machine
          uses: go/build@v1
          work-dir: /go/src/github.com/docker/machine
          with:
            fips: false
            ldflags:
              - -X github.com/docker/machine/version.GitCommit=497fb7cdce6c5129fce8117f0591c3a36fe4cf88
              - -w
            output: ${target.dir}/usr/bin/docker-machine
            packages: ./cmd/docker-machine
            tags:
              - static_build
              - netgo
        - name: build docker-machine dev
          uses: go/build@v1
          work-dir: /go/src/github.com/docker/machine
          with:
            fips: false
            ldflags:
              - -X github.com/docker/machine/version.GitCommit=497fb7cdce6c5129fce8117f0591c3a36fe4cf88
              - -w
            output: ${target.dir}/usr/bin/docker-machine-dev
            packages: ./cmd/docker-machine
            strip: false
            tags:
              - static_build
              - netgo
        - uses: dhi/build-pkg:0
          with:
            description: GitLab Runner executes CI/CD jobs for GitLab
            files:
              - usr/bin/gitlab-runner
              - usr/bin/docker-machine
            license: MIT
            name: gitlab-runner-18
            rel: 5
            subpackages:
              - files:
                  - path: usr/bin/gitlab-runner
                    source: usr/bin/gitlab-runner-dev
                  - path: usr/bin/docker-machine
                    source: usr/bin/docker-machine-dev
                name: gitlab-runner-18-dev
            url: https://gitlab.com/gitlab-org/gitlab-runner
            version: 18.11.4
      paths:
        - type: file
          path: ${source.dir}/patch/go-1.26-vet.patch
          uid: 0
          gid: 0
          source: package/main/gitlab-runner/patch/go-1.26-vet.patch
