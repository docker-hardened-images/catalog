# syntax=dhi.io/build:2-debian13

image: dhi.io/pkg-meilisearch
variant: runtime
tags:
  - 1.53.1-0
  - 1.53.1-0-debian13
platforms:
  - linux/amd64
  - linux/arm64
vars:
  CARGO_VERSION: 1.97.1-0
  COMMIT_SHA: 577f7af28942b71782eab1e59f44ad8296ce0a92
  DHI_REL: "0"
  DHI_VERSION: 1.53.1-0
  RUSTC_VERSION: 1.97.1-0
  VERSION: 1.53.1
contents:
  packages:
    - '!base-files'
  builds:
    - name: meilisearch deb
      work-dir: ${source.dir}/meilisearch
      environment:
        COMMIT_SHA: 577f7af28942b71782eab1e59f44ad8296ce0a92
        VERSION: 1.53.1
      caches:
        - path: /root/.cargo
      contents:
        repositories:
          - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
        keyring:
          - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
        packages:
          - bash
          - build-essential
          - cargo-1.97=1.97.1-0
          - ca-certificates
          - coreutils
          - findutils
          - gawk
          - git
          - debhelper
          - dpkg-dev
          - libssl-dev
          - pkg-config
          - rustc-1.97=1.97.1-0
          - sed
        files:
          - url: git+https://github.com/meilisearch/meilisearch.git#v1.53.1
            checksum: 577f7af28942b71782eab1e59f44ad8296ce0a92
            path: ${source.dir}/meilisearch/src
            spdx:
              name: meilisearch
              version: 1.53.1
              packages:
                - name: meilisearch
                  purl: pkg:cargo/meilisearch@1.53.1
                  license: MIT
                - name: meilitool
                  purl: pkg:cargo/meilitool@1.53.1
                  license: MIT
            uid: 0
            gid: 0
      pipeline:
        - name: bump cargo dependencies
          work-dir: ${source.dir}/meilisearch/src
          privileged: true
          runs: |
            set -eux -o pipefail
            sed -i 's/rusty-s3 = "0.8.1"/rusty-s3 = "0.10.0"/' crates/index-scheduler/Cargo.toml
            cargo update -p rusty-s3
            cargo update --package tar --precise 0.4.46
            cargo update --package rkyv --precise 0.7.46
            cargo update --package quinn-proto --precise 0.11.15
            cargo update --package memmap2 --precise 0.9.11
            cargo update --package anyhow --precise 1.0.103
            cargo update --package crossbeam-epoch --precise 0.9.20
            cargo update --package h2@0.4.14 --precise 0.4.16
        - name: cargo sbom
          uses: sbom@v1
          with:
            extra-scanners: rust-cargo-lock-cataloger
            prefix: meilisearch-cargo
            source: ${source.dir}/meilisearch/src
        - uses: dpkg/bump@v1
          with:
            changelog:
              - DHI Build
            version: 1.53.1-0
        - uses: dpkg/build@v1
          privileged: true
          with:
            args: -b -uc -us -d
      paths:
        - type: directory
          path: ${source.dir}/meilisearch/debian
          uid: 0
          gid: 0
          mode: "0600"
          source: package/main/meilisearch/debian-13/debian
os-release:
  name: Docker Hardened Images (Debian)
  id: debian
  version-id: "13"
  version-codename: trixie
  pretty-name: Docker Hardened Images/Debian GNU/Linux 13 (trixie)
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
