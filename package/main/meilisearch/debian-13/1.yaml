      environment:
        COMMIT_SHA: 36dabf361a17c223e91cadc8ecf0378e90affc4b
        VERSION: 1.58.0
      caches:
        - path: /root/.cargo
      contents:
        repositories:
          - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
        keyring:
          - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
        packages:
          - bash
          - build-essential
          - cargo=1.100.0-4
          - ca-certificates
          - coreutils
          - findutils
          - gawk
          - git
          - debhelper
          - dpkg-dev
          - libssh2-1t64
          - libssl-dev
          - pkg-config
          - rustc=1.100.0-4
          - sed
        files:
          - url: git+https://github.com/meilisearch/meilisearch.git#v1.58.0
            checksum: 36dabf361a17c223e91cadc8ecf0378e90affc4b
            path: ${source.dir}/meilisearch/src
            spdx:
              name: meilisearch
              version: 1.58.0
              packages:
