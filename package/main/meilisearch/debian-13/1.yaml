                  purl: pkg:cargo/meilisearch@1.58.0
                  license: MIT
                - name: meilitool
                  purl: pkg:cargo/meilitool@1.58.0
                  license: MIT
            uid: 0
            gid: 0
      pipeline:
        - name: bump cargo dependencies
          uses: cargo/bump@v1
          work-dir: ${source.dir}/meilisearch/src
          with:
            bumps: ${source.dir}/meilisearch/patch/cargo-bumps.json
        - name: cargo sbom
          uses: sbom@v1
          with:
            extra-scanners: rust-cargo-lock-cataloger
            prefix: meilisearch-cargo
            source: ${source.dir}/meilisearch/src
        - uses: dpkg/bump@v1
          with:
            changelog:
              - DHI Build
            version: 1.58.0-3
        - uses: dpkg/build@v1
          privileged: true
          with:
            args: -b -uc -us -d
      paths:
        - type: directory
          path: ${source.dir}/meilisearch/debian
          uid: 0
          gid: 0
          mode: "0600"
          source: package/main/meilisearch/debian-13/debian
        - type: file
          path: ${source.dir}/meilisearch/patch/cargo-bumps.json
          uid: 0
          gid: 0
          source: package/main/meilisearch/patch/cargo-bumps.json
os-release:
  name: Docker Hardened Images (Debian)
  id: debian
  version-id: "13"
