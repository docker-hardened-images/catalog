image: dhi.io/pkg-meilisearch
variant: runtime
tags:
  - 1.58.0-3
  - 1.58.0-3-debian13
platforms:
  - linux/amd64
  - linux/arm64
vars:
  CARGO_VERSION: 1.100.0-4
  COMMIT_SHA: 36dabf361a17c223e91cadc8ecf0378e90affc4b
  DHI_REL: "3"
  DHI_VERSION: 1.58.0-3
  RUSTC_VERSION: 1.100.0-4
  VERSION: 1.58.0
contents:
  repositories:
    - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
  keyring:
    - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
  packages:
    - '!base-files'
  builds:
    - name: meilisearch deb
