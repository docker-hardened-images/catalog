# syntax=dhi.io/build:2-alpine3.24

image: dhi.io/pkg-debezium
variant: runtime
tags:
  - 3.7.0-alpine3.24
  - 3.7.0-r0-alpine3.24
platforms:
  - linux/amd64
  - linux/arm64
dates:
  release: "2026-09-29"
vars:
  COMMIT_SHA: 17843f309f75a8035d972296e38ed742a3ea2a07
  FINAL_VERSION: 3.7.0.Final
  JDBC_MVN_PROPERTIES: jdbc-mvn-properties-3.7.json
  MAVEN_REFERENCE: dhi/maven:3.10.0-jdk21-debian13-dev@sha256:e589a1bddb62a836f6e0e321fe8b4aed9306189259df109937facaf3aa680e8f
  PACKAGE_NAME: debezium-3.7
  REL: "0"
  SEMVER_MAJOR_MINOR_VERSION: "3.7"
  SEMVER_MAJOR_VERSION: "3"
  SEMVER_VERSION: 3.7.0
  VERSION: 3.7.0
contents:
  repositories:
    - https://dhi.io/apk/alpine/v3.24/main
    - https://dhi.io/apk/alpine/v3.23/main
    - https://dl-cdn.alpinelinux.org/alpine/v3.24/main
    - https://dl-cdn.alpinelinux.org/alpine/v3.24/community
  keyring:
    - https://dhi.io/keyring/dhi-apk@docker-0F81AD7700D99184.rsa.pub
  packages:
    - alpine-baselayout-data
  builds:
    - name: debezium
      uses: dhi.io/maven:3.10.0-jdk21-debian13-dev@sha256:e589a1bddb62a836f6e0e321fe8b4aed9306189259df109937facaf3aa680e8f
      work-dir: ${source.dir}/debezium
      environment:
        MAVEN_ARGS: --batch-mode --no-transfer-progress
      caches:
        - path: /root/.m2/repository
      contents:
        packages:
          - bash
          - ca-certificates
          - coreutils
          - gzip
        files:
          - url: git+https://github.com/debezium/debezium.git#v3.7.0.Final
            checksum: 17843f309f75a8035d972296e38ed742a3ea2a07
            path: ${source.dir}/debezium
            spdx:
              name: debezium
              version: 3.7.0.Final
              packages:
                - name: debezium-connector-mysql
                  purl: pkg:maven/io.debezium/debezium-connector-mysql@3.7.0.Final
                  license: Apache-2.0
                - name: debezium-connector-mariadb
                  purl: pkg:maven/io.debezium/debezium-connector-mariadb@3.7.0.Final
                  license: Apache-2.0
                - name: debezium-connector-postgres
                  purl: pkg:maven/io.debezium/debezium-connector-postgres@3.7.0.Final
                  license: Apache-2.0
                - name: debezium-connector-mongodb
                  purl: pkg:maven/io.debezium/debezium-connector-mongodb@3.7.0.Final
                  license: Apache-2.0
                - name: debezium-connector-sqlserver
                  purl: pkg:maven/io.debezium/debezium-connector-sqlserver@3.7.0.Final
                  license: Apache-2.0
                - name: debezium-connector-oracle
                  purl: pkg:maven/io.debezium/debezium-connector-oracle@3.7.0.Final
                  license: Apache-2.0
                - name: debezium-connector-jdbc
                  purl: pkg:maven/io.debezium/debezium-connector-jdbc@3.7.0.Final
                  license: Apache-2.0
                - name: debezium-scripting
                  purl: pkg:maven/io.debezium/debezium-scripting@3.7.0.Final
                  license: Apache-2.0
            uid: 0
            gid: 0
      pipeline:
        - uses: mvn/mirror@v1
          environment:
            MAVEN_MIRROR_OF: '*,!confluent,!ossrh'
        - name: use maven central when mirror credentials are absent
          secrets:
            - id: maven_user
              env: MAVEN_USER
              optional: true
            - id: maven_password
              env: MAVEN_PASSWORD
              optional: true
          runs: |
            set -eux -o pipefail

            if [ -z "${MAVEN_USER:-}" ] || [ -z "${MAVEN_PASSWORD:-}" ]; then
              rm -f /root/.m2/settings.xml
            fi
        - name: install xq-python for pom patch
          privileged: true
          runs: |
            set -eux -o pipefail

            apt-get update -qq
            apt-get install -y -qq yq
            command -v xq-python
        - name: remove oracle xstream support from the assembly profile
          runs: |
            set -eux -o pipefail

            xq-python -x '.project.profiles.profile |= map(
              if .id == "assembly" then
                del(.dependencies) |
                .build.plugins.plugin |= map(select(.artifactId != "maven-compiler-plugin"))
              else
                .
              end
            )' debezium-connector-oracle/pom.xml > /tmp/oracle-pom.xml.patched
            mv /tmp/oracle-pom.xml.patched debezium-connector-oracle/pom.xml
        - name: disable central-publishing build extension
          runs: |
            set -eux -o pipefail

            test "$(grep -c '<extensions>true</extensions>' pom.xml)" = "1"
            sed -i '\|<extensions>true</extensions>|d' pom.xml
            test "$(grep -c '<extensions>true</extensions>' pom.xml)" = "0"
        - name: patch maven dependencies
          uses: mvn/patch@v1
          with:
            dependencies: ${source.dir}/patch/mvn-dependencies.json
            dependencies-key: dependencyManagement.dependencies
            mvn-root: ${source.dir}/debezium
            properties: ${source.dir}/patch/mvn-properties.json
        - name: patch debezium-connector-jdbc maven dependencies
          uses: mvn/patch@v1
          with:
            mvn-root: ${source.dir}/debezium/debezium-connector-jdbc
            properties: ${source.dir}/patch/jdbc-mvn-properties-3.7.json
        - name: patch debezium-connector-oracle netty-transport-native-epoll
          runs: |
            set -eux -o pipefail

            xq-python -x '.project.dependencyManagement.dependencies.dependency = [
              {"groupId": "io.netty", "artifactId": "netty-transport-native-epoll", "classifier": "linux-x86_64", "version": "4.1.137.Final"},
              {"groupId": "io.netty", "artifactId": "netty-transport-native-epoll", "classifier": "linux-aarch_64", "version": "4.1.137.Final"}
            ]' debezium-connector-oracle/pom.xml > /tmp/oracle-pom.xml.patched
            mv /tmp/oracle-pom.xml.patched debezium-connector-oracle/pom.xml
        - name: install prerequisites
          privileged: true
          secrets:
            - id: maven_user
              env: MAVEN_USER
              optional: true
            - id: maven_password
              env: MAVEN_PASSWORD
              optional: true
          runs: |
            set -eux -o pipefail

            mvn install -B -Dmaven.test.skip=true -Ddocker.skip=true -DskipITs=true \
              -pl debezium-connector-mysql,debezium-connector-mariadb,debezium-connector-postgres,debezium-connector-mongodb,debezium-connector-sqlserver,debezium-connector-oracle,debezium-connector-jdbc,debezium-scripting/debezium-scripting \
              -am \
              -Dmaven.javadoc.skip=true
        - name: test
          privileged: true
          secrets:
            - id: maven_user
              env: MAVEN_USER
              optional: true
            - id: maven_password
              env: MAVEN_PASSWORD
              optional: true
          runs: |
            set -eux -o pipefail

            mvn test -B \
              -pl debezium-connector-mysql,debezium-connector-mariadb,debezium-connector-postgres,debezium-connector-mongodb,debezium-connector-sqlserver,debezium-connector-oracle,debezium-connector-jdbc,debezium-scripting/debezium-scripting \
              -Dtest='!*IT,!*EventRouterTest,!*KafkaSchemaHistoryTest' \
              -Dsurefire.failIfNoSpecifiedTests=false \
              -Dmaven.javadoc.skip=true
        - name: build
          privileged: true
          secrets:
            - id: maven_user
              env: MAVEN_USER
              optional: true
            - id: maven_password
              env: MAVEN_PASSWORD
              optional: true
          runs: |
            set -eux -o pipefail

            mvn package -B -Dmaven.test.skip=true \
              -pl debezium-connector-mysql,debezium-connector-mariadb,debezium-connector-postgres,debezium-connector-mongodb,debezium-connector-sqlserver,debezium-connector-oracle,debezium-connector-jdbc,debezium-scripting/debezium-scripting \
              -am \
              -Passembly \
              -Dmaven.javadoc.skip=true
        - name: stage connector plugins
          runs: |
            set -eux -o pipefail

            for module in debezium-connector-mysql debezium-connector-mariadb debezium-connector-postgres \
              debezium-connector-mongodb debezium-connector-sqlserver debezium-connector-oracle \
              debezium-connector-jdbc; do
              archive_count=$(find "${module}/target" -maxdepth 1 -name "*.tar.gz" | wc -l)
              if [ "$archive_count" -ne 1 ]; then
                echo "expected exactly one plugin archive for ${module}, found ${archive_count}" >&2
                exit 1
              fi
              archive=$(find "${module}/target" -maxdepth 1 -name "*.tar.gz" -print -quit)
              dest="${target.dir}/usr/share/kafka/connect/${module}"
              install -d "$dest"
              tar -xzf "$archive" --strip-components=1 -C "$dest"
            done

            scripting_archive_count=$(find "debezium-scripting/debezium-scripting/target" -maxdepth 1 -name "*.tar.gz" | wc -l)
            if [ "$scripting_archive_count" -ne 1 ]; then
              echo "expected exactly one plugin archive for debezium-scripting, found ${scripting_archive_count}" >&2
              exit 1
            fi
            scripting_archive=$(find "debezium-scripting/debezium-scripting/target" -maxdepth 1 -name "*.tar.gz" -print -quit)
            scripting_dest="${target.dir}/usr/share/kafka/connect/debezium-scripting"
            install -d "$scripting_dest"
            tar -xzf "$scripting_archive" --strip-components=1 -C "$scripting_dest"
        - name: debezium sbom
          uses: sbom@v1
          with:
            extra-scanners: java-archive-cataloger
            prefix: debezium-maven
            source: ${target.dir}/usr/share/kafka/connect
        - uses: dhi/build-pkg:0
          with:
            depends:
              - bash
              - ca-certificates
              - coreutils
            description: Debezium change data capture connector for MySQL (Kafka Connect plugin)
            files:
              - usr/share/kafka/connect/debezium-connector-mysql
            formats:
              - apk
            license: Apache-2.0
            name: debezium-3.7-connector-mysql
            rel: 0
            subpackages:
              - files:
                  - path: usr/share/kafka/connect/debezium-connector-mariadb
                name: debezium-3.7-connector-mariadb
              - files:
                  - path: usr/share/kafka/connect/debezium-connector-postgres
                name: debezium-3.7-connector-postgres
              - files:
                  - path: usr/share/kafka/connect/debezium-connector-mongodb
                name: debezium-3.7-connector-mongodb
              - files:
                  - path: usr/share/kafka/connect/debezium-connector-sqlserver
                name: debezium-3.7-connector-sqlserver
              - files:
                  - path: usr/share/kafka/connect/debezium-connector-oracle
                name: debezium-3.7-connector-oracle
              - files:
                  - path: usr/share/kafka/connect/debezium-connector-jdbc
                name: debezium-3.7-connector-jdbc
              - files:
                  - path: usr/share/kafka/connect/debezium-scripting
                name: debezium-3.7-scripting
            url: https://debezium.io/
            version: 3.7.0
      paths:
        - type: file
          path: ${source.dir}/patch/mvn-dependencies.json
          uid: 0
          gid: 0
          source: package/main/debezium/patch/mvn-dependencies.json
        - type: file
          path: ${source.dir}/patch/mvn-properties.json
          uid: 0
          gid: 0
          source: package/main/debezium/patch/mvn-properties.json
        - type: file
          path: ${source.dir}/patch/jdbc-mvn-properties.json
          uid: 0
          gid: 0
          source: package/main/debezium/patch/jdbc-mvn-properties.json
        - type: file
          path: ${source.dir}/patch/jdbc-mvn-properties-3.7.json
          uid: 0
          gid: 0
          source: package/main/debezium/patch/jdbc-mvn-properties-3.7.json
os-release:
  name: Docker Hardened Images (Alpine)
  id: alpine
  version-id: "3.24"
  pretty-name: Docker Hardened Images/Alpine Linux v3.24
