              test -n "$files"
              printf '%s\n' "$files" | awk '!/\// && /^(LICENSE|LICENCE|COPYING)/ {ok=1} END {exit !ok}'
              joined=$(printf '%s\n' "$files" | awk 'NR > 1 {printf ","} {printf "%s", $0}')
              hash=$(cd "$dir" && printf '%s\n' "$files" | xargs sha256sum | sha256sum | cut -d' ' -f1)
              printf '%s\t%s\t%s\n' "$m" "$joined" "$hash" >> "$out/rows"
              printf '%s\n' "$files" | while read -r f; do
                install -D -m 0644 "$dir/$f" "${target.dir}/usr/share/licenses/metallb-frr-k8s/third_party/$m/$f"
              done
            done < "$out/modules"

            awk -F'\t' '$0 !~ /^#/ && NF == 4 {print $1 "\t" $3 "\t" $4}' "${source.dir}/third-party-licenses.tsv" | LC_ALL=C sort > "$out/expected"
