            mkdir -p "$out"
            export GOPROXY=off

            for b in "${target.dir}/usr/bin/frr-k8s" "${target.dir}/usr/bin/statuscleaner" "${target.dir}/usr/lib/metallb-frr-k8s/frr-metrics" "${target.dir}/usr/lib/metallb-frr-k8s/frr-status" "${target.dir}/usr/bin/frr-k8s-dev" "${target.dir}/usr/bin/statuscleaner-dev" "${target.dir}/usr/lib/metallb-frr-k8s/frr-metrics-dev" "${target.dir}/usr/lib/metallb-frr-k8s/frr-status-dev"; do
