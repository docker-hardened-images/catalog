      pipeline:
        - name: stage DHI Gradle CVE overrides init script
          work-dir: ${source.dir}
          runs: |
            set -eux -o pipefail

            cp "${source.dir}/patch/overrides.gradle" \
              "${source.dir}/dhi-overrides.init.gradle"
            mkdir -p "$HOME/.gradle"
            cp "${source.dir}/dhi-overrides.init.gradle" "$HOME/.gradle/init.gradle"
        - name: patch OpenSearch buildSrc Maven mirror
          uses: git/patch@v1
          work-dir: ${source.dir}/OpenSearch
          with:
            patch: ${source.dir}/patch/buildsrc-maven-mirror.patch
        - name: patch OpenSearch HttpComponents catalog versions
          uses: git/patch@v1
          work-dir: ${source.dir}/OpenSearch
          with:
            patch: ${source.dir}/patch/libs-versions-httpcomponents.patch
        - name: patch OpenSearch IDE Gradle Maven mirror
          uses: git/patch@v1
          work-dir: ${source.dir}/OpenSearch
          with:
            patch: ${source.dir}/patch/ide-gradle-maven-mirror.patch
        - name: patch repository-hdfs Kerberos fixture evaluation
          uses: git/patch@v1
          work-dir: ${source.dir}/OpenSearch
          with:
            patch: ${source.dir}/patch/repository-hdfs-krb5-fixture-evaluation.patch
        - name: patch opensearch-learning-to-rank-base plugin
          uses: git/patch@v1
          work-dir: ${source.dir}/opensearch-learning-to-rank-base
          with:
            patch: ${source.dir}/patch/plugin-ltr.patch
        - name: patch query-insights plugin
          uses: git/patch@v1
          work-dir: ${source.dir}/query-insights
          with:
            patch: ${source.dir}/patch/plugin-query-insights.patch
        - name: build OpenSearch core
          work-dir: ${source.dir}/OpenSearch
          privileged: true
          runs: |
            set -eux -o pipefail

            export GRADLE_HOME="/usr/share/java/gradle"
            export JAVA_HOME="/usr/lib/jvm/temurin-21"
            export PATH="${GRADLE_HOME}/bin:${JAVA_HOME}/bin:${PATH}"

            dhi-gradle publishToMavenLocal -Dbuild.snapshot=false -Dopensearch.version=3.8.0
            dhi-gradle :build-tools:publishToMavenLocal -Dbuild.snapshot=false -Dopensearch.version=3.8.0

            FIPS_GRADLE_FLAG=""
            if [ "${target.fips}" != "true" ]; then
              FIPS_GRADLE_FLAG="-Pcrypto.standard=FIPS-140-3"
            fi
            dhi-gradle localDistro -Dbuild.snapshot=false -Dopensearch.version=3.8.0 ${FIPS_GRADLE_FLAG}

            rm -r "${source.dir}/OpenSearch/build/distribution/local/opensearch-3.8.0/jdk"
        - name: build OpenSearch plugin utils
          work-dir: ${source.dir}/common-utils
          privileged: true
          runs: |
            set -eux -o pipefail

            export GRADLE_HOME="/usr/share/java/gradle"
            export JAVA_HOME="/usr/lib/jvm/temurin-21"
            export PATH="${GRADLE_HOME}/bin:${JAVA_HOME}/bin:${PATH}"

            dhi-gradle build -Dbuild.snapshot=false -Dopensearch.version=3.8.0
            dhi-gradle publishToMavenLocal -Dbuild.snapshot=false -Dopensearch.version=3.8.0
        - name: build opensearch-remote-metadata-sdk
          work-dir: ${source.dir}/opensearch-remote-metadata-sdk
          privileged: true
          runs: |
            set -eux -o pipefail

            export GRADLE_HOME="/usr/share/java/gradle"
            export JAVA_HOME="/usr/lib/jvm/temurin-21"
            export PATH="${GRADLE_HOME}/bin:${JAVA_HOME}/bin:${PATH}"

            dhi-gradle build -Dbuild.snapshot=false -Dopensearch.version=3.8.0
            dhi-gradle publishToMavenLocal -Dbuild.snapshot=false -Dopensearch.version=3.8.0
        - name: build plugins
          privileged: true
          runs: |
            set -eux -o pipefail

            export GRADLE_HOME="/usr/share/java/gradle"
            export JAVA_HOME="/usr/lib/jvm/temurin-21"
            export PATH="${GRADLE_HOME}/bin:${JAVA_HOME}/bin:${PATH}"

            plugins=(
              alerting
              anomaly-detection
              asynchronous-search
              cross-cluster-replication
              custom-codecs
              flow-framework
              geospatial
              index-management
              job-scheduler
              k-NN
              ml-commons
              neural-search
              notifications/notifications
              observability
              opensearch-learning-to-rank-base
              opensearch-system-templates
              performance-analyzer
              query-insights
              reporting
              search-relevance
              security
              security-analytics
              skills
              sql
              user-behavior-insights
            )

            FIPS_GRADLE_FLAG=""
            if [ "${target.fips}" != "true" ]; then
              FIPS_GRADLE_FLAG="-Pcrypto.standard=FIPS-140-3"
            fi

            for plugindir in "${plugins[@]}"; do
              cd ${source.dir}/${plugindir}
              dhi-gradle assemble -Dbuild.snapshot=false -Dopensearch.version=3.8.0 ${FIPS_GRADLE_FLAG}
            done
        - name: assemble opensearch distribution
          runs: |
            set -eux -o pipefail

            install -d "${target.dir}/usr/share"
            mv "${source.dir}/OpenSearch/build/distribution/local/opensearch-3.8.0" "${target.dir}/usr/share/opensearch"

            plugin_zip_dirs=(
              alerting/alerting
              anomaly-detection
              asynchronous-search
              cross-cluster-replication
              custom-codecs
              flow-framework
              geospatial
              index-management
              job-scheduler
              k-NN
              ml-commons/plugin
              neural-search
              notifications/notifications/core
              notifications/notifications/notifications
              observability
              opensearch-learning-to-rank-base
              opensearch-system-templates
              performance-analyzer
              query-insights
              reporting
              search-relevance
              security
              security-analytics
              skills
              sql/plugin
              user-behavior-insights
            )

            for plugin_zip_dir in "${plugin_zip_dirs[@]}"; do
              zipfile=$(echo ${source.dir}/$plugin_zip_dir/build/distributions/*.zip)
              if [ ! -f "$zipfile" ]; then
                echo "ERROR: Zip file not found for plugin: ${plugin_zip_dir}"
                exit 1
              fi
              echo "Found plugin zip file: $zipfile"

              basezip="$(basename "$zipfile" .zip)"
              plugin_name="${basezip%-*}"

              mkdir -p "${target.dir}/usr/share/opensearch/plugins/$plugin_name"
              unzip -o "$zipfile" -d "${target.dir}/usr/share/opensearch/plugins/$plugin_name/"
            done

            install -Dm644 ${source.dir}/notifications/notifications/notifications/src/main/config/notifications.yml "${target.dir}/usr/share/opensearch/config/opensearch-notifications/notifications.yml"
            install -Dm644 ${source.dir}/notifications/notifications/core/src/main/config/notifications-core.yml "${target.dir}/usr/share/opensearch/config/opensearch-notifications-core/notifications-core.yml"
            install -Dm644 ${source.dir}/observability/src/main/config/observability.yml "${target.dir}/usr/share/opensearch/config/opensearch-observability/observability.yml"
            mkdir -p "${target.dir}/usr/share/opensearch/config/opensearch-performance-analyzer"
            install -Dm644 ${source.dir}/performance-analyzer/config/* "${target.dir}/usr/share/opensearch/config/opensearch-performance-analyzer/"
            install -Dm644 ${source.dir}/reporting/src/main/config/reports-scheduler.yml "${target.dir}/usr/share/opensearch/config/opensearch-reports-scheduler/reports-scheduler.yml"
            mkdir -p "${target.dir}/usr/share/opensearch/config/opensearch-security"
            install -Dm644 ${source.dir}/security/config/* "${target.dir}/usr/share/opensearch/config/opensearch-security/"
        - name: replace vulnerable libraries in security-analytics
          work-dir: ${target.dir}/usr/share/opensearch/plugins/opensearch-security-analytics
          runs: |
            set -eux -o pipefail

            sa_commons_jar="$(ls security-analytics-commons-*.jar)"

            echo "Checking bundled Netty in ${sa_commons_jar}..."
            if ! /usr/lib/jvm/temurin-21/bin/jar tf "${sa_commons_jar}" | grep -q '^io/netty/'; then
              echo "ERROR: No embedded netty classes found in commons jar" >&2
              exit 1
            fi

            bundled_netty_ver="$(unzip -p "${sa_commons_jar}" 'META-INF/maven/io.netty/netty-codec-http/pom.properties' 2> /dev/null | grep '^version=' | cut -d= -f2 || echo "")"

            if [[ -n "${bundled_netty_ver}" ]]; then
              if [[ "${bundled_netty_ver}" > "4.2.17.Final" ]] || [[ "${bundled_netty_ver}" = "4.2.17.Final" ]]; then
                echo "ERROR: Bundled Netty version ${bundled_netty_ver} is >= target version 4.2.17.Final" >&2
                exit 1
              fi
              echo "Bundled version ${bundled_netty_ver} < target 4.2.17.Final, proceeding with upgrade..."
            else
              echo "WARNING: Found netty classes but could not determine version, proceeding..."
            fi

            echo "Stripping all embedded netty classes from: ${sa_commons_jar}"
            zip -qd "${sa_commons_jar}" 'io/netty/*' 'META-INF/maven/io.netty/*/*' || true
            if /usr/lib/jvm/temurin-21/bin/jar tf "${sa_commons_jar}" | grep -q '^io/netty/'; then
              echo "ERROR: Failed to strip embedded netty classes from commons jar" >&2
              exit 1
            fi

            echo "Bundling netty 4.2.17.Final jars..."
            for netty_dep in netty-buffer netty-codec netty-codec-http netty-codec-http2 netty-codec-http3 netty-codec-classes-quic netty-common netty-handler netty-resolver netty-transport netty-transport-classes-epoll netty-transport-native-unix-common; do
              cp ${source.dir}/patch/deps/${netty_dep}-4.2.17.Final.jar .
            done

            echo "Checking bundled Jackson in ${sa_commons_jar}..."
            if ! /usr/lib/jvm/temurin-21/bin/jar tf "${sa_commons_jar}" | grep -q '^com/fasterxml/jackson/'; then
              echo "No embedded Jackson classes found in commons jar, skipping Jackson replacement."
            else
              bundled_jackson_databind_ver="$(unzip -p "${sa_commons_jar}" 'META-INF/maven/com.fasterxml.jackson.core/jackson-databind/pom.properties' 2> /dev/null | grep '^version=' | cut -d= -f2 || echo "")"
              if [[ -n "${bundled_jackson_databind_ver}" ]]; then
                if [[ "${bundled_jackson_databind_ver}" > "2.22.1" ]] || [[ "${bundled_jackson_databind_ver}" = "2.22.1" ]]; then
                  echo "ERROR: Bundled jackson-databind version ${bundled_jackson_databind_ver} is >= target version 2.22.1" >&2
                  exit 1
                fi
                echo "Bundled jackson-databind ${bundled_jackson_databind_ver} < target 2.22.1, proceeding with upgrade..."
              else
                echo "WARNING: Found Jackson classes but could not determine jackson-databind version, proceeding..."
              fi

              echo "Stripping embedded Jackson classes from: ${sa_commons_jar}"
              zip -qd "${sa_commons_jar}" \
                'com/fasterxml/jackson/*' \
                'META-INF/maven/com.fasterxml.jackson*/*' \
                'META-INF/maven/com.fasterxml.jackson*/*/*' \
                'META-INF/services/com.fasterxml.jackson.databind.Module' || true
              if /usr/lib/jvm/temurin-21/bin/jar tf "${sa_commons_jar}" | grep -q '^com/fasterxml/jackson/'; then
                echo "ERROR: Failed to strip embedded Jackson classes from commons jar" >&2
                exit 1
              fi

              echo "Bundling Jackson 2.22.1 jars not already provided by OpenSearch core..."
              cp ${source.dir}/patch/deps/jackson-annotations-2.22.jar .
              for jackson_dep in jackson-databind jackson-datatype-jsr310 jackson-module-afterburner; do
                cp ${source.dir}/patch/deps/${jackson_dep}-2.22.1.jar .
              done
            fi
        - name: replace vulnerable http libraries in sql plugin
          work-dir: ${target.dir}/usr/share/opensearch/plugins/opensearch-sql
          runs: |
            set -eux -o pipefail

            rm -f httpcore5-5.4.jar httpcore5-reactive-5.4.jar httpcore5-h2-5.4.jar httpclient5-5.6.1.jar
            rm -f httpcore5-5.4.0.jar httpcore5-5.4.1.jar httpcore5-5.4.2.jar
            rm -f httpcore5-h2-5.4.0.jar httpcore5-h2-5.4.1.jar httpcore5-h2-5.4.2.jar
            rm -f httpcore5-reactive-5.4.0.jar httpcore5-reactive-5.4.1.jar httpcore5-reactive-5.4.2.jar
            rm -f httpclient5-5.6.0.jar httpclient5-5.6.2.jar httpclient5-5.6.jar

            install -m 0644 ${source.dir}/patch/deps/httpcore5-5.4.3.jar .
            install -m 0644 ${source.dir}/patch/deps/httpcore5-reactive-5.4.3.jar .
            install -m 0644 ${source.dir}/patch/deps/httpcore5-h2-5.4.3.jar .
            install -m 0644 ${source.dir}/patch/deps/httpclient5-5.6.3.jar .
        - name: replace vulnerable httpclient5 in alerting plugin
          work-dir: ${target.dir}/usr/share/opensearch/plugins/opensearch-alerting
          runs: |
            set -eux -o pipefail

            rm -f httpclient5-5.6.1.jar httpclient5-5.6.0.jar httpclient5-5.6.2.jar httpclient5-5.6.jar
            install -m 0644 ${source.dir}/patch/deps/httpclient5-5.6.3.jar .
        - name: replace vulnerable jsoup jars in plugins
          runs: |
            set -eux -o pipefail

            for plugin_dir in \
              "${target.dir}/usr/share/opensearch/plugins/opensearch-reports-scheduler" \
              "${target.dir}/usr/share/opensearch/plugins/opensearch-skills"; do
              if [ ! -d "${plugin_dir}" ]; then
                continue
              fi
              rm -f "${plugin_dir}"/jsoup-1.15.3.jar "${plugin_dir}"/jsoup-1.19.1.jar
              install -m 0644 ${source.dir}/patch/deps/jsoup-1.23.1.jar "${plugin_dir}/"
            done
        - name: strip unused jetty from opensearch-skills spark-core
          work-dir: ${target.dir}/usr/share/opensearch/plugins/opensearch-skills
          runs: |
            set -eux -o pipefail

            spark_jar="$(ls spark-core_2.13-*.jar)"
            zip -qd "${spark_jar}" \
              'org/eclipse/jetty/*' \
              'META-INF/maven/org.eclipse.jetty/*/*' || true
            rm -f jetty-*.jar
        - name: copy config and entrypoint files
          runs: |
            set -eux -o pipefail

            install -d "${target.dir}/usr/share/opensearch/bin"
            install -D -m 0755 "${source.dir}/opensearch-build/docker/release/config/opensearch/opensearch-docker-entrypoint-3.x.sh" "${target.dir}/usr/share/opensearch/bin/docker-entrypoint.sh"
            cp "${source.dir}/opensearch-build/config/opensearch.yml" "${target.dir}/usr/share/opensearch/config/opensearch.yml"
            cp "${source.dir}/opensearch-build/docker/release/config/opensearch/log4j2.properties" "${target.dir}/usr/share/opensearch/config/log4j2.properties"
        - name: java sbom
          uses: sbom@v1
          with:
            extra-scanners: java-archive-cataloger
            prefix: opensearch
            source: ${target.dir}/usr/share/opensearch
        - uses: dhi/build-pkg:0
          with:
            depends:
              - bash
              - coreutils
            description: OpenSearch distributed search and analytics engine
            files:
              - usr/share/opensearch
            formats:
              - deb
            license: Apache-2.0
            name: opensearch
            rel: 5
            url: https://opensearch.org/
            version: 3.8.0
      paths:
        - type: file
          path: /usr/local/bin/dhi-gradle
          uid: 0
          gid: 0
          mode: "0555"
          source: package/main/opensearch/scripts/dhi-gradle.sh
        - type: file
          path: ${source.dir}/patch/overrides.gradle
          uid: 0
          gid: 0
          mode: "0444"
          source: package/main/opensearch/patch/overrides.gradle
        - type: file
          path: /src/patch/buildsrc-maven-mirror.patch
          uid: 0
          gid: 0
          mode: "0444"
          source: package/main/opensearch/patch/buildsrc-maven-mirror.patch
        - type: file
          path: /src/patch/libs-versions-httpcomponents.patch
          uid: 0
          gid: 0
          mode: "0444"
          source: package/main/opensearch/patch/libs-versions-httpcomponents.patch
        - type: file
          path: /src/patch/ide-gradle-maven-mirror.patch
          uid: 0
          gid: 0
          mode: "0444"
          source: package/main/opensearch/patch/ide-gradle-maven-mirror.patch
        - type: file
          path: /src/patch/repository-hdfs-krb5-fixture-evaluation.patch
          uid: 0
          gid: 0
          mode: "0444"
          source: package/main/opensearch/patch/repository-hdfs-krb5-fixture-evaluation.patch
        - type: file
          path: /src/patch/plugin-ltr.patch
          uid: 0
          gid: 0
          mode: "0444"
          source: package/main/opensearch/patch/plugin-ltr.patch
        - type: file
          path: /src/patch/plugin-query-insights.patch
          uid: 0
          gid: 0
          mode: "0444"
          source: package/main/opensearch/patch/plugin-query-insights.patch
      accounts:
        run-as: opensearch
        users:
          - name: opensearch
            uid: 1000
            gid: 1000
        groups:
          - name: opensearch
            gid: 1000
            members:
              - opensearch
os-release:
  name: Docker Hardened Images (Debian)
  id: debian
  version-id: "13"
  version-codename: trixie
  pretty-name: Docker Hardened Images/Debian GNU/Linux 13 (trixie)
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
