# syntax=dhi.io/build:2-alpine3.24

image: dhi.io/pkg-metabase
variant: runtime
tags:
  - 0.63.18.1-alpine3.24
  - 0.63.18.1-r0-alpine3.24
platforms:
  - linux/amd64
  - linux/arm64
dates:
  release: "2026-07-21"
vars:
  BUN_ARCH: '#{ target.arch == "amd64" ? "x64" : "aarch64" }'
  BUN_SHA256: '#{ target.arch == "amd64" ? "sha256:14bd9aedeebf1dba67e8def9531c89bc989ecfdf1de42e5bfcaf1b8cd9294719" : "sha256:b98e0ad3625c5c00d1d5b5ff55605c7adddbfae151861e68ade57b2d3b8703bb" }'
  BUN_VERSION: 1.3.14
  CLOJURE_CLI_VERSION: 1.12.5.1664
  COMMIT_SHA: 8c16a71603b36af75900a27c309595e0a9cae266
  JAVA_MAJOR_VERSION: "25"
  PACKAGE_NAME: metabase
  REL: "0"
  SEMVER_MAJOR_MINOR_VERSION: "0.63"
  SEMVER_MAJOR_VERSION: "0"
  SEMVER_VERSION: 0.63.18.1
  TOOLS_DEPS_VERSION: 0.31.1646
  UV_ARCH: '#{ target.arch == "amd64" ? "x86_64-unknown-linux-musl" : "aarch64-unknown-linux-musl" }'
  UV_VERSION: 0.11.32
  VERSION: 0.63.18.1
contents:
  repositories:
    - https://dhi.io/apk/alpine/v3.24/main
    - https://dhi.io/apk/alpine/v3.23/main
    - https://dl-cdn.alpinelinux.org/alpine/v3.24/main
    - https://dl-cdn.alpinelinux.org/alpine/v3.24/community
  keyring:
    - https://dhi.io/keyring/dhi-apk@docker-0F81AD7700D99184.rsa.pub
  packages:
    - alpine-baselayout-data
  builds:
    - name: metabase
      work-dir: ${source.dir}/metabase
      contents:
        packages:
          - bash
          - ca-certificates-bundle
          - coreutils
          - eclipse-temurin-25-jdk
          - findutils
          - git
          - grep
          - nodejs-22
          - python-3.14
          - sed
          - tar
          - unzip
        files:
          - url: git+https://github.com/metabase/metabase.git#v0.63.18.1
            checksum: 8c16a71603b36af75900a27c309595e0a9cae266
            path: ${source.dir}/metabase
            spdx:
              name: metabase
              version: 0.63.18.1
              packages:
                - name: metabase
                  purl: pkg:github/metabase/metabase@v0.63.18.1
                  license: AGPL-3.0-only
            uid: 0
            gid: 0
          - url: https://github.com/oven-sh/bun/releases/download/bun-v1.3.14/bun-linux-${BUN_ARCH}-musl.zip
            checksum: ${BUN_SHA256}
            path: ${source.dir}/bun.zip
            uid: 0
            gid: 0
          - url: https://github.com/astral-sh/uv/releases/download/0.11.32/uv-${UV_ARCH}.tar.gz
            checksum: https://github.com/astral-sh/uv/releases/download/0.11.32/uv-${UV_ARCH}.tar.gz.sha256
            path: ${source.dir}/uv.tar.gz
            uid: 0
            gid: 0
          - url: https://download.clojure.org/install/clojure-tools-1.12.5.1664.tar.gz
            checksum: sha256:77dd6868948074adcc93e83a796f8e8f15a1a92bcb1b9002d715fd2210e476f3
            path: ${source.dir}/clojure-tools.tar.gz
            uid: 0
            gid: 0
      pipeline:
        - name: install clojure cli
          runs: |
            set -eux -o pipefail

            tar -xzf ${source.dir}/clojure-tools.tar.gz -C /opt
            mkdir -p /opt/clojure-tools/libexec
            mv /opt/clojure-tools/*.jar /opt/clojure-tools/libexec/
            sed -i 's@PREFIX@/opt/clojure-tools@' /opt/clojure-tools/clojure /opt/clojure-tools/clj
            ln -s /opt/clojure-tools/clojure /usr/bin/clojure
        - name: install bun
          runs: |
            set -eux -o pipefail

            unzip -q ${source.dir}/bun.zip -d /opt
            ln -s /opt/bun-linux-${BUN_ARCH}-musl/bun /usr/bin/bun
        - name: install uv
          runs: |
            set -eux -o pipefail

            tar -xzf ${source.dir}/uv.tar.gz -C /opt
            ln -s /opt/uv-${UV_ARCH}/uv /usr/bin/uv
        - uses: mvn/mirror@v1
        - name: bump vulnerable dependencies
          runs: |
            set -eux -o pipefail

            grep -q 'com.microsoft.sqlserver/mssql-jdbc {:mvn/version "13.2.1.jre11"}' modules/drivers/sqlserver/deps.edn

            sed -i 's/13\.2\.1\.jre11/13.4.0.jre11/' modules/drivers/sqlserver/deps.edn # CVE-2025-59250
        - name: bump the lz4 fork
          runs: |
            set -eux -o pipefail

            grep -q 'org.lz4/lz4-java\]}' modules/drivers/clickhouse/deps.edn
            grep -q 'at.yawk.lz4/lz4-java {:mvn/version "1.10.2"}' modules/drivers/clickhouse/deps.edn
            sed -i 's|at\.yawk\.lz4/lz4-java {:mvn/version "1\.10\.2"}|at.yawk.lz4/lz4-java {:mvn/version "1.11.1"}|' modules/drivers/clickhouse/deps.edn # CVE-2026-59949
        - name: replace compression plugin
          runs: |
            set -eux -o pipefail

            grep -q 'export { CompressionRspackPlugin } from "compression-rspack-plugin"' frontend/build/shared/rspack/plugins/CompressionRspackPlugin.js

            for option in algorithm test filename compressionOptions; do
              grep -q "${option}:" frontend/build/shared/rspack/compression.js
            done
            test "$(grep -c 'new CompressionRspackPlugin' frontend/build/shared/rspack/compression.js)" = 2
            test "$(grep -cE '^      [a-zA-Z]+:' frontend/build/shared/rspack/compression.js)" = 8

            cp ${source.dir}/CompressionRspackPlugin.js frontend/build/shared/rspack/plugins/CompressionRspackPlugin.js
        - name: prefetch clojure dependencies
          privileged: true
          secrets:
            - id: maven_user
              env: MAVEN_USER
              optional: true
            - id: maven_password
              env: MAVEN_PASSWORD
              optional: true
          runs: |
            set -eux -o pipefail

            clojure -Sdeps '{:deps {org.clojure/tools.deps {:mvn/version "0.31.1646"}}}' -P -X:drivers:build:build/all
            clojure -P -A:oss:drivers
            clojure -P -A:cljs
        - name: build uberjar
          privileged: true
          secrets:
            - id: maven_user
              env: MAVEN_USER
              optional: true
            - id: maven_password
              env: MAVEN_PASSWORD
              optional: true
          runs: |
            set -eux -o pipefail

            grep -q '"csv-parse": "\^5.5.6"' package.json
            grep -q '"qs": "6.15.2"' package.json
            grep -q '"fflate": "\^0.8.1"' bun.lock
            grep -q '"uuid": "\^3.4.0"' bun.lock
            bun pm pkg set 'dependencies.csv-parse=^7.0.2'              # CVE-2026-85063
            bun pm pkg set dependencies.qs=6.16.0 resolutions.qs=6.16.0 # CVE-2026-82417, CVE-2026-82562
            bun pm pkg set resolutions.fflate=0.8.3                     # CVE-2026-45820
            bun pm pkg set resolutions.uuid=11.1.1                      # CVE-2026-41907
            bun install --lockfile-only
            bun install --frozen-lockfile
            INTERACTIVE=false CI=true MB_EDITION=oss \
              clojure -Sdeps '{:deps {org.clojure/tools.deps {:mvn/version "0.31.1646"}}}' \
              -X:drivers:build:build/all :version v0.63.18.1
        - name: assert bouncy castle pins
          runs: |
            set -eux -o pipefail

            grep -q 'org.bouncycastle/bcpkix-jdk18on           {:mvn/version "1.85"}' deps.edn
            grep -q 'org.bouncycastle/bcprov-jdk18on           {:mvn/version "1.85.2"}' deps.edn
            test "$(unzip -l target/uberjar/metabase.jar 'META-INF/maven/org.bouncycastle/*' | grep -c pom.properties || true)" = 0
        - name: bcprov sbom
          uses: spdx@v1
          with:
            license: MIT
            name: bcprov-jdk18on
            purl: pkg:maven/org.bouncycastle/bcprov-jdk18on@1.85.2
            version: 1.85.2
        - name: bcpkix sbom
          uses: spdx@v1
          with:
            license: MIT
            name: bcpkix-jdk18on
            purl: pkg:maven/org.bouncycastle/bcpkix-jdk18on@1.85
            version: "1.85"
        - name: collect bundled frontend packages
          runs: |
            set -eux -o pipefail

            export WEBPACK_BUNDLE=production MB_EDITION=oss CI=true INTERACTIVE=false
            ./node_modules/.bin/rspack build --json /tmp/stats-app.json > /dev/null
            ./node_modules/.bin/rspack --config rspack.static-viz.config.js --json /tmp/stats-viz.json > /dev/null

            node -e '
            const fs = require("fs"), path = require("path");
            const dist = "resources/frontend_client/app/dist";
            const dst = "/tmp/bundled/node_modules";
            const seen = new Set();
            const note = (s) => {
              const m = String(s).match(/node_modules\/\.bun\/([^/]+)\/node_modules\/((?:@[^/]+\/)?[^/]+)\//);
              if (m) seen.add(m[1] + " " + m[2]);
            };
            for (const f of ["/tmp/stats-app.json", "/tmp/stats-viz.json"]) {
              for (const mod of JSON.parse(fs.readFileSync(f, "utf8")).modules || []) {
                note(mod.nameForCondition || mod.identifier || mod.name);
              }
            }
            for (const f of fs.readdirSync(dist).filter((n) => n.endsWith(".map"))) {
              for (const src of JSON.parse(fs.readFileSync(path.join(dist, f), "utf8")).sources || []) {
                note(src);
              }
            }
            if (seen.size < 350) {
              throw new Error("only " + seen.size + " bundled packages resolved; module layout changed");
            }
            let staged = 0;
            for (const entry of seen) {
              const [store, name] = entry.split(" ");
              const from = path.join("node_modules/.bun", store, "node_modules", name);
              if (!fs.existsSync(from)) continue;
              const to = path.join(dst, ".bun", store, "node_modules", name);
              fs.mkdirSync(path.dirname(to), { recursive: true });
              fs.cpSync(from, to, { recursive: true, dereference: true, filter: (s) => path.basename(s) !== "node_modules" });
              for (const extra of fs.globSync(path.join(to, "**/package.json"))) {
                if (extra !== path.join(to, "package.json")) fs.rmSync(extra);
              }
              staged++;
            }
            fs.writeFileSync("/tmp/bundled-count", String(staged));
            console.log("bundled frontend packages:", seen.size, "staged:", staged);
            '

            test "$(find /tmp/bundled/node_modules -name package.json | wc -l | tr -d " ")" = "$(cat /tmp/bundled-count)"
        - name: frontend sbom
          uses: sbom@v1
          with:
            extra-scanners: javascript-package-cataloger
            prefix: metabase-frontend
            source: /tmp/bundled/node_modules
        - name: python sbom
          uses: sbom@v1
          with:
            extra-scanners: python-package-cataloger
            prefix: metabase-python
            source: ${source.dir}/metabase/resources/python-sources
        - name: stage payload
          runs: |
            set -eux -o pipefail

            grep -q 'jar /app/metabase.jar' bin/docker/run_metabase.sh
            grep -q 'JAVA_HOME=/opt/java/openjdk' bin/docker/run_metabase.sh

            install -D -m 0644 target/uberjar/metabase.jar ${target.dir}/usr/share/metabase/metabase.jar
            install -D -m 0755 bin/docker/run_metabase.sh ${target.dir}/usr/bin/run_metabase.sh

            sed -i \
              -e 's#/app/metabase\.jar#/usr/share/metabase/metabase.jar#g' \
              -e 's#JAVA_HOME=/opt/java/openjdk#JAVA_HOME=/usr/lib/jvm/temurin-25#' \
              ${target.dir}/usr/bin/run_metabase.sh

            ! grep -q '/app/metabase\.jar' ${target.dir}/usr/bin/run_metabase.sh
            grep -q '/app/initial\*\.db' ${target.dir}/usr/bin/run_metabase.sh

            for doc in bcprov-jdk18on bcpkix-jdk18on metabase-frontend metabase-python; do
              install -D -m 0644 "/opt/docker/sbom/${doc}/.spdx.${doc}.json" \
                "${target.dir}/opt/docker/sbom/${doc}/.spdx.${doc}.json"
            done
        - uses: dhi/build-pkg:0
          with:
            depends:
              - bash
              - coreutils
              - eclipse-temurin-25-jre
            description: Open-source business intelligence and embedded analytics platform
            files:
              - opt/docker/sbom/bcpkix-jdk18on/.spdx.bcpkix-jdk18on.json
              - opt/docker/sbom/bcprov-jdk18on/.spdx.bcprov-jdk18on.json
              - opt/docker/sbom/metabase-frontend/.spdx.metabase-frontend.json
              - opt/docker/sbom/metabase-python/.spdx.metabase-python.json
              - usr/bin/run_metabase.sh
              - usr/share/metabase/metabase.jar
            license: AGPL-3.0-only
            name: metabase
            rel: 0
            url: https://www.metabase.com
            version: 0.63.18.1
      paths:
        - type: file
          path: ${source.dir}/CompressionRspackPlugin.js
          uid: 0
          gid: 0
          mode: "0644"
          source: package/main/metabase/CompressionRspackPlugin.js
os-release:
  name: Docker Hardened Images (Alpine)
  id: alpine
  version-id: "3.24"
  pretty-name: Docker Hardened Images/Alpine Linux v3.24
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
