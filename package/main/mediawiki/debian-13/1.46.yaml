# syntax=dhi.io/build:2-debian13

image: dhi.io/pkg-mediawiki
variant: runtime
tags:
  - 1.46.0
  - 1.46.0-r1
  - 1.46.0-debian13
  - 1.46.0-r1-debian13
platforms:
  - linux/amd64
  - linux/arm64
dates:
  release: "2026-06-30"
vars:
  COMPOSER_PHAR_SHA256: c86ce603fe836bf0861a38c93ac566c8f1e69ac44b2445d9b7a6a17ea2e9972a
  COMPOSER_VERSION: 2.9.5
  IMAGEMAGICK_COMMIT_SHA: 360eda553586e389c9c725fc49df94f209a8a3c7
  IMAGEMAGICK_SOURCE_CHECKSUM: sha256:429ddf8e4235eb09c09b92dbe71f3d79cae3304be8bc7acb5a37bd61ede663d9
  IMAGEMAGICK_VERSION: 7.1.2-29
  PACKAGE_HOME: /usr/share/mediawiki-1.46
  PACKAGE_NAME: mediawiki-1.46
  PHP_MAJOR_MINOR_VERSION: "8.3"
  PHP_SOURCE_CHECKSUM: e293ed620cec74651bb4a071317892a478aa6840fab22db45c72d77cd42f9676
  PHP_UPSTREAM_VERSION: 8.3.33
  PHP_VERSION: 8.3.33-0
  REL: "1"
  SEMVER_MAJOR_MINOR_VERSION: "1.46"
  SEMVER_MAJOR_VERSION: "1"
  SEMVER_VERSION: 1.46.0
  VERSION: 1.46.0
contents:
  packages:
    - '!base-files'
  builds:
    - name: mediawiki
      work-dir: ${source.dir}
      contents:
        repositories:
          - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
        keyring:
          - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
        packages:
          - autoconf
          - bash
          - build-essential
          - ca-certificates
          - coreutils
          - curl
          - findutils
          - fontconfig-config
          - gawk
          - git
          - grep
          - gzip
          - libfontconfig1-dev
          - libfreetype-dev
          - libicu-dev
          - libjpeg62-turbo-dev
          - liblcms2-2
          - liblcms2-dev
          - liblqr-1-0-dev
          - libltdl7
          - libltdl-dev
          - liblua5.1-0
          - liblua5.1-0-dev
          - liblzma-dev
          - libonig5
          - libonig-dev
          - libopenexr-dev
          - libopenjp2-7-dev
          - libpango1.0-dev
          - libpcre2-8-0
          - libpcre2-dev
          - libperl-dev
          - libpng-dev
          - libraw-dev
          - libreadline8t64
          - librsvg2-bin
          - librsvg2-dev
          - libsodium23
          - libsqlite3-0
          - libssl3t64
          - libtiff6
          - libtiff-dev
          - libtool
          - libwebp-dev
          - libwmf-dev
          - libx11-dev
          - libxext-dev
          - libxml2
          - libxml2-dev
          - libxml2-utils
          - libxt-dev
          - libzip-dev
          - libargon2-1
          - libcurl4t64
          - libicu76
          - libfontconfig1
          - libwebp7
          - make
          - mawk
          - pkg-config
          - sed
          - tar
          - unzip
          - xsltproc
          - xz-utils
          - zlib1g
          - zlib1g-dev
          - php-8.3=8.3.33-0
          - php-8.3-dev=8.3.33-0
        files:
          - url: https://releases.wikimedia.org/mediawiki/1.46/mediawiki-1.46.0.tar.gz
            path: ${source.dir}/mediawiki.tar.gz
            spdx:
              name: mediawiki
              version: 1.46.0
              packages:
                - name: mediawiki
                  purl: pkg:composer/mediawiki/core@1.46.0
                  license: GPL-2.0-or-later
            uid: 0
            gid: 0
          - url: https://releases.wikimedia.org/mediawiki/1.46/mediawiki-1.46.0.tar.gz.sig
            path: ${source.dir}/mediawiki.tar.gz.sig
            uid: 0
            gid: 0
          - url: https://github.com/composer/composer/releases/download/2.9.5/composer.phar
            path: ${source.dir}/composer.phar
            uid: 0
            gid: 0
          - url: https://www.php.net/distributions/php-8.3.33.tar.xz
            checksum: sha256:e293ed620cec74651bb4a071317892a478aa6840fab22db45c72d77cd42f9676
            path: ${source.dir}/php-8.3.33.tar.xz
            spdx:
              name: php
              version: 8.3.33
              packages:
                - name: php
                  purl: pkg:dhi/php@8.3.33
                  license: PHP-3.01
            uid: 0
            gid: 0
          - url: https://github.com/ImageMagick/ImageMagick/archive/360eda553586e389c9c725fc49df94f209a8a3c7.tar.gz
            checksum: sha256:429ddf8e4235eb09c09b92dbe71f3d79cae3304be8bc7acb5a37bd61ede663d9
            path: ${source.dir}/imagemagick.tar.gz
            spdx:
              name: imagemagick
              version: 7.1.2-29
              packages:
                - name: imagemagick
                  purl: pkg:dhi/imagemagick/imagemagick@7.1.2-29
                  license: Apache-2.0
            uid: 0
            gid: 0
      pipeline:
        - name: verify server GPG
          uses: gpg/verify@v1
          with:
            file: ${source.dir}/mediawiki.tar.gz
            keys: ${source.dir}/keys.txt
            signature: ${source.dir}/mediawiki.tar.gz.sig
        - name: verify composer phar checksum
          privileged: true
          runs: |
            set -eux -o pipefail

            echo "c86ce603fe836bf0861a38c93ac566c8f1e69ac44b2445d9b7a6a17ea2e9972a  ${source.dir}/composer.phar" | sha256sum -c -
        - name: extract mediawiki source
          runs: |
            set -eux -o pipefail

            mkdir -p "${source.dir}/mediawiki"
            tar -x --strip-components=1 -f "${source.dir}/mediawiki.tar.gz" -C "${source.dir}/mediawiki"
        - name: extract php source for bundled extensions
          runs: |
            set -eux -o pipefail

            mkdir -p "${source.dir}/php-src"
            tar -xaf "${source.dir}/php-8.3.33.tar.xz" -C "${source.dir}/php-src" --strip-components=1
        - name: install php extensions with pecl
          privileged: true
          runs: |
            set -eux -o pipefail

            pecl install APCu
            pecl install LuaSandbox
        - name: build calendar php extension
          work-dir: ${source.dir}/php-src/ext/calendar
          runs: |
            set -eux -o pipefail

            phpize
            ./configure --with-php-config=php-config
            make -j "$(nproc)"
            make install
            echo "extension=calendar.so" > "/etc/php-8.3/conf.d/calendar.ini"
        - name: build mysqli php extension
          work-dir: ${source.dir}/php-src/ext/mysqli
          runs: |
            set -eux -o pipefail

            phpize
            ./configure --with-php-config=php-config
            make -j "$(nproc)"
            make install
            echo "extension=mysqli.so" > "/etc/php-8.3/conf.d/mysqli.ini"
        - name: enable pecl extensions for build
          runs: |
            set -eux -o pipefail

            echo "extension=apcu.so" > "/etc/php-8.3/conf.d/apcu.ini"
            echo "extension=luasandbox.so" > "/etc/php-8.3/conf.d/luasandbox.ini"
        - name: write opcache recommended settings
          runs: |
            set -eux -o pipefail

            install -d "${target.dir}/etc/php-8.3/conf.d"
            cat << 'EOF' > "${target.dir}/etc/php-8.3/conf.d/mediawiki-opcache-recommended.ini"
            opcache.memory_consumption=128
            opcache.interned_strings_buffer=8
            opcache.max_accelerated_files=4000
            opcache.revalidate_freq=60
            EOF
        - name: bump composer dependencies
          work-dir: ${source.dir}/mediawiki
          privileged: true
          runs: |
            set -eux -o pipefail

            php "${source.dir}/composer.phar" config audit.block-insecure false
            php "${source.dir}/composer.phar" require --no-interaction --no-ansi --no-progress --no-update firebase/php-jwt:^7.0
            php "${source.dir}/composer.phar" require --no-interaction --no-ansi --no-progress --no-update symfony/yaml:^6.4.40
            php "${source.dir}/composer.phar" require --no-interaction --no-ansi --no-progress --no-update guzzlehttp/guzzle:^7.12.1
            php "${source.dir}/composer.phar" install --no-interaction --no-ansi --no-progress --no-dev --prefer-dist
            rm -f vendor/composer.lock vendor/composer.json
        - name: extract imagemagick source
          runs: |
            set -eux -o pipefail

            mkdir -p "${source.dir}/imagemagick"
            tar -x --strip-components=1 -f "${source.dir}/imagemagick.tar.gz" -C "${source.dir}/imagemagick"
        - name: build imagemagick
          work-dir: ${source.dir}/imagemagick
          environment:
            CC: gcc
            CFLAGS: -Wno-deprecated-declarations -Wdeclaration-after-statement -Wno-error=unused-variable
            CXX: g++
          runs: |
            set -eux -o pipefail

            ./configure \
              --prefix=/usr \
              --enable-reproducible-build \
              --disable-static \
              --enable-shared \
              --with-modules \
              --with-quantum-depth=16 \
              --without-magick-plus-plus \
              --without-perl \
              --disable-docs \
              --disable-opencl

            make -j"$(nproc)"
            make install DESTDIR="${target.dir}"
        - name: stage mediawiki application tree
          runs: |
            set -eux -o pipefail

            install -d "${target.dir}/usr/share/mediawiki-1.46"
            cp -a "${source.dir}/mediawiki/." "${target.dir}/usr/share/mediawiki-1.46/"
        - name: stage php extension configs
          runs: |
            set -eux -o pipefail

            ext_dir="$(php-config --extension-dir)"
            pkg_ext_dir="usr/lib/mediawiki-1.46/php-ext"
            install -d "${target.dir}/${pkg_ext_dir}"
            install -d "${target.dir}/etc/php-8.3/conf.d"

            for ext in apcu luasandbox calendar mysqli; do
              so_path="$(find "${ext_dir}" -maxdepth 1 -name "${ext}.so" -print -quit)"
              if [ -z "${so_path}" ]; then
                echo "missing extension ${ext}.so under ${ext_dir}" >&2
                exit 1
              fi
              install -m 0644 "${so_path}" "${target.dir}/${pkg_ext_dir}/${ext}.so"
              printf 'extension=/usr/lib/%s/php-ext/%s.so\n' "mediawiki-1.46" "${ext}" \
                > "${target.dir}/etc/php-8.3/conf.d/mediawiki-${ext}.ini"
            done
        - uses: dhi/build-pkg:0
          with:
            depends:
              - php-8.3
              - php-8.3-fpm
              - fontconfig-config
              - libfontconfig1
              - liblcms2-2
              - libltdl7
              - libwebp7
              - libxml2
              - libtiff6
              - liblua5.1-0
            description: MediaWiki wiki engine
            files:
              - usr/share/mediawiki-1.46
              - usr/lib/mediawiki-1.46
              - etc/php-8.3/conf.d/mediawiki-apcu.ini
              - etc/php-8.3/conf.d/mediawiki-luasandbox.ini
              - etc/php-8.3/conf.d/mediawiki-calendar.ini
              - etc/php-8.3/conf.d/mediawiki-mysqli.ini
              - etc/php-8.3/conf.d/mediawiki-opcache-recommended.ini
              - usr/bin
              - usr/lib
              - usr/share
              - usr/etc
            formats:
              - deb
            license: GPL-2.0-or-later
            name: mediawiki-1.46
            rel: 1
            url: https://www.mediawiki.org
            version: 1.46.0
      paths:
        - type: file
          path: ${source.dir}/keys.txt
          uid: 0
          gid: 0
          source: package/main/mediawiki/key/keys.txt
os-release:
  name: Docker Hardened Images (Debian)
  id: debian
  version-id: "13"
  version-codename: trixie
  pretty-name: Docker Hardened Images/Debian GNU/Linux 13 (trixie)
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
