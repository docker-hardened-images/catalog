// wiremock-gui's build.gradle pins the bundled runtime libraries at versions
// that carry known CVEs (see `project.ext.versions` and the dependency
// declarations). Force the runtime classpath to fixed releases within the same
// minor/major series (low-risk patch and minor bumps, not namespace migrations):
//   bcprov-jdk18on 1.76 -> 1.85        fixes CVE-2026-8763, CVE-2026-13506 (1.85),
//                                      CVE-2026-0636 (1.84), CVE-2025-14813,
//                                      CVE-2026-5598 (1.80.2), and the <=1.78 ids
//   jackson 2.19.0 -> 2.22.3           fixes CVE-2026-54512/54513/54514/54515/59888,
//                                      CVE-2026-68497/83557/19032, CVE-2026-89407/89425/91776/91777,
//                                      CVE-2026-59889, CVE-2026-77310, CVE-2026-68494, CVE-2026-18401
//                                      (jackson-annotations uses its own MAJOR.MINOR scheme: 2.22)
//   guava 33.4.8-jre -> 33.7.2-jre     fixes CVE-2026-102554
//   handlebars 4.3.1 -> 4.5.4          fixes CVE-2026-55760 (4.5.2)
//   commons-lang3 3.12.0 -> 3.19.0     fixes CVE-2025-48924 (3.18.0)
//   httpcore5 / httpcore5-h2 5.3.4 -> 5.4.3   fixes CVE-2026-54399, CVE-2026-54428
//   httpclient5 5.5 -> 5.6.3           fixes CVE-2026-64607
//   json-smart 2.5.0 -> 2.5.2          fixes CVE-2024-57699
//   jetty 11.0.24 -> 11.0.26           fixes CVE-2025-5115 (11.0.26). Scout's fixed
//                                      versions for CVE-2026-2332 (11.0.29) and
//                                      CVE-2026-10050 (11.0.31) are not published to
//                                      Maven Central, and CVE-2024-6763 needs Jetty 12
//                                      (a jakarta namespace migration), so those stay open.
// The handlebars 4.4+ helper relocation is handled by the pipeline step that
// rewrites the AssignHelper/NumberHelper imports before the build.
allprojects {
  configurations.all {
    resolutionStrategy {
      force(
        'com.fasterxml.jackson.core:jackson-core:2.22.3',
        'com.fasterxml.jackson.core:jackson-annotations:2.22',
        'com.fasterxml.jackson.core:jackson-databind:2.22.3',
        'com.fasterxml.jackson.datatype:jackson-datatype-jsr310:2.22.3',
        'com.fasterxml.jackson.dataformat:jackson-dataformat-yaml:2.22.3',
        'com.google.guava:guava:33.7.2-jre',
        'com.github.jknack:handlebars:4.5.4',
        'com.github.jknack:handlebars-helpers:4.5.4',
        'org.apache.commons:commons-lang3:3.19.0',
        'org.apache.httpcomponents.core5:httpcore5:5.4.3',
        'org.apache.httpcomponents.core5:httpcore5-h2:5.4.3',
        'org.apache.httpcomponents.client5:httpclient5:5.6.3',
        'org.bouncycastle:bcprov-jdk18on:1.85',
        'net.minidev:json-smart:2.5.2',
        'org.eclipse.jetty:jetty-alpn-client:11.0.26',
        'org.eclipse.jetty:jetty-alpn-java-client:11.0.26',
        'org.eclipse.jetty:jetty-alpn-java-server:11.0.26',
        'org.eclipse.jetty:jetty-alpn-server:11.0.26',
        'org.eclipse.jetty:jetty-annotations:11.0.26',
        'org.eclipse.jetty:jetty-client:11.0.26',
        'org.eclipse.jetty:jetty-http:11.0.26',
        'org.eclipse.jetty:jetty-io:11.0.26',
        'org.eclipse.jetty:jetty-jndi:11.0.26',
        'org.eclipse.jetty:jetty-plus:11.0.26',
        'org.eclipse.jetty:jetty-proxy:11.0.26',
        'org.eclipse.jetty:jetty-rewrite:11.0.26',
        'org.eclipse.jetty:jetty-security:11.0.26',
        'org.eclipse.jetty:jetty-server:11.0.26',
        'org.eclipse.jetty:jetty-servlet:11.0.26',
        'org.eclipse.jetty:jetty-servlets:11.0.26',
        'org.eclipse.jetty:jetty-util:11.0.26',
        'org.eclipse.jetty:jetty-webapp:11.0.26',
        'org.eclipse.jetty:jetty-xml:11.0.26',
        'org.eclipse.jetty.http2:http2-common:11.0.26',
        'org.eclipse.jetty.http2:http2-hpack:11.0.26',
        'org.eclipse.jetty.http2:http2-server:11.0.26',
        'org.eclipse.jetty.websocket:websocket-core-client:11.0.26',
        'org.eclipse.jetty.websocket:websocket-core-common:11.0.26',
        'org.eclipse.jetty.websocket:websocket-core-server:11.0.26',
        'org.eclipse.jetty.websocket:websocket-jakarta-client:11.0.26',
        'org.eclipse.jetty.websocket:websocket-jakarta-common:11.0.26',
        'org.eclipse.jetty.websocket:websocket-jakarta-server:11.0.26',
        'org.eclipse.jetty.websocket:websocket-servlet:11.0.26',
      )
    }
  }
}

// Copies the unshaded runtime classpath into a plain directory so `sbom@v1` +
// `extra-scanners: java-archive-cataloger` can see the real dependency set that
// ships inside wiremock-standalone.jar. The shadowJar relocates the merged
// classes and strips the per-dependency META-INF/maven/*/pom.properties metadata
// that the default java-archive cataloger relies on.
rootProject {
  afterEvaluate { project ->
    // bouncycastle bcprov-jdk18on 1.85 ships META-INF/versions/25 class files
    // (class major 69). The shadow plugin's ASM cannot read them and shadowJar
    // fails with "Unsupported class file major version 69". The runtime is JDK 17,
    // which never loads multi-release entries above 17, so drop only that path
    // from the fat jar. The unshaded dhiCopyRuntimeDeps copy keeps the full jar.
    project.tasks.matching { it.name == 'shadowJar' }.configureEach {
      exclude 'META-INF/versions/25/**'
    }

    project.tasks.register('dhiCopyRuntimeDeps', Copy) {
      from(project.configurations.getByName('runtimeClasspath')) {
        include '*.jar'
      }
      into "${project.projectDir}/build/dhi-runtime-deps"
    }
  }
}
