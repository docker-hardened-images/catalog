# syntax=dhi.io/build:2-alpine3.24

image: dhi.io/pkg-distribution-registry
variant: runtime
tags:
  - 3.1.1-alpine3.24
  - 3.1.1-r3-alpine3.24
platforms:
  - linux/amd64
  - linux/arm64
dates:
  release: "2026-05-01"
vars:
  COMMIT_SHA: 9a8d98b679740cd514aa7e7d84d23d442a5ef54c
  GOLANG_VERSION: 1.26.8-r0
  REL: "3"
  SEMVER_MAJOR_MINOR_VERSION: "3.1"
  SEMVER_MAJOR_VERSION: "3"
  SEMVER_VERSION: 3.1.1
  VERSION: 3.1.1
contents:
  repositories:
    - https://dhi.io/apk/alpine/v3.24/main
    - https://dhi.io/apk/alpine/v3.23/main
    - https://dl-cdn.alpinelinux.org/alpine/v3.24/main
    - https://dl-cdn.alpinelinux.org/alpine/v3.24/community
  keyring:
    - https://dhi.io/keyring/dhi-apk@docker-0F81AD7700D99184.rsa.pub
  packages:
    - alpine-baselayout-data
  builds:
    - name: distribution-registry
      work-dir: /go/src/github.com/distribution/distribution/v3
      caches:
        - path: /go/pkg/mod
      contents:
        packages:
          - busybox
          - bash
          - ca-certificates-bundle
          - coreutils
          - findutils
          - mawk
          - sed
          - golang-1.26=1.26.8-r0
          - golang-1.26-oci-config=1.26.8-r0
        files:
          - url: git+https://github.com/distribution/distribution.git#v3.1.1
            checksum: 9a8d98b679740cd514aa7e7d84d23d442a5ef54c
            path: /go/src/github.com/distribution/distribution/v3
            spdx:
              name: distribution
              version: 3.1.1
              packages:
                - name: distribution-registry
                  purl: pkg:golang/github.com/distribution/distribution/v3@3.1.1
                  license: Apache-2.0
            uid: 0
            gid: 0
      pipeline:
        - name: update go dependencies
          uses: go/bump@v2
          with:
            deps:
              - golang.org/x/crypto@v0.52.0
              - golang.org/x/net@v0.56.0
              - golang.org/x/text@v0.39.0
              - github.com/klauspost/compress@v1.18.7
              - go.opentelemetry.io/otel@v1.44.0
              - google.golang.org/grpc@v1.83.1
            download: true
        - name: patch vendored dependencies
          privileged: true
          environment:
            GODEBUG: ""
            GOFIPS140: ""
          runs: |
            set -eux -o pipefail

            go mod edit -droprequire google.golang.org/grpc/stats/opentelemetry
            go get cloud.google.com/go/storage@v1.52.0
            go get google.golang.org/api@v0.214.0

            go get go.opentelemetry.io/otel@v1.44.0
            go get go.opentelemetry.io/otel/sdk@v1.44.0
            go get go.opentelemetry.io/otel/trace@v1.44.0
            go get go.opentelemetry.io/otel/metric@v1.44.0
            go get go.opentelemetry.io/otel/sdk/metric@v1.44.0
            go get go.opentelemetry.io/otel/exporters/stdout/stdouttrace@v1.44.0
            go get go.opentelemetry.io/contrib/exporters/autoexport@v0.67.0
            go get go.opentelemetry.io/contrib/instrumentation/net/http/otelhttp@v0.67.0
            go get go.opentelemetry.io/otel/exporters/otlp/otlplog/otlploghttp@v0.19.0
            go get go.opentelemetry.io/otel/exporters/otlp/otlpmetric/otlpmetrichttp@v1.44.0
            go get go.opentelemetry.io/otel/exporters/otlp/otlptrace/otlptracehttp@v1.44.0

            go get google.golang.org/grpc@v1.83.1

            go mod tidy
            go mod vendor
        - name: test
          runs: |
            set -eux -o pipefail

            CGO_ENABLED=0 go test -short ./cmd/registry/... -count=1 -v
        - name: build
          uses: go/build@v1
          with:
            fips: false
            ldflags:
              - -X github.com/distribution/distribution/v3/version.version=v3.1.1
              - -X github.com/distribution/distribution/v3/version.revision=9a8d98b679740cd514aa7e7d84d23d442a5ef54c
              - -X github.com/distribution/distribution/v3/version.mainpkg=github.com/distribution/distribution/v3
            output: ${target.dir}/usr/bin/registry
            packages: ./cmd/registry
            strip: true
        - name: build dev
          uses: go/build@v1
          with:
            fips: false
            ldflags:
              - -X github.com/distribution/distribution/v3/version.version=v3.1.1
              - -X github.com/distribution/distribution/v3/version.revision=9a8d98b679740cd514aa7e7d84d23d442a5ef54c
              - -X github.com/distribution/distribution/v3/version.mainpkg=github.com/distribution/distribution/v3
            output: ${target.dir}/usr/bin/registry-dev
            packages: ./cmd/registry
            strip: false
        - name: stage config
          runs: |
            set -eux -o pipefail

            mkdir -p "${target.dir}/etc/distribution"
            cp cmd/registry/config-dev.yml "${target.dir}/etc/distribution/config.yml"
        - uses: dhi/build-pkg:0
          with:
            description: OCI/Docker Distribution Registry
            files:
              - usr/bin/registry
              - etc/distribution/config.yml
            license: Apache-2.0
            name: distribution-registry
            rel: 3
            subpackages:
              - files:
                  - path: usr/bin/registry
                    source: usr/bin/registry-dev
                name: distribution-registry-dev
            url: https://github.com/distribution/distribution
            version: 3.1.1
os-release:
  name: Docker Hardened Images (Alpine)
  id: alpine
  version-id: "3.24"
  pretty-name: Docker Hardened Images/Alpine Linux v3.24
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
