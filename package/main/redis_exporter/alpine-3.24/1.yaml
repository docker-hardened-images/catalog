image: dhi.io/pkg-redis_exporter
variant: runtime
tags:
  - 1.90.0-alpine3.24
  - 1.90.0-r2-alpine3.24
platforms:
  - linux/amd64
  - linux/arm64
dates:
  release: "2026-05-21"
vars:
  COMMIT_SHA: 072bd8bdabb60de075206fbebc9698edb1fff8f1
  GOLANG_MAJOR_MINOR_VERSION: "1.26"
  GOLANG_VERSION: 1.26.8-r0
  REL: "2"
  SEMVER_MAJOR_MINOR_VERSION: "1.90"
  SEMVER_MAJOR_VERSION: "1"
  SEMVER_VERSION: 1.90.0
  VERSION: 1.90.0
contents:
  repositories:
    - https://dhi.io/apk/alpine/v3.24/main
    - https://dhi.io/apk/alpine/v3.23/main
    - https://dl-cdn.alpinelinux.org/alpine/v3.24/main
    - https://dl-cdn.alpinelinux.org/alpine/v3.24/community
  keyring:
    - https://dhi.io/keyring/dhi-apk@docker-0F81AD7700D99184.rsa.pub
  packages:
    - alpine-baselayout-data
  builds:
    - name: redis_exporter
      work-dir: /go/src/github.com/oliver006/redis_exporter
      contents:
        packages:
          - busybox
          - bash
          - ca-certificates-bundle
          - coreutils
          - findutils
          - mawk
          - sed
          - golang-1.26=1.26.8-r0
          - golang-1.26-oci-config=1.26.8-r0
        files:
          - url: git+https://github.com/oliver006/redis_exporter.git#v1.90.0
            checksum: 072bd8bdabb60de075206fbebc9698edb1fff8f1
            path: /go/src/github.com/oliver006/redis_exporter
            spdx:
              name: redis-exporter
              version: 1.90.0
              packages:
                - name: redis-exporter
                  purl: pkg:golang/oliver006/redis_exporter@1.90.0
                  license: MIT
            uid: 0
            gid: 0
      pipeline:
        - name: go dependencies
          uses: go/bump@v2
          with:
            deps:
              - golang.org/x/crypto@v0.56.0
            download: true
        - name: test
          runs: |
            set -eux -o pipefail

            # Exporter subpackage tests require an external Redis instance via TEST_REDIS_URI.
            go test . -count=1
        - name: build
          uses: go/build@v1
          with:
            fips: false
            ldflags: -X main.BuildVersion=1.90.0 -X main.BuildCommitSha=072bd8bdabb60de075206fbebc9698edb1fff8f1 -X main.BuildDate=$(date -d @${SOURCE_DATE_EPOCH} +'%F-%T')
            output: ${target.dir}/usr/bin/redis-exporter
        - name: build dev
          uses: go/build@v1
          work-dir: /go/src/github.com/oliver006/redis_exporter
          with:
            fips: false
            output: ${target.dir}/usr/bin/redis-exporter-dev
            packages: .
            strip: false
        - uses: dhi/build-pkg:0
          with:
            description: Redis_exporter
            files:
              - usr/bin/redis-exporter
            license: MIT
            name: redis-exporter
            rel: 2
            subpackages:
              - files:
                  - path: usr/bin/redis-exporter
                    source: usr/bin/redis-exporter-dev
                name: redis-exporter-dev
            url: https://github.com/oliver006/redis_exporter
            version: 1.90.0
