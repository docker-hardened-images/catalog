  - 5.7.1-debian13
  - 5.7.1-r0-debian13
platforms:
  - linux/amd64
  - linux/arm64
dates:
  release: "2026-07-07"
vars:
  COMMIT_SHA: fb1fd129f86828359335477f82821525201d4a8c
  GOLANG_MAJOR_MINOR_VERSION: "1.26"
  GOLANG_VERSION: 1.26.11-0
