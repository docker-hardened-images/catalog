contents:
  repositories:
    - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
  keyring:
    - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
  packages:
    - base-files
  builds:
    - name: docker-compose-plugin deb
      work-dir: /go/src/github.com/docker/compose
      caches:
        - path: /go/pkg/mod
      contents:
        repositories:
          - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
        keyring:
          - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
        packages:
          - bash
          - ca-certificates-bundle
          - coreutils
          - findutils
          - golang-1.26=1.26.11-0
          - golang-1.26-oci-config=1.26.11-0
        files:
          - url: git+https://github.com/docker/compose.git#v5.7.1
            checksum: fb1fd129f86828359335477f82821525201d4a8c
            path: /go/src/github.com/docker/compose
            spdx:
              name: docker-compose
              version: 5.7.1
              packages:
                - name: docker-compose
                  purl: pkg:golang/github.com/docker/compose/v5@5.7.1
                  license: Apache-2.0
            uid: 0
            gid: 0
      pipeline:
        - name: update compose go dependencies
          uses: go/bump@v2
          with:
            deps:
              - github.com/klauspost/compress@v1.20.2
              - golang.org/x/net@v0.62.0
              - google.golang.org/grpc@v1.85.0-dev.0.20260825072537-93e31b48545e
            download: true
        - name: test compose after dependency updates
          runs: |
            set -eux -o pipefail

            go test -count=1 -timeout=5m -tags e2e ./cmd/...
        - name: build compose
          uses: go/build@v1
          with:
            ldflags:
              - -X github.com/docker/compose/v5/internal.Version=v5.7.1
            output: ${target.dir}/usr/libexec/docker/cli-plugins/docker-compose
            packages: ./cmd
            tags: e2e
        - uses: dhi/build-pkg:0
          with:
            description: Docker Compose (V2) plugin for the Docker CLI
            files:
              - usr/libexec/docker/cli-plugins/docker-compose
            formats:
              - deb
            license: Apache-2.0
            name: docker-compose-plugin
            rel: 0
            url: https://github.com/docker/compose
            version: 5.7.1
