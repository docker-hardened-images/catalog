    - https://dl-cdn.alpinelinux.org/alpine/v3.24/community
  keyring:
    - https://dhi.io/keyring/dhi-apk@docker-0F81AD7700D99184.rsa.pub
  packages:
    - alpine-baselayout-data
  builds:
    - name: loki-3.7
      work-dir: /go/src/github.com/grafana/loki
      caches:
        - path: /go/pkg/mod
      contents:
        packages:
          - busybox
          - bash
          - ca-certificates-bundle
          - coreutils
          - findutils
          - make
          - mawk
          - sed
          - golang-1.26=1.26.11-r1
          - golang-1.26-oci-config=1.26.11-r1
        files:
          - url: git+https://github.com/grafana/loki.git#v3.7.11
            checksum: 56f8c86a518e652c21f4d13db10e193b729115d8
            path: /go/src/github.com/grafana/loki
            spdx:
              name: loki
              version: 3.7.11
              packages:
                - name: loki
                  purl: pkg:dhi/loki@3.7.11
                  license: AGPL-3.0
            uid: 0
            gid: 0
      pipeline:
        - name: update go dependencies and vendor (3.7 only)
          uses: go/bump@v2
          with:
            deps:
              - github.com/andybalholm/brotli@v1.2.7
              - github.com/aws/aws-sdk-go-v2/service/s3@v1.97.3
              - golang.org/x/net@v0.62.0
            download: true
            tidy: true
        - name: preserve s3 middleware compatibility (3.7 only)
          uses: go/bump@v2
          with:
            deps:
              - github.com/aws/aws-sdk-go-v2/service/internal/s3shared@v1.19.29
            downgrade: true
            download: true
        - name: bump thrift and testify (3.7 only)
          privileged: true
          runs: |
            set -eux -o pipefail

            go get github.com/apache/thrift@v0.24.0 # CVE-2026-43871
            go get github.com/go-openapi/testify/v2@v2.5.1
            go get github.com/go-openapi/testify/enable/yaml/v2@v2.5.1
            go mod tidy
            go mod vendor
        - name: build
          uses: go/build@v1
          environment:
            GODEBUG: tarinsecurepath=0,zipinsecurepath=0
            GOFLAGS: -buildvcs=false
          with:
            fips: false
            ldflags:
              - -extldflags "-static"
              - -X github.com/grafana/loki/v3/pkg/util/build.Branch=3.7.11
              - -X github.com/grafana/loki/v3/pkg/util/build.Version=3.7.11
              - -X github.com/grafana/loki/v3/pkg/util/build.Revision=56f8c86a518e652c21f4d13db10e193b729115d8
              - -X github.com/grafana/loki/v3/pkg/util/build.BuildUser=dhi@build
              - -X github.com/grafana/loki/v3/pkg/util/build.BuildDate=$(date -ud @${SOURCE_DATE_EPOCH} +'%Y-%m-%dT%H:%M:%SZ')
            output: ${target.dir}/usr/bin/loki
            packages: ./cmd/loki
            tags: netgo
        - name: build dev
          uses: go/build@v1
          environment:
            GODEBUG: tarinsecurepath=0,zipinsecurepath=0
            GOFLAGS: -buildvcs=false
          with:
            fips: false
            ldflags:
              - -extldflags "-static"
              - -X github.com/grafana/loki/v3/pkg/util/build.Branch=3.7.11
              - -X github.com/grafana/loki/v3/pkg/util/build.Version=3.7.11
              - -X github.com/grafana/loki/v3/pkg/util/build.Revision=56f8c86a518e652c21f4d13db10e193b729115d8
              - -X github.com/grafana/loki/v3/pkg/util/build.BuildUser=dhi@build
              - -X github.com/grafana/loki/v3/pkg/util/build.BuildDate=$(date -ud @${SOURCE_DATE_EPOCH} +'%Y-%m-%dT%H:%M:%SZ')
            output: ${target.dir}/usr/bin/loki-dev
            packages: ./cmd/loki
            strip: false
            tags: netgo
        - name: install config
          runs: |
            set -eux -o pipefail

            mkdir -p "${target.dir}/etc/loki"
            cp -a cmd/loki/loki-docker-config.yaml "${target.dir}/etc/loki/local-config.yaml"
        - uses: dhi/build-pkg:0
          with:
            description: Grafana Loki log aggregation system
            files:
              - usr/bin/loki
              - etc/loki/local-config.yaml
            license: AGPL-3.0
            name: loki-3.7
            rel: 0
            subpackages:
              - files:
                  - path: usr/bin/loki
                    source: usr/bin/loki-dev
                name: loki-3.7-dev
            url: https://github.com/grafana/loki
            version: 3.7.11
