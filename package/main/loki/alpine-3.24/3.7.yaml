image: dhi.io/pkg-loki
variant: runtime
tags:
  - 3.7.7-alpine3.24
  - 3.7.7-r1-alpine3.24
platforms:
  - linux/amd64
  - linux/arm64
dates:
  release: "2026-03-26"
vars:
  COMMIT_SHA: 7a40404f32b3e6464c9cfc6cc7dd75a40f3931da
  GOLANG_MAJOR_MINOR_VERSION: "1.26"
  GOLANG_VERSION: 1.26.8-r0
  PACKAGE_NAME: loki-3.7
  REL: "1"
  SEMVER_MAJOR_MINOR_VERSION: "3.7"
  SEMVER_MAJOR_VERSION: "3"
  SEMVER_VERSION: 3.7.7
  VERSION: 3.7.7
contents:
  repositories:
    - https://dhi.io/apk/alpine/v3.24/main
    - https://dhi.io/apk/alpine/v3.23/main
    - https://dl-cdn.alpinelinux.org/alpine/v3.24/main
    - https://dl-cdn.alpinelinux.org/alpine/v3.24/community
  keyring:
    - https://dhi.io/keyring/dhi-apk@docker-0F81AD7700D99184.rsa.pub
  packages:
    - alpine-baselayout-data
  builds:
    - name: loki-3.7
      work-dir: /go/src/github.com/grafana/loki
      contents:
        packages:
          - busybox
          - bash
          - ca-certificates-bundle
          - coreutils
          - findutils
          - make
          - mawk
          - sed
          - golang-1.26=1.26.8-r0
          - golang-1.26-oci-config=1.26.8-r0
        files:
          - url: git+https://github.com/grafana/loki.git#v3.7.7
            checksum: 7a40404f32b3e6464c9cfc6cc7dd75a40f3931da
            path: /go/src/github.com/grafana/loki
            spdx:
              name: loki
              version: 3.7.7
              packages:
                - name: loki
                  purl: pkg:dhi/loki@3.7.7
                  license: AGPL-3.0
            uid: 0
            gid: 0
      pipeline:
        - name: update go dependencies and vendor
          uses: go/bump@v2
          with:
            deps:
              - github.com/aws/aws-sdk-go-v2/service/s3@v1.97.3
              - github.com/buger/jsonparser@v1.1.2
              - github.com/go-jose/go-jose/v4@v4.1.4
              - github.com/klauspost/compress@v1.18.7
              - go.etcd.io/etcd/client/pkg/v3@v3.6.14
              - google.golang.org/grpc@v1.82.1
            download: true
        - name: bump thrift and testify
          privileged: true
          runs: |
            set -eux -o pipefail

            go get github.com/apache/thrift@v0.23.0
            go get github.com/go-openapi/testify/v2@v2.5.1
            go get github.com/go-openapi/testify/enable/yaml/v2@v2.5.1
            go mod tidy
            go mod vendor
        - name: build
          uses: go/build@v1
          environment:
            GOFLAGS: -buildvcs=false
          with:
            fips: false
            ldflags:
              - -extldflags "-static"
              - -X github.com/grafana/loki/v3/pkg/util/build.Branch=3.7.7
              - -X github.com/grafana/loki/v3/pkg/util/build.Version=3.7.7
              - -X github.com/grafana/loki/v3/pkg/util/build.Revision=7a40404f32b3e6464c9cfc6cc7dd75a40f3931da
              - -X github.com/grafana/loki/v3/pkg/util/build.BuildUser=dhi@build
              - -X github.com/grafana/loki/v3/pkg/util/build.BuildDate=$(date -ud @${SOURCE_DATE_EPOCH} +'%Y-%m-%dT%H:%M:%SZ')
            output: ${target.dir}/usr/bin/loki
            packages: ./cmd/loki
            tags: netgo
        - name: build dev
          uses: go/build@v1
          environment:
            GOFLAGS: -buildvcs=false
          with:
            fips: false
            ldflags:
              - -extldflags "-static"
              - -X github.com/grafana/loki/v3/pkg/util/build.Branch=3.7.7
              - -X github.com/grafana/loki/v3/pkg/util/build.Version=3.7.7
              - -X github.com/grafana/loki/v3/pkg/util/build.Revision=7a40404f32b3e6464c9cfc6cc7dd75a40f3931da
              - -X github.com/grafana/loki/v3/pkg/util/build.BuildUser=dhi@build
              - -X github.com/grafana/loki/v3/pkg/util/build.BuildDate=$(date -ud @${SOURCE_DATE_EPOCH} +'%Y-%m-%dT%H:%M:%SZ')
            output: ${target.dir}/usr/bin/loki-dev
            packages: ./cmd/loki
            strip: false
            tags: netgo
        - name: install config
          runs: |
            set -eux -o pipefail

            mkdir -p "${target.dir}/etc/loki"
            cp -a cmd/loki/loki-docker-config.yaml "${target.dir}/etc/loki/local-config.yaml"
        - uses: dhi/build-pkg:0
          with:
            description: Grafana Loki log aggregation system
            files:
              - usr/bin/loki
              - etc/loki/local-config.yaml
            license: AGPL-3.0
            name: loki-3.7
            rel: 1
            subpackages:
              - files:
                  - path: usr/bin/loki
                    source: usr/bin/loki-dev
                name: loki-3.7-dev
            url: https://github.com/grafana/loki
            version: 3.7.7
os-release:
  name: Docker Hardened Images (Alpine)
  id: alpine
