# syntax=dhi.io/build:2-debian13

image: dhi.io/pkg-deno
variant: runtime
tags:
  - 2.9.8
  - 2.9.8-r0
  - 2.9.8-debian13
  - 2.9.8-r0-debian13
platforms:
  - linux/amd64
  - linux/arm64
dates:
  release: "2025-09-10"
vars:
  ARCH: '#{ target.arch == "amd64" ? "x86_64" : "aarch64" }'
  COMMIT_SHA: fe7ed012d92c642fd8e5607ac5a45d517538b5c5
  PACKAGE_NAME: deno-2
  REL: "0"
  RUST_DIST_CHECKSUM: '#{ target.arch == "amd64" ? "sha256:2e0338f18ecbaa4a0f631b9e80e8b8e26bb6fe77dd5454fba8a70cf96c1e84a1" : "sha256:094c9c36531911c5cc7dd6ab2d3069ab8dcd744d6239b0bda1387b243dfc391e" }'
  RUST_VERSION: 1.95.0
  SEMVER_MAJOR_MINOR_VERSION: "2.9"
  SEMVER_MAJOR_VERSION: "2"
  SEMVER_VERSION: 2.9.8
  VERSION: 2.9.8
contents:
  repositories:
    - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
  keyring:
    - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
  packages:
    - base-files
  builds:
    - name: deno
      work-dir: ${source.dir}/deno-fe7ed012d92c642fd8e5607ac5a45d517538b5c5
      contents:
        packages:
          - bash
          - ca-certificates
          - coreutils
          - findutils
          - grep
          - gawk
          - mawk
          - sed
          - tar
          - xz-utils
          - binutils
          - build-essential
          - cmake
          - libclang-dev
          - libffi-dev
          - libglib2.0-dev
          - protobuf-compiler
        files:
          - url: https://static.rust-lang.org/dist/rust-1.95.0-${ARCH}-unknown-linux-gnu.tar.xz
            checksum: ${RUST_DIST_CHECKSUM}
            path: ${source.dir}/rust-1.95.0-${ARCH}-unknown-linux-gnu.tar.xz
            spdx:
              name: rust
              version: 1.95.0
              packages:
                - name: rust
                  purl: pkg:dhi/rust@1.95.0
                  license: MIT
                - name: cargo
                  purl: pkg:dhi/cargo@1.95.0
                  license: MIT
            uid: 0
            gid: 0
          - url: git+https://github.com/denoland/deno.git#v2.9.8
            checksum: fe7ed012d92c642fd8e5607ac5a45d517538b5c5
            path: ${source.dir}/deno-fe7ed012d92c642fd8e5607ac5a45d517538b5c5
            spdx:
              name: deno
              version: 2.9.8
              packages:
                - name: deno
                  purl: pkg:dhi/deno@2.9.8
                  license: MIT
            uid: 0
            gid: 0
      pipeline:
        - name: install-rust-toolchain
          runs: |
            set -eux -o pipefail

            tar -xf "${source.dir}/rust-1.95.0-${ARCH}-unknown-linux-gnu.tar.xz" -C "${source.dir}"
            "${source.dir}/rust-1.95.0-${ARCH}-unknown-linux-gnu/install.sh" \
              --destdir=/opt/rust-toolchain --disable-ldconfig
            rm -rf /opt/rust-toolchain/usr/local/share/doc/rust
        - name: build
          privileged: true
          runs: |
            set -eux -o pipefail

            export PATH="/opt/rust-toolchain/usr/local/bin:${PATH}"
            cargo build --release -vv
        - name: test
          privileged: true
          runs: |
            set -eux -o pipefail

            export PATH="/opt/rust-toolchain/usr/local/bin:${PATH}"
            ./target/release/deno run tests/testdata/run/002_hello.ts
        - name: stage
          runs: |
            set -eux -o pipefail

            install -d "${target.dir}/usr/bin"
            install -D -m 755 target/release/deno "${target.dir}/usr/bin/deno"
            strip --strip-unneeded "${target.dir}/usr/bin/deno"
            if [ -d /opt/docker/sbom/deno ]; then
              install -d "${target.dir}/opt/docker/sbom"
              cp -a /opt/docker/sbom/deno "${target.dir}/opt/docker/sbom/"
            fi
        - uses: dhi/build-pkg:0
          with:
            depends:
              - libc6
              - libgcc-s1
              - gcc
            description: A secure runtime for JavaScript and TypeScript
            files:
              - usr/bin/deno
              - opt/docker/sbom/deno
            formats:
              - deb
            license: MIT
            name: deno-2
            rel: 0
            url: https://deno.com
            version: 2.9.8
os-release:
  name: Docker Hardened Images (Debian)
  id: debian
  version-id: "13"
  version-codename: trixie
  pretty-name: Docker Hardened Images/Debian GNU/Linux 13 (trixie)
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
