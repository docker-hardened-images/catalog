image: dhi.io/pkg-httpd
variant: runtime
tags:
  - 2.4.68-0
  - 2.4.68-0-debian13
platforms:
  - linux/amd64
  - linux/arm64
dates:
  release: "2012-02-21"
vars:
  APR_COMMIT_SHA: 5c18df51a91bcb3807f78eb36841d4d2ccf5563d
  APR_VERSION: 1.7.6
  APU_COMMIT_SHA: eb1f0c8ebd4f9633c327f595746933da6349dded
  APU_VERSION: 1.6.5
  COMMIT_SHA: 736bb657405eb73fd68a64772c3a908807bdb887
  DHI_REL: "0"
  DHI_VERSION: 2.4.68-0
  PACKAGE_NAME: httpd
  VERSION: 2.4.68
contents:
  packages:
    - '!base-files'
  builds:
    - name: httpd deb
      work-dir: ${source.dir}/httpd-src
      contents:
        packages:
          - autoconf
          - automake
          - bash
          - build-essential
          - ca-certificates
          - debhelper
          - dpkg-dev
          - findutils
          - grep
          - libbrotli-dev
          - libcurl4-openssl-dev
          - libexpat1-dev
          - liblua5.2-dev
          - libnghttp2-dev
          - libpcre2-dev
          - libssl-dev
          - libtool
          - libtool-bin
          - libxml2-dev
          - make
          - patch
          - python3
          - sed
          - zlib1g-dev
        files:
          - url: git+https://github.com/apache/apr.git#1.7.6
            checksum: 5c18df51a91bcb3807f78eb36841d4d2ccf5563d
            path: ${source.dir}/httpd-src/apr
            spdx:
              name: apr
              version: 1.7.6
              packages:
                - name: apr
                  purl: pkg:github/apache/apr@1.7.6
                  license: Apache-2.0
            uid: 0
            gid: 0
          - url: git+https://github.com/apache/apr-util.git#1.6.5
            checksum: eb1f0c8ebd4f9633c327f595746933da6349dded
            path: ${source.dir}/httpd-src/apr-util
            spdx:
              name: apr-util
              version: 1.6.5
              packages:
                - name: apr-util
                  purl: pkg:github/apache/apr-util@1.6.5
                  license: Apache-2.0
            uid: 0
            gid: 0
          - url: git+https://github.com/apache/httpd.git#2.4.68
            checksum: 736bb657405eb73fd68a64772c3a908807bdb887
            path: ${source.dir}/httpd-src/httpd
            spdx:
              name: httpd
              version: 2.4.68
              packages:
                - name: httpd
                  purl: pkg:dhi/httpd@2.4.68
                  license: Apache-2.0
            uid: 0
            gid: 0
      pipeline:
        - uses: dpkg/bump@v1
          with:
            changelog:
              - DHI Build
            version: 2.4.68-0
        - uses: dpkg/build@v1
          with:
            args: -b -uc -us -d
      paths:
        - type: directory
          path: ${source.dir}/httpd-src/debian
          uid: 0
          gid: 0
          mode: "0600"
          source: package/main/httpd/debian-13/debian
        - type: file
          path: ${source.dir}/httpd-src/bin/httpd-foreground
          uid: 0
          gid: 0
          mode: "0755"
          source: package/main/httpd/bin/httpd-foreground
os-release:
  name: Docker Hardened Images (Debian)
  id: debian
  version-id: "13"
  version-codename: trixie
  pretty-name: Docker Hardened Images/Debian GNU/Linux 13 (trixie)
  home-url: https://docker.com/products/hardened-images/
