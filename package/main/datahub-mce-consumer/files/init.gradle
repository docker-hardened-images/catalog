// repo1.maven.org 429s Docker Build Cloud egress IPs: mirror Maven Central via Google;
// plugin portal .module lookups redirect there too, hence pom+artifact metadataSources.
// DataHub 1.6+ pegasus artifacts are not on Maven Central — add LinkedIn Open Source
// and Confluent repos (same as image/datahub-gms/files/init.gradle).

def GOOGLE_MAVEN_MIRROR = 'https://maven-central.storage-download.googleapis.com/maven2/'
def PLUGIN_PORTAL = 'https://plugins.gradle.org/m2/'
def CONFLUENT_MAVEN = 'https://packages.confluent.io/maven'
def LINKEDIN_OPENSOURCE = 'https://linkedin.jfrog.io/artifactory/open-source'

def configurePluginPortal = { repo ->
    repo.name = 'GradlePluginPortalNoModule'
    repo.url = PLUGIN_PORTAL
    repo.metadataSources {
        mavenPom()
        artifact()
        ignoreGradleMetadataRedirection()
    }
}

def configureResolutionRepos = { repos ->
    repos.mavenLocal()
    repos.maven { it.name = 'GoogleMavenCentralMirror'; it.url = GOOGLE_MAVEN_MIRROR }
    repos.maven { it.name = 'Confluent'; it.url = CONFLUENT_MAVEN }
    repos.maven { it.name = 'LinkedInOpenSource'; it.url = LINKEDIN_OPENSOURCE }
}

allprojects {
    buildscript {
        repositories {
            maven { it.name = 'GoogleMavenCentralMirror'; it.url = GOOGLE_MAVEN_MIRROR }
            maven(configurePluginPortal)
            maven { it.name = 'Confluent'; it.url = CONFLUENT_MAVEN }
            maven { it.name = 'LinkedInOpenSource'; it.url = LINKEDIN_OPENSOURCE }
        }
    }
    repositories {
        configureResolutionRepos(delegate)
    }

    // Set UTF-8 encoding for Java compilation to handle Unicode characters
    // in source files (em dashes, arrows, etc. in comments). Without this,
    // javac defaults to the platform encoding (US-ASCII in the build
    // environment) and fails on unmappable characters.
    tasks.withType(JavaCompile) {
        options.encoding = 'UTF-8'
    }
}

beforeSettings { settings ->
    settings.pluginManagement {
        repositories {
            maven { it.name = 'GoogleMavenCentralMirror'; it.url = GOOGLE_MAVEN_MIRROR }
            maven(configurePluginPortal)
        }
    }
}

settingsEvaluated { settings ->
    try {
        settings.dependencyResolutionManagement {
            repositories {
                maven(configurePluginPortal)
                configureResolutionRepos(delegate)
            }
        }
    } catch (Throwable ignored) {
        // dependencyResolutionManagement is Gradle 6.8+ only.
    }
}

// Force CVE-remediated dependency versions at resolution time.
// CVE-2026-59949 (lz4-java Out-of-bounds Read) -> force lz4-java to 1.11.1.
// Using init script instead of inline build.gradle force because DataHub's
// committed Gradle lockfiles pin dependency versions, and the init script
// force is applied during lock resolution.
allprojects {
    configurations.all {
        resolutionStrategy.eachDependency { details ->
            def grp = details.requested.group
            def name = details.requested.name

            // lz4-java -> 1.11.1 (CVE-2026-59949)
            if (grp == "at.yawk.lz4" && name == "lz4-java") {
                details.useVersion("1.11.1")
                details.because("CVE-2026-59949: Out-of-bounds Read")
            }
        }
    }
}
