# syntax=dhi.io/build:2-alpine3.24

image: dhi.io/pkg-kubernetes-dns-node-cache
variant: runtime
tags:
  - 1.27.2-alpine3.24
  - 1.27.2-r1-alpine3.24
platforms:
  - linux/amd64
  - linux/arm64
vars:
  COMMIT_SHA: 489f16d74f49aca92600b4d5ab6a7c4c2a95990c
  GOLANG_MAJOR_MINOR_VERSION: "1.27"
  GOLANG_VERSION: 1.27.1-r1
  PACKAGE_NAME: kubernetes-dns-node-cache
  REL: "1"
  SEMVER_MAJOR_MINOR_VERSION: "1.27"
  SEMVER_MAJOR_VERSION: "1"
  SEMVER_VERSION: 1.27.2
  VERSION: 1.27.2
contents:
  repositories:
    - https://dhi.io/apk/alpine/v3.24/main
    - https://dhi.io/apk/alpine/v3.23/main
    - https://dl-cdn.alpinelinux.org/alpine/v3.24/main
    - https://dl-cdn.alpinelinux.org/alpine/v3.24/community
  keyring:
    - https://dhi.io/keyring/dhi-apk@docker-0F81AD7700D99184.rsa.pub
  packages:
    - alpine-baselayout-data
  builds:
    - name: kubernetes-dns-node-cache
      work-dir: /go/src/k8s.io/dns
      contents:
        packages:
          - busybox
          - bash
          - ca-certificates-bundle
          - golang-1.27=1.27.1-r1
          - golang-1.27-oci-config=1.27.1-r1
        files:
          - url: git+https://github.com/kubernetes-sigs/node-local-dns.git#1.27.2
            checksum: 489f16d74f49aca92600b4d5ab6a7c4c2a95990c
            path: /go/src/k8s.io/dns
            uid: 0
            gid: 0
      pipeline:
        - name: update go dependencies
          uses: go/bump@v2
          with:
            deps:
              - golang.org/x/crypto@v0.56.0
              - golang.org/x/mod@v0.40.0
              - golang.org/x/net@v0.58.0
              - golang.org/x/sys@v0.47.0
              - google.golang.org/grpc@v1.85.0-dev.0.20260825072537-93e31b48545e
              - github.com/coredns/coredns@v1.14.7
            download: true
            replaces:
              - k8s.io/kube-openapi=k8s.io/kube-openapi@v0.0.0-20250910181357-589584f1c912
            tidy: true
        - uses: go/hermetic@v1
        - name: test
          runs: |
            set -eux -o pipefail

            CGO_ENABLED=0 go test ./cmd/node-cache/... \
              -skip 'TestUpdateCoreFile|TestUpdateIPv6CoreFile' # skip test that fails on fips mode due to dns config not loading in time
        - name: build
          uses: go/build@v1
          with:
            fips: false
            ldflags:
              - -X sigs.k8s.io/node-local-dns/pkg/version.VERSION=1.27.2
            output: ${target.dir}/usr/bin/node-cache
            packages: ./cmd/node-cache
        - name: build dev
          uses: go/build@v1
          with:
            fips: false
            ldflags:
              - -X sigs.k8s.io/node-local-dns/pkg/version.VERSION=1.27.2
            output: ${target.dir}/usr/bin/node-cache-dev
            packages: ./cmd/node-cache
            strip: false
        - uses: dhi/build-pkg:0
          with:
            description: Kubernetes node cache
            files:
              - usr/bin/node-cache
            license: Apache-2.0
            name: kubernetes-dns-node-cache
            rel: 1
            subpackages:
              - files:
                  - path: usr/bin/node-cache
                    source: usr/bin/node-cache-dev
                name: kubernetes-dns-node-cache-dev
            url: https://github.com/kubernetes-sigs/node-local-dns
            version: 1.27.2
os-release:
  name: Docker Hardened Images (Alpine)
  id: alpine
  version-id: "3.24"
  pretty-name: Docker Hardened Images/Alpine Linux v3.24
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
