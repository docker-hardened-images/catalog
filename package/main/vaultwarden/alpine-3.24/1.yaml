# syntax=dhi.io/build:2-alpine3.24

image: dhi.io/pkg-vaultwarden
variant: runtime
tags:
  - 1.37.4-alpine3.24
  - 1.37.4-r0-alpine3.24
platforms:
  - linux/amd64
  - linux/arm64
dates:
  release: "2018-08-21"
vars:
  ARCH: '#{ target.arch == "amd64" ? "x86_64" : "aarch64" }'
  COMMIT_SHA: 7c188967e7a467b19b2757bc3326f9cf3ccae327
  PACKAGE_NAME: vaultwarden-1
  REL: "0"
  RUST_SHA: '#{ target.arch == "amd64" ? "sha256:4178195a7f39f2eeec01cc90d579707787a73c0f42d2bf943f78b8dbbac69c04" : "sha256:d134f371064241e21ad9dba15887b9ba805410948e05b93284d05a68b943950d" }'
  RUST_VERSION: 1.98.1
  SEMVER_MAJOR_MINOR_VERSION: "1.37"
  SEMVER_MAJOR_VERSION: "1"
  SEMVER_VERSION: 1.37.4
  VERSION: 1.37.4
  WEB_VAULT_VERSION: v2026.7.0
contents:
  repositories:
    - https://dhi.io/apk/alpine/v3.24/main
    - https://dl-cdn.alpinelinux.org/alpine/v3.24/main
    - https://dl-cdn.alpinelinux.org/alpine/v3.24/community
  keyring:
    - https://dhi.io/keyring/dhi-apk@docker-0F81AD7700D99184.rsa.pub
  packages:
    - alpine-baselayout-data
  builds:
    - name: vaultwarden
      work-dir: ${source.dir}/vaultwarden
      environment:
        CARGO_HOME: /root/.cargo
        RUSTFLAGS: -C target-feature=-crt-static
        VW_VERSION: 1.37.4
        ZSTD_SYS_USE_PKG_CONFIG: "1"
      caches:
        - path: /root/.cargo
      contents:
        packages:
          - bash
          - build-base
          - ca-certificates-bundle
          - coreutils
          - git
          - grep
          - gzip
          - libpq-dev
          - mariadb-connector-c-dev
          - openssl-dev
          - pkgconf
          - sed
          - sqlite-dev
          - sqlite-libs
          - tar
          - zlib-dev
          - zstd-dev
        files:
          - url: git+https://github.com/dani-garcia/vaultwarden.git#1.37.4
            checksum: 7c188967e7a467b19b2757bc3326f9cf3ccae327
            path: ${source.dir}/vaultwarden
            spdx:
              name: vaultwarden
              version: 1.37.4
              packages:
                - name: vaultwarden
                  purl: pkg:github/dani-garcia/vaultwarden@1.37.4
                  license: AGPL-3.0-only
            uid: 0
            gid: 0
          - url: https://github.com/dani-garcia/bw_web_builds/releases/download/v2026.7.0/bw_web_v2026.7.0.tar.gz
            checksum: https://github.com/dani-garcia/bw_web_builds/releases/download/v2026.7.0/sha256sums.txt
            path: ${source.dir}/bw_web_v2026.7.0.tar.gz
            spdx:
              name: bw_web_builds
              version: v2026.7.0
              packages:
                - name: bw_web_builds
                  purl: pkg:github/dani-garcia/bw_web_builds@v2026.7.0
                  license: GPL-3.0-only
            uid: 0
            gid: 0
          - url: https://static.rust-lang.org/dist/rust-1.98.1-${ARCH}-unknown-linux-musl.tar.gz
            checksum: ${RUST_SHA}
            path: ${source.dir}/rust
            uid: 0
            gid: 0
      pipeline:
        - name: install rust
          work-dir: ${source.dir}/rust/rust-1.98.1-${ARCH}-unknown-linux-musl
          runs: |
            set -eux -o pipefail

            ./install.sh
        - name: cargo sbom
          uses: sbom@v1
          with:
            extra-scanners: rust-cargo-lock-cataloger
            prefix: vaultwarden-cargo
            source: ${source.dir}/vaultwarden
        - name: build
          privileged: true
          runs: |
            set -eux -o pipefail

            cargo build --features sqlite_system,mysql,postgresql --locked --release

            install -D -m 755 target/release/vaultwarden "${target.dir}/usr/bin/vaultwarden"
            install -D -m 755 docker/start.sh "${target.dir}/usr/lib/vaultwarden/start.sh"
            sed -i 's#^exec /vaultwarden #exec /usr/bin/vaultwarden #' "${target.dir}/usr/lib/vaultwarden/start.sh"
            grep -q '^exec /usr/bin/vaultwarden ' "${target.dir}/usr/lib/vaultwarden/start.sh"
            mkdir -p "${target.dir}/usr/share/vaultwarden"
            tar -xzf "${source.dir}/bw_web_v2026.7.0.tar.gz" -C "${target.dir}/usr/share/vaultwarden"
            test -f "${target.dir}/usr/share/vaultwarden/web-vault/index.html"
            test -f "${target.dir}/usr/share/vaultwarden/web-vault/vw-version.json"
        - uses: dhi/build-pkg:0
          with:
            depends:
              - busybox
              - ca-certificates-bundle
              - libcrypto3
              - libgcc
              - libpq
              - libssl3
              - mariadb-connector-c
              - musl
              - sqlite-libs
              - zstd-libs
            description: Unofficial Bitwarden-compatible server written in Rust
            files:
              - usr/bin/vaultwarden
              - usr/lib/vaultwarden
              - usr/share/vaultwarden
            formats:
              - apk
            license: AGPL-3.0-only
            name: vaultwarden-1
            rel: 0
            url: https://github.com/dani-garcia/vaultwarden
            version: 1.37.4
os-release:
  name: Docker Hardened Images (Alpine)
  id: alpine
  version-id: "3.24"
  pretty-name: Docker Hardened Images/Alpine Linux v3.24
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
