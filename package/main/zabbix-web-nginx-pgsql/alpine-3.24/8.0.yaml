# syntax=dhi.io/build:2-alpine3.24

image: dhi.io/pkg-zabbix-web-nginx-pgsql
variant: runtime
tags:
  - 8.0.0-apk-alpine3.24
  - 8.0.0-r1-apk-alpine3.24
platforms:
  - linux/amd64
  - linux/arm64
dates:
  release: "2026-11-05"
  end-of-life: "2031-11-30"
vars:
  PHP_APK_VERSION: 8.5.13-r0
  PHP_EXT_PACKAGE_NAME: zabbix-web-nginx-pgsql-8.0-php-ext
  PHP_INI_DIR: /etc/php-8.5
  PHP_MAJOR_MINOR: "8.5"
  PHP_SRC_ASC_CHECKSUM: d67da4186dfd143d8326e6bb12ed1186dba89e50501ea370f8514bf52dd7ebd5
  PHP_SRC_CHECKSUM: 607602acaf0c3061818e9916ec44a058e8b3d43959a83862b9cd3ec7bf5b785f
  PHP_SRC_VERSION: 8.5.13
  REL: "1"
  SEMVER_MAJOR_MINOR_VERSION: "8.0"
  SEMVER_MAJOR_VERSION: "8"
  SEMVER_VERSION: 8.0.0
  VERSION: 8.0.0
contents:
  repositories:
    - https://dhi.io/apk/alpine/v3.24/main
    - https://dhi.io/apk/alpine/v3.23/main
    - https://dl-cdn.alpinelinux.org/alpine/v3.24/main
    - https://dl-cdn.alpinelinux.org/alpine/v3.24/community
  keyring:
    - https://dhi.io/keyring/dhi-apk@docker-0F81AD7700D99184.rsa.pub
  packages:
    - alpine-baselayout-data
  builds:
    - name: zabbix-web-nginx-pgsql-8.0-php-ext
      work-dir: ${source.dir}
      shell: bash
      contents:
        packages:
          - autoconf
          - bash
          - build-base
          - coreutils
          - diffutils
          - findutils
          - gawk
          - gd-dev
          - gettext-dev
          - grep
          - libpq-dev
          - linux-headers
          - make
          - openldap-dev
          - pcre2-dev
          - php-8.5-dev=8.5.13-r0
          - php-8.5=8.5.13-r0
          - pkgconf
          - scanelf
          - sed
          - tar
          - xz
        files:
          - url: https://www.php.net/distributions/php-8.5.13.tar.xz.asc
            checksum: sha256:d67da4186dfd143d8326e6bb12ed1186dba89e50501ea370f8514bf52dd7ebd5
            path: ${source.dir}/php-8.5.13.tar.xz.asc
            uid: 0
            gid: 0
          - url: https://www.php.net/distributions/php-8.5.13.tar.xz
            checksum: sha256:607602acaf0c3061818e9916ec44a058e8b3d43959a83862b9cd3ec7bf5b785f
            path: ${source.dir}/php-8.5.13.tar.xz
            uid: 0
            gid: 0
      pipeline:
        - name: verify php-8.5.13.tar.xz
          uses: gpg/verify@v1
          with:
            file: ${source.dir}/php-8.5.13.tar.xz
            keys: ${source.dir}/keyring.asc
            signature: ${source.dir}/php-8.5.13.tar.xz.asc
        - name: extract php source
          runs: |
            set -eux -o pipefail

            test "$(php-config --version)" = "8.5.13"

            mkdir php-src
            tar -xf "php-8.5.13.tar.xz" -C php-src --strip-components=1

            echo "7586d794d062a2a4a16513d95358aecaee4450e2062f7e64ce5ce63ac7212fd6  php-src/ext/bcmath/libbcmath/LICENSE" | sha256sum -c
        - name: build php extensions
          runs: |
            set -eux -o pipefail

            build_ext() {
              local ext=$1
              shift
              pushd "php-src/ext/$ext"
              phpize
              ./configure "$@"
              make -j"$(nproc)"
              make install
              popd
            }

            build_ext bcmath
            build_ext gd --with-external-gd
            build_ext gettext
            build_ext ldap
            build_ext pgsql
            build_ext sockets

            test -z "$(find php-src/ext/gd/libgd -name '*.o' -o -name '*.lo')"
            scanelf -qn "$(php-config --extension-dir)/gd.so" | grep -q 'libgd\.so\.3'
        - name: stage extension payload
          runs: |
            set -eux -o pipefail

            pkg_ext_dir="usr/lib/zabbix-web-nginx-pgsql-8.0-php-ext"
            ext_dir="$(php-config --extension-dir)"
            install -d "${target.dir}/${pkg_ext_dir}" "${target.dir}/etc/php-8.5/conf.d"
            for ext in bcmath gd gettext ldap pgsql sockets; do
              install -m 0644 "${ext_dir}/${ext}.so" "${target.dir}/${pkg_ext_dir}/"
              printf 'extension=/%s/%s.so\n' "${pkg_ext_dir}" "${ext}" \
                >> "${target.dir}/etc/php-8.5/conf.d/zabbix-web-nginx-pgsql-8.0-php-ext.ini"
            done

            doc_dir="${target.dir}/usr/share/doc/zabbix-web-nginx-pgsql-8.0-php-ext"
            install -d "${doc_dir}"
            install -m 0644 php-src/LICENSE "${doc_dir}/LICENSE"
            install -m 0644 php-src/ext/bcmath/libbcmath/LICENSE "${doc_dir}/libbcmath-LICENSE"
        - uses: spdx@v1
          with:
            license: PHP-3.01
            name: php
            purl: pkg:generic/php@8.5.13
            version: 8.5.13
        - uses: spdx@v1
          with:
            license: LGPL-2.1-or-later
            name: libbcmath
            purl: pkg:generic/php@8.5.13
            version: 8.5.13
        - name: stage sbom
          runs: |
            set -eux -o pipefail

            install -d "${target.dir}/opt/docker/sbom/zabbix-web-nginx-pgsql-8.0-php-ext"
            for entry in php libbcmath; do
              cp -a "/opt/docker/sbom/${entry}" "${target.dir}/opt/docker/sbom/zabbix-web-nginx-pgsql-8.0-php-ext/"
            done
        - uses: dhi/build-pkg:0
          with:
            depends:
              - php-8.5
              - libgd
              - libintl
              - libldap
              - libpq
            description: PHP extensions the Zabbix frontend requires (bcmath, gd, gettext, ldap, pgsql, sockets)
            files:
              - usr/lib/zabbix-web-nginx-pgsql-8.0-php-ext
              - /etc/php-8.5/conf.d/zabbix-web-nginx-pgsql-8.0-php-ext.ini
              - usr/share/doc/zabbix-web-nginx-pgsql-8.0-php-ext
              - opt/docker/sbom/zabbix-web-nginx-pgsql-8.0-php-ext
            formats:
              - apk
            license: PHP-3.01 AND LGPL-2.1-or-later
            name: zabbix-web-nginx-pgsql-8.0-php-ext
            rel: 1
            url: https://www.php.net/
            version: 8.0.0
      paths:
        - type: file
          path: ${source.dir}/keyring.asc
          uid: 0
          gid: 0
          source: package/main/zabbix-web-nginx-pgsql/key/php8.5.keyring.asc
os-release:
  name: Docker Hardened Images (Alpine)
  id: alpine
  version-id: "3.24"
  pretty-name: Docker Hardened Images/Alpine Linux v3.24
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
