# syntax=dhi.io/build:2-alpine3.24

image: dhi.io/pkg-azcopy
variant: runtime
tags:
  - 10.34.1-alpine3.24
  - 10.34.1-r2-alpine3.24
platforms:
  - linux/amd64
  - linux/arm64
vars:
  COMMIT_SHA: 39083e963e007a879b5ce096f62083af4f209c0c
  GOLANG_VERSION: 1.27.4-r0
  PACKAGE_NAME: azcopy
  REL: "2"
  SEMVER_MAJOR_MINOR_VERSION: "10.34"
  SEMVER_MAJOR_VERSION: "10"
  SEMVER_VERSION: 10.34.1
  VERSION: 10.34.1
contents:
  repositories:
    - https://dhi.io/apk/alpine/v3.24/main
    - https://dhi.io/apk/alpine/v3.23/main
    - https://dl-cdn.alpinelinux.org/alpine/v3.24/main
    - https://dl-cdn.alpinelinux.org/alpine/v3.24/community
  keyring:
    - https://dhi.io/keyring/dhi-apk@docker-0F81AD7700D99184.rsa.pub
  packages:
    - alpine-baselayout-data
  builds:
    - name: azcopy
      work-dir: /go/src/github.com/Azure/azure-storage-azcopy
      contents:
        packages:
          - busybox
          - bash
          - ca-certificates-bundle
          - golang-1.27=1.27.4-r0
          - golang-1.27-oci-config=1.27.4-r0
        files:
          - url: git+https://github.com/Azure/azure-storage-azcopy.git#v10.34.1
            checksum: 39083e963e007a879b5ce096f62083af4f209c0c
            path: /go/src/github.com/Azure/azure-storage-azcopy
            spdx:
              name: azcopy
              version: 10.34.1
              packages:
                - name: azcopy
                  purl: pkg:golang/github.com/Azure/azure-storage-azcopy/v10@10.34.1
                  license: MIT
            uid: 0
            gid: 0
      pipeline:
        - name: update go dependencies
          uses: go/bump@v2
          with:
            deps:
              - github.com/go-jose/go-jose/v4@v4.1.6
              - github.com/klauspost/compress@v1.20.2
              - golang.org/x/net@v0.62.0
            download: true
        - uses: go/hermetic@v1
        - name: test
          runs: |
            set -eux -o pipefail

            if [ "false" = "true" ]; then
              export GODEBUG=fips140=on
            fi

            CGO_ENABLED=0 go test -short -count=1 -timeout 120s \
              ./mock_server ./sddl ./traverser
        - name: build
          uses: go/build@v1
          with:
            cgo_enabled: 0
            fips: false
            output: ${target.dir}/usr/bin/azcopy
            packages: .
        - name: verify version
          runs: |
            set -eux -o pipefail

            grep -qF "const AzcopyVersion = \"10.34.1\"" common/version.go \
              || {
                echo "common/version.go does not declare AzcopyVersion = 10.34.1" >&2
                exit 1
              }

            grep -qF "AzCopy/10.34.1" ${target.dir}/usr/bin/azcopy \
              || {
                echo "built azcopy binary does not embed version 10.34.1" >&2
                exit 1
              }
        - uses: dhi/build-pkg:0
          with:
            description: AzCopy v10 command-line utility for copying data to and from Azure Storage
            files:
              - usr/bin/azcopy
            license: MIT
            name: azcopy
            rel: 2
            url: https://github.com/Azure/azure-storage-azcopy
            version: 10.34.1
os-release:
  name: Docker Hardened Images (Alpine)
  id: alpine
  version-id: "3.24"
  pretty-name: Docker Hardened Images/Alpine Linux v3.24
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
