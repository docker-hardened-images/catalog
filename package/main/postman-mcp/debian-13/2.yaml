# syntax=dhi.io/build:2-debian13

image: dhi.io/pkg-postman-mcp
variant: runtime
tags:
  - 2.15.0
  - 2.15.0-r1
  - 2.15.0-debian13
  - 2.15.0-r1-debian13
platforms:
  - linux/amd64
  - linux/arm64
vars:
  COMMIT_SHA: 818d3805333f19113cee0f8d9665e3c12c1e7d2c
  PNPM_VERSION: 10.6.2
  REL: "1"
  SEMVER_MAJOR_MINOR_VERSION: "2.15"
  SEMVER_MAJOR_VERSION: "2"
  SEMVER_VERSION: 2.15.0
  VERSION: 2.15.0
contents:
  repositories:
    - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
  keyring:
    - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
  packages:
    - base-files
  builds:
    - name: postman-mcp
      work-dir: ${source.dir}/postman-mcp
      environment:
        CI: "true"
        PNPM_HOME: /pnpm
        PNPM_VERSION: 10.6.2
      caches:
        - path: /pnpm/store
        - path: /root/.cache
      contents:
        repositories:
          - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
        keyring:
          - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
        packages:
          - bash
          - ca-certificates
          - coreutils
          - findutils
          - git
          - mawk
          - nodejs-22
          - node-corepack
        files:
          - url: git+https://github.com/postmanlabs/postman-mcp-server.git#v2.15.0
            checksum: 818d3805333f19113cee0f8d9665e3c12c1e7d2c
            path: ${source.dir}/postman-mcp
            spdx:
              name: postman-mcp
              version: 2.15.0
              packages:
                - name: postman-mcp
                  purl: pkg:github/postmanlabs/postman-mcp-server@2.15.0
                  license: Apache-2.0
            uid: 0
            gid: 0
      pipeline:
        - name: prepare pnpm
          privileged: true
          runs: |
            set -eux -o pipefail

            corepack enable
            chmod +x /usr/lib/nodejs/corepack/dist/*.js
            corepack prepare pnpm@10.6.2 --activate
            rm dist/package.json
            pnpm install --frozen-lockfile --ignore-scripts
        - name: bump pnpm dependencies
          uses: pnpm/bump@v1
          privileged: true
          with:
            bumps: ${source.dir}/patch/pnpm-bumps.json
            pnpm-root: ${source.dir}/postman-mcp
        - name: install and build
          privileged: true
          runs: |
            set -eux -o pipefail

            cd "${source.dir}/postman-mcp"

            pnpm install --frozen-lockfile
            node ./node_modules/typescript/bin/tsc

            rm -rf node_modules
            pnpm install --frozen-lockfile --prod

            mkdir -p "${target.dir}/usr/lib/nodejs/postman-mcp"
            cp -a dist node_modules package.json "${target.dir}/usr/lib/nodejs/postman-mcp/"
        - name: postman-mcp node_modules sbom
          uses: sbom@v1
          with:
            extra-scanners: javascript-package-cataloger
            prefix: postman-mcp
            source: ${target.dir}/usr/lib/nodejs/postman-mcp/node_modules
        - uses: dhi/build-pkg:0
          with:
            description: Postman MCP server (Model Context Protocol server for the Postman API)
            files:
              - usr/lib/nodejs/postman-mcp
            formats:
              - deb
            license: Apache-2.0
            name: postman-mcp
            rel: 1
            url: https://www.postman.com/product/mcp-server/
            version: 2.15.0
      paths:
        - type: file
          path: ${source.dir}/patch/pnpm-bumps.json
          uid: 0
          gid: 0
          source: package/main/postman-mcp/patch/pnpm-bumps.json
os-release:
  name: Docker Hardened Images (Debian)
  id: debian
  version-id: "13"
  version-codename: trixie
  pretty-name: Docker Hardened Images/Debian GNU/Linux 13 (trixie)
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
