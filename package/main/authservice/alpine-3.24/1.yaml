image: dhi.io/pkg-authservice
variant: runtime
tags:
  - 1.1.8-alpine3.24
  - 1.1.8-r3-alpine3.24
platforms:
  - linux/amd64
  - linux/arm64
dates:
  release: "2024-03-26"
vars:
  COMMIT_SHA: 0abe8a67c41626e204fe6c9c91193a67d47dbc70
  GOLANG_MAJOR_MINOR_VERSION: "1.26"
  GOLANG_VERSION: 1.26.8-r0
  PACKAGE_NAME: authservice
  REL: "3"
  SEMVER_MAJOR_MINOR_VERSION: "1.1"
  SEMVER_MAJOR_VERSION: "1"
  SEMVER_VERSION: 1.1.8
  VERSION: 1.1.8
contents:
  repositories:
    - https://dhi.io/apk/alpine/v3.24/main
    - https://dhi.io/apk/alpine/v3.23/main
    - https://dl-cdn.alpinelinux.org/alpine/v3.24/main
    - https://dl-cdn.alpinelinux.org/alpine/v3.24/community
  keyring:
    - https://dhi.io/keyring/dhi-apk@docker-0F81AD7700D99184.rsa.pub
  packages:
    - alpine-baselayout-data
  builds:
    - name: authservice
      work-dir: /go/src/github.com/istio-ecosystem/authservice
      caches:
        - path: /go/pkg/mod
        - path: /root/.cache/go-build
      contents:
        packages:
          - busybox
          - bash
          - ca-certificates-bundle
          - coreutils
          - golang-1.26=1.26.8-r0
          - golang-1.26-oci-config=1.26.8-r0
        files:
          - url: git+https://github.com/istio-ecosystem/authservice.git#v1.1.8
            checksum: 0abe8a67c41626e204fe6c9c91193a67d47dbc70
            path: /go/src/github.com/istio-ecosystem/authservice
            spdx:
              name: authservice
              version: 1.1.8
              packages:
                - name: authservice
                  purl: pkg:golang/github.com/istio-ecosystem/authservice@1.1.8
                  license: Apache-2.0
            uid: 0
            gid: 0
      pipeline:
        - name: update go dependencies
          uses: go/bump@v2
          with:
            deps:
              - golang.org/x/crypto@v0.55.0
              - google.golang.org/grpc@v1.83.1
            download: true
        - name: test
          runs: |
            set -eux -o pipefail

            pkgs="$(go list ./... | grep -v '/e2e' | grep -v 'internal/k8s')"
            CGO_ENABLED=0 GODEBUG= go test -count=1 $pkgs
        - name: build authservice
          uses: go/build@v1
          with:
            fips: false
            ldflags:
              - -X github.com/tetratelabs/run/pkg/version.build=1.1.8-0-g0abe8a67c41626e204fe6c9c91193a67d47dbc70-main
            output: ${target.dir}/usr/bin/authservice
            packages: ./cmd
            strip: true
        - name: build authservice dev
          uses: go/build@v1
          with:
            fips: false
            ldflags:
              - -X github.com/tetratelabs/run/pkg/version.build=1.1.8-0-g0abe8a67c41626e204fe6c9c91193a67d47dbc70-main
            output: ${target.dir}/usr/bin/authservice-dev
            packages: ./cmd
            strip: false
        - uses: dhi/build-pkg:0
          with:
            description: Envoy external authorization service implementing OIDC for Istio
            files:
              - usr/bin/authservice
            license: Apache-2.0
            name: authservice
            rel: 3
            subpackages:
              - files:
                  - path: usr/bin/authservice
                    source: usr/bin/authservice-dev
                name: authservice-dev
            url: https://github.com/istio-ecosystem/authservice
            version: 1.1.8
