# syntax=dhi.io/build:2-debian13

image: dhi.io/pkg-gitlab-webservice
variant: runtime
tags:
  - 19.1.8
  - 19.1.8-r2
  - 19.1.8-debian13
  - 19.1.8-r2-debian13
platforms:
  - linux/amd64
  - linux/arm64
dates:
  release: "2026-06-17"
vars:
  CARGO_VERSION: 1.97.1-0
  COMMIT_SHA: 25601e798604a50f025102e4598a6884305802c4
  DEVFILE_COMMIT_SHA: 1f25dab8010cea3a8e23a498616efe654312e1cf
  DEVFILE_VERSION: 0.5.2
  GOLANG_VERSION: 1.26.8-0
  NODEJS_VERSION: 22.23.2-1
  PACKAGE_NAME: gitlab-webservice-19
  REL: "2"
  RUBY_MAJOR_MINOR_VERSION: "3.3"
  RUBY_VERSION: 3.3.12-50
  RUSTC_VERSION: 1.97.1-0
  SEMVER_MAJOR_MINOR_VERSION: "19.1"
  SEMVER_MAJOR_VERSION: "19"
  SEMVER_VERSION: 19.1.8
  VERSION: 19.1.8
contents:
  packages:
    - '!base-files'
  builds:
    - name: build rails app
      work-dir: /srv/gitlab
      shell: /bin/bash
      contents:
        repositories:
          - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
        keyring:
          - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
        packages:
          - ruby-3.3-dev=3.3.12-50
          - ruby-3.3=3.3.12-50
          - autoconf
          - bash
          - bison
          - build-essential
          - ca-certificates
          - coreutils
          - curl
          - diffutils
          - findutils
          - gawk
          - git
          - hostname
          - libc-bin
          - make
          - sed
          - clang
          - cmake
          - gzip
          - libbsd-dev
          - libbz2-dev
          - libclang-dev
          - libffi-dev
          - libicu-dev
          - liblz-dev
          - libmagic-dev
          - liblzma-dev
          - libseccomp-dev
          - libssh2-1-dev
          - libzstd-dev
          - zlib1g-dev
          - libgmp-dev
          - libyaml-dev
          - libjemalloc-dev
          - libkrb5-3
          - libkrb5-dev
          - libre2-dev
          - libpq-dev
          - libxml2-dev
          - llvm-dev
          - dpkg-dev
          - gnu-which
          - musl-dev
          - passwd
          - patch
          - pkg-config
          - sudo
          - grep
          - nodejs-22=22.23.2-1
          - npm
          - yarn-classic
          - cargo-1.97=1.97.1-0
          - rustc-1.97=1.97.1-0
        files:
          - url: git+https://gitlab.com/gitlab-org/gitlab-foss.git#v19.1.8
            checksum: 25601e798604a50f025102e4598a6884305802c4
            path: /srv/gitlab
            spdx:
              name: gitlab-ce
              version: 19.1.8
              packages:
                - name: gitlab-ce
                  purl: pkg:gitlab/gitlab-org/gitlab-foss@v19.1.8
                  license: MIT
            uid: 0
            gid: 0
      pipeline:
        - name: prepare source tree
          runs: |
            set -eux -o pipefail

            useradd -m -u 1000 -s /bin/bash git

            rm -rf /srv/gitlab/.git

            chown -R git:git /srv/gitlab
        - name: widen GitLab 19 gem constraints for security fixes
          uses: patch@v1
          with:
            options: -p1
            patch: ${source.dir}/patch/gem-constraints-19.patch
        - name: bump vulnerable gem versions in lockfile
          privileged: true
          runs: |
            set -eux -o pipefail

            bundle lock --update activestorage activesupport actionview actionpack railties addressable faraday net-imap nokogiri sidekiq-cron graphql puma concurrent-ruby websocket-driver excon css_parser loofah rails-html-sanitizer json msgpack oauth2 --conservative

            echo "Lockfile updated:"
            grep -E "activestorage|addressable|^    faraday |^    net-imap |^    nokogiri |^    sidekiq-cron |^    graphql |^    puma |^    concurrent-ruby |^    websocket-driver |^    excon |^    css_parser |^    loofah |^    rails-html-sanitizer |^    json |^    msgpack |^    oauth2 " Gemfile.lock | head -30
        - name: bump mail gem for CVE-2026-63435
          privileged: true
          runs: |
            set -eux -o pipefail

            bundle lock --update mail
            ruby -rbundler -e '
              specs = Bundler::LockfileParser.new(File.read("Gemfile.lock")).specs.to_h { |spec| [spec.name, spec.version] }
              abort "mail resolved to #{specs.fetch("mail")}, expected >= 2.9.1" if specs.fetch("mail") < Gem::Version.new("2.9.1")
            '

            echo "mail lockfile version:"
            grep -E "^    mail " Gemfile.lock
        - name: update GitLab 19 gems with new CVE fixes
          privileged: true
          runs: |
            set -eux -o pipefail

            bundle lock --update websocket-driver doorkeeper-openid_connect excon loofah rails-html-sanitizer --conservative
            ruby -rbundler -e '
              specs = Bundler::LockfileParser.new(File.read("Gemfile.lock")).specs.to_h { |spec| [spec.name, spec.version] }
              minimum = {
                "websocket-driver" => "0.8.2",
                "sidekiq-cron" => "2.4.0",
                "doorkeeper-openid_connect" => "1.10.0",
                "excon" => "1.5.0",
                "loofah" => "2.25.2",
                "rails-html-sanitizer" => "1.7.1",
              }
              minimum.each do |name, version|
                abort "#{name} resolved to #{specs.fetch(name)}, expected >= #{version}" if specs.fetch(name) < Gem::Version.new(version)
              end
            '

            echo "GitLab 19 CVE lockfile updates:"
            grep -E "^    (websocket-driver|sidekiq-cron|doorkeeper-openid_connect|excon|loofah|rails-html-sanitizer) " Gemfile.lock
        - name: install node dependencies
          privileged: true
          runs: |
            set -eux -o pipefail

            yarn cache clean
            yarn install --production --pure-lockfile
        - name: bundle install
          privileged: true
          runs: |
            set -eux -o pipefail

            bundle config set --local version system
            bundle config set --local clean 'true'
            bundle config set --local deployment 'true'
            bundle config set --local without 'development test mysql aws'

            bundle install --jobs 4 --retry 5
        - name: compile gettext
          runs: |
            set -eux -o pipefail

            CI=true RAILS_ENV=production NODE_ENV=production USE_DB=false SKIP_STORAGE_VALIDATION=true \
              bundle exec rake gettext:compile
        - name: configure and compile assets
          runs: |
            set -eux -o pipefail

            cp config/gitlab.yml.example config/gitlab.yml
            cp config/resque.yml.example config/resque.yml
            cp config/secrets.yml.example config/secrets.yml
            cp config/database.yml.postgresql config/database.yml
            cp /puma-src/puma.rb config/puma.rb
            sed --in-place "/geo:/,/^$/d" config/database.yml
            sed --in-place "/embedding:/,/^$/d" config/database.yml
            sed --in-place "/host: localhost/d" config/gitlab.yml
            sed --in-place "/port: 80/d" config/gitlab.yml
            sed --in-place "s/# user:.*/user: git/" config/gitlab.yml
            sed --in-place "s:/home/git/repositories:/var/opt/gitlab/repo:" config/gitlab.yml

            echo 'gitlab-cloud-native-image' > INSTALLATION_TYPE

            mkdir -p tmp
            node scripts/frontend/infection_scanner/infection_scanner.mjs || true

            CI=true RAILS_ENV=production NODE_ENV=production USE_DB=false SKIP_STORAGE_VALIDATION=true \
              bundle exec rake gitlab:assets:compile
        - name: cleanup
          runs: |
            set -eux -o pipefail

            mkdir -p /var/opt/gitlab/data /var/opt/gitlab/repo /var/opt/gitlab/config /var/opt/gitlab/.upgrade-status
            chown -R git:git /var/opt/gitlab

            rm -rf node_modules/ tmp/ spec/ ee/spec/ storybook/
            rm -rf qa/ rubocop/ tooling/ .gitlab/ .github/ docker/
            rm -rf changelogs/ danger/ Dangerfile
            rm -f package.json yarn.lock

            find public/assets/webpack -name '*.map' -type f -delete 2> /dev/null || true

            RUBY_DIR="vendor/bundle/ruby"

            rm -rf ${RUBY_DIR}/*/cache

            rm -rf ${RUBY_DIR}/*/gems/*/spec \
              ${RUBY_DIR}/*/gems/*/test \
              ${RUBY_DIR}/*/gems/*/tests

            rm -rf ${RUBY_DIR}/*/gems/rugged*/vendor \
              ${RUBY_DIR}/*/gems/libyajl2*/**/vendor

            rm -rf ${RUBY_DIR}/*/gems/grpc-*/include \
              ${RUBY_DIR}/*/gems/grpc-*/src/core \
              ${RUBY_DIR}/*/gems/grpc-*/src/ruby/ext \
              ${RUBY_DIR}/*/gems/grpc-*/src/ruby/spec \
              ${RUBY_DIR}/*/gems/grpc-*/third_party

            rm -rf ${RUBY_DIR}/*/extensions/*/*/*/mkmf.log \
              ${RUBY_DIR}/*/extensions/*/*/*/gem_make.out

            rm -rf ${RUBY_DIR}/*/gems/*/ext/*.c \
              ${RUBY_DIR}/*/gems/*/ext/*/*.c \
              ${RUBY_DIR}/*/gems/*/ext/*.o \
              ${RUBY_DIR}/*/gems/*/ext/*/*.o

            rm -rf ${RUBY_DIR}/*/gems/*/*.gemspec \
              ${RUBY_DIR}/*/gems/*/*.md \
              ${RUBY_DIR}/*/gems/*/*.rdoc \
              ${RUBY_DIR}/*/gems/*/*.sh \
              ${RUBY_DIR}/*/gems/*/*.txt \
              ${RUBY_DIR}/*/gems/*/*LICENSE* \
              ${RUBY_DIR}/*/gems/*/CHANGES* \
              ${RUBY_DIR}/*/gems/*/Gemfile \
              ${RUBY_DIR}/*/gems/*/Guardfile \
              ${RUBY_DIR}/*/gems/*/README* \
              ${RUBY_DIR}/*/gems/*/Rakefile \
              ${RUBY_DIR}/*/gems/*/run_tests.rb \
              ${RUBY_DIR}/*/gems/*/Documentation \
              ${RUBY_DIR}/*/gems/*/bench \
              ${RUBY_DIR}/*/gems/*/contrib \
              ${RUBY_DIR}/*/gems/*/doc \
              ${RUBY_DIR}/*/gems/*/doc-api \
              ${RUBY_DIR}/*/gems/*/examples \
              ${RUBY_DIR}/*/gems/*/fixtures \
              ${RUBY_DIR}/*/gems/*/gemfiles \
              ${RUBY_DIR}/*/gems/*/libtest \
              ${RUBY_DIR}/*/gems/*/man \
              ${RUBY_DIR}/*/gems/*/sample_documents \
              ${RUBY_DIR}/*/gems/*/samples \
              ${RUBY_DIR}/*/gems/*/sample \
              ${RUBY_DIR}/*/gems/*/script \
              ${RUBY_DIR}/*/gems/*/t

            find ${RUBY_DIR} -name '*.gem' -type f -delete 2> /dev/null || true
        - name: generate bootsnap cache
          runs: |
            set -eux -o pipefail

            mkdir -p /srv/gitlab/bootsnap
            ENABLE_BOOTSNAP=1 BOOTSNAP_CACHE_DIR=/srv/gitlab/bootsnap \
              bundle exec bootsnap precompile --gemfile \
              --exclude '/srv/gitlab/config/*.yml|/srv/gitlab/public' .
        - name: prepare outputs
          runs: |
            set -eux -o pipefail

            chown -R 1000:1000 /srv/gitlab /var/opt/gitlab

            mv /srv/gitlab/log /var/log/gitlab
            ln -s /var/log/gitlab /srv/gitlab/log
            chown -R 1000:1000 /var/log/gitlab

            mkdir -p ${target.dir}/usr/bin
            cp /usr/bin/erb ${target.dir}/usr/bin/

            rm -f /srv/gitlab/vendor/bundle/ruby/3.3.0/gems/devfile-0.5.2-*-linux/out/devfile-*-linux

            mkdir -p ${target.dir}/srv ${target.dir}/var/log ${target.dir}/var/opt
            cp -a /srv/gitlab ${target.dir}/srv/
            cp -a /var/log/gitlab ${target.dir}/var/log/
            cp -a /var/opt/gitlab ${target.dir}/var/opt/

            rm -f ${target.dir}/srv/gitlab/Gemfile.lock

            mkdir -p ${target.dir}/usr/lib/gitlab-webservice/scripts
            cp -a /scripts-src/* ${target.dir}/usr/lib/gitlab-webservice/scripts/
            chmod 0755 ${target.dir}/usr/lib/gitlab-webservice/scripts/*

            mkdir -p ${target.dir}/home/git/gitlab-shell
            chown -R 1000:1000 ${target.dir}/home/git
            cp /srv/gitlab/GITLAB_SHELL_VERSION ${target.dir}/home/git/gitlab-shell/VERSION
      paths:
        - type: file
          path: /scripts-src/entrypoint.sh
          uid: 0
          gid: 0
          mode: "0755"
          source: package/main/gitlab-webservice/scripts/entrypoint.sh
        - type: file
          path: /scripts-src/process-wrapper
          uid: 0
          gid: 0
          mode: "0755"
          source: package/main/gitlab-webservice/scripts/process-wrapper
        - type: file
          path: /scripts-src/healthcheck
          uid: 0
          gid: 0
          mode: "0755"
          source: package/main/gitlab-webservice/scripts/healthcheck
        - type: file
          path: /scripts-src/set-config
          uid: 0
          gid: 0
          mode: "0755"
          source: package/main/gitlab-webservice/scripts/set-config
        - type: file
          path: /puma-src/puma.rb
          uid: 0
          gid: 0
          mode: "0644"
          source: package/main/gitlab-webservice/scripts/puma.rb
        - type: file
          path: ${source.dir}/patch/gem-constraints-19.patch
          uid: 0
          gid: 0
          mode: "0644"
          source: package/main/gitlab-webservice/patch/gem-constraints-19.patch
    - name: devfile
      work-dir: /go/src/devfile-gem/ext
      caches:
        - path: /go/pkg/mod
      contents:
        repositories:
          - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
        keyring:
          - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
        packages:
          - bash
          - ca-certificates
          - coreutils
          - findutils
          - golang-1.26=1.26.8-0
          - mawk
          - sed
        files:
          - url: git+https://gitlab.com/gitlab-org/ruby/gems/devfile-gem.git#0.5.2
            checksum: 1f25dab8010cea3a8e23a498616efe654312e1cf
            path: /go/src/devfile-gem
            spdx:
              name: devfile-gem
              version: 0.5.2
              packages:
                - name: devfile-gem
                  purl: pkg:golang/gitlab-org/ruby/gems/devfile-gem@0.5.2
                  license: MIT
            uid: 0
            gid: 0
      pipeline:
        - name: bump go dependencies (19 only)
          uses: go/bump@v2
          with:
            deps:
              - golang.org/x/crypto@v0.56.0
              - github.com/cloudflare/circl@v1.6.4
              - github.com/go-git/go-git/v5@v5.19.2
              - google.golang.org/grpc@v1.85.0-dev.0.20260825072537-93e31b48545e
              - github.com/containerd/containerd@v1.7.35
            download: true
        - name: build and install
          runs: |
            set -eux -o pipefail

            export GOTOOLCHAIN=local

            MACHINE_ARCH=$(uname -m)
            case "$MACHINE_ARCH" in
              aarch64) GOARCH=arm64 ;;
              x86_64) GOARCH=amd64 ;;
              *)
                echo "Unsupported arch: $MACHINE_ARCH"
                exit 1
                ;;
            esac

            CGO_ENABLED=0 go build -o /tmp/devfile-binary .

            GEM_DIR="${target.dir}/srv/gitlab/vendor/bundle/ruby/3.3.0/gems/devfile-0.5.2-${MACHINE_ARCH}-linux/out"
            mkdir -p "$GEM_DIR"
            mv /tmp/devfile-binary "$GEM_DIR/devfile-${GOARCH}-linux"
        - uses: dhi/build-pkg:0
          with:
            depends:
              - ruby-3.3
            description: GitLab Webservice (Puma) Rails application
            files:
              - srv
              - var
              - usr
              - home
            formats:
              - deb
            license: MIT
            name: gitlab-webservice-19
            rel: 2
            url: https://gitlab.com/gitlab-org/gitlab-foss
            version: 19.1.8
os-release:
  name: Docker Hardened Images (Debian)
  id: debian
  version-id: "13"
  version-codename: trixie
  pretty-name: Docker Hardened Images/Debian GNU/Linux 13 (trixie)
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
