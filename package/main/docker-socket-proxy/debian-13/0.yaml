# syntax=dhi.io/build:2-debian13

image: dhi.io/pkg-docker-socket-proxy
variant: runtime
tags:
  - 0.5.0
  - 0.5.0-r1
  - 0.5.0-debian13
  - 0.5.0-r1-debian13
platforms:
  - linux/amd64
  - linux/arm64
dates:
  release: "2021-01-26"
vars:
  COMMIT_SHA: 2e118a0c0c66e1831f68b7afd6d49ad3e2f96b5d
  HAPROXY_SHA256: sha256:ccfd342f3724c2cd659574044d788f44e20b212467c6bd5edbbfc517a2775dca
  HAPROXY_VERSION: 3.4.7
  REL: "1"
  SEMVER_MAJOR_MINOR_VERSION: "0.5"
  SEMVER_MAJOR_VERSION: "0"
  SEMVER_VERSION: 0.5.0
  VERSION: 0.5.0
contents:
  repositories:
    - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
  keyring:
    - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
  packages:
    - base-files
  builds:
    - name: docker-socket-proxy
      work-dir: ${source.dir}/docker-socket-proxy
      contents:
        packages:
          - bash
          - coreutils
          - dash
          - grep
          - gzip
          - sed
          - tar
        files:
          - url: git+https://github.com/Tecnativa/docker-socket-proxy.git#v0.5.0
            checksum: 2e118a0c0c66e1831f68b7afd6d49ad3e2f96b5d
            path: ${source.dir}/docker-socket-proxy
            spdx:
              name: docker-socket-proxy
              version: 0.5.0
              packages:
                - name: docker-socket-proxy
                  purl: pkg:github/Tecnativa/docker-socket-proxy@v0.5.0
                  license: Apache-2.0
            uid: 0
            gid: 0
          - url: https://www.haproxy.org/download/3.4/src/haproxy-3.4.7.tar.gz
            checksum: sha256:ccfd342f3724c2cd659574044d788f44e20b212467c6bd5edbbfc517a2775dca
            path: ${source.dir}/haproxy.tar.gz
            spdx:
              name: haproxy
              version: 3.4.7
              packages:
                - name: haproxy
                  purl: pkg:dhi/haproxy@3.4.7
                  license: GPL-2.0-only
            uid: 0
            gid: 0
      pipeline:
        - name: stage entrypoint, template, error pages, and licenses
          shell: /bin/bash
          runs: |
            set -eux -o pipefail

            mkdir -p \
              "${target.dir}/usr/bin" \
              "${target.dir}/usr/share/docker-socket-proxy/errors" \
              "${target.dir}/usr/share/licenses/docker-socket-proxy"

            cp -a docker-entrypoint.sh "${target.dir}/usr/bin/docker-entrypoint.sh"
            cp -a haproxy.cfg "${target.dir}/usr/share/docker-socket-proxy/haproxy.cfg.template"
            sed -i 's|/usr/local/etc/haproxy|/usr/share/docker-socket-proxy|g' \
              "${target.dir}/usr/bin/docker-entrypoint.sh" \
              "${target.dir}/usr/share/docker-socket-proxy/haproxy.cfg.template"
            grep -q ' /usr/share/docker-socket-proxy/haproxy.cfg.template ' "${target.dir}/usr/bin/docker-entrypoint.sh"
            test "$(grep -c 'errorfile [0-9]* /usr/share/docker-socket-proxy/errors/' "${target.dir}/usr/share/docker-socket-proxy/haproxy.cfg.template")" -eq 7
            if grep -q /usr/local "${target.dir}/usr/bin/docker-entrypoint.sh" "${target.dir}/usr/share/docker-socket-proxy/haproxy.cfg.template"; then exit 1; fi
            cp -a LICENSE.txt "${target.dir}/usr/share/licenses/docker-socket-proxy/LICENSE.txt"

            tar -xzf "${source.dir}/haproxy.tar.gz" -C /tmp \
              "haproxy-3.4.7/examples/errorfiles" \
              "haproxy-3.4.7/LICENSE"
            cp -a "/tmp/haproxy-3.4.7/examples/errorfiles/." \
              "${target.dir}/usr/share/docker-socket-proxy/errors/"
            cp -a "/tmp/haproxy-3.4.7/LICENSE" \
              "${target.dir}/usr/share/licenses/docker-socket-proxy/haproxy-LICENSE"

            test -x "${target.dir}/usr/bin/docker-entrypoint.sh"
            for code in 400 403 408 500 502 503 504; do
              test -f "${target.dir}/usr/share/docker-socket-proxy/errors/${code}.http"
            done
            test -f "${target.dir}/usr/share/docker-socket-proxy/errors/README"
            test -s "${target.dir}/usr/share/licenses/docker-socket-proxy/LICENSE.txt"
            test -s "${target.dir}/usr/share/licenses/docker-socket-proxy/haproxy-LICENSE"
        - uses: dhi/build-pkg:0
          with:
            apk:
              depends:
                - busybox
                - haproxy
            deb:
              depends:
                - coreutils
                - dash
                - haproxy-3.4
                - libcrypt1
                - sed
            description: Proxy requests to the Docker socket through HAProxy access controls
            files:
              - usr/bin/docker-entrypoint.sh
              - usr/share/docker-socket-proxy
              - usr/share/licenses/docker-socket-proxy
            license: Apache-2.0 AND GPL-2.0-only
            name: docker-socket-proxy-0
            rel: 1
            url: https://github.com/Tecnativa/docker-socket-proxy
            version: 0.5.0
os-release:
  name: Docker Hardened Images (Debian)
  id: debian
  version-id: "13"
  version-codename: trixie
  pretty-name: Docker Hardened Images/Debian GNU/Linux 13 (trixie)
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
