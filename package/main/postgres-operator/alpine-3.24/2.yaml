        packages:
          - busybox
          - bash
          - ca-certificates-bundle
          - golang-1.26=1.26.9-r0
          - golang-1.26-oci-config=1.26.9-r0
        files:
          - url: git+https://github.com/zalando/postgres-operator.git#v2.0.3
