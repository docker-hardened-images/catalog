# syntax=dhi.io/build:2-alpine3.24

image: dhi.io/pkg-ollama
variant: runtime
tags:
  - 0.40.16-alpine3.24
  - 0.40.16-r1-alpine3.24
platforms:
  - linux/amd64
  - linux/arm64
dates:
  release: "2026-08-27"
vars:
  COMMIT_SHA: d63b702609c4300a2ca07be2bdb0adb9834725e5
  GOLANG_MAJOR_MINOR_VERSION: "1.27"
  GOLANG_VERSION: 1.27.4-r0
  LLAMA_CPP_COMMIT_SHA: 6c01da6278ab6c69ed67d9124806b50d2b299ba7
  LLAMA_CPP_TAG_VERSION: b12177
  LLAMA_CPP_VERSION: b12177
  PACKAGE_NAME: ollama
  REL: "1"
  SEMVER_MAJOR_MINOR_VERSION: "0.40"
  SEMVER_MAJOR_VERSION: "0"
  SEMVER_VERSION: 0.40.16
  VERSION: 0.40.16
contents:
  repositories:
    - https://dhi.io/apk/alpine/v3.24/main
    - https://dhi.io/apk/alpine/v3.23/main
    - https://dl-cdn.alpinelinux.org/alpine/v3.24/main
    - https://dl-cdn.alpinelinux.org/alpine/v3.24/community
  keyring:
    - https://dhi.io/keyring/dhi-apk@docker-0F81AD7700D99184.rsa.pub
  packages:
    - alpine-baselayout-data
  builds:
    - name: ollama
      work-dir: /go/src/github.com/ollama/ollama
      contents:
        packages:
          - bash
          - build-base
          - ca-certificates-bundle
          - cmake
          - git
          - linux-headers
          - golang-1.27=1.27.4-r0
          - golang-1.27-oci-config=1.27.4-r0
        files:
          - url: git+https://github.com/ollama/ollama.git#v0.40.16
            checksum: d63b702609c4300a2ca07be2bdb0adb9834725e5
            path: /go/src/github.com/ollama/ollama
            spdx:
              name: ollama
              version: 0.40.16
              packages:
                - name: ollama
                  purl: pkg:golang/github.com/ollama/ollama@0.40.16
                  license: MIT
            uid: 0
            gid: 0
          - url: git+https://github.com/ggml-org/llama.cpp.git#b12177
            checksum: 6c01da6278ab6c69ed67d9124806b50d2b299ba7
            path: ${source.dir}/llama-cpp
            spdx:
              name: llama.cpp
              version: b12177
              packages:
                - name: llama.cpp
                  purl: pkg:github/ggml-org/llama.cpp@b12177
                  license: MIT
            uid: 0
            gid: 0
      pipeline:
        - name: update go dependencies
          uses: go/bump@v2
          with:
            deps:
              - golang.org/x/net@v0.62.0
              - github.com/buger/jsonparser@v1.1.2
        - uses: go/hermetic@v1
        - name: test
          environment:
            GODEBUG: ""
          runs: |
            set -eux -o pipefail

            go test ./envconfig/... ./format/... ./types/... ./template/... ./server/... ./api/... ./llm/... ./discover/... ./transfer/...
        - name: build llama-server
          runs: |
            set -eux -o pipefail

            cmake -S llama/server -B build/llama-server \
              -DCMAKE_BUILD_TYPE=Release \
              -DBUILD_SHARED_LIBS=ON \
              -DGGML_BACKEND_DL=ON \
              -DGGML_NATIVE=OFF \
              -DGGML_OPENMP=OFF \
              -DGGML_CPU_ALL_VARIANTS=ON \
              -DFETCHCONTENT_SOURCE_DIR_LLAMA_CPP=${source.dir}/llama-cpp
            cmake --build build/llama-server --target llama-server --target llama-quantize -- -j "$(nproc)"
            cmake --install build/llama-server --component llama-server --strip --prefix "${target.dir}/usr"
            cp -a "${target.dir}/usr/lib/ollama" "${target.dir}/usr/lib/ollama-dev"
        - name: build ollama
          uses: go/build@v1
          environment:
            GOFLAGS: -buildvcs=false
          with:
            cgo_enabled: 1
            fips: false
            ldflags:
              - -linkmode=external
              - -extldflags=-static
              - -X github.com/ollama/ollama/version.Version=0.40.16
              - -X github.com/ollama/ollama/server.mode=release
            output: ${target.dir}/usr/bin/ollama
        - name: build ollama dev
          uses: go/build@v1
          environment:
            GOFLAGS: -buildvcs=false
          with:
            cgo_enabled: 1
            fips: false
            ldflags:
              - -linkmode=external
              - -extldflags=-static
              - -X github.com/ollama/ollama/version.Version=0.40.16
              - -X github.com/ollama/ollama/server.mode=release
            output: ${target.dir}/usr/bin/ollama-dev
            strip: false
        - uses: dhi/build-pkg:0
          with:
            depends:
              - libgcc
              - libstdc++
            description: Ollama, a tool for running large language models locally (CPU inference)
            files:
              - usr/bin/ollama
              - usr/lib/ollama
            formats:
              - apk
            license: MIT
            name: ollama
            rel: 1
            subpackages:
              - depends:
                  - libgcc
                  - libstdc++
                files:
                  - path: usr/bin/ollama
                    source: usr/bin/ollama-dev
                  - path: usr/lib/ollama
                    source: usr/lib/ollama-dev
                name: ollama-dev
            url: https://ollama.com
            version: 0.40.16
