# syntax=dhi.io/build:2-debian13

image: dhi.io/pkg-ollama
variant: runtime
tags:
  - 0.35.1
  - 0.35.1-r0
  - 0.35.1-debian13
  - 0.35.1-r0-debian13
platforms:
  - linux/amd64
  - linux/arm64
dates:
  release: "2026-08-27"
vars:
  COMMIT_SHA: b0c1ca4f7549d7acdfa52a7dcffc934bc63a43ce
  CUBLAS_VERSION: 13.4.1.3-1
  CUDA_VERSION: 13.2.2-1
  GOLANG_MAJOR_MINOR_VERSION: "1.27"
  GOLANG_VERSION: 1.27.1-1
  LLAMA_CPP_COMMIT_SHA: 6f767fe960c3b97cf37fac4626c86400561ca1e4
  LLAMA_CPP_TAG_VERSION: b11232
  LLAMA_CPP_VERSION: b11232
  NVIDIA_ARCH: '#{ target.arch == "amd64" ? "x86_64" : "sbsa" }'
  PACKAGE_NAME: ollama
  REL: "0"
  SEMVER_MAJOR_MINOR_VERSION: "0.35"
  SEMVER_MAJOR_VERSION: "0"
  SEMVER_VERSION: 0.35.1
  VERSION: 0.35.1
contents:
  repositories:
    - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
  keyring:
    - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
  packages:
    - base-files
  builds:
    - name: ollama
      work-dir: /go/src/github.com/ollama/ollama
      contents:
        packages:
          - bash
          - ca-certificates-bundle
          - cmake
          - make
          - gcc
          - g++
          - git
          - libc6-dev
          - coreutils
          - findutils
          - sed
          - golang-1.27=1.27.1-1
          - golang-1.27-oci-config=1.27.1-1
        files:
          - url: git+https://github.com/ollama/ollama.git#v0.35.1
            checksum: b0c1ca4f7549d7acdfa52a7dcffc934bc63a43ce
            path: /go/src/github.com/ollama/ollama
            spdx:
              name: ollama
              version: 0.35.1
              packages:
                - name: ollama
                  purl: pkg:golang/github.com/ollama/ollama@0.35.1
                  license: MIT
            uid: 0
            gid: 0
          - url: git+https://github.com/ggml-org/llama.cpp.git#b11232
            checksum: 6f767fe960c3b97cf37fac4626c86400561ca1e4
            path: ${source.dir}/llama-cpp
            spdx:
              name: llama.cpp
              version: b11232
              packages:
                - name: llama.cpp
                  purl: pkg:github/ggml-org/llama.cpp@b11232
                  license: MIT
            uid: 0
            gid: 0
      pipeline:
        - name: update go dependencies
          uses: go/bump@v2
          with:
            deps:
              - github.com/buger/jsonparser@v1.1.2
              - golang.org/x/crypto@v0.56.0
              - golang.org/x/image@v0.45.0
              - golang.org/x/mod@v0.40.0
              - github.com/klauspost/compress@v1.18.7
        - uses: go/hermetic@v1
        - name: test
          environment:
            GODEBUG: ""
          runs: |
            set -eux -o pipefail

            go test ./envconfig/... ./format/... ./types/... ./template/... ./server/... ./api/... ./llm/... ./discover/... ./transfer/...
        - name: build llama-server
          runs: |
            set -eux -o pipefail

            cmake -S llama/server -B build/llama-server \
              -DCMAKE_BUILD_TYPE=Release \
              -DBUILD_SHARED_LIBS=ON \
              -DGGML_BACKEND_DL=ON \
              -DGGML_NATIVE=OFF \
              -DGGML_OPENMP=OFF \
              -DGGML_CPU_ALL_VARIANTS=ON \
              -DFETCHCONTENT_SOURCE_DIR_LLAMA_CPP=${source.dir}/llama-cpp
            cmake --build build/llama-server --target llama-server --target llama-quantize -- -j "$(nproc)"
            cmake --install build/llama-server --component llama-server --strip --prefix "${target.dir}/usr"
            cp -a "${target.dir}/usr/lib/ollama" "${target.dir}/usr/lib/ollama-dev"
        - name: build ollama
          uses: go/build@v1
          environment:
            GOFLAGS: -buildvcs=false
          with:
            cgo_enabled: 1
            fips: false
            ldflags:
              - -linkmode=external
              - -X github.com/ollama/ollama/version.Version=0.35.1
              - -X github.com/ollama/ollama/server.mode=release
            output: ${target.dir}/usr/bin/ollama
        - name: build ollama dev
          uses: go/build@v1
          environment:
            GOFLAGS: -buildvcs=false
          with:
            cgo_enabled: 1
            fips: false
            ldflags:
              - -linkmode=external
              - -X github.com/ollama/ollama/version.Version=0.35.1
              - -X github.com/ollama/ollama/server.mode=release
            output: ${target.dir}/usr/bin/ollama-dev
            strip: false
        - uses: dhi/build-pkg:0
          with:
            depends:
              - libc6
              - libstdc++6
              - libgcc-s1
            description: Ollama, a tool for running large language models locally (CPU inference)
            files:
              - usr/bin/ollama
              - usr/lib/ollama
            formats:
              - deb
            license: MIT
            name: ollama
            rel: 0
            subpackages:
              - depends:
                  - libc6
                  - libstdc++6
                  - libgcc-s1
                files:
                  - path: usr/bin/ollama
                    source: usr/bin/ollama-dev
                  - path: usr/lib/ollama
                    source: usr/lib/ollama-dev
                name: ollama-dev
            url: https://ollama.com
            version: 0.35.1
    - name: ollama-cuda-backend
      work-dir: /go/src/github.com/ollama/ollama
      contents:
        repositories:
          - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
          - deb [signed-by=/usr/share/keyrings/8793F200.gpg] https://developer.download.nvidia.com/compute/cuda/repos/debian13/${NVIDIA_ARCH}/ /
        keyring:
          - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
          - https://developer.download.nvidia.com/compute/cuda/repos/debian13/${NVIDIA_ARCH}/8793F200.pub
        packages:
          - bash
          - ca-certificates-bundle
          - cmake
          - make
          - gcc
          - g++
          - git
          - libc6-dev
          - libc-bin
          - coreutils
          - findutils
          - sed
          - cuda-minimal-build-13-2
          - libcublas-dev-13-2
        files:
          - url: git+https://github.com/ollama/ollama.git#v0.35.1
            checksum: b0c1ca4f7549d7acdfa52a7dcffc934bc63a43ce
            path: /go/src/github.com/ollama/ollama
            spdx:
              name: ollama
              version: 0.35.1
              packages:
                - name: ollama
                  purl: pkg:golang/github.com/ollama/ollama@0.35.1
                  license: MIT
            uid: 0
            gid: 0
          - url: git+https://github.com/ggml-org/llama.cpp.git#b11232
            checksum: 6f767fe960c3b97cf37fac4626c86400561ca1e4
            path: ${source.dir}/llama-cpp
            spdx:
              name: llama.cpp
              version: b11232
              packages:
                - name: llama.cpp
                  purl: pkg:github/ggml-org/llama.cpp@b11232
                  license: MIT
            uid: 0
            gid: 0
      pipeline:
        - name: build llama-server cuda backend
          runs: |
            set -eux -o pipefail

            cmake -S llama/server -B build/llama-server-cuda \
              -DCMAKE_BUILD_TYPE=Release \
              -DBUILD_SHARED_LIBS=ON \
              -DGGML_BACKEND_DL=ON \
              -DGGML_NATIVE=OFF \
              -DGGML_OPENMP=OFF \
              -DGGML_CUDA=ON \
              -DOLLAMA_RUNNER_DIR=cuda_v13 \
              -DOLLAMA_GPU_BACKEND=cuda \
              -DCMAKE_CUDA_COMPILER=/usr/local/cuda-13.2/bin/nvcc \
              -DCUDAToolkit_ROOT=/usr/local/cuda-13.2 \
              -DCMAKE_CUDA_FLAGS="-t 4" \
              -DCMAKE_CUDA_ARCHITECTURES="75;80;86;87;89;90;90a;100;103;110;120;121" \
              -DFETCHCONTENT_SOURCE_DIR_LLAMA_CPP=${source.dir}/llama-cpp
            cmake --build build/llama-server-cuda --target ggml-cuda -- -j "$(nproc)"
            cmake --install build/llama-server-cuda --component llama-server --strip --prefix "${target.dir}/usr"
        - uses: dhi/build-pkg:0
          with:
            deb:
              depends:
                - ollama | ollama-fips | ollama-dev | ollama-fips-dev
            depends:
              - libc6
              - libstdc++6
              - libgcc-s1
            description: Ollama CUDA inference backend for llama-server
            files:
              - usr/lib/ollama/cuda_v13/libggml-cuda.so
            formats:
              - deb
            license: MIT
            name: ollama-cuda-backend
            rel: 0
            url: https://ollama.com
            version: 0.35.1
os-release:
  name: Docker Hardened Images (Debian)
  id: debian
  version-id: "13"
  version-codename: trixie
  pretty-name: Docker Hardened Images/Debian GNU/Linux 13 (trixie)
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
