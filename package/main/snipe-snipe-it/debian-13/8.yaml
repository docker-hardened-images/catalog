# syntax=dhi.io/build:2-debian13

image: dhi.io/pkg-snipe-snipe-it
variant: runtime
tags:
  - 8.8.3
  - 8.8.3-r1
  - 8.8.3-debian13
  - 8.8.3-r1-debian13
platforms:
  - linux/amd64
  - linux/arm64
dates:
  release: "2025-02-24"
vars:
  COMMIT_SHA: 621e30486a59304f2a5288fb62c4aa91b08e0a84
  COMPOSER_PHAR_SHA256: 9674f12a2a181100d889ebfd0b4510805b3e94cea57869b14b383753d602599b
  COMPOSER_VERSION: 2.11.0
  PACKAGE_HOME: /usr/share/snipe-it
  PACKAGE_NAME: snipe-it-8
  PHP_VERSION: 8.3.36-0
  REL: "1"
  SEMVER_MAJOR_MINOR_VERSION: "8.8"
  SEMVER_MAJOR_VERSION: "8"
  SEMVER_VERSION: 8.8.3
  VERSION: 8.8.3
contents:
  repositories:
    - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
  keyring:
    - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
  packages:
    - base-files
  builds:
    - name: snipe-it
      work-dir: ${source.dir}/snipe-it
      shell: bash
      caches:
        - path: /root/.composer
      contents:
        packages:
          - bash
          - ca-certificates
          - coreutils
          - findutils
          - git
          - grep
          - sed
          - unzip
          - php-8.3=8.3.36-0
          - libargon2-1
          - libcurl4t64
          - libicu76
          - libonig5
          - libpcre2-8-0
          - libreadline8t64
          - libsodium23
          - libsqlite3-0
          - libssl3t64
          - libxml2
          - zlib1g
        files:
          - url: git+https://github.com/grokability/snipe-it.git#v8.8.3
            checksum: 621e30486a59304f2a5288fb62c4aa91b08e0a84
            path: ${source.dir}/snipe-it
            spdx:
              name: snipe-it
              version: 8.8.3
              packages:
                - name: snipe-it
                  purl: pkg:composer/grokability/snipe-it@8.8.3
                  license: AGPL-3.0-or-later
            uid: 0
            gid: 0
          - url: https://getcomposer.org/download/2.11.0/composer.phar
            checksum: sha256:9674f12a2a181100d889ebfd0b4510805b3e94cea57869b14b383753d602599b
            path: ${source.dir}/composer.phar
            uid: 0
            gid: 0
      pipeline:
        - name: prepare application env
          runs: |
            set -eux -o pipefail

            cp docker/docker.env .env
            test -s .env
            grep -q '^DB_CONNECTION=' .env
        - name: install composer dependencies
          privileged: true
          environment:
            COMPOSER_ALLOW_SUPERUSER: "1"
            COMPOSER_HOME: /root/.composer
          runs: |
            set -eux -o pipefail

            if [ -f "${COMPOSER_HOME}/auth.json" ]; then
              rm "${COMPOSER_HOME}/auth.json"
            fi
            php "${source.dir}/composer.phar" config --global use-github-api false
            php "${source.dir}/composer.phar" install \
              --no-interaction --no-ansi --no-progress \
              --no-dev --prefer-dist --no-scripts \
              --ignore-platform-req=ext-exif \
              --ignore-platform-req=ext-zip \
              --ignore-platform-req=ext-bcmath \
              --ignore-platform-req=ext-gd
            test -s vendor/autoload.php
            php "${source.dir}/composer.phar" require \
              --no-interaction --no-ansi --no-progress \
              --no-update --no-scripts \
              --ignore-platform-req=ext-exif \
              --ignore-platform-req=ext-zip \
              --ignore-platform-req=ext-bcmath \
              --ignore-platform-req=ext-gd \
              league/commonmark:2.10.3 \
              livewire/livewire:4.4.8 \
              laravel/framework:12.69.3 \
              phpseclib/phpseclib:3.0.57 \
              mtdowling/jmespath.php:2.9.2 \
              enshrined/svg-sanitize:1.0.0
            php "${source.dir}/composer.phar" update \
              --no-interaction --no-ansi --no-progress \
              --no-dev --prefer-dist --no-scripts \
              --ignore-platform-req=ext-exif \
              --ignore-platform-req=ext-zip \
              --ignore-platform-req=ext-bcmath \
              --ignore-platform-req=ext-gd \
              league/commonmark \
              livewire/livewire \
              laravel/framework \
              phpseclib/phpseclib \
              mtdowling/jmespath.php \
              enshrined/svg-sanitize
            php -r '$lock = json_decode(file_get_contents("composer.lock"), true); $want = array("league/commonmark" => "2.10.3", "livewire/livewire" => "4.4.8", "laravel/framework" => "12.69.3", "phpseclib/phpseclib" => "3.0.57", "mtdowling/jmespath.php" => "2.9.2", "enshrined/svg-sanitize" => "1.0.0"); $got = array(); foreach ($lock["packages"] as $p) { $got[$p["name"]] = ltrim($p["version"], "v"); } foreach ($want as $name => $ver) { if (!isset($got[$name]) || $got[$name] !== $ver) { fwrite(STDERR, "dependency $name is ".($got[$name] ?? "missing").", need $ver\n"); exit(1); } echo "$name {$got[$name]}\n"; }'
            find vendor -name composer.lock -print -delete
            test -z "$(find vendor -name composer.lock -print -quit)"
            test -s composer.lock
            php -r 'file_put_contents($argv[1], $argv[2]);' "${source.dir}/ziparchive-stub.php" '<?php
            if (!class_exists("ZipArchive", false)) {
                class ZipArchive {
                    public const CM_DEFAULT = 0;
                    public const CM_STORE = 0;
                    public const CM_DEFLATE = 8;
                    public const CM_BZIP2 = 12;
                    public const CM_XZ = 12;
                }
            }
            '
            test -s "${source.dir}/ziparchive-stub.php"
            php -d "auto_prepend_file=${source.dir}/ziparchive-stub.php" artisan package:discover --ansi
            php -d "auto_prepend_file=${source.dir}/ziparchive-stub.php" artisan vendor:publish --force --tag=livewire:assets --ansi
            test -s bootstrap/cache/packages.php
            test -s public/vendor/livewire/livewire.js
            test -s public/js/dist/all.js
            test -s public/css/dist/all.css
            test ! -e bootstrap/ziparchive-polyfill.php
            test ! -e "${source.dir}/snipe-it/ziparchive-stub.php"
            test -z "$(find vendor -name '*.so' -print -quit)"
        - name: seed migrations the runtime cannot write
          runs: |
            set -eux -o pipefail

            oauth=$(find vendor/laravel/passport/database/migrations -name '*create_oauth*.php')
            test -n "$oauth"
            cp -a vendor/laravel/passport/database/migrations/*.php database/migrations/
            test -n "$(find database/migrations -name '*create_oauth*.php' -print -quit)"
            test -s vendor/laravel/framework/src/Illuminate/Session/Console/stubs/database.stub
            cp -a vendor/laravel/framework/src/Illuminate/Session/Console/stubs/database.stub \
              database/migrations/2021_05_06_0000_create_sessions_table.php
            test -s database/migrations/2021_05_06_0000_create_sessions_table.php
            grep -q "'app_version' => 'v8.8.3'" config/version.php
        - name: stage application
          runs: |
            set -eux -o pipefail

            install -d "${target.dir}/usr/share/snipe-it"
            for dir in app bootstrap config database public resources routes storage vendor; do
              test -d "$dir"
              cp -a "$dir" "${target.dir}/usr/share/snipe-it/"
            done
            for file in artisan composer.json composer.lock LICENSE .env; do
              test -s "$file"
              cp -a "$file" "${target.dir}/usr/share/snipe-it/"
            done
            rm -r "${target.dir}/usr/share/snipe-it/storage/private_uploads"
            rm -r "${target.dir}/usr/share/snipe-it/storage/app/backups"
            rm -r "${target.dir}/usr/share/snipe-it/storage/debugbar"
            rm -r "${target.dir}/usr/share/snipe-it/public/uploads"
            test ! -e "${target.dir}/usr/share/snipe-it/storage/private_uploads"
            test ! -e "${target.dir}/usr/share/snipe-it/storage/app/backups"
            test ! -e "${target.dir}/usr/share/snipe-it/public/uploads"
            test ! -e "${target.dir}/usr/share/snipe-it/upgrade.php"
            test ! -e "${target.dir}/usr/share/snipe-it/docker"
            find "${target.dir}/usr/share/snipe-it" -type d -exec chmod 755 {} +
            find "${target.dir}/usr/share/snipe-it" -type f -exec chmod 644 {} +
            chmod 755 "${target.dir}/usr/share/snipe-it/artisan"
            test -s "${target.dir}/usr/share/snipe-it/vendor/autoload.php"
            test ! -e "${target.dir}/usr/share/snipe-it/bootstrap/ziparchive-polyfill.php"
            test ! -e "${target.dir}/usr/share/snipe-it/ziparchive-stub.php"
            test -s "${target.dir}/usr/share/snipe-it/public/js/dist/all.js"
            test -s "${target.dir}/usr/share/snipe-it/public/css/dist/all.css"
            test -s "${target.dir}/usr/share/snipe-it/LICENSE"
            grep -q "'app_version' => 'v8.8.3'" "${target.dir}/usr/share/snipe-it/config/version.php"
        - name: composer dependencies sbom
          uses: sbom@v1
          with:
            extra-scanners: php-composer-installed-cataloger
            prefix: snipe-it-composer
            source: ${target.dir}/usr/share/snipe-it
        - name: stage sbom
          runs: |
            set -eux -o pipefail

            test -s /opt/docker/sbom/snipe-it/.spdx.snipe-it.json
            grep -q 'pkg:composer/grokability/snipe-it@8.8.3' /opt/docker/sbom/snipe-it/.spdx.snipe-it.json
            test -s /opt/docker/sbom/snipe-it-composer/.spdx.snipe-it-composer.json
            mkdir -p "${target.dir}/opt/docker/sbom"
            cp -a /opt/docker/sbom/snipe-it /opt/docker/sbom/snipe-it-composer "${target.dir}/opt/docker/sbom/"
        - uses: dhi/build-pkg:0
          with:
            depends:
              - php-8.3
            description: Snipe-IT asset management application
            files:
              - usr/share/snipe-it
              - opt/docker/sbom/snipe-it
              - opt/docker/sbom/snipe-it-composer
            license: AGPL-3.0-or-later
            name: snipe-it-8
            rel: 1
            url: https://snipeitapp.com
            version: 8.8.3
os-release:
  name: Docker Hardened Images (Debian)
  id: debian
  version-id: "13"
  version-codename: trixie
  pretty-name: Docker Hardened Images/Debian GNU/Linux 13 (trixie)
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
