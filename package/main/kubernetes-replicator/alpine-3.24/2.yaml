    - https://dhi.io/apk/alpine/v3.24/main
    - https://dhi.io/apk/alpine/v3.23/main
    - https://dl-cdn.alpinelinux.org/alpine/v3.24/main
    - https://dl-cdn.alpinelinux.org/alpine/v3.24/community
  keyring:
    - https://dhi.io/keyring/dhi-apk@docker-0F81AD7700D99184.rsa.pub
  packages:
    - alpine-baselayout-data
  builds:
    - name: kubernetes-replicator-2
      work-dir: /go/src/github.com/mittwald/kubernetes-replicator
      contents:
        packages:
          - busybox
          - bash
          - ca-certificates-bundle
          - golang-1.27=1.27.4-r0
          - golang-1.27-oci-config=1.27.4-r0
        files:
          - url: git+https://github.com/mittwald/kubernetes-replicator.git#v2.12.6
            checksum: efed1ab2a14e1f6e07a37f52a82ff53033775657
            path: /go/src/github.com/mittwald/kubernetes-replicator
            spdx:
              name: kubernetes-replicator
              version: 2.12.6
              packages:
                - name: kubernetes-replicator
                  purl: pkg:golang/github.com/mittwald/kubernetes-replicator@2.12.6
                  license: Apache-2.0
            uid: 0
            gid: 0
      pipeline:
        - name: update go dependencies
          uses: go/bump@v2
          with:
            deps: []
        - uses: go/hermetic@v1
        - name: test
          runs: |
            set -eux -o pipefail

            go test -count=1 ./liveness/... ./replicate/common/... ./replicate/configmap/...
        - name: build
          uses: go/build@v1
          with:
            fips: false
            ldflags:
              - -s
              - -w
              - -X main.version=2.12.6
            output: ${target.dir}/usr/bin/kubernetes-replicator
        - name: build dev
          uses: go/build@v1
          with:
            fips: false
            ldflags:
              - -X main.version=2.12.6
            output: ${target.dir}/usr/bin/kubernetes-replicator-dev
            strip: false
        - name: stage license
          runs: |
            set -eux -o pipefail

            license=/go/src/github.com/mittwald/kubernetes-replicator/LICENSE.txt
            grep -q 'Apache License' "$license"
            install -D -m 0644 "$license" "${target.dir}/usr/share/licenses/kubernetes-replicator/LICENSE"
            install -D -m 0644 "$license" "${target.dir}/usr/share/licenses/kubernetes-replicator-dev/LICENSE"
        - uses: dhi/build-pkg:0
