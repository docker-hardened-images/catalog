            files:
              - usr/bin/kubernetes-replicator
              - usr/share/licenses/kubernetes-replicator/LICENSE
            license: Apache-2.0
            name: kubernetes-replicator-2
            rel: 0
            subpackages:
              - files:
                  - path: usr/bin/kubernetes-replicator
                    source: usr/bin/kubernetes-replicator-dev
                  - path: usr/share/licenses/kubernetes-replicator/LICENSE
                    source: usr/share/licenses/kubernetes-replicator-dev/LICENSE
                name: kubernetes-replicator-2-dev
