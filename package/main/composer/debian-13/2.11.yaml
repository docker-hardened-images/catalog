# syntax=dhi.io/build:2-debian13

image: dhi.io/pkg-composer
variant: runtime
tags:
  - 2.11.1
  - 2.11.1-r0
  - 2.11.1-debian13
  - 2.11.1-r0-debian13
platforms:
  - linux/amd64
  - linux/arm64
vars:
  BUILD_ENTITLEMENT: ""
  PACKAGE_NAME: composer-2.11
  REL: "0"
  SEMVER_MAJOR_MINOR_VERSION: "2.11"
  SEMVER_MAJOR_VERSION: "2"
  SEMVER_VERSION: 2.11.1
  VERSION: 2.11.1
contents:
  repositories:
    - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
  keyring:
    - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
  packages:
    - base-files
  builds:
    - name: composer
      work-dir: ${source.dir}
      contents:
        packages:
          - bash
          - coreutils
          - gpg
        files:
          - url: https://github.com/composer/composer/releases/download/2.11.1/composer.phar.asc
            path: ${source.dir}/composer.phar.asc
            uid: 0
            gid: 0
          - url: https://github.com/composer/composer/releases/download/2.11.1/composer.phar
            path: ${source.dir}/composer.phar
            spdx:
              name: composer
              version: 2.11.1
              packages:
                - name: composer
                  purl: pkg:composer/composer/composer@2.11.1
                  license: MIT
            uid: 0
            gid: 0
      pipeline:
        - name: verify composer.phar
          uses: gpg/verify@v1
          with:
            file: ${source.dir}/composer.phar
            keys: ${source.dir}/key/161DFBE342889F01DDAC4E61CBB3D576F2A0946F.asc
            signature: ${source.dir}/composer.phar.asc
        - name: stage composer phar
          runs: |
            set -eux -o pipefail

            install -Dm755 "${source.dir}/composer.phar" "${target.dir}/usr/bin/composer.phar"
            mkdir -p "${target.dir}/opt/docker/sbom"
            cp -a /opt/docker/sbom/composer "${target.dir}/opt/docker/sbom/composer"
        - uses: dhi/build-pkg:0
          with:
            apk:
              depends:
                - php
            deb:
              depends:
                - php-8.3 | php-8.2 | php-8.4 | php-8.5
            depends:
              - bash
              - coreutils
            description: Dependency Manager for PHP
            files:
              - usr/bin/composer.phar
              - opt/docker/sbom/composer
            license: MIT
            name: composer-2.11
            rel: 0
            url: https://getcomposer.org/
            version: 2.11.1
      paths:
        - type: directory
          path: ${source.dir}/key
          uid: 0
          gid: 0
          source: package/main/composer/key
os-release:
  name: Docker Hardened Images (Debian)
  id: debian
  version-id: "13"
  version-codename: trixie
  pretty-name: Docker Hardened Images/Debian GNU/Linux 13 (trixie)
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
