# syntax=dhi.io/build:2-debian13

image: dhi.io/pkg-snipe-it
variant: runtime
tags:
  - 8.8.4
  - 8.8.4-r2
  - 8.8.4-debian13
  - 8.8.4-r2-debian13
platforms:
  - linux/amd64
  - linux/arm64
dates:
  release: "2025-02-24"
vars:
  BUNDLED_LIBGD_VERSION: 2.0.35
  COMMIT_SHA: 60fe07468534a283a473dbfe88244896b44c81bc
  COMPOSER_PHAR_SHA256: 04f8b003da4e3a2459056591fbfebd02b4dc3e5adeb158616b90cf55a65113ec
  COMPOSER_VERSION: 2.11.3
  MEMCACHED_SHA256: c163434eb0da97c8f45c7ad41d979d381f8b81c49402b1b90b063987fb37972e
  MEMCACHED_VERSION: 3.4.0
  PACKAGE_HOME: /usr/share/snipe-it
  PACKAGE_NAME: snipe-it-8
  PHP_EXT_PACKAGE_NAME: snipe-it-8-php-ext
  PHP_EXT_REL: "0"
  PHP_SRC_SHA256: 0237af84478b7a7649d3964153f1b8653d622550b846f56d63062de683fb86bb
  PHP_SRC_VERSION: 8.3.37
  PHP_VERSION: 8.3.37-0
  REDIS_SHA256: 0d5141f634bd1db6c1ddcda053d25ecf2c4fc1c395430d534fd3f8d51dd7f0b5
  REDIS_VERSION: 6.3.0
  REL: "2"
  SEMVER_MAJOR_MINOR_VERSION: "8.8"
  SEMVER_MAJOR_VERSION: "8"
  SEMVER_VERSION: 8.8.4
  VERSION: 8.8.4
contents:
  repositories:
    - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
  keyring:
    - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
  packages:
    - base-files
  builds:
    - name: snipe-it
      work-dir: ${source.dir}/snipe-it
      shell: bash
      caches:
        - path: /root/.composer
      contents:
        packages:
          - bash
          - ca-certificates
          - coreutils
          - findutils
          - git
          - grep
          - sed
          - unzip
          - php-8.3=8.3.37-0
          - libargon2-1
          - libcurl4t64
          - libicu76
          - libonig5
          - libpcre2-8-0
          - libreadline8t64
          - libsodium23
          - libsqlite3-0
          - libssl3t64
          - libxml2
          - zlib1g
        files:
          - url: git+https://github.com/grokability/snipe-it.git#v8.8.4
            checksum: 60fe07468534a283a473dbfe88244896b44c81bc
            path: ${source.dir}/snipe-it
            spdx:
              name: snipe-it
              version: 8.8.4
              packages:
                - name: snipe-it
                  purl: pkg:composer/grokability/snipe-it@8.8.4
                  license: AGPL-3.0-or-later
            uid: 0
            gid: 0
          - url: https://getcomposer.org/download/2.11.3/composer.phar
            checksum: sha256:04f8b003da4e3a2459056591fbfebd02b4dc3e5adeb158616b90cf55a65113ec
            path: ${source.dir}/composer.phar
            uid: 0
            gid: 0
      pipeline:
        - name: prepare application env
          runs: |
            set -eux -o pipefail

            cp docker/docker.env .env
            test -s .env
            grep -q '^DB_CONNECTION=' .env
        - name: install composer dependencies
          privileged: true
          environment:
            COMPOSER_ALLOW_SUPERUSER: "1"
            COMPOSER_HOME: /root/.composer
          runs: |
            set -eux -o pipefail

            if [ -f "${COMPOSER_HOME}/auth.json" ]; then
              rm "${COMPOSER_HOME}/auth.json"
            fi
            php "${source.dir}/composer.phar" config --global use-github-api false
            php "${source.dir}/composer.phar" install \
              --no-interaction --no-ansi --no-progress \
              --no-dev --prefer-dist --no-scripts \
              --ignore-platform-req=ext-exif \
              --ignore-platform-req=ext-zip \
              --ignore-platform-req=ext-bcmath \
              --ignore-platform-req=ext-gd
            test -s vendor/autoload.php
            php "${source.dir}/composer.phar" require \
              --no-interaction --no-ansi --no-progress \
              --no-update --no-scripts \
              --ignore-platform-req=ext-exif \
              --ignore-platform-req=ext-zip \
              --ignore-platform-req=ext-bcmath \
              --ignore-platform-req=ext-gd \
              league/commonmark:2.10.3 \
              livewire/livewire:4.4.8 \
              laravel/framework:12.71.0 \
              phpseclib/phpseclib:3.0.58 \
              mtdowling/jmespath.php:2.9.2 \
              enshrined/svg-sanitize:1.0.0
            php "${source.dir}/composer.phar" update \
              --no-interaction --no-ansi --no-progress \
              --no-dev --prefer-dist --no-scripts \
              --ignore-platform-req=ext-exif \
              --ignore-platform-req=ext-zip \
              --ignore-platform-req=ext-bcmath \
              --ignore-platform-req=ext-gd \
              league/commonmark \
              livewire/livewire \
              laravel/framework \
              phpseclib/phpseclib \
              mtdowling/jmespath.php \
              enshrined/svg-sanitize
            php -r '$lock = json_decode(file_get_contents("composer.lock"), true); $want = array("league/commonmark" => "2.10.3", "livewire/livewire" => "4.4.8", "laravel/framework" => "12.71.0", "phpseclib/phpseclib" => "3.0.58", "mtdowling/jmespath.php" => "2.9.2", "enshrined/svg-sanitize" => "1.0.0"); $got = array(); foreach ($lock["packages"] as $p) { $got[$p["name"]] = ltrim($p["version"], "v"); } foreach ($want as $name => $ver) { if (!isset($got[$name]) || $got[$name] !== $ver) { fwrite(STDERR, "dependency $name is ".($got[$name] ?? "missing").", need $ver\n"); exit(1); } echo "$name {$got[$name]}\n"; }'
            find vendor -name composer.lock -print -delete
            test -z "$(find vendor -name composer.lock -print -quit)"
            test -s composer.lock
            php -r 'file_put_contents($argv[1], $argv[2]);' "${source.dir}/ziparchive-stub.php" '<?php
            if (!class_exists("ZipArchive", false)) {
                class ZipArchive {
                    public const CM_DEFAULT = 0;
                    public const CM_STORE = 0;
                    public const CM_DEFLATE = 8;
                    public const CM_BZIP2 = 12;
                    public const CM_XZ = 12;
                }
            }
            '
            test -s "${source.dir}/ziparchive-stub.php"
            php -d "auto_prepend_file=${source.dir}/ziparchive-stub.php" artisan package:discover --ansi
            php -d "auto_prepend_file=${source.dir}/ziparchive-stub.php" artisan vendor:publish --force --tag=livewire:assets --ansi
            test -s bootstrap/cache/packages.php
            test -s public/vendor/livewire/livewire.js
            test -s public/js/dist/all.js
            test -s public/css/dist/all.css
            test ! -e bootstrap/ziparchive-polyfill.php
            test ! -e "${source.dir}/snipe-it/ziparchive-stub.php"
            test -z "$(find vendor -name '*.so' -print -quit)"
        - name: seed migrations the runtime cannot write
          runs: |
            set -eux -o pipefail

            oauth=$(find vendor/laravel/passport/database/migrations -name '*create_oauth*.php')
            test -n "$oauth"
            cp -a vendor/laravel/passport/database/migrations/*.php database/migrations/
            test -n "$(find database/migrations -name '*create_oauth*.php' -print -quit)"
            test -s vendor/laravel/framework/src/Illuminate/Session/Console/stubs/database.stub
            cp -a vendor/laravel/framework/src/Illuminate/Session/Console/stubs/database.stub \
              database/migrations/2021_05_06_0000_create_sessions_table.php
            test -s database/migrations/2021_05_06_0000_create_sessions_table.php
            grep -q "'app_version' => 'v8.8.4'" config/version.php
        - name: stage application
          runs: |
            set -eux -o pipefail

            install -d "${target.dir}/usr/share/snipe-it"
            for dir in app bootstrap config database public resources routes storage vendor; do
              test -d "$dir"
              cp -a "$dir" "${target.dir}/usr/share/snipe-it/"
            done
            for file in artisan composer.json composer.lock LICENSE .env; do
              test -s "$file"
              cp -a "$file" "${target.dir}/usr/share/snipe-it/"
            done
            rm -r "${target.dir}/usr/share/snipe-it/storage/private_uploads"
            rm -r "${target.dir}/usr/share/snipe-it/storage/app/backups"
            rm -r "${target.dir}/usr/share/snipe-it/storage/debugbar"
            rm -r "${target.dir}/usr/share/snipe-it/public/uploads"
            test ! -e "${target.dir}/usr/share/snipe-it/storage/private_uploads"
            test ! -e "${target.dir}/usr/share/snipe-it/storage/app/backups"
            test ! -e "${target.dir}/usr/share/snipe-it/public/uploads"
            test ! -e "${target.dir}/usr/share/snipe-it/upgrade.php"
            test ! -e "${target.dir}/usr/share/snipe-it/docker"
            find "${target.dir}/usr/share/snipe-it" -type d -exec chmod 755 {} +
            find "${target.dir}/usr/share/snipe-it" -type f -exec chmod 644 {} +
            chmod 755 "${target.dir}/usr/share/snipe-it/artisan"
            test -s "${target.dir}/usr/share/snipe-it/vendor/autoload.php"
            test ! -e "${target.dir}/usr/share/snipe-it/bootstrap/ziparchive-polyfill.php"
            test ! -e "${target.dir}/usr/share/snipe-it/ziparchive-stub.php"
            test -s "${target.dir}/usr/share/snipe-it/public/js/dist/all.js"
            test -s "${target.dir}/usr/share/snipe-it/public/css/dist/all.css"
            test -s "${target.dir}/usr/share/snipe-it/LICENSE"
            grep -q "'app_version' => 'v8.8.4'" "${target.dir}/usr/share/snipe-it/config/version.php"
        - name: composer dependencies sbom
          uses: sbom@v1
          with:
            extra-scanners: php-composer-installed-cataloger
            prefix: snipe-it-composer
            source: ${target.dir}/usr/share/snipe-it
        - name: stage sbom
          runs: |
            set -eux -o pipefail

            test -s /opt/docker/sbom/snipe-it/.spdx.snipe-it.json
            grep -q 'pkg:composer/grokability/snipe-it@8.8.4' /opt/docker/sbom/snipe-it/.spdx.snipe-it.json
            test -s /opt/docker/sbom/snipe-it-composer/.spdx.snipe-it-composer.json
            mkdir -p "${target.dir}/opt/docker/sbom"
            cp -a /opt/docker/sbom/snipe-it /opt/docker/sbom/snipe-it-composer "${target.dir}/opt/docker/sbom/"
        - uses: dhi/build-pkg:0
          with:
            deb:
              depends:
                - snipe-it-8-php-ext
            depends:
              - php-8.3
            description: Snipe-IT asset management application
            files:
              - usr/share/snipe-it
              - opt/docker/sbom/snipe-it
              - opt/docker/sbom/snipe-it-composer
            formats:
              - apk
              - deb
            license: AGPL-3.0-or-later
            name: snipe-it-8
            rel: 2
            url: https://snipeitapp.com
            version: 8.8.4
    - name: php extensions
      shell: bash
      contents:
        packages:
          - autoconf
          - bash
          - build-essential
          - coreutils
          - dpkg-dev
          - gawk
          - grep
          - gzip
          - pkg-config
          - sed
          - tar
          - xz-utils
          - php-8.3=8.3.37-0
          - php-8.3-dev=8.3.37-0
          - libargon2-1
          - libcurl4t64
          - libicu76
          - libonig5
          - libpcre2-8-0
          - libreadline8t64
          - libsodium23
          - libsqlite3-0
          - libssl3t64
          - libxml2
          - zlib1g
          - libfreetype-dev
          - libjpeg62-turbo-dev
          - libpcre2-dev
          - libpng-dev
          - libzip-dev
          - libldap2-dev
          - libmemcached-dev
        files:
          - url: https://www.php.net/distributions/php-8.3.37.tar.xz
            checksum: sha256:0237af84478b7a7649d3964153f1b8653d622550b846f56d63062de683fb86bb
            path: ${source.dir}/php-8.3.37.tar.xz
            spdx:
              name: php
              version: 8.3.37
              packages:
                - name: php
                  purl: pkg:generic/php@8.3.37
                  license: PHP-3.01
            uid: 0
            gid: 0
          - url: https://pecl.php.net/get/redis-6.3.0.tgz
            checksum: sha256:0d5141f634bd1db6c1ddcda053d25ecf2c4fc1c395430d534fd3f8d51dd7f0b5
            path: ${source.dir}/redis.tgz
            spdx:
              name: phpredis
              version: 6.3.0
              packages:
                - name: phpredis
                  purl: pkg:pecl/redis@6.3.0
                  license: PHP-3.01
            uid: 0
            gid: 0
          - url: https://pecl.php.net/get/memcached-3.4.0.tgz
            checksum: sha256:c163434eb0da97c8f45c7ad41d979d381f8b81c49402b1b90b063987fb37972e
            path: ${source.dir}/memcached.tgz
            spdx:
              name: php-memcached
              version: 3.4.0
              packages:
                - name: php-memcached
                  purl: pkg:pecl/memcached@3.4.0
                  license: PHP-3.01
            uid: 0
            gid: 0
      pipeline:
        - name: compile extensions
          runs: |
            set -eux -o pipefail

            export SOURCE_DIR='${source.dir}'
            export PHP_SRC_VERSION='8.3.37'
            export REDIS_VERSION='6.3.0'
            export MEMCACHED_VERSION='3.4.0'
            export BUNDLED_LIBGD_VERSION='2.0.35'
            bash '${source.dir}/build-extensions.sh'
        - uses: spdx@v1
          with:
            license: GD
            name: libgd
            purl: pkg:generic/libgd@2.0.35
            version: 2.0.35
        - uses: spdx@v1
          with:
            license: PHP-3.01
            name: php-ext-gd
            purl: pkg:generic/php/ext-gd@8.3.37
            version: 8.3.37
        - uses: spdx@v1
          with:
            license: PHP-3.01
            name: php-ext-zip
            purl: pkg:generic/php/ext-zip@8.3.37
            version: 8.3.37
        - uses: spdx@v1
          with:
            license: PHP-3.01
            name: php-ext-exif
            purl: pkg:generic/php/ext-exif@8.3.37
            version: 8.3.37
        - uses: spdx@v1
          with:
            license: PHP-3.01
            name: php-ext-bcmath
            purl: pkg:generic/php/ext-bcmath@8.3.37
            version: 8.3.37
        - uses: spdx@v1
          with:
            license: PHP-3.01
            name: php-ext-ldap
            purl: pkg:generic/php/ext-ldap@8.3.37
            version: 8.3.37
        - uses: spdx@v1
          with:
            license: PHP-3.01
            name: php-ext-pdo-mysql
            purl: pkg:generic/php/ext-pdo-mysql@8.3.37
            version: 8.3.37
        - uses: spdx@v1
          with:
            license: PHP-3.01
            name: php-ext-redis
            purl: pkg:pecl/redis@6.3.0
            version: 6.3.0
        - uses: spdx@v1
          with:
            license: PHP-3.01
            name: php-ext-memcached
            purl: pkg:pecl/memcached@3.4.0
            version: 3.4.0
        - name: stage extensions
          runs: |
            set -eux -o pipefail

            install -d "${target.dir}/usr/lib/php/extensions"
            install -d "${target.dir}/etc/php-8.3/conf.d"
            for ext in gd zip exif bcmath ldap pdo_mysql redis memcached; do
              test -s "/usr/lib/php/extensions/${ext}.so"
              cp -a "/usr/lib/php/extensions/${ext}.so" "${target.dir}/usr/lib/php/extensions/"
              printf 'extension=/usr/lib/php/extensions/%s.so\n' "${ext}" \
                > "${target.dir}/etc/php-8.3/conf.d/10-${ext}.ini"
            done
            test -s "${target.dir}/etc/php-8.3/conf.d/10-memcached.ini"
        - name: stage extension sbom
          runs: |
            set -eux -o pipefail

            mkdir -p "${target.dir}/opt/docker/sbom"
            for doc in libgd php-ext-gd php-ext-zip php-ext-exif php-ext-bcmath php-ext-ldap php-ext-pdo-mysql php-ext-redis php-ext-memcached; do
              test -s "/opt/docker/sbom/${doc}/.spdx.${doc}.json"
              cp -a "/opt/docker/sbom/${doc}" "${target.dir}/opt/docker/sbom/"
            done
        - uses: dhi/build-pkg:0
          with:
            depends:
              - php-8.3
              - libfreetype6
              - libjpeg62-turbo
              - libldap2
              - libmemcached11t64
              - libpng16-16t64
              - libsasl2-2
              - libzip5
              - zlib1g
            description: PHP extensions Snipe-IT requires that php-8.3 does not build (gd, zip, exif, bcmath, ldap, pdo_mysql, redis, memcached)
            files:
              - usr/lib/php/extensions
              - etc/php-8.3/conf.d/10-gd.ini
              - etc/php-8.3/conf.d/10-zip.ini
              - etc/php-8.3/conf.d/10-exif.ini
              - etc/php-8.3/conf.d/10-bcmath.ini
              - etc/php-8.3/conf.d/10-ldap.ini
              - etc/php-8.3/conf.d/10-pdo_mysql.ini
              - etc/php-8.3/conf.d/10-redis.ini
              - etc/php-8.3/conf.d/10-memcached.ini
              - opt/docker/sbom/libgd
              - opt/docker/sbom/php-ext-gd
              - opt/docker/sbom/php-ext-zip
              - opt/docker/sbom/php-ext-exif
              - opt/docker/sbom/php-ext-bcmath
              - opt/docker/sbom/php-ext-ldap
              - opt/docker/sbom/php-ext-pdo-mysql
              - opt/docker/sbom/php-ext-redis
              - opt/docker/sbom/php-ext-memcached
            formats:
              - deb
            license: PHP-3.01 AND GD
            name: snipe-it-8-php-ext
            rel: 0
            url: https://snipeitapp.com
            version: 8.8.4
      paths:
        - type: file
          path: ${source.dir}/build-extensions.sh
          uid: 0
          gid: 0
          mode: "0755"
          source: package/main/snipe-it/build-extensions.sh
os-release:
  name: Docker Hardened Images (Debian)
  id: debian
  version-id: "13"
  version-codename: trixie
  pretty-name: Docker Hardened Images/Debian GNU/Linux 13 (trixie)
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
