# syntax=dhi.io/build:2-alpine3.24

image: dhi.io/pkg-snipe-it
variant: runtime
tags:
  - 8.8.3-apk-alpine3.24
  - 8.8.3-r0-apk-alpine3.24
platforms:
  - linux/amd64
  - linux/arm64
dates:
  release: "2025-02-24"
vars:
  BUNDLED_LIBGD_VERSION: 2.0.35
  MEMCACHED_SHA256: c163434eb0da97c8f45c7ad41d979d381f8b81c49402b1b90b063987fb37972e
  MEMCACHED_VERSION: 3.4.0
  PHP_EXT_PACKAGE_NAME: snipe-it-8-php-ext
  PHP_SRC_SHA256: dd54693aa334c5c4d72e9aee96b082c2473750a18a6c1d105789c93a3b1692fd
  PHP_SRC_VERSION: 8.3.36
  PHP_VERSION: 8.3.36-r0
  REDIS_SHA256: 0d5141f634bd1db6c1ddcda053d25ecf2c4fc1c395430d534fd3f8d51dd7f0b5
  REDIS_VERSION: 6.3.0
  REL: "0"
  SEMVER_MAJOR_MINOR_VERSION: "8.8"
  SEMVER_MAJOR_VERSION: "8"
  SEMVER_VERSION: 8.8.3
  VERSION: 8.8.3
contents:
  repositories:
    - https://dhi.io/apk/alpine/v3.24/main
    - https://dhi.io/apk/alpine/v3.23/main
    - https://dl-cdn.alpinelinux.org/alpine/v3.24/main
    - https://dl-cdn.alpinelinux.org/alpine/v3.24/community
  keyring:
    - https://dhi.io/keyring/dhi-apk@docker-0F81AD7700D99184.rsa.pub
  packages:
    - alpine-baselayout-data
  builds:
    - name: php extensions
      shell: bash
      contents:
        packages:
          - autoconf
          - bash
          - build-base
          - coreutils
          - grep
          - gawk
          - gzip
          - pkgconf
          - sed
          - tar
          - xz
          - php-8.3=8.3.36-r0
          - php-8.3-dev=8.3.36-r0
          - argon2-libs
          - libcurl
          - icu-libs
          - oniguruma
          - pcre2
          - readline
          - libsodium
          - sqlite-libs
          - libxml2
          - zlib
          - freetype-dev
          - libjpeg-turbo-dev
          - libpng-dev
          - libzip-dev
          - pcre2-dev
          - openldap-dev
          - libmemcached-dev
        files:
          - url: https://www.php.net/distributions/php-8.3.36.tar.xz
            checksum: sha256:dd54693aa334c5c4d72e9aee96b082c2473750a18a6c1d105789c93a3b1692fd
            path: ${source.dir}/php-8.3.36.tar.xz
            spdx:
              name: php
              version: 8.3.36
              packages:
                - name: php
                  purl: pkg:generic/php@8.3.36
                  license: PHP-3.01
            uid: 0
            gid: 0
          - url: https://pecl.php.net/get/redis-6.3.0.tgz
            checksum: sha256:0d5141f634bd1db6c1ddcda053d25ecf2c4fc1c395430d534fd3f8d51dd7f0b5
            path: ${source.dir}/redis.tgz
            spdx:
              name: phpredis
              version: 6.3.0
              packages:
                - name: phpredis
                  purl: pkg:pecl/redis@6.3.0
                  license: PHP-3.01
            uid: 0
            gid: 0
          - url: https://pecl.php.net/get/memcached-3.4.0.tgz
            checksum: sha256:c163434eb0da97c8f45c7ad41d979d381f8b81c49402b1b90b063987fb37972e
            path: ${source.dir}/memcached.tgz
            spdx:
              name: php-memcached
              version: 3.4.0
              packages:
                - name: php-memcached
                  purl: pkg:pecl/memcached@3.4.0
                  license: PHP-3.01
            uid: 0
            gid: 0
      pipeline:
        - name: compile extensions
          runs: |
            set -eux -o pipefail

            export SOURCE_DIR='${source.dir}'
            export PHP_SRC_VERSION='8.3.36'
            export REDIS_VERSION='6.3.0'
            export MEMCACHED_VERSION='3.4.0'
            export BUNDLED_LIBGD_VERSION='2.0.35'
            bash '${source.dir}/build-extensions.sh'
        - uses: spdx@v1
          with:
            license: GD
            name: libgd
            purl: pkg:generic/libgd@2.0.35
            version: 2.0.35
        - uses: spdx@v1
          with:
            license: PHP-3.01
            name: php-ext-gd
            purl: pkg:generic/php/ext-gd@8.3.36
            version: 8.3.36
        - uses: spdx@v1
          with:
            license: PHP-3.01
            name: php-ext-zip
            purl: pkg:generic/php/ext-zip@8.3.36
            version: 8.3.36
        - uses: spdx@v1
          with:
            license: PHP-3.01
            name: php-ext-exif
            purl: pkg:generic/php/ext-exif@8.3.36
            version: 8.3.36
        - uses: spdx@v1
          with:
            license: PHP-3.01
            name: php-ext-bcmath
            purl: pkg:generic/php/ext-bcmath@8.3.36
            version: 8.3.36
        - uses: spdx@v1
          with:
            license: PHP-3.01
            name: php-ext-ldap
            purl: pkg:generic/php/ext-ldap@8.3.36
            version: 8.3.36
        - uses: spdx@v1
          with:
            license: PHP-3.01
            name: php-ext-pdo-mysql
            purl: pkg:generic/php/ext-pdo-mysql@8.3.36
            version: 8.3.36
        - uses: spdx@v1
          with:
            license: PHP-3.01
            name: php-ext-redis
            purl: pkg:pecl/redis@6.3.0
            version: 6.3.0
        - uses: spdx@v1
          with:
            license: PHP-3.01
            name: php-ext-memcached
            purl: pkg:pecl/memcached@3.4.0
            version: 3.4.0
        - name: stage extensions
          runs: |
            set -eux -o pipefail

            install -d "${target.dir}/usr/lib/php/extensions"
            install -d "${target.dir}/etc/php-8.3/conf.d"
            for ext in gd zip exif bcmath ldap pdo_mysql redis memcached; do
              test -s "/usr/lib/php/extensions/${ext}.so"
              cp -a "/usr/lib/php/extensions/${ext}.so" "${target.dir}/usr/lib/php/extensions/"
              printf 'extension=/usr/lib/php/extensions/%s.so\n' "${ext}" \
                > "${target.dir}/etc/php-8.3/conf.d/10-${ext}.ini"
            done
            test -s "${target.dir}/etc/php-8.3/conf.d/10-memcached.ini"
        - name: stage extension sbom
          runs: |
            set -eux -o pipefail

            mkdir -p "${target.dir}/opt/docker/sbom"
            for doc in libgd php-ext-gd php-ext-zip php-ext-exif php-ext-bcmath php-ext-ldap php-ext-pdo-mysql php-ext-redis php-ext-memcached; do
              test -s "/opt/docker/sbom/${doc}/.spdx.${doc}.json"
              cp -a "/opt/docker/sbom/${doc}" "${target.dir}/opt/docker/sbom/"
            done
        - uses: dhi/build-pkg:0
          with:
            depends:
              - php-8.3
              - freetype
              - libjpeg-turbo
              - libldap
              - libmemcached-libs
              - libpng
              - libsasl
              - libzip
              - zlib
            description: PHP extensions Snipe-IT requires that php-8.3 does not build (gd, zip, exif, bcmath, ldap, pdo_mysql, redis, memcached)
            files:
              - usr/lib/php/extensions
              - etc/php-8.3/conf.d/10-gd.ini
              - etc/php-8.3/conf.d/10-zip.ini
              - etc/php-8.3/conf.d/10-exif.ini
              - etc/php-8.3/conf.d/10-bcmath.ini
              - etc/php-8.3/conf.d/10-ldap.ini
              - etc/php-8.3/conf.d/10-pdo_mysql.ini
              - etc/php-8.3/conf.d/10-redis.ini
              - etc/php-8.3/conf.d/10-memcached.ini
              - opt/docker/sbom/libgd
              - opt/docker/sbom/php-ext-gd
              - opt/docker/sbom/php-ext-zip
              - opt/docker/sbom/php-ext-exif
              - opt/docker/sbom/php-ext-bcmath
              - opt/docker/sbom/php-ext-ldap
              - opt/docker/sbom/php-ext-pdo-mysql
              - opt/docker/sbom/php-ext-redis
              - opt/docker/sbom/php-ext-memcached
            formats:
              - apk
            license: PHP-3.01 AND GD
            name: snipe-it-8-php-ext
            rel: 0
            url: https://snipeitapp.com
            version: 8.8.3
      paths:
        - type: file
          path: ${source.dir}/build-extensions.sh
          uid: 0
          gid: 0
          mode: "0755"
          source: package/main/snipe-it/build-extensions.sh
os-release:
  name: Docker Hardened Images (Alpine)
  id: alpine
  version-id: "3.24"
  pretty-name: Docker Hardened Images/Alpine Linux v3.24
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
