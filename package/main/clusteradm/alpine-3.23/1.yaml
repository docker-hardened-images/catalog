# syntax=dhi.io/build:2-alpine3.23

image: dhi.io/pkg-clusteradm
variant: runtime
tags:
  - 1.4.0-alpine3.23
  - 1.4.0-r2-alpine3.23
platforms:
  - linux/amd64
  - linux/arm64
vars:
  COMMIT_SHA: daaf2d379217bad0bb047e736184801588b07d11
  GOLANG_VERSION: 1.26.10-r0
  PACKAGE_NAME: clusteradm
  REL: "2"
  SEMVER_MAJOR_MINOR_VERSION: "1.4"
  SEMVER_MAJOR_VERSION: "1"
  SEMVER_VERSION: 1.4.0
  VERSION: 1.4.0
contents:
  repositories:
    - https://dhi.io/apk/alpine/v3.23/main
    - https://dl-cdn.alpinelinux.org/alpine/v3.23/main
    - https://dl-cdn.alpinelinux.org/alpine/v3.23/community
  keyring:
    - https://dhi.io/keyring/dhi-apk@docker-0F81AD7700D99184.rsa.pub
  packages:
    - alpine-baselayout-data
  builds:
    - name: clusteradm
      work-dir: /go/src/open-cluster-management.io/clusteradm
      contents:
        packages:
          - busybox
          - bash
          - ca-certificates-bundle
          - golang-1.26=1.26.10-r0
          - golang-1.26-oci-config=1.26.10-r0
        files:
          - url: git+https://github.com/open-cluster-management-io/clusteradm.git#v1.4.0
            checksum: daaf2d379217bad0bb047e736184801588b07d11
            path: /go/src/open-cluster-management.io/clusteradm
            uid: 0
            gid: 0
      pipeline:
        - name: update go dependencies
          uses: go/bump@v1
          with:
            deps:
              - golang.org/x/net@v0.62.0
              - golang.org/x/sys@v0.49.0
              - oras.land/oras-go/v2@v2.6.2
            download: true
            replaces:
              - google.golang.org/grpc=google.golang.org/grpc@v1.83.2
        - name: sync vendor directory
          runs: |
            set -eux -o pipefail

            go mod vendor
        - uses: go/hermetic@v1
        - name: build
          uses: go/build@v1
          with:
            fips: false
            ldflags:
              - -X open-cluster-management.io/clusteradm/pkg/version.versionFromGit=v1.4.0
              - -X open-cluster-management.io/clusteradm/pkg/version.commitFromGit=daaf2d379217bad0bb047e736184801588b07d11
              - -X open-cluster-management.io/clusteradm/pkg/version.gitTreeState=clean
            output: ${target.dir}/usr/bin/clusteradm
            packages: ./cmd/clusteradm
        - name: build dev
          uses: go/build@v1
          with:
            fips: false
            ldflags:
              - -X open-cluster-management.io/clusteradm/pkg/version.versionFromGit=v1.4.0
              - -X open-cluster-management.io/clusteradm/pkg/version.commitFromGit=daaf2d379217bad0bb047e736184801588b07d11
              - -X open-cluster-management.io/clusteradm/pkg/version.gitTreeState=clean
            output: ${target.dir}/usr/bin/clusteradm-dev
            packages: ./cmd/clusteradm
            strip: false
        - uses: dhi/build-pkg:0
          with:
            description: Command line tool to bootstrap an Open Cluster Management control plane
            files:
              - usr/bin/clusteradm
            license: Apache-2.0
            name: clusteradm
            rel: 2
            subpackages:
              - files:
                  - path: usr/bin/clusteradm
                    source: usr/bin/clusteradm-dev
                name: clusteradm-dev
            url: https://github.com/open-cluster-management-io/clusteradm
            version: 1.4.0
os-release:
  name: Docker Hardened Images (Alpine)
  id: alpine
