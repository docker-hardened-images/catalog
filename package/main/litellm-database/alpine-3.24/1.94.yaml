# syntax=dhi.io/build:2-alpine3.24

image: dhi.io/pkg-litellm-database
variant: runtime
tags:
  - 1.94.1-alpine3.24
  - 1.94.1-r0-alpine3.24
platforms:
  - linux/amd64
  - linux/arm64
dates:
  release: "2026-07-28"
vars:
  COMMIT_SHA: 065bf83f0cac68d052b2a7f5ca8e3a1b764a2ec1
  REL: "0"
  SEMVER_MAJOR_MINOR_VERSION: "1.94"
  SEMVER_MAJOR_VERSION: "1"
  SEMVER_VERSION: 1.94.1
  VERSION: 1.94.1
contents:
  repositories:
    - https://dhi.io/apk/alpine/v3.24/main
    - https://dhi.io/apk/alpine/v3.23/main
    - https://dl-cdn.alpinelinux.org/alpine/v3.24/main
    - https://dl-cdn.alpinelinux.org/alpine/v3.24/community
  keyring:
    - https://dhi.io/keyring/dhi-apk@docker-0F81AD7700D99184.rsa.pub
  packages:
    - alpine-baselayout-data
  builds:
    - name: litellm-build
      work-dir: ${source.dir}/litellm-src
      environment:
        PATH: /app/.venv/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
        UV_LINK_MODE: copy
        UV_PROJECT_ENVIRONMENT: /app/.venv
        VIRTUAL_ENV: /app/.venv
      caches:
        - path: /root/.cache/pip
        - path: /root/.cache/uv
        - path: /root/.npm
      contents:
        packages:
          - build-base
          - openssl
          - openssl-dev
          - rust
          - coreutils
          - bash
          - ca-certificates-bundle
          - grep
          - findutils
          - gzip
          - python-3.13
          - python-3.13-dev
          - py3.13-pip
          - py3.13-setuptools
          - libstdc++
          - nodejs
          - npm
          - diffutils
          - sed
          - tar
        files:
          - url: git+https://github.com/BerriAI/litellm.git#v1.94.1
            checksum: 065bf83f0cac68d052b2a7f5ca8e3a1b764a2ec1
            path: ${source.dir}/litellm-src
            spdx:
              name: litellm
              version: 1.94.1
              packages:
                - name: litellm
                  purl: pkg:pypi/litellm@1.94.1
                  license: MIT
            uid: 0
            gid: 0
      pipeline:
        - name: build admin ui
          privileged: true
          runs: |
            set -eux -o pipefail

            npm ci --prefix ui/litellm-dashboard
            npm run build --prefix ui/litellm-dashboard
            rm -rf litellm/proxy/_experimental/out
            cp -a ui/litellm-dashboard/out litellm/proxy/_experimental/out
        - name: install litellm runtime environment
          privileged: true
          runs: |
            set -eux -o pipefail

            python3 -m pip install uv==0.11.7

            sed -i 's/"aiohttp>=3\.14\.1,<4\.0"/"aiohttp>=3.14.3,<4.0"/' pyproject.toml
            sed -i '/^override-dependencies = \[/a\ "cryptography==50.0.0",' pyproject.toml
            uv lock \
              --upgrade-package aiohttp==3.14.3 \
              --upgrade-package cryptography==50.0.0

            uv export --no-default-groups --no-editable \
              --no-emit-package pyroscope-io \
              --extra proxy \
              --extra proxy-runtime \
              --extra extra_proxy \
              --extra semantic-router \
              --output-file /tmp/litellm-requirements.txt

            uv venv --python python3.13 "$VIRTUAL_ENV"
            uv pip install --python "$VIRTUAL_ENV/bin/python" -r /tmp/litellm-requirements.txt
        - name: prepare runtime files
          runs: |
            set -eux -o pipefail

            mkdir -p "${target.dir}/app/docker" "${target.dir}/app/litellm/proxy"
            cp docker/entrypoint.sh "${target.dir}/app/docker/"
            cp docker/prod_entrypoint.sh "${target.dir}/app/docker/"
            cp litellm/proxy/prisma_migration.py "${target.dir}/app/litellm/proxy/"
            cp schema.prisma "${target.dir}/app/"
            cp -a enterprise "${target.dir}/app/enterprise"
            cp -a litellm-proxy-extras "${target.dir}/app/litellm-proxy-extras"

            entrypoint="${target.dir}/app/docker/entrypoint.sh"
            tmp="$(mktemp)"
            {
              sed -n '1p' "$entrypoint"
              printf '%s\n' 'export PATH="/app/.venv/bin:$PATH"'
              printf '%s\n' 'export PRISMA_BINARY_CACHE_DIR="${PRISMA_BINARY_CACHE_DIR:-/opt/prisma/binaries}"'
              printf '%s\n' 'export PRISMA_CLI_PATH="${PRISMA_CLI_PATH:-/opt/prisma/binaries/node_modules/.bin/prisma}"'
              printf '%s\n' 'export PRISMA_CLI_QUERY_ENGINE_TYPE="${PRISMA_CLI_QUERY_ENGINE_TYPE:-binary}"'
              printf '%s\n' 'export PRISMA_OFFLINE_MODE="${PRISMA_OFFLINE_MODE:-true}"'
              sed -n '2,$p' "$entrypoint"
            } > "$tmp"
            mv "$tmp" "$entrypoint"

            prod_entrypoint="${target.dir}/app/docker/prod_entrypoint.sh"
            tmp="$(mktemp)"
            {
              sed -n '1p' "$prod_entrypoint"
              printf '%s\n' 'export PATH="/app/.venv/bin:$PATH"'
              sed -n '2,$p' "$prod_entrypoint"
            } > "$tmp"
            mv "$tmp" "$prod_entrypoint"

            chmod 0755 "${target.dir}/app/docker/entrypoint.sh"
            chmod 0755 "${target.dir}/app/docker/prod_entrypoint.sh"
        - name: generate prisma client
          privileged: true
          runs: |
            set -eux -o pipefail

            mkdir -p "${target.dir}/opt/prisma"
            rm -rf /opt/prisma
            ln -s "${target.dir}/opt/prisma" /opt/prisma

            HOME=/opt/prisma \
              XDG_CACHE_HOME=/opt/prisma/.cache \
              PRISMA_BINARY_CACHE_DIR=/opt/prisma/binaries \
              npm_config_cache=/root/.npm \
              prisma generate --schema="${target.dir}/app/schema.prisma"

            test -x "${target.dir}/opt/prisma/binaries/node_modules/.bin/prisma"
            test -f "${target.dir}/opt/prisma/binaries/node_modules/prisma/build/index.js"
            find "$VIRTUAL_ENV/lib" -type f -path "*/site-packages/prisma/*.py" \
              -exec sed -i "s#${target.dir}/app#/app#g" {} +
            find "$VIRTUAL_ENV/lib" -type f -path "*/site-packages/prisma/*.py" \
              -exec sed -i "s#${target.dir}/opt/prisma#/opt/prisma#g" {} +
            find "$VIRTUAL_ENV/lib" -type d -path "*/site-packages/prisma/__pycache__" \
              -exec rm -rf {} +
            if grep -R -I "${target.dir}/" "$VIRTUAL_ENV/lib"/*/site-packages/prisma; then
              exit 1
            fi
            chmod -R a+rX "${target.dir}/opt/prisma"
        - name: stage virtual environment
          runs: |
            set -eux -o pipefail

            mkdir -p "${target.dir}/app"
            cp -a "$VIRTUAL_ENV" "${target.dir}/app/.venv"
            find "${target.dir}/app/.venv" -type d -path "*/tornado/test" -exec rm -rf {} +
            mkdir -p "${target.dir}/usr/bin"
            ln -sf /app/.venv/bin/litellm "${target.dir}/usr/bin/litellm"
        - name: python dependencies sbom
          uses: sbom@v1
          privileged: true
          with:
            extra-scanners: python-package-cataloger
            prefix: litellm-python
            source: /app/.venv
        - name: prisma npm dependencies sbom
          uses: sbom@v1
          privileged: true
          with:
            extra-scanners: javascript-package-cataloger
            prefix: litellm-prisma
            source: /opt/prisma/binaries/node_modules
        - uses: dhi/build-pkg:0
          with:
            depends:
              - bash
              - ca-certificates-bundle
              - coreutils
              - libsndfile
              - libstdc++
              - nodejs
              - openssl
              - python-3.13
              - tzdata
            description: LiteLLM Database runtime files
            files:
              - app
              - opt/prisma
              - usr/bin
            formats:
              - apk
            license: MIT AND LicenseRef-Proprietary
            name: litellm-database
            rel: 0
            url: https://github.com/BerriAI/litellm
            version: 1.94.1
os-release:
  name: Docker Hardened Images (Alpine)
  id: alpine
  version-id: "3.24"
  pretty-name: Docker Hardened Images/Alpine Linux v3.24
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
