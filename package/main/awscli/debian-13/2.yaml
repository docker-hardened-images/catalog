# syntax=dhi.io/build:2-debian13

image: dhi.io/pkg-awscli
variant: runtime
tags:
  - 2.36.36
  - 2.36.36-r0
  - 2.36.36-debian13
  - 2.36.36-r0-debian13
platforms:
  - linux/amd64
  - linux/arm64
vars:
  ARCH: '#{ target.arch == "amd64" ? "x86_64" : "aarch64" }'
  PACKAGE_NAME: awscli-2
  REL: "0"
  SEMVER_MAJOR_MINOR_VERSION: "2.36"
  SEMVER_MAJOR_VERSION: "2"
  SEMVER_VERSION: 2.36.36
  VERSION: 2.36.36
contents:
  packages:
    - base-files
  builds:
    - name: awscli
      work-dir: ${source.dir}
      contents:
        packages:
          - bash
          - coreutils
          - gpg
          - gpg-agent
          - unzip
        files:
          - url: https://awscli.amazonaws.com/awscli-exe-linux-${ARCH}-2.36.36.zip.sig
            path: ${source.dir}/sig/awscli.zip.sig
            uid: 0
            gid: 0
          - url: https://awscli.amazonaws.com/awscli-exe-linux-${ARCH}-2.36.36.zip
            path: ${source.dir}/awscli.zip
            spdx:
              name: awscli
              version: 2.36.36
              packages:
                - name: awscli
                  purl: pkg:dhi/awscli@2.36.36
                  license: Apache-2.0
            uid: 0
            gid: 0
      pipeline:
        - name: install
          runs: |
            set -eux -o pipefail

            GNUPGHOME="$(mktemp -d)"
            export GNUPGHOME

            gpg --import keys/awscli-gpg-key.asc
            gpg --batch --verify sig/awscli.zip.sig awscli.zip
            unzip -q awscli.zip

            ./aws/install -i "${target.dir}/usr/lib/awscli-2" -b "${target.dir}/usr/lib/awscli-2/bin"

            ln -sfn "/usr/lib/awscli-2/v2/2.36.36" "${target.dir}/usr/lib/awscli-2/v2/current"
            ln -sf "/usr/lib/awscli-2/v2/current/bin/aws" "${target.dir}/usr/lib/awscli-2/bin/aws"
            ln -sf "/usr/lib/awscli-2/v2/current/bin/aws_completer" "${target.dir}/usr/lib/awscli-2/bin/aws_completer"
        - name: add usr/bin symlinks
          runs: |
            set -eux -o pipefail

            mkdir -p "${target.dir}/usr/bin"
            ln -sf "../lib/awscli-2/bin/aws" "${target.dir}/usr/bin/aws"
            ln -sf "../lib/awscli-2/bin/aws_completer" "${target.dir}/usr/bin/aws_completer"
        - uses: dhi/build-pkg:0
          with:
            depends:
              - groff-base
              - less
              - libffi8
              - ncurses-base
              - zlib1g
            description: Unified Amazon Web Services command line interface (v2)
            files:
              - usr/lib/awscli-2
              - usr/bin/aws
              - usr/bin/aws_completer
            formats:
              - deb
            license: Apache-2.0
            name: awscli-2
            rel: 0
            url: https://aws.amazon.com/cli/
            version: 2.36.36
      paths:
        - type: file
          path: ${source.dir}/keys/awscli-gpg-key.asc
          uid: 0
          gid: 0
          source: package/main/awscli/debian-13/key/awscli-gpg-key.asc
os-release:
  name: Docker Hardened Images (Debian)
  id: debian
  version-id: "13"
  version-codename: trixie
  pretty-name: Docker Hardened Images/Debian GNU/Linux 13 (trixie)
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
