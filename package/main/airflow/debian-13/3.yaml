            git stash
        - name: patch ray bundled aiohttp and idna
          privileged: true
          runs: |
            set -eux -o pipefail

            airflow_root="${target.dir}/usr/lib/airflow"
            uv pip install \
              --upgrade \
              --constraint "${source.dir}/airflow/constraints.txt" \
              --target "${airflow_root}/lib/python3.13/site-packages/ray/_private/runtime_env/agent/thirdparty_files" \
              'aiohttp==3.14.5' \
              'idna==3.20'
        - name: replace vulnerable libraries bundled in ray_dist.jar
          runs: |
            set -eux -o pipefail

            airflow_root="${target.dir}/usr/lib/airflow"
            site="${airflow_root}/lib/python3.13/site-packages"
            jars_dir="${site}/ray/jars"
            ray_jar="${jars_dir}/ray_dist.jar"
            entries="${jars_dir}/.ray_dist_entries"

            if [ ! -f "${ray_jar}" ]; then
              echo "ERROR: ${ray_jar} not found; ray layout changed, revisit this step" >&2
              exit 1
            fi

            assert_older() {
              coords="$1"
              target="$2"
              bundled="$(unzip -p "${ray_jar}" "META-INF/maven/${coords}/pom.properties" 2> /dev/null | sed -n 's/^version=//p' | head -1 || true)"
              if [ -z "${bundled}" ]; then
                echo "ERROR: ${coords} not bundled in ray_dist.jar; revisit this step" >&2
                exit 1
              fi
              older="$(printf '%s\n%s\n' "${bundled}" "${target}" | sort -V | head -1)"
              if [ "${older}" != "${bundled}" ] || [ "${bundled}" = "${target}" ]; then
                echo "ERROR: bundled ${coords} ${bundled} is already >= ${target}; revisit this step" >&2
                exit 1
              fi
            }

            assert_at_least() {
              coords="$1"
              target="$2"
              bundled="$(unzip -p "${ray_jar}" "META-INF/maven/${coords}/pom.properties" 2> /dev/null | sed -n 's/^version=//p' | head -1 || true)"
              if [ -z "${bundled}" ]; then
                echo "ERROR: ${coords} not bundled in ray_dist.jar; revisit this step" >&2
                exit 1
              fi
              older="$(printf '%s\n%s\n' "${bundled}" "${target}" | sort -V | head -1)"
              if [ "${older}" != "${target}" ]; then
                echo "ERROR: bundled ${coords} ${bundled} is below required ${target}; revisit this step" >&2
                exit 1
              fi
            }

            assert_older org.apache.logging.log4j/log4j-api "2.25.5"
            assert_at_least org.apache.httpcomponents.core5/httpcore5 "5.4.3"

            zip -qd "${ray_jar}" \
              'org/apache/logging/log4j/*' \
              'Log4j-charsets.properties' \
              'META-INF/maven/org.apache.logging.log4j/log4j-api/*' \
              'META-INF/native-image/org.apache.logging.log4j/log4j-api/*' \
              'META-INF/services/org.apache.logging.log4j.util.PropertySource' \
              -x 'org/apache/logging/log4j/core/*'

            unzip -Z1 "${ray_jar}" > "${entries}"

            removed="$(grep -E '^META-INF/maven/org\.apache\.logging\.log4j/log4j-api/' "${entries}" || true)"
            if [ -n "${removed}" ]; then
              echo "ERROR: replaced components still present in ray_dist.jar:" >&2
              printf '%s\n' "${removed}" >&2
              exit 1
            fi

            for keep in 'log4j2.xml' 'META-INF/maven/org.apache.logging.log4j/log4j-core/pom.properties' 'org/apache/logging/slf4j/Log4jLoggerFactory.class'; do
              if ! grep -qxF "${keep}" "${entries}"; then
                echo "ERROR: ${keep} was removed from ray_dist.jar; strip globs are too broad" >&2
                exit 1
              fi
            done

            rm -f "${entries}"

            install -m 0644 "${source.dir}/log4j/log4j-api-2.25.5.jar" "${jars_dir}/"

            "${source.dir}/patch/remediate-ray-jars.sh" \
              "${ray_jar}" \
              "${source.dir}/ray-patch" \
              "2.18.11" \
              "33.7.2-jre"
        - name: remediate virtualenv seeds
          runs: |
            set -eux -o pipefail

            site="${target.dir}/usr/lib/airflow/lib/python3.13/site-packages"
            pip_wheel="${site}/virtualenv/seed/wheels/embed/pip-26.2.2-py3-none-any.whl"
            virtualenv_sbom="$(echo "${site}"/virtualenv-*.dist-info/sboms/virtualenv.cdx.json)"

            python3 "${source.dir}/patch/remediate-virtualenv-seeds.py" "${site}"

            PYTHONPATH="${pip_wheel}" python3 -c \
              'import pip._vendor.msgpack as m, pip._vendor.urllib3 as u; assert m.__version__ == "1.2.4"; assert u.__version__ == "2.8.0"'
            grep -F 'pkg:pypi/pip@26.2.2' "${virtualenv_sbom}"
            grep -F 'pkg:pypi/setuptools@84.2.1' "${virtualenv_sbom}"
            grep -F 'pkg:pypi/msgpack@1.2.4' "${virtualenv_sbom}"
            grep -F 'pkg:pypi/urllib3@2.8.0' "${virtualenv_sbom}"

            seed_test="$(mktemp -d)"
            trap 'rm -rf "${seed_test}"' EXIT
            PYTHONPATH="${site}" python3 -m virtualenv \
              --app-data "${seed_test}/app-data" \
              --no-download \
              --pip bundle \
              --setuptools bundle \
              "${seed_test}/venv"
            "${seed_test}/venv/bin/python" -c \
              'import pip._vendor.msgpack as m, pip._vendor.urllib3 as u; assert m.__version__ == "1.2.4"; assert u.__version__ == "2.8.0"'
            "${seed_test}/venv/bin/python" -c \
              'import setuptools; assert setuptools.__version__ == "84.2.1"'
            rm -rf "${seed_test}"
            trap - EXIT
        - name: remove FAB build dependency metadata
          runs: |
            set -eux -o pipefail

            fab_web="${target.dir}/usr/lib/airflow/lib/python3.13/site-packages/airflow/providers/fab/www"
            test -f "${fab_web}/pnpm-lock.yaml"
            if find "${fab_web}" -type d -name node_modules -print -quit | grep -q .; then
              echo "FAB unexpectedly ships node_modules; retain and remediate its dependency graph" >&2
              exit 1
            fi
            rm "${fab_web}/pnpm-lock.yaml"
        - name: install docker scripts
          work-dir: ${source.dir}/airflow
          runs: |
            set -eux -o pipefail

            docker_scripts="${target.dir}/usr/lib/airflow/docker"
            mkdir -p "${docker_scripts}"
            install -m 0775 scripts/docker/entrypoint_prod.sh "${docker_scripts}/entrypoint"
            install -m 0775 scripts/docker/clean-logs.sh "${docker_scripts}/clean-logs"
            install -m 0775 scripts/docker/airflow-scheduler-autorestart.sh "${docker_scripts}/airflow-scheduler-autorestart"
        - name: create default config
          runs: |
            set -eux -o pipefail

            airflow_root="${target.dir}/usr/lib/airflow"
            export PYTHONPATH="${airflow_root}/lib/python3.13/site-packages"
            "${airflow_root}/bin/airflow" config list --defaults > "${airflow_root}/airflow.cfg"
        - name: build main ui
          privileged: true
          runs: |
            set -eux -o pipefail

            airflow_root="${target.dir}/usr/lib/airflow"
            ui_dist="${airflow_root}/lib/python3.13/site-packages/airflow/ui/dist"

            cd "${source.dir}/airflow"
            git checkout "619a787ac81e8b7c8a9102fc78e3f0b00625d04e"

            cd '${source.dir}/airflow/airflow-core/src/airflow/ui'

            yq -i '.pnpm.overrides."prismjs" = "1.30.0"' package.json

            yq -i '.pnpm.overrides."form-data" = "4.0.6"' package.json

            yq -i '.pnpm.overrides."js-yaml" = "4.3.0"' package.json

            yq -i '.pnpm.overrides."@hey-api/openapi-ts" = "0.97.3"' package.json

            corepack pnpm up axios@1.18.0

            corepack pnpm up i18next-http-backend@3.0.5

            corepack pnpm up react-router-dom@7.18.1

            corepack pnpm install
            corepack pnpm run build --outDir "${ui_dist}"
        - name: build simple auth ui
          work-dir: ${source.dir}/airflow/airflow-core/src/airflow/api_fastapi/auth/managers/simple/ui
          privileged: true
          runs: |
            set -eux -o pipefail

            airflow_root="${target.dir}/usr/lib/airflow"
            ui_dist="${airflow_root}/lib/python3.13/site-packages/airflow/api_fastapi/auth/managers/simple/ui/dist"

            yq -i '.pnpm.overrides."form-data" = "4.0.6"' package.json

            yq -i '.pnpm.overrides."js-yaml" = "4.3.0"' package.json

            yq -i '.pnpm.overrides."@hey-api/openapi-ts" = "0.97.3"' package.json

            corepack pnpm up axios@1.18.0

            corepack pnpm up react-router-dom@7.18.1

            corepack pnpm install
            corepack pnpm run build --outDir "${ui_dist}"
        - name: fix venv shebangs and stage usr/bin/airflow
          runs: |
            set -eux -o pipefail

            airflow_root="${target.dir}/usr/lib/airflow"

            for f in "${airflow_root}/bin"/*; do
              [ -f "$f" ] || continue
              read -r line < "$f" || true
              case "$line" in
                "#!${target.dir}"*) sed -i "1s|#!${target.dir}|#!|" "$f" ;;
              esac
            done

            mkdir -p "${target.dir}/usr/bin"
            ln -sf ../lib/airflow/bin/airflow "${target.dir}/usr/bin/airflow"
        - name: python dependencies sbom
          uses: sbom@v1
          with:
            extra-scanners: python-package-cataloger
            prefix: airflow-python
            source: ${target.dir}/usr/lib/airflow
        - uses: dhi/build-pkg:0
          with:
            depends:
              - python-3.13
              - libpq5
            description: Apache Airflow workflow orchestration platform
            files:
              - usr/lib/airflow
              - usr/bin/airflow
            formats:
              - deb
            license: Apache-2.0
            name: airflow
            rel: 4
            url: https://airflow.apache.org/
            version: 3.4.0
      paths:
        - type: file
          path: ${source.dir}/scripts/build-provider
          uid: 0
          gid: 0
          mode: "0755"
          source: package/main/airflow/bin/build-provider
        - type: file
          path: ${source.dir}/patch/remediate-ray-jars.sh
          uid: 0
          gid: 0
          mode: "0755"
          source: package/main/airflow/patch/remediate-ray-jars.sh
        - type: file
          path: ${source.dir}/patch/remediate-virtualenv-seeds.py
          uid: 0
          gid: 0
          mode: "0755"
          source: package/main/airflow/patch/remediate-virtualenv-seeds.py
