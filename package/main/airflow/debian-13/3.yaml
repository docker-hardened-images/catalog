# syntax=dhi.io/build:2-debian13

image: dhi.io/pkg-airflow
variant: runtime
tags:
  - 3.3.0
  - 3.3.0-r1
  - 3.3.0-debian13
  - 3.3.0-r1-debian13
platforms:
  - linux/amd64
  - linux/arm64
dates:
  release: "2025-04-22"
vars:
  ARCH: '#{ target.arch == "amd64" ? "x86_64" : "aarch64" }'
  COMMIT_SHA: 1438ea3587031417cc85d74323235cf087a058fb
  PYTHON_MAJOR_MINOR_VERSION: "3.13"
  PYTHON_MINOR: "3.13"
  PYTHON_VERSION: 3.13.14-3
  REL: "1"
  SEMVER_MAJOR_MINOR_VERSION: "3.3"
  SEMVER_MAJOR_VERSION: "3"
  SEMVER_VERSION: 3.3.0
  UV_VERSION: 0.11.23
  VERSION: 3.3.0
  YQ_REFERENCE: dhi/pkg-go-yq:4.53.3-debian13@sha256:fa25aead6c75e8f0e877d8dd95e0bddb12f9530f2bbb25ccbe57af00105ba314
  YQ_VERSION: 4.53.3
contents:
  packages:
    - base-files
  builds:
    - name: airflow
      environment:
        UV_NO_MANAGED_PYTHON: "true"
        UV_PYTHON: /usr/bin/python3.13
        UV_PYTHON_DOWNLOADS: never
      caches:
        - path: /root/.cache/pip
        - path: /root/.npm
        - path: /root/.cache/uv
        - path: /root/.cargo
      contents:
        repositories:
          - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
        keyring:
          - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
        packages:
          - bash
          - build-essential
          - cargo-1.97
          - rustc-1.97
          - ca-certificates
          - coreutils
          - diffutils
          - findutils
          - g++
          - gawk
          - gfortran
          - git
          - grep
          - gzip
          - libffi-dev
          - libldap2-dev
          - libmariadb-dev
          - libpq-dev
          - libsasl2-dev
          - libssl-dev
          - libstdc++6
          - libxml2-dev
          - libxslt1-dev
          - libpython-3.13=3.13.14-3
          - libpython-3.13-dev=3.13.14-3
          - libpython-3.13-minimal=3.13.14-3
          - libpython-3.13-stdlib=3.13.14-3
          - node-corepack
          - nodejs-24
          - patchelf
          - pkg-config
          - python-3.13-minimal=3.13.14-3
          - python-3.13=3.13.14-3
          - python-3.13-dev=3.13.14-3
          - sed
          - unixodbc-dev
        files:
          - url: https://github.com/astral-sh/uv/releases/download/0.11.23/uv-${ARCH}-unknown-linux-gnu.tar.gz
            path: ${source.dir}/uv-unknown-linux-gnu.tar.gz
            uid: 0
            gid: 0
          - url: git+https://github.com/apache/airflow.git#3.3.0
            checksum: 1438ea3587031417cc85d74323235cf087a058fb
            path: ${source.dir}/airflow
            spdx:
              name: airflow
              version: 3.3.0
              packages:
                - name: airflow
                  purl: pkg:dhi/airflow@3.3.0
                  license: Apache-2.0
            uid: 0
            gid: 0
          - url: https://raw.githubusercontent.com/apache/airflow/constraints-3.3.0/constraints-3.13.txt
            path: ${source.dir}/airflow/constraints.txt
            uid: 0
            gid: 0
          - url: https://repo1.maven.org/maven2/org/apache/logging/log4j/log4j-core/2.25.4/log4j-core-2.25.4.jar
            checksum: sha256:10fee2c0485d54fa44ee75d314f6295508f7b932281873db61a91b88073200e6
            path: ${source.dir}/log4j/log4j-core-2.25.4.jar
            uid: 0
            gid: 0
          - url: https://repo1.maven.org/maven2/org/apache/logging/log4j/log4j-api/2.25.4/log4j-api-2.25.4.jar
            checksum: sha256:c4b642a7f047275215de117e0e3847eb2c7711d84a0aa7433e7b3c096daf341d
            path: ${source.dir}/log4j/log4j-api-2.25.4.jar
            uid: 0
            gid: 0
          - url: https://repo1.maven.org/maven2/org/apache/logging/log4j/log4j-slf4j-impl/2.25.4/log4j-slf4j-impl-2.25.4.jar
            checksum: sha256:7ac68a0afcc83d54f48d116d79370a43f0a2a6b71b5c1d6dda943bb6a95ddbaa
            path: ${source.dir}/log4j/log4j-slf4j-impl-2.25.4.jar
            uid: 0
            gid: 0
          - url: https://repo1.maven.org/maven2/org/apache/logging/log4j/log4j-1.2-api/2.25.4/log4j-1.2-api-2.25.4.jar
            checksum: sha256:7b1a61507950ea67b3d6b11437ee37fad9db06f855c92c25c08aee074c757395
            path: ${source.dir}/log4j/log4j-1.2-api-2.25.4.jar
            uid: 0
            gid: 0
        artifacts:
          - name: dhi.io/pkg-go-yq:4.53.3-debian13@sha256:fa25aead6c75e8f0e877d8dd95e0bddb12f9530f2bbb25ccbe57af00105ba314
            includes:
              - usr/local/bin/yq
            uid: 0
            gid: 0
      pipeline:
        - name: setup uv
          runs: |
            set -eux -o pipefail

            mkdir -p /usr/local/bin
            tar -xzf "${source.dir}/uv-unknown-linux-gnu.tar.gz" -C /usr/local/bin --strip-components=1
            chmod +x /usr/local/bin/uv
        - name: edit constraints
          work-dir: ${source.dir}/airflow
          runs: |
            set -eux -o pipefail

            touch ./overrides.txt

            sed -i 's/Pygments==2\.19\.2/Pygments==2.20.0/' ./constraints.txt

            sed -i 's/^google-cloud-aiplatform==1\.148\.1/google-cloud-aiplatform==1.155.0/g' ./constraints.txt

            sed -i 's/litellm==1\.82\.6/litellm==1.85.4/' ./constraints.txt
            for pkg in importlib_metadata; do
              version=$(grep -i "^${pkg}==" ./constraints.txt | head -1 | sed 's/.*==//')
              if [ -n "$version" ]; then
                echo "${pkg}==${version}" >> ./overrides.txt
              fi
            done

            # aiohttp 3.14.3 fixes CVE-2026-54273, CVE-2026-54274, CVE-2026-54275, CVE-2026-54276, CVE-2026-54277, CVE-2026-54278, CVE-2026-54279, CVE-2026-54280, CVE-2026-59881, CVE-2026-69243, CVE-2026-69244.
            sed -i 's/^aiohttp==3\.14\.1/aiohttp==3.14.3/g' ./constraints.txt

            sed -i 's/Mako==1\.3\.11/Mako==1.3.12/' ./constraints.txt

            sed -i 's/urllib3==2\.6\.3/urllib3==2.7.0/' ./constraints.txt

            sed -i 's/Authlib==1\.6\.9/Authlib==1.6.12/' ./constraints.txt

            sed -i 's/joserfc==1\.6\.5/joserfc==1.6.8/' ./constraints.txt

            sed -i 's/GitPython==3\.1\.50/GitPython==3.1.57/' ./constraints.txt # GHSA-2f96-g7mh-g2hx, GHSA-v396-v7q4-x2qj, GHSA-956x-8gvw-wg5v, GHSA-rwj8-pgh3-r573, GHSA-3rp5-jjmw-4wv2, GHSA-6p8h-3wgx-97gf, GHSA-fjr4-x663-mwxc, GHSA-r9mr-m37c-5fr3, GHSA-94p4-4cq8-9g67, GHSA-3f7w-8rr8-f37f, GHSA-539m-9xh6-q6rr, GHSA-p538-c434-8v24

            sed -i 's/pyasn1==0\.6\.3/pyasn1==0.6.4/' ./constraints.txt

            sed -i 's/idna==3\.11/idna==3.15/' ./constraints.txt

            sed -i 's/asyncssh==2\.22\.0/asyncssh==2.23.0/' ./constraints.txt

            sed -i 's/apache-airflow-providers-smtp==2\.4\.5/apache-airflow-providers-smtp==3.0.0/' ./constraints.txt

            sed -i 's/aiosmtplib==5\.1\.0/aiosmtplib==5.1.1/' ./constraints.txt

            sed -i 's/apache-airflow-providers-elasticsearch==6\.5\.2/apache-airflow-providers-elasticsearch==6.5.3/' ./constraints.txt

            sed -i 's/apache-airflow-providers-google==22\.1\.0/apache-airflow-providers-google==22.2.1/' ./constraints.txt

            sed -i 's/soupsieve==2\.8\.3/soupsieve==2.8.4/' ./constraints.txt

            sed -i 's/PyJWT==2\.12\.1/PyJWT==2.13.0/' ./constraints.txt

            sed -i 's/tornado==6\.5\.5/tornado==6.5.7/' ./constraints.txt

            sed -i 's/starlette==1\.1\.0/starlette==1.3.1/' ./constraints.txt

            # cryptography 50.0.0 fixes GHSA-537c-gmf6-5ccf, CVE-2026-69247, CVE-2026-69248, CVE-2026-69249
            sed -i 's/cryptography==48\.0\.1/cryptography==50.0.0/' ./constraints.txt

            # pyOpenSSL 26.2.0 caps cryptography<49 and gcloud-aio-auth 5.4.4 caps
            # cryptography<49.0.0; both must move for cryptography 50.0.0 to resolve.
            # pyOpenSSL 26.4.0 (not 26.3.0, which caps cryptography<50) allows <51.
            sed -i 's/pyOpenSSL==26\.2\.0/pyOpenSSL==26.4.0/' ./constraints.txt
            sed -i 's/gcloud-aio-auth==5\.4\.4/gcloud-aio-auth==5.5.0/' ./constraints.txt

            # setuptools 83.0.0 fixes CVE-2026-59890
            sed -i 's/setuptools==82\.0\.1/setuptools==83.0.0/' ./constraints.txt

            sed -i 's/python-multipart==0\.0\.29/python-multipart==0.0.31/' ./constraints.txt

            sed -i 's/pydantic-settings==2\.14\.1/pydantic-settings==2.14.2/' ./constraints.txt

            sed -i 's/msgpack==1\.1\.2/msgpack==1.2.1/' ./constraints.txt

            sed -i 's/apache-airflow-providers-sftp==5\.8\.0/apache-airflow-providers-sftp==5.8.1/' ./constraints.txt

            sed -i 's/apache-airflow-providers-ftp==3\.15\.0/apache-airflow-providers-ftp==3.15.1/' ./constraints.txt
        - name: build
          work-dir: ${source.dir}/airflow
          privileged: true
          runs: |
            set -eux -o pipefail

            airflow_root="${target.dir}/usr/lib/airflow"

            export UV_PYTHON=/usr/bin/python3.13
            export CPPFLAGS="$(python3.13-config --includes)"
            export LDFLAGS="$(python3.13-config --ldflags)"

            uv build --package apache-airflow
            uv build --package apache-airflow-core
            uv build --package apache-airflow-task-sdk

            providers="common-compat common-io common-sql smtp standard"
            providers_only_binary_flags=""
            for provider in $providers; do
              ${source.dir}/scripts/build-provider $provider
              providers_only_binary_flags="$providers_only_binary_flags --only-binary=apache-airflow-providers-$provider"
            done

            echo '[tool.uv.extra-build-dependencies]' >> pyproject.toml
            echo 'wirerope = ["setuptools==80.8.0"]' >> pyproject.toml

            sed -i '/^exclude-newer = "4 days"$/d' ./pyproject.toml

            annoying_only_binary_flags="--only-binary=grpcio"

            export UV_CONCURRENT_BUILDS="$(nproc)"
            export CMAKE_BUILD_PARALLEL_LEVEL="$(nproc)"

            uv pip install \
              --constraints constraints.txt \
              --overrides overrides.txt \
              --no-binary=:all: \
              --only-binary=apache-airflow \
              --only-binary=apache-airflow-core \
              --only-binary=apache-airflow-task-sdk \
              $providers_only_binary_flags \
              $annoying_only_binary_flags \
              --prefix "${airflow_root}" \
              dist/*.whl

            git stash
        - name: create default config
          runs: |
            set -eux -o pipefail

            airflow_root="${target.dir}/usr/lib/airflow"
            export PYTHONPATH="${airflow_root}/lib/python3.13/site-packages"
            "${airflow_root}/bin/airflow" config list --defaults > "${airflow_root}/airflow.cfg"
        - name: build main ui
          privileged: true
          runs: |
            set -eux -o pipefail

            airflow_root="${target.dir}/usr/lib/airflow"
            ui_dist="${airflow_root}/lib/python3.13/site-packages/airflow/ui/dist"

            cd "${source.dir}/airflow"
            git checkout "1438ea3587031417cc85d74323235cf087a058fb"

            cd '${source.dir}/airflow/airflow-core/src/airflow/ui'

            corepack pnpm config set dangerously-allow-all-builds true --location project

            touch pnpm-workspace.yaml

            yq -i '.overrides."prismjs" = "1.30.0"' pnpm-workspace.yaml

            yq -i '.overrides."form-data" = "4.0.6"' pnpm-workspace.yaml

            yq -i '.overrides."js-yaml" = "4.3.0"' pnpm-workspace.yaml

            yq -i '.overrides."@hey-api/openapi-ts" = "0.97.3"' pnpm-workspace.yaml

            corepack pnpm up axios@1.18.0

            corepack pnpm up i18next-http-backend@3.0.5

            corepack pnpm up react-router-dom@7.18.1

            corepack pnpm up form-data@4.0.6

            corepack pnpm install
            corepack pnpm run build --outDir "${ui_dist}"
        - name: build simple auth ui
          work-dir: ${source.dir}/airflow/airflow-core/src/airflow/api_fastapi/auth/managers/simple/ui
          privileged: true
          runs: |
            set -eux -o pipefail

            airflow_root="${target.dir}/usr/lib/airflow"
            ui_dist="${airflow_root}/lib/python3.13/site-packages/airflow/api_fastapi/auth/managers/simple/ui/dist"

            corepack pnpm config set dangerously-allow-all-builds true --location project

            touch pnpm-workspace.yaml

            yq -i '.overrides."form-data" = "4.0.6"' pnpm-workspace.yaml

            yq -i '.overrides."js-yaml" = "4.3.0"' pnpm-workspace.yaml

            yq -i '.overrides."@hey-api/openapi-ts" = "0.97.3"' pnpm-workspace.yaml

            corepack pnpm up axios@1.18.0

            corepack pnpm up react-router-dom@7.18.1

            corepack pnpm up form-data@4.0.6

            corepack pnpm install
            corepack pnpm run build --outDir "${ui_dist}"
        - name: fix venv shebangs and stage usr/bin/airflow
          runs: |
            set -eux -o pipefail

            airflow_root="${target.dir}/usr/lib/airflow"

            for f in "${airflow_root}/bin"/*; do
              [ -f "$f" ] || continue
              read -r line < "$f" || true
              case "$line" in
                "#!${target.dir}"*) sed -i "1s|#!${target.dir}|#!|" "$f" ;;
              esac
            done

            mkdir -p "${target.dir}/usr/bin"
            ln -sf ../lib/airflow/bin/airflow "${target.dir}/usr/bin/airflow"
        - uses: dhi/build-pkg:0
          with:
            depends:
              - python-3.13
            description: Apache Airflow workflow orchestration platform
            files:
              - usr/lib/airflow
              - usr/bin/airflow
            formats:
              - deb
            license: Apache-2.0
            name: airflow
            rel: 1
            url: https://airflow.apache.org/
            version: 3.3.0
      paths:
        - type: file
          path: ${source.dir}/scripts/build-provider
          uid: 0
          gid: 0
          mode: "0755"
          source: package/main/airflow/bin/build-provider
os-release:
  name: Docker Hardened Images (Debian)
  id: debian
  version-id: "13"
  version-codename: trixie
  pretty-name: Docker Hardened Images/Debian GNU/Linux 13 (trixie)
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
