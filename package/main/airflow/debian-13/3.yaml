  REL: "10"
  RUSTC_VERSION: 1.100.0-2
  SEMVER_MAJOR_MINOR_VERSION: "3.4"
  SEMVER_MAJOR_VERSION: "3"
  SEMVER_VERSION: 3.4.0
  UV_VERSION: 0.13.7
  VERSION: 3.4.0
contents:
  repositories:
    - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
  keyring:
    - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
  packages:
    - base-files
  builds:
    - name: airflow
      environment:
        UV_NO_MANAGED_PYTHON: "true"
        UV_PYTHON: /usr/bin/python3.13
        UV_PYTHON_DOWNLOADS: never
      caches:
        - path: /root/.cache/pip
        - path: /root/.npm
        - path: /root/.cache/uv
        - path: /root/.cargo
      contents:
        repositories:
          - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
        keyring:
          - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
        packages:
          - bash
          - build-essential
          - cargo=1.100.0-2
          - rustc=1.100.0-2
          - ca-certificates
          - coreutils
          - diffutils
          - eclipse-temurin-21-jdk=1:21.0.13.1+2-0
          - findutils
          - g++
          - gawk
          - gfortran
          - git
          - grep
          - gzip
          - libcurl4t64
          - libffi-dev
          - libgcc-s1
          - libldap2-dev
          - libmariadb-dev
          - libpq-dev
          - libsasl2-dev
          - libsqlite3-0
          - libssh2-1t64
          - libssl-dev
          - libstdc++6
          - libxml2-dev
          - libxslt1-dev
          - libpython-3.13=3.13.18-8
          - libpython-3.13-dev=3.13.18-8
          - libpython-3.13-minimal=3.13.18-8
          - libpython-3.13-stdlib=3.13.18-8
          - node-corepack
          - nodejs-24
          - patchelf
          - pkg-config
          - python-3.13-minimal=3.13.18-8
          - python-3.13=3.13.18-8
          - python-3.13-dev=3.13.18-8
          - sed
          - unixodbc-dev
          - unzip
          - zip
          - zlib1g
        files:
          - url: https://github.com/astral-sh/uv/releases/download/0.13.7/uv-${ARCH}-unknown-linux-gnu.tar.gz
            path: ${source.dir}/uv-unknown-linux-gnu.tar.gz
            uid: 0
            gid: 0
          - url: git+https://github.com/apache/airflow.git#3.4.0
            checksum: 619a787ac81e8b7c8a9102fc78e3f0b00625d04e
            path: ${source.dir}/airflow
            spdx:
              name: airflow
              version: 3.4.0
              packages:
                - name: airflow
                  purl: pkg:dhi/airflow@3.4.0
                  license: Apache-2.0
            uid: 0
            gid: 0
          - url: https://raw.githubusercontent.com/apache/airflow/constraints-3.4.0/constraints-3.13.txt
            path: ${source.dir}/airflow/constraints.txt
            uid: 0
            gid: 0
          - url: https://repo1.maven.org/maven2/org/apache/logging/log4j/log4j-core/2.25.4/log4j-core-2.25.4.jar
            checksum: sha256:10fee2c0485d54fa44ee75d314f6295508f7b932281873db61a91b88073200e6
            path: ${source.dir}/log4j/log4j-core-2.25.4.jar
            uid: 0
            gid: 0
          - url: https://repo1.maven.org/maven2/org/apache/logging/log4j/log4j-api/2.25.4/log4j-api-2.25.4.jar
            checksum: sha256:c4b642a7f047275215de117e0e3847eb2c7711d84a0aa7433e7b3c096daf341d
            path: ${source.dir}/log4j/log4j-api-2.25.4.jar
            uid: 0
            gid: 0
          - url: https://repo1.maven.org/maven2/org/apache/logging/log4j/log4j-slf4j-impl/2.25.4/log4j-slf4j-impl-2.25.4.jar
            checksum: sha256:7ac68a0afcc83d54f48d116d79370a43f0a2a6b71b5c1d6dda943bb6a95ddbaa
            path: ${source.dir}/log4j/log4j-slf4j-impl-2.25.4.jar
            uid: 0
            gid: 0
          - url: https://repo1.maven.org/maven2/org/apache/logging/log4j/log4j-1.2-api/2.25.4/log4j-1.2-api-2.25.4.jar
            checksum: sha256:7b1a61507950ea67b3d6b11437ee37fad9db06f855c92c25c08aee074c757395
            path: ${source.dir}/log4j/log4j-1.2-api-2.25.4.jar
            uid: 0
            gid: 0
          - url: https://repo1.maven.org/maven2/org/apache/logging/log4j/log4j-api/2.25.5/log4j-api-2.25.5.jar
            checksum: sha256:64777f73ea0b3104c04eb82befbdccc30a425a19e83ad06cb2f93aa303511863
            path: ${source.dir}/log4j/log4j-api-2.25.5.jar
            uid: 0
            gid: 0
          - url: https://maven-central.storage-download.googleapis.com/maven2/com/fasterxml/jackson/core/jackson-core/2.18.11/jackson-core-2.18.11.jar
            checksum: sha256:825fa72dfb9e2f8a642322f1390dbac22c30d15ebd6dc6b3772158821ee124eb
            path: ${source.dir}/ray-patch/jackson-core-2.18.11.jar
            uid: 0
            gid: 0
          - url: https://maven-central.storage-download.googleapis.com/maven2/com/fasterxml/jackson/core/jackson-databind/2.18.11/jackson-databind-2.18.11.jar
            checksum: sha256:075ad94a76c3edf83e1972dc26f476361eb6b9d0e260d93fc11105509bc79cab
            path: ${source.dir}/ray-patch/jackson-databind-2.18.11.jar
            uid: 0
            gid: 0
          - url: https://maven-central.storage-download.googleapis.com/maven2/com/fasterxml/jackson/core/jackson-annotations/2.18.11/jackson-annotations-2.18.11.jar
            checksum: sha256:9eab0d36da981645392427eedcb087e13be542488e37f935723dc0be50d18a53
            path: ${source.dir}/ray-patch/jackson-annotations-2.18.11.jar
            uid: 0
            gid: 0
          - url: https://maven-central.storage-download.googleapis.com/maven2/com/google/guava/guava/33.7.2-jre/guava-33.7.2-jre.jar
            checksum: sha256:b530942257fb935f8b2cfaa5f8eb5bd59c555fd8e8d01b8ce98912e077ea606c
            path: ${source.dir}/ray-patch/guava-33.7.2-jre.jar
            uid: 0
            gid: 0
          - url: https://maven-central.storage-download.googleapis.com/maven2/com/eed3si9n/jarjar/jarjar-assembly/1.14.1/jarjar-assembly-1.14.1.jar
            checksum: sha256:270fe285e399e298fb08c5daf1486648203a5bd5e90eaba4a6466097be7dd50f
            path: ${source.dir}/ray-patch/jarjar-assembly-1.14.1.jar
            uid: 0
            gid: 0
      pipeline:
        - name: setup uv
          runs: |
            set -eux -o pipefail

            mkdir -p /usr/local/bin
            tar -xzf "${source.dir}/uv-unknown-linux-gnu.tar.gz" -C /usr/local/bin --strip-components=1
            chmod +x /usr/local/bin/uv
        - name: bump python dependencies
          uses: python/bump@v1
          work-dir: ${source.dir}/airflow
          privileged: true
          with:
            bumps: ${source.dir}/patch/python-bumps.json
            mode: requirements
            overrides: overrides.txt
            python: /usr/bin/python3.13
            requirements: constraints.txt
            verify: none
        - name: bump litellm uv override
          uses: python/bump@v1
          work-dir: ${source.dir}/airflow
          privileged: true
          with:
            bumps: ${source.dir}/patch/python-bumps-overrides.json
            mode: requirements
            overrides: overrides.txt
            python: /usr/bin/python3.13
            requirements: ${source.dir}/patch/airflow-bump-empty.txt
            verify: none
        - name: prepare airflow install overrides
          work-dir: ${source.dir}/airflow
          runs: |
            set -eux -o pipefail

            for pkg in importlib_metadata; do
              version=$(grep -i "^${pkg}==" ./constraints.txt | head -1 | sed 's/.*==//')
              if [ -n "$version" ]; then
                echo "${pkg}==${version}" >> ./overrides.txt
              fi
            done

            echo "apache-airflow==3.4.0" >> ./overrides.txt
            echo "apache-airflow-core==3.4.0" >> ./overrides.txt

            echo 'psycopg-binary; python_version < "3"' >> ./overrides.txt
        - name: build
          work-dir: ${source.dir}/airflow
          privileged: true
          runs: |
            set -eux -o pipefail

            airflow_root="${target.dir}/usr/lib/airflow"

            export UV_PYTHON=/usr/bin/python3.13
            export CPPFLAGS="$(python3.13-config --includes)"
            export LDFLAGS="$(python3.13-config --ldflags)"

            uv build --package apache-airflow
            uv build --package apache-airflow-core
            uv build --package apache-airflow-task-sdk

            providers="common-compat common-io common-sql smtp standard"
            providers_only_binary_flags=""
            for provider in $providers; do
              ${source.dir}/scripts/build-provider $provider
              providers_only_binary_flags="$providers_only_binary_flags --only-binary=apache-airflow-providers-$provider"
            done

            echo '[tool.uv.extra-build-dependencies]' >> pyproject.toml
            echo 'wirerope = ["setuptools==80.8.0"]' >> pyproject.toml

            sed -i '/^exclude-newer = "4 days"$/d' ./pyproject.toml

            annoying_only_binary_flags="--only-binary=grpcio"

            export UV_CONCURRENT_BUILDS="$(nproc)"
            export CMAKE_BUILD_PARALLEL_LEVEL="$(nproc)"

            uv pip install \
              --constraints constraints.txt \
              --overrides overrides.txt \
              --no-binary=:all: \
              --only-binary=apache-airflow \
              --only-binary=apache-airflow-core \
              --only-binary=apache-airflow-task-sdk \
              $providers_only_binary_flags \
              $annoying_only_binary_flags \
              --prefix "${airflow_root}" \
              dist/*.whl

            git stash
        - name: build compat providers and install extra packages
          work-dir: ${source.dir}/airflow
          privileged: true
          runs: |
            set -eux -o pipefail

            airflow_root="${target.dir}/usr/lib/airflow"

            providers="amazon celery cncf-kubernetes common-messaging docker elasticsearch fab ftp git google grpc hashicorp http microsoft-azure mysql odbc openlineage postgres redis sendgrid sftp slack snowflake ssh"
            providers_only_binary_flags=""
            for provider in $providers; do
              ${source.dir}/scripts/build-provider $provider
              providers_only_binary_flags="$providers_only_binary_flags --only-binary=apache-airflow-providers-$provider"
            done

            extra_packages="aiobotocore[boto3] authlib eventlet gevent greenlet graphviz python-ldap pandas[sql-other] psycopg[c] statsd"

            no_source_only_binary_flags="--only-binary=redshift-connector --only-binary=ray --only-binary=protoc-wheel-0 --only-binary=openlineage-integration-common --only-binary=openlineage-python"
            annoying_only_binary_flags="--only-binary=pyarrow --only-binary=shapely --only-binary=grpcio --only-binary=scipy --only-binary=numpy --only-binary=adbc-driver-sqlite --only-binary=adbc-driver-postgresql --only-binary=hf-xet --only-binary=pandas --only-binary=cmake --only-binary=cloudpickle"

            echo '[tool.uv.extra-build-dependencies]' >> pyproject.toml
            echo 'wirerope = ["setuptools==80.8.0"]' >> pyproject.toml

            sed -i '/^exclude-newer = "4 days"$/d' ./pyproject.toml

            export UV_PYTHON=/usr/bin/python3.13
            export UV_CONCURRENT_BUILDS="$(nproc)"
            export CMAKE_BUILD_PARALLEL_LEVEL="$(nproc)"

            uv pip install \
              --constraints constraints.txt \
              --overrides overrides.txt \
              --no-binary=:all: \
              $providers_only_binary_flags \
              $no_source_only_binary_flags \
              $annoying_only_binary_flags \
              --prefix "${airflow_root}" \
              dist/*.whl \
              $extra_packages

            git stash
        - name: patch ray bundled aiohttp and idna
          privileged: true
          runs: |
            set -eux -o pipefail

            airflow_root="${target.dir}/usr/lib/airflow"
            uv pip install \
              --upgrade \
              --constraint "${source.dir}/airflow/constraints.txt" \
              --target "${airflow_root}/lib/python3.13/site-packages/ray/_private/runtime_env/agent/thirdparty_files" \
              'aiohttp==3.14.5' \
              'idna==3.20'
        - name: replace vulnerable libraries bundled in ray_dist.jar
          runs: |
            set -eux -o pipefail

            airflow_root="${target.dir}/usr/lib/airflow"
            site="${airflow_root}/lib/python3.13/site-packages"
            jars_dir="${site}/ray/jars"
            ray_jar="${jars_dir}/ray_dist.jar"
            entries="${jars_dir}/.ray_dist_entries"

            if [ ! -f "${ray_jar}" ]; then
              echo "ERROR: ${ray_jar} not found; ray layout changed, revisit this step" >&2
              exit 1
            fi

            assert_older() {
              coords="$1"
              target="$2"
              bundled="$(unzip -p "${ray_jar}" "META-INF/maven/${coords}/pom.properties" 2> /dev/null | sed -n 's/^version=//p' | head -1 || true)"
              if [ -z "${bundled}" ]; then
                echo "ERROR: ${coords} not bundled in ray_dist.jar; revisit this step" >&2
                exit 1
              fi
              older="$(printf '%s\n%s\n' "${bundled}" "${target}" | sort -V | head -1)"
              if [ "${older}" != "${bundled}" ] || [ "${bundled}" = "${target}" ]; then
                echo "ERROR: bundled ${coords} ${bundled} is already >= ${target}; revisit this step" >&2
                exit 1
              fi
            }

            assert_at_least() {
              coords="$1"
              target="$2"
              bundled="$(unzip -p "${ray_jar}" "META-INF/maven/${coords}/pom.properties" 2> /dev/null | sed -n 's/^version=//p' | head -1 || true)"
              if [ -z "${bundled}" ]; then
                echo "ERROR: ${coords} not bundled in ray_dist.jar; revisit this step" >&2
                exit 1
              fi
              older="$(printf '%s\n%s\n' "${bundled}" "${target}" | sort -V | head -1)"
              if [ "${older}" != "${target}" ]; then
                echo "ERROR: bundled ${coords} ${bundled} is below required ${target}; revisit this step" >&2
                exit 1
              fi
            }

            assert_older org.apache.logging.log4j/log4j-api "2.25.5"
            assert_at_least org.apache.httpcomponents.core5/httpcore5 "5.4.3"

            zip -qd "${ray_jar}" \
              'org/apache/logging/log4j/*' \
              'Log4j-charsets.properties' \
              'META-INF/maven/org.apache.logging.log4j/log4j-api/*' \
              'META-INF/native-image/org.apache.logging.log4j/log4j-api/*' \
              'META-INF/services/org.apache.logging.log4j.util.PropertySource' \
              -x 'org/apache/logging/log4j/core/*'

            unzip -Z1 "${ray_jar}" > "${entries}"

            removed="$(grep -E '^META-INF/maven/org\.apache\.logging\.log4j/log4j-api/' "${entries}" || true)"
            if [ -n "${removed}" ]; then
              echo "ERROR: replaced components still present in ray_dist.jar:" >&2
              printf '%s\n' "${removed}" >&2
              exit 1
            fi

            for keep in 'log4j2.xml' 'META-INF/maven/org.apache.logging.log4j/log4j-core/pom.properties' 'org/apache/logging/slf4j/Log4jLoggerFactory.class'; do
              if ! grep -qxF "${keep}" "${entries}"; then
                echo "ERROR: ${keep} was removed from ray_dist.jar; strip globs are too broad" >&2
                exit 1
              fi
            done

            rm -f "${entries}"

            install -m 0644 "${source.dir}/log4j/log4j-api-2.25.5.jar" "${jars_dir}/"

            "${source.dir}/patch/remediate-ray-jars.sh" \
              "${ray_jar}" \
              "${source.dir}/ray-patch" \
              "2.18.11" \
              "33.7.2-jre"
        - name: remediate virtualenv seeds
          runs: |
            set -eux -o pipefail

            site="${target.dir}/usr/lib/airflow/lib/python3.13/site-packages"
            pip_wheel="${site}/virtualenv/seed/wheels/embed/pip-26.2.2-py3-none-any.whl"
            virtualenv_sbom="$(echo "${site}"/virtualenv-*.dist-info/sboms/virtualenv.cdx.json)"

            python3 "${source.dir}/patch/remediate-virtualenv-seeds.py" "${site}"

            PYTHONPATH="${pip_wheel}" python3 -c \
              'import pip._vendor.msgpack as m, pip._vendor.urllib3 as u; assert m.__version__ == "1.2.4"; assert u.__version__ == "2.8.0"'
            grep -F 'pkg:pypi/pip@26.2.2' "${virtualenv_sbom}"
            grep -F 'pkg:pypi/setuptools@84.2.1' "${virtualenv_sbom}"
            grep -F 'pkg:pypi/msgpack@1.2.4' "${virtualenv_sbom}"
            grep -F 'pkg:pypi/urllib3@2.8.0' "${virtualenv_sbom}"

            seed_test="$(mktemp -d)"
            trap 'rm -rf "${seed_test}"' EXIT
            PYTHONPATH="${site}" python3 -m virtualenv \
              --app-data "${seed_test}/app-data" \
              --no-download \
              --pip bundle \
              --setuptools bundle \
              "${seed_test}/venv"
            "${seed_test}/venv/bin/python" -c \
              'import pip._vendor.msgpack as m, pip._vendor.urllib3 as u; assert m.__version__ == "1.2.4"; assert u.__version__ == "2.8.0"'
            "${seed_test}/venv/bin/python" -c \
              'import setuptools; assert setuptools.__version__ == "84.2.1"'
            rm -rf "${seed_test}"
            trap - EXIT
        - name: remove FAB build dependency metadata
          runs: |
            set -eux -o pipefail

            fab_web="${target.dir}/usr/lib/airflow/lib/python3.13/site-packages/airflow/providers/fab/www"
            test -f "${fab_web}/pnpm-lock.yaml"
            if find "${fab_web}" -type d -name node_modules -print -quit | grep -q .; then
              echo "FAB unexpectedly ships node_modules; retain and remediate its dependency graph" >&2
              exit 1
            fi
            rm "${fab_web}/pnpm-lock.yaml"
        - name: install docker scripts
          work-dir: ${source.dir}/airflow
          runs: |
            set -eux -o pipefail

            docker_scripts="${target.dir}/usr/lib/airflow/docker"
            mkdir -p "${docker_scripts}"
            install -m 0775 scripts/docker/entrypoint_prod.sh "${docker_scripts}/entrypoint"
            install -m 0775 scripts/docker/clean-logs.sh "${docker_scripts}/clean-logs"
            install -m 0775 scripts/docker/airflow-scheduler-autorestart.sh "${docker_scripts}/airflow-scheduler-autorestart"
        - name: create default config
          runs: |
            set -eux -o pipefail

            airflow_root="${target.dir}/usr/lib/airflow"
            export PYTHONPATH="${airflow_root}/lib/python3.13/site-packages"
            "${airflow_root}/bin/airflow" config list --defaults > "${airflow_root}/airflow.cfg"
        - name: enable corepack for ui builds
          privileged: true
          runs: |
            set -eux -o pipefail

            corepack enable
            chmod +x /usr/lib/nodejs/corepack/dist/*.js

            cd "${source.dir}/airflow"
            git checkout "619a787ac81e8b7c8a9102fc78e3f0b00625d04e"
        - name: prepare main ui pnpm
          privileged: true
          runs: |
            set -eux -o pipefail

            cd "${source.dir}/airflow/airflow-core/src/airflow/ui"
            corepack pnpm install --no-frozen-lockfile --ignore-scripts
        - name: bump main ui pnpm dependencies
          uses: pnpm/bump@v1
          privileged: true
          with:
            bumps: ${source.dir}/patch/pnpm-bumps-main-ui.json
            override-location: package.json
            pnpm-root: ${source.dir}/airflow/airflow-core/src/airflow/ui
        - name: build main ui
          privileged: true
          runs: |
            set -eux -o pipefail

            airflow_root="${target.dir}/usr/lib/airflow"
            ui_dist="${airflow_root}/lib/python3.13/site-packages/airflow/ui/dist"

            cd "${source.dir}/airflow/airflow-core/src/airflow/ui"
            corepack pnpm install
            corepack pnpm run build --outDir "${ui_dist}"
        - name: build simple auth ui
          work-dir: ${source.dir}/airflow/airflow-core/src/airflow/api_fastapi/auth/managers/simple/ui
          privileged: true
          runs: |
            set -eux -o pipefail

            airflow_root="${target.dir}/usr/lib/airflow"
            ui_dist="${airflow_root}/lib/python3.13/site-packages/airflow/api_fastapi/auth/managers/simple/ui/dist"

            corepack pnpm install
            corepack pnpm run build --outDir "${ui_dist}"
        - name: fix venv shebangs and stage usr/bin/airflow
          runs: |
            set -eux -o pipefail

            airflow_root="${target.dir}/usr/lib/airflow"

            for f in "${airflow_root}/bin"/*; do
              [ -f "$f" ] || continue
              read -r line < "$f" || true
              case "$line" in
                "#!${target.dir}"*) sed -i "1s|#!${target.dir}|#!|" "$f" ;;
              esac
            done

            mkdir -p "${target.dir}/usr/bin"
            ln -sf ../lib/airflow/bin/airflow "${target.dir}/usr/bin/airflow"
        - name: python dependencies sbom
          uses: sbom@v1
          with:
            extra-scanners: python-package-cataloger
            prefix: airflow-python
            source: ${target.dir}/usr/lib/airflow
        - uses: dhi/build-pkg:0
          with:
            depends:
              - python-3.13
              - libpq5
            description: Apache Airflow workflow orchestration platform
            files:
              - usr/lib/airflow
              - usr/bin/airflow
            formats:
              - deb
            license: Apache-2.0
            name: airflow
            rel: 10
            url: https://airflow.apache.org/
            version: 3.4.0
      paths:
        - type: file
          path: ${source.dir}/scripts/build-provider
          uid: 0
          gid: 0
          mode: "0755"
          source: package/main/airflow/bin/build-provider
        - type: file
          path: ${source.dir}/patch/remediate-ray-jars.sh
          uid: 0
          gid: 0
          mode: "0755"
          source: package/main/airflow/patch/remediate-ray-jars.sh
        - type: file
          path: ${source.dir}/patch/remediate-virtualenv-seeds.py
          uid: 0
          gid: 0
