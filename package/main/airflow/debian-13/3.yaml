  CARGO_VERSION: 1.100.0-2
  COMMIT_SHA: 619a787ac81e8b7c8a9102fc78e3f0b00625d04e
  GUAVA_PATCH_VERSION: 33.7.2-jre
  HTTPCORE5_MIN_VERSION: 5.4.3
