            sed -i 's/h2==4\.3\.0/h2==4.4.1/' ./constraints.txt # CVE-2026-71554

            echo "apache-airflow==3.4.0" >> ./overrides.txt
            echo "apache-airflow-core==3.4.0" >> ./overrides.txt
