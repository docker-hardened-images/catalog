      pipeline:
        - name: patch opensearch-dashboards with unified yarn patches
          uses: yarn/bump@v2
          run-as: opensearch-dashboards
          privileged: true
          with:
            bumps: ${source.dir}/patch/no-bumps.json
            yarn-root: ${source.dir}/opensearch-dashboards
        - name: patch brace-expansion lockfile
          run-as: opensearch-dashboards
          work-dir: ${source.dir}/opensearch-dashboards
          runs: |
            set -eux -o pipefail

            if grep -Eq 'brace-expansion-(1\.1\.(16|18)|2\.(0\.3|1\.(2|4))|5\.0\.(7|9))\.tgz' yarn.lock; then
              sed -i \
                -e '/^brace-expansion@\^1\.1\.7:/,/^$/{
                    s|^  version .*|  version "1.1.21"|
                    s|^  resolved .*|  resolved "https://registry.npmjs.org/brace-expansion/-/brace-expansion-1.1.21.tgz#edf4fab5c64d051aea5a8def49aba1c7522279f3"|
                    s|^  integrity .*|  integrity sha512-9zeA+KLZNNzglF2TPKRQEDyx6Yby7daAkuy8MiPzpXPsYDWi/DRM8jmwUDxokQjYqBpv5DgPiwD4h4ZZSy1Ujw==|
                  }
                  /^brace-expansion@\^2\.0\.1, brace-expansion@\^2\.0\.2:/,/^$/{
                    s|^  version .*|  version "2.1.7"|
                    s|^  resolved .*|  resolved "https://registry.npmjs.org/brace-expansion/-/brace-expansion-2.1.7.tgz#14ea3836731823bb24740225ea43b941b436f9d1"|
                    s|^  integrity .*|  integrity sha512-uZbew1NqdmPDTMJ8ah1y+b+9QEJrfkXFk3RcTQw3X0jW/xRUvFKsg1CfQdSYGdTbXZWExtU3J3ccxtnfw1Fi0g==|
                  }
                  /^brace-expansion@\^5\.0\.2, brace-expansion@\^5\.0\.5:/,/^$/{
                    s|^  version .*|  version "5.0.12"|
                    s|^  resolved .*|  resolved "https://registry.npmjs.org/brace-expansion/-/brace-expansion-5.0.12.tgz#995fbb4750a77c4d16a7dc942ff2ca6ef8e675ec"|
                    s|^  integrity .*|  integrity sha512-YovQ3rzhaLMIrDjNDMkNS01tea93qhEhG5xy8f6+R0l+dw3Ki+5sCoIoI942iuLZTHWogWktgwVDhU09iNEimQ==|
                  }' \
                yarn.lock
            fi

            grep -q 'brace-expansion-1.1.21.tgz' yarn.lock
            grep -q 'brace-expansion-2.1.7.tgz' yarn.lock
            grep -q 'brace-expansion-5.0.12.tgz' yarn.lock
            ! grep -Eq 'brace-expansion-(1\.1\.(16|18)|2\.(0\.3|1\.(2|4))|5\.0\.(7|9))\.tgz' yarn.lock
        - name: patch opensearch-dashboards (including osd-ui-shared-deps)
          uses: yarn/bump@v2
          run-as: opensearch-dashboards
          privileged: true
          with:
            bumps: ${source.dir}/patch/opensearch-dashboards-bumps.json
            yarn-root: ${source.dir}/opensearch-dashboards
        - name: patch observabilityDashboards
          uses: yarn/bump@v2
          run-as: opensearch-dashboards
          privileged: true
          with:
            bumps: ${source.dir}/patch/dashboards-observability-bumps.json
            yarn-root: ${source.dir}/opensearch-dashboards/plugins/observabilityDashboards
        - name: patch observability integration sample flask requirements
          run-as: opensearch-dashboards
          work-dir: ${source.dir}/opensearch-dashboards
          runs: |
            set -eux -o pipefail

            requirements_file="plugins/observabilityDashboards/server/adaptors/integrations/__data__/repository/haproxy/info/test/flask-app/requirements.txt"
            test -f "${requirements_file}"
            sed -i 's/flask==2\.3\.2/flask==3.1.3/g' "${requirements_file}" # CVE-2026-27205
            grep -q 'flask==3.1.3' "${requirements_file}"
        - name: patch reportsDashboards
          uses: yarn/bump@v2
          run-as: opensearch-dashboards
          privileged: true
          with:
            bumps: ${source.dir}/patch/dashboards-reporting-bumps.json
            yarn-root: ${source.dir}/opensearch-dashboards/plugins/reportsDashboards
        - name: patch queryWorkbenchDashboards
          uses: yarn/bump@v2
          run-as: opensearch-dashboards
          privileged: true
          with:
            bumps: ${source.dir}/patch/no-bumps.json
            yarn-root: ${source.dir}/opensearch-dashboards/plugins/queryWorkbenchDashboards
        - name: patch anomalyDetectionDashboards
          uses: yarn/bump@v2
          run-as: opensearch-dashboards
          privileged: true
          with:
