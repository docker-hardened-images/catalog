      pipeline:
        - name: patch opensearch-dashboards with unified yarn patches
          uses: yarn/bump@v2
          run-as: opensearch-dashboards
          privileged: true
          with:
            bumps: ${source.dir}/patch/no-bumps.json
            yarn-root: ${source.dir}/opensearch-dashboards
        - name: patch brace-expansion lockfile
          run-as: opensearch-dashboards
          work-dir: ${source.dir}/opensearch-dashboards
          runs: |
            set -eux -o pipefail

            grep -q 'brace-expansion-1.1.16.tgz' yarn.lock
            grep -q 'brace-expansion-2.0.3.tgz' yarn.lock
            grep -q 'brace-expansion-2.1.2.tgz' yarn.lock
            grep -q 'brace-expansion-5.0.7.tgz' yarn.lock

            sed -i \
              -e '/^brace-expansion@\^1\.1\.7:/,/^$/{
                    s|^  version "1\.1\.16"|  version "1.1.18"|
                    s|^  resolved .*|  resolved "https://registry.npmjs.org/brace-expansion/-/brace-expansion-1.1.18.tgz#3ce74d89885136be1535341f8c3d4425c29a5cab"|
                    s|^  integrity .*|  integrity sha512-Edep/X9fGqVNmzKBVsDYIOtD+z1tuezV70LBjdCst9Tqu76lsnvRiZ6oTic1n+/BIwX6QDGAO94PN4N2SADvtw==|
                  }
                  /^brace-expansion@\^2\.0\.1:/,/^$/{
                    s|^  version "2\.0\.3"|  version "2.1.4"|
                    s|^  resolved .*|  resolved "https://registry.npmjs.org/brace-expansion/-/brace-expansion-2.1.4.tgz#589dab11c0018d0366be64cd8bf12c8dbecc8326"|
                    s|^  integrity .*|  integrity sha512-hGfVzPxthbf3+2yjg/RBs60cB0FhqBS/zvdV/4wn4/BmN0bNMMHPc4V/BbFieqf1TKAGGAHnY4eSjajCl0f2Xg==|
                  }
                  /^brace-expansion@\^2\.0\.2:/,/^$/{
                    s|^  version "2\.1\.2"|  version "2.1.4"|
                    s|^  resolved .*|  resolved "https://registry.npmjs.org/brace-expansion/-/brace-expansion-2.1.4.tgz#589dab11c0018d0366be64cd8bf12c8dbecc8326"|
                    s|^  integrity .*|  integrity sha512-hGfVzPxthbf3+2yjg/RBs60cB0FhqBS/zvdV/4wn4/BmN0bNMMHPc4V/BbFieqf1TKAGGAHnY4eSjajCl0f2Xg==|
                  }
                  /^brace-expansion@\^5\.0\.2, brace-expansion@\^5\.0\.5:/,/^$/{
                    s|^  version "5\.0\.7"|  version "5.0.9"|
                    s|^  resolved .*|  resolved "https://registry.npmjs.org/brace-expansion/-/brace-expansion-5.0.9.tgz#7c72438809b5fa5babf54199a1f1c281a6984fcf"|
                    s|^  integrity .*|  integrity sha512-ScQ4IuvIEF1TMlP7Zt+vjJ//9zlPb2SDcxWxM3bk8s6t6GGdJ7KO1dCcTidOPJKePW30LE/2cT7wCyPho9/Wxg==|
                  }' \
              yarn.lock

            grep -q 'brace-expansion-1.1.18.tgz' yarn.lock
            grep -q 'brace-expansion-2.1.4.tgz' yarn.lock
            grep -q 'brace-expansion-5.0.9.tgz' yarn.lock
            ! grep -Eq 'brace-expansion-(1\.1\.16|2\.0\.3|2\.1\.2|5\.0\.7)\.tgz' yarn.lock
        - name: patch opensearch-dashboards (including osd-ui-shared-deps)
          uses: yarn/bump@v2
          run-as: opensearch-dashboards
          privileged: true
          with:
            bumps: ${source.dir}/patch/opensearch-dashboards-bumps.json
            yarn-root: ${source.dir}/opensearch-dashboards
        - name: patch observabilityDashboards
          uses: yarn/bump@v2
          run-as: opensearch-dashboards
          privileged: true
          with:
            bumps: ${source.dir}/patch/dashboards-observability-bumps.json
            yarn-root: ${source.dir}/opensearch-dashboards/plugins/observabilityDashboards
        - name: patch observability integration sample flask requirements
          run-as: opensearch-dashboards
          work-dir: ${source.dir}/opensearch-dashboards
          runs: |
            set -eux -o pipefail

            requirements_file="plugins/observabilityDashboards/server/adaptors/integrations/__data__/repository/haproxy/info/test/flask-app/requirements.txt"
            test -f "${requirements_file}"
            sed -i 's/flask==2\.3\.2/flask==3.1.3/g' "${requirements_file}" # CVE-2026-27205
            grep -q 'flask==3.1.3' "${requirements_file}"
        - name: patch reportsDashboards
          uses: yarn/bump@v2
          run-as: opensearch-dashboards
          privileged: true
          with:
            bumps: ${source.dir}/patch/dashboards-reporting-bumps.json
            yarn-root: ${source.dir}/opensearch-dashboards/plugins/reportsDashboards
        - name: patch queryWorkbenchDashboards
          uses: yarn/bump@v2
          run-as: opensearch-dashboards
          privileged: true
          with:
            bumps: ${source.dir}/patch/no-bumps.json
            yarn-root: ${source.dir}/opensearch-dashboards/plugins/queryWorkbenchDashboards
        - name: patch anomalyDetectionDashboards
          uses: yarn/bump@v2
          run-as: opensearch-dashboards
          privileged: true
          with:
            bumps: ${source.dir}/patch/no-bumps.json
            yarn-root: ${source.dir}/opensearch-dashboards/plugins/anomalyDetectionDashboards
        - name: patch indexManagementDashboards
          uses: yarn/bump@v2
          run-as: opensearch-dashboards
          privileged: true
          with:
