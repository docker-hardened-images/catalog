        - name: patch alertingDashboards
          uses: yarn/bump@v2
          run-as: opensearch-dashboards
          privileged: true
          with:
            bumps: ${source.dir}/patch/no-bumps.json
            yarn-root: ${source.dir}/opensearch-dashboards/plugins/alertingDashboards
        - name: patch securityAnalyticsDashboards
          uses: yarn/bump@v2
          run-as: opensearch-dashboards
          privileged: true
          with:
            bumps: ${source.dir}/patch/no-bumps.json
            yarn-root: ${source.dir}/opensearch-dashboards/plugins/securityAnalyticsDashboards
        - name: patch securityDashboards
          uses: yarn/bump@v2
          run-as: opensearch-dashboards
          privileged: true
          with:
            bumps: ${source.dir}/patch/security-dashboards-bumps.json
