        - name: patch searchRelevanceDashboards
          uses: yarn/bump@v2
          run-as: opensearch-dashboards
          privileged: true
          with:
            bumps: ${source.dir}/patch/no-bumps.json
            yarn-root: ${source.dir}/opensearch-dashboards/plugins/searchRelevanceDashboards
        - name: patch assistantDashboards
          uses: yarn/bump@v2
          run-as: opensearch-dashboards
          privileged: true
          with:
            bumps: ${source.dir}/patch/dashboards-assistant-bumps.json
            yarn-root: ${source.dir}/opensearch-dashboards/plugins/assistantDashboards
        - name: patch customImportMapDashboards
          uses: yarn/bump@v2
          run-as: opensearch-dashboards
          privileged: true
          with:
            bumps: ${source.dir}/patch/dashboards-custom-import-map-bumps.json
            yarn-root: ${source.dir}/opensearch-dashboards/plugins/customImportMapDashboards
        - name: patch mlCommonsDashboards
          uses: yarn/bump@v2
          run-as: opensearch-dashboards
          privileged: true
          with:
            bumps: ${source.dir}/patch/no-bumps.json
            yarn-root: ${source.dir}/opensearch-dashboards/plugins/mlCommonsDashboards
        - name: patch flowFrameworkDashboards
          uses: yarn/bump@v2
          run-as: opensearch-dashboards
          privileged: true
          with:
            bumps: ${source.dir}/patch/no-bumps.json
            yarn-root: ${source.dir}/opensearch-dashboards/plugins/flowFrameworkDashboards
        - name: patch queryInsightsDashboards
          uses: yarn/bump@v2
          run-as: opensearch-dashboards
          privileged: true
          with:
            bumps: ${source.dir}/patch/query-insights-dashboards-bumps.json
            yarn-root: ${source.dir}/opensearch-dashboards/plugins/queryInsightsDashboards
        - name: patch investigationDashboards
          uses: yarn/bump@v2
          run-as: opensearch-dashboards
          privileged: true
          with:
            bumps: ${source.dir}/patch/dashboards-investigation-bumps.json
            yarn-root: ${source.dir}/opensearch-dashboards/plugins/investigationDashboards
        - name: Bootstrap opensearch-dashboards with plugins
          run-as: opensearch-dashboards
          work-dir: ${source.dir}/opensearch-dashboards
          privileged: true
          runs: |
            set -eux -o pipefail

            yarn osd clean
            yarn osd bootstrap --single-version 'ignore'
        - name: patch build script to allow lockfile updates
          run-as: opensearch-dashboards
          work-dir: ${source.dir}/opensearch-dashboards
          runs: |
            set -eux -o pipefail

            sed -i "/'--frozen-lockfile',/d" src/dev/build/tasks/install_dependencies_task.ts
            if grep -q -- '--frozen-lockfile' src/dev/build/tasks/install_dependencies_task.ts; then
              echo "ERROR: --frozen-lockfile still present in install_dependencies_task.ts" >&2
              exit 1
            fi
        - name: build all plugins
          run-as: opensearch-dashboards
          work-dir: ${source.dir}/opensearch-dashboards/plugins
          privileged: true
          runs: |
            set -eux -o pipefail

            plugin_dirs=$(ls -1d */ | sed 's:/$::')
            for dir_name in $plugin_dirs; do
              echo "Building plugin: ${dir_name}"
              cd "${dir_name}"
              yarn build
              cd ..
            done
        - name: patch source
          uses: git/patch@v1
          work-dir: ${source.dir}/opensearch-dashboards
          with:
            patch: ${source.dir}/patch/no_node_download.patch
        - name: build opensearch-dashboards
          run-as: opensearch-dashboards
          work-dir: ${source.dir}/opensearch-dashboards
          runs: |
            set -eux -o pipefail

            yarn run build-platform --${OPENSEARCH_BUILD_ARCH} --skip-os-packages --release
        - name: extract opensearch-dashboards
          work-dir: ${source.dir}/opensearch-dashboards
          runs: |
            set -eux -o pipefail

            ls -la ${source.dir}/opensearch-dashboards/build
            ls -la ${source.dir}/opensearch-dashboards/build/opensearch-dashboards
            ls -la ${source.dir}/opensearch-dashboards/build/opensearch-dashboards-3.9.0-${OPENSEARCH_DIST_ARCH}
            install -d "${target.dir}/usr/share"
            cp -r ${source.dir}/opensearch-dashboards/build/opensearch-dashboards ${target.dir}/usr/share/opensearch-dashboards
        - name: extract plugin builds to target
          work-dir: ${source.dir}/opensearch-dashboards/plugins
          runs: |
            set -eux -o pipefail

            mkdir -p ${target.dir}/usr/share/opensearch-dashboards/plugins

            plugin_dirs=$(ls -1d */ | sed 's:/$::')
            for dir_name in $plugin_dirs; do
              build_dir="${dir_name}/build"
              echo "Processing plugin: ${dir_name}"
              if [ ! -d "${build_dir}" ]; then
                echo "Error: build directory not found for ${dir_name}, skipping"
                exit 1
              fi

              found_zip=$(find "${build_dir}" -maxdepth 1 -type f -iname "*3.9.0*.zip" | head -n 1 || true)

              if [ -z "${found_zip}" ]; then
                echo "Error: No zip found for plugin ${dir_name} containing version 3.9.0"
                exit 1
              fi

              echo "Found artifact: ${found_zip}, extracting to ${target.dir}/usr/share/opensearch-dashboards/plugins/"
              unzip -q "${found_zip}" -d "${target.dir}/usr/share/opensearch-dashboards/plugins/"
            done
        - name: copy over plugins to final dir inside opensearch-dashboards plugins dir
          runs: |
            set -eux -o pipefail

            mkdir -p ${source.dir}/tmp/plugins
            cp -r ${target.dir}/usr/share/opensearch-dashboards/plugins/opensearch-dashboards/* ${source.dir}/tmp/plugins
            rm -rf ${target.dir}/usr/share/opensearch-dashboards/plugins
            rm -rf ${source.dir}/tmp/plugins/opensearch-dashboards
            cp -r ${source.dir}/tmp/plugins ${target.dir}/usr/share/opensearch-dashboards/plugins
        - name: strip plugin build lockfiles
          runs: |
            set -eux -o pipefail

            find "${target.dir}/usr/share/opensearch-dashboards/plugins" -name yarn.lock -delete
            if find "${target.dir}/usr/share/opensearch-dashboards/plugins" -name yarn.lock | grep -q .; then
              echo "ERROR: plugin yarn.lock files remain after cleanup" >&2
              exit 1
            fi
        - uses: dhi/build-pkg:0
          with:
            depends:
              - nodejs-22
              - libstdc++6
            description: OpenSearch Dashboards visualization and analytics UI
            files:
              - usr/share/opensearch-dashboards
            formats:
              - deb
            license: Apache-2.0
            name: opensearch-dashboards
            rel: 0
            url: https://opensearch.org/
            version: 3.9.0
      paths:
        - type: directory
          path: ${source.dir}/patch
          uid: 1000
          gid: 1000
          mode: "0700"
          source: package/main/opensearch-dashboards/patch
      accounts:
        run-as: opensearch-dashboards
        users:
          - name: opensearch-dashboards
            uid: 1000
            gid: 1000
        groups:
          - name: opensearch-dashboards
            gid: 1000
            members:
              - opensearch-dashboards
os-release:
  name: Docker Hardened Images (Debian)
  id: debian
  version-id: "13"
  version-codename: trixie
  pretty-name: Docker Hardened Images/Debian GNU/Linux 13 (trixie)
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
