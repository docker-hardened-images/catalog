  EXTRA_JDK27_DOWNLOAD: https://github.com/adoptium/temurin27-binaries/releases/download/jdk-27+35-ea-beta/OpenJDK27U-jdk_${ARCH}_linux_hotspot_27_35-ea.tar.gz
