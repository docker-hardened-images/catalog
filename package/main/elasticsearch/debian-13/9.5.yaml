  EXTRA_JDK24_DOWNLOAD: https://github.com/adoptium/temurin24-binaries/releases/download/jdk-24.0.2+12/OpenJDK24U-jdk_${ARCH}_linux_hotspot_24.0.2_12.tar.gz
