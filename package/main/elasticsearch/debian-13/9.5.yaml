contents:
  packages:
    - base-files
  builds:
    - name: elasticsearch
      work-dir: ${source.dir}/elasticsearch
      environment:
        ES_JAVA_HOME: /usr/lib/jvm/temurin-21
      caches:
        - path: /root/.gradle
      contents:
        repositories:
          - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
        keyring:
          - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
        packages:
          - bash
          - ca-certificates
          - coreutils
          - findutils
          - gzip
          - sed
          - tar
          - tini
          - eclipse-temurin-17-jdk=17.0.20.8-0
          - eclipse-temurin-21-jdk=21.0.12.8-0
          - eclipse-temurin-25-jdk=25.0.4.7-0
          - eclipse-temurin-26-jdk=26.0.2.10-0
        files:
          - url: git+https://github.com/elastic/elasticsearch.git#v9.5.2
            checksum: b42549c72e6e040825b13e5d8ebf7ff63886b24d
            path: ${source.dir}/elasticsearch
            spdx:
              name: elasticsearch
              version: 9.5.2
              packages:
                - name: elasticsearch
                  purl: pkg:dhi/elasticsearch@9.5.2
                  license: Elastic-License-2.0
            uid: 0
            gid: 0
          - url: https://repo1.maven.org/maven2/org/elasticsearch/plugin/x-pack-core/9.5.2/x-pack-core-9.5.2.jar
            checksum: sha256:f426d2697f7bc95203c2a9fa26f77484df06dda2e91fd4d70f7d63501d5b3045
            path: ${source.dir}/x-pack-core/x-pack-core-9.5.2.jar
            uid: 0
            gid: 0
          - url: https://github.com/adoptium/temurin19-binaries/releases/download/jdk-19.0.2+7/OpenJDK19U-jdk_${ARCH}_linux_hotspot_19.0.2_7.tar.gz
            checksum: https://github.com/adoptium/temurin19-binaries/releases/download/jdk-19.0.2+7/OpenJDK19U-jdk_${ARCH}_linux_hotspot_19.0.2_7.tar.gz.sha256.txt
            path: ${source.dir}/extra-jdk19.tar.gz
            uid: 0
            gid: 0
          - url: https://github.com/adoptium/temurin20-binaries/releases/download/jdk-20.0.2+9/OpenJDK20U-jdk_${ARCH}_linux_hotspot_20.0.2_9.tar.gz
            checksum: https://github.com/adoptium/temurin20-binaries/releases/download/jdk-20.0.2+9/OpenJDK20U-jdk_${ARCH}_linux_hotspot_20.0.2_9.tar.gz.sha256.txt
            path: ${source.dir}/extra-jdk20.tar.gz
            uid: 0
            gid: 0
          - url: https://github.com/adoptium/temurin22-binaries/releases/download/jdk-22.0.2+9/OpenJDK22U-jdk_${ARCH}_linux_hotspot_22.0.2_9.tar.gz
            checksum: https://github.com/adoptium/temurin22-binaries/releases/download/jdk-22.0.2+9/OpenJDK22U-jdk_${ARCH}_linux_hotspot_22.0.2_9.tar.gz.sha256.txt
            path: ${source.dir}/extra-jdk22.tar.gz
            uid: 0
            gid: 0
          - url: https://github.com/adoptium/temurin23-binaries/releases/download/jdk-23.0.2+7/OpenJDK23U-jdk_${ARCH}_linux_hotspot_23.0.2_7.tar.gz
            checksum: https://github.com/adoptium/temurin23-binaries/releases/download/jdk-23.0.2+7/OpenJDK23U-jdk_${ARCH}_linux_hotspot_23.0.2_7.tar.gz.sha256.txt
            path: ${source.dir}/extra-jdk23.tar.gz
            uid: 0
            gid: 0
          - url: https://github.com/adoptium/temurin24-binaries/releases/download/jdk-24.0.2+12/OpenJDK24U-jdk_${ARCH}_linux_hotspot_24.0.2_12.tar.gz
            checksum: https://github.com/adoptium/temurin24-binaries/releases/download/jdk-24.0.2+12/OpenJDK24U-jdk_${ARCH}_linux_hotspot_24.0.2_12.tar.gz.sha256.txt
            path: ${source.dir}/extra-jdk24.tar.gz
            uid: 0
            gid: 0
          - url: https://github.com/adoptium/temurin27-binaries/releases/download/jdk-27+35-ea-beta/OpenJDK27U-jdk_${ARCH}_linux_hotspot_27_35-ea.tar.gz
            checksum: https://github.com/adoptium/temurin27-binaries/releases/download/jdk-27+35-ea-beta/OpenJDK27U-jdk_${ARCH}_linux_hotspot_27_35-ea.tar.gz.sha256.txt
            path: ${source.dir}/extra-jdk27.tar.gz
            uid: 0
            gid: 0
      pipeline:
        - name: git patch elasticsearch docker-entrypoint for FIPS keystore
          uses: patch@v1
          work-dir: ${source.dir}/elasticsearch
          with:
            options: -p1
            patches:
              - ${source.dir}/patch/docker-entrypoint-fips-keystore.patch
        - name: stage gradle dependency overrides init script
          work-dir: ${source.dir}/elasticsearch
          runs: |
            set -eux -o pipefail

            cp "${source.dir}/patch/9.5.overrides.gradle" \
              "${source.dir}/elasticsearch/dhi-overrides.init.gradle"
        - name: install gradle toolchain jdks without hsp packages
          runs: |
            set -eux -o pipefail

            for jdk_major in 19 20 22 23 24 27; do
              install -d "/usr/lib/jvm/temurin-${jdk_major}"
              tar -xzf "${source.dir}/extra-jdk${jdk_major}.tar.gz" --strip-components=1 \
                -C "/usr/lib/jvm/temurin-${jdk_major}"
            done
        - name: extract Elastic public key to be properly compatible with Elastic licenses
          work-dir: ${source.dir}/x-pack-core
          runs: |
            set -eux -o pipefail

            jar xf x-pack-core-9.5.2.jar public.key
        - name: build
          privileged: true
          runs: |
            set -eux -o pipefail

            ulimit -n 65536 || true

            unset JDK_JAVA_OPTIONS
            unset JAVA_TOOL_OPTIONS
            unset _JAVA_OPTIONS

            GRADLE_JAVA_INSTALLATION_PATHS="/usr/lib/jvm/temurin-17,/usr/lib/jvm/temurin-21,/usr/lib/jvm/temurin-25,/usr/lib/jvm/temurin-26"
            for jdk_major in 19 20 22 23 24 27; do
              GRADLE_JAVA_INSTALLATION_PATHS="${GRADLE_JAVA_INSTALLATION_PATHS},/usr/lib/jvm/temurin-${jdk_major}"
            done

            ./gradlew \
              --init-script "${source.dir}/elasticsearch/dhi-overrides.init.gradle" \
              --write-verification-metadata sha256 \
              localDistro \
              -Dbuild.snapshot=false \
              -Dlicense.key=${source.dir}/x-pack-core/public.key \
              -Dorg.gradle.java.installations.auto-download=false \
              -Dorg.gradle.java.installations.paths="${GRADLE_JAVA_INSTALLATION_PATHS}"

            ./gradlew \
              --init-script "${source.dir}/elasticsearch/dhi-overrides.init.gradle" \
              localDistro \
              -Dbuild.snapshot=false \
              -Dlicense.key=${source.dir}/x-pack-core/public.key \
              -Dorg.gradle.java.installations.auto-download=false \
              -Dorg.gradle.java.installations.paths="${GRADLE_JAVA_INSTALLATION_PATHS}"
        - name: extract built tarball
          runs: |
            set -eux -o pipefail

            rm -r "${source.dir}/elasticsearch/distribution/archives/${ELASTICSEARCH_OUTPUT_ARCHIVE_DIR}/build/install/elasticsearch-9.5.2/jdk"

            install -d "${target.dir}/usr/share/elasticsearch"
            cp -r "${source.dir}/elasticsearch/distribution/archives/${ELASTICSEARCH_OUTPUT_ARCHIVE_DIR}/build/install/elasticsearch-9.5.2/." \
              "${target.dir}/usr/share/elasticsearch"

            cp "${target.dir}/usr/share/elasticsearch/config/log4j2.properties" \
              "${target.dir}/usr/share/elasticsearch/config/log4j2.file.properties"

            install -D -m 0755 \
              "${source.dir}/elasticsearch/distribution/docker/src/docker/bin/docker-entrypoint.sh" \
              "${target.dir}/usr/share/elasticsearch/bin/docker-entrypoint.sh"
        - uses: dhi/build-pkg:0
          with:
            depends:
              - bash
              - coreutils
            description: Elasticsearch distributed search and analytics engine
            files:
              - usr/share/elasticsearch
            formats:
              - deb
            license: Elastic-License-2.0
            name: elasticsearch-9.5
            rel: 0
            url: https://www.elastic.co/elasticsearch/
            version: 9.5.2
      paths:
        - type: file
          path: ${source.dir}/patch/docker-entrypoint-fips-keystore.patch
          uid: 0
          gid: 0
          source: package/main/elasticsearch/patch/docker-entrypoint-fips-keystore.patch
        - type: file
          path: ${source.dir}/patch/9.5.overrides.gradle
          uid: 0
          gid: 0
          source: package/main/elasticsearch/patch/9.5.overrides.gradle
os-release:
