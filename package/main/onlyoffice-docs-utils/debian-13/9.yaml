# syntax=dhi.io/build:2-debian13

image: dhi.io/pkg-onlyoffice-docs-utils
variant: runtime
tags:
  - 9.4.1
  - 9.4.1-r1
  - 9.4.1-debian13
  - 9.4.1-r1-debian13
platforms:
  - linux/amd64
  - linux/arm64
dates:
  release: "2026-06-09"
vars:
  PYTHON_DEV_PACKAGE_VERSION: 3.11.16-1
  PYTHON_MAJOR_MINOR_VERSION: "3.11"
  PYTHON_MINIMAL_PACKAGE_VERSION: 3.11.16-1
  PYTHON_PACKAGE_VERSION: 3.11.16-1
  REL: "1"
  SEMVER_MAJOR_MINOR_VERSION: "9.4"
  SEMVER_MAJOR_VERSION: "9"
  SEMVER_VERSION: 9.4.1
  VERSION: 9.4.1-1
contents:
  packages:
    - base-files
  builds:
    - name: onlyoffice-docs-utils
      contents:
        repositories:
          - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
        keyring:
          - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
        packages:
          - bash
          - build-essential
          - ca-certificates
          - coreutils
          - findutils
          - libpq-dev
          - libpython-3.11=3.11.16-1
          - libpython-3.11-dev=3.11.16-1
          - libpython-3.11-minimal=3.11.16-1
          - libpython-3.11-stdlib=3.11.16-1
          - python-3.11=3.11.16-1
          - python-3.11-dev=3.11.16-1
          - python-3.11-minimal=3.11.16-1
          - python3-pip
          - python3-setuptools
          - python3-wheel
      pipeline:
        - name: install python dependencies
          privileged: true
          runs: |
            set -eux -o pipefail

            python3 -m pip install --no-cache-dir \
              --target "${target.dir}/usr/lib/onlyoffice-docs-utils/lib/python3.11/site-packages" \
              -r "${source.dir}/requirements.txt"
        - name: stage utility assets
          runs: |
            set -eux -o pipefail

            mkdir -p "${target.dir}/usr/bin" \
              "${target.dir}/usr/share/onlyoffice-docs-utils/scripts"
            cp -a "${source.dir}/entrypoint.py" \
              "${target.dir}/usr/bin/onlyoffice-docs-utils-entrypoint.py"
            cp -a "${source.dir}/schema" \
              "${target.dir}/usr/share/onlyoffice-docs-utils/scripts/schema"
        - uses: dhi/build-pkg:0
          with:
            deb:
              depends:
                - libaio1t64
                - libffi8
                - libgcc-s1
                - libodbc2
                - libpq5
                - libstdc++6
            depends:
              - python-3.11
            description: ONLYOFFICE Docs utility dependencies and schema assets
            files:
              - usr/bin/onlyoffice-docs-utils-entrypoint.py
              - usr/lib/onlyoffice-docs-utils
              - usr/share/onlyoffice-docs-utils
            formats:
              - deb
            license: AGPL-3.0-only
            name: onlyoffice-docs-utils
            rel: 1
            url: https://github.com/ONLYOFFICE/DocumentServer
            version: 9.4.1
      paths:
        - type: file
          path: ${source.dir}/requirements.txt
          uid: 0
          gid: 0
          source: package/main/onlyoffice-docs-utils/requirements.txt
        - type: file
          path: ${source.dir}/entrypoint.py
          uid: 0
          gid: 0
          mode: "0755"
          source: package/main/onlyoffice-docs-utils/entrypoint.py
        - type: directory
          path: ${source.dir}/schema
          uid: 0
          gid: 0
          source: package/main/onlyoffice-docs-utils/schema
os-release:
  name: Docker Hardened Images (Debian)
  id: debian
  version-id: "13"
  version-codename: trixie
  pretty-name: Docker Hardened Images/Debian GNU/Linux 13 (trixie)
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
