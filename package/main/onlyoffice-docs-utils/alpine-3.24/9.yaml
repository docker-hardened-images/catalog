# syntax=dhi.io/build:2-alpine3.24

image: dhi.io/pkg-onlyoffice-docs-utils
variant: runtime
tags:
  - 9.4.1-alpine3.24
  - 9.4.1-r0-alpine3.24
platforms:
  - linux/amd64
  - linux/arm64
dates:
  release: "2026-06-09"
vars:
  PYTHON_MAJOR_MINOR_VERSION: "3.11"
  PYTHON_PACKAGE_VERSION: 3.11.16-r1
  PYTHON_PIP_VERSION: 26.1.2-r0
  PYTHON_SETUPTOOLS_VERSION: 83.0.0-r0
  REL: "0"
  SEMVER_MAJOR_MINOR_VERSION: "9.4"
  SEMVER_MAJOR_VERSION: "9"
  SEMVER_VERSION: 9.4.1
  VERSION: 9.4.1-1
contents:
  repositories:
    - https://dhi.io/apk/alpine/v3.24/main
    - https://dl-cdn.alpinelinux.org/alpine/v3.24/main
    - https://dl-cdn.alpinelinux.org/alpine/v3.24/community
  keyring:
    - https://dhi.io/keyring/dhi-apk@docker-0F81AD7700D99184.rsa.pub
  packages:
    - alpine-baselayout-data
  builds:
    - name: onlyoffice-docs-utils
      contents:
        packages:
          - bash
          - build-base
          - ca-certificates-bundle
          - findutils
          - libpq-dev
          - py3.11-pip=26.1.2-r0
          - py3.11-setuptools=83.0.0-r0
          - python-3.11=3.11.16-r1
          - python-3.11-dev=3.11.16-r1
      pipeline:
        - name: install python dependencies
          privileged: true
          runs: |
            set -eux -o pipefail

            python3 -m pip install --no-cache-dir \
              --target "${target.dir}/usr/lib/onlyoffice-docs-utils/lib/python3.11/site-packages" \
              -r "${source.dir}/requirements.txt"
        - name: stage utility assets
          runs: |
            set -eux -o pipefail

            mkdir -p "${target.dir}/usr/bin" \
              "${target.dir}/usr/share/onlyoffice-docs-utils/scripts"
            cp -a "${source.dir}/entrypoint.py" \
              "${target.dir}/usr/bin/onlyoffice-docs-utils-entrypoint.py"
            cp -a "${source.dir}/schema" \
              "${target.dir}/usr/share/onlyoffice-docs-utils/scripts/schema"
        - uses: dhi/build-pkg:0
          with:
            apk:
              depends:
                - libaio
                - libffi
                - libpq
                - libstdc++
                - unixodbc
            depends:
              - python-3.11
            description: ONLYOFFICE Docs utility dependencies and schema assets
            files:
              - usr/bin/onlyoffice-docs-utils-entrypoint.py
              - usr/lib/onlyoffice-docs-utils
              - usr/share/onlyoffice-docs-utils
            formats:
              - apk
            license: AGPL-3.0-only
            name: onlyoffice-docs-utils
            rel: 0
            url: https://github.com/ONLYOFFICE/DocumentServer
            version: 9.4.1
      paths:
        - type: file
          path: ${source.dir}/requirements.txt
          uid: 0
          gid: 0
          source: package/main/onlyoffice-docs-utils/requirements.txt
        - type: file
          path: ${source.dir}/entrypoint.py
          uid: 0
          gid: 0
          mode: "0755"
          source: package/main/onlyoffice-docs-utils/entrypoint.py
        - type: directory
          path: ${source.dir}/schema
          uid: 0
          gid: 0
          source: package/main/onlyoffice-docs-utils/schema
os-release:
  name: Docker Hardened Images (Alpine)
  id: alpine
  version-id: "3.24"
  pretty-name: Docker Hardened Images/Alpine Linux v3.24
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
