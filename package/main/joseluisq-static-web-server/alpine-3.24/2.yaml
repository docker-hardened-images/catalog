# syntax=dhi.io/build:2-alpine3.24

image: dhi.io/pkg-joseluisq-static-web-server
variant: runtime
tags:
  - 2.44.1-alpine3.24
  - 2.44.1-r0-alpine3.24
platforms:
  - linux/amd64
  - linux/arm64
dates:
  release: "2021-07-17"
vars:
  CARGO_VERSION: 1.96.1-r0
  COMMIT_SHA: c5cbe67e91da91ccad838163cf9a034bf221a447
  PACKAGE_NAME: static-web-server-2
  REL: "0"
  RUST_VERSION: 1.96.1-r0
  SEMVER_MAJOR_MINOR_VERSION: "2.44"
  SEMVER_MAJOR_VERSION: "2"
  SEMVER_VERSION: 2.44.1
  VERSION: 2.44.1
contents:
  repositories:
    - https://dhi.io/apk/alpine/v3.24/main
    - https://dl-cdn.alpinelinux.org/alpine/v3.24/main
    - https://dl-cdn.alpinelinux.org/alpine/v3.24/community
  keyring:
    - https://dhi.io/keyring/dhi-apk@docker-0F81AD7700D99184.rsa.pub
  packages:
    - alpine-baselayout-data
  builds:
    - name: static-web-server
      work-dir: ${source.dir}/static-web-server
      caches:
        - path: /root/.cargo
      contents:
        packages:
          - bash
          - build-base
          - ca-certificates
          - cargo=1.96.1-r0
          - clang22
          - clang22-libclang
          - cmake
          - coreutils
          - git
          - musl-dev
          - pkgconf
          - rust=1.96.1-r0
          - sqlite-libs
        files:
          - url: git+https://github.com/static-web-server/static-web-server.git#v2.44.1
            checksum: c5cbe67e91da91ccad838163cf9a034bf221a447
            path: ${source.dir}/static-web-server
            spdx:
              name: static-web-server
              version: 2.44.1
              packages:
                - name: static-web-server
                  purl: pkg:cargo/static-web-server@2.44.1
                  license: MIT OR Apache-2.0
            uid: 0
            gid: 0
      pipeline:
        - name: cargo sbom
          uses: sbom@v1
          with:
            extra-scanners: rust-cargo-lock-cataloger
            prefix: static-web-server-cargo
            source: ${source.dir}/static-web-server
        - name: build
          privileged: true
          environment:
            RUSTFLAGS: --cfg tokio_unstable -C target-feature=-crt-static
          runs: |
            set -eux -o pipefail

            cargo build --bin static-web-server --release --locked --features=all --target-dir "${target.dir}"
            grep -A1 '^name = "zstd-sys"$' Cargo.lock | grep -qx 'version = "2.1.0+zstd.1.5.7"'
            grep -A1 '^name = "libmimalloc-sys"$' Cargo.lock | grep -qx 'version = "0.1.49"'
            install -D -m 755 "${target.dir}/release/static-web-server" "${target.dir}/usr/bin/static-web-server"
            install -D -m 644 LICENSE-MIT "${target.dir}/usr/share/static-web-server/LICENSE-MIT"
            install -D -m 644 LICENSE-APACHE "${target.dir}/usr/share/static-web-server/LICENSE-APACHE"
            needed=$(readelf -d "${target.dir}/usr/bin/static-web-server")
            printf '%s\n' "$needed"
            case "$needed" in
              *'libc.musl'*) ;;
              *)
                echo "alpine binary is not linked to musl" >&2
                exit 1
                ;;
            esac
            case "$needed" in
              *'libc.so.6'*)
                echo "alpine binary is linked to glibc" >&2
                exit 1
                ;;
            esac
        - uses: spdx@v1
          with:
            license: BSD-3-Clause OR GPL-2.0-only
            name: zstd
            purl: pkg:github/facebook/zstd@v1.5.7
            version: v1.5.7
        - uses: spdx@v1
          with:
            license: MIT
            name: mimalloc
            purl: pkg:github/microsoft/mimalloc@v3.3.2
            version: v3.3.2
        - name: install sbom
          runs: |
            set -eux -o pipefail

            install -d "${target.dir}/opt/docker/sbom"
            cp -a /opt/docker/sbom/static-web-server-cargo /opt/docker/sbom/zstd /opt/docker/sbom/mimalloc "${target.dir}/opt/docker/sbom/"
        - uses: dhi/build-pkg:0
          with:
            depends:
              - libgcc
              - musl
            description: High-performance asynchronous web server for static files
            files:
              - usr/bin/static-web-server
              - usr/share/static-web-server
              - opt/docker/sbom/static-web-server-cargo
              - opt/docker/sbom/zstd
              - opt/docker/sbom/mimalloc
            formats:
              - apk
            license: MIT OR Apache-2.0
            name: static-web-server-2
            rel: 0
            url: https://static-web-server.net
            version: 2.44.1
os-release:
  name: Docker Hardened Images (Alpine)
  id: alpine
  version-id: "3.24"
  pretty-name: Docker Hardened Images/Alpine Linux v3.24
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
