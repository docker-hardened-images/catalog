# syntax=dhi.io/build:2-debian13

image: dhi.io/pkg-forklift-virt-v2v
variant: runtime
tags:
  - 2.12.7
  - 2.12.7-r1
  - 2.12.7-debian13
  - 2.12.7-r1-debian13
platforms:
  - linux/amd64
  - linux/arm64
dates:
  release: "2026-08-24"
vars:
  COMMIT_SHA: a8fd1bf54505dd27e10282423ceb5e05a5c8354c
  GOLANG_VERSION: 1.26.8-0
  REL: "1"
  SEMVER_MAJOR_MINOR_VERSION: "2.12"
  SEMVER_MAJOR_VERSION: "2"
  SEMVER_VERSION: 2.12.7
  VERSION: 2.12.7
contents:
  packages:
    - base-files
  builds:
    - name: forklift-virt-v2v
      work-dir: /go/src/github.com/kubev2v/forklift
      contents:
        repositories:
          - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
        keyring:
          - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
        packages:
          - bash
          - ca-certificates
          - coreutils
          - findutils
          - gcc
          - libc6-dev
          - mawk
          - sed
          - golang-1.26=1.26.8-0
          - golang-1.26-oci-config=1.26.8-0
          - libvirt-dev
          - pkgconf
        files:
          - url: git+https://github.com/kubev2v/forklift.git#v2.12.7
            checksum: a8fd1bf54505dd27e10282423ceb5e05a5c8354c
            path: /go/src/github.com/kubev2v/forklift
            spdx:
              name: forklift
              version: 2.12.7
              packages:
                - name: forklift
                  purl: pkg:golang/github.com/kubev2v/forklift@2.12.7
                  license: Apache-2.0
            uid: 0
            gid: 0
      pipeline:
        - name: update go dependencies
          uses: go/bump@v2
          with:
            deps:
              - golang.org/x/net@v0.56.0
              - golang.org/x/oauth2@v0.27.0
              - golang.org/x/text@v0.39.0
            download: true
        - uses: go/hermetic@v1
        - name: build virt-v2v-wrapper
          uses: go/build@v1
          environment:
            GOFLAGS: -buildvcs=false
          with:
            cgo_enabled: 1
            fips: false
            output: ${target.dir}/usr/bin/virt-v2v-wrapper
            packages: ./cmd/virt-v2v
        - name: build virt-v2v-wrapper dev
          uses: go/build@v1
          environment:
            GOFLAGS: -buildvcs=false
          with:
            cgo_enabled: 1
            fips: false
            output: ${target.dir}/usr/bin/virt-v2v-wrapper-dev
            packages: ./cmd/virt-v2v
            strip: false
        - name: build virt-v2v-monitor
          uses: go/build@v1
          environment:
            GOFLAGS: -buildvcs=false
          with:
            fips: false
            output: ${target.dir}/usr/bin/virt-v2v-monitor
            packages: ./cmd/virt-v2v-monitor
        - name: build virt-v2v-monitor dev
          uses: go/build@v1
          environment:
            GOFLAGS: -buildvcs=false
          with:
            fips: false
            output: ${target.dir}/usr/bin/virt-v2v-monitor-dev
            packages: ./cmd/virt-v2v-monitor
            strip: false
        - name: build image-converter
          uses: go/build@v1
          environment:
            GOFLAGS: -buildvcs=false
          with:
            fips: false
            output: ${target.dir}/usr/bin/image-converter
            packages: ./cmd/image-converter
        - name: build image-converter dev
          uses: go/build@v1
          environment:
            GOFLAGS: -buildvcs=false
          with:
            fips: false
            output: ${target.dir}/usr/bin/image-converter-dev
            packages: ./cmd/image-converter
            strip: false
        - name: build forklift-wait-for-reboot
          uses: go/build@v1
          environment:
            GOFLAGS: -buildvcs=false
          with:
            fips: false
            output: ${target.dir}/usr/bin/forklift-wait-for-reboot
            packages: ./cmd/forklift-wait-for-reboot
        - name: build forklift-wait-for-reboot dev
          uses: go/build@v1
          environment:
            GOFLAGS: -buildvcs=false
          with:
            fips: false
            output: ${target.dir}/usr/bin/forklift-wait-for-reboot-dev
            packages: ./cmd/forklift-wait-for-reboot
            strip: false
        - uses: dhi/build-pkg:0
          with:
            depends:
              - libc6
              - libvirt0
            description: Forklift virt-v2v Go helper binaries for VM guest conversion
            files:
              - usr/bin/virt-v2v-wrapper
            formats:
              - deb
            license: Apache-2.0
            name: forklift-virt-v2v
            priority: optional
            rel: 1
            section: admin
            subpackages:
              - files:
                  - path: usr/bin/virt-v2v-monitor
                name: virt-v2v-monitor
              - files:
                  - path: usr/bin/image-converter
                name: forklift-image-converter
              - files:
                  - path: usr/bin/forklift-wait-for-reboot
                name: forklift-wait-for-reboot
              - depends:
                  - libc6
                  - libvirt0
                files:
                  - path: usr/bin/virt-v2v-wrapper
                    source: usr/bin/virt-v2v-wrapper-dev
                name: forklift-virt-v2v-dev
              - files:
                  - path: usr/bin/virt-v2v-monitor
                    source: usr/bin/virt-v2v-monitor-dev
                name: virt-v2v-monitor-dev
              - files:
                  - path: usr/bin/image-converter
                    source: usr/bin/image-converter-dev
                name: forklift-image-converter-dev
              - files:
                  - path: usr/bin/forklift-wait-for-reboot
                    source: usr/bin/forklift-wait-for-reboot-dev
                name: forklift-wait-for-reboot-dev
            url: https://github.com/kubev2v/forklift
            version: 2.12.7
os-release:
  name: Docker Hardened Images (Debian)
  id: debian
  version-id: "13"
  version-codename: trixie
  pretty-name: Docker Hardened Images/Debian GNU/Linux 13 (trixie)
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
