# syntax=dhi.io/build:2-debian13

image: dhi.io/pkg-forklift-virt-v2v
variant: runtime
tags:
  - 2.12.11
  - 2.12.11-r0
  - 2.12.11-debian13
  - 2.12.11-r0-debian13
platforms:
  - linux/amd64
  - linux/arm64
dates:
  release: "2026-08-24"
vars:
  APPLIANCE_REL: "0"
  COMMIT_SHA: d163134c5f849c26de6f91fd000fdec514ac8051
  GOLANG_VERSION: 1.26.11-18
  KERNEL_IMAGE_PKG: '#{ target.arch == "amd64" ? "linux-image-amd64" : "linux-image-arm64" }'
  LIBGUESTFS_VERSION: 1:1.54.1-2+deb13u1+dhi0
  QEMU_SYSTEM_PKG: '#{ target.arch == "amd64" ? "qemu-system-x86" : "qemu-system-arm" }'
  REL: "0"
  SEMVER_MAJOR_MINOR_VERSION: "2.12"
  SEMVER_MAJOR_VERSION: "2"
  SEMVER_VERSION: 2.12.11
  VERSION: 2.12.11
contents:
  repositories:
    - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
  keyring:
    - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
  packages:
    - base-files
  builds:
    - name: libguestfs-fixed-appliance
      contents:
        repositories:
          - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
        keyring:
          - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
        packages:
          - base-files
          - bash
          - coreutils
          - grep
          - gzip
          - kmod
          - util-linux
          - qemu-utils
          - guestfish=1:1.54.1-2+deb13u1+dhi0
          - libguestfs-tools=1:1.54.1-2+deb13u1+dhi0
          - guestfsd=1:1.54.1-2+deb13u1+dhi0
          - libguestfs-xfs=1:1.54.1-2+deb13u1+dhi0
          - supermin
          - ${QEMU_SYSTEM_PKG}
          - ${KERNEL_IMAGE_PKG}
          - libacl1
          - libaugeas0
          - libc6
          - libcap2
          - libconfig11
          - libcrypt1
          - libglib2.0-0t64
          - libguestfs-perl
          - libguestfs0t64
          - libhivex0
          - libintl-perl
          - libjansson4
          - liblzma5
          - libnbd-bin
          - libnbd0
          - libosinfo-1.0-0
          - libpcre2-8-0
          - libreadline8t64
          - librpm10
          - libselinux1
          - libstring-shellquote-perl
          - libsys-virt-perl
          - libsystemd0
          - libtinfo6
          - libtirpc3t64
          - libtsk19t64
          - libwin-hivex-perl
          - libxml2
          - libyara10
          - nbdkit
          - perl
          - binutils
          - bsdextrautils
          - cpio
          - diffutils
          - dosfstools
          - file
          - iproute2
          - lsof
          - net-tools
          - ntfs-3g
          - parted
          - procps
          - scrub
          - strace
          - udev
          - xfsprogs
          - zerofree
      pipeline:
        - name: build fixed libguestfs appliance
          privileged: true
          runs: |
            set -eux -o pipefail

            export LIBGUESTFS_BACKEND_SETTINGS=force_tcg

            depmod "$(basename /usr/lib/modules/*)"

            cp /usr/sbin/xfs_repair /usr/sbin/xfs_repair.original
            cat > /usr/sbin/xfs_repair << 'EOF'
            #!/bin/bash
            if grep -q 'xfs_repair_ignore=1' /proc/cmdline 2>/dev/null; then
                echo "xfs_repair wrapper: xfs_repair_ignore=1 detected, failures will be suppressed" >&2
                /usr/sbin/xfs_repair.original "$@"
                rc=$?
                echo "xfs_repair wrapper: xfs_repair.original exited with status $rc (ignored)" >&2
                exit 0
            fi
            exec /usr/sbin/xfs_repair.original "$@"
            EOF
            chmod 755 /usr/sbin/xfs_repair

            hostfiles=$(echo /usr/lib/*/guestfs/supermin.d/hostfiles)
            test -f "$hostfiles"
            echo '/usr/sbin/xfs_repair.original' >> "$hostfiles"

            mkdir -p ${target.dir}/usr/lib/guestfs/appliance
            cd ${target.dir}/usr/lib/guestfs/appliance
            LIBGUESTFS_BACKEND=direct libguestfs-make-fixed-appliance .
        - uses: dhi/build-pkg:0
          with:
            description: Pre-built libguestfs fixed appliance for Forklift virt-v2v
            files:
              - usr/lib/guestfs/appliance
            license: Apache-2.0
            name: forklift-libguestfs-appliance
            priority: optional
            rel: 0
            section: admin
            url: https://github.com/kubev2v/forklift
            version: 2.12.11
    - name: forklift-virt-v2v
      work-dir: /go/src/github.com/kubev2v/forklift
      contents:
        repositories:
          - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
        keyring:
          - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
        packages:
          - bash
          - ca-certificates
          - coreutils
          - findutils
          - gcc
          - libc6-dev
          - mawk
          - sed
          - golang-1.26=1.26.11-18
          - golang-1.26-oci-config=1.26.11-18
          - libvirt-dev
          - pkgconf
        files:
          - url: git+https://github.com/kubev2v/forklift.git#v2.12.11
            checksum: d163134c5f849c26de6f91fd000fdec514ac8051
            path: /go/src/github.com/kubev2v/forklift
            spdx:
              name: forklift
              version: 2.12.11
              packages:
                - name: forklift
                  purl: pkg:golang/github.com/kubev2v/forklift@2.12.11
                  license: Apache-2.0
            uid: 0
            gid: 0
      pipeline:
        - name: update go dependencies
          uses: go/bump@v2
          with:
            deps:
              - golang.org/x/net@v0.62.0
              - golang.org/x/oauth2@v0.27.0
              - github.com/gorilla/websocket@v1.5.4-0.20240701034025-d67f41855da4
            download: true
        - uses: go/hermetic@v1
        - name: build virt-v2v-wrapper
          uses: go/build@v1
          environment:
            GOFLAGS: -buildvcs=false
          with:
            cgo_enabled: 1
            fips: false
            output: ${target.dir}/usr/bin/virt-v2v-wrapper
            packages: ./cmd/virt-v2v
        - name: build virt-v2v-wrapper dev
          uses: go/build@v1
          environment:
            GOFLAGS: -buildvcs=false
          with:
            cgo_enabled: 1
            fips: false
            output: ${target.dir}/usr/bin/virt-v2v-wrapper-dev
            packages: ./cmd/virt-v2v
            strip: false
        - name: build virt-v2v-monitor
          uses: go/build@v1
          environment:
            GOFLAGS: -buildvcs=false
          with:
            fips: false
            output: ${target.dir}/usr/bin/virt-v2v-monitor
            packages: ./cmd/virt-v2v-monitor
        - name: build virt-v2v-monitor dev
          uses: go/build@v1
          environment:
            GOFLAGS: -buildvcs=false
          with:
            fips: false
            output: ${target.dir}/usr/bin/virt-v2v-monitor-dev
            packages: ./cmd/virt-v2v-monitor
            strip: false
        - name: build image-converter
          uses: go/build@v1
          environment:
            GOFLAGS: -buildvcs=false
          with:
            fips: false
            output: ${target.dir}/usr/bin/image-converter
            packages: ./cmd/image-converter
        - name: build image-converter dev
          uses: go/build@v1
          environment:
            GOFLAGS: -buildvcs=false
          with:
            fips: false
            output: ${target.dir}/usr/bin/image-converter-dev
            packages: ./cmd/image-converter
            strip: false
        - name: build forklift-wait-for-reboot
          uses: go/build@v1
          environment:
            GOFLAGS: -buildvcs=false
          with:
            fips: false
            output: ${target.dir}/usr/bin/forklift-wait-for-reboot
            packages: ./cmd/forklift-wait-for-reboot
        - name: build forklift-wait-for-reboot dev
          uses: go/build@v1
          environment:
            GOFLAGS: -buildvcs=false
          with:
            fips: false
            output: ${target.dir}/usr/bin/forklift-wait-for-reboot-dev
            packages: ./cmd/forklift-wait-for-reboot
            strip: false
        - uses: dhi/build-pkg:0
          with:
            depends:
              - libc6
              - libvirt0
            description: Forklift virt-v2v Go helper binaries for VM guest conversion
            files:
              - usr/bin/virt-v2v-wrapper
            formats:
              - deb
            license: Apache-2.0
            name: forklift-virt-v2v
            priority: optional
            rel: 0
            section: admin
            subpackages:
              - files:
                  - path: usr/bin/virt-v2v-monitor
                name: virt-v2v-monitor
              - files:
                  - path: usr/bin/image-converter
                name: forklift-image-converter
              - files:
                  - path: usr/bin/forklift-wait-for-reboot
                name: forklift-wait-for-reboot
              - depends:
                  - libc6
                  - libvirt0
                files:
                  - path: usr/bin/virt-v2v-wrapper
                    source: usr/bin/virt-v2v-wrapper-dev
                name: forklift-virt-v2v-dev
              - files:
                  - path: usr/bin/virt-v2v-monitor
                    source: usr/bin/virt-v2v-monitor-dev
                name: virt-v2v-monitor-dev
              - files:
                  - path: usr/bin/image-converter
                    source: usr/bin/image-converter-dev
                name: forklift-image-converter-dev
              - files:
                  - path: usr/bin/forklift-wait-for-reboot
                    source: usr/bin/forklift-wait-for-reboot-dev
                name: forklift-wait-for-reboot-dev
            url: https://github.com/kubev2v/forklift
            version: 2.12.11
os-release:
  name: Docker Hardened Images (Debian)
  id: debian
  version-id: "13"
  version-codename: trixie
  pretty-name: Docker Hardened Images/Debian GNU/Linux 13 (trixie)
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
