  - linux/arm64
dates:
  release: "2026-09-01"
vars:
  COMMIT_SHA: 3e516c6f382b481e815ec455befb2f14d80d337b
  JUPYTERHUB_WHEEL_CHECKSUM: sha256:8090a95f488bad3c35627f2ffdb8313802e8d418302f78babbc290b6500bfc43
  JUPYTERHUB_WHEEL_URL: https://files.pythonhosted.org/packages/90/86/57b26e8b7b32036a549e8698f00d199a3d82946f91a3c81a3bfb94b37cfd/jupyterhub-6.0.1-py3-none-any.whl
  PACKAGE_NAME: jupyterhub-6
  PYTHON_MINOR: "3.14"
  PYTHON_VERSION: 3.14.8-0
  REL: "0"
  SEMVER_MAJOR_MINOR_VERSION: "6.0"
  SEMVER_MAJOR_VERSION: "6"
  SEMVER_VERSION: 6.0.1
  VERSION: 6.0.1
contents:
  repositories:
    - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
  keyring:
    - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
  packages:
    - base-files
  builds:
    - name: jupyterhub
      work-dir: ${source.dir}/jupyterhub
      environment:
        PATH: /usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
      caches:
        - path: /root/.cache/pip
      contents:
        repositories:
          - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
        keyring:
          - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
        packages:
          - bash
          - build-essential
          - ca-certificates
          - coreutils
          - diffutils
          - findutils
          - gawk
          - git
          - grep
          - libffi-dev
          - libssl-dev
          - libstdc++6
          - python3-pip-whl
          - python3-setuptools-whl
          - sed
          - zlib1g-dev
          - libpython-3.14-minimal=3.14.8-0
          - libpython-3.14-stdlib=3.14.8-0
          - libpython-3.14=3.14.8-0
          - python-3.14-minimal=3.14.8-0
          - python-3.14=3.14.8-0
          - python-3.14-dev=3.14.8-0
        files:
          - url: git+https://github.com/jupyterhub/jupyterhub.git#6.0.1
            checksum: 3e516c6f382b481e815ec455befb2f14d80d337b
            path: ${source.dir}/jupyterhub
            spdx:
              name: jupyterhub
              version: 6.0.1
              packages:
                - name: jupyterhub
                  purl: pkg:pypi/jupyterhub@6.0.1
                  license: BSD-3-Clause
            uid: 0
            gid: 0
          - url: https://files.pythonhosted.org/packages/90/86/57b26e8b7b32036a549e8698f00d199a3d82946f91a3c81a3bfb94b37cfd/jupyterhub-6.0.1-py3-none-any.whl
            checksum: sha256:8090a95f488bad3c35627f2ffdb8313802e8d418302f78babbc290b6500bfc43
            path: ${source.dir}/jupyterhub-6.0.1-py3-none-any.whl
            uid: 0
            gid: 0
      pipeline:
        - name: create virtual environment
          runs: |
            set -eux -o pipefail

            mkdir -p "${target.dir}/usr/lib"
            /usr/bin/python3.14 -m venv "${target.dir}/usr/lib/jupyterhub"
        - name: install jupyterhub
          privileged: true
          runs: |
            set -eux -o pipefail

            VENV="${target.dir}/usr/lib/jupyterhub"
            "$VENV/bin/python3" -m pip install --no-cache-dir --no-deps --require-hashes \
              -r "${source.dir}/requirements-6.txt"
            "$VENV/bin/python3" -m pip install --no-cache-dir --no-deps --no-index \
              "${source.dir}/jupyterhub-6.0.1-py3-none-any.whl"
            "$VENV/bin/python3" -m pip check
            version="$("$VENV/bin/jupyterhub" --version)"
            if [ "$version" != "6.0.1" ]; then
              printf 'installed jupyterhub %s, expected %s\n' "$version" "6.0.1" >&2
              exit 1
            fi
            "$VENV/bin/python3" -m pip uninstall --yes pip setuptools wheel
        - name: clean python cache and tests
          runs: |
            set -eux -o pipefail

            VENV="${target.dir}/usr/lib/jupyterhub"
            find "$VENV" \
              \( -type d -a \( -name test -o -name tests -o -name __pycache__ \) \) \
              -o \( -type f -a \( -name '*.pyc' -o -name '*.pyo' \) \) \
              -exec rm -rf '{}' + || true
        - name: fix venv shebangs
          runs: |
            set -eux -o pipefail

            VENV="${target.dir}/usr/lib/jupyterhub"
            for f in "$VENV/bin"/*; do
              [ -f "$f" ] || continue
              read -r line < "$f" || true
              case "$line" in
                "#!${target.dir}"*) sed -i "1s|#!${target.dir}|#!|" "$f" ;;
              esac
            done
        - name: create usr/bin symlink
          runs: |
            set -eux -o pipefail

            mkdir -p "${target.dir}/usr/bin"
            ln -sf ../lib/jupyterhub/bin/jupyterhub "${target.dir}/usr/bin/jupyterhub"
        - uses: dhi/build-pkg:0
          with:
            depends:
              - python-3.14
            description: Multi-user server for Jupyter notebooks
            files:
              - usr/lib/jupyterhub
              - usr/bin/jupyterhub
            formats:
              - deb
            license: BSD-3-Clause
            name: jupyterhub-6
            rel: 0
            url: https://jupyterhub.readthedocs.io/
            version: 6.0.1
      paths:
        - type: file
          path: ${source.dir}/requirements-5.txt
          uid: 0
          gid: 0
          source: package/main/jupyterhub/requirements-5.txt
        - type: file
          path: ${source.dir}/requirements-6.txt
          uid: 0
          gid: 0
          source: package/main/jupyterhub/requirements-6.txt
