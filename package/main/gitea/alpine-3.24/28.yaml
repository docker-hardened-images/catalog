# syntax=dhi.io/build:2-alpine3.24

image: dhi.io/pkg-gitea
variant: runtime
tags:
  - 28.3.0-alpine3.24
  - 28.3.0-r2-alpine3.24
platforms:
  - linux/amd64
  - linux/arm64
dates:
  release: "2026-09-29"
vars:
  COMMIT_SHA: 4f5a3e13e5f3aca85d830e3a9024c893b0bbf1e1
  GO_BUILD_TAGS: bindata,timetzdata,sqlite,sqlite_unlock_notify
  GOLANG_MAJOR_MINOR_VERSION: "1.27"
  GOLANG_VERSION: 1.27.4-r0
  PACKAGE_NAME: gitea
  REL: "2"
  SEMVER_MAJOR_MINOR_VERSION: "28.3"
  SEMVER_MAJOR_VERSION: "28"
  SEMVER_VERSION: 28.3.0
  VERSION: 28.3.0
contents:
  repositories:
    - https://dhi.io/apk/alpine/v3.24/main
    - https://dhi.io/apk/alpine/v3.23/main
    - https://dl-cdn.alpinelinux.org/alpine/v3.24/main
    - https://dl-cdn.alpinelinux.org/alpine/v3.24/community
  keyring:
    - https://dhi.io/keyring/dhi-apk@docker-0F81AD7700D99184.rsa.pub
  packages:
    - alpine-baselayout-data
  builds:
    - name: gitea
      work-dir: /go/src/code.gitea.io/gitea
      contents:
        packages:
          - bash
          - build-base
          - ca-certificates-bundle
          - corepack
          - git
          - golang-1.27=1.27.4-r0
          - golang-1.27-oci-config=1.27.4-r0
          - nodejs-22
        files:
          - url: git+https://github.com/go-gitea/gitea.git#v28.3.0
            checksum: 4f5a3e13e5f3aca85d830e3a9024c893b0bbf1e1
            path: /go/src/code.gitea.io/gitea
            spdx:
              name: gitea
              version: 28.3.0
              packages:
                - name: gitea
                  purl: pkg:golang/code.gitea.io/gitea@v28.3.0
                  license: MIT
            uid: 0
            gid: 0
      pipeline:
        - name: update go dependencies (28.x)
          uses: go/bump@v2
          with:
            deps:
              - github.com/andybalholm/brotli@v1.2.7
              - github.com/go-chi/chi/v5@v5.4.0
              - github.com/go-git/go-git/v5@v5.19.3
              - github.com/klauspost/compress@v1.20.2
            download: true
        - name: go module sbom
          uses: sbom@v1
          with:
            extra-scanners: go-module-file-cataloger
            prefix: gitea-go
            source: /go/src/code.gitea.io/gitea
        - uses: go/hermetic@v1
        - name: test
          runs: |
            set -eux -o pipefail

            GITEA_I_AM_BEING_UNSAFE_RUNNING_AS_ROOT=true \
              go test ./modules/setting/... ./modules/util/...
        - name: build frontend (28.x)
          privileged: true
          runs: |
            set -eux -o pipefail

            if [ "$(printf '%s\n%s' "28.3.0" '28.999.999' | sort -V | tail -1)" != '28.999.999' ]; then
              echo "VERSION 28.3.0 exceeds reviewed baseline 28.x — re-validate pnpm-workspace.yaml overrides below"
              exit 1
            fi

            # Reviewed against gitea v28.3.0 lockfile (pnpm 12.6.0):
            # Upstream already ahead of several 1.27 floors (postcss 8.5.28, colord 2.10.0,
            # nanoid 3.3.18, katex 0.18.7, mermaid 12.0.0). Kept floors still below lock or
            # still required for transitive CVE coverage:
            #   form-data 4.0.6 (CVE-2026-12143; lock 4.0.5),
            #   dompurify 3.4.17 (GHSA set; lock 3.4.15),
            #   js-yaml 4.3.2 (CVE-2026-59869 / GHSA-5p4m-2wfm-xmqj / CVE-2026-84375; lock 4.2.0),
            #   fflate 0.8.3 (CVE-2026-45820; lock still has 0.8.2),
            #   postcss-selector-parser 7.1.6 (CVE-2026-9358, CVE-2026-104844; lock 7.1.5 / 6.1.2),
            #   seroval 1.6.11 (CVE-2026-116580–116584, CVE-2026-104846, CVE-2026-104845; lock 1.5.4),
            #   source-map-js 1.2.2 (CVE-2026-93749; lock 1.2.1),
            #   vite 8.3.3 (CVE-2026-112942, CVE-2026-112943, CVE-2026-112944, CVE-2026-112945,
            #     CVE-2026-112946, CVE-2026-112947; lock 8.3.0),
            #   lodash-es 4.18.0 (CVE-2026-4800, CVE-2026-2950; lock 4.17.23).
            node -e '
              const fs = require("fs");
              const path = "pnpm-workspace.yaml";
              let text = fs.readFileSync(path, "utf8");
              // Drop any prior top-level overrides block so retries stay idempotent.
              text = text.replace(/\noverrides:\n(?:[ \t]+.+\n)*/, "\n");
              const overrides = {
                "form-data": "4.0.6",
                "dompurify": "3.4.17",
                "js-yaml": "4.3.2",
                "fflate": "0.8.3",
                "postcss-selector-parser": "7.1.6",
                "seroval": "1.6.11",
                "source-map-js": "1.2.2",
                "vite": "8.3.3",
                "lodash-es": "4.18.0",
              };
              const yamlKey = (k) => (k.match(/[@:]/) ? JSON.stringify(k) : k);
              const block =
                "overrides:\n" +
                Object.entries(overrides)
                  .map(([k, v]) => "  " + yamlKey(k) + ": " + v)
                  .join("\n") +
                "\n";
              fs.writeFileSync(path, text.trimEnd() + "\n\n" + block);
            '

            corepack pnpm install --lockfile-only
            corepack pnpm install --frozen-lockfile
            corepack pnpm exec vite build
        - name: prune frontend dev dependencies
          privileged: true
          runs: |
            set -eux -o pipefail

            corepack pnpm prune --prod
        - name: frontend sbom
          uses: sbom@v1
          with:
            extra-scanners: javascript-package-cataloger
            prefix: gitea-frontend
            source: /go/src/code.gitea.io/gitea/node_modules
        - name: generate backend
          runs: |
            set -eux -o pipefail

            CC= GOOS= GOARCH= CGO_ENABLED=0 go generate -tags 'bindata,timetzdata,sqlite,sqlite_unlock_notify' ./...
        - name: build gitea
          uses: go/build@v1
          environment:
            GOFLAGS: -buildvcs=false
          with:
            cgo_enabled: 1
            fips: false
            ldflags:
              - -linkmode=external
              - -extldflags=-static
              - -X main.Version=28.3.0
            output: ${target.dir}/usr/bin/gitea
            packages: .
            tags: bindata,timetzdata,sqlite,sqlite_unlock_notify
        - name: build gitea dev
          uses: go/build@v1
          environment:
            GOFLAGS: -buildvcs=false
          with:
            cgo_enabled: 1
            fips: false
            ldflags:
              - -linkmode=external
              - -extldflags=-static
              - -X main.Version=28.3.0
            output: ${target.dir}/usr/bin/gitea-dev
            packages: .
            strip: false
            tags: bindata,timetzdata,sqlite,sqlite_unlock_notify
        - uses: dhi/build-pkg:0
          with:
            depends:
              - git
            description: Gitea, a painless self-hosted Git service
            files:
              - usr/bin/gitea
            license: MIT
            name: gitea
            rel: 2
            subpackages:
              - files:
                  - path: usr/bin/gitea
                    source: usr/bin/gitea-dev
                name: gitea-dev
            url: https://about.gitea.com/
            version: 28.3.0
os-release:
  name: Docker Hardened Images (Alpine)
  id: alpine
  version-id: "3.24"
  pretty-name: Docker Hardened Images/Alpine Linux v3.24
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
