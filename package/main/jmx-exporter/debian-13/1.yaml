# syntax=dhi.io/build:2-debian13

image: dhi.io/pkg-jmx-exporter
variant: runtime
tags:
  - 1.6.0
  - 1.6.0-r1
  - 1.6.0-debian13
  - 1.6.0-r1-debian13
platforms:
  - linux/amd64
  - linux/arm64
vars:
  COMMIT_SHA: 3a7e22607bf069cdb6c78f76553b5d3259a91bd2
  JDK_MAJOR_VERSION: "21"
  JDK_VERSION: 21.0.12.8-0
  MAVEN_VERSION: 3.9.16
  PACKAGE_HOME: /usr/share/jmx-exporter
  PACKAGE_NAME: jmx-exporter
  REL: "1"
  SEMVER_MAJOR_MINOR_VERSION: "1.6"
  SEMVER_MAJOR_VERSION: "1"
  SEMVER_VERSION: 1.6.0
  VERSION: 1.6.0
contents:
  packages:
    - base-files
  builds:
    - name: jmx-exporter
      work-dir: ${source.dir}/jmx-exporter
      environment:
        JAVA_HOME: /usr/lib/jvm/temurin-21
        MAVEN_HOME: /opt/java/apache-maven-3.9.16
      caches:
        - path: /root/.m2/repository
      contents:
        repositories:
          - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
        keyring:
          - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
        packages:
          - bash
          - ca-certificates
          - coreutils
          - findutils
          - git
          - gzip
          - sed
          - tar
          - xmlstarlet
          - eclipse-temurin-21-jdk=21.0.12.8-0
        files:
          - url: git+https://github.com/prometheus/jmx_exporter.git#1.6.0
            checksum: 3a7e22607bf069cdb6c78f76553b5d3259a91bd2
            path: ${source.dir}/jmx-exporter
            spdx:
              name: jmx-exporter
              version: 1.6.0
              packages:
                - name: jmx-exporter
                  purl: pkg:dhi/jmx-exporter@1.6.0
                  license: Apache-2.0
            uid: 0
            gid: 0
          - url: https://dlcdn.apache.org/maven/maven-3/3.9.16/binaries/apache-maven-3.9.16-bin.tar.gz
            path: ${source.dir}/maven/apache-maven-3.9.16-bin.tar.gz
            spdx:
              name: maven
              version: 3.9.16
              packages:
                - name: maven
                  purl: pkg:generic/apache-maven@3.9.16
                  license: Apache-2.0
            uid: 0
            gid: 0
      pipeline:
        - name: install maven
          runs: |
            set -eux -o pipefail

            mkdir -p /opt/java
            tar -xzf "${source.dir}/maven/apache-maven-3.9.16-bin.tar.gz" -C /opt/java

            mkdir -p /usr/local/bin
            find "/opt/java/apache-maven-3.9.16/bin" \( -type f -executable -o -type l \) | while read -r file; do
              filename=$(basename "$file")
              ln -sf "/opt/java/apache-maven-3.9.16/bin/$filename" "/usr/local/bin/$filename"
            done
        - uses: mvn/mirror@v1
        - name: use maven central when mirror credentials are absent
          secrets:
            - id: maven_user
              env: MAVEN_USER
              optional: true
            - id: maven_password
              env: MAVEN_PASSWORD
              optional: true
          runs: |
            set -eux -o pipefail

            if [ -z "${MAVEN_USER:-}" ] || [ -z "${MAVEN_PASSWORD:-}" ]; then
              rm -f /root/.m2/settings.xml
            fi
        - name: pin vulnerable dependency versions
          uses: mvn/patch@v1
          with:
            dependencies: ${source.dir}/patch/mvn-dependencies.json
            dependencies-key: dependencyManagement.dependencies
            mvn-root: ${source.dir}/jmx-exporter
        - name: patch prometheus otel agent embedded libraries
          privileged: true
          secrets:
            - id: maven_user
              env: MAVEN_USER
              optional: true
            - id: maven_password
              env: MAVEN_PASSWORD
              optional: true
          runs: |
            set -eux -o pipefail

            otel_api_version="1.62.0"
            otel_context_version="1.62.0"
            agent_version="1.7.0"

            patch_lib=$(mktemp -d)
            mvn -B dependency:copy \
              -Dartifact=io.opentelemetry:opentelemetry-api:${otel_api_version} \
              -DoutputDirectory="${patch_lib}"
            mvn -B dependency:copy \
              -Dartifact=io.opentelemetry:opentelemetry-context:${otel_context_version} \
              -DoutputDirectory="${patch_lib}"

            mvn -B dependency:get \
              -Dartifact=io.prometheus:prometheus-metrics-exporter-opentelemetry-otel-agent-resources:${agent_version}

            agent_jar="/root/.m2/repository/io/prometheus/prometheus-metrics-exporter-opentelemetry-otel-agent-resources/${agent_version}/prometheus-metrics-exporter-opentelemetry-otel-agent-resources-${agent_version}.jar"
            agent_dir=$(mktemp -d)
            (
              cd "${agent_dir}"
              jar xf "${agent_jar}"
              install -m 0644 "${patch_lib}/opentelemetry-api-${otel_api_version}.jar" \
                lib/opentelemetry-api-1.29.0.jar
              install -m 0644 "${patch_lib}/opentelemetry-context-${otel_context_version}.jar" \
                lib/opentelemetry-context-1.29.0.jar
              jar cf "${agent_jar}" .
            )
        - name: build
          privileged: true
          secrets:
            - id: maven_user
              env: MAVEN_USER
              optional: true
            - id: maven_password
              env: MAVEN_PASSWORD
              optional: true
          runs: |
            set -eux -o pipefail

            mvn -B versions:set -DnewVersion="1.6.0" -DprocessAllModules
            mvn -B clean package -Dmaven.test.skip=true -Dmaven.javadoc.skip=true
        - name: stage jars and examples
          runs: |
            set -eux -o pipefail

            dest="${target.dir}/usr/share/jmx-exporter"
            mkdir -p "$dest"
            cp "jmx_prometheus_javaagent/target/jmx_prometheus_javaagent-1.6.0.jar" \
              "$dest/jmx_prometheus_javaagent.jar"
            cp "jmx_prometheus_standalone/target/jmx_prometheus_standalone-1.6.0.jar" \
              "$dest/jmx_prometheus_standalone.jar"
            cp -a examples "$dest/"
        - name: copy jars for sbom
          privileged: true
          secrets:
            - id: maven_user
              env: MAVEN_USER
              optional: true
            - id: maven_password
              env: MAVEN_PASSWORD
              optional: true
          runs: |
            set -eux -o pipefail

            xmlstarlet ed -L -N m="http://maven.apache.org/POM/4.0.0" \
              -u "//m:dependency[m:groupId='org.apache.maven.plugins' and m:artifactId='maven-shade-plugin']/m:scope" \
              -v "test" pom.xml

            mvn install -pl collector,jmx_prometheus_common -Dmaven.test.skip=true

            mkdir -p "${source.dir}/jmx-exporter-deps"
            mvn dependency:copy-dependencies \
              -pl collector,jmx_prometheus_common,jmx_prometheus_javaagent,jmx_prometheus_standalone \
              -DincludeScope=runtime \
              -DoutputDirectory="${source.dir}/jmx-exporter-deps"

            find "${source.dir}/jmx-exporter-deps" -name 'opentelemetry-api-*.jar' -delete
            find "${source.dir}/jmx-exporter-deps" -name 'opentelemetry-context-*.jar' -delete
            mvn -B dependency:copy \
              -Dartifact=io.opentelemetry:opentelemetry-api:1.62.0 \
              -DoutputDirectory="${source.dir}/jmx-exporter-deps"
            mvn -B dependency:copy \
              -Dartifact=io.opentelemetry:opentelemetry-context:1.62.0 \
              -DoutputDirectory="${source.dir}/jmx-exporter-deps"
        - name: maven sbom
          uses: sbom@v1
          with:
            extra-scanners: java-archive-cataloger
            prefix: jmx-exporter-maven
            source: ${source.dir}/jmx-exporter-deps
        - uses: dhi/build-pkg:0
          with:
            depends:
              - eclipse-temurin-21-jre
            description: Prometheus JMX Exporter for exposing JMX metrics
            files:
              - usr/share/jmx-exporter
            formats:
              - deb
            license: Apache-2.0
            name: jmx-exporter
            rel: 1
            url: https://github.com/prometheus/jmx_exporter
            version: 1.6.0
      paths:
        - type: file
          path: ${source.dir}/patch/mvn-dependencies.json
          uid: 0
          gid: 0
          source: package/main/jmx-exporter/debian-13/patch/mvn-dependencies.json
os-release:
  name: Docker Hardened Images (Debian)
  id: debian
  version-id: "13"
  version-codename: trixie
  pretty-name: Docker Hardened Images/Debian GNU/Linux 13 (trixie)
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
