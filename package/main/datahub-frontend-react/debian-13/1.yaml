contents:
  packages:
    - base-files
  builds:
    - name: datahub-frontend-react
      work-dir: ${source.dir}/datahub
      environment:
        CI: "false"
        NODE_OPTIONS: --max-old-space-size=5120 --openssl-legacy-provider
      caches:
        - path: /root/.gradle/caches
        - path: /root/.gradle/wrapper
        - path: ${source.dir}/datahub/datahub-web-react/node_modules
      contents:
        repositories:
          - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
        keyring:
          - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
        packages:
          - bash
          - base-files
          - ca-certificates
          - ca-certificates-bundle
          - coreutils
          - curl
          - findutils
          - git
          - gnu-which
          - grep
          - libc6
          - libstdc++6
          - mawk
          - node-corepack
          - nodejs-24=24.20.0-0
          - npm
          - python3
          - sed
          - tar
          - yarn-classic
          - eclipse-temurin-21-jdk=21.0.12.8-0
          - gradle-8=8.14.5-1
        files:
          - url: git+https://github.com/datahub-project/datahub.git#v1.7.0.1
            checksum: e99431ec510d7a2001f815c6bf70913c493af76e
            path: ${source.dir}/datahub
            spdx:
              name: datahub-frontend-react
              version: 1.7.0.1
              packages:
                - name: datahub-frontend-react
                  purl: pkg:dhi/datahub-frontend-react@1.7.0.1
                  license: Apache-2.0
            uid: 0
            gid: 0
          - url: https://maven-central.storage-download.googleapis.com/maven2/com/fasterxml/jackson/core/jackson-core/2.21.6/jackson-core-2.21.6.jar
            checksum: sha256:36111c3a4372cd5c2be6f4ec44a050382487920f3fc38ca3015c9c1678bd7c56
            path: ${source.dir}/patch/deps/jackson-core-2.21.6.jar
            spdx:
              name: jackson-core
              version: 2.21.6
              packages:
                - name: jackson-core
                  purl: pkg:maven/com.fasterxml.jackson.core/jackson-core@2.21.6
                  license: Apache-2.0
            uid: 0
            gid: 0
          - url: https://maven-central.storage-download.googleapis.com/maven2/com/fasterxml/jackson/core/jackson-databind/2.21.6/jackson-databind-2.21.6.jar
            checksum: sha256:62134a98de12d0a421cd2f5b9854c8e63f10f524b0341e66cfd31a4326f6a329
            path: ${source.dir}/patch/deps/jackson-databind-2.21.6.jar
            spdx:
              name: jackson-databind
              version: 2.21.6
              packages:
                - name: jackson-databind
                  purl: pkg:maven/com.fasterxml.jackson.core/jackson-databind@2.21.6
                  license: Apache-2.0
            uid: 0
            gid: 0
          - url: https://maven-central.storage-download.googleapis.com/maven2/tools/jackson/core/jackson-core/3.1.6/jackson-core-3.1.6.jar
            checksum: sha256:d4938937b819b48f273a25929dc4fbc72ac03b0753c9c6398f54c3905caf7d0e
            path: ${source.dir}/patch/deps/tools-jackson-core-3.1.6.jar
            spdx:
              name: jackson-core
              version: 3.1.6
              packages:
                - name: jackson-core
                  purl: pkg:maven/tools.jackson.core/jackson-core@3.1.6
                  license: Apache-2.0
            uid: 0
            gid: 0
          - url: https://maven-central.storage-download.googleapis.com/maven2/tools/jackson/core/jackson-databind/3.1.6/jackson-databind-3.1.6.jar
            checksum: sha256:f0ff64eaa9f1c4bca9d720cd70c542297b0b19fc8ad08531bc55e36c8eab8e4b
            path: ${source.dir}/patch/deps/tools-jackson-databind-3.1.6.jar
            spdx:
              name: jackson-databind
              version: 3.1.6
              packages:
                - name: jackson-databind
                  purl: pkg:maven/tools.jackson.core/jackson-databind@3.1.6
                  license: Apache-2.0
            uid: 0
            gid: 0
      pipeline:
        - name: install gradle init scripts
          runs: |
            set -eux -o pipefail

            install -D -m 0644 \
              ${source.dir}/files/init.gradle \
              /root/.gradle/init.d/init.gradle
            install -D -m 0644 \
              ${source.dir}/patch/force-cve-deps.gradle \
              /root/.gradle/init.d/force-cve-deps.gradle
        - name: patch maven central for build cloud rate limits
          runs: |
            set -eux -o pipefail

            MIRROR='maven { url "https://maven-central.storage-download.googleapis.com/maven2/" }'
            PORTAL=$'maven {\\n    url "https://plugins.gradle.org/m2/"\\n    metadataSources { mavenPom(); artifact(); ignoreGradleMetadataRedirection() }\\n}'
            find . \( -name "*.gradle" -o -name "*.gradle.kts" \) -print0 \
              | xargs -0 sed -i \
                -e "s|mavenCentral()|${MIRROR}|g" \
                -e "s|gradlePluginPortal()|${PORTAL}|g"

            sed -i \
              -e 's|datahub.dependencies.maven.central=https://repo1.maven.org/maven2|datahub.dependencies.maven.central=https://maven-central.storage-download.googleapis.com/maven2|g' \
              -e 's|apacheMavenRepositoryUrl=https://repo1.maven.org/maven2|apacheMavenRepositoryUrl=https://maven-central.storage-download.googleapis.com/maven2|g' \
              gradle.properties
        - name: tweak upstream build
          runs: |
            set -eux -o pipefail

            sed -i \
              "s|enableBundleAnalysis: true|enableBundleAnalysis: false|" \
              datahub-web-react/vite.config.ts
            grep -q 'enableBundleAnalysis: false' datahub-web-react/vite.config.ts

            sed -i "s|ext.jacksonVersion = '2.21.5'|ext.jacksonVersion = '2.21.6'|" \
              build.gradle buildSrc/build.gradle
            grep -q "ext.jacksonVersion = '2.21.6'" build.gradle
            grep -q "ext.jacksonVersion = '2.21.6'" buildSrc/build.gradle

            sed -i \
              -e "s|at.yawk.lz4:lz4-java:1.10.1|at.yawk.lz4:lz4-java:1.11.1|g" \
              build.gradle
            if grep -q "ext.lz4JavaVersion = '1.11.1'" build.gradle; then
              :
            elif grep -q 'at.yawk.lz4:lz4-java:1.11.1' build.gradle; then
              :
            else
              echo "expected lz4-java 1.11.1 pin not found in build.gradle" >&2
              exit 1
            fi
            if grep -q 'at.yawk.lz4:lz4-java:1.10.1' build.gradle; then
              echo "lz4-java 1.10.1 pin still present after sed" >&2
              exit 1
            fi

            cat >> build.gradle << 'GRADLE'

            // ===== DHI CVE remediation: force minimum versions =====
            allprojects {
                configurations.configureEach {
                    resolutionStrategy.eachDependency { details ->
                        def req = details.requested
                        if (req.group == 'com.typesafe.akka' && req.name.startsWith('akka-')) {
                            if (req.name == 'akka-http_2.13' || req.name == 'akka-http-core_2.13' || req.name == 'akka-parsing_2.13') {
                                details.useVersion '10.5.3'
                                details.because 'DHI CVE remediation: CVE-2023-44487'
                            } else {
                                details.useVersion '2.7.0'
                                details.because 'DHI CVE remediation: Akka version alignment for akka-http 10.5.3'
                            }
                        }
                        if (req.group == 'tools.jackson.core') {
                            if (req.name == 'jackson-core') {
                                details.useVersion '3.1.4'
                                details.because 'DHI CVE remediation: GHSA-r7wm-3cxj-wff9'
                            } else if (req.name == 'jackson-databind') {
                                details.useVersion '3.1.6'
                                details.because 'DHI CVE remediation: CVE-2026-59888, CVE-2026-59889'
                            }
                        }
                        if (req.group == 'ch.qos.logback' && req.name.startsWith('logback-')) {
                            details.useVersion '1.5.35'
                            details.because 'DHI CVE remediation: CVE-2026-9828, CVE-2026-10532'
                        }
                        if (req.group == 'org.apache.logging.log4j'
                                && req.name.startsWith('log4j-')) {
                            details.useVersion '2.25.5'
                            details.because 'DHI CVE remediation: CVE-2026-49844'
                        }
                        if (req.group == 'org.apache.httpcomponents.core5'
                                && req.name.startsWith('httpcore5')) {
                            details.useVersion '5.4.3'
                            details.because 'DHI CVE remediation: CVE-2026-54399, CVE-2026-54428'
                        }
                        if (req.group == 'org.apache.httpcomponents.client5'
                                && req.name == 'httpclient5') {
                            details.useVersion '5.6.3'
                            details.because 'DHI CVE remediation: CVE-2026-64607'
                        }
                        if (req.group == 'io.netty'
                                && req.name.startsWith('netty-')
                                && !req.name.startsWith('netty-tcnative')) {
                            details.useVersion '4.2.17.Final'
                            details.because 'DHI CVE remediation: CVE-2026-59902, CVE-2026-59903'
                        }
                        if (req.group == 'org.springframework.boot') {
                            details.useVersion '4.0.7'
                            details.because 'DHI CVE remediation: CVE-2026-41001'
                        }
                    }
                }
            }
            GRADLE
        - name: build datahub-frontend stage
          privileged: true
          runs: |
            set -eux -o pipefail

            export GRADLE_HOME="/usr/share/java/gradle"
            export JAVA_HOME="/usr/lib/jvm/temurin-21"
            export PATH="${GRADLE_HOME}/bin:${JAVA_HOME}/bin:${PATH}"
            export JAVA_TOOL_OPTIONS="-Dfile.encoding=UTF-8"

            find /root/.gradle/caches -name '*.lock' -delete 2> /dev/null || true
            find /root/.gradle/caches/journal-* -mindepth 1 -maxdepth 1 \
              -name '*.lock' -delete 2> /dev/null || true

            ./gradlew --init-script ${source.dir}/files/init.gradle \
              --no-daemon \
              --no-watch-fs \
              --console=plain \
              --warning-mode=summary \
              --parallel \
              --max-workers=4 \
              --update-locks 'com.fasterxml.jackson.core:*,com.fasterxml.jackson.dataformat:*,com.fasterxml.jackson.datatype:*,com.fasterxml.jackson.module:*,com.fasterxml.jackson:*,tools.jackson.core:*,tools.jackson.dataformat:*,tools.jackson.datatype:*,tools.jackson.module:*,at.yawk.lz4:*,ch.qos.logback:*,com.typesafe.akka:*,io.netty:*,org.apache.httpcomponents.core5:*,org.apache.httpcomponents.client5:*,org.apache.logging.log4j:*,org.springframework.boot:*' \
              :datahub-frontend:stage \
              -x test \
              -x check
        - name: stage runtime files
          runs: |
            set -eux -o pipefail

            install -d -m 0755 "${target.dir}/usr/share/datahub-frontend-react"
            cp -a datahub-frontend/build/stage/main/. "${target.dir}/usr/share/datahub-frontend-react/"

            install -D -m 0644 \
              datahub-frontend/conf/mfe.config.dev.yaml \
              "${target.dir}/usr/share/datahub-frontend-react/conf/mfe.config.dev.yaml"
            install -D -m 0644 \
              datahub-frontend/conf/mfe.config.local.yaml \
              "${target.dir}/usr/share/datahub-frontend-react/conf/mfe.config.local.yaml"

            install -D -m 0644 \
              docker/monitoring/client-prometheus-config.yaml \
              "${target.dir}/usr/share/datahub-frontend-react/client-prometheus-config.yaml"

            install -D -m 0755 \
              "${source.dir}/files/start.sh" \
              "${target.dir}/usr/share/datahub-frontend-react/scripts/start.sh"
        - name: patch shaded and loose jackson copies
          runs: |
            set -eux -o pipefail

            LIB="${target.dir}/usr/share/datahub-frontend-react/lib"
            PATCH_DIR="${source.dir}/patch/deps"

            HZ_JAR="$(find "$LIB" -maxdepth 1 -type f -name 'hazelcast-[0-9]*.jar' | sort | head -1 || true)"
            if [ -n "$HZ_JAR" ]; then
              bash "${source.dir}/patch/patch-hazelcast-jackson-play.sh" "$HZ_JAR" "$PATCH_DIR"
            fi

            replace_loose_jar() {
              local old="$1"
              local new="$2"
              if [ -f "$LIB/$old" ]; then
                rm -f "$LIB/$old"
                cp "$PATCH_DIR/$new" "$LIB/$new"
              fi
            }

            replace_loose_jar jackson-core-2.21.2.jar jackson-core-2.21.6.jar
            replace_loose_jar jackson-databind-2.21.2.jar jackson-databind-2.21.6.jar
            replace_loose_jar jackson-core-3.1.2.jar tools-jackson-core-3.1.6.jar
            replace_loose_jar jackson-databind-3.1.2.jar tools-jackson-databind-3.1.6.jar
        - name: fetch otel javaagent
          privileged: true
          runs: |
            set -eux -o pipefail

            curl -fsSL -o /tmp/opentelemetry-javaagent.jar \
              "https://github.com/open-telemetry/opentelemetry-java-instrumentation/releases/download/v2.28.0/opentelemetry-javaagent.jar"
            echo "130606aed07f101458fe42b8f453ef3a2536f6bce8a7ae64f222f5688ada2500  /tmp/opentelemetry-javaagent.jar" | sha256sum -c -
            mv /tmp/opentelemetry-javaagent.jar \
              "${target.dir}/usr/share/datahub-frontend-react/lib/opentelemetry-javaagent.jar"
        - name: fetch jmx prometheus javaagent
          privileged: true
          runs: |
            set -eux -o pipefail

            jmx_path="io/prometheus/jmx/jmx_prometheus_javaagent/0.20.0/jmx_prometheus_javaagent-0.20.0.jar"
            curl -fsSL -o /tmp/jmx_prometheus_javaagent.jar \
              "https://maven-central.storage-download.googleapis.com/maven2/${jmx_path}"
            echo "8b67ed40485d475648c36d11d21464b484406f85faf912b3363f71a6a7861320  /tmp/jmx_prometheus_javaagent.jar" | sha256sum -c -
            mv /tmp/jmx_prometheus_javaagent.jar \
              "${target.dir}/usr/share/datahub-frontend-react/lib/jmx_prometheus_javaagent.jar"
        - name: opentelemetry-javaagent sbom
          uses: spdx@v1
          with:
            license: Apache-2.0
            name: opentelemetry-javaagent
            purl: pkg:maven/io.opentelemetry.javaagent/opentelemetry-javaagent@2.28.0
            version: 2.28.0
        - name: jmx_prometheus_javaagent sbom
          uses: spdx@v1
          with:
            license: Apache-2.0
            name: jmx_prometheus_javaagent
            purl: pkg:maven/io.prometheus.jmx/jmx_prometheus_javaagent@0.20.0
            version: 0.20.0
        - name: java sbom
          uses: sbom@v1
          with:
            extra-scanners: java-archive-cataloger
            prefix: datahub-frontend-react
            source: ${target.dir}/usr/share/datahub-frontend-react
        - uses: dhi/build-pkg:0
          with:
            depends:
              - bash
              - coreutils
              - findutils
              - grep
              - sed
            description: DataHub Frontend React Play application
            files:
              - usr/share/datahub-frontend-react
            formats:
              - deb
            license: Apache-2.0
            name: datahub-frontend-react
            rel: 0
            url: https://datahubproject.io/
            version: 1.7.0.1
      paths:
        - type: file
          path: ${source.dir}/files/start.sh
          uid: 0
          gid: 0
          source: package/main/datahub-frontend-react/files/start.sh
        - type: file
          path: ${source.dir}/files/init.gradle
          uid: 0
          gid: 0
          source: package/main/datahub-frontend-react/files/init.gradle
        - type: file
          path: ${source.dir}/patch/force-cve-deps.gradle
          uid: 0
          gid: 0
          source: package/main/datahub-frontend-react/patch/force-cve-deps.gradle
        - type: file
          path: ${source.dir}/patch/patch-hazelcast-jackson-play.sh
          uid: 0
          gid: 0
          mode: "0755"
          source: package/main/datahub-frontend-react/patch/patch-hazelcast-jackson-play.sh
