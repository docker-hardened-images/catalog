  - linux/arm64
dates:
  release: "2025-08-22"
vars:
  COMMIT_SHA: e99431ec510d7a2001f815c6bf70913c493af76e
  GRADLE_VERSION: 8.14.5-1
  JDK_MAJOR_VERSION: "21"
  JDK_VERSION: 21.0.12.8-0
  JMX_PROMETHEUS_SHA256: 8b67ed40485d475648c36d11d21464b484406f85faf912b3363f71a6a7861320
  JMX_PROMETHEUS_VERSION: 0.20.0
  NODEJS_VERSION: 24.20.0-0
  OTEL_JAVAAGENT_SHA256: 130606aed07f101458fe42b8f453ef3a2536f6bce8a7ae64f222f5688ada2500
  OTEL_JAVAAGENT_VERSION: 2.28.0
  PACKAGE_HOME: /usr/share/datahub-frontend-react
