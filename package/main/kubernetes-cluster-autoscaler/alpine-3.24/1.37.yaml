# syntax=dhi.io/build:2-alpine3.24

image: dhi.io/pkg-kubernetes-cluster-autoscaler
variant: runtime
tags:
  - 1.37.0-alpine3.24
  - 1.37.0-r2-alpine3.24
platforms:
  - linux/amd64
  - linux/arm64
vars:
  COMMIT_SHA: 186ce11da81c3e160381bd265382ec588ab2543b
  GOLANG_MAJOR_MINOR_VERSION: "1.26"
  GOLANG_VERSION: 1.26.11-r0
  PACKAGE_NAME: kubernetes-cluster-autoscaler-1.37
  REL: "2"
  SEMVER_MAJOR_MINOR_VERSION: "1.37"
  SEMVER_MAJOR_VERSION: "1"
  SEMVER_VERSION: 1.37.0
  VERSION: 1.37.0
contents:
  repositories:
    - https://dhi.io/apk/alpine/v3.24/main
    - https://dhi.io/apk/alpine/v3.23/main
    - https://dl-cdn.alpinelinux.org/alpine/v3.24/main
    - https://dl-cdn.alpinelinux.org/alpine/v3.24/community
  keyring:
    - https://dhi.io/keyring/dhi-apk@docker-0F81AD7700D99184.rsa.pub
  packages:
    - alpine-baselayout-data
  builds:
    - name: kubernetes-cluster-autoscaler-1.37
      work-dir: /go/src/k8s.io/autoscaler/cluster-autoscaler
      contents:
        packages:
          - busybox
          - bash
          - ca-certificates-bundle
          - coreutils
          - findutils
          - grep
          - mawk
          - sed
          - golang-1.26=1.26.11-r0
          - golang-1.26-oci-config=1.26.11-r0
        files:
          - url: git+https://github.com/kubernetes/autoscaler.git#cluster-autoscaler-1.37.0
            checksum: 186ce11da81c3e160381bd265382ec588ab2543b
            path: /go/src/k8s.io/autoscaler
            spdx:
              name: kubernetes-cluster-autoscaler
              version: 1.37.0
              packages:
                - name: kubernetes-cluster-autoscaler
                  purl: pkg:golang/k8s.io/autoscaler/cluster-autoscaler@1.37.0
                  license: Apache-2.0
            uid: 0
            gid: 0
      pipeline:
        - name: update go dependencies (1.37 only)
          uses: go/bump@v2
          with:
            deps:
              - golang.org/x/net@v0.62.0
              - github.com/google/cel-go@v0.30.0
              - github.com/klauspost/compress@v1.20.2
              - go.etcd.io/etcd/client/pkg/v3@v3.7.1
              - go.opentelemetry.io/otel/exporters/otlp/otlptrace/otlptracegrpc@v1.45.0
            download: true
        - uses: go/hermetic@v1
        - name: test
          runs: |
            set -eux -o pipefail

            EXCLUDES='/cloudprovider/|/simulator/dynamicresources/snapshot|/test/integration/controllers'
            PKGS=$(go list ./... | grep -v -E "${EXCLUDES}")
            CGO_ENABLED=0 go test -vet=off $PKGS
        - name: build
          uses: go/build@v1
          with:
            fips: false
            output: ${target.dir}/usr/bin/cluster-autoscaler
        - name: build dev
          uses: go/build@v1
          with:
            fips: false
            output: ${target.dir}/usr/bin/cluster-autoscaler-dev
            strip: false
        - uses: dhi/build-pkg:0
          with:
            description: Kubernetes Cluster Autoscaler
            files:
              - usr/bin/cluster-autoscaler
            license: Apache-2.0
            name: kubernetes-cluster-autoscaler-1.37
            rel: 2
            subpackages:
              - files:
                  - path: usr/bin/cluster-autoscaler
                    source: usr/bin/cluster-autoscaler-dev
                name: kubernetes-cluster-autoscaler-1.37-dev
            url: https://github.com/kubernetes/autoscaler/tree/master/cluster-autoscaler
            version: 1.37.0
