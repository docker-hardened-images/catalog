# syntax=dhi.io/build:2-debian13

image: dhi.io/pkg-fluent-bit
variant: runtime
tags:
  - 5.1.2
  - 5.1.2-r0
  - 5.1.2-debian13
  - 5.1.2-r0-debian13
platforms:
  - linux/amd64
  - linux/arm64
dates:
  release: "2026-03-24"
vars:
  COMMIT_SHA: 66910c10a4d7eafa810b84229cf2dcf7b0f26f97
  REL: "0"
  SEMVER_MAJOR_MINOR_VERSION: "5.1"
  SEMVER_MAJOR_VERSION: "5"
  SEMVER_VERSION: 5.1.2
  VERSION: 5.1.2
contents:
  repositories:
    - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
  keyring:
    - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
  packages:
    - base-files
  builds:
    - name: fluent-bit
      work-dir: ${source.dir}/fluent-bit
      contents:
        packages:
          - bash
          - coreutils
          - cmake
          - clang
          - build-essential
          - bison
          - flex
          - mawk
          - openssl
          - libssl-dev
          - libsystemd-dev
          - libyaml-dev
          - libpq-dev
          - pkg-config
          - sed
          - grep
        files:
          - url: git+https://github.com/fluent/fluent-bit#v5.1.2
            checksum: 66910c10a4d7eafa810b84229cf2dcf7b0f26f97
            path: ${source.dir}/fluent-bit
            spdx:
              name: fluent-bit
              version: 5.1.2
              packages:
                - name: fluent-bit
                  purl: pkg:dhi/fluent-bit@5.1.2
                  license: Apache-2.0
            uid: 0
            gid: 0
      pipeline:
        - name: prepare build directory
          work-dir: ${source.dir}/fluent-bit
          runs: |
            set -eux -o pipefail

            mkdir -p build
        - name: build
          work-dir: ${source.dir}/fluent-bit/build
          runs: |
            set -eux -o pipefail

            cmake -DFLB_SIMD=On \
              -DFLB_RELEASE=On \
              -DFLB_JEMALLOC=On \
              -DFLB_TLS=On \
              -DFLB_SHARED_LIB=Off \
              -DFLB_EXAMPLES=Off \
              -DFLB_HTTP_SERVER=On \
              -DFLB_IN_EXEC=Off \
              -DFLB_IN_SYSTEMD=On \
              -DFLB_OUT_KAFKA=On \
              -DFLB_OUT_PGSQL=On \
              -DFLB_LOG_NO_CONTROL_CHARS=On \
              -DFLB_CHUNK_TRACE=On \
              ..

            make -j"$(nproc)"
            install -D -m 0755 bin/fluent-bit "${target.dir}/usr/bin/fluent-bit"
        - name: stage configuration
          work-dir: ${source.dir}/fluent-bit
          runs: |
            set -eux -o pipefail

            mkdir -p "${target.dir}/etc/fluent-bit/conf"

            "${target.dir}/usr/bin/fluent-bit" -J > "${target.dir}/etc/fluent-bit/schema.json"

            cp conf/parsers.conf \
              conf/parsers_ambassador.conf \
              conf/parsers_java.conf \
              conf/parsers_extra.conf \
              conf/parsers_openstack.conf \
              conf/parsers_cinder.conf \
              conf/plugins.conf \
              "${target.dir}/etc/fluent-bit/"

            cp conf/fluent-bit.conf "${target.dir}/etc/fluent-bit/conf/"
        - name: strip fluent-bit binary
          runs: |
            set -eux -o pipefail

            strip -s "${target.dir}/usr/bin/fluent-bit"
        - uses: dhi/build-pkg:0
          with:
            depends:
              - libssl3t64
              - libstdc++6
              - libsystemd0
              - libyaml-0-2
              - libpq5
              - zlib1g
            description: Fluent Bit fast and lightweight log processor and forwarder
            files:
              - usr
              - etc
            formats:
              - deb
            license: Apache-2.0
            name: fluent-bit
            rel: 0
            url: https://fluentbit.io
            version: 5.1.2
os-release:
  name: Docker Hardened Images (Debian)
  id: debian
  version-id: "13"
  version-codename: trixie
  pretty-name: Docker Hardened Images/Debian GNU/Linux 13 (trixie)
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
