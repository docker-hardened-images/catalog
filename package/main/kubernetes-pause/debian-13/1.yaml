  SEMVER_MAJOR_VERSION: "3"
  SEMVER_VERSION: 3.10.2
  VERSION: 3.10.2
contents:
  packages:
    - base-files
  builds:
    - name: kubernetes-pause
      work-dir: ${source.dir}
      contents:
        packages:
          - bash
          - build-essential
          - coreutils
          - musl-tools
        files:
          - url: https://raw.githubusercontent.com/kubernetes/kubernetes/0f29094e5b73085e3802ecc1298ecae13866bfe6/build/pause/linux/pause.c
            checksum: sha256:14a3fe21ab5f8e62937a2b453e76f3b94b0d3c7c04c3d09bc37195f54c1695ea
            path: ${source.dir}/pause.c
            spdx:
              name: pause
              version: 3.10.2
              packages:
                - name: pause
                  purl: pkg:github/kubernetes/kubernetes@0f29094e5b73085e3802ecc1298ecae13866bfe6
                  license: Apache-2.0
            uid: 0
            gid: 0
      pipeline:
        - name: build pause
          runs: |
            set -eux -o pipefail

            mkdir -p "${target.dir}/usr/bin"

            musl-gcc \
              -Os \
              -Wall \
              -Werror \
              -static \
              -DVERSION=v3.10.2 \
              -o ${target.dir}/usr/bin/pause \
              ${source.dir}/pause.c

            strip ${target.dir}/usr/bin/pause
        - name: build pause dev
          runs: |
            set -eux -o pipefail

            mkdir -p "${target.dir}/usr/bin"

            musl-gcc \
              -Os \
              -Wall \
              -Werror \
              -static \
              -DVERSION=v3.10.2 \
              -o ${target.dir}/usr/bin/pause-dev \
              ${source.dir}/pause.c
        - uses: dhi/build-pkg:0
          with:
            description: Kubernetes pause container binary
            files:
              - usr/bin/pause
            formats:
              - deb
            license: Apache-2.0
            name: kubernetes-pause
            rel: 0
            subpackages:
              - files:
                  - path: usr/bin/pause
                    source: usr/bin/pause-dev
                name: kubernetes-pause-dev
            url: https://github.com/kubernetes/kubernetes/tree/master/build/pause
            version: 3.10.2
