            download: true
        - uses: go/hermetic@v1
        - name: build calico
          uses: go/build@v1
          work-dir: /go/src/github.com/projectcalico/calico
          with:
            fips: false
            ldflags:
              - -X github.com/projectcalico/calico/pkg/buildinfo.Version=3.33.0
              - -X github.com/projectcalico/calico/pkg/buildinfo.BuildDate=${SOURCE_DATE_EPOCH}
              - -X github.com/projectcalico/calico/pkg/buildinfo.GitRevision=fbaa371111636a37ecc82625fce8453064a7fff2
            output: ${target.dir}/usr/bin/calico
            packages: ./cmd/calico
        - name: build calico dev
          uses: go/build@v1
          work-dir: /go/src/github.com/projectcalico/calico
          with:
            fips: false
            ldflags:
              - -X github.com/projectcalico/calico/pkg/buildinfo.Version=3.33.0
              - -X github.com/projectcalico/calico/pkg/buildinfo.BuildDate=${SOURCE_DATE_EPOCH}
              - -X github.com/projectcalico/calico/pkg/buildinfo.GitRevision=fbaa371111636a37ecc82625fce8453064a7fff2
            output: ${target.dir}/usr/bin/calico-dev
            packages: ./cmd/calico
            strip: false
        - name: install config and licenses
          runs: |
            set -eux -o pipefail

            install -d "${target.dir}/etc/calico"
