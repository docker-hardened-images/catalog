                name: calico-3.33-dev
              - files:
                  - path: usr/bin/node-driver-registrar
                name: calico-node-driver-registrar-3.33
              - files:
                  - path: usr/bin/node-driver-registrar
                    source: usr/bin/node-driver-registrar-dev
                name: calico-node-driver-registrar-3.33-dev
            url: https://github.com/projectcalico/calico
            version: 3.33.0
      paths:
        - type: file
          path: /src/patch/marshall-json.patch
          uid: 0
          gid: 0
          source: package/main/calico/patch/marshall-json.patch
