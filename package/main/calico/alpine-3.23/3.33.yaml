        - name: build node-driver-registrar dev
          uses: go/build@v1
          work-dir: /go/src/github.com/kubernetes-csi/node-driver-registrar
          environment:
            GOFLAGS: -buildvcs=false
          with:
            fips: false
            ldflags:
              - -X main.version=3.33.0
            output: ${target.dir}/usr/bin/node-driver-registrar-dev
            packages: ./cmd/csi-node-driver-registrar
            strip: false
        - uses: dhi/build-pkg:0
          with:
            description: Calico component binaries from projectcalico/calico
            files:
              - usr/bin/calico
              - etc/calico/typha.cfg
              - licences/LICENSE
            license: Apache-2.0
            name: calico-3.33
            provides: calico=$pkg_full_version
            rel: 0
            replaces: calico
            subpackages:
              - files:
