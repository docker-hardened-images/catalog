# syntax=dhi.io/build:2-debian13

image: dhi.io/pkg-tomcat
variant: runtime
tags:
  - 9.0.123
  - 9.0.123-r2
  - 9.0.123-debian13
  - 9.0.123-r2-debian13
platforms:
  - linux/amd64
  - linux/arm64
dates:
  release: "2017-09-27"
vars:
  JDK_MAJOR_VERSION: "21"
  JDK_VERSION: 1:21.0.13+9-2
  PACKAGE_HOME: /usr/share/tomcat-9
  PACKAGE_NAME: tomcat-9
  REL: "2"
  SEMVER_MAJOR_MINOR_VERSION: "9.0"
  SEMVER_MAJOR_VERSION: "9"
  SEMVER_VERSION: 9.0.123
  VERSION: 9.0.123
contents:
  repositories:
    - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
  keyring:
    - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
  packages:
    - base-files
  builds:
    - name: tomcat-9
      work-dir: ${source.dir}/tomcat
      environment:
        JAVA_HOME: /usr/lib/jvm/temurin-21
      contents:
        packages:
          - ant
          - ant-optional
          - bash
          - coreutils
          - dpkg
          - dpkg-dev
          - eclipse-temurin-21-jdk=1:21.0.13+9-2
          - findutils
          - gcc
          - gpg
          - gpg-agent
          - grep
          - gzip
          - junit4
          - libc-bin
          - libapr1-dev
          - libhamcrest-java
          - libssl-dev
          - mawk
          - sed
        files:
          - url: https://repo1.maven.org/maven2/org/apache/tomcat/tomcat/9.0.123/tomcat-9.0.123.tar.gz.asc
            path: ${source.dir}/tomcat/signatures/tomcat.tar.gz.asc
            uid: 0
            gid: 0
          - url: https://repo1.maven.org/maven2/org/apache/tomcat/tomcat/9.0.123/tomcat-9.0.123.tar.gz
            checksum: https://repo1.maven.org/maven2/org/apache/tomcat/tomcat/9.0.123/tomcat-9.0.123.tar.gz.sha256
            path: ${source.dir}/tomcat/apache-tomcat-9.0.123.tar.gz
            spdx:
              name: tomcat
              version: 9.0.123
              packages:
                - name: tomcat
                  purl: pkg:dhi/tomcat@9.0.123
                  license: Apache-2.0
            uid: 0
            gid: 0
      pipeline:
        - name: verify
          uses: gpg/verify@v1
          with:
            file: ${source.dir}/tomcat/apache-tomcat-9.0.123.tar.gz
            key-filter:
              - A9C5DF4D22E99998D9875A5110C01C5A2F6059E7
              - 48F8E69F6390C9F25CFEDCD268248959359E722B
              - 5C3C5F3E314C866292F359A8F3AD5C94A67F707E
            keys: ${source.dir}/tomcat/key/9
            signature: ${source.dir}/tomcat/signatures/tomcat.tar.gz.asc
        - name: install
          runs: |
            set -eux -o pipefail

            home="${target.dir}/usr/share/tomcat-9"
            install -d "$home"
            cd "$home"
            tar -xf "${source.dir}/tomcat/apache-tomcat-9.0.123.tar.gz" --strip-components=1

            mkdir -p "${source.dir}/tomcat/native-build"
            tar -xf bin/tomcat-native.tar.gz -C "${source.dir}/tomcat/native-build" --strip-components=1

            export JAVA_HOME="/usr/lib/jvm/temurin-21"
            export CATALINA_HOME="$home"
            export TOMCAT_NATIVE_LIBDIR="$CATALINA_HOME/native-jni-lib"
            export LD_LIBRARY_PATH="${LD_LIBRARY_PATH:+$LD_LIBRARY_PATH:}$TOMCAT_NATIVE_LIBDIR"

            cd "${source.dir}/tomcat/native-build/native"
            gnuArch="$(dpkg-architecture --query DEB_BUILD_GNU_TYPE)"
            aprConfig="$(command -v apr-1-config)"
            ./configure \
              --build="$gnuArch" \
              --libdir="$TOMCAT_NATIVE_LIBDIR" \
              --prefix="$CATALINA_HOME" \
              --with-apr="$aprConfig" \
              --with-java-home="$JAVA_HOME"

            nproc="$(nproc)"
            make -j "$nproc"
            make install

            cd "$home"
            chmod -R +rX .
            rm -r webapps
            install -d logs temp work webapps conf/Catalina/localhost
            touch logs/.keep temp/.keep work/.keep webapps/.keep conf/Catalina/localhost/.keep
            rm native-jni-lib/*.a native-jni-lib/*.la
        - name: test
          work-dir: ${source.dir}/tomcat/native-build
          runs: |
            set -eux -o pipefail

            export JAVA_HOME="/usr/lib/jvm/temurin-21"
            home="${target.dir}/usr/share/tomcat-9"
            export CATALINA_HOME="$home"
            export TOMCAT_NATIVE_LIBDIR="$CATALINA_HOME/native-jni-lib"
            export LD_LIBRARY_PATH="${LD_LIBRARY_PATH:+$LD_LIBRARY_PATH:}$TOMCAT_NATIVE_LIBDIR"

            junit_jar="$(dpkg -L junit4 | grep '/junit.*\.jar$' | head -1)"
            hamcrest_jar="$(dpkg -L libhamcrest-java | grep 'hamcrest-core.*\.jar$' | head -1)"

            ant -Djava.library.path="$TOMCAT_NATIVE_LIBDIR" \
              -Djunit.jar="$junit_jar" \
              -Dhamcrest.jar="$hamcrest_jar" \
              test
        - uses: dhi/build-pkg:0
          with:
            depends:
              - bash
              - coreutils
              - libapr1t64
              - libssl3t64
            description: Apache Tomcat servlet container
            files:
              - usr/share/tomcat-9
            formats:
              - deb
            license: Apache-2.0
            name: tomcat-9
            rel: 2
            url: https://tomcat.apache.org/
            version: 9.0.123
        - name: set writable directory modes
          runs: |
            set -eux -o pipefail

            arch="$(dpkg --print-architecture)"
            deb="${target.dir}/packages/deb/13/tomcat-9_9.0.123-2_${arch}.deb"
            work="$(mktemp -d)"
            trap 'rm -rf "${work}"' EXIT

            dpkg-deb -R "${deb}" "${work}"
            chmod 1777 \
              "${work}/usr/share/tomcat-9/logs" \
              "${work}/usr/share/tomcat-9/temp" \
              "${work}/usr/share/tomcat-9/work" \
              "${work}/usr/share/tomcat-9/webapps" \
              "${work}/usr/share/tomcat-9/conf/Catalina/localhost"
            dpkg-deb -Zgzip -b "${work}" "${deb}"
      paths:
        - type: file
          path: ${source.dir}/tomcat/key/9
          uid: 0
          gid: 0
          source: package/main/tomcat/key/9
os-release:
  name: Docker Hardened Images (Debian)
  id: debian
  version-id: "13"
  version-codename: trixie
  pretty-name: Docker Hardened Images/Debian GNU/Linux 13 (trixie)
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
