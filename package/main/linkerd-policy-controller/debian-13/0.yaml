# syntax=dhi.io/build:2-debian13

image: dhi.io/pkg-linkerd-policy-controller
variant: runtime
tags:
  - 26.10.3
  - 26.10.3-r0
  - 26.10.3-debian13
  - 26.10.3-r0-debian13
platforms:
  - linux/amd64
  - linux/arm64
vars:
  AWS_LC_FIPS_VERSION: 4.2.0
  AWS_LC_VERSION: 5.5.0
  CARGO_VERSION: 1.97.1-0
  COMMIT_SHA: 1408ae4afa76154be420001e99de13de594bad5e
  GOLANG_VERSION: 1.26.10-0
  JEMALLOC_VERSION: 5.3.0
  PACKAGE_NAME: linkerd-policy-controller
  REL: "0"
  RUSTC_VERSION: 1.97.1-0
  SEMVER_MAJOR_MINOR_VERSION: "26.10"
  SEMVER_MAJOR_VERSION: "26"
  SEMVER_VERSION: 26.10.3
  VERSION: 26.10.3
contents:
  repositories:
    - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
  keyring:
    - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
  packages:
    - base-files
  builds:
    - name: linkerd-policy-controller
      work-dir: ${source.dir}/linkerd2
      caches:
        - path: /root/.cargo
      contents:
        packages:
          - bash
          - binutils
          - build-essential
          - ca-certificates-bundle
          - cargo-1.97=1.97.1-0
          - cargo-auditable
          - clang
          - cmake
          - coreutils
          - findutils
          - gawk
          - git
          - golang-1.26=1.26.10-0
          - grep
          - libcurl4t64
          - libgcc-s1
          - libsqlite3-0
          - libssl3t64
          - mawk
          - perl
          - pkg-config
          - protobuf-compiler
          - rustc-1.97=1.97.1-0
          - sed
          - zlib1g
        files:
          - url: git+https://github.com/linkerd/linkerd2.git#edge-26.10.3
            checksum: 1408ae4afa76154be420001e99de13de594bad5e
            path: ${source.dir}/linkerd2
            spdx:
              name: linkerd2
              version: 26.10.3
              packages:
                - name: linkerd2
                  purl: pkg:github/linkerd/linkerd2@26.10.3
                  license: Apache-2.0
            uid: 0
            gid: 0
      pipeline:
        - name: update cargo dependencies
          privileged: true
          runs: |
            set -eux -o pipefail

            raise_to() {
              spec=$(cargo pkgid "$1@${2%.*}" 2> /dev/null) || return 0
              locked=${spec##*[#@]}
              if [ "$locked" != "$2" ] && [ "$(printf '%s\n%s\n' "$locked" "$2" | sort -V | head -n 1)" = "$locked" ]; then
                cargo update -p "$1@$locked" --precise "$2"
              fi
            }

            raise_to rustls 0.23.46
            raise_to rustls-webpki 0.103.16
            raise_to tokio 1.53.3
        - name: drop policy-test from the workspace
          privileged: true
          runs: |
            set -eux -o pipefail

            sed -i '/^    "policy-test",$/d' Cargo.toml
            if grep -q '"policy-test"' Cargo.toml; then exit 1; fi
            cargo metadata --format-version 1 > /dev/null
        - name: scope lockfile to the shipped crates
          privileged: true
          environment:
            RUSTFLAGS: --cfg tokio_unstable
          runs: |
            set -eux -o pipefail

            scope="${source.dir}/policy-controller-sbom"
            mkdir -p "$scope"
            rust_target=$(rustc -vV | sed -n 's/^host: //p')
            cargo tree --locked --package linkerd-policy-controller  \
              --target "$rust_target" --edges normal --prefix none --format '{p}' \
              | awk '{ print $1, substr($2, 2) }' | sort -u > "$scope/shipped.txt"
            awk 'NR == FNR { keep[$1 " " $2]; next }
              /^\[\[package\]\]$/ { if (block != "" && (name " " version) in keep) printf "%s", block; block = ""; in_package = 1 }
              !in_package { print; next }
              /^name = / { name = $3; gsub(/"/, "", name) }
              /^version = / { version = $3; gsub(/"/, "", version) }
              { block = block $0 ORS }
              END { if ((name " " version) in keep) printf "%s", block }' "$scope/shipped.txt" Cargo.lock > "$scope/Cargo.lock"
            rm "$scope/shipped.txt"
        - name: cargo sbom
          uses: sbom@v1
          with:
            extra-scanners: rust-cargo-lock-cataloger
            prefix: linkerd-policy-controller-cargo
            source: ${source.dir}/policy-controller-sbom
        - name: build
          privileged: true
          environment:
            CARGO_PROFILE_RELEASE_DEBUG: "0"
            PROTOC_NO_VENDOR: "1"
            RUSTFLAGS: --cfg tokio_unstable
          runs: "set -eux -o pipefail\n\ncargo auditable build --release --locked --package linkerd-policy-controller \ninstall -D -m 755 target/release/linkerd-policy-controller \"${target.dir}/usr/bin/linkerd-policy-controller-dev\"\ninstall -D -m 755 target/release/linkerd-policy-controller \"${target.dir}/usr/bin/linkerd-policy-controller\"\nstrip --strip-unneeded \"${target.dir}/usr/bin/linkerd-policy-controller\"\n"
        - name: verify bundled library versions
          privileged: true
          runs: |
            set -eux -o pipefail

            if [ "false" = true ]; then
              grep -aqF "AWS-LC FIPS 4.2.0" target/release/linkerd-policy-controller
            else
              grep -qF "AWSLC_VERSION_NUMBER_STRING \"5.5.0\"" \
                /root/.cargo/registry/src/*/aws-lc-sys-$(cargo pkgid aws-lc-sys | sed 's/.*[#@]//')/aws-lc/include/openssl/base.h
            fi
        - uses: spdx@v1
          with:
            license: Apache-2.0 AND BSD-3-Clause AND ISC AND MIT
            name: aws-lc
            purl: pkg:github/aws/aws-lc@v5.5.0
            version: 5.5.0
        - name: verify jemalloc version
          if: '#{ target.arch == "unknown" ? nil : target.arch == "amd64" }'
          privileged: true
          runs: |
            set -eux -o pipefail

            cargo pkgid jemalloc-sys | grep -qF "+5.3.0-"
        - if: '#{ target.arch == "unknown" ? nil : target.arch == "amd64" }'
          uses: spdx@v1
          with:
            license: BSD-2-Clause
            name: jemalloc
            purl: pkg:github/jemalloc/jemalloc@5.3.0
            version: 5.3.0
        - uses: dhi/build-pkg:0
          with:
            depends:
              - libc6
              - libgcc-s1
            description: Linkerd2 control plane policy controller
            files:
              - usr/bin/linkerd-policy-controller
            formats:
              - deb
            license: Apache-2.0
            name: linkerd-policy-controller
            rel: 0
            subpackages:
              - depends:
                  - libc6
                  - libgcc-s1
                files:
                  - path: usr/bin/linkerd-policy-controller
                    source: usr/bin/linkerd-policy-controller-dev
                name: linkerd-policy-controller-dev
            url: https://github.com/linkerd/linkerd2
            version: 26.10.3
      paths:
        - type: file
          path: ${source.dir}/patch/dhi-build-fips-feature.patch
          uid: 0
          gid: 0
          source: package/main/linkerd-policy-controller/patch/dhi-build-fips-feature.patch
os-release:
  name: Docker Hardened Images (Debian)
  id: debian
  version-id: "13"
  version-codename: trixie
  pretty-name: Docker Hardened Images/Debian GNU/Linux 13 (trixie)
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
