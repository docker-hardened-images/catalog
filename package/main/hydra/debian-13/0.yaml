# syntax=dhi.io/build:2-debian13

image: dhi.io/pkg-hydra
variant: runtime
tags:
  - 26.2.0
  - 26.2.0-r1
  - 26.2.0-debian13
  - 26.2.0-r1-debian13
platforms:
  - linux/amd64
  - linux/arm64
vars:
  COMMIT_SHA: 0b84568fffccf151dc5e6c7955fdfb738555bf4b
  GOLANG_MAJOR_MINOR_VERSION: "1.26"
  GOLANG_VERSION: 1.26.10-0
  PACKAGE_NAME: hydra
  REL: "1"
  SEMVER_MAJOR_MINOR_VERSION: "26.2"
  SEMVER_MAJOR_VERSION: "26"
  SEMVER_VERSION: 26.2.0
  SQLITE_VERSION: 3.50.4
  VERSION: 26.2.0
contents:
  repositories:
    - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
  keyring:
    - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
  packages:
    - base-files
  builds:
    - name: hydra
      work-dir: /go/src/github.com/ory/hydra
      contents:
        packages:
          - bash
          - ca-certificates-bundle
          - coreutils
          - findutils
          - gcc
          - libc6-dev
          - golang-1.26=1.26.10-0
          - golang-1.26-oci-config=1.26.10-0
        files:
          - url: git+https://github.com/ory/hydra.git#v26.2.0
            checksum: 0b84568fffccf151dc5e6c7955fdfb738555bf4b
            path: /go/src/github.com/ory/hydra
            spdx:
              name: hydra
              version: 26.2.0
              packages:
                - name: hydra
                  purl: pkg:golang/github.com/ory/hydra/v2@26.2.0
                  license: Apache-2.0
            uid: 0
            gid: 0
      pipeline:
        - name: fix the TestHasher PBKDF2 configuration
          uses: git/patch@v1
          with:
            patch: /go/src/patch/fix-hasher-test-pbkdf2-config.patch
        - name: widen the token generations grace period
          uses: git/patch@v1
          with:
            patch: /go/src/patch/widen-token-generations-grace-period.patch
        - name: build the benchmark client from otelhttp.NewTransport
          uses: git/patch@v1
          with:
            patch: /go/src/patch/use-otelhttp-transport-in-bench-test.patch
        - name: update go dependencies
          uses: go/bump@v2
          with:
            deps:
              - golang.org/x/crypto@v0.57.0
              - golang.org/x/net@v0.62.0
              - github.com/jackc/pgx/v5@v5.9.2
              - github.com/go-jose/go-jose/v3@v3.0.5
              - go.opentelemetry.io/otel@v1.45.0
              - go.opentelemetry.io/otel/sdk@v1.45.0
              - go.opentelemetry.io/otel/exporters/otlp/otlptrace@v1.45.0
              - go.opentelemetry.io/otel/exporters/otlp/otlptrace/otlptracehttp@v1.45.0
              - go.opentelemetry.io/otel/exporters/zipkin@v1.45.0
            tidy: true
        - uses: go/hermetic@v1
        - name: test
          environment:
            CGO_ENABLED: "1"
            GODEBUG: ""
          runs: |
            set -eux -o pipefail

            go test -short -count=1 -tags sqlite,sqlite_omit_load_extension,hsm ./...
        - name: build hydra
          uses: go/build@v1
          environment:
            GOFLAGS: -buildvcs=false
          with:
            cgo_enabled: 1
            extra-args: -buildmode=pie
            fips: false
            ldflags:
              - -s -w
              - -X github.com/ory/hydra/v2/driver/config.Version=v26.2.0
              - -X github.com/ory/hydra/v2/driver/config.Commit=0b84568fffccf151dc5e6c7955fdfb738555bf4b
              - -X github.com/ory/hydra/v2/driver/config.Date=$(date -u -d @${SOURCE_DATE_EPOCH} +%Y-%m-%dT%H:%M:%SZ)
            output: ${target.dir}/usr/bin/hydra
            tags: sqlite,sqlite_omit_load_extension,hsm
        - name: build hydra dev
          uses: go/build@v1
          environment:
            GOFLAGS: -buildvcs=false
          with:
            cgo_enabled: 1
            extra-args: -buildmode=pie
            fips: false
            ldflags:
              - -X github.com/ory/hydra/v2/driver/config.Version=v26.2.0
              - -X github.com/ory/hydra/v2/driver/config.Commit=0b84568fffccf151dc5e6c7955fdfb738555bf4b
              - -X github.com/ory/hydra/v2/driver/config.Date=$(date -u -d @${SOURCE_DATE_EPOCH} +%Y-%m-%dT%H:%M:%SZ)
            output: ${target.dir}/usr/bin/hydra-dev
            strip: false
            tags: sqlite,sqlite_omit_load_extension,hsm
        - name: check the bundled sqlite version
          runs: |
            set -eux -o pipefail

            for bin in hydra hydra-dev; do
              [ "$(strings "${target.dir}/usr/bin/${bin}" | grep -cx "3.50.4")" -ge 1 ]
            done
        - uses: spdx@v1
          with:
            license: blessing
            name: sqlite
            purl: pkg:generic/sqlite/sqlite@3.50.4
            version: 3.50.4
        - name: stage the sqlite sbom entry
          runs: |
            set -eux -o pipefail

            mkdir -p "${target.dir}/opt/docker/sbom" "${target.dir}/opt/docker/sbom-dev"
            cp -a /opt/docker/sbom/sqlite "${target.dir}/opt/docker/sbom/"
            cp -a /opt/docker/sbom/sqlite "${target.dir}/opt/docker/sbom-dev/"
        - uses: dhi/build-pkg:0
          with:
            depends:
              - libc6
            description: Ory Hydra OAuth 2.0 and OpenID Connect server
            files:
              - usr/bin/hydra
              - opt/docker/sbom/sqlite/.spdx.sqlite.json
            formats:
              - deb
            license: Apache-2.0
            name: hydra
            rel: 1
            subpackages:
              - depends:
                  - libc6
                description: Ory Hydra OAuth 2.0 and OpenID Connect server (unstripped binary)
                files:
                  - path: usr/bin/hydra
                    source: usr/bin/hydra-dev
                  - path: opt/docker/sbom/sqlite/.spdx.sqlite.json
                    source: opt/docker/sbom-dev/sqlite/.spdx.sqlite.json
                name: hydra-dev
            url: https://github.com/ory/hydra
            version: 26.2.0
      paths:
        - type: file
          path: /go/src/patch/fix-hasher-test-pbkdf2-config.patch
          uid: 0
          gid: 0
          source: package/main/hydra/patch/fix-hasher-test-pbkdf2-config.patch
        - type: file
          path: /go/src/patch/widen-token-generations-grace-period.patch
          uid: 0
          gid: 0
          source: package/main/hydra/patch/widen-token-generations-grace-period.patch
        - type: file
          path: /go/src/patch/use-otelhttp-transport-in-bench-test.patch
          uid: 0
          gid: 0
          source: package/main/hydra/patch/use-otelhttp-transport-in-bench-test.patch
os-release:
  name: Docker Hardened Images (Debian)
  id: debian
  version-id: "13"
  version-codename: trixie
  pretty-name: Docker Hardened Images/Debian GNU/Linux 13 (trixie)
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
