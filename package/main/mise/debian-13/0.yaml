image: dhi.io/pkg-mise
variant: runtime
tags:
  - 2026.10.7
  - 2026.10.7-r0
  - 2026.10.7-debian13
  - 2026.10.7-r0-debian13
platforms:
  - linux/amd64
  - linux/arm64
dates:
  release: "2023-08-15"
vars:
  CARGO_VERSION: 1.97.1-0
  COMMIT_SHA: 4599c53b4286ff101de876f8122feec0797b48b2
  PACKAGE_NAME: mise
  REL: "0"
  RUSTC_VERSION: 1.97.1-0
  SEMVER_MAJOR_MINOR_VERSION: "2026.10"
  SEMVER_MAJOR_VERSION: "2026"
  SEMVER_VERSION: 2026.10.7
  VERSION: 2026.10.7
contents:
  packages:
    - '!base-files'
  builds:
    - name: mise
      work-dir: ${source.dir}/mise
      caches:
        - path: /root/.cargo
      contents:
        repositories:
          - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
        keyring:
          - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
        packages:
          - bash
          - binutils
          - build-essential
          - cargo-1.97=1.97.1-0
          - ca-certificates
          - cmake
          - coreutils
          - findutils
          - gawk
          - git
          - grep
          - libcurl4t64
          - libsqlite3-0
          - libssl-dev
          - libzstd-dev
          - pkg-config
          - rustc-1.97=1.97.1-0
          - sed
          - zlib1g-dev
        files:
          - url: git+https://github.com/jdx/mise.git#v2026.10.7
            checksum: 4599c53b4286ff101de876f8122feec0797b48b2
            path: ${source.dir}/mise
            spdx:
              name: mise
              version: 2026.10.7
              packages:
                - name: mise
                  purl: pkg:cargo/mise@2026.10.7
                  license: MIT
            uid: 0
            gid: 0
      pipeline:
        - name: cargo sbom
          uses: sbom@v1
          with:
            extra-scanners: rust-cargo-lock-cataloger
            prefix: mise-cargo
            source: ${source.dir}/mise
        - name: build
          privileged: true
          runs: |
            set -eux -o pipefail

            cargo build --release --locked --ignore-rust-version --no-default-features --features native-tls,vfox/vendored-lua --target-dir "${target.dir}"
            install -D -m 755 "${target.dir}/release/mise" "${target.dir}/usr/bin/mise"
            strip --strip-unneeded "${target.dir}/usr/bin/mise"
        - uses: dhi/build-pkg:0
          with:
            depends:
              - libc6
              - libgcc-s1
              - libssl3t64
              - zlib1g
              - libzstd1
              - ca-certificates-bundle
            description: Dev tools, env vars, and tasks in one CLI
            files:
              - usr/bin/mise
            formats:
              - deb
            license: MIT
            name: mise
            rel: 0
            url: https://github.com/jdx/mise
            version: 2026.10.7
