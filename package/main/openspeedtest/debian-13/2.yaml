# syntax=dhi.io/build:2-debian13

image: dhi.io/pkg-openspeedtest
variant: runtime
tags:
  - 2.5.4
  - 2.5.4-r0
  - 2.5.4-debian13
  - 2.5.4-r0-debian13
platforms:
  - linux/amd64
  - linux/arm64
dates:
  release: "2022-12-27"
vars:
  COMMIT_SHA: f4263546f50694a154fdd27a03000390949068df
  DOCKER_IMAGE_COMMIT_SHA: fc86f9f4bd240fec5eb7670836e37252527afab7
  DOCKER_IMAGE_VERSION: 2.0.5
  PACKAGE_NAME: openspeedtest-2
  REL: "0"
  SEMVER_MAJOR_MINOR_VERSION: "2.5"
  SEMVER_MAJOR_VERSION: "2"
  SEMVER_VERSION: 2.5.4
  VERSION: 2.5.4
contents:
  repositories:
    - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
  keyring:
    - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
  packages:
    - base-files
  builds:
    - name: openspeedtest
      work-dir: ${source.dir}
      contents:
        packages:
          - bash
          - coreutils
        files:
          - url: git+https://github.com/openspeedtest/Speed-Test.git#f4263546f50694a154fdd27a03000390949068df
            checksum: f4263546f50694a154fdd27a03000390949068df
            path: ${source.dir}/speed-test
            spdx:
              name: openspeedtest
              version: 2.5.4
              packages:
                - name: openspeedtest
                  purl: pkg:github/openspeedtest/speed-test@2.5.4
                  license: MIT
            uid: 0
            gid: 0
          - url: git+https://github.com/openspeedtest/Docker-Image.git#v2.0.5
            checksum: fc86f9f4bd240fec5eb7670836e37252527afab7
            path: ${source.dir}/docker-image
            spdx:
              name: openspeedtest-server-conf
              version: 2.0.5
              packages:
                - name: openspeedtest-server-conf
                  purl: pkg:github/openspeedtest/docker-image@2.0.5
                  license: NOASSERTION
            uid: 0
            gid: 0
      pipeline:
        - name: retarget server roots
          uses: patch@v1
          work-dir: ${source.dir}/docker-image
          with:
            options: -p1
            patches:
              - ${source.dir}/patch/dhi-docroot.patch
        - name: stage static site and server file
          shell: /bin/bash
          runs: |
            set -eux -o pipefail

            install -d "${target.dir}/usr/share/openspeedtest/nginx"
            install -D -m 0644 "${source.dir}/speed-test/index.html" "${target.dir}/usr/share/openspeedtest/index.html"
            install -D -m 0644 "${source.dir}/speed-test/hosted.html" "${target.dir}/usr/share/openspeedtest/hosted.html"
            install -D -m 0644 "${source.dir}/speed-test/License.md" "${target.dir}/usr/share/openspeedtest/License.md"
            cp -a "${source.dir}/speed-test/assets" "${target.dir}/usr/share/openspeedtest/assets"
            install -D -m 0755 "${source.dir}/speed-test/upload" "${target.dir}/usr/share/openspeedtest/upload"
            install -D -m 0755 "${source.dir}/speed-test/downloading" "${target.dir}/usr/share/openspeedtest/downloading"
            install -D -m 0644 "${source.dir}/docker-image/files/OpenSpeedTest-Server.conf" "${target.dir}/usr/share/openspeedtest/nginx/openspeedtest.conf"

            test "$(wc -c < "${target.dir}/usr/share/openspeedtest/downloading")" -eq 31457280
            test ! -s "${target.dir}/usr/share/openspeedtest/upload"
            test "$(stat -c %a "${target.dir}/usr/share/openspeedtest/downloading")" = 755
            test "$(stat -c %a "${target.dir}/usr/share/openspeedtest/upload")" = 755
            test ! -e "${target.dir}/usr/share/openspeedtest/README.md"
            conf=$(cat "${target.dir}/usr/share/openspeedtest/nginx/openspeedtest.conf")
            case "$conf" in
              *'root /usr/share/openspeedtest/;'*) ;;
              *) echo "server file is missing the FHS docroot" >&2; exit 1 ;;
            esac
            case "$conf" in
              *'/usr/share/nginx/html'*) echo "server file still references /usr/share/nginx/html" >&2; exit 1 ;;
            esac
        - uses: spdx@v1
          with:
            license: NOASSERTION
            name: roboto
            purl: pkg:generic/googlefonts/roboto@v30
            version: v30
        - uses: dhi/build-pkg:0
          with:
            depends:
              - nginx-stable
            description: Self-hosted HTML5 network speed test
            files:
              - usr/share/openspeedtest
            license: MIT
            name: openspeedtest-2
            rel: 0
            url: https://openspeedtest.com
            version: 2.5.4
      paths:
        - type: file
          path: ${source.dir}/patch/dhi-docroot.patch
          uid: 0
          gid: 0
          source: package/main/openspeedtest/patch/dhi-docroot.patch
os-release:
  name: Docker Hardened Images (Debian)
  id: debian
  version-id: "13"
  version-codename: trixie
  pretty-name: Docker Hardened Images/Debian GNU/Linux 13 (trixie)
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
