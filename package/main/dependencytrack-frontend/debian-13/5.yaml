# syntax=dhi.io/build:2-debian13

image: dhi.io/pkg-dependencytrack-frontend
variant: runtime
tags:
  - 5.1.2
  - 5.1.2-r0
  - 5.1.2-debian13
  - 5.1.2-r0-debian13
platforms:
  - linux/amd64
  - linux/arm64
dates:
  release: "2026-06-07"
vars:
  COMMIT_SHA: 12c00aefaf72e9a95b324538409afa0c7e137ff4
  DHI_TEST_DEB_EXPECTED_FILES: /usr/share/dependencytrack-frontend/index.html /usr/share/dependencytrack-frontend/static/config.json /usr/lib/dependencytrack-frontend/nginx/default.conf.template /usr/lib/dependencytrack-frontend/docker-entrypoint.d/10-listen-on-ipv6-by-default.sh /usr/lib/dependencytrack-frontend/docker-entrypoint.d/30-oidc-configuration.sh
  NODEJS_VERSION: 22.23.3-0
  NPM_BUMPS: npm-bumps-5.json
  NPM_VERSION: 11.20.0-0
  PACKAGE_NAME: dependencytrack-frontend-5
  REL: "0"
  SEMVER_MAJOR_MINOR_VERSION: "5.1"
  SEMVER_MAJOR_VERSION: "5"
  SEMVER_VERSION: 5.1.2
  VERSION: 5.1.2
contents:
  repositories:
    - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
  keyring:
    - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
  packages:
    - base-files
  builds:
    - name: dependencytrack-frontend
      work-dir: ${source.dir}/frontend
      caches:
        - path: /root/.npm
      contents:
        packages:
          - bash
          - bzip2
          - ca-certificates
          - coreutils
          - findutils
          - git
          - libc6
          - libstdc++6
          - nodejs-22=22.23.3-0
          - npm=11.20.0-0
          - tar
        files:
          - url: git+https://github.com/DependencyTrack/frontend.git#5.1.2
            checksum: 12c00aefaf72e9a95b324538409afa0c7e137ff4
            path: ${source.dir}/frontend
            spdx:
              name: dependencytrack-frontend
              version: 5.1.2
              packages:
                - name: dependencytrack-frontend
                  purl: pkg:github/dependencytrack/frontend@5.1.2
                  license: Apache-2.0
            uid: 0
            gid: 0
      pipeline:
        - name: bump dependencies
          uses: npm/bump@v1
          privileged: true
          with:
            bumps: ${source.dir}/patch/npm-bumps-5.json
            npm-root: ${source.dir}/frontend
        - name: install dependencies
          privileged: true
          environment:
            npm_config_ignore_scripts: "true"
          runs: |
            set -eux -o pipefail

            npm ci
        - name: build frontend
          runs: |
            set -eux -o pipefail

            npm run build
            mkdir -p "${target.dir}/usr/share/dependencytrack-frontend"
            cp -a dist/. "${target.dir}/usr/share/dependencytrack-frontend/"
            install -d "${target.dir}/usr/lib/dependencytrack-frontend/nginx"
            install -d "${target.dir}/usr/lib/dependencytrack-frontend/docker-entrypoint.d"
            install -m 0644 docker/etc/nginx/templates/default.conf.template \
              "${target.dir}/usr/lib/dependencytrack-frontend/nginx/default.conf.template"
            install -m 0755 \
              docker/docker-entrypoint.d/10-listen-on-ipv6-by-default.sh \
              docker/docker-entrypoint.d/30-oidc-configuration.sh \
              "${target.dir}/usr/lib/dependencytrack-frontend/docker-entrypoint.d/"
        - name: reinstall dependencies for sbom
          privileged: true
          runs: |
            set -eux -o pipefail

            rm -rf node_modules
            npm install --omit=dev --ignore-scripts
        - name: generate sbom
          uses: sbom@v1
          with:
            prefix: dependencytrack-frontend
            source: ${source.dir}/frontend
        - uses: dhi/build-pkg:0
          with:
            depends:
              - jq
            description: OWASP Dependency-Track frontend static assets
            files:
              - usr/share/dependencytrack-frontend
              - usr/lib/dependencytrack-frontend
            license: Apache-2.0
            name: dependencytrack-frontend-5
            rel: 0
            url: https://github.com/DependencyTrack/frontend
            version: 5.1.2
      paths:
        - type: directory
          path: ${source.dir}/patch
          uid: 0
          gid: 0
          source: package/main/dependencytrack-frontend/patch
os-release:
  name: Docker Hardened Images (Debian)
  id: debian
  version-id: "13"
  version-codename: trixie
  pretty-name: Docker Hardened Images/Debian GNU/Linux 13 (trixie)
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
