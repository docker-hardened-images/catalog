# syntax=dhi.io/build:2-alpine3.24

image: dhi.io/pkg-temporalio-server
variant: runtime
tags:
  - 1.32.0-alpine3.24
  - 1.32.0-r2-alpine3.24
platforms:
  - linux/amd64
  - linux/arm64
dates:
  release: "2026-09-11"
vars:
  COMMIT_SHA: d94e34a1ebba5410a2e7d07119a76896909591aa
  GOLANG_MAJOR_MINOR_VERSION: "1.27"
  GOLANG_VERSION: 1.27.1-r1
  PACKAGE_NAME: temporalio-server-1.32
  REL: "2"
  SEMVER_MAJOR_MINOR_VERSION: "1.32"
  SEMVER_MAJOR_VERSION: "1"
  SEMVER_VERSION: 1.32.0
  VERSION: 1.32.0
contents:
  repositories:
    - https://dhi.io/apk/alpine/v3.24/main
    - https://dhi.io/apk/alpine/v3.23/main
    - https://dl-cdn.alpinelinux.org/alpine/v3.24/main
    - https://dl-cdn.alpinelinux.org/alpine/v3.24/community
  keyring:
    - https://dhi.io/keyring/dhi-apk@docker-0F81AD7700D99184.rsa.pub
  packages:
    - alpine-baselayout-data
  builds:
    - name: temporalio-server-1.32
      work-dir: /go/src/go.temporal.io/server
      caches:
        - path: /go/pkg/mod
      contents:
        packages:
          - busybox
          - bash
          - ca-certificates-bundle
          - coreutils
          - findutils
          - mawk
          - sed
          - golang-1.27=1.27.1-r1
          - golang-1.27-oci-config=1.27.1-r1
        files:
          - url: git+https://github.com/temporalio/temporal.git#v1.32.0
            checksum: d94e34a1ebba5410a2e7d07119a76896909591aa
            path: /go/src/go.temporal.io/server
            spdx:
              name: temporalio-server
              version: 1.32.0
              packages:
                - name: temporal-server
                  purl: pkg:golang/go.temporal.io/server@v1.32.0
                  license: MIT
            uid: 0
            gid: 0
      pipeline:
        - name: update go dependencies (1.32 only)
          uses: go/bump@v2
          with:
            deps: []
            download: true
        - name: unit test
          runs: |
            set -eux -o pipefail

            echo "Running core temporal unit tests..."
            go test -C /go/src/go.temporal.io/server -v -timeout=3m ./common/log/...
            go test -C /go/src/go.temporal.io/server -v -timeout=3m ./common/config/...
            go test -C /go/src/go.temporal.io/server -v -timeout=3m ./common/util/...
        - name: build server
          uses: go/build@v1
          with:
            fips: false
            output: ${target.dir}/usr/bin/temporal-server
            packages: ./cmd/server
        - name: build server dev
          uses: go/build@v1
          with:
            fips: false
            output: ${target.dir}/usr/bin/temporal-server-dev
            packages: ./cmd/server
            strip: false
        - name: patch entrypoint
          uses: patch@v1
          with:
            options: -p1
            patches:
              - ${source.dir}/patch/entrypoint-getent_hostname.30.patch
        - name: install entrypoint
          runs: |
            set -eux -o pipefail

            mkdir -p '${target.dir}/etc/temporal'
            install -m 755 docker/scripts/sh/entrypoint.sh '${target.dir}/etc/temporal/entrypoint.sh'
            install -m 755 docker/scripts/sh/entrypoint.sh '${target.dir}/etc/temporal/entrypoint-dev.sh'
        - uses: dhi/build-pkg:0
          with:
            description: Temporal Server workflow engine
            files:
              - usr/bin/temporal-server
              - etc/temporal/entrypoint.sh
            license: MIT
            name: temporalio-server-1.32
            rel: 2
            subpackages:
              - files:
                  - path: etc/temporal/entrypoint.sh
                    source: etc/temporal/entrypoint-dev.sh
                  - path: usr/bin/temporal-server
                    source: usr/bin/temporal-server-dev
                name: temporalio-server-1.32-dev
            url: https://github.com/temporalio/temporal
            version: 1.32.0
      paths:
        - type: file
          path: /src/patch/entrypoint-getent_hostname.30.patch
          uid: 0
          gid: 0
          source: package/main/temporalio-server/patch/entrypoint-getent_hostname.30.patch
os-release:
  name: Docker Hardened Images (Alpine)
  id: alpine
  version-id: "3.24"
  pretty-name: Docker Hardened Images/Alpine Linux v3.24
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
