          shell: bash
          runs: |
            set -eux -o pipefail

            mkdir -p '${target.dir}/etc/temporal/schema'
            mkdir -p '${target.dir}/etc/temporal/config/dynamicconfig'

            cp '/go/src/go.temporal.io/server/config/dynamicconfig/docker.yaml' '${target.dir}/etc/temporal/config/dynamicconfig/docker.yaml'
            cp '/go/src/go.temporal.io/server/docker/config_template.yaml' '${target.dir}/etc/temporal/config/config_template.yaml'
            cp -r '/go/src/go.temporal.io/server/schema' '${target.dir}/etc/temporal/'

            cp '${source.dir}/docker-builds/docker/entrypoint.sh' '${target.dir}/etc/temporal/entrypoint.sh'
