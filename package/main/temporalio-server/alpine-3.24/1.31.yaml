# syntax=dhi.io/build:2-alpine3.24

image: dhi.io/pkg-temporalio-server
variant: runtime
tags:
  - 1.31.2-alpine3.24
  - 1.31.2-r2-alpine3.24
platforms:
  - linux/amd64
  - linux/arm64
dates:
  release: "2026-04-29"
vars:
  COMMIT_SHA: 19a774302c613da9adc4436ab14278ccdca8e0a5
  GOLANG_MAJOR_MINOR_VERSION: "1.27"
  GOLANG_VERSION: 1.27.1-r0
  PACKAGE_NAME: temporalio-server-1.31
  REL: "2"
  SEMVER_MAJOR_MINOR_VERSION: "1.31"
  SEMVER_MAJOR_VERSION: "1"
  SEMVER_VERSION: 1.31.2
  VERSION: 1.31.2
contents:
  repositories:
    - https://dhi.io/apk/alpine/v3.24/main
    - https://dhi.io/apk/alpine/v3.23/main
    - https://dl-cdn.alpinelinux.org/alpine/v3.24/main
    - https://dl-cdn.alpinelinux.org/alpine/v3.24/community
  keyring:
    - https://dhi.io/keyring/dhi-apk@docker-0F81AD7700D99184.rsa.pub
  packages:
    - alpine-baselayout-data
  builds:
    - name: temporalio-server-1.31
      work-dir: /go/src/go.temporal.io/server
      caches:
        - path: /go/pkg/mod
      contents:
        packages:
          - busybox
          - bash
          - ca-certificates-bundle
          - coreutils
          - findutils
          - mawk
          - sed
          - golang-1.27=1.27.1-r0
          - golang-1.27-oci-config=1.27.1-r0
        files:
          - url: git+https://github.com/temporalio/temporal.git#v1.31.2
            checksum: 19a774302c613da9adc4436ab14278ccdca8e0a5
            path: /go/src/go.temporal.io/server
            spdx:
              name: temporalio-server
              version: 1.31.2
              packages:
                - name: temporal-server
                  purl: pkg:golang/go.temporal.io/server@v1.31.2
                  license: MIT
            uid: 0
            gid: 0
      pipeline:
        - name: update go dependencies (1.31 only)
          uses: go/bump@v2
          with:
            deps:
              - golang.org/x/crypto@v0.55.0
              - golang.org/x/net@v0.57.0
              - filippo.io/edwards25519@v1.1.1
              - github.com/apache/thrift@v0.23.0
              - github.com/aws/aws-sdk-go-v2/service/lambda@v1.88.5
              - github.com/go-jose/go-jose/v4@v4.1.4
              - github.com/jackc/pgx/v5@v5.9.2
              - github.com/klauspost/compress@v1.18.7
              - go.opentelemetry.io/otel@v1.44.0
              - go.opentelemetry.io/otel/sdk@v1.43.0
              - google.golang.org/grpc@v1.82.1
            download: true
        - name: unit test
          runs: |
            set -eux -o pipefail

            echo "Running core temporal unit tests..."
            go test -C /go/src/go.temporal.io/server -v -timeout=3m ./common/log/...
            go test -C /go/src/go.temporal.io/server -v -timeout=3m ./common/config/...
            go test -C /go/src/go.temporal.io/server -v -timeout=3m ./common/util/...
        - name: build server
          uses: go/build@v1
          with:
            fips: false
            output: ${target.dir}/usr/bin/temporal-server
            packages: ./cmd/server
        - name: build server dev
          uses: go/build@v1
          with:
            fips: false
            output: ${target.dir}/usr/bin/temporal-server-dev
            packages: ./cmd/server
            strip: false
        - name: patch entrypoint
          uses: patch@v1
          with:
            options: -p1
            patches:
              - ${source.dir}/patch/entrypoint-getent_hostname.30.patch
        - name: install entrypoint
          runs: |
            set -eux -o pipefail

            mkdir -p '${target.dir}/etc/temporal'
            install -m 755 docker/scripts/sh/entrypoint.sh '${target.dir}/etc/temporal/entrypoint.sh'
        - uses: dhi/build-pkg:0
          with:
            description: Temporal Server workflow engine
            files:
              - usr/bin/temporal-server
              - etc/temporal/entrypoint.sh
            license: MIT
            name: temporalio-server-1.31
            rel: 2
            subpackages:
              - files:
                  - path: usr/bin/temporal-server
                    source: usr/bin/temporal-server-dev
                name: temporalio-server-1.31-dev
            url: https://github.com/temporalio/temporal
            version: 1.31.2
      paths:
        - type: file
          path: /src/patch/entrypoint-getent_hostname.30.patch
          uid: 0
          gid: 0
          source: package/main/temporalio-server/patch/entrypoint-getent_hostname.30.patch
os-release:
  name: Docker Hardened Images (Alpine)
  id: alpine
  version-id: "3.24"
  pretty-name: Docker Hardened Images/Alpine Linux v3.24
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
