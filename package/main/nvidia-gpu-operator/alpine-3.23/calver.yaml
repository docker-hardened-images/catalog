# syntax=dhi.io/build:2-alpine3.23

image: dhi.io/pkg-nvidia-gpu-operator
variant: runtime
tags:
  - 26.7.1-alpine3.23
  - 26.7.1-r1-alpine3.23
platforms:
  - linux/amd64
  - linux/arm64
dates:
  release: "2026-03-18"
vars:
  COMMIT_SHA: dbacf43d4938816fefe62690ab868a640a195282
  GOLANG_VERSION: 1.26.8-r1
  PACKAGE_NAME: nvidia-gpu-operator
  REL: "1"
  SEMVER_MAJOR_MINOR_VERSION: "26.7"
  SEMVER_MAJOR_VERSION: "26"
  SEMVER_VERSION: 26.7.1
  VERSION: 26.7.1
contents:
  repositories:
    - https://dhi.io/apk/alpine/v3.23/main
    - https://dl-cdn.alpinelinux.org/alpine/v3.23/main
    - https://dl-cdn.alpinelinux.org/alpine/v3.23/community
  keyring:
    - https://dhi.io/keyring/dhi-apk@docker-0F81AD7700D99184.rsa.pub
  packages:
    - alpine-baselayout-data
  builds:
    - name: nvidia-gpu-operator
      work-dir: /go/src/github.com/NVIDIA/gpu-operator
      contents:
        packages:
          - busybox
          - bash
          - ca-certificates-bundle
          - coreutils
          - golang-1.26=1.26.8-r1
          - golang-1.26-oci-config=1.26.8-r1
        files:
          - url: https://github.com/NVIDIA/gpu-operator/archive/refs/tags/v26.7.1.tar.gz
            checksum: sha256:a3fc33d4c96cd6da0c5d725279561e2f9f0ccd447d7c7e3dda4ee491115952b0
            path: ${source.dir}/gpu-operator.tar.gz
            spdx:
              name: gpu-operator
              version: 26.7.1
              packages:
                - name: gpu-operator
                  purl: pkg:golang/github.com/NVIDIA/gpu-operator@26.7.1
                  license: Apache-2.0
            uid: 0
            gid: 0
      pipeline:
        - name: extract source
          runs: |
            set -eux -o pipefail

            mkdir -p /go/src/github.com/NVIDIA/gpu-operator
            tar xzf "${source.dir}/gpu-operator.tar.gz" \
              -C /go/src/github.com/NVIDIA/gpu-operator --strip-components=1
        - name: update go dependencies
          uses: go/bump@v2
          with:
            deps:
              - golang.org/x/crypto@v0.56.0
              - golang.org/x/net@v0.58.0
            download: true
        - name: pin transitive dependencies
          privileged: true
          runs: |
            set -eux -o pipefail

            go mod edit \
              -replace github.com/moby/spdystream=github.com/moby/spdystream@v0.5.1 \
              -replace github.com/regclient/regclient=github.com/regclient/regclient@v0.11.5
            go mod tidy
            go mod vendor
        - name: build gpu-operator
          uses: go/build@v1
          with:
            ldflags:
              - -X github.com/NVIDIA/gpu-operator/internal/info.version=26.7.1
              - -X github.com/NVIDIA/gpu-operator/internal/info.gitCommit=dbacf43d4938816fefe62690ab868a640a195282
            output: ${target.dir}/usr/bin/gpu-operator
            packages: ./cmd/gpu-operator
        - name: build gpu-operator dev
          uses: go/build@v1
          with:
            ldflags:
              - -X github.com/NVIDIA/gpu-operator/internal/info.version=26.7.1
              - -X github.com/NVIDIA/gpu-operator/internal/info.gitCommit=dbacf43d4938816fefe62690ab868a640a195282
            output: ${target.dir}/usr/bin/gpu-operator-dev
            packages: ./cmd/gpu-operator
            strip: false
        - name: build nvidia-validator
          uses: go/build@v1
          with:
            ldflags:
              - -X github.com/NVIDIA/gpu-operator/internal/info.version=26.7.1
              - -X github.com/NVIDIA/gpu-operator/internal/info.gitCommit=dbacf43d4938816fefe62690ab868a640a195282
            output: ${target.dir}/usr/bin/nvidia-validator
            packages: ./cmd/nvidia-validator
        - name: build nvidia-validator dev
          uses: go/build@v1
          with:
            ldflags:
              - -X github.com/NVIDIA/gpu-operator/internal/info.version=26.7.1
              - -X github.com/NVIDIA/gpu-operator/internal/info.gitCommit=dbacf43d4938816fefe62690ab868a640a195282
            output: ${target.dir}/usr/bin/nvidia-validator-dev
            packages: ./cmd/nvidia-validator
            strip: false
        - name: build manage-crds
          uses: go/build@v1
          with:
            ldflags:
              - -X github.com/NVIDIA/gpu-operator/internal/info.version=26.7.1
              - -X github.com/NVIDIA/gpu-operator/internal/info.gitCommit=dbacf43d4938816fefe62690ab868a640a195282
            output: ${target.dir}/usr/bin/manage-crds
            packages: ./cmd/manage-crds
        - name: build manage-crds dev
          uses: go/build@v1
          with:
            ldflags:
              - -X github.com/NVIDIA/gpu-operator/internal/info.version=26.7.1
              - -X github.com/NVIDIA/gpu-operator/internal/info.gitCommit=dbacf43d4938816fefe62690ab868a640a195282
            output: ${target.dir}/usr/bin/manage-crds-dev
            packages: ./cmd/manage-crds
            strip: false
        - name: stage operator assets
          runs: |
            set -eux -o pipefail

            mkdir -p "${target.dir}/opt/gpu-operator/manifests" \
              "${target.dir}/opt/validator/manifests" \
              "${target.dir}/usr/bin"

            cp -a assets/. "${target.dir}/opt/gpu-operator/"
            cp -a manifests/. "${target.dir}/opt/gpu-operator/manifests/"
            cp -a validator/manifests/. "${target.dir}/opt/validator/manifests/"
            cp -a deployments/gpu-operator/crds/nvidia.com_clusterpolicies.yaml \
              deployments/gpu-operator/crds/nvidia.com_nvidiadrivers.yaml \
              "${target.dir}/opt/gpu-operator/"
            cp -a deployments/gpu-operator/charts/node-feature-discovery/crds/nfd-api-crds.yaml \
              "${target.dir}/opt/gpu-operator/nfd-api-crds.yaml"
            cp -a hack/must-gather.sh "${target.dir}/usr/bin/gather"
            chmod 0755 "${target.dir}/usr/bin/gather"

            cp -a "${target.dir}/opt" "${target.dir}/opt-dev"
        - uses: dhi/build-pkg:0
          with:
            description: NVIDIA GPU Operator controller and rendered operand assets
            files:
              - usr/bin/gpu-operator
              - usr/bin/manage-crds
              - opt/gpu-operator
              - opt/validator/manifests
            license: Apache-2.0
            name: nvidia-gpu-operator
            priority: optional
            rel: 1
            section: admin
            subpackages:
              - files:
                  - path: usr/bin/nvidia-validator
                name: nvidia-validator-26.7
              - files:
                  - path: usr/bin/gpu-operator
                    source: usr/bin/gpu-operator-dev
                  - path: usr/bin/manage-crds
                    source: usr/bin/manage-crds-dev
                  - path: usr/bin/gather
                  - path: opt/gpu-operator
                    source: opt-dev/gpu-operator
                  - path: opt/validator/manifests
                    source: opt-dev/validator/manifests
                name: nvidia-gpu-operator-dev
              - files:
                  - path: usr/bin/nvidia-validator
                    source: usr/bin/nvidia-validator-dev
                name: nvidia-validator-26.7-dev
            url: https://github.com/NVIDIA/gpu-operator
            version: 26.7.1
os-release:
  name: Docker Hardened Images (Alpine)
  id: alpine
  version-id: "3.23"
  pretty-name: Docker Hardened Images/Alpine Linux v3.23
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
