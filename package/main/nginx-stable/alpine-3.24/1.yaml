      pipeline:
        - name: stop treating warnings as errors
          runs: |
            set -eux -o pipefail

            sed -i 's/^CFLAGS="$CFLAGS -Werror"$/CFLAGS="$CFLAGS"/' auto/cc/gcc
            grep -qx 'CFLAGS="$CFLAGS"' auto/cc/gcc
        - name: fix upload progress under HTTP/2
          uses: patch@v1
          work-dir: ${source.dir}/ngx_uploadprogress
          with:
            options: -p1
            patches:
              - ${source.dir}/patch/upload-progress-http2.patch
        - name: configure and build
          runs: |
            set -eux -o pipefail

            rm -rf ../ngx_brotli/deps/brotli
            cp -a ../brotli-src ../ngx_brotli/deps/brotli

            export NJS_CFLAGS="-Wno-error=dangling-pointer"

            configure() {
              ./auto/configure \
                --prefix=/var/lib/nginx \
                --sbin-path=/usr/sbin/nginx \
                --modules-path=/usr/lib/nginx/modules \
                --conf-path=/etc/nginx/nginx.conf \
                --pid-path=/run/nginx/nginx.pid \
                --lock-path=/run/nginx/nginx.lock \
                --http-client-body-temp-path=/var/lib/nginx/tmp/client_body \
                --http-proxy-temp-path=/var/lib/nginx/tmp/proxy \
                --http-fastcgi-temp-path=/var/lib/nginx/tmp/fastcgi \
                --http-uwsgi-temp-path=/var/lib/nginx/tmp/uwsgi \
                --http-scgi-temp-path=/var/lib/nginx/tmp/scgi \
                --with-perl_modules_path=/usr/lib/perl5/vendor_perl \
                --user=nginx \
                --group=nginx \
                --with-threads \
                --with-file-aio \
                --with-compat \
                --with-http_ssl_module \
                --with-http_v2_module \
                --with-http_v3_module \
                --with-http_realip_module \
                --with-http_addition_module \
                --with-http_xslt_module=dynamic \
                --with-http_image_filter_module=dynamic \
                --with-http_geoip_module=dynamic \
                --with-http_sub_module \
                --with-http_dav_module \
                --with-http_flv_module \
                --with-http_mp4_module \
                --with-http_gunzip_module \
                --with-http_gzip_static_module \
                --with-http_auth_request_module \
                --with-http_random_index_module \
                --with-http_secure_link_module \
                --with-http_degradation_module \
                --with-http_slice_module \
                --with-http_stub_status_module \
                --with-http_perl_module=dynamic \
                --with-mail=dynamic \
                --with-mail_ssl_module \
                --with-stream=dynamic \
                --with-stream_ssl_module \
                --with-stream_realip_module \
                --with-stream_geoip_module=dynamic \
                --with-stream_ssl_preread_module \
                --with-cc-opt='-O2 -fstack-protector-strong -fstack-clash-protection -Wformat -Werror=format-security' \
                --with-ld-opt='-Wl,-z,relro -Wl,-z,now' \
                "$@"
            }

            ncpus=$(getconf _NPROCESSORS_ONLN)
            ncpus=$((ncpus > 6 ? 6 : ncpus))

            configure --builddir=objs-debug --with-debug
            make -f objs-debug/Makefile -j"$ncpus"

            configure \
              --add-dynamic-module=../njs/nginx \
              --add-dynamic-module=../ngx_brotli \
              --add-dynamic-module=../ngx_uploadprogress \
              --add-dynamic-module=../ngx_vts
            make -j"$ncpus"
        - name: install and assemble the Alpine layout
          runs: |
            set -eux -o pipefail

            make install DESTDIR=${target.dir} INSTALLDIRS=vendor
            find ${target.dir} -type f \( -name .packlist -o -name perllocal.pod \) -delete

            for so in ngx_http_js_module.so ngx_stream_js_module.so \
              ngx_http_brotli_filter_module.so ngx_http_brotli_static_module.so \
              ngx_http_uploadprogress_module.so ngx_http_vhost_traffic_status_module.so; do
              install -Dm755 "objs/$so" "${target.dir}/usr/lib/nginx/modules/$so"
            done
            install -Dm755 objs-debug/nginx ${target.dir}/usr/sbin/nginx-debug

            install -Dm644 LICENSE ${target.dir}/usr/share/licenses/nginx-stable/LICENSE
            install -Dm644 README.md ${target.dir}/usr/share/doc/nginx/README.md
            install -Dm644 objs/nginx.8 ${target.dir}/usr/share/man/man8/nginx.8

            install -Dm644 ${source.dir}/layout/nginx.conf ${target.dir}/etc/nginx/nginx.conf
            install -dm755 ${target.dir}/etc/nginx/http.d ${target.dir}/etc/nginx/modules
            install -Dm755 ${source.dir}/layout/nginx.initd ${target.dir}/etc/init.d/nginx
            install -Dm644 ${source.dir}/layout/nginx.confd ${target.dir}/etc/conf.d/nginx
            install -Dm644 ${source.dir}/layout/nginx.logrotate ${target.dir}/etc/logrotate.d/nginx
            install -Dm644 ${source.dir}/layout/default.conf ${target.dir}/usr/share/nginx/http-default_server.conf

            install -dm750 ${target.dir}/var/lib/nginx
            install -dm700 ${target.dir}/var/lib/nginx/tmp
            install -dm755 ${target.dir}/var/www/localhost/htdocs

            install -dm755 ${target.dir}/var/log
            mv ${target.dir}/var/lib/nginx/logs ${target.dir}/var/log/nginx
            ln -sf /usr/lib/nginx/modules ${target.dir}/var/lib/nginx/modules
            ln -sf /var/log/nginx ${target.dir}/var/lib/nginx/logs
            ln -sf /run/nginx ${target.dir}/var/lib/nginx/run

            for d in etc/nginx/http.d etc/nginx/modules var/lib/nginx/tmp var/log/nginx var/www/localhost/htdocs; do
              touch ${target.dir}/$d/.keep
            done

            rm ${target.dir}/etc/nginx/koi-utf ${target.dir}/etc/nginx/koi-win ${target.dir}/etc/nginx/win-utf
            rm -rf ${target.dir}/run ${target.dir}/etc/nginx/*.default

            mkdir -p ${target.dir}/usr/share/vim ${target.dir}/etc/nginx/stream.d
            touch ${target.dir}/etc/nginx/stream.d/.keep
            cp -r contrib/vim ${target.dir}/usr/share/vim/vimfiles

            mkdir -p ${target.dir}/usr/src/nginx-1.30.8
            cp -r ./* ${target.dir}/usr/src/nginx-1.30.8/
            rm -rf ${target.dir}/usr/src/nginx-1.30.8/objs ${target.dir}/usr/src/nginx-1.30.8/objs-debug

            stage=${target.dir}/stage
            mkdir -p "$stage"
            stage_module() {
              conf=$1
              prefix=$2
              shift 2
              for so in "$@"; do
                mv "${target.dir}/usr/lib/nginx/modules/$so" "$stage/$so"
                echo "load_module \"modules/$so\";" >> "$stage/$prefix"_"$conf".conf
              done
            }
            stage_module http_geoip 10 ngx_http_geoip_module.so
            stage_module http_image_filter 10 ngx_http_image_filter_module.so
            stage_module http_perl 10 ngx_http_perl_module.so
            stage_module http_xslt_filter 10 ngx_http_xslt_filter_module.so
            stage_module mail 10 ngx_mail_module.so
            stage_module stream 10 ngx_stream_module.so
            stage_module stream_geoip 20 ngx_stream_geoip_module.so
            stage_module http_js 10 ngx_http_js_module.so
            stage_module stream_js 20 ngx_stream_js_module.so
            stage_module http_brotli 10 ngx_http_brotli_filter_module.so ngx_http_brotli_static_module.so
            stage_module http_upload_progress 10 ngx_http_uploadprogress_module.so
            stage_module http_vts 10 ngx_http_vhost_traffic_status_module.so
            install -Dm644 ${source.dir}/layout/stream.conf "$stage/stream.conf"

            install -d ${target.dir}/opt/docker/sbom
