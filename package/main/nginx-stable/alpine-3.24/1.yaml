            uid: 0
            gid: 0
          - url: git+https://github.com/google/ngx_brotli.git#53e0fb55f250f48fe80c0ddbf6c0f7103cdbaae1
            checksum: 53e0fb55f250f48fe80c0ddbf6c0f7103cdbaae1
            path: ${source.dir}/ngx_brotli
            spdx:
