image: dhi.io/pkg-nginx-stable
variant: runtime
tags:
  - 1.30.8-alpine3.24
  - 1.30.8-r0-alpine3.24
platforms:
  - linux/amd64
  - linux/arm64
vars:
  BROTLI_COMMIT_SHA: ed738e842d2fbdf2d6459e39267a633c4a9b2f5d
  BROTLI_MODULE_COMMIT_SHA: 53e0fb55f250f48fe80c0ddbf6c0f7103cdbaae1
