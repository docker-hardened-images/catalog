                name: nginx-stable-debug
              - description: HTTP and reverse proxy server (stable version) (documentation)
                files:
                  - usr/share/doc/nginx
                  - usr/share/man/man8/nginx.8
                name: nginx-stable-doc
              - description: HTTP and reverse proxy server (stable version) (OpenRC init scripts)
                files:
