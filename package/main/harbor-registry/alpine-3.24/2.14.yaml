# syntax=dhi.io/build:2-alpine3.24

image: dhi.io/pkg-harbor-registry
variant: runtime
tags:
  - 2.14.4-alpine3.24
  - 2.14.4-r6-alpine3.24
platforms:
  - linux/amd64
  - linux/arm64
dates:
  release: "2025-09-17"
vars:
  COMMIT_SHA: 79a297f760eb9596c8693727b88c3c568f9c6302
  GOLANG_MAJOR_MINOR_VERSION: "1.26"
  GOLANG_VERSION: 1.26.8-r0
  PACKAGE_NAME: harbor-registry-2.14
  REGISTRY_COMMIT_SHA: 9b07f693f68b57c0e6132e77b1393b3dfa60580d
  REGISTRY_SRC_TAG: release/2.8
  REGISTRYVERSION: v2.8.3-patch-redis
  REL: "6"
  SEMVER_MAJOR_MINOR_VERSION: "2.14"
  SEMVER_MAJOR_VERSION: "2"
  SEMVER_VERSION: 2.14.4
  VERSION: 2.14.4
contents:
  repositories:
    - https://dhi.io/apk/alpine/v3.24/main
    - https://dhi.io/apk/alpine/v3.23/main
    - https://dl-cdn.alpinelinux.org/alpine/v3.24/main
    - https://dl-cdn.alpinelinux.org/alpine/v3.24/community
  keyring:
    - https://dhi.io/keyring/dhi-apk@docker-0F81AD7700D99184.rsa.pub
  packages:
    - alpine-baselayout-data
  builds:
    - name: harbor-registry-2.14
      work-dir: /go/src/github.com/docker/distribution
      environment:
        GOPATH: /go
        GOTOOLCHAIN: local
      contents:
        packages:
          - busybox
          - bash
          - ca-certificates-bundle
          - coreutils
          - findutils
          - mawk
          - sed
          - golang-1.26=1.26.8-r0
          - golang-1.26-oci-config=1.26.8-r0
        files:
          - url: git+https://github.com/goharbor/distribution.git#9b07f693f68b57c0e6132e77b1393b3dfa60580d
            checksum: 9b07f693f68b57c0e6132e77b1393b3dfa60580d
            path: /go/src/github.com/docker/distribution
            spdx:
              name: harbor-registry
              version: v2.8.3-patch-redis
              packages:
                - name: harbor-registry
                  purl: pkg:golang/github.com/goharbor/distribution@v2.8.3-patch-redis
                  license: Apache-2.0
            uid: 0
            gid: 0
      pipeline:
        - name: bump azure adal
          privileged: true
          runs: |
            set -eux -o pipefail

            go get github.com/Azure/go-autorest/autorest/adal@v0.9.24
            go get github.com/golang-jwt/jwt/v4@v4.5.2 # CVE-2025-30204, CVE-2024-51744
            go mod tidy
            go mod vendor
        - name: update go dependencies (2.14 only)
          uses: go/bump@v2
          with:
            deps:
              - golang.org/x/crypto@v0.57.0
              - golang.org/x/net@v0.59.0
              - github.com/satori/go.uuid@v1.2.1-0.20181016170032-d91630c85102
            download: true
        - uses: go/hermetic@v1
        - name: build
          uses: go/build@v1
          with:
            ldflags:
              - -X github.com/docker/distribution/version.Version=v2.8.3-patch-redis
              - -X github.com/docker/distribution/version.Package=github.com/docker/distribution
            output: ${target.dir}/usr/bin/registry
            packages: ./cmd/registry
            strip: true
        - name: build dev
          uses: go/build@v1
          with:
            ldflags:
              - -X github.com/docker/distribution/version.Version=v2.8.3-patch-redis
              - -X github.com/docker/distribution/version.Package=github.com/docker/distribution
            output: ${target.dir}/usr/bin/registry-dev
            packages: ./cmd/registry
            strip: false
        - uses: dhi/build-pkg:0
          with:
            description: Harbor Registry - OCI/Docker registry component for Harbor
            files:
              - usr/bin/registry
            license: Apache-2.0
            name: harbor-registry-2.14
            rel: 6
            subpackages:
              - files:
                  - path: usr/bin/registry
                    source: usr/bin/registry-dev
                name: harbor-registry-2.14-dev
            url: https://goharbor.io/
            version: 2.14.4
os-release:
  name: Docker Hardened Images (Alpine)
  id: alpine
  version-id: "3.24"
  pretty-name: Docker Hardened Images/Alpine Linux v3.24
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
