# syntax=dhi.io/build:2-alpine3.24

image: dhi.io/pkg-harbor-registry
variant: runtime
tags:
  - 2.16.0-alpine3.24
  - 2.16.0-r1-alpine3.24
platforms:
  - linux/amd64
  - linux/arm64
dates:
  release: "2026-11-09"
vars:
  COMMIT_SHA: e69b1bfab9c945cdbddf74d04d19200011108af0
  GOLANG_MAJOR_MINOR_VERSION: "1.27"
  GOLANG_VERSION: 1.27.4-r0
  PACKAGE_NAME: harbor-registry-2.16
  REGISTRY_COMMIT_SHA: 72e8fdc1ff9021b77e618568a967e4b53689ce32
  REGISTRY_SRC_TAG: v2.8.3-harbor.3
  REGISTRYVERSION: v2.8.3-patch-redis
  REL: "1"
  SEMVER_MAJOR_MINOR_VERSION: "2.16"
  SEMVER_MAJOR_VERSION: "2"
  SEMVER_VERSION: 2.16.0
  VERSION: 2.16.0
contents:
  repositories:
    - https://dhi.io/apk/alpine/v3.24/main
    - https://dhi.io/apk/alpine/v3.23/main
    - https://dl-cdn.alpinelinux.org/alpine/v3.24/main
    - https://dl-cdn.alpinelinux.org/alpine/v3.24/community
  keyring:
    - https://dhi.io/keyring/dhi-apk@docker-0F81AD7700D99184.rsa.pub
  packages:
    - alpine-baselayout-data
  builds:
    - name: harbor-registry-2.16
      work-dir: /go/src/github.com/docker/distribution
      environment:
        GOPATH: /go
        GOTOOLCHAIN: local
      contents:
        packages:
          - busybox
          - bash
          - ca-certificates-bundle
          - coreutils
          - findutils
          - mawk
          - sed
          - golang-1.27=1.27.4-r0
          - golang-1.27-oci-config=1.27.4-r0
        files:
          - url: git+https://github.com/goharbor/distribution.git#72e8fdc1ff9021b77e618568a967e4b53689ce32
            checksum: 72e8fdc1ff9021b77e618568a967e4b53689ce32
            path: /go/src/github.com/docker/distribution
            spdx:
              name: harbor-registry
              version: v2.8.3-patch-redis
              packages:
                - name: harbor-registry
                  purl: pkg:golang/github.com/goharbor/distribution@v2.8.3-patch-redis
                  license: Apache-2.0
            uid: 0
            gid: 0
      pipeline:
        - name: update go dependencies (2.16 only)
          uses: go/bump@v2
          with:
            deps:
              - golang.org/x/crypto@v0.57.0
              - golang.org/x/net@v0.62.0
              - github.com/miekg/dns@v1.1.25
              - github.com/satori/go.uuid@v1.2.1-0.20181016170032-d91630c85102
            download: true
        - name: bump azure adal
          privileged: true
          runs: |
            set -eux -o pipefail

            go get github.com/Azure/go-autorest/autorest/adal@v0.9.24
            go get github.com/golang-jwt/jwt/v4@v4.5.2 # CVE-2025-30204, CVE-2024-51744
            go mod tidy
            go mod vendor
        - name: patch xenolf lego for miekg/dns v1.1.25
          runs: |
            set -eux -o pipefail

            sed -i 's/if err == dns.ErrTruncated {/if err == nil \&\& in != nil \&\& in.Truncated {/' vendor/github.com/xenolf/lego/acme/dns_challenge.go
        - uses: go/hermetic@v1
        - name: build
          uses: go/build@v1
          with:
            ldflags:
              - -X github.com/docker/distribution/version.Version=v2.8.3-patch-redis
              - -X github.com/docker/distribution/version.Package=github.com/docker/distribution
            output: ${target.dir}/usr/bin/registry
            packages: ./cmd/registry
            strip: true
        - name: build dev
          uses: go/build@v1
          with:
            ldflags:
              - -X github.com/docker/distribution/version.Version=v2.8.3-patch-redis
              - -X github.com/docker/distribution/version.Package=github.com/docker/distribution
            output: ${target.dir}/usr/bin/registry-dev
            packages: ./cmd/registry
            strip: false
        - uses: dhi/build-pkg:0
          with:
            description: Harbor Registry - OCI/Docker registry component for Harbor
            files:
              - usr/bin/registry
            license: Apache-2.0
            name: harbor-registry-2.16
            rel: 1
            subpackages:
              - files:
                  - path: usr/bin/registry
                    source: usr/bin/registry-dev
                name: harbor-registry-2.16-dev
            url: https://goharbor.io/
            version: 2.16.0
os-release:
  name: Docker Hardened Images (Alpine)
  id: alpine
  version-id: "3.24"
  pretty-name: Docker Hardened Images/Alpine Linux v3.24
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
