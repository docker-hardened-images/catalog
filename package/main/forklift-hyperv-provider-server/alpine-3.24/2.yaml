              - golang.org/x/crypto@v0.56.0
              - golang.org/x/net@v0.57.0
              - golang.org/x/oauth2@v0.27.0
              - golang.org/x/sys@v0.47.0
              - golang.org/x/text@v0.41.0
            download: true
        - name: re-vendor bumped dependencies
          runs: |
            set -eux -o pipefail

            go mod vendor
        - name: test
