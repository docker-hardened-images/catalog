              ./pkg/lib/logging/...
        - name: build
          uses: go/build@v1
          with:
            extra-args: -mod=vendor -buildvcs=false
            fips: false
            output: ${target.dir}/usr/bin/hyperv-provider-server
            packages: ./cmd/hyperv-provider-server
            strip: true
        - name: build dev
          uses: go/build@v1
          with:
            extra-args: -mod=vendor -buildvcs=false
            fips: false
            output: ${target.dir}/usr/bin/hyperv-provider-server-dev
            packages: ./cmd/hyperv-provider-server
            strip: false
        - uses: dhi/build-pkg:0
