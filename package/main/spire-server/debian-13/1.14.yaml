# syntax=dhi.io/build:2-debian13

image: dhi.io/pkg-spire-server
variant: runtime
tags:
  - "1.14"
  - 1.14.9
  - 1.14.9-r0
  - 1.14-debian13
  - 1.14.9-debian13
  - 1.14.9-r0-debian13
platforms:
  - linux/amd64
  - linux/arm64
vars:
  COMMIT_SHA: dbfbd97c343cc93b73731c804e0c746160588ddf
  GOLANG_MAJOR_MINOR_VERSION: "1.26"
  GOLANG_VERSION: 1.26.10-0
  PACKAGE_NAME: spire-server-1.14
  REL: "0"
  SEMVER_MAJOR_MINOR_VERSION: "1.14"
  SEMVER_MAJOR_VERSION: "1"
  SEMVER_VERSION: 1.14.9
  VERSION: 1.14.9
contents:
  packages:
    - base-files
  builds:
    - name: spire-server-1.14
      work-dir: /go/src/github.com/spiffe/spire
      contents:
        repositories:
          - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
        keyring:
          - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
        packages:
          - bash
          - ca-certificates-bundle
          - coreutils
          - findutils
          - gcc
          - libc6-dev
          - libsqlite3-dev
          - mawk
          - sed
          - golang-1.26=1.26.10-0
          - golang-1.26-oci-config=1.26.10-0
        files:
          - url: git+https://github.com/spiffe/spire.git#dbfbd97c343cc93b73731c804e0c746160588ddf
            checksum: dbfbd97c343cc93b73731c804e0c746160588ddf
            path: /go/src/github.com/spiffe/spire
            spdx:
              name: spire-server
              version: 1.14.9
              packages:
                - name: spire-server
                  purl: pkg:golang/github.com/spiffe/spire@1.14.9
                  license: Apache-2.0
            uid: 0
            gid: 0
      pipeline:
        - name: update go dependencies (1.14 only)
          uses: go/bump@v2
          with:
            deps:
              - github.com/aws/aws-sdk-go-v2/aws/protocol/eventstream@v1.7.8
              - github.com/aws/aws-sdk-go-v2/service/s3@v1.97.3
              - github.com/go-jose/go-jose/v3@v3.0.5
              - github.com/go-jose/go-jose/v4@v4.1.4
              - github.com/jackc/pgx/v5@v5.9.2
              - go.opentelemetry.io/otel@v1.44.0
              - go.opentelemetry.io/otel/sdk@v1.45.0
              - google.golang.org/grpc@v1.83.2
            tidy: true
        - uses: go/hermetic@v1
        - name: test
          runs: |
            set -eux -o pipefail

            EXCLUDES='/cmd/spire-agent|/pkg/agent|/cmd/spire-server/cli/run|/pkg/server|/pkg/common/peertracker|/pkg/common/diskcertmanager'
            PKGS=$(go list ./... | egrep -v "${EXCLUDES}")
            CGO_ENABLED=0 go test $PKGS
        - name: build spire-server
          uses: go/build@v1
          environment:
            GOFLAGS: -buildvcs=false
          with:
            cgo_enabled: 1
            fips: false
            ldflags:
              - -X github.com/spiffe/spire/pkg/common/version.gittag=1.14.9
              - -X github.com/spiffe/spire/pkg/common/version.githash=dbfbd97c343cc93b73731c804e0c746160588ddf
            output: ${target.dir}/usr/bin/spire-server
            packages: ./cmd/spire-server
            tags: libsqlite3
        - name: build spire-server dev
          uses: go/build@v1
          environment:
            GOFLAGS: -buildvcs=false
          with:
            cgo_enabled: 1
            fips: false
            ldflags:
              - -X github.com/spiffe/spire/pkg/common/version.gittag=1.14.9
              - -X github.com/spiffe/spire/pkg/common/version.githash=dbfbd97c343cc93b73731c804e0c746160588ddf
            output: ${target.dir}/usr/bin/spire-server-dev
            packages: ./cmd/spire-server
            strip: false
            tags: libsqlite3
        - uses: dhi/build-pkg:0
          with:
            depends:
              - libc6
              - libsqlite3-0
            description: SPIFFE SPIRE server
            files:
              - usr/bin/spire-server
            formats:
              - deb
            license: Apache-2.0
            name: spire-server-1.14
            rel: 0
            subpackages:
              - files:
                  - path: usr/bin/spire-server
                    source: usr/bin/spire-server-dev
                name: spire-server-1.14-dev
            url: https://github.com/spiffe/spire
            version: 1.14.9
os-release:
  name: Docker Hardened Images (Debian)
  id: debian
  version-id: "13"
  version-codename: trixie
  pretty-name: Docker Hardened Images/Debian GNU/Linux 13 (trixie)
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
