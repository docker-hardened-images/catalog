contents:
  packages:
    - base-files
  builds:
    - name: spire-server-1.15
      work-dir: /go/src/github.com/spiffe/spire
      contents:
        repositories:
          - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
        keyring:
          - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
        packages:
          - bash
          - ca-certificates-bundle
          - coreutils
          - findutils
          - gcc
          - libc6-dev
          - libsqlite3-dev
          - mawk
          - sed
          - golang-1.26=1.26.7-1
          - golang-1.26-oci-config=1.26.7-1
        files:
          - url: git+https://github.com/spiffe/spire.git#2f7861ae3923caf1f57eb087fc2928d58c0fb1d2
            checksum: 2f7861ae3923caf1f57eb087fc2928d58c0fb1d2
            path: /go/src/github.com/spiffe/spire
            spdx:
              name: spire-server
              version: 1.15.3
              packages:
                - name: spire-server
                  purl: pkg:golang/github.com/spiffe/spire@1.15.3
                  license: Apache-2.0
            uid: 0
            gid: 0
      pipeline:
        - name: update go dependencies (1.15 only)
          uses: go/bump@v2
          with:
            deps:
              - golang.org/x/crypto@v0.55.0
              - go.opentelemetry.io/otel@v1.44.0
            tidy: true
        - uses: go/hermetic@v1
        - name: test
          runs: |
            set -eux -o pipefail

            EXCLUDES='/cmd/spire-agent|/pkg/agent|/cmd/spire-server/cli/run|/pkg/server|/pkg/common/peertracker|/pkg/common/diskcertmanager'
            PKGS=$(go list ./... | egrep -v "${EXCLUDES}")
            CGO_ENABLED=0 go test $PKGS
        - name: build spire-server
          uses: go/build@v1
          environment:
            GOFLAGS: -buildvcs=false
          with:
            cgo_enabled: 1
            fips: false
            ldflags:
              - -X github.com/spiffe/spire/pkg/common/version.gittag=1.15.3
              - -X github.com/spiffe/spire/pkg/common/version.githash=2f7861ae3923caf1f57eb087fc2928d58c0fb1d2
            output: ${target.dir}/usr/bin/spire-server
            packages: ./cmd/spire-server
            tags: libsqlite3
        - name: build spire-server dev
          uses: go/build@v1
          environment:
            GOFLAGS: -buildvcs=false
          with:
            cgo_enabled: 1
            fips: false
            ldflags:
              - -X github.com/spiffe/spire/pkg/common/version.gittag=1.15.3
              - -X github.com/spiffe/spire/pkg/common/version.githash=2f7861ae3923caf1f57eb087fc2928d58c0fb1d2
            output: ${target.dir}/usr/bin/spire-server-dev
            packages: ./cmd/spire-server
            strip: false
            tags: libsqlite3
        - uses: dhi/build-pkg:0
          with:
            depends:
              - libc6
              - libsqlite3-0
            description: SPIFFE SPIRE server
            files:
              - usr/bin/spire-server
            formats:
              - deb
            license: Apache-2.0
            name: spire-server-1.15
            rel: 0
            subpackages:
              - files:
                  - path: usr/bin/spire-server
                    source: usr/bin/spire-server-dev
                name: spire-server-1.15-dev
            url: https://github.com/spiffe/spire
            version: 1.15.3
