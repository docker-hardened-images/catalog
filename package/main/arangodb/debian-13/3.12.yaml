contents:
  packages:
    - base-files
  builds:
    - name: arangodb
      work-dir: ${source.dir}/rclone
      contents:
        repositories:
          - deb [signed-by=/usr/share/keyrings/arango-keyring.gpg] https://download.arangodb.com/9c169fe900ff79790395784287bfa82f0dc0059375a34a2881b9b745c8efd42e/arangodb312/DEBIAN /
          - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
        keyring:
          - https://download.arangodb.com/9c169fe900ff79790395784287bfa82f0dc0059375a34a2881b9b745c8efd42e/arangodb312/DEBIAN/Release.key
          - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
        packages:
          - bash
          - ca-certificates
          - coreutils
          - dpkg
          - findutils
          - gzip
          - golang-1.26=1.26.7-1
          - golang-1.26-oci-config=1.26.7-1
          - jq
          - sed
          - arangodb3e=3.12.11-1
        files:
          - url: https://registry.npmjs.org/brace-expansion/-/brace-expansion-5.0.9.tgz
            checksum: sha256:5d06001fddd25cbee90c96db4dc5b7b57711b984c3141e28d10f143deb52dbaf
            path: ${source.dir}/npm/brace-expansion-5.0.9.tgz
            uid: 0
            gid: 0
          - url: https://registry.npmjs.org/fast-uri/-/fast-uri-3.1.5.tgz
            checksum: sha256:82a71e7e3716dc8c392cac0762bce80614cf539ef22000415e26eaf5c453ce2f
            path: ${source.dir}/npm/fast-uri-3.1.5.tgz
            uid: 0
            gid: 0
          - url: https://registry.npmjs.org/js-yaml/-/js-yaml-4.3.1.tgz
            checksum: sha256:08d6282b77a3e7242061f6dd5516c019b25c53041ad267bca3b790d79ddd5f34
            path: ${source.dir}/npm/js-yaml-4.3.1.tgz
            uid: 0
            gid: 0
          - url: https://registry.npmjs.org/joi/-/joi-18.2.1.tgz
            checksum: sha256:7b85edfda1b1afd023c5ec7b12f61ff3d272b2ef38b783d6f1b27b5a4304bd32
            path: ${source.dir}/npm/joi-18.2.1.tgz
