          - url: https://registry.npmjs.org/@standard-schema/spec/-/spec-1.1.0.tgz
            checksum: sha256:a7cb7268be280ab518d450f8c3b07c86f23417225c0ab53691ed59b3067cceaf
            path: ${source.dir}/npm/standard-schema-spec-1.1.0.tgz
            uid: 0
            gid: 0
          - url: git+https://github.com/rclone/rclone.git#v1.75.0
            checksum: 9ee9d0a0cafd5e5fe3b271d2280b090ab6e64048
            path: ${source.dir}/rclone
            uid: 0
            gid: 0
      pipeline:
        - name: configure arangodb payload
          work-dir: /
          runs: |
            set -eux -o pipefail

            rm -f /bin/arangodb

            sed -ri \
              -e 's!127\.0\.0\.1!0.0.0.0!g' \
              -e 's!^(file\s*=\s*).*!\1 -!' \
              -e 's!^\s*uid\s*=.*!!' \
              /etc/arangodb3/arangod.conf
        - name: stage arangodb payload
          work-dir: /
          runs: |
            set -eux -o pipefail

            dpkg -L arangodb3e | while IFS= read -r path; do
              case "${path}" in
                /bin/arangodb) continue ;;
              esac
              [ -e "${path}" ] || continue
              case "${path}" in
                /*) dest="${target.dir}${path}" ;;
                *) continue ;;
              esac
              if [ -d "${path}" ]; then
                install -d "${dest}"
              elif [ -L "${path}" ]; then
                install -d "$(dirname "${dest}")"
                ln -sf "$(readlink "${path}")" "${dest}"
              else
                install -D "${path}" "${dest}"
              fi
            done
        - name: patch arangodb npm modules
          work-dir: /
          runs: |
            set -eux -o pipefail

            root="${target.dir}/usr/share/arangodb3/js/node"
            lock="${root}/package-lock.json"

            replace_npm_module() {
              local pkg="$1"
              local tgz="$2"
              local moddir="${root}/node_modules/${pkg}"

              rm -rf "${moddir}"
              mkdir -p "${moddir}"
              tar xzf "${tgz}" -C "${moddir}" --strip-components=1
            }

            replace_npm_module brace-expansion "${source.dir}/npm/brace-expansion-5.0.9.tgz"
            replace_npm_module fast-uri "${source.dir}/npm/fast-uri-3.1.5.tgz"
            replace_npm_module js-yaml "${source.dir}/npm/js-yaml-4.3.1.tgz"
            replace_npm_module joi "${source.dir}/npm/joi-18.2.1.tgz"
            replace_npm_module @hapi/hoek "${source.dir}/npm/hapi-hoek-11.0.7.tgz"
            replace_npm_module @hapi/topo "${source.dir}/npm/hapi-topo-6.0.2.tgz"
            replace_npm_module @hapi/address "${source.dir}/npm/hapi-address-5.1.1.tgz"
            replace_npm_module @hapi/formula "${source.dir}/npm/hapi-formula-3.0.2.tgz"
            replace_npm_module @hapi/pinpoint "${source.dir}/npm/hapi-pinpoint-2.0.1.tgz"
            replace_npm_module @hapi/tlds "${source.dir}/npm/hapi-tlds-1.1.1.tgz"
            replace_npm_module @standard-schema/spec "${source.dir}/npm/standard-schema-spec-1.1.0.tgz"

            jq \
              --arg be "5.0.9" \
              --arg beurl "https://registry.npmjs.org/brace-expansion/-/brace-expansion-5.0.9.tgz" \
              --arg beint "sha512-ScQ4IuvIEF1TMlP7Zt+vjJ//9zlPb2SDcxWxM3bk8s6t6GGdJ7KO1dCcTidOPJKePW30LE/2cT7wCyPho9/Wxg==" \
              --arg fu "3.1.5" \
              --arg fuurl "https://registry.npmjs.org/fast-uri/-/fast-uri-3.1.5.tgz" \
              --arg uint "sha512-gHwA1O9LDIcKunMKhObS/HimwtehO1nPUECKAu5TpKgaO19fcWEl4bliWe1jWxVFvIXztJjjQ4L8XQ1EU9f7Jw==" \
              --arg jy "4.3.1" \
              --arg jyurl "https://registry.npmjs.org/js-yaml/-/js-yaml-4.3.1.tgz" \
              --arg jyint "sha512-CY6crGq313MX8GkwvB7tzgp99vjQxY1++5y10/BKN/GUfHqWaOGQMNZkBvqSzsZKWk/ijwHlWzzkLulsGHhjWQ==" \
              --arg jo "18.2.1" \
              --arg jourl "https://registry.npmjs.org/joi/-/joi-18.2.1.tgz" \
              --arg joint "sha512-2/OKlogiESf2Nh3TFCrRjrr9z1DRHeW0I+KReF67+4J0Ns+8hBtHRmoWAZ2OFU6I5+TWLEe6sVlSdXPjHm5UbQ==" \
              --arg hk "11.0.7" \
              --arg hkurl "https://registry.npmjs.org/@hapi/hoek/-/hoek-11.0.7.tgz" \
              --arg hkint "sha512-HV5undWkKzcB4RZUusqOpcgxOaq6VOAH7zhhIr2g3G8NF/MlFO75SjOr2NfuSx0Mh40+1FqCkagKLJRykUWoFQ==" \
              --arg ht "6.0.2" \
              --arg hturl "https://registry.npmjs.org/@hapi/topo/-/topo-6.0.2.tgz" \
              --arg htint "sha512-KR3rD5inZbGMrHmgPxsJ9dbi6zEK+C3ZwUwTa+eMwWLz7oijWUTWD2pMSNNYJAU6Qq+65NkxXjqHr/7LM2Xkqg==" \
              --arg ha "5.1.1" \
              --arg haurl "https://registry.npmjs.org/@hapi/address/-/address-5.1.1.tgz" \
              --arg haint "sha512-A+po2d/dVoY7cYajycYI43ZbYMXukuopIsqCjh5QzsBCipDtdofHntljDlpccMjIfTy6UOkg+5KPriwYch2bXA==" \
              --arg hf "3.0.2" \
              --arg hfurl "https://registry.npmjs.org/@hapi/formula/-/formula-3.0.2.tgz" \
              --arg hfint "sha512-hY5YPNXzw1He7s0iqkRQi+uMGh383CGdyyIGYtB+W5N3KHPXoqychklvHhKCC9M3Xtv0OCs/IHw+r4dcHtBYWw==" \
              --arg hp "2.0.1" \
              --arg hpurl "https://registry.npmjs.org/@hapi/pinpoint/-/pinpoint-2.0.1.tgz" \
              --arg hpint "sha512-EKQmr16tM8s16vTT3cA5L0kZZcTMU5DUOZTuvpnY738m+jyP3JIUj+Mm1xc1rsLkGBQ/gVnfKYPwOmPg1tUR4Q==" \
              --arg htl "1.1.1" \
              --arg htlurl "https://registry.npmjs.org/@hapi/tlds/-/tlds-1.1.1.tgz" \
              --arg htlint "sha512-cPvkhYDt73g2R7YW3RJb1POF2Gi0EtNoef4JAd03gSPrlG6Iy4X3FLr2vbedxno6JwIiyU8PVvdUiwO7zBHU3w==" \
              --arg ss "1.1.0" \
              --arg ssurl "https://registry.npmjs.org/@standard-schema/spec/-/spec-1.1.0.tgz" \
              --arg ssint "sha512-l2aFy5jALhniG5HgqrD6jXLi/rUWrKvqN/qJx6yoJsgKhblVd+iqqU4RCXavm/jPityDo5TCvKMnpjKnOriy0w==" \
              '
              .packages[""].dependencies["brace-expansion"] = "^5.0.9" |
              .packages[""].dependencies["fast-uri"] = "^3.1.5" |
              .packages[""].dependencies["js-yaml"] = "^4.3.1" |
              .packages[""].dependencies["joi"] = "^18.2.1" |
              .packages["node_modules/brace-expansion"].version = $be |
              .packages["node_modules/brace-expansion"].resolved = $beurl |
              .packages["node_modules/brace-expansion"].integrity = $beint |
              .packages["node_modules/fast-uri"].version = $fu |
              .packages["node_modules/fast-uri"].resolved = $fuurl |
              .packages["node_modules/fast-uri"].integrity = $uint |
              .packages["node_modules/js-yaml"].version = $jy |
              .packages["node_modules/js-yaml"].resolved = $jyurl |
              .packages["node_modules/js-yaml"].integrity = $jyint |
              .packages["node_modules/joi"].version = $jo |
              .packages["node_modules/joi"].resolved = $jourl |
              .packages["node_modules/joi"].integrity = $joint |
              .packages["node_modules/joi"].dependencies["@hapi/address"] = "^5.1.1" |
              .packages["node_modules/joi"].dependencies["@hapi/formula"] = "^3.0.2" |
              .packages["node_modules/joi"].dependencies["@hapi/hoek"] = "^11.0.7" |
              .packages["node_modules/joi"].dependencies["@hapi/pinpoint"] = "^2.0.1" |
              .packages["node_modules/joi"].dependencies["@hapi/tlds"] = "^1.1.1" |
              .packages["node_modules/joi"].dependencies["@hapi/topo"] = "^6.0.2" |
              .packages["node_modules/joi"].dependencies["@standard-schema/spec"] = "^1.1.0" |
              .packages["node_modules/@hapi/hoek"].version = $hk |
              .packages["node_modules/@hapi/hoek"].resolved = $hkurl |
              .packages["node_modules/@hapi/hoek"].integrity = $hkint |
              .packages["node_modules/@hapi/topo"].version = $ht |
              .packages["node_modules/@hapi/topo"].resolved = $hturl |
              .packages["node_modules/@hapi/topo"].integrity = $htint |
              .packages["node_modules/@hapi/address"].version = $ha |
              .packages["node_modules/@hapi/address"].resolved = $haurl |
              .packages["node_modules/@hapi/address"].integrity = $haint |
              .packages["node_modules/@hapi/address"].dependencies["@hapi/hoek"] = "^11.0.7" |
              .packages["node_modules/@hapi/topo"].dependencies["@hapi/hoek"] = "^11.0.7" |
              .packages["node_modules/@hapi/formula"].version = $hf |
              .packages["node_modules/@hapi/formula"].resolved = $hfurl |
              .packages["node_modules/@hapi/formula"].integrity = $hfint |
              .packages["node_modules/@hapi/pinpoint"].version = $hp |
              .packages["node_modules/@hapi/pinpoint"].resolved = $hpurl |
              .packages["node_modules/@hapi/pinpoint"].integrity = $hpint |
              .packages["node_modules/@hapi/tlds"].version = $htl |
              .packages["node_modules/@hapi/tlds"].resolved = $htlurl |
              .packages["node_modules/@hapi/tlds"].integrity = $htlint |
              .packages["node_modules/@standard-schema/spec"].version = $ss |
              .packages["node_modules/@standard-schema/spec"].resolved = $ssurl |
              .packages["node_modules/@standard-schema/spec"].integrity = $ssint
              ' "${lock}" > "${lock}.tmp"
            mv "${lock}.tmp" "${lock}"
        - name: rebuild rclone-arangodb
          uses: go/bump@v1
          with:
            deps:
              - golang.org/x/crypto@v0.55.0
              - golang.org/x/image@v0.45.0
            download: true
        - name: build rclone-arangodb
          uses: go/build@v1
          with:
            ldflags:
              - -s
              - -w
            output: ${target.dir}/usr/sbin/rclone-arangodb
            packages: .
        - uses: spdx@v1
          with:
            license: MIT
            name: rclone
            purl: pkg:golang/github.com/rclone/rclone@1.75.0
            version: 1.75.0
        - uses: spdx@v1
          with:
            license: ArangoDB-Community-License
            name: arangodb
            purl: pkg:generic/arangodb@3.12.11
            version: 3.12.11
        - uses: dhi/build-pkg:0
          work-dir: /
          with:
            depends:
              - debconf
            description: ArangoDB multi-model graph database
            files:
              - etc/arangodb3
              - usr/bin
              - usr/lib
              - usr/sbin
              - usr/share/arangodb3
            formats:
              - deb
            license: ArangoDB-Community-License
            name: arangodb
            rel: 0
            url: https://arangodb.com/
            version: 3.12.11
