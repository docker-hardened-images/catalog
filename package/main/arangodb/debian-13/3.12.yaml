dates:
  release: "2024-03-21"
vars:
  ARANGO_REPO: https://download.arangodb.com/9c169fe900ff79790395784287bfa82f0dc0059375a34a2881b9b745c8efd42e/arangodb312/DEBIAN
  COMMIT_SHA: 687d264b689b8c49a67e2e52a8a5e0caa01c04ce
  GOLANG_MAJOR_MINOR_VERSION: "1.26"
  GOLANG_VERSION: 1.26.8-0
