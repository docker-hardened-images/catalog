            gid: 0
          - url: https://registry.npmjs.org/@hapi/tlds/-/tlds-1.1.1.tgz
            checksum: sha256:8c2750e65b4d02b8d9ad4f5bd215de6432079f216fa81cda6b6f8877927d60df
            path: ${source.dir}/npm/hapi-tlds-1.1.1.tgz
            uid: 0
