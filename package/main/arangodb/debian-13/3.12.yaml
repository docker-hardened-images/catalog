contents:
  packages:
    - base-files
  builds:
    - name: arangodb
      work-dir: ${source.dir}/rclone
      contents:
        repositories:
          - deb [signed-by=/usr/share/keyrings/arango-keyring.gpg] https://download.arangodb.com/9c169fe900ff79790395784287bfa82f0dc0059375a34a2881b9b745c8efd42e/arangodb312/DEBIAN /
          - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
        keyring:
          - https://download.arangodb.com/9c169fe900ff79790395784287bfa82f0dc0059375a34a2881b9b745c8efd42e/arangodb312/DEBIAN/Release.key
          - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
        packages:
          - bash
          - ca-certificates
          - coreutils
          - dpkg
          - findutils
          - gzip
          - golang-1.26=1.26.8-0
          - golang-1.26-oci-config=1.26.8-0
          - jq
          - sed
          - arangodb3e=3.12.11-1
        files:
          - url: https://registry.npmjs.org/brace-expansion/-/brace-expansion-5.0.9.tgz
            checksum: sha256:5d06001fddd25cbee90c96db4dc5b7b57711b984c3141e28d10f143deb52dbaf
            path: ${source.dir}/npm/brace-expansion-5.0.9.tgz
            uid: 0
            gid: 0
          - url: https://registry.npmjs.org/fast-uri/-/fast-uri-3.1.6.tgz
            checksum: sha256:264af0e32c4b7b7bcb9ce5b4623c82469ee3e69ba5d171920f1762d626db1064
            path: ${source.dir}/npm/fast-uri-3.1.6.tgz
            uid: 0
            gid: 0
          - url: https://registry.npmjs.org/qs/-/qs-6.16.0.tgz
            checksum: sha256:f7a1bfc96c3a0c1172f1f3ef3c280f5ce8054841922e715f0d686da62d7beba4
            path: ${source.dir}/npm/qs-6.16.0.tgz
            uid: 0
            gid: 0
          - url: https://registry.npmjs.org/js-yaml/-/js-yaml-4.3.2.tgz
            checksum: sha256:c7b241d2224cf9253ff53854aa4cee87da91bd889c4d0fa3a3ffd1041ecee5b1
            path: ${source.dir}/npm/js-yaml-4.3.2.tgz
            uid: 0
            gid: 0
          - url: https://registry.npmjs.org/joi/-/joi-17.13.6.tgz
            checksum: sha256:7c909dbb502784662c48b1b8bd13f8470f5610b641396e38f054bc6687f0ee9d
            path: ${source.dir}/npm/joi-17.13.6.tgz
            uid: 0
            gid: 0
          - url: https://registry.npmjs.org/@hapi/hoek/-/hoek-9.3.0.tgz
            checksum: sha256:557ff1ff42d1ae2b5d73fda777d06d387ee17adf9e60dc179e975057c0af0066
            path: ${source.dir}/npm/hapi-hoek-9.3.0.tgz
            uid: 0
            gid: 0
          - url: https://registry.npmjs.org/@hapi/topo/-/topo-5.1.0.tgz
            checksum: sha256:863eec40657c5872ed794fb5c8fddcbdb126a4a53dde9c039cff72b97f7f963b
            path: ${source.dir}/npm/hapi-topo-5.1.0.tgz
            uid: 0
            gid: 0
          - url: https://registry.npmjs.org/@sideway/address/-/address-4.1.5.tgz
            checksum: sha256:9f1a715fc03cde9b89c80a127a578940f96459b9d9457e0951be6ece954df6d7
            path: ${source.dir}/npm/sideway-address-4.1.5.tgz
            uid: 0
            gid: 0
          - url: https://registry.npmjs.org/@sideway/formula/-/formula-3.0.1.tgz
            checksum: sha256:e1499a9ba6e64a6e821032e7aa40abc85de0a3b378368fe147f05823e767323e
            path: ${source.dir}/npm/sideway-formula-3.0.1.tgz
            uid: 0
            gid: 0
          - url: https://registry.npmjs.org/@sideway/pinpoint/-/pinpoint-2.0.0.tgz
            checksum: sha256:1841df300e2b8e0ff230a397b7efe665b73dbcbe102b4826e1dfd059e4c72a66
            path: ${source.dir}/npm/sideway-pinpoint-2.0.0.tgz
            uid: 0
            gid: 0
          - url: git+https://github.com/rclone/rclone.git#v1.75.1
            checksum: 687d264b689b8c49a67e2e52a8a5e0caa01c04ce
            path: ${source.dir}/rclone
            uid: 0
            gid: 0
      pipeline:
        - name: configure arangodb payload
          work-dir: /
          runs: |
            set -eux -o pipefail

            rm -f /bin/arangodb

            sed -ri \
              -e 's!127\.0\.0\.1!0.0.0.0!g' \
              -e 's!^(file\s*=\s*).*!\1 -!' \
              -e 's!^\s*uid\s*=.*!!' \
              /etc/arangodb3/arangod.conf
        - name: stage arangodb payload
          work-dir: /
          runs: |
            set -eux -o pipefail

            dpkg -L arangodb3e | while IFS= read -r path; do
              case "${path}" in
                /bin/arangodb) continue ;;
              esac
              [ -e "${path}" ] || continue
              case "${path}" in
                /*) dest="${target.dir}${path}" ;;
                *) continue ;;
              esac
              if [ -d "${path}" ]; then
                install -d "${dest}"
              elif [ -L "${path}" ]; then
                install -d "$(dirname "${dest}")"
                ln -sf "$(readlink "${path}")" "${dest}"
              else
                install -D "${path}" "${dest}"
              fi
            done
        - name: patch arangodb npm modules
          work-dir: /
          runs: |
            set -eux -o pipefail

            root="${target.dir}/usr/share/arangodb3/js/node"
            lock="${root}/package-lock.json"

            replace_npm_module() {
              local pkg="$1"
              local tgz="$2"
              local moddir="${root}/node_modules/${pkg}"

              rm -rf "${moddir}"
              mkdir -p "${moddir}"
              tar xzf "${tgz}" -C "${moddir}" --strip-components=1
            }

            replace_npm_module brace-expansion "${source.dir}/npm/brace-expansion-5.0.9.tgz"
            replace_npm_module fast-uri "${source.dir}/npm/fast-uri-3.1.6.tgz"
            replace_npm_module js-yaml "${source.dir}/npm/js-yaml-4.3.2.tgz"
            replace_npm_module joi "${source.dir}/npm/joi-17.13.6.tgz"
            replace_npm_module @hapi/hoek "${source.dir}/npm/hapi-hoek-9.3.0.tgz"
            replace_npm_module @hapi/topo "${source.dir}/npm/hapi-topo-5.1.0.tgz"
            replace_npm_module @sideway/address "${source.dir}/npm/sideway-address-4.1.5.tgz"
            replace_npm_module @sideway/formula "${source.dir}/npm/sideway-formula-3.0.1.tgz"
            replace_npm_module @sideway/pinpoint "${source.dir}/npm/sideway-pinpoint-2.0.0.tgz"

            rm -rf \
              "${root}/node_modules/@hapi/address" \
              "${root}/node_modules/@hapi/formula" \
              "${root}/node_modules/@hapi/pinpoint" \
              "${root}/node_modules/@hapi/tlds" \
              "${root}/node_modules/@standard-schema"

            addr="${root}/node_modules/@sideway/address/lib"
            sed -i \
              -e "s@URL: Url.URL .*@toASCII: (domain) => require('punycode').toASCII(domain)@" \
              -e 's@return new internals.URL.*@return internals.toASCII(domain);@' \
              "${addr}/domain.js"
            sed -i \
              "s@encoder: new (Util.TextEncoder .*@encoder: { encode: (str) => Buffer.from(str, 'utf8') }@" \
              "${addr}/email.js"

            grep -q "require('punycode').toASCII" "${addr}/domain.js"
            grep -q "internals.toASCII(domain)" "${addr}/domain.js"
            grep -q "Buffer.from(str, 'utf8')" "${addr}/email.js"

            cat >> "${root}/node_modules/joi/lib/index.js" << 'EOF'

            // DHI: joi 14 API compatibility for Foxx. default(value, description) vs joi 17 options.
            (function (Joi) {
              const seen = new Set();
              for (const type of Object.values(Joi.types())) {
                const proto = Object.getPrototypeOf(type);
                if (seen.has(proto)) {
                  continue;
                }
                seen.add(proto);

                const only = proto.only;
                proto.only = function (...args) {
                  if (!args.length || typeof args[0] === 'boolean') {
                    return only.apply(this, args);
                  }

                  const values = args.length === 1 && Array.isArray(args[0]) ? args[0] : args;
                  return this.valid(...values);
                };

                const base = proto.default;
                const wrappedDefault = function (value, desc) {
                  if (typeof desc !== 'string') {
                    return base.apply(this, arguments);
                  }
                  return base.call(this, value).description(desc);
                };
                for (const symbol of Object.getOwnPropertySymbols(base)) {
                  Object.defineProperty(
                    wrappedDefault,
                    symbol,
                    Object.getOwnPropertyDescriptor(base, symbol)
                  );
                }
                proto.default = wrappedDefault;
              }

              Joi.validate = function (value, ...args) {
                const callback = typeof args[args.length - 1] === 'function' ? args.pop() : null;
                const [schema, options] = args;
                const result = (schema === undefined ? Joi.any() : Joi.compile(schema)).validate(value, options);

                if (!callback) {
                  return result;
                }

                callback(result.error, result.value);
              };
            })(module.exports);
            EOF

            find "${root}/node_modules" -type d -name qs -print0 | while IFS= read -r -d '' qs_dir; do
              rm -rf "${qs_dir}"
              mkdir -p "${qs_dir}"
              tar xzf "${source.dir}/npm/qs-6.16.0.tgz" -C "${qs_dir}" --strip-components=1
            done

            # Roll forward every package-lock qs entry (root and nested) to 6.16.0.
            jq \
              --arg be "5.0.9" \
              --arg beurl "https://registry.npmjs.org/brace-expansion/-/brace-expansion-5.0.9.tgz" \
              --arg beint "sha512-ScQ4IuvIEF1TMlP7Zt+vjJ//9zlPb2SDcxWxM3bk8s6t6GGdJ7KO1dCcTidOPJKePW30LE/2cT7wCyPho9/Wxg==" \
              --arg fu "3.1.6" \
              --arg fuurl "https://registry.npmjs.org/fast-uri/-/fast-uri-3.1.6.tgz" \
              --arg uint "sha512-7Ical1vFEMr0onbVzEDIreM22I4khW+fzyQPwvAFWBp1iwdshSZRsL4jjRvPG9JP1uiqMHRto+YU6R2/CzDz5Q==" \
              --arg qs "6.16.0" \
              --arg qsurl "https://registry.npmjs.org/qs/-/qs-6.16.0.tgz" \
              --arg qsint "sha512-h6fhOIaRrID2CbEY2fqs+7t+UXZo+MLAnU5gRIq85uFtdiUPCdsApMlHhXogKVM4HM2DVbIjGNTTYH2OcmP1vA==" \
              --arg jy "4.3.2" \
              --arg jyurl "https://registry.npmjs.org/js-yaml/-/js-yaml-4.3.2.tgz" \
              --arg jyint "sha512-SFNOvSJ+Dgf/9An904Yx+CgSlIPCkIpao4qo51lpee25TIRejdH3rhR4EZMGoNx3/TP3O+wzWuiTFl4sqbltzA==" \
              --arg jo "17.13.6" \
              --arg jourl "https://registry.npmjs.org/joi/-/joi-17.13.6.tgz" \
              --arg joint "sha512-ImNZaq/LSysofih+xIGYfR0WUXMA9GLUNB//YTCSrZptoRmVgaNAdJyi6K1kXi9pkLEoSkoI8I4UwtNiu/D7nw==" \
              --arg hk "9.3.0" \
              --arg hkurl "https://registry.npmjs.org/@hapi/hoek/-/hoek-9.3.0.tgz" \
              --arg hkint "sha512-/c6rf4UJlmHlC9b5BaNvzAcFv7HZ2QHaV0D4/HNlBdvFnvQq8RI4kYdhyPCl7Xj+oWvTWQ8ujhqS53LIgAe6KQ==" \
              --arg ht "5.1.0" \
              --arg hturl "https://registry.npmjs.org/@hapi/topo/-/topo-5.1.0.tgz" \
              --arg htint "sha512-foQZKJig7Ob0BMAYBfcJk8d77QtOe7Wo4ox7ff1lQYoNNAb6jwcY1ncdoy2e9wQZzvNy7ODZCYJkK8kzmcAnAg==" \
              --arg sa "4.1.5" \
              --arg saurl "https://registry.npmjs.org/@sideway/address/-/address-4.1.5.tgz" \
              --arg saint "sha512-IqO/DUQHUkPeixNQ8n0JA6102hT9CmaljNTPmQ1u8MEhBo/R4Q8eKLN/vGZxuebwOroDB4cbpjheD4+/sKFK4Q==" \
              --arg sf "3.0.1" \
              --arg sfurl "https://registry.npmjs.org/@sideway/formula/-/formula-3.0.1.tgz" \
              --arg sfint "sha512-/poHZJJVjx3L+zVD6g9KgHfYnb443oi7wLu/XKojDviHy6HOEOA6z1Trk5aR1dGcmPenJEgb2sK2I80LeS3MIg==" \
              --arg sp "2.0.0" \
              --arg spurl "https://registry.npmjs.org/@sideway/pinpoint/-/pinpoint-2.0.0.tgz" \
              --arg spint "sha512-RNiOoTPkptFtSVzQevY/yWtZwf/RxyVnPy/OcA9HBM3MlGDnBEYL5B41H0MTn0Uec8Hi+2qUtTfG2WWZBmMejQ==" \
              '
              .packages[""].dependencies["brace-expansion"] = "^5.0.9" |
              .packages[""].dependencies["fast-uri"] = "^3.1.6" |
              .packages[""].dependencies["js-yaml"] = "^4.3.2" |
              .packages[""].dependencies["joi"] = "^17.13.6" |
              .packages["node_modules/brace-expansion"].version = $be |
              .packages["node_modules/brace-expansion"].resolved = $beurl |
              .packages["node_modules/brace-expansion"].integrity = $beint |
              .packages["node_modules/fast-uri"].version = $fu |
              .packages["node_modules/fast-uri"].resolved = $fuurl |
              .packages["node_modules/fast-uri"].integrity = $uint |
              .packages["node_modules/js-yaml"].version = $jy |
              .packages["node_modules/js-yaml"].resolved = $jyurl |
              .packages["node_modules/js-yaml"].integrity = $jyint |
              .packages["node_modules/joi"].version = $jo |
              .packages["node_modules/joi"].resolved = $jourl |
              .packages["node_modules/joi"].integrity = $joint |
              .packages["node_modules/joi"].dependencies["@hapi/hoek"] = "^9.3.0" |
              .packages["node_modules/joi"].dependencies["@hapi/topo"] = "^5.1.0" |
              .packages["node_modules/joi"].dependencies["@sideway/address"] = "^4.1.5" |
              .packages["node_modules/joi"].dependencies["@sideway/formula"] = "^3.0.1" |
              .packages["node_modules/joi"].dependencies["@sideway/pinpoint"] = "^2.0.0" |
              del(.packages["node_modules/joi"].dependencies["@hapi/address"]) |
              del(.packages["node_modules/joi"].dependencies["@hapi/formula"]) |
              del(.packages["node_modules/joi"].dependencies["@hapi/pinpoint"]) |
              del(.packages["node_modules/joi"].dependencies["@hapi/tlds"]) |
              del(.packages["node_modules/joi"].dependencies["@standard-schema/spec"]) |
              .packages["node_modules/@hapi/hoek"].version = $hk |
              .packages["node_modules/@hapi/hoek"].resolved = $hkurl |
              .packages["node_modules/@hapi/hoek"].integrity = $hkint |
              .packages["node_modules/@hapi/topo"].version = $ht |
              .packages["node_modules/@hapi/topo"].resolved = $hturl |
              .packages["node_modules/@hapi/topo"].integrity = $htint |
              .packages["node_modules/@hapi/topo"].dependencies["@hapi/hoek"] = "^9.3.0" |
              .packages["node_modules/@sideway/address"].version = $sa |
              .packages["node_modules/@sideway/address"].resolved = $saurl |
              .packages["node_modules/@sideway/address"].integrity = $saint |
              .packages["node_modules/@sideway/address"].dependencies["@hapi/hoek"] = "^9.0.0" |
              .packages["node_modules/@sideway/formula"].version = $sf |
              .packages["node_modules/@sideway/formula"].resolved = $sfurl |
              .packages["node_modules/@sideway/formula"].integrity = $sfint |
              .packages["node_modules/@sideway/pinpoint"].version = $sp |
              .packages["node_modules/@sideway/pinpoint"].resolved = $spurl |
              .packages["node_modules/@sideway/pinpoint"].integrity = $spint |
              del(.packages["node_modules/@hapi/address"]) |
              del(.packages["node_modules/@hapi/formula"]) |
              del(.packages["node_modules/@hapi/pinpoint"]) |
              del(.packages["node_modules/@hapi/tlds"]) |
              del(.packages["node_modules/@standard-schema/spec"]) |
              reduce (.packages | keys | map(select(test("/qs$")))[]) as $qk (.;
                .packages[$qk].version = $qs |
                .packages[$qk].resolved = $qsurl |
                .packages[$qk].integrity = $qsint
              )
              ' "${lock}" > "${lock}.tmp"
            mv "${lock}.tmp" "${lock}"
        - name: rebuild rclone-arangodb
          uses: go/bump@v1
          with:
            deps:
              - golang.org/x/crypto@v0.56.0
              - golang.org/x/image@v0.45.0
              - google.golang.org/grpc@v1.85.0-dev.0.20260825072537-93e31b48545e
            download: true
        - name: build rclone-arangodb
          uses: go/build@v1
          with:
            ldflags:
              - -s
              - -w
            output: ${target.dir}/usr/sbin/rclone-arangodb
            packages: .
        - uses: spdx@v1
          with:
            license: MIT
            name: rclone
            purl: pkg:golang/github.com/rclone/rclone@1.75.1
            version: 1.75.1
        - uses: spdx@v1
          with:
            license: ArangoDB-Community-License
            name: arangodb
            purl: pkg:generic/arangodb@3.12.11
            version: 3.12.11
        - uses: dhi/build-pkg:0
          work-dir: /
          with:
            depends:
              - debconf
            description: ArangoDB multi-model graph database
            files:
              - etc/arangodb3
              - usr/bin
              - usr/lib
              - usr/sbin
              - usr/share/arangodb3
            formats:
              - deb
            license: ArangoDB-Community-License
            name: arangodb
            rel: 5
            url: https://arangodb.com/
            version: 3.12.11
