# syntax=dhi.io/build:2-debian13

image: dhi.io/pkg-svhd-logto
variant: runtime
tags:
  - 1.45.0
  - 1.45.0-r1
  - 1.45.0-debian13
  - 1.45.0-r1-debian13
platforms:
  - linux/amd64
  - linux/arm64
dates:
  release: "2023-03-20"
vars:
  COMMIT_SHA: 94c088f9e4f87ba93df1f72ed20edf16ce364f61
  NODE_COREPACK_VERSION: 0.36.0-0
  NODEJS_VERSION: 22.23.4-1
  NPM_VERSION: 11.21.1-1
  PACKAGE_NAME: logto-1
  PNPM_VERSION: 10.34.9
  REL: "1"
  SEMVER_MAJOR_MINOR_VERSION: "1.45"
  SEMVER_MAJOR_VERSION: "1"
  SEMVER_VERSION: 1.45.0
  VERSION: 1.45.0
contents:
  repositories:
    - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
  keyring:
    - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
  packages:
    - base-files
  builds:
    - name: logto
      work-dir: ${source.dir}/logto
      environment:
        CI: "true"
        COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
        PNPM_HOME: /pnpm
        PUPPETEER_SKIP_DOWNLOAD: "true"
      caches:
        - path: /pnpm/store
      contents:
        packages:
          - bash
          - ca-certificates
          - coreutils
          - findutils
          - git
          - grep
          - libstdc++6
          - mawk
          - node-corepack=0.36.0-0
          - nodejs-22=22.23.4-1
          - npm=11.21.1-1
          - rsync
          - sed
        files:
          - url: git+https://github.com/logto-io/logto.git#v1.45.0
            checksum: 94c088f9e4f87ba93df1f72ed20edf16ce364f61
            path: ${source.dir}/logto
            spdx:
              name: logto
              version: 1.45.0
              packages:
                - name: logto
                  purl: pkg:github/logto-io/logto@1.45.0
                  license: MPL-2.0
            uid: 0
            gid: 0
      pipeline:
        - name: activate pnpm
          privileged: true
          runs: |
            set -eux -o pipefail

            test -d /usr/lib/nodejs/corepack/dist
            chmod +x /usr/lib/nodejs/corepack/dist/*.js
            corepack enable
            corepack prepare "pnpm@10.34.9" --activate
            pnpm config set store-dir /pnpm/store
            pnpm --version | grep -qx "10.34.9"
        - name: raise dependency floors
          uses: patch@v1
          work-dir: ${source.dir}/logto
          with:
            options: -p1
            patches:
              - ${source.dir}/patch/pnpm-overrides.patch
        - name: install and build
          privileged: true
          runs: |
            set -eux -o pipefail

            export PATH="/pnpm:${PATH}"
            export NODE_OPTIONS="--max-old-space-size=8192"

            pnpm install --frozen-lockfile
            pnpm -r build
            pnpm cli connector link -p .
        - name: production dependencies
          privileged: true
          runs: |
            set -eux -o pipefail

            export PATH="/pnpm:${PATH}"

            test -d node_modules
            rm -rf node_modules
            find packages -type d -name node_modules -prune -exec rm -rf {} +
            NODE_ENV=production pnpm install --frozen-lockfile
        - name: prune and stage
          runs: |
            set -eux -o pipefail

            test -d .scripts
            rm -rf .scripts
            if [ -e packages/cloud ]; then
              rm -rf packages/cloud
            fi
            test -f pnpm-lock.yaml
            rm pnpm-lock.yaml
            test -f pnpm-workspace.yaml
            rm pnpm-workspace.yaml
            test -d packages/integration-tests
            rm -rf packages/integration-tests
            test -f .gitpod.yml
            rm .gitpod.yml
            test -f commitlint.config.ts
            rm commitlint.config.ts
            test -f renovate.json
            rm renovate.json
            test -d .husky
            rm -rf .husky
            test -d .git
            rm -rf .git

            find . -type f -name '*.node' \( -path '*rollup*' -o -path '*@swc*' -o -path '*lightningcss*' \) -exec rm {} +
            native=$(find . -type f -name '*.node' | head -n 1)
            if [ -n "$native" ]; then
              echo "native addon remains in the staged tree: $native" >&2
              find . -type f -name '*.node' >&2
              exit 1
            fi

            test -d node_modules/.pnpm
            tsdir=$(find node_modules/.pnpm -maxdepth 1 -type d -name 'typescript@*' -print -quit)
            test -n "$tsdir"
            for devpkg in eslint husky typescript vite tsup jest; do
              if [ -e "node_modules/$devpkg" ] || [ -L "node_modules/$devpkg" ]; then
                rm -rf "node_modules/$devpkg"
              fi
              find node_modules/.pnpm -maxdepth 1 -type d -name "${devpkg}@*" -exec rm -rf {} +
              find . -type l -name "$devpkg" -exec rm {} +
              if [ -e "node_modules/$devpkg" ] || [ -L "node_modules/$devpkg" ]; then
                echo "dev package still installed: $devpkg" >&2
                exit 1
              fi
              left=$(find node_modules/.pnpm -maxdepth 1 -type d -name "${devpkg}@*" -print -quit)
              if [ -n "$left" ]; then
                echo "dev package still installed: $left" >&2
                exit 1
              fi
              linkleft=$(find . -type l -name "$devpkg" -print -quit)
              if [ -n "$linkleft" ]; then
                echo "dev package link remains: $linkleft" >&2
                exit 1
              fi
            done

            test -n "$(find node_modules/.pnpm -maxdepth 1 -type d -name '@esbuild+*' -print -quit)"
            test -n "$(find node_modules/.pnpm -maxdepth 1 -type d -name 'extract-zip@*' -print -quit)"
            find node_modules/.pnpm -maxdepth 1 -type d \( \
              -name 'esbuild@*' -o -name '@esbuild+*' -o \
              -name 'vitest@*' -o -name '@vitest+*' -o \
              -name 'puppeteer@*' -o -name '@puppeteer+*' -o \
              -name 'extract-zip@*' \
              \) -exec rm -rf {} +
            find . -type l \( -name esbuild -o -name vitest -o -name puppeteer -o -name extract-zip \) -exec rm {} +
            if [ -n "$(find . -type f -path '*/bin/esbuild' -print -quit)" ]; then
              echo "esbuild binary still staged" >&2
              exit 1
            fi
            if [ -n "$(find node_modules/.pnpm -maxdepth 1 -type d -name 'extract-zip@*' -print -quit)" ]; then
              echo "extract-zip still staged" >&2
              exit 1
            fi

            alt=$(find packages/schemas -type d -name alterations-js | head -n 1)
            test -n "$alt"
            test -n "$(find "$alt" -type f -name '*.js' | head -n 1)"

            test -d packages/cli
            mkdir -p packages/cli/alteration-scripts
            : > packages/cli/alteration-scripts/.keep
            extra=$(find packages/cli/alteration-scripts -mindepth 1 ! -name .keep -print -quit)
            if [ -n "$extra" ]; then
              echo "alteration-scripts has unexpected contents: $extra" >&2
              exit 1
            fi

            link=$(find packages/core/connectors -type l | head -n 1)
            test -n "$link"
            test -e "$link"

            test -d packages/console/dist
            if grep -R -a -F -q 'logto-oss-survey-prod.svhd.workers.dev' packages/console/dist; then
              echo "survey host is baked into the console bundle" >&2
              exit 1
            fi

            test -f LICENSE
            test -f package.json
            test -f packages/core/build/index.js
            test -f packages/cli/bin/logto.js

            set +e
            load_out=$(node packages/core/build/index.js 2>&1)
            load_code=$?
            set -e
            printf '%s\n' "$load_out"
            if printf '%s\n' "$load_out" | grep -q MODULE_NOT_FOUND; then
              echo "core failed to resolve a module" >&2
              exit 1
            fi
            printf '%s\n' "$load_out" | grep -q 'DB_URL'
            test "$load_code" -ne 0

            dest="${target.dir}/usr/lib/logto"
            mkdir -p "$dest"
            cp -a package.json LICENSE packages node_modules "$dest/"
        - name: javascript sbom
          uses: sbom@v1
          with:
            extra-scanners: javascript-package-cataloger
            prefix: logto-npm
            source: ${target.dir}/usr/lib/logto/node_modules
        - name: stage sbom
          runs: |
            set -eux -o pipefail

            test -d /opt/docker/sbom/logto
            test -d /opt/docker/sbom/logto-npm
            mkdir -p "${target.dir}/opt/docker/sbom"
            cp -a /opt/docker/sbom/logto /opt/docker/sbom/logto-npm "${target.dir}/opt/docker/sbom/"
        - uses: dhi/build-pkg:0
          with:
            apk:
              depends:
                - libstdc++
            deb:
              depends:
                - libstdc++6
                - coreutils
                - sed
            depends:
              - bash
              - nodejs-22
              - npm
            description: Logto identity and authentication service
            files:
              - opt/docker/sbom/logto
              - opt/docker/sbom/logto-npm
              - usr/lib/logto
            license: MPL-2.0
            name: logto-1
            rel: 1
            url: https://github.com/logto-io/logto
            version: 1.45.0
      paths:
        - type: file
          path: ${source.dir}/patch/pnpm-overrides.patch
          uid: 0
          gid: 0
          source: package/main/svhd-logto/patch/pnpm-overrides.patch
os-release:
  name: Docker Hardened Images (Debian)
  id: debian
  version-id: "13"
  version-codename: trixie
  pretty-name: Docker Hardened Images/Debian GNU/Linux 13 (trixie)
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
