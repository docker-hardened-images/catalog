# syntax=dhi.io/build:2-debian13

image: dhi.io/pkg-frr
variant: runtime
tags:
  - 10.7.1-0
  - 10.7.1-0-debian13
platforms:
  - linux/amd64
  - linux/arm64
dates:
  release: "2026-07-01"
vars:
  COMMIT_SHA: f8c0b08dcb0c78f9e42b9b86ae70b049e4e617c1
  DHI_REL: "0"
  DHI_VERSION: 10.7.1-0
  FRR_MAJOR_MINOR: "10.7"
  PACKAGE_NAME: frr-10.7
  PYTHON_MINOR: "3.12"
  PYTHON_VERSION: 3.12.14-1
  VERSION: 10.7.1
contents:
  repositories:
    - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
  keyring:
    - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
  packages:
    - '!base-files'
  builds:
    - name: frr deb
      work-dir: ${source.dir}/frr
      contents:
        repositories:
          - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
        keyring:
          - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
        packages:
          - autoconf
          - automake
          - bash
          - bison
          - build-essential
          - coreutils
          - debhelper
          - diffutils
          - dpkg-dev
          - findutils
          - flex
          - gawk
          - grep
          - gzip
          - libc-ares-dev
          - libcap-dev
          - libelf-dev
          - libjson-c-dev
          - libpcre2-dev
          - libprotobuf-c-dev
          - libreadline-dev
          - librtr-dev
          - libsnmp-dev
          - libssl-dev
          - libstdc++6
          - libtool
          - libyang-dev
          - m4
          - make
          - patch
          - pkg-config
          - protobuf-c-compiler
          - libpython-3.12-minimal=3.12.14-1
          - libpython-3.12-stdlib=3.12.14-1
          - libpython-3.12=3.12.14-1
          - libpython-3.12-dev=3.12.14-1
          - python-3.12-minimal=3.12.14-1
          - python-3.12=3.12.14-1
          - python-3.12-dev=3.12.14-1
          - python3-pip
          - python3-setuptools
          - python3-wheel
          - sed
        files:
          - url: git+https://github.com/FRRouting/frr.git#frr-10.7.1
            checksum: f8c0b08dcb0c78f9e42b9b86ae70b049e4e617c1
            path: ${source.dir}/frr
            spdx:
              name: frr
              version: 10.7.1
              packages:
                - name: frr
                  purl: pkg:dhi/frr@10.7.1
                  license: GPL-2.0
            uid: 0
            gid: 0
      pipeline:
        - name: fix docker-start script
          uses: git/patch@v1
          work-dir: ${source.dir}/frr
          with:
            patch: ${source.dir}/patch/docker-start.patch
        - name: patch out unnecessary root checks
          uses: git/patch@v1
          work-dir: ${source.dir}/frr
          with:
            patch: ${source.dir}/patch/remove-root-checks.patch
        - name: install pytest
          privileged: true
          runs: |
            set -eux -o pipefail

            pip install --break-system-packages pytest
        - name: prepare debian packaging
          runs: |
            set -eux -o pipefail

            rm -f debian/compat
            sed -i "s/@PKG@/frr-10.7/g" debian/control.in debian/changelog
            sed -i "s/@PYTHON_VERSION@/3.12.14-1/g" debian/control.in
            mv debian/control.in debian/control
            mv "debian/@PKG@.install" "debian/frr-10.7.install"
        - uses: dpkg/bump@v1
          with:
            changelog:
              - DHI Build
            version: 10.7.1-0
        - uses: dpkg/build@v1
          with:
            args: -b -uc -us -d
      paths:
        - type: directory
          path: ${source.dir}/frr/debian
          uid: 0
          gid: 0
          mode: "0600"
          source: package/main/frr/debian-13/debian
        - type: file
          path: ${source.dir}/patch/docker-start.patch
          uid: 0
          gid: 0
          source: package/main/frr/patch/docker-start.patch
        - type: file
          path: ${source.dir}/patch/remove-root-checks.patch
          uid: 0
          gid: 0
          source: package/main/frr/patch/remove-root-checks.patch
os-release:
  name: Docker Hardened Images (Debian)
  id: debian
  version-id: "13"
  version-codename: trixie
  pretty-name: Docker Hardened Images/Debian GNU/Linux 13 (trixie)
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
