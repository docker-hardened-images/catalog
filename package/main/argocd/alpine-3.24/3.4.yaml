# syntax=dhi.io/build:2-alpine3.24

image: dhi.io/pkg-argocd
variant: runtime
tags:
  - 3.4-alpine3.24
  - 3.4.8-alpine3.24
platforms:
  - linux/amd64
  - linux/arm64
dates:
  release: "2026-05-06"
vars:
  COMMIT_SHA: 609fa82ba26de2369c7b5138279f06a2af1d13a5
  GOLANG_MAJOR_MINOR_VERSION: "1.26"
  GOLANG_VERSION: 1.26.7-r0
  NODEJS_VERSION: 24.20.0-r0
  PACKAGE_NAME: argocd-3.4
  REL: "1"
  SEMVER_MAJOR_MINOR_VERSION: "3.4"
  SEMVER_MAJOR_VERSION: "3"
  SEMVER_VERSION: 3.4.8
  VERSION: 3.4.8
contents:
  repositories:
    - https://dhi.io/apk/alpine/v3.24/main
    - https://dhi.io/apk/alpine/v3.23/main
    - https://dl-cdn.alpinelinux.org/alpine/v3.24/main
    - https://dl-cdn.alpinelinux.org/alpine/v3.24/community
  keyring:
    - https://dhi.io/keyring/dhi-apk@docker-0F81AD7700D99184.rsa.pub
  packages:
    - alpine-baselayout-data
  builds:
    - name: argocd-3.4
      caches:
        - path: /go/pkg/mod
      contents:
        packages:
          - bash
          - busybox
          - ca-certificates-bundle
          - coreutils
          - curl
          - findutils
          - git
          - git-lfs
          - gnupg
          - grep
          - gzip
          - mawk
          - openssh-client
          - sed
          - util-linux
          - golang-1.26=1.26.7-r0
          - golang-1.26-oci-config=1.26.7-r0
          - nodejs-24=24.20.0-r0
          - npm
          - yarn
        files:
          - url: git+https://github.com/argoproj/argo-cd.git#v3.4.8
            checksum: 609fa82ba26de2369c7b5138279f06a2af1d13a5
            path: /go/src/github.com/argoproj/argo-cd/v3
            spdx:
              name: argocd
              version: 3.4.8
              packages:
                - name: argocd
                  purl: pkg:dhi/argocd@3.4.8
                  license: Apache-2.0
            uid: 0
            gid: 0
      pipeline:
        - name: patch-go (3.4 only)
          uses: go/bump@v2
          work-dir: /go/src/github.com/argoproj/argo-cd/v3
          caches:
            - path: /go/pkg/mod
          with:
            deps:
              - golang.org/x/text@v0.39.0
              - golang.org/x/net@v0.56.0
              - github.com/cloudflare/circl@v1.6.3
              - github.com/go-git/go-git/v5@v5.19.2
              - github.com/klauspost/compress@v1.18.7
              - github.com/moby/spdystream@v0.5.1
              - github.com/slack-go/slack@v0.23.1
              - go.opentelemetry.io/otel@v1.44.0
              - go.opentelemetry.io/otel/sdk@v1.43.0
              - google.golang.org/grpc@v1.82.1
              - oras.land/oras-go/v2@v2.6.2
            replaces:
              - oras.land/oras-go/v2=oras.land/oras-go/v2@v2.6.2
            tidy: true
        - name: patch-node
          uses: yarn/bump@v2
          caches:
            - path: /root/.cache/yarn
          with:
            bumps: ${source.dir}/patch/yarn-patches-3.4.json
            yarn-root: /go/src/github.com/argoproj/argo-cd/v3/ui
        - name: build-ui (yarn)
          work-dir: /go/src/github.com/argoproj/argo-cd/v3/ui
          privileged: true
          caches:
            - path: /root/.cache/yarn
          runs: |
            set -eux -o pipefail

            yarn
            yarn run build
        - name: prepare ui for sbom (yarn)
          work-dir: /go/src/github.com/argoproj/argo-cd/v3/ui
          privileged: true
          caches:
            - path: /root/.cache/yarn
          runs: |
            set -eux -o pipefail

            rm -rf node_modules
            yarn remove tsx
            yarn remove react-hot-loader # CVE-2025-57352
            yarn install --production
        - name: ui-sbom
          uses: sbom@v1
          with:
            prefix: argocd-ui
            source: /go/src/github.com/argoproj/argo-cd/v3/ui
        - name: build
          uses: go/build@v1
          work-dir: /go/src/github.com/argoproj/argo-cd/v3
          environment:
            GODEBUG: tarinsecurepath=0,zipinsecurepath=0
          caches:
            - path: /go/pkg/mod
          with:
            ldflags:
              - -extldflags '-static'
              - -X github.com/argoproj/argo-cd/v3/common.version=3.4.8
              - -X github.com/argoproj/argo-cd/v3/common.gitTag=v3.4.8
              - -X github.com/argoproj/argo-cd/v3/common.buildDate=$(date -ud @${SOURCE_DATE_EPOCH} +'%Y-%m-%dT%H:%M:%SZ')
              - -X github.com/argoproj/argo-cd/v3/common.gitCommit=609fa82ba26de2369c7b5138279f06a2af1d13a5
              - -X github.com/argoproj/argo-cd/v3/common.gitTreeState=clean
              - -X github.com/argoproj/argo-cd/v3/common.kubectlVersion=$(go list -m k8s.io/client-go | head -n 1 | rev | cut -d' ' -f1 | rev)
            output: ${target.dir}/usr/bin/argocd
            packages: ./cmd
        - name: build dev
          uses: go/build@v1
          work-dir: /go/src/github.com/argoproj/argo-cd/v3
          environment:
            GODEBUG: tarinsecurepath=0,zipinsecurepath=0
          caches:
            - path: /go/pkg/mod
          with:
            ldflags:
              - -extldflags '-static'
              - -X github.com/argoproj/argo-cd/v3/common.version=3.4.8
              - -X github.com/argoproj/argo-cd/v3/common.gitTag=v3.4.8
              - -X github.com/argoproj/argo-cd/v3/common.buildDate=$(date -ud @${SOURCE_DATE_EPOCH} +'%Y-%m-%dT%H:%M:%SZ')
              - -X github.com/argoproj/argo-cd/v3/common.gitCommit=609fa82ba26de2369c7b5138279f06a2af1d13a5
              - -X github.com/argoproj/argo-cd/v3/common.gitTreeState=clean
              - -X github.com/argoproj/argo-cd/v3/common.kubectlVersion=$(go list -m k8s.io/client-go | head -n 1 | rev | cut -d' ' -f1 | rev)
            output: ${target.dir}/usr/bin/argocd-dev
            packages: ./cmd
            strip: false
        - name: stage wrapper scripts
          runs: |
            set -eux -o pipefail

            install -m 0755 /go/src/github.com/argoproj/argo-cd/v3/hack/gpg-wrapper.sh "${target.dir}/usr/bin/gpg-wrapper.sh"
            install -m 0755 /go/src/github.com/argoproj/argo-cd/v3/hack/git-verify-wrapper.sh "${target.dir}/usr/bin/git-verify-wrapper.sh"
        - name: stage sbom
          runs: |
            set -eux -o pipefail

            mkdir -p "${target.dir}/opt/docker/sbom"
            cp -a /opt/docker/sbom/argocd-ui "${target.dir}/opt/docker/sbom/"
            if [ -d /opt/docker/sbom/argocd ]; then
              cp -a /opt/docker/sbom/argocd "${target.dir}/opt/docker/sbom/"
            fi
        - uses: dhi/build-pkg:0
          with:
            description: Argo CD
            files:
              - usr/bin/argocd
              - usr/bin/gpg-wrapper.sh
              - usr/bin/git-verify-wrapper.sh
              - opt/docker/sbom/argocd-ui
            license: Apache-2.0
            name: argocd-3.4
            provides: argocd=$pkg_full_version
            rel: 1
            replaces: argocd
            subpackages:
              - files:
                  - path: usr/bin/argocd
                    source: usr/bin/argocd-dev
                name: argocd-3.4-dev
            url: https://github.com/argoproj/argo-cd
            version: 3.4.8
      paths:
        - type: file
          path: ${source.dir}/patch/yarn-patches-3.4.json
          uid: 0
          gid: 0
          source: package/main/argocd/patch/yarn-patches-3.4.json
os-release:
  name: Docker Hardened Images (Alpine)
  id: alpine
  version-id: "3.24"
  pretty-name: Docker Hardened Images/Alpine Linux v3.24
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
