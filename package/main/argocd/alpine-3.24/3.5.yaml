# syntax=dhi.io/build:2-alpine3.24

image: dhi.io/pkg-argocd
variant: runtime
tags:
  - 3.5.2-alpine3.24
  - 3.5.2-r3-alpine3.24
platforms:
  - linux/amd64
  - linux/arm64
dates:
  release: "2026-08-04"
vars:
  COMMIT_SHA: e258ee23c3e52266d407572f4bcdfe7d9ed36cb5
  GOLANG_MAJOR_MINOR_VERSION: "1.26"
  GOLANG_VERSION: 1.26.8-r0
  NODEJS_VERSION: 24.20.0-r0
  PACKAGE_NAME: argocd-3.5
  REL: "3"
  SEMVER_MAJOR_MINOR_VERSION: "3.5"
  SEMVER_MAJOR_VERSION: "3"
  SEMVER_VERSION: 3.5.2
  VERSION: 3.5.2
contents:
  repositories:
    - https://dhi.io/apk/alpine/v3.24/main
    - https://dhi.io/apk/alpine/v3.23/main
    - https://dl-cdn.alpinelinux.org/alpine/v3.24/main
    - https://dl-cdn.alpinelinux.org/alpine/v3.24/community
  keyring:
    - https://dhi.io/keyring/dhi-apk@docker-0F81AD7700D99184.rsa.pub
  packages:
    - alpine-baselayout-data
  builds:
    - name: argocd-3.5
      caches:
        - path: /go/pkg/mod
      contents:
        packages:
          - bash
          - busybox
          - ca-certificates-bundle
          - coreutils
          - curl
          - findutils
          - git
          - git-lfs
          - gnupg
          - grep
          - gzip
          - mawk
          - openssh-client
          - sed
          - util-linux
          - golang-1.26=1.26.8-r0
          - golang-1.26-oci-config=1.26.8-r0
          - nodejs-24=24.20.0-r0
          - npm
          - yarn
        files:
          - url: git+https://github.com/argoproj/argo-cd.git#v3.5.2
            checksum: e258ee23c3e52266d407572f4bcdfe7d9ed36cb5
            path: /go/src/github.com/argoproj/argo-cd/v3
            spdx:
              name: argocd
              version: 3.5.2
              packages:
                - name: argocd
                  purl: pkg:dhi/argocd@3.5.2
                  license: Apache-2.0
            uid: 0
            gid: 0
      pipeline:
        - name: patch-go (3.5 only)
          uses: go/bump@v2
          work-dir: /go/src/github.com/argoproj/argo-cd/v3
          caches:
            - path: /go/pkg/mod
          with:
            deps:
              - github.com/go-git/go-git/v5@v5.19.2
              - github.com/klauspost/compress@v1.18.7
              - github.com/slack-go/slack@v0.23.1
              - google.golang.org/grpc@v1.83.1
              - oras.land/oras-go/v2@v2.6.2
            replaces:
              - oras.land/oras-go/v2=oras.land/oras-go/v2@v2.6.2
            tidy: true
        - name: bump-pnpm (3.5 only)
          work-dir: /go/src/github.com/argoproj/argo-cd/v3/ui
          privileged: true
          environment:
            PNPM_HOME: /pnpm
          caches:
            - path: /pnpm/store
          runs: |
            set -eux -o pipefail

            npm install -g pnpm@10.28.1
            pnpm config set store-dir /pnpm/store

            npm pkg set pnpm.overrides.formidable=2.1.3
            npm pkg set pnpm.overrides.js-yaml=4.3.1
            npm pkg set pnpm.overrides.minimatch=5.1.8
            npm pkg set pnpm.overrides.lodash-es=4.18.1
            npm pkg set pnpm.overrides.lodash=4.18.1
            npm pkg set pnpm.overrides.fast-xml-parser=5.7.0
            npm pkg set pnpm.overrides.dompurify=3.4.13
            npm pkg set pnpm.overrides.form-data=4.0.6
            npm pkg set pnpm.overrides.qs=6.16.0 # CVE-2026-82562, CVE-2026-82417
            npm pkg set pnpm.overrides.yaml=1.10.3
            npm pkg set pnpm.overrides.unidiff=1.0.4
            npm pkg set pnpm.overrides.date-fns=4.1.0
            npm pkg set pnpm.overrides.uuid=11.1.1
            npm pkg set pnpm.overrides.brace-expansion=5.0.9 # CVE-2026-69152
            npm pkg set pnpm.overrides.linkify-it=5.0.2      # CVE-2026-48801, CVE-2026-59887

            npm pkg delete dependencies.tsx devDependencies.tsx
            npm pkg delete dependencies.react-hot-loader devDependencies.react-hot-loader # CVE-2025-57352

            pnpm install --lockfile-only
        - name: build-ui (pnpm, 3.5 only)
          work-dir: /go/src/github.com/argoproj/argo-cd/v3/ui
          privileged: true
          environment:
            NODE_ENV: production
            NODE_ONLINE_ENV: online
            PNPM_HOME: /pnpm
          caches:
            - path: /pnpm/store
          runs: |
            set -eux -o pipefail

            pnpm install
            pnpm build
        - name: prepare ui for sbom (pnpm, 3.5 only)
          work-dir: /go/src/github.com/argoproj/argo-cd/v3/ui
          privileged: true
          environment:
            PNPM_HOME: /pnpm
          caches:
            - path: /pnpm/store
          runs: |
            set -eux -o pipefail

            rm -rf node_modules
            pnpm install --prod
        - name: ui-sbom
          uses: sbom@v1
          with:
            prefix: argocd-ui
            source: /go/src/github.com/argoproj/argo-cd/v3/ui
        - name: build
          uses: go/build@v1
          work-dir: /go/src/github.com/argoproj/argo-cd/v3
          environment:
            GODEBUG: tarinsecurepath=0,zipinsecurepath=0
          caches:
            - path: /go/pkg/mod
          with:
            ldflags:
              - -extldflags '-static'
              - -X github.com/argoproj/argo-cd/v3/common.version=3.5.2
              - -X github.com/argoproj/argo-cd/v3/common.gitTag=v3.5.2
              - -X github.com/argoproj/argo-cd/v3/common.buildDate=$(date -ud @${SOURCE_DATE_EPOCH} +'%Y-%m-%dT%H:%M:%SZ')
              - -X github.com/argoproj/argo-cd/v3/common.gitCommit=e258ee23c3e52266d407572f4bcdfe7d9ed36cb5
              - -X github.com/argoproj/argo-cd/v3/common.gitTreeState=clean
              - -X github.com/argoproj/argo-cd/v3/common.kubectlVersion=$(go list -m k8s.io/client-go | head -n 1 | rev | cut -d' ' -f1 | rev)
            output: ${target.dir}/usr/bin/argocd
            packages: ./cmd
        - name: build dev
          uses: go/build@v1
          work-dir: /go/src/github.com/argoproj/argo-cd/v3
          environment:
            GODEBUG: tarinsecurepath=0,zipinsecurepath=0
          caches:
            - path: /go/pkg/mod
          with:
            ldflags:
              - -extldflags '-static'
              - -X github.com/argoproj/argo-cd/v3/common.version=3.5.2
              - -X github.com/argoproj/argo-cd/v3/common.gitTag=v3.5.2
              - -X github.com/argoproj/argo-cd/v3/common.buildDate=$(date -ud @${SOURCE_DATE_EPOCH} +'%Y-%m-%dT%H:%M:%SZ')
              - -X github.com/argoproj/argo-cd/v3/common.gitCommit=e258ee23c3e52266d407572f4bcdfe7d9ed36cb5
              - -X github.com/argoproj/argo-cd/v3/common.gitTreeState=clean
              - -X github.com/argoproj/argo-cd/v3/common.kubectlVersion=$(go list -m k8s.io/client-go | head -n 1 | rev | cut -d' ' -f1 | rev)
            output: ${target.dir}/usr/bin/argocd-dev
            packages: ./cmd
            strip: false
        - name: stage wrapper scripts
          runs: |
            set -eux -o pipefail

            install -m 0755 /go/src/github.com/argoproj/argo-cd/v3/hack/gpg-wrapper.sh "${target.dir}/usr/bin/gpg-wrapper.sh"
            install -m 0755 /go/src/github.com/argoproj/argo-cd/v3/hack/git-verify-wrapper.sh "${target.dir}/usr/bin/git-verify-wrapper.sh"
        - name: stage sbom
          runs: |
            set -eux -o pipefail

            mkdir -p "${target.dir}/opt/docker/sbom"
            cp -a /opt/docker/sbom/argocd-ui "${target.dir}/opt/docker/sbom/"
            if [ -d /opt/docker/sbom/argocd ]; then
              cp -a /opt/docker/sbom/argocd "${target.dir}/opt/docker/sbom/"
            fi
        - uses: dhi/build-pkg:0
          with:
            description: Argo CD
            files:
              - usr/bin/argocd
              - usr/bin/gpg-wrapper.sh
              - usr/bin/git-verify-wrapper.sh
              - opt/docker/sbom/argocd-ui
            license: Apache-2.0
            name: argocd-3.5
            provides: argocd=$pkg_full_version
            rel: 3
            replaces: argocd
            subpackages:
              - files:
                  - path: usr/bin/argocd
                    source: usr/bin/argocd-dev
                name: argocd-3.5-dev
            url: https://github.com/argoproj/argo-cd
            version: 3.5.2
os-release:
  name: Docker Hardened Images (Alpine)
  id: alpine
  version-id: "3.24"
  pretty-name: Docker Hardened Images/Alpine Linux v3.24
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
