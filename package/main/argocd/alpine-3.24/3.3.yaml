# syntax=dhi.io/build:2-alpine3.24

image: dhi.io/pkg-argocd
variant: runtime
tags:
  - 3.3-alpine3.24
  - 3.3.18-alpine3.24
  - 3.3.18-r2-alpine3.24
platforms:
  - linux/amd64
  - linux/arm64
dates:
  release: "2025-11-04"
vars:
  COMMIT_SHA: d0b5dfda404d4c0d5f364c0bb7561dad023a7f00
  GOLANG_MAJOR_MINOR_VERSION: "1.26"
  GOLANG_VERSION: 1.26.10-r0
  NODEJS_VERSION: 24.22.1-r1
  PACKAGE_NAME: argocd-3.3
  REL: "2"
  SEMVER_MAJOR_MINOR_VERSION: "3.3"
  SEMVER_MAJOR_VERSION: "3"
  SEMVER_VERSION: 3.3.18
  VERSION: 3.3.18
contents:
  repositories:
    - https://dhi.io/apk/alpine/v3.24/main
    - https://dhi.io/apk/alpine/v3.23/main
    - https://dl-cdn.alpinelinux.org/alpine/v3.24/main
    - https://dl-cdn.alpinelinux.org/alpine/v3.24/community
  keyring:
    - https://dhi.io/keyring/dhi-apk@docker-0F81AD7700D99184.rsa.pub
  packages:
    - alpine-baselayout-data
  builds:
    - name: argocd-3.3
      caches:
        - path: /go/pkg/mod
      contents:
        packages:
          - bash
          - busybox
          - ca-certificates-bundle
          - coreutils
          - curl
          - findutils
          - git
          - git-lfs
          - gnupg
          - grep
          - gzip
          - mawk
          - openssh-client
          - sed
          - util-linux
          - golang-1.26=1.26.10-r0
          - golang-1.26-oci-config=1.26.10-r0
          - nodejs-24=24.22.1-r1
          - npm
          - yarn
        files:
          - url: git+https://github.com/argoproj/argo-cd.git#v3.3.18
            checksum: d0b5dfda404d4c0d5f364c0bb7561dad023a7f00
            path: /go/src/github.com/argoproj/argo-cd/v3
            spdx:
              name: argocd
              version: 3.3.18
              packages:
                - name: argocd
                  purl: pkg:dhi/argocd@3.3.18
                  license: Apache-2.0
            uid: 0
            gid: 0
      pipeline:
        - name: patch-go (3.3 only)
          uses: go/bump@v2
          work-dir: /go/src/github.com/argoproj/argo-cd/v3
          caches:
            - path: /go/pkg/mod
          with:
            deps:
              - golang.org/x/net@v0.62.0
              - github.com/cloudflare/circl@v1.6.3
              - github.com/go-git/go-git/v5@v5.19.2
              - github.com/go-jose/go-jose/v4@v4.1.6
              - github.com/klauspost/compress@v1.18.7
              - github.com/moby/spdystream@v0.5.1
              - github.com/slack-go/slack@v0.23.1
              - go.mongodb.org/mongo-driver@v1.17.7
              - go.opentelemetry.io/otel/exporters/otlp/otlptrace@v1.46.0
              - google.golang.org/grpc@v1.85.0-dev.0.20260825072537-93e31b48545e
              - go.opentelemetry.io/otel/exporters/otlp/otlptrace/otlptracegrpc@v1.46.0
              - oras.land/oras-go/v2@v2.6.2
            replaces:
              - oras.land/oras-go/v2=oras.land/oras-go/v2@v2.6.2
            tidy: true
        - name: patch-node
          uses: yarn/bump@v2
          caches:
            - path: /root/.cache/yarn
          with:
            bumps: ${source.dir}/patch/yarn-patches-3.3.json
            yarn-root: /go/src/github.com/argoproj/argo-cd/v3/ui
        - name: reconcile-ui-yarn-deps
          work-dir: /go/src/github.com/argoproj/argo-cd/v3/ui
          privileged: true
          caches:
            - path: /root/.cache/yarn
          runs: |
            set -eux -o pipefail

            yarn install --ignore-scripts
            assert_version_absent() {
              pattern="$1"
              selector="$2"
              label="$3"
              matches="$(find node_modules -path "${selector}" -exec grep -l -F -- "${pattern}" {} + || true)"
              if [ -n "${matches}" ]; then
                echo "forbidden ${label} still installed:" >&2
                printf '%s\n' "${matches}" >&2
                exit 1
              fi
            }
            assert_version_absent '"version": "2.1.4"' '*/brace-expansion/package.json' 'brace-expansion 2.1.4'
            assert_version_absent '"version": "2.29.4"' '*/moment/package.json' 'moment 2.29.4'
            assert_version_absent '"version": "3.4.16"' '*/dompurify/package.json' 'dompurify 3.4.16'
        - name: build-ui (yarn)
          work-dir: /go/src/github.com/argoproj/argo-cd/v3/ui
          privileged: true
          caches:
            - path: /root/.cache/yarn
          runs: |
            set -eux -o pipefail

            yarn run build
        - name: prepare ui for sbom (yarn)
          work-dir: /go/src/github.com/argoproj/argo-cd/v3/ui
          privileged: true
          caches:
            - path: /root/.cache/yarn
          runs: |
            set -eux -o pipefail

            rm -rf node_modules
            yarn remove tsx
            yarn remove react-hot-loader # CVE-2025-57352
            yarn install --production
        - name: ui-sbom
          uses: sbom@v1
          with:
            prefix: argocd-ui
            source: /go/src/github.com/argoproj/argo-cd/v3/ui
        - name: build
          uses: go/build@v1
          work-dir: /go/src/github.com/argoproj/argo-cd/v3
          environment:
            GODEBUG: tarinsecurepath=0,zipinsecurepath=0
          caches:
            - path: /go/pkg/mod
          with:
            ldflags:
              - -extldflags '-static'
              - -X github.com/argoproj/argo-cd/v3/common.version=3.3.18
              - -X github.com/argoproj/argo-cd/v3/common.gitTag=v3.3.18
              - -X github.com/argoproj/argo-cd/v3/common.buildDate=$(date -ud @${SOURCE_DATE_EPOCH} +'%Y-%m-%dT%H:%M:%SZ')
              - -X github.com/argoproj/argo-cd/v3/common.gitCommit=d0b5dfda404d4c0d5f364c0bb7561dad023a7f00
              - -X github.com/argoproj/argo-cd/v3/common.gitTreeState=clean
              - -X github.com/argoproj/argo-cd/v3/common.kubectlVersion=$(go list -m k8s.io/client-go | head -n 1 | rev | cut -d' ' -f1 | rev)
            output: ${target.dir}/usr/bin/argocd
            packages: ./cmd
        - name: build dev
          uses: go/build@v1
          work-dir: /go/src/github.com/argoproj/argo-cd/v3
          environment:
            GODEBUG: tarinsecurepath=0,zipinsecurepath=0
          caches:
            - path: /go/pkg/mod
          with:
            ldflags:
              - -extldflags '-static'
              - -X github.com/argoproj/argo-cd/v3/common.version=3.3.18
              - -X github.com/argoproj/argo-cd/v3/common.gitTag=v3.3.18
              - -X github.com/argoproj/argo-cd/v3/common.buildDate=$(date -ud @${SOURCE_DATE_EPOCH} +'%Y-%m-%dT%H:%M:%SZ')
              - -X github.com/argoproj/argo-cd/v3/common.gitCommit=d0b5dfda404d4c0d5f364c0bb7561dad023a7f00
              - -X github.com/argoproj/argo-cd/v3/common.gitTreeState=clean
              - -X github.com/argoproj/argo-cd/v3/common.kubectlVersion=$(go list -m k8s.io/client-go | head -n 1 | rev | cut -d' ' -f1 | rev)
            output: ${target.dir}/usr/bin/argocd-dev
            packages: ./cmd
            strip: false
        - name: stage wrapper scripts
          runs: |
            set -eux -o pipefail

            install -m 0755 /go/src/github.com/argoproj/argo-cd/v3/hack/gpg-wrapper.sh "${target.dir}/usr/bin/gpg-wrapper.sh"
            install -m 0755 /go/src/github.com/argoproj/argo-cd/v3/hack/git-verify-wrapper.sh "${target.dir}/usr/bin/git-verify-wrapper.sh"
        - name: stage sbom
          runs: |
            set -eux -o pipefail

            mkdir -p "${target.dir}/opt/docker/sbom"
            cp -a /opt/docker/sbom/argocd-ui "${target.dir}/opt/docker/sbom/"
            if [ -d /opt/docker/sbom/argocd ]; then
              cp -a /opt/docker/sbom/argocd "${target.dir}/opt/docker/sbom/"
            fi
        - uses: dhi/build-pkg:0
          with:
            description: Argo CD
            files:
              - usr/bin/argocd
              - usr/bin/gpg-wrapper.sh
              - usr/bin/git-verify-wrapper.sh
              - opt/docker/sbom/argocd-ui
            license: Apache-2.0
            name: argocd-3.3
            provides: argocd=$pkg_full_version
            rel: 2
            replaces: argocd
            subpackages:
              - files:
                  - path: usr/bin/argocd
                    source: usr/bin/argocd-dev
                name: argocd-3.3-dev
            url: https://github.com/argoproj/argo-cd
            version: 3.3.18
      paths:
        - type: file
          path: ${source.dir}/patch/yarn-patches-3.3.json
          uid: 0
          gid: 0
          source: package/main/argocd/patch/yarn-patches-3.3.json
os-release:
  name: Docker Hardened Images (Alpine)
  id: alpine
  version-id: "3.24"
  pretty-name: Docker Hardened Images/Alpine Linux v3.24
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
