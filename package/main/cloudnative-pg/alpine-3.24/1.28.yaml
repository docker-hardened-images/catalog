# syntax=dhi.io/build:2-alpine3.24

image: dhi.io/pkg-cloudnative-pg
variant: runtime
tags:
  - 1.28.4-alpine3.24
  - 1.28.4-r13-alpine3.24
platforms:
  - linux/amd64
  - linux/arm64
dates:
  release: "2025-12-09"
  end-of-life: "2026-06-30"
vars:
  COMMIT_SHA: f74344b4d3a6d9fbe06748ba1747901f6077db2a
  GOLANG_MAJOR_MINOR_VERSION: "1.26"
  GOLANG_VERSION: 1.26.11-r1
  PACKAGE_NAME: cloudnative-pg-1.28
  REL: "13"
  SEMVER_MAJOR_MINOR_VERSION: "1.28"
  SEMVER_MAJOR_VERSION: "1"
  SEMVER_VERSION: 1.28.4
  VERSION: 1.28.4
contents:
  repositories:
    - https://dhi.io/apk/alpine/v3.24/main
    - https://dhi.io/apk/alpine/v3.23/main
    - https://dl-cdn.alpinelinux.org/alpine/v3.24/main
    - https://dl-cdn.alpinelinux.org/alpine/v3.24/community
  keyring:
    - https://dhi.io/keyring/dhi-apk@docker-0F81AD7700D99184.rsa.pub
  packages:
    - alpine-baselayout-data
  builds:
    - name: cloudnative-pg-1.28
      work-dir: /go/src/github.com/cloudnative-pg/cloudnative-pg
      environment:
        GOTOOLCHAIN: local
      contents:
        packages:
          - busybox
          - bash
          - ca-certificates-bundle
          - coreutils
          - findutils
          - make
          - mawk
          - sed
          - golang-1.26=1.26.11-r1
          - golang-1.26-oci-config=1.26.11-r1
        files:
          - url: git+https://github.com/cloudnative-pg/cloudnative-pg.git#v1.28.4
            checksum: f74344b4d3a6d9fbe06748ba1747901f6077db2a
            path: /go/src/github.com/cloudnative-pg/cloudnative-pg
            spdx:
              name: cloudnative-pg
              version: 1.28.4
              packages:
                - name: cloudnative-pg
                  purl: pkg:golang/github.com/cloudnative-pg/cloudnative-pg@1.28.4
                  license: Apache-2.0
            uid: 0
            gid: 0
      pipeline:
        - name: update go dependencies (1.28 only)
          uses: go/bump@v2
          with:
            deps:
              - golang.org/x/text@v0.39.0
              - golang.org/x/net@v0.62.0
              - github.com/moby/spdystream@v0.5.1
              - google.golang.org/grpc@v1.83.2
            tidy: true
        - name: test
          runs: |
            set -eux -o pipefail

            go test ./pkg/... -count=1 -timeout 10m -skip '^TestPostgres$'
        - name: create output directories
          runs: |
            set -eux -o pipefail

            mkdir -p ${target.dir}/operator ${target.dir}/operator-dev ${target.dir}/usr/bin
        - name: build manager for amd64
          uses: go/build@v1
          environment:
            GOFLAGS: -buildvcs=false
          with:
            extra-env: GOOS=linux GOARCH=amd64
            fips: false
            ldflags:
              - -X github.com/cloudnative-pg/cloudnative-pg/pkg/versions.buildVersion=1.28.4
              - -X github.com/cloudnative-pg/cloudnative-pg/pkg/versions.buildCommit=f74344b4d3a6d9fbe06748ba1747901f6077db2a
              - -X github.com/cloudnative-pg/cloudnative-pg/pkg/versions.buildDate=$(date -u -d @${SOURCE_DATE_EPOCH} +'%Y-%m-%d')
            output: ${target.dir}/operator/manager_amd64
            packages: ./cmd/manager
        - name: build manager for arm64
          uses: go/build@v1
          environment:
            GOFLAGS: -buildvcs=false
          with:
            extra-env: GOOS=linux GOARCH=arm64
            fips: false
            ldflags:
              - -X github.com/cloudnative-pg/cloudnative-pg/pkg/versions.buildVersion=1.28.4
              - -X github.com/cloudnative-pg/cloudnative-pg/pkg/versions.buildCommit=f74344b4d3a6d9fbe06748ba1747901f6077db2a
              - -X github.com/cloudnative-pg/cloudnative-pg/pkg/versions.buildDate=$(date -u -d @${SOURCE_DATE_EPOCH} +'%Y-%m-%d')
            output: ${target.dir}/operator/manager_arm64
            packages: ./cmd/manager
        - name: build dev manager for amd64
          uses: go/build@v1
          environment:
            GOFLAGS: -buildvcs=false
          with:
            extra-env: GOOS=linux GOARCH=amd64
            fips: false
            ldflags:
              - -X github.com/cloudnative-pg/cloudnative-pg/pkg/versions.buildVersion=1.28.4
              - -X github.com/cloudnative-pg/cloudnative-pg/pkg/versions.buildCommit=f74344b4d3a6d9fbe06748ba1747901f6077db2a
              - -X github.com/cloudnative-pg/cloudnative-pg/pkg/versions.buildDate=$(date -u -d @${SOURCE_DATE_EPOCH} +'%Y-%m-%d')
            output: ${target.dir}/operator-dev/manager_amd64
            packages: ./cmd/manager
            strip: false
        - name: build dev manager for arm64
          uses: go/build@v1
          environment:
            GOFLAGS: -buildvcs=false
          with:
            extra-env: GOOS=linux GOARCH=arm64
            fips: false
            ldflags:
              - -X github.com/cloudnative-pg/cloudnative-pg/pkg/versions.buildVersion=1.28.4
              - -X github.com/cloudnative-pg/cloudnative-pg/pkg/versions.buildCommit=f74344b4d3a6d9fbe06748ba1747901f6077db2a
              - -X github.com/cloudnative-pg/cloudnative-pg/pkg/versions.buildDate=$(date -u -d @${SOURCE_DATE_EPOCH} +'%Y-%m-%d')
            output: ${target.dir}/operator-dev/manager_arm64
            packages: ./cmd/manager
            strip: false
        - name: stage manager link and sbom
          runs: |
            set -eux -o pipefail

            ln -s ../../operator/manager_${target.arch} ${target.dir}/usr/bin/manager
            ln -s ../../operator/manager_${target.arch} ${target.dir}/usr/bin/manager-dev

            sbom=/opt/docker/sbom/cloudnative-pg
            test -d "$sbom"
            install -d ${target.dir}/opt/docker/sbom ${target.dir}/opt/docker/sbom-dev
            cp -a "$sbom" ${target.dir}/opt/docker/sbom/
            cp -a "$sbom" ${target.dir}/opt/docker/sbom-dev/
        - uses: dhi/build-pkg:0
          with:
            description: Cloudnative-pg
            files:
              - usr/bin/manager
              - operator/manager_amd64
              - operator/manager_arm64
              - opt/docker/sbom/cloudnative-pg
            license: Apache-2.0
            name: cloudnative-pg-1.28
            priority: "200"
            provides: cloudnative-pg=$pkg_full_version
            rel: 13
            replaces: cloudnative-pg
            subpackages:
              - files:
                  - path: usr/bin/manager
                    source: usr/bin/manager-dev
                  - path: operator/manager_amd64
                    source: operator-dev/manager_amd64
                  - path: operator/manager_arm64
                    source: operator-dev/manager_arm64
                  - path: opt/docker/sbom/cloudnative-pg
                    source: opt/docker/sbom-dev/cloudnative-pg
                name: cloudnative-pg-1.28-dev
            url: https://github.com/cloudnative-pg/cloudnative-pg
            version: 1.28.4
os-release:
  name: Docker Hardened Images (Alpine)
  id: alpine
  version-id: "3.24"
  pretty-name: Docker Hardened Images/Alpine Linux v3.24
