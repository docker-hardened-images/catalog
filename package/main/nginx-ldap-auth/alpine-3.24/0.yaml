# syntax=dhi.io/build:2-alpine3.24

image: dhi.io/pkg-nginx-ldap-auth
variant: runtime
tags:
  - 0.0.5-alpine3.24
  - 0.0.5-r1-alpine3.24
platforms:
  - linux/amd64
  - linux/arm64
vars:
  COMMIT_SHA: c98eb555f5faba6b6efdddad4071afa56464d2c5
  PYTHON_LDAP_VERSION: 3.4.7
  PYTHON3_VERSION: 3.14.7-r1
  REL: "1"
  SEMVER_MAJOR_MINOR_VERSION: "0.0"
  SEMVER_MAJOR_VERSION: "0"
  SEMVER_VERSION: 0.0.5
  VERSION: 0.0.5.20230304
contents:
  repositories:
    - https://dhi.io/apk/alpine/v3.24/main
    - https://dhi.io/apk/alpine/v3.23/main
    - https://dl-cdn.alpinelinux.org/alpine/v3.24/main
    - https://dl-cdn.alpinelinux.org/alpine/v3.24/community
  keyring:
    - https://dhi.io/keyring/dhi-apk@docker-0F81AD7700D99184.rsa.pub
  packages:
    - alpine-baselayout-data
  builds:
    - name: nginx-ldap-auth
      contents:
        packages:
          - python3
          - py3-pip
          - python3-dev
          - gcc
          - musl-dev
          - openldap-dev
          - cyrus-sasl-dev
          - openssl-dev
          - ca-certificates
        files:
          - url: git+https://github.com/nginxinc/nginx-ldap-auth.git#c98eb555f5faba6b6efdddad4071afa56464d2c5
            checksum: c98eb555f5faba6b6efdddad4071afa56464d2c5
            path: ${source.dir}/nginx-ldap-auth
            spdx:
              name: nginx-ldap-auth
              version: 0.0.5.20230304
              packages:
                - name: nginx-ldap-auth
                  purl: pkg:dhi/nginx-ldap-auth@0.0.5.20230304
                  license: BSD-2-Clause
            uid: 0
            gid: 0
      pipeline:
        - name: create virtual environment
          runs: |
            set -eux -o pipefail

            python3 -m venv --without-pip "${target.dir}/usr/lib/nginx-ldap-auth"
        - name: install python-ldap
          privileged: true
          runs: |
            set -eux -o pipefail

            pip3 --python "${target.dir}/usr/lib/nginx-ldap-auth/bin/python" \
              install --no-cache-dir "python-ldap==3.4.7"
        - name: install auth daemon
          runs: |
            set -eux -o pipefail

            daemon="${target.dir}/usr/lib/nginx-ldap-auth/bin/nginx-ldap-auth-daemon.py"
            install -m 0755 "${source.dir}/nginx-ldap-auth/nginx-ldap-auth-daemon.py" "$daemon"
            head -n1 "$daemon" | grep -q '^#!'
            sed -i '1s|.*|#!/usr/lib/nginx-ldap-auth/bin/python3|' "$daemon"
        - name: clean python cache
          runs: |
            set -eux -o pipefail

            find "${target.dir}/usr/lib/nginx-ldap-auth" \
              \( -type d -a \( -name test -o -name tests -o -name __pycache__ \) \) \
              -o \( -type f -a \( -name '*.pyc' -o -name '*.pyo' \) \) \
              -exec rm -rf '{}' + || true
        - name: create usr/bin symlink
          runs: |
            set -eux -o pipefail

            mkdir -p "${target.dir}/usr/bin"
            ln -sf ../lib/nginx-ldap-auth/bin/nginx-ldap-auth-daemon.py \
              "${target.dir}/usr/bin/nginx-ldap-auth-daemon"
        - uses: dhi/build-pkg:0
          with:
            depends:
              - python3
              - libldap
              - libsasl
            description: LDAP authentication daemon for the NGINX auth_request module
            files:
              - usr
            formats:
              - apk
            license: BSD-2-Clause
            name: nginx-ldap-auth
            rel: 1
            url: https://github.com/nginxinc/nginx-ldap-auth
            version: 0.0.5.20230304
os-release:
  name: Docker Hardened Images (Alpine)
  id: alpine
  version-id: "3.24"
  pretty-name: Docker Hardened Images/Alpine Linux v3.24
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
