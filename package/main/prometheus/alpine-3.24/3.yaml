# syntax=dhi.io/build:2-alpine3.24

image: dhi.io/pkg-prometheus
variant: runtime
tags:
  - 3.14.0-alpine3.24
  - 3.14.0-r3-alpine3.24
platforms:
  - linux/amd64
  - linux/arm64
vars:
  COMMIT_SHA: d7598b7141418fa35be2b5ec5d0fefb634199610
  GOLANG_MAJOR_MINOR_VERSION: "1.26"
  GOLANG_VERSION: 1.26.8-r0
  NODEJS_VERSION: 24.20.0-r0
  PACKAGE_NAME: prometheus-3.14
  PROMETHEUS_GO_MODULE_VERSION: 0.314.0
  REL: "3"
  RELEASE_TYPE: stable
  SEMVER_MAJOR_MINOR_VERSION: "3.14"
  SEMVER_MAJOR_VERSION: "3"
  SEMVER_VERSION: 3.14.0
  VERSION: 3.14.0
contents:
  repositories:
    - https://dhi.io/apk/alpine/v3.24/main
    - https://dhi.io/apk/alpine/v3.23/main
    - https://dl-cdn.alpinelinux.org/alpine/v3.24/main
    - https://dl-cdn.alpinelinux.org/alpine/v3.24/community
  keyring:
    - https://dhi.io/keyring/dhi-apk@docker-0F81AD7700D99184.rsa.pub
  packages:
    - alpine-baselayout-data
  builds:
    - name: prometheus-3.14
      work-dir: /go/src/github.com/prometheus/prometheus
      caches:
        - path: /go/pkg/mod
      contents:
        packages:
          - bash
          - busybox
          - bzip2
          - ca-certificates-bundle
          - corepack
          - coreutils
          - curl
          - findutils
          - git
          - gzip
          - make
          - mawk
          - npm
          - sed
          - tar
          - yq
          - golang-1.26=1.26.8-r0
          - golang-1.26-oci-config=1.26.8-r0
          - nodejs-24=24.20.0-r0
        files:
          - url: git+https://github.com/prometheus/prometheus.git#v3.14.0
            checksum: d7598b7141418fa35be2b5ec5d0fefb634199610
            path: /go/src/github.com/prometheus/prometheus
            spdx:
              name: prometheus
              version: 3.14.0
              packages:
                - name: prometheus
                  purl: pkg:dhi/prometheus@3.14.0
                  license: Apache-2.0
            uid: 0
            gid: 0
      pipeline:
        - name: spdx
          uses: spdx@v1
          with:
            license: Apache-2.0
            name: prometheus-go
            purl: pkg:golang/github.com/prometheus/prometheus@0.314.0
            version: 0.314.0
        - name: bump ui dependencies (3-stable only)
          work-dir: /go/src/github.com/prometheus/prometheus/web/ui/react-app
          privileged: true
          runs: |
            set -eux -o pipefail

            corepack enable pnpm

            yq -i '.overrides."http-proxy-middleware" = "3.0.7"' pnpm-workspace.yaml # CVE-2026-55602
            yq -i '.overrides."immutable" = "5.1.8"' pnpm-workspace.yaml             # CVE-2026-59879, CVE-2026-59880
            yq -i '.overrides."nanoid" = "3.3.18"' pnpm-workspace.yaml               # CVE-2026-67213
            yq -i '.overrides."postcss" = "8.5.23"' pnpm-workspace.yaml              # GHSA-r28c-9q8g-f849, CVE-2026-69153
            pnpm install --lockfile-only
        - name: install react-app dependencies for SBOM
          work-dir: /go/src/github.com/prometheus/prometheus/web/ui/react-app
          privileged: true
          runs: |
            set -eux -o pipefail

            corepack enable pnpm
            pnpm install --prod --frozen-lockfile
        - name: create SBOM for static assets
          uses: sbom@v1
          with:
            extra-scanners: javascript-package-cataloger
            prefix: prometheus
            source: /go/src/github.com/prometheus/prometheus/web/ui/react-app/node_modules
        - name: compile static assets (3-stable only)
          work-dir: /go/src/github.com/prometheus/prometheus
          privileged: true
          runs: |
            set -eux -o pipefail

            corepack enable pnpm

            cd web/ui && pnpm install --ignore-scripts && cd -
            cd web/ui/react-app && pnpm install --ignore-scripts && cd -
            cd web/ui/react-app && pnpm approve-builds unrs-resolver && cd -
            cd web/ui/react-app && pnpm rebuild && cd -

            make assets assets-compress
        - name: update go dependencies (3 only)
          uses: go/bump@v1
          with:
            deps:
              - github.com/buger/jsonparser@v1.1.2
              - golang.org/x/crypto@v0.55.0
              - google.golang.org/grpc@v1.82.1
            download: true
            tidy: true
        - name: build plugins
          runs: |
            set -eux -o pipefail

            make plugins
        - name: build prometheus
          uses: go/build@v1
          environment:
            GOFLAGS: -buildvcs=false
          with:
            extra-args: -mod=readonly
            fips: false
            ldflags:
              - -X github.com/prometheus/common/version.Version=3.14.0
              - -X github.com/prometheus/common/version.Revision=d7598b7141418fa35be2b5ec5d0fefb634199610
              - -X github.com/prometheus/common/version.Branch=HEAD
              - -X github.com/prometheus/common/version.BuildUser=dhi
              - -X github.com/prometheus/common/version.BuildDate=$(date -u -d @${SOURCE_DATE_EPOCH} +'%Y%m%d-%H:%M:%S')
              - -X github.com/prometheus/prometheus/version.Version=3.14.0
            output: ${target.dir}/usr/bin/prometheus
            packages: ./cmd/prometheus
            tags:
              - netgo
              - builtinassets
              - stringlabels
        - name: build promtool
          uses: go/build@v1
          environment:
            GOFLAGS: -buildvcs=false
          with:
            extra-args: -mod=readonly
            fips: false
            ldflags:
              - -X github.com/prometheus/common/version.Version=3.14.0
              - -X github.com/prometheus/common/version.Revision=d7598b7141418fa35be2b5ec5d0fefb634199610
              - -X github.com/prometheus/common/version.Branch=HEAD
              - -X github.com/prometheus/common/version.BuildUser=dhi
              - -X github.com/prometheus/common/version.BuildDate=$(date -u -d @${SOURCE_DATE_EPOCH} +'%Y%m%d-%H:%M:%S')
            output: ${target.dir}/usr/bin/promtool
            packages: ./cmd/promtool
        - name: build prometheus dev
          uses: go/build@v1
          environment:
            GOFLAGS: -buildvcs=false
          with:
            extra-args: -mod=readonly
            fips: false
            ldflags:
              - -X github.com/prometheus/common/version.Version=3.14.0
              - -X github.com/prometheus/common/version.Revision=d7598b7141418fa35be2b5ec5d0fefb634199610
              - -X github.com/prometheus/common/version.Branch=HEAD
              - -X github.com/prometheus/common/version.BuildUser=dhi
              - -X github.com/prometheus/common/version.BuildDate=$(date -u -d @${SOURCE_DATE_EPOCH} +'%Y%m%d-%H:%M:%S')
              - -X github.com/prometheus/prometheus/version.Version=3.14.0
            output: ${target.dir}/usr/bin/prometheus-dev
            packages: ./cmd/prometheus
            strip: false
            tags:
              - netgo
              - builtinassets
              - stringlabels
        - name: build promtool dev
          uses: go/build@v1
          environment:
            GOFLAGS: -buildvcs=false
          with:
            extra-args: -mod=readonly
            fips: false
            ldflags:
              - -X github.com/prometheus/common/version.Version=3.14.0
              - -X github.com/prometheus/common/version.Revision=d7598b7141418fa35be2b5ec5d0fefb634199610
              - -X github.com/prometheus/common/version.Branch=HEAD
              - -X github.com/prometheus/common/version.BuildUser=dhi
              - -X github.com/prometheus/common/version.BuildDate=$(date -u -d @${SOURCE_DATE_EPOCH} +'%Y%m%d-%H:%M:%S')
            output: ${target.dir}/usr/bin/promtool-dev
            packages: ./cmd/promtool
            strip: false
        - name: install config and sbom
          runs: |
            set -eux -o pipefail

            install -D -m 0644 documentation/examples/prometheus.yml \
              "${target.dir}/etc/prometheus/prometheus.yml"
            install -d "${target.dir}/opt/docker/sbom"
            cp -a /opt/docker/sbom/prometheus "${target.dir}/opt/docker/sbom/" 2> /dev/null || true
            cp -a /opt/docker/sbom/prometheus-go "${target.dir}/opt/docker/sbom/" 2> /dev/null || true
        - uses: dhi/build-pkg:0
          with:
            description: Prometheus monitoring system and time series database
            files:
              - usr/bin/prometheus
              - usr/bin/promtool
              - etc/prometheus/prometheus.yml
              - opt/docker/sbom/prometheus
              - opt/docker/sbom/prometheus-go
            license: Apache-2.0
            name: prometheus-3.14
            rel: 3
            subpackages:
              - files:
                  - path: usr/bin/prometheus
                    source: usr/bin/prometheus-dev
                  - path: usr/bin/promtool
                    source: usr/bin/promtool-dev
                name: prometheus-3.14-dev
            url: https://github.com/prometheus/prometheus
            version: 3.14.0
      paths:
        - type: file
          path: ${source.dir}/patch/npm-bumps.json
          uid: 0
          gid: 0
          source: package/main/prometheus/patch/npm-bumps.json
os-release:
  name: Docker Hardened Images (Alpine)
  id: alpine
  version-id: "3.24"
  pretty-name: Docker Hardened Images/Alpine Linux v3.24
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
