    - name: datadog-agent-jmxfetch-7
      work-dir: /build/jmxfetch
      environment:
        JAVA_HOME: /usr/lib/jvm/temurin-11
        MAVEN_ARGS: --batch-mode --no-transfer-progress
        MAVEN_HOME: /opt/java/apache-maven-3.10.0
      caches:
        - path: /root/.m2/repository
      contents:
        packages:
          - bash
          - ca-certificates-bundle
          - coreutils
          - eclipse-temurin-11-jdk=1:11.0.33+10-0
          - findutils
          - git
        files:
          - url: git+https://github.com/DataDog/jmxfetch.git#0.52.0
            checksum: a7b169797a43cd78e62cd39ceefe9a3842effc9a
            path: /build/jmxfetch
            spdx:
              name: jmxfetch
              version: 0.52.0
              packages:
                - name: jmxfetch
                  purl: pkg:maven/com.datadoghq/jmxfetch@0.52.0
                  license: BSD-3-Clause
            uid: 0
            gid: 0
        artifacts:
          - name: dhi.io/maven:3.10.0-jdk21-debian13-dev@sha256:31b14497fbdb6befe03941781c54ff4f91e438cb241738a63f60574067e1f24e
            includes:
              - opt/**
              - usr/local/bin/**
            uid: 0
            gid: 0
      pipeline:
        - name: configure maven mirror
          runs: |
            set -eux -o pipefail

            mkdir -p /root/.m2
            cat > /root/.m2/settings.xml << 'EOF'
            <settings>
              <mirrors>
                <mirror>
                  <id>google-maven-central</id>
                  <name>Google Cloud Storage Maven Central mirror</name>
                  <url>https://maven-central.storage-download.googleapis.com/maven2/</url>
                  <mirrorOf>central</mirrorOf>
                </mirror>
              </mirrors>
            </settings>
            EOF
        - name: build jar
          privileged: true
          runs: |
            set -eux -o pipefail

            mvn package -B -Dtest='!TestGCMetrics,!TestReconnectContainer,!TestJsonParser#fuzz' \
              -Dmaven.javadoc.skip=true \
              -Dmaven.source.skip=true \
              -Dcheckstyle.skip=true \
              -Dgpg.skip=true
            install -D -m 0644 \
              "target/jmxfetch-0.52.0-jar-with-dependencies.jar" \
              ${target.dir}/opt/datadog-agent/bin/dist/jmx/jmxfetch.jar
        - name: verify shaded asm version
          runs: |
            set -eux -o pipefail

            jar=${target.dir}/opt/datadog-agent/bin/dist/jmx/jmxfetch.jar
            case "$(jar tf "$jar")" in
              *org/objectweb/asm/ClassWriter.class*) ;;
              *) exit 1 ;;
            esac
            mkdir -p /tmp/jnr-ffi-pom
            (cd /tmp/jnr-ffi-pom && jar xf "$jar" META-INF/maven/com.github.jnr/jnr-ffi/pom.xml)
            case "$(cat /tmp/jnr-ffi-pom/META-INF/maven/com.github.jnr/jnr-ffi/pom.xml)" in
              *"<asm.version>7.1</asm.version>"*) ;;
              *) exit 1 ;;
            esac
        - name: asm sbom
          uses: spdx@v1
          with:
            license: BSD-3-Clause
            name: jmxfetch-asm
            purl: pkg:maven/org.ow2.asm/asm@7.1
            version: 7.1
        - name: stage sbom documents
          runs: |
            set -eux -o pipefail

            mkdir -p ${target.dir}/opt/docker/sbom
            cp -a /opt/docker/sbom/jmxfetch ${target.dir}/opt/docker/sbom/
            cp -a /opt/docker/sbom/jmxfetch-asm ${target.dir}/opt/docker/sbom/
        - name: stage license file
          runs: |
            set -eux -o pipefail

            d=${target.dir}/usr/share/doc/datadog-agent-jmxfetch-7
            mkdir -p $d
            cp LICENSE $d/copyright
        - uses: dhi/build-pkg:0
          with:
            description: Datadog Agent's JMX integration runner (JMXFetch), built from source
            files:
              - opt/datadog-agent/bin/dist/jmx/jmxfetch.jar
              - opt/docker/sbom
              - usr/share/doc/datadog-agent-jmxfetch-7
