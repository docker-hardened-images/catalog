        - name: stage sbom documents
          runs: |
            set -eux -o pipefail

            mkdir -p ${target.dir}/opt/docker/sbom
            cp -a /opt/docker/sbom/datadog-agent-integrations-embedded ${target.dir}/opt/docker/sbom/
            cp -a /opt/docker/sbom/integrations-core ${target.dir}/opt/docker/sbom/
            cp -a /opt/docker/sbom/librdkafka ${target.dir}/opt/docker/sbom/
            if [ "$(uname -m)" = "x86_64" ]; then
              cp -a /opt/docker/sbom/ibm-mq-redist ${target.dir}/opt/docker/sbom/
              for n in ibm-mq-libcurl ibm-mq-zlib ibm-gskit ibm-gskit-compat ibm-icc-n ibm-icc-n-zlib ibm-icc-c ibm-icc-c-zlib ibm-icc-compat-n ibm-icc-compat-n-zlib ibm-icc-compat-c ibm-icc-compat-c-zlib; do
