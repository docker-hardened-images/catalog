# syntax=dhi.io/build:2-debian13

image: dhi.io/pkg-datadog-agent
variant: runtime
tags:
  - 7.84.6
  - 7.84.6-r1
  - 7.84.6-debian13
  - 7.84.6-r1-debian13
platforms:
  - linux/amd64
  - linux/arm64
dates:
  release: "2019-11-22"
vars:
  COMMIT_SHA: 255cf47d6a0eb25fbfba3c4fdaf8600fc6337662
  GOLANG_MAJOR_MINOR_VERSION: "1.26"
  GOLANG_VERSION: 1.26.10-0
  REL: "1"
  SEMVER_MAJOR_MINOR_VERSION: "7.84"
  SEMVER_MAJOR_VERSION: "7"
  SEMVER_VERSION: 7.84.6
  VERSION: 7.84.6
contents:
  packages:
    - base-files
  builds:
    - name: datadog-agent
      work-dir: /go/src/github.com/DataDog/datadog-agent
      contents:
        repositories:
          - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
        keyring:
          - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
        packages:
          - bash
          - build-essential
          - ca-certificates-bundle
          - coreutils
          - findutils
          - gcc
          - libc6-dev
          - libseccomp-dev
          - mawk
          - pkg-config
          - python3
          - python3-yaml
          - sed
          - golang-1.26=1.26.10-0
          - golang-1.26-oci-config=1.26.10-0
        files:
          - url: git+https://github.com/DataDog/datadog-agent.git#7.84.6
            checksum: 255cf47d6a0eb25fbfba3c4fdaf8600fc6337662
            path: /go/src/github.com/DataDog/datadog-agent
            spdx:
              name: datadog-agent
              version: 7.84.6
              packages:
                - name: datadog-agent
                  purl: pkg:golang/github.com/DataDog/datadog-agent@7.84.6
                  license: Apache-2.0
            uid: 0
            gid: 0
      pipeline:
        - name: update go dependencies
          uses: go/bump@v2
          work-dir: /go/src/github.com/DataDog/datadog-agent
          with:
            deps:
              - go.etcd.io/etcd/client/pkg/v3@v3.6.14
              - github.com/go-jose/go-jose/v4@v4.1.6
            download: true
        - name: generate config sources
          runs: |
            set -eux -o pipefail

            python3 -c 'import runpy, sys, types; tasks = types.ModuleType("tasks"); tasks.__path__ = ["tasks"]; schema = types.ModuleType("tasks.schema"); schema.__path__ = ["tasks/schema"]; tasks.schema = schema; sys.modules.update({"tasks": tasks, "tasks.schema": schema}); runpy.run_path("tasks/schema/codegen_settings_main.py", run_name="__main__")' \
              ./pkg/config/setup
            python3 -c 'import runpy, sys, types; tasks = types.ModuleType("tasks"); tasks.__path__ = ["tasks"]; schema = types.ModuleType("tasks.schema"); schema.__path__ = ["tasks/schema"]; tasks.schema = schema; sys.modules.update({"tasks": tasks, "tasks.schema": schema}); runpy.run_path("tasks/schema/codegen_settings_main.py", run_name="__main__")' \
              ./pkg/config/setup/constants constants
        - name: test
          runs: |
            set -eux -o pipefail

            if [ "${target.fips}" = "true" ]; then
              export GODEBUG=fips140=on
            fi

            CGO_ENABLED=1 go test -short -count=1 \
              -ldflags "-X github.com/DataDog/datadog-agent/pkg/version.AgentVersion=7.84.6 -X github.com/DataDog/datadog-agent/pkg/version.Commit=255cf47d6a0eb25fbfba3c4fdaf8600fc6337662" \
              -tags clusterchecks,datadog.no_waf,kubeapiserver,orchestrator,zlib,zstd,ec2,cel \
              ./pkg/version/...
        - name: stage datadog-cluster.yaml
          runs: |
            set -eux -o pipefail

            cp ./pkg/config/example/dca_linux.yaml.example \
              ./Dockerfiles/cluster-agent/datadog-cluster.yaml
        - name: build secret-generic-connector
          uses: go/build@v1
          work-dir: /go/src/github.com/DataDog/datadog-agent
          with:
            cgo_enabled: 0
            extra-args: -gcflags=all=-l
            fips: false
            ldflags:
              - -X main.appVersion=7.84.6
            output: ${target.dir}/usr/bin/secret-generic-connector
            packages: ./cmd/secret-generic-connector
            strip: true
        - name: build secret-generic-connector dev
          uses: go/build@v1
          work-dir: /go/src/github.com/DataDog/datadog-agent
          with:
            cgo_enabled: 0
            extra-args: -gcflags=all=-l
            fips: false
            ldflags:
              - -X main.appVersion=7.84.6
            output: ${target.dir}/usr/bin/secret-generic-connector-dev
            packages: ./cmd/secret-generic-connector
            strip: false
        - name: build cws-instrumentation
          uses: go/build@v1
          work-dir: /go/src/github.com/DataDog/datadog-agent
          with:
            cgo_enabled: 0
            fips: false
            ldflags:
              - -X main.Version=7.84.6
              - -X main.GitCommit=255cf47d6a0eb25fbfba3c4fdaf8600fc6337662
            output: ${target.dir}/usr/bin/cws-instrumentation
            packages: ./cmd/cws-instrumentation
            strip: true
            tags: netgo,osusergo
        - name: build cws-instrumentation dev
          uses: go/build@v1
          work-dir: /go/src/github.com/DataDog/datadog-agent
          with:
            cgo_enabled: 0
            fips: false
            ldflags:
              - -X main.Version=7.84.6
              - -X main.GitCommit=255cf47d6a0eb25fbfba3c4fdaf8600fc6337662
            output: ${target.dir}/usr/bin/cws-instrumentation-dev
            packages: ./cmd/cws-instrumentation
            strip: false
            tags: netgo,osusergo
        - name: build datadog-cluster-agent
          uses: go/build@v1
          work-dir: /go/src/github.com/DataDog/datadog-agent
          with:
            cgo_enabled: 1
            fips: false
            ldflags:
              - -X github.com/DataDog/datadog-agent/pkg/version.AgentVersion=7.84.6
              - -X github.com/DataDog/datadog-agent/pkg/version.Commit=255cf47d6a0eb25fbfba3c4fdaf8600fc6337662
            output: ${target.dir}/usr/bin/datadog-cluster-agent
            packages: ./cmd/cluster-agent
            tags: clusterchecks,datadog.no_waf,kubeapiserver,orchestrator,zlib,zstd,ec2,cel
        - name: build datadog-cluster-agent dev
          uses: go/build@v1
          work-dir: /go/src/github.com/DataDog/datadog-agent
          with:
            cgo_enabled: 1
            fips: false
            ldflags:
              - -X github.com/DataDog/datadog-agent/pkg/version.AgentVersion=7.84.6
              - -X github.com/DataDog/datadog-agent/pkg/version.Commit=255cf47d6a0eb25fbfba3c4fdaf8600fc6337662
            output: ${target.dir}/usr/bin/datadog-cluster-agent-dev
            packages: ./cmd/cluster-agent
            strip: false
            tags: clusterchecks,datadog.no_waf,kubeapiserver,orchestrator,zlib,zstd,ec2,cel
        - uses: dhi/build-pkg:0
          with:
            depends:
              - libc6
              - libseccomp2
            description: Datadog-agent binaries
            files:
              - usr/bin/secret-generic-connector
            formats:
              - deb
            license: Apache-2.0
            name: datadog-agent
            rel: 1
            subpackages:
              - files:
                  - path: usr/bin/cws-instrumentation
                name: cws-instrumentation
              - files:
                  - path: usr/bin/datadog-cluster-agent
                name: datadog-cluster-agent
              - files:
                  - path: usr/bin/secret-generic-connector
                    source: usr/bin/secret-generic-connector-dev
                name: datadog-agent-dev
              - files:
                  - path: usr/bin/cws-instrumentation
                    source: usr/bin/cws-instrumentation-dev
                name: cws-instrumentation-dev
              - files:
                  - path: usr/bin/datadog-cluster-agent
                    source: usr/bin/datadog-cluster-agent-dev
                name: datadog-cluster-agent-dev
            url: https://github.com/DataDog/datadog-agent
            version: 7.84.6
os-release:
  name: Docker Hardened Images (Debian)
  id: debian
  version-id: "13"
  version-codename: trixie
  pretty-name: Docker Hardened Images/Debian GNU/Linux 13 (trixie)
  home-url: https://docker.com/products/hardened-images/
