            find "$cache" -mindepth 4 -maxdepth 4 -type f -path '*/wheels-v*/pypi/*/*.msgpack' \
              | awk -F/ '{n = NF - 1; split($NF, a, "-"); print "wheel", $n, a[1]}' >> /tmp/uv-fetched.txt
            sed -n 's/^\([^#][^=]*\)==\([^ ]*\).*/\1 \2/p' ${source.dir}/requirements-thirdparty.txt > /tmp/payload-pins.txt
            awk 'NR == FNR { pinned[$1 " " $2] = 1; next } !pinned[$2 " " $3] { print "build dependency:", $0 }' \
              /tmp/payload-pins.txt /tmp/uv-fetched.txt | sort -u
        - name: strip payload debug info
          runs: |
            set -eux -o pipefail

            find /opt/datadog-agent/embedded/lib -type f \( -name '*.so' -o -name '*.so.[0-9]*' \) \
              -exec strip --strip-debug {} +
        - name: fix confluent_kafka rpath
          runs: |
            set -eux -o pipefail

            find /opt/datadog-agent/embedded/lib/python3.13/site-packages/confluent_kafka \
              -name '*.so' -exec patchelf --set-rpath /opt/datadog-agent/embedded/lib {} \;
        - name: stage default conf.d
          runs: |
            set -eux -o pipefail

            while read -r check; do
              test -n "$check" || continue
              src="/build/integrations-core/$check/datadog_checks/$check/data"
              dest="/etc/datadog-agent/conf.d/$check.d"
              for f in conf.yaml.default conf.yaml.example auto_conf.yaml metrics.yaml; do
                if [ -f "$src/$f" ]; then
                  mkdir -p "$dest"
                  cp "$src/$f" "$dest/$f"
                fi
              done
              for d in default_profiles profiles; do
                if [ -d "$src/$d" ]; then
                  mkdir -p "$dest"
                  cp -a "$src/$d" "$dest/$d"
                fi
              done
            done < /build/selected.txt
        - name: prune payload test trees
          runs: |
            set -eux -o pipefail

            sp=/opt/datadog-agent/embedded/lib/python3.13/site-packages
            find "$sp" -path '*.dist-info/direct_url.json' -delete
            find "$sp" -type d -name tests -prune -exec rm -r {} +
        - name: verify payload loads
          environment:
            LD_LIBRARY_PATH: /opt/datadog-agent/embedded/lib
            PYTHONDONTWRITEBYTECODE: "1"
            PYTHONPATH: /opt/datadog-agent/embedded/lib/python3.13/site-packages
          runs: |
            set -eux -o pipefail

            /usr/bin/python3 -c "import datadog_checks.base; import confluent_kafka; print('base payload OK')"
            /usr/bin/python3 -c "import confluent_kafka, sys; v = confluent_kafka.libversion()[0]; print('librdkafka', v); sys.exit(v != sys.argv[1])" "2.13.2"

            if [ "$(uname -m)" = "x86_64" ]; then
              expected="checkpoint_harmony_endpoint duckdb eks_fargate foundationdb ibm_ace ibm_db2 ibm_mq kubelet sap_hana"
            else
              expected="checkpoint_harmony_endpoint duckdb eks_fargate foundationdb ibm_db2 kubelet sap_hana"
            fi

            actual=""
            while read -r check; do
              test -n "$check" || continue
              /usr/bin/python3 -c "import datadog_checks.${check}" 2> /dev/null || {
                echo "WARNING: datadog_checks.${check} did not import" >&2
                actual="$actual $check"
              }
            done < /build/selected.txt

            actual_sorted=$(echo "$actual" | tr ' ' '\n' | sed '/^$/d' | sort | tr '\n' ' ')
            expected_sorted=$(echo "$expected" | tr ' ' '\n' | sed '/^$/d' | sort | tr '\n' ' ')
            echo "import sweep failures: [$actual_sorted]"
            if [ "$actual_sorted" != "$expected_sorted" ]; then
              echo "import sweep mismatch: expected [$expected_sorted], got [$actual_sorted]" >&2
              exit 1
            fi

            if [ "$(uname -m)" = "x86_64" ]; then
              LD_LIBRARY_PATH="/opt/mqm/lib64:${LD_LIBRARY_PATH}" /usr/bin/python3 -c "import pymqi; import datadog_checks.ibm_mq; print('mq payload OK')"
              LD_LIBRARY_PATH="/opt/mqm/lib64:${LD_LIBRARY_PATH}" /usr/bin/python3 -c "import pymqi; import datadog_checks.ibm_ace; print('ace payload OK')"
            fi
        - name: stage payload for packaging
          runs: |
            set -eux -o pipefail

            mkdir -p ${target.dir}/opt/datadog-agent/embedded \
              ${target.dir}/opt/mqm \
              ${target.dir}/etc/datadog-agent
            cp -a /opt/datadog-agent/embedded/lib ${target.dir}/opt/datadog-agent/embedded/lib
            find ${target.dir}/opt/datadog-agent/embedded -iname '*.a' -delete
            rm -r ${target.dir}/opt/datadog-agent/embedded/lib/pkgconfig
            rm ${target.dir}/opt/datadog-agent/embedded/lib/python3.13/site-packages/.lock
            rm -r ${target.dir}/opt/datadog-agent/embedded/lib/python3.13/site-packages/bin
            find ${target.dir}/opt/datadog-agent/embedded/lib/python3.13/site-packages \( -name .lock -o -name .DS_Store \) -delete
            cp -a /opt/mqm/lib64 ${target.dir}/opt/mqm/lib64
            cp -a /opt/mqm/lib ${target.dir}/opt/mqm/lib
            cp -a /opt/mqm/msg ${target.dir}/opt/mqm/msg
            cp -a /opt/mqm/licenses ${target.dir}/opt/mqm/licenses
            if [ "$(uname -m)" = "x86_64" ]; then
              for d in /opt/mqm/gskit*; do
                cp -a "$d" "${target.dir}/opt/mqm/$(basename "$d")"
              done
              mkdir -p ${target.dir}/opt/mqm/lap
              cp -a /opt/mqm/lap/licenses ${target.dir}/opt/mqm/lap/licenses
              cp -a /opt/mqm/README.Redist /opt/mqm/MANIFEST /opt/mqm/MANIFEST.Redist ${target.dir}/opt/mqm/
            fi
            cp -a /etc/datadog-agent/conf.d ${target.dir}/etc/datadog-agent/conf.d
        - name: embedded payload sbom
          uses: sbom@v1
          with:
            prefix: datadog-agent-integrations-embedded
            source: ${target.dir}/opt
        - name: verify bundled library versions
          runs: |
            set -eux -o pipefail

            lock_version() {
              sed -n "s/^$1==\([^ ]*\).*/\1/p" ${source.dir}/requirements-thirdparty.txt
            }
            src() {
              d=$(find /build/uv-sdists -path "*/sdists-v*/pypi/$1/$2/*/src" -type d -print -quit)
              test -n "$d"
              echo "$d"
            }
            ver() {
              grep -q "$3" "$(src "$1" "$2")/$4" || {
                echo "$1 $2: $4 does not contain $3" >&2
                exit 1
              }
            }
            ver pynacl "$(lock_version pynacl)" "AC_INIT(\[libsodium\],\[1.0.20\]" src/libsodium/configure.ac
            ver aerospike "$(lock_version aerospike)" "aerospike_client_version = \"6.2.1\"" aerospike-client-c/src/main/aerospike/version.c
            ver aerospike "$(lock_version aerospike)" "LUA_RELEASE.*Lua 5.1.5\"" aerospike-client-c/modules/lua/src/lua.h
            grep -q "# tag 20250127.1$" /build/ddtrace/cmake/abseil/CMakeLists.txt
        - name: libsodium sbom
          uses: spdx@v1
          with:
            license: ISC
            name: libsodium
            purl: pkg:github/jedisct1/libsodium@1.0.20
            version: 1.0.20
        - name: aerospike-client-c sbom
          uses: spdx@v1
          with:
            license: Apache-2.0
            name: aerospike-client-c
            purl: pkg:github/aerospike/aerospike-client-c@6.2.1
            version: 6.2.1
        - name: lua sbom
          uses: spdx@v1
          with:
            license: MIT
            name: lua
            purl: pkg:generic/lua@5.1.5
            version: 5.1.5
        - name: abseil-cpp sbom
          uses: spdx@v1
          with:
            license: Apache-2.0
            name: abseil-cpp
            purl: pkg:github/abseil/abseil-cpp@20250127.1
            version: 2.02501271e+07
        - name: collect rust lock files
          runs: |
            set -eux -o pipefail

            cache=/build/uv-sdists
            dest=/tmp/cargo-locks
            mkdir -p "$dest/ddtrace"
            cp /build/ddtrace/src/native/Cargo.lock "$dest/ddtrace/Cargo.lock"
            for spec in bcrypt:src/_bcrypt/ cryptography: jellyfish: orjson: pydantic-core:; do
              name=${spec%%:*}
              sub=${spec#*:}
              version=$(sed -n "s/^${name}==\([^ ]*\).*/\1/p" ${source.dir}/requirements-thirdparty.txt)
              test -n "$version"
              lock=$(find "$cache" -path "*/sdists-v*/pypi/${name}/${version}/*/src/${sub}Cargo.lock" -print -quit)
              test -n "$lock" || {
                echo "no Cargo.lock for $name $version" >&2
                exit 1
              }
              mkdir -p "$dest/$name"
              cp "$lock" "$dest/$name/Cargo.lock"
            done
            test "$(find "$dest" -name Cargo.lock | wc -l)" -eq 6
        - name: rust crates sbom
          uses: sbom@v1
          with:
            extra-scanners: rust-cargo-lock-cataloger
            prefix: datadog-agent-integrations-cargo
            source: /tmp/cargo-locks
        - name: libddwaf sbom
          uses: spdx@v1
          with:
            license: Apache-2.0 OR BSD-3-Clause
            name: libddwaf
            purl: pkg:github/DataDog/libddwaf@2.1.0
            version: 2.1.0
        - name: verify libddwaf version
          runs: |
            set -eux -o pipefail

            count="$(find /opt/datadog-agent/embedded/lib -name libddwaf.so | wc -l)"
            if [ "$count" -ne 1 ]; then
              echo "expected one libddwaf.so, found $count" >&2
              exit 1
            fi
            so="$(find /opt/datadog-agent/embedded/lib -name libddwaf.so)"
            actual="$(/usr/bin/python3 -c 'import ctypes, sys; lib = ctypes.CDLL(sys.argv[1]); lib.ddwaf_get_version.restype = ctypes.c_char_p; print(lib.ddwaf_get_version().decode())' "$so")"
            if [ "$actual" != "2.1.0" ]; then
              echo "libddwaf.so reports $actual, expected 2.1.0" >&2
              exit 1
            fi
        - name: verify ibm mq bundled versions
          runs: |
            set -eux -o pipefail

            if [ "$(uname -m)" = "x86_64" ]; then
              grep -aqF "CLIENT libcurl 8.19.0." /opt/mqm/lib64/libcurl.so
              grep -aqF "deflate 1.3.2 Copyright" /opt/mqm/lib64/libmqe_r.so
              grep -aqE "ProductVersion: +9.0.0.6$" /opt/mqm/gskit9/lib64/libgsk9ssl_64.so
              grep -aqE "ProductVersion: +8.0.60.4$" /opt/mqm/gskit9/compat/lib64/libgsk8ssl_64.so
              grep -aqF "(ICC8.9.14.0)" /opt/mqm/gskit9/lib64/N/icc/icclib/libicclib085.so
              grep -aqF "deflate 1.3.1 Copyright" /opt/mqm/gskit9/lib64/N/icc/icclib/libicclib085.so
              grep -aqF "(ICC8.8.1.0)" /opt/mqm/gskit9/lib64/C/icc/icclib/libicclib084.so
              grep -aqF "deflate 1.2.12 Copyright" /opt/mqm/gskit9/lib64/C/icc/icclib/libicclib084.so
              grep -aqF "(ICC8.9.6.9)" /opt/mqm/gskit9/compat/lib64/N/icc/icclib/libicclib085.so
              grep -aqF "deflate 1.2.13 Copyright" /opt/mqm/gskit9/compat/lib64/N/icc/icclib/libicclib085.so
              grep -aqF "(ICC8.6.0.0)" /opt/mqm/gskit9/compat/lib64/C/icc/icclib/libicclib084.so
              grep -aqF "deflate 1.2.11 Copyright" /opt/mqm/gskit9/compat/lib64/C/icc/icclib/libicclib084.so
            fi
        - name: ibm-mq-libcurl sbom
          uses: spdx@v1
          with:
            license: curl
            name: ibm-mq-libcurl
            purl: pkg:generic/curl/curl@8.19.0
            version: 8.19.0
        - name: ibm-mq-zlib sbom
          uses: spdx@v1
          with:
            license: Zlib
            name: ibm-mq-zlib
            purl: pkg:github/madler/zlib@v1.3.2
            version: 1.3.2
        - name: ibm-gskit sbom
          uses: spdx@v1
          with:
            license: LicenseRef-Proprietary
            name: ibm-gskit
            purl: pkg:generic/ibm/gskit@9.0.0.6
            version: 9.0.0.6
        - name: ibm-gskit-compat sbom
          uses: spdx@v1
          with:
            license: LicenseRef-Proprietary
            name: ibm-gskit-compat
            purl: pkg:generic/ibm/gskit@8.0.60.4
            version: 8.0.60.4
        - name: ibm-icc-n sbom
          uses: spdx@v1
          with:
            license: LicenseRef-Proprietary
            name: ibm-icc-n
            purl: pkg:generic/ibm/icc@8.9.14.0
