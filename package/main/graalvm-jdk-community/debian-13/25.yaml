# syntax=dhi.io/build:2-debian13

name: GraalVM Community Edition JDK 25.x
image: dhi.io/pkg-graalvm-jdk-community
variant: runtime
tags:
  - "25"
  - "25.5"
  - 25-debian13
  - 25.5-debian13
  - 25.5.5.0.3-r0
  - 25.5.5.0.3-r0-debian13
platforms:
  - linux/amd64
  - linux/arm64
dates:
  release: "2026-06-30"
vars:
  AARCH64_SHA256: 41741c0650ae7564a78335f9e4fc353a902e6ff1d4140f2e4fabd1c55d5cce66
  COMMIT_SHA: 885c1b1865fb7aa81df90a00dfc85ede3af4370b
  GRAAL_VERSION: 25.5.5.0.3
  INNOVATION: "5"
  JDK_REST: 5.0.3
  JDK_VERSION: 25.0.5.0.3
  PACKAGE_NAME: graalvm-jdk-community-25
  REL: "0"
  SEMVER_MAJOR_MINOR_VERSION: "25.5"
  SEMVER_MAJOR_VERSION: "25"
  VERSION: 25.5.5.0.3
  X64_SHA256: c6438dee6c3ade2220d40b7ccdcad24b512d30e233e61bb4fc70519522de34ef
contents:
  repositories:
    - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
  keyring:
    - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
  packages:
    - base-files
  builds:
    - name: graalvm-jdk-community
      work-dir: ${source.dir}
      contents:
        packages:
          - bash
          - coreutils
          - grep
          - gzip
          - tar
          - zlib1g
        files:
          - url: https://github.com/graalvm/graalvm-ce-builds/releases/download/graal-25.5.5.0.3/graalvm-community-jdk-25i5-25.0.5.0.3_linux-x64_bin.tar.gz
            checksum: sha256:c6438dee6c3ade2220d40b7ccdcad24b512d30e233e61bb4fc70519522de34ef
            path: ${source.dir}/graalvm.tar.gz
            platforms:
              - linux/amd64
            spdx:
              name: graalvm-community-jdk
              version: 25.5.5.0.3
              packages:
                - name: graalvm-community-jdk
                  purl: pkg:dhi/graalvm-jdk-community@25.5.5.0.3
                  license: GPL-2.0-only WITH Classpath-exception-2.0
            uid: 0
            gid: 0
          - url: https://github.com/graalvm/graalvm-ce-builds/releases/download/graal-25.5.5.0.3/graalvm-community-jdk-25i5-25.0.5.0.3_linux-aarch64_bin.tar.gz
            checksum: sha256:41741c0650ae7564a78335f9e4fc353a902e6ff1d4140f2e4fabd1c55d5cce66
            path: ${source.dir}/graalvm.tar.gz
            platforms:
              - linux/arm64
            spdx:
              name: graalvm-community-jdk
              version: 25.5.5.0.3
              packages:
                - name: graalvm-community-jdk
                  purl: pkg:dhi/graalvm-jdk-community@25.5.5.0.3
                  license: GPL-2.0-only WITH Classpath-exception-2.0
            uid: 0
            gid: 0
      pipeline:
        - name: install graalvm
          shell: /bin/bash
          runs: |
            set -eux -o pipefail

            root="${target.dir}/usr/lib/graalvm-jdk-community-25"
            mkdir -p "$root"
            tar -xzf "${source.dir}/graalvm.tar.gz" --strip-components=1 --no-same-owner -C "$root"
            test -x "$root/bin/java"
            test -L "$root/bin/native-image"
            test -L "$root/bin/native-image-configure"
            test -L "$root/bin/native-image-utils"
            test -L "$root/LICENSE_NATIVEIMAGE.txt"
            test -s "$root/lib/svm/LICENSE_NATIVEIMAGE.txt"
            test -f "$root/lib/src.zip"

            mkdir -p "${target.dir}/usr/bin"
            for entry in "$root/bin"/*; do
              test -e "$entry"
              name=$(basename "$entry")
              ln -s "../lib/graalvm-jdk-community-25/bin/${name}" "${target.dir}/usr/bin/${name}"
            done
            test -L "${target.dir}/usr/bin/java"
            test -L "${target.dir}/usr/bin/native-image"
            test -L "${target.dir}/usr/bin/native-image-configure"
            test -L "${target.dir}/usr/bin/native-image-utils"

            assert_text() {
              grep -qF "$1" "$2"
            }
            assert_bin() {
              grep -aqF "$1" "$2"
            }

            assert_text "JPEG release 6b" "$root/legal/java.desktop/jpeg.md"
            assert_bin "6b  27-Mar-1998" "$root/lib/libjavajpeg.so"
            assert_text "LCMS) v2.19.1" "$root/legal/java.desktop/lcms.md"
            assert_bin "Little CMS" "$root/lib/liblcms.so"
            assert_text "libpng v1.6.58" "$root/legal/java.desktop/libpng.md"
            assert_bin "libpng version 1.6.58" "$root/lib/libsplashscreen.so"
            assert_text "Harfbuzz v14.2.0" "$root/legal/java.desktop/harfbuzz.md"
            assert_bin "hb_version_string" "$root/lib/libfontmanager.so"
            assert_text "GIFLIB v6.1.3" "$root/legal/java.desktop/giflib.md"
            assert_bin "DGifGetScreenDesc" "$root/lib/libsplashscreen.so"
            assert_text "Mesa 3-D Graphics Library v21.0.3" "$root/legal/java.desktop/mesa3d.md"
            assert_text "SLEEF v3.6.1" "$root/legal/jdk.incubator.vector/sleef.md"
            assert_text "GCC - libgcc and libstdc++ 14.2.0" "$root/legal/java.base/gcc.md"
            assert_bin "GCC: (GNU) 14.2.0" "$root/lib/server/libjvm.so"
            assert_text "c-libutl 20160225" "$root/legal/java.base/c-libutl.md"
            assert_text "SipHash v1.0-68c8a7c" "$root/legal/java.base/siphash.md"
            for a in "$root"/lib/svm/macros/truffle-svm/builder/linux-*/*/libffi.a; do
              grep -aqF 'libffi-3.4.8/' "$a"
            done

            "$root/bin/java" --version
            "$root/bin/native-image" --version
        - uses: spdx@v1
          with:
            license: IJG
            name: ijg-jpeg
            purl: pkg:generic/ijg-jpeg@6b
            version: 6b
        - uses: spdx@v1
          with:
            license: MIT
            name: little-cms
            purl: pkg:github/mm2/Little-CMS@2.19.1
            version: 2.19.1
        - uses: spdx@v1
          with:
            license: Libpng
            name: libpng
            purl: pkg:github/pnggroup/libpng@v1.6.58
            version: 1.6.58
        - uses: spdx@v1
          with:
            license: MIT
            name: harfbuzz
            purl: pkg:github/harfbuzz/harfbuzz@14.2.0
            version: 14.2.0
        - uses: spdx@v1
          with:
            license: MIT
            name: giflib
            purl: pkg:generic/giflib@6.1.3
            version: 6.1.3
        - uses: spdx@v1
          with:
            license: MIT
            name: mesa
            purl: pkg:github/mesa3d/mesa@21.0.3
            version: 21.0.3
        - uses: spdx@v1
          with:
            license: BSL-1.0
            name: sleef
            purl: pkg:github/shibatch/sleef@3.6.1
            version: 3.6.1
        - uses: spdx@v1
          with:
            license: GPL-3.0-only WITH GCC-exception-3.1
            name: gcc
            purl: pkg:generic/gcc@14.2.0
            version: 14.2.0
        - uses: spdx@v1
          with:
            license: BSD-2-Clause
            name: c-libutl
            purl: pkg:generic/c-libutl@20160225
            version: "20160225"
        - uses: spdx@v1
          with:
            license: MIT OR CC0-1.0
            name: siphash
            purl: pkg:generic/siphash@1.0-68c8a7c
            version: 1.0-68c8a7c
        - uses: spdx@v1
          with:
            license: MIT
            name: libffi
            purl: pkg:github/libffi/libffi@v3.4.8
            version: 3.4.8
        - name: stage component sbom
          shell: /bin/bash
          runs: |
            set -eux -o pipefail

            test -e /opt/docker/sbom/graalvm-community-jdk
            test -e /opt/docker/sbom/ijg-jpeg
            test -e /opt/docker/sbom/little-cms
            test -e /opt/docker/sbom/libpng
            test -e /opt/docker/sbom/harfbuzz
            test -e /opt/docker/sbom/giflib
            test -e /opt/docker/sbom/mesa
            test -e /opt/docker/sbom/sleef
            test -e /opt/docker/sbom/gcc
            test -e /opt/docker/sbom/c-libutl
            test -e /opt/docker/sbom/siphash
            test -e /opt/docker/sbom/libffi
            mkdir -p "${target.dir}/opt/docker/sbom"
            cp -a /opt/docker/sbom/. "${target.dir}/opt/docker/sbom/"
            set -- "${target.dir}/opt/docker/sbom"/*
            test -e "$1"
        - uses: dhi/build-pkg:0
          with:
            depends:
              - bash
              - coreutils
              - libc6
              - zlib1g
            description: GraalVM Community Edition JDK
            files:
              - usr/lib/graalvm-jdk-community-25
              - usr/bin
              - opt/docker/sbom
            formats:
              - deb
            license: GPL-2.0-only WITH Classpath-exception-2.0
            name: graalvm-jdk-community-25
            rel: 0
            url: https://www.graalvm.org/
            version: 25.5.5.0.3
os-release:
  name: Docker Hardened Images (Debian)
  id: debian
