# syntax=dhi.io/build:2-debian13

image: dhi.io/pkg-wikipedia-mcp
variant: runtime
tags:
  - 2.0.1
  - 2.0.1-r2
  - 2.0.1-debian13
  - 2.0.1-r2-debian13
platforms:
  - linux/amd64
  - linux/arm64
dates:
  release: "2026-02-21"
vars:
  ARCH: '#{ target.arch == "amd64" ? "x86_64" : "aarch64" }'
  COMMIT_SHA: c3206e326937e9d326c2e311e858c9c8c43626fd
  PYTHON_MINOR: "3.14"
  PYTHON_VERSION: 3.14.7-0
  REL: "2"
  SEMVER_MAJOR_MINOR_VERSION: "2.0"
  SEMVER_MAJOR_VERSION: "2"
  SEMVER_VERSION: 2.0.1
  UV_VERSION: 0.12.3
  VERSION: 2.0.1
contents:
  packages:
    - base-files
  builds:
    - name: wikipedia-mcp
      work-dir: ${source.dir}
      environment:
        UV_COMPILE_BYTECODE: "1"
      caches:
        - path: /root/.cache/uv
      contents:
        repositories:
          - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
        keyring:
          - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
        packages:
          - bash
          - ca-certificates
          - coreutils
          - findutils
          - git
          - gzip
          - sed
          - tar
          - libpython-3.14-minimal=3.14.7-0
          - libpython-3.14-stdlib=3.14.7-0
          - libpython-3.14=3.14.7-0
          - python-3.14-minimal=3.14.7-0
          - python-3.14=3.14.7-0
          - python-3.14-dev=3.14.7-0
        files:
          - url: https://github.com/astral-sh/uv/releases/download/0.12.3/uv-${ARCH}-unknown-linux-gnu.tar.gz
            path: ${source.dir}/uv-unknown-linux-gnu.tar.gz
            uid: 0
            gid: 0
          - url: git+https://github.com/Rudra-ravi/wikipedia-mcp.git#v2.0.1
            checksum: c3206e326937e9d326c2e311e858c9c8c43626fd
            path: ${source.dir}/src
            spdx:
              name: wikipedia-mcp
              version: 2.0.1
              packages:
                - name: wikipedia-mcp
                  purl: pkg:dhi/wikipedia-mcp@2.0.1
                  license: MIT
            uid: 0
            gid: 0
      pipeline:
        - name: setup uv
          runs: |
            set -eux -o pipefail

            mkdir -p /usr/local/bin
            tar -xzf "${source.dir}/uv-unknown-linux-gnu.tar.gz" -C /usr/local/bin --strip-components=1
            chmod +x /usr/local/bin/uv
        - name: build venv at final path and stage it
          privileged: true
          runs: |
            set -eux -o pipefail

            export SOURCE_DIR="${source.dir}" TARGET_DIR="${target.dir}" PYTHON_BIN=/usr/bin/python3.14
            bash "${source.dir}/build-venv.sh"
        - uses: dhi/build-pkg:0
          with:
            depends:
              - python-3.14
            description: Wikipedia MCP server for search, article retrieval, and summaries
            files:
              - usr/lib/wikipedia-mcp
              - usr/bin/wikipedia-mcp
            formats:
              - deb
            license: MIT
            name: wikipedia-mcp
            rel: 2
            url: https://github.com/Rudra-ravi/wikipedia-mcp
            version: 2.0.1
      paths:
        - type: file
          path: ${source.dir}/build-venv.sh
          uid: 0
          gid: 0
          mode: "0755"
          source: package/main/wikipedia-mcp/build-venv.sh
os-release:
  name: Docker Hardened Images (Debian)
  id: debian
  version-id: "13"
  version-codename: trixie
  pretty-name: Docker Hardened Images/Debian GNU/Linux 13 (trixie)
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
