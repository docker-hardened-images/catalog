            set -eux -o pipefail

            GODEBUG="" "${target.dir}/usr/bin/operator-sdk" version > /tmp/sdk-version.txt
            grep -qF "v1.42.3" /tmp/sdk-version.txt
            grep -qF "2016cae87253bef07444dd47c463bdbb27c44c48" /tmp/sdk-version.txt
