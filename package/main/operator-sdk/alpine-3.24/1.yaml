              - -X github.com/operator-framework/operator-sdk/internal/version.GitVersion=v1.42.3
              - -X github.com/operator-framework/operator-sdk/internal/version.GitCommit=2016cae87253bef07444dd47c463bdbb27c44c48
              - -X github.com/operator-framework/operator-sdk/internal/version.KubernetesVersion=v1.33.1
              - -X github.com/operator-framework/operator-sdk/internal/version.ImageVersion=v1.42.3
            output: ${target.dir}/usr/bin/operator-sdk-dev
            packages: ./cmd/operator-sdk
            strip: false
            tags: containers_image_openpgp
