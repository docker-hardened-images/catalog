        files:
          - url: https://keys.openpgp.org/vks/v1/by-fingerprint/88B57FCF7DB53B4DB3BFA4B1588764FBE22D19C4
            path: ${source.dir}/keys/ghc/zubin-duggal.asc
            uid: 0
            gid: 0
          - url: https://keys.openpgp.org/vks/v1/by-fingerprint/FFEB7CE81E16A36B3E2DED6F2DE04D4E97DB64AD
            path: ${source.dir}/keys/ghc/ben-gamari.asc
            uid: 0
            gid: 0
