contents:
  packages:
    - '!base-files'
  builds:
    - name: ghc
      work-dir: ${source.dir}
      environment:
        BOOT_PREFIX: /opt/ghc-bootstrap
        GHC_FLAVOUR: release
        LANG: C.UTF-8
        PACKAGE_NAME: ghc-9.12
      contents:
        repositories:
          - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] https://dhi.io/deb/debian/main trixie main
        keyring:
          - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
