            gid: 0
          - url: https://downloads.haskell.org/ghc/9.10.3/SHA256SUMS
            path: ${source.dir}/BOOT_SHA256SUMS
            uid: 0
            gid: 0
          - url: https://downloads.haskell.org/ghc/9.10.3/SHA256SUMS.sig
            path: ${source.dir}/BOOT_SHA256SUMS.sig
            uid: 0
            gid: 0
          - url: https://downloads.haskell.org/ghc/9.10.3/ghc-9.10.3-${GHC_ARCH}-${BOOT_DISTRO_TAG}-linux.tar.xz
            checksum: ${BOOT_CHECKSUM}
            path: ${source.dir}/boot-ghc.tar.xz
            uid: 0
            gid: 0
          - url: https://downloads.haskell.org/ghc/9.12.4/ghc-9.12.4-src.tar.xz
            checksum: sha256:02d1ee5080acf00e135b93b238f09015b06ff27254cde59669cf57c42c2bee43
            path: ${source.dir}/ghc-src.tar.xz
            spdx:
              name: ghc
              version: 9.12.4
              packages:
                - name: ghc
                  purl: pkg:generic/ghc@9.12.4
                  license: BSD-3-Clause
            uid: 0
            gid: 0
      pipeline:
        - name: prepare GHC release keyring
          runs: |
            set -eux -o pipefail

            cat \
              "${source.dir}/keys/ghc/zubin-duggal.asc" \
              "${source.dir}/keys/ghc/ben-gamari.asc" \
              > /tmp/ghc-release-keys.asc
        - name: verify SHA256SUMS
          uses: gpg/verify@v1
          with:
            file: ${source.dir}/SHA256SUMS
            keys: /tmp/ghc-release-keys.asc
            signature: ${source.dir}/SHA256SUMS.sig
        - name: verify bootstrap SHA256SUMS
          uses: gpg/verify@v1
          with:
            file: ${source.dir}/BOOT_SHA256SUMS
            keys: /tmp/ghc-release-keys.asc
            signature: ${source.dir}/BOOT_SHA256SUMS.sig
        - name: verify C++ toolchain versions
          runs: |
            set -eux -o pipefail

            python3 "${source.dir}/source-metadata.py" verify-debian-toolchain \
              --gcc-version "14.2.0-19+dhi4" \
              --defaults-version "4:14.2.0-1+dhi0" \
              --triplet "${GNU_TRIPLE}"
        - name: prepare release dependencies
          privileged: true
          runs: |
            set -eux -o pipefail

            mkdir -p "${source.dir}/ghc-src"
            tar -xf "${source.dir}/ghc-src.tar.xz" --strip-components=1 -C "${source.dir}/ghc-src"
            python3 "${source.dir}/source-metadata.py" fetch --source "${source.dir}/ghc-src" --bootstrap-version "9.10.3"
        - name: generate tex formats and font maps
          runs: |
            set -eux -o pipefail

            mkdir -p /etc/texmf/web2c
            cat /usr/share/texlive/texmf-dist/web2c/fmtutil-hdr.cnf \
              /var/lib/tex-common/fmtutil-cnf/*/*.cnf > /etc/texmf/web2c/fmtutil.cnf
            cat /usr/share/texlive/texmf-dist/web2c/updmap-hdr.cfg \
              /var/lib/tex-common/fontmap-cfg/*/*.cfg > /etc/texmf/web2c/updmap.cfg
            mktexlsr
            fmtutil-sys --byfmt xelatex
            updmap-sys
            mktexlsr
            find /var/lib/texmf -name xelatex.fmt | grep .
            find /var/lib/texmf/fonts/map -name '*.map' | grep .
        - name: build from source
          runs: |
            set -eux -o pipefail

            export SOURCE_DIR="${source.dir}"
            export TARGET_DIR="${target.dir}"
            export VERSION="9.12.4"
            export BOOT_VERSION="9.10.3"

            bash "${source.dir}/build-ghc.sh"
        - uses: dhi/build-pkg:0
          with:
            depends:
              - gcc
              - g++
              - libc6-dev
              - libffi-dev
              - libgmp-dev
              - libnuma-dev
              - libtinfo6
              - make
            description: Glasgow Haskell Compiler 9.12
            files:
              - usr/lib/ghc-9.12
              - opt/docker/sbom/ghc-9.12
            formats:
              - deb
            license: BSD-3-Clause
            name: ghc-9.12
            provides:
              - ghc
              - haskell-compiler
            rel: 1
            url: https://www.haskell.org/ghc/
            version: 9.12.4
      paths:
        - type: file
          path: ${source.dir}/build-ghc.sh
          uid: 0
          gid: 0
          mode: "0755"
          source: package/main/ghc/build-ghc.sh
        - type: file
          path: ${source.dir}/source-metadata.py
          uid: 0
          gid: 0
          mode: "0644"
          source: package/main/ghc/source-metadata.py
