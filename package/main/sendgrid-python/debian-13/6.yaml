# syntax=dhi.io/build:2-debian13

image: dhi.io/pkg-sendgrid-python
variant: runtime
tags:
  - 6.12.5
  - 6.12.5-r3
  - 6.12.5-debian13
  - 6.12.5-r3-debian13
platforms:
  - linux/amd64
  - linux/arm64
dates:
  release: "2025-09-19"
vars:
  COMMIT_SHA: 76788e70a76b11ce2990821f190e52f887ab9ed6
  PYTHON_MINOR: "3.14"
  PYTHON_VERSION: 3.14.7-1
  REL: "3"
  SEMVER_MAJOR_MINOR_VERSION: "6.12"
  SEMVER_MAJOR_VERSION: "6"
  SEMVER_VERSION: 6.12.5
  UV_ARCH: '#{ target.arch == "amd64" ? "x86_64-unknown-linux-gnu" : "aarch64-unknown-linux-gnu" }'
  UV_VERSION: 0.12.16
  VERSION: 6.12.5
contents:
  packages:
    - base-files
  builds:
    - name: sendgrid-python
      work-dir: ${source.dir}
      environment:
        UV_COMPILE_BYTECODE: "1"
      caches:
        - path: /root/.cache/uv
      contents:
        repositories:
          - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
        keyring:
          - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
        packages:
          - bash
          - ca-certificates
          - coreutils
          - findutils
          - git
          - libpython-3.14-minimal=3.14.7-1
          - libpython-3.14-stdlib=3.14.7-1
          - libpython-3.14=3.14.7-1
          - python-3.14-minimal=3.14.7-1
          - python-3.14=3.14.7-1
          - gzip
          - sed
          - tar
        files:
          - url: https://github.com/astral-sh/uv/releases/download/0.12.16/uv-${UV_ARCH}.tar.gz
            checksum: https://github.com/astral-sh/uv/releases/download/0.12.16/uv-${UV_ARCH}.tar.gz.sha256
            path: ${source.dir}/uv.tar.gz
            spdx:
              name: uv-binary
              version: 0.12.16
              packages:
                - name: uv
                  purl: pkg:github/astral-sh/uv@0.12.16
                  license: Apache-2.0
            uid: 0
            gid: 0
          - url: git+https://github.com/sendgrid/sendgrid-python.git#6.12.5
            checksum: 76788e70a76b11ce2990821f190e52f887ab9ed6
            path: ${source.dir}/src
            uid: 0
            gid: 0
      pipeline:
        - name: setup uv
          runs: |
            set -eux -o pipefail

            mkdir -p /usr/local/bin
            tar -xzf "${source.dir}/uv.tar.gz" -C /usr/local/bin --strip-components=1
            chmod +x /usr/local/bin/uv
        - name: build venv at final path and stage it
          privileged: true
          runs: |
            set -eux -o pipefail

            export SOURCE_DIR="${source.dir}" TARGET_DIR="${target.dir}" PYTHON_BIN=/usr/bin/python3.14
            bash "${source.dir}/build-venv.sh"
        - uses: dhi/build-pkg:0
          with:
            deb:
              depends:
                - libffi8
                - libstdc++6
                - libgcc-s1
            depends:
              - python-3.14
            description: SendGrid Python HTTP client library (Twilio SendGrid Web API v3)
            files:
              - usr/lib/sendgrid-python
            formats:
              - deb
            license: MIT
            name: sendgrid-python
            rel: 3
            url: https://github.com/sendgrid/sendgrid-python
            version: 6.12.5
      paths:
        - type: file
          path: ${source.dir}/requirements.txt
          uid: 0
          gid: 0
          source: package/main/sendgrid-python/requirements.txt
        - type: file
          path: ${source.dir}/build-venv.sh
          uid: 0
          gid: 0
          mode: "0755"
          source: package/main/sendgrid-python/build-venv.sh
os-release:
  name: Docker Hardened Images (Debian)
  id: debian
  version-id: "13"
  version-codename: trixie
  pretty-name: Docker Hardened Images/Debian GNU/Linux 13 (trixie)
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
