image: dhi.io/pkg-azure-functions-python
variant: runtime
tags:
  - 4.1054.200
  - 4.1054.200-r21
  - 4.1054.200-debian13
  - 4.1054.200-r21-debian13
platforms:
  - linux/amd64
vars:
  BUILD_NUMBER: "200"
  COMMIT_SHA: 85a260d24bbf53ad3899d2218e8422757513cda2
  DOTNET_8_VERSION: 8.0.424-1
  DOTNET_10_VERSION: 10.0.400-1
  EXT_BUNDLE_COMMIT_SHA: 5009f1d2aa8153548dcf5673ac7202a523212a1d
  EXT_BUNDLE_VERSION: 4.39.0
  FUNCTIONS_WORKER: python
  PYTHON_MAJOR_MINOR_VERSION: "3.12"
  PYTHON_VERSION: 3.12.14-1
  REL: "21"
  SEMVER_MAJOR_MINOR_VERSION: "4.1054"
  SEMVER_MAJOR_VERSION: "4"
  SEMVER_VERSION: 4.1054.200
  TEMPLATES_BUILDID: "302044"
  TEMPLATES_DOWNLOADURL: https://artprodwus21.artifacts.visualstudio.com/Ad1c51fbc-4477-4a0f-b99f-fc9013009a58/ae7e3bf3-d41a-4480-9ac0-b6cf9df9ac24/_apis/artifact/cGlwZWxpbmVhcnRpZmFjdDovL2F6ZnVuYy9wcm9qZWN0SWQvYWU3ZTNiZjMtZDQxYS00NDgwLTlhYzAtYjZjZjlkZjlhYzI0L2J1aWxkSWQvMzAyMDQ0L2FydGlmYWN0TmFtZS9kcm9w0/content?format=zip
  VERSION: 4.1054.200
contents:
  packages:
    - base-files
  builds:
    - name: azure-functions-python
      contents:
        repositories:
          - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
        keyring:
          - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
        packages:
          - bash
          - ca-certificates
          - coreutils
          - findutils
          - grep
          - sed
          - unzip
          - libc6
          - libgcc-s1
          - libgssapi-krb5-2
          - libicu76
          - libssl3t64
          - libstdc++6
          - tzdata
          - zlib1g
          - dotnet-sdk-8=8.0.424-1
          - dotnet-sdk-10=10.0.400-1
        files:
          - url: git+https://github.com/Azure/azure-functions-host.git#v4.1054.200
            checksum: 85a260d24bbf53ad3899d2218e8422757513cda2
            path: ${source.dir}/azure-functions-host
            spdx:
              name: azure-functions-host
              version: 4.1054.200
              packages:
                - name: azure-functions-host
                  purl: pkg:github/Azure/azure-functions-host@4.1054.200
                  license: MIT
            uid: 0
            gid: 0
          - url: git+https://github.com/Azure/azure-functions-extension-bundles.git#4.39.0
            checksum: 5009f1d2aa8153548dcf5673ac7202a523212a1d
            path: ${source.dir}/azure-functions-extension-bundles
            spdx:
              name: azure-functions-extension-bundles
              version: 4.39.0
              packages:
                - name: azure-functions-extension-bundles
                  purl: pkg:github/Azure/azure-functions-extension-bundles@4.39.0
                  license: MIT
            uid: 0
            gid: 0
          - url: https://artprodwus21.artifacts.visualstudio.com/Ad1c51fbc-4477-4a0f-b99f-fc9013009a58/ae7e3bf3-d41a-4480-9ac0-b6cf9df9ac24/_apis/artifact/cGlwZWxpbmVhcnRpZmFjdDovL2F6ZnVuYy9wcm9qZWN0SWQvYWU3ZTNiZjMtZDQxYS00NDgwLTlhYzAtYjZjZjlkZjlhYzI0L2J1aWxkSWQvMzAyMDQ0L2FydGlmYWN0TmFtZS9kcm9w0/content?format=zip
            path: ${source.dir}/templatesArtifacts.zip
            uid: 0
            gid: 0
      pipeline:
        - name: bump nuget dependencies
          work-dir: ${source.dir}/azure-functions-host
          runs: |
            set -eux -o pipefail

            find . -name "*.csproj" -o -name "*.props" | xargs sed -i 's/OpenTelemetry\.Exporter\.OpenTelemetryProtocol" Version="1\.14\.0"/OpenTelemetry.Exporter.OpenTelemetryProtocol" Version="1.15.3"/g'
            find . -name "*.csproj" -o -name "*.props" | xargs sed -i 's/OpenTelemetry\.Api" Version="1\.14\.0"/OpenTelemetry.Api" Version="1.15.3"/g'
            find . -name "*.csproj" -o -name "*.props" | xargs sed -i 's/NuGet\.Packaging" Version="5\.11\.6"/NuGet.Packaging" Version="5.11.7"/g'
            find . -name "*.csproj" -o -name "*.props" | xargs sed -i 's/NuGet\.Protocol" Version="5\.11\.6"/NuGet.Protocol" Version="5.11.7"/g'
            if [ -f "Directory.Packages.props" ]; then
              if ! grep -q 'Include="NuGet.Packaging"' Directory.Packages.props; then
                sed -i 's|</ItemGroup>|  <PackageVersion Include="NuGet.Packaging" Version="5.11.7" />\n  </ItemGroup>|' Directory.Packages.props
              fi
              if ! grep -q 'Include="NuGet.Protocol"' Directory.Packages.props; then
                sed -i 's|</ItemGroup>|  <PackageVersion Include="NuGet.Protocol" Version="5.11.7" />\n  </ItemGroup>|' Directory.Packages.props
              fi
            fi
        - name: build host
          work-dir: ${source.dir}/azure-functions-host
          privileged: true
          runs: |
            set -eux -o pipefail

            export DOTNET_ROOT=/usr/lib/dotnet
            export DOTNET_CLI_HOME=/tmp/dotnet
            export DOTNET_CLI_TELEMETRY_OPTOUT=1
            mkdir -p "${DOTNET_CLI_HOME}"

            dotnet publish -v q \
              /p:BuildNumber='200' /p:FileVersion='4.1054.200.200' /p:CommitHash='85a260d24bbf53ad3899d2218e8422757513cda2' \
              src/WebJobs.Script.WebHost/WebJobs.Script.WebHost.csproj \
              -c Release \
              --output '${target.dir}/usr/share/azure-functions-host' \
              --runtime linux-x64 --self-contained
        - name: install host worker
          runs: |
            set -eux -o pipefail

            find '${target.dir}/usr/share/azure-functions-host/workers' -type d -mindepth 1 -maxdepth 1 -not -name 'python' -exec rm -rf '{}' \;
        - name: extract templates
          work-dir: ${source.dir}/azure-functions-extension-bundles
          runs: |
            set -eux -o pipefail

            unzip ${source.dir}/templatesArtifacts.zip
            mv drop templatesArtifacts
        - name: normalize line endings for patches
          work-dir: ${source.dir}/azure-functions-extension-bundles
          runs: |
            set -eux -o pipefail

            find . -type f \( -name '*.cs' -o -name '*.json' \) -exec sed -i 's/\r$//' '{}' +
        - name: patch extension bundles
          uses: patch@v1
          work-dir: ${source.dir}/azure-functions-extension-bundles
          with:
            options: -p1 -l
            patches:
              - ${source.dir}/patch/linux_bundles.patch
              - ${source.dir}/patch/message_pack.patch
        - name: build extension bundles
          work-dir: ${source.dir}/azure-functions-extension-bundles/build
          privileged: true
          runs: |
            set -eux -o pipefail

            export DOTNET_ROOT=/usr/lib/dotnet
            export DOTNET_CLI_HOME=/tmp/dotnet
            export DOTNET_CLI_TELEMETRY_OPTOUT=1
            mkdir -p "${DOTNET_CLI_HOME}"

            NUGET_CONFIG='${source.dir}/azure-functions-extension-bundles/NuGet.config'
            LEGACY_NUGET_CONFIG='${source.dir}/azure-functions-extension-bundles/src/Microsoft.Azure.Functions.ExtensionBundle/NuGet.Config'
            if [ -f "${NUGET_CONFIG}" ]; then
              sed -E -i "${NUGET_CONFIG}" \
                -e 's|upstream-public|nuget.org|g' \
                -e 's|https://pkgs.dev.azure.com/[^"]+|https://api.nuget.org/v3/index.json|g'
            elif [ -f "${LEGACY_NUGET_CONFIG}" ]; then
              sed -E -i "${LEGACY_NUGET_CONFIG}" \
                -e 's|azure-functions-extension-bundles|nuget.org|' \
                -e 's|https://pkgs.dev.azure.com/[^"]+|https://api.nuget.org/v3/index.json|'
            else
              echo "NuGet config not found for extension bundles build" >&2
              exit 1
            fi

            TEMPLATES_ARTIFACTS_DIRECTORY=1 dotnet run \
              skip:GenerateVulnerabilityReport,PackageNetCoreV3BundlesWindows,CreateRUPackage,CreateCDNStoragePackage,CreateCDNStoragePackageWindows,BuildBundleBinariesForWindows
        - name: install extension bundles
          work-dir: ${source.dir}/azure-functions-extension-bundles/artifacts
          runs: |
            set -eux -o pipefail

            mkdir -p ${target.dir}/usr/share/FuncExtensionBundles/Microsoft.Azure.Functions.ExtensionBundle/4.39.0
            unzip Microsoft.Azure.Functions.ExtensionBundle.4.39.0_linux-x64.zip \
              -d ${target.dir}/usr/share/FuncExtensionBundles/Microsoft.Azure.Functions.ExtensionBundle/4.39.0
        - uses: dhi/build-pkg:0
          with:
            depends:
              - python-3.12
            description: Azure Functions host and extension bundles for Python workers
            files:
              - usr/share/azure-functions-host
              - usr/share/FuncExtensionBundles
            formats:
              - deb
            license: MIT
            name: azure-functions-python
            rel: 21
            url: https://learn.microsoft.com/en-us/azure/azure-functions/functions-overview
            version: 4.1054.200
      paths:
        - type: directory
          path: ${source.dir}/patch
          uid: 0
          gid: 0
          source: package/main/azure-functions-python/patch
