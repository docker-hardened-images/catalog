image: dhi.io/pkg-dapr-scheduler
variant: runtime
tags:
  - 1.18.3-alpine3.24
  - 1.18.3-r4-alpine3.24
platforms:
  - linux/amd64
  - linux/arm64
dates:
  release: "2026-04-02"
vars:
  COMMIT_SHA: 2dcf2e3548faf3c740b3d29ee300e2132db65cff
  GOLANG_MAJOR_MINOR_VERSION: "1.26"
  GOLANG_VERSION: 1.26.7-r0
  REL: "4"
  SEMVER_MAJOR_MINOR_VERSION: "1.18"
  SEMVER_MAJOR_VERSION: "1"
  SEMVER_VERSION: 1.18.3
  VERSION: 1.18.3
contents:
  repositories:
    - https://dhi.io/apk/alpine/v3.24/main
    - https://dhi.io/apk/alpine/v3.23/main
    - https://dl-cdn.alpinelinux.org/alpine/v3.24/main
    - https://dl-cdn.alpinelinux.org/alpine/v3.24/community
  keyring:
    - https://dhi.io/keyring/dhi-apk@docker-0F81AD7700D99184.rsa.pub
  packages:
    - alpine-baselayout-data
  builds:
    - name: dapr-scheduler
      work-dir: /go/src/github.com/dapr/dapr
      caches:
        - path: /go/pkg/mod
      contents:
        packages:
          - busybox
          - bash
          - ca-certificates-bundle
          - coreutils
          - findutils
          - mawk
          - sed
          - golang-1.26=1.26.7-r0
          - golang-1.26-oci-config=1.26.7-r0
        files:
          - url: git+https://github.com/dapr/dapr.git#v1.18.3
            checksum: 2dcf2e3548faf3c740b3d29ee300e2132db65cff
            path: /go/src/github.com/dapr/dapr
            spdx:
              name: dapr-scheduler
              version: 1.18.3
              packages:
                - name: dapr-scheduler
                  purl: pkg:golang/github.com/dapr/dapr@1.18.3
                  license: Apache-2.0
            uid: 0
            gid: 0
      pipeline:
        - name: update go dependencies
          uses: go/bump@v1
          with:
            deps:
              - go.etcd.io/etcd/client/pkg/v3@v3.5.33
              - go.etcd.io/etcd/server/v3@v3.5.33
              - golang.org/x/crypto@v0.55.0
              - golang.org/x/net@v0.58.0
              - golang.org/x/text@v0.41.0
              - github.com/go-jose/go-jose/v4@v4.1.4
              - go.opentelemetry.io/otel@v1.46.0
              - google.golang.org/grpc@v1.83.2
            download: true
            replaces:
              - go.opentelemetry.io/contrib/instrumentation/google.golang.org/grpc/otelgrpc=go.opentelemetry.io/contrib/instrumentation/google.golang.org/grpc/otelgrpc@v0.60.0
              - go.etcd.io/etcd/api/v3=go.etcd.io/etcd/api/v3@v3.5.33
              - go.etcd.io/etcd/client/pkg/v3=go.etcd.io/etcd/client/pkg/v3@v3.5.33
              - go.etcd.io/etcd/client/v3=go.etcd.io/etcd/client/v3@v3.5.33
              - go.etcd.io/etcd/pkg/v3=go.etcd.io/etcd/pkg/v3@v3.5.33
              - go.etcd.io/etcd/raft/v3=go.etcd.io/etcd/raft/v3@v3.5.33
              - go.etcd.io/etcd/server/v3=go.etcd.io/etcd/server/v3@v3.5.33
        - name: test go dependencies
          runs: |
            set -eux -o pipefail

            unset OTEL_EXPORTER_OTLP_TRACES_ENDPOINT || true
            unset OTEL_EXPORTER_OTLP_TRACES_PROTOCOL || true

            export DAPR_HOST_IP="${DAPR_HOST_IP:-127.0.0.1}"

            GOMAXPROCS=1 CGO_ENABLED=0 go test -tags unit -count=1 -p 1 -timeout=30m \
              $(go list -tags unit ./... \
                | grep -v 'github.com/dapr/dapr/tests/' \
                | grep -v 'github.com/dapr/dapr/pkg/actors/internal/placement/connector/dnslookup$')
        - name: build
          uses: go/build@v1
          with:
            fips: false
            ldflags:
              - -X github.com/dapr/dapr/pkg/buildinfo.gitcommit=2dcf2e3548faf3c740b3d29ee300e2132db65cff
              - -X github.com/dapr/dapr/pkg/buildinfo.gitversion=1.18.3
              - -X github.com/dapr/dapr/pkg/buildinfo.version=1.18.3
            output: ${target.dir}/usr/bin/dapr-scheduler
            packages: ./cmd/scheduler
        - name: build dev
          uses: go/build@v1
          with:
            fips: false
            ldflags:
              - -X github.com/dapr/dapr/pkg/buildinfo.gitcommit=2dcf2e3548faf3c740b3d29ee300e2132db65cff
              - -X github.com/dapr/dapr/pkg/buildinfo.gitversion=1.18.3
              - -X github.com/dapr/dapr/pkg/buildinfo.version=1.18.3
            output: ${target.dir}/usr/bin/dapr-scheduler-dev
            packages: ./cmd/scheduler
            strip: false
        - uses: dhi/build-pkg:0
          with:
            description: Dapr Scheduler
            files:
              - usr/bin/dapr-scheduler
            license: Apache-2.0
            name: dapr-scheduler
            rel: 4
            subpackages:
              - files:
                  - path: usr/bin/dapr-scheduler
                    source: usr/bin/dapr-scheduler-dev
                name: dapr-scheduler-dev
            url: https://github.com/dapr/dapr
            version: 1.18.3
