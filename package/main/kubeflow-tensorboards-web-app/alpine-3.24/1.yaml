          runs: |
            set -eux -o pipefail

            sbom="${target.dir}/opt/docker/sbom/kubeflow-tensorboards-web-app"
            test -d "${sbom}"
            for name in kubeflow-tensorboards-web-app kubeflow-crud-backend kubeflow-common-lib roboto; do
