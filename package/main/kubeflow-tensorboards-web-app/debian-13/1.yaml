          - python3-setuptools-whl
          - python3-setuptools=84.2.1-1
          - python3-wheel
          - rustc-1.100=1.100.0-0
          - sed
          - zlib1g
          - zlib1g-dev
        files:
          - url: git+https://github.com/kubeflow/notebooks.git#v1.11.1
            checksum: 88fbd77f777ceea627101699879b7ed5677b8c09
            path: ${source.dir}/notebooks
            spdx:
              name: kubeflow-tensorboards-web-app
              version: 1.11.1
              packages:
                - name: kubeflow-tensorboards-web-app
                  purl: pkg:github/kubeflow/notebooks@v1.11.1
                  license: Apache-2.0
            uid: 0
            gid: 0
      pipeline:
        - name: bump python dependencies
          uses: python/bump@v1
          privileged: true
          environment:
            UV_OVERRIDE: patch/uv-overrides.txt
          with:
            bumps: ${source.dir}/patch/python-bumps.json
            hashes: require
            mode: requirements
            python: /usr/bin/python3.12
            requirements:
              - requirements-lock.txt
        - name: bump frontend dependencies
          uses: npm/bump@v2
          privileged: true
          with:
            bumps: ${source.dir}/patch/tensorboards-frontend/npm-bumps.json
            lockfile-only: true
            npm-root: ${source.dir}/notebooks/components/crud-web-apps/tensorboards/frontend
        - name: build and stage payload
          privileged: true
          runs: |
            set -eux -o pipefail

            export SOURCE_DIR="${source.dir}" \
              TARGET_DIR="${target.dir}" \
              UPSTREAM_DIR="${source.dir}/notebooks" \
              PYTHON_BIN=/usr/bin/python3.12 \
              VERSION="1.11.1"
            bash "${source.dir}/build-tensorboards-web-app.sh"
        - uses: spdx@v1
          with:
            license: Apache-2.0
            name: kubeflow-crud-backend
            purl: pkg:github/kubeflow/notebooks@v1.11.1#components/crud-web-apps/common/backend
            version: 1.11.1
        - uses: spdx@v1
          with:
            license: Apache-2.0
            name: kubeflow-common-lib
            purl: pkg:github/kubeflow/notebooks@v1.11.1#components/crud-web-apps/common/frontend/kubeflow-common-lib
            version: 1.11.1
        - uses: spdx@v1
          with:
            license: Apache-2.0
            name: roboto
            purl: pkg:generic/google/roboto@2.137
            version: "2.137"
        - name: stage sbom fragments
          runs: |
            set -eux -o pipefail

            sbom="${target.dir}/opt/docker/sbom/kubeflow-tensorboards-web-app"
            test -d "${sbom}"
            for name in kubeflow-tensorboards-web-app kubeflow-crud-backend kubeflow-common-lib roboto; do
              test -d "/opt/docker/sbom/${name}"
              cp -a "/opt/docker/sbom/${name}" "${sbom}/${name}"
            done
        - uses: dhi/build-pkg:0
          with:
            depends:
              - python-3.12
              - libssl3t64
              - libffi8
              - libyaml-0-2
              - libcares2
              - libev4t64
              - libuv1t64
              - libstdc++6
              - libgcc-s1
            description: Kubeflow Tensorboards web app (Flask backend and Angular frontend)
            files:
              - usr/lib/kubeflow-tensorboards-web-app
              - usr/bin/gunicorn
              - opt/docker/sbom/kubeflow-tensorboards-web-app
            formats:
              - deb
            license: Apache-2.0
            name: kubeflow-tensorboards-web-app-1
            rel: 1
            url: https://github.com/kubeflow/notebooks
            version: 1.11.1
      paths:
