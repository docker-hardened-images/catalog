          gid: 0
          mode: "0644"
          source: package/main/kubeflow-tensorboards-web-app/requirements-build.txt
        - type: file
          path: ${source.dir}/patch/python-bumps.json
          uid: 0
          gid: 0
          mode: "0644"
          source: package/main/kubeflow-tensorboards-web-app/patch/python-bumps.json
        - type: file
          path: ${source.dir}/patch/uv-overrides.txt
          uid: 0
          gid: 0
          mode: "0644"
          source: package/main/kubeflow-tensorboards-web-app/patch/uv-overrides.txt
        - type: file
          path: ${source.dir}/patch/tensorboards-frontend/npm-bumps.json
          uid: 0
          gid: 0
          mode: "0644"
          source: package/main/kubeflow-tensorboards-web-app/patch/tensorboards-frontend/npm-bumps.json
