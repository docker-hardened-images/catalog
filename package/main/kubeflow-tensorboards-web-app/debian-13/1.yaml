          - libpython-3.12-stdlib=3.12.16-10
          - libpython-3.12=3.12.16-10
          - libsqlite3-0
          - libssl-dev
          - libstdc++6
          - libuv1-dev
          - libyaml-dev
          - libzstd-dev
          - nodejs-24=24.22.3-0
          - npm=11.21.3-2
          - pkg-config
          - python-3.12-dev=3.12.16-10
          - python-3.12-minimal=3.12.16-10
          - python-3.12=3.12.16-10
          - python3-pip-whl
