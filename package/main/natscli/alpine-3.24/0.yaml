# syntax=dhi.io/build:2-alpine3.24

image: dhi.io/pkg-natscli
variant: runtime
tags:
  - 0.5.0-alpine3.24
  - 0.5.0-r3-alpine3.24
platforms:
  - linux/amd64
  - linux/arm64
dates:
  release: "2025-09-22"
vars:
  COMMIT_SHA: cc0a8e3224d564b134a92f6f2c2081452f885549
  GOLANG_MAJOR_MINOR_VERSION: "1.26"
  GOLANG_VERSION: 1.26.9-r0
  REL: "3"
  SEMVER_MAJOR_MINOR_VERSION: "0.5"
  SEMVER_MAJOR_VERSION: "0"
  SEMVER_VERSION: 0.5.0
  VERSION: 0.5.0
contents:
  repositories:
    - https://dhi.io/apk/alpine/v3.24/main
    - https://dhi.io/apk/alpine/v3.23/main
    - https://dl-cdn.alpinelinux.org/alpine/v3.24/main
    - https://dl-cdn.alpinelinux.org/alpine/v3.24/community
  keyring:
    - https://dhi.io/keyring/dhi-apk@docker-0F81AD7700D99184.rsa.pub
  packages:
    - alpine-baselayout-data
  builds:
    - name: natscli
      work-dir: /go/src/github.com/nats-io/natscli
      contents:
        packages:
          - busybox
          - bash
          - ca-certificates-bundle
          - coreutils
          - findutils
          - mawk
          - sed
          - golang-1.26=1.26.9-r0
          - golang-1.26-oci-config=1.26.9-r0
        files:
          - url: git+https://github.com/nats-io/natscli.git#v0.5.0
            checksum: cc0a8e3224d564b134a92f6f2c2081452f885549
            path: /go/src/github.com/nats-io/natscli
            spdx:
              name: natscli
              version: 0.5.0
              packages:
                - name: natscli
                  purl: pkg:golang/nats-io/natscli@0.5.0
                  license: Apache-2.0
            uid: 0
            gid: 0
      pipeline:
        - name: update go dependencies
          uses: go/bump@v1
          work-dir: /go/src/github.com/nats-io/natscli
          with:
            deps: []
            download: true
        - name: patch cluster test port base
          uses: patch@v1
          work-dir: /go/src/github.com/nats-io/natscli
          with:
            options: -p1
            patches:
              - ${source.dir}/patch/cluster-test-port-base.patch
        - name: unit test
          work-dir: /go/src/github.com/nats-io/natscli
          privileged: true
          runs: |
            set -eux -o pipefail

            export NATS_CLI_TEST_CLUSTER_PORT_BASE=12000
            go list ./... | grep -F -e asciigraph -v | xargs go test -v -skip 'TestNatsSubscribe|TestServerCheck|TestJetStreamSubscribe|TestStreamPeerRemove' --failfast -p=1
        - name: build
          uses: go/build@v1
          work-dir: /go/src/github.com/nats-io/natscli
          with:
            fips: false
            output: ${target.dir}/usr/bin/nats
            packages: ./nats
        - name: build dev
          uses: go/build@v1
          work-dir: /go/src/github.com/nats-io/natscli
          with:
            fips: false
            output: ${target.dir}/usr/bin/nats-dev
            packages: ./nats
            strip: false
        - uses: dhi/build-pkg:0
          with:
            description: Natscli
            files:
              - usr/bin/nats
            license: Apache-2.0
            name: nats
            rel: 3
            subpackages:
              - files:
                  - path: usr/bin/nats
                    source: usr/bin/nats-dev
                name: nats-dev
            url: https://github.com/nats-io/natscli
            version: 0.5.0
      paths:
        - type: file
          path: ${source.dir}/patch/cluster-test-port-base.patch
          uid: 0
          gid: 0
          source: package/main/natscli/patch/cluster-test-port-base.patch
os-release:
  name: Docker Hardened Images (Alpine)
  id: alpine
  version-id: "3.24"
  pretty-name: Docker Hardened Images/Alpine Linux v3.24
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
