        - name: stage sbom documents
          runs: |
            set -eux -o pipefail

            sbom="${target.dir}/opt/docker/sbom"
            install -d "${sbom}"
            cp -a /opt/docker/sbom/stackgres /opt/docker/sbom/stackgres-operator-java /opt/docker/sbom/stackgres-operator-python \
              /opt/docker/sbom/stackgres-operator-1.19-* "${sbom}/"
            test "$(find "${sbom}" -mindepth 1 -maxdepth 1 -type d -name "stackgres-operator-1.19-*" | wc -l)" -eq 16

            purls="$(cat $(find "${sbom}" -type f -name '*.json'))"
