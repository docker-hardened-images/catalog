      pipeline:
        - uses: mvn/mirror@v1
        - name: apply the stackgres patches
          uses: patch@v1
          with:
            options: -p1 -d ${source.dir}/stackgres
            patches:
              - ${source.dir}/patch/launcher-app-path.patch
              - ${source.dir}/patch/cryptoutil-bcfips-guard.patch
        - name: write the managed dependency pins
          runs: |
            set -eux -o pipefail

            "/usr/bin/python3.13" - com.fasterxml.jackson.core:jackson-{core,databind}:2.22.4 com.google.guava:guava:33.8.0-jre io.opentelemetry:opentelemetry-{api,common,context}:1.68.0 io.opentelemetry:opentelemetry-api-incubator:1.68.0-alpha com.aayushatharva.brotli4j:{brotli4j,service,native-linux-x86_64,native-linux-aarch64}:1.24.0 > "${source.dir}/patch/mvn-deps.json" << 'EOF'
            import json, sys
            pins = [dict(zip(("groupId", "artifactId", "version"), arg.split(":"), strict=True)) for arg in sys.argv[1:]]
            assert pins
            json.dump(pins, sys.stdout, indent=2)
            EOF
        - name: bump managed dependency versions
          uses: mvn/patch@v1
          with:
            dependencies: ${source.dir}/patch/mvn-deps.json
            dependencies-key: dependencyManagement.dependencies
            mvn-root: ${source.dir}/stackgres/stackgres-k8s/src
        - name: build the operator
          work-dir: ${source.dir}/stackgres/stackgres-k8s/src
          privileged: true
          secrets:
            - id: maven_user
              env: MAVEN_USER
              optional: true
            - id: maven_password
              env: MAVEN_PASSWORD
              optional: true
          runs: |
            set -eux -o pipefail

            mvn -pl operator -am package \
              -DskipTests \
              -Dquarkus.analytics.disabled=true \
              -Dmaven.javadoc.skip=true

            test -f operator/target/quarkus-app/quarkus-run.jar
        - name: stage the operator
          work-dir: ${source.dir}/stackgres/stackgres-k8s/src/operator
          runs: |
            set -eux -o pipefail

            dest="${target.dir}/usr/share/stackgres-operator"
            install -d "${dest}"
            cp -a target/quarkus-app/quarkus-run.jar target/quarkus-app/app target/quarkus-app/lib target/quarkus-app/quarkus "${dest}/"
            test -f "${dest}/quarkus/quarkus-application.dat"
            test -f "${dest}/app/stackgres-operator.jar"
            test -d "${dest}/lib/boot"
            test -d "${dest}/lib/main"
            install -m 0755 src/main/docker/stackgres-operator.jvm.sh "${dest}/stackgres-operator.sh"
            grep -qFx 'APP_PATH="${APP_PATH:-/usr/share/stackgres-operator}"' "${dest}/stackgres-operator.sh"
            install -D -m 0644 src/main/docker/LICENCE "${target.dir}/usr/share/licenses/stackgres-operator-1.19/LICENSE"

            unzip -p "${dest}/lib/main/io.stackgres.stackgres-common-1.19.5.jar" stackgres.properties \
              | grep -Fx "stackgres.operatorVersion=1.19.5"
        - name: verify dependency versions
          runs: |
            set -eux -o pipefail

            shopt -s nullglob

            lib="${target.dir}/usr/share/stackgres-operator/lib/main"
            "/usr/bin/python3.13" - "${source.dir}/patch/mvn-deps.json" "${lib}" << 'EOF'
            import json, os, re, sys
            deps, jars = json.load(open(sys.argv[1])), os.listdir(sys.argv[2])
            for dep in deps:
                if dep["artifactId"].startswith("native-linux-"):
                    continue
                prefix = f'{dep["groupId"]}.{dep["artifactId"]}-'
                found = sorted(j for j in jars if j.startswith(prefix) and re.match(r"[0-9]", j[len(prefix):]))
                assert found == [f'{prefix}{dep["version"]}.jar'], (dep, found)
            EOF

            case "${target.arch}" in
              amd64) brotli=x86_64 ;;
              arm64) brotli=aarch64 ;;
            esac
            natives=("${lib}"/com.aayushatharva.brotli4j.native-*.jar)
            test "${natives[*]}" = "${lib}/com.aayushatharva.brotli4j.native-linux-${brotli}-1.24.0.jar"

            rm -rf /tmp/brotli4j-native
            unzip -q "${natives[0]}" "lib/linux-${brotli}/libbrotli.so" -d /tmp/brotli4j-native
            test "$("/usr/bin/python3.13" -c 'import ctypes, sys; v = ctypes.CDLL(sys.argv[1]).BrotliEncoderVersion(); print(f"{v >> 24}.{(v >> 12) & 0xfff}.{v & 0xfff}")' \
              "/tmp/brotli4j-native/lib/linux-${brotli}/libbrotli.so")" = "1.2.1"

            gone=("${lib}"/*netty-tcnative-boringssl-static*.jar "${lib}"/*-osx-*.jar "${lib}"/*-windows-*.jar "${lib}"/org.bouncycastle.*-jdk15on-*.jar)
            test "${#gone[@]}" -eq 0
        - name: setup uv
          runs: |
            set -eux -o pipefail

            mkdir -p /usr/local/bin
            tar -xzf "${source.dir}/uv.tar.gz" -C /usr/local/bin --strip-components=1
            chmod +x /usr/local/bin/uv
        - name: build the patronictl venvs
          privileged: true
          runs: |
            set -eux -o pipefail

            export SOURCE_DIR="${source.dir}" \
              TARGET_DIR="${target.dir}" \
              PYTHON_BIN="/usr/bin/python3.13" \
              LICENSE_DIR="usr/share/licenses/stackgres-operator-1.19" \
              LINK_DIR=usr/bin
            PATRONI_MAJOR=4 PATRONI_VERSION="4.1.5" bash "${source.dir}/build-patronictl.sh"
            PATRONI_MAJOR=3 PATRONI_VERSION="3.3.11" bash "${source.dir}/build-patronictl.sh"
        - name: verify the crates linked into cryptography
          privileged: true
          runs: |
            set -eux -o pipefail

            grep -qFx "cryptography==50.0.2 \\" "${source.dir}/requirements-lock.txt"
            grep -qF -- "--hash=sha256:7b46165bb56eb4704e2eaaf86f3c940d19154535d9b0ca7d6d590b04060e00d5" "${source.dir}/requirements-lock.txt"
            grep -qFx "python-etcd==0.4.5 \\" "${source.dir}/requirements-lock.txt"

            rm -rf /tmp/cryptography
            mkdir /tmp/cryptography
            tar -xzf "${source.dir}/cryptography.tar.gz" -C /tmp/cryptography --strip-components=1
            cd /tmp/cryptography
            cargo fetch --locked
            cargo tree --locked -p cryptography-rust -e normal,no-proc-macro --target "${CARGO_TARGET}" \
              --prefix none --format '{p}' \
              | sed -E 's/ \(\*\)$//' | grep -v ' (/' | sed -E 's/ v/ /' | sort -u > /tmp/crates-have.txt
            printf '%s\n' \
              "asn1 0.24.1" \
              "base64 0.23.0" \
              "bitflags 2.13.1" \
              "cfg-if 1.0.4" \
              "foreign-types 0.3.2" \
              "foreign-types-shared 0.1.1" \
              "itoa 1.0.18" \
              "libc 0.2.189" \
              "once_cell 1.21.4" \
              "openssl 0.10.81" \
              "openssl-sys 0.9.117" \
              "pem 4.0.0" \
              "pyo3 0.29.2" \
              "pyo3-ffi 0.29.2" \
              "self_cell 1.3.0" \
              | sort > /tmp/crates-want.txt
            diff -u /tmp/crates-want.txt /tmp/crates-have.txt

            crates="${target.dir}/usr/share/licenses/stackgres-operator-1.19/python/cryptography-50.0.2/crates"
            registry="$(echo /root/.cargo/registry/src/index.crates.io-*)"
            test -d "${registry}"
            while read -r name version; do
              src="${registry}/${name}-${version}"
              dest="${crates}/${name}-${version}"
              test -d "${src}"
              mkdir -p "${dest}"
              find "${src}" -maxdepth 1 -type f \( -iname 'LICEN[CS]E*' -o -iname 'COPYING*' -o -iname 'NOTICE*' \) -exec cp {} "${dest}/" \;
              test -n "$(find "${dest}" -type f -print -quit)"
            done < /tmp/crates-want.txt
        - name: operator sbom
          uses: sbom@v1
          with:
            extra-scanners: java-archive-cataloger
            prefix: stackgres-operator-java
            source: ${target.dir}/usr/share/stackgres-operator
