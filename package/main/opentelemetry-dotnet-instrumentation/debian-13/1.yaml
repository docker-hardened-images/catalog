# syntax=dhi.io/build:2-debian13

image: dhi.io/pkg-opentelemetry-dotnet-instrumentation
variant: runtime
tags:
  - 1.20.0
  - 1.20.0-r0
  - 1.20.0-debian13
  - 1.20.0-r0-debian13
platforms:
  - linux/amd64
  - linux/arm64
vars:
  DOTNET_ARCH: '#{ target.arch == "arm64" ? "arm64" : "x64" }'
  FMT_VERSION: 11.2.0
  GLIBC_AMD64_CHECKSUM: sha256:95870d686a49da43bee01ec5981d5e608957b1a49bf479e40b257705fcbd301d
  GLIBC_ARM64_CHECKSUM: sha256:31086426122fb3dfb91a221d8e7037f6553c4b0f98d8fd977064dabf31704b23
  GLIBC_CHECKSUM: '#{ target.arch == "arm64" ? "sha256:31086426122fb3dfb91a221d8e7037f6553c4b0f98d8fd977064dabf31704b23" : "sha256:95870d686a49da43bee01ec5981d5e608957b1a49bf479e40b257705fcbd301d" }'
  GLIBC_GCC_PURL: '#{ target.arch == "arm64" ? "pkg:deb/ubuntu/gcc-12@12.3.0-1ubuntu1~22.04.3?arch=arm64&distro=ubuntu-22.04" : "pkg:deb/ubuntu/gcc-9@9.4.0-1ubuntu1~18.04?arch=amd64&distro=ubuntu-18.04" }'
  GLIBC_GCC_VERSION: '#{ target.arch == "arm64" ? "12.3.0-1ubuntu1~22.04.3" : "9.4.0-1ubuntu1~18.04" }'
  MINIUTF_COMMIT: 8babf72ddc3e85d794af24520483040fcfbf85f8
  MINIUTF_LICENSE_CHECKSUM: sha256:950e288a2548cb33f6a90d23958806b0803f510ab17c600d661619a73ae3a6c8
  MUSL_AMD64_CHECKSUM: sha256:bcabd97c0c580485743796e4d4f2cc3729383a28de936e684062828940d50942
  MUSL_ARM64_CHECKSUM: sha256:e7e3b6e51408e4ebc8e80c81d7d49ed2e9a4d94551f9dc92842400dc750b7068
  MUSL_CHECKSUM: '#{ target.arch == "arm64" ? "sha256:e7e3b6e51408e4ebc8e80c81d7d49ed2e9a4d94551f9dc92842400dc750b7068" : "sha256:bcabd97c0c580485743796e4d4f2cc3729383a28de936e684062828940d50942" }'
  PACKAGE_NAME: opentelemetry-dotnet-instrumentation-1
  REL: "0"
  SEMVER_MAJOR_MINOR_VERSION: "1.20"
  SEMVER_MAJOR_VERSION: "1"
  SEMVER_VERSION: 1.20.0
  SPDLOG_LICENSE_CHECKSUM: sha256:4ccecab18d1ff0b61174fe3d6c430541625d3ddb865b0d5887db296f883c76e7
  SPDLOG_VERSION: 1.15.3
  VERSION: 1.20.0
  YAMLDOTNET_VERSION: 18.1.0
contents:
  repositories:
    - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
  keyring:
    - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
  packages:
    - base-files
  builds:
    - name: opentelemetry-dotnet-instrumentation
      work-dir: ${source.dir}
      contents:
        packages:
          - bash
          - binutils
          - coreutils
          - findutils
          - grep
          - sed
          - unzip
        files:
          - url: https://github.com/open-telemetry/opentelemetry-dotnet-instrumentation/releases/download/v1.20.0/opentelemetry-dotnet-instrumentation-linux-glibc-${DOTNET_ARCH}.zip
            checksum: ${GLIBC_CHECKSUM}
            path: ${source.dir}/glibc.zip
            uid: 0
            gid: 0
          - url: https://github.com/open-telemetry/opentelemetry-dotnet-instrumentation/releases/download/v1.20.0/opentelemetry-dotnet-instrumentation-linux-musl-${DOTNET_ARCH}.zip
            checksum: ${MUSL_CHECKSUM}
            path: ${source.dir}/musl.zip
            uid: 0
            gid: 0
          - url: https://raw.githubusercontent.com/dropbox/miniutf/8babf72ddc3e85d794af24520483040fcfbf85f8/LICENSE.txt
            checksum: sha256:950e288a2548cb33f6a90d23958806b0803f510ab17c600d661619a73ae3a6c8
            path: ${source.dir}/miniutf-LICENSE.txt
            uid: 0
            gid: 0
          - url: https://raw.githubusercontent.com/gabime/spdlog/v1.15.3/LICENSE
            checksum: sha256:4ccecab18d1ff0b61174fe3d6c430541625d3ddb865b0d5887db296f883c76e7
            path: ${source.dir}/spdlog-LICENSE.txt
            uid: 0
            gid: 0
      pipeline:
        - name: unpack glibc and musl profilers into the install root
          runs: |
            set -eux -o pipefail

            root="${target.dir}/usr/lib/opentelemetry-dotnet-instrumentation"
            mkdir -p "${root}"

            unzip -q "${source.dir}/glibc.zip" -d "${root}"
            unzip -q "${source.dir}/musl.zip" "linux-musl-${DOTNET_ARCH}/*" -d "${root}"

            mv "${root}/linux-${DOTNET_ARCH}" "${root}/linux"
            mv "${root}/linux-musl-${DOTNET_ARCH}" "${root}/linux-musl"
            ln -s linux "${root}/linux-${DOTNET_ARCH}"
            ln -s linux-musl "${root}/linux-musl-${DOTNET_ARCH}"

            test -d "${root}/linux"
            test -d "${root}/linux-musl"
            test -L "${root}/linux-${DOTNET_ARCH}"
            test -L "${root}/linux-musl-${DOTNET_ARCH}"
            test -e "${root}/linux-${DOTNET_ARCH}/OpenTelemetry.AutoInstrumentation.Native.so"
            test -e "${root}/linux-musl-${DOTNET_ARCH}/OpenTelemetry.AutoInstrumentation.Native.so"
        - name: assert release identity, modes, toolchains and bundled markers
          runs: |
            set -eux -o pipefail

            root="${target.dir}/usr/lib/opentelemetry-dotnet-instrumentation"

            test "$(sed -n 1p "${root}/VERSION")" = "1.20.0"
            sed -n 2p "${root}/VERSION" | grep -q "^v1.20.0@"

            test -z "$(find "${root}" ! -perm -o=r -print)"
            test -z "$(find "${root}" -type d ! -perm -o=rx -print)"

            readelf -p .comment "${root}/linux/OpenTelemetry.AutoInstrumentation.Native.so" | grep -qF "${GLIBC_GCC_VERSION}"
            readelf -p .comment "${root}/linux-musl/OpenTelemetry.AutoInstrumentation.Native.so" | grep -qF "Alpine 15.2.0"

            grep -aqF 'Vendors.YamlDotNet' "${root}/net/OpenTelemetry.AutoInstrumentation.dll"
            for dll in OpenTelemetry.AutoInstrumentation.dll OpenTelemetry.AutoInstrumentation.Loader.dll OpenTelemetry.AutoInstrumentation.StartupHook.dll; do
              grep -aqF 'RollingFileSink' "${root}/net/${dll}"
            done

            grep -qF 'Component Serilog compiled into' "${root}/LICENSE"
            grep -qF 'Component YamlDotNet compiled into' "${root}/LICENSE"

            grep -aqF '_ZN7miniutf' "${root}/linux/OpenTelemetry.AutoInstrumentation.Native.so"
            grep -aqF '_ZN7miniutf' "${root}/linux-musl/OpenTelemetry.AutoInstrumentation.Native.so"
        - name: install miniutf and spdlog notices into the install root
          runs: |
            set -eux -o pipefail

            root="${target.dir}/usr/lib/opentelemetry-dotnet-instrumentation"
            install -m 0644 "${source.dir}/miniutf-LICENSE.txt" "${root}/miniutf-LICENSE.txt"
            grep -qF 'Permission is hereby granted' "${root}/miniutf-LICENSE.txt"
            install -m 0644 "${source.dir}/spdlog-LICENSE.txt" "${root}/spdlog-LICENSE.txt"
            grep -qF 'Copyright (c) 2016 Gabi Melman' "${root}/spdlog-LICENSE.txt"
            grep -qF 'Permission is hereby granted' "${root}/spdlog-LICENSE.txt"
        - uses: spdx@v1
          with:
            license: Apache-2.0
            name: opentelemetry-dotnet-instrumentation
            purl: pkg:nuget/OpenTelemetry.AutoInstrumentation@1.20.0
            version: 1.20.0
        - uses: spdx@v1
          with:
            license: MIT
            name: spdlog
            purl: pkg:github/gabime/spdlog@v1.15.3
            version: 1.15.3
        - uses: spdx@v1
          with:
            license: MIT
            name: fmt
            purl: pkg:github/fmtlib/fmt@11.2.0
            version: 11.2.0
        - uses: spdx@v1
          with:
            license: MIT
            name: miniutf
            purl: pkg:github/dropbox/miniutf@8babf72ddc3e85d794af24520483040fcfbf85f8
            version: 8babf72ddc3e85d794af24520483040fcfbf85f8
        - uses: spdx@v1
          with:
            license: MIT
            name: yamldotnet
            purl: pkg:nuget/YamlDotNet@18.1.0
            version: 18.1.0
        - uses: spdx@v1
          with:
            license: GPL-3.0-or-later WITH GCC-exception-3.1
            name: gcc-glibc-runtime
            purl: ${GLIBC_GCC_PURL}
            version: ${GLIBC_GCC_VERSION}
        - uses: spdx@v1
          with:
            license: GPL-3.0-or-later WITH GCC-exception-3.1
            name: gcc-musl-runtime
            purl: pkg:apk/alpine/gcc@15.2.0
            version: 15.2.0
        - name: sbom for the NuGet assemblies
          uses: sbom@v1
          with:
            extra-scanners: dotnet-deps-binary-cataloger,dotnet-portable-executable-cataloger
            prefix: opentelemetry-dotnet-instrumentation-nuget
            source: ${target.dir}/usr/lib/opentelemetry-dotnet-instrumentation
        - name: stage sbom fragments
          runs: |
            set -eux -o pipefail

            mkdir -p "${target.dir}/opt/docker/sbom"
            cp -a /opt/docker/sbom/opentelemetry-dotnet-instrumentation "${target.dir}/opt/docker/sbom/"
            cp -a /opt/docker/sbom/spdlog "${target.dir}/opt/docker/sbom/"
            cp -a /opt/docker/sbom/fmt "${target.dir}/opt/docker/sbom/"
            cp -a /opt/docker/sbom/miniutf "${target.dir}/opt/docker/sbom/"
            cp -a /opt/docker/sbom/yamldotnet "${target.dir}/opt/docker/sbom/"
            cp -a /opt/docker/sbom/gcc-glibc-runtime "${target.dir}/opt/docker/sbom/"
            cp -a /opt/docker/sbom/gcc-musl-runtime "${target.dir}/opt/docker/sbom/"
            cp -a /opt/docker/sbom/opentelemetry-dotnet-instrumentation-nuget "${target.dir}/opt/docker/sbom/"
        - uses: dhi/build-pkg:0
          with:
            description: OpenTelemetry .NET Automatic Instrumentation profiler and managed startup hook, for copying into .NET application images
            files:
              - usr/lib/opentelemetry-dotnet-instrumentation
              - opt/docker/sbom
            license: Apache-2.0
            name: opentelemetry-dotnet-instrumentation-1
            rel: 0
            url: https://github.com/open-telemetry/opentelemetry-dotnet-instrumentation
            version: 1.20.0
os-release:
  name: Docker Hardened Images (Debian)
  id: debian
  version-id: "13"
  version-codename: trixie
  pretty-name: Docker Hardened Images/Debian GNU/Linux 13 (trixie)
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
