      pipeline:
        - name: build
          privileged: true
          runs: |
            set -eux -o pipefail

            cargo auditable build --release --locked -p efs-proxy --manifest-path src/Cargo.toml

            install -D -m 0755 src/target/release/efs-proxy "${target.dir}/usr/bin/efs-proxy"
            install -D -m 0755 src/watchdog/__init__.py "${target.dir}/usr/bin/amazon-efs-mount-watchdog"
            install -D -m 0755 src/mount_efs/__init__.py "${target.dir}/usr/sbin/mount.efs"
            install -D -m 0755 src/mount_s3files/__init__.py "${target.dir}/usr/sbin/mount.s3files"
            install -D -m 0644 -t "${target.dir}/usr/sbin/efs_utils_common" src/efs_utils_common/*.py
            install -D -m 0644 -t "${target.dir}/usr/sbin/mount_efs" src/mount_efs/*.py
            install -D -m 0644 -t "${target.dir}/usr/sbin/mount_s3files" src/mount_s3files/*.py
            for dir in etc/amazon/efs usr/share/amazon-efs-utils; do
              install -D -m 0644 -t "${target.dir}/${dir}" dist/efs-utils.conf dist/s3files-utils.conf
              install -D -m 0444 -t "${target.dir}/${dir}" dist/efs-utils.crt
            done
            install -d -m 0755 "${target.dir}/var/log/amazon/efs"
            touch "${target.dir}/var/log/amazon/efs/.keep"

            cargo test --release --locked -p efs-proxy --lib --bins --manifest-path src/Cargo.toml -- --exact \
              --skip connections::tests::test_reload_certificate \
              --skip tls::tests::test_remove_comments \
              --skip tls::tests::test_secret_reader_matches_plain_reader
        - name: install botocore
          runs: |
            set -eux -o pipefail

            venv="${target.dir}/usr/lib/amazon-efs-utils"
            /usr/bin/python3.13 -m venv --without-pip --without-scm-ignore-files "${venv}"
            rm -f "${venv}"/bin/activate "${venv}"/bin/activate.csh "${venv}"/bin/activate.fish "${venv}"/bin/Activate.ps1
            site="$("${venv}/bin/python3" -c 'import sysconfig; print(sysconfig.get_paths()["purelib"])')"
            for wheel in "${source.dir}"/wheels/*.whl; do
              /usr/bin/python3.13 -m zipfile -e "${wheel}" "${site}"
            done
            rm -rf "${site}"/*.data
            sed -i "s|${target.dir}||g" "${venv}/pyvenv.cfg"
            for script in usr/sbin/mount.efs usr/sbin/mount.s3files usr/bin/amazon-efs-mount-watchdog; do
              sed -i '1s|^#!/usr/bin/env python3$|#!/usr/lib/amazon-efs-utils/bin/python3|' "${target.dir}/${script}"
              grep -qx '#!/usr/lib/amazon-efs-utils/bin/python3' "${target.dir}/${script}"
            done
        - uses: dhi/build-pkg:0
          with:
            depends:
              - coreutils
              - dash
              - debianutils
              - libc6
              - libgcc-s1
              - mount
              - nfs-common
              - openssl
              - python-3.13
              - stunnel4
              - util-linux
            description: Utilities for mounting Amazon EFS and Amazon S3 file systems
            files:
              - etc/amazon/efs
              - usr/lib/amazon-efs-utils
              - usr/bin/amazon-efs-mount-watchdog
              - usr/bin/efs-proxy
              - usr/sbin/efs_utils_common
              - usr/sbin/mount.efs
              - usr/sbin/mount.s3files
              - usr/sbin/mount_efs
              - usr/sbin/mount_s3files
              - usr/share/amazon-efs-utils
              - var/log/amazon/efs
            formats:
              - deb
            license: MIT
            name: amazon-efs-utils-3
            rel: 2
            url: https://github.com/aws/efs-utils
