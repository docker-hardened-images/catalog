# syntax=dhi.io/build:2-alpine3.24

image: dhi.io/pkg-cloud-sql-connectors-cloud-sql-proxy
variant: runtime
tags:
  - 2.28.1-alpine3.24
  - 2.28.1-r0-alpine3.24
platforms:
  - linux/amd64
  - linux/arm64
dates:
  release: "2023-01-17"
vars:
  BINARY_NAME: cloud-sql-proxy
  COMMIT_SHA: 4d7bf895fc713a75563c10f1faeb9a91875aee78
  FIPS_TEST_SKIP: TestProxyPQCKeyExchange
  GO_PACKAGES: .
  GOLANG_MAJOR_MINOR_VERSION: "1.26"
  GOLANG_VERSION: 1.26.11-r1
  LDFLAGS: -X github.com/GoogleCloudPlatform/cloud-sql-proxy/v2/cmd.metadataString=container
  MAX_CONN_PATCH: "true"
  MODULE_DIR: /go/src/github.com/GoogleCloudPlatform/cloud-sql-proxy/v2
  PACKAGE_NAME: cloud-sql-proxy-2
  REL: "0"
  SEMVER_MAJOR_MINOR_VERSION: "2.28"
  SEMVER_MAJOR_VERSION: "2"
  SEMVER_VERSION: 2.28.1
  SPDX_NAME: cloud-sql-proxy
  SPDX_PURL: pkg:golang/github.com/GoogleCloudPlatform/cloud-sql-proxy/v2@2.28.1
  TEST_ARGS: ./cmd/... ./internal/...
  TEST_SKIP: TestSdNotifyOnLinux|TestNewCommandArgumentsOnLinux|TestCommandOptions/with_FUSE_dir|TestCommandOptions/with_FUSE_temp_dir
  VERSION: 2.28.1
contents:
  repositories:
    - https://dhi.io/apk/alpine/v3.24/main
    - https://dhi.io/apk/alpine/v3.23/main
    - https://dl-cdn.alpinelinux.org/alpine/v3.24/main
    - https://dl-cdn.alpinelinux.org/alpine/v3.24/community
  keyring:
    - https://dhi.io/keyring/dhi-apk@docker-0F81AD7700D99184.rsa.pub
  packages:
    - alpine-baselayout-data
  builds:
    - name: cloud-sql-proxy-2
      work-dir: /go/src/github.com/GoogleCloudPlatform/cloud-sql-proxy/v2
      contents:
        packages:
          - busybox
          - bash
          - ca-certificates-bundle
          - coreutils
          - findutils
          - patch
          - golang-1.26=1.26.11-r1
          - golang-1.26-oci-config=1.26.11-r1
        files:
          - url: git+https://github.com/GoogleCloudPlatform/cloud-sql-proxy.git#v2.28.1
            checksum: 4d7bf895fc713a75563c10f1faeb9a91875aee78
            path: /go/src/github.com/GoogleCloudPlatform/cloud-sql-proxy/v2
            spdx:
              name: cloud-sql-proxy
              version: 2.28.1
              packages:
                - name: cloud-sql-proxy
                  purl: pkg:golang/github.com/GoogleCloudPlatform/cloud-sql-proxy/v2@2.28.1
                  license: Apache-2.0
            uid: 0
            gid: 0
      pipeline:
        - name: update go dependencies
          uses: go/bump@v2
          with:
            deps: []
            download: true
            tidy: true
        - uses: go/hermetic@v1
        - name: wait for the max-connections refusal
          uses: patch@v1
          with:
            options: -p1
            patches:
              - ${source.dir}/patch/test-client-limits-max-connections.patch
        - name: check the max-connections patch
          runs: |
            set -eux -o pipefail

            test -f internal/proxy/proxy_test.go
            grep -qF 'listenDeadline := time.Now().Add(2 * time.Second)' internal/proxy/proxy_test.go
            grep -qF 'callbackDeadline := time.Now().Add(2 * time.Second)' internal/proxy/proxy_test.go
        - name: test
          runs: |
            set -eux -o pipefail

            skip="TestSdNotifyOnLinux|TestNewCommandArgumentsOnLinux|TestCommandOptions/with_FUSE_dir|TestCommandOptions/with_FUSE_temp_dir"
            if [ "false" = "true" ]; then
              export GODEBUG=fips140=on
              if [ -n "TestProxyPQCKeyExchange" ]; then
                skip="${skip:+${skip}|}TestProxyPQCKeyExchange"
              fi
            fi

            if [ -n "${skip}" ]; then
              CGO_ENABLED=0 go test -short -count=1 -timeout 20m -skip "${skip}" ./cmd/... ./internal/...
            else
              CGO_ENABLED=0 go test -short -count=1 -timeout 20m ./cmd/... ./internal/...
            fi
        - name: build
          uses: go/build@v1
          with:
            fips: false
            ldflags:
              - -X github.com/GoogleCloudPlatform/cloud-sql-proxy/v2/cmd.metadataString=container
            output: ${target.dir}/usr/bin/cloud-sql-proxy
            packages: .
        - name: build dev
          uses: go/build@v1
          with:
            fips: false
            ldflags:
              - -X github.com/GoogleCloudPlatform/cloud-sql-proxy/v2/cmd.metadataString=container
            output: ${target.dir}/usr/bin/cloud-sql-proxy-dev
            packages: .
            strip: false
        - name: stage payload
          runs: |
            set -eux -o pipefail

            test -s LICENSE
            grep -q 'Apache License' LICENSE
            grep -q 'Version 2.0' LICENSE

            test -d "/opt/docker/sbom/cloud-sql-proxy"
            test -n "$(find "/opt/docker/sbom/cloud-sql-proxy" -name '.spdx.*.json' -print -quit)"
            install -d "${target.dir}/opt/docker/sbom" "${target.dir}/dev/opt/docker/sbom"
            cp -a "/opt/docker/sbom/cloud-sql-proxy" "${target.dir}/opt/docker/sbom/"
            cp -a "/opt/docker/sbom/cloud-sql-proxy" "${target.dir}/dev/opt/docker/sbom/"

            install -D -m 0644 LICENSE "${target.dir}/usr/share/licenses/cloud-sql-proxy-2/LICENSE"
            install -D -m 0644 LICENSE "${target.dir}/dev/usr/share/licenses/cloud-sql-proxy-2-dev/LICENSE"

            test -n "$(find "${target.dir}/opt/docker/sbom/cloud-sql-proxy" -name '.spdx.*.json' -print -quit)"
            test -n "$(find "${target.dir}/dev/opt/docker/sbom/cloud-sql-proxy" -name '.spdx.*.json' -print -quit)"
            test -s "${target.dir}/usr/share/licenses/cloud-sql-proxy-2/LICENSE"
            test -s "${target.dir}/dev/usr/share/licenses/cloud-sql-proxy-2-dev/LICENSE"
            grep -q 'Apache License' "${target.dir}/usr/share/licenses/cloud-sql-proxy-2/LICENSE"
            grep -q 'Apache License' "${target.dir}/dev/usr/share/licenses/cloud-sql-proxy-2-dev/LICENSE"
        - uses: dhi/build-pkg:0
          with:
            depends:
              - ca-certificates-bundle
            description: Cloud SQL Auth Proxy
            files:
              - usr/bin/cloud-sql-proxy
              - opt/docker/sbom/cloud-sql-proxy
              - usr/share/licenses/cloud-sql-proxy-2/LICENSE
            license: Apache-2.0
            name: cloud-sql-proxy-2
            rel: 0
            subpackages:
              - depends:
                  - ca-certificates-bundle
                files:
                  - path: usr/bin/cloud-sql-proxy
                    source: usr/bin/cloud-sql-proxy-dev
                  - path: opt/docker/sbom/cloud-sql-proxy
                    source: dev/opt/docker/sbom/cloud-sql-proxy
                  - path: usr/share/licenses/cloud-sql-proxy-2-dev/LICENSE
                    source: dev/usr/share/licenses/cloud-sql-proxy-2-dev/LICENSE
                name: cloud-sql-proxy-2-dev
            url: https://github.com/GoogleCloudPlatform/cloud-sql-proxy
            version: 2.28.1
      paths:
        - type: file
          path: ${source.dir}/patch/test-client-limits-max-connections.patch
          uid: 0
          gid: 0
          source: package/main/cloud-sql-connectors-cloud-sql-proxy/alpine-3.24/patch/test-client-limits-max-connections.patch
os-release:
  name: Docker Hardened Images (Alpine)
  id: alpine
  version-id: "3.24"
  pretty-name: Docker Hardened Images/Alpine Linux v3.24
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
