# syntax=dhi.io/build:2-debian13

image: dhi.io/pkg-calico-whisker
variant: runtime
tags:
  - 3.32.4
  - 3.32.4-r0
  - 3.32.4-debian13
  - 3.32.4-r0-debian13
platforms:
  - linux/amd64
  - linux/arm64
dates:
  release: "2026-04-30"
vars:
  BUILD_ENTITLEMENT: ""
  COMMIT_SHA: edf78704a2c852da907d38bca19de94e5b69893a
  COREPACK_VERSION: 0.36.0-0
  NODEJS_VERSION: 24.22.2-0
  NPM_VERSION: 11.21.2-1
  PACKAGE_NAME: calico-whisker-3.32
  REL: "0"
  SEMVER_MAJOR_MINOR_VERSION: "3.32"
  SEMVER_MAJOR_VERSION: "3"
  SEMVER_VERSION: 3.32.4
  VERSION: 3.32.4
  YARN_VERSION: 1.22.22-1
contents:
  repositories:
    - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
  keyring:
    - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
  packages:
    - base-files
  builds:
    - name: calico-whisker
      work-dir: ${source.dir}/calico/whisker
      caches:
        - path: ${source.dir}/calico/whisker/node_modules
        - path: /root/.cache/yarn
      contents:
        repositories:
          - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
        keyring:
          - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
        packages:
          - jq
          - base-files
          - bash
          - ca-certificates
          - coreutils
          - findutils
          - git
          - libc6
          - libstdc++6
          - mawk
          - nodejs-24=24.22.2-0
          - node-corepack=0.36.0-0
          - npm=11.21.2-1
          - sed
          - yarn-classic=1.22.22-1
          - grep
        files:
          - url: git+https://github.com/projectcalico/calico.git#v3.32.4
            checksum: edf78704a2c852da907d38bca19de94e5b69893a
            path: ${source.dir}/calico
            spdx:
              name: calico-whisker
              version: 3.32.4
              packages:
                - name: calico-whisker
                  purl: pkg:github/projectcalico/calico@v3.32.4#whisker
                  license: Apache-2.0
            uid: 0
            gid: 0
      pipeline:
        - name: bump yarn dependencies
          uses: yarn/bump@v2
          privileged: true
          environment:
            HUSKY: "0"
          with:
            bumps: ${source.dir}/patch/yarn-bumps.json
            yarn-root: ${source.dir}/calico/whisker
        - name: install dependencies
          privileged: true
          environment:
            HUSKY: "0"
          runs: |
            set -eux -o pipefail

            yarn install --frozen-lockfile --ignore-scripts
        - name: build whisker ui
          runs: |
            set -eux -o pipefail

            node_opts="--max_old_space_size=8192"
            if [ "${target.fips}" = "true" ]; then
              unset OPENSSL_CONF
              node_opts="${node_opts} --openssl-legacy-provider"
            fi

            NODE_OPTIONS="${node_opts}" \
              CNX_APP_VERSION="v3.32.4" \
              yarn build

            mkdir -p "${target.dir}/usr/share/calico-whisker"
            cp -a dist/. "${target.dir}/usr/share/calico-whisker/"
        - name: install nginx configs
          runs: |
            set -eux -o pipefail

            mkdir -p "${target.dir}/etc/calico-whisker" "${target.dir}/usr/bin"

            sed 's!/var/run/nginx.pid!/tmp/nginx.pid!g; /user  nginx;/d' \
              docker-image/nginx.conf > "${target.dir}/etc/calico-whisker/nginx.conf"
            chmod 0644 "${target.dir}/etc/calico-whisker/nginx.conf"
            install -m 0644 docker-image/default.conf "${target.dir}/etc/calico-whisker/default.conf"

            grep -v 'sed -i.*nginx.conf' docker-image/nginx-start.sh \
              > "${target.dir}/usr/bin/nginx-start.sh"
            chmod 0755 "${target.dir}/usr/bin/nginx-start.sh"

            mkdir -p "${target.dir}/usr/share/doc/calico-whisker-3.32"
            cp ../LICENSE.md "${target.dir}/usr/share/doc/calico-whisker-3.32/copyright"
        - name: reinstall production dependencies for sbom
          privileged: true
          environment:
            HUSKY: "0"
          runs: |
            set -eux -o pipefail

            rm -rf node_modules
            yarn install --production --ignore-scripts
        - name: generate sbom
          uses: sbom@v1
          with:
            extra-scanners: javascript-package-cataloger
            prefix: calico-whisker
            source: ${source.dir}/calico/whisker
        - name: stage sbom into package root
          runs: |
            set -eux -o pipefail

            mkdir -p "${target.dir}/opt/docker/sbom"
            cp -a /opt/docker/sbom/calico-whisker "${target.dir}/opt/docker/sbom/"
        - uses: dhi/build-pkg:0
          with:
            apk:
              depends:
                - busybox
            deb:
              depends:
                - coreutils
                - dash
            depends:
              - nginx-mainline
            description: Calico Whisker web UI and nginx front-end assets
            files:
              - usr/share/calico-whisker
              - etc/calico-whisker
              - usr/bin/nginx-start.sh
              - usr/share/doc
              - opt/docker/sbom/calico-whisker
            license: Apache-2.0
            name: calico-whisker-3.32
            rel: 0
            url: https://github.com/projectcalico/calico/tree/master/whisker
            version: 3.32.4
      paths:
        - type: file
          path: ${source.dir}/patch/yarn-bumps.json
          uid: 0
          gid: 0
          source: package/main/calico-whisker/patch/yarn-bumps.json
os-release:
  name: Docker Hardened Images (Debian)
  id: debian
  version-id: "13"
  version-codename: trixie
  pretty-name: Docker Hardened Images/Debian GNU/Linux 13 (trixie)
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
