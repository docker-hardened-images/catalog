# syntax=dhi.io/build:2-alpine3.24

image: dhi.io/pkg-go-httpbin
variant: runtime
tags:
  - 2.26.0-alpine3.24
  - 2.26.0-r1-alpine3.24
platforms:
  - linux/amd64
  - linux/arm64
vars:
  COMMIT_SHA: 8b1bc1433750404fefd2a419cda3720d3088701b
  GOLANG_MAJOR_MINOR_VERSION: "1.26"
  GOLANG_VERSION: 1.26.11-r0
  PACKAGE_NAME: go-httpbin-2
  REL: "1"
  SEMVER_MAJOR_MINOR_VERSION: "2.26"
  SEMVER_MAJOR_VERSION: "2"
  SEMVER_VERSION: 2.26.0
  VERSION: 2.26.0
contents:
  repositories:
    - https://dhi.io/apk/alpine/v3.24/main
    - https://dhi.io/apk/alpine/v3.23/main
    - https://dl-cdn.alpinelinux.org/alpine/v3.24/main
    - https://dl-cdn.alpinelinux.org/alpine/v3.24/community
  keyring:
    - https://dhi.io/keyring/dhi-apk@docker-0F81AD7700D99184.rsa.pub
  packages:
    - alpine-baselayout-data
  builds:
    - name: go-httpbin-2
      work-dir: /go/src/github.com/mccutchen/go-httpbin
      contents:
        packages:
          - busybox
          - ca-certificates-bundle
          - golang-1.26=1.26.11-r0
          - golang-1.26-oci-config=1.26.11-r0
        files:
          - url: git+https://github.com/mccutchen/go-httpbin.git#v2.26.0
            checksum: 8b1bc1433750404fefd2a419cda3720d3088701b
            path: /go/src/github.com/mccutchen/go-httpbin
            spdx:
              name: go-httpbin
              version: 2.26.0
              packages:
                - name: go-httpbin
                  purl: pkg:golang/github.com/mccutchen/go-httpbin/v2@2.26.0
                  license: MIT
            uid: 0
            gid: 0
      pipeline:
        - name: update go dependencies
          uses: go/bump@v2
          with:
            deps: []
        - name: test
          runs: |
            set -eux -o pipefail

            if [ "false" = "true" ]; then
              export GODEBUG=fips140=on
            fi

            CGO_ENABLED=0 go test -count=1 ./...
        - name: build
          uses: go/build@v1
          with:
            fips: false
            ldflags:
              - -s
              - -w
              - -X main.version=2.26.0
              - -X main.commit=8b1bc1433750404fefd2a419cda3720d3088701b
              - -X main.buildDate=$(date -ud @${SOURCE_DATE_EPOCH} +%Y-%m-%dT%H:%M:%SZ)
            output: ${target.dir}/usr/bin/go-httpbin
            packages: ./cmd/go-httpbin
        - name: build dev
          uses: go/build@v1
          with:
            fips: false
            ldflags:
              - -X main.version=2.26.0
              - -X main.commit=8b1bc1433750404fefd2a419cda3720d3088701b
              - -X main.buildDate=$(date -ud @${SOURCE_DATE_EPOCH} +%Y-%m-%dT%H:%M:%SZ)
            output: ${target.dir}/usr/bin/go-httpbin-dev
            packages: ./cmd/go-httpbin
            strip: false
        - name: binary sbom
          uses: sbom@v1
          with:
            prefix: go-httpbin
            source: ${target.dir}/usr/bin/go-httpbin
        - uses: dhi/build-pkg:0
          with:
            description: Go port of httpbin, an HTTP request and response testing service
            files:
              - usr/bin/go-httpbin
            license: MIT
            name: go-httpbin-2
            rel: 1
            subpackages:
              - files:
                  - path: usr/bin/go-httpbin
                    source: usr/bin/go-httpbin-dev
                name: go-httpbin-2-dev
            url: https://github.com/mccutchen/go-httpbin
            version: 2.26.0
os-release:
  name: Docker Hardened Images (Alpine)
  id: alpine
  version-id: "3.24"
  pretty-name: Docker Hardened Images/Alpine Linux v3.24
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
