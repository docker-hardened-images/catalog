# syntax=dhi.io/build:2-alpine3.24

image: dhi.io/pkg-policy-reporter-ui
variant: runtime
tags:
  - 2.9.1-alpine3.24
  - 2.9.1-r3-alpine3.24
platforms:
  - linux/amd64
  - linux/arm64
dates:
  release: "2026-04-29"
vars:
  COMMIT_SHA: 777b05a0da847f431e43df854fedd4f28a382f2d
  GOLANG_MAJOR_MINOR_VERSION: "1.27"
  GOLANG_VERSION: 1.27.4-r0
  REL: "3"
  SEMVER_MAJOR_MINOR_VERSION: "2.9"
  SEMVER_MAJOR_VERSION: "2"
  SEMVER_VERSION: 2.9.1
  VERSION: 2.9.1
contents:
  repositories:
    - https://dhi.io/apk/alpine/v3.24/main
    - https://dhi.io/apk/alpine/v3.23/main
    - https://dl-cdn.alpinelinux.org/alpine/v3.24/main
    - https://dl-cdn.alpinelinux.org/alpine/v3.24/community
  keyring:
    - https://dhi.io/keyring/dhi-apk@docker-0F81AD7700D99184.rsa.pub
  packages:
    - alpine-baselayout-data
  builds:
    - name: policy-reporter-ui
      work-dir: /go/src/github.com/kyverno/policy-reporter-ui/frontend
      contents:
        packages:
          - busybox
          - bash
          - ca-certificates-bundle
          - coreutils
          - findutils
          - mawk
          - sed
          - jq
          - bun
          - golang-1.27=1.27.4-r0
          - golang-1.27-oci-config=1.27.4-r0
        files:
          - url: git+https://github.com/kyverno/policy-reporter-ui.git#v2.9.1
            checksum: 777b05a0da847f431e43df854fedd4f28a382f2d
            path: /go/src/github.com/kyverno/policy-reporter-ui
            spdx:
              name: kyverno-policy-reporter-ui
              version: 2.9.1
              packages:
                - name: kyverno-policy-reporter-ui
                  purl: pkg:golang/github.com/kyverno/policy-reporter-ui@2.9.1
                  license: Apache-2.0
            uid: 0
            gid: 0
      pipeline:
        - name: build-frontend
          work-dir: /go/src/github.com/kyverno/policy-reporter-ui/frontend
          privileged: true
          runs: |
            set -eux -o pipefail

            bun pm pkg set overrides.form-data="4.0.6"                 # CVE-2026-12143
            bun pm pkg set overrides.nuxt="4.6.3"                      # CVE-2026-71314, CVE-2026-71315, CVE-2026-71316, CVE-2026-71318, CVE-2026-71320, CVE-2026-71321, GHSA-7c4v-fwgw-9rf7, CVE-2026-114130, CVE-2026-114132, CVE-2026-114133, CVE-2026-119199
            bun pm pkg set overrides.nanoid="3.3.18"                   # CVE-2026-67213
            bun pm pkg set overrides.brace-expansion="5.0.12"          # CVE-2026-69152, CVE-2026-102276, CVE-2026-102277, CVE-2026-102278
            bun pm pkg set overrides."brace-expansion@2"="2.1.7"       # CVE-2026-14257, CVE-2026-69152, CVE-2026-102276, CVE-2026-102277, CVE-2026-102278
            bun pm pkg set overrides.undici="8.12.2"                   # CVE-2026-85024, CVE-2026-109869, CVE-2026-109924, CVE-2026-109841, CVE-2026-109383, CVE-2026-109829, CVE-2026-109932, CVE-2026-87018, CVE-2026-87029
            bun pm pkg set overrides.simple-git="4.0.1"                # CVE-2026-102826, CVE-2026-102827, CVE-2026-102828
            bun pm pkg set overrides."@simple-git/argv-parser"="2.0.1" # CVE-2026-102829
            bun pm pkg set overrides.markdown-it="15.0.3"              # CVE-2026-111758, CVE-2026-111766
            bun pm pkg set overrides."launch-editor"="2.14.2"          # CVE-2026-112942, CVE-2026-112943, CVE-2026-112944
            bun pm pkg set overrides.source-map-js="1.2.2"             # CVE-2026-93749
            bun pm pkg set overrides.postcss-selector-parser="7.1.6"   # CVE-2026-104844
            bun pm pkg set overrides."serialize-javascript"="7.1.3"    # CVE-2026-115897
            bun pm pkg set overrides."node-forge"="1.4.1"              # CVE-2026-118774, CVE-2026-118775, CVE-2026-118776, CVE-2026-118777, CVE-2026-118778, CVE-2026-118779, CVE-2026-118780, CVE-2026-118781, CVE-2026-118782, CVE-2026-119186, CVE-2026-119187, CVE-2026-119188, CVE-2026-119190
            bun pm pkg set overrides.minimatch="11.0.1"                # CVE-2026-118764
            bun pm pkg set overrides.glob="14.0.2"                     # CVE-2026-118773

            # Move nuxt to devDependencies since it's needed for build-time only.
            jq '.devDependencies.nuxt = .dependencies.nuxt | del(.dependencies.nuxt)' package.json > package.json.tmp
            mv package.json.tmp package.json

            bun install
            bun test

            bun - << 'BUN'
            import { readFileSync, writeFileSync } from 'node:fs'
            const path = 'nuxt.config.ts'
            const source = readFileSync(path, 'utf8')
            const needle = 'export default defineNuxtConfig({'
            if (!source.includes(needle)) {
              throw new Error('nuxt.config.ts missing defineNuxtConfig')
            }
            if (!source.includes('nitroConfig.baseURL')) {
              const hook = `
              hooks: {
                'nitro:config'(nitroConfig) {
                  nitroConfig.baseURL = '/'
                },
              },`
              writeFileSync(path, source.replace(needle, needle + hook))
            }
            BUN
            grep -q "nitroConfig.baseURL = '/'" nuxt.config.ts

            bun run generate

            test -s dist/index.html
            grep -q '<html' dist/index.html
            grep -qF 'baseURL:"."' dist/index.html

            mkdir -p ${target.dir}/usr/share/kyverno-policy-reporter-ui/ui
            cp -r dist/. ${target.dir}/usr/share/kyverno-policy-reporter-ui/ui/
        - name: prepare ui for sbom
          work-dir: /go/src/github.com/kyverno/policy-reporter-ui/frontend
          privileged: true
          runs: |
            set -eux -o pipefail

            rm -rf node_modules

            # --ignore-scripts skips the frontend "postinstall" nuxt script
            bun install --production --ignore-scripts

            # Remove esbuild from node modules to avoid phantom golang vulnerabilities in sbom
            rm -rf node_modules/@esbuild
            find node_modules -type d -name esbuild -exec rm -rf {} + 2> /dev/null || true
        - name: ui-sbom
          uses: sbom@v1
          with:
            prefix: kyverno-policy-reporter-ui-frontend
            source: /go/src/github.com/kyverno/policy-reporter-ui/frontend
        - name: copy-templates
          work-dir: /go/src/github.com/kyverno/policy-reporter-ui/backend
          runs: |
            set -eux -o pipefail

            cp -r templates ${target.dir}/usr/share/kyverno-policy-reporter-ui/templates
        - name: download backend dependencies
          uses: go/bump@v2
          work-dir: /go/src/github.com/kyverno/policy-reporter-ui/backend
          with:
            deps:
              - github.com/go-chi/chi/v5@v5.4.0
              - golang.org/x/net@v0.62.0
        - name: test
          work-dir: /go/src/github.com/kyverno/policy-reporter-ui/backend
          privileged: true
          runs: |
            set -eux -o pipefail

            go test $(go list ./... | grep -v '/util')
        - name: build-backend
          uses: go/build@v1
          work-dir: /go/src/github.com/kyverno/policy-reporter-ui/backend
          privileged: true
          with:
            fips: false
            output: ${target.dir}/usr/bin/kyverno-policy-reporter-ui
        - name: build dev
          uses: go/build@v1
          work-dir: /go/src/github.com/kyverno/policy-reporter-ui/backend
          with:
            fips: false
            output: ${target.dir}/usr/bin/kyverno-policy-reporter-ui-dev
            packages: .
            strip: false
        - name: stage dev data and frontend sbom
          runs: |
            set -eux -o pipefail

            cp -a ${target.dir}/usr/share/kyverno-policy-reporter-ui ${target.dir}/usr/share/kyverno-policy-reporter-ui-dev
            mkdir -p ${target.dir}/opt/docker/sbom ${target.dir}/opt/docker/sbom-dev
            cp -a /opt/docker/sbom/kyverno-policy-reporter-ui-frontend ${target.dir}/opt/docker/sbom/
            cp -a /opt/docker/sbom/kyverno-policy-reporter-ui-frontend ${target.dir}/opt/docker/sbom-dev/
        - uses: dhi/build-pkg:0
          with:
            description: Policy-reporter-ui
            files:
              - usr/bin/kyverno-policy-reporter-ui
              - usr/share/kyverno-policy-reporter-ui
              - opt/docker/sbom/kyverno-policy-reporter-ui-frontend
            license: Apache-2.0
            name: kyverno-policy-reporter-ui
            rel: 3
            subpackages:
              - files:
                  - path: usr/bin/kyverno-policy-reporter-ui
                    source: usr/bin/kyverno-policy-reporter-ui-dev
                  - path: usr/share/kyverno-policy-reporter-ui
                    source: usr/share/kyverno-policy-reporter-ui-dev
                  - path: opt/docker/sbom/kyverno-policy-reporter-ui-frontend
                    source: opt/docker/sbom-dev/kyverno-policy-reporter-ui-frontend
                name: kyverno-policy-reporter-ui-dev
            url: https://github.com/kyverno/policy-reporter-ui
            version: 2.9.1
os-release:
  name: Docker Hardened Images (Alpine)
  id: alpine
  version-id: "3.24"
  pretty-name: Docker Hardened Images/Alpine Linux v3.24
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
