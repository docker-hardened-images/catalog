# syntax=dhi.io/build:2-debian13

image: dhi.io/pkg-patroni
variant: runtime
tags:
  - 4.1.5
  - 4.1.5-r1
  - 4.1.5-debian13
  - 4.1.5-r1-debian13
platforms:
  - linux/amd64
  - linux/arm64
dates:
  release: "2024-08-29"
vars:
  COMMIT_SHA: 235fdb3990513c7852da8dc51e9cb92b6d0e4907
  PYTHON_MINOR: "3.13"
  PYTHON_VERSION: 3.13.15-1
  REL: "1"
  SEMVER_MAJOR_MINOR_VERSION: "4.1"
  SEMVER_MAJOR_VERSION: "4"
  SEMVER_VERSION: 4.1.5
  VERSION: 4.1.5
contents:
  packages:
    - base-files
  builds:
    - name: patroni
      work-dir: ${source.dir}/patroni
      caches:
        - path: /root/.cache/pip
      contents:
        repositories:
          - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
        keyring:
          - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
        packages:
          - bash
          - build-essential
          - ca-certificates
          - coreutils
          - curl
          - dpkg
          - findutils
          - grep
          - sed
          - libpq-dev
          - libpython-3.13-minimal=3.13.15-1
          - libpython-3.13-stdlib=3.13.15-1
          - libpython-3.13=3.13.15-1
          - libpython-3.13-dev=3.13.15-1
          - python-3.13-minimal=3.13.15-1
          - python-3.13=3.13.15-1
          - python-3.13-dev=3.13.15-1
          - python3-pip
          - python3-setuptools
          - python3-venv
          - python3-wheel
        files:
          - url: git+https://github.com/patroni/patroni.git#v4.1.5
            checksum: 235fdb3990513c7852da8dc51e9cb92b6d0e4907
            path: ${source.dir}/patroni
            spdx:
              name: patroni
              version: 4.1.5
              packages:
                - name: patroni
                  purl: pkg:pypi/patroni@4.1.5
                  license: MIT
            uid: 0
            gid: 0
      pipeline:
        - name: install patroni and stage FHS payload
          privileged: true
          runs: |
            set -eux -o pipefail

            export SOURCE_DIR="${source.dir}" TARGET_DIR="${target.dir}" PYTHON_BIN=/usr/bin/python3.13
            bash "${source.dir}/build-patroni.sh"
        - name: python dependencies sbom
          uses: sbom@v1
          with:
            extra-scanners: python-package-cataloger
            prefix: patroni
            source: ${target.dir}/usr/lib/patroni
        - uses: dhi/build-pkg:0
          with:
            deb:
              depends:
                - ca-certificates
                - libpq5
                - libssl3t64
            depends:
              - python-3.13
            description: Patroni PostgreSQL high-availability manager
            files:
              - usr/lib/patroni
              - usr/bin/patroni
              - usr/bin/patronictl
            formats:
              - deb
            license: MIT
            name: patroni
            rel: 1
            url: https://github.com/patroni/patroni
            version: 4.1.5
      paths:
        - type: file
          path: ${source.dir}/build-patroni.sh
          uid: 0
          gid: 0
          mode: "0755"
          source: package/main/patroni/build-patroni.sh
os-release:
  name: Docker Hardened Images (Debian)
  id: debian
  version-id: "13"
  version-codename: trixie
  pretty-name: Docker Hardened Images/Debian GNU/Linux 13 (trixie)
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
