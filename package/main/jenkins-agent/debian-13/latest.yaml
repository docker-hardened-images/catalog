  REL: "0"
  VERSION: 3390.v3381cf39b_501
contents:
  packages:
    - base-files
  builds:
    - name: jenkins-agent
      work-dir: ${source.dir}/remoting
      environment:
        JAVA_HOME: /usr/lib/jvm/temurin-21
        MAVEN_HOME: /opt/java/apache-maven-3.9.16
      caches:
        - path: /root/.m2/repository
      contents:
        repositories:
          - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
        keyring:
          - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
        packages:
          - bash
          - ca-certificates
          - coreutils
          - findutils
          - git
          - grep
          - gzip
          - sed
          - tar
          - curl
          - eclipse-temurin-21-jdk=21.0.12.8-0
        files:
          - url: git+https://github.com/jenkinsci/remoting.git#3390.v3381cf39b_501
            checksum: 3381cf39b501b3004fc5e6241a6c20d7abf8fed5
            path: ${source.dir}/remoting
            spdx:
              name: jenkins-remoting
              version: 3390.v3381cf39b_501
              packages:
                - name: jenkins-remoting
                  purl: pkg:dhi/jenkins-remoting@3390.v3381cf39b_501
                  license: MIT
            uid: 0
            gid: 0
          - url: https://dlcdn.apache.org/maven/maven-3/3.9.16/binaries/apache-maven-3.9.16-bin.tar.gz
            path: ${source.dir}/maven/apache-maven-3.9.16-bin.tar.gz
            spdx:
              name: maven
              version: 3.9.16
              packages:
                - name: maven
                  purl: pkg:generic/apache-maven@3.9.16
                  license: Apache-2.0
            uid: 0
            gid: 0
      pipeline:
        - name: install maven
          runs: |
            set -eux -o pipefail

            mkdir -p /opt/java
            tar -xzf "${source.dir}/maven/apache-maven-3.9.16-bin.tar.gz" -C /opt/java

            mkdir -p /usr/local/bin
            find "/opt/java/apache-maven-3.9.16/bin" -type f -executable -o -type l | while read -r file; do
              filename=$(basename "$file")
              ln -sf "/opt/java/apache-maven-3.9.16/bin/$filename" "/usr/local/bin/$filename"
            done
        - uses: mvn/mirror@v1
        - name: use maven central when mirror credentials are absent
          secrets:
            - id: maven_user
              env: MAVEN_USER
              optional: true
            - id: maven_password
              env: MAVEN_PASSWORD
              optional: true
          runs: |
            set -eux -o pipefail

            if [ -z "${MAVEN_USER:-}" ] || [ -z "${MAVEN_PASSWORD:-}" ]; then
              rm -f /root/.m2/settings.xml
            fi
        - name: build
          privileged: true
          secrets:
            - id: maven_user
              env: MAVEN_USER
              optional: true
            - id: maven_password
              env: MAVEN_PASSWORD
              optional: true
          runs: |
            set -eux -o pipefail

            sed -i "s|<changelist>.*</changelist>|<changelist>3390.v3381cf39b_501</changelist>|" pom.xml

            mvn clean install -DskipTests -Dmaven.test.skip=true -Dspotless.check.skip=true

            JAR_FILE="target/remoting-3390.v3381cf39b_501.jar"
            if [ ! -f "$JAR_FILE" ]; then
              echo "ERROR: JAR file not found: $JAR_FILE" >&2
              exit 1
            fi
            jar xf "$JAR_FILE" META-INF/MANIFEST.MF 2> /dev/null || {
              echo "ERROR: Could not extract manifest from JAR: $JAR_FILE" >&2
              exit 1
            }
            if ! grep -q "Main-Class:" META-INF/MANIFEST.MF; then
              echo "ERROR: JAR file missing Main-Class in manifest: $JAR_FILE" >&2
              echo "Manifest contents:" >&2
              cat META-INF/MANIFEST.MF
              rm -rf META-INF
              exit 1
            fi
            rm -rf META-INF
        - name: stage remoting artifacts
          runs: |
            set -eux -o pipefail

            install -d "${target.dir}/usr/share/jenkins"
            install -m 0644 "target/remoting-3390.v3381cf39b_501.jar" \
              "${target.dir}/usr/share/jenkins/agent.jar"
            ln -sf agent.jar "${target.dir}/usr/share/jenkins/slave.jar"

            install -d "${target.dir}/opt/docker/sbom"
            cp -a /opt/docker/sbom/jenkins-remoting \
              "${target.dir}/opt/docker/sbom/jenkins-remoting"
        - uses: dhi/build-pkg:0
          with:
            depends:
              - bash
              - coreutils
            description: Jenkins remoting agent JAR for inbound agents
            files:
              - usr/share/jenkins/agent.jar
              - usr/share/jenkins/slave.jar
              - opt/docker/sbom/jenkins-remoting
            formats:
              - deb
            license: MIT
            name: jenkins-agent
            rel: 0
            url: https://github.com/jenkinsci/remoting
            version: 3390.v3381cf39b.501
