variant: runtime
tags:
  - 3390.v3381cf39b.501
  - 3390.v3381cf39b.501-r0
  - 3390.v3381cf39b.501-debian13
  - 3390.v3381cf39b.501-r0-debian13
platforms:
  - linux/amd64
  - linux/arm64
vars:
  COMMIT_SHA: 3381cf39b501b3004fc5e6241a6c20d7abf8fed5
  JDK_MAJOR_VERSION: "21"
  JDK_VERSION: 21.0.12.8-0
  MAVEN_VERSION: 3.9.16
