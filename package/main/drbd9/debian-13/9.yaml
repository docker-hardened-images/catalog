# syntax=dhi.io/build:2-debian13

image: dhi.io/pkg-drbd9
variant: runtime
tags:
  - 9.3.3
  - 9.3.3-r2
  - 9.3.3-debian13
  - 9.3.3-r2-debian13
platforms:
  - linux/amd64
  - linux/arm64
dates:
  release: "2015-06-16"
vars:
  COMMIT_SHA: 97da76040a6b31aaf9e12f1a167e77ca2b3cb43e
  DRBD_COMMIT_SHA: 97da76040a6b31aaf9e12f1a167e77ca2b3cb43e
  DRBD_HEADERS_COMMIT_SHA: 32c2e607f3c496453ba2213440c66cbbeec98197
  DRBD_TREE_SHA: 6218d984b9ec6d1b75af9559d8d8b41d3f92dee7
  DRBD_VERSION: 9.3.3
  ENTRY_SH_CHECKSUM: d4eae12e115fc8b83c1d8ba4ccc5baa04429c674abf9a8272012fa7677439f82
  PYTHON_LBDIST_COMMIT_SHA: 1e9160e430017ba476631b8f6ddd6bf234948fed
  PYTHON_MINOR: "3.14"
  PYTHON_VERSION: 3.14.7-1
  REL: "2"
  SEMVER_MAJOR_MINOR_VERSION: "9.3"
  SEMVER_MAJOR_VERSION: "9"
  SEMVER_VERSION: 9.3.3
  VERSION: 9.3.3
contents:
  packages:
    - base-files
  builds:
    - name: drbd9
      contents:
        repositories:
          - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
        keyring:
          - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
        packages:
          - bash
          - base-files
          - ca-certificates
          - ca-certificates-bundle
          - coreutils
          - diffutils
          - findutils
          - gawk
          - grep
          - gzip
          - sed
          - tar
          - tzdata
          - build-essential
          - libstdc++6
          - libpython-3.14=3.14.7-1
          - libpython-3.14-minimal=3.14.7-1
          - libpython-3.14-stdlib=3.14.7-1
          - python-3.14-minimal=3.14.7-1
          - python-3.14=3.14.7-1
          - python-3.14-dev=3.14.7-1
          - python3-pip
          - python3-setuptools
          - python3-wheel
        files:
          - url: git+https://github.com/LINBIT/drbd.git#drbd-9.3.3
            checksum: 97da76040a6b31aaf9e12f1a167e77ca2b3cb43e
            path: ${source.dir}/drbd
            spdx:
              name: drbd
              version: 9.3.3
              packages:
                - name: drbd
                  purl: pkg:github/LINBIT/drbd@drbd-9.3.3
                  license: GPL-2.0
            uid: 0
            gid: 0
          - url: git+https://github.com/LINBIT/drbd-headers.git#32c2e607f3c496453ba2213440c66cbbeec98197
            checksum: 32c2e607f3c496453ba2213440c66cbbeec98197
            path: ${source.dir}/drbd-headers
            spdx:
              name: drbd-headers
              version: 32c2e607f3c496453ba2213440c66cbbeec98197
              packages:
                - name: drbd-headers
                  purl: pkg:dhi/drbd9@32c2e607f3c496453ba2213440c66cbbeec98197
                  license: GPL-2.0
            uid: 0
            gid: 0
          - url: https://raw.githubusercontent.com/LINBIT/drbd/97da76040a6b31aaf9e12f1a167e77ca2b3cb43e/docker/entry.sh
            checksum: sha256:d4eae12e115fc8b83c1d8ba4ccc5baa04429c674abf9a8272012fa7677439f82
            path: ${source.dir}/entry.sh
            spdx:
              name: drbd-entry-script
              version: 9.3.3
              packages:
                - name: drbd-entry-script
                  purl: pkg:github/LINBIT/drbd@97da76040a6b31aaf9e12f1a167e77ca2b3cb43e#docker/entry.sh
                  license: GPL-2.0
            uid: 0
            gid: 0
          - url: git+https://github.com/LINBIT/python-lbdist.git#master
            checksum: 1e9160e430017ba476631b8f6ddd6bf234948fed
            path: ${source.dir}/python-lbdist
            spdx:
              name: python-lbdist
              version: master
              packages:
                - name: python-lbdist
                  purl: pkg:github/LINBIT/python-lbdist@1e9160e430017ba476631b8f6ddd6bf234948fed
                  license: GPL-3.0
            uid: 0
            gid: 0
      pipeline:
        - name: assemble drbd source tarball with submodule and git revision
          runs: |
            set -eux -o pipefail

            mkdir -p "${target.dir}/usr/share/drbd9"
            cp -a "${source.dir}/drbd" "${target.dir}/usr/share/drbd9/drbd-drbd-9.3.3"

            cd "${target.dir}/usr/share/drbd9/drbd-drbd-9.3.3"

            rm -rf .git drbd/drbd-headers

            mkdir -p drbd
            echo "GIT-hash: 97da76040a6b31aaf9e12f1a167e77ca2b3cb43e" > drbd/.drbd_git_revision

            mkdir -p drbd/drbd-headers
            cp -a "${source.dir}/drbd-headers/." drbd/drbd-headers/
            rm -rf drbd/drbd-headers/.git

            cd "${target.dir}/usr/share/drbd9"
            tar czf drbd.tar.gz "drbd-drbd-9.3.3"
            rm -rf "drbd-drbd-9.3.3"
        - name: stage entrypoint script
          runs: |
            set -eux -o pipefail

            mkdir -p "${target.dir}/usr/lib/drbd9"
            install -m 0755 "${source.dir}/entry.sh" "${target.dir}/usr/lib/drbd9/entry.sh"
        - name: install setuptools without vendored wheel
          privileged: true
          runs: |
            set -eux -o pipefail

            python3 -m pip install --break-system-packages setuptools

            python3 -m pip install --break-system-packages \
              --target="${target.dir}/usr/lib/python3/dist-packages" setuptools
            find "${target.dir}/usr/lib/python3/dist-packages/setuptools/_vendor" \
              -name 'wheel-0.45.*' -type d -exec rm -rf {} + 2> /dev/null || true
            rm -rf "${target.dir}/usr/lib/python3/dist-packages/setuptools/_vendor/wheel"
        - name: install python-lbdist
          privileged: true
          runs: |
            set -eux -o pipefail

            python3 -m pip install --break-system-packages --no-build-isolation \
              --target="${target.dir}/usr/lib/drbd9/lbdist" "${source.dir}/python-lbdist"

            mkdir -p "${target.dir}/usr/bin"
            cp "${target.dir}/usr/lib/drbd9/lbdist/bin/lbdisttool.py" "${target.dir}/usr/bin/lbdisttool.py"
            chmod 0755 "${target.dir}/usr/bin/lbdisttool.py"
        - name: remove python bytecode from staged payload
          runs: |
            set -eux -o pipefail

            for path in \
              "${target.dir}/usr/lib/drbd9/lbdist" \
              "${target.dir}/usr/lib/python3/dist-packages/setuptools"; do
              find "$path" -type d -name __pycache__ -exec rm -rf {} + 2> /dev/null || true
              find "$path" -type f \( -name '*.pyc' -o -name '*.pyo' \) -delete 2> /dev/null || true
            done
        - uses: dhi/build-pkg:0
          with:
            depends:
              - python-3.14
            description: DRBD 9 kernel module sources, entrypoint, and python-lbdist tooling
            files:
              - usr/share/drbd9/drbd.tar.gz
              - usr/lib/drbd9/entry.sh
              - usr/lib/drbd9/lbdist
              - usr/bin/lbdisttool.py
              - usr/lib/python3/dist-packages/setuptools
            formats:
              - deb
            license: GPL-2.0
            name: drbd9
            rel: 2
            url: https://github.com/LINBIT/drbd
            version: 9.3.3
os-release:
  name: Docker Hardened Images (Debian)
  id: debian
  version-id: "13"
  version-codename: trixie
  pretty-name: Docker Hardened Images/Debian GNU/Linux 13 (trixie)
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
