# syntax=dhi.io/build:2-debian13

image: dhi.io/pkg-ansible
variant: runtime
tags:
  - 14.5.0
  - 14.5.0-r1
  - 14.5.0-debian13
  - 14.5.0-r1-debian13
platforms:
  - linux/amd64
  - linux/arm64
vars:
  ANSIBLE_CORE_VERSION: 2.21.5
  CARGO_VERSION: 1.97.1-0
  PYTHON_MINOR: "3.13"
  PYTHON_VERSION: 3.13.16-0
  REL: "1"
  RUSTC_VERSION: 1.97.1-0
  SEMVER_MAJOR_MINOR_VERSION: "14.5"
  SEMVER_MAJOR_VERSION: "14"
  SEMVER_VERSION: 14.5.0
  UV_ARCH: '#{ target.arch == "amd64" ? "x86_64-unknown-linux-gnu" : "aarch64-unknown-linux-gnu" }'
  UV_VERSION: 0.12.24
  VERSION: 14.5.0
contents:
  repositories:
    - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
  keyring:
    - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
  packages:
    - base-files
  builds:
    - name: ansible
      work-dir: ${source.dir}
      environment:
        CARGO_NET_GIT_FETCH_WITH_CLI: "true"
        OPENSSL_NO_VENDOR: "1"
        OPENSSL_STATIC: "0"
        UV_COMPILE_BYTECODE: "1"
        UV_PYTHON_DOWNLOADS: never
      caches:
        - path: /root/.cache/uv
        - path: /root/.cargo
      contents:
        packages:
          - bash
          - build-essential
          - ca-certificates
          - cargo-1.97=1.97.1-0
          - rustc-1.97=1.97.1-0
          - libcurl4t64
          - libgcc-s1
          - libsqlite3-0
          - libstdc++6
          - zlib1g
          - coreutils
          - findutils
          - git
          - grep
          - libffi-dev
          - libffi8
          - libssl-dev
          - libssl3t64
          - libzstd-dev
          - pkg-config
          - zlib1g-dev
          - libpython-3.13-minimal=3.13.16-0
          - libpython-3.13-stdlib=3.13.16-0
          - libpython-3.13-dev=3.13.16-0
          - libpython-3.13=3.13.16-0
          - python-3.13-minimal=3.13.16-0
          - python-3.13=3.13.16-0
          - python-3.13-dev=3.13.16-0
          - gzip
          - sed
          - tar
        files:
          - url: https://github.com/astral-sh/uv/releases/download/0.12.24/uv-${UV_ARCH}.tar.gz
            checksum: https://github.com/astral-sh/uv/releases/download/0.12.24/uv-${UV_ARCH}.tar.gz.sha256
            path: ${source.dir}/uv.tar.gz
            spdx:
              name: uv-binary
              version: 0.12.24
              packages:
                - name: uv
                  purl: pkg:github/astral-sh/uv@0.12.24
                  license: Apache-2.0
            uid: 0
            gid: 0
      pipeline:
        - name: setup uv
          runs: |
            set -eux -o pipefail

            mkdir -p /usr/local/bin
            tar -xzf "${source.dir}/uv.tar.gz" -C /usr/local/bin --strip-components=1
            chmod +x /usr/local/bin/uv
        - name: build venv at final path and stage it
          privileged: true
          runs: |
            set -eux -o pipefail

            export SOURCE_DIR="${source.dir}" \
              TARGET_DIR="${target.dir}" \
              PYTHON_BIN=/usr/bin/python3.13 \
              ANSIBLE_VERSION="14.5.0" \
              ANSIBLE_CORE_VERSION="2.21.5"
            bash "${source.dir}/build-ansible.sh"
        - uses: dhi/build-pkg:0
          with:
            deb:
              depends:
                - libssl3t64
            depends:
              - python-3.13-minimal
              - libpython-3.13-stdlib
              - openssh-client
            description: Ansible community package, the batteries-included distribution
            files:
              - usr/lib/ansible
              - usr/bin/ansible
              - usr/bin/ansible-community
              - usr/bin/ansible-config
              - usr/bin/ansible-console
              - usr/bin/ansible-doc
              - usr/bin/ansible-galaxy
              - usr/bin/ansible-inventory
              - usr/bin/ansible-playbook
              - usr/bin/ansible-pull
              - usr/bin/ansible-vault
            formats:
              - deb
            license: GPL-3.0-or-later
            name: ansible-14
            rel: 1
            url: https://docs.ansible.com/
            version: 14.5.0
      paths:
        - type: file
          path: ${source.dir}/requirements.txt
          uid: 0
          gid: 0
          mode: "0644"
          source: package/main/ansible/requirements.txt
        - type: file
          path: ${source.dir}/build-ansible.sh
          uid: 0
          gid: 0
          mode: "0755"
          source: package/main/ansible/build-ansible.sh
os-release:
  name: Docker Hardened Images (Debian)
  id: debian
  version-id: "13"
  version-codename: trixie
  pretty-name: Docker Hardened Images/Debian GNU/Linux 13 (trixie)
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
