  WATCHER_COMMIT: 06f84a1314be
  WATCHER_TARBALL_SHA256: 976ca8d79df60f8d179c0b43fbbed3f0f60bf2c34f19cd559632d5b44a597dae
contents:
  repositories:
    - https://dhi.io/apk/alpine/v3.24/main
    - https://dhi.io/apk/alpine/v3.23/main
    - https://dl-cdn.alpinelinux.org/alpine/v3.24/main
    - https://dl-cdn.alpinelinux.org/alpine/v3.24/community
  keyring:
    - https://dhi.io/keyring/dhi-apk@docker-0F81AD7700D99184.rsa.pub
  packages:
    - alpine-baselayout-data
  builds:
    - name: frankenphp-8.4
      work-dir: /go/src/github.com/dunglas/frankenphp
      shell: /bin/bash
      environment:
        GOTOOLCHAIN: local
      caches:
        - path: /go/pkg/mod
      contents:
        packages:
          - argon2-dev
          - autoconf
          - bash
          - binutils
          - bison
          - brotli-dev
          - build-base
          - ca-certificates-bundle
          - cmake
          - coreutils
          - curl-dev
          - file
          - findutils
          - gawk
          - git
          - gnu-libiconv-dev
          - grep
          - gzip
          - libsodium-dev
          - libxml2-dev
          - linux-headers
          - make
          - musl-utils
          - oniguruma-dev
          - openssl-dev
          - patch
          - patchelf
          - pkgconf
          - re2c
          - readline-dev
          - sed
          - sqlite-dev
          - tar
          - tzdata
          - xz
          - zlib-dev
          - golang-1.27=1.27.3-r0
          - golang-1.27-oci-config=1.27.3-r0
        files:
          - url: https://codeload.github.com/php/frankenphp/tar.gz/refs/tags/v1.13.4
            checksum: sha256:855d2e725cf4882e489cabf89f1827ff7e7991de348ed6d2e702056016751462
            path: ${source.dir}/frankenphp.tar.gz
            spdx:
              name: frankenphp
              version: 1.13.4
              packages:
                - name: frankenphp
                  purl: pkg:golang/github.com/dunglas/frankenphp@1.13.4
                  license: MIT
            uid: 0
            gid: 0
          - url: https://codeload.github.com/e-dant/watcher/tar.gz/06f84a1314be
            checksum: sha256:976ca8d79df60f8d179c0b43fbbed3f0f60bf2c34f19cd559632d5b44a597dae
            path: ${source.dir}/watcher.tar.gz
            spdx:
              name: watcher
              version: 06f84a1314be
              packages:
                - name: watcher
                  purl: pkg:github/e-dant/watcher@06f84a1314be
                  license: MIT
            uid: 0
            gid: 0
          - url: https://www.php.net/distributions/php-8.4.27.tar.xz
            checksum: sha256:dcf93923b0e38e0d5252b25b796520b5a47761a08b3488b6d0b5d1115764d3f0
            path: ${source.dir}/php.tar.xz
            spdx:
              name: php
              version: 8.4.27
              packages:
                - name: php
                  purl: pkg:dhi/php@8.4.27
                  license: PHP-3.01
            uid: 0
            gid: 0
      pipeline:
        - name: unpack sources
          work-dir: /tmp
          runs: |
            set -eux -o pipefail

            rm -rf /go/src/github.com/dunglas/frankenphp "${source.dir}/watcher"
            mkdir -p /go/src/github.com/dunglas/frankenphp "${source.dir}/watcher"
            tar -tzf "${source.dir}/frankenphp.tar.gz" > /tmp/frankenphp-listing
            tar -tzf "${source.dir}/watcher.tar.gz" > /tmp/watcher-listing
            grep -F 'frankenphp-1.13.4/' /tmp/frankenphp-listing
            grep -F '06f84a1314be' /tmp/watcher-listing
            tar -xzf "${source.dir}/frankenphp.tar.gz" -C /go/src/github.com/dunglas/frankenphp --strip-components=1
            tar -xzf "${source.dir}/watcher.tar.gz" -C "${source.dir}/watcher" --strip-components=1
            test -f /go/src/github.com/dunglas/frankenphp/go.mod
            test -f "${source.dir}/watcher/CMakeLists.txt"
        - name: update go dependencies
          uses: go/bump@v2
          work-dir: /go/src/github.com/dunglas/frankenphp
          privileged: true
          with:
            deps:
              - golang.org/x/crypto@v0.58.0
            tidy: true
        - name: update caddy go dependencies
          uses: go/bump@v2
          work-dir: /go/src/github.com/dunglas/frankenphp/caddy
          privileged: true
          with:
            deps:
              - golang.org/x/crypto@v0.58.0
              - google.golang.org/grpc@v1.85.0
              - github.com/getkin/kin-openapi@v0.152.0
              - go.opentelemetry.io/otel/sdk@v1.47.0
              - go.opentelemetry.io/otel/sdk/metric@v1.47.0
              - go.opentelemetry.io/otel/log@v1.47.0
              - go.opentelemetry.io/otel/sdk/log@v1.47.0
              - go.opentelemetry.io/otel/exporters/otlp/otlplog/otlploggrpc@v0.23.0
              - go.opentelemetry.io/otel/exporters/otlp/otlplog/otlploghttp@v0.23.0
              - go.opentelemetry.io/otel/exporters/stdout/stdoutlog@v0.23.0
              - go.opentelemetry.io/otel/exporters/otlp/otlptrace@v1.47.0
              - go.opentelemetry.io/otel/exporters/otlp/otlptrace/otlptracegrpc@v1.47.0
              - go.opentelemetry.io/otel/exporters/otlp/otlptrace/otlptracehttp@v1.47.0
              - go.opentelemetry.io/otel/exporters/otlp/otlpmetric/otlpmetricgrpc@v1.47.0
              - go.opentelemetry.io/otel/exporters/otlp/otlpmetric/otlpmetrichttp@v1.47.0
              - go.opentelemetry.io/otel/exporters/stdout/stdoutmetric@v1.47.0
              - go.opentelemetry.io/otel/exporters/stdout/stdouttrace@v1.47.0
            tidy: true
        - name: copy caddy module
          work-dir: /go/src/github.com/dunglas/frankenphp/caddy
          privileged: true
          runs: |
            set -eux -o pipefail

            test "$(go list -m -f '{{.Version}}' github.com/caddyserver/caddy/v2)" = "v2.11.7"
            go mod download github.com/caddyserver/caddy/v2
            src=$(go list -m -f '{{.Dir}}' github.com/caddyserver/caddy/v2)
            test -n "$src"
            cp -a "$src" /go/src/caddy
            chmod -R u+w /go/src/caddy
            go mod edit -replace github.com/caddyserver/caddy/v2=/go/src/caddy
        - name: unpack php
          runs: |
            set -eux -o pipefail

            rm -rf /tmp/php-src
            mkdir -p /tmp/php-src
            tar -xJf "${source.dir}/php.tar.xz" -C /tmp/php-src --strip-components=1
            test -f /tmp/php-src/configure
        - name: build php and watcher
          runs: |
            set -eux -o pipefail

            prefix=$(printf '%s' '06f84a1314be' | cut -c1-12)
            grep -F 'github.com/e-dant/watcher' go.mod | grep -q "$prefix"
            root="/tmp/native-root"
            rm -rf "$root"
            mkdir -p "$root"
            cmake -S "${source.dir}/watcher" -B /tmp/watcher-build \
              -DCMAKE_BUILD_TYPE=Release \
              -DCMAKE_INSTALL_PREFIX=/usr \
              -DBUILD_SHARED_LIBS=ON \
              -DBUILD_TESTING=OFF \
              -DCMAKE_CXX_FLAGS="-Wno-error=use-after-free"
            cmake --build /tmp/watcher-build -j "$(nproc)"
            DESTDIR="$root" cmake --install /tmp/watcher-build
            test -f /tmp/php-src/configure
            gnuArch=$(gcc -dumpmachine)
            (
              cd /tmp/php-src
              export CFLAGS="-fstack-protector-strong -fpic -fpie -O2 -D_LARGEFILE_SOURCE -D_FILE_OFFSET_BITS=64"
              export CPPFLAGS="$CFLAGS"
              export LDFLAGS="-Wl,-O1 -pie"
              ./configure \
                --build="$gnuArch" \
                --prefix=/usr \
                --sysconfdir=/etc \
                --with-config-file-path=/etc/php \
                --with-config-file-scan-dir=/etc/php/conf.d \
                --enable-option-checking=fatal \
                --with-mhash \
                --with-pic \
                --enable-mbstring \
                --enable-mysqlnd \
                --with-password-argon2 \
                --with-sodium=shared \
                --with-pdo-sqlite=/usr \
                --with-sqlite3=/usr \
                --with-curl \
                --with-iconv \
                --with-openssl \
                --with-readline \
                --with-zlib \
                --enable-phpdbg \
                --enable-phpdbg-readline \
                --with-pear \
                --enable-embed \
                --enable-zts \
                --disable-zend-signals
              grep -q 'define __MUSL__ 1' main/php_config.h
              make -j "$(nproc)"
              find . -type f -name '*.a' -delete
              make install INSTALL_ROOT="$root"
            )
            mkdir -p "${root}/etc/php"
            cp /tmp/php-src/php.ini-production "${root}/etc/php/php.ini-production"
            while IFS= read -r -d '' candidate; do
              if file "$candidate" | grep -q ELF; then
                strip --strip-unneeded "$candidate"
              fi
            done < <(find "$root" -type f -print0)
            cp -a "$root/." /
            php -v | grep -F 'PHP 8.4.27'
            php -v | grep -F '(ZTS)'
            mkdir -p /usr/lib/frankenphp "${target.dir}/usr/bin" "${target.dir}/usr/lib/frankenphp"
            php_so=""
            while IFS= read -r cand; do
              if file "$cand" | grep -q 'shared object'; then
                php_so=$cand
                break
              fi
            done < <(find /usr -type f \( -name 'libphp.so' -o -name 'libphp.so.*' \))
            if [ -z "$php_so" ]; then
              echo "libphp shared object not found" >&2
              find /usr -name 'libphp*' -ls || true
              exit 1
            fi
            php_soname=$(readelf -d "$php_so" | sed -n 's/.*SONAME.*\[\([^]]*\)\].*/\1/p')
            if [ -z "$php_soname" ]; then
              php_soname=libphp.so
            fi
            cp -a "$php_so" "/usr/lib/frankenphp/${php_soname}"
            cp -a "$php_so" "${target.dir}/usr/lib/frankenphp/${php_soname}"
            if [ "$php_soname" != "libphp.so" ]; then
              cp -a "$php_so" /usr/lib/frankenphp/libphp.so
              cp -a "$php_so" "${target.dir}/usr/lib/frankenphp/libphp.so"
            fi
            watcher_real=$(find /usr -type f -name 'libwatcher-c.so.*' -print -quit)
            if [ -z "$watcher_real" ]; then
              echo "libwatcher-c shared object not found" >&2
              find /usr -name 'libwatcher-c*' -ls || true
              exit 1
            fi
            watcher_soname=$(readelf -d "$watcher_real" | sed -n 's/.*SONAME.*\[\([^]]*\)\].*/\1/p')
            if [ "$watcher_soname" != "libwatcher-c.so.0" ]; then
              echo "unexpected watcher SONAME: ${watcher_soname}" >&2
              exit 1
            fi
            cp -a "$watcher_real" /usr/lib/frankenphp/libwatcher-c.so.0
            cp -a "$watcher_real" "${target.dir}/usr/lib/frankenphp/libwatcher-c.so.0"
            ln -sfn libwatcher-c.so.0 /usr/lib/frankenphp/libwatcher-c.so
            test ! -L "${target.dir}/usr/lib/frankenphp/libwatcher-c.so.0"
            ext_dir=$(php-config --extension-dir)
            mkdir -p "${target.dir}${ext_dir}"
            cp -a "${ext_dir}/." "${target.dir}${ext_dir}/"
            install -m755 /usr/bin/php "${target.dir}/usr/bin/php"
            patchelf --set-rpath /usr/lib/frankenphp "${target.dir}/usr/bin/php"
            install -m755 /usr/bin/phpize "${target.dir}/usr/bin/phpize"
            install -m755 /usr/bin/php-config "${target.dir}/usr/bin/php-config"
            mkdir -p "${target.dir}/usr/include" "${target.dir}/usr/lib/php" "${target.dir}/etc/php/conf.d" "${target.dir}/etc/frankenphp" "${target.dir}/usr/share/frankenphp"
            cp -a /usr/include/php "${target.dir}/usr/include/php"
            if [ -d /usr/lib/php/build ]; then
              cp -a /usr/lib/php/build "${target.dir}/usr/lib/php/build"
            fi
            cp /etc/php/php.ini-production "${target.dir}/etc/php/php.ini-production"
            printf 'extension=sodium.so\n' > "${target.dir}/etc/php/conf.d/sodium.ini"
            if php -m | grep -qx 'Zend OPcache'; then
              rm -f "${target.dir}${ext_dir}/opcache.so" "${target.dir}${ext_dir}/opcache.so.debug"
            else
              test -f "${target.dir}${ext_dir}/opcache.so"
              mods=$(php -d zend_extension=opcache.so -m)
              printf '%s\n' "$mods" | grep -qx 'Zend OPcache'
              printf 'zend_extension=opcache.so\n' > "${target.dir}/etc/php/conf.d/opcache.ini"
            fi
            install -m644 caddy/frankenphp/Caddyfile "${target.dir}/etc/frankenphp/Caddyfile"
            install -m644 package/content/index.php "${target.dir}/usr/share/frankenphp/index.php"
            {
              printf '%s' "-DFRANKENPHP_VERSION=v1.13.4 -fstack-protector-strong -fpic -fpie -O2 -D_LARGEFILE_SOURCE -D_FILE_OFFSET_BITS=64 "
              php-config --includes
              printf ' '
              mtls=$(mktemp -d)
              printf '__thread __attribute__((tls_model("local-exec"))) int v;\nint main(void){v=1;return v;}\n' > "${mtls}/p.c"
              if cc -O2 -mtls-size=12 "${mtls}/p.c" -o "${mtls}/p" > /dev/null 2>&1; then
                printf '%s' "-mtls-size=12"
              fi
              rm -rf "$mtls"
              printf '\n'
            } > /tmp/cgo-cflags
            {
              printf '%s' "-Wl,-z,stack-size=0x80000 -L/usr/lib/frankenphp -Wl,-rpath,/usr/lib/frankenphp -lssl -lcrypto -lreadline -largon2 -lcurl -lonig -lz "
              php-config --ldflags
              printf ' '
              php-config --libs
              printf '\n'
            } > /tmp/cgo-ldflags
        - name: download modules
          privileged: true
          runs: |
            set -eux -o pipefail

            go mod download
            (cd caddy && go mod download)
        - name: test
          privileged: true
          environment:
            CGO_ENABLED: "1"
            GODEBUG: ""
            LD_LIBRARY_PATH: /usr/lib64:/usr/lib/frankenphp
          runs: |
            set -eux -o pipefail

            go test -count=1 -timeout 15m ./internal/extgen/ ./internal/state/ ./internal/watcher/ ./internal/phpheaders/
        - name: build frankenphp
          uses: go/build@v1
          work-dir: /go/src/github.com/dunglas/frankenphp/caddy/frankenphp
          environment:
            GOFLAGS: -buildvcs=false
          with:
            cgo_enabled: 1
            extra-env: CGO_CFLAGS="$(cat /tmp/cgo-cflags)" CGO_LDFLAGS="$(cat /tmp/cgo-ldflags)"
            fips: false
            ldflags:
              - -s
              - -X 'github.com/caddyserver/caddy/v2.CustomVersion=FrankenPHP v1.13.4 PHP 8.4.27 Caddy'
              - -X github.com/caddyserver/caddy/v2.CustomBinaryName=frankenphp
              - -X 'github.com/caddyserver/caddy/v2/modules/caddyhttp.ServerHeader=FrankenPHP Caddy'
            output: ${target.dir}/usr/bin/frankenphp
            packages: .
            tags: nobadger,nomysql,nopgx
        - name: record caddy sbom
          uses: spdx@v1
          with:
            license: Apache-2.0
            name: caddy
            purl: pkg:golang/github.com/caddyserver/caddy/v2@v2.11.7
            version: 2.11.7
        - name: install sbom
          runs: |
            set -eux -o pipefail

            install -d "${target.dir}/opt/docker/sbom"
            cp -a /opt/docker/sbom/php "${target.dir}/opt/docker/sbom/"
            cp -a /opt/docker/sbom/watcher "${target.dir}/opt/docker/sbom/"
            cp -a /opt/docker/sbom/frankenphp "${target.dir}/opt/docker/sbom/"
            cp -a /opt/docker/sbom/caddy "${target.dir}/opt/docker/sbom/"
        - uses: dhi/build-pkg:0
          with:
            depends:
              - argon2-libs
              - brotli-libs
              - ca-certificates
              - gnu-libiconv-libs
              - libcurl
              - libgcc
              - libsodium
              - libssl3
              - libstdc++
              - libxml2
              - mailcap
              - oniguruma
              - readline
              - sqlite-libs
              - zlib
              - '!php-8.2'
              - '!php-8.3'
              - '!php-8.4'
              - '!php-8.5'
              - '!frankenphp-8.4-fips'
              - '!frankenphp-8.2'
              - '!frankenphp-8.2-fips'
              - '!frankenphp-8.3'
              - '!frankenphp-8.3-fips'
              - '!frankenphp-8.5'
              - '!frankenphp-8.5-fips'
            description: FrankenPHP, the modern PHP app server
            files:
              - usr/bin/frankenphp
              - usr/bin/php
              - usr/lib/frankenphp
              - usr/lib/php/extensions
              - etc/frankenphp
              - etc/php
              - usr/share/frankenphp
              - opt/docker/sbom/php
              - opt/docker/sbom/watcher
              - opt/docker/sbom/frankenphp
              - opt/docker/sbom/caddy
            formats:
              - apk
            license: MIT
            name: frankenphp-8.4
            provides:
              - frankenphp
            rel: 0
            subpackages:
              - apk:
                  depends:
                    - frankenphp-8.4
                    - '!php-8.2-dev'
                    - '!php-8.3-dev'
                    - '!php-8.4-dev'
                    - '!php-8.5-dev'
                    - '!frankenphp-8.4-fips-dev'
                    - '!frankenphp-8.2-dev'
                    - '!frankenphp-8.2-fips-dev'
                    - '!frankenphp-8.3-dev'
                    - '!frankenphp-8.3-fips-dev'
                    - '!frankenphp-8.5-dev'
                    - '!frankenphp-8.5-fips-dev'
                deb:
                  depends:
                    - frankenphp-8.4
                files:
                  - usr/bin/phpize
                  - usr/bin/php-config
                  - usr/include/php
                  - usr/lib/php/build
                name: frankenphp-8.4-dev
                provides:
                  - frankenphp-dev
            url: https://frankenphp.dev
            version: 1.13.4
      paths:
        - type: file
          path: ${source.dir}/patch/php-8.2-musl-jit-tlsgd.patch
          uid: 0
          gid: 0
          source: package/main/frankenphp/patch/php-8.2-musl-jit-tlsgd.patch
