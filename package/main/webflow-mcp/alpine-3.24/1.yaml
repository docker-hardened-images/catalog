# syntax=dhi.io/build:2-alpine3.24

image: dhi.io/pkg-webflow-mcp
variant: runtime
tags:
  - 1.0.0-alpine3.24
  - 1.0.0-r8-alpine3.24
platforms:
  - linux/amd64
  - linux/arm64
dates:
  release: "2025-09-17"
vars:
  COMMIT_SHA: ca01e120d915daae39e761a657f8eb6c9372d8ad
  NODEJS_VERSION: 24.22.1-r1
  REL: "8"
  SEMVER_MAJOR_MINOR_VERSION: "1.0"
  SEMVER_MAJOR_VERSION: "1"
  SEMVER_VERSION: 1.0.0
  VERSION: 1.0.0
contents:
  repositories:
    - https://dhi.io/apk/alpine/v3.24/main
    - https://dhi.io/apk/alpine/v3.23/main
    - https://dl-cdn.alpinelinux.org/alpine/v3.24/main
    - https://dl-cdn.alpinelinux.org/alpine/v3.24/community
  keyring:
    - https://dhi.io/keyring/dhi-apk@docker-0F81AD7700D99184.rsa.pub
  packages:
    - alpine-baselayout-data
  builds:
    - name: webflow-mcp
      work-dir: ${source.dir}/app-src
      caches:
        - path: /root/.npm
      contents:
        packages:
          - bash
          - busybox
          - ca-certificates-bundle
          - coreutils
          - nodejs-24=24.22.1-r1
          - npm
        files:
          - url: git+https://github.com/webflow/mcp-server.git#1.0.0
            checksum: ca01e120d915daae39e761a657f8eb6c9372d8ad
            path: ${source.dir}/app-src
            spdx:
              name: webflow-mcp
              version: 1.0.0
              packages:
                - name: webflow-mcp-server
                  purl: pkg:npm/webflow-mcp-server@1.0.0
                  license: MIT
            uid: 0
            gid: 0
      pipeline:
        - name: drop unused agents dependency
          privileged: true
          runs: |
            set -eux -o pipefail

            npm pkg delete dependencies.agents
            npm install --ignore-scripts
        - name: bump dependencies
          uses: npm/bump@v1
          privileged: true
          environment:
            DHI_NO_SFW: "true"
            NPM_CONFIG_IGNORE_SCRIPTS: "true"
          with:
            bumps: ${source.dir}/patch/npm-bumps.json
            npm-root: ${source.dir}/app-src
        - name: build production node_modules
          privileged: true
          runs: |
            set -eux -o pipefail

            npm ci --ignore-scripts
            npx tsup src/index.ts --clean

            rm -rf node_modules

            npm ci --ignore-scripts --omit=dev
            npm pkg delete devDependencies
        - name: production node_modules sbom
          uses: sbom@v1
          with:
            extra-scanners: javascript-package-cataloger
            prefix: webflow-mcp-npm
            source: ${source.dir}/app-src/node_modules
        - name: stage payload
          runs: |
            set -eux -o pipefail

            mkdir -p "${target.dir}/usr/lib/nodejs/webflow-mcp"
            cp -a "${source.dir}/app-src/dist" \
              "${source.dir}/app-src/node_modules" \
              "${source.dir}/app-src/package.json" \
              "${target.dir}/usr/lib/nodejs/webflow-mcp/"
        - uses: dhi/build-pkg:0
          with:
            description: Webflow MCP server (Model Context Protocol server for the Webflow Data API)
            files:
              - usr/lib/nodejs/webflow-mcp
            license: MIT
            name: webflow-mcp
            rel: 8
            url: https://github.com/webflow/mcp-server
            version: 1.0.0
      paths:
        - type: file
          path: ${source.dir}/patch/npm-bumps.json
          uid: 0
          gid: 0
          source: package/main/webflow-mcp/patch/npm-bumps.json
os-release:
  name: Docker Hardened Images (Alpine)
  id: alpine
  version-id: "3.24"
  pretty-name: Docker Hardened Images/Alpine Linux v3.24
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
