# syntax=dhi.io/build:2-alpine3.24

image: dhi.io/pkg-grafana-pdc-agent
variant: runtime
tags:
  - 0.0.68-alpine3.24
  - 0.0.68-r1-alpine3.24
platforms:
  - linux/amd64
  - linux/arm64
dates:
  release: "2023-02-01"
vars:
  COMMIT_SHA: cbf91ef0791c4be781bd5a2f9390208c513d9d4a
  GOLANG_VERSION: 1.27.4-r0
  PACKAGE_NAME: grafana-pdc-agent-0
  REL: "1"
  SEMVER_MAJOR_MINOR_VERSION: "0.0"
  SEMVER_MAJOR_VERSION: "0"
  SEMVER_VERSION: 0.0.68
  VERSION: 0.0.68
contents:
  repositories:
    - https://dhi.io/apk/alpine/v3.24/main
    - https://dhi.io/apk/alpine/v3.23/main
    - https://dl-cdn.alpinelinux.org/alpine/v3.24/main
    - https://dl-cdn.alpinelinux.org/alpine/v3.24/community
  keyring:
    - https://dhi.io/keyring/dhi-apk@docker-0F81AD7700D99184.rsa.pub
  packages:
    - alpine-baselayout-data
  builds:
    - name: grafana-pdc-agent
      work-dir: /go/src/github.com/grafana/pdc-agent
      contents:
        packages:
          - busybox
          - bash
          - ca-certificates-bundle
          - openssh-client-default
          - golang-1.27=1.27.4-r0
          - golang-1.27-oci-config=1.27.4-r0
        files:
          - url: git+https://github.com/grafana/pdc-agent.git#v0.0.68
            checksum: cbf91ef0791c4be781bd5a2f9390208c513d9d4a
            path: /go/src/github.com/grafana/pdc-agent
            spdx:
              name: grafana-pdc-agent
              version: 0.0.68
              packages:
                - name: grafana-pdc-agent
                  purl: pkg:golang/github.com/grafana/pdc-agent@0.0.68
                  license: Apache-2.0
            uid: 0
            gid: 0
      pipeline:
        - name: update go dependencies
          uses: go/bump@v2
          with:
            deps: []
            download: true
        - uses: go/hermetic@v1
        - name: test
          runs: |
            set -eux -o pipefail

            if [ "false" = "true" ]; then
              export GOFIPS140=v1.0.0
              export GODEBUG=fips140=on
            fi

            CGO_ENABLED=0 go test -count=1 ./...
        - name: build pdc
          uses: go/build@v1
          with:
            cgo_enabled: 0
            fips: false
            ldflags:
              - -s
              - -w
              - -X main.version=0.0.68
              - -X main.commit=cbf91ef0791c4be781bd5a2f9390208c513d9d4a
              - -X main.date=$(date -ud @${SOURCE_DATE_EPOCH} +'%Y-%m-%dT%H:%M:%SZ')
            output: ${target.dir}/usr/bin/pdc
            packages: ./cmd/pdc
        - name: build pdc dev
          uses: go/build@v1
          with:
            cgo_enabled: 0
            fips: false
            ldflags:
              - -X main.version=0.0.68
              - -X main.commit=cbf91ef0791c4be781bd5a2f9390208c513d9d4a
              - -X main.date=$(date -ud @${SOURCE_DATE_EPOCH} +'%Y-%m-%dT%H:%M:%SZ')
            output: ${target.dir}/usr/bin/pdc-dev
            packages: ./cmd/pdc
            strip: false
        - name: verify module version and ldflags
          runs: |
            set -eux -o pipefail

            runtime=${target.dir}/usr/bin/pdc
            devbin=${target.dir}/usr/bin/pdc-dev
            test -x "$runtime"
            test -x "$devbin"

            go version -m "$runtime" | grep -F 'CGO_ENABLED=0'
            go version -m "$runtime" | grep -F -- "-X main.version=0.0.68"
            go version -m "$runtime" | grep -F -- "-X main.commit=cbf91ef0791c4be781bd5a2f9390208c513d9d4a"
            go version -m "$runtime" | grep -F -- '-s'
            go version -m "$runtime" | grep -F -- '-w'
            go version -m "$runtime" | grep -E -- '-X main.date=[0-9][0-9][0-9][0-9]-[0-9][0-9]-[0-9][0-9]T'

            go version -m "$devbin" | grep -F 'CGO_ENABLED=0'
            go version -m "$devbin" | grep -F -- "-X main.version=0.0.68"
            go version -m "$devbin" | grep -F -- "-X main.commit=cbf91ef0791c4be781bd5a2f9390208c513d9d4a"
            if go version -m "$devbin" | grep -E -- '-ldflags=.*-s|-ldflags=.*-w'; then
              echo "dev binary must not be built with -s or -w" >&2
              exit 1
            fi
        - name: record module sbom
          uses: spdx@v1
          with:
            license: Apache-2.0
            name: grafana-pdc-agent-0
            purl: pkg:golang/github.com/grafana/pdc-agent@0.0.68
            version: 0.0.68
        - name: stage sbom
          runs: |
            set -eux -o pipefail

            test -s /opt/docker/sbom/grafana-pdc-agent-0/.spdx.grafana-pdc-agent-0.json
            grep -q 'pkg:golang/github.com/grafana/pdc-agent@0.0.68' /opt/docker/sbom/grafana-pdc-agent-0/.spdx.grafana-pdc-agent-0.json
            install -d "${target.dir}/opt/docker/sbom"
            cp -a /opt/docker/sbom/grafana-pdc-agent-0 "${target.dir}/opt/docker/sbom/"
            test -s "${target.dir}/opt/docker/sbom/grafana-pdc-agent-0/.spdx.grafana-pdc-agent-0.json"
        - name: stage license
          runs: |
            set -eux -o pipefail

            src=/go/src/github.com/grafana/pdc-agent/LICENSE
            dest="${target.dir}/usr/share/licenses/grafana-pdc-agent-0/LICENSE"
            devdest="${target.dir}/usr/share/licenses/grafana-pdc-agent-0-dev/LICENSE"
            test -s "$src"
            grep -q 'Apache License' "$src"
            grep -q 'Version 2.0' "$src"
            install -d "$(dirname "$dest")" "$(dirname "$devdest")"
            install -m644 "$src" "$dest"
            install -m644 "$src" "$devdest"
            test -s "$dest"
            test -s "$devdest"
            grep -q 'Apache License' "$dest"
            grep -q 'Apache License' "$devdest"
        - uses: dhi/build-pkg:0
          with:
            apk:
              depends:
                - openssh-client-default
            deb:
              depends:
                - openssh-client
            description: Grafana Private Datasource Connect agent
            files:
              - usr/bin/pdc
              - opt/docker/sbom/grafana-pdc-agent-0
              - usr/share/licenses/grafana-pdc-agent-0/LICENSE
            license: Apache-2.0
            name: grafana-pdc-agent-0
            rel: 1
            subpackages:
              - apk:
                  depends:
                    - openssh-client-default
                deb:
                  depends:
                    - openssh-client
                description: pdc binary without strip (dev)
                files:
                  - path: usr/bin/pdc
                    source: usr/bin/pdc-dev
                  - path: usr/share/licenses/grafana-pdc-agent-0/LICENSE
                    source: usr/share/licenses/grafana-pdc-agent-0-dev/LICENSE
                name: grafana-pdc-agent-0-dev
            url: https://github.com/grafana/pdc-agent
            version: 0.0.68
