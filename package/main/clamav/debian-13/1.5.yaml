# syntax=dhi.io/build:2-debian13

image: dhi.io/pkg-clamav
variant: runtime
tags:
  - 1.5.4
  - 1.5.4-r1
  - 1.5.4-debian13
  - 1.5.4-r1-debian13
platforms:
  - linux/amd64
  - linux/arm64
dates:
  release: "2025-10-07"
vars:
  CARGO_VERSION: 1.97.1-0
  COMMIT_SHA: fa59fca15872bb8a914ba4c68188bcc8a502cbdf
  PACKAGE_NAME: clamav-1.5
  PYTHON_VERSION: 3.13.15-1
  REL: "1"
  RUSTC_VERSION: 1.97.1-0
  SEMVER_MAJOR_MINOR_VERSION: "1.5"
  SEMVER_MAJOR_VERSION: "1"
  SEMVER_VERSION: 1.5.4
  VERSION: 1.5.4
contents:
  repositories:
    - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
  keyring:
    - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
  packages:
    - base-files
  builds:
    - name: clamav-1.5
      environment:
        PATH: /usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
      caches:
        - path: /root/.cargo
      contents:
        repositories:
          - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
        keyring:
          - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
        packages:
          - bash
          - bison
          - build-essential
          - ca-certificates
          - cargo-1.97=1.97.1-0
          - rustc-1.97=1.97.1-0
          - check
          - cmake
          - coreutils
          - diffutils
          - findutils
          - flex
          - g++
          - gawk
          - gcc
          - grep
          - libbz2-dev
          - libc6-dev
          - libcurl4-openssl-dev
          - libjson-c-dev
          - libmilter-dev
          - libncurses-dev
          - libpcre2-dev
          - libssl-dev
          - libstdc++6
          - libxml2-dev
          - make
          - net-tools
          - pkg-config
          - python-3.13=3.13.15-1
          - python-3.13-dev=3.13.15-1
          - python3-pip
          - python3-setuptools
          - python3-wheel
          - sed
          - zlib1g-dev
        files:
          - url: git+https://github.com/Cisco-Talos/clamav#clamav-1.5.4
            checksum: fa59fca15872bb8a914ba4c68188bcc8a502cbdf
            path: ${source.dir}/clamav
            spdx:
              name: clamav
              version: 1.5.4
              packages:
                - purl: pkg:dhi/clamav@1.5.4
                  license: GPL-2.0
            uid: 0
            gid: 0
      pipeline:
        - name: install pytest
          privileged: true
          runs: |
            set -eux -o pipefail

            pip3 install --break-system-packages pytest
        - name: compile
          work-dir: ${source.dir}/clamav
          privileged: true
          runs: |
            set -eux -o pipefail

            cmake -S . -B build \
              -DCMAKE_BUILD_TYPE="Release" \
              -DCMAKE_INSTALL_PREFIX="/usr" \
              -DCMAKE_INSTALL_LIBDIR="/usr/lib" \
              -DAPP_CONFIG_DIRECTORY="/etc/clamav" \
              -DDATABASE_DIRECTORY="/var/lib/clamav" \
              -DENABLE_CLAMONACC=OFF \
              -DENABLE_EXAMPLES=OFF \
              -DENABLE_JSON_SHARED=ON \
              -DENABLE_MAN_PAGES=OFF \
              -DENABLE_MILTER=ON \
              -DENABLE_STATIC_LIB=OFF

            make -C build -j"$(($(nproc) - 1))" install DESTDIR="${target.dir}"
        - name: tests
          work-dir: ${source.dir}/clamav/build
          runs: |
            set -eux -o pipefail

            ctest -V --timeout 3000
        - name: setup configuration
          work-dir: ${source.dir}/clamav
          runs: |
            set -eux -o pipefail

            sed -e "s|^\(Example\)|\# \1|" \
              -e "s|.*\(LocalSocket\) .*|\1 /tmp/clamd.sock|" \
              -e "s|.*\(TCPSocket\) .*|\1 3310|" \
              -e "s|.*\(TCPAddr\) .*|#\1 0.0.0.0|" \
              -e "s|.*\(User\) .*|\1 clamav|" \
              -e "s|^\#\(LogFile\) .*|\1 /var/log/clamav/clamd.log|" \
              -e "s|^\#\(LogTime\).*|\1 yes|" \
              ${target.dir}/etc/clamav/clamd.conf.sample > ${target.dir}/etc/clamav/clamd.conf

            sed -e "s|^\(Example\)|\# \1|" \
              -e "s|.*\(DatabaseOwner\) .*|\1 clamav|" \
              -e "s|^\#\(UpdateLogFile\) .*|\1 /var/log/clamav/freshclam.log|" \
              -e "s|^\#\(NotifyClamd\).*|\1 /etc/clamav/clamd.conf|" \
              -e "s|^\#\(ScriptedUpdates\).*|\1 yes|" \
              ${target.dir}/etc/clamav/freshclam.conf.sample > ${target.dir}/etc/clamav/freshclam.conf

            sed -e "s|^\(Example\)|\# \1|" \
              -e "s|.*\(MilterSocket\) .*|\1 inet:7357|" \
              -e "s|.*\(User\) .*|\1 clamav|" \
              -e "s|^\#\(LogFile\) .*|\1 /var/log/clamav/milter.log|" \
              -e "s|^\#\(LogTime\).*|\1 yes|" \
              -e "s|.*\(\ClamdSocket\) .*|\1 unix:/tmp/clamd.sock|" \
              ${target.dir}/etc/clamav/clamav-milter.conf.sample > ${target.dir}/etc/clamav/clamav-milter.conf
        - name: prune install-tree cruft
          runs: |
            set -eux -o pipefail

            rm -rf "${target.dir}/usr/include"
            rm -rf "${target.dir}/usr/lib/pkgconfig"
            find "${target.dir}/usr/lib" -name '*.a' -delete
        - uses: dhi/build-pkg:0
          with:
            depends:
              - ca-certificates
              - libbz2-1.0
              - libcurl4t64
              - libjson-c5
              - libmilter1.0.1
              - libncurses6
              - libpcre2-8-0
              - libssl3t64
              - libxml2
              - zlib1g
            description: ClamAV open source antivirus engine for detecting trojans, viruses, malware and other malicious threats
            files:
              - usr
              - etc
            formats:
              - deb
            license: GPL-2.0
            name: clamav-1.5
            rel: 1
            url: https://www.clamav.net
            version: 1.5.4
os-release:
  name: Docker Hardened Images (Debian)
  id: debian
  version-id: "13"
  version-codename: trixie
  pretty-name: Docker Hardened Images/Debian GNU/Linux 13 (trixie)
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
