# syntax=dhi.io/build:2-debian13

image: dhi.io/pkg-timescaledb
variant: runtime
tags:
  - 2-pg16-r2
  - 2.32.1-pg16-r2
  - 2-pg16-r2-debian13
  - 2.32.1-pg16-r2-debian13
platforms:
  - linux/amd64
  - linux/arm64
dates:
  release: "2023-09-14"
  end-of-life: "2028-11-09"
vars:
  COMMIT_SHA: 692795d0cf7126e816d1f30b323f24b1473d82e9
  GOLANG_VERSION: 1.27.4-18
  PACKAGE_NAME: timescaledb-2-pg16
  PARALLEL_COPY_COMMIT_SHA: 64ba6ec60dea1ac2558907f6947f23b01e986407
  PARALLEL_COPY_VERSION: 0.14.0
  PG_MAJOR: "16"
  PG_PACKAGE_VERSION: 16.16-2+dhi
  PG16_PACKAGE_VERSION: 16.16-2+dhi
  PG17_PACKAGE_VERSION: 17.12-2+dhi
  PG18_PACKAGE_VERSION: 18.7-2+dhi
  REL: "2"
  SEMVER_MAJOR_MINOR_VERSION: "2.32"
  SEMVER_MAJOR_VERSION: "2"
  SEMVER_VERSION: 2.32.1
  TUNE_COMMIT_SHA: 8e9c58d5e48458ec459d59051e048b7e6ef4ffdc
  TUNE_VERSION: 0.19.1
  VERSION: 2.32.1
contents:
  repositories:
    - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
  keyring:
    - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
  packages:
    - base-files
  builds:
    - name: timescaledb-2-pg16
      work-dir: ${source.dir}/timescaledb
      environment:
        GOTOOLCHAIN: local
      caches:
        - path: /go/pkg/mod
      contents:
        packages:
          - bash
          - build-essential
          - ca-certificates
          - ca-certificates-bundle
          - cmake
          - coreutils
          - git
          - golang-1.27=1.27.4-18
          - golang-1.27-oci-config=1.27.4-18
          - libcurl4-openssl-dev
          - libgss-dev
          - libicu-dev
          - libldap2-dev
          - liblz4-dev
          - libnuma-dev
          - libpam0g-dev
          - libpq-dev
          - libpq5
          - libreadline-dev
          - libselinux1-dev
          - libssl-dev
          - liburing-dev
          - libxml2-dev
          - libxslt1-dev
          - libzstd-dev
          - pkgconf
          - postgresql-client-16=16.16-2+dhi
          - postgresql-server-dev-16=16.16-2+dhi
          - uuid-dev
          - zlib1g-dev
          - tzdata
        files:
          - url: git+https://github.com/timescale/timescaledb.git#2.32.1
            checksum: 692795d0cf7126e816d1f30b323f24b1473d82e9
            path: ${source.dir}/timescaledb
            spdx:
              name: timescaledb
              version: 2.32.1
              packages:
                - name: timescaledb
                  purl: pkg:github/timescale/timescaledb@2.32.1
                  license: Apache-2.0
                - name: timescaledb-tsl
                  purl: pkg:github/timescale/timescaledb@2.32.1
                  license: LicenseRef-Timescale
            uid: 0
            gid: 0
          - url: git+https://github.com/timescale/timescaledb-tune.git#v0.19.1
            checksum: 8e9c58d5e48458ec459d59051e048b7e6ef4ffdc
            path: /go/src/github.com/timescale/timescaledb-tune
            spdx:
              name: timescaledb-tune
              version: 0.19.1
              packages:
                - name: timescaledb-tune
                  purl: pkg:golang/github.com/timescale/timescaledb-tune@0.19.1
                  license: Apache-2.0
            uid: 0
            gid: 0
          - url: git+https://github.com/timescale/timescaledb-parallel-copy.git#v0.14.0
            checksum: 64ba6ec60dea1ac2558907f6947f23b01e986407
            path: /go/src/github.com/timescale/timescaledb-parallel-copy
            spdx:
              name: timescaledb-parallel-copy
              version: 0.14.0
              packages:
                - name: timescaledb-parallel-copy
                  purl: pkg:golang/github.com/timescale/timescaledb-parallel-copy@0.14.0
                  license: Apache-2.0
            uid: 0
            gid: 0
      pipeline:
        - name: build and install extension
          privileged: true
          runs: |
            set -eux -o pipefail

            git fetch --tags --force origin

            BUILD_FORCE_REMOVE=true ./bootstrap \
              -DCMAKE_BUILD_TYPE=RelWithDebInfo \
              -DREGRESS_CHECKS=OFF \
              -DTAP_CHECKS=OFF \
              -DGENERATE_DOWNGRADE_SCRIPT=ON \
              -DWARNINGS_AS_ERRORS=OFF \
              -DSEND_TELEMETRY_DEFAULT=OFF \
              -DPG_CONFIG=/usr/lib/postgresql/16/bin/pg_config

            cmake --build build -j"$(nproc)"
            DESTDIR='${target.dir}' cmake --install build

            install -D -m 0644 tsl/LICENSE-TIMESCALE \
              '${target.dir}/usr/share/doc/timescaledb-2-pg16/LICENSE-TIMESCALE'
        - name: update timescaledb-tune dependencies
          uses: go/bump@v2
          work-dir: /go/src/github.com/timescale/timescaledb-tune
          with:
            deps: []
            download: true
            tidy: true
        - name: build timescaledb-tune
          uses: go/build@v1
          work-dir: /go/src/github.com/timescale/timescaledb-tune
          with:
            cgo_enabled: 0
            fips: false
            ldflags:
              - -X github.com/timescale/timescaledb-tune/pkg/tstune.Version=0.19.1
            output: ${target.dir}/usr/bin/timescaledb-tune
            packages: ./cmd/timescaledb-tune
        - name: update timescaledb-parallel-copy dependencies
          uses: go/bump@v2
          work-dir: /go/src/github.com/timescale/timescaledb-parallel-copy
          with:
            deps: []
            download: true
            tidy: true
        - name: build timescaledb-parallel-copy
          uses: go/build@v1
          work-dir: /go/src/github.com/timescale/timescaledb-parallel-copy
          with:
            cgo_enabled: 0
            fips: false
            ldflags:
              - -X main.version=v0.14.0
            output: ${target.dir}/usr/bin/timescaledb-parallel-copy
            packages: ./cmd/timescaledb-parallel-copy
        - uses: dhi/build-pkg:0
          with:
            conflicts: timescaledb-2-pg16-fips
            depends:
              - postgresql-16
            description: TimescaleDB extension for PostgreSQL 16
            files:
              - usr/bin
              - usr/lib/postgresql/16/lib
              - usr/share/postgresql/16/extension
              - usr/share/doc/timescaledb-2-pg16/LICENSE-TIMESCALE
            formats:
              - deb
            license: Apache-2.0 AND LicenseRef-Timescale
            name: timescaledb-2-pg16
            rel: 2
            url: https://github.com/timescale/timescaledb
            version: 2.32.1
os-release:
  name: Docker Hardened Images (Debian)
  id: debian
  version-id: "13"
  version-codename: trixie
  pretty-name: Docker Hardened Images/Debian GNU/Linux 13 (trixie)
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
