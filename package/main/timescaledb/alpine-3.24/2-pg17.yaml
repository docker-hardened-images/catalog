# syntax=dhi.io/build:2-alpine3.24

image: dhi.io/pkg-timescaledb
variant: runtime
tags:
  - 2-pg17-r2-alpine3.24
  - 2.30.2-pg17-r2-alpine3.24
platforms:
  - linux/amd64
  - linux/arm64
dates:
  release: "2024-09-26"
  end-of-life: "2029-11-08"
vars:
  COMMIT_SHA: b0977bf2d3a5014ee870247be09bc19d3e9f7a5f
  GOLANG_VERSION: 1.26.9-r0
  PACKAGE_NAME: timescaledb-2-pg17
  PARALLEL_COPY_COMMIT_SHA: f723cbd9fc3bc4bf0ae9a6e87a76bab919b5d3fe
  PARALLEL_COPY_VERSION: 0.13.0
  PG_MAJOR: "17"
  PG_PACKAGE_VERSION: 17.11-r0
  PG16_PACKAGE_VERSION: 16.15-r0
  PG17_PACKAGE_VERSION: 17.11-r0
  PG18_PACKAGE_VERSION: 18.6-r0
  REL: "2"
  SEMVER_MAJOR_MINOR_VERSION: "2.30"
  SEMVER_MAJOR_VERSION: "2"
  SEMVER_VERSION: 2.30.2
  TUNE_COMMIT_SHA: f37d8d41f8b34e1d105375548a13f8ea59b40e70
  TUNE_VERSION: 0.19.0
  VERSION: 2.30.2
contents:
  repositories:
    - https://dhi.io/apk/alpine/v3.24/main
    - https://dhi.io/apk/alpine/v3.23/main
    - https://dl-cdn.alpinelinux.org/alpine/v3.24/main
    - https://dl-cdn.alpinelinux.org/alpine/v3.24/community
  keyring:
    - https://dhi.io/keyring/dhi-apk@docker-0F81AD7700D99184.rsa.pub
  packages:
    - alpine-baselayout-data
  builds:
    - name: timescaledb-2-pg17
      work-dir: ${source.dir}/timescaledb
      environment:
        GOTOOLCHAIN: local
      caches:
        - path: /go/pkg/mod
      contents:
        packages:
          - bash
          - build-base
          - ca-certificates-bundle
          - cmake
          - coreutils
          - git
          - golang-1.26=1.26.9-r0
          - golang-1.26-oci-config=1.26.9-r0
          - icu-dev
          - libxml2-dev
          - lz4-dev
          - openssl-dev
          - pkgconf
          - postgresql17=17.11-r0
          - postgresql17-dev=17.11-r0
          - readline-dev
          - util-linux-dev
          - zlib-dev
          - zstd-dev
          - tzdata
        files:
          - url: git+https://github.com/timescale/timescaledb.git#2.30.2
            checksum: b0977bf2d3a5014ee870247be09bc19d3e9f7a5f
            path: ${source.dir}/timescaledb
            spdx:
              name: timescaledb
              version: 2.30.2
              packages:
                - name: timescaledb
                  purl: pkg:github/timescale/timescaledb@2.30.2
                  license: Apache-2.0
                - name: timescaledb-tsl
                  purl: pkg:github/timescale/timescaledb@2.30.2
                  license: LicenseRef-Timescale
            uid: 0
            gid: 0
          - url: git+https://github.com/timescale/timescaledb-tune.git#v0.19.0
            checksum: f37d8d41f8b34e1d105375548a13f8ea59b40e70
            path: /go/src/github.com/timescale/timescaledb-tune
            spdx:
              name: timescaledb-tune
              version: 0.19.0
              packages:
                - name: timescaledb-tune
                  purl: pkg:golang/github.com/timescale/timescaledb-tune@0.19.0
                  license: Apache-2.0
            uid: 0
            gid: 0
          - url: git+https://github.com/timescale/timescaledb-parallel-copy.git#v0.13.0
            checksum: f723cbd9fc3bc4bf0ae9a6e87a76bab919b5d3fe
            path: /go/src/github.com/timescale/timescaledb-parallel-copy
            spdx:
              name: timescaledb-parallel-copy
              version: 0.13.0
              packages:
                - name: timescaledb-parallel-copy
                  purl: pkg:golang/github.com/timescale/timescaledb-parallel-copy@0.13.0
                  license: Apache-2.0
            uid: 0
            gid: 0
      pipeline:
        - name: build and install extension
          privileged: true
          runs: |
            set -eux -o pipefail

            git fetch --tags --force origin

            BUILD_FORCE_REMOVE=true ./bootstrap \
              -DCMAKE_BUILD_TYPE=RelWithDebInfo \
              -DREGRESS_CHECKS=OFF \
              -DTAP_CHECKS=OFF \
              -DGENERATE_DOWNGRADE_SCRIPT=ON \
              -DWARNINGS_AS_ERRORS=OFF \
              -DSEND_TELEMETRY_DEFAULT=OFF \
              -DPG_CONFIG=/usr/libexec/postgresql17/pg_config

            cmake --build build -j"$(nproc)"
            DESTDIR='${target.dir}' cmake --install build

            install -D -m 0644 tsl/LICENSE-TIMESCALE \
              '${target.dir}/usr/share/doc/timescaledb-2-pg17/LICENSE-TIMESCALE'
        - name: update timescaledb-tune dependencies
          uses: go/bump@v2
          work-dir: /go/src/github.com/timescale/timescaledb-tune
          with:
            deps:
              - golang.org/x/sys@v0.44.0
            download: true
            tidy: true
        - name: build timescaledb-tune
          uses: go/build@v1
          work-dir: /go/src/github.com/timescale/timescaledb-tune
          with:
            cgo_enabled: 0
            fips: false
            ldflags:
              - -X github.com/timescale/timescaledb-tune/pkg/tstune.Version=0.19.0
            output: ${target.dir}/usr/bin/timescaledb-tune
            packages: ./cmd/timescaledb-tune
        - name: update timescaledb-parallel-copy dependencies
          uses: go/bump@v2
          work-dir: /go/src/github.com/timescale/timescaledb-parallel-copy
          with:
            deps:
              - golang.org/x/text@v0.41.0
              - github.com/jackc/pgx/v5@v5.9.2
            download: true
            tidy: true
        - name: build timescaledb-parallel-copy
          uses: go/build@v1
          work-dir: /go/src/github.com/timescale/timescaledb-parallel-copy
          with:
            cgo_enabled: 0
            fips: false
            ldflags:
              - -X main.version=v0.13.0
            output: ${target.dir}/usr/bin/timescaledb-parallel-copy
            packages: ./cmd/timescaledb-parallel-copy
        - uses: dhi/build-pkg:0
          with:
            conflicts: timescaledb-2-pg17-fips
            depends:
              - postgresql17
            description: TimescaleDB extension for PostgreSQL 17
            files:
              - usr/bin
              - usr/lib/postgresql17
              - usr/share/postgresql17
              - usr/share/doc/timescaledb-2-pg17/LICENSE-TIMESCALE
            formats:
              - apk
            license: Apache-2.0 AND LicenseRef-Timescale
            name: timescaledb-2-pg17
            rel: 2
            url: https://github.com/timescale/timescaledb
            version: 2.30.2
os-release:
  name: Docker Hardened Images (Alpine)
  id: alpine
  version-id: "3.24"
  pretty-name: Docker Hardened Images/Alpine Linux v3.24
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
