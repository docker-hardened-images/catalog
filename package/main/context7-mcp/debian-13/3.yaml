# syntax=dhi.io/build:2-debian13

image: dhi.io/pkg-context7-mcp
variant: runtime
tags:
  - 3.2.5
  - 3.2.5-r6
  - 3.2.5-debian13
  - 3.2.5-r6-debian13
platforms:
  - linux/amd64
  - linux/arm64
vars:
  COMMIT_SHA: b250c2515694eee4b6df4db82fa056df9ed3e306
  REL: "6"
  SEMVER_MAJOR_MINOR_VERSION: "3.2"
  SEMVER_MAJOR_VERSION: "3"
  SEMVER_VERSION: 3.2.5
  VERSION: 3.2.5
contents:
  repositories:
    - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
  keyring:
    - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
  packages:
    - base-files
  builds:
    - name: context7-mcp
      work-dir: ${source.dir}/context7
      caches:
        - path: /root/.local/share/pnpm
        - path: /root/.cache
      contents:
        repositories:
          - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
        keyring:
          - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
        packages:
          - bash
          - base-files
          - ca-certificates
          - coreutils
          - findutils
          - git
          - grep
          - libc6
          - libstdc++6
          - mawk
          - nodejs-24
          - node-corepack
          - npm
          - sed
          - yarn-classic
        files:
          - url: git+https://github.com/upstash/context7.git#@upstash/context7-mcp@3.2.5
            checksum: b250c2515694eee4b6df4db82fa056df9ed3e306
            path: ${source.dir}/context7
            spdx:
              name: context7-mcp
              version: 3.2.5
              packages:
                - name: context7-mcp
                  purl: pkg:npm/%40upstash/context7-mcp@3.2.5
                  license: MIT
            uid: 0
            gid: 0
      pipeline:
        - name: prepare pnpm for bump
          privileged: true
          runs: |
            set -eux -o pipefail

            corepack enable
            chmod +x /usr/lib/nodejs/corepack/dist/*.js
            corepack prepare pnpm@10 --activate
        - name: bump pnpm dependencies
          uses: pnpm/bump@v1
          privileged: true
          with:
            bumps: ${source.dir}/patch/pnpm-bumps.json
            pnpm-root: ${source.dir}/context7
        - name: build
          privileged: true
          runs: |
            set -eux -o pipefail

            export PNPM_CONFIG_MINIMUM_RELEASE_AGE=0

            corepack pnpm install --ignore-scripts
            corepack pnpm --filter @upstash/context7-mcp build

            mkdir -p '${target.dir}/usr/lib/context7-mcp/packages/mcp'
        - name: install
          work-dir: ${target.dir}/usr/lib/context7-mcp
          privileged: true
          runs: |
            set -eux -o pipefail

            cp -t '${target.dir}/usr/lib/context7-mcp' '${source.dir}/context7/'{package.json,pnpm-lock.yaml,pnpm-workspace.yaml}
            cp -r -t '${target.dir}/usr/lib/context7-mcp/packages/mcp' '${source.dir}/context7/packages/mcp/'{dist,package.json}

            export PNPM_CONFIG_MINIMUM_RELEASE_AGE=0

            corepack pnpm install --filter @upstash/context7-mcp \
              --frozen-lockfile --ignore-scripts --prod

            rm -f '${target.dir}/usr/lib/context7-mcp/'{package.json,pnpm-lock.yaml,pnpm-workspace.yaml}

            mkdir -p '${target.dir}/usr/bin'
            ln -sf ../lib/context7-mcp/packages/mcp/dist/index.js '${target.dir}/usr/bin/context7-mcp'
        - name: runtime sbom
          uses: sbom@v1
          with:
            extra-scanners: javascript-package-cataloger
            prefix: context7-mcp
            source: ${target.dir}/usr/lib/context7-mcp/node_modules
        - uses: dhi/build-pkg:0
          with:
            description: Upstash Context7 MCP server (Model Context Protocol server for Context7 documentation)
            files:
              - usr/lib/context7-mcp
              - usr/bin/context7-mcp
            formats:
              - deb
            license: MIT
            name: context7-mcp
            rel: 6
            url: https://github.com/upstash/context7
            version: 3.2.5
      paths:
        - type: file
          path: ${source.dir}/patch/pnpm-bumps.json
          uid: 0
          gid: 0
          source: package/main/context7-mcp/patch/pnpm-bumps.json
os-release:
  name: Docker Hardened Images (Debian)
  id: debian
  version-id: "13"
  version-codename: trixie
  pretty-name: Docker Hardened Images/Debian GNU/Linux 13 (trixie)
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
