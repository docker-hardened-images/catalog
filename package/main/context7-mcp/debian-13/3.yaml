# syntax=dhi.io/build:2-debian13

image: dhi.io/pkg-context7-mcp
variant: runtime
tags:
  - 3.2.5
  - 3.2.5-r4
  - 3.2.5-debian13
  - 3.2.5-r4-debian13
platforms:
  - linux/amd64
  - linux/arm64
vars:
  COMMIT_SHA: b250c2515694eee4b6df4db82fa056df9ed3e306
  REL: "4"
  SEMVER_MAJOR_MINOR_VERSION: "3.2"
  SEMVER_MAJOR_VERSION: "3"
  SEMVER_VERSION: 3.2.5
  VERSION: 3.2.5
contents:
  repositories:
    - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
  keyring:
    - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
  packages:
    - base-files
  builds:
    - name: context7-mcp
      work-dir: ${source.dir}/context7
      caches:
        - path: /root/.local/share/pnpm
        - path: /root/.cache
      contents:
        repositories:
          - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
        keyring:
          - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
        packages:
          - bash
          - base-files
          - ca-certificates
          - coreutils
          - findutils
          - git
          - libc6
          - libstdc++6
          - mawk
          - nodejs-24
          - node-corepack
          - npm
          - sed
          - yarn-classic
          - yq
        files:
          - url: git+https://github.com/upstash/context7.git#@upstash/context7-mcp@3.2.5
            checksum: b250c2515694eee4b6df4db82fa056df9ed3e306
            path: ${source.dir}/context7
            spdx:
              name: context7-mcp
              version: 3.2.5
              packages:
                - name: context7-mcp
                  purl: pkg:npm/%40upstash/context7-mcp@3.2.5
                  license: MIT
            uid: 0
            gid: 0
      pipeline:
        - name: apply CVE overrides
          runs: |
            set -eux -o pipefail

            yq -y -i '.overrides."ajv" = "8.18.0"' pnpm-workspace.yaml                       # CVE-2025-69873
            yq -y -i '.overrides."body-parser" = "2.4.0"' pnpm-workspace.yaml                # CVE-2025-13466, CVE-2026-12590, CVE-2026-111181
            yq -y -i '.overrides."@modelcontextprotocol/sdk" = "1.32.0"' pnpm-workspace.yaml # CVE-2026-104850, CVE-2026-111767, CVE-2026-111768, CVE-2026-111769, CVE-2026-111771
            yq -y -i '.overrides."fast-uri" = "3.1.9"' pnpm-workspace.yaml                   # CVE-2026-6321, CVE-2026-6322, CVE-2026-13676, CVE-2026-16221, CVE-2026-18446, CVE-2026-75899, CVE-2026-75931, CVE-2026-75975, CVE-2026-76172, CVE-2026-84292, CVE-2026-86472, CVE-2026-110095, CVE-2026-110180, CVE-2026-110306, CVE-2026-110725
            yq -y -i '.overrides."hono" = "4.13.11"' pnpm-workspace.yaml                     # CVE-2026-65290, CVE-2026-54288, CVE-2026-54286, CVE-2026-54287, CVE-2026-59895, CVE-2026-59896, CVE-2026-59897, CVE-2026-69207, CVE-2026-84363, CVE-2026-84364, CVE-2026-84365, CVE-2026-93981, CVE-2026-111757
            yq -y -i '.overrides."@hono/node-server" = "2.0.10"' pnpm-workspace.yaml         # GHSA-frvp-7c67-39w9, GHSA-9mqv-5hh9-4cgg
            yq -y -i '.overrides."ip-address" = "10.7.4"' pnpm-workspace.yaml                # CVE-2026-69192, CVE-2026-54272, CVE-2026-69198, CVE-2026-101910, CVE-2026-101911, CVE-2026-101912, CVE-2026-101913, CVE-2026-111997
            yq -y -i '.overrides."proxy-addr" = "2.0.8"' pnpm-workspace.yaml                 # CVE-2026-90711
            yq -y -i '.overrides."path-to-regexp" = "8.4.0"' pnpm-workspace.yaml             # CVE-2026-4926, CVE-2026-4923
            yq -y -i '.overrides."qs" = "6.16.1"' pnpm-workspace.yaml                        # CVE-2025-15284, CVE-2026-2391, CVE-2026-8723, CVE-2026-82417, CVE-2026-82562, CVE-2026-110816
            yq -y -i '.overrides."undici" = "6.29.1"' pnpm-workspace.yaml                    # CVE-2026-12151, CVE-2026-16728, CVE-2026-16729, CVE-2026-15157, CVE-2026-19534, CVE-2026-85024, CVE-2026-18540, CVE-2026-109869, CVE-2026-109924, CVE-2026-109383, CVE-2026-109932, CVE-2026-87018
            yq -y -i '.overrides."zod" = "4.6.6"' pnpm-workspace.yaml                        # CVE-2023-54404
        - name: build
          privileged: true
          runs: |
            set -eux -o pipefail

            export PNPM_CONFIG_MINIMUM_RELEASE_AGE=0

            corepack pnpm install --ignore-scripts
            corepack pnpm --filter @upstash/context7-mcp build

            mkdir -p '${target.dir}/usr/lib/context7-mcp/packages/mcp'
        - name: install
          work-dir: ${target.dir}/usr/lib/context7-mcp
          privileged: true
          runs: |
            set -eux -o pipefail

            cp -t '${target.dir}/usr/lib/context7-mcp' '${source.dir}/context7/'{package.json,pnpm-lock.yaml,pnpm-workspace.yaml}
            cp -r -t '${target.dir}/usr/lib/context7-mcp/packages/mcp' '${source.dir}/context7/packages/mcp/'{dist,package.json}

            export PNPM_CONFIG_MINIMUM_RELEASE_AGE=0

            corepack pnpm install --filter @upstash/context7-mcp \
              --frozen-lockfile --ignore-scripts --prod

            rm -f '${target.dir}/usr/lib/context7-mcp/'{package.json,pnpm-lock.yaml,pnpm-workspace.yaml}

            mkdir -p '${target.dir}/usr/bin'
            ln -sf ../lib/context7-mcp/packages/mcp/dist/index.js '${target.dir}/usr/bin/context7-mcp'
        - name: runtime sbom
          uses: sbom@v1
          with:
            extra-scanners: javascript-package-cataloger
            prefix: context7-mcp
            source: ${target.dir}/usr/lib/context7-mcp/node_modules
        - uses: dhi/build-pkg:0
          with:
            description: Upstash Context7 MCP server (Model Context Protocol server for Context7 documentation)
            files:
              - usr/lib/context7-mcp
              - usr/bin/context7-mcp
            formats:
              - deb
            license: MIT
            name: context7-mcp
            rel: 4
            url: https://github.com/upstash/context7
            version: 3.2.5
os-release:
  name: Docker Hardened Images (Debian)
  id: debian
  version-id: "13"
  version-codename: trixie
  pretty-name: Docker Hardened Images/Debian GNU/Linux 13 (trixie)
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
