# syntax=dhi.io/build:2-debian13

image: dhi.io/pkg-keel
variant: runtime
tags:
  - 0.22.4
  - 0.22.4-r7
  - 0.22.4-debian13
  - 0.22.4-r7-debian13
platforms:
  - linux/amd64
  - linux/arm64
dates:
  release: "2017-06-12"
vars:
  COMMIT_SHA: bc640168f020ab1dc89842938d1883886242a40b
  GOLANG_MAJOR_MINOR_VERSION: "1.26"
  GOLANG_VERSION: 1.26.11-17
  NODEJS_VERSION: 24.22.3-0
  NPM_VERSION: 11.21.2-1
  PACKAGE_NAME: keel-0
  REL: "7"
  SEMVER_MAJOR_MINOR_VERSION: "0.22"
  SEMVER_MAJOR_VERSION: "0"
  SEMVER_VERSION: 0.22.4
  VERSION: 0.22.4
contents:
  repositories:
    - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
  keyring:
    - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
  packages:
    - base-files
  builds:
    - name: keel-0
      work-dir: /go/src/github.com/keel-hq/keel
      contents:
        packages:
          - bash
          - binutils
          - ca-certificates-bundle
          - coreutils
          - findutils
          - gcc
          - git
          - jq
          - libc6-dev
          - libsqlite3-dev
          - mawk
          - sed
          - nodejs-24=24.22.3-0
          - npm=11.21.2-1
          - golang-1.26=1.26.11-17
          - golang-1.26-oci-config=1.26.11-17
        files:
          - url: git+https://github.com/keel-hq/keel.git#0.22.4
            checksum: bc640168f020ab1dc89842938d1883886242a40b
            path: /go/src/github.com/keel-hq/keel
            spdx:
              name: keel
              version: 0.22.4
              packages:
                - name: keel
                  purl: pkg:golang/github.com/keel-hq/keel@0.22.4
                  license: MPL-2.0
            uid: 0
            gid: 0
          - url: https://go.dev/LICENSE?m=text
            checksum: sha256:911f8f5782931320f5b8d1160a76365b83aea6447ee6c04fa6d5591467db9dad
            path: ${source.dir}/go-LICENSE
            uid: 0
            gid: 0
          - url: https://go.dev/PATENTS?m=text
            checksum: sha256:96f408bfae65bf137fc2525d3ecb030271c50c1e90799f87abf8846d8dd505cc
            path: ${source.dir}/go-PATENTS
            uid: 0
            gid: 0
      pipeline:
        - name: apply compatibility patch
          uses: patch@v1
          work-dir: /go/src/github.com/keel-hq/keel
          with:
            options: -p1
            patch: /go/src/patch/keel-compat.patch
        - name: update go dependencies
          uses: go/bump@v2
          work-dir: /go/src/github.com/keel-hq/keel
          with:
            deps:
              - golang.org/x/net@v0.62.0
              - google.golang.org/grpc@v1.83.2
              - github.com/go-jose/go-jose/v4@v4.1.6
              - github.com/klauspost/compress@v1.20.2
              - go.opentelemetry.io/otel@v1.45.0
              - go.opentelemetry.io/otel/sdk@v1.45.0
              - github.com/containerd/containerd@v1.7.36
              - github.com/golang-jwt/jwt/v4@v4.5.2
              - github.com/slack-go/slack@v0.23.1
              - github.com/distribution/distribution/v3@v3.1.2
            download: true
            replaces:
              - k8s.io/api=k8s.io/api@v0.35.1
              - k8s.io/apiextensions-apiserver=k8s.io/apiextensions-apiserver@v0.35.1
              - k8s.io/apimachinery=k8s.io/apimachinery@v0.35.1
              - k8s.io/apiserver=k8s.io/apiserver@v0.35.1
              - k8s.io/cli-runtime=k8s.io/cli-runtime@v0.35.1
              - k8s.io/client-go=k8s.io/client-go@v0.35.1
              - k8s.io/cloud-provider=k8s.io/cloud-provider@v0.35.1
              - k8s.io/cluster-bootstrap=k8s.io/cluster-bootstrap@v0.35.1
              - k8s.io/code-generator=k8s.io/code-generator@v0.35.1
              - k8s.io/component-base=k8s.io/component-base@v0.35.1
              - k8s.io/cri-api=k8s.io/cri-api@v0.35.1
              - k8s.io/csi-translation-lib=k8s.io/csi-translation-lib@v0.35.1
              - k8s.io/kube-aggregator=k8s.io/kube-aggregator@v0.35.1
              - k8s.io/kube-controller-manager=k8s.io/kube-controller-manager@v0.35.1
              - k8s.io/kube-proxy=k8s.io/kube-proxy@v0.35.1
              - k8s.io/kube-scheduler=k8s.io/kube-scheduler@v0.35.1
              - k8s.io/kubectl=k8s.io/kubectl@v0.35.1
              - k8s.io/kubelet=k8s.io/kubelet@v0.35.1
              - k8s.io/legacy-cloud-providers=k8s.io/legacy-cloud-providers@v0.35.1
              - k8s.io/metrics=k8s.io/metrics@v0.35.1
              - k8s.io/sample-apiserver=k8s.io/sample-apiserver@v0.35.1
              - helm.sh/helm/v3=helm.sh/helm/v3@v3.20.2
              - oras.land/oras-go/v2=oras.land/oras-go/v2@v2.6.2
            tidy: true
        - uses: go/hermetic@v1
        - name: test slack upload
          runs: |
            set -eux -o pipefail

            CGO_ENABLED=1 go test -count=1 -tags netgo,libsqlite3 -run '^TestRespondLongReplyUploadsByteLength$' ./bot/slack/
        - name: bump ui dependencies
          uses: npm/bump@v1
          privileged: true
          with:
            bumps: /go/src/patch/npm-bumps.json
            npm-root: /go/src/github.com/keel-hq/keel/ui
        - name: build ui
          work-dir: /go/src/github.com/keel-hq/keel/ui
          privileged: true
          runs: |
            set -eux -o pipefail

            npm ci
            npm run typecheck
            npm test
            npm run build -- --sourcemap hidden
        - name: derive ui inventory
          work-dir: /go/src/github.com/keel-hq/keel/ui
          runs: |
            set -eux -o pipefail

            rm -rf /tmp/keel-inv
            node /go/src/patch/ui-inventory.mjs inventory /go/src/github.com/keel-hq/keel/ui /tmp/keel-inv
            test -s /tmp/keel-inv/ui-inventory.json
        - name: generate ui sbom
          uses: sbom@v1
          with:
            extra-scanners: javascript-package-cataloger
            prefix: keel-ui
            source: /tmp/keel-inv/sbom-root
        - name: verify ui sbom and stage ui
          work-dir: /go/src/github.com/keel-hq/keel/ui
          runs: |
            set -eux -o pipefail

            spdx=/opt/docker/sbom/keel-ui/.spdx.keel-ui.json
            test -s "$spdx"
            node /go/src/patch/ui-inventory.mjs check-sbom /go/src/github.com/keel-hq/keel/ui /tmp/keel-inv "$spdx"

            ls dist/assets/*.js.map > /dev/null
            for m in dist/assets/*.js.map; do rm "$m"; done
            test -z "$(find dist -name '*.map')"
            ! grep -rq sourceMappingURL dist

            install -d "${target.dir}/usr/share/keel"
            cp -a dist "${target.dir}/usr/share/keel/www"
            test -s "${target.dir}/usr/share/keel/www/index.html"

            install -d "${target.dir}/opt/docker/sbom"
            cp -a /opt/docker/sbom/keel-ui "${target.dir}/opt/docker/sbom/"
            test -s "${target.dir}/opt/docker/sbom/keel-ui/.spdx.keel-ui.json"

            node /go/src/patch/ui-inventory.mjs notices /go/src/github.com/keel-hq/keel/ui /tmp/keel-inv
            install -d "${target.dir}/usr/share/licenses/keel-0"
            cp -a /tmp/keel-inv/npm "${target.dir}/usr/share/licenses/keel-0/"
            test -s "${target.dir}/usr/share/keel/www/index.html"
        - name: build keel
          uses: go/build@v1
          with:
            cgo_enabled: 1
            fips: false
            ldflags:
              - -s
              - -w
              - -X github.com/keel-hq/keel/version.Version=0.22.4
              - -X github.com/keel-hq/keel/version.Revision=bc640168f020ab1dc89842938d1883886242a40b
              - -X github.com/keel-hq/keel/version.BuildDate=$(date -u -d @$(git -C /go/src/github.com/keel-hq/keel log -1 --format=%ct) +%Y-%m-%dT%H%M%SZ)
            output: ${target.dir}/usr/bin/keel
            packages: ./cmd/keel
            tags: netgo,libsqlite3
        - name: build keel dev
          uses: go/build@v1
          with:
            cgo_enabled: 1
            fips: false
            ldflags:
              - -X github.com/keel-hq/keel/version.Version=0.22.4
              - -X github.com/keel-hq/keel/version.Revision=bc640168f020ab1dc89842938d1883886242a40b
              - -X github.com/keel-hq/keel/version.BuildDate=$(date -u -d @$(git -C /go/src/github.com/keel-hq/keel log -1 --format=%ct) +%Y-%m-%dT%H%M%SZ)
            output: ${target.dir}/usr/bin/keel-dev
            packages: ./cmd/keel
            strip: false
            tags: netgo,libsqlite3
        - name: verify keel binaries
          work-dir: /go/src/github.com/keel-hq/keel
          runs: |
            set -eux -o pipefail

            for bin in "${target.dir}/usr/bin/keel" "${target.dir}/usr/bin/keel-dev"; do
              test -x "$bin"
              go version -m "$bin" > /tmp/buildinfo.txt
              grep -Fq -- '-tags=netgo,libsqlite3' /tmp/buildinfo.txt
              grep -Fq 'CGO_ENABLED=1' /tmp/buildinfo.txt
              readelf -d "$bin" > /tmp/dynamic.txt
              grep -Fq 'libsqlite3.so.0' /tmp/dynamic.txt
              strings -a "$bin" > /tmp/strings.txt
              if grep -Fq '2024-08-13 09:16:08 c9c2ab54' /tmp/strings.txt; then
                echo "bundled SQLite amalgamation found in $bin" >&2
                exit 1
              fi
            done
        - name: stage keel source sbom
          runs: |
            set -eux -o pipefail

            test -s /opt/docker/sbom/keel/.spdx.keel.json
            install -d "${target.dir}/opt/docker/sbom"
            cp -a /opt/docker/sbom/keel "${target.dir}/opt/docker/sbom/"
            test -s "${target.dir}/opt/docker/sbom/keel/.spdx.keel.json"
        - name: collect go notices
          work-dir: /go/src/github.com/keel-hq/keel
          runs: |
            set -eux -o pipefail

            root="${target.dir}/usr/share/licenses/keel-0"
            install -d "$root"
            cp /go/src/github.com/keel-hq/keel/LICENSE "$root/LICENSE"
            test -s "$root/LICENSE"
            bash /go/src/patch/go-notices.sh /go/src/github.com/keel-hq/keel "${target.dir}/usr/bin/keel" "$root" netgo,libsqlite3 /tmp/keel-inv "${source.dir}"
            test -s "$root/THIRD-PARTY-NOTICES.txt"
            test -s "$root/go/LICENSE"

            cat > "$root/SOURCE" << 'EOF'
            Keel is licensed under the Mozilla Public License, version 2.0. The covered source code is available at
            https://github.com/keel-hq/keel/tree/0.22.4 (commit bc640168f020ab1dc89842938d1883886242a40b).
            Docker Hardened Images changed the covered source only to bump dependency versions (go/bump and npm/bump)
            and to adapt three call sites to the bumped Helm, client-go, and slack-go APIs. Those changes are
            published in the public definitions repository under package/main/keel.
            EOF
            test -s "$root/SOURCE"
        - name: stage dev copies
          runs: |
            set -eux -o pipefail

            cp -a "${target.dir}/usr/share/keel/www" "${target.dir}/usr/share/keel/www-dev"
            test -s "${target.dir}/usr/share/keel/www-dev/index.html"

            cp -a "${target.dir}/opt/docker/sbom" "${target.dir}/opt/docker/sbom-dev"
            test -s "${target.dir}/opt/docker/sbom-dev/keel-ui/.spdx.keel-ui.json"
            test -s "${target.dir}/opt/docker/sbom-dev/keel/.spdx.keel.json"

            cp -a "${target.dir}/usr/share/licenses/keel-0" "${target.dir}/usr/share/licenses/keel-0-dev"
            test -s "${target.dir}/usr/share/licenses/keel-0-dev/THIRD-PARTY-NOTICES.txt"
        - uses: dhi/build-pkg:0
          with:
            depends:
              - libc6
              - libsqlite3-0
            description: Keel automated Kubernetes deployment updates
            files:
              - usr/bin/keel
              - usr/share/keel/www
              - usr/share/licenses/keel-0
              - opt/docker/sbom/keel-ui
              - opt/docker/sbom/keel
            formats:
              - deb
            license: MPL-2.0
            name: keel-0
            rel: 7
            subpackages:
              - depends:
                  - libc6
                  - libsqlite3-0
                files:
                  - path: usr/bin/keel
                    source: usr/bin/keel-dev
                  - path: usr/share/keel/www
                    source: usr/share/keel/www-dev
                  - path: usr/share/licenses/keel-0
                    source: usr/share/licenses/keel-0-dev
                  - path: opt/docker/sbom/keel-ui
                    source: opt/docker/sbom-dev/keel-ui
                  - path: opt/docker/sbom/keel
                    source: opt/docker/sbom-dev/keel
                name: keel-0-dev
            url: https://github.com/keel-hq/keel
            version: 0.22.4
      paths:
        - type: file
          path: /go/src/patch/ui-inventory.mjs
          uid: 0
          gid: 0
          source: package/main/keel/patch/ui-inventory.mjs
        - type: file
          path: /go/src/patch/go-notices.sh
          uid: 0
          gid: 0
          source: package/main/keel/patch/go-notices.sh
        - type: file
          path: /go/src/patch/keel-compat.patch
          uid: 0
          gid: 0
          source: package/main/keel/patch/keel-compat.patch
        - type: file
          path: /go/src/patch/npm-bumps.json
          uid: 0
          gid: 0
          source: package/main/keel/patch/npm-bumps.json
os-release:
  name: Docker Hardened Images (Debian)
  id: debian
  version-id: "13"
  version-codename: trixie
  pretty-name: Docker Hardened Images/Debian GNU/Linux 13 (trixie)
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
