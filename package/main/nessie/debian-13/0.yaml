# syntax=dhi.io/build:2-debian13

image: dhi.io/pkg-nessie
variant: runtime
tags:
  - 0.108.8
  - 0.108.8-r6
  - 0.108.8-debian13
  - 0.108.8-r6-debian13
platforms:
  - linux/amd64
  - linux/arm64
dates:
  release: "2026-02-09"
vars:
  COMMIT_SHA: de530231b1c13587a1f0dc8fb2a4de62092a3ff5
  GRADLE_VERSION: 8.14.5-1
  JDK_MAJOR_VERSION: "21"
  JDK_VERSION: 1:21.0.12.1+1-4
  PACKAGE_HOME: /usr/share/nessie
  PACKAGE_NAME: nessie-0.108
  REL: "6"
  SEMVER_MAJOR_MINOR_VERSION: "0.108"
  SEMVER_MAJOR_VERSION: "0"
  SEMVER_VERSION: 0.108.8
  VERSION: 0.108.8
contents:
  repositories:
    - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
  keyring:
    - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
  packages:
    - base-files
  builds:
    - name: nessie-0.108
      work-dir: ${source.dir}/nessie
      caches:
        - path: /root/.gradle
      contents:
        repositories:
          - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
        keyring:
          - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
        packages:
          - bash
          - ca-certificates
          - ca-certificates-bundle
          - coreutils
          - curl
          - findutils
          - git
          - grep
          - mawk
          - sed
          - eclipse-temurin-21-jdk=1:21.0.12.1+1-4
          - gradle-8=8.14.5-1
        files:
          - url: git+https://github.com/projectnessie/nessie.git#nessie-0.108.8
            checksum: de530231b1c13587a1f0dc8fb2a4de62092a3ff5
            path: ${source.dir}/nessie
            spdx:
              name: nessie
              version: 0.108.8
              packages:
                - name: nessie
                  purl: pkg:github/projectnessie/nessie@0.108.8
                  license: Apache-2.0
            uid: 0
            gid: 0
      pipeline:
        - name: drop develocity and nmcp settings plugins
          uses: git/patch@v1
          work-dir: ${source.dir}/nessie
          with:
            patch: ${source.dir}/patch/disable-develocity-nmcp.patch
        - name: point settings repos at gcs maven central mirror
          uses: git/patch@v1
          work-dir: ${source.dir}/nessie
          with:
            patch: ${source.dir}/patch/maven-central-mirror.patch
        - name: force cve dependency pins
          uses: git/patch@v1
          work-dir: ${source.dir}/nessie
          with:
            patch: ${source.dir}/patch/cve-force-deps.patch
        - name: configure gradle maven mirror
          runs: |
            set -eux -o pipefail

            mkdir -p /root/.gradle
            cat > /root/.gradle/init.gradle << 'EOF'
            def mavenCentralMirror = uri("https://maven-central.storage-download.googleapis.com/maven2/")

            def mirrorMavenCentral = { repo ->
                if (repo instanceof org.gradle.api.artifacts.repositories.MavenArtifactRepository
                        && (repo.url.toString() == "https://repo.maven.apache.org/maven2/"
                            || repo.url.toString() == "https://repo1.maven.org/maven2/")) {
                    repo.setUrl(mavenCentralMirror)
                }
            }

            beforeSettings { settings ->
                settings.pluginManagement.repositories.clear()
                settings.pluginManagement.repositories.maven {
                    name = "GCS Maven Central mirror"
                    url = mavenCentralMirror
                }
                settings.pluginManagement.repositories.gradlePluginPortal()
            }

            settingsEvaluated { settings ->
                settings.pluginManagement.repositories.configureEach(mirrorMavenCentral)
                settings.dependencyResolutionManagement.repositories.configureEach(mirrorMavenCentral)
            }

            allprojects {
                buildscript.repositories.configureEach(mirrorMavenCentral)
                buildscript.repositories.whenObjectAdded(mirrorMavenCentral)
                repositories.configureEach(mirrorMavenCentral)
                repositories.whenObjectAdded(mirrorMavenCentral)
            }
            EOF
        - name: build
          privileged: true
          runs: |
            set -eux -o pipefail

            unset CI

            export GRADLE_HOME="/usr/share/java/gradle"
            export JAVA_HOME="/usr/lib/jvm/temurin-21"
            export PATH="${GRADLE_HOME}/bin:${JAVA_HOME}/bin:${PATH}"

            ./gradlew :nessie-quarkus:clean :nessie-quarkus:quarkusBuild --stacktrace --info
        - name: stage quarkus app
          runs: |
            set -eux -o pipefail

            install -d "${target.dir}/usr/share/nessie/quarkus-app"
            cp -a servers/quarkus-server/build/quarkus-app/. \
              "${target.dir}/usr/share/nessie/quarkus-app/"
        - name: generate FIPS properties
          runs: |
            set -eux -o pipefail

            BC_CLASSPATH="/usr/lib/bouncycastle/current/bc-fips.jar:\
            /usr/lib/bouncycastle/current/bctls-fips.jar:\
            /usr/lib/bouncycastle/current/bcutil-fips.jar:\
            /usr/lib/bouncycastle/current/bc-rng-jent.jar:\
            /usr/lib/bouncycastle/current/bcpkix-fips.jar"

            cat > "${target.dir}/usr/share/nessie/quarkus-app/nessie-fips.properties" << EOF
            -Xbootclasspath/a:${BC_CLASSPATH}
            --add-exports=java.base/sun.security.internal.spec=ALL-UNNAMED
            --add-exports=java.base/sun.security.provider=ALL-UNNAMED
            -Dorg.bouncycastle.fips.approved_only=true
            -Djavax.net.ssl.trustStore=/usr/lib/bouncycastle/cacerts.bcfks
            -Djavax.net.ssl.trustStoreType=BCFKS
            -Djavax.net.ssl.trustStorePassword=changeit
            EOF
        - name: java sbom
          uses: sbom@v1
          with:
            extra-scanners: java-archive-cataloger
            prefix: nessie
            source: ${target.dir}/usr/share/nessie/quarkus-app
        - uses: dhi/build-pkg:0
          with:
            description: Project Nessie transactional catalog for data lakes
            files:
              - usr/share/nessie
            formats:
              - deb
            license: Apache-2.0
            name: nessie-0.108
            rel: 6
            url: https://projectnessie.org/
            version: 0.108.8
      paths:
        - type: file
          path: ${source.dir}/patch/disable-develocity-nmcp.patch
          uid: 0
          gid: 0
          source: package/main/nessie/patch/disable-develocity-nmcp.patch
        - type: file
          path: ${source.dir}/patch/maven-central-mirror.patch
          uid: 0
          gid: 0
          source: package/main/nessie/patch/maven-central-mirror.patch
        - type: file
          path: ${source.dir}/patch/cve-force-deps.patch
          uid: 0
          gid: 0
          source: package/main/nessie/patch/cve-force-deps.patch
os-release:
  name: Docker Hardened Images (Debian)
  id: debian
  version-id: "13"
  version-codename: trixie
  pretty-name: Docker Hardened Images/Debian GNU/Linux 13 (trixie)
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
