# syntax=dhi.io/build:2-debian13

image: dhi.io/pkg-nessie
variant: runtime
tags:
  - 0.108.4
  - 0.108.4-r0
  - 0.108.4-debian13
  - 0.108.4-r0-debian13
platforms:
  - linux/amd64
  - linux/arm64
dates:
  release: "2026-02-09"
vars:
  BCFIPS_VERSION: 2.1.2
  BCPKIXFIPS_VERSION: 2.1.11
  BCRNGJENT_VERSION: 1.3.6
  BCTLSFIPS_VERSION: 2.1.23
  BCUTILFIPS_VERSION: 2.1.6
  COMMIT_SHA: 41d6986725edb95bca176c128300642b8e52d958
  GRADLE_VERSION: 8.14.5-1
  JDK_MAJOR_VERSION: "21"
  JDK_VERSION: 21.0.12.8-0
  PACKAGE_HOME: /usr/share/nessie
  PACKAGE_NAME: nessie-0.108
  REL: "0"
  SEMVER_MAJOR_MINOR_VERSION: "0.108"
  SEMVER_MAJOR_VERSION: "0"
  SEMVER_VERSION: 0.108.4
  VERSION: 0.108.4
contents:
  packages:
    - base-files
  builds:
    - name: nessie-0.108
      work-dir: ${source.dir}/nessie
      caches:
        - path: /root/.gradle
      contents:
        repositories:
          - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
        keyring:
          - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
        packages:
          - bash
          - ca-certificates
          - ca-certificates-bundle
          - coreutils
          - curl
          - findutils
          - git
          - grep
          - mawk
          - sed
          - eclipse-temurin-21-jdk=21.0.12.8-0
          - gradle-8=8.14.5-1
        files:
          - url: git+https://github.com/projectnessie/nessie.git#nessie-0.108.4
            checksum: 41d6986725edb95bca176c128300642b8e52d958
            path: ${source.dir}/nessie
            spdx:
              name: nessie
              version: 0.108.4
              packages:
                - name: nessie
                  purl: pkg:github/projectnessie/nessie@0.108.4
                  license: Apache-2.0
            uid: 0
            gid: 0
      pipeline:
        - name: force jackson-core 2.22.1 (GHSA-r7wm-3cxj-wff9, CVE-2026-54515, CVE-2026-59889)
          uses: git/patch@v1
          work-dir: ${source.dir}/nessie
          with:
            patch: ${source.dir}/patch/jackson-core-2.22.1.patch
        - name: force netty 4.2.17 (multiple CVEs)
          uses: git/patch@v1
          work-dir: ${source.dir}/nessie
          with:
            patch: ${source.dir}/patch/netty-4.2.17.patch
        - name: force reactor-netty 1.2.18 and reactor-core 3.7.19 (CVE-2025-22227)
          uses: git/patch@v1
          work-dir: ${source.dir}/nessie
          with:
            patch: ${source.dir}/patch/reactor-core-3.7.19.patch
        - name: force opentelemetry 1.62.0 (CVE-2026-45292)
          uses: git/patch@v1
          work-dir: ${source.dir}/nessie
          with:
            patch: ${source.dir}/patch/opentelemetry-1.62.0.patch
        - name: force postgresql 42.7.12 (CVE-2026-42198, CVE-2026-54291)
          uses: git/patch@v1
          work-dir: ${source.dir}/nessie
          with:
            patch: ${source.dir}/patch/postgresql-42.7.12.patch
        - name: build
          privileged: true
          runs: |
            set -eux -o pipefail

            export GRADLE_HOME="/usr/share/java/gradle"
            export JAVA_HOME="/usr/lib/jvm/temurin-21"
            export PATH="${GRADLE_HOME}/bin:${JAVA_HOME}/bin:${PATH}"

            ./gradlew :nessie-quarkus:clean :nessie-quarkus:quarkusBuild --stacktrace --info
        - name: stage quarkus app
          runs: |
            set -eux -o pipefail

            install -d "${target.dir}/usr/share/nessie/quarkus-app"
            cp -a servers/quarkus-server/build/quarkus-app/. \
              "${target.dir}/usr/share/nessie/quarkus-app/"
        - name: generate FIPS properties
          runs: |
            set -eux -o pipefail

            BC_CLASSPATH="/usr/lib/bouncycastle/bc-fips-2.1.2.jar:\
            /usr/lib/bouncycastle/bctls-fips-2.1.23.jar:\
            /usr/lib/bouncycastle/bcutil-fips-2.1.6.jar:\
            /usr/lib/bouncycastle/bc-rng-jent-1.3.6.jar:\
            /usr/lib/bouncycastle/bcpkix-fips-2.1.11.jar"

            cat > "${target.dir}/usr/share/nessie/quarkus-app/nessie-fips.properties" << EOF
            -Xbootclasspath/a:${BC_CLASSPATH}
            --add-exports=java.base/sun.security.internal.spec=ALL-UNNAMED
            --add-exports=java.base/sun.security.provider=ALL-UNNAMED
            -Dorg.bouncycastle.fips.approved_only=true
            -Djavax.net.ssl.trustStore=/usr/lib/bouncycastle/cacerts.bcfks
            -Djavax.net.ssl.trustStoreType=BCFKS
            -Djavax.net.ssl.trustStorePassword=changeit
            EOF
        - name: java sbom
          uses: sbom@v1
          with:
            extra-scanners: java-archive-cataloger
            prefix: nessie
            source: ${target.dir}/usr/share/nessie/quarkus-app
        - uses: dhi/build-pkg:0
          with:
            description: Project Nessie transactional catalog for data lakes
            files:
              - usr/share/nessie
            formats:
              - deb
            license: Apache-2.0
            name: nessie-0.108
            rel: 0
            url: https://projectnessie.org/
            version: 0.108.4
      paths:
        - type: file
          path: ${source.dir}/patch/jackson-core-2.22.1.patch
          uid: 0
          gid: 0
          source: package/main/nessie/patch/jackson-core-2.22.1.patch
        - type: file
          path: ${source.dir}/patch/netty-4.2.17.patch
          uid: 0
          gid: 0
          source: package/main/nessie/patch/netty-4.2.17.patch
        - type: file
          path: ${source.dir}/patch/reactor-core-3.7.19.patch
          uid: 0
          gid: 0
          source: package/main/nessie/patch/reactor-core-3.7.19.patch
        - type: file
          path: ${source.dir}/patch/opentelemetry-1.62.0.patch
          uid: 0
          gid: 0
          source: package/main/nessie/patch/opentelemetry-1.62.0.patch
        - type: file
          path: ${source.dir}/patch/postgresql-42.7.12.patch
          uid: 0
          gid: 0
          source: package/main/nessie/patch/postgresql-42.7.12.patch
os-release:
  name: Docker Hardened Images (Debian)
  id: debian
  version-id: "13"
  version-codename: trixie
  pretty-name: Docker Hardened Images/Debian GNU/Linux 13 (trixie)
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
