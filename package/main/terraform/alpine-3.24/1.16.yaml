# syntax=dhi.io/build:2-alpine3.24

image: dhi.io/pkg-terraform
variant: runtime
tags:
  - 1.16.5-alpine3.24
  - 1.16.5-r2-alpine3.24
platforms:
  - linux/amd64
  - linux/arm64
dates:
  release: "2026-08-26"
vars:
  COMMIT_SHA: ef47237fd0e03d6e93bdc510b526287f06e94c03
  GOLANG_MAJOR_MINOR_VERSION: "1.26"
  GOLANG_VERSION: 1.26.9-r0
  PACKAGE_NAME: terraform-1.16
  REL: "2"
  SEMVER_MAJOR_MINOR_VERSION: "1.16"
  SEMVER_MAJOR_VERSION: "1"
  SEMVER_VERSION: 1.16.5
  VERSION: 1.16.5
contents:
  repositories:
    - https://dhi.io/apk/alpine/v3.24/main
    - https://dhi.io/apk/alpine/v3.23/main
    - https://dl-cdn.alpinelinux.org/alpine/v3.24/main
    - https://dl-cdn.alpinelinux.org/alpine/v3.24/community
  keyring:
    - https://dhi.io/keyring/dhi-apk@docker-0F81AD7700D99184.rsa.pub
  packages:
    - alpine-baselayout-data
  builds:
    - name: terraform-1.16
      work-dir: /go/src/github.com/hashicorp/terraform
      caches:
        - path: /go/pkg/mod
      contents:
        packages:
          - busybox
          - bash
          - ca-certificates-bundle
          - coreutils
          - diffutils
          - findutils
          - git
          - mawk
          - sed
          - golang-1.26=1.26.9-r0
          - golang-1.26-oci-config=1.26.9-r0
        files:
          - url: git+https://github.com/hashicorp/terraform.git#v1.16.5
            checksum: ef47237fd0e03d6e93bdc510b526287f06e94c03
            path: /go/src/github.com/hashicorp/terraform
            spdx:
              name: terraform
              version: 1.16.5
              packages:
                - name: terraform
                  purl: pkg:golang/github.com/hashicorp/terraform@v1.16.5
                  license: BUSL-1.1
            uid: 65532
            gid: 65532
      pipeline:
        - name: update go dependencies (1.16 only)
          uses: go/bump@v2
          with:
            deps:
              - go.opentelemetry.io/otel@v1.46.0
              - go.opentelemetry.io/otel/sdk@v1.46.0
              - go.opentelemetry.io/otel/metric@v1.46.0
              - go.opentelemetry.io/otel/trace@v1.46.0
              - go.opentelemetry.io/otel/log@v0.21.0
              - go.opentelemetry.io/otel/sdk/log@v0.21.0
              - go.opentelemetry.io/otel/exporters/otlp/otlptrace@v1.46.0
              - go.opentelemetry.io/otel/exporters/otlp/otlptrace/otlptracehttp@v1.46.0
              - go.opentelemetry.io/otel/exporters/otlp/otlptrace/otlptracegrpc@v1.46.0
              - go.opentelemetry.io/otel/exporters/otlp/otlplog/otlploggrpc@v0.21.0
              - go.opentelemetry.io/otel/exporters/otlp/otlplog/otlploghttp@v0.21.0
              - go.opentelemetry.io/otel/exporters/stdout/stdoutlog@v0.21.0
              - google.golang.org/grpc@v1.85.0-dev.0.20260825072537-93e31b48545e
            download: true
            replaces:
              - go.opentelemetry.io/contrib/instrumentation/google.golang.org/grpc/otelgrpc=go.opentelemetry.io/contrib/instrumentation/google.golang.org/grpc/otelgrpc@v0.63.0
            tidy: true
        - name: run tests (1.16 only)
          privileged: true
          runs: |
            set -eux -o pipefail

            for attempt in 1 2 3; do
              if su -s /bin/bash nonroot -c 'cd /go/src/github.com/hashicorp/terraform && go test -vet=off -timeout 30m ./...'; then
                break
              fi
              if [ "$attempt" -eq 3 ]; then
                exit 1
              fi
            done
        - name: build
          uses: go/build@v1
          environment:
            GOFLAGS: -buildvcs=false
          with:
            fips: false
            ldflags:
              - -X github.com/hashicorp/terraform/version.dev=no
            output: ${target.dir}/usr/bin/terraform
        - name: build dev
          uses: go/build@v1
          environment:
            GOFLAGS: -buildvcs=false
          with:
            fips: false
            ldflags:
              - -X github.com/hashicorp/terraform/version.dev=no
            output: ${target.dir}/usr/bin/terraform-dev
            strip: false
        - uses: dhi/build-pkg:0
          with:
            description: Terraform infrastructure as code tool
            files:
              - usr/bin/terraform
            license: BUSL-1.1
            name: terraform-1.16
            rel: 2
            subpackages:
              - files:
                  - path: usr/bin/terraform
                    source: usr/bin/terraform-dev
                name: terraform-1.16-dev
            url: https://developer.hashicorp.com/terraform
            version: 1.16.5
      accounts:
        root: true
        run-as: root
        users:
          - name: nonroot
            uid: 65532
            gid: 65532
        groups:
          - name: nonroot
            gid: 65532
            members:
              - nonroot
os-release:
  name: Docker Hardened Images (Alpine)
  id: alpine
  version-id: "3.24"
  pretty-name: Docker Hardened Images/Alpine Linux v3.24
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
