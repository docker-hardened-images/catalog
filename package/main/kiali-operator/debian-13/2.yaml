            gid: 0
      pipeline:
        - name: verify upstream collection versions
          runs: |
            set -eux -o pipefail

            grep -A3 'community.general.git' requirements.yml | grep "version: 9.0.0"
            grep -A3 'kubernetes.core.git' requirements.yml | grep "version: 4.0.0"
            grep -A3 'operator-sdk-ansible-util.git' requirements.yml | grep "version: v0.5.0"
            grep -A3 'ansible.posix.git' requirements.yml | grep "version: 1.6.2"
        - name: stage operator assets
          runs: |
            set -eux -o pipefail

            install -d ${target.dir}/opt/ansible
            cp -a \
              ${source.dir}/ansible-profiler.cfg \
              playbooks \
              requirements.yml \
              roles \
              watches-k8s.yaml \
              watches-k8s-ns.yaml \
              watches-os.yaml \
              watches-os-ns.yaml \
              ${target.dir}/opt/ansible/
        - name: install ansible collections
          runs: |
            set -eux -o pipefail

            collections=${target.dir}/opt/ansible/.ansible/collections/ansible_collections
            install -d \
              ${collections}/community/general \
              ${collections}/kubernetes/core \
              ${collections}/operator_sdk/util \
              ${collections}/ansible/posix
            tar -xzf ${source.dir}/collections/community-general-9.0.0.tar.gz -C ${collections}/community/general
            tar -xzf ${source.dir}/collections/kubernetes-core-4.0.0.tar.gz -C ${collections}/kubernetes/core
            tar -xzf ${source.dir}/collections/operator_sdk-util-0.5.0.tar.gz -C ${collections}/operator_sdk/util
            tar -xzf ${source.dir}/collections/ansible-posix-1.6.2.tar.gz -C ${collections}/ansible/posix
        - name: install jmespath
          runs: |
            set -eux -o pipefail

            install -d ${target.dir}/usr/lib/kiali-operator/python3.12/site-packages
            unzip -q ${source.dir}/jmespath.whl \
              -d ${target.dir}/usr/lib/kiali-operator/python3.12/site-packages
        - uses: dhi/build-pkg:0
          with:
            depends:
              - ansible-operator-runtime
            description: Kiali operator for installing and managing Kiali
            files:
              - opt/ansible
              - usr/lib/kiali-operator
            formats:
              - deb
            license: Apache-2.0
            name: kiali-operator
            rel: 0
            url: https://github.com/kiali/kiali-operator
            version: 2.33.0
      paths:
        - type: file
          path: ${source.dir}/ansible-profiler.cfg
          uid: 0
          gid: 0
          mode: "0644"
          source: package/main/kiali-operator/ansible-profiler.cfg
