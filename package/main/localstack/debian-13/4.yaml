# syntax=dhi.io/build:2-debian13

image: dhi.io/pkg-localstack
variant: runtime
tags:
  - 4.14.0
  - 4.14.0-r1
  - 4.14.0-debian13
  - 4.14.0-r1-debian13
platforms:
  - linux/amd64
  - linux/arm64
vars:
  COMMIT_SHA: 3d5a0c70e0fe2eb0864447c882454d33b406ba8a
  PYTHON_MINOR: "3.13"
  PYTHON_VERSION: 3.13.15-1
  REL: "1"
  SEMVER_MAJOR_MINOR_VERSION: "4.14"
  SEMVER_MAJOR_VERSION: "4"
  SEMVER_VERSION: 4.14.0
  VERSION: 4.14.0
contents:
  packages:
    - base-files
  builds:
    - name: localstack
      work-dir: ${source.dir}
      caches:
        - path: /root/.cache/pip
      contents:
        repositories:
          - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
        keyring:
          - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
        packages:
          - bash
          - build-essential
          - ca-certificates
          - coreutils
          - diffutils
          - findutils
          - gawk
          - git
          - grep
          - libstdc++6
          - sed
          - libpython-3.13-minimal=3.13.15-1
          - libpython-3.13-stdlib=3.13.15-1
          - libpython-3.13=3.13.15-1
          - python-3.13-minimal=3.13.15-1
          - python-3.13=3.13.15-1
          - python-3.13-dev=3.13.15-1
          - python3-pip
          - python3-setuptools
          - python3-venv
          - python3-wheel
        files:
          - url: git+https://github.com/localstack/localstack.git#v4.14.0
            checksum: 3d5a0c70e0fe2eb0864447c882454d33b406ba8a
            path: ${source.dir}/localstack
            spdx:
              name: localstack
              version: 4.14.0
              packages:
                - name: localstack
                  purl: pkg:dhi/localstack@4.14.0
                  license: Apache-2.0
            uid: 0
            gid: 0
      pipeline:
        - name: build venv at final path and stage it
          privileged: true
          runs: |
            set -eux -o pipefail

            export SOURCE_DIR="${source.dir}" TARGET_DIR="${target.dir}" PYTHON_BIN=/usr/bin/python3.13 VERSION="4.14.0"
            bash "${source.dir}/build-localstack.sh"
        - uses: dhi/build-pkg:0
          with:
            deb:
              depends:
                - libstdc++6
            depends:
              - python-3.13
            description: LocalStack - a fully functional local AWS cloud stack
            files:
              - usr/lib/localstack
              - usr/bin/localstack
              - usr/bin/localstack-supervisor
            formats:
              - deb
            license: Apache-2.0
            name: localstack
            rel: 1
            url: https://github.com/localstack/localstack
            version: 4.14.0
      paths:
        - type: file
          path: ${source.dir}/build-localstack.sh
          uid: 0
          gid: 0
          mode: "0755"
          source: package/main/localstack/build-localstack.sh
os-release:
  name: Docker Hardened Images (Debian)
  id: debian
  version-id: "13"
  version-codename: trixie
  pretty-name: Docker Hardened Images/Debian GNU/Linux 13 (trixie)
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
