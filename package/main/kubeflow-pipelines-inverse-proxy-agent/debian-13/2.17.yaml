          runs: |
            set -eux -o pipefail

            agent=${target.dir}/usr/bin/proxy-forwarding-agent
            info=$(go version -m "$agent")
            printf '%s\n' "$info"
            buildinfo=${source.dir}/agent-buildinfo.txt
            printf '%s\n' "$info" > "$buildinfo"
            head -1 "$buildinfo" | grep -qE ': go1.27([.]|$)'
            if grep -qF -- '-X main.' "$buildinfo"; then exit 1; fi
            grep -qE '^[[:space:]]+mod[[:space:]]+github.com/google/inverting-proxy[[:space:]]+v0[.]0[.]0-20230302040338-9ccd9226c6ac([+]dirty)?([[:space:]]|$)' "$buildinfo"
            if [ "false" = "true" ]; then
              grep -qE '^[[:space:]]+build[[:space:]]+GOFIPS140=v1[.]0[.]0(-[0-9a-f]+)?$' "$buildinfo"
              grep -aqF 'crypto/internal/fips140/v' "$agent"
            elif grep -qF 'GOFIPS140=' "$buildinfo"; then
              exit 1
            fi
        - name: test agent
          runs: |
            set -eux -o pipefail

            gobin="$(go env GOPATH)/bin"
            mkdir -p "$gobin"
            CGO_ENABLED=0 go build -trimpath -o "$gobin/inverting-proxy" ./server
            ln -s ${target.dir}/usr/bin/proxy-forwarding-agent "$gobin/proxy-forwarding-agent"
            go test -count=1 -skip '^TestProxyTimeoutWithShortTimeout$' ./agent/...
        - name: bump python dependencies
          uses: python/bump@v1
          work-dir: ${source.dir}
          privileged: true
          with:
            bumps: ${source.dir}/patch/python-bumps.json
            hashes: require
            mode: requirements
            python: /usr/bin/python3.13
            requirements:
              - requirements-lock.txt
        - name: build venv
          work-dir: ${source.dir}
          privileged: true
          runs: |
            set -eux -o pipefail

            test "$(grep -vE '^[[:space:]]*(#|$)' kubeflow-pipelines/proxy/requirements.txt)" = requests

            export UV_PYTHON_DOWNLOADS=never
            venv=${target.dir}/usr/lib/kubeflow-pipelines-inverse-proxy-agent/venv
            uv venv "$venv" --python /usr/bin/python3.13
            uv pip install --python "$venv/bin/python" --no-cache --no-deps --require-hashes -r requirements-lock.txt
            uv pip check --python "$venv/bin/python"
            "$venv/bin/python" -c 'import requests'

            rm "$venv"/bin/activate* "$venv"/bin/deactivate.bat "$venv"/bin/pydoc.bat
            rm "$venv/.lock" "$venv/CACHEDIR.TAG" "$venv/.gitignore"
            find "$venv" -type d -name __pycache__ -prune -exec rm -rf {} +
            test ! -e "$venv/lib/python3.13/site-packages/pip"
            test ! -e "$venv/lib/python3.13/site-packages/setuptools"

            for f in "$venv"/bin/*; do
              [ -f "$f" ] && [ ! -L "$f" ] || continue
              if head -1 "$f" | grep -qF "#!${target.dir}"; then
                sed -i "1s|#!${target.dir}|#!|" "$f"
              fi
            done
            leaks=$(grep -rlF -e "$venv" -e "${source.dir}" "$venv" || true)
            test -z "$leaks"
            test -z "$(find "$venv" -perm -0002 ! -type l)"
        - name: install launcher and licenses
          work-dir: ${source.dir}/kubeflow-pipelines
          runs: |
            set -eux -o pipefail

            install -D -m 0755 proxy/attempt-register-vm-on-proxy.sh ${target.dir}/usr/lib/kubeflow-pipelines-inverse-proxy-agent/attempt-register-vm-on-proxy.sh
            install -D -m 0644 proxy/get_proxy_url.py ${target.dir}/usr/lib/kubeflow-pipelines-inverse-proxy-agent/get_proxy_url.py
            install -D -m 0644 LICENSE ${target.dir}/usr/share/doc/kubeflow-pipelines-inverse-proxy-agent/LICENSE
            install -D -m 0644 /go/src/github.com/google/inverting-proxy/LICENSE ${target.dir}/usr/share/doc/inverting-proxy/LICENSE
        - name: python sbom
          uses: sbom@v1
          with:
            extra-scanners: python-package-cataloger
            prefix: kubeflow-pipelines-inverse-proxy-agent-python
            source: ${target.dir}/usr/lib/kubeflow-pipelines-inverse-proxy-agent/venv
        - name: stage sbom documents
          runs: |
            set -eux -o pipefail

            mkdir -p ${target.dir}/opt/docker/sbom
