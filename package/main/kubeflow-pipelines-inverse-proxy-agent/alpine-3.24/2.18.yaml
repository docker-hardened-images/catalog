# syntax=dhi.io/build:2-alpine3.24

image: dhi.io/pkg-kubeflow-pipelines-inverse-proxy-agent
variant: runtime
tags:
  - 2.18.2-alpine3.24
  - 2.18.2-r1-alpine3.24
platforms:
  - linux/amd64
  - linux/arm64
vars:
  AGENT_COMMIT: 6264998ae706281fd068e8f3eeb3cbd42046c5b6
  AGENT_COMMIT_TIME: "20261001011610"
  AGENT_SOURCE_COMMIT: 6264998ae706281fd068e8f3eeb3cbd42046c5b6
  AGENT_SOURCE_COMMIT_SHORT: 6264998ae706
  AGENT_SOURCE_COMMIT_TIME: "20261001011610"
  COMMIT_SHA: c584383159553e51905b71d56c139b39ccc0a1cc
  GOLANG_MAJOR_MINOR_VERSION: "1.27"
  GOLANG_VERSION: 1.27.4-r1
  KUBECTL_MAJOR_MINOR_VERSION: "1.36"
  LIB_DIR: /usr/lib/kubeflow-pipelines-inverse-proxy-agent
  PACKAGE_NAME: kubeflow-pipelines-inverse-proxy-agent-2.18
  PYTHON_MINOR: "3.13"
  PYTHON_VERSION: 3.13.18-r5
  REL: "1"
  SEMVER_MAJOR_MINOR_VERSION: "2.18"
  SEMVER_MAJOR_VERSION: "2"
  SEMVER_VERSION: 2.18.2
  VERSION: 2.18.2
contents:
  repositories:
    - https://dhi.io/apk/alpine/v3.24/main
    - https://dhi.io/apk/alpine/v3.23/main
    - https://dl-cdn.alpinelinux.org/alpine/v3.24/main
    - https://dl-cdn.alpinelinux.org/alpine/v3.24/community
  keyring:
    - https://dhi.io/keyring/dhi-apk@docker-0F81AD7700D99184.rsa.pub
  packages:
    - alpine-baselayout-data
  builds:
    - name: kubeflow-pipelines-inverse-proxy-agent-2.18
      work-dir: /go/src/github.com/google/inverting-proxy
      environment:
        GOTOOLCHAIN: local
      caches:
        - path: /go/pkg/mod
      contents:
        packages:
          - bash
          - busybox
          - ca-certificates-bundle
          - coreutils
          - findutils
          - git
          - grep
          - patch
          - sed
          - golang-1.27=1.27.4-r1
          - golang-1.27-oci-config=1.27.4-r1
          - python-3.13=3.13.18-r5
        files:
          - url: git+https://github.com/kubeflow/pipelines.git#2.18.2
            checksum: c584383159553e51905b71d56c139b39ccc0a1cc
            path: ${source.dir}/kubeflow-pipelines
            spdx:
              name: kubeflow-pipelines
              version: 2.18.2
              packages:
                - name: kubeflow-pipelines
                  purl: pkg:github/kubeflow/pipelines@2.18.2#proxy
                  license: Apache-2.0
            uid: 0
            gid: 0
          - url: git+https://github.com/google/inverting-proxy.git#6264998ae706281fd068e8f3eeb3cbd42046c5b6
            checksum: 6264998ae706281fd068e8f3eeb3cbd42046c5b6
            path: /go/src/github.com/google/inverting-proxy
            spdx:
              name: inverting-proxy
              version: v0.0.0-20261001011610-6264998ae706
              packages:
                - name: inverting-proxy
                  purl: pkg:golang/github.com/google/inverting-proxy@v0.0.0-20261001011610-6264998ae706
                  license: Apache-2.0
            uid: 0
            gid: 0
      pipeline:
        - name: apply launcher path patch
          uses: patch@v1
          work-dir: ${source.dir}/kubeflow-pipelines
          with:
            options: -p1
            patch: ${source.dir}/patch/attempt-register-vm-on-proxy-paths-2.18.patch
        - name: synchronize local proxy test cleanup
          uses: patch@v1
          with:
            options: -p1
            patch: ${source.dir}/patch/wait-for-local-proxy-test-cleanup.patch
        - name: check patched launcher and kubectl line
          runs: |
            set -eux -o pipefail

            test -n "1.36"
            launcher=${source.dir}/kubeflow-pipelines/proxy/attempt-register-vm-on-proxy.sh
            grep -qxF '  /usr/bin/proxy-forwarding-agent \' "$launcher"
            grep -qF 'PROXY_URL=$(/usr/lib/kubeflow-pipelines-inverse-proxy-agent/venv/bin/python3 /usr/lib/kubeflow-pipelines-inverse-proxy-agent/get_proxy_url.py ' "$launcher"
            if grep -nF '/opt/' "$launcher"; then
              exit 1
            fi
        - name: use kubeflow pipelines agent go.mod
          runs: |
            set -eux -o pipefail

            test -f ${source.dir}/kubeflow-pipelines/proxy/agent.go.mod
            test -f ${source.dir}/kubeflow-pipelines/proxy/agent.go.sum
            cp ${source.dir}/kubeflow-pipelines/proxy/agent.go.mod go.mod
            cp ${source.dir}/kubeflow-pipelines/proxy/agent.go.sum go.sum
            grep -q '^module github.com/google/inverting-proxy$' go.mod
        - name: bump go dependencies
          uses: go/bump@v3
          with:
            deps:
              - go.opentelemetry.io/otel/trace@v1.47.0
            download: true
        - name: build proxy-forwarding-agent
          uses: go/build@v1
          with:
            fips: false
            ldflags: -w
            output: ${target.dir}/usr/bin/proxy-forwarding-agent
            packages: ./agent
        - name: check agent build info
          runs: |
            set -eux -o pipefail

            agent=${target.dir}/usr/bin/proxy-forwarding-agent
            info=$(go version -m "$agent")
            printf '%s\n' "$info"
            buildinfo=${source.dir}/agent-buildinfo.txt
            printf '%s\n' "$info" > "$buildinfo"
            head -1 "$buildinfo" | grep -qE ': go1.27([.]|$)'
            if grep -qF -- '-X main.' "$buildinfo"; then exit 1; fi
            grep -qE '^[[:space:]]+mod[[:space:]]+github.com/google/inverting-proxy[[:space:]]+v0[.]0[.]0-20261001011610-6264998ae706([+]dirty)?([[:space:]]|$)' "$buildinfo"
            if [ "false" = "true" ]; then
              grep -qE '^[[:space:]]+build[[:space:]]+GOFIPS140=v1[.]0[.]0(-[0-9a-f]+)?$' "$buildinfo"
              grep -aqF 'crypto/internal/fips140/v' "$agent"
            elif grep -qF 'GOFIPS140=' "$buildinfo"; then
              exit 1
            fi
        - name: test agent
          runs: |
            set -eux -o pipefail

            gobin="$(go env GOPATH)/bin"
            mkdir -p "$gobin"
            CGO_ENABLED=0 go build -trimpath -o "$gobin/inverting-proxy" ./server
            ln -s ${target.dir}/usr/bin/proxy-forwarding-agent "$gobin/proxy-forwarding-agent"
            go test -count=1 -skip '^TestProxyTimeoutWithShortTimeout$' ./agent/...
        - name: build venv
          runs: |
            set -eux -o pipefail

            test "$(grep -vE '^[[:space:]]*(#|$)' ${source.dir}/kubeflow-pipelines/proxy/requirements.txt)" = requests

            venv=${target.dir}/usr/lib/kubeflow-pipelines-inverse-proxy-agent/venv
            /usr/bin/python3.13 -m venv --system-site-packages --without-pip "$venv"
            rm "$venv"/bin/activate* "$venv"/bin/Activate.ps1
            sed -i "s|${target.dir}||g" "$venv/pyvenv.cfg"
            grep -qx 'include-system-site-packages = true' "$venv/pyvenv.cfg"
            test -z "$(find "$venv/lib/python3.13/site-packages" -mindepth 1)"
            rm "$venv/lib64" "$venv/.gitignore"
            find "$venv" -depth -type d -empty -delete
            leaks=$(grep -rlF -e "$venv" -e "${source.dir}" "$venv" || true)
            test -z "$leaks"
            test -z "$(find "$venv" -perm -0002 ! -type l)"
        - name: install launcher and licenses
          work-dir: ${source.dir}/kubeflow-pipelines
          runs: |
            set -eux -o pipefail

            install -D -m 0755 proxy/attempt-register-vm-on-proxy.sh ${target.dir}/usr/lib/kubeflow-pipelines-inverse-proxy-agent/attempt-register-vm-on-proxy.sh
            install -D -m 0644 proxy/get_proxy_url.py ${target.dir}/usr/lib/kubeflow-pipelines-inverse-proxy-agent/get_proxy_url.py
            install -D -m 0644 LICENSE ${target.dir}/usr/share/doc/kubeflow-pipelines-inverse-proxy-agent/LICENSE
            install -D -m 0644 /go/src/github.com/google/inverting-proxy/LICENSE ${target.dir}/usr/share/doc/inverting-proxy/LICENSE
        - name: stage sbom documents
          runs: |
            set -eux -o pipefail

            mkdir -p ${target.dir}/opt/docker/sbom
            for d in kubeflow-pipelines inverting-proxy; do
              test -d /opt/docker/sbom/$d
              cp -a /opt/docker/sbom/$d ${target.dir}/opt/docker/sbom/
            done
        - uses: dhi/build-pkg:0
          with:
            conflicts: kubeflow-pipelines-inverse-proxy-agent-2.18-fips
            depends:
              - bash
              - ca-certificates-bundle
              - cloud-sdk
              - coreutils
              - curl
              - jq
              - kubectl-1.36
              - py3.13-requests
              - python-3.13
            description: Kubeflow Pipelines inverse proxy agent, which connects the Pipelines UI to a Google Cloud inverting proxy
            files:
              - usr/bin/proxy-forwarding-agent
              - usr/lib/kubeflow-pipelines-inverse-proxy-agent
              - usr/share/doc/inverting-proxy/LICENSE
              - usr/share/doc/kubeflow-pipelines-inverse-proxy-agent/LICENSE
              - opt/docker/sbom/kubeflow-pipelines
              - opt/docker/sbom/inverting-proxy
            formats:
              - apk
            license: Apache-2.0
            name: kubeflow-pipelines-inverse-proxy-agent-2.18
            rel: 1
            url: https://github.com/kubeflow/pipelines/tree/2.18.2/proxy
            version: 2.18.2
      paths:
        - type: file
          path: ${source.dir}/patch/attempt-register-vm-on-proxy-paths-2.18.patch
          uid: 0
          gid: 0
          mode: "0644"
          source: package/main/kubeflow-pipelines-inverse-proxy-agent/patch/attempt-register-vm-on-proxy-paths-2.18.patch
        - type: file
          path: ${source.dir}/patch/wait-for-local-proxy-test-cleanup.patch
          uid: 0
          gid: 0
          mode: "0644"
          source: package/main/kubeflow-pipelines-inverse-proxy-agent/patch/wait-for-local-proxy-test-cleanup.patch
