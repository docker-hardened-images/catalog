  - 1.1309.0-0-debian13
platforms:
  - linux/amd64
  - linux/arm64
vars:
  DHI_REL: "0"
  DHI_VERSION: 1.1309.0-0
  SEMVER_MAJOR_VERSION: "1"
  SEMVER_VERSION: 1.1309.0
  SNYK_AMD64_CHECKSUM: sha256:4802579c2818938a2f4849d270df1139f310104286a8a5c6305328a3c2eb9e1c
  SNYK_ARM64_CHECKSUM: sha256:97d6c5d0aed21d0f8ae0b0b7764acab3c67f5ccd211b1069a6a74fd953e5c600
  SNYK_ASSET: '#{ target.arch == "arm64" ? "snyk-linux-arm64" : "snyk-linux" }'
  SNYK_CHECKSUM: '#{ target.arch == "arm64" ? "sha256:97d6c5d0aed21d0f8ae0b0b7764acab3c67f5ccd211b1069a6a74fd953e5c600" : "sha256:4802579c2818938a2f4849d270df1139f310104286a8a5c6305328a3c2eb9e1c" }'
  SNYK_FIPS_AMD64_CHECKSUM: sha256:83aa74d9f902c04c14f1c1af7003f4877d44b2b910bed5c09f26e7a6823735e8
  SNYK_FIPS_ARM64_CHECKSUM: sha256:632b4f7cacfaf3223c28f39c82a84b592a8e726d8751de1363365afd42244b53
  SNYK_FIPS_CHECKSUM: '#{ target.arch == "arm64" ? "sha256:632b4f7cacfaf3223c28f39c82a84b592a8e726d8751de1363365afd42244b53" : "sha256:83aa74d9f902c04c14f1c1af7003f4877d44b2b910bed5c09f26e7a6823735e8" }'
  VERSION: 1.1309.0
contents:
  packages:
    - '!base-files'
  builds:
    - name: snyk deb
      work-dir: ${source.dir}/snyk
      contents:
        packages:
          - debhelper
          - dpkg-dev
          - make
        files:
          - url: https://github.com/snyk/cli/releases/download/v1.1309.0/${SNYK_ASSET}
            checksum: ${SNYK_CHECKSUM}
            path: ${source.dir}/snyk/${SNYK_ASSET}
            uid: 0
            gid: 0
      pipeline:
        - name: stage binary
          runs: |
            set -eux -o pipefail

            install -m0755 "${SNYK_ASSET}" snyk
            rm -f "${SNYK_ASSET}"
        - uses: dpkg/bump@v1
          with:
            changelog:
              - DHI Build
            version: 1.1309.0-0
        - uses: dpkg/build@v1
          with:
            args: -b -uc -us -d
      paths:
        - type: directory
          path: ${source.dir}/snyk/debian
          uid: 0
          gid: 0
          mode: "0600"
          source: package/main/snyk/debian-13/debian
os-release:
  name: Docker Hardened Images (Debian)
  id: debian
  version-id: "13"
  version-codename: trixie
  pretty-name: Docker Hardened Images/Debian GNU/Linux 13 (trixie)
  home-url: https://docker.com/products/hardened-images/
