  SNYK_AMD64_CHECKSUM: sha256:36fd42eab22ca275bddd2a67c83b51efc358dc2c29dcf53f7a98d3797c93c621
  SNYK_ARM64_CHECKSUM: sha256:4f91cfc09204403f2cfa05e9ee5dfa044c24ce78b75220437f86243a32e5317e
  SNYK_ASSET: '#{ target.arch == "arm64" ? "snyk-linux-arm64" : "snyk-linux" }'
  SNYK_CHECKSUM: '#{ target.arch == "arm64" ? "sha256:4f91cfc09204403f2cfa05e9ee5dfa044c24ce78b75220437f86243a32e5317e" : "sha256:36fd42eab22ca275bddd2a67c83b51efc358dc2c29dcf53f7a98d3797c93c621" }'
  SNYK_FIPS_AMD64_CHECKSUM: sha256:1ab5c443127c98d4b636000bf11fc5901965beacfbd73fad57b650682bc1f40e
  SNYK_FIPS_ARM64_CHECKSUM: sha256:84864b22cff0eed545b38a8b08ca75c762afd2b99b811e25d920fba6d511375e
  SNYK_FIPS_CHECKSUM: '#{ target.arch == "arm64" ? "sha256:84864b22cff0eed545b38a8b08ca75c762afd2b99b811e25d920fba6d511375e" : "sha256:1ab5c443127c98d4b636000bf11fc5901965beacfbd73fad57b650682bc1f40e" }'
  VERSION: 1.1307.3
contents:
  packages:
    - '!base-files'
  builds:
    - name: snyk deb
      work-dir: ${source.dir}/snyk
      contents:
        packages:
          - debhelper
          - dpkg-dev
          - make
        files:
          - url: https://github.com/snyk/cli/releases/download/v1.1307.3/${SNYK_ASSET}
            checksum: ${SNYK_CHECKSUM}
            path: ${source.dir}/snyk/${SNYK_ASSET}
            uid: 0
            gid: 0
      pipeline:
        - name: stage binary
          runs: |
            set -eux -o pipefail

            install -m0755 "${SNYK_ASSET}" snyk
            rm -f "${SNYK_ASSET}"
        - uses: dpkg/bump@v1
          with:
            changelog:
              - DHI Build
            version: 1.1307.3-0
        - uses: dpkg/build@v1
          with:
            args: -b -uc -us -d
      paths:
        - type: directory
          path: ${source.dir}/snyk/debian
          uid: 0
          gid: 0
          mode: "0600"
          source: package/main/snyk/debian-13/debian
os-release:
  name: Docker Hardened Images (Debian)
  id: debian
  version-id: "13"
