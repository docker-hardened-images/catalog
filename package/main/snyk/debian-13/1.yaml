# syntax=dhi.io/build:2-debian13

image: dhi.io/pkg-snyk
variant: runtime
tags:
  - 1.1307.0-0
  - 1.1307.0-0-debian13
platforms:
  - linux/amd64
  - linux/arm64
vars:
  DHI_REL: "0"
  DHI_VERSION: 1.1307.0-0
  SEMVER_MAJOR_VERSION: "1"
  SEMVER_VERSION: 1.1307.0
  SNYK_AMD64_CHECKSUM: sha256:65fc01c378bd71f08cff214f7f8f91be907a27aa18b9649296cd8606adce245e
  SNYK_ARM64_CHECKSUM: sha256:3cefc616f8bbdad152b4c2ef73572c55dd425504afcc3ffa54efe20071b2b8d0
  SNYK_ASSET: '#{ target.arch == "arm64" ? "snyk-linux-arm64" : "snyk-linux" }'
  SNYK_CHECKSUM: '#{ target.arch == "arm64" ? "sha256:3cefc616f8bbdad152b4c2ef73572c55dd425504afcc3ffa54efe20071b2b8d0" : "sha256:65fc01c378bd71f08cff214f7f8f91be907a27aa18b9649296cd8606adce245e" }'
  VERSION: 1.1307.0
contents:
  packages:
    - '!base-files'
  builds:
    - name: snyk deb
      work-dir: ${source.dir}/snyk
      contents:
        packages:
          - debhelper
          - dpkg-dev
          - make
        files:
          - url: https://github.com/snyk/cli/releases/download/v1.1307.0/${SNYK_ASSET}
            checksum: ${SNYK_CHECKSUM}
            path: ${source.dir}/snyk/${SNYK_ASSET}
            uid: 0
            gid: 0
      pipeline:
        - name: stage binary
          runs: |
            set -eux -o pipefail

            install -m0755 "${SNYK_ASSET}" snyk
            rm -f "${SNYK_ASSET}"
        - uses: dpkg/bump@v1
          with:
            changelog:
              - DHI Build
            version: 1.1307.0-0
        - uses: dpkg/build@v1
          with:
            args: -b -uc -us -d
      paths:
        - type: directory
          path: ${source.dir}/snyk/debian
          uid: 0
          gid: 0
          mode: "0600"
          source: package/main/snyk/debian-13/debian
os-release:
  name: Docker Hardened Images (Debian)
  id: debian
  version-id: "13"
  version-codename: trixie
  pretty-name: Docker Hardened Images/Debian GNU/Linux 13 (trixie)
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
