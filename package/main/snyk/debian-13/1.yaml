# syntax=dhi.io/build:2-debian13

image: dhi.io/pkg-snyk
variant: runtime
tags:
  - 1.1308.0-0
  - 1.1308.0-0-debian13
platforms:
  - linux/amd64
  - linux/arm64
vars:
  DHI_REL: "0"
  DHI_VERSION: 1.1308.0-0
  SEMVER_MAJOR_VERSION: "1"
  SEMVER_VERSION: 1.1308.0
  SNYK_AMD64_CHECKSUM: sha256:a916d3ec9e6c27d56cf67664459885512758a1ae94418ba430fcb92e86c32ae1
  SNYK_ARM64_CHECKSUM: sha256:059d33ea4fa3d53c26ade2b6f69ab61dcf567dc8cbc2225ef3060db6fcfe8664
  SNYK_ASSET: '#{ target.arch == "arm64" ? "snyk-linux-arm64" : "snyk-linux" }'
  SNYK_CHECKSUM: '#{ target.arch == "arm64" ? "sha256:059d33ea4fa3d53c26ade2b6f69ab61dcf567dc8cbc2225ef3060db6fcfe8664" : "sha256:a916d3ec9e6c27d56cf67664459885512758a1ae94418ba430fcb92e86c32ae1" }'
  SNYK_FIPS_AMD64_CHECKSUM: sha256:1d5d28c426efd8d170efbaeec2f186d16401580fd4f6583d651ce2b907f8c255
  SNYK_FIPS_ARM64_CHECKSUM: sha256:87385e8e619083ed83c3a29392c1a471cee995ddf9690125f9440888a390081b
  SNYK_FIPS_CHECKSUM: '#{ target.arch == "arm64" ? "sha256:87385e8e619083ed83c3a29392c1a471cee995ddf9690125f9440888a390081b" : "sha256:1d5d28c426efd8d170efbaeec2f186d16401580fd4f6583d651ce2b907f8c255" }'
  VERSION: 1.1308.0
contents:
  packages:
    - '!base-files'
  builds:
    - name: snyk deb
      work-dir: ${source.dir}/snyk
      contents:
        packages:
          - debhelper
          - dpkg-dev
          - make
        files:
          - url: https://github.com/snyk/cli/releases/download/v1.1308.0/${SNYK_ASSET}
            checksum: ${SNYK_CHECKSUM}
            path: ${source.dir}/snyk/${SNYK_ASSET}
            uid: 0
            gid: 0
      pipeline:
        - name: stage binary
          runs: |
            set -eux -o pipefail

            install -m0755 "${SNYK_ASSET}" snyk
            rm -f "${SNYK_ASSET}"
        - uses: dpkg/bump@v1
          with:
            changelog:
              - DHI Build
            version: 1.1308.0-0
        - uses: dpkg/build@v1
          with:
            args: -b -uc -us -d
      paths:
        - type: directory
          path: ${source.dir}/snyk/debian
          uid: 0
          gid: 0
          mode: "0600"
          source: package/main/snyk/debian-13/debian
os-release:
  name: Docker Hardened Images (Debian)
  id: debian
  version-id: "13"
  version-codename: trixie
  pretty-name: Docker Hardened Images/Debian GNU/Linux 13 (trixie)
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
