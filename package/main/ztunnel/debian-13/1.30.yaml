# syntax=dhi.io/build:2-debian13

image: dhi.io/pkg-ztunnel
variant: runtime
tags:
  - "1.30"
  - 1.30.4
  - 1.30.4-r0
  - 1.30-debian13
  - 1.30.4-debian13
  - 1.30.4-r0-debian13
platforms:
  - linux/amd64
  - linux/arm64
dates:
  release: "2026-05-06"
  end-of-life: "2026-08-31"
vars:
  CARGO_VERSION: 1.97.1-0
  COMMIT_SHA: 75e02620710b18c99e89351503f35cba428fc5fd
  PACKAGE_NAME: ztunnel-1.30
  REL: "0"
  RUSTC_VERSION: 1.97.1-0
  SEMVER_MAJOR_MINOR_VERSION: "1.30"
  SEMVER_MAJOR_VERSION: "1"
  SEMVER_VERSION: 1.30.4
  VERSION: 1.30.4
contents:
  packages:
    - '!base-files'
  builds:
    - name: ztunnel-1.30
      work-dir: ${source.dir}/ztunnel
      environment:
        VERSION: 1.30.4
      caches:
        - path: /root/.cargo
      contents:
        repositories:
          - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
        keyring:
          - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
        packages:
          - bash
          - binutils
          - build-essential
          - cargo-1.97=1.97.1-0
          - ca-certificates
          - coreutils
          - findutils
          - gawk
          - git
          - libcurl4t64
          - libgcc-s1
          - libsqlite3-0
          - libssl3t64
          - mawk
          - pkg-config
          - libssl-dev
          - protobuf-compiler
          - rustc-1.97=1.97.1-0
          - sed
          - zlib1g
        files:
          - url: git+https://github.com/istio/ztunnel.git#1.30.4
            checksum: 75e02620710b18c99e89351503f35cba428fc5fd
            path: ${source.dir}/ztunnel
            spdx:
              name: ztunnel
              version: 1.30.4
              packages:
                - name: ztunnel
                  purl: pkg:dhi/ztunnel@1.30.4
                  license: Apache-2.0
            uid: 0
            gid: 0
      pipeline:
        - name: patch CVEs
          privileged: true
          runs: |
            set -eux -o pipefail

            rm -rf ./fuzz/Cargo.*

            sed -i \
              's/pprof = { version = "0\.14"/pprof = { version = "0\.15"/g' \
              Cargo.toml

            sed -i \
              's/tracing-subscriber = { version = "0\.3[^"]*"/tracing-subscriber = { version = ">=0.3.20, <0.4"/g' \
              Cargo.toml

            sed -i '/^openssl = /s/version = "0\.10"/version = ">=0.10.79, <0.11"/' Cargo.toml

            sed -i '/rustls-webpki/s/version = "0\.103"/version = ">=0.103.13, <0.104"/' Cargo.toml

            cargo update --ignore-rust-version --recursive \
              pprof tracing-subscriber aws-lc-rs time \
              openssl

            cargo update --ignore-rust-version -p hickory-proto@0.26.0 --precise 0.26.1 || true
            cargo update --ignore-rust-version -p hickory-net@0.26.0 --precise 0.26.1 || true

            awk '
            /^name = "rustls-webpki"$/ {
              getline
              if ($0 ~ /^version = "0\.103\./) {
                split($0, parts, "\"")
                print parts[2]
              }
            }' Cargo.lock | sort -u | while read -r __rw_v; do
              [ -z "${__rw_v}" ] && continue
              cargo update --ignore-rust-version -p "rustls-webpki@${__rw_v}" --precise 0.103.13 || true
            done

            cargo update --ignore-rust-version -p rand@0.7.3 --precise 0.8.6 || true
            cargo update --ignore-rust-version -p rand@0.8.5 --precise 0.8.6 || true
            cargo update --ignore-rust-version -p rand@0.9.2 --precise 0.9.3 || true

            cargo update --ignore-rust-version -p memmap2@0.9.10 --precise 0.9.11 || true

            cargo update --ignore-rust-version -p anyhow@1.0.102 --precise 1.0.103 || true

            cargo update --ignore-rust-version -p crossbeam-epoch@0.9.18 --precise 0.9.20 || true

            cargo update --ignore-rust-version -p h2@0.4.15 --precise 0.4.16 || true
        - name: cargo sbom
          uses: sbom@v1
          with:
            extra-scanners: rust-cargo-lock-cataloger
            prefix: ztunnel-cargo
            source: ${source.dir}/ztunnel
        - name: build
          privileged: true
          runs: |
            set -eux -o pipefail

            CARGO_FLAGS=""
            if [ "false" = "true" ]; then
              CARGO_FLAGS="--no-default-features --features tls-openssl"
            fi

            cargo build --release --locked --target-dir "${target.dir}" ${CARGO_FLAGS}
            install -D -m 755 "${target.dir}/release/ztunnel" "${target.dir}/usr/bin/ztunnel"
        - uses: dhi/build-pkg:0
          with:
            depends:
              - libc6
              - libgcc-s1
              - ca-certificates-bundle
            description: Istio Ztunnel - Rust L4 proxy for Istio ambient mesh
            files:
              - usr/bin/ztunnel
            formats:
              - deb
            license: Apache-2.0
            name: ztunnel-1.30
            rel: 0
            url: https://github.com/istio/ztunnel
            version: 1.30.4
os-release:
  name: Docker Hardened Images (Debian)
  id: debian
  version-id: "13"
  version-codename: trixie
  pretty-name: Docker Hardened Images/Debian GNU/Linux 13 (trixie)
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
