# syntax=dhi.io/build:2-debian13

image: dhi.io/pkg-r-base
variant: runtime
tags:
  - "4.6"
  - 4.6.1
  - 4.6.1-r0
  - 4.6-debian13
  - 4.6.1-debian13
  - 4.6.1-r0-debian13
platforms:
  - linux/amd64
  - linux/arm64
dates:
  release: "2026-04-24"
vars:
  DOCOPT_SHA256: 783692117346074cc8860cc16f7e8b328b05fd040e5c206a869ee351e704e917
  DOCOPT_VERSION: 0.7.2
  LITTLER_SHA256: c7d47e41589123d559e54d11999902bb86c5799e12777586638b99b54526110c
  LITTLER_VERSION: 0.3.23
  PACKAGE_NAME: r-base-4.6
  R_SHA256: 4da6e61d2c0aac5f14a2e7e432cb5fcc269efe83da4293050ba7f03dff4e2cf4
  REL: "0"
  SEMVER_MAJOR_MINOR_VERSION: "4.6"
  SEMVER_MAJOR_VERSION: "4"
  SEMVER_VERSION: 4.6.1
  VERSION: 4.6.1
contents:
  packages:
    - base-files
  builds:
    - name: r-base
      work-dir: ${source.dir}
      contents:
        packages:
          - bash
          - binutils
          - ca-certificates
          - coreutils
          - diffutils
          - dpkg-dev
          - findutils
          - g++
          - gcc
          - gfortran
          - gnu-which
          - grep
          - gzip
          - less
          - libbz2-dev
          - libc6-dev
          - libcairo2-dev
          - libcurl4-openssl-dev
          - libdeflate-dev
          - libfontconfig1-dev
          - libicu-dev
          - libjpeg-dev
          - liblzma-dev
          - libncurses-dev
          - libopenblas-pthread-dev
          - libpango1.0-dev
          - libpcre2-dev
          - libreadline-dev
          - libtiff-dev
          - libx11-dev
          - libxt-dev
          - make
          - mawk
          - perl
          - pkg-config
          - sed
          - tar
          - tcl8.6-dev
          - tk8.6-dev
          - tzdata
          - unzip
          - x11proto-core-dev
          - xz-utils
          - zip
          - zlib1g-dev
        files:
          - url: https://cran.r-project.org/src/base/R-4/R-4.6.1.tar.gz
            checksum: sha256:4da6e61d2c0aac5f14a2e7e432cb5fcc269efe83da4293050ba7f03dff4e2cf4
            path: ${source.dir}/R.tar.gz
            spdx:
              name: R
              version: 4.6.1
              packages:
                - name: R
                  purl: pkg:generic/R@4.6.1?download_url=https://cran.r-project.org/src/base/R-4/R-4.6.1.tar.gz
                  license: GPL-2.0-only OR GPL-3.0-only
            uid: 0
            gid: 0
          - url: https://cran.r-project.org/src/contrib/littler_0.3.23.tar.gz
            checksum: sha256:c7d47e41589123d559e54d11999902bb86c5799e12777586638b99b54526110c
            path: ${source.dir}/littler.tar.gz
            spdx:
              name: littler
              version: 0.3.23
              packages:
                - name: littler
                  purl: pkg:cran/littler@0.3.23
                  license: GPL-2.0-or-later
            uid: 0
            gid: 0
          - url: https://cran.r-project.org/src/contrib/docopt_0.7.2.tar.gz
            checksum: sha256:783692117346074cc8860cc16f7e8b328b05fd040e5c206a869ee351e704e917
            path: ${source.dir}/docopt.tar.gz
            spdx:
              name: docopt
              version: 0.7.2
              packages:
                - name: docopt
                  purl: pkg:cran/docopt@0.7.2
                  license: MIT
            uid: 0
            gid: 0
      pipeline:
        - name: extract R source
          runs: |
            set -eux -o pipefail

            tar -xf R.tar.gz
        - name: build and install R
          work-dir: ${source.dir}/R-4.6.1
          runs: |
            set -eux -o pipefail

            multiarch="$(dpkg-architecture -qDEB_HOST_MULTIARCH)"

            R_PAPERSIZE=letter \
              R_BATCHSAVE="--no-save --no-restore" \
              PERL=/usr/bin/perl \
              LIBnn=lib \
              AWK=/usr/bin/mawk \
              LDFLAGS="-Wl,-rpath,/usr/lib/R/lib -Wl,-rpath,/usr/lib/${multiarch}/openblas-pthread" \
              ./configure \
              --prefix=/usr \
              --enable-R-shlib \
              --enable-memory-profiling \
              --with-readline \
              --with-recommended-packages \
              --with-blas="-L/usr/lib/${multiarch}/openblas-pthread -lopenblas" \
              --with-lapack \
              --with-tcltk \
              --with-x

            make -j"$(nproc)"
            make install
        - name: install littler and docopt
          runs: |
            set -eux -o pipefail

            mkdir -p /usr/lib/R/site-library
            tar -xf "${source.dir}/docopt.tar.gz" -C "${source.dir}"
            tar -xf "${source.dir}/littler.tar.gz" -C "${source.dir}"

            R CMD INSTALL --library=/usr/lib/R/site-library "${source.dir}/docopt"
            R CMD INSTALL --library=/usr/lib/R/site-library "${source.dir}/littler"
        - name: configure CRAN mirror
          runs: |
            set -eux -o pipefail

            cat >> /usr/lib/R/etc/Rprofile.site << 'EOF'
            options(repos = c(CRAN = "https://cloud.r-project.org"), download.file.method = "libcurl")
            EOF
        - name: stage payload
          runs: |
            set -eux -o pipefail

            mkdir -p "${target.dir}/usr/bin" "${target.dir}/usr/lib"
            cp -a /usr/lib/R "${target.dir}/usr/lib/R"
            cp -a /usr/bin/R /usr/bin/Rscript "${target.dir}/usr/bin/"

            ln -sf ../lib/R/site-library/littler/bin/r "${target.dir}/usr/bin/r"
            for helper in install install2 installBioc installDeps installGithub testInstalled; do
              ln -sf "../lib/R/site-library/littler/examples/${helper}.r" \
                "${target.dir}/usr/bin/${helper}.r"
            done
        - uses: dhi/build-pkg:0
          with:
            depends:
              - bzip2
              - ca-certificates
              - coreutils
              - dash
              - fontconfig-config
              - gnu-which
              - grep
              - gzip
              - init-system-helpers
              - less
              - libbz2-1.0
              - libc6
              - libcairo2
              - libcurl4t64
              - libdeflate0
              - libfontconfig1
              - libfreetype6
              - libgcc-s1
              - libgfortran5
              - libglib2.0-0t64
              - libgomp1
              - libicu76
              - libjpeg62-turbo
              - liblzma5
              - libncursesw6
              - libopenblas0-pthread
              - libpango-1.0-0
              - libpangocairo-1.0-0
              - libpcre2-8-0
              - libpng16-16t64
              - libreadline8t64
              - libstdc++6
              - libtcl8.6
              - libtiff6
              - libtinfo6
              - libtk8.6
              - libx11-6
              - libxft2
              - libxrender1
              - libxss1
              - libxt6t64
              - libzstd1
              - sed
              - tar
              - unzip
              - zip
              - zlib1g
            description: GNU R statistical computation and graphics system
            files:
              - usr/bin
              - usr/lib/R
            formats:
              - deb
            license: GPL-2.0-only OR GPL-3.0-only
            name: r-base-4.6
            provides: r-base=4.6.1-0
            rel: 0
            url: https://www.r-project.org/
            version: 4.6.1
os-release:
  name: Docker Hardened Images (Debian)
  id: debian
  version-id: "13"
  version-codename: trixie
  pretty-name: Docker Hardened Images/Debian GNU/Linux 13 (trixie)
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
