# syntax=dhi.io/build:2-alpine3.24

image: dhi.io/pkg-kubeflow-access-management
variant: runtime
tags:
  - 2.0.1-alpine3.24
  - 2.0.1-r1-alpine3.24
platforms:
  - linux/amd64
  - linux/arm64
vars:
  COMMIT_SHA: 7628a2f559bca364c71a42b4f33dcc8f0956be96
  GO_RELEASE: 1.26.11
  GOLANG_VERSION: 1.26.11-r0
  PACKAGE_NAME: kubeflow-access-management-2
  REL: "1"
  SEMVER_MAJOR_MINOR_VERSION: "2.0"
  SEMVER_MAJOR_VERSION: "2"
  SEMVER_VERSION: 2.0.1
  VERSION: 2.0.1
contents:
  repositories:
    - https://dhi.io/apk/alpine/v3.24/main
    - https://dhi.io/apk/alpine/v3.23/main
    - https://dl-cdn.alpinelinux.org/alpine/v3.24/main
    - https://dl-cdn.alpinelinux.org/alpine/v3.24/community
  keyring:
    - https://dhi.io/keyring/dhi-apk@docker-0F81AD7700D99184.rsa.pub
  packages:
    - alpine-baselayout-data
  builds:
    - name: kubeflow-access-management-2
      work-dir: /go/src/github.com/kubeflow/dashboard/components/access-management
      contents:
        packages:
          - busybox
          - bash
          - ca-certificates-bundle
          - coreutils
          - findutils
          - mawk
          - sed
          - golang-1.26=1.26.11-r0
          - golang-1.26-oci-config=1.26.11-r0
        files:
          - url: git+https://github.com/kubeflow/dashboard.git#v2.0.1
            checksum: 7628a2f559bca364c71a42b4f33dcc8f0956be96
            path: /go/src/github.com/kubeflow/dashboard
            spdx:
              name: kubeflow-access-management
              version: 2.0.1
              packages:
                - name: access-management
                  purl: pkg:golang/github.com/kubeflow/dashboard/components/access-management@2.0.1
                  license: Apache-2.0
                - name: profile-controller
                  purl: pkg:golang/github.com/kubeflow/dashboard/components/profile-controller@2.0.1
                  license: Apache-2.0
            uid: 0
            gid: 0
          - url: https://raw.githubusercontent.com/golang/go/go1.26.11/LICENSE
            checksum: sha256:911f8f5782931320f5b8d1160a76365b83aea6447ee6c04fa6d5591467db9dad
            path: /tmp/go-license/LICENSE
            uid: 0
            gid: 0
          - url: https://raw.githubusercontent.com/golang/go/go1.26.11/PATENTS
            checksum: sha256:96f408bfae65bf137fc2525d3ecb030271c50c1e90799f87abf8846d8dd505cc
            path: /tmp/go-license/PATENTS
            uid: 0
            gid: 0
      pipeline:
        - name: update go dependencies
          uses: go/bump@v2
          with:
            deps:
              - golang.org/x/net@v0.62.0
              - golang.org/x/text@v0.43.0
            download: true
        - uses: go/hermetic@v1
        - name: test
          runs: |
            set -eux -o pipefail

            if [ "false" = "true" ]; then
              export GOFIPS140=v1.0.0
              export GODEBUG=fips140=on
            fi

            GOPROXY=off GOSUMDB=off go test ./...
        - name: build
          uses: go/build@v1
          with:
            extra-env: GOPROXY=off GOSUMDB=off
            fips: false
            ldflags:
              - -w
            output: ${target.dir}/usr/bin/access-management
            packages: .
        - name: build dev
          uses: go/build@v1
          with:
            extra-env: GOPROXY=off GOSUMDB=off
            fips: false
            ldflags:
              - -linkmode=internal
            output: ${target.dir}/usr/bin/access-management-dev
            packages: .
            strip: false
        - name: verify build info
          runs: |
            set -eux -o pipefail

            mod=/go/src/github.com/kubeflow/dashboard/components/access-management
            runtime="${target.dir}/usr/bin/access-management"
            devbin="${target.dir}/usr/bin/access-management-dev"
            work=$(mktemp -d)
            test -n "$work"

            test "$(grep -cE '^[[:space:]]*replace[[:space:]]' "$mod/go.mod")" = 1
            grep -qE '^replace github\.com/kubeflow/dashboard/components/profile-controller => \.\./profile-controller$' "$mod/go.mod"

            awk '/^require \($/{r=1; next} r && /^\)$/{r=0; next} r && NF >= 2 {print $1, $2} /^require [^(]/{print $2, $3}' "$mod/go.mod" | LC_ALL=C sort -u > "$work/requires"
            test -s "$work/requires"
            grep -qxF 'golang.org/x/net v0.62.0' "$work/requires"
            grep -qxF 'golang.org/x/text v0.43.0' "$work/requires"

            for bin in "$runtime" "$devbin"; do
              test -x "$bin"
              go version -m "$bin" > "$work/buildinfo"
              grep -qF "$(printf '\tpath\tgithub.com/kubeflow/dashboard/components/access-management')" "$work/buildinfo"
              grep -qF "$(printf '\tmod\tgithub.com/kubeflow/dashboard/components/access-management\t(devel)')" "$work/buildinfo"
              grep -qF "$(printf '\t=>\t../profile-controller')" "$work/buildinfo"
              grep -qF "$(printf '\tbuild\tCGO_ENABLED=0')" "$work/buildinfo"
              awk '$1 == "dep" {print $2, $3}' "$work/buildinfo" | LC_ALL=C sort -u > "$work/deps"
              test -s "$work/deps"
              if LC_ALL=C comm -13 "$work/requires" "$work/deps" | grep .; then
                echo "$bin: module versions differ from $mod/go.mod" >&2
                exit 1
              fi
              if [ "false" = "true" ]; then
                grep -qE '^[[:space:]]+build[[:space:]]+GOFIPS140=v1\.0\.0' "$work/buildinfo"
                grep -qE '^[[:space:]]+build[[:space:]]+DefaultGODEBUG=(.*,)?fips140=on(,|$)' "$work/buildinfo"
              elif grep -q fips140 "$work/buildinfo"; then
                echo "$bin: FIPS build settings on a non-FIPS build" >&2
                exit 1
              fi
            done

            go version -m "$runtime" > "$work/runtime-info"
            grep -qxF "$(printf '\tbuild\t-trimpath=true')" "$work/runtime-info"
            if grep -qE -- '-ldflags=.*-X' "$work/runtime-info"; then
              echo "$runtime: -X flags are not used by this main package" >&2
              exit 1
            fi
            go version -m "$devbin" > "$work/dev-info"
            if grep -qxF "$(printf '\tbuild\t-trimpath=true')" "$work/dev-info"; then
              echo "$devbin: dev binary must keep paths" >&2
              exit 1
            fi
        - name: collect and verify dependency licenses
          runs: |
            set -eux -o pipefail

            repo=/go/src/github.com/kubeflow/dashboard
            mod=$repo/components/access-management
            runtime="${target.dir}/usr/bin/access-management"
            devbin="${target.dir}/usr/bin/access-management-dev"
            lic="${target.dir}/usr/share/licenses/kubeflow-access-management"
            pc=github.com/kubeflow/dashboard/components/profile-controller
            work=$(mktemp -d)
            test -n "$work"

            classify() {
              norm=$(tr '\n\t' '  ' < "$1" | tr -s ' ')
              test -n "$norm"
              case "$norm" in
                *'Apache License'*'Version 2.0, January 2004'*) echo Apache-2.0 ;;
                *'Permission to use, copy, modify, and/or distribute this software for any purpose with or without fee is hereby granted'*) echo ISC ;;
                *'Permission is hereby granted, free of charge, to any person obtaining a copy'*) echo MIT ;;
                *'Redistribution and use in source and binary forms'*)
                  case "$norm" in
                    *'endorse'* | *'Neither the name'*) echo BSD-3-Clause ;;
                    *) echo BSD-2-Clause ;;
                  esac
                  ;;
                *) echo UNKNOWN ;;
              esac
            }

            go version -m "$runtime" | awk '$1 == "dep" {print $2, $3}' | LC_ALL=C sort -u > "$work/deps"
            go version -m "$devbin" | awk '$1 == "dep" {print $2, $3}' | LC_ALL=C sort -u > "$work/deps-dev"
            test -s "$work/deps"
            cmp "$work/deps" "$work/deps-dev"

            for bin in "$runtime" "$devbin"; do
              go version "$bin" | grep -qxF "$bin: go1.26.11"
            done
            test "$(go env GOVERSION)" = "go1.26.11"

            modcache=$(go env GOMODCACHE)
            test -n "$modcache"
            rm -rf "$lic"
            mkdir -p "$lic/modules"
            : > "$work/modules.txt"

            while read -r path version; do
              if [ "$path" = "$pc" ]; then
                dir="$repo/components/profile-controller"
              else
                escaped=$(printf '%s' "$path" | sed -E 's/([A-Z])/!\L\1/g')
                test -n "$escaped"
                dir="$modcache/$escaped@$version"
              fi
              test -n "$dir"
              test -d "$dir"
              dest="$lic/modules/$path@$version"
              mkdir -p "$dest"

              if [ "$path" = "$pc" ]; then
                test "$version" = v0.0.0
                install -m 0644 "$repo/LICENSE" "$dest/LICENSE"
              else
                find "$dir" -maxdepth 1 -type f -regextype posix-extended -iregex '.*/(LICEN[CS]E|COPYING|NOTICE|PATENTS|AUTHORS|COPYRIGHT)([._-].*)?' | LC_ALL=C sort > "$work/files"
                test -s "$work/files"
                while read -r f; do
                  install -m 0644 "$f" "$dest/$(basename "$f")"
                done < "$work/files"
              fi

              find "$dest" -maxdepth 1 -type f -regextype posix-extended -iregex '.*/(LICEN[CS]E|COPYING)([._-].*)?' | LC_ALL=C sort > "$work/lic-files"
              test -s "$work/lic-files"
              : > "$work/classes"
              while read -r f; do
                c=$(classify "$f")
                if [ "$c" = UNKNOWN ]; then
                  echo "unreviewed license text: $path $version $(basename "$f")" >&2
                  exit 1
                fi
                echo "$c" >> "$work/classes"
              done < "$work/lic-files"
              spdx=$(LC_ALL=C sort -u "$work/classes" | paste -sd, -)
              names=$(find "$dest" -maxdepth 1 -type f -printf '%f\n' | LC_ALL=C sort | paste -sd, -)
              printf '%s %s %s %s\n' "$path" "$version" "$spdx" "$names" >> "$work/modules.txt"
            done < "$work/deps"

            test -s /tmp/go-license/LICENSE
            test -s /tmp/go-license/PATENTS
            grep -qF 'Copyright 2009 The Go Authors' /tmp/go-license/LICENSE
            test "$(classify /tmp/go-license/LICENSE)" = BSD-3-Clause
            stdlib="$lic/modules/stdlib@go1.26.11"
            mkdir -p "$stdlib"
            install -m 0644 /tmp/go-license/LICENSE "$stdlib/LICENSE"
            install -m 0644 /tmp/go-license/PATENTS "$stdlib/PATENTS"
            printf 'stdlib go%s BSD-3-Clause LICENSE,PATENTS\n' "1.26.11" >> "$work/modules.txt"

            LC_ALL=C sort "$work/modules.txt" > "$lic/modules.txt"
            test -s "$lic/modules.txt"
            test "$(grep -c '^stdlib ' "$lic/modules.txt")" = 1
            awk '$1 != "stdlib" {print $1, $2}' "$lic/modules.txt" | LC_ALL=C sort -u > "$work/listed"
            cmp "$work/listed" "$work/deps"

            awk '{print $1, $2, $4}' "$lic/modules.txt" | while read -r p v names; do
              test -n "$names"
              if [ "$p" = stdlib ]; then
                d="$lic/modules/stdlib@$v"
              else
                d="$lic/modules/$p@$v"
              fi
              test -d "$d"
              for n in $(echo "$names" | tr ',' ' '); do
                test -s "$d/$n"
              done
            done

            install -D -m 0644 "$mod/third_party/library/license.txt" "$lic/third_party/library/license.txt"
            grep -qF 'kubeflow/dashboard' "$lic/third_party/library/license.txt"
            install -D -m 0644 "$repo/LICENSE" "$lic/LICENSE"
            grep -qF 'Apache License' "$lic/LICENSE"
        - name: stage sbom and licenses
          runs: |
            set -eux -o pipefail

            sbom=/opt/docker/sbom/kubeflow-access-management
            test -s "$sbom/.spdx.kubeflow-access-management.json"
            test "$(grep -o 'pkg:golang/github.com/kubeflow/dashboard/components/[a-z-]*@2.0.1' "$sbom/.spdx.kubeflow-access-management.json" | LC_ALL=C sort -u | wc -l | tr -d ' ')" = 2
            install -d "${target.dir}/opt/docker/sbom" "${target.dir}/opt/docker/sbom-dev"
            cp -a "$sbom" "${target.dir}/opt/docker/sbom/"
            cp -a "$sbom" "${target.dir}/opt/docker/sbom-dev/"

            lic="${target.dir}/usr/share/licenses/kubeflow-access-management"
            lic_dev="${target.dir}/usr/share/licenses-dev/kubeflow-access-management"
            test -s "$lic/modules.txt"
            install -d "${target.dir}/usr/share/licenses-dev"
            cp -a "$lic" "$lic_dev"
        - uses: dhi/build-pkg:0
          with:
            description: Kubeflow Access Management (KFAM) API server for per-namespace user access
            files:
              - usr/bin/access-management
              - opt/docker/sbom/kubeflow-access-management
              - usr/share/licenses/kubeflow-access-management
            license: Apache-2.0
            name: kubeflow-access-management-2
            rel: 1
            subpackages:
              - files:
                  - path: usr/bin/access-management
                    source: usr/bin/access-management-dev
                  - path: opt/docker/sbom/kubeflow-access-management
                    source: opt/docker/sbom-dev/kubeflow-access-management
                  - path: usr/share/licenses/kubeflow-access-management
                    source: usr/share/licenses-dev/kubeflow-access-management
                name: kubeflow-access-management-2-dev
            url: https://github.com/kubeflow/dashboard
            version: 2.0.1
os-release:
  name: Docker Hardened Images (Alpine)
  id: alpine
  version-id: "3.24"
  pretty-name: Docker Hardened Images/Alpine Linux v3.24
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
