            gid: 0
          - url: https://github.com/grpc-ecosystem/grpc-gateway/releases/download/v2.22.0/protoc-gen-openapiv2-v2.22.0-linux-x86_64
            checksum: sha256:72a6fc6a6d130189c549a6d88cbdef407d3ed1c95ab101ffb3d223d8b3778c90
            path: ${source.dir}/console-plugins/protoc-gen-openapiv2
            platforms:
              - linux/amd64
            uid: 0
            gid: 0
            mode: "0755"
          - url: https://github.com/grpc-ecosystem/grpc-gateway/releases/download/v2.22.0/protoc-gen-openapiv2-v2.22.0-linux-arm64
            checksum: sha256:4921799b8d80dde5f8cb89817d3ae04dee1e2560e141fd0fc79a2e544cc63178
            path: ${source.dir}/console-plugins/protoc-gen-openapiv2
            platforms:
              - linux/arm64
            uid: 0
            gid: 0
            mode: "0755"
      pipeline:
        - name: drop unlicensed Ailerons font stylesheets
          uses: patch@v1
          with:
            options: -p1
            patches:
              - ${source.dir}/patch/drop-unlicensed-ailerons-font.patch
        - name: use maintained CSRF implementation
          uses: patch@v1
          with:
            options: -p1
            patches:
              - ${source.dir}/patch/use-maintained-csrf.patch
        - name: remove Ailerons font binaries
          runs: |
            set -eux -o pipefail

            for f in console/src/assets/ailerons.otf internal/api/ui/login/static/resources/fonts/ailerons/ailerons.otf; do
              rm "$f"
            done
            rmdir internal/api/ui/login/static/resources/fonts/ailerons
            ! grep -ril --exclude='*.map' aileron console/src internal/api/ui/login/static
        - name: install pnpm and workspace dependencies
          privileged: true
          runs: |
            set -eux -o pipefail

            export CYPRESS_INSTALL_BINARY=0 HUSKY=0 NX_NO_CLOUD=true NX_DAEMON=false NG_CLI_ANALYTICS=false
            export COREPACK_ENABLE_DOWNLOAD_PROMPT=0
            corepack enable
            corepack prepare pnpm@10.30.3 --activate
            pnpm -v | grep -qx "10.30.3"
            pnpm install --frozen-lockfile
            console_pnpm="$(jq -r '.packageManager | sub("^pnpm@"; "") | split("+") | .[0]' console/package.json)"
            corepack prepare "pnpm@${console_pnpm}"
        - name: install code generation tools at project.json versions
          privileged: true
          runs: |
            set -eux -o pipefail

            mkdir -p /go/zitadel-tools /go/src/dhi-zitadel-build
            export GOTOOLCHAIN=local
            jq -r '.targets["generate-install"].options.commands[]' apps/api/project.json \
              | grep -v -E 'gci@|enumer@|mockgen@|stringer@' \
              | sed -E 's#^GOBIN=.* go install #GOBIN=/go/zitadel-tools go install #' \
              | while IFS= read -r line; do sh -c "$line"; done
            for tool in buf statik protoc-gen-go protoc-gen-go-grpc protoc-gen-grpc-gateway protoc-gen-openapiv2 protoc-gen-validate protoc-gen-connect-go protoc-gen-authoption protoc-gen-zitadel; do
              test -x "/go/zitadel-tools/$tool"
            done
        - name: generate Go stubs and OpenAPI
          privileged: true
          runs: |
            set -eux -o pipefail

            export PATH=/go/zitadel-tools:$PATH GOTOOLCHAIN=local GOFLAGS=-mod=mod
            grep -q 'commit: a1ecdc58eccd49aa8bea2a7a9022dc27' proto/buf.lock
            buf generate
            mkdir -p pkg/grpc openapi/v2/zitadel
            cp -r .artifacts/grpc/github.com/zitadel/zitadel/pkg/grpc/** pkg/grpc/
            cp -r .artifacts/grpc/zitadel/ openapi/v2/zitadel
            mkdir -p apps/docs/content/apis/assets
            go run internal/api/assets/generator/asset_generator.go -directory=internal/api/assets/generator/ -assets=apps/docs/content/apis/assets/assets.mdx
        - name: update go dependencies
          uses: go/bump@v2
          with:
            deps:
              - github.com/go-jose/go-jose/v4@v4.1.7
              - golang.org/x/net@v0.62.0
              - github.com/klauspost/compress@v1.20.2
              - github.com/go-chi/chi/v5@v5.5.0
              - filippo.io/csrf@v0.2.1
              - github.com/crewjam/saml@v0.5.2
            download: true
            tidy: true
        - uses: go/hermetic@v1
        - name: generate statik and login CSS
          runs: |
            set -eux -o pipefail

            export PATH=/go/zitadel-tools:$PATH GOTOOLCHAIN=local GOFLAGS=-mod=mod
            go generate internal/api/ui/login/static/resources/generate.go
            go generate internal/api/ui/login/statik/generate.go
            go generate internal/notification/statik/generate.go
            go generate internal/statik/generate.go
            ! grep -ril --exclude='*.map' aileron internal/api/ui/login/static/resources/themes/zitadel
        - name: build workspace packages
          work-dir: /go/src/github.com/zitadel/zitadel/packages/zitadel-proto
          runs: |
            set -eux -o pipefail

            pnpm exec buf generate ../../proto
        - name: build zitadel-client
          work-dir: /go/src/github.com/zitadel/zitadel/packages/zitadel-client
          runs: |
            set -eux -o pipefail

            pnpm run build
        - name: stage console proto plugins and license inputs
          runs: |
            set -eux -o pipefail

            unzip -q -o ${source.dir}/protobuf-javascript.zip -d ${source.dir}/protobuf-javascript
            install -m 0755 ${source.dir}/protobuf-javascript/bin/protoc-gen-js ${source.dir}/console-plugins/protoc-gen-js
            install -m 0644 ${source.dir}/protobuf-javascript/LICENSE.md ${source.dir}/licenses/protobuf-javascript-LICENSE.md
            install -m 0644 /go/src/github.com/zitadel/zitadel/LICENSE ${source.dir}/licenses/LICENSE
            install -m 0644 /go/src/github.com/zitadel/zitadel/LICENSING.md ${source.dir}/licenses/LICENSING.md
            install -m 0644 /go/src/github.com/zitadel/zitadel/apps/login/LICENSE ${source.dir}/licenses/MIT-zitadel.txt
        - name: generate console protobuf bindings
          work-dir: /go/src/github.com/zitadel/zitadel/console
          runs: |
            set -eux -o pipefail

            export PATH=${source.dir}/console-plugins:$PATH
            pnpm exec buf generate ../proto --include-imports --include-wkt
        - name: build console
          work-dir: /go/src/github.com/zitadel/zitadel/console
          runs: |
            set -eux -o pipefail

            export CYPRESS_INSTALL_BINARY=0 HUSKY=0 NX_NO_CLOUD=true NX_DAEMON=false NG_CLI_ANALYTICS=false
            export NODE_OPTIONS=--max-old-space-size=8192
            pnpm run copy-docs-assets
            pnpm exec ng build --configuration production --base-href=/ui/console/ --stats-json
            test -s dist/console/stats.json
            mv dist/console/stats.json ${source.dir}/console-stats.json
            ! find dist -iname '*aileron*' | grep .
        - name: embed console into the Go binary
          runs: |
            set -eux -o pipefail

            cp -r console/dist/console/* internal/api/ui/console/static/
            test -f internal/api/ui/console/static/3rdpartylicenses.txt
            ls internal/api/ui/console/static | grep -q '^main-.*\.js$'
            test ! -e internal/api/ui/console/static/stats.json
            ! find internal/api/ui/console/static -iname '*aileron*' | grep .
        - name: hermetic Go unit subset
          runs: |
            set -eux -o pipefail

            export GOTOOLCHAIN=local GOFLAGS=-mod=mod
            go test -count=1 ./internal/crypto/...
        - name: bundle inventory and license set
          runs: |
            set -eux -o pipefail

            export PATH=/go/zitadel-tools:$PATH
            mkdir -p ${target.dir}/opt/docker/sbom/zitadel-console ${target.dir}/usr/share/licenses/zitadel-4
            node ${source.dir}/bundle-inventory.cjs \
              --console-dir console --workspace-root . \
              --metafile ${source.dir}/console-stats.json \
              --dist-dir console/dist/console \
              --statik-dirs internal/api/ui/login/static,internal/notification/static,internal/static \
              --license-dir ${source.dir}/licenses \
              --version 4.20.6 \
              --line-awesome-version 2.1.0 \
              --protobuf-js-version 4.0.2 \
              --buf-lock proto/buf.lock \
              --out-sbom ${target.dir}/opt/docker/sbom/zitadel-console/.spdx.zitadel-console.json \
              --out-notices ${target.dir}/usr/share/licenses/zitadel-4/THIRD-PARTY-NOTICES.txt
            install -m 0644 ${source.dir}/licenses/LICENSE ${target.dir}/usr/share/licenses/zitadel-4/LICENSE
            install -m 0644 ${source.dir}/licenses/LICENSING.md ${target.dir}/usr/share/licenses/zitadel-4/LICENSING.md
            install -m 0644 ${source.dir}/licenses/MIT-zitadel.txt ${target.dir}/usr/share/licenses/zitadel-4/MIT-zitadel.txt
            install -m 0644 ${source.dir}/licenses/Apache-2.0.txt ${target.dir}/usr/share/licenses/zitadel-4/Apache-2.0.txt
            grep -q 'GNU AFFERO GENERAL PUBLIC LICENSE' ${target.dir}/usr/share/licenses/zitadel-4/LICENSE
            grep -q '^MIT License' ${target.dir}/usr/share/licenses/zitadel-4/MIT-zitadel.txt
            grep -q 'Copyright (c) 2023 ZITADEL' ${target.dir}/usr/share/licenses/zitadel-4/MIT-zitadel.txt
            grep -q 'Version 2.0, January 2004' ${target.dir}/usr/share/licenses/zitadel-4/Apache-2.0.txt
            ! grep -qi aileron ${target.dir}/usr/share/licenses/zitadel-4/THIRD-PARTY-NOTICES.txt
        - name: module version stamp
          work-dir: /go/src/dhi-zitadel-build
          runs: |
            set -eux -o pipefail

            go mod init dhi.build.zitadel
            go mod edit -go="$(grep '^go ' /go/src/github.com/zitadel/zitadel/go.mod | awk '{print $2}')"
            go mod edit -require=github.com/zitadel/zitadel@v4.20.6+incompatible
            go mod edit -replace=github.com/zitadel/zitadel=/go/src/github.com/zitadel/zitadel
            go mod edit -replace=github.com/go-ini/ini=gopkg.in/ini.v1@v1.67.1
            cp /go/src/github.com/zitadel/zitadel/go.sum go.sum
        - name: build zitadel
          uses: go/build@v1
          work-dir: /go/src/dhi-zitadel-build
          with:
            extra-env: GOPROXY=off GOSUMDB=off GOFLAGS=-mod=mod GOTOOLCHAIN=local
            fips: false
            ldflags:
              - -s
              - -X github.com/zitadel/zitadel/cmd/build.version=v4.20.6
              - -X github.com/zitadel/zitadel/cmd/build.commit=$(echo 602e546331ac4e88a5958e5c78c8bc263c39ce61 | cut -c1-8)
              - -X github.com/zitadel/zitadel/cmd/build.date=$(git -c safe.directory='*' -C /go/src/github.com/zitadel/zitadel log -1 --format=%cI)
            output: ${target.dir}/usr/bin/zitadel
            packages: github.com/zitadel/zitadel
        - name: build zitadel dev
          uses: go/build@v1
          work-dir: /go/src/dhi-zitadel-build
          with:
            extra-env: GOPROXY=off GOSUMDB=off GOFLAGS=-mod=mod GOTOOLCHAIN=local
            fips: false
            ldflags:
              - -X github.com/zitadel/zitadel/cmd/build.version=v4.20.6
              - -X github.com/zitadel/zitadel/cmd/build.commit=$(echo 602e546331ac4e88a5958e5c78c8bc263c39ce61 | cut -c1-8)
              - -X github.com/zitadel/zitadel/cmd/build.date=$(git -c safe.directory='*' -C /go/src/github.com/zitadel/zitadel log -1 --format=%cI)
            output: ${target.dir}/usr/bin/zitadel-dev
            packages: github.com/zitadel/zitadel
            strip: false
        - name: verify module version and version output
          runs: |
            set -eux -o pipefail

            go version -m "${target.dir}/usr/bin/zitadel" | grep -F $'mod\tgithub.com/zitadel/zitadel\tv4.20.6+incompatible'
            test "$("${target.dir}/usr/bin/zitadel" --version)" = "zitadel version v4.20.6"
        - uses: spdx@v1
          with:
            license: AGPL-3.0-only
            name: zitadel-go
            purl: pkg:golang/github.com/zitadel/zitadel@4.20.6
            version: 4.20.6
        - name: stage zitadel sbom fragments
          runs: |
            set -eux -o pipefail

            mkdir -p "${target.dir}/opt/docker/sbom"
            cp -a /opt/docker/sbom/zitadel "${target.dir}/opt/docker/sbom/"
            cp -a /opt/docker/sbom/zitadel-go "${target.dir}/opt/docker/sbom/"
            grep -rq 'pkg:dhi/zitadel@4.20.6' "${target.dir}/opt/docker/sbom/zitadel"
            grep -rq 'pkg:golang/github.com/zitadel/zitadel@4.20.6' "${target.dir}/opt/docker/sbom/zitadel-go"
        - uses: dhi/build-pkg:0
          with:
            apk:
              depends:
                - zitadel-4-license
            deb:
              depends:
                - zitadel-4-license
            description: ZITADEL identity and access management server
            files:
              - usr/bin/zitadel
            license: AGPL-3.0-only AND Apache-2.0 AND MIT
            name: zitadel-4
            rel: 0
            subpackages:
              - files:
                  - usr/share/licenses/zitadel-4
                  - opt/docker/sbom/zitadel-console
                  - opt/docker/sbom/zitadel
                  - opt/docker/sbom/zitadel-go
                name: zitadel-4-license
              - apk:
                  depends:
                    - zitadel-4-license
                deb:
                  depends:
                    - zitadel-4-license
                files:
                  - path: usr/bin/zitadel
                    source: usr/bin/zitadel-dev
                name: zitadel-4-dev
            url: https://github.com/zitadel/zitadel
            version: 4.20.6
      paths:
        - type: file
          path: ${source.dir}/patch/drop-unlicensed-ailerons-font.patch
          uid: 0
          gid: 0
          source: package/main/zitadel/patch/drop-unlicensed-ailerons-font.patch
        - type: file
          path: ${source.dir}/patch/use-maintained-csrf.patch
          uid: 0
          gid: 0
          source: package/main/zitadel/patch/use-maintained-csrf.patch
        - type: file
          path: ${source.dir}/bundle-inventory.cjs
          uid: 0
          gid: 0
          source: package/main/zitadel/scripts/bundle-inventory.cjs
os-release:
  name: Docker Hardened Images (Alpine)
  id: alpine
  version-id: "3.24"
  pretty-name: Docker Hardened Images/Alpine Linux v3.24
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
