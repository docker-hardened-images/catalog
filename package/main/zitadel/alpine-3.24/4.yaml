          - url: https://github.com/protocolbuffers/protobuf-javascript/releases/download/v4.0.2/protobuf-javascript-4.0.2-linux-aarch_64.zip
            checksum: sha256:5c0242143a99d2ca1f84453ada97bfb156fda2b7bdad9f8ca01aa8c40b681499
