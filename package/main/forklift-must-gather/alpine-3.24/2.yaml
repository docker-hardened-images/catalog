# syntax=dhi.io/build:2-alpine3.24

image: dhi.io/pkg-forklift-must-gather
variant: runtime
tags:
  - 2.12.8-alpine3.24
  - 2.12.8-r1-alpine3.24
platforms:
  - linux/amd64
  - linux/arm64
dates:
  release: "2024-09-20"
vars:
  COMMIT_SHA: e8dadb705f0cd91977ae0e9ca69fa821e82a1dca
  PACKAGE_NAME: forklift-must-gather
  REL: "1"
  SEMVER_MAJOR_MINOR_VERSION: "2.12"
  SEMVER_MAJOR_VERSION: "2"
  SEMVER_VERSION: 2.12.8
  VERSION: 2.12.8
contents:
  repositories:
    - https://dhi.io/apk/alpine/v3.24/main
    - https://dhi.io/apk/alpine/v3.23/main
    - https://dl-cdn.alpinelinux.org/alpine/v3.24/main
    - https://dl-cdn.alpinelinux.org/alpine/v3.24/community
  keyring:
    - https://dhi.io/keyring/dhi-apk@docker-0F81AD7700D99184.rsa.pub
  packages:
    - alpine-baselayout-data
  builds:
    - name: forklift-must-gather
      work-dir: ${source.dir}/forklift-must-gather
      contents:
        packages:
          - busybox
          - bash
        files:
          - url: git+https://github.com/kubev2v/forklift-must-gather.git#e8dadb705f0cd91977ae0e9ca69fa821e82a1dca
            checksum: e8dadb705f0cd91977ae0e9ca69fa821e82a1dca
            path: ${source.dir}/forklift-must-gather
            spdx:
              name: forklift-must-gather
              version: 2.12.8
              packages:
                - name: forklift-must-gather
                  purl: pkg:github/kubev2v/forklift-must-gather@e8dadb705f0cd91977ae0e9ca69fa821e82a1dca
                  license: Apache-2.0
            uid: 0
            gid: 0
      pipeline:
        - name: stage the archive in a temp directory
          uses: patch@v1
          with:
            options: -p1
            patch: ${source.dir}/patch/archive-path-mktemp.patch
        - name: verify release version pin
          runs: |
            set -eux -o pipefail

            grep -qxF 'VERSION=2.12.8' build/release.conf
        - name: verify script set and syntax
          runs: |
            set -eux -o pipefail

            [ "$(ls collection-scripts | wc -l)" -eq 12 ]
            for s in gather gather_crs gather_logs gather_metrics gather_metrics_dump targeted targeted_crs targeted_logs common.sh pwait; do
              bash -n "collection-scripts/$s"
            done
            PATH="$PWD/collection-scripts:$PATH" bash -c 'source common.sh && get_log_collection_args && source pwait'
        - name: stage collection scripts
          runs: |
            set -eux -o pipefail

            for s in gather gather_crs gather_logs gather_metrics gather_metrics_dump targeted targeted_crs targeted_logs common.sh; do
              install -D -m 0755 "collection-scripts/$s" '${target.dir}/usr/bin/'"$s"
            done
            install -D -m 0644 collection-scripts/pwait '${target.dir}/usr/bin/pwait'
            for f in _metrics_chart_template_part_1.html _metrics_chart_template_part_2.html; do
              install -D -m 0644 "collection-scripts/$f" '${target.dir}/usr/bin/'"$f"
            done
        - uses: dhi/build-pkg:0
          with:
            depends:
              - bash
              - coreutils
              - findutils
              - gawk
              - grep
              - gzip
              - jq
              - tar
            description: Forklift must-gather diagnostics collection scripts for KubeVirt VM migration support bundles
            files:
              - usr/bin/gather
              - usr/bin/gather_crs
              - usr/bin/gather_logs
              - usr/bin/gather_metrics
              - usr/bin/gather_metrics_dump
              - usr/bin/targeted
              - usr/bin/targeted_crs
              - usr/bin/targeted_logs
              - usr/bin/common.sh
              - usr/bin/pwait
              - usr/bin/_metrics_chart_template_part_1.html
              - usr/bin/_metrics_chart_template_part_2.html
            license: Apache-2.0
            name: forklift-must-gather
            rel: 1
            url: https://github.com/kubev2v/forklift-must-gather
            version: 2.12.8
      paths:
        - type: file
          path: ${source.dir}/patch/archive-path-mktemp.patch
          uid: 0
          gid: 0
          source: package/main/forklift-must-gather/patch/archive-path-mktemp.patch
os-release:
  name: Docker Hardened Images (Alpine)
  id: alpine
  version-id: "3.24"
  pretty-name: Docker Hardened Images/Alpine Linux v3.24
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
