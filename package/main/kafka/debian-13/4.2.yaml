# syntax=dhi.io/build:2-debian13

image: dhi.io/pkg-kafka
variant: runtime
tags:
  - 4.2.2
  - 4.2.2-r10
  - 4.2.2-debian13
  - 4.2.2-r10-debian13
platforms:
  - linux/amd64
  - linux/arm64
dates:
  release: "2026-02-17"
vars:
  COMMIT_SHA: c5e942859576203e1b00260070fe6241b64db251
  GRADLE_PACKAGE: gradle-9
  GRADLE_VERSION: 9.8.2-0
  JDK_MAJOR_VERSION: "21"
  JDK_VERSION: 1:21.0.13+9-1
  PACKAGE_NAME: kafka-4.2
  REL: "10"
  SCALA_VERSION: "2.13"
  SEMVER_MAJOR_MINOR_VERSION: "4.2"
  SEMVER_MAJOR_VERSION: "4"
  SEMVER_VERSION: 4.2.2
  VERSION: 4.2.2
contents:
  packages:
    - base-files
  builds:
    - name: kafka-4.2
      work-dir: ${source.dir}/kafka
      environment:
        JAVA_HOME: /usr/lib/jvm/temurin-21
      caches:
        - path: /root/.gradle/caches
        - path: /root/.gradle/wrapper
      contents:
        repositories:
          - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
        keyring:
          - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
        packages:
          - bash
          - coreutils
          - findutils
          - gzip
          - patch
          - sed
          - tar
          - eclipse-temurin-21-jdk=1:21.0.13+9-1
          - eclipse-temurin-21-jdk-oci-config=1:21.0.13+9-1
          - gradle-9=9.8.2-0
        files:
          - url: git+https://github.com/apache/kafka.git#4.2.2
            checksum: c5e942859576203e1b00260070fe6241b64db251
            path: ${source.dir}/kafka
            spdx:
              name: kafka
              version: 4.2.2
              packages:
                - name: kafka
                  purl: pkg:github/apache/kafka@4.2.2
                  license: Apache-2.0
            uid: 0
            gid: 0
      pipeline:
        - name: apply jline remote-telnet cve patch (4.2 line)
          uses: git/patch@v1
          with:
            patch: ${source.dir}/patch/jline-remote-telnet-cve-4.2.patch
        - name: apply gradle 9.5 projectdependency compatibility patch
          uses: git/patch@v1
          with:
            patch: ${source.dir}/patch/gradle-9.5-projectdependency-4.2.patch
        - name: configure gradle mirror
          runs: |
            set -eux -o pipefail

            mkdir -p /root/.gradle
            {
              echo "def kafkaMinor = \"4.2\""
              cat << 'EOF'
            def mavenCentralMirror = uri("https://maven-central.storage-download.googleapis.com/maven2/")

            def isMaven = { repo ->
                repo instanceof org.gradle.api.artifacts.repositories.MavenArtifactRepository
            }
            def urlOf = { repo -> repo.url.toString() }

            // Apache Central only — safe for pluginManagement (keeps gradlePluginPortal).
            def mirrorApacheCentral = { repo ->
                if (!isMaven(repo)) {
                    return
                }
                def url = urlOf(repo)
                if (url == "https://repo.maven.apache.org/maven2/" ||
                        url.startsWith("https://repo1.maven.org/maven2")) {
                    repo.setUrl(mavenCentralMirror)
                }
            }

            // Apache Central + the portal's Maven proxy. Use on project/dependency
            // repos so api-checker asm/slf4j do not 429 via plugins.gradle.org/m2 →
            // repo.maven.apache.org. Never apply this to pluginManagement or the
            // portal stops resolving real Gradle plugins (ben-manes.versions).
            def mirrorApacheAndPortalM2 = { repo ->
                if (!isMaven(repo)) {
                    return
                }
                def url = urlOf(repo)
                if (url == "https://repo.maven.apache.org/maven2/" ||
                        url.startsWith("https://repo1.maven.org/maven2") ||
                        url.startsWith("https://plugins.gradle.org/m2")) {
                    repo.setUrl(mavenCentralMirror)
                }
            }

            def ensurePluginRepos = { settings ->
                // Kafka settings.gradle replaces pluginManagement repos after
                // beforeSettings; re-assert GCS then portal so plugin markers
                // still hit the portal while Maven artifacts prefer GCS.
                settings.pluginManagement.repositories.clear()
                settings.pluginManagement.repositories.maven {
                    url = mavenCentralMirror
                }
                settings.pluginManagement.repositories.gradlePluginPortal()
            }

            settingsEvaluated { settings ->
                ensurePluginRepos(settings)
                settings.pluginManagement.repositories.configureEach(mirrorApacheCentral)
                settings.dependencyResolutionManagement.repositories.configureEach(mirrorApacheAndPortalM2)
                settings.dependencyResolutionManagement.repositories.whenObjectAdded(mirrorApacheAndPortalM2)
            }

            allprojects {
                buildscript.repositories.configureEach(mirrorApacheAndPortalM2)
                buildscript.repositories.whenObjectAdded(mirrorApacheAndPortalM2)
                repositories.configureEach(mirrorApacheAndPortalM2)
                repositories.whenObjectAdded(mirrorApacheAndPortalM2)
            }


            allprojects {
                configurations.all {
                    resolutionStrategy.eachDependency { details ->
                        def grp = details.requested.group
                        def name = details.requested.name
                        def ver = details.requested.version
                        if (grp == "org.apache.logging.log4j" &&
                                (name == "log4j-api" || name == "log4j-core" ||
                                 name == "log4j-1.2-api" || name == "log4j-slf4j-impl") &&
                                (ver == "2.25.3" || ver == "2.25.4" || ver == "2.25.5")) {
                            details.useVersion("2.25.5")
                            details.because("CVE remediation: CVE-2026-49844")
                        }
                        if (grp == "com.fasterxml.jackson.core" &&
                                (name == "jackson-databind" || name == "jackson-core") &&
                                (ver == "2.19.4" || ver == "2.21.2" || ver == "2.21.6" || ver == "2.21.7")) {
                            details.useVersion("2.21.8")
                            details.because("CVE remediation: GHSA-72hv-8253-57qq, GHSA-r7wm-3cxj-wff9, GHSA-mhm7-754m-9p8w, CVE-2026-19032, CVE-2026-54512, CVE-2026-54513, CVE-2026-54514, CVE-2026-54515, CVE-2026-54516, CVE-2026-54517, CVE-2026-54518, CVE-2026-59888, CVE-2026-59889, CVE-2026-68497, CVE-2026-68498 (GHSA-649p-m576-vr99), CVE-2026-77310, CVE-2026-83557, CVE-2026-89407, CVE-2026-89425, CVE-2026-91776, CVE-2026-91777, CVE-2026-110879")
                        }
                        if (grp == "com.fasterxml.jackson.core" && name == "jackson-annotations" &&
                                (ver == "2.19.4" || ver == "2.21")) {
                            details.useVersion("2.21")
                            details.because("align jackson-annotations with jackson-databind 2.21.8 for MessageGenerator")
                        }
                        if (grp.startsWith("org.eclipse.jetty") && name.startsWith("jetty-") &&
                                (ver == "12.0.25" || ver == "12.0.34" || ver == "12.0.37" || ver == "12.0.38")) {
                            details.useVersion("12.0.39")
                            details.because("CVE remediation: CVE-2026-19203, CVE-2026-10050, CVE-2026-10051, CVE-2026-6790, CVE-2026-8384, CVE-2026-18660 (GHSA-7wfj-j486-mxrf), CVE-2026-76184 (GHSA-qfr2-43g5-g768), CVE-2026-77711 (GHSA-r2c5-3p8g-wpvw)")
                        }
                        if (grp == "org.codehaus.plexus" && name == "plexus-utils" &&
                                (ver == "3.5.1" || ver == "3.6.1")) {
                            details.useVersion("3.6.1")
                            details.because("CVE remediation: CVE-2025-67030")
                        }
                        if (grp == "at.yawk.lz4" && name == "lz4-java" &&
                                (ver == "1.10.1" || ver == "1.10.2" || ver == "1.11.1" || ver == "1.11.2" ||
                                 ver == "1.11.3")) {
                            details.useVersion("1.11.4")
                            details.because("CVE remediation: CVE-2026-59949, CVE-2026-106449, CVE-2026-106450, CVE-2026-106451, CVE-2026-106452, CVE-2026-106453")
                        }
                        if (grp == "com.github.luben" && name == "zstd-jni" &&
                                (ver == "1.5.6-4" || ver == "1.5.6-10" || ver == "1.5.7-17" || ver == "1.5.7-20")) {
                            details.useVersion("1.5.7-25")
                            details.because("CVE remediation: CVE-2026-87795, CVE-2026-87823, CVE-2026-87824, CVE-2026-87825, CVE-2026-87877, CVE-2026-89045, CVE-2026-89046, CVE-2026-90560, GHSA-8w96-r9r5-4j3r, JFrog Xray advisories 1149195 and 1149197")
                        }
                        // 1.1.10.11 is what Kafka 4.3.2 requests, so 4.3 passes through unforced.
                        if (grp == "org.xerial.snappy" && name == "snappy-java" &&
                                (ver == "1.1.10.5" || ver == "1.1.10.7" || ver == "1.1.10.9")) {
                            details.useVersion("1.1.10.11")
                            details.because("CVE remediation: CVE-2026-93451, CVE-2026-108106, CVE-2026-116590, JFrog Xray advisories 1099938 and 1099939")
                        }
                        // Kafka 4.4 only: force the jline-reader stack to 3.30.17. 4.1-4.3 get
                        // jline 4.4.3 from their remote-telnet patches instead.
                        if (kafkaMinor == "4.4" &&
                                grp == "org.jline" && (name == "jline" || name.startsWith("jline-")) &&
                                (ver == "3.30.4" || ver == "3.30.16" || ver == "3.30.17")) {
                            details.useVersion("3.30.17")
                            details.because("CVE remediation: jline remote-telnet / reader stack (CVE-2026-56740, CVE-2026-56741, CVE-2026-77420, CVE-2026-77421, CVE-2026-77422, CVE-2026-77423); Kafka 4.4 moved off the full jline bundle to jline-reader")
                        }
                    }
                }
            }
            EOF
            } > /root/.gradle/init.gradle
        - name: configure settings plugin mirror
          runs: |
            set -eux -o pipefail

            mkdir -p /root/.gradle/init.d
            cat > /root/.gradle/init.d/settings-plugins.gradle << 'EOF'
            beforeSettings { settings ->
                settings.pluginManagement.repositories.clear()
                settings.pluginManagement.repositories.maven {
                    url = uri("https://maven-central.storage-download.googleapis.com/maven2/")
                }
                settings.pluginManagement.repositories.gradlePluginPortal()
            }
            EOF
        - name: build kafka distribution
          privileged: true
          runs: |
            set -eux -o pipefail

            export GRADLE_HOME="/usr/share/java/gradle"
            export PATH="${GRADLE_HOME}/bin:${JAVA_HOME}/bin:${PATH}"

            gradle clean releaseTarGz \
              -PscalaVersion=2.13 \
              --no-daemon \
              --console=plain \
              --warning-mode=summary
        - name: extract distribution
          runs: |
            set -eux -o pipefail

            mkdir -p ${target.dir}/usr/share/kafka

            tar -xzf "core/build/distributions/kafka_2.13-4.2.2.tgz" \
              --strip-components=1 \
              -C ${target.dir}/usr/share/kafka
        - name: verify forced dependency versions
          runs: |
            set -eux -o pipefail

            libs="${target.dir}/usr/share/kafka/libs"
            expect() {
              found="$(find "${libs}" -maxdepth 1 -name "$1-[0-9]*.jar" -printf '%f\n')"
              test -n "${found}"
              test "$(printf '%s\n' "${found}" | wc -l)" -eq 1
              version="${found#"$1-"}"
              version="${version%.jar}"
              test "$(printf '%s\n%s\n' "$2" "${version}" | sort -V | head -n 1)" = "$2"
              test -z "$(find "${libs}" -name "$3" ! -name "*-${version}.jar" ! -name "*-${version}-*.jar")"
            }
            forbid() {
              test -z "$(find "${libs}" -name "$1")"
            }
            dups="$(find "${libs}" -name '*.jar' -printf '%f\n' | sed -E 's/-[0-9][0-9A-Za-z.]*(-[A-Za-z0-9_]+)*\.jar$//' | sort | uniq -d | sed '/^metrics-core$/d')"
            test -z "${dups}"

            expect plexus-utils 3.6.1 'plexus-utils-*.jar'
            expect lz4-java 1.11.4 'lz4-java-*.jar'
            expect zstd-jni 1.5.7-25 'zstd-jni-*.jar'
            expect snappy-java 1.1.10.11 'snappy-java-*.jar'
            expect slf4j-api 1.7.36 'slf4j-*.jar'
            expect jaxb-api 2.3.1 'jaxb-api-*.jar'
            expect jackson-databind 2.21.8 'jackson-databind-*.jar'
            expect jackson-core 2.21.8 'jackson-core-*.jar'
            expect jackson-annotations 2.21 'jackson-annotations-*.jar'
            jackson="$(find "${libs}" -maxdepth 1 -name 'jackson-databind-[0-9]*.jar' -printf '%f\n' | sed -E 's/^jackson-databind-//; s/\.jar$//')"
            test -z "$(find "${libs}" -name 'jackson-*.jar' ! -name 'jackson-annotations-*' ! -name "*-${jackson}.jar")"
            expect snakeyaml 2.5 'snakeyaml-*.jar'
            expect jetty-security 12.0.39 'jetty-*.jar'
            expect log4j-core 2.25.5 'log4j-*.jar'
            jline="$(find "${libs}" -maxdepth 1 -name 'jline-*.jar' -printf '%f\n' | sed -E 's/^jline(-[a-z]+)*-//; s/\.jar$//' | sort -u)"
            test -n "${jline}"
            test "$(printf '%s\n' "${jline}" | wc -l)" -eq 1
            if [ "4.2" = "4.4" ]; then
              test "${jline}" = 3.30.17
            else
              test "$(printf '%s\n%s\n' 4.4.3 "${jline}" | sort -V | head -n 1)" = 4.4.3
            fi
            forbid 'netty-*.jar'
            forbid 'zookeeper*.jar'
        - name: install docker server properties
          runs: |
            set -eux -o pipefail

            cp docker/server.properties \
              ${target.dir}/usr/share/kafka/config/server.properties
        - uses: dhi/build-pkg:0
          with:
            depends:
              - bash
            description: Apache Kafka distributed event streaming platform
            files:
              - usr/share/kafka
            license: Apache-2.0
            name: kafka-4.2
            rel: 10
            url: https://kafka.apache.org/
            version: 4.2.2
      paths:
        - type: file
          path: ${source.dir}/patch/fips-sha256-log-cleaner.patch
          uid: 0
          gid: 0
          source: package/main/kafka/patch/fips-sha256-log-cleaner.patch
        - type: file
          path: ${source.dir}/patch/jline-remote-telnet-cve-4.2.patch
          uid: 0
          gid: 0
          source: package/main/kafka/patch/jline-remote-telnet-cve-4.2.patch
        - type: file
          path: ${source.dir}/patch/gradle-9.5-projectdependency-4.2.patch
          uid: 0
          gid: 0
          source: package/main/kafka/patch/gradle-9.5-projectdependency-4.2.patch
os-release:
  name: Docker Hardened Images (Debian)
  id: debian
  version-id: "13"
  version-codename: trixie
  pretty-name: Docker Hardened Images/Debian GNU/Linux 13 (trixie)
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
