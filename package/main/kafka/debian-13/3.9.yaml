# syntax=dhi.io/build:2-debian13

image: dhi.io/pkg-kafka
variant: runtime
tags:
  - 3.9.2
  - 3.9.2-r1
  - 3.9.2-debian13
  - 3.9.2-r1-debian13
platforms:
  - linux/amd64
  - linux/arm64
dates:
  release: "2024-11-06"
vars:
  COMMIT_SHA: 5e9866f43ab8e7e41ef39e5584ac50019381328d
  GRADLE_PACKAGE: gradle-8
  GRADLE_VERSION: 8.14.5-1
  JDK_MAJOR_VERSION: "21"
  JDK_VERSION: 1:21.0.12.1+1-4
  PACKAGE_NAME: kafka-3.9
  REL: "1"
  SCALA_VERSION: "2.13"
  SEMVER_MAJOR_MINOR_VERSION: "3.9"
  SEMVER_MAJOR_VERSION: "3"
  SEMVER_VERSION: 3.9.2
  VERSION: 3.9.2
contents:
  packages:
    - base-files
  builds:
    - name: kafka-3.9
      work-dir: ${source.dir}/kafka
      environment:
        JAVA_HOME: /usr/lib/jvm/temurin-21
      caches:
        - path: /root/.gradle/caches
        - path: /root/.gradle/wrapper
      contents:
        repositories:
          - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
        keyring:
          - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
        packages:
          - bash
          - coreutils
          - findutils
          - gzip
          - patch
          - sed
          - tar
          - eclipse-temurin-21-jdk=1:21.0.12.1+1-4
          - eclipse-temurin-21-jdk-oci-config=1:21.0.12.1+1-4
          - gradle-8=8.14.5-1
        files:
          - url: git+https://github.com/apache/kafka.git#3.9.2
            checksum: 5e9866f43ab8e7e41ef39e5584ac50019381328d
            path: ${source.dir}/kafka
            spdx:
              name: kafka
              version: 3.9.2
              packages:
                - name: kafka
                  purl: pkg:github/apache/kafka@3.9.2
                  license: Apache-2.0
            uid: 0
            gid: 0
      pipeline:
        - name: configure gradle mirror
          runs: |
            set -eux -o pipefail

            mkdir -p /root/.gradle
            cat > /root/.gradle/init.gradle << 'EOF'
            def mavenCentralMirror = uri("https://maven-central.storage-download.googleapis.com/maven2/")

            def mirrorMavenCentral = { repo ->
                if (repo instanceof org.gradle.api.artifacts.repositories.MavenArtifactRepository &&
                    repo.url.toString() == "https://repo.maven.apache.org/maven2/") {
                    repo.setUrl(mavenCentralMirror)
                }
            }

            settingsEvaluated { settings ->
                settings.pluginManagement.repositories.configureEach(mirrorMavenCentral)
                settings.dependencyResolutionManagement.repositories.configureEach(mirrorMavenCentral)
            }

            allprojects {
                buildscript.repositories.configureEach(mirrorMavenCentral)
                repositories.configureEach(mirrorMavenCentral)
            }

            allprojects {
                configurations.all {
                    resolutionStrategy.eachDependency { details ->
                        def grp = details.requested.group
                        def name = details.requested.name
                        def ver = details.requested.version
                        if (grp == "org.apache.logging.log4j" &&
                                (name == "log4j-api" || name == "log4j-core" ||
                                 name == "log4j-1.2-api" || name == "log4j-slf4j-impl") &&
                                (ver == "2.25.3" || ver == "2.25.4" || ver == "2.25.5")) {
                            details.useVersion("2.25.5")
                            details.because("CVE remediation: CVE-2026-49844")
                        }
                        if (grp == "com.fasterxml.jackson.core" &&
                                (name == "jackson-databind" || name == "jackson-core") &&
                                (ver == "2.19.4" || ver == "2.21.2" || ver == "2.21.6")) {
                            details.useVersion("2.21.7")
                            details.because("CVE remediation: GHSA-72hv-8253-57qq, GHSA-r7wm-3cxj-wff9, GHSA-mhm7-754m-9p8w, CVE-2026-19032, CVE-2026-54512, CVE-2026-54513, CVE-2026-54514, CVE-2026-54515, CVE-2026-54516, CVE-2026-54517, CVE-2026-54518, CVE-2026-59888, CVE-2026-59889, CVE-2026-68497, CVE-2026-68498 (GHSA-649p-m576-vr99), CVE-2026-77310, CVE-2026-83557, CVE-2026-89407, CVE-2026-89425, CVE-2026-91776, CVE-2026-91777")
                        }
                        if (grp == "com.fasterxml.jackson.core" && name == "jackson-annotations" &&
                                (ver == "2.19.4" || ver == "2.21")) {
                            details.useVersion("2.21")
                            details.because("align jackson-annotations with jackson-databind 2.21.7 for MessageGenerator")
                        }
                        if (grp.startsWith("org.eclipse.jetty") && name.startsWith("jetty-") &&
                                (ver == "12.0.25" || ver == "12.0.34" || ver == "12.0.37" || ver == "12.0.38")) {
                            details.useVersion("12.0.38")
                            details.because("CVE remediation: CVE-2026-19203, CVE-2026-10050, CVE-2026-10051, CVE-2026-6790, CVE-2026-8384")
                        }
                        if (grp == "org.codehaus.plexus" && name == "plexus-utils" &&
                                (ver == "3.5.1" || ver == "3.6.1")) {
                            details.useVersion("3.6.1")
                            details.because("CVE remediation: CVE-2025-67030")
                        }
                        if (grp == "at.yawk.lz4" && name == "lz4-java" &&
                                (ver == "1.10.1" || ver == "1.10.2" || ver == "1.11.1" || ver == "1.11.2" ||
                                 ver == "1.11.3")) {
                            details.useVersion("1.11.4")
                            details.because("CVE remediation: CVE-2026-59949, CVE-2026-106449, CVE-2026-106450, CVE-2026-106451, CVE-2026-106452, CVE-2026-106453")
                        }
                        if (grp == "com.github.luben" && name == "zstd-jni" &&
                                (ver == "1.5.6-4" || ver == "1.5.6-10" || ver == "1.5.7-20")) {
                            details.useVersion("1.5.7-20")
                            details.because("CVE remediation: CVE-2026-87795, CVE-2026-87823, CVE-2026-87824, CVE-2026-87825, CVE-2026-87877, CVE-2026-89045, CVE-2026-89046, CVE-2026-90560, GHSA-8w96-r9r5-4j3r")
                        }
                    }
                }
            }
            EOF
        - name: configure settings plugin mirror
          runs: |
            set -eux -o pipefail

            mkdir -p /root/.gradle/init.d
            cat > /root/.gradle/init.d/settings-plugins.gradle << 'EOF'
            beforeSettings { settings ->
                settings.pluginManagement.repositories {
                    maven { url = "https://maven-central.storage-download.googleapis.com/maven2/" }
                    gradlePluginPortal()
                }
            }
            EOF
        - name: configure kafka 3.9 dependency overrides
          runs: |
            set -eux -o pipefail

            mkdir -p /root/.gradle/init.d
            cat > /root/.gradle/init.d/kafka-3.9-overrides.gradle << 'EOF'
            allprojects {
                configurations.all {
                    resolutionStrategy.eachDependency { details ->
                        def grp = details.requested.group
                        def name = details.requested.name
                        def ver = details.requested.version
                        if (grp.startsWith("com.fasterxml.jackson") &&
                                (ver == "2.16.2" || ver == "2.15.2" || ver == "2.18.11")) {
                            details.useVersion("2.18.11")
                            details.because("CVE remediation: CVE-2026-18401 (GHSA-72hv-8253-57qq), GHSA-r7wm-3cxj-wff9, CVE-2026-19032, CVE-2026-54512, CVE-2026-54513, CVE-2026-54514, CVE-2026-54515, CVE-2026-59888, CVE-2026-68497, CVE-2026-68498 (GHSA-649p-m576-vr99), CVE-2026-77310, CVE-2026-83557, CVE-2026-89425, CVE-2026-91776, CVE-2026-91777")
                        }
                        if (grp.startsWith("org.eclipse.jetty") && name.startsWith("jetty-") &&
                                (ver == "9.4.57.v20241219" || ver == "9.4.58.v20250814")) {
                            details.useVersion("9.4.58.v20250814")
                            details.because("newest published 9.4 release, matching the upstream 3.9 branch pin")
                        }
                        if (grp == "org.apache.zookeeper" && name.startsWith("zookeeper") &&
                                (ver == "3.8.4" || ver == "3.8.7")) {
                            details.useVersion("3.8.7")
                            details.because("CVE remediation: CVE-2026-24281, CVE-2026-24308; 3.8.7 adds the quorum TLS hostname check in FIPS mode and the setWatches and deleteContainer ACL checks")
                        }
                        if (grp == "io.netty" && name.startsWith("netty-") &&
                                (ver == "4.1.125.Final" || ver == "4.1.137.Final")) {
                            details.useVersion("4.1.137.Final")
                            details.because("CVE remediation: CVE-2026-42583, CVE-2026-44249, CVE-2026-45416, CVE-2026-45536, CVE-2026-50010, CVE-2026-59901, CVE-2026-62243, CVE-2026-75595, CVE-2026-75596")
                        }
                        if (grp == "org.jline" && name == "jline" &&
                                (ver == "3.25.1" || ver == "3.30.17")) {
                            details.useVersion("3.30.17")
                            details.because("CVE remediation: CVE-2026-56740, CVE-2026-56741, CVE-2026-77420, CVE-2026-77421, CVE-2026-77422, CVE-2026-77423, GHSA-c87g-867h-cqr6, GHSA-6r3w-6jpj-x5w6, GHSA-7h86-pjwh-gpqj, GHSA-m935-wqpj-pvp3")
                        }
                        if (grp == "org.slf4j" && name == "slf4j-api" && ver == "2.0.13") {
                            details.useVersion("1.7.36")
                            details.because("ZooKeeper 3.8.7 requests the SLF4J 2 API; Kafka 3.9 binds SLF4J 1.7 through reload4j")
                        }
                        if (grp == "javax.xml.bind" && name == "jaxb-api" && ver == "2.2.12") {
                            details.useVersion("2.3.1")
                            details.because("jackson-module-jaxb-annotations 2.18 requests an older JAXB API than the 2.3.1 Kafka 3.9 declares")
                        }
                    }
                }
            }
            EOF
        - name: build kafka distribution
          privileged: true
          runs: |
            set -eux -o pipefail

            export GRADLE_HOME="/usr/share/java/gradle"
            export PATH="${GRADLE_HOME}/bin:${JAVA_HOME}/bin:${PATH}"

            gradle clean releaseTarGz \
              -PscalaVersion=2.13 \
              --no-daemon \
              --console=plain \
              --warning-mode=summary
        - name: extract distribution
          runs: |
            set -eux -o pipefail

            mkdir -p ${target.dir}/usr/share/kafka

            tar -xzf "core/build/distributions/kafka_2.13-3.9.2.tgz" \
              --strip-components=1 \
              -C ${target.dir}/usr/share/kafka
        - name: verify forced dependency versions for 3.9
          runs: |
            set -eux -o pipefail

            libs="${target.dir}/usr/share/kafka/libs"
            expect() {
              found="$(find "${libs}" -maxdepth 1 -name "$1-[0-9]*.jar" -printf '%f\n')"
              test -n "${found}"
              test "$(printf '%s\n' "${found}" | wc -l)" -eq 1
              version="${found#"$1-"}"
              version="${version%.jar}"
              test "$(printf '%s\n%s\n' "$2" "${version}" | sort -V | head -n 1)" = "$2"
              test -z "$(find "${libs}" -name "$3" ! -name "*-${version}.jar" ! -name "*-${version}-*.jar")"
            }
            forbid() {
              test -z "$(find "${libs}" -name "$1")"
            }
            dups="$(find "${libs}" -name '*.jar' -printf '%f\n' | sed -E 's/-[0-9][0-9A-Za-z.]*(-[A-Za-z0-9_]+)*\.jar$//' | sort | uniq -d | sed '/^metrics-core$/d')"
            test -z "${dups}"

            expect plexus-utils 3.6.1 'plexus-utils-*.jar'
            expect lz4-java 1.11.4 'lz4-java-*.jar'
            expect zstd-jni 1.5.7-20 'zstd-jni-*.jar'
            expect slf4j-api 1.7.36 'slf4j-*.jar'
            expect jaxb-api 2.3.1 'jaxb-api-*.jar'
            expect jackson-databind 2.18.11 'jackson-*.jar'
            expect jackson-core 2.18.11 'jackson-core-*.jar'
            expect jackson-annotations 2.18.11 'jackson-annotations-*.jar'
            expect jetty-security 9.4.58.v20250814 'jetty-*.jar'
            expect zookeeper 3.8.7 'zookeeper*.jar'
            expect commons-io 2.17.0 'commons-io-*.jar'
            forbid 'jakarta.xml.bind-api-*.jar'
            expect netty-common 4.1.137.Final 'netty-*.jar'
            expect jline 3.30.17 'jline-*.jar'
            forbid 'log4j-*.jar'
        - name: stage kraft server properties
          runs: |
            set -eux -o pipefail

            cp config/kraft/server.properties docker/server.properties

            sed -i \
              -e 's|^advertised\.listeners=PLAINTEXT://localhost:9092,CONTROLLER://localhost:9093$|advertised.listeners=PLAINTEXT://localhost:9092|' \
              docker/server.properties

            test -n "$(sed -n '\|^advertised\.listeners=PLAINTEXT://localhost:9092$|p' docker/server.properties)"
        - name: install docker server properties
          runs: |
            set -eux -o pipefail

            cp docker/server.properties \
              ${target.dir}/usr/share/kafka/config/server.properties
        - uses: dhi/build-pkg:0
          with:
            depends:
              - bash
            description: Apache Kafka distributed event streaming platform
            files:
              - usr/share/kafka
            license: Apache-2.0
            name: kafka-3.9
            rel: 1
            url: https://kafka.apache.org/
            version: 3.9.2
      paths:
        - type: file
          path: ${source.dir}/patch/fips-sha256-log-cleaner.patch
          uid: 0
          gid: 0
          source: package/main/kafka/patch/fips-sha256-log-cleaner.patch
os-release:
  name: Docker Hardened Images (Debian)
  id: debian
  version-id: "13"
  version-codename: trixie
  pretty-name: Docker Hardened Images/Debian GNU/Linux 13 (trixie)
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
