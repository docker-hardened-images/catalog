          - nodejs-24=24.22.3-0
          - eclipse-temurin-21-jdk=1:21.0.13.1+2-0
        files:
          - url: git+https://github.com/jenkinsci/jenkins.git#jenkins-2.580.3
            checksum: 134a68096eb24391de1d12108606f268c7a95645
            path: ${source.dir}/jenkins
            spdx:
              name: jenkins
              version: 2.580.3
              packages:
                - name: jenkins
                  purl: pkg:dhi/jenkins@2.580.3
                  license: MIT
            uid: 0
            gid: 0
          - url: git+https://github.com/jenkinsci/docker.git#03947efb28d83facbbd5bcb94e71b41d536c29b9
            checksum: 03947efb28d83facbbd5bcb94e71b41d536c29b9
            path: ${source.dir}/docker-builds
            uid: 0
            gid: 0
      pipeline:
        - uses: mvn/mirror@v1
        - name: require maven mirror settings
          runs: |
            set -eux -o pipefail

            test -s /root/.m2/settings.xml
        - name: remove unavailable maven extensions
          work-dir: ${source.dir}/jenkins
          runs: |
            set -eux -o pipefail

            ext_xml=".mvn/extensions.xml"
            if [ -f "${ext_xml}" ]; then
              xmlstarlet ed -L \
                -d "//*[local-name()='extension'][*[local-name()='artifactId']='git-changelist-maven-extension']" \
                -d "//*[local-name()='extension'][*[local-name()='artifactId']='develocity-maven-extension']" \
                "${ext_xml}"
            fi
        - name: patch maven dependencies
          uses: mvn/patch@v1
          with:
            dependencies: ${source.dir}/patch/mvn-dependencies.json
            dependencies-key: dependencyManagement.dependencies
            downgrade: false
            mvn-root: ${source.dir}/jenkins/bom
        - name: patch maven properties
          uses: mvn/patch@v1
          with:
            downgrade: false
            mvn-root: ${source.dir}/jenkins
            properties: ${source.dir}/patch/mvn-properties.json
        - name: build
          work-dir: ${source.dir}/jenkins
          privileged: true
          secrets:
            - id: maven_user
              env: MAVEN_USER
            - id: maven_password
              env: MAVEN_PASSWORD
          runs: |
            set -eux -o pipefail

            mvn clean install -DskipTests -Dmaven.test.skip=true -Dspotless.check.skip=true
        - name: install
          work-dir: ${source.dir}/jenkins
          runs: |
            set -eux -o pipefail

            mkdir -p "${target.dir}/usr/share/jenkins"
            cp war/target/jenkins.war "${target.dir}/usr/share/jenkins/jenkins.war"
        - name: copy-entrypoint-scripts
          work-dir: ${source.dir}/docker-builds
          runs: |
            set -eux -o pipefail

            mkdir -p "${target.dir}/usr/share/jenkins/bin"
            mkdir -p "${target.dir}/usr/share/jenkins/ref/init.groovy.d"

            cp jenkins.sh "${target.dir}/usr/share/jenkins/bin/jenkins.sh"
            cp jenkins-support "${target.dir}/usr/share/jenkins/bin/jenkins-support"
        - uses: dhi/build-pkg:0
          with:
            apk:
              depends:
                - ttf-dejavu
            deb:
              depends:
                - fonts-dejavu-core
            depends:
              - bash
              - coreutils
              - eclipse-temurin-21-jre
              - fontconfig
            description: Jenkins open-source automation server
            files:
              - usr
            license: MIT
            name: jenkins-2.580
            rel: 0
            url: https://www.jenkins.io/
            version: 2.580.3
        - name: publish legacy package name
          uses: dhi/build-pkg:0
          with:
            apk:
              depends:
                - ttf-dejavu
            deb:
              depends:
                - fonts-dejavu-core
            depends:
              - bash
              - coreutils
              - eclipse-temurin-21-jre
              - fontconfig
            description: Jenkins open-source automation server
            files:
              - usr
            license: MIT
            name: jenkins
            rel: 0
            url: https://www.jenkins.io/
            version: 2.580.3
      paths:
        - type: file
          path: ${source.dir}/patch/mvn-dependencies.json
          uid: 0
          gid: 0
          source: package/main/jenkins/patch/mvn-dependencies.json
        - type: file
          path: ${source.dir}/patch/mvn-properties.json
          uid: 0
          gid: 0
          source: package/main/jenkins/patch/mvn-properties.json
