# syntax=dhi.io/build:2-debian13

image: dhi.io/pkg-jenkins
variant: runtime
tags:
  - 2.580.2
  - 2.580.2-r0
  - 2.580.2-debian13
  - 2.580.2-r0-debian13
platforms:
  - linux/amd64
  - linux/arm64
dates:
  release: "2026-06-10"
vars:
  COMMIT_SHA: ea3f958268fe87ed86a5d1c2d90c5a99426b97ce
  DOCKER_REPO_COMMIT_SHA: e3a0f666c584a47fc5b372ae88b203b7c77c2617
  DOCKER_REPO_VERSION: 2.580.2
  JDK_MAJOR_VERSION: "21"
  JDK_VERSION: 1:21.0.13+9-0
  MAVEN_VERSION: 3.10.0
  PACKAGE_NAME: jenkins
  REL: "0"
  SEMVER_MAJOR_MINOR_VERSION: "2.580"
  SEMVER_MAJOR_VERSION: "2"
  SEMVER_VERSION: 2.580.2
  VERSION: 2.580.2
contents:
  packages:
    - base-files
  builds:
    - name: jenkins
      work-dir: ${source.dir}/jenkins
      environment:
        JAVA_HOME: /usr/lib/jvm/temurin-21
        MAVEN_HOME: /opt/java/apache-maven-3.10.0
      caches:
        - path: /root/.m2/repository
      contents:
        repositories:
          - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
        keyring:
          - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
        packages:
          - bash
          - ca-certificates
          - coreutils
          - findutils
          - git
          - gzip
          - grep
          - sed
          - tar
          - unzip
          - zip
          - curl
          - xmlstarlet
          - eclipse-temurin-21-jdk=1:21.0.13+9-0
        files:
          - url: git+https://github.com/jenkinsci/jenkins.git#jenkins-2.580.2
            checksum: ea3f958268fe87ed86a5d1c2d90c5a99426b97ce
            path: ${source.dir}/jenkins
            spdx:
              name: jenkins
              version: 2.580.2
              packages:
                - name: jenkins
                  purl: pkg:dhi/jenkins@2.580.2
                  license: MIT
            uid: 0
            gid: 0
          - url: git+https://github.com/jenkinsci/docker.git#e3a0f666c584a47fc5b372ae88b203b7c77c2617
            checksum: e3a0f666c584a47fc5b372ae88b203b7c77c2617
            path: ${source.dir}/docker-builds
            uid: 0
            gid: 0
          - url: https://dlcdn.apache.org/maven/maven-3/3.10.0/binaries/apache-maven-3.10.0-bin.tar.gz
            path: ${source.dir}/maven/apache-maven-3.10.0-bin.tar.gz
            spdx:
              name: maven
              version: 3.10.0
              packages:
                - name: maven
                  purl: pkg:generic/apache-maven@3.10.0
                  license: Apache-2.0
            uid: 0
            gid: 0
      pipeline:
        - name: install maven
          runs: |
            set -eux -o pipefail

            mkdir -p /opt/java
            tar -xzf "${source.dir}/maven/apache-maven-3.10.0-bin.tar.gz" -C /opt/java

            mkdir -p /usr/local/bin
            find "/opt/java/apache-maven-3.10.0/bin" -type f -executable -o -type l | while read -r file; do
              filename=$(basename "$file")
              ln -sf "/opt/java/apache-maven-3.10.0/bin/$filename" "/usr/local/bin/$filename"
            done
        - uses: mvn/mirror@v1
        - name: use maven central when mirror credentials are absent
          secrets:
            - id: maven_user
              env: MAVEN_USER
              optional: true
            - id: maven_password
              env: MAVEN_PASSWORD
              optional: true
          runs: |
            set -eux -o pipefail

            if [ -z "${MAVEN_USER:-}" ] || [ -z "${MAVEN_PASSWORD:-}" ]; then
              rm -f /root/.m2/settings.xml
            fi
        - name: remove git-changelist-maven-extension
          work-dir: ${source.dir}/jenkins
          runs: |
            set -eux -o pipefail

            ext_xml=".mvn/extensions.xml"
            if [ -f "${ext_xml}" ]; then
              xmlstarlet ed -L \
                -d "//*[local-name()='extension'][*[local-name()='artifactId']='git-changelist-maven-extension']" \
                "${ext_xml}"
            fi
        - name: patch maven dependencies
          uses: mvn/patch@v1
          with:
            dependencies: ${source.dir}/patch/mvn-dependencies.json
            dependencies-key: dependencyManagement.dependencies
            downgrade: false
            mvn-root: ${source.dir}/jenkins/bom
        - name: patch maven properties
          uses: mvn/patch@v1
          with:
            downgrade: false
            mvn-root: ${source.dir}/jenkins
            properties: ${source.dir}/patch/mvn-properties.json
        - name: build
          work-dir: ${source.dir}/jenkins
          privileged: true
          secrets:
            - id: maven_user
              env: MAVEN_USER
              optional: true
            - id: maven_password
              env: MAVEN_PASSWORD
              optional: true
          runs: |
            set -eux -o pipefail

            mvn clean install -DskipTests -Dmaven.test.skip=true -Dspotless.check.skip=true
        - name: install
          work-dir: ${source.dir}/jenkins
          runs: |
            set -eux -o pipefail

            mkdir -p "${target.dir}/usr/share/jenkins"
            cp war/target/jenkins.war "${target.dir}/usr/share/jenkins/jenkins.war"
        - name: copy-entrypoint-scripts
          work-dir: ${source.dir}/docker-builds
          runs: |
            set -eux -o pipefail

            mkdir -p "${target.dir}/usr/share/jenkins/bin"
            mkdir -p "${target.dir}/usr/share/jenkins/ref/init.groovy.d"

            cp jenkins.sh "${target.dir}/usr/share/jenkins/bin/jenkins.sh"
            cp jenkins-support "${target.dir}/usr/share/jenkins/bin/jenkins-support"
        - uses: dhi/build-pkg:0
          with:
            depends:
              - bash
              - coreutils
            description: Jenkins open-source automation server
            files:
              - usr
            formats:
              - deb
            license: MIT
            name: jenkins
            rel: 0
            url: https://www.jenkins.io/
            version: 2.580.2
      paths:
        - type: file
          path: ${source.dir}/patch/mvn-dependencies.json
          uid: 0
          gid: 0
          source: package/main/jenkins/patch/mvn-dependencies.json
        - type: file
          path: ${source.dir}/patch/mvn-properties.json
          uid: 0
          gid: 0
          source: package/main/jenkins/patch/mvn-properties.json
os-release:
  name: Docker Hardened Images (Debian)
  id: debian
  version-id: "13"
  version-codename: trixie
  pretty-name: Docker Hardened Images/Debian GNU/Linux 13 (trixie)
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
