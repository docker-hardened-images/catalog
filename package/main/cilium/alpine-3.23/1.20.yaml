            install -m 755 plugins/cilium-cni/cni-uninstall.sh ${target.dir}/cni-uninstall.sh
        - name: install loopback
          runs: |
            set -eux -o pipefail
            install -D -m 755 /usr/bin/loopback ${target.dir}/cni/loopback
        - name: install iptables wrapper
          runs: |
            set -eux -o pipefail
            cd /go/src/github.com/kubernetes-sigs/iptables-wrappers
            go mod download
            mkdir -p ${target.dir}/usr/sbin
            CGO_ENABLED=0 go build \
              -ldflags="-s -w -extldflags=-static -buildid=" \
              -o ${target.dir}/usr/sbin/iptables-wrapper \
              ./
            ln -sf /usr/sbin/iptables-wrapper ${target.dir}/usr/sbin/iptables
            ln -sf /usr/sbin/iptables-wrapper ${target.dir}/usr/sbin/ip6tables
