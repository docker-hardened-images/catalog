              - install-plugin.sh
              - cni-uninstall.sh
              - cni/loopback
              - usr/sbin/iptables
              - usr/sbin/ip6tables
              - var/lib/cilium
              - etc/cni/net.d/05-cilium-cni.conf
            formats:
              - deb
            license: Apache-2.0
            name: cilium-1.18-libs
            priority: optional
            rel: 5
            url: https://github.com/cilium/cilium
            version: 1.18.13
