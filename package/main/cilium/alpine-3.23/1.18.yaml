              - go.mongodb.org/mongo-driver@v1.17.7
              - go.opentelemetry.io/otel@v1.44.0
              - google.golang.org/grpc@v1.83.2
              - github.com/gopacket/gopacket@v1.6.1
            download: true
        - uses: go/hermetic@v1
        - name: test
          runs: |
            set -eux -o pipefail

            GOMAXPROCS=1 CGO_ENABLED=0 go test -mod=vendor -count=1 -p 1 -timeout 30m -v \
              ./daemon/... \
              ./cilium-dbg/... \
