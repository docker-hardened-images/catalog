                  purl: pkg:github/kubernetes-sigs/iptables-wrappers@3
                  license: Apache-2.0
            uid: 0
            gid: 0
      pipeline:
        - name: install BPF sources
          runs: |
            set -eux -o pipefail
            make install-bpf DESTDIR=${target.dir}
        - name: install scripts
          runs: |
            set -eux -o pipefail
            install -m 755 images/cilium/init-container.sh ${target.dir}/init-container.sh
            install -m 755 plugins/cilium-cni/install-plugin.sh ${target.dir}/install-plugin.sh
            install -m 755 plugins/cilium-cni/cni-uninstall.sh ${target.dir}/cni-uninstall.sh
        - name: install cni config
          runs: |
            set -eux -o pipefail
            install -D -m 644 plugins/cilium-cni/05-cilium-cni.conf ${target.dir}/etc/cni/net.d/05-cilium-cni.conf
        - name: install loopback
          runs: |
            set -eux -o pipefail
            install -D -m 755 /usr/bin/loopback ${target.dir}/cni/loopback
        - name: install iptables wrapper (1.18 and 1.19)
          runs: |
            set -eux -o pipefail
            ./images/runtime/iptables-wrapper-installer.sh --no-sanity-check
            mkdir -p ${target.dir}/usr/sbin
            install -m 755 /usr/sbin/iptables ${target.dir}/usr/sbin/iptables
            install -m 755 /usr/sbin/ip6tables ${target.dir}/usr/sbin/ip6tables
        - name: create cilium-libs package (1.18 only)
