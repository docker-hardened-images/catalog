# syntax=dhi.io/build:2-alpine3.24

image: dhi.io/pkg-azure-service-operator
variant: runtime
tags:
  - 2.22.0-alpine3.24
  - 2.22.0-r3-alpine3.24
platforms:
  - linux/amd64
  - linux/arm64
vars:
  COMMIT_SHA: 03b1e9142cdff81c573f2d3492dc4c5e1817cd2e
  GOLANG_MAJOR_MINOR_VERSION: "1.26"
  GOLANG_VERSION: 1.26.11-r0
  PACKAGE_NAME: azure-service-operator
  PYTHON_VERSION: 3.13.18-r3
  REL: "3"
  SEMVER_MAJOR_MINOR_VERSION: "2.22"
  SEMVER_MAJOR_VERSION: "2"
  SEMVER_VERSION: 2.22.0
  VERSION: 2.22.0
contents:
  repositories:
    - https://dhi.io/apk/alpine/v3.24/main
    - https://dhi.io/apk/alpine/v3.23/main
    - https://dl-cdn.alpinelinux.org/alpine/v3.24/main
    - https://dl-cdn.alpinelinux.org/alpine/v3.24/community
  keyring:
    - https://dhi.io/keyring/dhi-apk@docker-0F81AD7700D99184.rsa.pub
  packages:
    - alpine-baselayout-data
  builds:
    - name: azure-service-operator
      work-dir: /go/src/github.com/Azure/azure-service-operator
      caches:
        - path: /go/pkg/mod
      contents:
        packages:
          - busybox
          - bash
          - ca-certificates-bundle
          - coreutils
          - findutils
          - git
          - gettext
          - mawk
          - sed
          - golang-1.26=1.26.11-r0
          - golang-1.26-oci-config=1.26.11-r0
          - python-3.13=3.13.18-r3
          - python-3.13-dev=3.13.18-r3
        files:
          - url: git+https://github.com/Azure/azure-service-operator.git#v2.22.0
            checksum: 03b1e9142cdff81c573f2d3492dc4c5e1817cd2e
            path: /go/src/github.com/Azure/azure-service-operator
            spdx:
              name: azure-service-operator
              version: 2.22.0
              packages:
                - name: azure-service-operator
                  purl: pkg:golang/github.com/Azure/azure-service-operator/v2@2.22.0
                  license: MIT
            uid: 0
            gid: 0
      pipeline:
        - name: install setup utilities
          privileged: true
          runs: |
            set -eux -o pipefail

            go install github.com/go-task/task/v3/cmd/task@latest
            go install sigs.k8s.io/controller-tools/cmd/controller-gen@v0.17.3
            go install mvdan.cc/gofumpt@latest
            CGO_ENABLED=0 go install sigs.k8s.io/kustomize/kustomize/v4@v4.5.7
        - name: generate CRDs
          work-dir: /go/src/github.com/Azure/azure-service-operator
          privileged: true
          runs: |
            set -eux -o pipefail

            export PATH="$(go env GOPATH)/bin:$PATH"

            sed -i 's/-m virtualenv/-m venv/' Taskfile.yml

            task controller:bundle-crds
            mkdir -p "${target.dir}/usr/share/azure-service-operator"
            cp -a ./v2/out/crds "${target.dir}/usr/share/azure-service-operator/crds"
        - name: reject malformed UTF-8 request origins
          uses: patch@v1
          with:
            options: -p1
            patches:
              - ${source.dir}/patch/reject-malformed-utf8-hostnames.patch
        - name: update go dependencies
          uses: go/bump@v2
          work-dir: /go/src/github.com/Azure/azure-service-operator/v2
          with:
            deps:
              - golang.org/x/net@v0.62.0
            download: true
            replaces:
              - google.golang.org/grpc=google.golang.org/grpc@v1.83.2
            tidy: true
        - name: test
          work-dir: /go/src/github.com/Azure/azure-service-operator
          privileged: true
          runs: |
            set -eux -o pipefail

            export PATH="$(go env GOPATH)/bin:$PATH"

            cd v2/tools/generator/
            go mod tidy

            cd -
            task controller:test
        - name: build
          uses: go/build@v1
          work-dir: /go/src/github.com/Azure/azure-service-operator/v2
          with:
            fips: false
            ldflags:
              - -X github.com/Azure/azure-service-operator/v2/internal/version.BuildVersion=2.22.0
            output: ${target.dir}/usr/bin/aso-controller
            packages: ./cmd/controller
        - name: build dev
          uses: go/build@v1
          work-dir: /go/src/github.com/Azure/azure-service-operator/v2
          with:
            fips: false
            ldflags:
              - -X github.com/Azure/azure-service-operator/v2/internal/version.BuildVersion=2.22.0
            output: ${target.dir}/usr/bin/aso-controller-dev
            packages: ./cmd/controller
            strip: false
        - uses: dhi/build-pkg:0
          with:
            description: Azure Service Operator Kubernetes controller
            files:
              - usr/bin/aso-controller
              - usr/share/azure-service-operator/crds
            license: MIT
            name: azure-service-operator
            rel: 3
            subpackages:
              - files:
                  - path: usr/bin/aso-controller
                    source: usr/bin/aso-controller-dev
                name: azure-service-operator-dev
            url: https://github.com/Azure/azure-service-operator
            version: 2.22.0
      paths:
        - type: file
          path: ${source.dir}/patch/reject-malformed-utf8-hostnames.patch
          uid: 0
          gid: 0
          source: package/main/azure-service-operator/patch/reject-malformed-utf8-hostnames.patch
os-release:
  name: Docker Hardened Images (Alpine)
  id: alpine
  version-id: "3.24"
  pretty-name: Docker Hardened Images/Alpine Linux v3.24
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
