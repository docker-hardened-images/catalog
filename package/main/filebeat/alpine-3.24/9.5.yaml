# syntax=dhi.io/build:2-alpine3.24

image: dhi.io/pkg-filebeat
variant: runtime
tags:
  - 9.5.2-alpine3.24
  - 9.5.2-r2-alpine3.24
platforms:
  - linux/amd64
  - linux/arm64
dates:
  release: "2026-07-29"
vars:
  COMMIT_SHA: 8f4fe1e5dec067a139dce33d3af88c24b58c3660
  GOLANG_MAJOR_MINOR_VERSION: "1.26"
  GOLANG_VERSION: 1.26.8-r0
  PACKAGE_NAME: filebeat-9.5
  REL: "2"
  SEMVER_MAJOR_MINOR_VERSION: "9.5"
  SEMVER_MAJOR_VERSION: "9"
  SEMVER_VERSION: 9.5.2
  VERSION: 9.5.2
contents:
  repositories:
    - https://dhi.io/apk/alpine/v3.24/main
    - https://dhi.io/apk/alpine/v3.23/main
    - https://dl-cdn.alpinelinux.org/alpine/v3.24/main
    - https://dl-cdn.alpinelinux.org/alpine/v3.24/community
  keyring:
    - https://dhi.io/keyring/dhi-apk@docker-0F81AD7700D99184.rsa.pub
  packages:
    - alpine-baselayout-data
  builds:
    - name: filebeat-9.5
      work-dir: /go/src/github.com/elastic/beats
      caches:
        - path: /go/pkg/mod
      contents:
        packages:
          - busybox
          - bash
          - ca-certificates-bundle
          - coreutils
          - findutils
          - mawk
          - sed
          - golang-1.26=1.26.8-r0
          - golang-1.26-oci-config=1.26.8-r0
        files:
          - url: git+https://github.com/elastic/beats#v9.5.2
            checksum: 8f4fe1e5dec067a139dce33d3af88c24b58c3660
            path: /go/src/github.com/elastic/beats
            spdx:
              name: filebeat
              version: 9.5.2
              packages:
                - name: filebeat
                  purl: pkg:golang/github.com/elastic/beats@9.5.2
                  license: Elastic-2.0
            uid: 0
            gid: 0
      pipeline:
        - name: go dependencies (9.5 only)
          uses: go/bump@v1
          work-dir: /go/src/github.com/elastic/beats/
          with:
            deps:
              - github.com/google/cel-go@v0.30.0
              - google.golang.org/grpc@v1.83.1
            download: true
        - name: build filebeat
          uses: go/build@v1
          work-dir: /go/src/github.com/elastic/beats/x-pack/filebeat
          environment:
            GOFLAGS: -buildvcs=false
          with:
            fips: false
            ldflags:
              - -X github.com/elastic/beats/v7/libbeat/version.commit=8f4fe1e5dec067a139dce33d3af88c24b58c3660
              - -X github.com/elastic/beats/v7/libbeat/version.version=9.5.2
              - -X github.com/elastic/beats/v7/libbeat/version.buildTime=$(date -u -d @${SOURCE_DATE_EPOCH} +'%F-%T')
            output: ${target.dir}/usr/bin/filebeat
            packages: .
            tags:
              - netgo
        - name: build filebeat dev
          uses: go/build@v1
          work-dir: /go/src/github.com/elastic/beats/x-pack/filebeat
          environment:
            GOFLAGS: -buildvcs=false
          with:
            fips: false
            ldflags:
              - -X github.com/elastic/beats/v7/libbeat/version.commit=8f4fe1e5dec067a139dce33d3af88c24b58c3660
              - -X github.com/elastic/beats/v7/libbeat/version.version=9.5.2
              - -X github.com/elastic/beats/v7/libbeat/version.buildTime=$(date -u -d @${SOURCE_DATE_EPOCH} +'%F-%T')
            output: ${target.dir}/usr/bin/filebeat-dev
            packages: .
            strip: false
            tags:
              - netgo
        - name: install filebeat data
          work-dir: /go/src/github.com/elastic/beats/x-pack/filebeat
          runs: |
            set -eux -o pipefail

            mkdir -p "${target.dir}/usr/share/filebeat"
            mkdir -p "${target.dir}/usr/share/filebeat/modules.d"
            mkdir -p "${target.dir}/usr/share/filebeat/module"

            BEATS_ROOT=/go/src/github.com/elastic/beats

            if [ -d "$BEATS_ROOT/filebeat/modules.d" ] && [ -n "$(ls -A "$BEATS_ROOT/filebeat/modules.d" 2> /dev/null)" ]; then
              cp -r "$BEATS_ROOT"/filebeat/modules.d/* "${target.dir}/usr/share/filebeat/modules.d/"
            fi
            if [ -d "$BEATS_ROOT/filebeat/module" ] && [ -n "$(ls -A "$BEATS_ROOT/filebeat/module" 2> /dev/null)" ]; then
              cp -r "$BEATS_ROOT"/filebeat/module/* "${target.dir}/usr/share/filebeat/module/"
            fi
            if [ -d "$BEATS_ROOT/x-pack/filebeat/modules.d" ] && [ -n "$(ls -A "$BEATS_ROOT/x-pack/filebeat/modules.d" 2> /dev/null)" ]; then
              cp -r "$BEATS_ROOT"/x-pack/filebeat/modules.d/* "${target.dir}/usr/share/filebeat/modules.d/"
            fi
            if [ -d "$BEATS_ROOT/x-pack/filebeat/module" ] && [ -n "$(ls -A "$BEATS_ROOT/x-pack/filebeat/module" 2> /dev/null)" ]; then
              cp -r "$BEATS_ROOT"/x-pack/filebeat/module/* "${target.dir}/usr/share/filebeat/module/"
            fi

            install -m 0644 filebeat.yml "${target.dir}/usr/share/filebeat/filebeat.yml"
            ln -sf ../../bin/filebeat "${target.dir}/usr/share/filebeat/filebeat"
        - uses: dhi/build-pkg:0
          with:
            description: Filebeat ships log files and metrics to Elasticsearch
            files:
              - usr/bin/filebeat
              - usr/share/filebeat
            license: Elastic-2.0
            name: filebeat-9.5
            rel: 2
            subpackages:
              - description: Filebeat development package
                files:
                  - path: usr/bin/filebeat
                    source: usr/bin/filebeat-dev
                name: filebeat-9.5-dev
            url: https://github.com/elastic/beats
            version: 9.5.2
os-release:
  name: Docker Hardened Images (Alpine)
  id: alpine
  version-id: "3.24"
  pretty-name: Docker Hardened Images/Alpine Linux v3.24
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
