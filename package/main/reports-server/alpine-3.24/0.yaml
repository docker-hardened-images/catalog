        - name: test
          privileged: true
          runs: |
            set -eux -o pipefail

            mkdir -p /go/tmp
            export GOTMPDIR=/go/tmp TMPDIR=/go/tmp

            go test ./... -race -covermode=atomic
        - name: build
          uses: go/build@v1
