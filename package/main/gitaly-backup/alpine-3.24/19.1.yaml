    - alpine-baselayout-data
  builds:
    - name: gitaly-backup-19.1
      work-dir: /go/src/gitlab.com/gitlab-org/gitaly
      contents:
        packages:
          - busybox
          - bash
          - ca-certificates-bundle
          - golang-1.26=1.26.6-r0
          - golang-1.26-oci-config=1.26.6-r0
        files:
          - url: git+https://gitlab.com/gitlab-org/gitaly.git#v19.1.4
            checksum: 7d924d84e5099f3e8afa1c64b47e475ae5cea9be
            path: /go/src/gitlab.com/gitlab-org/gitaly
            spdx:
              name: gitaly-backup
              version: 19.1.4
              packages:
                - name: gitaly-backup
                  purl: pkg:golang/gitlab.com/gitlab-org/gitaly/v18@19.1.4
                  license: MIT
            uid: 0
            gid: 0
      pipeline:
        - name: update go dependencies
          uses: go/bump@v2
          with:
            deps:
              - github.com/aws/aws-sdk-go-v2/aws/protocol/eventstream@v1.7.11
              - github.com/aws/aws-sdk-go-v2/service/s3@v1.102.2
              - github.com/go-jose/go-jose/v4@v4.1.4
              - github.com/klauspost/compress@v1.18.7
              - go.opentelemetry.io/otel@v1.45.0
              - go.opentelemetry.io/otel/exporters/otlp/otlptrace/otlptracehttp@v1.45.0
              - go.opentelemetry.io/otel/sdk@v1.45.0
              - golang.org/x/crypto@v0.55.0
              - golang.org/x/net@v0.58.0
              - golang.org/x/sys@v0.47.0
              - golang.org/x/text@v0.41.0
              - google.golang.org/grpc@v1.83.0
            download: true
        - uses: go/hermetic@v1
        - name: test
          runs: |
            set -eux -o pipefail

            MOD=$(go list -m)

            PKGS="internal/archive
            internal/backoff
            internal/grpc/backchannel
            internal/grpc/metadata
            internal/grpc/protoregistry
            internal/helper/duration
            internal/helper/text
            internal/log
            internal/structerr
            streamio"

            TESTED=""
            for p in ${PKGS}; do
              TESTED="${TESTED} ${MOD}/${p}"
            done

            CGO_ENABLED=0 go test -short -count=1 ${TESTED}

            CLOSURE=$(go list -deps ./cmd/gitaly-backup | grep -c "^${MOD}/")
            echo "DHI-GO-007 coverage: tested $(echo ${PKGS} | wc -w) of ${CLOSURE} in-repo packages in gitaly-backup's dependency closure; the remainder require the bundled Git environment, assert non-root filesystem behaviour, or pin an otel semconv older than the CVE bump"
        - name: build
          uses: go/build@v1
          with:
            cgo_enabled: 0
            fips: false
            ldflags:
              - -X gitlab.com/gitlab-org/gitaly/v18/internal/version.version=19.1.4
            output: ${target.dir}/usr/bin/gitaly-backup
            packages: ./cmd/gitaly-backup
            strip: false
        - name: verify version injection
          runs: |
            set -eux -o pipefail

            BIN=${target.dir}/usr/bin/gitaly-backup
            test -s "${BIN}"

            go version -m "${BIN}" | grep -F -- \
              "-X gitlab.com/gitlab-org/gitaly/v18/internal/version.version=19.1.4"
        - uses: dhi/build-pkg:0
          with:
            description: Gitaly backup and restore client used by GitLab backup tooling
            files:
              - usr/bin/gitaly-backup
            license: MIT
            name: gitaly-backup-19.1
            rel: 0
            url: https://gitlab.com/gitlab-org/gitaly
            version: 19.1.4
