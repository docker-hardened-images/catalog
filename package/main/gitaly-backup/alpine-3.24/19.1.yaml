  - 19.1.4-r0-alpine3.24
platforms:
  - linux/amd64
  - linux/arm64
vars:
  COMMIT_SHA: 7d924d84e5099f3e8afa1c64b47e475ae5cea9be
  GOLANG_VERSION: 1.26.6-r0
  PACKAGE_NAME: gitaly-backup-19.1
  REL: "0"
