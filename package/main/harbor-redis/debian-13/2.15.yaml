image: dhi.io/pkg-harbor-redis
variant: runtime
tags:
  - 2.15.2
  - 2.15.2-r0
  - 2.15.2-debian13
  - 2.15.2-r0-debian13
platforms:
  - linux/amd64
  - linux/arm64
dates:
  release: "2026-03-19"
vars:
  COMMIT_SHA: 080b0220574cc853ae1e2946ce7a5610ba855757
  PACKAGE_NAME: harbor-redis-2.15
  PHOTON_CONFIG_DIR: make/photon/valkey
  REL: "0"
  SEMVER_MAJOR_MINOR_VERSION: "2.15"
  SEMVER_MAJOR_VERSION: "2"
  SEMVER_VERSION: 2.15.2
  VERSION: 2.15.2
contents:
  packages:
    - base-files
  builds:
    - name: harbor-redis
      work-dir: ${source.dir}/goharbor/harbor
      contents:
        packages:
          - bash
          - ca-certificates
          - coreutils
          - findutils
        files:
          - url: git+https://github.com/goharbor/harbor.git#v2.15.2
            checksum: 080b0220574cc853ae1e2946ce7a5610ba855757
            path: ${source.dir}/goharbor/harbor
            spdx:
              name: harbor-redis
              version: 2.15.2
              packages:
                - name: harbor-redis
                  purl: pkg:github/goharbor/harbor@2.15.2#make/photon
                  license: Apache-2.0
            uid: 0
            gid: 0
      pipeline:
        - name: stage harbor redis config
          runs: |
            set -eux -o pipefail

            install -D -m 0644 "make/photon/valkey/redis.conf" "${target.dir}/etc/harbor-redis/redis.conf"
            install -D -m 0755 "make/photon/valkey/docker-healthcheck" "${target.dir}/usr/bin/docker-healthcheck"
        - uses: dhi/build-pkg:0
          with:
            description: Harbor Redis configuration and healthcheck for Harbor 2.15.x
            files:
              - etc/harbor-redis/redis.conf
              - usr/bin/docker-healthcheck
            formats:
              - deb
            license: Apache-2.0
            name: harbor-redis-2.15
            rel: 0
            url: https://goharbor.io/
            version: 2.15.2
os-release:
  name: Docker Hardened Images (Debian)
