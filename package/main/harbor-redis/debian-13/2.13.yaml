# syntax=dhi.io/build:2-debian13

image: dhi.io/pkg-harbor-redis
variant: runtime
tags:
  - "2.13"
  - 2.13.5
  - 2.13-debian13
  - 2.13.5-debian13
platforms:
  - linux/amd64
  - linux/arm64
dates:
  release: "2025-03-17"
vars:
  COMMIT_SHA: ffae54219c89f7f486f17694681232dd70787db1
  PACKAGE_NAME: harbor-redis-2.13
  PHOTON_CONFIG_DIR: make/photon/redis
  REL: "1"
  SEMVER_MAJOR_MINOR_VERSION: "2.13"
  SEMVER_MAJOR_VERSION: "2"
  SEMVER_VERSION: 2.13.5
  VERSION: 2.13.5
contents:
  packages:
    - base-files
  builds:
    - name: harbor-redis
      work-dir: ${source.dir}/goharbor/harbor
      contents:
        packages:
          - bash
          - ca-certificates
          - coreutils
          - findutils
        files:
          - url: git+https://github.com/goharbor/harbor.git#v2.13.5
            checksum: ffae54219c89f7f486f17694681232dd70787db1
            path: ${source.dir}/goharbor/harbor
            spdx:
              name: harbor-redis
              version: 2.13.5
              packages:
                - name: harbor-redis
                  purl: pkg:github/goharbor/harbor@2.13.5#make/photon
                  license: Apache-2.0
            uid: 0
            gid: 0
      pipeline:
        - name: stage harbor redis config
          runs: |
            set -eux -o pipefail

            install -D -m 0644 "make/photon/redis/redis.conf" "${target.dir}/etc/harbor-redis/redis.conf"
            install -D -m 0755 "make/photon/redis/docker-healthcheck" "${target.dir}/usr/bin/docker-healthcheck"
        - uses: dhi/build-pkg:0
          with:
            description: Harbor Redis configuration and healthcheck for Harbor 2.13.x
            files:
              - etc/harbor-redis/redis.conf
              - usr/bin/docker-healthcheck
            formats:
              - deb
            license: Apache-2.0
            name: harbor-redis-2.13
            rel: 1
            url: https://goharbor.io/
            version: 2.13.5
os-release:
  name: Docker Hardened Images (Debian)
  id: debian
  version-id: "13"
  version-codename: trixie
  pretty-name: Docker Hardened Images/Debian GNU/Linux 13 (trixie)
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
