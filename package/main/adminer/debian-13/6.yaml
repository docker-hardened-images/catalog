  - 6.3.0-r1
  - 6.3.0-debian13
  - 6.3.0-r1-debian13
platforms:
  - linux/amd64
  - linux/arm64
vars:
  COMMIT_SHA: 6f95564e80f24a2a024a9cb9aee40cfd0aca8eb1
  DOCKER_ADMINER_COMMIT_SHA: 6d83dde54e9e8a76c9e003eb494e296808a2a627
  JUSH_COMMIT_SHA: 93cc6b18c1ee6a3d3466b6689b041b74e532962e
  PHP_INI_DIR: /etc/php-8.5
  PHP_MAJOR_MINOR: "8.5"
  PHP_SRC_ASC_CHECKSUM: ee9317cb40874ee4f733298e3159197a39e602020f8229c16d1bedf1aaefd242
  PHP_SRC_CHECKSUM: 08bc2eba2a588654ade1357174aa646b761556c862dda0678345ee29ed481209
  PHP_SRC_VERSION: 8.5.12
  PHP_VERSION: 8.5.12-0
  REL: "1"
  SEMVER_MAJOR_MINOR_VERSION: "6.3"
  SEMVER_MAJOR_VERSION: "6"
  SEMVER_VERSION: 6.3.0
  VERSION: 6.3.0
contents:
  repositories:
    - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
  keyring:
    - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
  packages:
    - base-files
  builds:
    - name: adminer
      work-dir: ${source.dir}/adminer
      contents:
        repositories:
          - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
        keyring:
          - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
        packages:
          - bash
          - ca-certificates
          - coreutils
          - php-8.5
          - sed
        files:
          - url: git+https://github.com/vrana/adminer.git#v6.3.0
            checksum: 6f95564e80f24a2a024a9cb9aee40cfd0aca8eb1
            path: ${source.dir}/adminer
            spdx:
              name: adminer
              version: 6.3.0
              packages:
                - name: adminer
                  purl: pkg:composer/vrana/adminer@6.3.0
                  license: (Apache-2.0 OR GPL-2.0-only)
                - name: jush
                  purl: pkg:github/vrana/jush@93cc6b18c1ee6a3d3466b6689b041b74e532962e
                  license: (Apache-2.0 OR GPL-2.0-only)
            uid: 0
            gid: 0
          - url: https://raw.githubusercontent.com/TimWolla/docker-adminer/6d83dde54e9e8a76c9e003eb494e296808a2a627/6/index.php
            checksum: sha256:fe4b63e9d645906e399b470a53fb59a6b16e8b9732dd62a8ef2e5d37900aab18
            path: ${source.dir}/glue/index.php
            spdx:
              name: docker-adminer-glue
              version: 6d83dde54e9e8a76c9e003eb494e296808a2a627
              packages:
                - name: docker-adminer-index
                  purl: pkg:github/timwolla/docker-adminer@6d83dde54e9e8a76c9e003eb494e296808a2a627
                  license: NOASSERTION
            uid: 0
            gid: 0
          - url: https://raw.githubusercontent.com/TimWolla/docker-adminer/6d83dde54e9e8a76c9e003eb494e296808a2a627/6/plugin-loader.php
            checksum: sha256:502e5ec8a5d54fb2f7d119a7b5203f4e10eb91e14286c78aa1d60cc628b511d9
            path: ${source.dir}/glue/plugin-loader.php
            spdx:
              name: docker-adminer-glue
              version: 6d83dde54e9e8a76c9e003eb494e296808a2a627
              packages:
                - name: docker-adminer-plugin-loader
                  purl: pkg:github/timwolla/docker-adminer@6d83dde54e9e8a76c9e003eb494e296808a2a627
                  license: NOASSERTION
            uid: 0
            gid: 0
      pipeline:
        - name: compile adminer
          runs: |
            set -eux -o pipefail

            php-8.5 compile.php

            sed -i "s/\$_ENV\['ADMINER_DEFAULT_SERVER'\]/getenv('ADMINER_DEFAULT_SERVER')/" "${source.dir}/glue/index.php"

            install -D -m 0644 adminer-6.3.0.php "${target.dir}/usr/share/adminer/adminer.php"
            install -D -m 0644 "${source.dir}/glue/index.php" "${target.dir}/usr/share/adminer/index.php"
            install -D -m 0644 "${source.dir}/glue/plugin-loader.php" "${target.dir}/usr/share/adminer/plugin-loader.php"
            cp -a designs "${target.dir}/usr/share/adminer/designs"
            cp -a plugins "${target.dir}/usr/share/adminer/plugins"
        - uses: dhi/build-pkg:0
          with:
            depends:
              - php-8.5
            description: Database management tool in a single PHP file (Adminer application tree)
            files:
              - usr/share/adminer
            formats:
              - deb
              - apk
            license: (Apache-2.0 OR GPL-2.0-only)
            name: adminer
            rel: 1
            url: https://www.adminer.org/
            version: 6.3.0
    - name: build php extensions
      work-dir: ${source.dir}
      shell: bash
      contents:
        repositories:
          - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
        keyring:
          - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
        packages:
          - autoconf
          - bash
          - build-essential
          - coreutils
          - diffutils
          - findutils
          - gawk
          - grep
          - php-8.5=8.5.12-0
          - php-8.5-dev=8.5.12-0
          - make
          - pkg-config
          - sed
          - tar
          - xz-utils
          - libpq-dev
          - unixodbc-dev
          - freetds-dev
        files:
          - url: https://www.php.net/distributions/php-8.5.12.tar.xz.asc
            checksum: sha256:ee9317cb40874ee4f733298e3159197a39e602020f8229c16d1bedf1aaefd242
            path: ${source.dir}/php-8.5.12.tar.xz.asc
            spdx:
              name: php-signature
              version: 8.5.12
              packages:
                - name: php-signature
                  purl: pkg:generic/php@8.5.12
                  license: PHP-3.01
            uid: 0
            gid: 0
          - url: https://www.php.net/distributions/php-8.5.12.tar.xz
            checksum: sha256:08bc2eba2a588654ade1357174aa646b761556c862dda0678345ee29ed481209
            path: ${source.dir}/php-8.5.12.tar.xz
            spdx:
              name: php
              version: 8.5.12
              packages:
                - name: php
                  purl: pkg:generic/php@8.5.12
                  license: PHP-3.01
            uid: 0
            gid: 0
      pipeline:
        - name: verify php-8.5.12.tar.xz
          uses: gpg/verify@v1
          with:
            file: ${source.dir}/php-8.5.12.tar.xz
            keys: ${source.dir}/keyring.asc
            signature: ${source.dir}/php-8.5.12.tar.xz.asc
        - name: extract php source
          runs: |
            set -eux -o pipefail

            test "$(php-config --version)" = "8.5.12"

            PHP_SRC_DIR="${source.dir}/php-src"
            mkdir -p "$PHP_SRC_DIR"
            tar xf "${source.dir}/php-8.5.12.tar.xz" -C "$PHP_SRC_DIR" --strip-components=1
        - name: build database extensions
          runs: |
            set -eux -o pipefail

            build_ext() {
              local ext=$1
              shift
              cd "${source.dir}/php-src/ext/$ext"
              phpize
              ./configure "$@"
              make -j$(nproc)
              make install
            }

            build_ext mysqli
            build_ext pdo_pgsql --with-pdo-pgsql=/usr
            build_ext pdo_odbc --with-pdo-odbc=unixODBC,/usr
            build_ext pdo_dblib --with-pdo-dblib
        - name: stage extension payload
          runs: |
            set -eux -o pipefail

            pkg_ext_dir=usr/lib/dhi-adminer-php-ext
            install -d "${target.dir}/${pkg_ext_dir}"
            ext_dir="$(php-config --extension-dir)"
            for ext in mysqli pdo_pgsql pdo_odbc pdo_dblib; do
              install -m 0644 "${ext_dir}/${ext}.so" "${target.dir}/${pkg_ext_dir}/"
            done

            install -d "${target.dir}/etc/php-8.5/conf.d"
            for ext in mysqli pdo_pgsql pdo_odbc pdo_dblib; do
              printf 'extension=/usr/lib/dhi-adminer-php-ext/%s.so\n' "$ext" \
                > "${target.dir}/etc/php-8.5/conf.d/docker-php-ext-${ext}.ini"
            done
        - uses: dhi/build-pkg:0
          with:
            depends:
              - php-8.5
              - libpq5
              - libodbc2
              - libsybdb5
            description: PHP database extensions required by Adminer (mysqli, pdo_pgsql, pdo_odbc, pdo_dblib)
            files:
              - usr/lib/dhi-adminer-php-ext
              - /etc/php-8.5/conf.d/docker-php-ext-mysqli.ini
              - /etc/php-8.5/conf.d/docker-php-ext-pdo_pgsql.ini
              - /etc/php-8.5/conf.d/docker-php-ext-pdo_odbc.ini
              - /etc/php-8.5/conf.d/docker-php-ext-pdo_dblib.ini
            formats:
              - deb
            license: PHP-3.01
            name: dhi-adminer-php-ext
            rel: 1
            url: https://www.adminer.org/
            version: 6.3.0
      paths:
        - type: file
          path: ${source.dir}/keyring.asc
          uid: 0
          gid: 0
          source: package/main/adminer/debian-13/key/php8.5.keyring.asc
os-release:
  name: Docker Hardened Images (Debian)
  id: debian
  version-id: "13"
  version-codename: trixie
  pretty-name: Docker Hardened Images/Debian GNU/Linux 13 (trixie)
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
