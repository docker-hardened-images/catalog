            description: Database management tool in a single PHP file, with SQLite support out of the box (MySQL, PostgreSQL, and MS SQL drivers require PHP extensions not included in this package)
            files:
              - usr/share/adminer
            license: (Apache-2.0 OR GPL-2.0-only)
            name: adminer
            rel: 0
            url: https://www.adminer.org/
            version: 6.3.0
