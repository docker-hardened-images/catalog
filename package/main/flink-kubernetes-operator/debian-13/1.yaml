# syntax=dhi.io/build:2-debian13

image: dhi.io/pkg-flink-kubernetes-operator
variant: runtime
tags:
  - 1.16.1
  - 1.16.1-r10
  - 1.16.1-debian13
  - 1.16.1-r10-debian13
platforms:
  - linux/amd64
  - linux/arm64
dates:
  release: "2026-05-07"
vars:
  COMMIT_SHA: 1c895a326b3306e29d57334041d685c5cd9194c9
  FLINK_HOME: /opt/flink
  JDK_MAJOR_VERSION: "17"
  JDK_VERSION: 1:17.0.21.1+2-0
  MAVEN_VERSION: 3.10.1-0
  OPERATOR_HOME: /flink-kubernetes-operator
  PACKAGE_NAME: flink-kubernetes-operator
  REL: "10"
  SEMVER_MAJOR_MINOR_VERSION: "1.16"
  SEMVER_MAJOR_VERSION: "1"
  SEMVER_VERSION: 1.16.1
  VERSION: 1.16.1
contents:
  repositories:
    - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
  keyring:
    - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
  packages:
    - base-files
  builds:
    - name: flink-kubernetes-operator
      work-dir: ${source.dir}/flink-kubernetes-operator
      environment:
        JAVA_HOME: /usr/lib/jvm/temurin-17
        MAVEN_ARGS: --batch-mode --no-transfer-progress
        MAVEN_HOME: /usr/share/java/maven-3
      caches:
        - path: /root/.m2/repository
      contents:
        packages:
          - bash
          - ca-certificates
          - coreutils
          - eclipse-temurin-17-jdk=1:17.0.21.1+2-0
          - findutils
          - git
          - grep
          - gzip
          - maven=3.10.1-0
          - sed
          - tar
          - yq
        files:
          - url: git+https://github.com/apache/flink-kubernetes-operator.git#release-1.16.1
            checksum: 1c895a326b3306e29d57334041d685c5cd9194c9
            path: ${source.dir}/flink-kubernetes-operator
            spdx:
              name: flink-kubernetes-operator
              version: 1.16.1
              packages:
                - name: flink-kubernetes-operator
                  purl: pkg:github/apache/flink-kubernetes-operator@release-1.16.1
                  license: Apache-2.0
            uid: 0
            gid: 0
      pipeline:
        - uses: mvn/mirror@v1
        - name: use maven central when mirror credentials are absent
          secrets:
            - id: maven_user
              env: MAVEN_USER
              optional: true
            - id: maven_password
              env: MAVEN_PASSWORD
              optional: true
          runs: |
            set -eux -o pipefail

            if [ -z "${MAVEN_USER:-}" ] || [ -z "${MAVEN_PASSWORD:-}" ]; then
              rm -f /root/.m2/settings.xml
            fi
        - name: patch maven dependencies
          uses: mvn/patch@v1
          secrets:
            - id: maven_user
              env: MAVEN_USER
              optional: true
            - id: maven_password
              env: MAVEN_PASSWORD
              optional: true
          with:
            dependencies: ${source.dir}/patch/mvn-dependencies.json
            dependencies-key: dependencyManagement.dependencies
            mvn-root: ${source.dir}/flink-kubernetes-operator
            properties: ${source.dir}/patch/mvn-properties.json
        - name: test
          privileged: true
          secrets:
            - id: maven_user
              env: MAVEN_USER
              optional: true
            - id: maven_password
              env: MAVEN_PASSWORD
              optional: true
          runs: |
            set -eux -o pipefail

            mvn test \
              -pl flink-kubernetes-standalone,flink-kubernetes-operator-api,flink-kubernetes-operator,flink-autoscaler,flink-kubernetes-webhook \
              -Dxml.skip=true \
              -Dfabric8.httpclient.impl=okhttp
        - name: build
          privileged: true
          secrets:
            - id: maven_user
              env: MAVEN_USER
              optional: true
            - id: maven_password
              env: MAVEN_PASSWORD
              optional: true
          runs: |
            set -eux -o pipefail

            mvn package \
              -pl flink-kubernetes-standalone,flink-kubernetes-operator-api,flink-kubernetes-operator,flink-autoscaler,flink-kubernetes-webhook \
              -DskipTests=true \
              -Dxml.skip=true \
              -Dfabric8.httpclient.impl=okhttp
        - name: install
          runs: |
            set -eux -o pipefail

            install -d "${target.dir}/flink-kubernetes-operator"
            install -d "${target.dir}/opt/flink/operator-lib"
            install -d "${target.dir}/opt/flink/log/log4j"
            install -d "${target.dir}/opt/flink/log/logback"
            install -d "${target.dir}/opt/flink/plugins"

            install -m 0644 \
              "flink-kubernetes-operator/target/flink-kubernetes-operator-1.16.1-shaded.jar" \
              "${target.dir}/flink-kubernetes-operator/flink-kubernetes-operator-1.16.1-shaded.jar"
            install -m 0644 \
              "flink-kubernetes-webhook/target/flink-kubernetes-webhook-1.16.1-shaded.jar" \
              "${target.dir}/flink-kubernetes-operator/flink-kubernetes-webhook-1.16.1-shaded.jar"
            install -m 0644 \
              "flink-kubernetes-standalone/target/flink-kubernetes-standalone-1.16.1.jar" \
              "${target.dir}/flink-kubernetes-operator/flink-kubernetes-standalone-1.16.1.jar"

            cp -a flink-kubernetes-operator/target/plugins/. "${target.dir}/opt/flink/plugins/"
            cp -a flink-kubernetes-operator/target/log4j/. "${target.dir}/opt/flink/log/log4j/"
            cp -a flink-kubernetes-operator/target/logback/. "${target.dir}/opt/flink/log/logback/"
        - name: maven sbom
          uses: sbom@v1
          with:
            extra-scanners: java-archive-cataloger
            prefix: flink-kubernetes-operator-maven
            source: ${target.dir}/flink-kubernetes-operator
        - uses: dhi/build-pkg:0
          privileged: true
          with:
            depends:
              - bash
              - ca-certificates
              - coreutils
            description: Apache Flink Kubernetes Operator
            files:
              - flink-kubernetes-operator
              - opt/flink
            license: Apache-2.0
            name: flink-kubernetes-operator
            rel: 10
            url: https://github.com/apache/flink-kubernetes-operator
            version: 1.16.1
      paths:
        - type: file
          path: ${source.dir}/patch/mvn-dependencies.json
          uid: 0
          gid: 0
          source: package/main/flink-kubernetes-operator/patch/mvn-dependencies.json
        - type: file
          path: ${source.dir}/patch/mvn-properties.json
          uid: 0
          gid: 0
          source: package/main/flink-kubernetes-operator/patch/mvn-properties.json
os-release:
  name: Docker Hardened Images (Debian)
  id: debian
  version-id: "13"
  version-codename: trixie
  pretty-name: Docker Hardened Images/Debian GNU/Linux 13 (trixie)
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
