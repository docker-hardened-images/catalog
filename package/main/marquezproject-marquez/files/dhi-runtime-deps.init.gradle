// Force transitive runtime libraries off vulnerable releases that Marquez
// 0.51.1 pulls through Dropwizard 2.1.12.
//
// jackson 2.17.0 -> 2.18.11
//   CVE-2026-54512 CVE-2026-54513 CVE-2026-54514 CVE-2026-54515
//   CVE-2026-59888 CVE-2026-68497 CVE-2026-77310 CVE-2026-83557
//   CVE-2026-19032 CVE-2026-18401 GHSA-r7wm-3cxj-wff9
//   CVE-2026-89407 CVE-2026-89425 CVE-2026-91776 CVE-2026-91777
// jetty 9.4.53.v20231009 -> 9.4.58.v20250814
//   CVE-2024-22201 CVE-2024-8184 CVE-2024-9823 CVE-2024-13009 CVE-2025-5115
// httpcore5 / httpcore5-h2 5.3.3 -> 5.4.3
//   CVE-2026-54399 CVE-2026-54428
// httpclient5 5.4.2 -> 5.6.3
//   CVE-2025-27820 CVE-2026-64607
// commons-lang3 3.17.0 -> 3.18.0
//   CVE-2025-48924
// guava 33.0.0-jre -> 33.7.2-jre
//   CVE-2026-102554
// logback stays 1.2.13
//   CVE-2024-12798 CVE-2024-12801 CVE-2025-11226
//   CVE-2026-10532 CVE-2026-1225 CVE-2026-9828

allprojects {
    configurations.configureEach {
        resolutionStrategy.eachDependency { details ->
            def req = details.requested
            if (req.group != null && req.group.startsWith('com.fasterxml.jackson.')) {
                details.useVersion '2.18.11'
                details.because 'DHI CVE remediation'
            }
            if ((req.group == 'org.eclipse.jetty' || req.group == 'org.eclipse.jetty.http2')) {
                details.useVersion '9.4.58.v20250814'
                details.because 'DHI CVE remediation'
            }
            if (req.group == 'org.apache.httpcomponents.core5'
                    && (req.name == 'httpcore5' || req.name == 'httpcore5-h2')) {
                details.useVersion '5.4.3'
                details.because 'DHI CVE remediation'
            }
            if (req.group == 'org.apache.httpcomponents.client5' && req.name == 'httpclient5') {
                details.useVersion '5.6.3'
                details.because 'DHI CVE remediation'
            }
            if (req.group == 'org.apache.commons' && req.name == 'commons-lang3') {
                details.useVersion '3.18.0'
                details.because 'DHI CVE remediation'
            }
            if (req.group == 'com.google.guava' && req.name == 'guava') {
                details.useVersion '33.7.2-jre'
                details.because 'DHI CVE remediation'
            }
        }
    }
}
