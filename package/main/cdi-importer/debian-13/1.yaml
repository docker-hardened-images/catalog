              - github.com/go-jose/go-jose/v3@v3.0.5
              - github.com/klauspost/compress@v1.18.7
              - github.com/ulikunitz/xz@v0.5.15
              - go.opentelemetry.io/otel@v1.44.0
              - google.golang.org/grpc@v1.82.1
            download: true
        - name: patch grpc CVE
          privileged: true
          environment:
            GODEBUG: ""
            GOFIPS140: ""
          runs: |
            set -eux -o pipefail

            if [ -f go.work ]; then
              go work edit -go=1.25.0
            fi

            go get google.golang.org/grpc@v1.82.1 # GHSA-HRXH-6V49-42GF

            go mod tidy
            if [ -f go.work ]; then
              go work vendor
            else
              go mod vendor
            fi
        - name: test
          environment:
            CGO_ENABLED: "1"
            GOWORK: "off"
          runs: |
            set -eux -o pipefail

            go test ./pkg/importer/...
