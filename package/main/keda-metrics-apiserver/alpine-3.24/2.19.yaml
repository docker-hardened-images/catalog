# syntax=dhi.io/build:2-alpine3.24

image: dhi.io/pkg-keda-metrics-apiserver
variant: runtime
tags:
  - 2.19-alpine3.24
  - 2.19.0-alpine3.24
platforms:
  - linux/amd64
  - linux/arm64
dates:
  release: "2026-02-02"
vars:
  COMMIT_SHA: 3f88d60ae92f1174f67738f079f96ec17eeee77f
  GOLANG_MAJOR_MINOR_VERSION: "1.26"
  GOLANG_VERSION: 1.26.8-r0
  PACKAGE_NAME: keda-metrics-apiserver-2.19
  REL: "2"
  SEMVER_MAJOR_MINOR_VERSION: "2.19"
  SEMVER_MAJOR_VERSION: "2"
  SEMVER_VERSION: 2.19.0
  VERSION: 2.19.0
contents:
  repositories:
    - https://dhi.io/apk/alpine/v3.24/main
    - https://dhi.io/apk/alpine/v3.23/main
    - https://dl-cdn.alpinelinux.org/alpine/v3.24/main
    - https://dl-cdn.alpinelinux.org/alpine/v3.24/community
  keyring:
    - https://dhi.io/keyring/dhi-apk@docker-0F81AD7700D99184.rsa.pub
  packages:
    - alpine-baselayout-data
  builds:
    - name: keda-metrics-apiserver-2.19
      work-dir: /go/src/github.com/kedacore/keda
      caches:
        - path: /go/pkg/mod
      contents:
        packages:
          - busybox
          - bash
          - ca-certificates-bundle
          - coreutils
          - findutils
          - mawk
          - sed
          - golang-1.26=1.26.8-r0
          - golang-1.26-oci-config=1.26.8-r0
        files:
          - url: git+https://github.com/kedacore/keda.git#v2.19.0
            checksum: 3f88d60ae92f1174f67738f079f96ec17eeee77f
            path: /go/src/github.com/kedacore/keda
            spdx:
              name: keda-metrics-apiserver
              version: 2.19.0
              packages:
                - name: keda-metrics-apiserver
                  purl: pkg:golang/github.com/kedacore/keda/v2@2.19.0
                  license: Apache-2.0
            uid: 0
            gid: 0
      pipeline:
        - name: remove vendor directory
          runs: |
            set -eux -o pipefail

            rm -rf vendor
        - name: update go dependencies (2.19 only)
          uses: go/bump@v2
          with:
            deps:
              - golang.org/x/crypto@v0.55.0
              - golang.org/x/mod@v0.40.0
              - filippo.io/edwards25519@v1.1.1
              - github.com/aws/aws-sdk-go-v2/aws/protocol/eventstream@v1.7.8
              - github.com/aws/aws-sdk-go-v2/service/kinesis@v1.43.5
              - github.com/go-jose/go-jose/v4@v4.1.4
              - github.com/google/cel-go@v0.30.0
              - github.com/jackc/pgx/v5@v5.9.2
              - github.com/klauspost/compress@v1.18.7
              - github.com/valyala/fasthttp@v1.70.0
              - go.etcd.io/etcd/client/pkg/v3@v3.6.14
              - google.golang.org/grpc@v1.82.1
              - go.opentelemetry.io/otel/exporters/otlp/otlpmetric/otlpmetrichttp@v1.43.0
            download: true
            replaces:
              - github.com/google/cel-go=github.com/google/cel-go@v0.30.0
              - github.com/prometheus/client_golang=github.com/prometheus/client_golang@v1.23.2
              - github.com/prometheus/client_model=github.com/prometheus/client_model@v0.6.2
              - github.com/prometheus/common=github.com/prometheus/common@v0.66.1
              - github.com/prometheus/prometheus=github.com/prometheus/prometheus@v0.311.3
            tidy: true
        - name: patch prometheus parser API (2.19 only)
          runs: |
            set -eux -o pipefail

            sed -i 's|parser.ParseMetricSelector(valueLocation)|parser.NewParser(parser.Options{}).ParseMetricSelector(valueLocation)|' pkg/scalers/metrics_api_scaler.go
        - name: build
          uses: go/build@v1
          with:
            fips: false
            ldflags:
              - -X=github.com/kedacore/keda/v2/version.GitCommit=3f88d60ae92f1174f67738f079f96ec17eeee77f
              - -X=github.com/kedacore/keda/v2/version.Version=2.19.0
            output: ${target.dir}/usr/bin/keda-adapter
            packages: ./cmd/adapter/main.go
        - name: build dev
          uses: go/build@v1
          with:
            fips: false
            ldflags:
              - -X=github.com/kedacore/keda/v2/version.GitCommit=3f88d60ae92f1174f67738f079f96ec17eeee77f
              - -X=github.com/kedacore/keda/v2/version.Version=2.19.0
            output: ${target.dir}/usr/bin/keda-adapter-dev
            packages: ./cmd/adapter/main.go
            strip: false
        - uses: dhi/build-pkg:0
          with:
            description: KEDA metrics API server (adapter)
            files:
              - usr/bin/keda-adapter
            license: Apache-2.0
            name: keda-metrics-apiserver-2.19
            rel: 2
            subpackages:
              - files:
                  - path: usr/bin/keda-adapter
                    source: usr/bin/keda-adapter-dev
                name: keda-metrics-apiserver-2.19-dev
            url: https://github.com/kedacore/keda
            version: 2.19.0
os-release:
  name: Docker Hardened Images (Alpine)
  id: alpine
  version-id: "3.24"
  pretty-name: Docker Hardened Images/Alpine Linux v3.24
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
