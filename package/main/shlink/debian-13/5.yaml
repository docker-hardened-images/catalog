image: dhi.io/pkg-shlink
variant: runtime
tags:
  - 5.1.8
  - 5.1.8-r0
  - 5.1.8-debian13
  - 5.1.8-r0-debian13
platforms:
  - linux/amd64
  - linux/arm64
vars:
  COMMIT_SHA: 4a642689caf19e9dace0f709b08334db25519f16
  DIST_SHA256: sha256:3740a9bd98dd58602b83ee178874ecd0b52b7ba59b6b39270f2ac0bcf6c2c6bb
  ENTRYPOINT_SHA256: sha256:a173d5eaa0be9353921d841b4be0c9a3276450b20adaaf7b6ac5e367c3380156
  GOLANG_VERSION: 1.26.10-0
  PACKAGE_NAME: shlink-5
  PHP_INI_SHA256: sha256:ff60f90cbb6892083ba0f43468e33b421d00b944ae5c24cb9b8a4df8eff8cdb8
  REL: "0"
  ROADRUNNER_COMMIT_SHA: 321b817fab1056e404533ca1ddd200e77d1525fd
  ROADRUNNER_VERSION: 2025.1.15
  SEMVER_MAJOR_MINOR_VERSION: "5.1"
  SEMVER_MAJOR_VERSION: "5"
  SEMVER_VERSION: 5.1.8
  VERSION: 5.1.8
contents:
  repositories:
    - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
  keyring:
    - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
  packages:
    - base-files
  builds:
    - name: shlink
      work-dir: /go/src/github.com/roadrunner-server/roadrunner
      shell: bash
      environment:
        GOTOOLCHAIN: local
      caches:
        - path: /go/pkg/mod
      contents:
        packages:
          - bash
          - ca-certificates
          - coreutils
          - findutils
          - git
          - golang-1.26=1.26.10-0
          - golang-1.26-dev=1.26.10-0
          - golang-1.26-oci-config=1.26.10-0
          - grep
          - jq
          - libc-bin
          - unzip
        files:
          - url: https://github.com/shlinkio/shlink/releases/download/v5.1.8/shlink5.1.8_php8.5_dist.zip
            checksum: sha256:3740a9bd98dd58602b83ee178874ecd0b52b7ba59b6b39270f2ac0bcf6c2c6bb
            path: ${source.dir}/shlink-dist.zip
            spdx:
              name: shlink
              version: 5.1.8
              packages:
                - name: shlink
                  purl: pkg:composer/shlinkio/shlink@5.1.8
                  license: MIT
            uid: 0
            gid: 0
          - url: https://raw.githubusercontent.com/shlinkio/shlink/4a642689caf19e9dace0f709b08334db25519f16/docker/docker-entrypoint.sh
            checksum: sha256:a173d5eaa0be9353921d841b4be0c9a3276450b20adaaf7b6ac5e367c3380156
            path: ${source.dir}/docker-entrypoint.sh
            spdx:
              name: shlink-docker-entrypoint
              version: 5.1.8
              packages:
                - name: shlink-docker-entrypoint
                  purl: pkg:github/shlinkio/shlink@5.1.8#docker/docker-entrypoint.sh
                  license: MIT
            uid: 0
            gid: 0
          - url: https://raw.githubusercontent.com/shlinkio/shlink/4a642689caf19e9dace0f709b08334db25519f16/docker/config/php.ini
            checksum: sha256:ff60f90cbb6892083ba0f43468e33b421d00b944ae5c24cb9b8a4df8eff8cdb8
            path: ${source.dir}/docker-php.ini
            spdx:
              name: shlink-docker-php-ini
              version: 5.1.8
              packages:
                - name: shlink-docker-php-ini
                  purl: pkg:github/shlinkio/shlink@5.1.8#docker/config/php.ini
                  license: MIT
            uid: 0
            gid: 0
          - url: git+https://github.com/roadrunner-server/roadrunner.git#v2025.1.15
            checksum: 321b817fab1056e404533ca1ddd200e77d1525fd
            path: /go/src/github.com/roadrunner-server/roadrunner
            spdx:
              name: roadrunner
              version: 2025.1.15
              packages:
                - name: roadrunner
                  purl: pkg:github/roadrunner-server/roadrunner@2025.1.15
                  license: MIT
            uid: 0
            gid: 0
      pipeline:
        - name: stage shlink tree
          runs: |
            set -eux -o pipefail

            workdir=$(mktemp -d)
            unzip -q "${source.dir}/shlink-dist.zip" -d "$workdir"
            top=$(find "$workdir" -mindepth 1 -maxdepth 1 -type d)
            test -n "$top"
            test "$(printf '%s\n' "$top" | wc -l)" -eq 1
            mkdir -p "${target.dir}/etc" "${target.dir}/usr/bin"
            if [ -e "${target.dir}/etc/shlink" ]; then
              rm -r "${target.dir}/etc/shlink"
            fi
            cp -a "$top" "${target.dir}/etc/shlink"
            test -f "${target.dir}/etc/shlink/bin/cli"
            test -f "${target.dir}/etc/shlink/vendor/composer/installed.json"
            test -f "${target.dir}/etc/shlink/config/roadrunner/.rr.yml"
            install -m 0644 "${source.dir}/docker-entrypoint.sh" "${target.dir}/etc/shlink/docker-entrypoint.sh"
            install -m 0644 "${source.dir}/docker-php.ini" "${target.dir}/etc/shlink/docker-php.ini"
            chmod 0755 "${target.dir}/etc/shlink/bin/cli"
            ln -s ../../etc/shlink/bin/cli "${target.dir}/usr/bin/shlink"
            test "$(readlink "${target.dir}/usr/bin/shlink")" = "../../etc/shlink/bin/cli"
            grep -q "EnvVars::isDevEnv() ? 'latest' : '5.1.8'" "${target.dir}/etc/shlink/module/Core/src/Config/Options/AppOptions.php"
            jq -e --arg v "v2025.1.15" 'any(.packages[]; .name=="spiral/roadrunner" and .version==$v)' "${target.dir}/etc/shlink/vendor/composer/installed.json" > /dev/null
        - name: update go dependencies
          uses: go/bump@v2
          with:
            deps:
              - github.com/gofiber/fiber/v2@v2.52.14
              - github.com/klauspost/compress@v1.20.3
              - github.com/rabbitmq/amqp091-go@v1.14.0
              - go.opentelemetry.io/otel@v1.45.0
              - go.opentelemetry.io/otel/exporters/otlp/otlptrace@v1.45.0
              - go.opentelemetry.io/otel/exporters/otlp/otlptrace/otlptracegrpc@v1.45.0
              - go.opentelemetry.io/otel/exporters/otlp/otlptrace/otlptracehttp@v1.45.0
              - go.opentelemetry.io/otel/exporters/zipkin@v1.45.0
              - go.opentelemetry.io/otel/sdk@v1.47.0
              - golang.org/x/crypto@v0.58.0
              - golang.org/x/net@v0.61.0
              - golang.org/x/text@v0.43.0
            download: true
            tidy: true
        - uses: go/hermetic@v1
        - name: build roadrunner
          uses: go/build@v1
          with:
            fips: false
            ldflags:
              - -s
              - -X github.com/roadrunner-server/roadrunner/v2025/internal/meta.version=2025.1.15
              - -X github.com/roadrunner-server/roadrunner/v2025/internal/meta.buildTime=${SOURCE_DATE_EPOCH}
            output: ${target.dir}/etc/shlink/bin/rr
            packages: ./cmd/rr
        - name: assert roadrunner
          runs: |
            set -eux -o pipefail

            chmod 0755 "${target.dir}/etc/shlink/bin/rr"
            test -x "${target.dir}/etc/shlink/bin/rr"
            if ldd "${target.dir}/etc/shlink/bin/rr" > /tmp/rr-ldd 2>&1; then
              echo "rr is dynamically linked" >&2
              cat /tmp/rr-ldd >&2
              exit 1
            fi
            grep -Eq 'not a dynamic|Not a valid dynamic' /tmp/rr-ldd
            version_out=$("${target.dir}/etc/shlink/bin/rr" --version)
            printf '%s\n' "$version_out" | grep -q "rr version 2025.1.15"
        - name: composer dependencies sbom
          uses: sbom@v1
          with:
            extra-scanners: php-composer-installed-cataloger
            prefix: shlink-php
            source: ${target.dir}/etc/shlink
        - name: roadrunner module sbom
          uses: sbom@v1
          with:
            extra-scanners: go-module-binary-cataloger
            prefix: shlink-rr
            source: ${target.dir}/etc/shlink/bin/rr
        - name: merge sbom and compare go modules
          runs: |
            set -eux -o pipefail

            test -s /opt/docker/sbom/shlink/.spdx.shlink.json
            test -s /opt/docker/sbom/shlink-php/.spdx.shlink-php.json
            test -s /opt/docker/sbom/shlink-rr/.spdx.shlink-rr.json
            mkdir -p "/opt/docker/sbom/shlink-5"
            jq -s '.[0] as $a | .[1] as $b | .[2] as $c | $a | .packages = ((.packages // []) + ($b.packages // []) + ($c.packages // []))' \
              /opt/docker/sbom/shlink/.spdx.shlink.json \
              /opt/docker/sbom/shlink-php/.spdx.shlink-php.json \
              /opt/docker/sbom/shlink-rr/.spdx.shlink-rr.json \
              > "/opt/docker/sbom/shlink-5/.spdx.shlink-5.json"
            test -s "/opt/docker/sbom/shlink-5/.spdx.shlink-5.json"
            jq -r '.packages[]?.externalRefs[]? | select(.referenceType=="purl") | .referenceLocator' \
              "/opt/docker/sbom/shlink-5/.spdx.shlink-5.json" > /tmp/shlink-purls.txt
            grep -q '^pkg:golang/' /tmp/shlink-purls.txt
            grep -q 'pkg:composer/spiral/roadrunner@' /tmp/shlink-purls.txt
            grep -q '^pkg:composer/shlinkio/shlink@5.1.8$' /tmp/shlink-purls.txt
            go version -m "${target.dir}/etc/shlink/bin/rr" | while read -r kind mod ver _; do
              case "$kind" in
                dep | mod) printf '%s %s\n' "$mod" "$ver" ;;
              esac
            done > /tmp/go-mods.txt
            test -s /tmp/go-mods.txt
            missing=0
            while read -r mod ver; do
              lower=$(printf '%s' "$mod" | tr '[:upper:]' '[:lower:]')
              enc=${ver//+/%2B}
              if grep -q "pkg:golang/${lower}@${ver}" /tmp/shlink-purls.txt; then
                continue
              fi
              if grep -q "pkg:golang/${lower}@${enc}" /tmp/shlink-purls.txt; then
                continue
              fi
              echo "missing purl for ${mod} ${ver}" >&2
              missing=1
            done < /tmp/go-mods.txt
            test "$missing" -eq 0
            mkdir -p "${target.dir}/opt/docker/sbom"
            cp -a "/opt/docker/sbom/shlink-5" "${target.dir}/opt/docker/sbom/"
            test -s "${target.dir}/opt/docker/sbom/shlink-5/.spdx.shlink-5.json"
            printf '%s\n' "$SOURCE_DATE_EPOCH" > /src/source-date-epoch
            test -s /src/source-date-epoch
        - uses: dhi/build-pkg:0
          with:
            conflicts: shlink-5-fips
            depends:
              - php-8.5
              - bash
              - coreutils
              - dash
            description: Self-hosted URL shortener
            files:
              - etc/shlink
              - usr/bin/shlink
              - opt/docker/sbom/shlink-5
            license: MIT
            name: shlink-5
            rel: 0
            url: https://shlink.io
            version: 5.1.8
          runs: |
            set -eux -o pipefail

            read -r SOURCE_DATE_EPOCH < /src/source-date-epoch
            export SOURCE_DATE_EPOCH
            test -n "$SOURCE_DATE_EPOCH"
            exec /build-pkg
os-release:
  name: Docker Hardened Images (Debian)
  id: debian
  version-id: "13"
  version-codename: trixie
  pretty-name: Docker Hardened Images/Debian GNU/Linux 13 (trixie)
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
