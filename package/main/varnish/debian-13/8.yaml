# syntax=dhi.io/build:2-debian13

image: dhi.io/pkg-varnish
variant: runtime
tags:
  - 8.0.0
  - 8.0.0-r0
  - 8.0.0-debian13
  - 8.0.0-r0-debian13
platforms:
  - linux/amd64
  - linux/arm64
dates:
  release: "2025-09-15"
  end-of-life: "2026-09-15"
vars:
  COMMIT_SHA: 71d4d75665f4d1949f7eeca28092a12df7037f3a
  PACKAGE_NAME: varnish-8.0
  REL: "0"
  SEMVER_MAJOR_MINOR_VERSION: "8.0"
  SEMVER_MAJOR_VERSION: "8"
  SEMVER_VERSION: 8.0.0
  VARNISH_GITHUB_REPO: varnishcache/varnish-cache
  VERSION: 8.0.0
contents:
  packages:
    - base-files
  builds:
    - name: varnish
      work-dir: ${source.dir}
      contents:
        packages:
          - autoconf
          - automake
          - bash
          - ca-certificates
          - coreutils
          - diffutils
          - file
          - findutils
          - gawk
          - gcc
          - grep
          - sed
          - libc6-dev
          - libssl-dev
          - libedit-dev
          - libjemalloc-dev
          - libncurses-dev
          - libpcre2-dev
          - libunwind-dev
          - libtool
          - make
          - pkg-config
          - python3
          - python3-docutils
          - python3-sphinx
          - tar
        files:
          - url: git+https://github.com/varnishcache/varnish-cache.git#varnish-8.0.0
            checksum: 71d4d75665f4d1949f7eeca28092a12df7037f3a
            path: ${source.dir}
            spdx:
              name: varnish
              version: 8.0.0
              packages:
                - name: varnish
                  purl: pkg:dhi/varnish@8.0.0
                  license: BSD-2-Clause
            uid: 0
            gid: 0
      pipeline:
        - name: autogen
          runs: |
            set -eux -o pipefail

            sh autogen.sh
        - name: configure
          runs: |
            set -eux -o pipefail

            ./configure \
              --prefix=/usr \
              --sysconfdir=/etc \
              --localstatedir=/var/lib \
              --with-jemalloc \
              --disable-dependency-tracking
        - name: compile
          runs: |
            set -eux -o pipefail

            make -j "$(nproc)"
        - name: install
          runs: |
            set -eux -o pipefail

            make install DESTDIR="${target.dir}"

            mkdir -p "${target.dir}/etc/varnish"
            cp etc/example.vcl "${target.dir}/etc/varnish/default.vcl"
        - uses: dhi/build-pkg:0
          with:
            depends:
              - libc6
              - libedit2
              - libgcc-s1
              - libjemalloc2
              - libncursesw6
              - libpcre2-8-0
              - libssl3t64
              - libtinfo6
              - libunwind8
            description: Varnish Cache HTTP accelerator
            files:
              - usr/sbin/varnishd
              - usr/bin/varnishadm
              - usr/bin/varnishlog
              - usr/bin/varnishstat
              - usr/bin/varnishhist
              - usr/bin/varnishncsa
              - usr/bin/varnishtop
              - usr/bin/varnishtest
              - usr/lib
              - usr/include/varnish
              - usr/share/varnish
              - etc/varnish
            formats:
              - deb
            license: BSD-2-Clause
            name: varnish-8.0
            rel: 0
            url: https://varnish-cache.org/
            version: 8.0.0
os-release:
  name: Docker Hardened Images (Debian)
  id: debian
  version-id: "13"
  version-codename: trixie
  pretty-name: Docker Hardened Images/Debian GNU/Linux 13 (trixie)
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
