# syntax=dhi.io/build:2-alpine3.24

name: .NET 11.x runtime
image: dhi.io/pkg-dotnet11-runtime
variant: runtime
tags:
  - 11-alpine3.24
  - 11.0-alpine3.24
  - 11.0.0-r0-alpine3.24
platforms:
  - linux/amd64
  - linux/arm64
vars:
  ARCH: '#{ target.arch == "amd64" ? "x64" : "arm64" }'
  PACKAGE_NAME: dotnet11-runtime
  REL: "0"
  SEMVER_MAJOR_MINOR_VERSION: "11.0"
  SEMVER_MAJOR_VERSION: "11"
  SEMVER_VERSION: 11.0.0
  VERSION: 11.0.0
contents:
  repositories:
    - https://dhi.io/apk/alpine/v3.24/main
    - https://dhi.io/apk/alpine/v3.23/main
    - https://dl-cdn.alpinelinux.org/alpine/v3.24/main
    - https://dl-cdn.alpinelinux.org/alpine/v3.24/community
  keyring:
    - https://dhi.io/keyring/dhi-apk@docker-0F81AD7700D99184.rsa.pub
  packages:
    - alpine-baselayout-data
  builds:
    - name: dotnet-runtime
      work-dir: ${source.dir}
      contents:
        packages:
          - bash
          - coreutils
          - jq
          - tar
        files:
          - url: https://raw.githubusercontent.com/dotnet/core/refs/heads/main/release-notes/11.0/releases.json
            path: ${source.dir}/releases.json
            uid: 0
            gid: 0
          - url: https://builds.dotnet.microsoft.com/dotnet/Runtime/11.0.0/dotnet-runtime-11.0.0-linux-musl-${ARCH}.tar.gz
            path: ${source.dir}/dotnet-runtime.tar.gz
            spdx:
              name: dotnet-runtime
              version: 11.0.0
              packages:
                - name: dotnet-runtime
                  purl: pkg:dhi/microsoft/dotnet-runtime@11.0.0
                  license: MIT
            uid: 0
            gid: 0
          - url: https://builds.dotnet.microsoft.com/dotnet/aspnetcore/Runtime/11.0.0/aspnetcore-runtime-11.0.0-linux-musl-${ARCH}.tar.gz
            path: ${source.dir}/aspnetcore-runtime.tar.gz
            spdx:
              name: aspnetcore-runtime
              version: 11.0.0
              packages:
                - name: aspnetcore-runtime
                  purl: pkg:dhi/microsoft/aspnetcore-runtime@11.0.0
                  license: MIT
            uid: 0
            gid: 0
      pipeline:
        - name: verify
          shell: /bin/bash
          runs: |
            set -eux -o pipefail

            hash_of() {
              jq -r --arg version "11.0.0" --arg product "$1" --arg name "$2" \
                '.releases[] | select(.["release-version"] == $version) | .[$product].files[] | select(.name == $name) | .hash' \
                "${source.dir}/releases.json"
            }

            runtime_hash="$(hash_of runtime "dotnet-runtime-linux-musl-${ARCH}.tar.gz")"
            test -n "${runtime_hash}"
            echo "${runtime_hash}  ${source.dir}/dotnet-runtime.tar.gz" | sha512sum -c -

            aspnetcore_hash="$(hash_of aspnetcore-runtime "aspnetcore-runtime-linux-musl-${ARCH}.tar.gz")"
            test -n "${aspnetcore_hash}"
            echo "${aspnetcore_hash}  ${source.dir}/aspnetcore-runtime.tar.gz" | sha512sum -c -
        - name: install
          shell: /bin/bash
          runs: |
            set -eux -o pipefail

            root="${target.dir}/usr/lib/dotnet"
            mkdir -p "${root}" "${target.dir}/usr/bin" "${target.dir}/etc/dotnet" \
              "${target.dir}/usr/share/licenses/dotnet11"

            tar -xzf "${source.dir}/dotnet-runtime.tar.gz" --no-same-owner -C "${root}"
            tar -xzf "${source.dir}/aspnetcore-runtime.tar.gz" --no-same-owner -C "${root}" \
              ./shared/Microsoft.AspNetCore.App

            mv "${root}/LICENSE.txt" "${root}/ThirdPartyNotices.txt" \
              "${target.dir}/usr/share/licenses/dotnet11/"

            test -x "${root}/dotnet"
            test -x "${root}/dnx"
            test -d "${root}/shared/Microsoft.NETCore.App/11.0.0"
            test -d "${root}/shared/Microsoft.AspNetCore.App/11.0.0"
            test -f "${root}/host/fxr/11.0.0/libhostfxr.so"

            ln -s ../lib/dotnet/dotnet "${target.dir}/usr/bin/dotnet"
            ln -s ../lib/dotnet/dnx "${target.dir}/usr/bin/dnx"
            echo /usr/lib/dotnet > "${target.dir}/etc/dotnet/install_location"
            echo /usr/lib/dotnet > "${target.dir}/etc/dotnet/install_location_${ARCH}"
        - uses: dhi/build-pkg:0
          with:
            depends:
              - dotnet11-hostfxr
              - icu-data-full
              - icu-libs
              - krb5-libs
              - libgcc
              - libintl
              - libssl3
              - libstdc++
              - zlib
            description: The .NET 11 runtime
            files:
              - usr/lib/dotnet/shared/Microsoft.NETCore.App
              - usr/share/licenses/dotnet11
            formats:
              - apk
            license: MIT
            name: dotnet11-runtime
            rel: 0
            subpackages:
              - depends:
                  - '!dotnet-host'
                description: A generic driver for the .NET 11 command line interface
                files:
                  - usr/lib/dotnet/dotnet
                  - usr/lib/dotnet/dnx
                  - usr/bin/dotnet
                  - usr/bin/dnx
                  - etc/dotnet
                name: dotnet11-host
              - depends:
                  - dotnet11-host
                description: The .NET 11 host resolver
                files:
                  - usr/lib/dotnet/host
                name: dotnet11-hostfxr
              - depends:
                  - dotnet11-runtime
                description: The ASP.NET Core 11 runtime
                files:
                  - usr/lib/dotnet/shared/Microsoft.AspNetCore.App
                name: aspnetcore11-runtime
            url: https://dotnet.microsoft.com
            version: 11.0.0
os-release:
  name: Docker Hardened Images (Alpine)
  id: alpine
  version-id: "3.24"
  pretty-name: Docker Hardened Images/Alpine Linux v3.24
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
annotations:
  org.opencontainers.image.description: The .NET 11 runtime packages
  org.opencontainers.image.licenses: MIT
