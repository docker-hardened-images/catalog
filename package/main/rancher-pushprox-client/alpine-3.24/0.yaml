# syntax=dhi.io/build:2-alpine3.24

image: dhi.io/pkg-rancher-pushprox-client
variant: runtime
tags:
  - 0.1.11-alpine3.24
  - 0.1.11-r0-alpine3.24
platforms:
  - linux/amd64
  - linux/arm64
vars:
  COMMIT_SHA: 7faa61631ac414ec0cb2425f4ab5c6a790ab4ffa
  GO_TOOLCHAIN_VERSION: 1.27.3
  GOLANG_VERSION: 1.27.3-r0
  PACKAGE_NAME: rancher-pushprox-client-0
  REL: "0"
  SEMVER_MAJOR_MINOR_VERSION: "0.1"
  SEMVER_MAJOR_VERSION: "0"
  SEMVER_VERSION: 0.1.11
  VERSION: 0.1.11
contents:
  repositories:
    - https://dhi.io/apk/alpine/v3.24/main
    - https://dhi.io/apk/alpine/v3.23/main
    - https://dl-cdn.alpinelinux.org/alpine/v3.24/main
    - https://dl-cdn.alpinelinux.org/alpine/v3.24/community
  keyring:
    - https://dhi.io/keyring/dhi-apk@docker-0F81AD7700D99184.rsa.pub
  packages:
    - alpine-baselayout-data
  builds:
    - name: rancher-pushprox-client-0
      work-dir: /go/src/github.com/rancher/PushProx
      contents:
        packages:
          - busybox
          - bash
          - ca-certificates-bundle
          - coreutils
          - findutils
          - mawk
          - sed
          - golang-1.27=1.27.3-r0
          - golang-1.27-oci-config=1.27.3-r0
        files:
          - url: git+https://github.com/rancher/PushProx.git#v0.1.11
            checksum: 7faa61631ac414ec0cb2425f4ab5c6a790ab4ffa
            path: /go/src/github.com/rancher/PushProx
            spdx:
              name: pushprox
              version: 0.1.11
              packages:
                - name: pushprox
                  purl: pkg:golang/github.com/rancher/pushprox@0.1.11
                  license: Apache-2.0
            uid: 0
            gid: 0
          - url: https://raw.githubusercontent.com/golang/go/go1.27.3/LICENSE
            checksum: sha256:911f8f5782931320f5b8d1160a76365b83aea6447ee6c04fa6d5591467db9dad
            path: ${source.dir}/go-LICENSE
            uid: 0
            gid: 0
          - url: https://raw.githubusercontent.com/golang/go/go1.27.3/PATENTS
            checksum: sha256:96f408bfae65bf137fc2525d3ecb030271c50c1e90799f87abf8846d8dd505cc
            path: ${source.dir}/go-PATENTS
            uid: 0
            gid: 0
      pipeline:
        - name: update go dependencies
          uses: go/bump@v2
          with:
            deps:
              - golang.org/x/sys@v0.44.0
            download: true
        - uses: go/hermetic@v1
        - name: test
          runs: |
            set -eux -o pipefail

            if [ "false" = "true" ]; then
              export GOFIPS140=v1.0.0
              export GODEBUG=fips140=on
            fi

            cd /go/src/github.com/rancher/PushProx
            go test -count=1 ./...
        - name: stamp module version
          runs: |
            set -eux -o pipefail

            src=/go/src/github.com/rancher/PushProx
            if grep -qE '^[[:space:]]*(replace|exclude|godebug)([[:space:]]|\()' "$src/go.mod"; then
              echo "$src/go.mod has replace, exclude or godebug directives, which the wrapper module drops" >&2
              exit 1
            fi
            go_line=$(awk '$1=="go"{print $2; exit}' "$src/go.mod")
            test -n "$go_line"
            mkdir -p /go/src/dhi-pushprox-build
            cd /go/src/dhi-pushprox-build
            go mod init dhi.build.pushprox
            go mod edit -go="$go_line"
            go mod edit -require=github.com/rancher/pushprox@v0.1.11
            go mod edit -replace=github.com/rancher/pushprox="$src"
            cp "$src/go.sum" go.sum
        - name: build
          uses: go/build@v1
          work-dir: /go/src/dhi-pushprox-build
          with:
            extra-env: GOPROXY=off GOSUMDB=off GOFLAGS=-mod=mod
            fips: false
            ldflags:
              - -s
              - -w
            output: ${target.dir}/usr/bin/pushprox-client
            packages: github.com/rancher/pushprox/cmd/client
        - name: build dev
          uses: go/build@v1
          work-dir: /go/src/dhi-pushprox-build
          with:
            extra-env: GOPROXY=off GOSUMDB=off GOFLAGS=-mod=mod
            fips: false
            ldflags:
              - -linkmode=internal
            output: ${target.dir}/usr/bin/pushprox-client-dev
            packages: github.com/rancher/pushprox/cmd/client
            strip: false
        - name: verify build info
          runs: |
            set -eux -o pipefail

            src=/go/src/github.com/rancher/PushProx
            runtime=${target.dir}/usr/bin/pushprox-client
            devbin=${target.dir}/usr/bin/pushprox-client-dev
            test -x "$runtime"
            test -x "$devbin"

            for bin in "$runtime" "$devbin"; do
              go version -m "$bin" > /tmp/buildinfo.txt
              grep -qE '^[[:space:]]+build[[:space:]]+CGO_ENABLED=0$' /tmp/buildinfo.txt
              grep -qxF "$(printf '\tmod\tgithub.com/rancher/pushprox\tv%s' "0.1.11")" /tmp/buildinfo.txt
              grep -qxF "$(printf '\t=>\t%s\t(devel)\t' "$src")" /tmp/buildinfo.txt
              if [ "false" = "true" ]; then
                grep -qE '^[[:space:]]+build[[:space:]]+GOFIPS140=v1\.0\.0(-[0-9a-f]+)?$' /tmp/buildinfo.txt
                grep -qE '^[[:space:]]+build[[:space:]]+DefaultGODEBUG=(.*,)?fips140=on(,|$)' /tmp/buildinfo.txt
              elif grep -q fips140 /tmp/buildinfo.txt; then
                echo "$bin: FIPS build settings on a non-FIPS build" >&2
                exit 1
              fi
            done

            go version -m "$runtime" | grep -qxF "$(printf '\tbuild\t-trimpath=true')"
            if go version -m "$devbin" | grep -E -- '-trimpath=true'; then
              echo "$devbin: dev binary must keep paths" >&2
              exit 1
            fi
            go version -m "$devbin" | grep -qxF "$(printf '\tbuild\t-ldflags=-linkmode=internal')" || {
              echo "$devbin: dev ldflags must be -linkmode=internal" >&2
              exit 1
            }
            go version -m "$runtime" | grep -qF -- '-ldflags="-s -w"'
        - name: third-party notices
          runs: |
            set -eux -o pipefail

            wrap=/go/src/dhi-pushprox-build
            runtime=${target.dir}/usr/bin/pushprox-client
            lic=${target.dir}/usr/share/licenses/rancher-pushprox-client
            toolchain=1.27.3
            goroot=$(go env GOROOT)
            tmp=$(mktemp -d)

            cd "$wrap"
            export CGO_ENABLED=0 GOFLAGS=-mod=mod GOPROXY=off GOSUMDB=off

            go list -deps -f '{{if .Standard}}std {{.Dir}}{{else if .Module}}{{if not .Module.Main}}mod {{.Module.Path}} {{.Module.Version}} {{.Module.Dir}} {{.Dir}}{{end}}{{end}}' github.com/rancher/pushprox/cmd/client \
              | grep -v '^mod github.com/rancher/pushprox ' | grep -v '^$' | LC_ALL=C sort -u > "$tmp/linked"
            test -s "$tmp/linked"

            go version -m "$runtime" | awk '$1=="dep" && $2!="github.com/rancher/pushprox" {print $2, $3}' | LC_ALL=C sort -u > "$tmp/bin-mods"
            awk '$1=="mod" {print $2, $3}' "$tmp/linked" | LC_ALL=C sort -u > "$tmp/linked-mods"
            test -s "$tmp/bin-mods"
            if ! cmp -s "$tmp/bin-mods" "$tmp/linked-mods"; then
              echo "linked module set differs from the binary's build info" >&2
              diff "$tmp/bin-mods" "$tmp/linked-mods" >&2 || true
              exit 1
            fi

            awk '$1=="mod" {print $4}' "$tmp/linked" | LC_ALL=C sort -u | while read -r moddir; do
              test -d "$moddir"
              if ! find "$moddir" -maxdepth 1 -type f \( -iname 'LICENSE*' -o -iname 'LICENCE*' -o -iname 'COPYING*' \) | grep -q .; then
                echo "module directory $moddir has no root license file" >&2
                exit 1
              fi
            done

            : > "$tmp/dirs"
            while read -r kind a b c d; do
              if [ "$kind" = "std" ]; then
                root="$goroot/src"
                pkgdir="$a"
                tag="go@$toolchain/src"
              else
                root="$c"
                pkgdir="$d"
                tag="$a@$b"
              fi
              case "$pkgdir" in
                "$root" | "$root"/*) ;;
                *)
                  echo "package directory $pkgdir is not under $root" >&2
                  exit 1
                  ;;
              esac
              dir="$pkgdir"
              while :; do
                printf '%s\t%s\t%s\n' "$root" "$dir" "$tag" >> "$tmp/dirs"
                if [ "$dir" = "$root" ]; then break; fi
                dir=$(dirname "$dir")
              done
            done < "$tmp/linked"
            LC_ALL=C sort -u "$tmp/dirs" -o "$tmp/dirs"

            : > "$tmp/files"
            while IFS="$(printf '\t')" read -r root dir tag; do
              find "$dir" -maxdepth 1 -type f \( -iname 'LICENSE*' -o -iname 'LICENCE*' -o -iname 'COPYING*' -o -iname 'NOTICE*' -o -iname 'PATENTS*' \) \
                | while read -r f; do printf '%s\t%s\t%s\n' "$root" "$f" "$tag"; done >> "$tmp/files"
            done < "$tmp/dirs"
            LC_ALL=C sort -u "$tmp/files" -o "$tmp/files"
            test -s "$tmp/files"

            rm -rf "$lic/third-party"
            while IFS="$(printf '\t')" read -r root f tag; do
              rel=${f#"$root"/}
              install -D -m 0644 "$f" "$lic/third-party/$tag/$rel"
            done < "$tmp/files"

            install -D -m 0644 "${source.dir}/go-LICENSE" "$lic/third-party/go@$toolchain/LICENSE"
            install -D -m 0644 "${source.dir}/go-PATENTS" "$lic/third-party/go@$toolchain/PATENTS"
            test -s "$lic/third-party/go@$toolchain/LICENSE"

            rm -rf "$tmp"
        - name: stage sbom and license
          runs: |
            set -eux -o pipefail

            src=/go/src/github.com/rancher/PushProx
            license=$src/LICENSE
            test -s /opt/docker/sbom/pushprox/.spdx.pushprox.json
            grep -q 'Apache License' "$license"
            grep -q 'Version 2.0' "$license"

            lic=${target.dir}/usr/share/licenses/rancher-pushprox-client
            licdev=${target.dir}/usr/share/licenses/rancher-pushprox-client-dev
            install -d "${target.dir}/opt/docker/sbom" "${target.dir}/opt/docker/sbom-dev"
            cp -a /opt/docker/sbom/pushprox "${target.dir}/opt/docker/sbom/"
            cp -a /opt/docker/sbom/pushprox "${target.dir}/opt/docker/sbom-dev/"
            install -D -m 0644 "$license" "$lic/LICENSE"
            test -s "$lic/third-party/go@1.27.3/LICENSE"
            rm -rf "$licdev"
            cp -a "$lic" "$licdev"
        - uses: dhi/build-pkg:0
          with:
            depends:
              - ca-certificates-bundle
            description: Rancher PushProx client, which registers with a PushProx proxy and serves Prometheus scrapes
            files:
              - usr/bin/pushprox-client
              - opt/docker/sbom/pushprox
              - usr/share/licenses/rancher-pushprox-client
            license: Apache-2.0
            name: rancher-pushprox-client-0
            rel: 0
            subpackages:
              - depends:
                  - ca-certificates-bundle
                files:
                  - path: usr/bin/pushprox-client
                    source: usr/bin/pushprox-client-dev
                  - path: opt/docker/sbom/pushprox
                    source: opt/docker/sbom-dev/pushprox
                  - path: usr/share/licenses/rancher-pushprox-client
                    source: usr/share/licenses/rancher-pushprox-client-dev
                name: rancher-pushprox-client-0-dev
            url: https://github.com/rancher/PushProx
            version: 0.1.11
os-release:
  name: Docker Hardened Images (Alpine)
  id: alpine
