# syntax=dhi.io/build:2-debian13

image: dhi.io/pkg-k8s-sidecar
variant: runtime
tags:
  - 2.10.3
  - 2.10.3-r1
  - 2.10.3-debian13
  - 2.10.3-r1-debian13
platforms:
  - linux/amd64
  - linux/arm64
dates:
  release: "2024-01-01"
vars:
  COMMIT_SHA: f17a6a0e8791a517209a22e48cd5b6c946ebf5dd
  PYTHON_MINOR: "3.14"
  PYTHON_VERSION: 3.14.7-1
  REL: "1"
  SEMVER_MAJOR_MINOR_VERSION: "2.10"
  SEMVER_MAJOR_VERSION: "2"
  SEMVER_VERSION: 2.10.3
  VERSION: 2.10.3
contents:
  packages:
    - base-files
  builds:
    - name: k8s-sidecar
      work-dir: ${source.dir}
      caches:
        - path: /root/.cache/pip
      contents:
        repositories:
          - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
        keyring:
          - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
        packages:
          - bash
          - build-essential
          - ca-certificates
          - coreutils
          - findutils
          - git
          - gawk
          - grep
          - libffi-dev
          - libssl-dev
          - libstdc++6
          - sed
          - libpython-3.14-minimal=3.14.7-1
          - libpython-3.14-stdlib=3.14.7-1
          - libpython-3.14=3.14.7-1
          - python-3.14-minimal=3.14.7-1
          - python-3.14=3.14.7-1
          - python-3.14-dev=3.14.7-1
          - python3-pip
          - python3-setuptools
          - python3-venv
          - python3-wheel
        files:
          - url: git+https://github.com/kiwigrid/k8s-sidecar.git#2.10.3
            checksum: f17a6a0e8791a517209a22e48cd5b6c946ebf5dd
            path: ${source.dir}/src
            spdx:
              name: k8s-sidecar
              version: 2.10.3
              packages:
                - name: k8s-sidecar
                  purl: pkg:github/kiwigrid/k8s-sidecar@2.10.3
                  license: MIT
            uid: 0
            gid: 0
      pipeline:
        - name: build venv at final path and stage it
          privileged: true
          runs: |
            set -eux -o pipefail

            export SOURCE_DIR="${source.dir}" TARGET_DIR="${target.dir}" PYTHON_BIN=/usr/bin/python3.14
            bash "${source.dir}/build-venv.sh"
        - name: python dependencies sbom
          uses: sbom@v1
          with:
            extra-scanners: python-package-cataloger
            prefix: k8s-sidecar-python
            source: /usr/lib/k8s-sidecar/.venv
        - uses: dhi/build-pkg:0
          with:
            deb:
              depends:
                - libffi8
                - libstdc++6
                - libgcc-s1
            depends:
              - python-3.14
            description: Kubernetes sidecar for configmap and secret synchronization
            files:
              - usr/lib/k8s-sidecar
              - usr/bin/k8s-sidecar
            formats:
              - deb
            license: MIT
            name: k8s-sidecar
            rel: 1
            url: https://github.com/kiwigrid/k8s-sidecar
            version: 2.10.3
      paths:
        - type: file
          path: ${source.dir}/build-venv.sh
          uid: 0
          gid: 0
          mode: "0755"
          source: package/main/k8s-sidecar/build-venv.sh
os-release:
  name: Docker Hardened Images (Debian)
  id: debian
  version-id: "13"
  version-codename: trixie
  pretty-name: Docker Hardened Images/Debian GNU/Linux 13 (trixie)
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
