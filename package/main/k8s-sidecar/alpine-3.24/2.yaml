# syntax=dhi.io/build:2-alpine3.24

image: dhi.io/pkg-k8s-sidecar
variant: runtime
tags:
  - 2.11.2-alpine3.24
  - 2.11.2-r0-alpine3.24
platforms:
  - linux/amd64
  - linux/arm64
dates:
  release: "2024-01-01"
vars:
  COMMIT_SHA: a79d2dcd0b27cfc97b903ac52b5732aa37fa9e01
  PYTHON_VERSION: 3.14.7-r1
  REL: "0"
  SEMVER_MAJOR_MINOR_VERSION: "2.11"
  SEMVER_MAJOR_VERSION: "2"
  SEMVER_VERSION: 2.11.2
  VERSION: 2.11.2
contents:
  repositories:
    - https://dhi.io/apk/alpine/v3.24/main
    - https://dhi.io/apk/alpine/v3.23/main
    - https://dl-cdn.alpinelinux.org/alpine/v3.24/main
    - https://dl-cdn.alpinelinux.org/alpine/v3.24/community
  keyring:
    - https://dhi.io/keyring/dhi-apk@docker-0F81AD7700D99184.rsa.pub
  packages:
    - alpine-baselayout-data
  builds:
    - name: k8s-sidecar
      work-dir: ${source.dir}
      caches:
        - path: /root/.cache/pip
      contents:
        packages:
          - bash
          - build-base
          - ca-certificates-bundle
          - coreutils
          - findutils
          - git
          - gawk
          - grep
          - libffi-dev
          - openssl-dev
          - sed
          - python-3.14=3.14.7-r1
          - python-3.14-dev=3.14.7-r1
          - py3-pip
          - py3-setuptools
          - py3-wheel
        files:
          - url: git+https://github.com/kiwigrid/k8s-sidecar.git#2.11.2
            checksum: a79d2dcd0b27cfc97b903ac52b5732aa37fa9e01
            path: ${source.dir}/src
            spdx:
              name: k8s-sidecar
              version: 2.11.2
              packages:
                - name: k8s-sidecar
                  purl: pkg:github/kiwigrid/k8s-sidecar@2.11.2
                  license: MIT
            uid: 0
            gid: 0
      pipeline:
        - name: build venv at final path and stage it
          privileged: true
          runs: |
            set -eux -o pipefail

            export SOURCE_DIR="${source.dir}" TARGET_DIR="${target.dir}" PYTHON_BIN=/usr/bin/python3.14
            bash "${source.dir}/build-venv.sh"
        - name: python dependencies sbom
          uses: sbom@v1
          with:
            extra-scanners: python-package-cataloger
            prefix: k8s-sidecar-python
            source: /usr/lib/k8s-sidecar/.venv
        - uses: dhi/build-pkg:0
          with:
            apk:
              depends:
                - libffi
                - libstdc++
                - libgcc
            depends:
              - python-3.14
            description: Kubernetes sidecar for configmap and secret synchronization
            files:
              - usr/lib/k8s-sidecar
              - usr/bin/k8s-sidecar
            formats:
              - apk
            license: MIT
            name: k8s-sidecar
            rel: 0
            url: https://github.com/kiwigrid/k8s-sidecar
            version: 2.11.2
      paths:
        - type: file
          path: ${source.dir}/build-venv.sh
          uid: 0
          gid: 0
          mode: "0755"
          source: package/main/k8s-sidecar/build-venv.sh
os-release:
  name: Docker Hardened Images (Alpine)
  id: alpine
  version-id: "3.24"
  pretty-name: Docker Hardened Images/Alpine Linux v3.24
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
