# syntax=dhi.io/build:2-debian13

image: dhi.io/pkg-mcp-obsidian
variant: runtime
tags:
  - 0.2.2
  - 0.2.2-r1
  - 0.2.2-debian13
  - 0.2.2-r1-debian13
platforms:
  - linux/amd64
  - linux/arm64
vars:
  ARCH: '#{ target.arch == "amd64" ? "x86_64" : "aarch64" }'
  COMMIT_SHA: 32285e9ac07049a8a23ea7d7903603a3e48a1bf7
  PYTHON_MINOR: "3.14"
  PYTHON_VERSION: 3.14.6-6
  REL: "1"
  SEMVER_MAJOR_MINOR_VERSION: "0.2"
  SEMVER_MAJOR_VERSION: "0"
  SEMVER_VERSION: 0.2.2
  UV_VERSION: 0.12.3
  VERSION: 0.2.2
contents:
  packages:
    - base-files
  builds:
    - name: mcp-obsidian
      work-dir: ${source.dir}
      environment:
        UV_COMPILE_BYTECODE: "1"
      caches:
        - path: /root/.cache/uv
      contents:
        repositories:
          - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
        keyring:
          - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
        packages:
          - bash
          - ca-certificates
          - coreutils
          - findutils
          - git
          - gzip
          - sed
          - tar
          - libpython-3.14=3.14.6-6
          - libpython-3.14-minimal=3.14.6-6
          - libpython-3.14-stdlib=3.14.6-6
          - python-3.14-minimal=3.14.6-6
          - python-3.14=3.14.6-6
          - python-3.14-dev=3.14.6-6
        files:
          - url: https://github.com/astral-sh/uv/releases/download/0.12.3/uv-${ARCH}-unknown-linux-gnu.tar.gz
            path: ${source.dir}/uv-unknown-linux-gnu.tar.gz
            uid: 0
            gid: 0
          - url: git+https://github.com/MarkusPfundstein/mcp-obsidian.git#32285e9ac07049a8a23ea7d7903603a3e48a1bf7
            checksum: 32285e9ac07049a8a23ea7d7903603a3e48a1bf7
            path: ${source.dir}/mcp-obsidian
            spdx:
              name: mcp-obsidian
              version: 0.2.2
              packages:
                - name: mcp-obsidian
                  purl: pkg:dhi/mcp-obsidian@0.2.2
                  license: MIT
            uid: 0
            gid: 0
      pipeline:
        - name: setup uv
          runs: |
            set -eux -o pipefail

            mkdir -p /usr/local/bin
            tar -xzf "${source.dir}/uv-unknown-linux-gnu.tar.gz" -C /usr/local/bin --strip-components=1
            chmod +x /usr/local/bin/uv
        - name: patch dependencies
          work-dir: ${source.dir}/mcp-obsidian
          runs: |
            set -eux -o pipefail

            sed -i 's/pydantic-settings = ".*"/pydantic-settings = ">=2.14.2"/' pyproject.toml
        - name: build venv at final path and stage it
          privileged: true
          runs: |
            set -eux -o pipefail

            export SOURCE_DIR="${source.dir}" TARGET_DIR="${target.dir}" PYTHON_BIN=/usr/bin/python3.14
            bash "${source.dir}/build-venv.sh"
        - uses: dhi/build-pkg:0
          with:
            depends:
              - python-3.14
            description: Obsidian MCP server for Obsidian vaults via the Local REST API
            files:
              - usr/lib/mcp-obsidian
              - usr/bin/mcp-obsidian
            formats:
              - deb
            license: MIT
            name: mcp-obsidian
            rel: 1
            url: https://github.com/MarkusPfundstein/mcp-obsidian
            version: 0.2.2
      paths:
        - type: file
          path: ${source.dir}/build-venv.sh
          uid: 0
          gid: 0
          mode: "0755"
          source: package/main/mcp-obsidian/build-venv.sh
os-release:
  name: Docker Hardened Images (Debian)
  id: debian
  version-id: "13"
  version-codename: trixie
  pretty-name: Docker Hardened Images/Debian GNU/Linux 13 (trixie)
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
