            uid: 0
            gid: 0
          - url: https://raw.githubusercontent.com/docker-library/wordpress/ecc7cdbdf47591bfa14954933fa2ab4fcce46428/latest/php8.4/fpm/docker-entrypoint.sh
            checksum: sha256:4e925e60ccc324f3f5df8da39d518c88a6d2e1b228113811493c5a975ae9137b
