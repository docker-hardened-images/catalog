# syntax=dhi.io/build:2-debian13

image: dhi.io/pkg-ansible-operator-runtime
variant: runtime
tags:
  - 1.42.3
  - 1.42.3-r2
  - 1.42.3-debian13
  - 1.42.3-r2-debian13
platforms:
  - linux/amd64
  - linux/arm64
vars:
  CARGO_VERSION: 1.97.1-0
  COMMIT_SHA: 292a56a4877c8093037c0533f3ef3c7a6bbd78e2
  PYTHON_MINOR: "3.12"
  PYTHON_VERSION: 3.12.14-2
  REL: "2"
  RUSTC_VERSION: 1.97.1-0
  SEMVER_MAJOR_MINOR_VERSION: "1.42"
  SEMVER_MAJOR_VERSION: "1"
  SEMVER_VERSION: 1.42.3
  VERSION: 1.42.3
contents:
  repositories:
    - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
  keyring:
    - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
  packages:
    - base-files
  builds:
    - name: ansible-operator-runtime
      work-dir: ${source.dir}
      caches:
        - path: /root/.cargo
      contents:
        repositories:
          - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
        keyring:
          - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
        packages:
          - bash
          - build-essential
          - ca-certificates
          - cargo-1.97=1.97.1-0
          - coreutils
          - findutils
          - grep
          - jq
          - libc-bin
          - libcurl4t64
          - libffi-dev
          - libgcc-s1
          - libsqlite3-0
          - libssl-dev
          - libssl3t64
          - libstdc++6
          - pkg-config
          - rustc-1.97=1.97.1-0
          - sed
          - zlib1g
          - libpython-3.12-minimal=3.12.14-2
          - libpython-3.12-stdlib=3.12.14-2
          - libpython-3.12-dev=3.12.14-2
          - libpython-3.12=3.12.14-2
          - python-3.12-minimal=3.12.14-2
          - python-3.12=3.12.14-2
          - python-3.12-dev=3.12.14-2
          - python3-pip-whl
        files:
          - url: git+https://github.com/operator-framework/ansible-operator-plugins.git#v1.42.3
            checksum: 292a56a4877c8093037c0533f3ef3c7a6bbd78e2
            path: ${source.dir}/ansible-operator-plugins
            spdx:
              name: ansible-operator-plugins
              version: 1.42.3
              packages:
                - name: ansible-operator-http-events
                  purl: pkg:github/operator-framework/ansible-operator-plugins@v1.42.3#images/ansible-operator/ansible_runner_http
                  license: Apache-2.0
            uid: 0
            gid: 0
      pipeline:
        - name: build the ansible runtime venv
          privileged: true
          runs: |
            set -eux -o pipefail

            export SOURCE_DIR="${source.dir}" \
              TARGET_DIR="${target.dir}" \
              PYTHON_BIN=/usr/bin/python3.12
            bash "${source.dir}/build-runtime.sh"
        - uses: dhi/build-pkg:0
          with:
            depends:
              - python-3.12-minimal
              - libpython-3.12-stdlib
              - libffi8
              - libgcc-s1
              - libssl3t64
            description: Ansible runtime (ansible-core, ansible-runner, kubernetes client) for the Operator SDK ansible-operator
            files:
              - usr/lib/ansible-operator-runtime
              - usr/bin/ansible
              - usr/bin/ansible-config
              - usr/bin/ansible-console
              - usr/bin/ansible-doc
              - usr/bin/ansible-galaxy
              - usr/bin/ansible-inventory
              - usr/bin/ansible-playbook
              - usr/bin/ansible-pull
              - usr/bin/ansible-vault
              - usr/bin/ansible-runner
            formats:
              - deb
            license: GPL-3.0-or-later AND Apache-2.0
            name: ansible-operator-runtime
            rel: 2
            url: https://github.com/operator-framework/ansible-operator-plugins
            version: 1.42.3
      paths:
        - type: file
          path: ${source.dir}/build-runtime.sh
          uid: 0
          gid: 0
          mode: "0755"
          source: package/main/ansible-operator-runtime/build-runtime.sh
os-release:
  name: Docker Hardened Images (Debian)
  id: debian
  version-id: "13"
  version-codename: trixie
  pretty-name: Docker Hardened Images/Debian GNU/Linux 13 (trixie)
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
