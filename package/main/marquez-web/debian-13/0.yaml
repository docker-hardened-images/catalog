# syntax=dhi.io/build:2-debian13

image: dhi.io/pkg-marquez-web
variant: runtime
tags:
  - 0.51.1
  - 0.51.1-r1
  - 0.51.1-debian13
  - 0.51.1-r1-debian13
platforms:
  - linux/amd64
  - linux/arm64
dates:
  release: "2020-05-28"
vars:
  COMMIT_SHA: 27a4a1357d9078bc4e6738524dfe5ba9d77aa2df
  COREPACK_VERSION: 0.36.0-0
  DHI_TEST_DEB_EXPECTED_FILES: /usr/lib/marquez-web/setupProxy.js /usr/lib/marquez-web/entrypoint.sh /usr/lib/marquez-web/dist/index.html /usr/share/licenses/marquez-web-0/LICENSE /opt/docker/sbom/marquez-web-browser/.spdx.marquez-web-browser.json
  NODEJS_VERSION: 22.23.5-1
  NPM_VERSION: 11.21.3-2
  PACKAGE_NAME: marquez-web-0
  REL: "1"
  SEMVER_MAJOR_MINOR_VERSION: "0.51"
  SEMVER_MAJOR_VERSION: "0"
  SEMVER_VERSION: 0.51.1
  VERSION: 0.51.1
contents:
  repositories:
    - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
  keyring:
    - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
  packages:
    - base-files
  builds:
    - name: marquez-web
      work-dir: ${source.dir}/marquez/web
      caches:
        - path: /root/.npm
      contents:
        packages:
          - bash
          - ca-certificates
          - coreutils
          - findutils
          - git
          - grep
          - jq
          - libc6
          - libgcc-s1
          - libstdc++6
          - patch
          - sed
          - nodejs-22=22.23.5-1
          - npm=11.21.3-2
          - node-corepack=0.36.0-0
        files:
          - url: git+https://github.com/MarquezProject/marquez.git#0.51.1
            checksum: 27a4a1357d9078bc4e6738524dfe5ba9d77aa2df
            path: ${source.dir}/marquez
            spdx:
              name: marquez-web
              version: 0.51.1
              packages:
                - name: marquez-web
                  purl: pkg:github/MarquezProject/marquez@0.51.1
                  license: Apache-2.0
            uid: 0
            gid: 0
      pipeline:
        - name: apply runtime closure patch
          uses: patch@v1
          work-dir: ${source.dir}/marquez
          with:
            options: -p1
            patches:
              - ${source.dir}/runtime-closure.patch
        - name: bump runtime dependencies
          uses: npm/bump@v1
          privileged: true
          with:
            bumps: ${source.dir}/npm-bumps.json
            npm-root: ${source.dir}/marquez/web
            omit-dev: false
        - name: install dependencies
          privileged: true
          runs: |
            set -eux -o pipefail

            npm ci --fund=false --audit=false
        - name: build ui
          runs: |
            set -eux -o pipefail

            REACT_APP_ADVANCED_SEARCH= npm run build > /tmp/webpack.log 2>&1 || {
              cat /tmp/webpack.log
              exit 1
            }
            if grep -F 'was not found' /tmp/webpack.log; then
              echo 'webpack missing-export warning'
              exit 1
            fi
            cat /tmp/webpack.log
        - name: generate browser sbom
          runs: |
            set -eux -o pipefail

            test -s dist/bundle.js.map
            test -s dist/bundle.js
            grep -q '4.18.1' dist/bundle.js
            if grep -q '4.17.21' dist/bundle.js; then
              echo 'lodash 4.17.21 still in bundle.js'
              exit 1
            fi
            node -e 'for (const n of ["moment","prismjs"]) { const v = require("./node_modules/"+n+"/package.json").version; console.log(n, v) } console.log("babel", require("./node_modules/@babel/runtime/package.json").version)'

            PKG_VERSION=0.51.1 \
              BROWSER_SBOM=${target.dir}/opt/docker/sbom/marquez-web-browser/.spdx.marquez-web-browser.json \
              node ${source.dir}/browser-sbom.js

            test -s /opt/docker/sbom/marquez-web-browser/.spdx.marquez-web-browser.json
            test -s ${target.dir}/opt/docker/sbom/marquez-web-browser/.spdx.marquez-web-browser.json
            grep -q 'pkg:npm/lodash@4.18.1' ${target.dir}/opt/docker/sbom/marquez-web-browser/.spdx.marquez-web-browser.json
            grep -q 'pkg:npm/moment@2.31.0' ${target.dir}/opt/docker/sbom/marquez-web-browser/.spdx.marquez-web-browser.json
            grep -q 'pkg:npm/prismjs@1.30.0' ${target.dir}/opt/docker/sbom/marquez-web-browser/.spdx.marquez-web-browser.json
            grep -q 'pkg:npm/%40babel/runtime@7.26.10' ${target.dir}/opt/docker/sbom/marquez-web-browser/.spdx.marquez-web-browser.json
            grep -q 'pkg:npm/react-router@6.30.6' ${target.dir}/opt/docker/sbom/marquez-web-browser/.spdx.marquez-web-browser.json
            grep -q 'pkg:npm/react-router-dom@6.30.6' ${target.dir}/opt/docker/sbom/marquez-web-browser/.spdx.marquez-web-browser.json
            grep -q 'pkg:npm/%40remix-run/router@1.23.4' ${target.dir}/opt/docker/sbom/marquez-web-browser/.spdx.marquez-web-browser.json
        - name: prune dev dependencies
          runs: |
            set -eux -o pipefail

            npm prune --omit=dev
            rm node_modules/.package-lock.json
        - name: generate sbom
          uses: sbom@v1
          with:
            extra-scanners: javascript-package-cataloger
            prefix: marquez-web-node-modules
            source: ${source.dir}/marquez/web/node_modules
        - name: stage runtime tree
          runs: |
            set -eux -o pipefail

            dest="${target.dir}/usr/lib/marquez-web"
            license="${target.dir}/usr/share/licenses/marquez-web-0"
            mkdir -p "${dest}" "${license}"
            install -m 0644 setupProxy.js "${dest}/setupProxy.js"
            install -m 0755 docker/entrypoint.sh "${dest}/entrypoint.sh"
            install -m 0644 "${source.dir}/marquez/LICENSE" "${license}/LICENSE"
            cp -a dist node_modules "${dest}/"
            found="$(find "${dest}" -name '*.node' -print)"
            if [ -n "${found}" ]; then
              printf '%s\n' "${found}"
              exit 1
            fi
        - uses: dhi/build-pkg:0
          with:
            apk:
              depends:
                - busybox
            deb:
              depends:
                - dash
            depends:
              - nodejs-22
            description: Marquez web UI
            files:
              - usr/lib/marquez-web
              - usr/share/licenses/marquez-web-0
              - opt/docker/sbom/marquez-web-browser
            license: Apache-2.0
            name: marquez-web-0
            rel: 1
            url: https://github.com/MarquezProject/marquez
            version: 0.51.1
      paths:
        - type: file
          path: ${source.dir}/runtime-closure.patch
          uid: 0
          gid: 0
          source: package/main/marquez-web/runtime-closure.patch
        - type: file
          path: ${source.dir}/npm-bumps.json
          uid: 0
          gid: 0
          source: package/main/marquez-web/npm-bumps.json
        - type: file
          path: ${source.dir}/browser-sbom.js
          uid: 0
          gid: 0
          source: package/main/marquez-web/browser-sbom.js
os-release:
  name: Docker Hardened Images (Debian)
  id: debian
  version-id: "13"
  version-codename: trixie
  pretty-name: Docker Hardened Images/Debian GNU/Linux 13 (trixie)
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
