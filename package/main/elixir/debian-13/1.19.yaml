  ERLANG_OTP_DEV_REFERENCE: dhi/erlang-otp:28.5-debian13-dev@sha256:b753219baebbdd2bc97ca21e6f52c9afae16669a68c68b7b9922cd5e5daf8a73
  PACKAGE_NAME: elixir-1.19
