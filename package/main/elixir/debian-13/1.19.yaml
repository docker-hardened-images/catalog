  SEMVER_MAJOR_VERSION: "1"
  SEMVER_VERSION: 1.19.7
  VERSION: 1.19.7
contents:
  packages:
    - base-files
  builds:
    - name: elixir
      work-dir: ${source.dir}/elixir
      contents:
        packages:
          - bash
          - ca-certificates
          - coreutils
          - dash
          - findutils
          - grep
          - libssl3t64
          - libstdc++6
          - make
          - sed
        files:
          - url: git+https://github.com/elixir-lang/elixir.git#v1.19.7
            checksum: f1657a626c683a9ea416c1f63f449022c486a09c
            path: ${source.dir}/elixir
            spdx:
              name: elixir
              version: 1.19.7
              packages:
                - name: elixir
                  purl: pkg:github/elixir-lang/elixir@v1.19.7
                  license: Apache-2.0
            uid: 0
            gid: 0
        artifacts:
          - name: dhi.io/erlang-otp:28.5-debian13-dev@sha256:b753219baebbdd2bc97ca21e6f52c9afae16669a68c68b7b9922cd5e5daf8a73
            includes:
              - usr/local/**
            uid: 0
            gid: 0
      pipeline:
        - name: build and install elixir
          runs: |
            set -eux -o pipefail

            export ERL_COMPILER_OPTIONS=deterministic LANG=C.UTF-8
            make -j"$(nproc)"
            make install DESTDIR="${target.dir}" PREFIX=/usr
            rm -f "${target.dir}"/usr/bin/*.bat "${target.dir}"/usr/bin/*.ps1
        - uses: dhi/build-pkg:0
          with:
            description: Elixir programming language
            files:
              - usr/bin
              - usr/lib/elixir
            formats:
              - deb
            license: Apache-2.0
            name: elixir-1.19
            provides: elixir=1.19.7-r0
            rel: 0
            url: https://elixir-lang.org/
            version: 1.19.7
