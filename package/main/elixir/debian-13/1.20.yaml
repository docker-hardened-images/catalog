  ERLANG_OTP_DEV_REFERENCE: dhi/erlang-otp:28.5-debian13-dev@sha256:3411c855f818f76b21f27ecb9c9b8a97df0832dd817b06548ce666dd463a87e9
  PACKAGE_NAME: elixir-1.20
