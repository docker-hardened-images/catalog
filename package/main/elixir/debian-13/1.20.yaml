  SEMVER_MAJOR_VERSION: "1"
  SEMVER_VERSION: 1.20.2
  VERSION: 1.20.2
contents:
  packages:
    - base-files
  builds:
    - name: elixir
      uses: dhi.io/erlang-otp:28.5-debian13-dev@sha256:3411c855f818f76b21f27ecb9c9b8a97df0832dd817b06548ce666dd463a87e9
      work-dir: ${source.dir}/elixir
      contents:
        packages:
          - bash
          - coreutils
          - findutils
          - grep
          - make
          - sed
        files:
          - url: git+https://github.com/elixir-lang/elixir.git#v1.20.2
            checksum: 545dddf138e4cb1ee874e6f2c26882c9b438f551
            path: ${source.dir}/elixir
            spdx:
              name: elixir
              version: 1.20.2
              packages:
                - name: elixir
                  purl: pkg:github/elixir-lang/elixir@v1.20.2
                  license: Apache-2.0
            uid: 0
            gid: 0
      pipeline:
        - name: build and install elixir
          runs: |
            set -eux -o pipefail

            export ERL_COMPILER_OPTIONS=deterministic LANG=C.UTF-8
            make -j"$(nproc)"
            make install DESTDIR="${target.dir}" PREFIX=/usr
            rm -f "${target.dir}"/usr/bin/*.bat "${target.dir}"/usr/bin/*.ps1
        - uses: dhi/build-pkg:0
          with:
            description: Elixir programming language
            files:
              - usr/bin
              - usr/lib/elixir
            formats:
              - deb
            license: Apache-2.0
            name: elixir-1.20
            provides: elixir=1.20.2-r2
            rel: 2
            url: https://elixir-lang.org/
            version: 1.20.2
