# syntax=dhi.io/build:2-debian13

image: dhi.io/pkg-time-mcp
variant: runtime
tags:
  - 2026.8.31
  - 2026.8.31-r28
  - 2026.8.31-debian13
  - 2026.8.31-r28-debian13
platforms:
  - linux/amd64
  - linux/arm64
vars:
  ARCH: '#{ target.arch == "amd64" ? "x86_64" : "aarch64" }'
  COMMIT_SHA: a40bc270fb5ece62673f8a1196f57116d885c5eb
  PYTHON_MINOR: "3.14"
  PYTHON_VERSION: 3.14.10-7
  REL: "28"
  SEMVER_MAJOR_MINOR_VERSION: "2026.8"
  SEMVER_MAJOR_VERSION: "2026"
  SEMVER_VERSION: 2026.8.31
  UV_VERSION: 0.13.10
  VERSION: 2026.8.31
contents:
  repositories:
    - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
  keyring:
    - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
  packages:
    - base-files
  builds:
    - name: time-mcp
      work-dir: ${source.dir}
      environment:
        UV_COMPILE_BYTECODE: "1"
      caches:
        - path: /root/.cache/uv
      contents:
        repositories:
          - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
        keyring:
          - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
        packages:
          - bash
          - ca-certificates
          - coreutils
          - findutils
          - git
          - grep
          - gzip
          - jq
          - sed
          - tar
          - libpython-3.14=3.14.10-7
          - libpython-3.14-minimal=3.14.10-7
          - libpython-3.14-stdlib=3.14.10-7
          - python-3.14-minimal=3.14.10-7
          - python-3.14=3.14.10-7
          - python-3.14-dev=3.14.10-7
        files:
          - url: https://github.com/astral-sh/uv/releases/download/0.13.10/uv-${ARCH}-unknown-linux-gnu.tar.gz
            path: ${source.dir}/uv-unknown-linux-gnu.tar.gz
            uid: 0
            gid: 0
          - url: git+https://github.com/modelcontextprotocol/servers.git#2026.8.31
            checksum: a40bc270fb5ece62673f8a1196f57116d885c5eb
            path: ${source.dir}/servers
            spdx:
              name: time-mcp
              version: 2026.8.31
              packages:
                - name: time-mcp
                  purl: pkg:dhi/time-mcp@2026.8.31
                  license: MIT
            uid: 0
            gid: 0
      pipeline:
        - name: setup uv
          runs: |
            set -eux -o pipefail

            mkdir -p /usr/local/bin
            tar -xzf "${source.dir}/uv-unknown-linux-gnu.tar.gz" -C /usr/local/bin --strip-components=1
            chmod +x /usr/local/bin/uv
        - name: stage time sources
          runs: |
            set -eux -o pipefail

            TIME_SRC="${source.dir}/servers/src/time"

            mkdir -p "${source.dir}/time"
            cp -a "${TIME_SRC}/." "${source.dir}/time/"
        - name: bump python dependencies
          uses: python/bump@v1
          work-dir: ${source.dir}/time
          privileged: true
          with:
            bumps: ${source.dir}/patch/python-bumps.json
            python: /usr/bin/python3.14
        - name: build venv at final path and stage it
          privileged: true
          runs: |
            set -eux -o pipefail

            export SOURCE_DIR="${source.dir}" TARGET_DIR="${target.dir}" PYTHON_BIN=/usr/bin/python3.14
            bash "${source.dir}/build-venv.sh"
        - uses: dhi/build-pkg:0
          with:
            depends:
              - python-3.14
            description: Time MCP server for time queries and timezone conversions
            files:
              - usr/lib/time-mcp
              - usr/bin/mcp-server-time
            formats:
              - deb
            license: MIT
            name: time-mcp
            rel: 28
            url: https://github.com/modelcontextprotocol/servers/tree/main/src/time
            version: 2026.8.31
      paths:
        - type: file
          path: ${source.dir}/build-venv.sh
          uid: 0
          gid: 0
          mode: "0755"
          source: package/main/time-mcp/build-venv.sh
        - type: file
          path: ${source.dir}/patch/python-bumps.json
          uid: 0
          gid: 0
          mode: "0644"
          source: package/main/time-mcp/patch/python-bumps.json
os-release:
  name: Docker Hardened Images (Debian)
  id: debian
  version-id: "13"
  version-codename: trixie
  pretty-name: Docker Hardened Images/Debian GNU/Linux 13 (trixie)
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
