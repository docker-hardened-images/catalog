      pipeline:
        - name: install gradle init scripts
          runs: |
            set -eux -o pipefail

            install -D -m 0644 \
              ${source.dir}/patch/1.overrides.gradle \
              /root/.gradle/init.d/dhi-overrides.gradle
        - name: patch maven central for build cloud rate limits
          runs: |
            set -eux -o pipefail

            MIRROR='maven { url "https://maven-central.storage-download.googleapis.com/maven2/" }'
            PORTAL=$'maven {\\n    url "https://plugins.gradle.org/m2/"\\n    metadataSources { mavenPom(); artifact(); ignoreGradleMetadataRedirection() }\\n}'
            find . \( -name "*.gradle" -o -name "*.gradle.kts" \) -print0 \
              | xargs -0 sed -i \
                -e "s|mavenCentral()|${MIRROR}|g" \
                -e "s|gradlePluginPortal()|${PORTAL}|g"

            sed -i \
              -e 's|datahub.dependencies.maven.central=https://repo1.maven.org/maven2|datahub.dependencies.maven.central=https://maven-central.storage-download.googleapis.com/maven2|g' \
              -e 's|apacheMavenRepositoryUrl=https://repo1.maven.org/maven2|apacheMavenRepositoryUrl=https://maven-central.storage-download.googleapis.com/maven2|g' \
              gradle.properties
        - name: bump vulnerable dependency versions
          runs: |
            set -eux -o pipefail

            find . \( -name '*.gradle' -o -name '*.gradle.kts' -o -name 'gradle.lockfile' \) -print0 \
              | xargs -0 sed -i \
                -e 's|at\.yawk\.lz4:lz4-java:1\.10\.1|at.yawk.lz4:lz4-java:1.11.4|g' \
                -e 's|at\.yawk\.lz4:lz4-java:1\.11\.1|at.yawk.lz4:lz4-java:1.11.4|g' \
                -e 's|at\.yawk\.lz4:lz4-java:1\.11\.2|at.yawk.lz4:lz4-java:1.11.4|g' \
                -e 's|org\.jline:jline:4\.2\.1|org.jline:jline:4.3.1|g' \
                -e 's|org\.jline:\([^:]*\):4\.2\.1|org.jline:\1:4.3.1|g'

            cat >> build.gradle << 'GRADLE'

            allprojects {
                configurations.configureEach {
                    resolutionStrategy {
                        force 'at.yawk.lz4:lz4-java:1.11.4'
                        force 'org.jline:jline:4.3.1'
                        eachDependency { details ->
                        def req = details.requested
                        if (req.group == 'io.netty'
                                && req.name.startsWith('netty-')
                                && !req.name.startsWith('netty-tcnative')) {
                            details.useVersion '4.2.17.Final'
                            details.because 'DHI CVE remediation'
                        }
                        if (req.group == 'com.squareup.wire'
                                && req.name == 'wire-runtime-jvm') {
                            details.useVersion '6.3.0'
                            details.because 'DHI CVE remediation'
                        }
                        if (req.group != null && req.group.startsWith('com.fasterxml.jackson')
                                && req.name == 'jackson-databind') {
                            details.useVersion '2.21.7'
                            details.because 'DHI CVE remediation: CVE-2026-68497, CVE-2026-91776, CVE-2026-91777'
                        }
                        if (req.group != null && req.group.startsWith('com.fasterxml.jackson')
                                && req.name != 'jackson-annotations'
                                && req.name != 'jackson-databind') {
                            details.useVersion '2.21.7'
                            details.because 'DHI CVE remediation: CVE-2026-91776, CVE-2026-91777'
                        }
                        if (req.group != null && req.group.startsWith('tools.jackson')) {
                            details.useVersion '3.1.7'
                            details.because 'DHI CVE remediation: CVE-2026-91776, CVE-2026-91777'
                        }
                        if (req.group == 'org.apache.logging.log4j'
                                && req.name.startsWith('log4j-')) {
                            details.useVersion '2.25.5'
                            details.because 'DHI CVE remediation'
                        }
                        if (req.group == 'ch.qos.logback'
                                && req.name.startsWith('logback-')) {
                            details.useVersion '1.5.35'
                            details.because 'DHI CVE remediation'
                        }
                        if (req.group == 'org.postgresql'
                                && req.name == 'postgresql') {
                            details.useVersion '42.7.12'
                            details.because 'DHI CVE remediation'
                        }
                        if (req.group == 'org.mariadb.jdbc'
                                && req.name == 'mariadb-java-client') {
                            details.useVersion '2.7.14'
                            details.because 'DHI CVE remediation: CVE-2026-55856, CVE-2026-55857, CVE-2026-55858'
                        }
                        if (req.group == 'org.springframework'
                                && (req.version == '7.0.7' || req.version == '7.0.8')) {
                            details.useVersion '7.0.9'
                            details.because 'DHI CVE remediation: CVE-2026-47884'
                        }
                        if (req.group == 'org.springframework.boot'
                                && req.name.startsWith('spring-boot')) {
                            details.useVersion '4.0.7'
                            details.because 'DHI CVE remediation'
                        }
                        if (req.group == 'io.micrometer'
                                && (req.name == 'micrometer-core'
                                    || req.name.startsWith('micrometer-registry-'))) {
                            details.useVersion '1.16.6'
                            details.because 'DHI CVE remediation'
                        }
                        if (req.group == 'org.apache.httpcomponents.core5'
                                && req.name.startsWith('httpcore5')) {
                            details.useVersion '5.4.3'
                            details.because 'DHI CVE remediation'
                        }
                        if (req.group == 'org.apache.httpcomponents.client5'
                                && req.name == 'httpclient5') {
                            details.useVersion '5.6.3'
                            details.because 'DHI CVE remediation'
                        }
                        if ((req.group == 'org.lz4' || req.group == 'at.yawk.lz4')
                                && req.name == 'lz4-java') {
                            details.useTarget 'at.yawk.lz4:lz4-java:1.11.4'
                            details.because 'DHI CVE remediation: CVE-2026-106449, CVE-2026-106450, CVE-2026-106451, CVE-2026-106452, CVE-2026-106453'
                        }
                        if (req.group == 'org.apache.parquet'
                                && req.name == 'parquet-jackson'
                                && (req.version == '1.17.1' || req.version == '1.18.0')) {
                            details.useVersion '1.18.1'
                            details.because 'DHI CVE remediation: parquet-jackson 1.18.1 shaded jackson relocated to 2.22.3 post-build (jarjar)'
                        }
                        if (req.group == 'org.bouncycastle'
                                && req.version == '1.84') {
                            details.useVersion '1.85'
                            details.because 'DHI CVE remediation: CVE-2026-8763, CVE-2026-13506'
                        }
                        if (req.group == 'org.jline') {
                            details.useVersion '4.3.1'
                            details.because 'DHI CVE remediation: CVE-2026-77420, CVE-2026-77421, CVE-2026-77422'
                        }
                        }
                    }
                }
            }
            GRADLE
        - name: build
          privileged: true
          runs: |
            set -eux -o pipefail

            export GRADLE_HOME="/usr/share/java/gradle"
            export JAVA_HOME="/usr/lib/jvm/temurin-21"
            export PATH="${GRADLE_HOME}/bin:${JAVA_HOME}/bin:${PATH}"

            find /root/.gradle/caches -name '*.lock' -delete 2> /dev/null || true
            find /root/.gradle/caches/journal-* -mindepth 1 -maxdepth 1 \
              -name '*.lock' -delete 2> /dev/null || true

            find . -name 'gradle.lockfile' -delete || true

            ./gradlew --init-script ${source.dir}/files/init.gradle \
              :datahub-upgrade:assemble -x test \
              --no-daemon --no-watch-fs --parallel --max-workers=4 \
              --update-locks 'com.fasterxml.jackson.core:*,com.fasterxml.jackson.dataformat:*,com.fasterxml.jackson.datatype:*,com.fasterxml.jackson.module:*,tools.jackson.core:*,tools.jackson.dataformat:*,tools.jackson.module:*,org.apache.commons:*,io.opentelemetry:*,io.netty:*,org.apache.parquet:*,org.postgresql:*,org.mariadb.jdbc:*,org.springframework.boot:*,org.springframework.kafka:*,org.springframework:*,org.jline:*,ch.qos.logback:*,at.yawk.lz4:*,org.apache.logging.log4j:*,io.micrometer:*,org.apache.httpcomponents.core5:*,org.apache.httpcomponents.client5:*,com.squareup.wire:*,org.bouncycastle:*' \
              --console=plain

            test -f datahub-upgrade/build/libs/datahub-upgrade.jar
        - name: stage runtime files
          runs: |
            set -eux -o pipefail

            mkdir -p "${target.dir}/usr/lib/datahub-upgrade/bin"
            mkdir -p "${target.dir}/usr/lib/datahub-upgrade/scripts"
            mkdir -p "${target.dir}/usr/lib/datahub-upgrade/lib"
            mkdir -p "${target.dir}/usr/share/datahub-gms/resources"
            mkdir -p "${target.dir}/usr/share/datahub-gms/scripts"
            mkdir -p "${target.dir}/usr/lib/datahub"

            cp datahub-upgrade/build/libs/datahub-upgrade.jar \
              "${target.dir}/usr/lib/datahub-upgrade/bin/datahub-upgrade.jar"

            bash "${source.dir}/patch/patch-hazelcast-jackson.sh" \
              "${target.dir}/usr/lib/datahub-upgrade/bin/datahub-upgrade.jar" \
              "${source.dir}/patch/deps"

            cp "${source.dir}/agents/opentelemetry-javaagent.jar" \
              "${target.dir}/usr/lib/datahub-upgrade/lib/opentelemetry-javaagent.jar"
            cp "${source.dir}/agents/jmx_prometheus_javaagent.jar" \
              "${target.dir}/usr/lib/datahub-upgrade/lib/jmx_prometheus_javaagent.jar"

            cp metadata-models/src/main/resources/entity-registry.yml \
              "${target.dir}/usr/share/datahub-gms/resources/entity-registry.yml"
            cp docker/monitoring/client-prometheus-config.yaml \
              "${target.dir}/usr/share/datahub-gms/scripts/prometheus-config.yaml"

            cp "${source.dir}/files/start.sh" \
              "${target.dir}/usr/lib/datahub-upgrade/scripts/start.sh"
            chmod 0755 "${target.dir}/usr/lib/datahub-upgrade/scripts/start.sh"

            cp docker/snippets/wait_for_deps.sh \
              "${target.dir}/usr/lib/datahub/wait_for_deps.sh"
            chmod 0644 "${target.dir}/usr/lib/datahub/wait_for_deps.sh"
        - name: java sbom
          uses: sbom@v1
          with:
            extra-scanners: java-archive-cataloger
            prefix: datahub-upgrade
            source: ${target.dir}/usr/lib/datahub-upgrade
        - uses: dhi/build-pkg:0
          with:
            depends:
              - bash
              - coreutils
              - curl
              - grep
            description: DataHub schema and metadata upgrade job
            files:
              - usr/lib/datahub-upgrade
              - usr/share/datahub-gms/resources
              - usr/share/datahub-gms/scripts/prometheus-config.yaml
              - usr/lib/datahub
            formats:
              - deb
            license: Apache-2.0
            name: datahub-upgrade
            rel: 10
            url: https://datahubproject.io/
            version: 1.7.0.1
      paths:
        - type: file
          path: ${source.dir}/files/start.sh
          uid: 0
          gid: 0
          source: package/main/datahub-upgrade/files/start.sh
        - type: file
          path: ${source.dir}/files/init.gradle
          uid: 0
          gid: 0
          source: package/main/datahub-upgrade/files/init.gradle
        - type: file
          path: ${source.dir}/patch/1.overrides.gradle
          uid: 0
          gid: 0
          source: package/main/datahub-upgrade/patch/1.overrides.gradle
        - type: file
          path: ${source.dir}/patch/patch-hazelcast-jackson.sh
          uid: 0
          gid: 0
          mode: "0755"
          source: package/main/datahub-upgrade/patch/patch-hazelcast-jackson.sh
