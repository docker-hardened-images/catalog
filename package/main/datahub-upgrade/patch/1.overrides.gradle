// Gradle init script: force CVE-remediated dependency versions at resolution time.
//
// Each rule matches the exact old version the upstream tag ships with, so this
// is a deterministic override (not a blanket "always-bump" rule). To support a
// new upstream point release, update only the version literals below.

allprojects {
    // Override DataHub's `ext.nettyVersion` after the project's build.gradle
    // has been evaluated (where it sets ext.nettyVersion = '4.2.13.Final').
    // `afterEvaluate` ensures our assignment wins over the project's own
    // `allprojects { ext.nettyVersion = ... }` block.
    afterEvaluate {
        rootProject.ext['nettyVersion'] = '4.2.17.Final'
    }

    configurations.all {
        resolutionStrategy {
            eachDependency { details ->
            def grp = details.requested.group
            def name = details.requested.name
            def ver = details.requested.version

            // Jackson Databind 2.x -> 2.21.6.
            if (grp == "com.fasterxml.jackson.core" && name == "jackson-databind") {
                details.useVersion("2.21.6")
                details.because("CVE remediation: GHSA-72hv-8253-57qq, GHSA-R7WM-3CXJ-WFF9, CVE-2026-54512, CVE-2026-54513, CVE-2026-54514, CVE-2026-54516, CVE-2026-54517, CVE-2026-54518, CVE-2026-54515, CVE-2026-68497")
            }

            // Other Jackson 2.x modules remain at 2.21.6.
            if (grp != null && grp.startsWith("com.fasterxml.jackson")
                    && name != "jackson-annotations"
                    && name != "jackson-databind") {
                details.useVersion("2.21.6")
                details.because("CVE remediation: GHSA-72hv-8253-57qq, GHSA-R7WM-3CXJ-WFF9, CVE-2026-54512, CVE-2026-54513, CVE-2026-54514, CVE-2026-54516, CVE-2026-54517, CVE-2026-54518, CVE-2026-54515")
            }

            // Jackson 3.x (tools.jackson.*) -> 3.1.6. Same PTV bypass family;
            // 3.1.6 additionally fixes CVE-2026-54515 and GHSA-R7WM-3CXJ-WFF9.
            // Force the whole 3.x line so jackson-dataformat-* and other
            // tools.jackson modules cannot linger at 3.1.2 beside a bumped databind.
            if (grp != null && grp.startsWith("tools.jackson")) {
                details.useVersion("3.1.4")
                details.because("CVE remediation: GHSA-R7WM-3CXJ-WFF9, CVE-2026-54512, CVE-2026-54513, CVE-2026-54514, CVE-2026-54515, CVE-2026-54516, CVE-2026-54517, CVE-2026-54518")
            }

            // commons-configuration2 2.10.1 -> 2.15.0 (CVE-2026-45205)
            if (grp == "org.apache.commons" && name == "commons-configuration2"
                    && ver == "2.10.1") {
                details.useVersion("2.15.0")
                details.because("CVE remediation: CVE-2026-45205")
            }

            // opentelemetry-extension-trace-propagators 1.49.0 -> 1.62.0 (CVE-2026-45292)
            if (grp == "io.opentelemetry" && name == "opentelemetry-extension-trace-propagators"
                    && ver == "1.49.0") {
                details.useVersion("1.62.0")
                details.because("CVE remediation: CVE-2026-45292")
            }

            // Netty 4.2.13.Final -> 4.2.17.Final
            if (grp == "io.netty" && !name.startsWith("netty-tcnative")
                    && ver == "4.2.13.Final") {
                details.useVersion("4.2.17.Final")
                details.because("CVE remediation: CVE-2026-44891")
            }

            // spring-kafka 4.0.5 -> 4.0.6 (CVE-2026-41731, CVE-2026-41726)
            if (grp == "org.springframework.kafka" && name == "spring-kafka"
                    && ver == "4.0.5") {
                details.useVersion("4.0.6")
                details.because("CVE remediation: CVE-2026-41731, CVE-2026-41726")
            }

            // jline bundle -> 4.2.1 (GHSA-47qp-hqvx-6r3f, GHSA-2r2c-cx56-8933)
            // remote-telnet ships inside BOOT-INF/lib/jline-*.jar; overriding
            // jline-remote-telnet alone leaves the fat jar at 3.25.1.
            if (grp == "org.jline" && name == "jline") {
                details.useVersion("4.2.1")
                details.because("CVE remediation: GHSA-47qp-hqvx-6r3f, GHSA-2r2c-cx56-8933")
            }

            // postgresql 42.7.11 -> 42.7.12 (CVE-2026-54291)
            if (grp == "org.postgresql" && name == "postgresql"
                    && ver == "42.7.11") {
                details.useVersion("42.7.12")
                details.because("CVE remediation: CVE-2026-54291")
            }

            // logback-core, logback-classic -> 1.5.35 (CVE-2026-9828, CVE-2026-10532)
            if (grp == "ch.qos.logback" && name.startsWith("logback-")) {
                details.useVersion("1.5.35")
                details.because("CVE remediation: CVE-2026-9828, CVE-2026-10532")
            }

            // Spring Framework 7.0.7 -> 7.0.8 (CVE-2026-41841, CVE-2026-41842,
            // CVE-2026-41843, CVE-2026-41844, CVE-2026-41845, CVE-2026-41846,
            // CVE-2026-41853). Covers spring-webmvc and other spring-* modules.
            if (grp == "org.springframework" && ver == "7.0.7") {
                details.useVersion("7.0.8")
                details.because("CVE remediation: CVE-2026-41841, CVE-2026-41842, CVE-2026-41843, CVE-2026-41844, CVE-2026-41845, CVE-2026-41846, CVE-2026-41853")
            }

            // lz4-java 1.10.1 -> 1.11.1 (CVE-2026-59949)
            // Force both org.lz4 and at.yawk.lz4 to the community fork.
            if ((grp == "org.lz4" || grp == "at.yawk.lz4") && name == "lz4-java") {
                details.useTarget("at.yawk.lz4:lz4-java:1.11.1")
                details.because("CVE remediation: CVE-2026-59949")
            }

            // parquet-jackson 1.17.1 shades jackson-core/databind 2.21.3 inside
            // the jar (BOOT-INF/lib/parquet-jackson-*.jar). Gradle cannot rewrite
            // shaded classes; 1.18.0 embeds jackson 2.22.1.
            if (grp == "org.apache.parquet" && name == "parquet-jackson"
                    && ver == "1.17.1") {
                details.useVersion("1.18.0")
                details.because("CVE remediation: GHSA-r7wm-3cxj-wff9, CVE-2026-54512, CVE-2026-54513")
            }
        }
    }
}
}
