# syntax=dhi.io/build:2-debian13

image: dhi.io/pkg-docker
variant: runtime
tags:
  - 29.10.1
  - 29.10.1-r0
  - 29.10.1-debian13
  - 29.10.1-r0-debian13
platforms:
  - linux/amd64
  - linux/arm64
dates:
  release: "2025-11-10"
vars:
  REL: "0"
  SEMVER_MAJOR_MINOR_VERSION: "29.10"
  SEMVER_MAJOR_VERSION: "29"
  SEMVER_VERSION: 29.10.1
  VERSION: 29.10.1
contents:
  repositories:
    - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
  keyring:
    - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
  packages:
    - base-files
  builds:
    - name: docker deb
      contents:
        packages:
          - bash
          - coreutils
      pipeline:
        - name: create docker-compose compatibility symlink
          runs: |
            set -eux -o pipefail

            mkdir -p "${target.dir}/usr/bin"
            ln -s ../libexec/docker/cli-plugins/docker-compose "${target.dir}/usr/bin/docker-compose"
        - uses: dhi/build-pkg:0
          with:
            depends:
              - docker-buildx-plugin
              - docker-ce
              - docker-compose-plugin
            description: Docker Engine with CLI, Buildx, and Compose
            files:
              - usr/bin/docker-compose
            formats:
              - deb
            license: Apache-2.0
            name: docker
            rel: 0
            url: https://www.docker.com/
            version: 29.10.1
os-release:
  name: Docker Hardened Images (Debian)
  id: debian
  version-id: "13"
  version-codename: trixie
  pretty-name: Docker Hardened Images/Debian GNU/Linux 13 (trixie)
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
