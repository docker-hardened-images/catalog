      pipeline:
        - name: install maven
          runs: |
            set -eux -o pipefail

            mkdir -p /opt/java
            tar -xzf "${source.dir}/maven/apache-maven-3.9.16-bin.tar.gz" -C /opt/java

            mkdir -p /usr/local/bin
            find "/opt/java/apache-maven-3.9.16/bin" \( -type f -executable -o -type l \) | while read -r file; do
              filename=$(basename "$file")
              ln -sf "/opt/java/apache-maven-3.9.16/bin/$filename" "/usr/local/bin/$filename"
            done
        - uses: mvn/mirror@v1
        - name: use maven central when mirror credentials are absent
          secrets:
            - id: maven_user
              env: MAVEN_USER
              optional: true
            - id: maven_password
              env: MAVEN_PASSWORD
              optional: true
          runs: |
            set -eux -o pipefail

            if [ -z "${MAVEN_USER:-}" ] || [ -z "${MAVEN_PASSWORD:-}" ]; then
              rm -f /root/.m2/settings.xml
            fi
        - name: patch source for Spark 4.0
          uses: patch@v1
          work-dir: ${source.dir}/spark
          with:
            options: -p1
            patches:
              - ${source.dir}/patch/hadoop-4.0.patch
              - ${source.dir}/patch/jackson-4.0.patch
              - ${source.dir}/patch/lz4-4.0.patch
        - name: patch deps
          uses: mvn/patch@v1
          with:
            dependencies: ${source.dir}/patch/mvn-deps-4.0.json
            dependencies-key: dependencyManagement.dependencies
            downgrade: false
            mvn-root: ${source.dir}/spark
            properties: ${source.dir}/patch/mvn-properties-4.0.json
        - name: prepare
          privileged: true
          secrets:
            - id: maven_user
              env: MAVEN_USER
              optional: true
            - id: maven_password
              env: MAVEN_PASSWORD
              optional: true
          runs: |
            set -eux -o pipefail

            ln -sf "/opt/java/apache-maven-3.9.16/bin/mvn" build/mvn
            ./dev/change-scala-version.sh '2.13'
        - name: build
          privileged: true
          secrets:
            - id: maven_user
              env: MAVEN_USER
              optional: true
            - id: maven_password
              env: MAVEN_PASSWORD
              optional: true
          runs: |
            set -eux -o pipefail

            ./dev/make-distribution.sh \
              '-Pscala-2.13' -Pyarn -Pkubernetes -Phadoop-3 -Phive -Phive-thriftserver
        - name: install
          runs: |
            set -eux -o pipefail

            install -d "${target.dir}/usr/share/spark"
            cp -a -t "${target.dir}/usr/share/spark" \
              dist/RELEASE \
              dist/jars \
              dist/bin \
              dist/sbin \
              dist/examples \
              dist/data \
              dist/kubernetes/tests

            install -d "${target.dir}/usr/share/spark/python"
            cp -a -t "${target.dir}/usr/share/spark/python" \
              dist/python/pyspark \
              dist/python/lib

            install -T -m 0755 dist/kubernetes/dockerfiles/spark/decom.sh \
              "${target.dir}/usr/share/spark/decom.sh"
            ln -s "spark-examples_2.13-4.0.4.jar" \
              "${target.dir}/usr/share/spark/examples/jars/spark-examples-jar"
        - name: remediate jars
          runs: |
            set -eux -o pipefail

            JACKSON_REMEDIATION_VERSION="2.21.5"
            if [ "4.0" = "4.0" ]; then
              JACKSON_REMEDIATION_VERSION="2.18.9"
            fi

            bash "${source.dir}/patch/remediate-jars.sh" \
              "${target.dir}/usr/share/spark/jars" \
              "${source.dir}/patch/deps" \
              "${JACKSON_REMEDIATION_VERSION}"
        - uses: dhi/build-pkg:0
          with:
            depends:
              - bash
              - coreutils
              - eclipse-temurin-21-jre
            description: Apache Spark unified analytics engine
            files:
              - usr/share/spark
            formats:
              - deb
            license: Apache-2.0
            name: spark-4.0
            rel: 1
            url: https://spark.apache.org/
            version: 4.0.4
      paths:
        - type: file
          path: ${source.dir}/patch/hadoop-4.0.patch
          uid: 0
          gid: 0
          source: package/main/spark/patch/hadoop-4.0.patch
        - type: file
          path: ${source.dir}/patch/jackson-4.0.patch
          uid: 0
          gid: 0
          source: package/main/spark/patch/jackson-4.0.patch
        - type: file
