# syntax=dhi.io/build:2-alpine3.24

image: dhi.io/pkg-hatchet-lite
variant: runtime
tags:
  - 0.104.0-alpine3.24
  - 0.104.0-r0-alpine3.24
platforms:
  - linux/amd64
  - linux/arm64
dates:
  release: "2025-08-04"
vars:
  COMMIT_SHA: 4ff4f0b34ff2fd7ee31d0439f851de6a53ded055
  GOLANG_VERSION: 1.26.7-r0
  NODEJS_VERSION: 24.19.0-r0
  PACKAGE_NAME: hatchet-lite
  PNPM_VERSION: 10.16.1
  REL: "0"
  SEMVER_MAJOR_MINOR_VERSION: "0.104"
  SEMVER_MAJOR_VERSION: "0"
  SEMVER_VERSION: 0.104.0
  VERSION: 0.104.0
contents:
  repositories:
    - https://dhi.io/apk/alpine/v3.24/main
    - https://dhi.io/apk/alpine/v3.23/main
    - https://dl-cdn.alpinelinux.org/alpine/v3.24/main
    - https://dl-cdn.alpinelinux.org/alpine/v3.24/community
  keyring:
    - https://dhi.io/keyring/dhi-apk@docker-0F81AD7700D99184.rsa.pub
  packages:
    - alpine-baselayout-data
  builds:
    - name: hatchet-lite
      work-dir: /go/src/github.com/hatchet-dev/hatchet
      environment:
        CI: "true"
        PNPM_HOME: /pnpm
      caches:
        - path: /go/pkg/mod
        - path: /pnpm/store
      contents:
        packages:
          - bash
          - ca-certificates-bundle
          - corepack
          - coreutils
          - findutils
          - git
          - golang-1.26=1.26.7-r0
          - golang-1.26-oci-config=1.26.7-r0
          - mawk
          - nodejs-24=24.19.0-r0
          - python3
          - sed
        files:
          - url: git+https://github.com/hatchet-dev/hatchet.git#v0.104.0
            checksum: 4ff4f0b34ff2fd7ee31d0439f851de6a53ded055
            path: /go/src/github.com/hatchet-dev/hatchet
            spdx:
              name: hatchet
              version: 0.104.0
              packages:
                - name: hatchet
                  purl: pkg:golang/github.com/hatchet-dev/hatchet@0.104.0
                  license: MIT
            uid: 0
            gid: 0
      pipeline:
        - name: generate docs index
          work-dir: /go/src/github.com/hatchet-dev/hatchet/frontend/snippets
          runs: |
            set -eux -o pipefail

            python3 generate.py
        - name: install frontend dependencies
          work-dir: /go/src/github.com/hatchet-dev/hatchet/frontend/app
          privileged: true
          runs: |
            set -eux -o pipefail

            corepack enable
            corepack prepare pnpm@10.16.1 --activate
            pnpm install --frozen-lockfile
            pnpm store prune
        - name: build frontend
          work-dir: /go/src/github.com/hatchet-dev/hatchet/frontend/app
          runs: |
            set -eux -o pipefail

            pnpm run build
        - name: stage frontend assets
          runs: |
            set -eux -o pipefail

            mkdir -p ${target.dir}/usr/share/hatchet-lite/static-assets
            cp -a /go/src/github.com/hatchet-dev/hatchet/frontend/app/dist/. \
              ${target.dir}/usr/share/hatchet-lite/static-assets/
        - name: update go dependencies
          uses: go/bump@v2
          with:
            deps:
              - github.com/getkin/kin-openapi@v0.144.0
              - github.com/google/cel-go@v0.29.0
              - github.com/slack-go/slack@v0.23.1
              - go.opentelemetry.io/otel@v1.44.0
              - google.golang.org/grpc@v1.82.1
            download: true
        - name: test
          runs: |
            set -eux -o pipefail

            CGO_ENABLED=0 go test -short -count=1 -v \
              ./cmd/hatchet-lite/... \
              ./cmd/hatchet-admin/... \
              ./cmd/hatchet-migrate/...
        - name: build hatchet-lite
          uses: go/build@v1
          with:
            ldflags:
              - -X main.Version=v0.104.0
            output: ${target.dir}/usr/bin/hatchet-lite
            packages: ./cmd/hatchet-lite
        - name: build hatchet-admin
          uses: go/build@v1
          with:
            ldflags:
              - -X github.com/hatchet-dev/hatchet/cmd/hatchet-admin/cli.Version=v0.104.0
            output: ${target.dir}/usr/bin/hatchet-admin
            packages: ./cmd/hatchet-admin
        - name: build hatchet-migrate
          uses: go/build@v1
          with:
            ldflags:
              - -X main.Version=v0.104.0
            output: ${target.dir}/usr/bin/hatchet-migrate
            packages: ./cmd/hatchet-migrate
        - name: build hatchet-lite dev
          uses: go/build@v1
          with:
            ldflags:
              - -X main.Version=v0.104.0
            output: ${target.dir}/usr/bin/hatchet-lite-dev
            packages: ./cmd/hatchet-lite
            strip: false
        - name: build hatchet-admin dev
          uses: go/build@v1
          with:
            ldflags:
              - -X github.com/hatchet-dev/hatchet/cmd/hatchet-admin/cli.Version=v0.104.0
            output: ${target.dir}/usr/bin/hatchet-admin-dev
            packages: ./cmd/hatchet-admin
            strip: false
        - name: build hatchet-migrate dev
          uses: go/build@v1
          with:
            ldflags:
              - -X main.Version=v0.104.0
            output: ${target.dir}/usr/bin/hatchet-migrate-dev
            packages: ./cmd/hatchet-migrate
            strip: false
        - uses: dhi/build-pkg:0
          with:
            depends:
              - bash
            description: Hatchet Lite workflow orchestration server
            files:
              - usr/bin/hatchet-lite
              - usr/bin/hatchet-admin
              - usr/bin/hatchet-migrate
              - usr/bin/docker-entrypoint.sh
              - usr/share/hatchet-lite/static-assets
            license: MIT
            name: hatchet-lite
            rel: 0
            subpackages:
              - files:
                  - path: usr/bin/hatchet-lite
                    source: usr/bin/hatchet-lite-dev
                  - path: usr/bin/hatchet-admin
                    source: usr/bin/hatchet-admin-dev
                  - path: usr/bin/hatchet-migrate
                    source: usr/bin/hatchet-migrate-dev
                name: hatchet-lite-dev
            url: https://hatchet.run/
            version: 0.104.0
      paths:
        - type: file
          path: ${target.dir}/usr/bin/docker-entrypoint.sh
          uid: 0
          gid: 0
          mode: "0755"
          source: package/main/hatchet-lite/bin/docker-entrypoint.sh
os-release:
  name: Docker Hardened Images (Alpine)
  id: alpine
  version-id: "3.24"
  pretty-name: Docker Hardened Images/Alpine Linux v3.24
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
