# syntax=dhi.io/build:2-alpine3.23

image: dhi.io/pkg-build
variant: runtime
tags:
  - 2.26.0-alpine3.23
  - 2.26.0-r1-alpine3.23
platforms:
  - linux/amd64
  - linux/arm64
vars:
  COMMIT_SHA: 5e41a566c0785c1b43f37c91e9a58aa5394da7ec
  GOLANG_VERSION: 1.26.9-r0
  PACKAGE_NAME: build
  REL: "1"
  SEMVER_MAJOR_MINOR_VERSION: "2.26"
  SEMVER_MAJOR_VERSION: "2"
  SEMVER_VERSION: 2.26.0
  VERSION: 2.26.0
contents:
  repositories:
    - https://dhi.io/apk/alpine/v3.23/main
    - https://dl-cdn.alpinelinux.org/alpine/v3.23/main
    - https://dl-cdn.alpinelinux.org/alpine/v3.23/community
  keyring:
    - https://dhi.io/keyring/dhi-apk@docker-0F81AD7700D99184.rsa.pub
  packages:
    - alpine-baselayout-data
  builds:
    - name: build
      work-dir: /go/src/github.com/docker-hardened-images/frontend
      contents:
        packages:
          - busybox
          - bash
          - ca-certificates-bundle
          - git
          - golang-1.26
          - golang-1.26-oci-config
        files:
          - url: git+https://github.com/docker-hardened-images/frontend.git#v2.26.0
            checksum: 5e41a566c0785c1b43f37c91e9a58aa5394da7ec
            path: /go/src/github.com/docker-hardened-images/frontend
            uid: 0
            gid: 0
      pipeline:
        - name: check out private cli-plugins module
          privileged: true
          secrets:
            - id: github_token
              env: GITHUB_TOKEN
          runs: |
            set -eux -o pipefail

            git config --system credential."https://github.com".helper \
              '!f() { printf "username=x-access-token\npassword=%s\n" "${GITHUB_TOKEN}"; }; f'

            module=github.com/docker-hardened-images/cli-plugins
            target=/go/src/${module}

            version=$(awk -v m="${module}" '$1 == m { print $2; exit }' go.mod)
            [ -n "${version}" ]

            ref=${version}
            if printf '%s' "${version}" | grep -qE '[0-9]{14}-[0-9a-f]{12}$'; then
              ref=${version##*-}
            fi

            git clone "https://${module}.git" "${target}"
            git -C "${target}" checkout --detach "${ref}"
            rm -rf "${target}/.git"

            go mod edit -replace "${module}=${target}"
        - name: update go dependencies
          uses: go/bump@v2
          with:
            deps:
              - github.com/containerd/containerd/v2@v2.3.6
            tidy: true
        - uses: go/hermetic@v1
        - name: test
          runs: |
            set -eux -o pipefail

            CGO_ENABLED=0 go test ./cmd/dhi-build
        - name: build
          uses: go/build@v1
          with:
            fips: false
            output: ${target.dir}/usr/bin/build
            packages: ./cmd/dhi-build
        - name: build dev
          uses: go/build@v1
          with:
            fips: false
            output: ${target.dir}/usr/bin/build-dev
            packages: ./cmd/dhi-build
            strip: false
        - uses: dhi/build-pkg:0
          with:
            description: Buildkit frontend for building Docker Hardened Images
            files:
              - usr/bin/build
            license: Apache-2.0
            name: build
            rel: 1
            subpackages:
              - files:
                  - path: usr/bin/build
                    source: usr/bin/build-dev
                name: build-dev
            url: https://github.com/docker-hardened-images/frontend
            version: 2.26.0
os-release:
  name: Docker Hardened Images (Alpine)
  id: alpine
  version-id: "3.23"
  pretty-name: Docker Hardened Images/Alpine Linux v3.23
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
