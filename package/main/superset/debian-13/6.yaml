# syntax=dhi.io/build:2-debian13

image: dhi.io/pkg-superset
variant: runtime
tags:
  - 6.1.0
  - 6.1.0-r0
  - 6.1.0-debian13
  - 6.1.0-r0-debian13
platforms:
  - linux/amd64
  - linux/arm64
dates:
  release: "2025-12-18"
vars:
  ARCH: '#{ target.arch == "amd64" ? "x86_64" : "aarch64" }'
  COMMIT_SHA: c83fb2bb1dcfac41ac51bcebd82471f4a7180d18
  NODEJS_VERSION: 24.19.0-0
  PYTHON_MAJOR_MINOR_VERSION: "3.11"
  PYTHON_MINOR: "3.11"
  PYTHON_VERSION: 3.11.15-11
  REL: "0"
  SEMVER_MAJOR_MINOR_VERSION: "6.1"
  SEMVER_MAJOR_VERSION: "6"
  SEMVER_VERSION: 6.1.0
  UV_VERSION: 0.11.23
  VERSION: 6.1.0
contents:
  packages:
    - base-files
  builds:
    - name: superset
      environment:
        UV_NO_MANAGED_PYTHON: "true"
        UV_PYTHON: /usr/bin/python3.11
        UV_PYTHON_DOWNLOADS: never
      caches:
        - path: /root/.cache/uv
        - path: /root/.cache/pip
        - path: /root/.npm
      contents:
        repositories:
          - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
        keyring:
          - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
        packages:
          - bash
          - build-essential
          - ca-certificates
          - coreutils
          - default-libmysqlclient-dev
          - diffutils
          - findutils
          - g++
          - gawk
          - gcc
          - git
          - gnu-which
          - grep
          - gzip
          - libecpg-dev
          - libffi-dev
          - libldap2-dev
          - libpq-dev
          - libsasl2-dev
          - libssl-dev
          - libstdc++6
          - libxml2-dev
          - libxmlsec1-dev
          - libpython-3.11-minimal=3.11.15-11
          - libpython-3.11-stdlib=3.11.15-11
          - libpython-3.11=3.11.15-11
          - libpython-3.11-dev=3.11.15-11
          - make
          - mawk
          - node-corepack
          - nodejs-24=24.19.0-0
          - npm
          - pkg-config
          - python-3.11-minimal=3.11.15-11
          - python-3.11=3.11.15-11
          - python-3.11-dev=3.11.15-11
          - python3-pip
          - python3-setuptools
          - python3-wheel
          - sed
          - yarn-classic
          - zstd
        files:
          - url: https://github.com/astral-sh/uv/releases/download/0.11.23/uv-${ARCH}-unknown-linux-gnu.tar.gz
            path: ${source.dir}/uv-unknown-linux-gnu.tar.gz
            uid: 0
            gid: 0
          - url: git+https://github.com/apache/superset.git#6.1.0
            checksum: c83fb2bb1dcfac41ac51bcebd82471f4a7180d18
            path: ${source.dir}/superset
            spdx:
              name: superset
              version: 6.1.0
              packages:
                - name: superset
                  purl: pkg:dhi/superset@6.1.0
                  license: Apache-2.0
            uid: 0
            gid: 0
      pipeline:
        - name: setup uv
          runs: |
            set -eux -o pipefail

            mkdir -p /usr/local/bin
            tar -xzf "${source.dir}/uv-unknown-linux-gnu.tar.gz" -C /usr/local/bin --strip-components=1
            chmod +x /usr/local/bin/uv
        - name: bump frontend axios for cves
          uses: npm/bump@v1
          work-dir: ${source.dir}/superset/superset-frontend
          privileged: true
          environment:
            DHI_NO_SFW: "true"
          with:
            bumps: ${source.dir}/patch/npm-bumps.json
            npm-root: ${source.dir}/superset/superset-frontend
        - name: install frontend deps
          work-dir: ${source.dir}/superset/superset-frontend
          privileged: true
          runs: |
            set -eux -o pipefail

            npm install --prefer-offline --no-audit --no-fund
        - name: build frontend
          work-dir: ${source.dir}/superset/superset-frontend
          environment:
            PUPPETEER_SKIP_CHROMIUM_DOWNLOAD: "true"
          runs: |
            set -eux -o pipefail

            npm run build
        - name: build translations
          work-dir: ${source.dir}/superset/superset-frontend
          runs: |
            set -eux -o pipefail

            npm run build-translation
        - name: reinstall production deps for sbom
          work-dir: ${source.dir}/superset/superset-frontend
          privileged: true
          runs: |
            set -eux -o pipefail

            rm -rf node_modules
            npm install --omit=dev --ignore-scripts --prefer-offline --no-audit --no-fund
        - name: bump frontend prod deps for cves
          uses: npm/bump@v1
          work-dir: ${source.dir}/superset/superset-frontend
          privileged: true
          environment:
            DHI_NO_SFW: "true"
          with:
            bumps: ${source.dir}/patch/npm-bumps.json
            npm-root: ${source.dir}/superset/superset-frontend
        - name: ui sbom
          uses: sbom@v1
          with:
            extra-scanners: javascript-package-cataloger
            prefix: superset-frontend
            source: ${source.dir}/superset/superset-frontend
        - name: build python environment
          work-dir: ${source.dir}/superset
          privileged: true
          runs: |
            set -eux -o pipefail

            root="${target.dir}/usr/lib/superset"
            mkdir -p "${root}"

            sed -i 's/editable = true/editable = false/g' pyproject.toml

            uv venv "${root}/.venv"
            export UV_PYTHON="${root}/.venv/bin/python"
            export UV_PROJECT_ENVIRONMENT="${root}/.venv"
            . "${root}/.venv/bin/activate"
            uv pip install --upgrade pip setuptools 'wheel>=0.46.2'
            uv pip install -r requirements/base.txt

            uv build superset-core
            uv build .
            uv pip install --force-reinstall --no-deps \
              superset-core/dist/*.whl \
              dist/*.whl

            if find "${root}/.venv" \( -name '__editable__*' -o -name '__editable___*' \) | grep -q .; then
              echo "editable install artifacts remain in venv" >&2
              exit 1
            fi

            uv pip install --upgrade 'msgpack>=1.2.1'
            uv pip install --upgrade 'pyarrow>=17.0.0'
            uv pip install --upgrade 'urllib3>=2.6.3'
            uv pip install --upgrade 'pillow>=12.2.0'
            uv pip install --upgrade 'pyasn1>=0.6.3'
            uv pip install --upgrade 'pyopenssl>=26.0.0'
            uv pip install --upgrade 'cryptography>=46.0.6'
            uv pip install --upgrade 'brotli>=1.2.0'
            uv pip install --upgrade 'pyjwt>=2.12.1'
            uv pip install --upgrade 'werkzeug>=3.1.6'
            uv pip install --upgrade 'requests>=2.33.0'
            uv pip install --upgrade 'marshmallow>=3.26.2,<4'
            uv pip install --upgrade 'pynacl>=1.6.2'
            uv pip install --upgrade 'wheel>=0.46.2'
            uv pip install --upgrade 'markdown>=3.8.1'
            uv pip install --upgrade 'mako>=1.3.11'
            uv pip install --upgrade 'python-dotenv>=1.2.2'
            uv pip install --upgrade 'pygments>=2.20.0'
            uv pip install --upgrade 'jaraco-context>=6.1.0'
            uv pip install --upgrade 'click>=8.3.3'
            uv pip install --upgrade 'setuptools>=83.0.0'

            uv pip install Babel
            pybabel compile -d "${source.dir}/superset/superset/translations" || true
            rm -f "${source.dir}/superset/superset/translations"/*/*/*.po
            rm -f "${source.dir}/superset/superset/translations"/*/*/*.json

            python -m compileall -q "${source.dir}/superset/superset" "${root}/.venv/lib"

            sed -i '1s|.*|#!/bin/sh|' "${source.dir}/superset/docker/entrypoints/run-server.sh"
        - name: stage superset payload
          runs: |
            set -eux -o pipefail

            src="${source.dir}/superset"
            root="${target.dir}/usr/lib/superset"

            mkdir -p "${root}/superset-frontend" "${target.dir}/usr/bin"

            for item in superset superset-core docker pyproject.toml setup.py MANIFEST.in README.md; do
              cp -a "${src}/${item}" "${root}/"
            done

            cp -a "${src}/superset-frontend/package.json" "${root}/superset-frontend/package.json"
            cp -a "${src}/docker/entrypoints/run-server.sh" "${target.dir}/usr/bin/run-server.sh"
            chmod 0755 "${target.dir}/usr/bin/run-server.sh"

            for f in "${root}/.venv/bin"/*; do
              [ -f "$f" ] || continue
              read -r line < "$f" || true
              case "$line" in
                "#!${target.dir}"*) sed -i "1s|#!${target.dir}|#!|" "$f" ;;
              esac
            done

            if [ -e "${root}/.venv/bin/superset" ]; then
              ln -sf ../lib/superset/.venv/bin/superset "${target.dir}/usr/bin/superset"
            fi
        - name: cleanup staged venv
          runs: |
            set -eux -o pipefail

            root="${target.dir}/usr/lib/superset"
            find "${root}" \( -type d -a \( -name __pycache__ -o -name test -o -name tests \) \) -prune -exec rm -rf {} + || true
            find "${root}" -type f \( -name '*.pyc' -o -name '*.pyo' \) -delete || true
        - uses: dhi/build-pkg:0
          with:
            depends:
              - python-3.11
            description: Apache Superset data exploration and visualization platform
            files:
              - usr/lib/superset
              - usr/bin/run-server.sh
              - usr/bin/superset
            formats:
              - deb
            license: Apache-2.0
            name: superset
            rel: 0
            url: https://superset.apache.org/
            version: 6.1.0
      paths:
        - type: file
          path: ${source.dir}/patch/npm-bumps.json
          uid: 0
          gid: 0
          source: package/main/superset/patch/npm-bumps.json
os-release:
  name: Docker Hardened Images (Debian)
  id: debian
  version-id: "13"
  version-codename: trixie
  pretty-name: Docker Hardened Images/Debian GNU/Linux 13 (trixie)
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
