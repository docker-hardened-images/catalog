# syntax=dhi.io/build:2-debian13

image: dhi.io/pkg-superset
variant: runtime
tags:
  - 6.1.0
  - 6.1.0-r31
  - 6.1.0-debian13
  - 6.1.0-r31-debian13
platforms:
  - linux/amd64
  - linux/arm64
dates:
  release: "2025-12-18"
vars:
  ARCH: '#{ target.arch == "amd64" ? "x86_64" : "aarch64" }'
  COMMIT_SHA: c83fb2bb1dcfac41ac51bcebd82471f4a7180d18
  NODEJS_VERSION: 24.22.2-0
  PYTHON_MAJOR_MINOR_VERSION: "3.11"
  PYTHON_MINOR: "3.11"
  PYTHON_VERSION: 3.11.18-2
  REL: "31"
  SEMVER_MAJOR_MINOR_VERSION: "6.1"
  SEMVER_MAJOR_VERSION: "6"
  SEMVER_VERSION: 6.1.0
  UV_VERSION: 0.11.23
  VERSION: 6.1.0
contents:
  packages:
    - base-files
  builds:
    - name: superset
      environment:
        UV_NO_MANAGED_PYTHON: "true"
        UV_PYTHON: /usr/bin/python3.11
        UV_PYTHON_DOWNLOADS: never
      caches:
        - path: /root/.cache/uv
        - path: /root/.cache/pip
        - path: /root/.npm
      contents:
        repositories:
          - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
        keyring:
          - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
        packages:
          - bash
          - build-essential
          - ca-certificates
          - coreutils
          - default-libmysqlclient-dev
          - diffutils
          - findutils
          - g++
          - gawk
          - gcc
          - git
          - gnu-which
          - grep
          - gzip
          - libecpg-dev
          - libffi-dev
          - libldap2-dev
          - libpq-dev
          - libsasl2-dev
          - libssl-dev
          - libstdc++6
          - libxml2-dev
          - libxmlsec1-dev
          - libpython-3.11-minimal=3.11.18-2
          - libpython-3.11-stdlib=3.11.18-2
          - libpython-3.11=3.11.18-2
          - libpython-3.11-dev=3.11.18-2
          - make
          - mawk
          - node-corepack
          - nodejs-24=24.22.2-0
          - npm
          - pkg-config
          - python-3.11-minimal=3.11.18-2
          - python-3.11=3.11.18-2
          - python-3.11-dev=3.11.18-2
          - python3-pip
          - python3-setuptools
          - python3-wheel
          - sed
          - yarn-classic
          - zstd
        files:
          - url: https://github.com/astral-sh/uv/releases/download/0.11.23/uv-${ARCH}-unknown-linux-gnu.tar.gz
            path: ${source.dir}/uv-unknown-linux-gnu.tar.gz
            uid: 0
            gid: 0
          - url: git+https://github.com/apache/superset.git#6.1.0
            checksum: c83fb2bb1dcfac41ac51bcebd82471f4a7180d18
            path: ${source.dir}/superset
            spdx:
              name: superset
              version: 6.1.0
              packages:
                - name: superset
                  purl: pkg:dhi/superset@6.1.0
                  license: Apache-2.0
            uid: 0
            gid: 0
      pipeline:
        - name: setup uv
          runs: |
            set -eux -o pipefail

            mkdir -p /usr/local/bin
            tar -xzf "${source.dir}/uv-unknown-linux-gnu.tar.gz" -C /usr/local/bin --strip-components=1
            chmod +x /usr/local/bin/uv
        - name: bump frontend axios for cves
          uses: npm/bump@v1
          work-dir: ${source.dir}/superset/superset-frontend
          privileged: true
          environment:
            DHI_NO_SFW: "true"
          with:
            bumps: ${source.dir}/patch/npm-bumps.json
            npm-root: ${source.dir}/superset/superset-frontend
            omit-dev: false
        - name: refresh simple-git lockfile
          work-dir: ${source.dir}/superset/superset-frontend
          privileged: true
          runs: |
            set -eux -o pipefail

            npm update simple-git
        - name: install frontend deps
          work-dir: ${source.dir}/superset/superset-frontend
          privileged: true
          runs: |
            set -eux -o pipefail

            npm install --prefer-offline --no-audit --no-fund
        - name: build frontend
          work-dir: ${source.dir}/superset/superset-frontend
          environment:
            PUPPETEER_SKIP_CHROMIUM_DOWNLOAD: "true"
          runs: |
            set -eux -o pipefail

            npm run build
        - name: build translations
          work-dir: ${source.dir}/superset/superset-frontend
          runs: |
            set -eux -o pipefail

            npm run build-translation
        - name: reinstall production deps for sbom
          work-dir: ${source.dir}/superset/superset-frontend
          privileged: true
          runs: |
            set -eux -o pipefail

            rm -rf node_modules
            npm install --omit=dev --ignore-scripts --prefer-offline --no-audit --no-fund
        - name: bump fflate for CVE-2026-45820
          work-dir: ${source.dir}/superset/superset-frontend
          privileged: true
          runs: |
            set -eux -o pipefail

            node << 'NODE'
            const fs = require('fs');
            const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
            pkg.overrides = pkg.overrides || {};
            pkg.overrides['fflate@0.7'] = '0.7.5';
            pkg.overrides['fflate@0.8'] = '0.8.3';
            pkg.overrides['@simple-git/argv-parser'] = '2.0.1';
            fs.writeFileSync('package.json', `${JSON.stringify(pkg, null, 2)}\n`);
            NODE
            npm install --omit=dev --ignore-scripts --prefer-offline --no-audit --no-fund
        - name: bump frontend prod deps for cves
          uses: npm/bump@v1
          work-dir: ${source.dir}/superset/superset-frontend
          privileged: true
          environment:
            DHI_NO_SFW: "true"
          with:
            bumps: ${source.dir}/patch/npm-bumps.json
            npm-root: ${source.dir}/superset/superset-frontend
        - name: refresh argv-parser for CVE-2026-102829
          work-dir: ${source.dir}/superset/superset-frontend
          privileged: true
          runs: |
            set -eux -o pipefail

            npm update @simple-git/argv-parser --omit=dev --prefer-offline --no-audit --no-fund
        - name: ui sbom
          uses: sbom@v1
          with:
            extra-scanners: javascript-package-cataloger
            prefix: superset-frontend
            source: ${source.dir}/superset/superset-frontend
        - name: build python environment
          work-dir: ${source.dir}/superset
          privileged: true
          runs: |
            set -eux -o pipefail

            root="${target.dir}/usr/lib/superset"
            mkdir -p "${root}"

            sed -i 's/editable = true/editable = false/g' pyproject.toml

            uv venv "${root}/.venv"
            export UV_PYTHON="${root}/.venv/bin/python"
            export UV_PROJECT_ENVIRONMENT="${root}/.venv"
            . "${root}/.venv/bin/activate"
            uv pip install --upgrade pip setuptools 'wheel>=0.46.2'
            uv pip install -r requirements/base.txt

            uv build superset-core
            uv build .
            uv pip install --force-reinstall --no-deps \
              superset-core/dist/*.whl \
              dist/*.whl

            if find "${root}/.venv" \( -name '__editable__*' -o -name '__editable___*' \) | grep -q .; then
              echo "editable install artifacts remain in venv" >&2
              exit 1
            fi

            uv pip install --upgrade 'msgpack>=1.2.3'
            uv pip install --upgrade 'dnspython>=2.9.0'
            uv pip install --upgrade 'pyarrow>=17.0.0,<26' # PyArrow 26 requires NumPy 2; Superset 6.1 pins NumPy 1.26.
            uv pip install --upgrade 'geopy>=2.5.0,<3'     # CVE-2026-77387
            uv pip install --upgrade 'pillow>=12.2.0'
            uv pip install --upgrade 'pyasn1>=0.6.3'
            uv pip install --upgrade 'pyopenssl>=26.0.0'
            uv pip install --upgrade 'cryptography>=46.0.6'
            uv pip install --upgrade 'brotli>=1.2.0'
            uv pip install --upgrade 'pyjwt>=2.12.1'
            uv pip install --upgrade 'werkzeug>=3.1.6'
            uv pip install --upgrade 'requests>=2.33.0'
            uv pip install --upgrade 'flask>=3.1.3'                                # CVE-2026-27205
            uv pip install --upgrade 'flask-babel>=4.0.0'                          # Flask 3.1.x compat (locked_cached_property removed)
            uv pip install --upgrade 'flask-sqlalchemy>=3.0.5,<3.1' 'sqlalchemy<2' # Flask 3.x compat; stay on flask-sqlalchemy 3.0.x so SQLAlchemy remains 1.4 (superset needs <2; flask-sqlalchemy>=3.1 requires SQLAlchemy 2.0)
            uv pip install --upgrade 'marshmallow>=3.26.2,<4'
            uv pip install --upgrade 'pynacl>=1.6.2'
            uv pip install --upgrade 'wheel>=0.46.2'
            uv pip install --upgrade 'markdown>=3.8.1'
            uv pip install --upgrade 'mako>=1.3.11'
            uv pip install --upgrade 'python-dotenv>=1.2.2'
            uv pip install --upgrade 'pygments>=2.20.0'
            uv pip install --upgrade 'jaraco-context>=6.1.0'
            uv pip install --upgrade 'click>=8.3.3'
            uv pip install --upgrade 'setuptools>=84.1.0'
            uv pip install --upgrade 'filelock>=4.2.1' # CVE-2026-112909, CVE-2026-112910
            uv pip install --upgrade 'paramiko>=5.0.0' # CVE-2026-44405

            sp="${root}/.venv/lib/python3.11/site-packages"
            uv pip install --upgrade 'urllib3==2.8.0'
            rm -rf "${sp}/pip/_vendor/urllib3"
            cp -a "${sp}/urllib3" "${sp}/pip/_vendor/urllib3"
            cp -a "${sp}/urllib3-2.8.0.dist-info/licenses/LICENSE.txt" "${sp}/pip/_vendor/urllib3/LICENSE.txt"
            sed -i 's/urllib3==2\.7\.0/urllib3==2.8.0/' "${sp}/pip/_vendor/vendor.txt"
            grep -q 'urllib3==2.8.0' "${sp}/pip/_vendor/vendor.txt"
            if [ -f "${sp}/pip/_vendor/bom.cdx.json" ]; then
              sed -i 's/pkg:pypi\/urllib3@2\.7\.0/pkg:pypi\/urllib3@2.8.0/g' "${sp}/pip/_vendor/bom.cdx.json"
              sed -i 's/"version": "2.7.0"/"version": "2.8.0"/' "${sp}/pip/_vendor/bom.cdx.json"
              grep -q 'pkg:pypi/urllib3@2.8.0' "${sp}/pip/_vendor/bom.cdx.json"
            fi

            uv pip install Babel
            pybabel compile -d "${source.dir}/superset/superset/translations" || true
            rm -f "${source.dir}/superset/superset/translations"/*/*/*.po
            rm -f "${source.dir}/superset/superset/translations"/*/*/*.json

            sed -i '1s|.*|#!/bin/sh|' "${source.dir}/superset/docker/entrypoints/run-server.sh"
        - name: align pip vendored msgpack with site packages
          runs: |
            set -eux -o pipefail

            sp="${target.dir}/usr/lib/superset/.venv/lib/python3.11/site-packages"
            set -- "$sp"/msgpack-*.dist-info/METADATA
            if [ "$#" -ne 1 ] || [ ! -f "$1" ]; then
              echo "expected exactly one msgpack dist-info" >&2
              exit 1
            fi
            msgpack_ver=$(sed -n 's/^Version: //p' "$1" | head -n 1)
            dist_name=$(basename "$(dirname "$1")")
            dist_ver=${dist_name#msgpack-}
            dist_ver=${dist_ver%.dist-info}
            if [ "$dist_ver" != "$msgpack_ver" ]; then
              echo "msgpack dist-info ${dist_ver} does not match METADATA ${msgpack_ver}" >&2
              exit 1
            fi

            rm -rf "$sp/pip/_vendor/msgpack"
            cp -a "$sp/msgpack" "$sp/pip/_vendor/msgpack"

            python3 - "$sp/pip/_vendor/vendor.txt" "$sp/pip/_vendor/bom.cdx.json" "$msgpack_ver" << 'PY'
            import json
            import sys

            vendor_path, bom_path, ver = sys.argv[1:]

            def version_tuple(value):
                core = value.split("+", 1)[0].split("-", 1)[0]
                parts = core.split(".")
                if len(parts) < 3 or not all(part.isdigit() for part in parts):
                    raise SystemExit("unexpected msgpack version %s" % value)
                return tuple(int(part) for part in parts[:3])

            if version_tuple(ver) < (1, 2, 3):
                raise SystemExit("msgpack %s is below the 1.2.3 override" % ver)

            with open(vendor_path) as handle:
                lines = handle.read().splitlines()
            replaced = 0
            updated_lines = []
            for line in lines:
                stripped = line.lstrip(" ")
                if stripped.startswith("msgpack=="):
                    indent = line[:len(line) - len(stripped)]
                    updated_lines.append("%smsgpack==%s" % (indent, ver))
                    replaced += 1
                else:
                    updated_lines.append(line)
            if replaced != 1:
                raise SystemExit("expected one msgpack pin in vendor.txt, found %s" % replaced)
            vendor_text = "\n".join(updated_lines) + "\n"
            if ("msgpack==%s" % ver) not in vendor_text:
                raise SystemExit("vendor.txt msgpack pin was not updated")
            with open(vendor_path, "w") as handle:
                handle.write(vendor_text)

            with open(bom_path) as handle:
                original = handle.read()
            bom = json.loads(original)
            comps = [comp for comp in bom.get("components", []) if comp.get("name") == "msgpack"]
            if len(comps) != 1:
                raise SystemExit("expected one msgpack component, found %s" % len(comps))
            comp = comps[0]
            old = comp.get("version")
            if not isinstance(old, str) or not old:
                raise SystemExit("msgpack component has no version")
            others_before = [
                (item.get("name"), item.get("version"), item.get("purl"))
                for item in bom.get("components", [])
                if item.get("name") != "msgpack"
            ]
            old_ref = "pkg:pypi/msgpack@%s" % old
            new_ref = "pkg:pypi/msgpack@%s" % ver
            old_count = original.count(old_ref)
            if old_count < 1:
                raise SystemExit("bom is missing %s" % old_ref)
            comp["version"] = ver
            for key in ("purl", "bom-ref"):
                value = comp.get(key)
                if not isinstance(value, str) or not value.startswith("pkg:pypi/msgpack@"):
                    raise SystemExit("msgpack %s is not a pypi purl" % key)
                comp[key] = new_ref

            def rewrite(node):
                if isinstance(node, dict):
                    return {key: rewrite(value) for key, value in node.items()}
                if isinstance(node, list):
                    return [new_ref if item == old_ref else rewrite(item) for item in node]
                if node == old_ref:
                    return new_ref
                return node

            rewritten = rewrite(bom)
            updated = next(item for item in rewritten["components"] if item.get("name") == "msgpack")
            if updated.get("version") != ver or updated.get("purl") != new_ref or updated.get("bom-ref") != new_ref:
                raise SystemExit("msgpack component metadata was not updated")
            others_after = [
                (item.get("name"), item.get("version"), item.get("purl"))
                for item in rewritten.get("components", [])
                if item.get("name") != "msgpack"
            ]
            if others_before != others_after:
                raise SystemExit("non-msgpack component metadata changed")
            rendered = json.dumps(rewritten)
            if old != ver and old_ref in rendered:
                raise SystemExit("stale %s remains in bom" % old_ref)
            if rendered.count(new_ref) < old_count:
                raise SystemExit("bom kept fewer msgpack refs than it started with")
            with open(bom_path, "w") as handle:
                json.dump(rewritten, handle, indent=2)
                handle.write("\n")
            PY
        - name: drop pip vendored pkg_resources
          runs: |
            set -eux -o pipefail

            sp="${target.dir}/usr/lib/superset/.venv/lib/python3.11/site-packages"
            rm -rf "$sp/pip/_vendor/pkg_resources"
            sed -i '/^setuptools==/d' "$sp/pip/_vendor/vendor.txt"
            python3.11 - "$sp/pip/_vendor/bom.cdx.json" << 'PY'
            import json
            import sys

            path = sys.argv[1]
            with open(path, encoding="utf-8") as handle:
                doc = json.load(handle)

            def is_setuptools_ref(value):
                return isinstance(value, str) and value.startswith("pkg:pypi/setuptools@")

            doc["components"] = [
                comp for comp in (doc.get("components") or [])
                if comp.get("name") != "setuptools"
            ]
            kept = []
            for dep in doc.get("dependencies") or []:
                if is_setuptools_ref(dep.get("ref")):
                    continue
                depends = dep.get("dependsOn")
                if isinstance(depends, list):
                    dep["dependsOn"] = [item for item in depends if not is_setuptools_ref(item)]
                kept.append(dep)
            doc["dependencies"] = kept
            rendered = json.dumps(doc)
            if "setuptools" in rendered:
                raise SystemExit("setuptools remains in pip vendor bom")
            with open(path, "w", encoding="utf-8") as handle:
                json.dump(doc, handle, indent=2)
                handle.write("\n")
            PY
            if grep -E 'setuptools==|pkg:pypi/setuptools@' "$sp/pip/_vendor/vendor.txt" "$sp/pip/_vendor/bom.cdx.json"; then
              echo "pip vendor metadata still names setuptools" >&2
              exit 1
            fi
            test ! -e "$sp/pip/_vendor/pkg_resources"
            PYTHONPATH="$sp" python3.11 -m pip --version
        - name: python dependencies sbom
          uses: sbom@v1
          with:
            extra-scanners: python-package-cataloger
            prefix: superset-python
            source: ${target.dir}/usr/lib/superset
        - name: apply pip urllib3 vendoring patches
          uses: patch@v1
          work-dir: ${target.dir}/usr/lib/superset/.venv/lib/python3.11/site-packages/pip/_vendor
          with:
            options: -p4
            patches:
              - ${source.dir}/patch/pip-urllib3/urllib3.patch
              - ${source.dir}/patch/pip-urllib3/urllib3-disable-brotli.patch
              - ${source.dir}/patch/pip-urllib3/urllib3-fix-emscripten-import.patch
        - name: rewrite pip urllib3 imports
          runs: |
            set -eux -o pipefail

            sp="${target.dir}/usr/lib/superset/.venv/lib/python3.11/site-packages"
            python3 "${source.dir}/patch/pip-urllib3/rewrite_imports.py" "${sp}/pip/_vendor/urllib3"
        - name: compile patched Python environment
          runs: |
            set -eux -o pipefail

            root="${target.dir}/usr/lib/superset"
            "${root}/.venv/bin/python" -m compileall -q "${source.dir}/superset/superset" "${root}/.venv/lib"
        - name: stage superset payload
          runs: |
            set -eux -o pipefail

            src="${source.dir}/superset"
            root="${target.dir}/usr/lib/superset"

            mkdir -p "${root}/superset-frontend" "${target.dir}/usr/bin"

            for item in superset superset-core docker pyproject.toml setup.py MANIFEST.in README.md; do
              cp -a "${src}/${item}" "${root}/"
            done

            cp -a "${src}/superset-frontend/package.json" "${root}/superset-frontend/package.json"
            cp -a "${src}/docker/entrypoints/run-server.sh" "${target.dir}/usr/bin/run-server.sh"
            chmod 0755 "${target.dir}/usr/bin/run-server.sh"

            for f in "${root}/.venv/bin"/*; do
              [ -f "$f" ] || continue
              read -r line < "$f" || true
              case "$line" in
                "#!${target.dir}"*) sed -i "1s|#!${target.dir}|#!|" "$f" ;;
              esac
            done

            if [ -e "${root}/.venv/bin/superset" ]; then
              ln -sf ../lib/superset/.venv/bin/superset "${target.dir}/usr/bin/superset"
            fi
        - name: cleanup staged venv
          runs: |
            set -eux -o pipefail

            root="${target.dir}/usr/lib/superset"
            find "${root}" \( -type d -a \( -name __pycache__ -o -name test -o -name tests \) \) -prune -exec rm -rf {} + || true
            find "${root}" -type f \( -name '*.pyc' -o -name '*.pyo' \) -delete || true
        - uses: dhi/build-pkg:0
          with:
            depends:
              - python-3.11
            description: Apache Superset data exploration and visualization platform
            files:
              - usr/lib/superset
              - usr/bin/run-server.sh
              - usr/bin/superset
            formats:
              - deb
            license: Apache-2.0
            name: superset
            rel: 31
            url: https://superset.apache.org/
            version: 6.1.0
      paths:
        - type: file
          path: ${source.dir}/patch/npm-bumps.json
          uid: 0
          gid: 0
          source: package/main/superset/patch/npm-bumps.json
        - type: file
          path: ${source.dir}/patch/pip-urllib3/urllib3.patch
          uid: 0
          gid: 0
          source: package/main/superset/patch/pip-urllib3/urllib3.patch
        - type: file
          path: ${source.dir}/patch/pip-urllib3/urllib3-disable-brotli.patch
          uid: 0
          gid: 0
          source: package/main/superset/patch/pip-urllib3/urllib3-disable-brotli.patch
        - type: file
          path: ${source.dir}/patch/pip-urllib3/urllib3-fix-emscripten-import.patch
          uid: 0
          gid: 0
          source: package/main/superset/patch/pip-urllib3/urllib3-fix-emscripten-import.patch
        - type: file
          path: ${source.dir}/patch/pip-urllib3/rewrite_imports.py
          uid: 0
          gid: 0
          source: package/main/superset/patch/pip-urllib3/rewrite_imports.py
os-release:
  name: Docker Hardened Images (Debian)
  id: debian
  version-id: "13"
  version-codename: trixie
  pretty-name: Docker Hardened Images/Debian GNU/Linux 13 (trixie)
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
