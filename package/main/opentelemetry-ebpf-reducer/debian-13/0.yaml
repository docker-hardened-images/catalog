# syntax=dhi.io/build:2-debian13

image: dhi.io/pkg-opentelemetry-ebpf-reducer
variant: runtime
tags:
  - 0.11.0
  - 0.11.0-r0
  - 0.11.0-debian13
  - 0.11.0-r0-debian13
platforms:
  - linux/amd64
vars:
  BREAKPAD_COMMIT_SHA: 418aacd617897c19d960ec3e649f42ea95a6363a
  BREAKPAD_VERSION: 2026.08.11
  COMMIT_SHA: 5e07f9d6875c72ea0e4e2e44a13a83c13b0d17c5
  REL: "0"
  SEMVER_MAJOR_MINOR_VERSION: "0.11"
  SEMVER_MAJOR_VERSION: "0"
  SEMVER_VERSION: 0.11.0
  VERSION: 0.11.0
contents:
  repositories:
    - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
  keyring:
    - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
  packages:
    - base-files
  builds:
    - name: opentelemetry-ebpf-reducer
      work-dir: ${source.dir}/opentelemetry-network
      caches:
        - path: /ccache
      contents:
        packages:
          - base-files
          - bash
          - coreutils
          - findutils
          - sed
          - grep
          - tar
          - gzip
          - wget
          - build-essential
          - g++
          - gcc
          - make
          - cmake
          - ninja-build
          - ccache
          - git
          - pkg-config
          - autoconf
          - automake
          - autoconf-archive
          - libtool
          - gawk
          - diffutils
          - llvm-19-dev
          - libclang-19-dev
          - clang-19
          - libpolly-19-dev
          - libbpf-dev
          - default-jdk-headless
          - libc-ares-dev
          - libelf-dev
          - libssl-dev
          - libzstd-dev
          - zlib1g-dev
          - libgrpc-dev
          - libgrpc++-dev
          - libprotobuf-dev
          - protobuf-compiler
          - protobuf-compiler-grpc
          - libabsl-dev
          - libcurl4-openssl-dev
          - libcurlpp-dev
          - aws-sdk-cpp
          - xxd
          - ca-certificates
        files:
          - url: git+https://github.com/open-telemetry/opentelemetry-network.git#v0.11.0
            checksum: 5e07f9d6875c72ea0e4e2e44a13a83c13b0d17c5
            path: ${source.dir}/opentelemetry-network
            spdx:
              name: opentelemetry-ebpf-reducer
              version: 0.11.0
              packages:
                - name: opentelemetry-network
                  purl: pkg:github/open-telemetry/opentelemetry-network@v0.11.0
                  license: Apache-2.0
                - name: civetweb
                  purl: pkg:github/civetweb/civetweb@4b440a339979852d5a51fb11a822952712231c23
                  license: MIT
                - name: libuv
                  purl: pkg:github/libuv/libuv@0a6771cee4c15184c924bfe9d397bdd0c3b206ba
                  license: MIT
                - name: yaml-cpp
                  purl: pkg:github/jbeder/yaml-cpp@47cd2725d61e54719933b83ea51c64ad60c24066
                  license: MIT
                - name: nlohmann-json
                  purl: pkg:github/nlohmann/json@b36f4c477c40356a0ae1204b567cca3c2a57d201
                  license: MIT
                - name: lz4
                  purl: pkg:github/lz4/lz4@e0781fbe4b667f529864b268c5df491a9094e3f0
                  license: BSD-2-Clause
                - name: libmaxminddb
                  purl: pkg:github/maxmind/libmaxminddb@0fd88980cee8f62b8a8d1dc0f207f60ce7484a08
                  license: Apache-2.0
                - name: spdlog
                  purl: pkg:github/gabime/spdlog@ad0e89cbfb4d0c1ce4d097e134eb7be67baebb36
                  license: MIT
                - name: args
                  purl: pkg:github/Taywee/args@cc2368ca0d8a962862c96c00fe919e1480050f51
                  license: MIT
                - name: opentelemetry-proto
                  purl: pkg:github/open-telemetry/opentelemetry-proto@833a4ebd5318b3dce6a63b323ff7a6f44b43472c
                  license: Apache-2.0
                - name: ccan
                  purl: pkg:github/rustyrussell/ccan
                  license: NOASSERTION
            uid: 0
            gid: 0
          - url: git+https://github.com/google/breakpad.git#418aacd617897c19d960ec3e649f42ea95a6363a
            checksum: 418aacd617897c19d960ec3e649f42ea95a6363a
            path: ${source.dir}/breakpad
            spdx:
              name: breakpad
              version: 418aacd617897c19d960ec3e649f42ea95a6363a
              packages:
                - name: breakpad
                  purl: pkg:github/google/breakpad@418aacd617897c19d960ec3e649f42ea95a6363a
                  license: BSD-3-Clause
            uid: 0
            gid: 0
      pipeline:
        - name: fetch vendored submodules
          privileged: true
          runs: |
            set -eux -o pipefail

            git submodule update --init --recursive --depth 1 -- \
              ext/civetweb \
              build-tools/cpp_misc/spdlog \
              build-tools/libuv/libuv \
              build-tools/cpp_misc/yaml-cpp \
              build-tools/cpp_misc/lz4 \
              build-tools/libmaxminddb/libmaxminddb \
              build-tools/opentelemetry/opentelemetry-proto \
              build-tools/cpp_misc/args \
              build-tools/cpp_misc/json
        - name: apply trixie/GCC 14 backport and DHI fixes
          uses: patch@v1
          with:
            options: -p1
            patches:
              - ${source.dir}/patch/dhi-trixie-gcc14-missing-cstdint.patch
              - ${source.dir}/patch/dhi-fmt-ambiguous-format-to.patch
              - ${source.dir}/patch/dhi-health-check-drop-rev-dependency.patch
        - name: build private C++ dependencies
          privileged: true
          runs: |
            set -eux -o pipefail

            INSTALL_PREFIX="${source.dir}/deps-install"
            mkdir -p "$INSTALL_PREFIX"

            (cd build-tools/libuv/libuv && ./autogen.sh)
            mkdir -p "${source.dir}/build-libuv"
            (cd "${source.dir}/build-libuv" \
              && "${source.dir}/opentelemetry-network/build-tools/libuv/libuv/configure" --prefix="$INSTALL_PREFIX" \
              && make -j"$(nproc)" && make install)

            mkdir -p "${source.dir}/build-yaml-cpp"
            (cd "${source.dir}/build-yaml-cpp" \
              && cmake -G Ninja \
                -DCMAKE_INSTALL_PREFIX:PATH="$INSTALL_PREFIX" \
                -DCMAKE_BUILD_TYPE=Release \
                "${source.dir}/opentelemetry-network/build-tools/cpp_misc/yaml-cpp" \
              && ninja && ninja install)

            mkdir -p "${source.dir}/build-json"
            (cd "${source.dir}/build-json" \
              && cmake -G Ninja \
                -DCMAKE_INSTALL_PREFIX:PATH="$INSTALL_PREFIX" \
                -DCMAKE_BUILD_TYPE=Release \
                -DJSON_BuildTests=OFF \
                "${source.dir}/opentelemetry-network/build-tools/cpp_misc/json" \
              && ninja && ninja install)

            make -C build-tools/cpp_misc/lz4 prefix="$INSTALL_PREFIX" install

            (cd build-tools/cpp_misc && find ccan -name '*.h' -exec cp --parents {} "$INSTALL_PREFIX/include/" \;)

            (cd build-tools/libmaxminddb/libmaxminddb && ./bootstrap)
            (cd build-tools/libmaxminddb/libmaxminddb \
              && ./configure --prefix="$INSTALL_PREFIX" --enable-static \
              && make -j"$(nproc)" && make install)

            mkdir -p "$INSTALL_PREFIX/lib64" "$INSTALL_PREFIX/include/bpf"
            cp "/usr/lib/$(dpkg-architecture -qDEB_HOST_MULTIARCH)/libbpf.a" "$INSTALL_PREFIX/lib64/libbpf.a"
            cp -r /usr/include/bpf/. "$INSTALL_PREFIX/include/bpf/"

            cp build-tools/cpp_misc/args/args.hxx "$INSTALL_PREFIX/include/args.hxx"

            ln -s ../build-tools/cpp_misc/spdlog ext/spdlog
            cp -r build-tools/cpp_misc/spdlog/include/spdlog "$INSTALL_PREFIX/include/spdlog"

            (cd "${source.dir}/breakpad" \
              && git submodule update --init --recursive --depth 1 -- src/third_party/lss)
            mkdir -p "${source.dir}/build-breakpad"
            (cd "${source.dir}/build-breakpad" \
              && "${source.dir}/breakpad/configure" --prefix="$INSTALL_PREFIX" \
                --disable-processor --disable-tools \
              && make -j"$(nproc)" && make install)

            (cd build-tools/opentelemetry/opentelemetry-proto \
              && for proto_file in $(find ./opentelemetry -name '*.proto'); do
                mkdir -p "$INSTALL_PREFIX/$(dirname "$proto_file")"
                protoc -I . --experimental_allow_proto3_optional --cpp_out="$INSTALL_PREFIX" "$proto_file"
              done \
              && for proto_file in $(find ./opentelemetry -name '*service.proto'); do
                protoc -I . --experimental_allow_proto3_optional --cpp_out="$INSTALL_PREFIX" \
                  --plugin=protoc-gen-grpc="$(command -v grpc_cpp_plugin)" --grpc_out="$INSTALL_PREFIX" "$proto_file"
              done)

            mkdir -p /usr/local/lib
            wget https://services.gradle.org/distributions/gradle-8.14.3-bin.zip -O /usr/local/lib/gradle.zip
            echo "bd71102213493060956ec229d946beee57158dbd89d0e62b91bca0fa2c5f3531  /usr/local/lib/gradle.zip" | sha256sum -c -
        - name: configure and build reducer
          privileged: true
          runs: |
            set -eux -o pipefail

            INSTALL_PREFIX="${source.dir}/deps-install"
            export PKG_CONFIG_PATH="$INSTALL_PREFIX/lib/pkgconfig"

            export JAVA_HOME="/usr/lib/jvm/java-21-openjdk-$(dpkg --print-architecture)"
            export PATH="$JAVA_HOME/bin:$PATH"
            update-ca-certificates || true
            if [ -s /var/lib/ca-certificates-java/pending ]; then
              java -Xmx64m -jar /usr/share/ca-certificates-java/ca-certificates-java.jar \
                -storepass changeit < /var/lib/ca-certificates-java/pending
            fi

            mkdir -p build
            cmake -S . -B build \
              -DCMAKE_BUILD_TYPE=RelWithDebInfo \
              -DCMAKE_PREFIX_PATH:PATH="$INSTALL_PREFIX" \
              -DCMAKE_INSTALL_PREFIX:PATH="$INSTALL_PREFIX" \
              -DCMAKE_CXX_FLAGS="-Wno-dangling-reference -Wno-array-bounds -Wno-stringop-overflow -include algorithm" \
              -DEBPF_NET_MAJOR_VERSION=0 \
              -DEBPF_NET_MINOR_VERSION=11 \
              -DEBPF_NET_PATCH_VERSION=0 \
              -DEBPF_NET_COLLECTOR_BUILD_NUMBER=4000

            make -C build -j"$(nproc)" reducer

            install -Dm755 build/reducer/reducer "${target.dir}/usr/bin/opentelemetry-ebpf-reducer"
            strip --strip-unneeded "${target.dir}/usr/bin/opentelemetry-ebpf-reducer"
            install -Dm755 reducer/entrypoint.sh "${target.dir}/usr/lib/opentelemetry-ebpf-reducer/entrypoint.sh"
            install -Dm755 reducer/health_check.sh "${target.dir}/usr/lib/opentelemetry-ebpf-reducer/health_check.sh"
        - uses: dhi/build-pkg:0
          with:
            depends:
              - bash
              - coreutils
              - netcat-openbsd
              - sed
              - bc
              - libc6
              - libstdc++6
              - libgcc-s1
              - zlib1g
              - libssl3t64
              - libzstd1
              - libcares2
              - libelf1t64
              - libgrpc29t64
              - libgrpc++1.51t64
              - libprotobuf32t64
              - libabsl20240722
              - libcurl4t64
              - libcurlpp0t64
            description: OpenTelemetry eBPF reducer
            files:
              - usr
            formats:
              - deb
            license: Apache-2.0
            name: opentelemetry-ebpf-reducer
            rel: 0
            url: https://github.com/open-telemetry/opentelemetry-network
            version: 0.11.0
      paths:
        - type: file
          path: ${source.dir}/patch/dhi-trixie-gcc14-missing-cstdint.patch
          uid: 0
          gid: 0
          source: package/main/opentelemetry-ebpf-reducer/patch/dhi-trixie-gcc14-missing-cstdint.patch
        - type: file
          path: ${source.dir}/patch/dhi-fmt-ambiguous-format-to.patch
          uid: 0
          gid: 0
          source: package/main/opentelemetry-ebpf-reducer/patch/dhi-fmt-ambiguous-format-to.patch
        - type: file
          path: ${source.dir}/patch/dhi-health-check-drop-rev-dependency.patch
          uid: 0
          gid: 0
          source: package/main/opentelemetry-ebpf-reducer/patch/dhi-health-check-drop-rev-dependency.patch
os-release:
  name: Docker Hardened Images (Debian)
  id: debian
  version-id: "13"
  version-codename: trixie
  pretty-name: Docker Hardened Images/Debian GNU/Linux 13 (trixie)
  home-url: https://docker.com/products/hardened-images/
