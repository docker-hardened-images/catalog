# syntax=dhi.io/build:2-alpine3.24

image: dhi.io/pkg-istio-install-cni
variant: runtime
tags:
  - 1.30.4-alpine3.24
  - 1.30.4-r2-alpine3.24
platforms:
  - linux/amd64
  - linux/arm64
dates:
  release: "2026-05-18"
vars:
  COMMIT_SHA: 4220640be99e4cad69652d9eb2010bc5257f6a8e
  GOLANG_MAJOR_MINOR_VERSION: "1.26"
  GOLANG_VERSION: 1.26.8-r0
  REL: "2"
  SEMVER_MAJOR_MINOR_VERSION: "1.30"
  SEMVER_MAJOR_VERSION: "1"
  SEMVER_VERSION: 1.30.4
  VERSION: 1.30.4
contents:
  repositories:
    - https://dhi.io/apk/alpine/v3.24/main
    - https://dhi.io/apk/alpine/v3.23/main
    - https://dl-cdn.alpinelinux.org/alpine/v3.24/main
    - https://dl-cdn.alpinelinux.org/alpine/v3.24/community
  keyring:
    - https://dhi.io/keyring/dhi-apk@docker-0F81AD7700D99184.rsa.pub
  packages:
    - alpine-baselayout-data
  builds:
    - name: istio-install-cni
      work-dir: /go/src/github.com/istio/istio
      caches:
        - path: /go/pkg/mod
      contents:
        packages:
          - busybox
          - bash
          - ca-certificates-bundle
          - coreutils
          - findutils
          - mawk
          - sed
          - golang-1.26=1.26.8-r0
          - golang-1.26-oci-config=1.26.8-r0
        files:
          - url: git+https://github.com/istio/istio.git#1.30.4
            checksum: 4220640be99e4cad69652d9eb2010bc5257f6a8e
            path: /go/src/github.com/istio/istio
            spdx:
              name: istio-install-cni
              version: 1.30.4
              packages:
                - name: istio
                  purl: pkg:golang/istio.io/istio@1.30.4
                  license: Apache-2.0
            uid: 0
            gid: 0
      pipeline:
        - name: patch (1.30 only)
          uses: go/bump@v2
          with:
            deps:
              - golang.org/x/crypto@v0.56.0
              - github.com/moby/spdystream@v0.5.1
              - github.com/prometheus/prometheus@v0.311.3
            download: true
        - name: run-upstream-cni-tests
          privileged: true
          runs: |
            set -eux -o pipefail

            go list ./cni/... \
              | grep -v 'istio.io/istio/cni/pkg/iptables' \
              | grep -v 'istio.io/istio/cni/pkg/nodeagent' \
              | grep -v 'istio.io/istio/cni/pkg/nftables' \
              | xargs go test -v
        - name: build istio-cni
          uses: go/build@v1
          environment:
            GOFLAGS: -buildvcs=false
          with:
            fips: false
            ldflags:
              - -X istio.io/istio/pkg/version.buildVersion=1.30.4
              - -X istio.io/istio/pkg/version.buildGitRevision=4220640be99e4cad69652d9eb2010bc5257f6a8e
              - -X istio.io/istio/pkg/version.buildStatus=Clean
              - -X istio.io/istio/pkg/version.buildTag=1.30.4
              - -X istio.io/istio/pkg/version.buildHub=docker.io/dhi
              - -X istio.io/istio/pkg/version.buildOS=$(go env GOOS)
              - -X istio.io/istio/pkg/version.buildArch=$(go env GOARCH)
            output: ${target.dir}/opt/cni/bin/istio-cni
            packages: ./cni/cmd/istio-cni
            tags: agent,disable_pgv,grpcnotrace,retrynotrace,vtprotobuf
        - name: build istio-cni dev
          uses: go/build@v1
          environment:
            GOFLAGS: -buildvcs=false
          with:
            fips: false
            ldflags:
              - -X istio.io/istio/pkg/version.buildVersion=1.30.4
              - -X istio.io/istio/pkg/version.buildGitRevision=4220640be99e4cad69652d9eb2010bc5257f6a8e
              - -X istio.io/istio/pkg/version.buildStatus=Clean
              - -X istio.io/istio/pkg/version.buildTag=1.30.4
              - -X istio.io/istio/pkg/version.buildHub=docker.io/dhi
              - -X istio.io/istio/pkg/version.buildOS=$(go env GOOS)
              - -X istio.io/istio/pkg/version.buildArch=$(go env GOARCH)
            output: ${target.dir}/opt/cni/bin/istio-cni-dev
            packages: ./cni/cmd/istio-cni
            strip: false
            tags: agent,disable_pgv,grpcnotrace,retrynotrace,vtprotobuf
        - name: build install-cni
          uses: go/build@v1
          environment:
            GOFLAGS: -buildvcs=false
          with:
            fips: false
            ldflags:
              - -X istio.io/istio/pkg/version.buildVersion=1.30.4
              - -X istio.io/istio/pkg/version.buildGitRevision=4220640be99e4cad69652d9eb2010bc5257f6a8e
              - -X istio.io/istio/pkg/version.buildStatus=Clean
              - -X istio.io/istio/pkg/version.buildTag=1.30.4
              - -X istio.io/istio/pkg/version.buildHub=docker.io/dhi
              - -X istio.io/istio/pkg/version.buildOS=$(go env GOOS)
              - -X istio.io/istio/pkg/version.buildArch=$(go env GOARCH)
            output: ${target.dir}/usr/bin/install-cni
            packages: ./cni/cmd/install-cni
            tags: agent,disable_pgv,grpcnotrace,retrynotrace
        - name: build install-cni dev
          uses: go/build@v1
          environment:
            GOFLAGS: -buildvcs=false
          with:
            fips: false
            ldflags:
              - -X istio.io/istio/pkg/version.buildVersion=1.30.4
              - -X istio.io/istio/pkg/version.buildGitRevision=4220640be99e4cad69652d9eb2010bc5257f6a8e
              - -X istio.io/istio/pkg/version.buildStatus=Clean
              - -X istio.io/istio/pkg/version.buildTag=1.30.4
              - -X istio.io/istio/pkg/version.buildHub=docker.io/dhi
              - -X istio.io/istio/pkg/version.buildOS=$(go env GOOS)
              - -X istio.io/istio/pkg/version.buildArch=$(go env GOARCH)
            output: ${target.dir}/usr/bin/install-cni-dev
            packages: ./cni/cmd/install-cni
            strip: false
            tags: agent,disable_pgv,grpcnotrace,retrynotrace
        - uses: dhi/build-pkg:0
          with:
            description: Istio install CNI
            files:
              - usr/bin/install-cni
              - opt/cni/bin/istio-cni
            license: Apache-2.0
            name: istio-install-cni
            rel: 2
            subpackages:
              - files:
                  - path: usr/bin/install-cni
                    source: usr/bin/install-cni-dev
                  - path: opt/cni/bin/istio-cni
                    source: opt/cni/bin/istio-cni-dev
                name: istio-install-cni-dev
            url: https://github.com/istio/istio
            version: 1.30.4
