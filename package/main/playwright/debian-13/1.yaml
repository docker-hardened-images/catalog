contents:
  packages:
    - '!base-files'
  builds:
    - name: playwright deb
      work-dir: ${source.dir}/playwright
      environment:
        CHROMIUM_HEADLESS_REVISION: "1248"
        CHROMIUM_REVISION: "1248"
        CI: "true"
        FFMPEG_REVISION: "1013"
        FFMPEG_VERSION: 7.0.1
        LIBVPX_VERSION: 1.14.1
        PLAYWRIGHT_VERSION: 1.64.1
        ZLIB_VERSION: 1.3.1
      caches:
        - path: /root/.npm
      contents:
        repositories:
          - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
        keyring:
          - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
        packages:
          - bash
          - ca-certificates
          - coreutils
          - debhelper
          - dpkg-dev
          - findutils
          - nodejs-24=24.22.2-0
          - npm
        files:
          - url: ${FFMPEG_URL}
            checksum: ${FFMPEG_SHA256}
            path: /opt/playwright-downloads/${FFMPEG_DOWNLOAD_PATH}
            spdx:
              name: playwright-ffmpeg
              version: 7.0.1
              packages:
                - name: ffmpeg
                  purl: pkg:generic/ffmpeg@7.0.1
                  license: LGPL-2.1-or-later
                - name: libvpx
                  purl: pkg:generic/libvpx@1.14.1
                  license: BSD-3-Clause
                - name: zlib
                  purl: pkg:generic/zlib@1.3.1
                  license: Zlib
            uid: 0
            gid: 0
          - url: ${FIREFOX_URL}
            checksum: ${FIREFOX_SHA256}
            path: /opt/playwright-downloads/${FIREFOX_DOWNLOAD_PATH}
            spdx:
              name: playwright-firefox
              version: "157.0"
              packages:
                - name: firefox
                  purl: pkg:generic/firefox@157.0
                  license: MPL-2.0
            uid: 0
            gid: 0
          - url: ${WEBKIT_URL}
            checksum: ${WEBKIT_SHA256}
            path: /opt/playwright-downloads/${WEBKIT_DOWNLOAD_PATH}
            spdx:
              name: playwright-webkit
              version: "27.2"
              packages:
                - name: webkit
                  purl: pkg:generic/webkit@27.2
                  license: LGPL-2.1-or-later AND BSD-2-Clause
            uid: 0
            gid: 0
          - url: https://registry.npmjs.org/playwright/-/playwright-1.64.1.tgz
            checksum: sha256:36ba838d2d55c44fafcff89f919b5d7bc829209318076578ee2bc7cb5687fd57
            path: /opt/playwright-downloads/npm/playwright-1.64.1.tgz
            spdx:
              name: playwright-driver
              version: 1.64.1
              packages:
                - name: playwright
                  purl: pkg:npm/playwright@1.64.1
                  license: Apache-2.0
            uid: 0
            gid: 0
          - url: https://registry.npmjs.org/playwright-core/-/playwright-core-1.64.1.tgz
            checksum: sha256:3af03703c967c95037454f2283f709d53ce804a4776d4219d319f5bbcc2a0185
            path: /opt/playwright-downloads/npm/playwright-core-1.64.1.tgz
            spdx:
              name: playwright-core
              version: 1.64.1
              packages:
                - name: playwright-core
                  purl: pkg:npm/playwright-core@1.64.1
                  license: Apache-2.0
            uid: 0
            gid: 0
      pipeline:
        - uses: dpkg/bump@v1
          with:
            changelog:
              - DHI Build
            version: 1.64.1-0
        - uses: dpkg/build@v1
          privileged: true
          with:
            args: -b -uc -us -d
      paths:
        - type: directory
          path: ${source.dir}/playwright/debian
          uid: 0
          gid: 0
          mode: "0600"
          source: package/main/playwright/debian-13/debian
os-release:
  name: Docker Hardened Images (Debian)
  id: debian
  version-id: "13"
  version-codename: trixie
  pretty-name: Docker Hardened Images/Debian GNU/Linux 13 (trixie)
  home-url: https://docker.com/products/hardened-images/
