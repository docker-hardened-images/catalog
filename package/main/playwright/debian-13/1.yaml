  FFMPEG_SHA256: '#{ target.arch == "amd64" ? "sha256:ebc74fc5b94830176a3c2914ae96bd8bc7f6a91f4f33890230f84a172ee61ccc" : "sha256:2628c03f05318ff812c8c9baaf207dea2ddf53e818c0dc936714b0fbe3afb009" }'
