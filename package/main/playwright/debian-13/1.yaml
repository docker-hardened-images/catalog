# syntax=dhi.io/build:2-debian13

image: dhi.io/pkg-playwright
variant: runtime
tags:
  - 1.62.1-0
  - 1.62.1-0-debian13
platforms:
  - linux/amd64
  - linux/arm64
dates:
  release: "2020-05-06"
vars:
  CHROMIUM_HEADLESS_REVISION: "1234"
  CHROMIUM_REVISION: "1234"
  DHI_REL: "0"
  DHI_VERSION: 1.62.1-0
  FFMPEG_DOWNLOAD_PATH: '#{ target.arch == "amd64" ? "builds/ffmpeg/1011/ffmpeg-linux.zip" : "builds/ffmpeg/1011/ffmpeg-linux-arm64.zip" }'
  FFMPEG_REVISION: "1011"
  FFMPEG_SHA256: '#{ target.arch == "amd64" ? "sha256:ebc74fc5b94830176a3c2914ae96bd8bc7f6a91f4f33890230f84a172ee61ccc" : "sha256:2628c03f05318ff812c8c9baaf207dea2ddf53e818c0dc936714b0fbe3afb009" }'
  FFMPEG_URL: '#{ target.arch == "amd64" ? "https://cdn.playwright.dev/builds/ffmpeg/1011/ffmpeg-linux.zip" : "https://cdn.playwright.dev/builds/ffmpeg/1011/ffmpeg-linux-arm64.zip" }'
  FFMPEG_VERSION: 7.0.1
  FIREFOX_BROWSER_VERSION: "153.0"
  FIREFOX_DOWNLOAD_PATH: '#{ target.arch == "amd64" ? "builds/firefox/1538/firefox-debian-13.zip" : "builds/firefox/1538/firefox-debian-13-arm64.zip" }'
  FIREFOX_REVISION: "1538"
  FIREFOX_SHA256: '#{ target.arch == "amd64" ? "sha256:039568d282fc1269321416050a50c8ea83101f4afa4e5b063de6c96f1399ad5c" : "sha256:f2049a2da6f6a89a001666c31fd20b12eec923fe49803dc899cccdcccdb90f4f" }'
  FIREFOX_URL: '#{ target.arch == "amd64" ? "https://cdn.playwright.dev/builds/firefox/1538/firefox-debian-13.zip" : "https://cdn.playwright.dev/builds/firefox/1538/firefox-debian-13-arm64.zip" }'
  LIBVPX_VERSION: 1.14.1
  NODEJS_MAJOR: "24"
  NODEJS_VERSION: 24.18.1-0
  PLAYWRIGHT_CDN: https://cdn.playwright.dev
  PLAYWRIGHT_CORE_NPM_SHA256: sha256:954be1e183d0ddb9748fe0d2d08b0b66a9210c74dd75c397aeb70303b9f08a00
  PLAYWRIGHT_NPM_SHA256: sha256:1982556a882b246ccb7c16337fab5e4e790292b69f835a2db1011dddc440ed98
  VERSION: 1.62.1
  WEBKIT_BROWSER_VERSION: "26.5"
  WEBKIT_DOWNLOAD_PATH: '#{ target.arch == "amd64" ? "builds/webkit/2336/webkit-debian-13.zip" : "builds/webkit/2336/webkit-debian-13-arm64.zip" }'
  WEBKIT_REVISION: "2336"
  WEBKIT_SHA256: '#{ target.arch == "amd64" ? "sha256:65459d05cbf3021a7e9352bbf25de6e2f8a9ecc3399fb63cccc5e8b8ae443c69" : "sha256:4b4e716dfee573e25df16d8fa2efff8ce2d6b3063fbdef8e9753465cbf49ec66" }'
  WEBKIT_URL: '#{ target.arch == "amd64" ? "https://cdn.playwright.dev/builds/webkit/2336/webkit-debian-13.zip" : "https://cdn.playwright.dev/builds/webkit/2336/webkit-debian-13-arm64.zip" }'
  ZLIB_VERSION: 1.3.1
contents:
  packages:
    - '!base-files'
  builds:
    - name: playwright deb
      work-dir: ${source.dir}/playwright
      environment:
        CHROMIUM_HEADLESS_REVISION: "1234"
        CHROMIUM_REVISION: "1234"
        CI: "true"
        FFMPEG_REVISION: "1011"
        FFMPEG_VERSION: 7.0.1
        LIBVPX_VERSION: 1.14.1
        PLAYWRIGHT_VERSION: 1.62.1
        ZLIB_VERSION: 1.3.1
      caches:
        - path: /root/.npm
      contents:
        repositories:
          - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
        keyring:
          - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
        packages:
          - bash
          - ca-certificates
          - coreutils
          - debhelper
          - dpkg-dev
          - findutils
          - nodejs-24=24.18.1-0
          - npm
        files:
          - url: ${FFMPEG_URL}
            checksum: ${FFMPEG_SHA256}
            path: /opt/playwright-downloads/${FFMPEG_DOWNLOAD_PATH}
            spdx:
              name: playwright-ffmpeg
              version: 7.0.1
              packages:
                - name: ffmpeg
                  purl: pkg:generic/ffmpeg@7.0.1
                  license: LGPL-2.1-or-later
                - name: libvpx
                  purl: pkg:generic/libvpx@1.14.1
                  license: BSD-3-Clause
                - name: zlib
                  purl: pkg:generic/zlib@1.3.1
                  license: Zlib
            uid: 0
            gid: 0
          - url: ${FIREFOX_URL}
            checksum: ${FIREFOX_SHA256}
            path: /opt/playwright-downloads/${FIREFOX_DOWNLOAD_PATH}
            spdx:
              name: playwright-firefox
              version: "153.0"
              packages:
                - name: firefox
                  purl: pkg:generic/firefox@153.0
                  license: MPL-2.0
            uid: 0
            gid: 0
          - url: ${WEBKIT_URL}
            checksum: ${WEBKIT_SHA256}
            path: /opt/playwright-downloads/${WEBKIT_DOWNLOAD_PATH}
            spdx:
              name: playwright-webkit
              version: "26.5"
              packages:
                - name: webkit
                  purl: pkg:generic/webkit@26.5
                  license: LGPL-2.1-or-later AND BSD-2-Clause
            uid: 0
            gid: 0
          - url: https://registry.npmjs.org/playwright/-/playwright-1.62.1.tgz
            checksum: sha256:1982556a882b246ccb7c16337fab5e4e790292b69f835a2db1011dddc440ed98
            path: /opt/playwright-downloads/npm/playwright-1.62.1.tgz
            spdx:
              name: playwright-driver
              version: 1.62.1
              packages:
                - name: playwright
                  purl: pkg:npm/playwright@1.62.1
                  license: Apache-2.0
            uid: 0
            gid: 0
          - url: https://registry.npmjs.org/playwright-core/-/playwright-core-1.62.1.tgz
            checksum: sha256:954be1e183d0ddb9748fe0d2d08b0b66a9210c74dd75c397aeb70303b9f08a00
            path: /opt/playwright-downloads/npm/playwright-core-1.62.1.tgz
            spdx:
              name: playwright-core
              version: 1.62.1
              packages:
                - name: playwright-core
                  purl: pkg:npm/playwright-core@1.62.1
                  license: Apache-2.0
            uid: 0
            gid: 0
      pipeline:
        - uses: dpkg/bump@v1
          with:
            changelog:
              - DHI Build
            version: 1.62.1-0
        - uses: dpkg/build@v1
          privileged: true
          with:
            args: -b -uc -us -d
      paths:
        - type: directory
          path: ${source.dir}/playwright/debian
          uid: 0
          gid: 0
          mode: "0600"
          source: package/main/playwright/debian-13/debian
os-release:
  name: Docker Hardened Images (Debian)
  id: debian
  version-id: "13"
  version-codename: trixie
  pretty-name: Docker Hardened Images/Debian GNU/Linux 13 (trixie)
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
