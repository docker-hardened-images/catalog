  WEBKIT_URL: '#{ target.arch == "amd64" ? "https://cdn.playwright.dev/builds/webkit/2359/webkit-debian-13.zip" : "https://cdn.playwright.dev/builds/webkit/2359/webkit-debian-13-arm64.zip" }'
  ZLIB_VERSION: 1.3.1
contents:
  packages:
    - '!base-files'
  builds:
    - name: playwright deb
      work-dir: ${source.dir}/playwright
      environment:
        CHROMIUM_HEADLESS_REVISION: "1243"
        CHROMIUM_REVISION: "1243"
        CI: "true"
        FFMPEG_REVISION: "1011"
        FFMPEG_VERSION: 7.0.1
        LIBVPX_VERSION: 1.14.1
        PLAYWRIGHT_VERSION: 1.63.0
        ZLIB_VERSION: 1.3.1
      caches:
        - path: /root/.npm
      contents:
        repositories:
          - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
        keyring:
          - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
        packages:
          - bash
          - ca-certificates
          - coreutils
          - debhelper
          - dpkg-dev
          - findutils
          - nodejs-24=24.21.0-0
          - npm
        files:
          - url: ${FFMPEG_URL}
            checksum: ${FFMPEG_SHA256}
            path: /opt/playwright-downloads/${FFMPEG_DOWNLOAD_PATH}
            spdx:
              name: playwright-ffmpeg
              version: 7.0.1
              packages:
                - name: ffmpeg
                  purl: pkg:generic/ffmpeg@7.0.1
                  license: LGPL-2.1-or-later
                - name: libvpx
                  purl: pkg:generic/libvpx@1.14.1
                  license: BSD-3-Clause
                - name: zlib
                  purl: pkg:generic/zlib@1.3.1
                  license: Zlib
            uid: 0
            gid: 0
          - url: ${FIREFOX_URL}
            checksum: ${FIREFOX_SHA256}
            path: /opt/playwright-downloads/${FIREFOX_DOWNLOAD_PATH}
            spdx:
              name: playwright-firefox
              version: "155.0"
              packages:
                - name: firefox
                  purl: pkg:generic/firefox@155.0
                  license: MPL-2.0
            uid: 0
            gid: 0
          - url: ${WEBKIT_URL}
            checksum: ${WEBKIT_SHA256}
            path: /opt/playwright-downloads/${WEBKIT_DOWNLOAD_PATH}
            spdx:
              name: playwright-webkit
              version: "26.6"
              packages:
                - name: webkit
                  purl: pkg:generic/webkit@26.6
                  license: LGPL-2.1-or-later AND BSD-2-Clause
            uid: 0
            gid: 0
          - url: https://registry.npmjs.org/playwright/-/playwright-1.63.0.tgz
            checksum: sha256:195a5ee9bfed7c6e9c03965950e32e5e4dbedaa02e740e5a530eb4b87dae050c
            path: /opt/playwright-downloads/npm/playwright-1.63.0.tgz
            spdx:
              name: playwright-driver
              version: 1.63.0
              packages:
                - name: playwright
                  purl: pkg:npm/playwright@1.63.0
                  license: Apache-2.0
            uid: 0
            gid: 0
          - url: https://registry.npmjs.org/playwright-core/-/playwright-core-1.63.0.tgz
            checksum: sha256:208593d4e1bcd8f8fe5f869cad1cc332dc7f1d70dc1d58c102dc3ac36e30f26c
            path: /opt/playwright-downloads/npm/playwright-core-1.63.0.tgz
            spdx:
              name: playwright-core
              version: 1.63.0
              packages:
                - name: playwright-core
                  purl: pkg:npm/playwright-core@1.63.0
                  license: Apache-2.0
            uid: 0
            gid: 0
      pipeline:
        - uses: dpkg/bump@v1
          with:
            changelog:
              - DHI Build
            version: 1.63.0-1
        - uses: dpkg/build@v1
          privileged: true
          with:
            args: -b -uc -us -d
      paths:
        - type: directory
          path: ${source.dir}/playwright/debian
          uid: 0
          gid: 0
          mode: "0600"
          source: package/main/playwright/debian-13/debian
os-release:
  name: Docker Hardened Images (Debian)
  id: debian
  version-id: "13"
  version-codename: trixie
  pretty-name: Docker Hardened Images/Debian GNU/Linux 13 (trixie)
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
