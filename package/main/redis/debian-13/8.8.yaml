# syntax=dhi.io/build:2-debian13

image: dhi.io/pkg-redis-upstream
variant: runtime
tags:
  - 8.8.2-0
  - 8.8.2-0-debian13
platforms:
  - linux/amd64
  - linux/arm64
dates:
  release: "2026-05-25"
vars:
  COMMIT_SHA: c5031f43a7eaa0d96311746acf759ee6d6acb053
  DHI_REL: "0"
  DHI_VERSION: 8.8.2-0
  HAS_MODULES: "true"
  LLVM_VERSION: "21"
  PACKAGE_NAME: redis-8.8
  REDIS_LICENSE: AGPL-3.0-only
  SEMVER_MAJOR_MINOR: "8.8"
  VERSION: 8.8.2
contents:
  packages:
    - '!base-files'
  builds:
    - name: redis deb
      work-dir: ${source.dir}/redis
      contents:
        repositories:
          - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
          - deb [signed-by=/usr/share/keyrings/archive-key-13.asc] http://deb.debian.org/debian trixie-backports main
        keyring:
          - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
          - https://ftp-master.debian.org/keys/archive-key-13.asc
        packages:
          - build-essential
          - ca-certificates
          - clang-21
          - gawk
          - cmake
          - curl
          - debhelper
          - dpkg-dev
          - git
          - libssl-dev
          - lld-21
          - llvm-21
          - pkg-config
          - python3
          - python3-dev
          - wget
          - xz-utils
        files:
          - url: git+https://github.com/redis/redis.git#8.8.2
            checksum: c5031f43a7eaa0d96311746acf759ee6d6acb053
            path: ${source.dir}/redis
            spdx:
              name: redis
              version: 8.8.2
              packages:
                - name: redis
                  purl: pkg:github/redis/redis@8.8.2
                  license: AGPL-3.0-only
            uid: 0
            gid: 0
      pipeline:
        - name: patch build
          runs: |
            set -eux -o pipefail

            arch="$(uname -m)"
            if [ "$arch" = aarch64 ]; then
              jemallocFlags="--build=aarch64-linux-gnu --with-lg-page=16 --with-lg-hugepage=21"
            else
              jemallocFlags="--build=x86_64-linux-gnu --with-lg-page=12 --with-lg-hugepage=21"
            fi
            grep -F 'cd jemalloc && ./configure ' '${source.dir}/redis/deps/Makefile'
            sed -ri 's!cd jemalloc && ./configure !&'"$jemallocFlags"' !' '${source.dir}/redis/deps/Makefile'
            grep -F "cd jemalloc && ./configure $jemallocFlags " '${source.dir}/redis/deps/Makefile'
        - name: patch config
          runs: |
            set -eux -o pipefail

            echo 'include /etc/redis/conf.d/*.conf' >> '${source.dir}/redis/redis.conf'
        - name: prepare debian packaging
          runs: |
            set -eux -o pipefail

            sed -i "s/@PKG@/redis-8.8/g" debian/control.in debian/changelog
            mv debian/control.in debian/control
            mv debian/server.install "debian/redis-8.8-server.install"
            mv debian/tools.install "debian/redis-8.8-tools.install"
            mv debian/sentinel.install "debian/redis-8.8-sentinel.install"

            if [ "true" = "true" ]; then
              printf '%s\n' etc/redis/redis-full.conf usr/lib/redis/modules >> "debian/redis-8.8-server.install"
            fi

            printf 'HAS_MODULES := %s\nLLVM_VERSION := %s\n' "true" "21" > debian/build-env.mk
        - uses: dpkg/bump@v1
          with:
            changelog:
              - DHI Build
            version: 8.8.2-0
        - uses: dpkg/build@v1
          privileged: true
          with:
            args: -b -uc -us -d
      paths:
        - type: directory
          path: ${source.dir}/redis/debian
          uid: 0
          gid: 0
          mode: "0600"
          source: package/main/redis/debian-13/debian
os-release:
  name: Docker Hardened Images (Debian)
  id: debian
  version-id: "13"
  version-codename: trixie
  pretty-name: Docker Hardened Images/Debian GNU/Linux 13 (trixie)
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
