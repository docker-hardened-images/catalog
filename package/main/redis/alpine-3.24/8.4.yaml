# syntax=dhi.io/build:2-alpine3.24

image: dhi.io/pkg-redis-upstream
variant: runtime
tags:
  - 8.4.8-alpine3.24
  - 8.4.8-r0-alpine3.24
platforms:
  - linux/amd64
  - linux/arm64
dates:
  release: "2026-02-22"
vars:
  ARCH: '#{ target.arch == "amd64" ? "x86_64" : "aarch64" }'
  COMMIT_SHA: 03fb1dc35de324f2b062bfa46ab58b95af779809
  PACKAGE_NAME: redis-8.4
  REDIS_LICENSE: AGPL-3.0-only
  REDISBLOOM_VERSION: 8.4.9
  REDISEARCH_VERSION: 8.4.10
  REDISJSON_VERSION: 8.4.2
  REDISTIMESERIES_VERSION: 8.4.16
  REL: "0"
  RUST_SHA: '#{ target.arch == "amd64" ? "sha256:200bcf3b5d574caededba78c9ea9d27e7afc5c6df4154ed0551879859be328e1" : "sha256:f8b3a158f9e5e8cc82e4d92500dd2738ac7d8b5e66e0f18330408856235dec35" }'
  RUST_VERSION: 1.88.0
  SEMVER_MAJOR_MINOR_VERSION: "8.4"
  SEMVER_MAJOR_VERSION: "8"
  SEMVER_VERSION: 8.4.8
  VERSION: 8.4.8
contents:
  repositories:
    - https://dhi.io/apk/alpine/v3.24/main
    - https://dl-cdn.alpinelinux.org/alpine/v3.24/main
    - https://dl-cdn.alpinelinux.org/alpine/v3.24/community
  keyring:
    - https://dhi.io/keyring/dhi-apk@docker-0F81AD7700D99184.rsa.pub
  packages:
    - alpine-baselayout-data
  builds:
    - name: redis
      work-dir: ${source.dir}/redis
      caches:
        - path: /root/.cargo
        - path: /root/.cache/pip
      contents:
        packages:
          - autoconf
          - automake
          - bash
          - bsd-compat-headers
          - build-base
          - ca-certificates
          - cargo
          - clang21
          - clang21-libclang
          - clang21-static
          - cmake
          - coreutils
          - curl
          - git
          - which
          - grep
          - libffi-dev
          - libgcc
          - libtool
          - linux-headers
          - lld21
          - llvm21-dev
          - ncurses-dev
          - openssh
          - openssl
          - openssl-dev
          - pkgconf
          - py3.14-cryptography
          - py3.14-pip
          - py3.14-setuptools
          - py3.14-virtualenv
          - python-3.14
          - python-3.14-dev
          - rsync
          - sed
          - tar
          - unzip
          - xsimd
          - xz
        files:
          - url: git+https://github.com/redis/redis.git#8.4.8
            checksum: 03fb1dc35de324f2b062bfa46ab58b95af779809
            path: ${source.dir}/redis
            spdx:
              name: redis
              version: 8.4.8
              packages:
                - name: redis
                  purl: pkg:github/redis/redis@8.4.8
                  license: AGPL-3.0-only
            uid: 0
            gid: 0
          - url: https://static.rust-lang.org/dist/rust-1.88.0-${ARCH}-unknown-linux-musl.tar.xz
            checksum: ${RUST_SHA}
            path: ${source.dir}/rust
            uid: 0
            gid: 0
      pipeline:
        - name: bump python dependencies
          uses: python/bump@v1
          work-dir: ${source.dir}
          privileged: true
          with:
            bumps: ${source.dir}/patch/python-bumps.json
            hashes: require
            mode: requirements
            python: /usr/bin/python3.14
            requirements: requirements-ramp-packer-lock.txt
            verify: none
        - name: install ramp-packer
          privileged: true
          runs: |
            set -eux -o pipefail

            PIP_BREAK_SYSTEM_PACKAGES=1 pip install -q --require-hashes -r '${source.dir}/requirements-ramp-packer-lock.txt'
        - name: patch build
          runs: |
            set -eux -o pipefail

            if [ ${target.arch} = arm64 ]; then
              jemallocFlags="--build=aarch64-alpine-linux-musl --with-lg-page=16 --with-lg-hugepage=21"
            else
              jemallocFlags="--build=x86_64-alpine-linux-musl --with-lg-page=12 --with-lg-hugepage=21"
            fi
            grep -F 'cd jemalloc && ./configure ' '${source.dir}/redis/deps/Makefile'
            sed -ri 's!cd jemalloc && ./configure !&'"$jemallocFlags"' !' '${source.dir}/redis/deps/Makefile'
            grep -F "cd jemalloc && ./configure $jemallocFlags " '${source.dir}/redis/deps/Makefile'
        - name: patch redisjson rust flags
          privileged: true
          runs: |
            set -eux -o pipefail

            export PATH="/usr/lib/llvm21/bin:$PATH"
            make -C '${source.dir}/redis/modules/redisjson' get_source
            sed -i 's/^RUST_FLAGS=$/RUST_FLAGS += -C target-feature=-crt-static/' \
              '${source.dir}/redis/modules/redisjson/src/Makefile'
            grep -E 'RUST_FLAGS' '${source.dir}/redis/modules/redisjson/src/Makefile'
        - name: install rust
          work-dir: ${source.dir}/rust/rust-1.88.0-${ARCH}-unknown-linux-musl
          runs: |
            set -eux -o pipefail

            ./install.sh
        - name: build and install
          privileged: true
          runs: |
            set -eux -o pipefail

            export BUILD_TLS=yes
            export RUST_DYN_CRT=1
            export PATH="/usr/lib/llvm21/bin:$PATH"
            export BUILD_WITH_MODULES=yes
            export DISABLE_WERRORS=yes

            make all -j"$(nproc)" IGNORE_MISSING_DEPS=1
            make install V=1 PREFIX=${target.dir}/usr IGNORE_MISSING_DEPS=1
        - uses: spdx@v1
          with:
            license: AGPL-3.0-only
            name: redisbloom
            purl: pkg:github/redisbloom/redisbloom@v8.4.9
            version: 8.4.9
        - uses: spdx@v1
          with:
            license: AGPL-3.0-only
            name: redisearch
            purl: pkg:github/redisearch/redisearch@v8.4.10
            version: 8.4.10
        - uses: spdx@v1
          with:
            license: AGPL-3.0-only
            name: redisjson
            purl: pkg:github/redisjson/redisjson@v8.4.2
            version: 8.4.2
        - uses: spdx@v1
          with:
            license: AGPL-3.0-only
            name: redistimeseries
            purl: pkg:github/redistimeseries/redistimeseries@v8.4.16
            version: 8.4.16
        - name: patch config
          runs: |
            set -eux -o pipefail

            echo 'include /etc/redis/conf.d/*.conf' >> '${source.dir}/redis/redis.conf'
        - name: stage config
          runs: |
            set -eux -o pipefail

            install -d "${target.dir}/etc/redis"
            install -m 0644 '${source.dir}/redis/redis.conf' "${target.dir}/etc/redis/redis.conf"
            install -m 0644 '${source.dir}/redis/redis-full.conf' "${target.dir}/etc/redis/redis-full.conf"
            sed -i -E 's!^include redis\.conf$!include /etc/redis/redis.conf!' "${target.dir}/etc/redis/redis-full.conf"
            sed -i -E 's!^loadmodule \./modules/[^/]+/([^ ]+)$!loadmodule /usr/lib/redis/modules/\1!' "${target.dir}/etc/redis/redis-full.conf"
            grep -q '^include /etc/redis/redis.conf$' "${target.dir}/etc/redis/redis-full.conf"
            ! grep -q '^loadmodule \./' "${target.dir}/etc/redis/redis-full.conf"
            grep -q '^loadmodule /usr/lib/redis/modules/' "${target.dir}/etc/redis/redis-full.conf"
            for so in $(sed -n 's!^loadmodule /usr/lib/redis/modules/!!p' "${target.dir}/etc/redis/redis-full.conf"); do
              test -f "${target.dir}/usr/lib/redis/modules/$so"
            done
        - uses: dhi/build-pkg:0
          with:
            depends:
              - libcrypto3
              - libgcc
              - libssl3
              - libstdc++
              - musl
            description: Redis server with its bundled modules
            files:
              - usr/bin/redis-server
              - usr/bin/redis-check-rdb
              - usr/bin/redis-check-aof
              - usr/lib/redis/modules
              - etc/redis/redis.conf
              - etc/redis/redis-full.conf
            formats:
              - apk
            license: AGPL-3.0-only
            name: redis-8.4-server
            rel: 0
            subpackages:
              - depends:
                  - libcrypto3
                  - libssl3
                  - musl
                description: Redis command-line client and benchmark
                files:
                  - usr/bin/redis-cli
                  - usr/bin/redis-benchmark
                name: redis-8.4-tools
              - depends:
                  - redis-8.4-server
                description: Redis high availability monitor
                files:
                  - usr/bin/redis-sentinel
                name: redis-8.4-sentinel
            url: https://redis.io
            version: 8.4.8
      paths:
        - type: file
          path: ${source.dir}/requirements-ramp-packer-lock.in
          uid: 0
          gid: 0
          source: package/main/redis/requirements-ramp-packer-lock.in
        - type: file
          path: ${source.dir}/requirements-ramp-packer-lock.txt
          uid: 0
          gid: 0
          source: package/main/redis/requirements-ramp-packer-lock.txt
        - type: file
          path: ${source.dir}/patch/python-bumps.json
          uid: 0
          gid: 0
          source: package/main/redis/patch/python-bumps.json
os-release:
  name: Docker Hardened Images (Alpine)
  id: alpine
  version-id: "3.24"
  pretty-name: Docker Hardened Images/Alpine Linux v3.24
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
