# syntax=dhi.io/build:2-alpine3.24

image: dhi.io/pkg-open-cluster-management-addon-manager
variant: runtime
tags:
  - 1.4.0-alpine3.24
  - 1.4.0-r1-alpine3.24
platforms:
  - linux/amd64
  - linux/arm64
dates:
  release: "2026-01-30"
vars:
  BUILD_ENTITLEMENT: ""
  COMMIT_SHA: 45ecb6233fb316302a428d1d258e68a9cc2e7040
  GOLANG_MAJOR_MINOR_VERSION: "1.26"
  GOLANG_VERSION: 1.26.11-r0
  PACKAGE_NAME: open-cluster-management-addon-manager-1
  REL: "1"
  SEMVER_MAJOR_MINOR_VERSION: "1.4"
  SEMVER_MAJOR_VERSION: "1"
  SEMVER_VERSION: 1.4.0
  SETUP_ENVTEST_VERSION: v0.25.2
  VERSION: 1.4.0
contents:
  repositories:
    - https://dhi.io/apk/alpine/v3.24/main
    - https://dhi.io/apk/alpine/v3.23/main
    - https://dl-cdn.alpinelinux.org/alpine/v3.24/main
    - https://dl-cdn.alpinelinux.org/alpine/v3.24/community
  keyring:
    - https://dhi.io/keyring/dhi-apk@docker-0F81AD7700D99184.rsa.pub
  packages:
    - alpine-baselayout-data
  builds:
    - name: open-cluster-management-addon-manager-1
      work-dir: /go/src/github.com/open-cluster-management-io/ocm
      caches:
        - path: /go/pkg/mod
      contents:
        packages:
          - bash
          - ca-certificates-bundle
          - coreutils
          - findutils
          - golang-1.26=1.26.11-r0
          - golang-1.26-oci-config=1.26.11-r0
          - mawk
          - sed
        files:
          - url: git+https://github.com/open-cluster-management-io/ocm.git#v1.4.0
            checksum: 45ecb6233fb316302a428d1d258e68a9cc2e7040
            path: /go/src/github.com/open-cluster-management-io/ocm
            spdx:
              name: open-cluster-management-addon-manager
              version: 1.4.0
              packages:
                - name: ocm
                  purl: pkg:golang/github.com/open-cluster-management-io/ocm@1.4.0
                  license: Apache-2.0
            uid: 0
            gid: 0
      pipeline:
        - name: remove vendor directory
          runs: |
            set -eux -o pipefail

            rm -rf vendor
        - name: patch
          uses: go/bump@v2
          with:
            deps:
              - golang.org/x/net@v0.62.0
              - github.com/google/cel-go@v0.30.0
              - google.golang.org/grpc@v1.85.0-dev.0.20260825072537-93e31b48545e
            download: true
        - name: re-vendor
          runs: |
            set -eux -o pipefail

            go mod vendor
        - name: test
          privileged: true
          runs: |
            set -eux -o pipefail

            go install sigs.k8s.io/controller-runtime/tools/setup-envtest@v0.25.2
            source <($(go env GOPATH)/bin/setup-envtest use 1.31 -p env)

            CGO_ENABLED=0 go test ./cmd/addon/... ./pkg/addon/... -skip "^(TestRunController|TestStopUnusedManagers)$"
        - name: build
          uses: go/build@v1
          with:
            fips: '#{ definition["fips-compliant"] ? true : false }'
            ldflags:
              - -X open-cluster-management.io/ocm/pkg/version.versionFromGit=1.4.0
              - -X open-cluster-management.io/ocm/pkg/version.commitFromGit=45ecb6233fb316302a428d1d258e68a9cc2e7040
            output: ${target.dir}/usr/bin/addon
            packages: ./cmd/addon
        - name: build dev
          uses: go/build@v1
          with:
            fips: '#{ definition["fips-compliant"] ? true : false }'
            ldflags:
              - -X open-cluster-management.io/ocm/pkg/version.versionFromGit=1.4.0
              - -X open-cluster-management.io/ocm/pkg/version.commitFromGit=45ecb6233fb316302a428d1d258e68a9cc2e7040
            output: ${target.dir}/usr/bin/addon-dev
            packages: ./cmd/addon
            strip: false
        - uses: dhi/build-pkg:0
          with:
            description: Open Cluster Management addon manager
            files:
              - usr/bin/addon
            license: Apache-2.0
            name: open-cluster-management-addon-manager-1
            rel: 1
            subpackages:
              - files:
                  - path: usr/bin/addon
                    source: usr/bin/addon-dev
                name: open-cluster-management-addon-manager-1-dev
            url: https://github.com/open-cluster-management-io/ocm
            version: 1.4.0
