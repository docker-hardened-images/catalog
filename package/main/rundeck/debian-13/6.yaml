image: dhi.io/pkg-rundeck
variant: runtime
tags:
  - 6.3.0
  - 6.3.0-r5
  - 6.3.0-debian13
  - 6.3.0-r5-debian13
platforms:
  - linux/amd64
  - linux/arm64
dates:
  release: "2026-08-03"
vars:
  COMMIT_SHA: 6ac5d092e6ccde3fd580ac61371487a300a0b6ca
  JDK_MAJOR_VERSION: "21"
  JDK_VERSION: 1:21.0.13+9-2
  NODEJS_VERSION: 24.22.2-0
  PACKAGE_HOME: /usr/share/rundeck
  PACKAGE_NAME: rundeck
  REL: "5"
  SEMVER_MAJOR_MINOR_VERSION: "6.3"
  SEMVER_MAJOR_VERSION: "6"
  SEMVER_VERSION: 6.3.0
  VERSION: 6.3.0
contents:
  repositories:
    - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
  keyring:
    - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
  packages:
    - base-files
  builds:
    - name: rundeck
      work-dir: ${source.dir}/rundeck
      caches:
        - path: /root/.gradle
        - path: /root/.npm
      contents:
        repositories:
          - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
        keyring:
          - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
        packages:
          - bash
          - coreutils
          - findutils
          - git
          - sed
          - grep
          - ca-certificates
          - unzip
          - zip
          - eclipse-temurin-21-jdk=1:21.0.13+9-2
          - nodejs-24=24.22.2-0
          - npm
        files:
          - url: https://maven-central.storage-download.googleapis.com/maven2/com/fasterxml/jackson/core/jackson-databind/2.22.3/jackson-databind-2.22.3.jar
            checksum: sha256:556db5439e206114346043f68d200497dc96a0bca62a360a81784092ebd0e0a9
            path: ${source.dir}/patch/deps/jackson-databind-2.22.3.jar
            spdx:
              name: jackson-databind
              version: 2.22.3
              packages:
                - name: jackson-databind
                  purl: pkg:maven/com.fasterxml.jackson.core/jackson-databind@2.22.3
                  license: Apache-2.0
            uid: 0
            gid: 0
          - url: https://maven-central.storage-download.googleapis.com/maven2/com/fasterxml/jackson/core/jackson-core/2.22.3/jackson-core-2.22.3.jar
            checksum: sha256:8a501126a385b25841915d839508f8a66e2a0dbc8a6709d055ef3b3e852b094c
            path: ${source.dir}/patch/deps/jackson-core-2.22.3.jar
            spdx:
              name: jackson-core
              version: 2.22.3
              packages:
                - name: jackson-core
                  purl: pkg:maven/com.fasterxml.jackson.core/jackson-core@2.22.3
                  license: Apache-2.0
            uid: 0
            gid: 0
          - url: https://maven-central.storage-download.googleapis.com/maven2/com/fasterxml/jackson/dataformat/jackson-dataformat-yaml/2.22.3/jackson-dataformat-yaml-2.22.3.jar
            checksum: sha256:2bcbc3b9abaefbeba11409b9e30ec35ed7071a61a47c8c2a9c688e40e45b90f9
            path: ${source.dir}/patch/deps/jackson-dataformat-yaml-2.22.3.jar
            spdx:
              name: jackson-dataformat-yaml
              version: 2.22.3
              packages:
                - name: jackson-dataformat-yaml
                  purl: pkg:maven/com.fasterxml.jackson.dataformat/jackson-dataformat-yaml@2.22.3
                  license: Apache-2.0
            uid: 0
            gid: 0
          - url: https://maven-central.storage-download.googleapis.com/maven2/com/google/guava/guava/33.7.2-jre/guava-33.7.2-jre.jar
            checksum: sha256:b530942257fb935f8b2cfaa5f8eb5bd59c555fd8e8d01b8ce98912e077ea606c
            path: ${source.dir}/patch/deps/guava-33.7.2-jre.jar
            spdx:
              name: guava
              version: 33.7.2-jre
              packages:
                - name: guava
                  purl: pkg:maven/com.google.guava/guava@33.7.2-jre
                  license: Apache-2.0
            uid: 0
            gid: 0
          - url: https://maven-central.storage-download.googleapis.com/maven2/org/xerial/snappy/snappy-java/1.1.10.9/snappy-java-1.1.10.9.jar
            checksum: sha256:35228628442e4b9797681c7cbd3b26594f6da3379159dbd0cb07094ed3aece0d
            path: ${source.dir}/patch/deps/snappy-java-1.1.10.9.jar
            spdx:
              name: snappy-java
              version: 1.1.10.9
              packages:
                - name: snappy-java
                  purl: pkg:maven/org.xerial.snappy/snappy-java@1.1.10.9
                  license: Apache-2.0
            uid: 0
            gid: 0
          - url: git+https://github.com/rundeck/rundeck.git#6ac5d092e6ccde3fd580ac61371487a300a0b6ca
            checksum: 6ac5d092e6ccde3fd580ac61371487a300a0b6ca
            path: ${source.dir}/rundeck
            spdx:
              name: rundeck
              version: 6.3.0
              packages:
                - name: rundeck
                  purl: pkg:github/rundeck/rundeck@6.3.0
                  license: Apache-2.0
            uid: 0
            gid: 0
      pipeline:
        - name: build war and ui
          privileged: true
          runs: |
            set -eux -o pipefail

            export JAVA_HOME=/usr/lib/jvm/temurin-21
            export PATH="/usr/lib/jvm/temurin-21/bin:$PATH"
            export NPM_CONFIG_REGISTRY=https://registry.npmjs.org/
            export CIRCLE_TAG=v6.3.0
            export CI=true

            node --version

            find . -name .npmrc -exec sed -i \
              -e '/@pagerduty:registry=/d' -e '/_authToken/d' {} +
            find . -name package-lock.json -exec \
              sed -i 's#https://npm.artifacts.pd-internal.com/npm/#https://registry.npmjs.org/#g' {} +

            MIRROR='https://maven-central.storage-download.googleapis.com/maven2/'
            find . -type f -name '*.gradle' -print0 | xargs -0 sed -i \
              -e "s|mavenCentral()|maven { url '${MIRROR}' }|g" \
              -e "s|gradlePluginPortal()|maven { url '${MIRROR}' }; gradlePluginPortal()|g"

            sed -i \
              -e 's/^jacksonDatabindVersion=2.22.2/jacksonDatabindVersion=2.22.3/' \
              -e 's/^jacksonDataformatCBORVersion=2.22.2/jacksonDataformatCBORVersion=2.22.3/' \
              -e 's/^guavaVersion=33.6.0-jre/guavaVersion=33.7.2-jre/' \
              gradle.properties

            ./gradlew --init-script "${source.dir}/dhi-plugin-management.init.gradle" \
              -PguavaVersion=33.7.2-jre \
              --no-daemon --stacktrace clean :rundeckapp:bootWar -x test

            war=$(find rundeckapp/build/libs -name 'rundeck-*.war' | sort -V | tail -1)
            if jar tf "${war}" | grep -q 'guava-33.6.0-jre.jar'; then
              echo "guava 33.6.0-jre still present in war:" >&2
              jar tf "${war}" | grep guava >&2 || true
              exit 1
            fi
            jar tf "${war}" | grep -qE 'guava-33\.7\.2(-jre)?\.jar'
        - name: patch snappy in object-store plugin
          runs: |
            set -eux -o pipefail

            patch_dir="$(mktemp -d)"
            trap 'rm -rf "${patch_dir}"' EXIT

            war=$(find rundeckapp/build/libs -name 'rundeck-*.war' | sort -V | tail -1)
            [ -n "$war" ]
            war_abs="$(cd "$(dirname "${war}")" && pwd)/$(basename "${war}")"

            plugin_rel="$(jar tf "${war_abs}" | grep -E '^WEB-INF/rundeck/plugins/rundeck-object-store-plugin-.*\.jar$' | head -1 || true)"
            if [ -z "${plugin_rel}" ]; then
              echo "object-store plugin jar not found in ${war_abs}" >&2
              exit 1
            fi

            old_plugin_jar="lib/snappy-java-1.1.10.7.jar"
            new_plugin_jar="lib/snappy-java-1.1.10.9.jar"

            unzip -q "${war_abs}" "${plugin_rel}" -d "${patch_dir}"
            plugin_jar="${patch_dir}/${plugin_rel}"
            if jar tf "${plugin_jar}" | grep -q "${old_plugin_jar}"; then
              zip -q -d "${plugin_jar}" "${old_plugin_jar}"
            fi
            mkdir -p "${patch_dir}/plugin-overlay/lib"
            cp "${source.dir}/patch/deps/snappy-java-1.1.10.9.jar" \
              "${patch_dir}/plugin-overlay/${new_plugin_jar}"
            (cd "${patch_dir}/plugin-overlay" && jar --update --file "${plugin_jar}" "${new_plugin_jar}")
            jar tf "${plugin_jar}" | grep -q "${new_plugin_jar}"
            if jar tf "${plugin_jar}" | grep -q "${old_plugin_jar}"; then
              echo "${old_plugin_jar} still present in object-store plugin" >&2
              exit 1
            fi

            manifest_dir="${patch_dir}/manifest-overlay"
            mkdir -p "${manifest_dir}/META-INF"
            unzip -p "${plugin_jar}" META-INF/MANIFEST.MF > "${manifest_dir}/META-INF/MANIFEST.MF"
            sed -i 's/snappy-java-1.1\.10\.7\.jar/snappy-java-1.1.10.9.jar/g' \
              "${manifest_dir}/META-INF/MANIFEST.MF"
            grep -q 'snappy-java-1.1.10.9.jar' "${manifest_dir}/META-INF/MANIFEST.MF"
            if grep -q 'snappy-java-1.1.10.7.jar' "${manifest_dir}/META-INF/MANIFEST.MF"; then
              echo "Rundeck-Plugin-Libs still names snappy-java-1.1.10.7.jar" >&2
              exit 1
            fi
            (cd "${manifest_dir}" && zip -q -u "${plugin_jar}" META-INF/MANIFEST.MF)

            (cd "${patch_dir}" && jar --update --file "${war_abs}" "${plugin_rel}")
        - name: patch jackson in ansible plugin
          runs: |
            set -eux -o pipefail

            patch_dir="$(mktemp -d)"
            trap 'rm -rf "${patch_dir}"' EXIT

            war=$(find rundeckapp/build/libs -name 'rundeck-*.war' | sort -V | tail -1)
            [ -n "$war" ]
            war_abs="$(cd "$(dirname "${war}")" && pwd)/$(basename "${war}")"

            jar tf "${war_abs}" | grep -q 'WEB-INF/lib/jackson-databind-2.22.3.jar'
            jar tf "${war_abs}" | grep -q 'WEB-INF/lib/jackson-core-2.22.3.jar'

            plugin_rel="$(jar tf "${war_abs}" | grep -E '^WEB-INF/rundeck/plugins/ansible-plugin-.*\.jar$' | head -1 || true)"
            if [ -z "${plugin_rel}" ]; then
              echo "ansible plugin jar not found in ${war_abs}" >&2
              exit 1
            fi

            unzip -q "${war_abs}" "${plugin_rel}" -d "${patch_dir}"
            plugin_jar="${patch_dir}/${plugin_rel}"
            for artifact in jackson-core jackson-databind jackson-dataformat-yaml; do
              old_plugin_jar="lib/${artifact}-2.22.2.jar"
              new_plugin_jar="lib/${artifact}-2.22.3.jar"
              if jar tf "${plugin_jar}" | grep -q "${old_plugin_jar}"; then
                zip -q -d "${plugin_jar}" "${old_plugin_jar}"
              fi
              mkdir -p "${patch_dir}/plugin-overlay/lib"
              cp "${source.dir}/patch/deps/${artifact}-2.22.3.jar" \
                "${patch_dir}/plugin-overlay/${new_plugin_jar}"
              (cd "${patch_dir}/plugin-overlay" && jar --update --file "${plugin_jar}" "${new_plugin_jar}")
              jar tf "${plugin_jar}" | grep -q "${new_plugin_jar}"
              if jar tf "${plugin_jar}" | grep -q "${old_plugin_jar}"; then
                echo "${old_plugin_jar} still present in ansible plugin" >&2
                exit 1
              fi
            done

            manifest_dir="${patch_dir}/manifest-overlay"
            mkdir -p "${manifest_dir}/META-INF"
            unzip -p "${plugin_jar}" META-INF/MANIFEST.MF > "${manifest_dir}/META-INF/MANIFEST.MF"
            sed -i \
              -e 's/jackson-core-2.22\.2\.jar/jackson-core-2.22.3.jar/g' \
              -e 's/jackson-databind-2.22\.2\.jar/jackson-databind-2.22.3.jar/g' \
              -e 's/jackson-dataformat-yaml-2.22\.2\.jar/jackson-dataformat-yaml-2.22.3.jar/g' \
              "${manifest_dir}/META-INF/MANIFEST.MF"
            for artifact in jackson-core jackson-databind jackson-dataformat-yaml; do
              grep -q "${artifact}-2.22.3.jar" "${manifest_dir}/META-INF/MANIFEST.MF"
              if grep -q "${artifact}-2.22.2.jar" "${manifest_dir}/META-INF/MANIFEST.MF"; then
                echo "Rundeck-Plugin-Libs still names ${artifact}-2.22.2.jar" >&2
                exit 1
              fi
            done
            (cd "${manifest_dir}" && zip -q -u "${plugin_jar}" META-INF/MANIFEST.MF)

            (cd "${patch_dir}" && jar --update --file "${war_abs}" "${plugin_rel}")
            unzip -p "${war_abs}" "${plugin_rel}" > "${patch_dir}/verified-plugin.jar"
            jar tf "${patch_dir}/verified-plugin.jar" | grep -q 'lib/jackson-dataformat-yaml-2.22.3.jar'
            if jar tf "${patch_dir}/verified-plugin.jar" | grep -q 'lib/jackson-dataformat-yaml-2.22.2.jar'; then
              echo "jackson-dataformat-yaml 2.22.2 still present in repacked war" >&2
              exit 1
            fi
            unzip -p "${patch_dir}/verified-plugin.jar" META-INF/MANIFEST.MF > "${patch_dir}/verified-manifest.mf"
            for artifact in jackson-core jackson-databind jackson-dataformat-yaml; do
              grep -q "${artifact}-2.22.3.jar" "${patch_dir}/verified-manifest.mf"
              if grep -q "${artifact}-2.22.2.jar" "${patch_dir}/verified-manifest.mf"; then
                echo "repacked Rundeck-Plugin-Libs still names ${artifact}-2.22.2.jar" >&2
                exit 1
              fi
            done
        - name: install rundeck
          runs: |
            set -eux -o pipefail

            war=$(find rundeckapp/build/libs -name 'rundeck-*.war' | sort -V | tail -1)
            [ -n "$war" ] || {
              echo "no rundeck war produced by the build" >&2
              exit 1
            }

            app="${target.dir}/usr/share/rundeck"
            mkdir -p "$app/docker-lib" "$app/etc" "$app/container-plugins" \
              "$app/libext" "$app/server/config" "$app/server/data" \
              "$app/var/logs" "$app/user-assets" "$app/repository" \
              "$app/projects" "${target.dir}/etc/remco"

            export PATH="/usr/lib/jvm/temurin-21/bin:$PATH"
            java -jar "$war" --installonly --basedir "$app"
            cp "$war" "$app/rundeck.war"

            cp -a docker/official/remco/. "${target.dir}/etc/remco/"
            cp -a docker/official/lib/. "$app/docker-lib/"
            cp -a docker/official/etc/. "$app/etc/"

            for dir in container-plugins libext server/data var/logs user-assets repository projects; do
              touch "$app/${dir}/.keep"
            done
        - uses: dhi/build-pkg:0
          with:
            depends:
              - bash
              - coreutils
              - dash
            description: Rundeck open-source automation server
            files:
              - usr
              - etc
            formats:
              - deb
            license: Apache-2.0
            name: rundeck
            rel: 5
            url: https://www.rundeck.com/
            version: 6.3.0
      paths:
        - type: file
          path: ${source.dir}/dhi-plugin-management.init.gradle
          uid: 0
          gid: 0
          source: package/main/rundeck/files/plugin-management.init.gradle
os-release:
  name: Docker Hardened Images (Debian)
  id: debian
  version-id: "13"
  version-codename: trixie
  pretty-name: Docker Hardened Images/Debian GNU/Linux 13 (trixie)
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
