# syntax=dhi.io/build:2-alpine3.24

image: dhi.io/pkg-kubectl-mtv
variant: runtime
tags:
  - 2.12.7-alpine3.24
  - 2.12.7-r0-alpine3.24
platforms:
  - linux/amd64
  - linux/arm64
dates:
  release: "2024-09-30"
vars:
  COMMIT_SHA: a8fd1bf54505dd27e10282423ceb5e05a5c8354c
  GOLANG_MAJOR_MINOR_VERSION: "1.26"
  GOLANG_VERSION: 1.26.8-r0
  PACKAGE_NAME: kubectl-mtv
  REL: "0"
  SEMVER_MAJOR_MINOR_VERSION: "2.12"
  SEMVER_MAJOR_VERSION: "2"
  SEMVER_VERSION: 2.12.7
  VERSION: 2.12.7
contents:
  repositories:
    - https://dhi.io/apk/alpine/v3.24/main
    - https://dhi.io/apk/alpine/v3.23/main
    - https://dl-cdn.alpinelinux.org/alpine/v3.24/main
    - https://dl-cdn.alpinelinux.org/alpine/v3.24/community
  keyring:
    - https://dhi.io/keyring/dhi-apk@docker-0F81AD7700D99184.rsa.pub
  packages:
    - alpine-baselayout-data
  builds:
    - name: kubectl-mtv
      work-dir: /go/src/github.com/kubev2v/forklift/cmd/kubectl-mtv
      contents:
        packages:
          - busybox
          - bash
          - ca-certificates-bundle
          - golang-1.26=1.26.8-r0
          - golang-1.26-oci-config=1.26.8-r0
        files:
          - url: git+https://github.com/kubev2v/forklift.git#v2.12.7
            checksum: a8fd1bf54505dd27e10282423ceb5e05a5c8354c
            path: /go/src/github.com/kubev2v/forklift
            spdx:
              name: kubectl-mtv
              version: 2.12.7
              packages:
                - name: kubectl-mtv
                  purl: pkg:golang/github.com/kubev2v/forklift@v2.12.7
                  license: Apache-2.0
            uid: 0
            gid: 0
      pipeline:
        - name: stash vendored forklift api
          runs: |
            set -eux -o pipefail

            cp -a vendor/github.com/kubev2v/forklift /tmp/vendored-forklift-api
        - name: update go dependencies
          uses: go/bump@v2
          with:
            deps:
              - golang.org/x/net@v0.57.0
              - golang.org/x/sys@v0.47.0
              - golang.org/x/text@v0.41.0
            download: true
        - name: restore vendored forklift api
          runs: |
            set -eux -o pipefail

            rm -rf vendor/github.com/kubev2v/forklift
            cp -a /tmp/vendored-forklift-api vendor/github.com/kubev2v/forklift
            rm -rf /tmp/vendored-forklift-api
        - name: test
          runs: |
            set -eux -o pipefail

            CGO_ENABLED=0 go test -mod=vendor -count=1 ./...
        - name: build native
          uses: go/build@v1
          with:
            extra-args: -mod=vendor -buildvcs=false
            fips: false
            ldflags:
              - -X github.com/yaacov/kubectl-mtv/cmd.clientVersion=v2.12.7
            output: ${target.dir}/usr/bin/kubectl-mtv
            packages: .
            strip: true
        - name: build native dev
          uses: go/build@v1
          with:
            extra-args: -mod=vendor -buildvcs=false
            fips: false
            ldflags:
              - -X github.com/yaacov/kubectl-mtv/cmd.clientVersion=v2.12.7
            output: ${target.dir}/usr/bin/kubectl-mtv-dev
            packages: .
            strip: false
        - name: build linux amd64 payload
          uses: go/build@v1
          with:
            extra-args: -mod=vendor -buildvcs=false
            extra-env: GOOS=linux GOARCH=amd64
            fips: false
            ldflags:
              - -X github.com/yaacov/kubectl-mtv/cmd.clientVersion=v2.12.7
            output: ${target.dir}/usr/share/kubectl-mtv/kubectl-mtv-linux-amd64
            packages: .
            strip: true
        - name: build linux arm64 payload
          uses: go/build@v1
          with:
            extra-args: -mod=vendor -buildvcs=false
            extra-env: GOOS=linux GOARCH=arm64
            fips: false
            ldflags:
              - -X github.com/yaacov/kubectl-mtv/cmd.clientVersion=v2.12.7
            output: ${target.dir}/usr/share/kubectl-mtv/kubectl-mtv-linux-arm64
            packages: .
            strip: true
        - name: build darwin amd64 payload
          uses: go/build@v1
          with:
            extra-args: -mod=vendor -buildvcs=false
            extra-env: GOOS=darwin GOARCH=amd64
            fips: false
            ldflags:
              - -X github.com/yaacov/kubectl-mtv/cmd.clientVersion=v2.12.7
            output: ${target.dir}/usr/share/kubectl-mtv/kubectl-mtv-darwin-amd64
            packages: .
            strip: true
        - name: build darwin arm64 payload
          uses: go/build@v1
          with:
            extra-args: -mod=vendor -buildvcs=false
            extra-env: GOOS=darwin GOARCH=arm64
            fips: false
            ldflags:
              - -X github.com/yaacov/kubectl-mtv/cmd.clientVersion=v2.12.7
            output: ${target.dir}/usr/share/kubectl-mtv/kubectl-mtv-darwin-arm64
            packages: .
            strip: true
        - name: build windows amd64 payload
          uses: go/build@v1
          with:
            extra-args: -mod=vendor -buildvcs=false
            extra-env: GOOS=windows GOARCH=amd64
            fips: false
            ldflags:
              - -X github.com/yaacov/kubectl-mtv/cmd.clientVersion=v2.12.7
            output: ${target.dir}/usr/share/kubectl-mtv/kubectl-mtv-windows-amd64.exe
            packages: .
            strip: true
        - name: verify binary
          runs: |
            set -eux -o pipefail

            "${target.dir}/usr/bin/kubectl-mtv" version --client > /tmp/kmtv-version.txt
            grep -qF "v2.12.7" /tmp/kmtv-version.txt
        - uses: dhi/build-pkg:0
          with:
            description: Forklift kubectl-mtv CLI with cross-platform download payloads for the console CLI download service
            files:
              - usr/bin/kubectl-mtv
              - usr/share/kubectl-mtv/kubectl-mtv-linux-amd64
              - usr/share/kubectl-mtv/kubectl-mtv-linux-arm64
              - usr/share/kubectl-mtv/kubectl-mtv-darwin-amd64
              - usr/share/kubectl-mtv/kubectl-mtv-darwin-arm64
              - usr/share/kubectl-mtv/kubectl-mtv-windows-amd64.exe
            license: Apache-2.0
            name: kubectl-mtv
            rel: 0
            subpackages:
              - files:
                  - path: usr/bin/kubectl-mtv
                    source: usr/bin/kubectl-mtv-dev
                name: kubectl-mtv-dev
            url: https://github.com/kubev2v/forklift
            version: 2.12.7
os-release:
  name: Docker Hardened Images (Alpine)
  id: alpine
