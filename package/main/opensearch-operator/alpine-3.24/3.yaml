# syntax=dhi.io/build:2-alpine3.24

image: dhi.io/pkg-opensearch-operator
variant: runtime
tags:
  - 3.0.0-alpine3.24
  - 3.0.0-r0-alpine3.24
platforms:
  - linux/amd64
  - linux/arm64
dates:
  release: "2026-09-25"
vars:
  COMMIT_SHA: 9266e6c1b0bcb2cf0df7aac90142b3305b41b617
  GOLANG_MAJOR_MINOR_VERSION: "1.26"
  GOLANG_VERSION: 1.26.11-r1
  PACKAGE_NAME: opensearch-operator-3
  REL: "0"
  SEMVER_MAJOR_MINOR_VERSION: "3.0"
  SEMVER_MAJOR_VERSION: "3"
  SEMVER_VERSION: 3.0.0
  VERSION: 3.0.0
contents:
  repositories:
    - https://dhi.io/apk/alpine/v3.24/main
    - https://dhi.io/apk/alpine/v3.23/main
    - https://dl-cdn.alpinelinux.org/alpine/v3.24/main
    - https://dl-cdn.alpinelinux.org/alpine/v3.24/community
  keyring:
    - https://dhi.io/keyring/dhi-apk@docker-0F81AD7700D99184.rsa.pub
  packages:
    - alpine-baselayout-data
  builds:
    - name: opensearch-operator-3
      work-dir: /go/src/github.com/opensearch-project/opensearch-k8s-operator/opensearch-operator
      contents:
        packages:
          - busybox
          - bash
          - ca-certificates-bundle
          - golang-1.26=1.26.11-r1
          - golang-1.26-oci-config=1.26.11-r1
        files:
          - url: git+https://github.com/opensearch-project/opensearch-k8s-operator.git#v3.0.0
            checksum: 9266e6c1b0bcb2cf0df7aac90142b3305b41b617
            path: /go/src/github.com/opensearch-project/opensearch-k8s-operator
            spdx:
              name: opensearch-operator
              version: 3.0.0
              packages:
                - name: opensearch-operator
                  purl: pkg:golang/github.com/opensearch-project/opensearch-k8s-operator/opensearch-operator@3.0.0
                  license: Apache-2.0
            uid: 0
            gid: 0
      pipeline:
        - name: update go dependencies
          uses: go/bump@v2
          environment:
            GOWORK: "off"
          with:
            deps:
              - golang.org/x/net@v0.62.0
              - golang.org/x/crypto@v0.58.0
              - github.com/google/cel-go@v0.30.0
              - go.opentelemetry.io/otel@v1.45.0
              - go.opentelemetry.io/otel/sdk@v1.45.0
              - go.opentelemetry.io/otel/exporters/otlp/otlptrace@v1.45.0
              - go.opentelemetry.io/otel/exporters/otlp/otlptrace/otlptracegrpc@v1.45.0
            download: true
            tidy: true
        - uses: go/hermetic@v1
          environment:
            GOWORK: "off"
        - name: test
          environment:
            GODEBUG: ""
            GOWORK: "off"
          runs: |
            set -eux -o pipefail

            packages=$(go list ./... | grep -Ev '/(controllers|pkg/builders|opensearch-gateway/services)$')
            CGO_ENABLED=0 go test -count=1 -timeout 30m ${packages}
        - name: build opensearch-operator
          uses: go/build@v1
          environment:
            GOWORK: "off"
          with:
            cgo_enabled: 0
            fips: false
            ldflags:
              - -w
            output: ${target.dir}/usr/bin/opensearch-operator
            packages: .
        - name: stage license
          runs: |
            set -eux -o pipefail

            install -D -m 0644 \
              /go/src/github.com/opensearch-project/opensearch-k8s-operator/LICENSE \
              ${target.dir}/usr/share/licenses/opensearch-operator/LICENSE
        - name: stage third-party licences
          environment:
            GOFLAGS: -mod=mod
            GOWORK: "off"
          runs: |
            set -eux -o pipefail

            bin=${target.dir}/usr/bin/opensearch-operator
            lic=${target.dir}/usr/share/licenses/opensearch-operator/third_party
            rm -rf "$lic"
            install -d -m 0755 "$lic"

            go version -m "$bin" | awk '
              $1 == "dep" { if (m != "") print m, v; m = $2; v = $3; next }
              $1 == "=>"  { m = $2; v = $3; next }
              END { if (m != "") print m, v }
            ' > /tmp/opensearch-operator-modules
            test -s /tmp/opensearch-operator-modules

            while read -r mod ver; do
              test -n "$mod"
              test -n "$ver"
              dir=$(go list -m -f '{{.Dir}}' "$mod@$ver")
              test -n "$dir"
              test -d "$dir"

              dest="$lic/$mod@$ver"
              found=0
              for f in "$dir"/LICEN[CS]E* "$dir"/COPYING* "$dir"/NOTICE* "$dir"/PATENTS*; do
                [ -f "$f" ] || continue
                install -D -m 0644 "$f" "$dest/$(basename "$f")"
                found=1
              done
              if [ "$found" -ne 1 ]; then
                echo "no licence file for $mod@$ver" >&2
                exit 1
              fi
            done < /tmp/opensearch-operator-modules

            goversion=$(go env GOVERSION | sed 's/^go//')
            install -D -m 0644 "$(go env GOROOT)/src/cmd/vendor/golang.org/x/sys/LICENSE" "$lic/go@$goversion/LICENSE"

            install -m 0644 /tmp/opensearch-operator-modules "$lic/MODULES"

            deps=$(wc -l < "$lic/MODULES")
            dirs=$(find "$lic" -mindepth 1 -type d -name '*@*' | wc -l)
            test "$dirs" -eq $((deps + 1))

            for mod in \
              github.com/opensearch-project/opensearch-go \
              github.com/prometheus/client_golang \
              github.com/prometheus/client_model \
              github.com/prometheus/common \
              github.com/prometheus/procfs \
              go.yaml.in/yaml/v3 \
              google.golang.org/grpc \
              gopkg.in/yaml.v2 \
              gopkg.in/yaml.v3 \
              sigs.k8s.io/randfill; do
              grep -q "^$mod " "$lic/MODULES"
              find "$lic/$(grep "^$mod " "$lic/MODULES" | awk '{print $1"@"$2}')" -maxdepth 1 -name 'NOTICE*' | grep -q .
            done
        - name: stage sbom
          runs: |
            set -eux -o pipefail

            test -d /opt/docker/sbom/opensearch-operator
            install -d "${target.dir}/opt/docker/sbom"
            cp -a /opt/docker/sbom/opensearch-operator "${target.dir}/opt/docker/sbom/"
        - uses: dhi/build-pkg:0
          with:
            description: Kubernetes operator that deploys and manages OpenSearch clusters
            files:
              - usr/bin/opensearch-operator
              - usr/share/licenses/opensearch-operator
              - opt/docker/sbom/opensearch-operator
            license: Apache-2.0
            name: opensearch-operator-3
            rel: 0
            url: https://github.com/opensearch-project/opensearch-k8s-operator
            version: 3.0.0
os-release:
  name: Docker Hardened Images (Alpine)
  id: alpine
  version-id: "3.24"
  pretty-name: Docker Hardened Images/Alpine Linux v3.24
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
