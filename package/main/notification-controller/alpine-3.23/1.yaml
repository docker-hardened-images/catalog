# syntax=dhi.io/build:2-alpine3.23

image: dhi.io/pkg-notification-controller
variant: runtime
tags:
  - 1.10.0-alpine3.23
  - 1.10.0-r2-alpine3.23
platforms:
  - linux/amd64
  - linux/arm64
dates:
  release: "2023-07-04"
vars:
  COMMIT_SHA: 08d8de010a16def89c1195b9360ceb1bd0042f70
  GOLANG_MAJOR_MINOR_VERSION: "1.27"
  GOLANG_VERSION: 1.27.4-r0
  REL: "2"
  SEMVER_MAJOR_MINOR_VERSION: "1.10"
  SEMVER_MAJOR_VERSION: "1"
  SEMVER_VERSION: 1.10.0
  VERSION: 1.10.0
contents:
  repositories:
    - https://dhi.io/apk/alpine/v3.23/main
    - https://dl-cdn.alpinelinux.org/alpine/v3.23/main
    - https://dl-cdn.alpinelinux.org/alpine/v3.23/community
  keyring:
    - https://dhi.io/keyring/dhi-apk@docker-0F81AD7700D99184.rsa.pub
  packages:
    - alpine-baselayout-data
  builds:
    - name: notification-controller
      work-dir: /go/src/github.com/fluxcd/notification-controller
      contents:
        packages:
          - busybox
          - bash
          - ca-certificates-bundle
          - coreutils
          - findutils
          - mawk
          - sed
          - golang-1.27=1.27.4-r0
          - golang-1.27-oci-config=1.27.4-r0
        files:
          - url: git+https://github.com/fluxcd/notification-controller#v1.10.0
            checksum: 08d8de010a16def89c1195b9360ceb1bd0042f70
            path: /go/src/github.com/fluxcd/notification-controller
            spdx:
              name: fluxcd-notification-controller
              version: 1.10.0
              packages:
                - name: fluxcd-notification-controller
                  purl: pkg:golang/github.com/fluxcd/notification-controller@1.10.0
                  license: Apache-2.0
            uid: 0
            gid: 0
      pipeline:
        - name: patch (1 only)
          uses: go/bump@v2
          with:
            deps:
              - golang.org/x/net@v0.62.0
              - github.com/go-jose/go-jose/v4@v4.1.6
              - google.golang.org/grpc@v1.83.2
            downgrade: true
            download: true
            replaces:
              - google.golang.org/grpc=google.golang.org/grpc@v1.83.2
            tidy: true
        - name: test
          runs: |
            set -eux -o pipefail

            CGO_ENABLED=0 go test \
              -skip 'TestNewAzureEventHub/Default_Azure_Credential' \
              $(go list ./internal/... | grep -vE '/internal/(controller|server)')
        - name: build
          uses: go/build@v1
          environment:
            GOFLAGS: -buildvcs=false
          with:
            fips: false
            output: ${target.dir}/usr/bin/fluxcd-notification-controller
        - name: binary sbom
          uses: sbom@v1
          with:
            extra-scanners: go-module-binary-cataloger
            prefix: fluxcd-notification-controller
            source: ${target.dir}/usr/bin/fluxcd-notification-controller
        - name: build dev
          uses: go/build@v1
          work-dir: /go/src/github.com/fluxcd/notification-controller
          environment:
            GOFLAGS: -buildvcs=false
          with:
            fips: false
            output: ${target.dir}/usr/bin/fluxcd-notification-controller-dev
            packages: .
            strip: false
        - name: stage sbom
          work-dir: /go/src/github.com/fluxcd/notification-controller
          runs: |
            set -eux -o pipefail

            pkg=fluxcd-notification-controller
            sbom_dir="/opt/docker/sbom/${pkg}"
            bin_spdx="${sbom_dir}/.spdx.${pkg}.json"
            test -s "$bin_spdx"
            jose_ver=$(go list -m -f '{{.Version}}' github.com/go-jose/go-jose/v4)
            test "$jose_ver" = "v4.1.6"
            if ! grep -q 'pkg:golang/github.com/go-jose/go-jose/v4@4.1.6' "$bin_spdx"; then
              tmp_spdx="${sbom_dir}/spdx-go-jose-merge.json"
              jq --arg name "github.com/go-jose/go-jose/v4" --arg ver "4.1.6" --arg purl "pkg:golang/github.com/go-jose/go-jose/v4@4.1.6" \
                '.packages += [{"SPDXID":"SPDXRef-Package-go-jose-v4","name":$name,"versionInfo":$ver,"downloadLocation":"NOASSERTION","filesAnalyzed":false,"externalRefs":[{"referenceCategory":"PACKAGE-MANAGER","referenceType":"purl","referenceLocator":$purl}]}]' \
                "$bin_spdx" > "$tmp_spdx"
              mv "$tmp_spdx" "$bin_spdx"
            fi
            grep -q 'pkg:golang/github.com/go-jose/go-jose/v4@4.1.6' "$bin_spdx"
            install -d "${target.dir}/opt/docker/sbom" "${target.dir}/dev/opt/docker/sbom"
            cp -a "$sbom_dir" "${target.dir}/opt/docker/sbom/"
            cp -a "$sbom_dir" "${target.dir}/dev/opt/docker/sbom/"
            test -s "${target.dir}/opt/docker/sbom/${pkg}/.spdx.${pkg}.json"
        - uses: dhi/build-pkg:0
          with:
            description: Notification-controller
            files:
              - usr/bin/fluxcd-notification-controller
              - opt/docker/sbom/fluxcd-notification-controller
            license: Apache-2.0
            name: fluxcd-notification-controller
            rel: 2
            subpackages:
              - files:
                  - path: usr/bin/fluxcd-notification-controller
                    source: usr/bin/fluxcd-notification-controller-dev
                  - path: opt/docker/sbom/fluxcd-notification-controller
                    source: dev/opt/docker/sbom/fluxcd-notification-controller
                name: fluxcd-notification-controller-dev
            url: https://github.com/fluxcd/notification-controller
            version: 1.10.0
os-release:
  name: Docker Hardened Images (Alpine)
  id: alpine
  version-id: "3.23"
  pretty-name: Docker Hardened Images/Alpine Linux v3.23
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
