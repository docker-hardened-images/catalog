# Build backends for the locust-2 venv: the [build-system].requires of locust
# (hatchling, hatch-vcs), gevent (setuptools, Cython, cffi, greenlet), pyzmq
# (scikit-build-core, cython, packaging), brotli (setuptools, pkgconfig),
# geventhttpclient and zope-interface (setuptools, wheel), plus pip for the
# hashed sdist downloads. Installed with --require-hashes into a build-only venv;
# every sdist build then runs with --no-build-isolation. Nothing here ships.
#
# upstream: locustio/locust 2.47.0
#
# greenlet is pinned to the version in upstream's uv.lock so gevent compiles
# against the headers it runs with. Regenerate on every VERSION bump, then
# restore this header (the build fails when the header names another tag):
#
#   uv pip compile build-requirements.in --python-version 3.14 --no-header \
#     --generate-hashes -o build-requirements.lock
#
# where build-requirements.in holds one line per name: cffi>=2.1.1,
# cython>=3.2.4, greenlet==<uv.lock version>, hatch-vcs, hatchling, packaging,
# pip, pkgconfig, scikit-build-core>=0.10, setuptools>=77.0.3, wheel.
