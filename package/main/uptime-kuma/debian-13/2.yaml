# syntax=dhi.io/build:2-debian13

image: dhi.io/pkg-uptime-kuma
variant: runtime
tags:
  - 2.5.0
  - 2.5.0-r0
  - 2.5.0-debian13
  - 2.5.0-r0-debian13
platforms:
  - linux/amd64
  - linux/arm64
vars:
  COMMIT_SHA: d9a60dfc73140d15111752e4e8910ed4b54bd9a3
  PACKAGE_NAME: uptime-kuma-2
  REL: "0"
  SEMVER_MAJOR_MINOR_VERSION: "2.5"
  SEMVER_MAJOR_VERSION: "2"
  SEMVER_VERSION: 2.5.0
  VERSION: 2.5.0
contents:
  repositories:
    - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
  keyring:
    - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
  packages:
    - base-files
  builds:
    - name: uptime-kuma
      work-dir: ${source.dir}/uptime-kuma
      caches:
        - path: /root/.npm
      contents:
        repositories:
          - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
        keyring:
          - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
        packages:
          - jq
          - gzip
          - base-files
          - bash
          - ca-certificates
          - coreutils
          - findutils
          - git
          - libc6
          - libstdc++6
          - mawk
          - nodejs-24
          - node-corepack
          - npm
          - sed
          - yarn-classic
        files:
          - url: git+https://github.com/louislam/uptime-kuma.git#2.5.0
            checksum: d9a60dfc73140d15111752e4e8910ed4b54bd9a3
            path: ${source.dir}/uptime-kuma
            spdx:
              name: uptime-kuma
              version: 2.5.0
              packages:
                - name: uptime-kuma
                  purl: pkg:npm/uptime-kuma@2.5.0
                  license: MIT
            uid: 0
            gid: 0
      pipeline:
        - name: allow CVE-pinned npm installs for v2
          work-dir: ${source.dir}/uptime-kuma
          runs: |
            set -eux -o pipefail

            printf 'min-release-age=0\n' >> .npmrc
        - name: bump
          uses: npm/bump@v1
          privileged: true
          with:
            bumps: ${source.dir}/patch/npm-bump-v2.json
            npm-root: ${source.dir}/uptime-kuma
        - name: regenerate package-lock after bump
          work-dir: ${source.dir}/uptime-kuma
          privileged: true
          runs: |
            set -eux -o pipefail

            rm -rf node_modules
            npm install
        - name: patch undici in package-lock
          work-dir: ${source.dir}/uptime-kuma
          privileged: true
          runs: |
            set -eux -o pipefail

            keys_to_remove='[
              "node_modules/@actions/http-client/node_modules/undici",
              "node_modules/@testcontainers/hivemq/node_modules/undici",
              "node_modules/@testcontainers/mariadb/node_modules/undici",
              "node_modules/@testcontainers/mssqlserver/node_modules/undici",
              "node_modules/@testcontainers/rabbitmq/node_modules/undici",
              "node_modules/testcontainers/node_modules/undici"
            ]'

            if ! jq -e '.packages | type == "object"' package-lock.json > /dev/null 2>&1; then
              echo "[ERROR] package-lock.json does not contain a top-level .packages object"
              exit 1
            fi

            found=$(jq -r --argjson keys "${keys_to_remove}" '. as $pl | [ $keys[] | select($pl.packages[.] != null) ] | length' package-lock.json)
            if [ "$found" -lt 1 ]; then
              echo "[ERROR] No expected undici lockfile keys found; refusing to patch."
              jq -r '.packages | keys[] | select(test("undici"))' package-lock.json | head -50 || true
              exit 1
            fi

            jq --argjson keys "${keys_to_remove}" '. as $pl | reduce ($keys[]) as $k ($pl ; del(.packages[$k]))' package-lock.json > package-lock.json.tmp
            mv package-lock.json.tmp package-lock.json

            rm -rf node_modules
            npm install

            if jq -e '.packages | to_entries[] | select(.value.name=="undici" and .value.version=="5.29.0")' package-lock.json > /dev/null; then
              echo "[ERROR] undici@5.29.0 still present in package-lock.json after patch"
              exit 1
            fi
        - name: install and build
          work-dir: ${source.dir}/uptime-kuma
          privileged: true
          runs: |
            set -eux -o pipefail

            if [ "2" = "1" ]; then
              npm test
            else
              npm run test-backend || true
            fi
            npm run build
            npm prune --omit=dev
        - name: copy app files
          work-dir: ${source.dir}/uptime-kuma
          runs: |
            set -eux -o pipefail

            mkdir -p "${target.dir}/usr/lib/uptime-kuma-2/src"

            cp -r package.json dist db extra server node_modules "${target.dir}/usr/lib/uptime-kuma-2/"
            cp src/util.js "${target.dir}/usr/lib/uptime-kuma-2/src/util.js"
        - name: prepare frontend workspace
          work-dir: ${source.dir}/uptime-kuma
          runs: |
            set -eux -o pipefail

            mkdir frontend
            jq --slurp '
              .[0] as $pkg |
              .[1] as $excl |
              $pkg.devDependencies |
              to_entries |
              map(
                select(
                  [.key] | inside($excl) | not
                )
              ) |
              from_entries |
              {
                name: "frontend",
                version: "2.5.0",
                dependencies: .
              }' package.json ./hack/exclude-dev-dependencies.json > ./frontend/package.json
            cp package.json package.json.original
            jq '. | .workspaces = ["frontend"]' package.json.original > package.json
        - name: generate frontend sbom
          work-dir: ${source.dir}/uptime-kuma
          privileged: true
          runs: |
            set -eux -o pipefail

            npm install --workspace=frontend --package-lock-only

            mkdir -p "/opt/docker/sbom/uptime-kuma-2-frontend"
            npm sbom --workspace=frontend --package-lock-only --sbom-format=spdx > "/opt/docker/sbom/uptime-kuma-2-frontend/.spdx.uptime-kuma-2-frontend.json"
        - uses: dhi/build-pkg:0
          with:
            depends:
              - nodejs-24
            description: Uptime Kuma, a self-hosted monitoring tool
            files:
              - usr/lib/uptime-kuma-2
            formats:
              - deb
            license: MIT
            name: uptime-kuma-2
            rel: 0
            url: https://github.com/louislam/uptime-kuma
            version: 2.5.0
      paths:
        - type: directory
          path: ${source.dir}/patch
          uid: 0
          gid: 0
          source: package/main/uptime-kuma/patch
        - type: file
          path: ${source.dir}/uptime-kuma/hack/exclude-dev-dependencies.json
          uid: 0
          gid: 0
          source: package/main/uptime-kuma/patch/exclude-dev-dependencies.json
os-release:
  name: Docker Hardened Images (Debian)
  id: debian
  version-id: "13"
  version-codename: trixie
  pretty-name: Docker Hardened Images/Debian GNU/Linux 13 (trixie)
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
