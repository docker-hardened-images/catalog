# syntax=dhi.io/build:2-debian13

image: dhi.io/pkg-linstor-gui
variant: runtime
tags:
  - 2.5.0
  - 2.5.0-r1
  - 2.5.0-debian13
  - 2.5.0-r1-debian13
platforms:
  - linux/amd64
  - linux/arm64
dates:
  release: "2025-11-21"
vars:
  COMMIT_SHA: 8e313503ddaf58838fbab74b7ab49df161ce837d
  PACKAGE_NAME: linstor-gui-2
  REL: "1"
  SEMVER_MAJOR_MINOR_VERSION: "2.5"
  SEMVER_MAJOR_VERSION: "2"
  SEMVER_VERSION: 2.5.0
  VERSION: 2.5.0
contents:
  packages:
    - base-files
  builds:
    - name: linstor-gui-2
      work-dir: ${source.dir}/linstor-gui
      caches:
        - path: /root/.npm
      contents:
        repositories:
          - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
        keyring:
          - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
        packages:
          - bash
          - gettext-base
          - jq
          - base-files
          - ca-certificates
          - coreutils
          - findutils
          - git
          - libc6
          - libstdc++6
          - mawk
          - nodejs-24
          - node-corepack
          - npm
          - sed
          - yarn-classic
        files:
          - url: git+https://github.com/LINBIT/linstor-gui.git#v2.5.0
            checksum: 8e313503ddaf58838fbab74b7ab49df161ce837d
            path: ${source.dir}/linstor-gui
            spdx:
              name: linstor-gui
              version: 2.5.0
              packages:
                - name: linstor-gui
                  purl: pkg:github/LINBIT/linstor-gui@v2.5.0
                  license: GPL-3.0
            uid: 0
            gid: 0
      pipeline:
        - name: bump dependencies
          uses: npm/bump@v1
          privileged: true
          environment:
            npm_config_ignore_scripts: "true"
          with:
            bumps: ${source.dir}/patch/npm-bumps-2.json
            npm-root: ${source.dir}/linstor-gui
        - name: install dependencies
          privileged: true
          runs: |
            set -eux -o pipefail

            npm ci
        - name: build frontend
          privileged: true
          runs: |
            set -eux -o pipefail

            npm run build
        - name: copy built files
          runs: |
            set -eux -o pipefail

            mkdir -p "${target.dir}/usr/share/linstor-gui"
            cp -r dist/* "${target.dir}/usr/share/linstor-gui/"
            cp "${source.dir}/config/50x.html" "${target.dir}/usr/share/linstor-gui/50x.html"
        - name: prepare for sbom
          runs: |
            set -eux -o pipefail

            tmp=$(mktemp)
            jq --arg version "2.5.0" '.version = $version' package.json > "$tmp" && mv "$tmp" package.json
        - name: reinstall dependencies for sbom
          privileged: true
          runs: |
            set -eux -o pipefail

            rm -rf node_modules
            npm install --omit=dev --ignore-scripts
        - name: generate sbom
          runs: |
            set -eux -o pipefail

            mkdir -p "${target.dir}/opt/docker/sbom/linstor-gui"
            npm sbom --omit=dev --omit=peer --package-lock-only --sbom-format=spdx \
              > "${target.dir}/opt/docker/sbom/linstor-gui/.spdx.linstor-gui.json"
        - name: install config files
          runs: |
            set -eux -o pipefail

            mkdir -p "${target.dir}/etc/linstor-gui"
            cp "${source.dir}/config/nginx.conf" "${target.dir}/etc/linstor-gui/nginx.conf"
        - uses: dhi/build-pkg:0
          with:
            description: LINSTOR GUI static web frontend
            files:
              - usr/share/linstor-gui
              - etc/linstor-gui/nginx.conf
              - opt/docker/sbom/linstor-gui
            formats:
              - deb
            license: GPL-3.0
            name: linstor-gui-2
            rel: 1
            url: https://github.com/LINBIT/linstor-gui
            version: 2.5.0
      paths:
        - type: directory
          path: ${source.dir}/config
          uid: 0
          gid: 0
          source: package/main/linstor-gui/config
        - type: file
          path: ${source.dir}/patch/npm-bumps-2.json
          uid: 0
          gid: 0
          source: package/main/linstor-gui/patch/npm-bumps-2.json
os-release:
  name: Docker Hardened Images (Debian)
  id: debian
  version-id: "13"
  version-codename: trixie
  pretty-name: Docker Hardened Images/Debian GNU/Linux 13 (trixie)
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
