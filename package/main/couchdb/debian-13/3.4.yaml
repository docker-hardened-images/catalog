            checksum: sha256:341de88134122400019a4cbf398dc35774bdd4f2dab3b6b9ad4fec596e627656
            path: ${source.dir}/10-docker-default.ini
            uid: 65532
            gid: 65532
            mode: "0644"
      pipeline:
        - name: build erlang otp
          work-dir: ${source.dir}/otp
          runs: |
            set -eux -o pipefail

            erlang_prefix="${source.dir}/erlang-prefix"
            ./configure --prefix=/usr/local
            make -j"$(nproc)"
            make install DESTDIR="${erlang_prefix}"
        - name: install rebar3
          work-dir: ${source.dir}/rebar3
          runs: |
            set -eux -o pipefail

            erlang_prefix="${source.dir}/erlang-prefix"
            export PATH="${erlang_prefix}/usr/local/bin:${PATH}"
            export ERL_ROOTDIR="${erlang_prefix}/usr/local/lib/erlang"

            ./bootstrap
            install -D -m755 rebar3 "${erlang_prefix}/usr/local/bin/rebar3"
        - name: install elixir
          work-dir: ${source.dir}/elixir
          runs: |
            set -eux -o pipefail

            erlang_prefix="${source.dir}/erlang-prefix"
            export PATH="${erlang_prefix}/usr/local/bin:${PATH}"
            export ERL_ROOTDIR="${erlang_prefix}/usr/local/lib/erlang"
            export ERL_COMPILER_OPTIONS=deterministic LANG=C.UTF-8

            make -j"$(nproc)"
            make install DESTDIR="${erlang_prefix}" PREFIX=/usr/local
            rm -f "${erlang_prefix}"/usr/local/bin/*.bat "${erlang_prefix}"/usr/local/bin/*.ps1
        - name: install erlfmt
          work-dir: ${source.dir}/couchdb
          privileged: true
          runs: |
            set -eux -o pipefail

            erlang_prefix="${source.dir}/erlang-prefix"
            export PATH="${erlang_prefix}/usr/local/bin:${PATH}"
            export ERL_ROOTDIR="${erlang_prefix}/usr/local/lib/erlang"

            mkdir -p bin
            cd src/erlfmt
            rebar3 as release escriptize
            mv _build/release/bin/erlfmt ../../bin/erlfmt
            rebar3 clean
        - name: configure
          work-dir: ${source.dir}/couchdb
          privileged: true
          runs: |
            set -eux -o pipefail

            erlang_prefix="${source.dir}/erlang-prefix"
            export PATH="${erlang_prefix}/usr/local/bin:${PATH}"
            export ERL_ROOTDIR="${erlang_prefix}/usr/local/lib/erlang"

            if [ -d /usr/include/aarch64-linux-gnu/mozjs-128 ]; then
              ln -sf /usr/include/aarch64-linux-gnu/mozjs-128 /usr/include/mozjs-128
            elif [ -d /usr/include/x86_64-linux-gnu/mozjs-128 ]; then
              ln -sf /usr/include/x86_64-linux-gnu/mozjs-128 /usr/include/mozjs-128
            fi

            ./configure --spidermonkey-version 128 --rebar3 "${erlang_prefix}/usr/local/bin/rebar3" --erlfmt bin/erlfmt
        - name: build
          work-dir: ${source.dir}/couchdb
          privileged: true
          runs: |
            set -eux -o pipefail

            erlang_prefix="${source.dir}/erlang-prefix"
            export PATH="${erlang_prefix}/usr/local/bin:${PATH}"
            export ERL_ROOTDIR="${erlang_prefix}/usr/local/lib/erlang"

            sed -i 's/-W //' src/docs/Makefile

            mkdir -p "${target.dir}/opt/couchdb"

            make -j "$(nproc)"
            make release
            mv rel/couchdb/* "${target.dir}/opt/couchdb/"

            install -D -m755 "${source.dir}/docker-entrypoint.sh" "${target.dir}/usr/share/couchdb/docker-entrypoint.sh"
            install -D -m644 "${source.dir}/10-docker-default.ini" "${target.dir}/opt/couchdb/etc/default.d/10-docker-default.ini"
            install -D -m644 "${source.dir}/opt/couchdb/etc/vm.args" "${target.dir}/opt/couchdb/etc/vm.args"

            chown -R 65532:65532 "${target.dir}/opt/couchdb"
            find "${target.dir}/opt/couchdb/etc" -type d ! -perm 0755 -exec chmod 0755 {} \;
            find "${target.dir}/opt/couchdb/etc" -type f ! -perm 0644 -exec chmod 0644 {} \;
        - name: tests
          work-dir: ${source.dir}/couchdb
          privileged: true
          runs: |
            set -eux -o pipefail

            erlang_prefix="${source.dir}/erlang-prefix"
            export PATH="${erlang_prefix}/usr/local/bin:${PATH}"
            export ERL_ROOTDIR="${erlang_prefix}/usr/local/lib/erlang"

            mkdir -p bin
            ln -sf "${erlang_prefix}/usr/local/bin/rebar3" ./bin/rebar3

            useradd -u 1000 -m -s /bin/bash testuser || true
            chown -R testuser:testuser "${source.dir}/couchdb"
            cd "${source.dir}/couchdb" && gosu testuser make check
        - uses: spdx@v1
          with:
            license: Apache-2.0
            name: couchdb
            purl: pkg:github/apache/couchdb@3.4.3
            version: 3.4.3
        - uses: dhi/build-pkg:0
          with:
            depends:
              - ca-certificates
              - libcurl4t64
              - libicu76
              - libmozjs-128-0
              - libncurses6
              - libstdc++6
            description: Apache CouchDB document-oriented database
            files:
              - opt/couchdb
              - usr/share/couchdb/docker-entrypoint.sh
            formats:
              - deb
            license: Apache-2.0
            name: couchdb-3.4
            rel: 5
            url: https://couchdb.apache.org/
            version: 3.4.3
