# syntax=dhi.io/build:2-alpine3.24

image: dhi.io/pkg-stack
variant: runtime
tags:
  - 3.11.1-alpine3.24
  - 3.11.1-r1-alpine3.24
platforms:
  - linux/amd64
  - linux/arm64
vars:
  BOOTSTRAP_GHC_NAME: ghc-9.10
  BOOTSTRAP_GHC_SEMVER: 9.10.3
  BOOTSTRAP_GHC_VERSION: 9.10.3-r1
  CABAL_VERSION: 3.18.1.0-r0
  COMMIT_SHA: 979bf6339fd4d5837c4d2fa8166dc715eef30ee2
  HACKAGE_INDEX_STATE: "2026-06-13T12:57:18Z"
  REL: "1"
  SEMVER_MAJOR_MINOR_VERSION: "3.11"
  SEMVER_MAJOR_VERSION: "3"
  SEMVER_VERSION: 3.11.1
  VERSION: 3.11.1
contents:
  repositories:
    - https://dhi.io/apk/alpine/v3.24/main
    - https://dhi.io/apk/alpine/v3.23/main
    - https://dl-cdn.alpinelinux.org/alpine/v3.24/main
    - https://dl-cdn.alpinelinux.org/alpine/v3.24/community
  keyring:
    - https://dhi.io/keyring/dhi-apk@docker-0F81AD7700D99184.rsa.pub
  packages:
    - alpine-baselayout-data
  builds:
    - name: stack
      work-dir: ${source.dir}/stack
      contents:
        packages:
          - ghc-9.10=9.10.3-r1
          - binutils
          - busybox
          - ca-certificates
          - cabal-install=3.18.1.0-r0
          - curl
          - g++
          - gcc
          - gmp-dev
          - libffi-dev
          - make
          - musl-dev
          - ncurses-libs
          - numactl-dev
          - pkgconf
          - python3
          - zlib-dev
        files:
          - url: git+https://github.com/commercialhaskell/stack.git#v3.11.1
            checksum: 979bf6339fd4d5837c4d2fa8166dc715eef30ee2
            path: ${source.dir}/stack
            spdx:
              name: stack
              version: 3.11.1
              packages:
                - name: stack
                  purl: pkg:generic/stack@3.11.1
                  license: BSD-3-Clause
            uid: 0
            gid: 0
      pipeline:
        - name: prepare build plan
          privileged: true
          runs: |
            set -eux -o pipefail

            ghc="/usr/lib/ghc-9.10/bin/ghc"
            test "$("${ghc}" --numeric-version)" = "9.10.3"

            "${ghc}-pkg" list --global --simple-output \
              | tr ' ' '\n' | sed 's/-[0-9][0-9.]*$//' | sort -u > /tmp/boot
            while read -r boot_pkg; do
              case "${boot_pkg}" in Cabal | Cabal-syntax) continue ;; esac
              sed -i "s|^  , ${boot_pkg} ==.*|  , ${boot_pkg} installed|" cabal.config
            done < /tmp/boot

            printf 'index-state: %s\n' "2026-06-13T12:57:18Z" > cabal.project.local
            cabal update
        - name: build stack
          privileged: true
          runs: |
            set -eux -o pipefail

            export PATH="/usr/lib/ghc-9.10/bin:${PATH}"

            cabal build \
              --with-compiler="/usr/lib/ghc-9.10/bin/ghc" \
              -j"$(nproc)" \
              exe:stack

            install -Dm0755 "$(cabal list-bin --with-compiler="/usr/lib/ghc-9.10/bin/ghc" exe:stack)" \
              "${target.dir}/usr/bin/stack"
            strip "${target.dir}/usr/bin/stack"
        - name: record build plan components
          runs: |
            set -eux -o pipefail

            python3 "${source.dir}/source-metadata.py" \
              --plan dist-newstyle/cache/plan.json \
              --version "3.11.1" \
              --compiler-version "9.10.3" \
              --compiler-root "/usr/lib/ghc-9.10" \
              --source . \
              --output "${target.dir}/opt/docker/sbom/stack/.spdx.stack.json"
        - uses: dhi/build-pkg:0
          with:
            depends:
              - ca-certificates
              - gmp
              - numactl
              - zlib
            description: The Haskell Tool Stack
            files:
              - usr/bin/stack
              - opt/docker/sbom/stack
            formats:
              - apk
            license: BSD-3-Clause
            name: stack
            rel: 1
            url: https://haskellstack.org/
            version: 3.11.1
      paths:
        - type: file
          path: ${source.dir}/source-metadata.py
          uid: 0
          gid: 0
          mode: "0644"
          source: package/main/stack/source-metadata.py
os-release:
  name: Docker Hardened Images (Alpine)
  id: alpine
  version-id: "3.24"
  pretty-name: Docker Hardened Images/Alpine Linux v3.24
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
