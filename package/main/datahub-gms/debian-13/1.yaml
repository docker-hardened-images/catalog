contents:
  packages:
    - base-files
  builds:
    - name: datahub-gms
      work-dir: ${source.dir}/datahub
      caches:
        - path: /root/.gradle
        - path: /go/pkg/mod
      contents:
        repositories:
          - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
        keyring:
          - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
        packages:
          - bash
          - ca-certificates
          - ca-certificates-bundle
          - coreutils
          - curl
          - findutils
          - git
          - golang-1.26=1.26.7-1
          - grep
          - gzip
          - mawk
          - sed
          - tar
          - eclipse-temurin-21-jdk=21.0.12.8-0
          - gradle-8=8.14.5-1
        files:
          - url: git+https://github.com/powerman/dockerize.git#v0.24.3
            checksum: a21f69ff60cdf1b2d54dadb7d04f28c8b6723c19
            path: /go/src/github.com/powerman/dockerize
            spdx:
              name: dockerize
              version: 0.24.3
              packages:
                - name: dockerize
                  purl: pkg:golang/github.com/powerman/dockerize@0.24.3
                  license: MIT
            uid: 0
            gid: 0
          - url: git+https://github.com/datahub-project/datahub.git#v1.6.0.1
            checksum: 036f89a860a92e8a756eccfc2d46047b52f05877
            path: ${source.dir}/datahub
            spdx:
              name: datahub
              version: 1.6.0.1
              packages:
                - name: datahub
                  purl: pkg:dhi/datahub-gms@1.6.0.1
                  license: Apache-2.0
            uid: 0
            gid: 0
          - url: https://maven-central.storage-download.googleapis.com/maven2/com/fasterxml/jackson/core/jackson-core/2.21.5/jackson-core-2.21.5.jar
            checksum: sha256:b64b5874162b503a0e58a8f7758266e8dd9f91bf49e3a59ae0b5f47589a231b7
            path: ${source.dir}/patch/deps/jackson-core-2.21.5.jar
            spdx:
              name: jackson-core
              version: 2.21.5
              packages:
                - name: jackson-core
                  purl: pkg:maven/com.fasterxml.jackson.core/jackson-core@2.21.5
                  license: Apache-2.0
            uid: 0
            gid: 0
          - url: https://maven-central.storage-download.googleapis.com/maven2/com/fasterxml/jackson/core/jackson-databind/2.21.5/jackson-databind-2.21.5.jar
            checksum: sha256:507418c0fafd38b2b2cfb704521630da613a8e4cc8381195a6f418017883e2c0
            path: ${source.dir}/patch/deps/jackson-databind-2.21.5.jar
            spdx:
              name: jackson-databind
              version: 2.21.5
              packages:
                - name: jackson-databind
                  purl: pkg:maven/com.fasterxml.jackson.core/jackson-databind@2.21.5
                  license: Apache-2.0
            uid: 0
            gid: 0
          - url: https://maven-central.storage-download.googleapis.com/maven2/tools/jackson/core/jackson-core/3.1.4/jackson-core-3.1.4.jar
            checksum: sha256:3bda1cd6eff0a8d47bdfcaeae7c2bd5311d6c8ed494ef5f3e51029bb44aa9bdf
            path: ${source.dir}/patch/deps/tools-jackson-core-3.1.4.jar
            spdx:
              name: jackson-core
              version: 3.1.4
              packages:
                - name: jackson-core
                  purl: pkg:maven/tools.jackson.core/jackson-core@3.1.4
                  license: Apache-2.0
            uid: 0
            gid: 0
          - url: https://maven-central.storage-download.googleapis.com/maven2/tools/jackson/core/jackson-databind/3.1.5/jackson-databind-3.1.5.jar
            checksum: sha256:3a2338d996fd3056791df8d335fa9ba8a62a706ed4245ecf81b3e583df37d08a
            path: ${source.dir}/patch/deps/tools-jackson-databind-3.1.5.jar
            spdx:
              name: jackson-databind
              version: 3.1.5
              packages:
                - name: jackson-databind
                  purl: pkg:maven/tools.jackson.core/jackson-databind@3.1.5
                  license: Apache-2.0
            uid: 0
            gid: 0
      pipeline:
        - name: bump go dependencies
          uses: go/bump@v2
          work-dir: /go/src/github.com/powerman/dockerize
          with:
            deps:
              - golang.org/x/sys@v0.45.0
              - golang.org/x/crypto@v0.55.0
            download: true
        - name: commit bumped go modules
          work-dir: /go/src/github.com/powerman/dockerize
          runs: |
            set -eux -o pipefail

            git config --global --add safe.directory /go/src/github.com/powerman/dockerize
            git config user.email "dhi@docker.com"
            git config user.name "Docker Hardened Images"
            git add go.mod go.sum
            git commit -m "dhi: bump dependencies" --no-gpg-sign
        - name: test dockerize
          work-dir: /go/src/github.com/powerman/dockerize
          runs: |
            set -eux -o pipefail

            go test ./...
        - name: build dockerize
          uses: go/build@v1
          work-dir: /go/src/github.com/powerman/dockerize
          with:
            output: ${target.dir}/usr/bin/dockerize
            packages: ./
        - name: install gradle init scripts
          runs: |
            set -eux -o pipefail

            install -D -m 0644 \
              ${source.dir}/patch/force-cve-deps.gradle \
              /root/.gradle/init.d/force-cve-deps.gradle
        - name: patch maven central for build cloud rate limits
          runs: |
            set -eux -o pipefail

            MIRROR='maven { url "https://maven-central.storage-download.googleapis.com/maven2/" }'
            PORTAL=$'maven {\\n    url "https://plugins.gradle.org/m2/"\\n    metadataSources { mavenPom(); artifact(); ignoreGradleMetadataRedirection() }\\n}'
            find . \( -name "*.gradle" -o -name "*.gradle.kts" \) -print0 \
              | xargs -0 sed -i \
                -e "s|mavenCentral()|${MIRROR}|g" \
                -e "s|gradlePluginPortal()|${PORTAL}|g"

            sed -i \
              -e 's|datahub.dependencies.maven.central=https://repo1.maven.org/maven2|datahub.dependencies.maven.central=https://maven-central.storage-download.googleapis.com/maven2|g' \
              -e 's|apacheMavenRepositoryUrl=https://repo1.maven.org/maven2|apacheMavenRepositoryUrl=https://maven-central.storage-download.googleapis.com/maven2|g' \
              gradle.properties
        - name: bump vulnerable dependency versions
          runs: |
            set -eux -o pipefail

            find . \( -name '*.gradle' -o -name '*.gradle.kts' -o -name 'gradle.lockfile' \) -print0 \
              | xargs -0 sed -i \
                -e 's|at\.yawk\.lz4:lz4-java:1\.10\.1|at.yawk.lz4:lz4-java:1.11.1|g'

            cat >> build.gradle << 'GRADLE'

            allprojects {
                configurations.configureEach {
                    resolutionStrategy {
                        force 'at.yawk.lz4:lz4-java:1.11.1'
                        eachDependency { details ->
                        def req = details.requested
                        if (req.group == 'io.netty'
                                && req.name.startsWith('netty-')
                                && !req.name.startsWith('netty-tcnative')) {
                            details.useVersion '4.2.17.Final'
                            details.because 'DHI CVE remediation'
                        }
                        if (req.group == 'io.airlift' && req.name == 'aircompressor') {
                            details.useVersion '2.0.3'
                            details.because 'DHI CVE remediation'
                        }
                        if (req.group == 'org.springframework'
                                && req.name == 'spring-webmvc') {
                            details.useVersion '7.0.8'
                            details.because 'DHI CVE remediation'
                        }
                        if (req.group == 'org.springframework.kafka'
                                && req.name.startsWith('spring-kafka')) {
                            details.useVersion '4.0.6'
                            details.because 'DHI CVE remediation'
                        }
                        if (req.group == 'org.springframework.boot'
                                && req.name.startsWith('spring-boot')) {
                            details.useVersion '4.0.7'
                            details.because 'DHI CVE remediation'
                        }
                        if (req.group != null && req.group.startsWith('com.fasterxml.jackson')
                                && req.name != 'jackson-annotations') {
                            details.useVersion '2.21.5'
                            details.because 'DHI CVE remediation'
                        }
                        if (req.group == 'org.apache.logging.log4j'
                                && req.name.startsWith('log4j-')) {
                            details.useVersion '2.25.5'
                            details.because 'DHI CVE remediation'
                        }
                        if (req.group == 'org.apache.commons'
                                && req.name == 'commons-lang3') {
                            details.useVersion '3.18.0'
                            details.because 'DHI CVE remediation'
                        }
                        if (req.group == 'org.apache.avro'
                                && req.name.startsWith('avro')) {
                            details.useVersion '1.11.5'
                            details.because 'DHI CVE remediation'
                        }
                        if (req.group == 'com.sun.mail'
                                && req.name == 'jakarta.mail') {
                            details.useVersion '1.6.8'
                            details.because 'DHI CVE remediation'
                        }
                        if (req.group == 'io.opentelemetry'
                                && req.name.startsWith('opentelemetry-')) {
                            details.useVersion '1.62.0'
                            details.because 'DHI CVE remediation'
                        }
                        if (req.group == 'ch.qos.logback'
                                && req.name.startsWith('logback-')) {
                            details.useVersion '1.5.35'
                            details.because 'DHI CVE remediation'
                        }
                        if (req.group == 'org.mozilla'
                                && req.name == 'rhino') {
                            details.useVersion '1.7.15.1'
                            details.because 'DHI CVE remediation'
                        }
                        if (req.group == 'org.postgresql'
                                && req.name == 'postgresql') {
                            details.useVersion '42.7.12'
                            details.because 'DHI CVE remediation'
                        }
                        if (req.group == 'org.mariadb.jdbc'
                                && req.name == 'mariadb-java-client') {
                            details.useVersion '2.7.14'
                            details.because 'DHI CVE remediation'
                        }
                        if (req.group == 'org.eclipse.jetty'
                                && req.name.startsWith('jetty-')) {
                            details.useVersion '12.1.10'
                            details.because 'DHI CVE remediation'
                        }
                        if (req.group == 'at.yawk.lz4'
                                && req.name == 'lz4-java') {
                            details.useVersion '1.11.1'
                            details.because 'DHI CVE remediation'
                        }
                        if (req.group == 'io.micrometer'
                                && (req.name == 'micrometer-core'
                                    || req.name.startsWith('micrometer-registry-'))) {
                            details.useVersion '1.16.6'
                            details.because 'DHI CVE remediation'
                        }
                        if (req.group == 'org.apache.httpcomponents.core5'
                                && req.name.startsWith('httpcore5')) {
                            details.useVersion '5.4.3'
                            details.because 'DHI CVE remediation'
                        }
                        if (req.group == 'org.apache.httpcomponents.client5'
                                && req.name == 'httpclient5') {
                            details.useVersion '5.6.3'
                            details.because 'DHI CVE remediation'
                        }
                        }
                    }
                }
            }
            GRADLE
        - name: build war
          privileged: true
          runs: |
            set -eux -o pipefail

            export GRADLE_HOME="/usr/share/java/gradle"
            export JAVA_HOME="/usr/lib/jvm/temurin-21"
            export PATH="${GRADLE_HOME}/bin:${JAVA_HOME}/bin:${PATH}"

            find . -name 'gradle.lockfile' -delete || true

            ./gradlew --init-script ${source.dir}/files/init.gradle \
              :metadata-service:war:assemble \
              -x test \
              --parallel --max-workers=4 \
              --update-locks 'com.fasterxml.jackson.core:*,com.fasterxml.jackson.dataformat:*,com.fasterxml.jackson.datatype:*,com.fasterxml.jackson.module:*,org.apache.zookeeper:*,org.eclipse.jetty:*,org.postgresql:*,org.mariadb.jdbc:*,org.springframework.boot:*,org.springframework:*,org.springframework.kafka:*,io.netty:*,io.airlift:*,org.apache.logging.log4j:*,org.apache.commons:*,org.apache.avro:*,com.sun.mail:*,io.opentelemetry:*,ch.qos.logback:*,org.mozilla:*,at.yawk.lz4:*,io.micrometer:*,org.apache.httpcomponents.core5:*,org.apache.httpcomponents.client5:*' \
              --no-daemon --console=plain
        - name: stage runtime files
          runs: |
            set -eux -o pipefail

            mkdir -p "${target.dir}/usr/share/datahub-gms/bin"
            mkdir -p "${target.dir}/usr/share/datahub-gms/scripts"
            mkdir -p "${target.dir}/usr/share/datahub-gms/resources"
            mkdir -p "${target.dir}/usr/share/datahub-gms/lib"

            cp metadata-service/war/build/libs/war.war \
              "${target.dir}/usr/share/datahub-gms/bin/war.war"

            bash "${source.dir}/patch/patch-hazelcast-jackson.sh" \
              "${target.dir}/usr/share/datahub-gms/bin/war.war" \
              "${source.dir}/patch/deps"
            cp metadata-models/src/main/resources/entity-registry.yml \
              "${target.dir}/usr/share/datahub-gms/resources/entity-registry.yml"
            cp docker/monitoring/client-prometheus-config.yaml \
              "${target.dir}/usr/share/datahub-gms/scripts/prometheus-config.yaml"

            cp "${source.dir}/files/start.sh" \
              "${target.dir}/usr/share/datahub-gms/scripts/start.sh"
            chmod 0755 "${target.dir}/usr/share/datahub-gms/scripts/start.sh"
        - name: fetch otel javaagent
          privileged: true
          runs: |
            set -eux -o pipefail

            curl -fsSL -o /tmp/opentelemetry-javaagent.jar \
              "https://github.com/open-telemetry/opentelemetry-java-instrumentation/releases/download/v2.28.0/opentelemetry-javaagent.jar"
            echo "130606aed07f101458fe42b8f453ef3a2536f6bce8a7ae64f222f5688ada2500  /tmp/opentelemetry-javaagent.jar" | sha256sum -c -
            mv /tmp/opentelemetry-javaagent.jar \
              "${target.dir}/usr/share/datahub-gms/lib/opentelemetry-javaagent.jar"
        - name: fetch jmx prometheus javaagent
          privileged: true
          runs: |
            set -eux -o pipefail

            curl -fsSL -o /tmp/jmx_prometheus_javaagent.jar \
              "https://maven-central.storage-download.googleapis.com/maven2/io/prometheus/jmx/jmx_prometheus_javaagent/0.20.0/jmx_prometheus_javaagent-0.20.0.jar"
            echo "8b67ed40485d475648c36d11d21464b484406f85faf912b3363f71a6a7861320  /tmp/jmx_prometheus_javaagent.jar" | sha256sum -c -
            mv /tmp/jmx_prometheus_javaagent.jar \
              "${target.dir}/usr/share/datahub-gms/lib/jmx_prometheus_javaagent.jar"
        - name: java sbom
          uses: sbom@v1
          with:
            extra-scanners: java-archive-cataloger
            prefix: datahub-gms
            source: ${target.dir}/usr/share/datahub-gms
        - uses: dhi/build-pkg:0
          with:
            depends:
              - bash
              - coreutils
            description: DataHub General Metadata Service backend
            files:
              - usr/share/datahub-gms
              - usr/bin/dockerize
            formats:
              - deb
            license: Apache-2.0
            name: datahub-gms
            rel: 5
            url: https://datahubproject.io/
            version: 1.6.0.1
      paths:
        - type: file
          path: ${source.dir}/files/start.sh
          uid: 0
          gid: 0
          source: package/main/datahub-gms/files/start.sh
        - type: file
          path: ${source.dir}/files/init.gradle
          uid: 0
          gid: 0
          source: package/main/datahub-gms/files/init.gradle
        - type: file
          path: ${source.dir}/patch/force-cve-deps.gradle
          uid: 0
          gid: 0
          source: package/main/datahub-gms/patch/force-cve-deps.gradle
        - type: file
          path: ${source.dir}/patch/patch-hazelcast-jackson.sh
          uid: 0
          gid: 0
          mode: "0755"
          source: package/main/datahub-gms/patch/patch-hazelcast-jackson.sh
os-release:
  name: Docker Hardened Images (Debian)
  id: debian
  version-id: "13"
  version-codename: trixie
  pretty-name: Docker Hardened Images/Debian GNU/Linux 13 (trixie)
  home-url: https://docker.com/products/hardened-images/
