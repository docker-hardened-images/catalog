  - linux/arm64
dates:
  release: "2025-08-22"
vars:
  COMMIT_SHA: 036f89a860a92e8a756eccfc2d46047b52f05877
  DOCKERIZE_COMMIT_SHA: a21f69ff60cdf1b2d54dadb7d04f28c8b6723c19
