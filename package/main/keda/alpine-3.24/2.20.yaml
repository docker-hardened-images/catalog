# syntax=dhi.io/build:2-alpine3.24

image: dhi.io/pkg-keda
variant: runtime
tags:
  - 2.20.2-alpine3.24
  - 2.20.2-r0-alpine3.24
platforms:
  - linux/amd64
  - linux/arm64
dates:
  release: "2026-06-01"
vars:
  COMMIT_SHA: 68a5b5028f35b22d50597c69819ab32c4e92f21a
  GOLANG_MAJOR_MINOR_VERSION: "1.26"
  GOLANG_VERSION: 1.26.7-r0
  PACKAGE_NAME: keda-2.20
  REL: "0"
  SEMVER_MAJOR_MINOR_VERSION: "2.20"
  SEMVER_MAJOR_VERSION: "2"
  SEMVER_VERSION: 2.20.2
  VERSION: 2.20.2
contents:
  repositories:
    - https://dhi.io/apk/alpine/v3.24/main
    - https://dhi.io/apk/alpine/v3.23/main
    - https://dl-cdn.alpinelinux.org/alpine/v3.24/main
    - https://dl-cdn.alpinelinux.org/alpine/v3.24/community
  keyring:
    - https://dhi.io/keyring/dhi-apk@docker-0F81AD7700D99184.rsa.pub
  packages:
    - alpine-baselayout-data
  builds:
    - name: keda-2.20
      work-dir: /go/src/github.com/kedacore/keda
      caches:
        - path: /go/pkg/mod
      contents:
        packages:
          - busybox
          - bash
          - ca-certificates-bundle
          - coreutils
          - findutils
          - mawk
          - sed
          - golang-1.26=1.26.7-r0
          - golang-1.26-oci-config=1.26.7-r0
        files:
          - url: git+https://github.com/kedacore/keda.git#v2.20.2
            checksum: 68a5b5028f35b22d50597c69819ab32c4e92f21a
            path: /go/src/github.com/kedacore/keda
            spdx:
              name: keda
              version: 2.20.2
              packages:
                - name: keda
                  purl: pkg:golang/github.com/kedacore/keda/v2@2.20.2
                  license: Apache-2.0
            uid: 0
            gid: 0
      pipeline:
        - name: remove vendor directory
          runs: |
            set -eux -o pipefail

            rm -rf vendor
        - name: patch prometheus promql parser API
          uses: patch@v1
          work-dir: /go/src/github.com/kedacore/keda
          with:
            options: -p1
            patch: /go/src/github.com/kedacore/keda/patch/prometheus-promql-parser.patch
        - name: update go dependencies (2.20 only)
          uses: go/bump@v1
          with:
            deps:
              - golang.org/x/mod@v0.40.0
              - golang.org/x/text@v0.41.0
              - golang.org/x/net@v0.58.0
              - github.com/klauspost/compress@v1.18.7
              - github.com/valyala/fasthttp@v1.70.0
              - go.opentelemetry.io/otel@v1.44.0
              - google.golang.org/grpc@v1.82.1
              - go.etcd.io/etcd/client/pkg/v3@v3.6.14
              - github.com/prometheus/prometheus@v0.311.3
            download: true
            replaces:
              - github.com/prometheus/prometheus=github.com/prometheus/prometheus@v0.311.3
              - github.com/prometheus/common=github.com/prometheus/common@v0.67.5
        - name: build
          uses: go/build@v1
          with:
            fips: false
            ldflags:
              - -X=github.com/kedacore/keda/v2/version.GitCommit=68a5b5028f35b22d50597c69819ab32c4e92f21a
              - -X=github.com/kedacore/keda/v2/version.Version=2.20.2
            output: ${target.dir}/usr/bin/keda
            packages: ./cmd/operator/main.go
            tidy: true
        - name: build dev
          uses: go/build@v1
          with:
            fips: false
            ldflags:
              - -X=github.com/kedacore/keda/v2/version.GitCommit=68a5b5028f35b22d50597c69819ab32c4e92f21a
              - -X=github.com/kedacore/keda/v2/version.Version=2.20.2
            output: ${target.dir}/usr/bin/keda-dev
            packages: ./cmd/operator/main.go
            strip: false
            tidy: true
        - uses: dhi/build-pkg:0
          with:
            description: Kubernetes Event-driven Autoscaling (KEDA)
            files:
              - usr/bin/keda
            license: Apache-2.0
            name: keda-2.20
            rel: 0
            subpackages:
              - files:
                  - path: usr/bin/keda
                    source: usr/bin/keda-dev
                name: keda-2.20-dev
            url: https://github.com/kedacore/keda
            version: 2.20.2
      paths:
        - type: file
          path: /go/src/github.com/kedacore/keda/patch/prometheus-promql-parser.patch
          uid: 0
          gid: 0
          source: package/main/keda/patch/prometheus-promql-parser.patch
os-release:
  name: Docker Hardened Images (Alpine)
  id: alpine
  version-id: "3.24"
  pretty-name: Docker Hardened Images/Alpine Linux v3.24
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
