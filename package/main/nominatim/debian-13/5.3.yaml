# syntax=dhi.io/build:2-debian13

image: dhi.io/pkg-nominatim
variant: runtime
tags:
  - 5.3.3
  - 5.3.3-r2
  - 5.3.3-debian13
  - 5.3.3-r2-debian13
platforms:
  - linux/amd64
  - linux/arm64
vars:
  ARCH: '#{ target.arch == "amd64" ? "x86_64" : "aarch64" }'
  COMMIT_SHA: 879a2e00bbe73e8719b7d9c3e05c533c2f117d91
  LIBOSMIUM_SHA256: eb47d8163396c73870dbf27819dcadda0c56f0191935c4f8659d1e61b261552f
  LIBOSMIUM_VERSION: 2.23.1
  NOMINATIM_SHA256: abb258fb9da62995ad438f9223f6573f1fee9cf50e74d2945a0b7515828a7779
  PACKAGE_NAME: nominatim-5.3
  PROTOZERO_SHA256: 6c7a896f1dc08435e8cd4f3780ff688cd0bfce6890599b755f6f3cb36398dc25
  PROTOZERO_VERSION: 1.8.1
  PYTHON_MINOR: "3.14"
  PYTHON_VERSION: 3.14.10-1
  REL: "2"
  SEMVER_MAJOR_MINOR_VERSION: "5.3"
  SEMVER_MAJOR_VERSION: "5"
  SEMVER_VERSION: 5.3.3
  UV_VERSION: 0.13.6
  VERSION: 5.3.3
contents:
  repositories:
    - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
  keyring:
    - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
  packages:
    - base-files
  builds:
    - name: nominatim
      work-dir: ${source.dir}
      caches:
        - path: /root/.cache/uv
      contents:
        packages:
          - bash
          - build-essential
          - bzip2
          - ca-certificates
          - cmake
          - coreutils
          - findutils
          - grep
          - gzip
          - libc-bin
          - pkg-config
          - sed
          - tar
          - libbz2-dev
          - libexpat1-dev
          - libicu-dev
          - libpq-dev
          - zlib1g-dev
          - libpython-3.14=3.14.10-1
          - libpython-3.14-dev=3.14.10-1
          - libpython-3.14-minimal=3.14.10-1
          - libpython-3.14-stdlib=3.14.10-1
          - python-3.14-minimal=3.14.10-1
          - python-3.14=3.14.10-1
          - python-3.14-dev=3.14.10-1
        files:
          - url: https://nominatim.org/release/Nominatim-5.3.3.tar.bz2
            checksum: sha256:abb258fb9da62995ad438f9223f6573f1fee9cf50e74d2945a0b7515828a7779
            path: ${source.dir}/Nominatim.tar.bz2
            spdx:
              name: nominatim
              version: 5.3.3
              packages:
                - name: nominatim
                  purl: pkg:github/osm-search/nominatim@5.3.3
                  license: GPL-3.0-or-later
                - name: nominatim-lib-lua
                  purl: pkg:github/osm-search/nominatim@5.3.3#lib-lua
                  license: Apache-2.0
                - name: nominatim-lib-sql
                  purl: pkg:github/osm-search/nominatim@5.3.3#lib-sql
                  license: GPL-2.0-only
            uid: 0
            gid: 0
          - url: https://github.com/astral-sh/uv/releases/download/0.13.6/uv-${ARCH}-unknown-linux-gnu.tar.gz
            checksum: https://github.com/astral-sh/uv/releases/download/0.13.6/uv-${ARCH}-unknown-linux-gnu.tar.gz.sha256
            path: ${source.dir}/uv.tar.gz
            uid: 0
            gid: 0
          - url: https://github.com/mapbox/protozero/archive/refs/tags/v1.8.1.tar.gz
            checksum: sha256:6c7a896f1dc08435e8cd4f3780ff688cd0bfce6890599b755f6f3cb36398dc25
            path: ${source.dir}/protozero.tar.gz
            uid: 0
            gid: 0
          - url: https://github.com/osmcode/libosmium/archive/refs/tags/v2.23.1.tar.gz
            checksum: sha256:eb47d8163396c73870dbf27819dcadda0c56f0191935c4f8659d1e61b261552f
            path: ${source.dir}/libosmium.tar.gz
            uid: 0
            gid: 0
      pipeline:
        - name: setup uv
          runs: |
            set -eux -o pipefail

            mkdir -p /usr/local/bin
            tar -xzf "${source.dir}/uv.tar.gz" -C /usr/local/bin --strip-components=1
            test -x /usr/local/bin/uv
        - name: unpack nominatim
          runs: |
            set -eux -o pipefail

            tar -xjf "${source.dir}/Nominatim.tar.bz2" -C "${source.dir}"
            test -d "${source.dir}/Nominatim-5.3.3"
            mv "${source.dir}/Nominatim-5.3.3" "${source.dir}/nominatim-src"
        - name: build venv at final path and stage it
          privileged: true
          runs: |
            set -eux -o pipefail

            export SOURCE_DIR="${source.dir}" TARGET_DIR="${target.dir}" PYTHON_BIN=/usr/bin/python3.14
            export LOCK_FILE="${source.dir}/requirements-5.3.txt"
            export BUILD_LOCK_FILE="${source.dir}/requirements-build.txt"
            export NOMINATIM_VERSION="5.3.3"
            export LIBOSMIUM_VERSION="2.23.1" PROTOZERO_VERSION="1.8.1"
            bash "${source.dir}/build-nominatim.sh"
        - name: bundled libosmium sbom
          uses: spdx@v1
          with:
            license: BSL-1.0
            name: libosmium
            purl: pkg:github/osmcode/libosmium@2.23.1
            version: 2.23.1
        - name: bundled protozero sbom
          uses: spdx@v1
          with:
            license: BSD-2-Clause
            name: protozero
            purl: pkg:github/mapbox/protozero@1.8.1
            version: 1.8.1
        - name: python dependencies sbom
          uses: sbom@v1
          with:
            extra-scanners: python-package-cataloger
            prefix: nominatim-python
            source: ${target.dir}/usr/lib/nominatim
        - name: stage sbom documents
          runs: |
            set -eux -o pipefail

            mkdir -p "${target.dir}/opt/docker/sbom"
            for d in nominatim nominatim-python libosmium protozero; do
              test -d "/opt/docker/sbom/$d"
              cp -a "/opt/docker/sbom/$d" "${target.dir}/opt/docker/sbom/"
            done
        - uses: dhi/build-pkg:0
          with:
            deb:
              depends:
                - libbz2-1.0
                - libexpat1
                - libicu76
                - libpq5
                - libstdc++6
                - postgresql-client-17
                - zlib1g
            depends:
              - python-3.14
            description: Nominatim geocoding toolkit for OpenStreetMap
            files:
              - usr/lib/nominatim
              - usr/bin/nominatim
              - usr/share/doc/nominatim
              - opt/docker/sbom/nominatim
              - opt/docker/sbom/nominatim-python
              - opt/docker/sbom/libosmium
              - opt/docker/sbom/protozero
            formats:
              - deb
            license: GPL-3.0-or-later
            name: nominatim-5.3
            rel: 2
            url: https://nominatim.org
            version: 5.3.3
      paths:
        - type: file
          path: ${source.dir}/build-nominatim.sh
          uid: 0
          gid: 0
          mode: "0755"
          source: package/main/nominatim/build-nominatim.sh
        - type: file
          path: ${source.dir}/requirements-build.txt
          uid: 0
          gid: 0
          mode: "0644"
          source: package/main/nominatim/requirements-build.txt
        - type: file
          path: ${source.dir}/requirements-5.3.txt
          uid: 0
          gid: 0
          mode: "0644"
          source: package/main/nominatim/requirements-5.3.txt
os-release:
  name: Docker Hardened Images (Debian)
  id: debian
  version-id: "13"
  version-codename: trixie
  pretty-name: Docker Hardened Images/Debian GNU/Linux 13 (trixie)
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
