              version: 0.30.1
              packages:
                - name: k8ssandra-medusa
                  purl: pkg:pypi/cassandra-medusa@0.30.1
                  license: Apache-2.0
            uid: 0
            gid: 0
      pipeline:
        - name: build poetry venv at final path and stage it
          privileged: true
          runs: |
            set -eux -o pipefail

            export SOURCE_DIR="${source.dir}" TARGET_DIR="${target.dir}" PYTHON_BIN=/usr/bin/python3.12 POETRY_VERSION=1.8.5
            bash "${source.dir}/build-poetry.sh"
        - uses: dhi/build-pkg:0
          with:
            depends:
              - python-3.12
            description: K8ssandra Medusa backup and restore service for Apache Cassandra
            files:
