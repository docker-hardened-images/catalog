            fips: false
            ldflags:
              - -extldflags=-static
              - -X github.com/operator-framework/operator-registry/cmd/opm/version.gitCommit=19af4a361697de502ae43b0ab5b072973cbe4655
              - -X github.com/operator-framework/operator-registry/cmd/opm/version.opmVersion=v1.73.0
            output: ${target.dir}/usr/bin/opm-dev
            packages: ./cmd/opm
            strip: false
            tags: json1,containers_image_openpgp
