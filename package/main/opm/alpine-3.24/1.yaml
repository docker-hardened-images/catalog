                  purl: pkg:golang/github.com/operator-framework/operator-registry@1.73.0
                  license: Apache-2.0
            uid: 0
            gid: 0
      pipeline:
        - name: update go dependencies
          uses: go/bump@v2
          with:
            deps:
              - github.com/go-git/go-git/v5@v5.19.2
              - github.com/google/cel-go@v0.30.0
              - github.com/sigstore/fulcio@v1.8.6
            tidy: true
        - uses: go/hermetic@v1
        - name: test
          runs: |
            set -eux -o pipefail

            CGO_ENABLED=1 go test -tags json1,containers_image_openpgp ./cmd/... ./pkg/... ./alpha/...
        - name: build opm
          uses: go/build@v1
          with:
