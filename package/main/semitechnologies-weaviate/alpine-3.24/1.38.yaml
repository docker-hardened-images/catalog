# syntax=dhi.io/build:2-alpine3.24

image: dhi.io/pkg-semitechnologies-weaviate
variant: runtime
tags:
  - 1.38.25-alpine3.24
  - 1.38.25-r1-alpine3.24
platforms:
  - linux/amd64
  - linux/arm64
vars:
  COMMIT_SHA: 3cb7d7e8ac90ad4c96694036adcc20cfb8a12360
  EXCLUDE_WL: "false"
  GOLANG_VERSION: 1.26.11-r0
  PACKAGE_NAME: weaviate-1.38
  REL: "1"
  SEMVER_MAJOR_MINOR_VERSION: "1.38"
  SEMVER_MAJOR_VERSION: "1"
  SEMVER_VERSION: 1.38.25
  VERSION: 1.38.25
contents:
  repositories:
    - https://dhi.io/apk/alpine/v3.24/main
    - https://dhi.io/apk/alpine/v3.23/main
    - https://dl-cdn.alpinelinux.org/alpine/v3.24/main
    - https://dl-cdn.alpinelinux.org/alpine/v3.24/community
  keyring:
    - https://dhi.io/keyring/dhi-apk@docker-0F81AD7700D99184.rsa.pub
  packages:
    - alpine-baselayout-data
  builds:
    - name: weaviate-1.38
      work-dir: /go/src/github.com/weaviate/weaviate
      environment:
        CGO_ENABLED: "0"
        GOMAXPROCS: "6"
        GOTOOLCHAIN: local
      caches:
        - path: /root/.cache/go-build
          sharing: locked
      contents:
        packages:
          - bash
          - busybox
          - ca-certificates-bundle
          - coreutils
          - findutils
          - git
          - golang-1.26=1.26.11-r0
          - golang-1.26-oci-config=1.26.11-r0
          - grep
        files:
          - url: git+https://github.com/weaviate/weaviate.git#v1.38.25
            checksum: 3cb7d7e8ac90ad4c96694036adcc20cfb8a12360
            path: /go/src/github.com/weaviate/weaviate
            spdx:
              name: weaviate
              version: 1.38.25
              packages:
                - name: weaviate
                  purl: pkg:golang/github.com/weaviate/weaviate@1.38.25
                  license: BSD-3-Clause
            uid: 0
            gid: 0
      pipeline:
        - name: update go dependencies
          uses: go/bump@v2
          with:
            deps:
              - github.com/klauspost/compress@v1.20.2
              - go.mongodb.org/mongo-driver@v1.17.7
              - go.opentelemetry.io/otel@v1.45.0
              - go.opentelemetry.io/otel/sdk@v1.45.0
              - go.opentelemetry.io/otel/exporters/otlp/otlptrace@v1.45.0
              - go.opentelemetry.io/otel/exporters/otlp/otlptrace/otlptracegrpc@v1.45.0
              - go.opentelemetry.io/otel/exporters/otlp/otlptrace/otlptracehttp@v1.45.0
            download: true
        - name: reject enterprise wl imports
          work-dir: /go/src/github.com/weaviate/weaviate
          runs: |
            set -eux -o pipefail

            export GOPROXY=off
            export GOSUMDB=off
            : > /tmp/wl-hits.txt
            if grep -R -l --include='*.go' 'github.com/weaviate/weaviate/wl/' . > /tmp/wl-all.txt; then
              grep -v '/wl/' /tmp/wl-all.txt | grep -v '_test\.go$' > /tmp/wl-hits.txt || true
            fi
            if [ -s /tmp/wl-hits.txt ]; then
              cat /tmp/wl-hits.txt >&2
              echo "non-test Go files outside wl import the enterprise tree" >&2
              exit 1
            fi
            go list -deps ./cmd/weaviate-server > /tmp/server-deps.txt
            if grep -F 'github.com/weaviate/weaviate/wl' /tmp/server-deps.txt; then
              echo "weaviate-server deps include an enterprise wl package" >&2
              exit 1
            fi
        - name: test
          work-dir: /go/src/github.com/weaviate/weaviate
          runs: |
            set -eux -o pipefail

            export GOPROXY=off
            export GOSUMDB=off
            CGO_ENABLED=0 go test -count=1 ./usecases/build
        - uses: go/hermetic@v1
        - name: build weaviate
          uses: go/build@v1
          with:
            cgo_enabled: 0
            fips: false
            ldflags:
              - -s
              - -w
              - -extldflags=-static
              - -X github.com/weaviate/weaviate/usecases/build.Branch=v1.38.25
              - -X github.com/weaviate/weaviate/usecases/build.Revision=3cb7d7e8ac90ad4c96694036adcc20cfb8a12360
              - -X github.com/weaviate/weaviate/usecases/build.BuildUser=dhi
              - -X github.com/weaviate/weaviate/usecases/build.BuildDate=$(date -ud @${SOURCE_DATE_EPOCH} +%Y-%m-%dT%H:%M:%SZ)
            output: ${target.dir}/usr/bin/weaviate
            packages: ./cmd/weaviate-server
            tags: netgo
        - name: build weaviate dev
          uses: go/build@v1
          with:
            cgo_enabled: 0
            extra-args: -gcflags="all=-N -l"
            fips: false
            ldflags:
              - -extldflags=-static
              - -X github.com/weaviate/weaviate/usecases/build.Branch=v1.38.25
              - -X github.com/weaviate/weaviate/usecases/build.Revision=3cb7d7e8ac90ad4c96694036adcc20cfb8a12360
              - -X github.com/weaviate/weaviate/usecases/build.BuildUser=dhi
              - -X github.com/weaviate/weaviate/usecases/build.BuildDate=$(date -ud @${SOURCE_DATE_EPOCH} +%Y-%m-%dT%H:%M:%SZ)
            output: ${target.dir}/usr/bin/weaviate-dev
            packages: ./cmd/weaviate-server
            strip: false
            tags: netgo
        - name: verify build info
          runs: |
            set -eux -o pipefail

            go version -m "${target.dir}/usr/bin/weaviate" > /tmp/weaviate-buildinfo.txt
            grep -F -- '-s -w' /tmp/weaviate-buildinfo.txt
            grep -F -- '-extldflags=-static' /tmp/weaviate-buildinfo.txt
            grep -F -- '-trimpath=true' /tmp/weaviate-buildinfo.txt
            grep -F -- 'usecases/build.Branch=v1.38.25' /tmp/weaviate-buildinfo.txt
            grep -F -- 'usecases/build.Revision=3cb7d7e8ac90ad4c96694036adcc20cfb8a12360' /tmp/weaviate-buildinfo.txt
            grep -F -- 'usecases/build.BuildUser=dhi' /tmp/weaviate-buildinfo.txt
            if grep -F -- 'usecases/build.Version=' /tmp/weaviate-buildinfo.txt; then
              echo "Version must come from the embedded OpenAPI schema, not an ldflag" >&2
              exit 1
            fi
            modver=$(awk -F "$(printf '\t')" '$2 == "mod" && $3 == "github.com/weaviate/weaviate" { print $4; exit }' /tmp/weaviate-buildinfo.txt)
            printf '%s\n' "main=$modver"
            case "$modver" in
              "v1.38.25" | "v1.38.25+dirty") ;;
              *)
                echo "main module stamp must be v1.38.25 or v1.38.25+dirty" >&2
                exit 1
                ;;
            esac
            go version -m "${target.dir}/usr/bin/weaviate-dev" > /tmp/weaviate-dev-buildinfo.txt
            devver=$(awk -F "$(printf '\t')" '$2 == "mod" && $3 == "github.com/weaviate/weaviate" { print $4; exit }' /tmp/weaviate-dev-buildinfo.txt)
            printf '%s\n' "dev=$devver"
            case "$devver" in
              "v1.38.25" | "v1.38.25+dirty") ;;
              *)
                echo "dev main module stamp must be v1.38.25 or v1.38.25+dirty" >&2
                exit 1
                ;;
            esac
            grep -F -- 'all=-N -l' /tmp/weaviate-dev-buildinfo.txt
            if grep -F -- '-s -w' /tmp/weaviate-dev-buildinfo.txt; then
              echo "dev binary must keep symbols" >&2
              exit 1
            fi
            if grep -F -- '-trimpath=true' /tmp/weaviate-dev-buildinfo.txt; then
              echo "dev binary must not be built with -trimpath" >&2
              exit 1
            fi
        - uses: spdx@v1
          with:
            license: BSD-3-Clause
            name: weaviate
            purl: pkg:golang/github.com/weaviate/weaviate@1.38.25
            version: 1.38.25
        - name: install licenses and sbom
          work-dir: /go/src/github.com/weaviate/weaviate
          runs: |
            set -eux -o pipefail

            test -s /opt/docker/sbom/weaviate/.spdx.weaviate.json
            mkdir -p "${target.dir}/opt/docker/sbom" "${target.dir}/usr/share/weaviate"
            cp -a /opt/docker/sbom/weaviate "${target.dir}/opt/docker/sbom/"
            test -s "${target.dir}/opt/docker/sbom/weaviate/.spdx.weaviate.json"
            cp LICENSE "${target.dir}/usr/share/weaviate/LICENSE"
            test -s "${target.dir}/usr/share/weaviate/LICENSE"
            if [ -f LICENSE-BSD ]; then
              cp LICENSE-BSD "${target.dir}/usr/share/weaviate/LICENSE-BSD"
              test -s "${target.dir}/usr/share/weaviate/LICENSE-BSD"
            fi
            if [ -f wl/LICENSE-WEAVIATE ]; then
              cp wl/LICENSE-WEAVIATE "${target.dir}/usr/share/weaviate/LICENSE-WEAVIATE"
              test -s "${target.dir}/usr/share/weaviate/LICENSE-WEAVIATE"
            fi
        - uses: dhi/build-pkg:0
          with:
            depends:
              - ca-certificates-bundle
            description: Weaviate vector database server
            files:
              - usr/bin/weaviate
              - usr/share/weaviate
              - opt/docker/sbom/weaviate
            license: BSD-3-Clause
            name: weaviate-1.38
            rel: 1
            subpackages:
              - depends:
                  - ca-certificates-bundle
                files:
                  - path: usr/bin/weaviate
                    source: usr/bin/weaviate-dev
                name: weaviate-1.38-dev
            url: https://github.com/weaviate/weaviate
            version: 1.38.25
      paths:
        - type: file
          path: ${source.dir}/patch/exclude-wl.patch
          uid: 0
          gid: 0
          source: package/main/semitechnologies-weaviate/patch/exclude-wl.patch
os-release:
  name: Docker Hardened Images (Alpine)
  id: alpine
  version-id: "3.24"
  pretty-name: Docker Hardened Images/Alpine Linux v3.24
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
