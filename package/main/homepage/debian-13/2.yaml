# syntax=dhi.io/build:2-debian13

image: dhi.io/pkg-homepage
variant: runtime
tags:
  - 2.8.0
  - 2.8.0-r2
  - 2.8.0-debian13
  - 2.8.0-r2-debian13
platforms:
  - linux/amd64
  - linux/arm64
dates:
  release: "2026-08-14"
vars:
  COMMIT_SHA: 08a0c1df566464bfdb327f3fd8f1f5a058d56640
  DHI_TEST_DEB_EXPECTED_FILES: /usr/lib/homepage/server.js
  NODEJS_VERSION: 24.22.3-0
  PACKAGE_NAME: homepage-2
  PACKAGE_REL: "0"
  REL: "2"
  SEMVER_MAJOR_MINOR_VERSION: "2.8"
  SEMVER_MAJOR_VERSION: "2"
  SEMVER_VERSION: 2.8.0
  VERSION: 2.8.0
contents:
  repositories:
    - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
  keyring:
    - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
  packages:
    - base-files
  builds:
    - name: homepage
      work-dir: ${source.dir}/homepage
      caches:
        - path: /root/.local/share/pnpm
        - path: /root/.cache
      contents:
        repositories:
          - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
        keyring:
          - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
        packages:
          - base-files
          - bash
          - ca-certificates
          - coreutils
          - findutils
          - git
          - grep
          - libc6
          - libstdc++6
          - mawk
          - nodejs-24=24.22.3-0
          - node-corepack
          - npm
          - sed
          - yarn-classic
        files:
          - url: git+https://github.com/gethomepage/homepage.git#v2.8.0
            checksum: 08a0c1df566464bfdb327f3fd8f1f5a058d56640
            path: ${source.dir}/homepage
            spdx:
              name: homepage
              version: 2.8.0
              packages:
                - name: homepage
                  purl: pkg:dhi/homepage@2.8.0
                  license: GPL-3.0
            uid: 0
            gid: 0
      pipeline:
        - name: update entrypoint
          runs: |
            set -eux -o pipefail

            sed -i 's/su-exec/gosu/g' docker-entrypoint.sh
            sed -i '/^set -e/a\
            \
            if [ -d /usr/lib/homepage ]; then\
              find /usr/lib/homepage -depth -name '"'"'*__DHI_LB__*'"'"' | while IFS= read -r f; do\
                dir=$(dirname "$f")\
                base=$(basename "$f")\
                real=$(printf '"'"'%s'"'"' "$base" | sed '"'"'s#__DHI_LB__#[#g; s#__DHI_RB__#]#g'"'"')\
                mv "$f" "${dir}/${real}"\
              done\
            fi' docker-entrypoint.sh
        - name: enable corepack pnpm
          privileged: true
          runs: |
            set -eux -o pipefail

            corepack enable
            chmod +x /usr/lib/nodejs/corepack/dist/*.js
            corepack prepare pnpm@latest --activate

            pnpm install --prefer-offline --ignore-scripts
        - name: bump pnpm dependencies
          uses: pnpm/bump@v1
          privileged: true
          with:
            bumps: ${source.dir}/patch/pnpm-bumps.json
            pnpm-root: ${source.dir}/homepage
        - name: build
          privileged: true
          runs: |
            set -eux -o pipefail

            pnpm install --prefer-offline \
              && NEXT_TELEMETRY_DISABLED=1 \
                NEXT_PUBLIC_BUILDTIME=$(date -u -d @${SOURCE_DATE_EPOCH} +'%FT%TZ') \
                NEXT_PUBLIC_VERSION=2.8.0 \
                NEXT_PUBLIC_REVISION=08a0c1df566464bfdb327f3fd8f1f5a058d56640 \
                pnpm run build

            mkdir -p "${target.dir}/usr/lib/homepage"
            cp -a ./.next/standalone/. "${target.dir}/usr/lib/homepage/"
            mkdir -p "${target.dir}/usr/lib/homepage/.next/static"
            cp -a ./.next/static/. "${target.dir}/usr/lib/homepage/.next/static/"
            mkdir -p "${target.dir}/usr/lib/homepage/public"
            cp -a ./public/. "${target.dir}/usr/lib/homepage/public/"

            install -D -m 0755 docker-entrypoint.sh "${target.dir}/usr/bin/docker-entrypoint.sh"

            rm -rf "${target.dir}/usr/lib/homepage/src"

            install -d -m 0755 "${target.dir}/usr/lib/homepage/src/skeleton"
            cp -a src/skeleton/. "${target.dir}/usr/lib/homepage/src/skeleton/"
        - uses: dhi/build-pkg:0
          with:
            depends:
              - nodejs-24
            description: A highly customizable homepage (dashboard) for your server
            disableGlobbing: true
            files:
              - usr/lib/homepage
              - usr/bin/docker-entrypoint.sh
            formats:
              - deb
            license: GPL-3.0
            name: homepage-2
            rel: 0
            url: https://github.com/gethomepage/homepage
            version: 2.8.0
        - name: publish legacy package name
          uses: dhi/build-pkg:0
          with:
            depends:
              - nodejs-24
            description: A highly customizable homepage (dashboard) for your server
            disableGlobbing: true
            files:
              - usr/lib/homepage
              - usr/bin/docker-entrypoint.sh
            formats:
              - deb
            license: GPL-3.0
            name: homepage
            rel: 2
            url: https://github.com/gethomepage/homepage
            version: 2.8.0
      paths:
        - type: file
          path: ${source.dir}/patch/pnpm-bumps.json
          uid: 0
          gid: 0
          source: package/main/homepage/patch/pnpm-bumps.json
        - type: file
          path: ${source.dir}/patch/pnpm-bumps-1.json
          uid: 0
          gid: 0
          source: package/main/homepage/patch/pnpm-bumps-1.json
os-release:
  name: Docker Hardened Images (Debian)
  id: debian
  version-id: "13"
  version-codename: trixie
  pretty-name: Docker Hardened Images/Debian GNU/Linux 13 (trixie)
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
