              rm -rf "$bp_dir"
              cp -r /tmp/body-parser-fix/package "$bp_dir"
            done

            rm -rf /tmp/body-parser-fix
        - name: create default config
          runs: |
            set -eux -o pipefail

            mkdir -p "${target.dir}/usr/share/apigee-microgateway/default-config"
            npx edgemicro init -c "${target.dir}/usr/share/apigee-microgateway/default-config"
        - name: stage payload
          runs: |
            set -eux -o pipefail

            npm pack
            pack_tgz=$(ls edgemicro-*.tgz)
            mkdir -p /tmp/edgemicro-pack
            tar -xzf "$pack_tgz" -C /tmp/edgemicro-pack

            mkdir -p "${target.dir}/usr/lib/apigee-microgateway"
            cp -a /tmp/edgemicro-pack/package/. "${target.dir}/usr/lib/apigee-microgateway/"
            cp -a node_modules "${target.dir}/usr/lib/apigee-microgateway/"

            rm -f "${target.dir}/usr/lib/apigee-microgateway/.env" \
              "${target.dir}/usr/lib/apigee-microgateway/.gitignore" \
              "${target.dir}/usr/lib/apigee-microgateway/.eslintrc" \
              "${target.dir}/usr/lib/apigee-microgateway/.jshintrc"
            rm -rf "${target.dir}/usr/lib/apigee-microgateway/test-functional"

            mkdir -p "${target.dir}/usr/bin"
            ln -sf ../lib/apigee-microgateway/cli/edgemicro "${target.dir}/usr/bin/edgemicro"

            rm -rf /tmp/edgemicro-pack "$pack_tgz"
