  REL: "0"
  SEMVER_MAJOR_MINOR_VERSION: "4.1"
  SEMVER_MAJOR_VERSION: "4"
  SEMVER_VERSION: 4.1.4
  VERSION: 4.1.4
contents:
  repositories:
    - https://dhi.io/apk/alpine/v3.23/main
    - https://dl-cdn.alpinelinux.org/alpine/v3.23/main
    - https://dl-cdn.alpinelinux.org/alpine/v3.23/community
  keyring:
    - https://dhi.io/keyring/dhi-apk@docker-0F81AD7700D99184.rsa.pub
  packages:
    - alpine-baselayout-data
  builds:
    - name: argo-workflows-4
      work-dir: /go/src/github.com/argoproj/argo-workflows
      contents:
        packages:
          - busybox
          - bash
          - ca-certificates-bundle
          - golang-1.26=1.26.8-r0
          - golang-1.26-oci-config=1.26.8-r0
        files:
          - url: git+https://github.com/argoproj/argo-workflows.git#v4.1.4
            checksum: b5b4d665e9be9b87c115f943584c3e0ae96fe073
            path: /go/src/github.com/argoproj/argo-workflows
            spdx:
              name: argo-workflow-controller
              version: 4.1.4
              packages:
                - name: argo-workflow-controller
                  purl: pkg:golang/argoproj/argo-workflows@4.1.4
                  license: Apache-2.0
            uid: 0
            gid: 0
      pipeline:
        - name: patch (4 only)
          uses: go/bump@v1
          work-dir: /go/src/github.com/argoproj/argo-workflows
          with:
            deps:
              - golang.org/x/crypto@v0.56.0
              - github.com/go-jose/go-jose/v4@v4.1.4
              - github.com/jackc/pgx/v5@v5.9.2
              - github.com/klauspost/compress@v1.19.1
              - github.com/moby/spdystream@v0.5.1
              - go.opentelemetry.io/otel@v1.45.0
              - go.opentelemetry.io/otel/sdk@v1.45.0
              - go.opentelemetry.io/otel/exporters/otlp/otlptrace/otlptracehttp@v1.46.0
              - go.opentelemetry.io/otel/exporters/otlp/otlptrace@v1.46.0
              - go.opentelemetry.io/otel/exporters/otlp/otlptrace/otlptracegrpc@v1.46.0
              - google.golang.org/grpc@v1.85.0-dev.0.20260825072537-93e31b48545e
            download: true
        - name: test
          work-dir: /go/src/github.com/argoproj/argo-workflows
          runs: |
            set -eux -o pipefail

            echo "Testing core functionality after patching..."

            go test -v -count=1 -timeout=3m ./workflow/validate -run="TestDAG"
            go test -v -count=1 -timeout=3m ./workflow/common

            UTIL_PACKAGES=$(go list ./util/... | grep -Ev './util/(telemetry|sqldb)')
            go test -v -count=1 -timeout=4m $UTIL_PACKAGES
        - name: build-backend
          uses: go/build@v1
          work-dir: /go/src/github.com/argoproj/argo-workflows
          with:
            fips: false
            ldflags:
              - -X github.com/argoproj/argo-workflows/v4.version=4.1.4
              - -X github.com/argoproj/argo-workflows/v4.gitCommit=b5b4d665e9be9b87c115f943584c3e0ae96fe073
            output: ${target.dir}/usr/bin/workflow-controller
            packages: ./cmd/workflow-controller
        - name: build dev
          uses: go/build@v1
          work-dir: /go/src/github.com/argoproj/argo-workflows
          with:
            fips: false
            ldflags:
              - -X github.com/argoproj/argo-workflows/v4.version=4.1.4
              - -X github.com/argoproj/argo-workflows/v4.gitCommit=b5b4d665e9be9b87c115f943584c3e0ae96fe073
            output: ${target.dir}/usr/bin/workflow-controller-dev
            packages: ./cmd/workflow-controller
            strip: false
        - uses: dhi/build-pkg:0
          with:
            description: Argo-workflows
            files:
              - usr/bin/workflow-controller
            license: Apache-2.0
            name: argo-workflows-4
            priority: "200"
            provides: argo-workflows=$pkg_full_version
            rel: 0
            replaces: argo-workflows
            subpackages:
              - files:
                  - path: usr/bin/workflow-controller
                    source: usr/bin/workflow-controller-dev
                name: argo-workflows-4-dev
            url: https://github.com/argoproj/argo-workflows
            version: 4.1.4
