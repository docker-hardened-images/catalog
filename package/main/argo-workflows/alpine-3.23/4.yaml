  - linux/arm64
vars:
  COMMIT_SHA: b5b4d665e9be9b87c115f943584c3e0ae96fe073
  GOLANG_MAJOR_MINOR_VERSION: "1.26"
  GOLANG_VERSION: 1.26.8-r0
  MODULE_MAJOR_VERSION: v4
