# syntax=dhi.io/build:2-alpine3.24

image: dhi.io/pkg-zscaler-mcp
variant: runtime
tags:
  - 0.15.2-alpine3.24
  - 0.15.2-r0-alpine3.24
platforms:
  - linux/amd64
  - linux/arm64
vars:
  COMMIT_SHA: 1b9d63a3e00e9bd7878da4dd436ec897c0c425bf
  REL: "0"
  SEMVER_MAJOR_MINOR_VERSION: "0.15"
  SEMVER_MAJOR_VERSION: "0"
  SEMVER_VERSION: 0.15.2
  UV_ARCH: '#{ target.arch == "amd64" ? "x86_64-unknown-linux-musl" : "aarch64-unknown-linux-musl" }'
  UV_VERSION: 0.12.3
  VERSION: 0.15.2
contents:
  repositories:
    - https://dhi.io/apk/alpine/v3.24/main
    - https://dhi.io/apk/alpine/v3.23/main
    - https://dl-cdn.alpinelinux.org/alpine/v3.24/main
    - https://dl-cdn.alpinelinux.org/alpine/v3.24/community
  keyring:
    - https://dhi.io/keyring/dhi-apk@docker-0F81AD7700D99184.rsa.pub
  packages:
    - alpine-baselayout-data
  builds:
    - name: zscaler-mcp
      environment:
        UV_COMPILE_BYTECODE: "1"
      caches:
        - path: /root/.cache/uv
      contents:
        packages:
          - bash
          - build-base
          - ca-certificates-bundle
          - coreutils
          - findutils
          - git
          - libffi-dev
          - openssl-dev
          - sed
          - python3
          - python3-dev
        files:
          - url: https://github.com/astral-sh/uv/releases/download/0.12.3/uv-${UV_ARCH}.tar.gz
            checksum: https://github.com/astral-sh/uv/releases/download/0.12.3/uv-${UV_ARCH}.tar.gz.sha256
            path: ${source.dir}/uv.tar.gz
            spdx:
              name: uv-binary
              version: 0.12.3
              packages:
                - name: uv
                  purl: pkg:github/astral-sh/uv@0.12.3
                  license: Apache-2.0
            uid: 0
            gid: 0
          - url: git+https://github.com/zscaler/zscaler-mcp-server.git#v0.15.2
            checksum: 1b9d63a3e00e9bd7878da4dd436ec897c0c425bf
            path: ${source.dir}/src
            spdx:
              name: zscaler-mcp
              version: 0.15.2
              packages:
                - name: zscaler-mcp
                  purl: pkg:github/zscaler/zscaler-mcp-server@0.15.2
                  license: MIT
            uid: 0
            gid: 0
      pipeline:
        - name: setup uv
          runs: |
            set -eux -o pipefail

            mkdir -p /usr/local/bin
            tar -xzf "${source.dir}/uv.tar.gz" -C /usr/local/bin --strip-components=1
            chmod +x /usr/local/bin/uv
        - name: build venv at final path and stage it
          privileged: true
          runs: |
            set -eux -o pipefail

            export SOURCE_DIR="${source.dir}" TARGET_DIR="${target.dir}" PYTHON_BIN=/usr/bin/python3
            bash "${source.dir}/build-venv.sh"
        - uses: dhi/build-pkg:0
          with:
            depends:
              - python3
            description: Zscaler MCP Server - Model Context Protocol server for the Zscaler Zero Trust Exchange platform
            files:
              - opt/zscaler-mcp
              - usr/bin/zscaler-mcp
            formats:
              - apk
            license: MIT
            name: zscaler-mcp
            rel: 0
            url: https://github.com/zscaler/zscaler-mcp-server
            version: 0.15.2
      paths:
        - type: file
          path: ${source.dir}/build-venv.sh
          uid: 0
          gid: 0
          mode: "0755"
          source: package/main/zscaler-mcp/build-venv.sh
os-release:
  name: Docker Hardened Images (Alpine)
  id: alpine
  version-id: "3.24"
