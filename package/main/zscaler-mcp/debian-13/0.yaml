# syntax=dhi.io/build:2-debian13

image: dhi.io/pkg-zscaler-mcp
variant: runtime
tags:
  - 0.15.2
  - 0.15.2-r0
  - 0.15.2-debian13
  - 0.15.2-r0-debian13
platforms:
  - linux/amd64
  - linux/arm64
vars:
  ARCH: '#{ target.arch == "amd64" ? "x86_64" : "aarch64" }'
  COMMIT_SHA: 1b9d63a3e00e9bd7878da4dd436ec897c0c425bf
  REL: "0"
  SEMVER_MAJOR_MINOR_VERSION: "0.15"
  SEMVER_MAJOR_VERSION: "0"
  SEMVER_VERSION: 0.15.2
  UV_VERSION: 0.12.3
  VERSION: 0.15.2
contents:
  packages:
    - base-files
  builds:
    - name: zscaler-mcp
      work-dir: ${source.dir}
      environment:
        UV_COMPILE_BYTECODE: "1"
      caches:
        - path: /root/.cache/uv
      contents:
        packages:
          - bash
          - ca-certificates
          - coreutils
          - findutils
          - gcc
          - git
          - gzip
          - libc6-dev
          - libffi-dev
          - libssl-dev
          - sed
          - tar
          - python3
          - python3-dev
          - python3-venv
        files:
          - url: https://github.com/astral-sh/uv/releases/download/0.12.3/uv-${ARCH}-unknown-linux-gnu.tar.gz
            checksum: https://github.com/astral-sh/uv/releases/download/0.12.3/uv-${ARCH}-unknown-linux-gnu.tar.gz.sha256
            path: ${source.dir}/uv-unknown-linux-gnu.tar.gz
            spdx:
              name: uv-binary
              version: 0.12.3
              packages:
                - name: uv
                  purl: pkg:github/astral-sh/uv@0.12.3
                  license: Apache-2.0
            uid: 0
            gid: 0
          - url: git+https://github.com/zscaler/zscaler-mcp-server.git#v0.15.2
            checksum: 1b9d63a3e00e9bd7878da4dd436ec897c0c425bf
            path: ${source.dir}/src
            spdx:
              name: zscaler-mcp
              version: 0.15.2
              packages:
                - name: zscaler-mcp
                  purl: pkg:github/zscaler/zscaler-mcp-server@0.15.2
                  license: MIT
            uid: 0
            gid: 0
      pipeline:
        - name: setup uv
          runs: |
            set -eux -o pipefail

            mkdir -p /usr/local/bin
            tar -xzf "${source.dir}/uv-unknown-linux-gnu.tar.gz" -C /usr/local/bin --strip-components=1
            chmod +x /usr/local/bin/uv
        - name: build venv at final path and stage it
          privileged: true
          runs: |
            set -eux -o pipefail

            export SOURCE_DIR="${source.dir}" TARGET_DIR="${target.dir}" PYTHON_BIN=/usr/bin/python3
            bash "${source.dir}/build-venv.sh"
        - uses: dhi/build-pkg:0
          with:
            depends:
              - python3
            description: Zscaler MCP Server - Model Context Protocol server for the Zscaler Zero Trust Exchange platform
            files:
              - opt/zscaler-mcp
              - usr/bin/zscaler-mcp
            formats:
              - deb
            license: MIT
            name: zscaler-mcp
            rel: 0
            url: https://github.com/zscaler/zscaler-mcp-server
            version: 0.15.2
      paths:
        - type: file
          path: ${source.dir}/build-venv.sh
          uid: 0
          gid: 0
          mode: "0755"
          source: package/main/zscaler-mcp/build-venv.sh
os-release:
  name: Docker Hardened Images (Debian)
  id: debian
  version-id: "13"
  version-codename: trixie
  pretty-name: Docker Hardened Images/Debian GNU/Linux 13 (trixie)
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
