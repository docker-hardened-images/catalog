# syntax=dhi.io/build:2-debian13

image: dhi.io/pkg-copilot
variant: runtime
tags:
  - 1.0.109
  - 1.0.109-r0
  - 1.0.109-debian13
  - 1.0.109-r0-debian13
platforms:
  - linux/amd64
  - linux/arm64
vars:
  ARCH: '#{ target.arch == "amd64" ? "x64" : "arm64" }'
  PACKAGE_NAME: copilot-1
  REL: "0"
  SEMVER_MAJOR_MINOR_VERSION: "1.0"
  SEMVER_MAJOR_VERSION: "1"
  SEMVER_VERSION: 1.0.109
  VERSION: 1.0.109
contents:
  repositories:
    - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
  keyring:
    - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
  packages:
    - base-files
  builds:
    - name: copilot-1
      contents:
        packages:
          - bash
          - coreutils
          - grep
          - libstdc++6
        files:
          - url: https://github.com/github/copilot-cli/releases/download/v1.0.109/copilot-linux-${ARCH}.tar.gz
            checksum: https://github.com/github/copilot-cli/releases/download/v1.0.109/SHA256SUMS.txt
            path: ${source.dir}/copilot
            spdx:
              name: copilot
              version: 1.0.109
              packages:
                - name: copilot-cli
                  purl: pkg:github/github/copilot-cli@v1.0.109
                  license: LicenseRef-Proprietary
            uid: 0
            gid: 0
            mode: "0755"
      pipeline:
        - name: verify
          runs: |
            set -eux -o pipefail

            "${source.dir}/copilot/copilot" --version | grep -Fw "1.0.109"
        - name: stage
          runs: |
            set -eux -o pipefail

            install -Dm755 "${source.dir}/copilot/copilot" "${target.dir}/usr/bin/copilot"
        - uses: dhi/build-pkg:0
          with:
            depends:
              - libc6
              - libgcc-s1
              - libstdc++6
            description: GitHub Copilot CLI agent for Docker Sandboxes
            files:
              - usr/bin/copilot
            formats:
              - deb
            license: LicenseRef-Proprietary
            name: copilot-1
            rel: 0
            url: https://github.com/github/copilot-cli
            version: 1.0.109
os-release:
  name: Docker Hardened Images (Debian)
  id: debian
  version-id: "13"
  version-codename: trixie
  pretty-name: Docker Hardened Images/Debian GNU/Linux 13 (trixie)
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
