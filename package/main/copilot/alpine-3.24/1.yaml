        - name: verify
          runs: |
            set -eux -o pipefail

            "${source.dir}/copilot/copilot" --version | grep -Fw "1.0.109"
        - name: stage
          runs: |
            set -eux -o pipefail

            install -Dm755 "${source.dir}/copilot/copilot" "${target.dir}/usr/bin/copilot"
        - uses: dhi/build-pkg:0
          with:
            description: GitHub Copilot CLI agent for Docker Sandboxes
            files:
              - usr/bin/copilot
            formats:
              - apk
            license: LicenseRef-Proprietary
            name: copilot-1
            rel: 0
            url: https://github.com/github/copilot-cli
            version: 1.0.109
os-release:
  name: Docker Hardened Images (Alpine)
  id: alpine
  version-id: "3.24"
  pretty-name: Docker Hardened Images/Alpine Linux v3.24
  home-url: https://docker.com/products/hardened-images/
