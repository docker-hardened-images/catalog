# syntax=dhi.io/build:2-alpine3.24

image: dhi.io/pkg-copilot
variant: runtime
tags:
  - 1.0.109-alpine3.24
  - 1.0.109-r0-alpine3.24
platforms:
  - linux/amd64
  - linux/arm64
vars:
  ARCH: '#{ target.arch == "amd64" ? "x64" : "arm64" }'
  PACKAGE_NAME: copilot-1
  REL: "0"
  SEMVER_MAJOR_MINOR_VERSION: "1.0"
  SEMVER_MAJOR_VERSION: "1"
