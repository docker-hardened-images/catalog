# syntax=dhi.io/build:2-debian13

image: dhi.io/pkg-gradle
variant: runtime
tags:
  - "8"
  - "8.14"
  - 8.14.6
  - 8-debian13
  - 8.14-debian13
  - 8.14.6-debian13
platforms:
  - linux/amd64
  - linux/arm64
vars:
  GRADLE_COMMIT_SHA: 88c80c1459b75a6d077d24eebe7905ffa3e1293f
  GRADLE_MAJOR_MINOR_VERSION: "8.14"
  GRADLE_MAJOR_VERSION: "8"
  GRADLE_VERSION: 8.14.6
  JAVA_DIGEST: sha256:14c2ddbd73db60588d5f59fb63547bddd03016d2ba583682759dcd5f2c24caa2
  JAVA_VERSION: 17.0.21.9
contents:
  packages:
    - '!base-files'
  builds:
    - name: gradle
      uses: dhi.io/eclipse-temurin:17.0.21.9-jdk-debian13-dev@sha256:14c2ddbd73db60588d5f59fb63547bddd03016d2ba583682759dcd5f2c24caa2
      work-dir: ${source.dir}/gradle
      environment:
        PATH: /usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
      contents:
        packages:
          - git
          - unzip
          - gnu-which
          - libudev-dev
          - sed
          - libstdc++6
        files:
          - url: git+https://github.com/gradle/gradle.git#v8.14.6
            checksum: 88c80c1459b75a6d077d24eebe7905ffa3e1293f
            path: ${source.dir}/gradle
            spdx:
              name: gradle
              version: 8.14.6
              packages:
                - name: gradle
                  purl: pkg:dhi/gradle@8.14.6
                  license: Apache-2.0
            uid: 0
            gid: 0
      pipeline:
        - name: install
          privileged: true
          runs: |
            set -eux -o pipefail

            # TODO cd: we need to download the gradle wrapper ahead of time
            ./gradlew :distributions-full:binDistributionZip -Pversion="8.14.6"

            unzip "packaging/distributions-full/build/distributions/gradle-8.14.6-bin.zip"
            mkdir -p "${target.dir}/opt/java/gradle/gradle-8.14.6"
            cd gradle-*

            # shellcheck disable=SC2035
            cp -r * "${target.dir}/opt/java/gradle/gradle-8.14.6"

            mkdir -p "${target.dir}/usr/local/bin"
            find "${target.dir}/opt/java/gradle/gradle-8.14.6/bin" -type f -executable -o -type l | while read -r file; do
              filename=$(basename "$file")
              ln -s "/opt/java/gradle/gradle-8.14.6/bin/$filename" "${target.dir}/usr/local/bin/$filename"
            done
        - name: test
          runs: |
            set -eux -o pipefail

            "${target.dir}/opt/java/gradle/gradle-8.14.6/bin/gradle" --version
      paths:
        - type: file
          path: ${source.dir}/patch/0004-Disable-deprecation-warnings.patch
          uid: 0
          gid: 0
          source: package/gradle/patch/0004-Disable-deprecation-warnings.patch
      outputs:
        - source: ${target.dir}/opt/java/gradle/gradle-8.14.6
          target: /opt/java/gradle/gradle-8.14.6
          uid: 0
          gid: 0
        - source: ${target.dir}/usr/local/bin
          target: /usr/local/bin
          uid: 0
          gid: 0
        - source: /opt/docker/sbom/gradle
          target: /opt/docker/sbom/gradle
          uid: 0
          gid: 0
accounts:
  root: true
  run-as: root
os-release:
  name: Docker Hardened Images (Debian)
  id: debian
  version-id: "13"
  version-codename: trixie
  pretty-name: Docker Hardened Images/Debian GNU/Linux 13 (trixie)
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
environment:
  GRADLE_HOME: /opt/java/gradle/gradle-8.14.6
  GRADLE_VERSION: 8.14.6
