# syntax=dhi.io/build:2-debian13

image: dhi.io/pkg-gradle
variant: runtime
tags:
  - "8"
  - "8.14"
  - 8.14.8
  - 8-debian13
  - 8.14-debian13
  - 8.14.8-debian13
platforms:
  - linux/amd64
  - linux/arm64
vars:
  GRADLE_COMMIT_SHA: cae48f4cf1f3842a710dd1d62b51cca6c283f996
  GRADLE_MAJOR_MINOR_VERSION: "8.14"
  GRADLE_MAJOR_VERSION: "8"
  GRADLE_VERSION: 8.14.8
  JDK_MAJOR_VERSION: "17"
  JDK_VERSION: 1:17.0.21.1+2-0
contents:
  packages:
    - '!base-files'
  builds:
    - name: gradle
      work-dir: ${source.dir}/gradle
      environment:
        JAVA_HOME: /usr/lib/jvm/temurin-17
        PATH: /usr/lib/jvm/temurin-17/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
      contents:
        repositories:
          - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
        keyring:
          - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
        packages:
          - bash
          - ca-certificates
          - coreutils
          - diffutils
          - eclipse-temurin-17-jdk=1:17.0.21.1+2-0
          - findutils
          - git
          - gnu-which
          - grep
          - libstdc++6
          - libudev-dev
          - sed
          - unzip
        files:
          - url: git+https://github.com/gradle/gradle.git#v8.14.8
            checksum: cae48f4cf1f3842a710dd1d62b51cca6c283f996
            path: ${source.dir}/gradle
            spdx:
              name: gradle
              version: 8.14.8
              packages:
                - name: gradle
                  purl: pkg:dhi/gradle@8.14.8
                  license: Apache-2.0
            uid: 0
            gid: 0
      pipeline:
        - name: install
          privileged: true
          runs: |
            set -eux -o pipefail

            # TODO cd: we need to download the gradle wrapper ahead of time
            ./gradlew :distributions-full:binDistributionZip -Pversion="8.14.8"

            unzip "packaging/distributions-full/build/distributions/gradle-8.14.8-bin.zip"
            mkdir -p "${target.dir}/opt/java/gradle/gradle-8.14.8"
            cd gradle-*

            # shellcheck disable=SC2035
            cp -r * "${target.dir}/opt/java/gradle/gradle-8.14.8"

            mkdir -p "${target.dir}/usr/local/bin"
            find "${target.dir}/opt/java/gradle/gradle-8.14.8/bin" -type f -executable -o -type l | while read -r file; do
              filename=$(basename "$file")
              ln -s "/opt/java/gradle/gradle-8.14.8/bin/$filename" "${target.dir}/usr/local/bin/$filename"
            done
        - name: test
          runs: |
            set -eux -o pipefail

            "${target.dir}/opt/java/gradle/gradle-8.14.8/bin/gradle" --version
      paths:
        - type: file
          path: ${source.dir}/patch/0004-Disable-deprecation-warnings.patch
          uid: 0
          gid: 0
          source: package/gradle/patch/0004-Disable-deprecation-warnings.patch
      outputs:
        - source: ${target.dir}/opt/java/gradle/gradle-8.14.8
          target: /opt/java/gradle/gradle-8.14.8
          uid: 0
          gid: 0
        - source: ${target.dir}/usr/local/bin
          target: /usr/local/bin
          uid: 0
          gid: 0
        - source: /opt/docker/sbom/gradle
          target: /opt/docker/sbom/gradle
          uid: 0
          gid: 0
accounts:
  root: true
  run-as: root
os-release:
  name: Docker Hardened Images (Debian)
  id: debian
  version-id: "13"
  version-codename: trixie
  pretty-name: Docker Hardened Images/Debian GNU/Linux 13 (trixie)
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
environment:
  GRADLE_HOME: /opt/java/gradle/gradle-8.14.8
  GRADLE_VERSION: 8.14.8
