# syntax=dhi.io/build:2-debian13

image: dhi.io/pkg-gradle
variant: runtime
tags:
  - "9"
  - "9.9"
  - 9.9.2
  - 9-debian13
  - 9.9-debian13
  - 9.9.2-debian13
platforms:
  - linux/amd64
  - linux/arm64
vars:
  GRADLE_COMMIT_SHA: 53873705aa44e5f145f335eefd2a254f2adff009
  GRADLE_MAJOR_MINOR_VERSION: "9.9"
  GRADLE_MAJOR_VERSION: "9"
  GRADLE_VERSION: 9.9.2
  JDK_MAJOR_VERSION: "25"
  JDK_VERSION: 1:25.0.5.1+2-0
contents:
  packages:
    - '!base-files'
  builds:
    - name: gradle
      work-dir: ${source.dir}/gradle
      environment:
        JAVA_HOME: /usr/lib/jvm/temurin-25
        PATH: /usr/lib/jvm/temurin-25/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
      contents:
        repositories:
          - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
        keyring:
          - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
        packages:
          - bash
          - ca-certificates
          - coreutils
          - diffutils
          - eclipse-temurin-25-jdk=1:25.0.5.1+2-0
          - findutils
          - git
          - gnu-which
          - grep
          - libstdc++6
          - libudev-dev
          - sed
          - unzip
        files:
          - url: git+https://github.com/gradle/gradle.git#v9.9.2
            checksum: 53873705aa44e5f145f335eefd2a254f2adff009
            path: ${source.dir}/gradle
            spdx:
              name: gradle
              version: 9.9.2
              packages:
                - name: gradle
                  purl: pkg:dhi/gradle@9.9.2
                  license: Apache-2.0
            uid: 0
            gid: 0
      pipeline:
        - name: patch disable deprecation warnings
          uses: git/patch@v1
          with:
            patch: ${source.dir}/patch/0004-Disable-deprecation-warnings.patch
        - name: install
          privileged: true
          runs: |
            set -eux -o pipefail

            # TODO cd: we need to download the gradle wrapper ahead of time
            ./gradlew :distributions-full:binDistributionZip -Pversion="9.9.2"

            unzip "packaging/distributions-full/build/distributions/gradle-9.9.2-bin.zip"
            mkdir -p "${target.dir}/opt/java/gradle/gradle-9.9.2"
            cd gradle-*

            # shellcheck disable=SC2035
            cp -r * "${target.dir}/opt/java/gradle/gradle-9.9.2"

            mkdir -p "${target.dir}/usr/local/bin"
            find "${target.dir}/opt/java/gradle/gradle-9.9.2/bin" -type f -executable -o -type l | while read -r file; do
              filename=$(basename "$file")
              ln -s "/opt/java/gradle/gradle-9.9.2/bin/$filename" "${target.dir}/usr/local/bin/$filename"
            done
        - name: test
          runs: |
            set -eux -o pipefail

            "${target.dir}/opt/java/gradle/gradle-9.9.2/bin/gradle" --version
      paths:
        - type: file
          path: ${source.dir}/patch/0004-Disable-deprecation-warnings.patch
          uid: 0
          gid: 0
          source: package/gradle/patch/0004-Disable-deprecation-warnings.patch
      outputs:
        - source: ${target.dir}/opt/java/gradle/gradle-9.9.2
          target: /opt/java/gradle/gradle-9.9.2
          uid: 0
          gid: 0
        - source: ${target.dir}/usr/local/bin
          target: /usr/local/bin
          uid: 0
          gid: 0
        - source: /opt/docker/sbom/gradle
          target: /opt/docker/sbom/gradle
          uid: 0
          gid: 0
accounts:
  root: true
  run-as: root
os-release:
  name: Docker Hardened Images (Debian)
  id: debian
  version-id: "13"
  version-codename: trixie
  pretty-name: Docker Hardened Images/Debian GNU/Linux 13 (trixie)
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
environment:
  GRADLE_HOME: /opt/java/gradle/gradle-9.9.2
  GRADLE_VERSION: 9.9.2
