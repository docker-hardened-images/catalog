# syntax=dhi.io/build:2-debian13

image: dhi.io/pkg-gradle
variant: runtime
tags:
  - "9"
  - "9.8"
  - 9.8.2
  - 9-debian13
  - 9.8-debian13
  - 9.8.2-debian13
platforms:
  - linux/amd64
  - linux/arm64
vars:
  GRADLE_COMMIT_SHA: 8de7bcf76e785507ad92f0741ab9235a430c95e6
  GRADLE_MAJOR_MINOR_VERSION: "9.8"
  GRADLE_MAJOR_VERSION: "9"
  GRADLE_VERSION: 9.8.2
  JAVA_DIGEST: sha256:e9cb69a4921d9557e939e858119ba55a13a9db8aca063f60179e317263e79c37
  JAVA_VERSION: 25.0.5.8
contents:
  packages:
    - '!base-files'
  builds:
    - name: gradle
      uses: dhi.io/eclipse-temurin:25.0.5.8-jdk-debian13-dev@sha256:e9cb69a4921d9557e939e858119ba55a13a9db8aca063f60179e317263e79c37
      work-dir: ${source.dir}/gradle
      environment:
        PATH: /usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
      contents:
        packages:
          - git
          - unzip
          - gnu-which
          - libudev-dev
          - sed
          - libstdc++6
        files:
          - url: git+https://github.com/gradle/gradle.git#v9.8.2
            checksum: 8de7bcf76e785507ad92f0741ab9235a430c95e6
            path: ${source.dir}/gradle
            spdx:
              name: gradle
              version: 9.8.2
              packages:
                - name: gradle
                  purl: pkg:dhi/gradle@9.8.2
                  license: Apache-2.0
            uid: 0
            gid: 0
      pipeline:
        - name: patch disable deprecation warnings
          uses: git/patch@v1
          with:
            patch: ${source.dir}/patch/0004-Disable-deprecation-warnings.patch
        - name: install
          privileged: true
          runs: |
            set -eux -o pipefail

            # TODO cd: we need to download the gradle wrapper ahead of time
            ./gradlew :distributions-full:binDistributionZip -Pversion="9.8.2"

            unzip "packaging/distributions-full/build/distributions/gradle-9.8.2-bin.zip"
            mkdir -p "${target.dir}/opt/java/gradle/gradle-9.8.2"
            cd gradle-*

            # shellcheck disable=SC2035
            cp -r * "${target.dir}/opt/java/gradle/gradle-9.8.2"

            mkdir -p "${target.dir}/usr/local/bin"
            find "${target.dir}/opt/java/gradle/gradle-9.8.2/bin" -type f -executable -o -type l | while read -r file; do
              filename=$(basename "$file")
              ln -s "/opt/java/gradle/gradle-9.8.2/bin/$filename" "${target.dir}/usr/local/bin/$filename"
            done
        - name: test
          runs: |
            set -eux -o pipefail

            "${target.dir}/opt/java/gradle/gradle-9.8.2/bin/gradle" --version
      paths:
        - type: file
          path: ${source.dir}/patch/0004-Disable-deprecation-warnings.patch
          uid: 0
          gid: 0
          source: package/gradle/patch/0004-Disable-deprecation-warnings.patch
      outputs:
        - source: ${target.dir}/opt/java/gradle/gradle-9.8.2
          target: /opt/java/gradle/gradle-9.8.2
          uid: 0
          gid: 0
        - source: ${target.dir}/usr/local/bin
          target: /usr/local/bin
          uid: 0
          gid: 0
        - source: /opt/docker/sbom/gradle
          target: /opt/docker/sbom/gradle
          uid: 0
          gid: 0
accounts:
  root: true
  run-as: root
os-release:
  name: Docker Hardened Images (Debian)
  id: debian
  version-id: "13"
  version-codename: trixie
  pretty-name: Docker Hardened Images/Debian GNU/Linux 13 (trixie)
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
environment:
  GRADLE_HOME: /opt/java/gradle/gradle-9.8.2
  GRADLE_VERSION: 9.8.2
