# syntax=dhi.io/build:2-debian13

image: dhi.io/pkg-gosu
variant: runtime
tags:
  - "1"
  - "1.19"
  - 1-debian13
  - 1.19-debian13
platforms:
  - linux/amd64
  - linux/arm64
vars:
  COMMIT_SHA: 6456aaa0f3c854d199d0f037f068eb97515b7513
  GOLANG_DIGEST: sha256:96b915e01a46f75cd7cc16b29b228ae2455f3721309a0f9a6648b8257c2329d3
  GOLANG_VERSION: 1.27.1
  GOSU_MAJOR_MINOR_VERSION: "1.19"
  GOSU_MAJOR_VERSION: "1"
  VERSION: "1.19"
contents:
  packages:
    - '!base-files'
  builds:
    - name: gosu
      privileged: true
      environment:
        GOLANG_VERSION: 1.27.1
        GOPATH: /go
        GOTOOLCHAIN: local
        PATH: /go/bin:/usr/lib/go/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
      caches:
        - path: /go/pkg/mod
      contents:
        packages:
          - bash
          - ca-certificates
          - coreutils
          - dash
          - findutils
          - git
          - grep
        files:
          - url: git+https://github.com/tianon/gosu.git#1.19
            path: /go/src/github.com/tianon/gosu
            spdx:
              name: gosu
              version: "1.19"
              packages:
                - name: gosu
                  purl: pkg:golang/github.com/tianon/gosu@1.19
                  license: Apache-2.0
            uid: 0
            gid: 0
        artifacts:
          - name: dhi.io/golang:1.27.1-debian13@sha256:96b915e01a46f75cd7cc16b29b228ae2455f3721309a0f9a6648b8257c2329d3
            includes:
              - usr/lib/go/**
            uid: 0
            gid: 0
      pipeline:
        - name: verify checkout
          uses: git/checkout@v1
          work-dir: /go/src/github.com/tianon/gosu
          with:
            expected-commit: 6456aaa0f3c854d199d0f037f068eb97515b7513
        - name: update go dependencies
          uses: go/bump@v2
          work-dir: /go/src/github.com/tianon/gosu
          with:
            deps:
              - golang.org/x/sys@v0.45.0
            download: true
        - name: build gosu
          work-dir: /go/src/github.com/tianon/gosu
          runs: |
            set -eux -o pipefail

            CGO_ENABLED=0 go build \
              -o '${target.dir}/usr/local/sbin/gosu' .
      outputs:
        - source: ${target.dir}/usr/local/sbin/gosu
          target: /usr/local/sbin/gosu
          uid: 0
          gid: 0
        - source: /opt/docker/sbom/gosu
          target: /opt/docker/sbom/gosu
          uid: 0
          gid: 0
accounts:
  root: true
  run-as: root
os-release:
  name: Docker Hardened Images (Debian)
  id: debian
  version-id: "13"
  version-codename: trixie
  pretty-name: Docker Hardened Images/Debian GNU/Linux 13 (trixie)
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
