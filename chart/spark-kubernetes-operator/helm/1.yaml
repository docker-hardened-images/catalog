name: Apache Spark Kubernetes Operator Helm chart 1.x
image: dhi.io/spark-kubernetes-operator-chart
variant: helm
tags:
  - 1.8.0
platforms:
  - linux/amd64
vars:
  CHART_COMMIT_SHA: d8b19438bd96c6c2f52ee58425ec192b6cc825fc
  CHART_HELM_NAME: spark-kubernetes-operator-chart
  DHI_NAMESPACE: dhi
  DHI_PREFIX: ""
  DHI_REGISTRY: dhi.io
  DHI_SKIP_CONTEXT_COPY: "true"
  HELM_VERSION: 4.1.4-2
  KUBECTL_DIGEST: sha256:69de8972a066ae7c9bfb4188c332c777cbeef70341bfcaf2501ba220709f4368
  KUBECTL_REFERENCE: dhi/kubectl:1.34.11-debian13-compat@sha256:69de8972a066ae7c9bfb4188c332c777cbeef70341bfcaf2501ba220709f4368
  KUBECTL_TAG: 1.34.11-debian13-compat
  SEMVER_MAJOR_MINOR_VERSION: "1.8"
  SEMVER_MAJOR_VERSION: "1"
  SEMVER_VERSION: 1.8.0
  SPARK_KUBERNETES_OPERATOR_REFERENCE: dhi/spark-kubernetes-operator:1.0.0-debian13@sha256:ece5d9658407266ab422cc673aa26c8a1ed94c0c868e75cad75456f3f1b76ae9
  SPARK_VERSION: 4.2.0
  VERSION: 1.8.0
  VERSION_MATCH: 1.0.0
contents:
  repositories:
    - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
  keyring:
    - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
  builds:
    - name: spark-kubernetes-operator-chart
      work-dir: ${source.dir}/helm-charts/build-tools/helm/spark-kubernetes-operator
      contents:
        packages:
          - bash
          - ca-certificates
          - coreutils
          - helm=4.1.4-2
          - sed
        files:
          - url: git+https://github.com/apache/spark-kubernetes-operator.git#1.0.0
            checksum: d8b19438bd96c6c2f52ee58425ec192b6cc825fc
            path: ${source.dir}/helm-charts
            uid: 0
            gid: 0
      pipeline:
        - name: prepare chart
          uses: helm/rudder@v1
          with:
            chart:
              appRef: spark-kubernetes-operator
              description: Docker Hardened Images Helm chart for Apache Spark Kubernetes Operator
              images:
                - name: spark-kubernetes-operator
                  ref: dhi/spark-kubernetes-operator:1.0.0-debian13@sha256:ece5d9658407266ab422cc673aa26c8a1ed94c0c868e75cad75456f3f1b76ae9
                - name: kubectl
                  ref: dhi/kubectl:1.34.11-debian13-compat@sha256:69de8972a066ae7c9bfb4188c332c777cbeef70341bfcaf2501ba220709f4368
              name: spark-kubernetes-operator-chart
              notes: ${source.dir}/config/NOTES.txt
              sourceUrl: https://github.com/apache/spark-kubernetes-operator
            cmd: prepare
            registry: dhi.io
        - name: point test-rbac hook at the DHI kubectl image
          runs: |
            set -eux -o pipefail

            sed -i 's|bitnamisecure/kubectl:latest|dhi.io/kubectl:1.34.11-debian13-compat@sha256:69de8972a066ae7c9bfb4188c332c777cbeef70341bfcaf2501ba220709f4368|' templates/tests/test-rbac.yaml
        - name: relocate chart
          uses: helm/rudder@v1
          with:
            cmd: patch
            patches:
              from: ${source.dir}/config
            registry: dhi.io
        - name: lint
          uses: helm/cmd@v1
          with:
            chart: .
            cmd: lint .
        - name: package
          uses: helm/package@v1
          with:
            chart: .
      paths:
        - type: directory
          path: ${source.dir}/config
          uid: 0
          gid: 0
          mode: "0644"
          source: chart/spark-kubernetes-operator/config
