image:
  registry: ${spicedb-operator.registry}
  repository: ${spicedb-operator.repository}
  tag: ${spicedb-operator.tag}@${spicedb-operator.digest}

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532

securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
  readOnlyRootFilesystem: true
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532

spicedb:
  # Base SpiceDB image for the operator update-graph `imageName` field.
  # Must stay registry/repository only: the operator appends graph version tags
  # (for example :v1.52.0). Tag and digest below are catalog metadata from rudder
  # prepare and are not rendered into imageName.
  image:
    registry: ${spicedb.registry}
    repository: ${spicedb.repository}
    tag: ${spicedb.tag}
    digest: ${spicedb.digest}
