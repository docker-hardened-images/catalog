# syntax=dhi.io/build:2-helm3

name: SpiceDB Operator Helm chart 1.x
image: dhi.io/spicedb-operator-chart
variant: helm
tags:
  - 1.0.0
platforms:
  - linux/amd64
vars:
  CHART_COMMIT_SHA: af5fd0ef6c4e4565d97387b981d4d8e32e461a7d
  CHART_HELM_NAME: spicedb-operator-chart
  DHI_NAMESPACE: dhi
  DHI_PREFIX: ""
  DHI_REGISTRY: dhi.io
  DHI_SKIP_CONTEXT_COPY: "true"
  HELM_VERSION: 4.1.4-2
  SEMVER_MAJOR_MINOR_VERSION: "1.0"
  SEMVER_MAJOR_VERSION: "1"
  SEMVER_VERSION: 1.0.0
  SPICEDB_OPERATOR_REFERENCE: dhi/spicedb-operator:1.26.0-debian13@sha256:c329054279925a9a9e027ffb1781c23ca9f7a231fcebc4385882cf8e95584627
  SPICEDB_OPERATOR_UPSTREAM_COMMIT_SHA: 98cf06c6d551baacef72285ebb4e70cf27f91188
  SPICEDB_OPERATOR_VERSION: 1.26.0
  SPICEDB_REFERENCE: dhi/spicedb:1.56.0-debian13@sha256:655ef70746bc5571699e81a7255fb47bfccf4c717bdad70d6159620ac760ecdc
  VERSION: 1.0.0
contents:
  repositories:
    - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
  keyring:
    - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
  builds:
    - name: spicedb-operator-chart
      work-dir: ${source.dir}/helm-charts/spicedb-operator
      contents:
        packages:
          - bash
          - ca-certificates
          - coreutils
          - helm=4.1.4-2
        files:
          - url: git+https://github.com/docker-hardened-images/helm-charts.git#spicedb-operator/1.0.0
            checksum: af5fd0ef6c4e4565d97387b981d4d8e32e461a7d
            path: ${source.dir}/helm-charts
            uid: 0
            gid: 0
          - url: git+https://github.com/authzed/spicedb-operator.git#v1.26.0
            checksum: 98cf06c6d551baacef72285ebb4e70cf27f91188
            path: ${source.dir}/spicedb-operator-upstream
            uid: 0
            gid: 0
      pipeline:
        - name: prepare update graph
          runs: |
            set -eux -o pipefail

            mkdir -p files
            src="${source.dir}/spicedb-operator-upstream/config/update-graph.yaml"
            while IFS= read -r line || [ -n "$line" ]; do
              case "$line" in
                imageName:*) continue ;;
              esac
              printf '%s\n' "$line"
            done < "$src" > files/update-graph.yaml
        - name: prepare chart
          uses: helm/rudder@v1
          with:
            chart:
              appRef: spicedb-operator
              description: Docker Hardened Images Helm chart for SpiceDB Operator
              images:
                - name: spicedb-operator
                  ref: dhi/spicedb-operator:1.26.0-debian13@sha256:c329054279925a9a9e027ffb1781c23ca9f7a231fcebc4385882cf8e95584627
                - name: spicedb
                  ref: dhi/spicedb:1.56.0-debian13@sha256:655ef70746bc5571699e81a7255fb47bfccf4c717bdad70d6159620ac760ecdc
              name: spicedb-operator-chart
              notes: ${source.dir}/config/NOTES.txt
              sourceUrl: https://github.com/docker-hardened-images/helm-charts
              updateDependencies: true
            cmd: prepare
            registry: dhi.io
        - name: relocate chart
          uses: helm/rudder@v1
          with:
            cmd: patch
            patches:
              from: ${source.dir}/config
            registry: dhi.io
        - name: lint
          uses: helm/cmd@v1
          with:
            chart: .
            cmd: lint .
        - name: package
          uses: helm/package@v1
          with:
            chart: .
      paths:
        - type: directory
          path: ${source.dir}/config
          uid: 0
          gid: 0
          mode: "0644"
          source: chart/spicedb-operator/config
