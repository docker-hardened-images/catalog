                - name: k8s-sidecar
                  ref: dhi/k8s-sidecar:2.14.3-debian13@sha256:1831e170dac8b4a724734ba2db9772eb28cc7578f345210d355b5863b1502527
                - name: memcached
                  ref: dhi/memcached:1.6.45-debian13@sha256:7132f2f72e216bdfa34b0187f7923ef7622945c46438e0a4ffba2be274686b8b
