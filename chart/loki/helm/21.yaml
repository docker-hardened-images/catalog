              name: loki-chart
              notes: ${source.dir}/config/NOTES.txt
              sourceUrl: https://github.com/grafana/loki
            cmd: prepare
            registry: dhi.io
        - name: relocate chart
          uses: helm/rudder@v1
          with:
            cmd: patch
            patches:
              from: ${source.dir}/config
            registry: dhi.io
        - name: set envoy gateway command
          work-dir: ${source.dir}/helm-charts/charts/loki
          runs: |
            set -eux -o pipefail

            sed -i '/^          {{- if \$isEnvoy }}$/{n;s/^          args:$/          command:\n            - envoy\n          args:/}' templates/gateway/deployment.yaml
            grep -q '^            - envoy$' templates/gateway/deployment.yaml
        - name: allow relocated rollout-operator subchart in values schema
          work-dir: ${source.dir}/helm-charts/charts/loki
          runs: |
            set -eux -o pipefail

            jq -e '.properties.rollout_operator' values.schema.json > /dev/null
            jq '.properties["grafana-rollout-operator-chart"] = .properties.rollout_operator' values.schema.json > values.schema.json.tmp
            mv values.schema.json.tmp values.schema.json
            jq -e '.properties["grafana-rollout-operator-chart"]' values.schema.json > /dev/null
        - name: helm login
          uses: helm/login@v1
          with:
            registry: dhi.io
        - name: update dependencies
          uses: helm/cmd@v1
          privileged: true
          with:
            chart: .
            cmd: dependency update
        - name: lint
          uses: helm/cmd@v1
          with:
            chart: .
            cmd: lint . --set loki.useTestSchema=true
        - name: package
          uses: helm/package@v1
          with:
            chart: .
      paths:
