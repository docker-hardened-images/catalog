  builds:
    - name: loki
      work-dir: ${source.dir}/helm-charts/charts/loki
      contents:
        packages:
          - bash
          - ca-certificates
          - coreutils
          - helm=4.1.4-2
          - grep
          - jq
          - sed
        files:
          - url: git+https://github.com/grafana-community/helm-charts.git#loki-21.6.3
            checksum: 5572292b80fd133052d7f7ffa4ecc2ae99df21c1
            path: ${source.dir}/helm-charts
            uid: 0
            gid: 0
      pipeline:
        - name: prepare chart
          uses: helm/rudder@v1
          with:
            chart:
              appRef: loki
              debug: true
              dependencies:
                - alias: rollout_operator
                  condition: rollout_operator.enabled
                  name: rollout-operator
                  ref: dhi/grafana-rollout-operator-chart:0.56.0@sha256:f0f5664e44d14156768bcde7eee6d1680404c9014c97ec60a12f88d34c59ca65
              description: Docker Hardened Images Helm chart for Grafana Loki
