        - name: set envoy gateway command
          work-dir: ${source.dir}/helm-charts/charts/loki
          runs: |
            set -eux -o pipefail

            sed -i '/^          {{- if \$isEnvoy }}$/{n;s/^          args:$/          command:\n            - envoy\n          args:/}' templates/gateway/deployment.yaml
            # Fail the build if the upstream template changed and the sed above no longer matches
            grep -q '^            - envoy$' templates/gateway/deployment.yaml
        - name: helm login
