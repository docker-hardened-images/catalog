              description: Docker Hardened Images Helm chart for Valkey Resources
              name: valkey-resources-chart
              notes: ${source.dir}/config/NOTES.txt
              sourceUrl: https://github.com/valkey-io/valkey-helm/tree/main/valkey-resources
            cmd: prepare
            registry: dhi.io
        - name: lint
          uses: helm/cmd@v1
          with:
            chart: .
            cmd: lint .
        - name: package
          uses: helm/package@v1
          with:
            chart: .
      paths:
        - type: directory
          path: ${source.dir}/config
          uid: 0
          gid: 0
          mode: "0644"
          source: chart/valkey-resources/config
