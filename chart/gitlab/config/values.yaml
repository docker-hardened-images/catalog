global:
  edition: ce
  hosts:
    domain: example.invalid
  gatewayApi:
    enabled: false
    installEnvoy: false
    configureCertmanager: false
  ingress:
    enabled: false
    configureCertmanager: false
    tls:
      enabled: true
      secretName: gitlab-tls
  appConfig:
    artifacts:
      connection:
        secret: gitlab-object-storage
        key: connection
    lfs:
      connection:
        secret: gitlab-object-storage
        key: connection
    uploads:
      connection:
        secret: gitlab-object-storage
        key: connection
    packages:
      connection:
        secret: gitlab-object-storage
        key: connection
  psql:
    host: postgresql.example.invalid
    port: 5432
    username: gitlab
    database: gitlabhq_production
    password:
      useSecret: true
      secret: gitlab-postgresql-password
      key: password
  redis:
    host: redis.example.invalid
    port: 6379
    auth:
      enabled: true
      secret: gitlab-redis-password
      key: password
  gitaly:
    enabled: false
    external:
      - name: default
        hostname: gitaly.example.invalid
        port: 8075
    authToken:
      secret: gitlab-gitaly-token
      key: token
  kas:
    enabled: false
  pages:
    enabled: false
  registry:
    enabled: false
  railsSecrets:
    secret: gitlab-rails-secret
  shell:
    authToken:
      secret: gitlab-shell-secret
      key: secret
  workhorse:
    secret: gitlab-workhorse-secret
    key: shared_secret
  initialRootPassword:
    secret: gitlab-initial-root-password
    key: password
  gitlabBase:
    image:
      repository: ${bash.registry}/${bash.repository}
      tag: ${bash.tag}@${bash.digest}
  certificates:
    image:
      repository: ${bash.registry}/${bash.repository}
      tag: ${bash.tag}@${bash.digest}
    customCAs: []

installCertmanager: false

prometheus:
  install: false

gitlab-runner:
  install: false

nginx-ingress:
  enabled: false

nginx-ingress-geo:
  enabled: false

traefik:
  install: false

haproxy:
  install: false

gitlab-zoekt:
  install: false

openbao:
  install: false

ai-gateway:
  install: false

registry:
  enabled: false

shared-secrets:
  enabled: false

upgradeCheck:
  enabled: false

gitlab:
  webservice:
    image:
      repository: ${gitlab-webservice.registry}/${gitlab-webservice.repository}
      tag: ${gitlab-webservice.tag}@${gitlab-webservice.digest}
    workhorse:
      image: ${gitlab-workhorse.registry}/${gitlab-workhorse.repository}
      tag: ${gitlab-workhorse.tag}@${gitlab-workhorse.digest}
      keywatcher: false
    extraVolumes: |
      - name: dhi-gitlab-cng-scripts
        configMap:
          name: {{ $.Release.Name }}-dhi-gitlab-cng-scripts
          defaultMode: 0555
          items:
            - key: wait-for-deps
              path: wait-for-deps
            - key: rails-dependencies
              path: rails-dependencies
            - key: db-migrate
              path: db-migrate
            - key: custom-instance-setup
              path: custom-instance-setup
            - key: bypass_schema_version_check.rb
              path: lib/bypass_schema_version_check.rb
            - key: clickhouse.rb
              path: lib/checks/clickhouse.rb
            - key: postgresql.rb
              path: lib/checks/postgresql.rb
            - key: redis.rb
              path: lib/checks/redis.rb
            - key: topology_service.rb
              path: lib/checks/topology_service.rb
    extraVolumeMounts: |
      - name: dhi-gitlab-cng-scripts
        mountPath: /opt/gitlab/cng-scripts
        readOnly: true
  sidekiq:
    image:
      repository: ${gitlab-webservice.registry}/${gitlab-webservice.repository}
      tag: ${gitlab-webservice.tag}@${gitlab-webservice.digest}
    extraVolumes: |
      - name: dhi-gitlab-cng-scripts
        configMap:
          name: {{ $.Release.Name }}-dhi-gitlab-cng-scripts
          defaultMode: 0555
          items:
            - key: wait-for-deps
              path: wait-for-deps
            - key: rails-dependencies
              path: rails-dependencies
            - key: db-migrate
              path: db-migrate
            - key: custom-instance-setup
              path: custom-instance-setup
            - key: bypass_schema_version_check.rb
              path: lib/bypass_schema_version_check.rb
            - key: clickhouse.rb
              path: lib/checks/clickhouse.rb
            - key: postgresql.rb
              path: lib/checks/postgresql.rb
            - key: redis.rb
              path: lib/checks/redis.rb
            - key: topology_service.rb
              path: lib/checks/topology_service.rb
    extraVolumeMounts: |
      - name: dhi-gitlab-cng-scripts
        mountPath: /opt/gitlab/cng-scripts
        readOnly: true
  migrations:
    image:
      repository: ${gitlab-webservice.registry}/${gitlab-webservice.repository}
      tag: ${gitlab-webservice.tag}@${gitlab-webservice.digest}
    scriptTpl: |
      set -e
      /opt/gitlab/cng-scripts/wait-for-deps
      /opt/gitlab/cng-scripts/db-migrate
    extraVolumes: |
      - name: dhi-gitlab-cng-scripts
        configMap:
          name: {{ $.Release.Name }}-dhi-gitlab-cng-scripts
          defaultMode: 0555
          items:
            - key: wait-for-deps
              path: wait-for-deps
            - key: rails-dependencies
              path: rails-dependencies
            - key: db-migrate
              path: db-migrate
            - key: custom-instance-setup
              path: custom-instance-setup
            - key: bypass_schema_version_check.rb
              path: lib/bypass_schema_version_check.rb
            - key: clickhouse.rb
              path: lib/checks/clickhouse.rb
            - key: postgresql.rb
              path: lib/checks/postgresql.rb
            - key: redis.rb
              path: lib/checks/redis.rb
            - key: topology_service.rb
              path: lib/checks/topology_service.rb
    extraVolumeMounts: |
      - name: dhi-gitlab-cng-scripts
        mountPath: /opt/gitlab/cng-scripts
        readOnly: true
  toolbox:
    enabled: false
  gitlab-shell:
    image:
      repository: ${gitlab-shell.registry}/${gitlab-shell.repository}
      tag: ${gitlab-shell.tag}@${gitlab-shell.digest}
    extraEnv:
      GITLAB_SHELL_SECRET_FILE: /etc/gitlab-secrets/shell/.gitlab_shell_secret
  gitlab-exporter:
    image:
      repository: ${gitlab-exporter.registry}/${gitlab-exporter.repository}
      tag: ${gitlab-exporter.tag}@${gitlab-exporter.digest}
