# syntax=dhi.io/build:2-helm3

name: Tailscale Operator Helm chart 1.x
image: dhi.io/tailscale-operator-chart
variant: helm
tags:
  - 1.106.1
platforms:
  - linux/amd64
vars:
  CHART_COMMIT_SHA: ca97d565daae99bf53b1f45f28c36ee081a14f04
  CHART_HELM_NAME: tailscale-operator-chart
  DHI_NAMESPACE: dhi
  DHI_PREFIX: ""
  DHI_REGISTRY: dhi.io
  DHI_SKIP_CONTEXT_COPY: "true"
  HELM_VERSION: 4.1.4-2
  SEMVER_MAJOR_MINOR_VERSION: "1.106"
  SEMVER_MAJOR_VERSION: "1"
  SEMVER_VERSION: 1.106.1
  TAILSCALE_OPERATOR_REFERENCE: dhi/tailscale-operator:1.106.1-debian13@sha256:137c090cb5e36122b61e684576bf476b2c318d790ab9c5a8882430be2ea900d6
  TAILSCALE_REFERENCE: dhi/tailscale:1.106.1-debian13@sha256:64e18364e48e0fd8f54265945ae5968a048c4cfeee76f973d4d3500d72b2bbfa
  VERSION: 1.106.1
contents:
  repositories:
    - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
  keyring:
    - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
  builds:
    - name: tailscale-operator-chart
      work-dir: ${source.dir}/tailscale/cmd/k8s-operator/deploy/chart
      contents:
        packages:
          - bash
          - ca-certificates
          - coreutils
          - helm=4.1.4-2
        files:
          - url: git+https://github.com/tailscale/tailscale.git#v1.106.1
            checksum: ca97d565daae99bf53b1f45f28c36ee081a14f04
            path: ${source.dir}/tailscale
            uid: 0
            gid: 0
      pipeline:
        - name: prepare chart
          uses: helm/rudder@v1
          with:
            chart:
              appRef: tailscale-operator
              chartVersion: 1.106.1
              description: Docker Hardened Images Helm chart for Tailscale Operator
              images:
                - name: tailscale-operator
                  ref: dhi/tailscale-operator:1.106.1-debian13@sha256:137c090cb5e36122b61e684576bf476b2c318d790ab9c5a8882430be2ea900d6
                - name: tailscale
                  ref: dhi/tailscale:1.106.1-debian13@sha256:64e18364e48e0fd8f54265945ae5968a048c4cfeee76f973d4d3500d72b2bbfa
              name: tailscale-operator-chart
              notes: ${source.dir}/config/NOTES.txt
              sourceUrl: https://github.com/tailscale/tailscale
            cmd: prepare
            registry: dhi.io
        - name: relocate chart
          uses: helm/rudder@v1
          with:
            cmd: patch
            patches:
              from: ${source.dir}/config
            registry: dhi.io
        - name: add CRDs to Helm templates
          runs: |
            set -eux -o pipefail

            count=0
            for f in ../crds/tailscale.com_*.yaml; do
              [ -e "${f}" ] || continue
              count=$((count + 1))
              name=$(basename "${f}")
              {
                printf '%s\n' '{{ if .Values.installCRDs -}}'
                cat "${f}"
                printf '%s\n' '{{- end -}}'
              } > "templates/${name}"
            done
            if [ "${count}" -eq 0 ]; then
              echo "no CRDs found under ../crds" >&2
              exit 1
            fi
        - name: lint
          uses: helm/cmd@v1
          with:
            chart: .
            cmd: lint .
        - name: package
          uses: helm/package@v1
          with:
            chart: .
      paths:
        - type: directory
          path: ${source.dir}/config
          uid: 0
          gid: 0
          mode: "0644"
          source: chart/tailscale-operator/config
