          - helm=4.1.4-2
        files:
          - url: git+https://github.com/grafana/alloy.git#helm-chart/1.11.1
            checksum: 233907cff225ce253f812bdfc14138dac1fa0cd2
            path: ${source.dir}/helm-charts
            uid: 0
            gid: 0
      pipeline:
        - name: prepare chart
          uses: helm/rudder@v1
          work-dir: ${source.dir}/helm-charts/operations/helm/charts/alloy
          with:
