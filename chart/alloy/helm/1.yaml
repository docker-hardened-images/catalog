  CHART_COMMIT_SHA: 16e6de80b7472c9425361632dc4f0e2e8439e50e
  CHART_HELM_NAME: alloy-chart
  DHI_NAMESPACE: dhi
  DHI_PREFIX: ""
  DHI_REGISTRY: dhi.io
  DHI_SKIP_CONTEXT_COPY: "true"
  HELM_VERSION: 4.1.4-2
  PROMETHEUS_CONFIG_RELOADER_REFERENCE: dhi/prometheus-config-reloader:0.93.1-debian13@sha256:07dd01c91ec48d3e65cc1b3557dd24425dfdf17ccc0724904e6349a0e4a665b2
  SEMVER_MAJOR_MINOR_VERSION: "1.12"
  SEMVER_MAJOR_VERSION: "1"
  SEMVER_VERSION: 1.12.0
  VERSION: 1.12.0
contents:
  repositories:
    - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
  keyring:
    - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
  builds:
    - name: alloy
      contents:
        packages:
          - bash
          - build-essential
          - coreutils
          - grep
          - libc-bin
          - sed
          - helm=4.1.4-2
        files:
          - url: git+https://github.com/grafana/alloy.git#helm-chart/1.12.0
            checksum: 16e6de80b7472c9425361632dc4f0e2e8439e50e
            path: ${source.dir}/helm-charts
            uid: 0
            gid: 0
      pipeline:
        - name: prepare chart
          uses: helm/rudder@v1
          work-dir: ${source.dir}/helm-charts/operations/helm/charts/alloy
          with:
            chart:
              appRef: alloy
              dependencies:
                - keep: true
                  name: crds
              description: Docker Hardened Images Helm chart for Grafana Alloy
              images:
                - name: alloy
                  ref: dhi/alloy:1.19.0-debian13@sha256:3c73b1e5393556abde3fcd6be8f6b30722223df312684543feb48291256074bc
                - name: prometheus-config-reloader
