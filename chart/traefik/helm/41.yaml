# syntax=dhi.io/build:2-helm3

name: Traefik Helm chart 41.x
image: dhi.io/traefik-chart
variant: helm
tags:
  - 41.1.0
platforms:
  - linux/amd64
vars:
  APPVERSION: 3.7.9
  CHART_HELM_NAME: traefik-chart
  COMMIT_SHA: 7dc6622cde94e1b6a564ad9383bc33be03a3a260
  DHI_NAMESPACE: dhi
  DHI_PREFIX: ""
  DHI_REGISTRY: dhi.io
  DHI_SKIP_CONTEXT_COPY: "true"
  HELM_VERSION: 4.1.4-2
  SEMVER_MAJOR_MINOR_VERSION: "41.1"
  SEMVER_MAJOR_VERSION: "41"
  SEMVER_VERSION: 41.1.0
  TRAEFIK_REFERENCE: dhi/traefik:3.7.6-debian13@sha256:d690cbfc805f54c7dbf438e2b56ce7d66d59fcc1006f9cb520700a58eee53e07
  VERSION: 41.1.0
contents:
  repositories:
    - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
  keyring:
    - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
  builds:
    - name: traefik
      contents:
        packages:
          - bash
          - ca-certificates
          - coreutils
          - yq-go
          - helm=4.1.4-2
        files:
          - url: git+https://github.com/traefik/traefik-helm-chart.git#v41.1.0
            checksum: 7dc6622cde94e1b6a564ad9383bc33be03a3a260
            path: ${source.dir}/helm-charts
            uid: 0
            gid: 0
      pipeline:
        - name: prepare chart
          uses: helm/rudder@v1
          work-dir: ${source.dir}/helm-charts/traefik
          with:
            chart:
              appRef: traefik
              description: Docker Hardened Images Helm chart for Traefik
              images:
                - name: traefik
                  ref: dhi/traefik:3.7.6-debian13@sha256:d690cbfc805f54c7dbf438e2b56ce7d66d59fcc1006f9cb520700a58eee53e07
              name: traefik-chart
              notes: ${source.dir}/config/NOTES.txt
              sourceUrl: https://github.com/traefik/traefik-helm-chart
            cmd: prepare
            registry: dhi.io
        - name: restore upstream chart annotations
          uses: yq/patch@v1
          work-dir: ${source.dir}/helm-charts/traefik
          with:
            file: Chart.yaml
            patches:
              - eval(.annotations = (load("${source.dir}/config/chart-annotations.yaml") * (.annotations // {})))
        - name: relocate chart
          uses: helm/rudder@v1
          work-dir: ${source.dir}/helm-charts/traefik
          with:
            cmd: patch
            patches:
              from: ${source.dir}/config
            registry: dhi.io
        - name: update dependencies
          uses: helm/cmd@v1
          with:
            chart: ${source.dir}/helm-charts/traefik
            cmd: dependency update
        - name: lint
          uses: helm/cmd@v1
          work-dir: ${source.dir}/helm-charts
          with:
            chart: traefik
            cmd: lint .
        - name: package
          uses: helm/package@v1
          with:
            chart: ${source.dir}/helm-charts/traefik
      paths:
        - type: directory
          path: ${source.dir}/config
          uid: 0
          gid: 0
          mode: "0644"
          source: chart/traefik/config
