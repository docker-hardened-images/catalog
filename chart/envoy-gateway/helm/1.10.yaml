# syntax=dhi.io/build:2-helm3

name: Envoy Gateway Helm chart 1.10.x
image: dhi.io/envoy-gateway-chart
variant: helm
tags:
  - 1.10.0
platforms:
  - linux/amd64
vars:
  CHART_COMMIT_SHA: 02e9f89d1c1dc16b723de48fa3289dfa413a6e01
  CHART_HELM_NAME: envoy-gateway-chart
  DHI_NAMESPACE: dhi
  DHI_PREFIX: ""
  DHI_REGISTRY: dhi.io
  DHI_SKIP_CONTEXT_COPY: "true"
  ENVOY_GATEWAY_REFERENCE: dhi/envoy-gateway:1.10.0-debian13@sha256:0e71d5c5dd4eff4c5133b48aa4818b508a16ada3b2b28dc05f14597ad04af92e
  ENVOY_RATELIMIT_REFERENCE: dhi/envoy-ratelimit:0060f4cc34b16e5f7d7669b0885e29b293dd9d85-debian13@sha256:fe607b17210ac37aa1b32a886f5d3abf79d574e299fb757b555535b445c64cdd
  ENVOY_REFERENCE: dhi/envoy:1.40.2-debian13@sha256:64d2afa155573fb93e4076b0e64dbde568fe0618e697d1fe8a780f0b0b2fb025
  HELM_VERSION: 4.1.4-2
  SEMVER_MAJOR_MINOR_VERSION: "1.10"
  SEMVER_MAJOR_VERSION: "1"
  SEMVER_VERSION: 1.10.0
  VERSION: 1.10.0
contents:
  repositories:
    - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
  keyring:
    - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
  builds:
    - name: envoy-gateway-chart
      work-dir: ${source.dir}/helm-charts/charts/gateway-helm
      contents:
        packages:
          - bash
          - ca-certificates
          - coreutils
          - yq-go
          - helm=4.1.4-2
        files:
          - url: git+https://github.com/envoyproxy/gateway.git#v1.10.0
            checksum: 02e9f89d1c1dc16b723de48fa3289dfa413a6e01
            path: ${source.dir}/helm-charts
            uid: 0
            gid: 0
      pipeline:
        - name: prepare chart
          uses: helm/rudder@v1
          with:
            chart:
              appRef: envoy-gateway
              description: Docker Hardened Images Helm chart for Envoy Gateway
              images:
                - name: envoy-gateway
                  ref: dhi/envoy-gateway:1.10.0-debian13@sha256:0e71d5c5dd4eff4c5133b48aa4818b508a16ada3b2b28dc05f14597ad04af92e
                - name: envoy-ratelimit
                  ref: dhi/envoy-ratelimit:0060f4cc34b16e5f7d7669b0885e29b293dd9d85-debian13@sha256:fe607b17210ac37aa1b32a886f5d3abf79d574e299fb757b555535b445c64cdd
                - name: envoy
                  ref: dhi/envoy:1.40.2-debian13@sha256:64d2afa155573fb93e4076b0e64dbde568fe0618e697d1fe8a780f0b0b2fb025
              name: envoy-gateway-chart
              notes: ${source.dir}/config/NOTES.txt
              sourceUrl: https://github.com/envoyproxy/gateway
            cmd: prepare
            registry: dhi.io
        - name: update version
          uses: yq/patch@v1
          with:
            file: Chart.yaml
            patches:
              - .version = "1.10.0"
        - name: rename values file
          runs: |
            set -eux -o pipefail

            mv values.tmpl.yaml values.yaml
        - name: relocate chart
          uses: helm/rudder@v1
          with:
            cmd: patch
            patches:
              from: ${source.dir}/config
            registry: dhi.io
        - name: verify templated variables
          runs: |
            set -eux -o pipefail

            if grep -E '\$\{[^}]+\}' values.yaml; then
              exit 1
            fi
        - name: lint
          uses: helm/cmd@v1
          with:
            chart: .
            cmd: lint .
        - name: package
          uses: helm/package@v1
          with:
            chart: .
      paths:
        - type: directory
          path: ${source.dir}/config
          uid: 0
          gid: 0
          mode: "0644"
          source: chart/envoy-gateway/config
