image:
  registry: ${oauth2-proxy.registry}
  repository: ${oauth2-proxy.repository}
  tag: ${oauth2-proxy.tag}@${oauth2-proxy.digest}

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 2000
  runAsGroup: 2000
  fsGroup: 2000

initContainers:
  waitForRedis:
    image:
      repository: ${alpine-base.registry}/${alpine-base.repository}
      tag: ${alpine-base.tag}@${alpine-base.digest}
