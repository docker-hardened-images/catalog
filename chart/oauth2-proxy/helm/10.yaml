          - coreutils
          - sed
          - helm=4.1.4-2
        files:
          - url: git+https://github.com/oauth2-proxy/manifests.git#oauth2-proxy-10.7.4
            checksum: 8c3f76ca9d87349a2b90084dd28723de9afddf0d
            path: ${source.dir}/helm-charts
            uid: 0
            gid: 0
      pipeline:
        - name: prepare chart
          uses: helm/rudder@v1
          with:
