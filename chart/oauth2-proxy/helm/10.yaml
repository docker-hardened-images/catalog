              appRef: oauth2-proxy
              dependencies:
                - alias: redis
                  condition: redis-ha.enabled
                  name: redis-chart
                  ref: dhi/redis-chart:23.0.7@sha256:167d2ff99ab627506129b281fd1e8f5358143acb20aa35ce1bb53b2b3b3f3e50
              description: Docker Hardened Images Helm chart for OAuth2 Proxy
              images:
