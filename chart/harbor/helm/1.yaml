  HARBOR_REGISTRYCTL_REFERENCE: dhi/harbor-registryctl:2.16.0-debian13@sha256:88f81659c6712e7240c409957c3bc606e514b95dbc77e567a5e739c1a4b08a79
  HARBOR_TRIVY_ADAPTER_REFERENCE: dhi/harbor-trivy-adapter:2.16.0-debian13@sha256:c31f8929a2545dd25701f66e5f20da42afefca072e9fca8e95d7b8d6bd0e1ec4
  HELM_VERSION: 4.1.4-2
  NGINX_REFERENCE: dhi/nginx:1.31.9-debian13@sha256:0e050601af1cecec776451cf8d622d8e3c9e709eca61f44db292f6ec62030399
  SEMVER_MAJOR_MINOR_VERSION: "1.19"
  SEMVER_MAJOR_VERSION: "1"
  SEMVER_VERSION: 1.19.4
