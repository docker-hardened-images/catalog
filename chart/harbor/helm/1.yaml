  HARBOR_CORE_REFERENCE: dhi/harbor-core:2.15.4-debian13@sha256:d16b8e94fd887445d78ad0f998111c4622b12c100a5d886cabdbc05043e33d0d
  HARBOR_DB_REFERENCE: dhi/harbor-db:2.15.4-debian13@sha256:1d12fd77d49cd669c1e20c91b045f3c301315004aadaa494a03ac71346426c1f
  HARBOR_EXPORTER_REFERENCE: dhi/harbor-exporter:2.15.4-debian13@sha256:9e3f14a868170839d930dae1869bc99b286c8ddd38c979b12d2424a40eba0dad
  HARBOR_JOBSERVICE_REFERENCE: dhi/harbor-jobservice:2.15.4-debian13@sha256:18b3de76a4e2959989fc9f6808d9eebbf120ed9eda5b2d974818a6f20b702b5d
  HARBOR_PORTAL_REFERENCE: dhi/harbor-portal:2.15.4-debian13@sha256:23bd9129b20353a1028f856a09e95a18f7a311627cd8cb902b6e2750d8da691c
  HARBOR_REDIS_REFERENCE: dhi/harbor-redis:2.15.4-debian13@sha256:9cab3a129dc2703e17c640fae37ab326d29b8fbd86191105d15615ede599501d
  HARBOR_REGISTRY_REFERENCE: dhi/harbor-registry:2.15.4-debian13@sha256:2381d5e99b5f88278dda6e742902eb98028d97f9f77fb0d1ee6859a0f125949c
  HARBOR_REGISTRYCTL_REFERENCE: dhi/harbor-registryctl:2.15.4-debian13@sha256:2eda2e659715ae09732d176dedc06aec1b67d60b1f705377238b2013e5683684
  HARBOR_TRIVY_ADAPTER_REFERENCE: dhi/harbor-trivy-adapter:2.15.4-debian13@sha256:f6f95c41d6225a451e1c5bd86b0a0fe1f631905e9905a223407548d6c52dc23c
  HELM_VERSION: 4.1.4-2
  NGINX_REFERENCE: dhi/nginx:1.31.8-debian13@sha256:4ee09b9a3c34fb439ca371a90535fdd20fd6a3b33595d682876a3b86a4ea8f70
  SEMVER_MAJOR_MINOR_VERSION: "1.19"
  SEMVER_MAJOR_VERSION: "1"
  SEMVER_VERSION: 1.19.4
  VERSION: 1.19.4
contents:
  repositories:
    - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
  keyring:
    - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
  builds:
    - name: harbor-chart
      work-dir: ${source.dir}/harbor-helm
      contents:
        packages:
          - bash
          - ca-certificates
          - coreutils
          - perl
          - helm=4.1.4-2
        files:
          - url: git+https://github.com/goharbor/harbor-helm.git#v1.19.4
            checksum: 321159f4129ef8ccd4476047d4c96f582e2e036e
            path: ${source.dir}/harbor-helm
            uid: 0
            gid: 0
      pipeline:
        - name: prepare chart
          uses: helm/rudder@v1
          with:
            chart:
              appRef: harbor-core
              description: Docker Hardened Images Helm chart for Harbor
              images:
                - name: harbor-core
                  ref: dhi/harbor-core:2.15.4-debian13@sha256:d16b8e94fd887445d78ad0f998111c4622b12c100a5d886cabdbc05043e33d0d
                - name: harbor-jobservice
                  ref: dhi/harbor-jobservice:2.15.4-debian13@sha256:18b3de76a4e2959989fc9f6808d9eebbf120ed9eda5b2d974818a6f20b702b5d
                - name: harbor-registry
                  ref: dhi/harbor-registry:2.15.4-debian13@sha256:2381d5e99b5f88278dda6e742902eb98028d97f9f77fb0d1ee6859a0f125949c
                - name: harbor-registryctl
                  ref: dhi/harbor-registryctl:2.15.4-debian13@sha256:2eda2e659715ae09732d176dedc06aec1b67d60b1f705377238b2013e5683684
                - name: harbor-trivy-adapter
                  ref: dhi/harbor-trivy-adapter:2.15.4-debian13@sha256:f6f95c41d6225a451e1c5bd86b0a0fe1f631905e9905a223407548d6c52dc23c
                - name: harbor-exporter
                  ref: dhi/harbor-exporter:2.15.4-debian13@sha256:9e3f14a868170839d930dae1869bc99b286c8ddd38c979b12d2424a40eba0dad
                - name: harbor-portal
                  ref: dhi/harbor-portal:2.15.4-debian13@sha256:23bd9129b20353a1028f856a09e95a18f7a311627cd8cb902b6e2750d8da691c
                - name: harbor-db
                  ref: dhi/harbor-db:2.15.4-debian13@sha256:1d12fd77d49cd669c1e20c91b045f3c301315004aadaa494a03ac71346426c1f
                - name: harbor-redis
                  ref: dhi/harbor-redis:2.15.4-debian13@sha256:9cab3a129dc2703e17c640fae37ab326d29b8fbd86191105d15615ede599501d
                - name: nginx
                  ref: dhi/nginx:1.31.8-debian13@sha256:4ee09b9a3c34fb439ca371a90535fdd20fd6a3b33595d682876a3b86a4ea8f70
              name: harbor-chart
              notes: ${source.dir}/config/NOTES.txt
              sourceUrl: https://github.com/goharbor/harbor
            cmd: prepare
            registry: dhi.io
        - name: patch security contexts
          runs: |
            set -eux -o pipefail

            TMPL="${source.dir}/harbor-helm/templates"

            # Replace each pod-level securityContext block with a Helm {{- with }} block
            # sourced from values.yaml. The indentation is read dynamically from the
            # securityContext: line itself so the replacement is correct regardless of
            # nesting depth, and the block match consumes all deeper-indented lines so
            # it is resilient to new fields being added upstream.
            patch_security_context() {
              local file="$1" path="$2"
              perl -i -0pe \
                's/( +)securityContext:\n(\1 +[^\n]*\n)+/my ($i,$n)=($1,length($1)+2); "${i}{{- with .Values.'"${path}"' }}\n${i}securityContext:\n${i}  {{- toYaml . | nindent $n }}\n${i}{{- end }}\n"/ge' \
                "$file"
            }

            patch_security_context "$TMPL/core/core-dpl.yaml" "core.podSecurityContext"
            patch_security_context "$TMPL/exporter/exporter-dpl.yaml" "exporter.podSecurityContext"
            patch_security_context "$TMPL/jobservice/jobservice-dpl.yaml" "jobservice.podSecurityContext"
            patch_security_context "$TMPL/portal/deployment.yaml" "portal.podSecurityContext"
            patch_security_context "$TMPL/trivy/trivy-sts.yaml" "trivy.podSecurityContext"
            patch_security_context "$TMPL/nginx/deployment.yaml" "nginx.podSecurityContext"
            patch_security_context "$TMPL/registry/registry-dpl.yaml" "registry.podSecurityContext"
            patch_security_context "$TMPL/database/database-ss.yaml" "database.internal.podSecurityContext"
            patch_security_context "$TMPL/redis/statefulset.yaml" "redis.internal.podSecurityContext"
        - name: relocate chart
          uses: helm/rudder@v1
          with:
            cmd: patch
            patches:
              from: ${source.dir}/config
            registry: dhi.io
        - name: lint
          uses: helm/cmd@v1
          with:
            chart: .
            cmd: lint .
        - name: package
          uses: helm/package@v1
          with:
            chart: .
      paths:
        - type: directory
          path: ${source.dir}/config
          uid: 0
          gid: 0
          mode: "0644"
          source: chart/harbor/config
