  HARBOR_DB_REFERENCE: dhi/harbor-db:2.16.0-debian13@sha256:c4e9faa2887209ec2ced56e4f6ae6bd6746d33b5c6f29d40356d9e9d15b9b212
  HARBOR_EXPORTER_REFERENCE: dhi/harbor-exporter:2.15.4-debian13@sha256:94722347fc8697266e003fee7a84d9f36672d6a1467e122067fd8bb8540c2c59
  HARBOR_JOBSERVICE_REFERENCE: dhi/harbor-jobservice:2.15.4-debian13@sha256:f3045cae235bfdc2f97eb68fc77dcc0e8a7526d1b6973b91ef40e7b5537c05d5
