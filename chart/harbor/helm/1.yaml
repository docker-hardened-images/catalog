vars:
  CHART_COMMIT_SHA: 1b95eb091f73a692634797b3ea15766a6d454d57
  CHART_HELM_NAME: harbor-chart
  DHI_NAMESPACE: dhi
  DHI_PREFIX: ""
  DHI_REGISTRY: dhi.io
  DHI_SKIP_CONTEXT_COPY: "true"
  HARBOR_CORE_REFERENCE: dhi/harbor-core:2.15.2-debian13@sha256:13d0d0b58e3830c17e011369d65312cec363e89bd2db53c8eb61d5b383015a73
  HARBOR_DB_REFERENCE: dhi/harbor-db:2.15.2-debian13@sha256:2f5054fda0c3bab4f1b4924c171dc0c69b6069f641111133446418f07fd95ed0
  HARBOR_EXPORTER_REFERENCE: dhi/harbor-exporter:2.15.2-debian13@sha256:a0933f816bcbf212bf5b17e8978734d5b9e9042a055f6cfa57eb52513a4c87a1
  HARBOR_JOBSERVICE_REFERENCE: dhi/harbor-jobservice:2.15.2-debian13@sha256:d6cc8b06f4dc1c8da37142bacfb5e1177790627cfdb549ca7510cc45a6e02e3f
  HARBOR_PORTAL_REFERENCE: dhi/harbor-portal:2.15.2-debian13@sha256:1430f5259997522cac00c65bac079c33d2d3bf698322375c19f21a3e3862235b
  HARBOR_REDIS_REFERENCE: dhi/harbor-redis:2.15.2-debian13@sha256:b1b849d54b9d0014c2e664389b7f26d0a7436a7d8dd294b13ff10e7cb9e8c104
  HARBOR_REGISTRY_REFERENCE: dhi/harbor-registry:2.15.2-debian13@sha256:fc9cfc9efecb650d8cf3d76f7ea8269a8b4be91d729a605f896022b56274a8ff
  HARBOR_REGISTRYCTL_REFERENCE: dhi/harbor-registryctl:2.15.2-debian13@sha256:b558824486a00107bdf811a15b0e644eef529ac955ec2243ff1a02c24c26e1f8
  HARBOR_TRIVY_ADAPTER_REFERENCE: dhi/harbor-trivy-adapter:2.15.2-debian13@sha256:d1976852e412b7348ba8798664f88a844565ffe09aac098820adde3429ad73b6
  HELM_VERSION: 4.1.4-2
  NGINX_REFERENCE: dhi/nginx:1.31.6-debian13@sha256:c5e5ab907bdc2bc5d25bbd95ecb99d7d7ed50d40cf2a8865cdc3da1baa2fa5b2
  SEMVER_MAJOR_MINOR_VERSION: "1.19"
  SEMVER_MAJOR_VERSION: "1"
  SEMVER_VERSION: 1.19.2
  VERSION: 1.19.2
contents:
  repositories:
    - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
  keyring:
    - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
  builds:
    - name: harbor-chart
      work-dir: ${source.dir}/harbor-helm
      contents:
        packages:
          - bash
          - ca-certificates
          - coreutils
          - perl
          - helm=4.1.4-2
        files:
          - url: git+https://github.com/goharbor/harbor-helm.git#v1.19.2
            checksum: 1b95eb091f73a692634797b3ea15766a6d454d57
            path: ${source.dir}/harbor-helm
            uid: 0
            gid: 0
      pipeline:
        - name: prepare chart
          uses: helm/rudder@v1
          with:
            chart:
              appRef: harbor-core
              description: Docker Hardened Images Helm chart for Harbor
              images:
                - name: harbor-core
                  ref: dhi/harbor-core:2.15.2-debian13@sha256:13d0d0b58e3830c17e011369d65312cec363e89bd2db53c8eb61d5b383015a73
                - name: harbor-jobservice
                  ref: dhi/harbor-jobservice:2.15.2-debian13@sha256:d6cc8b06f4dc1c8da37142bacfb5e1177790627cfdb549ca7510cc45a6e02e3f
                - name: harbor-registry
                  ref: dhi/harbor-registry:2.15.2-debian13@sha256:fc9cfc9efecb650d8cf3d76f7ea8269a8b4be91d729a605f896022b56274a8ff
                - name: harbor-registryctl
                  ref: dhi/harbor-registryctl:2.15.2-debian13@sha256:b558824486a00107bdf811a15b0e644eef529ac955ec2243ff1a02c24c26e1f8
                - name: harbor-trivy-adapter
                  ref: dhi/harbor-trivy-adapter:2.15.2-debian13@sha256:d1976852e412b7348ba8798664f88a844565ffe09aac098820adde3429ad73b6
                - name: harbor-exporter
                  ref: dhi/harbor-exporter:2.15.2-debian13@sha256:a0933f816bcbf212bf5b17e8978734d5b9e9042a055f6cfa57eb52513a4c87a1
                - name: harbor-portal
                  ref: dhi/harbor-portal:2.15.2-debian13@sha256:1430f5259997522cac00c65bac079c33d2d3bf698322375c19f21a3e3862235b
                - name: harbor-db
                  ref: dhi/harbor-db:2.15.2-debian13@sha256:2f5054fda0c3bab4f1b4924c171dc0c69b6069f641111133446418f07fd95ed0
                - name: harbor-redis
                  ref: dhi/harbor-redis:2.15.2-debian13@sha256:b1b849d54b9d0014c2e664389b7f26d0a7436a7d8dd294b13ff10e7cb9e8c104
                - name: nginx
                  ref: dhi/nginx:1.31.6-debian13@sha256:c5e5ab907bdc2bc5d25bbd95ecb99d7d7ed50d40cf2a8865cdc3da1baa2fa5b2
              name: harbor-chart
              notes: ${source.dir}/config/NOTES.txt
              sourceUrl: https://github.com/goharbor/harbor
            cmd: prepare
            registry: dhi.io
        - name: patch security contexts
          runs: |
            set -eux -o pipefail

            TMPL="${source.dir}/harbor-helm/templates"

            # Replace each pod-level securityContext block with a Helm {{- with }} block
            # sourced from values.yaml. The indentation is read dynamically from the
            # securityContext: line itself so the replacement is correct regardless of
            # nesting depth, and the block match consumes all deeper-indented lines so
            # it is resilient to new fields being added upstream.
            patch_security_context() {
              local file="$1" path="$2"
              perl -i -0pe \
                's/( +)securityContext:\n(\1 +[^\n]*\n)+/my ($i,$n)=($1,length($1)+2); "${i}{{- with .Values.'"${path}"' }}\n${i}securityContext:\n${i}  {{- toYaml . | nindent $n }}\n${i}{{- end }}\n"/ge' \
                "$file"
            }

            patch_security_context "$TMPL/core/core-dpl.yaml" "core.podSecurityContext"
            patch_security_context "$TMPL/exporter/exporter-dpl.yaml" "exporter.podSecurityContext"
            patch_security_context "$TMPL/jobservice/jobservice-dpl.yaml" "jobservice.podSecurityContext"
            patch_security_context "$TMPL/portal/deployment.yaml" "portal.podSecurityContext"
            patch_security_context "$TMPL/trivy/trivy-sts.yaml" "trivy.podSecurityContext"
            patch_security_context "$TMPL/nginx/deployment.yaml" "nginx.podSecurityContext"
            patch_security_context "$TMPL/registry/registry-dpl.yaml" "registry.podSecurityContext"
            patch_security_context "$TMPL/database/database-ss.yaml" "database.internal.podSecurityContext"
            patch_security_context "$TMPL/redis/statefulset.yaml" "redis.internal.podSecurityContext"
        - name: relocate chart
          uses: helm/rudder@v1
          with:
            cmd: patch
            patches:
              from: ${source.dir}/config
            registry: dhi.io
        - name: lint
          uses: helm/cmd@v1
          with:
            chart: .
            cmd: lint .
        - name: package
          uses: helm/package@v1
          with:
            chart: .
      paths:
        - type: directory
          path: ${source.dir}/config
          uid: 0
          gid: 0
          mode: "0644"
          source: chart/harbor/config
