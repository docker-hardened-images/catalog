vars:
  CHART_COMMIT_SHA: 321159f4129ef8ccd4476047d4c96f582e2e036e
  CHART_HELM_NAME: harbor-chart
  DHI_NAMESPACE: dhi
  DHI_PREFIX: ""
  DHI_REGISTRY: dhi.io
  DHI_SKIP_CONTEXT_COPY: "true"
  HARBOR_CORE_REFERENCE: dhi/harbor-core:2.15.4-debian13@sha256:2732127430e1d51fd406921e0671f52d30100781a91511a27e5482fa2cca938e
  HARBOR_DB_REFERENCE: dhi/harbor-db:2.15.4-debian13@sha256:289dfb290f4bfb4a323ca1b82af2974a920d64805718359bf621b58a309357f6
  HARBOR_EXPORTER_REFERENCE: dhi/harbor-exporter:2.15.4-debian13@sha256:9e3f14a868170839d930dae1869bc99b286c8ddd38c979b12d2424a40eba0dad
  HARBOR_JOBSERVICE_REFERENCE: dhi/harbor-jobservice:2.15.4-debian13@sha256:c8db46364e9de65a20bc6d269096f08bbc4396522ad55fd8127396ccd2c503a5
  HARBOR_PORTAL_REFERENCE: dhi/harbor-portal:2.15.4-debian13@sha256:cf396898683078e350eb17e8f9cbddf6512309b0944af41b5fc08846f4ee8730
