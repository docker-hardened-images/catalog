  HARBOR_DB_REFERENCE: dhi/harbor-db:2.15.4-debian13@sha256:5c2f2ee899245767824030dbb62f9ac9357c82d1d3c974b40f1c633797f7a4bc
  HARBOR_EXPORTER_REFERENCE: dhi/harbor-exporter:2.15.4-debian13@sha256:7930fd12f7f3d49ccb16bf68babbc422238865da782beda00ac29cbfce7577bb
  HARBOR_JOBSERVICE_REFERENCE: dhi/harbor-jobservice:2.15.4-debian13@sha256:c8db46364e9de65a20bc6d269096f08bbc4396522ad55fd8127396ccd2c503a5
