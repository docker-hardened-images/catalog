  HARBOR_REGISTRY_REFERENCE: dhi/harbor-registry:2.16.0-debian13@sha256:0e30f95ba1b56127ba2c5272cbd335b1bfc1ef7f452bdd86897e045d9550fe28
  HARBOR_REGISTRYCTL_REFERENCE: dhi/harbor-registryctl:2.16.0-debian13@sha256:07176e5a7badc14774cf33e1b95d3f488bcc3010c9fe640fde5cf42efb2d58aa
  HARBOR_TRIVY_ADAPTER_REFERENCE: dhi/harbor-trivy-adapter:2.16.0-debian13@sha256:a77c14b814f7907648c52fa94dd61645a16bf67c3fe7ba178e7b7a341623f45f
  HELM_VERSION: 4.1.4-2
  NGINX_REFERENCE: dhi/nginx:1.31.8-debian13@sha256:d6698212a5858b86cd1b102f62ffac59358148e779b1bed23d0eff53c29ee062
  SEMVER_MAJOR_MINOR_VERSION: "1.19"
  SEMVER_MAJOR_VERSION: "1"
