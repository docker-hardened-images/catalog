  HARBOR_REGISTRY_REFERENCE: dhi/harbor-registry:2.15.4-debian13@sha256:2381d5e99b5f88278dda6e742902eb98028d97f9f77fb0d1ee6859a0f125949c
  HARBOR_REGISTRYCTL_REFERENCE: dhi/harbor-registryctl:2.15.4-debian13@sha256:2eda2e659715ae09732d176dedc06aec1b67d60b1f705377238b2013e5683684
  HARBOR_TRIVY_ADAPTER_REFERENCE: dhi/harbor-trivy-adapter:2.15.4-debian13@sha256:3ae2214aa5cb358e315525ec7950fd30172fa61a4521995d4ac15383b4a444c5
  HELM_VERSION: 4.1.4-2
  NGINX_REFERENCE: dhi/nginx:1.31.8-debian13@sha256:e85879d6c15176fad2afe4a564fbb16699b5111fe6aa5cca5102e7a05bbf3345
  SEMVER_MAJOR_MINOR_VERSION: "1.19"
  SEMVER_MAJOR_VERSION: "1"
  SEMVER_VERSION: 1.19.4
