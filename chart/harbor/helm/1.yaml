vars:
  CHART_COMMIT_SHA: 1b95eb091f73a692634797b3ea15766a6d454d57
  CHART_HELM_NAME: harbor-chart
  DHI_NAMESPACE: dhi
  DHI_PREFIX: ""
  DHI_REGISTRY: dhi.io
  DHI_SKIP_CONTEXT_COPY: "true"
  HARBOR_CORE_REFERENCE: dhi/harbor-core:2.15.2-debian13@sha256:0a8f4b29363dfeab1c4d2e75952d366ecde8700703ab7a6744f82c187c3d1079
  HARBOR_DB_REFERENCE: dhi/harbor-db:2.15.2-debian13@sha256:6b2e0868725ad24106ca515f31d89ae091927ecc4b9c1a305bffb3bcf36997ba
  HARBOR_EXPORTER_REFERENCE: dhi/harbor-exporter:2.15.2-debian13@sha256:c8b0b85c4c35916fb81a3e68de1692b58fb1d9889418174dc6d219798d277133
  HARBOR_JOBSERVICE_REFERENCE: dhi/harbor-jobservice:2.15.2-debian13@sha256:3354fddd350b6b56edda09d0a740e77c0e75e7f9c1c7d70530b0badfccae0958
  HARBOR_PORTAL_REFERENCE: dhi/harbor-portal:2.15.2-debian13@sha256:18710a5fd586e99aab151d267dda17e03b87363c66804260a6659454b57352eb
  HARBOR_REDIS_REFERENCE: dhi/harbor-redis:2.15.2-debian13@sha256:ac4709df3b8cfb9fa993bf809a1bf57258996553594be40e39e524250c569423
  HARBOR_REGISTRY_REFERENCE: dhi/harbor-registry:2.15.2-debian13@sha256:c6586b62856dffe1ed65bfc1f1d5da918f4dd06546fc545defb28edecb380d67
  HARBOR_REGISTRYCTL_REFERENCE: dhi/harbor-registryctl:2.15.2-debian13@sha256:bb4ffe21a916ae16a64a74730a4aed50a70550d49d60e99ba7485c370c9a5362
  HARBOR_TRIVY_ADAPTER_REFERENCE: dhi/harbor-trivy-adapter:2.15.2-debian13@sha256:8f5eec4f6fc38586bc9e4925784f097ffb3e8834692642cdb985b5be4d28e7c0
  HELM_VERSION: 4.1.4-2
  NGINX_REFERENCE: dhi/nginx:1.31.5-debian13@sha256:f3d5710c50220d5561d2e66b35bc18a156ac86fa58e9d0e550da74d2628d0aba
  SEMVER_MAJOR_MINOR_VERSION: "1.19"
  SEMVER_MAJOR_VERSION: "1"
  SEMVER_VERSION: 1.19.2
  VERSION: 1.19.2
contents:
  repositories:
    - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
  keyring:
    - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
  builds:
    - name: harbor-chart
      work-dir: ${source.dir}/harbor-helm
      contents:
        packages:
          - bash
          - ca-certificates
          - coreutils
          - perl
          - helm=4.1.4-2
        files:
          - url: git+https://github.com/goharbor/harbor-helm.git#v1.19.2
            checksum: 1b95eb091f73a692634797b3ea15766a6d454d57
            path: ${source.dir}/harbor-helm
            uid: 0
            gid: 0
      pipeline:
        - name: prepare chart
          uses: helm/rudder@v1
          with:
            chart:
              appRef: harbor-core
              description: Docker Hardened Images Helm chart for Harbor
              images:
                - name: harbor-core
                  ref: dhi/harbor-core:2.15.2-debian13@sha256:0a8f4b29363dfeab1c4d2e75952d366ecde8700703ab7a6744f82c187c3d1079
                - name: harbor-jobservice
                  ref: dhi/harbor-jobservice:2.15.2-debian13@sha256:3354fddd350b6b56edda09d0a740e77c0e75e7f9c1c7d70530b0badfccae0958
                - name: harbor-registry
                  ref: dhi/harbor-registry:2.15.2-debian13@sha256:c6586b62856dffe1ed65bfc1f1d5da918f4dd06546fc545defb28edecb380d67
                - name: harbor-registryctl
                  ref: dhi/harbor-registryctl:2.15.2-debian13@sha256:bb4ffe21a916ae16a64a74730a4aed50a70550d49d60e99ba7485c370c9a5362
                - name: harbor-trivy-adapter
                  ref: dhi/harbor-trivy-adapter:2.15.2-debian13@sha256:8f5eec4f6fc38586bc9e4925784f097ffb3e8834692642cdb985b5be4d28e7c0
                - name: harbor-exporter
                  ref: dhi/harbor-exporter:2.15.2-debian13@sha256:c8b0b85c4c35916fb81a3e68de1692b58fb1d9889418174dc6d219798d277133
                - name: harbor-portal
                  ref: dhi/harbor-portal:2.15.2-debian13@sha256:18710a5fd586e99aab151d267dda17e03b87363c66804260a6659454b57352eb
                - name: harbor-db
                  ref: dhi/harbor-db:2.15.2-debian13@sha256:6b2e0868725ad24106ca515f31d89ae091927ecc4b9c1a305bffb3bcf36997ba
                - name: harbor-redis
                  ref: dhi/harbor-redis:2.15.2-debian13@sha256:ac4709df3b8cfb9fa993bf809a1bf57258996553594be40e39e524250c569423
                - name: nginx
                  ref: dhi/nginx:1.31.5-debian13@sha256:f3d5710c50220d5561d2e66b35bc18a156ac86fa58e9d0e550da74d2628d0aba
              name: harbor-chart
              notes: ${source.dir}/config/NOTES.txt
              sourceUrl: https://github.com/goharbor/harbor
            cmd: prepare
            registry: dhi.io
        - name: patch security contexts
          runs: |
            set -eux -o pipefail

            TMPL="${source.dir}/harbor-helm/templates"

            # Replace each pod-level securityContext block with a Helm {{- with }} block
            # sourced from values.yaml. The indentation is read dynamically from the
            # securityContext: line itself so the replacement is correct regardless of
            # nesting depth, and the block match consumes all deeper-indented lines so
            # it is resilient to new fields being added upstream.
            patch_security_context() {
              local file="$1" path="$2"
              perl -i -0pe \
                's/( +)securityContext:\n(\1 +[^\n]*\n)+/my ($i,$n)=($1,length($1)+2); "${i}{{- with .Values.'"${path}"' }}\n${i}securityContext:\n${i}  {{- toYaml . | nindent $n }}\n${i}{{- end }}\n"/ge' \
                "$file"
            }

            patch_security_context "$TMPL/core/core-dpl.yaml" "core.podSecurityContext"
            patch_security_context "$TMPL/exporter/exporter-dpl.yaml" "exporter.podSecurityContext"
            patch_security_context "$TMPL/jobservice/jobservice-dpl.yaml" "jobservice.podSecurityContext"
            patch_security_context "$TMPL/portal/deployment.yaml" "portal.podSecurityContext"
            patch_security_context "$TMPL/trivy/trivy-sts.yaml" "trivy.podSecurityContext"
            patch_security_context "$TMPL/nginx/deployment.yaml" "nginx.podSecurityContext"
            patch_security_context "$TMPL/registry/registry-dpl.yaml" "registry.podSecurityContext"
            patch_security_context "$TMPL/database/database-ss.yaml" "database.internal.podSecurityContext"
            patch_security_context "$TMPL/redis/statefulset.yaml" "redis.internal.podSecurityContext"
        - name: relocate chart
          uses: helm/rudder@v1
          with:
            cmd: patch
            patches:
              from: ${source.dir}/config
            registry: dhi.io
        - name: lint
          uses: helm/cmd@v1
          with:
            chart: .
            cmd: lint .
        - name: package
          uses: helm/package@v1
          with:
            chart: .
      paths:
        - type: directory
          path: ${source.dir}/config
          uid: 0
          gid: 0
          mode: "0644"
          source: chart/harbor/config
