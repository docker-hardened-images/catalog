  HARBOR_DB_REFERENCE: dhi/harbor-db:2.16.0-debian13@sha256:0d853e9617db8a12cf9b1b80b36bf596b1575eb324ed7bfd25aa06e8619ab391
  HARBOR_EXPORTER_REFERENCE: dhi/harbor-exporter:2.16.0-debian13@sha256:dfe1491d7bd61efe00ff5dae4b92c562ddeda1f82d62c28cd0ac9d5655c8103b
  HARBOR_JOBSERVICE_REFERENCE: dhi/harbor-jobservice:2.16.0-debian13@sha256:a6eac0a17ce6b322b2ba1e7c869fe6d0ec89ecc8460b17af5ad334f83fddffb2
