  HARBOR_REGISTRY_REFERENCE: dhi/harbor-registry:2.16.0-debian13@sha256:6d1d6943aa566e665edfc253c79e1ab6e6f0ab4f904e7faa3e845f1be0d45ae4
  HARBOR_REGISTRYCTL_REFERENCE: dhi/harbor-registryctl:2.16.0-debian13@sha256:a3ea06aa235e70c126b5da91de7f45c99bfc43b641e482d54d041cd09ffaeed0
  HARBOR_TRIVY_ADAPTER_REFERENCE: dhi/harbor-trivy-adapter:2.15.4-debian13@sha256:09b1c4cda9d4af771fbe3a14bd669b1afb3c6e07be6dde4bed9919f8aa7cdc17
  HELM_VERSION: 4.1.4-2
  NGINX_REFERENCE: dhi/nginx:1.31.8-debian13@sha256:90078e0243f7db503cb926371952c73a389cf1417974a9f214feab259b1c73e1
  SEMVER_MAJOR_MINOR_VERSION: "1.19"
  SEMVER_MAJOR_VERSION: "1"
  SEMVER_VERSION: 1.19.4
  VERSION: 1.19.4
contents:
  repositories:
    - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
  keyring:
    - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
  builds:
    - name: harbor-chart
      work-dir: ${source.dir}/harbor-helm
      contents:
        packages:
          - bash
          - ca-certificates
          - coreutils
          - perl
          - helm=4.1.4-2
        files:
          - url: git+https://github.com/goharbor/harbor-helm.git#v1.19.4
            checksum: 321159f4129ef8ccd4476047d4c96f582e2e036e
            path: ${source.dir}/harbor-helm
            uid: 0
            gid: 0
      pipeline:
        - name: prepare chart
          uses: helm/rudder@v1
          with:
            chart:
              appRef: harbor-core
              description: Docker Hardened Images Helm chart for Harbor
              images:
                - name: harbor-core
                  ref: dhi/harbor-core:2.16.0-debian13@sha256:4272fb63d6031a69dac5a969b3f211db683c673b7ba77e5af328af330d93e061
                - name: harbor-jobservice
                  ref: dhi/harbor-jobservice:2.15.4-debian13@sha256:b223efcb21d1ca8a8f04cbe1c5176149a887f0330dd8c1cd9c4f51953fdd34d6
                - name: harbor-registry
                  ref: dhi/harbor-registry:2.16.0-debian13@sha256:6d1d6943aa566e665edfc253c79e1ab6e6f0ab4f904e7faa3e845f1be0d45ae4
                - name: harbor-registryctl
                  ref: dhi/harbor-registryctl:2.16.0-debian13@sha256:a3ea06aa235e70c126b5da91de7f45c99bfc43b641e482d54d041cd09ffaeed0
                - name: harbor-trivy-adapter
                  ref: dhi/harbor-trivy-adapter:2.15.4-debian13@sha256:09b1c4cda9d4af771fbe3a14bd669b1afb3c6e07be6dde4bed9919f8aa7cdc17
                - name: harbor-exporter
                  ref: dhi/harbor-exporter:2.15.4-debian13@sha256:94722347fc8697266e003fee7a84d9f36672d6a1467e122067fd8bb8540c2c59
                - name: harbor-portal
                  ref: dhi/harbor-portal:2.15.4-debian13@sha256:ba65953b110045bc530467113258cb4b6595383f301d5595b257231cd9ce785f
                - name: harbor-db
                  ref: dhi/harbor-db:2.16.0-debian13@sha256:942696b36830f2051bd15621aa83e0fb309d7c1f94aa0a36f187417507cc890e
                - name: harbor-redis
                  ref: dhi/harbor-redis:2.15.4-debian13@sha256:e2fc71863493c4a5b9f9d7a1cca8699042f4ee305fe0249c96d342cf0f8163f2
                - name: nginx
                  ref: dhi/nginx:1.31.8-debian13@sha256:90078e0243f7db503cb926371952c73a389cf1417974a9f214feab259b1c73e1
              name: harbor-chart
              notes: ${source.dir}/config/NOTES.txt
              sourceUrl: https://github.com/goharbor/harbor
            cmd: prepare
            registry: dhi.io
        - name: patch security contexts
          runs: |
            set -eux -o pipefail

            TMPL="${source.dir}/harbor-helm/templates"

            # Replace each pod-level securityContext block with a Helm {{- with }} block
            # sourced from values.yaml. The indentation is read dynamically from the
            # securityContext: line itself so the replacement is correct regardless of
            # nesting depth, and the block match consumes all deeper-indented lines so
            # it is resilient to new fields being added upstream.
            patch_security_context() {
              local file="$1" path="$2"
              perl -i -0pe \
                's/( +)securityContext:\n(\1 +[^\n]*\n)+/my ($i,$n)=($1,length($1)+2); "${i}{{- with .Values.'"${path}"' }}\n${i}securityContext:\n${i}  {{- toYaml . | nindent $n }}\n${i}{{- end }}\n"/ge' \
                "$file"
            }

            patch_security_context "$TMPL/core/core-dpl.yaml" "core.podSecurityContext"
            patch_security_context "$TMPL/exporter/exporter-dpl.yaml" "exporter.podSecurityContext"
            patch_security_context "$TMPL/jobservice/jobservice-dpl.yaml" "jobservice.podSecurityContext"
            patch_security_context "$TMPL/portal/deployment.yaml" "portal.podSecurityContext"
            patch_security_context "$TMPL/trivy/trivy-sts.yaml" "trivy.podSecurityContext"
            patch_security_context "$TMPL/nginx/deployment.yaml" "nginx.podSecurityContext"
            patch_security_context "$TMPL/registry/registry-dpl.yaml" "registry.podSecurityContext"
            patch_security_context "$TMPL/database/database-ss.yaml" "database.internal.podSecurityContext"
            patch_security_context "$TMPL/redis/statefulset.yaml" "redis.internal.podSecurityContext"
        - name: relocate chart
          uses: helm/rudder@v1
          with:
            cmd: patch
            patches:
              from: ${source.dir}/config
            registry: dhi.io
        - name: lint
          uses: helm/cmd@v1
          with:
            chart: .
            cmd: lint .
        - name: package
          uses: helm/package@v1
          with:
            chart: .
      paths:
        - type: directory
          path: ${source.dir}/config
          uid: 0
          gid: 0
          mode: "0644"
          source: chart/harbor/config
