vars:
  CHART_COMMIT_SHA: 1b95eb091f73a692634797b3ea15766a6d454d57
  CHART_HELM_NAME: harbor-chart
  DHI_NAMESPACE: dhi
  DHI_PREFIX: ""
  DHI_REGISTRY: dhi.io
  DHI_SKIP_CONTEXT_COPY: "true"
  HARBOR_CORE_REFERENCE: dhi/harbor-core:2.15.2-debian13@sha256:c2e18701713501c4274cd35eeebbeaa8003da89f6c04fdf64c6c8069f2f82680
  HARBOR_DB_REFERENCE: dhi/harbor-db:2.15.2-debian13@sha256:2f39ed7af21790da2aba683c78fd70f6332c54de707e19005aab7482d26614c2
  HARBOR_EXPORTER_REFERENCE: dhi/harbor-exporter:2.15.2-debian13@sha256:6b0ed9e3737c4116d5bfbddd8ae105cdbf4540d3838f067934ea6de680dd3892
  HARBOR_JOBSERVICE_REFERENCE: dhi/harbor-jobservice:2.15.2-debian13@sha256:7c02cdb8c1266bd6bd26d5f527347f3c3382eacb46ed1bfd06bc90e889b77fc6
  HARBOR_PORTAL_REFERENCE: dhi/harbor-portal:2.15.2-debian13@sha256:f9f381a38fcd27cfb777f9ad01d91cc26f65b3c655d67881722361397c11980a
  HARBOR_REDIS_REFERENCE: dhi/harbor-redis:2.15.2-debian13@sha256:ac4709df3b8cfb9fa993bf809a1bf57258996553594be40e39e524250c569423
  HARBOR_REGISTRY_REFERENCE: dhi/harbor-registry:2.15.2-debian13@sha256:78d8ac589c7cca85915540fcfbad6065f4f84d474f3a4ca743c01ae47aece997
  HARBOR_REGISTRYCTL_REFERENCE: dhi/harbor-registryctl:2.15.2-debian13@sha256:69ba2372e0a71160ac91c0025b870542fa3c2e7139f7179aa74b7ae0e11407de
  HARBOR_TRIVY_ADAPTER_REFERENCE: dhi/harbor-trivy-adapter:2.15.2-debian13@sha256:522516d9c4b82c264eefd1d1d1e53811ae51cc5efbc6a54a941ef6079b4f8701
  HELM_VERSION: 4.1.4-2
  NGINX_REFERENCE: dhi/nginx:1.31.4-debian13@sha256:4f0c3a1b5a62579685b2bd9aa6ca3b739b12d8a7d26eb1247d2988988435b10b
  SEMVER_MAJOR_MINOR_VERSION: "1.19"
  SEMVER_MAJOR_VERSION: "1"
  SEMVER_VERSION: 1.19.2
  VERSION: 1.19.2
contents:
  repositories:
    - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
  keyring:
    - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
  builds:
    - name: harbor-chart
      work-dir: ${source.dir}/harbor-helm
      contents:
        packages:
          - bash
          - ca-certificates
          - coreutils
          - perl
          - helm=4.1.4-2
        files:
          - url: git+https://github.com/goharbor/harbor-helm.git#v1.19.2
            checksum: 1b95eb091f73a692634797b3ea15766a6d454d57
            path: ${source.dir}/harbor-helm
            uid: 0
            gid: 0
      pipeline:
        - name: prepare chart
          uses: helm/rudder@v1
          with:
            chart:
              appRef: harbor-core
              description: Docker Hardened Images Helm chart for Harbor
              images:
                - name: harbor-core
                  ref: dhi/harbor-core:2.15.2-debian13@sha256:c2e18701713501c4274cd35eeebbeaa8003da89f6c04fdf64c6c8069f2f82680
                - name: harbor-jobservice
                  ref: dhi/harbor-jobservice:2.15.2-debian13@sha256:7c02cdb8c1266bd6bd26d5f527347f3c3382eacb46ed1bfd06bc90e889b77fc6
                - name: harbor-registry
                  ref: dhi/harbor-registry:2.15.2-debian13@sha256:78d8ac589c7cca85915540fcfbad6065f4f84d474f3a4ca743c01ae47aece997
                - name: harbor-registryctl
                  ref: dhi/harbor-registryctl:2.15.2-debian13@sha256:69ba2372e0a71160ac91c0025b870542fa3c2e7139f7179aa74b7ae0e11407de
                - name: harbor-trivy-adapter
                  ref: dhi/harbor-trivy-adapter:2.15.2-debian13@sha256:522516d9c4b82c264eefd1d1d1e53811ae51cc5efbc6a54a941ef6079b4f8701
                - name: harbor-exporter
                  ref: dhi/harbor-exporter:2.15.2-debian13@sha256:6b0ed9e3737c4116d5bfbddd8ae105cdbf4540d3838f067934ea6de680dd3892
                - name: harbor-portal
                  ref: dhi/harbor-portal:2.15.2-debian13@sha256:f9f381a38fcd27cfb777f9ad01d91cc26f65b3c655d67881722361397c11980a
                - name: harbor-db
                  ref: dhi/harbor-db:2.15.2-debian13@sha256:2f39ed7af21790da2aba683c78fd70f6332c54de707e19005aab7482d26614c2
                - name: harbor-redis
                  ref: dhi/harbor-redis:2.15.2-debian13@sha256:ac4709df3b8cfb9fa993bf809a1bf57258996553594be40e39e524250c569423
                - name: nginx
                  ref: dhi/nginx:1.31.4-debian13@sha256:4f0c3a1b5a62579685b2bd9aa6ca3b739b12d8a7d26eb1247d2988988435b10b
              name: harbor-chart
              notes: ${source.dir}/config/NOTES.txt
              sourceUrl: https://github.com/goharbor/harbor
            cmd: prepare
            registry: dhi.io
        - name: patch security contexts
          runs: |
            set -eux -o pipefail

            TMPL="${source.dir}/harbor-helm/templates"

            # Replace each pod-level securityContext block with a Helm {{- with }} block
            # sourced from values.yaml. The indentation is read dynamically from the
            # securityContext: line itself so the replacement is correct regardless of
            # nesting depth, and the block match consumes all deeper-indented lines so
            # it is resilient to new fields being added upstream.
            patch_security_context() {
              local file="$1" path="$2"
              perl -i -0pe \
                's/( +)securityContext:\n(\1 +[^\n]*\n)+/my ($i,$n)=($1,length($1)+2); "${i}{{- with .Values.'"${path}"' }}\n${i}securityContext:\n${i}  {{- toYaml . | nindent $n }}\n${i}{{- end }}\n"/ge' \
                "$file"
            }

            patch_security_context "$TMPL/core/core-dpl.yaml" "core.podSecurityContext"
            patch_security_context "$TMPL/exporter/exporter-dpl.yaml" "exporter.podSecurityContext"
            patch_security_context "$TMPL/jobservice/jobservice-dpl.yaml" "jobservice.podSecurityContext"
            patch_security_context "$TMPL/portal/deployment.yaml" "portal.podSecurityContext"
            patch_security_context "$TMPL/trivy/trivy-sts.yaml" "trivy.podSecurityContext"
            patch_security_context "$TMPL/nginx/deployment.yaml" "nginx.podSecurityContext"
            patch_security_context "$TMPL/registry/registry-dpl.yaml" "registry.podSecurityContext"
            patch_security_context "$TMPL/database/database-ss.yaml" "database.internal.podSecurityContext"
            patch_security_context "$TMPL/redis/statefulset.yaml" "redis.internal.podSecurityContext"
        - name: relocate chart
          uses: helm/rudder@v1
          with:
            cmd: patch
            patches:
              from: ${source.dir}/config
            registry: dhi.io
        - name: lint
          uses: helm/cmd@v1
          with:
            chart: .
            cmd: lint .
        - name: package
          uses: helm/package@v1
          with:
            chart: .
      paths:
        - type: directory
          path: ${source.dir}/config
          uid: 0
          gid: 0
          mode: "0644"
          source: chart/harbor/config
