vars:
  CHART_COMMIT_SHA: 1b95eb091f73a692634797b3ea15766a6d454d57
  CHART_HELM_NAME: harbor-chart
  DHI_NAMESPACE: dhi
  DHI_PREFIX: ""
  DHI_REGISTRY: dhi.io
  DHI_SKIP_CONTEXT_COPY: "true"
  HARBOR_CORE_REFERENCE: dhi/harbor-core:2.15.2-debian13@sha256:dbb8ff719a3e185840d728af9a1d32c3f98a4897773510e866450d1c2b1c231b
  HARBOR_DB_REFERENCE: dhi/harbor-db:2.15.2-debian13@sha256:8cc32b6dcecf202cd34c7ff4755f08145db0cc1a0d471d98f58ee02ce2cb6bbe
  HARBOR_EXPORTER_REFERENCE: dhi/harbor-exporter:2.15.2-debian13@sha256:7a0324a860085aa45965533d009bdbfa2925aacf03650ef30a822443f688d76b
  HARBOR_JOBSERVICE_REFERENCE: dhi/harbor-jobservice:2.15.2-debian13@sha256:f96573a9b965bfec3c23b0c2bd04ce281af876c65b63a369f1d6760abd0d4458
  HARBOR_PORTAL_REFERENCE: dhi/harbor-portal:2.15.1-debian13@sha256:5cba6cdccdd0dcb2fc7b2f6578e923c79e7f6ebf1964c03819f4b21c36a53408
  HARBOR_REDIS_REFERENCE: dhi/harbor-redis:2.15.1-debian13@sha256:4d3dfd85b13b51ed9288ded7a188c214635445fffd42177a37f536bf4a94dd40
  HARBOR_REGISTRY_REFERENCE: dhi/harbor-registry:2.15.2-debian13@sha256:67c64a754657434448b9e872a1bd0ca5af85f9ef19294e5d4bc02fd34ba7cb7e
  HARBOR_REGISTRYCTL_REFERENCE: dhi/harbor-registryctl:2.15.2-debian13@sha256:9b28814aaa222d4cc8350ead2fd656da51183f10fafa552a4b54974a1519db11
  HARBOR_TRIVY_ADAPTER_REFERENCE: dhi/harbor-trivy-adapter:2.15.2-debian13@sha256:fb041cb5933db528043d7af0187e71f65dbde6ca01de97609c5be99b35741e26
  HELM_VERSION: 4.1.4-2
  NGINX_REFERENCE: dhi/nginx:1.31.3-debian13@sha256:a9afa4692d6ab7883632381572a35350b40317868b24a0dd8f0f9270f0ea2faa
  SEMVER_MAJOR_MINOR_VERSION: "1.19"
  SEMVER_MAJOR_VERSION: "1"
  SEMVER_VERSION: 1.19.2
  VERSION: 1.19.2
contents:
  repositories:
    - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
  keyring:
    - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
  builds:
    - name: harbor-chart
      work-dir: ${source.dir}/harbor-helm
      contents:
        packages:
          - bash
          - ca-certificates
          - coreutils
          - perl
          - helm=4.1.4-2
        files:
          - url: git+https://github.com/goharbor/harbor-helm.git#v1.19.2
            checksum: 1b95eb091f73a692634797b3ea15766a6d454d57
            path: ${source.dir}/harbor-helm
            uid: 0
            gid: 0
      pipeline:
        - name: prepare chart
          uses: helm/rudder@v1
          with:
            chart:
              appRef: harbor-core
              description: Docker Hardened Images Helm chart for Harbor
              images:
                - name: harbor-core
                  ref: dhi/harbor-core:2.15.2-debian13@sha256:dbb8ff719a3e185840d728af9a1d32c3f98a4897773510e866450d1c2b1c231b
                - name: harbor-jobservice
                  ref: dhi/harbor-jobservice:2.15.2-debian13@sha256:f96573a9b965bfec3c23b0c2bd04ce281af876c65b63a369f1d6760abd0d4458
                - name: harbor-registry
                  ref: dhi/harbor-registry:2.15.2-debian13@sha256:67c64a754657434448b9e872a1bd0ca5af85f9ef19294e5d4bc02fd34ba7cb7e
                - name: harbor-registryctl
                  ref: dhi/harbor-registryctl:2.15.2-debian13@sha256:9b28814aaa222d4cc8350ead2fd656da51183f10fafa552a4b54974a1519db11
                - name: harbor-trivy-adapter
                  ref: dhi/harbor-trivy-adapter:2.15.2-debian13@sha256:fb041cb5933db528043d7af0187e71f65dbde6ca01de97609c5be99b35741e26
                - name: harbor-exporter
                  ref: dhi/harbor-exporter:2.15.2-debian13@sha256:7a0324a860085aa45965533d009bdbfa2925aacf03650ef30a822443f688d76b
                - name: harbor-portal
                  ref: dhi/harbor-portal:2.15.1-debian13@sha256:5cba6cdccdd0dcb2fc7b2f6578e923c79e7f6ebf1964c03819f4b21c36a53408
                - name: harbor-db
                  ref: dhi/harbor-db:2.15.2-debian13@sha256:8cc32b6dcecf202cd34c7ff4755f08145db0cc1a0d471d98f58ee02ce2cb6bbe
                - name: harbor-redis
                  ref: dhi/harbor-redis:2.15.1-debian13@sha256:4d3dfd85b13b51ed9288ded7a188c214635445fffd42177a37f536bf4a94dd40
                - name: nginx
                  ref: dhi/nginx:1.31.3-debian13@sha256:a9afa4692d6ab7883632381572a35350b40317868b24a0dd8f0f9270f0ea2faa
              name: harbor-chart
              notes: ${source.dir}/config/NOTES.txt
              sourceUrl: https://github.com/goharbor/harbor
            cmd: prepare
            registry: dhi.io
        - name: patch security contexts
          runs: |
            set -eux -o pipefail

            TMPL="${source.dir}/harbor-helm/templates"

            # Replace each pod-level securityContext block with a Helm {{- with }} block
            # sourced from values.yaml. The indentation is read dynamically from the
            # securityContext: line itself so the replacement is correct regardless of
            # nesting depth, and the block match consumes all deeper-indented lines so
            # it is resilient to new fields being added upstream.
            patch_security_context() {
              local file="$1" path="$2"
              perl -i -0pe \
                's/( +)securityContext:\n(\1 +[^\n]*\n)+/my ($i,$n)=($1,length($1)+2); "${i}{{- with .Values.'"${path}"' }}\n${i}securityContext:\n${i}  {{- toYaml . | nindent $n }}\n${i}{{- end }}\n"/ge' \
                "$file"
            }

            patch_security_context "$TMPL/core/core-dpl.yaml" "core.podSecurityContext"
            patch_security_context "$TMPL/exporter/exporter-dpl.yaml" "exporter.podSecurityContext"
            patch_security_context "$TMPL/jobservice/jobservice-dpl.yaml" "jobservice.podSecurityContext"
            patch_security_context "$TMPL/portal/deployment.yaml" "portal.podSecurityContext"
            patch_security_context "$TMPL/trivy/trivy-sts.yaml" "trivy.podSecurityContext"
            patch_security_context "$TMPL/nginx/deployment.yaml" "nginx.podSecurityContext"
            patch_security_context "$TMPL/registry/registry-dpl.yaml" "registry.podSecurityContext"
            patch_security_context "$TMPL/database/database-ss.yaml" "database.internal.podSecurityContext"
            patch_security_context "$TMPL/redis/statefulset.yaml" "redis.internal.podSecurityContext"
        - name: relocate chart
          uses: helm/rudder@v1
          with:
            cmd: patch
            patches:
              from: ${source.dir}/config
            registry: dhi.io
        - name: lint
          uses: helm/cmd@v1
          with:
            chart: .
            cmd: lint .
        - name: package
          uses: helm/package@v1
          with:
            chart: .
      paths:
        - type: directory
          path: ${source.dir}/config
          uid: 0
          gid: 0
          mode: "0644"
          source: chart/harbor/config
