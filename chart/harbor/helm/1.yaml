  HARBOR_REGISTRY_REFERENCE: dhi/harbor-registry:2.15.4-debian13@sha256:23633120b25b1f27a3baaff5b7cd5cc0f79fb05c71468e072899680e2bac37c6
  HARBOR_REGISTRYCTL_REFERENCE: dhi/harbor-registryctl:2.15.4-debian13@sha256:2e78c71b80d8d5c4a18ba9a00ee4b96af2e98f875c0f5c9281e132cd80eb3482
  HARBOR_TRIVY_ADAPTER_REFERENCE: dhi/harbor-trivy-adapter:2.15.4-debian13@sha256:ecd36637afd87bbf5f8fad44c416de412c1bb8ef3841f876b5ea7f2e317d6e10
  HELM_VERSION: 4.1.4-2
  NGINX_REFERENCE: dhi/nginx:1.31.8-debian13@sha256:312125bbc2dd851cc14526f03cffc56edf15af7591f656e3251d0e496c186edf
  SEMVER_MAJOR_MINOR_VERSION: "1.19"
  SEMVER_MAJOR_VERSION: "1"
  SEMVER_VERSION: 1.19.4
