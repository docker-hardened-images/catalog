vars:
  CHART_COMMIT_SHA: 1b95eb091f73a692634797b3ea15766a6d454d57
  CHART_HELM_NAME: harbor-chart
  DHI_NAMESPACE: dhi
  DHI_PREFIX: ""
  DHI_REGISTRY: dhi.io
  DHI_SKIP_CONTEXT_COPY: "true"
  HARBOR_CORE_REFERENCE: dhi/harbor-core:2.15.2-debian13@sha256:632ff464d269924b24572dd6f8c1afa07777cac8564cc2581e6ab5c3af61f5b2
  HARBOR_DB_REFERENCE: dhi/harbor-db:2.15.2-debian13@sha256:df8044959e8c588df517aec729051ae8c28a5994cd7ffac300fe8290ab81f739
  HARBOR_EXPORTER_REFERENCE: dhi/harbor-exporter:2.15.2-debian13@sha256:8118d58861b8ca8ddc1e6f94302e4df00a683d9816dd0c3b2b6a8b7db043d836
  HARBOR_JOBSERVICE_REFERENCE: dhi/harbor-jobservice:2.15.2-debian13@sha256:7c02cdb8c1266bd6bd26d5f527347f3c3382eacb46ed1bfd06bc90e889b77fc6
  HARBOR_PORTAL_REFERENCE: dhi/harbor-portal:2.15.2-debian13@sha256:003d653690ccabe453f5bbae832bbde227c846e03447cf92f504e400d694fddb
  HARBOR_REDIS_REFERENCE: dhi/harbor-redis:2.15.2-debian13@sha256:b91afc293ef0865a792d261e68daff6ab077fab2d4281a1d54bd28fc3c7545a4
  HARBOR_REGISTRY_REFERENCE: dhi/harbor-registry:2.15.2-debian13@sha256:78d8ac589c7cca85915540fcfbad6065f4f84d474f3a4ca743c01ae47aece997
  HARBOR_REGISTRYCTL_REFERENCE: dhi/harbor-registryctl:2.15.2-debian13@sha256:ac96010abe29f228b6dd57af0ceae7f7d7ad85cf311ff3338a85a6af775bf9ba
  HARBOR_TRIVY_ADAPTER_REFERENCE: dhi/harbor-trivy-adapter:2.15.2-debian13@sha256:6103d37ccfae6ab37399bc46e7fdd0b25cb3041bc886df9d47845e9b30d77da9
  HELM_VERSION: 4.1.4-2
  NGINX_REFERENCE: dhi/nginx:1.31.4-debian13@sha256:8eb3fa132e6d5d424daabc8c2d09a5c2be526118a38d62e3b657cd8efeeaf96f
  SEMVER_MAJOR_MINOR_VERSION: "1.19"
  SEMVER_MAJOR_VERSION: "1"
  SEMVER_VERSION: 1.19.2
  VERSION: 1.19.2
contents:
  repositories:
    - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
  keyring:
    - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
  builds:
    - name: harbor-chart
      work-dir: ${source.dir}/harbor-helm
      contents:
        packages:
          - bash
          - ca-certificates
          - coreutils
          - perl
          - helm=4.1.4-2
        files:
          - url: git+https://github.com/goharbor/harbor-helm.git#v1.19.2
            checksum: 1b95eb091f73a692634797b3ea15766a6d454d57
            path: ${source.dir}/harbor-helm
            uid: 0
            gid: 0
      pipeline:
        - name: prepare chart
          uses: helm/rudder@v1
          with:
            chart:
              appRef: harbor-core
              description: Docker Hardened Images Helm chart for Harbor
              images:
                - name: harbor-core
                  ref: dhi/harbor-core:2.15.2-debian13@sha256:632ff464d269924b24572dd6f8c1afa07777cac8564cc2581e6ab5c3af61f5b2
                - name: harbor-jobservice
                  ref: dhi/harbor-jobservice:2.15.2-debian13@sha256:7c02cdb8c1266bd6bd26d5f527347f3c3382eacb46ed1bfd06bc90e889b77fc6
                - name: harbor-registry
                  ref: dhi/harbor-registry:2.15.2-debian13@sha256:78d8ac589c7cca85915540fcfbad6065f4f84d474f3a4ca743c01ae47aece997
                - name: harbor-registryctl
                  ref: dhi/harbor-registryctl:2.15.2-debian13@sha256:ac96010abe29f228b6dd57af0ceae7f7d7ad85cf311ff3338a85a6af775bf9ba
                - name: harbor-trivy-adapter
                  ref: dhi/harbor-trivy-adapter:2.15.2-debian13@sha256:6103d37ccfae6ab37399bc46e7fdd0b25cb3041bc886df9d47845e9b30d77da9
                - name: harbor-exporter
                  ref: dhi/harbor-exporter:2.15.2-debian13@sha256:8118d58861b8ca8ddc1e6f94302e4df00a683d9816dd0c3b2b6a8b7db043d836
                - name: harbor-portal
                  ref: dhi/harbor-portal:2.15.2-debian13@sha256:003d653690ccabe453f5bbae832bbde227c846e03447cf92f504e400d694fddb
                - name: harbor-db
                  ref: dhi/harbor-db:2.15.2-debian13@sha256:df8044959e8c588df517aec729051ae8c28a5994cd7ffac300fe8290ab81f739
                - name: harbor-redis
                  ref: dhi/harbor-redis:2.15.2-debian13@sha256:b91afc293ef0865a792d261e68daff6ab077fab2d4281a1d54bd28fc3c7545a4
                - name: nginx
                  ref: dhi/nginx:1.31.4-debian13@sha256:8eb3fa132e6d5d424daabc8c2d09a5c2be526118a38d62e3b657cd8efeeaf96f
              name: harbor-chart
              notes: ${source.dir}/config/NOTES.txt
              sourceUrl: https://github.com/goharbor/harbor
            cmd: prepare
            registry: dhi.io
        - name: patch security contexts
          runs: |
            set -eux -o pipefail

            TMPL="${source.dir}/harbor-helm/templates"

            # Replace each pod-level securityContext block with a Helm {{- with }} block
            # sourced from values.yaml. The indentation is read dynamically from the
            # securityContext: line itself so the replacement is correct regardless of
            # nesting depth, and the block match consumes all deeper-indented lines so
            # it is resilient to new fields being added upstream.
            patch_security_context() {
              local file="$1" path="$2"
              perl -i -0pe \
                's/( +)securityContext:\n(\1 +[^\n]*\n)+/my ($i,$n)=($1,length($1)+2); "${i}{{- with .Values.'"${path}"' }}\n${i}securityContext:\n${i}  {{- toYaml . | nindent $n }}\n${i}{{- end }}\n"/ge' \
                "$file"
            }

            patch_security_context "$TMPL/core/core-dpl.yaml" "core.podSecurityContext"
            patch_security_context "$TMPL/exporter/exporter-dpl.yaml" "exporter.podSecurityContext"
            patch_security_context "$TMPL/jobservice/jobservice-dpl.yaml" "jobservice.podSecurityContext"
            patch_security_context "$TMPL/portal/deployment.yaml" "portal.podSecurityContext"
            patch_security_context "$TMPL/trivy/trivy-sts.yaml" "trivy.podSecurityContext"
            patch_security_context "$TMPL/nginx/deployment.yaml" "nginx.podSecurityContext"
            patch_security_context "$TMPL/registry/registry-dpl.yaml" "registry.podSecurityContext"
            patch_security_context "$TMPL/database/database-ss.yaml" "database.internal.podSecurityContext"
            patch_security_context "$TMPL/redis/statefulset.yaml" "redis.internal.podSecurityContext"
        - name: relocate chart
          uses: helm/rudder@v1
          with:
            cmd: patch
            patches:
              from: ${source.dir}/config
            registry: dhi.io
        - name: lint
          uses: helm/cmd@v1
          with:
            chart: .
            cmd: lint .
        - name: package
          uses: helm/package@v1
          with:
            chart: .
      paths:
        - type: directory
          path: ${source.dir}/config
          uid: 0
          gid: 0
          mode: "0644"
          source: chart/harbor/config
