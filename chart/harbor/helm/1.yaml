  HARBOR_REGISTRY_REFERENCE: dhi/harbor-registry:2.15.4-debian13@sha256:7b877e622ed9c273dbeaad12dc752c11097b5148b0d1296a94f502d5509b4a5e
  HARBOR_REGISTRYCTL_REFERENCE: dhi/harbor-registryctl:2.15.4-debian13@sha256:bbcf57cf5ab4e4690182904b093cde03204e0e2293fe8fe90439dd787064af17
  HARBOR_TRIVY_ADAPTER_REFERENCE: dhi/harbor-trivy-adapter:2.15.4-debian13@sha256:48db30dfc9f754354e9d36f9a33c50c902a24a99c49c53353b43d20f03de7eeb
  HELM_VERSION: 4.1.4-2
  NGINX_REFERENCE: dhi/nginx:1.31.8-debian13@sha256:312125bbc2dd851cc14526f03cffc56edf15af7591f656e3251d0e496c186edf
  SEMVER_MAJOR_MINOR_VERSION: "1.19"
  SEMVER_MAJOR_VERSION: "1"
  SEMVER_VERSION: 1.19.4
  VERSION: 1.19.4
contents:
  repositories:
    - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
  keyring:
    - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
  builds:
    - name: harbor-chart
      work-dir: ${source.dir}/harbor-helm
      contents:
        packages:
          - bash
          - ca-certificates
          - coreutils
          - perl
          - helm=4.1.4-2
        files:
          - url: git+https://github.com/goharbor/harbor-helm.git#v1.19.4
            checksum: 321159f4129ef8ccd4476047d4c96f582e2e036e
            path: ${source.dir}/harbor-helm
            uid: 0
            gid: 0
      pipeline:
        - name: prepare chart
          uses: helm/rudder@v1
          with:
            chart:
              appRef: harbor-core
              description: Docker Hardened Images Helm chart for Harbor
              images:
                - name: harbor-core
                  ref: dhi/harbor-core:2.15.4-debian13@sha256:b4ebaf38638879a01b52fd6f76780b29cafa2633395ffa16317d576ea7fb2ff0
                - name: harbor-jobservice
                  ref: dhi/harbor-jobservice:2.15.4-debian13@sha256:06fc69622c5b0adb4988e3efe1bc0494e038c8989a4d20f36af0acbe133f2f0b
                - name: harbor-registry
                  ref: dhi/harbor-registry:2.15.4-debian13@sha256:7b877e622ed9c273dbeaad12dc752c11097b5148b0d1296a94f502d5509b4a5e
                - name: harbor-registryctl
                  ref: dhi/harbor-registryctl:2.15.4-debian13@sha256:bbcf57cf5ab4e4690182904b093cde03204e0e2293fe8fe90439dd787064af17
                - name: harbor-trivy-adapter
                  ref: dhi/harbor-trivy-adapter:2.15.4-debian13@sha256:48db30dfc9f754354e9d36f9a33c50c902a24a99c49c53353b43d20f03de7eeb
                - name: harbor-exporter
                  ref: dhi/harbor-exporter:2.15.4-debian13@sha256:988fa8befd34c50a121223eece5a3e9689dbeedf847aef4c58d707489f1d860a
                - name: harbor-portal
                  ref: dhi/harbor-portal:2.15.4-debian13@sha256:fa0e9ac6c6b466c5c298d3b0e980b0a7ca78546ecc0c2418a112e8fac9e8c582
                - name: harbor-db
                  ref: dhi/harbor-db:2.15.4-debian13@sha256:685447d6a848171f988f8edff4aec98168750a00093a9a6e683fc06f2e8272eb
                - name: harbor-redis
                  ref: dhi/harbor-redis:2.15.4-debian13@sha256:e568bd216a936cc19fe49b8eada23a8723aa67106e41d7e9f1542ef7aefeafbf
                - name: nginx
                  ref: dhi/nginx:1.31.8-debian13@sha256:312125bbc2dd851cc14526f03cffc56edf15af7591f656e3251d0e496c186edf
              name: harbor-chart
              notes: ${source.dir}/config/NOTES.txt
              sourceUrl: https://github.com/goharbor/harbor
            cmd: prepare
            registry: dhi.io
        - name: patch security contexts
          runs: |
            set -eux -o pipefail

            TMPL="${source.dir}/harbor-helm/templates"

            # Replace each pod-level securityContext block with a Helm {{- with }} block
            # sourced from values.yaml. The indentation is read dynamically from the
            # securityContext: line itself so the replacement is correct regardless of
            # nesting depth, and the block match consumes all deeper-indented lines so
            # it is resilient to new fields being added upstream.
            patch_security_context() {
              local file="$1" path="$2"
              perl -i -0pe \
                's/( +)securityContext:\n(\1 +[^\n]*\n)+/my ($i,$n)=($1,length($1)+2); "${i}{{- with .Values.'"${path}"' }}\n${i}securityContext:\n${i}  {{- toYaml . | nindent $n }}\n${i}{{- end }}\n"/ge' \
                "$file"
            }

            patch_security_context "$TMPL/core/core-dpl.yaml" "core.podSecurityContext"
            patch_security_context "$TMPL/exporter/exporter-dpl.yaml" "exporter.podSecurityContext"
            patch_security_context "$TMPL/jobservice/jobservice-dpl.yaml" "jobservice.podSecurityContext"
            patch_security_context "$TMPL/portal/deployment.yaml" "portal.podSecurityContext"
            patch_security_context "$TMPL/trivy/trivy-sts.yaml" "trivy.podSecurityContext"
            patch_security_context "$TMPL/nginx/deployment.yaml" "nginx.podSecurityContext"
            patch_security_context "$TMPL/registry/registry-dpl.yaml" "registry.podSecurityContext"
            patch_security_context "$TMPL/database/database-ss.yaml" "database.internal.podSecurityContext"
            patch_security_context "$TMPL/redis/statefulset.yaml" "redis.internal.podSecurityContext"
        - name: relocate chart
          uses: helm/rudder@v1
          with:
            cmd: patch
            patches:
              from: ${source.dir}/config
            registry: dhi.io
        - name: lint
          uses: helm/cmd@v1
          with:
            chart: .
            cmd: lint .
        - name: package
          uses: helm/package@v1
          with:
            chart: .
      paths:
        - type: directory
          path: ${source.dir}/config
          uid: 0
          gid: 0
          mode: "0644"
          source: chart/harbor/config
