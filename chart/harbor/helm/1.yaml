  HARBOR_REGISTRYCTL_REFERENCE: dhi/harbor-registryctl:2.16.0-debian13@sha256:ec5aa737ea22b0c829160d63463e8b5ed4a930a24e37692b44fdb1137e9f75f0
  HARBOR_TRIVY_ADAPTER_REFERENCE: dhi/harbor-trivy-adapter:2.15.4-debian13@sha256:4b1908dcc507692d02b5d61f3de8f10de9862103c2e9521e1a665af96a66609d
  HELM_VERSION: 4.1.4-2
  NGINX_REFERENCE: dhi/nginx:1.31.8-debian13@sha256:acb2db8f35512cf8628eaab974b4f803e320cfd260e8f795684d97b1b394f361
  SEMVER_MAJOR_MINOR_VERSION: "1.19"
  SEMVER_MAJOR_VERSION: "1"
  SEMVER_VERSION: 1.19.4
