name: Harbor Helm chart 1.x
image: dhi.io/harbor-chart
variant: helm
tags:
  - 1.19.2
platforms:
  - linux/amd64
vars:
  CHART_COMMIT_SHA: 1b95eb091f73a692634797b3ea15766a6d454d57
  CHART_HELM_NAME: harbor-chart
  DHI_NAMESPACE: dhi
  DHI_PREFIX: ""
  DHI_REGISTRY: dhi.io
  DHI_SKIP_CONTEXT_COPY: "true"
  HARBOR_CORE_REFERENCE: dhi/harbor-core:2.15.4-debian13@sha256:03a3d456f95e458f17ee8888c5c8efc6f54ff924984f4a88c6f3b05776640cb5
  HARBOR_DB_REFERENCE: dhi/harbor-db:2.15.3-debian13@sha256:3929df59378d35647e16379bbf6a8e84ab43624c50eccfcb7990268565fab223
  HARBOR_EXPORTER_REFERENCE: dhi/harbor-exporter:2.15.3-debian13@sha256:b935c35060ef428906226a1ee603a99e02466184f25dfb0fec082197a8cf070c
  HARBOR_JOBSERVICE_REFERENCE: dhi/harbor-jobservice:2.15.4-debian13@sha256:6c550f3de898c23ff4850b981077d4e761750dbd8c097e8016d020f779350376
  HARBOR_PORTAL_REFERENCE: dhi/harbor-portal:2.15.3-debian13@sha256:5037be82ba0b85eb4faa2f5e97c55b2b12f58690f01cee14cb61877c250e7502
  HARBOR_REDIS_REFERENCE: dhi/harbor-redis:2.15.3-debian13@sha256:edb212d078ec89c50145c2a90e31a992068050ed183da23dd3618171eb6ce16d
  HARBOR_REGISTRY_REFERENCE: dhi/harbor-registry:2.15.3-debian13@sha256:cadd85742fe070fbdb654172d9a0099600907eb18ef9e1fcdd8a323a3ce11b49
  HARBOR_REGISTRYCTL_REFERENCE: dhi/harbor-registryctl:2.15.4-debian13@sha256:ffd22144235f15f96f528e13af218f80d95e44517970981ace984e9487b65370
  HARBOR_TRIVY_ADAPTER_REFERENCE: dhi/harbor-trivy-adapter:2.15.3-debian13@sha256:a4e15ad83b0e51d00c83bc9b85c650c7e24c2c9de797d614926a0d1c4b9e28f8
  HELM_VERSION: 4.1.4-2
  NGINX_REFERENCE: dhi/nginx:1.31.6-debian13@sha256:c5e5ab907bdc2bc5d25bbd95ecb99d7d7ed50d40cf2a8865cdc3da1baa2fa5b2
  SEMVER_MAJOR_MINOR_VERSION: "1.19"
  SEMVER_MAJOR_VERSION: "1"
  SEMVER_VERSION: 1.19.2
  VERSION: 1.19.2
contents:
  repositories:
    - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
  keyring:
    - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
  builds:
    - name: harbor-chart
      work-dir: ${source.dir}/harbor-helm
      contents:
        packages:
          - bash
          - ca-certificates
          - coreutils
          - perl
          - helm=4.1.4-2
        files:
          - url: git+https://github.com/goharbor/harbor-helm.git#v1.19.2
            checksum: 1b95eb091f73a692634797b3ea15766a6d454d57
            path: ${source.dir}/harbor-helm
            uid: 0
            gid: 0
      pipeline:
        - name: prepare chart
          uses: helm/rudder@v1
          with:
            chart:
              appRef: harbor-core
              description: Docker Hardened Images Helm chart for Harbor
              images:
                - name: harbor-core
                  ref: dhi/harbor-core:2.15.4-debian13@sha256:03a3d456f95e458f17ee8888c5c8efc6f54ff924984f4a88c6f3b05776640cb5
                - name: harbor-jobservice
                  ref: dhi/harbor-jobservice:2.15.4-debian13@sha256:6c550f3de898c23ff4850b981077d4e761750dbd8c097e8016d020f779350376
                - name: harbor-registry
                  ref: dhi/harbor-registry:2.15.3-debian13@sha256:cadd85742fe070fbdb654172d9a0099600907eb18ef9e1fcdd8a323a3ce11b49
                - name: harbor-registryctl
                  ref: dhi/harbor-registryctl:2.15.4-debian13@sha256:ffd22144235f15f96f528e13af218f80d95e44517970981ace984e9487b65370
                - name: harbor-trivy-adapter
                  ref: dhi/harbor-trivy-adapter:2.15.3-debian13@sha256:a4e15ad83b0e51d00c83bc9b85c650c7e24c2c9de797d614926a0d1c4b9e28f8
                - name: harbor-exporter
                  ref: dhi/harbor-exporter:2.15.3-debian13@sha256:b935c35060ef428906226a1ee603a99e02466184f25dfb0fec082197a8cf070c
                - name: harbor-portal
                  ref: dhi/harbor-portal:2.15.3-debian13@sha256:5037be82ba0b85eb4faa2f5e97c55b2b12f58690f01cee14cb61877c250e7502
                - name: harbor-db
                  ref: dhi/harbor-db:2.15.3-debian13@sha256:3929df59378d35647e16379bbf6a8e84ab43624c50eccfcb7990268565fab223
                - name: harbor-redis
                  ref: dhi/harbor-redis:2.15.3-debian13@sha256:edb212d078ec89c50145c2a90e31a992068050ed183da23dd3618171eb6ce16d
                - name: nginx
                  ref: dhi/nginx:1.31.6-debian13@sha256:c5e5ab907bdc2bc5d25bbd95ecb99d7d7ed50d40cf2a8865cdc3da1baa2fa5b2
              name: harbor-chart
              notes: ${source.dir}/config/NOTES.txt
              sourceUrl: https://github.com/goharbor/harbor
            cmd: prepare
            registry: dhi.io
        - name: patch security contexts
          runs: |
            set -eux -o pipefail

            TMPL="${source.dir}/harbor-helm/templates"

            # Replace each pod-level securityContext block with a Helm {{- with }} block
            # sourced from values.yaml. The indentation is read dynamically from the
            # securityContext: line itself so the replacement is correct regardless of
            # nesting depth, and the block match consumes all deeper-indented lines so
            # it is resilient to new fields being added upstream.
            patch_security_context() {
              local file="$1" path="$2"
              perl -i -0pe \
                's/( +)securityContext:\n(\1 +[^\n]*\n)+/my ($i,$n)=($1,length($1)+2); "${i}{{- with .Values.'"${path}"' }}\n${i}securityContext:\n${i}  {{- toYaml . | nindent $n }}\n${i}{{- end }}\n"/ge' \
                "$file"
            }

            patch_security_context "$TMPL/core/core-dpl.yaml" "core.podSecurityContext"
            patch_security_context "$TMPL/exporter/exporter-dpl.yaml" "exporter.podSecurityContext"
            patch_security_context "$TMPL/jobservice/jobservice-dpl.yaml" "jobservice.podSecurityContext"
            patch_security_context "$TMPL/portal/deployment.yaml" "portal.podSecurityContext"
            patch_security_context "$TMPL/trivy/trivy-sts.yaml" "trivy.podSecurityContext"
            patch_security_context "$TMPL/nginx/deployment.yaml" "nginx.podSecurityContext"
            patch_security_context "$TMPL/registry/registry-dpl.yaml" "registry.podSecurityContext"
            patch_security_context "$TMPL/database/database-ss.yaml" "database.internal.podSecurityContext"
            patch_security_context "$TMPL/redis/statefulset.yaml" "redis.internal.podSecurityContext"
        - name: relocate chart
          uses: helm/rudder@v1
          with:
            cmd: patch
            patches:
              from: ${source.dir}/config
            registry: dhi.io
        - name: lint
          uses: helm/cmd@v1
          with:
            chart: .
            cmd: lint .
        - name: package
          uses: helm/package@v1
          with:
            chart: .
      paths:
        - type: directory
          path: ${source.dir}/config
          uid: 0
          gid: 0
          mode: "0644"
          source: chart/harbor/config
