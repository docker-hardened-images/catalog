  HARBOR_DB_REFERENCE: dhi/harbor-db:2.16.0-debian13@sha256:7a7178296b5d3cf1756a0560a23ae0b7700516865a08788a6c8a6b5c4f60368d
  HARBOR_EXPORTER_REFERENCE: dhi/harbor-exporter:2.16.0-debian13@sha256:c1b70313da1790c62cf1fa105c8db26ec0d9a3c2e3925b59bb69f0f74c9b8694
  HARBOR_JOBSERVICE_REFERENCE: dhi/harbor-jobservice:2.16.0-debian13@sha256:19bc969b6d20231f2b0eee793ecfb856988ead929fc3dd3ce3c05ff0b0aadfbd
