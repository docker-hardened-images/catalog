  HARBOR_CORE_REFERENCE: dhi/harbor-core:2.16.0-debian13@sha256:a8c3e8531e44f3b23c981ec22fa2dc0d3e64c23ea6854029d068492014b7ac35
  HARBOR_DB_REFERENCE: dhi/harbor-db:2.16.0-debian13@sha256:e76cedf5bf37e38864e71eed03202a2046767821151ac3a12cc795d4ea073169
  HARBOR_EXPORTER_REFERENCE: dhi/harbor-exporter:2.16.0-debian13@sha256:72518053f4aceacaa66d1b23d760500efc6954de8b5a87c8d75f4bcdc06cf009
  HARBOR_JOBSERVICE_REFERENCE: dhi/harbor-jobservice:2.16.0-debian13@sha256:995739ad5befd34a57893e87f86973efd30432e57f98fda33b61b5c87a0ac13f
  HARBOR_PORTAL_REFERENCE: dhi/harbor-portal:2.16.0-debian13@sha256:41c6a29c444877f5def1a61584a56154d5f5ebe83fc7f97d3a4c4943d05da915
  HARBOR_REDIS_REFERENCE: dhi/harbor-redis:2.15.5-debian13@sha256:00e73e342faa70030a5c1d06539c356c5db57592bd7ba709c50af46c3e183a25
  HARBOR_REGISTRY_REFERENCE: dhi/harbor-registry:2.16.0-debian13@sha256:0e30f95ba1b56127ba2c5272cbd335b1bfc1ef7f452bdd86897e045d9550fe28
  HARBOR_REGISTRYCTL_REFERENCE: dhi/harbor-registryctl:2.16.0-debian13@sha256:4ef3202e630851a102229cda33edb5fd1141514fdc187f263e240f98e694d266
  HARBOR_TRIVY_ADAPTER_REFERENCE: dhi/harbor-trivy-adapter:2.16.0-debian13@sha256:6592a464a77e974d0bca922e07338d6e54b3ceb0735bdf7792a33abd5b5ed925
  HELM_VERSION: 4.1.4-2
  NGINX_REFERENCE: dhi/nginx:1.31.8-debian13@sha256:acb2db8f35512cf8628eaab974b4f803e320cfd260e8f795684d97b1b394f361
  SEMVER_MAJOR_MINOR_VERSION: "1.19"
  SEMVER_MAJOR_VERSION: "1"
  SEMVER_VERSION: 1.19.4
  VERSION: 1.19.4
contents:
  repositories:
    - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
  keyring:
    - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
  builds:
    - name: harbor-chart
      work-dir: ${source.dir}/harbor-helm
      contents:
        packages:
          - bash
          - ca-certificates
          - coreutils
          - perl
          - helm=4.1.4-2
        files:
          - url: git+https://github.com/goharbor/harbor-helm.git#v1.19.4
            checksum: 321159f4129ef8ccd4476047d4c96f582e2e036e
            path: ${source.dir}/harbor-helm
            uid: 0
            gid: 0
      pipeline:
        - name: prepare chart
          uses: helm/rudder@v1
          with:
            chart:
              appRef: harbor-core
              description: Docker Hardened Images Helm chart for Harbor
              images:
                - name: harbor-core
                  ref: dhi/harbor-core:2.16.0-debian13@sha256:a8c3e8531e44f3b23c981ec22fa2dc0d3e64c23ea6854029d068492014b7ac35
                - name: harbor-jobservice
                  ref: dhi/harbor-jobservice:2.16.0-debian13@sha256:995739ad5befd34a57893e87f86973efd30432e57f98fda33b61b5c87a0ac13f
                - name: harbor-registry
                  ref: dhi/harbor-registry:2.16.0-debian13@sha256:0e30f95ba1b56127ba2c5272cbd335b1bfc1ef7f452bdd86897e045d9550fe28
                - name: harbor-registryctl
                  ref: dhi/harbor-registryctl:2.16.0-debian13@sha256:4ef3202e630851a102229cda33edb5fd1141514fdc187f263e240f98e694d266
                - name: harbor-trivy-adapter
                  ref: dhi/harbor-trivy-adapter:2.16.0-debian13@sha256:6592a464a77e974d0bca922e07338d6e54b3ceb0735bdf7792a33abd5b5ed925
                - name: harbor-exporter
                  ref: dhi/harbor-exporter:2.16.0-debian13@sha256:72518053f4aceacaa66d1b23d760500efc6954de8b5a87c8d75f4bcdc06cf009
                - name: harbor-portal
                  ref: dhi/harbor-portal:2.16.0-debian13@sha256:41c6a29c444877f5def1a61584a56154d5f5ebe83fc7f97d3a4c4943d05da915
                - name: harbor-db
                  ref: dhi/harbor-db:2.16.0-debian13@sha256:e76cedf5bf37e38864e71eed03202a2046767821151ac3a12cc795d4ea073169
                - name: harbor-redis
                  ref: dhi/harbor-redis:2.15.5-debian13@sha256:00e73e342faa70030a5c1d06539c356c5db57592bd7ba709c50af46c3e183a25
                - name: nginx
                  ref: dhi/nginx:1.31.8-debian13@sha256:acb2db8f35512cf8628eaab974b4f803e320cfd260e8f795684d97b1b394f361
              name: harbor-chart
              notes: ${source.dir}/config/NOTES.txt
              sourceUrl: https://github.com/goharbor/harbor
            cmd: prepare
            registry: dhi.io
        - name: patch security contexts
          runs: |
            set -eux -o pipefail

            TMPL="${source.dir}/harbor-helm/templates"

            # Replace each pod-level securityContext block with a Helm {{- with }} block
            # sourced from values.yaml. The indentation is read dynamically from the
            # securityContext: line itself so the replacement is correct regardless of
            # nesting depth, and the block match consumes all deeper-indented lines so
            # it is resilient to new fields being added upstream.
            patch_security_context() {
              local file="$1" path="$2"
              perl -i -0pe \
                's/( +)securityContext:\n(\1 +[^\n]*\n)+/my ($i,$n)=($1,length($1)+2); "${i}{{- with .Values.'"${path}"' }}\n${i}securityContext:\n${i}  {{- toYaml . | nindent $n }}\n${i}{{- end }}\n"/ge' \
                "$file"
            }

            patch_security_context "$TMPL/core/core-dpl.yaml" "core.podSecurityContext"
            patch_security_context "$TMPL/exporter/exporter-dpl.yaml" "exporter.podSecurityContext"
            patch_security_context "$TMPL/jobservice/jobservice-dpl.yaml" "jobservice.podSecurityContext"
            patch_security_context "$TMPL/portal/deployment.yaml" "portal.podSecurityContext"
            patch_security_context "$TMPL/trivy/trivy-sts.yaml" "trivy.podSecurityContext"
            patch_security_context "$TMPL/nginx/deployment.yaml" "nginx.podSecurityContext"
            patch_security_context "$TMPL/registry/registry-dpl.yaml" "registry.podSecurityContext"
            patch_security_context "$TMPL/database/database-ss.yaml" "database.internal.podSecurityContext"
            patch_security_context "$TMPL/redis/statefulset.yaml" "redis.internal.podSecurityContext"
        - name: relocate chart
          uses: helm/rudder@v1
          with:
            cmd: patch
            patches:
              from: ${source.dir}/config
            registry: dhi.io
        - name: lint
          uses: helm/cmd@v1
          with:
            chart: .
            cmd: lint .
        - name: package
          uses: helm/package@v1
          with:
            chart: .
      paths:
        - type: directory
          path: ${source.dir}/config
          uid: 0
          gid: 0
          mode: "0644"
          source: chart/harbor/config
