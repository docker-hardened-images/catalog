  HARBOR_CORE_REFERENCE: dhi/harbor-core:2.15.4-debian13@sha256:b4ebaf38638879a01b52fd6f76780b29cafa2633395ffa16317d576ea7fb2ff0
  HARBOR_DB_REFERENCE: dhi/harbor-db:2.15.4-debian13@sha256:685447d6a848171f988f8edff4aec98168750a00093a9a6e683fc06f2e8272eb
  HARBOR_EXPORTER_REFERENCE: dhi/harbor-exporter:2.15.4-debian13@sha256:988fa8befd34c50a121223eece5a3e9689dbeedf847aef4c58d707489f1d860a
  HARBOR_JOBSERVICE_REFERENCE: dhi/harbor-jobservice:2.15.4-debian13@sha256:06fc69622c5b0adb4988e3efe1bc0494e038c8989a4d20f36af0acbe133f2f0b
  HARBOR_PORTAL_REFERENCE: dhi/harbor-portal:2.15.4-debian13@sha256:fa0e9ac6c6b466c5c298d3b0e980b0a7ca78546ecc0c2418a112e8fac9e8c582
