  HARBOR_CORE_REFERENCE: dhi/harbor-core:2.16.0-debian13@sha256:4272fb63d6031a69dac5a969b3f211db683c673b7ba77e5af328af330d93e061
  HARBOR_DB_REFERENCE: dhi/harbor-db:2.16.0-debian13@sha256:942696b36830f2051bd15621aa83e0fb309d7c1f94aa0a36f187417507cc890e
  HARBOR_EXPORTER_REFERENCE: dhi/harbor-exporter:2.15.4-debian13@sha256:94722347fc8697266e003fee7a84d9f36672d6a1467e122067fd8bb8540c2c59
  HARBOR_JOBSERVICE_REFERENCE: dhi/harbor-jobservice:2.15.4-debian13@sha256:b223efcb21d1ca8a8f04cbe1c5176149a887f0330dd8c1cd9c4f51953fdd34d6
  HARBOR_PORTAL_REFERENCE: dhi/harbor-portal:2.15.4-debian13@sha256:ba65953b110045bc530467113258cb4b6595383f301d5595b257231cd9ce785f
