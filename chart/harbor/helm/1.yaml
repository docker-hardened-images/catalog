  HARBOR_REGISTRY_REFERENCE: dhi/harbor-registry:2.15.4-debian13@sha256:2381d5e99b5f88278dda6e742902eb98028d97f9f77fb0d1ee6859a0f125949c
  HARBOR_REGISTRYCTL_REFERENCE: dhi/harbor-registryctl:2.15.4-debian13@sha256:288012854dc7537ac3d31e14e74bfbffd5e852144da2104c765da52d101148c1
  HARBOR_TRIVY_ADAPTER_REFERENCE: dhi/harbor-trivy-adapter:2.15.4-debian13@sha256:042f36b283551007678f795d000409e90e26df0047f5557a5100d95be433277e
  HELM_VERSION: 4.1.4-2
  NGINX_REFERENCE: dhi/nginx:1.31.8-debian13@sha256:817a25d85857764f4359e9b13ecd1fd9c01d5002f27f0cd386c0ef6b03e31912
  SEMVER_MAJOR_MINOR_VERSION: "1.19"
  SEMVER_MAJOR_VERSION: "1"
  SEMVER_VERSION: 1.19.4
  VERSION: 1.19.4
contents:
  repositories:
    - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
  keyring:
    - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
  builds:
    - name: harbor-chart
      work-dir: ${source.dir}/harbor-helm
      contents:
        packages:
          - bash
          - ca-certificates
          - coreutils
          - perl
          - helm=4.1.4-2
        files:
          - url: git+https://github.com/goharbor/harbor-helm.git#v1.19.4
            checksum: 321159f4129ef8ccd4476047d4c96f582e2e036e
            path: ${source.dir}/harbor-helm
            uid: 0
            gid: 0
      pipeline:
        - name: prepare chart
          uses: helm/rudder@v1
          with:
            chart:
              appRef: harbor-core
              description: Docker Hardened Images Helm chart for Harbor
              images:
                - name: harbor-core
                  ref: dhi/harbor-core:2.15.4-debian13@sha256:2732127430e1d51fd406921e0671f52d30100781a91511a27e5482fa2cca938e
                - name: harbor-jobservice
                  ref: dhi/harbor-jobservice:2.15.4-debian13@sha256:c8db46364e9de65a20bc6d269096f08bbc4396522ad55fd8127396ccd2c503a5
                - name: harbor-registry
                  ref: dhi/harbor-registry:2.15.4-debian13@sha256:2381d5e99b5f88278dda6e742902eb98028d97f9f77fb0d1ee6859a0f125949c
                - name: harbor-registryctl
                  ref: dhi/harbor-registryctl:2.15.4-debian13@sha256:288012854dc7537ac3d31e14e74bfbffd5e852144da2104c765da52d101148c1
                - name: harbor-trivy-adapter
                  ref: dhi/harbor-trivy-adapter:2.15.4-debian13@sha256:042f36b283551007678f795d000409e90e26df0047f5557a5100d95be433277e
                - name: harbor-exporter
                  ref: dhi/harbor-exporter:2.15.4-debian13@sha256:9e3f14a868170839d930dae1869bc99b286c8ddd38c979b12d2424a40eba0dad
                - name: harbor-portal
                  ref: dhi/harbor-portal:2.15.4-debian13@sha256:cf396898683078e350eb17e8f9cbddf6512309b0944af41b5fc08846f4ee8730
                - name: harbor-db
                  ref: dhi/harbor-db:2.15.4-debian13@sha256:289dfb290f4bfb4a323ca1b82af2974a920d64805718359bf621b58a309357f6
                - name: harbor-redis
                  ref: dhi/harbor-redis:2.15.4-debian13@sha256:06dba21ea4ae90c15958b5ce80d39fa9d5c6213df2af493d0dc4b9dc9b51cc78
                - name: nginx
                  ref: dhi/nginx:1.31.8-debian13@sha256:817a25d85857764f4359e9b13ecd1fd9c01d5002f27f0cd386c0ef6b03e31912
              name: harbor-chart
              notes: ${source.dir}/config/NOTES.txt
              sourceUrl: https://github.com/goharbor/harbor
            cmd: prepare
            registry: dhi.io
        - name: patch security contexts
          runs: |
            set -eux -o pipefail

            TMPL="${source.dir}/harbor-helm/templates"

            # Replace each pod-level securityContext block with a Helm {{- with }} block
            # sourced from values.yaml. The indentation is read dynamically from the
            # securityContext: line itself so the replacement is correct regardless of
            # nesting depth, and the block match consumes all deeper-indented lines so
            # it is resilient to new fields being added upstream.
            patch_security_context() {
              local file="$1" path="$2"
              perl -i -0pe \
                's/( +)securityContext:\n(\1 +[^\n]*\n)+/my ($i,$n)=($1,length($1)+2); "${i}{{- with .Values.'"${path}"' }}\n${i}securityContext:\n${i}  {{- toYaml . | nindent $n }}\n${i}{{- end }}\n"/ge' \
                "$file"
            }

            patch_security_context "$TMPL/core/core-dpl.yaml" "core.podSecurityContext"
            patch_security_context "$TMPL/exporter/exporter-dpl.yaml" "exporter.podSecurityContext"
            patch_security_context "$TMPL/jobservice/jobservice-dpl.yaml" "jobservice.podSecurityContext"
            patch_security_context "$TMPL/portal/deployment.yaml" "portal.podSecurityContext"
            patch_security_context "$TMPL/trivy/trivy-sts.yaml" "trivy.podSecurityContext"
            patch_security_context "$TMPL/nginx/deployment.yaml" "nginx.podSecurityContext"
            patch_security_context "$TMPL/registry/registry-dpl.yaml" "registry.podSecurityContext"
            patch_security_context "$TMPL/database/database-ss.yaml" "database.internal.podSecurityContext"
            patch_security_context "$TMPL/redis/statefulset.yaml" "redis.internal.podSecurityContext"
        - name: relocate chart
          uses: helm/rudder@v1
          with:
            cmd: patch
            patches:
              from: ${source.dir}/config
            registry: dhi.io
        - name: lint
          uses: helm/cmd@v1
          with:
            chart: .
            cmd: lint .
        - name: package
          uses: helm/package@v1
          with:
            chart: .
      paths:
        - type: directory
          path: ${source.dir}/config
          uid: 0
          gid: 0
          mode: "0644"
          source: chart/harbor/config
