vars:
  CHART_COMMIT_SHA: 321159f4129ef8ccd4476047d4c96f582e2e036e
  CHART_HELM_NAME: harbor-chart
  DHI_NAMESPACE: dhi
  DHI_PREFIX: ""
  DHI_REGISTRY: dhi.io
  DHI_SKIP_CONTEXT_COPY: "true"
  HARBOR_CORE_REFERENCE: dhi/harbor-core:2.16.0-debian13@sha256:c8c57fe5ea2f7ff3c4979f3ee3b214ee5b53d5ee6364437b886095be93cc089f
  HARBOR_DB_REFERENCE: dhi/harbor-db:2.16.0-debian13@sha256:bc35134c7df0fe847455d220abdc433640575018495c0df88a516b021f196fb6
  HARBOR_EXPORTER_REFERENCE: dhi/harbor-exporter:2.16.0-debian13@sha256:3636c1bf76563278db06103e6ca376ce3474fcf1196bddb879ecaf970363c7e6
  HARBOR_JOBSERVICE_REFERENCE: dhi/harbor-jobservice:2.16.0-debian13@sha256:c076890c94c717886a6817d0b79f9091ede019e88c5c258914eef65439ada230
  HARBOR_PORTAL_REFERENCE: dhi/harbor-portal:2.16.0-debian13@sha256:9e7eb612997867115287fb603e6d7a0dcb570fec044231a207176e4c3b433d76
  HARBOR_REDIS_REFERENCE: dhi/harbor-redis:2.16.0-debian13@sha256:46903d48aa5eeeb4e3a8dbcfd39260ff1286853d4fab0b7989559679171c7f5f
  HARBOR_REGISTRY_REFERENCE: dhi/harbor-registry:2.16.0-debian13@sha256:a1266d54971d988de625a5e7b2a51108a1dd5df6216865191d11875363d35f1d
  HARBOR_REGISTRYCTL_REFERENCE: dhi/harbor-registryctl:2.16.0-debian13@sha256:a8a244e2c2591ce6d3047e9c81b0b62eb68ace074e03996551868be45b1b5277
  HARBOR_TRIVY_ADAPTER_REFERENCE: dhi/harbor-trivy-adapter:2.16.0-debian13@sha256:4a5de3bb0313b6f22e07879f8733121c52aac85745adbaf8232995cbb2e1f862
  HELM_VERSION: 4.1.4-2
  NGINX_REFERENCE: dhi/nginx:1.31.9-debian13@sha256:3f4e3afc1bf4ecc0e2b3877d0c4d95e605fa9fff39e44918f95f4e1289af92be
  SEMVER_MAJOR_MINOR_VERSION: "1.19"
  SEMVER_MAJOR_VERSION: "1"
  SEMVER_VERSION: 1.19.4
  VERSION: 1.19.4
contents:
  repositories:
    - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
  keyring:
    - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
  builds:
    - name: harbor-chart
      work-dir: ${source.dir}/harbor-helm
      contents:
        packages:
          - bash
          - ca-certificates
          - coreutils
          - perl
          - helm=4.1.4-2
        files:
          - url: git+https://github.com/goharbor/harbor-helm.git#v1.19.4
            checksum: 321159f4129ef8ccd4476047d4c96f582e2e036e
            path: ${source.dir}/harbor-helm
            uid: 0
            gid: 0
      pipeline:
        - name: prepare chart
          uses: helm/rudder@v1
          with:
            chart:
              appRef: harbor-core
              description: Docker Hardened Images Helm chart for Harbor
              images:
                - name: harbor-core
                  ref: dhi/harbor-core:2.16.0-debian13@sha256:c8c57fe5ea2f7ff3c4979f3ee3b214ee5b53d5ee6364437b886095be93cc089f
                - name: harbor-jobservice
                  ref: dhi/harbor-jobservice:2.16.0-debian13@sha256:c076890c94c717886a6817d0b79f9091ede019e88c5c258914eef65439ada230
                - name: harbor-registry
                  ref: dhi/harbor-registry:2.16.0-debian13@sha256:a1266d54971d988de625a5e7b2a51108a1dd5df6216865191d11875363d35f1d
                - name: harbor-registryctl
                  ref: dhi/harbor-registryctl:2.16.0-debian13@sha256:a8a244e2c2591ce6d3047e9c81b0b62eb68ace074e03996551868be45b1b5277
                - name: harbor-trivy-adapter
                  ref: dhi/harbor-trivy-adapter:2.16.0-debian13@sha256:4a5de3bb0313b6f22e07879f8733121c52aac85745adbaf8232995cbb2e1f862
                - name: harbor-exporter
                  ref: dhi/harbor-exporter:2.16.0-debian13@sha256:3636c1bf76563278db06103e6ca376ce3474fcf1196bddb879ecaf970363c7e6
                - name: harbor-portal
                  ref: dhi/harbor-portal:2.16.0-debian13@sha256:9e7eb612997867115287fb603e6d7a0dcb570fec044231a207176e4c3b433d76
                - name: harbor-db
                  ref: dhi/harbor-db:2.16.0-debian13@sha256:bc35134c7df0fe847455d220abdc433640575018495c0df88a516b021f196fb6
                - name: harbor-redis
                  ref: dhi/harbor-redis:2.16.0-debian13@sha256:46903d48aa5eeeb4e3a8dbcfd39260ff1286853d4fab0b7989559679171c7f5f
                - name: nginx
                  ref: dhi/nginx:1.31.9-debian13@sha256:3f4e3afc1bf4ecc0e2b3877d0c4d95e605fa9fff39e44918f95f4e1289af92be
              name: harbor-chart
              notes: ${source.dir}/config/NOTES.txt
              sourceUrl: https://github.com/goharbor/harbor
            cmd: prepare
            registry: dhi.io
        - name: patch security contexts
          runs: |
            set -eux -o pipefail

            TMPL="${source.dir}/harbor-helm/templates"

            # Replace each pod-level securityContext block with a Helm {{- with }} block
            # sourced from values.yaml. The indentation is read dynamically from the
            # securityContext: line itself so the replacement is correct regardless of
            # nesting depth, and the block match consumes all deeper-indented lines so
            # it is resilient to new fields being added upstream.
            patch_security_context() {
              local file="$1" path="$2"
              perl -i -0pe \
                's/( +)securityContext:\n(\1 +[^\n]*\n)+/my ($i,$n)=($1,length($1)+2); "${i}{{- with .Values.'"${path}"' }}\n${i}securityContext:\n${i}  {{- toYaml . | nindent $n }}\n${i}{{- end }}\n"/ge' \
                "$file"
            }

            patch_security_context "$TMPL/core/core-dpl.yaml" "core.podSecurityContext"
            patch_security_context "$TMPL/exporter/exporter-dpl.yaml" "exporter.podSecurityContext"
            patch_security_context "$TMPL/jobservice/jobservice-dpl.yaml" "jobservice.podSecurityContext"
            patch_security_context "$TMPL/portal/deployment.yaml" "portal.podSecurityContext"
            patch_security_context "$TMPL/trivy/trivy-sts.yaml" "trivy.podSecurityContext"
            patch_security_context "$TMPL/nginx/deployment.yaml" "nginx.podSecurityContext"
            patch_security_context "$TMPL/registry/registry-dpl.yaml" "registry.podSecurityContext"
            patch_security_context "$TMPL/database/database-ss.yaml" "database.internal.podSecurityContext"
            patch_security_context "$TMPL/redis/statefulset.yaml" "redis.internal.podSecurityContext"
        - name: relocate chart
          uses: helm/rudder@v1
          with:
            cmd: patch
            patches:
              from: ${source.dir}/config
            registry: dhi.io
        - name: lint
          uses: helm/cmd@v1
          with:
            chart: .
            cmd: lint .
        - name: package
          uses: helm/package@v1
          with:
            chart: .
      paths:
        - type: directory
          path: ${source.dir}/config
          uid: 0
          gid: 0
          mode: "0644"
          source: chart/harbor/config
