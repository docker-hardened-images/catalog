name: NATS Helm chart 2.x
image: dhi.io/nats-chart
variant: helm
tags:
  - 2.15.0
platforms:
  - linux/amd64
vars:
  APPVERSION: 2.15.0
  CHART_COMMIT_SHA: e3075e17d4ccaaf61f5502b65c32c25dc12504f2
  CHART_HELM_NAME: nats-chart
  DHI_NAMESPACE: dhi
