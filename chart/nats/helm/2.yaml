  DHI_REGISTRY: dhi.io
  DHI_SKIP_CONTEXT_COPY: "true"
  HELM_VERSION: 4.1.4-2
  NATS_BOX_REFERENCE: dhi/nats-box:0.20.0-debian13-compat@sha256:6a4e5b3cbebddbdde84a7f701b68db8e28724cfa4976c049ee3ee04e345a7833
  NATS_REFERENCE: dhi/nats:2.15.0-debian13@sha256:96383e07b4b1e042e1b38b068106da78f42602091e6c676bc3841d9c812f11cc
  NATS_SERVER_CONFIG_RELOADER_REFERENCE: dhi/nats-server-config-reloader:0.24.0-debian13@sha256:4aa5e639aa3213b14ac9711792470f89b0845cca8c98adf0272bfe6b332c35e7
  PROMETHEUS_NATS_EXPORTER_REFERENCE: dhi/prometheus-nats-exporter:0.20.2-debian13@sha256:96cbd83717b47086c66ff5c6586e49488e872c6212914b29ff507dfa9a027fd6
  SEMVER_MAJOR_MINOR_VERSION: "2.15"
  SEMVER_MAJOR_VERSION: "2"
  SEMVER_VERSION: 2.15.0
  VERSION: 2.15.0
contents:
  repositories:
    - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
  keyring:
    - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
  builds:
    - name: nats
      work-dir: ${source.dir}/helm-charts/helm/charts/nats
      contents:
        packages:
          - bash
          - ca-certificates
          - coreutils
          - helm=4.1.4-2
        files:
          - url: git+https://github.com/nats-io/k8s.git#nats-2.15.0
            checksum: e3075e17d4ccaaf61f5502b65c32c25dc12504f2
            path: ${source.dir}/helm-charts
            uid: 0
            gid: 0
      pipeline:
        - name: prepare chart
          uses: helm/rudder@v1
          with:
            chart:
              appRef: nats
              description: Docker Hardened Images Helm chart for NATS
              images:
                - name: nats
                  ref: dhi/nats:2.15.0-debian13@sha256:96383e07b4b1e042e1b38b068106da78f42602091e6c676bc3841d9c812f11cc
                - name: nats-server-config-reloader
                  ref: dhi/nats-server-config-reloader:0.24.0-debian13@sha256:4aa5e639aa3213b14ac9711792470f89b0845cca8c98adf0272bfe6b332c35e7
                - name: prometheus-nats-exporter
                  ref: dhi/prometheus-nats-exporter:0.20.2-debian13@sha256:96cbd83717b47086c66ff5c6586e49488e872c6212914b29ff507dfa9a027fd6
                - name: nats-box
                  ref: dhi/nats-box:0.20.0-debian13-compat@sha256:6a4e5b3cbebddbdde84a7f701b68db8e28724cfa4976c049ee3ee04e345a7833
              name: nats-chart
              notes: ${source.dir}/config/NOTES.txt
              sourceUrl: https://github.com/nats-io/k8s
            cmd: prepare
            registry: dhi.io
        - name: relocate chart
          uses: helm/rudder@v1
          with:
            cmd: patch
            patches:
              from: ${source.dir}/config
            registry: dhi.io
        - name: update dependencies
          uses: helm/cmd@v1
          with:
            chart: .
            cmd: dependency update
        - name: lint
          uses: helm/cmd@v1
          with:
            chart: .
            cmd: lint .
        - name: package
          uses: helm/package@v1
          with:
            chart: .
      paths:
        - type: directory
          path: ${source.dir}/config
          uid: 0
          gid: 0
          mode: "0644"
          source: chart/nats/config
