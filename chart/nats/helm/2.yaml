  NATS_REFERENCE: dhi/nats:2.15.2-debian13@sha256:c02034dfcb5aadbb15a5d5769171a8b8aa7813ddb8ff433d60e48d8415448232
  NATS_SERVER_CONFIG_RELOADER_REFERENCE: dhi/nats-server-config-reloader:0.25.0-debian13@sha256:3ab769ceb08e2e5ef83774b3f7048951c86096c6f39bc1f04144b3b43354591f
  PROMETHEUS_NATS_EXPORTER_REFERENCE: dhi/prometheus-nats-exporter:0.20.3-debian13@sha256:2535c142cf48aa170abae6c7d5d66a63d9bb514c422fa9d55d44956c3449fe58
  SEMVER_MAJOR_MINOR_VERSION: "2.15"
  SEMVER_MAJOR_VERSION: "2"
  SEMVER_VERSION: 2.15.2
  VERSION: 2.15.2
contents:
  repositories:
    - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
  keyring:
    - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
  builds:
    - name: nats
      work-dir: ${source.dir}/helm-charts/helm/charts/nats
      contents:
        packages:
          - bash
          - ca-certificates
          - coreutils
          - helm=4.1.4-2
        files:
          - url: git+https://github.com/nats-io/k8s.git#nats-2.15.2
            checksum: 0f9c5c75851d113fc9e1fd00edd3034de62ab14c
            path: ${source.dir}/helm-charts
            uid: 0
            gid: 0
      pipeline:
        - name: prepare chart
          uses: helm/rudder@v1
          with:
            chart:
              appRef: nats
              description: Docker Hardened Images Helm chart for NATS
              images:
                - name: nats
                  ref: dhi/nats:2.15.2-debian13@sha256:c02034dfcb5aadbb15a5d5769171a8b8aa7813ddb8ff433d60e48d8415448232
                - name: nats-server-config-reloader
                  ref: dhi/nats-server-config-reloader:0.25.0-debian13@sha256:3ab769ceb08e2e5ef83774b3f7048951c86096c6f39bc1f04144b3b43354591f
                - name: prometheus-nats-exporter
                  ref: dhi/prometheus-nats-exporter:0.20.3-debian13@sha256:2535c142cf48aa170abae6c7d5d66a63d9bb514c422fa9d55d44956c3449fe58
                - name: nats-box
                  ref: dhi/nats-box:0.20.1-debian13-compat@sha256:5aaedb5827b76e9afa14bbe0ec7abe195bd6eb6a3d0a627aef30c5295d6179fa
              name: nats-chart
              notes: ${source.dir}/config/NOTES.txt
              sourceUrl: https://github.com/nats-io/k8s
            cmd: prepare
            registry: dhi.io
        - name: relocate chart
          uses: helm/rudder@v1
          with:
            cmd: patch
            patches:
              from: ${source.dir}/config
            registry: dhi.io
        - name: update dependencies
          uses: helm/cmd@v1
          with:
            chart: .
            cmd: dependency update
        - name: lint
          uses: helm/cmd@v1
          with:
            chart: .
            cmd: lint .
        - name: package
          uses: helm/package@v1
          with:
            chart: .
      paths:
        - type: directory
          path: ${source.dir}/config
          uid: 0
          gid: 0
          mode: "0644"
          source: chart/nats/config
