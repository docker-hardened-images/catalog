  PROMETHEUS_NATS_EXPORTER_REFERENCE: dhi/prometheus-nats-exporter:0.20.3-debian13@sha256:408377519996e1399d848376ae008fa1924b3a8bea18071898e6c9688e95be12
  SEMVER_MAJOR_MINOR_VERSION: "2.15"
  SEMVER_MAJOR_VERSION: "2"
  SEMVER_VERSION: 2.15.2
  VERSION: 2.15.2
contents:
  repositories:
    - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
  keyring:
    - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
  builds:
    - name: nats
      work-dir: ${source.dir}/helm-charts/helm/charts/nats
      contents:
        packages:
          - bash
          - ca-certificates
          - coreutils
          - helm=4.1.4-2
        files:
          - url: git+https://github.com/nats-io/k8s.git#nats-2.15.2
            checksum: 0f9c5c75851d113fc9e1fd00edd3034de62ab14c
            path: ${source.dir}/helm-charts
            uid: 0
            gid: 0
      pipeline:
        - name: prepare chart
          uses: helm/rudder@v1
          with:
            chart:
              appRef: nats
              description: Docker Hardened Images Helm chart for NATS
              images:
                - name: nats
                  ref: dhi/nats:2.15.2-debian13@sha256:badfedc1528b0e053ca3140b0be64ea2e323091e819820b6dc52783271ac0152
                - name: nats-server-config-reloader
                  ref: dhi/nats-server-config-reloader:0.25.0-debian13@sha256:05e7e5e0f68613ecc3deac53a31df4e775128dd399cb5f78952be450f343369e
                - name: prometheus-nats-exporter
                  ref: dhi/prometheus-nats-exporter:0.20.3-debian13@sha256:408377519996e1399d848376ae008fa1924b3a8bea18071898e6c9688e95be12
                - name: nats-box
                  ref: dhi/nats-box:0.20.1-debian13-compat@sha256:a9c874d4c0d7bb7f4ccd399ff34b26f7f76711e5190ec3319cbdebd0641b1023
              name: nats-chart
              notes: ${source.dir}/config/NOTES.txt
              sourceUrl: https://github.com/nats-io/k8s
            cmd: prepare
            registry: dhi.io
        - name: relocate chart
          uses: helm/rudder@v1
          with:
            cmd: patch
            patches:
              from: ${source.dir}/config
            registry: dhi.io
        - name: update dependencies
          uses: helm/cmd@v1
          with:
            chart: .
            cmd: dependency update
        - name: lint
          uses: helm/cmd@v1
          with:
            chart: .
            cmd: lint .
        - name: package
          uses: helm/package@v1
          with:
            chart: .
      paths:
        - type: directory
          path: ${source.dir}/config
          uid: 0
          gid: 0
          mode: "0644"
          source: chart/nats/config
