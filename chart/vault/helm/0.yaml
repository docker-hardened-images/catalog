  VAULT_HELM_REFERENCE: dhi/vault:2.2.1-debian13-helm@sha256:fa1fc3d904d6517e13f506696469776625d44a239cb91b3fc2a46c4606032215
  VAULT_K8S_REFERENCE: dhi/vault-k8s:1.7.7-debian13@sha256:ec6981bd3e39eb827c9463320c034c4be7e546173a499c61932e25c1bb430341
  VAULT_REFERENCE: dhi/vault:2.2.1-debian13@sha256:8014424f1bb2c60f38eff1123a45123a69954d57eaafa7973950e1d1dbecae1b
  VERSION: 0.34.1
contents:
  repositories:
    - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
  keyring:
    - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
  builds:
    - name: vault
      work-dir: ${source.dir}/helm-charts
      contents:
        packages:
          - bash
          - ca-certificates
          - coreutils
          - helm=4.1.4-2
        files:
          - url: git+https://github.com/hashicorp/vault-helm.git#v0.34.1
            checksum: aa1c92e4adddbce9660e536dfe5222a88eda6d52
            path: ${source.dir}/helm-charts
            uid: 0
            gid: 0
      pipeline:
        - name: prepare chart
          uses: helm/rudder@v1
          with:
            chart:
              appRef: vault
              description: Docker Hardened Images Helm chart for Vault
              images:
                - name: vault
                  ref: dhi/vault:2.2.1-debian13@sha256:8014424f1bb2c60f38eff1123a45123a69954d57eaafa7973950e1d1dbecae1b
                - name: vault-helm
                  ref: dhi/vault:2.2.1-debian13-helm@sha256:fa1fc3d904d6517e13f506696469776625d44a239cb91b3fc2a46c4606032215
                - name: vault-k8s
                  ref: dhi/vault-k8s:1.7.7-debian13@sha256:ec6981bd3e39eb827c9463320c034c4be7e546173a499c61932e25c1bb430341
                - name: vault-csi-provider
                  ref: dhi/vault-csi-provider:1.7.4-debian13@sha256:95015aa3a0ea72dbaa5b2dbe020e5060d2b511584f5c79fff29f429c13faa0f0
              name: vault-chart
              notes: ${source.dir}/config/NOTES.txt
              sourceUrl: https://github.com/hashicorp/vault-helm
            cmd: prepare
            registry: dhi.io
        - name: relocate chart
          uses: helm/rudder@v1
          with:
            cmd: patch
            patches:
              from: ${source.dir}/config
            registry: dhi.io
        - name: update dependencies
          uses: helm/cmd@v1
          with:
            chart: .
            cmd: dependency update
        - name: lint
          uses: helm/cmd@v1
          with:
            chart: .
            cmd: lint .
        - name: package
          uses: helm/package@v1
          with:
            chart: .
      paths:
        - type: directory
          path: ${source.dir}/config
          uid: 0
          gid: 0
          mode: "0644"
          source: chart/vault/config
