# syntax=dhi.io/build:2-helm3

name: Vault Helm chart 0.x
image: dhi.io/vault-chart
variant: helm
tags:
  - 0.34.1
platforms:
  - linux/amd64
vars:
  APPVERSION: 2.0.4
  CHART_COMMIT_SHA: aa1c92e4adddbce9660e536dfe5222a88eda6d52
  CHART_HELM_NAME: vault-chart
  DHI_NAMESPACE: dhi
  DHI_PREFIX: ""
  DHI_REGISTRY: dhi.io
  DHI_SKIP_CONTEXT_COPY: "true"
  HELM_VERSION: 4.1.4-2
  SEMVER_MAJOR_MINOR_VERSION: "0.34"
  SEMVER_MAJOR_VERSION: "0"
  SEMVER_VERSION: 0.34.1
  VAULT_CSI_PROVIDER_REFERENCE: dhi/vault-csi-provider:1.7.4-debian13@sha256:3feeb67bf7f70aa024a2cb3655ad9c65b14152a4350da482d1015e7822b9e263
  VAULT_HELM_REFERENCE: dhi/vault:2.2.1-debian13-helm@sha256:ef647631c4f61eb86ca7a226efab3ee34e7ca1b1e87e4ccb27d01e1f32b3ffeb
  VAULT_K8S_REFERENCE: dhi/vault-k8s:1.7.7-debian13@sha256:76733c172d12cb27ee59b24083a6310044fdf4552822a344792bc67f9a7e5058
  VAULT_REFERENCE: dhi/vault:2.2.1-debian13@sha256:3222af6d2d773c5e58ac272ba2c916d957572cfdcb2a001e88dd1aacb785e0d2
  VERSION: 0.34.1
contents:
  repositories:
    - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
  keyring:
    - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
  builds:
    - name: vault
      work-dir: ${source.dir}/helm-charts
      contents:
        packages:
          - bash
          - ca-certificates
          - coreutils
          - helm=4.1.4-2
        files:
          - url: git+https://github.com/hashicorp/vault-helm.git#v0.34.1
            checksum: aa1c92e4adddbce9660e536dfe5222a88eda6d52
            path: ${source.dir}/helm-charts
            uid: 0
            gid: 0
      pipeline:
        - name: prepare chart
          uses: helm/rudder@v1
          with:
            chart:
              appRef: vault
              description: Docker Hardened Images Helm chart for Vault
              images:
                - name: vault
                  ref: dhi/vault:2.2.1-debian13@sha256:3222af6d2d773c5e58ac272ba2c916d957572cfdcb2a001e88dd1aacb785e0d2
                - name: vault-helm
                  ref: dhi/vault:2.2.1-debian13-helm@sha256:ef647631c4f61eb86ca7a226efab3ee34e7ca1b1e87e4ccb27d01e1f32b3ffeb
                - name: vault-k8s
                  ref: dhi/vault-k8s:1.7.7-debian13@sha256:76733c172d12cb27ee59b24083a6310044fdf4552822a344792bc67f9a7e5058
                - name: vault-csi-provider
                  ref: dhi/vault-csi-provider:1.7.4-debian13@sha256:3feeb67bf7f70aa024a2cb3655ad9c65b14152a4350da482d1015e7822b9e263
              name: vault-chart
              notes: ${source.dir}/config/NOTES.txt
              sourceUrl: https://github.com/hashicorp/vault-helm
            cmd: prepare
            registry: dhi.io
        - name: relocate chart
          uses: helm/rudder@v1
          with:
            cmd: patch
            patches:
              from: ${source.dir}/config
            registry: dhi.io
        - name: update dependencies
          uses: helm/cmd@v1
          with:
            chart: .
            cmd: dependency update
        - name: lint
          uses: helm/cmd@v1
          with:
            chart: .
            cmd: lint .
        - name: package
          uses: helm/package@v1
          with:
            chart: .
      paths:
        - type: directory
          path: ${source.dir}/config
          uid: 0
          gid: 0
          mode: "0644"
          source: chart/vault/config
