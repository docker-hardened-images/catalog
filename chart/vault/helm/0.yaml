  VERSION: 0.34.1
contents:
  repositories:
    - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
  keyring:
    - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
  builds:
    - name: vault
      work-dir: ${source.dir}/helm-charts
      contents:
        packages:
          - bash
          - ca-certificates
          - coreutils
          - helm=4.1.4-2
        files:
          - url: git+https://github.com/hashicorp/vault-helm.git#v0.34.1
            checksum: aa1c92e4adddbce9660e536dfe5222a88eda6d52
            path: ${source.dir}/helm-charts
            uid: 0
            gid: 0
      pipeline:
        - name: prepare chart
          uses: helm/rudder@v1
          with:
            chart:
              appRef: vault
              description: Docker Hardened Images Helm chart for Vault
              images:
                - name: vault
                  ref: dhi/vault:2.2.1-debian13@sha256:535d766abd7c79efe0f27cb656d969e89d760ffc4174e6d02a6b991ffe5b75b1
                - name: vault-helm
                  ref: dhi/vault:2.2.1-debian13-helm@sha256:2dc51d56e5c7541a49d112a5cdb976c378bd0b564105930c305591e58fa27add
