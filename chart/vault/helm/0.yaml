  HELM_VERSION: 4.1.4-2
  SEMVER_MAJOR_MINOR_VERSION: "0.34"
  SEMVER_MAJOR_VERSION: "0"
  SEMVER_VERSION: 0.34.1
  VAULT_CSI_PROVIDER_REFERENCE: dhi/vault-csi-provider:1.7.4-debian13@sha256:ad615867fdf6cc27a183fc48853130e18adfe4666b5b90dd716a3776a0450088
  VAULT_HELM_REFERENCE: dhi/vault:2.2.1-debian13-helm@sha256:e242df8ad4fec8dbe698f2988dfcd11cad1f8870cd77c873b3a18deb92600632
  VAULT_K8S_REFERENCE: dhi/vault-k8s:1.7.7-debian13@sha256:8061eee9217019b81a67a62cbda340921f5912f0d05e9cdb0c3a0fc465af8adf
  VAULT_REFERENCE: dhi/vault:2.2.1-debian13@sha256:c12bd4ce41b8061dbc20586ef5794a0543f7d684d4e21c00af778c4aad6ad464
  VERSION: 0.34.1
contents:
  repositories:
    - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
  keyring:
    - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
  builds:
    - name: vault
      work-dir: ${source.dir}/helm-charts
      contents:
        packages:
          - bash
          - ca-certificates
          - coreutils
          - helm=4.1.4-2
        files:
          - url: git+https://github.com/hashicorp/vault-helm.git#v0.34.1
            checksum: aa1c92e4adddbce9660e536dfe5222a88eda6d52
            path: ${source.dir}/helm-charts
            uid: 0
            gid: 0
      pipeline:
        - name: prepare chart
          uses: helm/rudder@v1
          with:
            chart:
              appRef: vault
              description: Docker Hardened Images Helm chart for Vault
              images:
                - name: vault
                  ref: dhi/vault:2.2.1-debian13@sha256:c12bd4ce41b8061dbc20586ef5794a0543f7d684d4e21c00af778c4aad6ad464
                - name: vault-helm
                  ref: dhi/vault:2.2.1-debian13-helm@sha256:e242df8ad4fec8dbe698f2988dfcd11cad1f8870cd77c873b3a18deb92600632
                - name: vault-k8s
                  ref: dhi/vault-k8s:1.7.7-debian13@sha256:8061eee9217019b81a67a62cbda340921f5912f0d05e9cdb0c3a0fc465af8adf
                - name: vault-csi-provider
                  ref: dhi/vault-csi-provider:1.7.4-debian13@sha256:ad615867fdf6cc27a183fc48853130e18adfe4666b5b90dd716a3776a0450088
              name: vault-chart
              notes: ${source.dir}/config/NOTES.txt
              sourceUrl: https://github.com/hashicorp/vault-helm
            cmd: prepare
            registry: dhi.io
        - name: relocate chart
          uses: helm/rudder@v1
          with:
            cmd: patch
            patches:
              from: ${source.dir}/config
            registry: dhi.io
        - name: update dependencies
          uses: helm/cmd@v1
          with:
            chart: .
            cmd: dependency update
        - name: lint
          uses: helm/cmd@v1
          with:
            chart: .
            cmd: lint .
        - name: package
          uses: helm/package@v1
          with:
            chart: .
      paths:
        - type: directory
          path: ${source.dir}/config
          uid: 0
          gid: 0
          mode: "0644"
          source: chart/vault/config
