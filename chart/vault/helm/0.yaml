        files:
          - url: git+https://github.com/hashicorp/vault-helm.git#v0.34.1
            checksum: aa1c92e4adddbce9660e536dfe5222a88eda6d52
            path: ${source.dir}/helm-charts
            uid: 0
            gid: 0
      pipeline:
        - name: prepare chart
          uses: helm/rudder@v1
          with:
            chart:
              appRef: vault
              description: Docker Hardened Images Helm chart for Vault
              images:
                - name: vault
                  ref: dhi/vault:2.1.1-debian13@sha256:05cfdd89a5e78a83fb3b299320470483e58a5b3ff2ebbb33cd27e7d07bc82f18
                - name: vault-helm
                  ref: dhi/vault:2.1.1-debian13-helm@sha256:84cd90f2ba372cf5ec6892ccb6d87aa3bb57a0f1d16a3ac00b09ca164a90549f
                - name: vault-k8s
