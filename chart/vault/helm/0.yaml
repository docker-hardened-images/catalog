  VAULT_HELM_REFERENCE: dhi/vault:2.1.1-debian13-helm@sha256:6c0e91614d300ce67ad2ded5667f07d9d5069492a65083478202995b03ac4e21
  VAULT_K8S_REFERENCE: dhi/vault-k8s:1.7.6-debian13@sha256:9b25e50d86685e16b772880641468db6608e6449cb88d97c33931c4bbf31ef26
  VAULT_REFERENCE: dhi/vault:2.1.1-debian13@sha256:9cb9a10659e975465d8b27d062e5edebd33dc3652b18ba7d4cae263233dadb75
  VERSION: 0.34.1
contents:
  repositories:
    - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
  keyring:
    - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
  builds:
    - name: vault
      work-dir: ${source.dir}/helm-charts
      contents:
        packages:
          - bash
          - ca-certificates
          - coreutils
          - helm=4.1.4-2
        files:
          - url: git+https://github.com/hashicorp/vault-helm.git#v0.34.1
            checksum: aa1c92e4adddbce9660e536dfe5222a88eda6d52
            path: ${source.dir}/helm-charts
            uid: 0
            gid: 0
      pipeline:
        - name: prepare chart
          uses: helm/rudder@v1
          with:
            chart:
              appRef: vault
              description: Docker Hardened Images Helm chart for Vault
              images:
                - name: vault
                  ref: dhi/vault:2.1.1-debian13@sha256:9cb9a10659e975465d8b27d062e5edebd33dc3652b18ba7d4cae263233dadb75
                - name: vault-helm
                  ref: dhi/vault:2.1.1-debian13-helm@sha256:6c0e91614d300ce67ad2ded5667f07d9d5069492a65083478202995b03ac4e21
                - name: vault-k8s
                  ref: dhi/vault-k8s:1.7.6-debian13@sha256:9b25e50d86685e16b772880641468db6608e6449cb88d97c33931c4bbf31ef26
                - name: vault-csi-provider
                  ref: dhi/vault-csi-provider:1.7.4-debian13@sha256:6d55f95ec33f29bfce1f1432265b90e610dcac0fa3277c5171d36793d9989902
              name: vault-chart
              notes: ${source.dir}/config/NOTES.txt
              sourceUrl: https://github.com/hashicorp/vault-helm
            cmd: prepare
            registry: dhi.io
        - name: relocate chart
          uses: helm/rudder@v1
          with:
            cmd: patch
            patches:
              from: ${source.dir}/config
            registry: dhi.io
        - name: update dependencies
          uses: helm/cmd@v1
          with:
            chart: .
            cmd: dependency update
        - name: lint
          uses: helm/cmd@v1
          with:
            chart: .
            cmd: lint .
        - name: package
          uses: helm/package@v1
          with:
            chart: .
      paths:
        - type: directory
          path: ${source.dir}/config
          uid: 0
          gid: 0
          mode: "0644"
          source: chart/vault/config
