  VAULT_CSI_PROVIDER_REFERENCE: dhi/vault-csi-provider:1.7.4-debian13@sha256:42bc9cf7cc44b4649c6b92fec3a467436cb81e2398f06aa4079024748e045445
  VAULT_HELM_REFERENCE: dhi/vault:2.2.1-debian13-helm@sha256:5a2dc2fdb59ef4e77b0e0c910c1e2f8ac32f08ddf485f4061fb426953eafb597
  VAULT_K8S_REFERENCE: dhi/vault-k8s:1.7.6-debian13@sha256:f409b117b2e9e16059f88412d9f05726434e871093c30dfb34477e879af75d8b
  VAULT_REFERENCE: dhi/vault:2.2.1-debian13@sha256:7049955874099675ddddb2f64ecef561dbfdcbab4287bf6268122f04ef4b490c
  VERSION: 0.34.1
contents:
  repositories:
    - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
  keyring:
    - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
  builds:
    - name: vault
      work-dir: ${source.dir}/helm-charts
      contents:
        packages:
          - bash
          - ca-certificates
          - coreutils
          - helm=4.1.4-2
        files:
          - url: git+https://github.com/hashicorp/vault-helm.git#v0.34.1
            checksum: aa1c92e4adddbce9660e536dfe5222a88eda6d52
            path: ${source.dir}/helm-charts
            uid: 0
            gid: 0
      pipeline:
        - name: prepare chart
          uses: helm/rudder@v1
          with:
            chart:
              appRef: vault
              description: Docker Hardened Images Helm chart for Vault
              images:
                - name: vault
                  ref: dhi/vault:2.2.1-debian13@sha256:7049955874099675ddddb2f64ecef561dbfdcbab4287bf6268122f04ef4b490c
                - name: vault-helm
                  ref: dhi/vault:2.2.1-debian13-helm@sha256:5a2dc2fdb59ef4e77b0e0c910c1e2f8ac32f08ddf485f4061fb426953eafb597
                - name: vault-k8s
                  ref: dhi/vault-k8s:1.7.6-debian13@sha256:f409b117b2e9e16059f88412d9f05726434e871093c30dfb34477e879af75d8b
                - name: vault-csi-provider
                  ref: dhi/vault-csi-provider:1.7.4-debian13@sha256:42bc9cf7cc44b4649c6b92fec3a467436cb81e2398f06aa4079024748e045445
              name: vault-chart
              notes: ${source.dir}/config/NOTES.txt
              sourceUrl: https://github.com/hashicorp/vault-helm
            cmd: prepare
            registry: dhi.io
        - name: relocate chart
          uses: helm/rudder@v1
          with:
            cmd: patch
            patches:
              from: ${source.dir}/config
            registry: dhi.io
        - name: update dependencies
          uses: helm/cmd@v1
          with:
            chart: .
            cmd: dependency update
        - name: lint
          uses: helm/cmd@v1
          with:
            chart: .
            cmd: lint .
        - name: package
          uses: helm/package@v1
          with:
            chart: .
      paths:
        - type: directory
          path: ${source.dir}/config
          uid: 0
          gid: 0
          mode: "0644"
          source: chart/vault/config
