  VAULT_HELM_REFERENCE: dhi/vault:2.2.1-debian13-helm@sha256:a83d2828b719398893a65102f2887853c9c6e3f4342dd2dd32854536aaacc3fb
  VAULT_K8S_REFERENCE: dhi/vault-k8s:1.7.7-debian13@sha256:e44e4d5e75b83b1d6bebeddb09f0071b651abfcb9195c164f4a2e9a2d54e3204
