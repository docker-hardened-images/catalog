        files:
          - url: git+https://github.com/hashicorp/vault-helm.git#v0.34.1
            checksum: aa1c92e4adddbce9660e536dfe5222a88eda6d52
            path: ${source.dir}/helm-charts
            uid: 0
            gid: 0
      pipeline:
        - name: prepare chart
          uses: helm/rudder@v1
          with:
            chart:
              appRef: vault
              description: Docker Hardened Images Helm chart for Vault
              images:
                - name: vault
                  ref: dhi/vault:2.1.2-debian13@sha256:e97f4d6e7a3776125a11e4b25cd422cc1d9fefc10c9b6e71794f416e4124ebc7
                - name: vault-helm
