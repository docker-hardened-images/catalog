# syntax=dhi.io/build:2-helm3

name: Argo CD Helm chart 10.x
image: dhi.io/argocd-chart
variant: helm
tags:
  - 10.9.2
platforms:
  - linux/amd64
vars:
  ARGOCD_REFERENCE: dhi/argocd:3.5.3-debian13@sha256:3410c32abd3fd68e1e320bc3ec2219f24433aaa0e2c1483caef23feca55d2a03
  CHART_COMMIT_SHA: 949752e5840abcbecc1fff5533e2fda07c8e3bb7
  CHART_HELM_NAME: argocd-chart
  DEX_REFERENCE: dhi/dex:2.45.1-debian13@sha256:442bb36d98fdcde3a23dcae6654a6ebb981190ea97f9e9be1b4dace19c524905
  DHI_NAMESPACE: dhi
  DHI_PREFIX: ""
  DHI_REGISTRY: dhi.io
  DHI_SKIP_CONTEXT_COPY: "true"
  HAPROXY_CHART_REFERENCE: dhi/haproxy-chart:1.30.2@sha256:f556bf52877bc0005a36416b9e5c7478eb9b14d86bf3cda8022632b72a790c77
  HELM_VERSION: 4.1.4-2
  REDIS_CHART_REFERENCE: dhi/redis-chart:23.0.7@sha256:05649497f67bb737f4bad0b3f578f04eeba913adee8784c1e7367c0cc17f12a5
  REDIS_EXPORTER_REFERENCE: dhi/redis-exporter:1.92.1-debian13@sha256:b66d9f4793ec318e4c4090d8a86275e5ed88022d0ffe43d43417a108fa9d7ea7
  REDIS_REFERENCE: dhi/redis:8.10.2-debian13-compat@sha256:9008acf6e2804fe8da637172fe789309be542079359804e50ace38596647d2d2
  SEMVER_MAJOR_MINOR_VERSION: "10.9"
  SEMVER_MAJOR_VERSION: "10"
  SEMVER_VERSION: 10.9.2
  VERSION: 10.9.2
contents:
  repositories:
    - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
  keyring:
    - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
  builds:
    - name: argocd
      contents:
        packages:
          - bash
          - ca-certificates
          - coreutils
          - sed
          - yq-go
          - helm=4.1.4-2
        files:
          - url: git+https://github.com/argoproj/argo-helm#argo-cd-10.9.2
            checksum: 949752e5840abcbecc1fff5533e2fda07c8e3bb7
            path: ${source.dir}/helm-charts
            uid: 0
            gid: 0
      pipeline:
        - name: prepare chart
          uses: helm/rudder@v1
          work-dir: ${source.dir}/helm-charts/charts/argo-cd
          with:
            chart:
              appRef: argocd
              dependencies:
                - alias: redis-ha
                  condition: redis-ha.enabled
                  name: redis-ha
                  ref: dhi/redis-chart:23.0.7@sha256:05649497f67bb737f4bad0b3f578f04eeba913adee8784c1e7367c0cc17f12a5
                - alias: haproxy
                  condition: haproxy.enabled
                  name: haproxy
                  ref: dhi/haproxy-chart:1.30.2@sha256:f556bf52877bc0005a36416b9e5c7478eb9b14d86bf3cda8022632b72a790c77
              description: Docker Hardened Images Helm chart for Argo CD
              images:
                - name: argocd
                  ref: dhi/argocd:3.5.3-debian13@sha256:3410c32abd3fd68e1e320bc3ec2219f24433aaa0e2c1483caef23feca55d2a03
                - name: dex
                  ref: dhi/dex:2.45.1-debian13@sha256:442bb36d98fdcde3a23dcae6654a6ebb981190ea97f9e9be1b4dace19c524905
                - name: redis
                  ref: dhi/redis:8.10.2-debian13-compat@sha256:9008acf6e2804fe8da637172fe789309be542079359804e50ace38596647d2d2
                - name: redis-exporter
                  ref: dhi/redis-exporter:1.92.1-debian13@sha256:b66d9f4793ec318e4c4090d8a86275e5ed88022d0ffe43d43417a108fa9d7ea7
              name: argocd-chart
              notes: ${source.dir}/config/NOTES.txt
              sourceUrl: https://github.com/argoproj/argo-helm
            cmd: prepare
            registry: dhi.io
        - name: relocate chart
          uses: helm/rudder@v1
          work-dir: ${source.dir}/helm-charts/charts/argo-cd
          with:
            cmd: patch
            patches:
              from: ${source.dir}/config
            registry: dhi.io
        - name: update values
          uses: yq/patch@v1
          work-dir: ${source.dir}/helm-charts/charts
          with:
            file: argo-cd/values.yaml
            patches:
              - del(.redis-ha.image)
              - del(.redis-ha.exporter.image)
              - del(.redis-ha.exporter.tag)
              - del(.redis-ha.haproxy.image.repository)
              - del(.redis-ha.haproxy)
              - del(.redis-ha.redis.masterGroupName)
              - del(.redis-ha.redis.config)
              - del(.redis-ha.hardAntiAffinity)
              - del(.redis-ha.additionalAffinities)
              - del(.redis-ha.affinity)
              - del(.redis-ha.tolerations)
              - del(.redis-ha.topologySpreadConstraints)
              - del(.redis-ha.containerSecurityContext)
        - name: Patch templates
          work-dir: ${source.dir}/helm-charts/charts/argo-cd/templates
          runs: |
            set -eux -o pipefail

            sed -i 's/$redisHa.haproxy.enabled/.Values.haproxy.enabled/' _helpers.tpl
            # HAProxy is a sibling subchart (dhi/haproxy-chart); its Service name is haproxy.fullname, not
            # "{redis-ha fullname}-haproxy" as in the upstream embedded redis-ha chart.
            sed -i 's#        {{- printf "%s-haproxy" (include "redis-ha.fullname" $redisHaContext) | trunc 63 | trimSuffix "-" -}}#        {{- include "haproxy.fullname" (dict "Chart" (dict "Name" "haproxy") "Release" .Release "Values" .Values.haproxy) | trunc 63 | trimSuffix "-" -}}#' _helpers.tpl
            cat "${source.dir}/config/_helpers.redis-ha.append.tpl" >> _helpers.tpl
        - name: helm login
          uses: helm/login@v1
          with:
            registry: dhi.io
        - name: update dependencies
          uses: helm/cmd@v1
          work-dir: ${source.dir}/helm-charts/charts
          privileged: true
          with:
            chart: argo-cd
            cmd: dependency update
        - name: lint
          uses: helm/cmd@v1
          work-dir: ${source.dir}/helm-charts/charts
          with:
            chart: argo-cd
            cmd: lint .
        - name: package
          uses: helm/package@v1
          work-dir: ${source.dir}/helm-charts/charts
          with:
            chart: argo-cd
      paths:
        - type: directory
          path: ${source.dir}/config
          uid: 0
          gid: 0
          mode: "0644"
          source: chart/argocd/config
