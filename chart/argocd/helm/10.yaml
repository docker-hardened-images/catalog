# syntax=dhi.io/build:2-helm3

name: Argo CD Helm chart 10.x
image: dhi.io/argocd-chart
variant: helm
tags:
  - 10.7.1
platforms:
  - linux/amd64
vars:
  ARGOCD_REFERENCE: dhi/argocd:3.5.2-debian13@sha256:1197a5e0de35ddfc71587c87f8b21a0d5df6c9b5c49d54c2a45f064c6b0b763f
  CHART_COMMIT_SHA: 95a3fa777be00431dca5b6cce279a51a75dfe724
  CHART_HELM_NAME: argocd-chart
  DEX_REFERENCE: dhi/dex:2.45.1-debian13@sha256:c9b924f34ad18a5ff77e3506e9abaa7d122482b3ea9c57e8988c17f9835d1cdf
  DHI_NAMESPACE: dhi
  DHI_PREFIX: ""
  DHI_REGISTRY: dhi.io
  DHI_SKIP_CONTEXT_COPY: "true"
  HAPROXY_CHART_REFERENCE: dhi/haproxy-chart:1.30.1@sha256:17db795cf832dfe73df8bbf246c4d63e91ad56794ddaf32bcef46657f9eac944
  HELM_VERSION: 4.1.4-2
  REDIS_CHART_REFERENCE: dhi/redis-chart:23.0.7@sha256:d501c11ac409c38cbfd233c974acd09f53145f5ce55b957f1f39d2744b178a06
  REDIS_EXPORTER_REFERENCE: dhi/redis-exporter:1.90.0-debian13@sha256:9dc8588f25cd171f20488b46cdb1689fa15de6147f3a2a740a68205946b707dd
  REDIS_REFERENCE: dhi/redis:8.10.1-debian13-compat@sha256:a238154a9719d18887c235cd00212c588f58598dcc97b0190a49e6c1cf42cc57
  SEMVER_MAJOR_MINOR_VERSION: "10.7"
  SEMVER_MAJOR_VERSION: "10"
  SEMVER_VERSION: 10.7.1
  VERSION: 10.7.1
contents:
  repositories:
    - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
  keyring:
    - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
  builds:
    - name: argocd
      contents:
        packages:
          - bash
          - ca-certificates
          - coreutils
          - sed
          - yq-go
          - helm=4.1.4-2
        files:
          - url: git+https://github.com/argoproj/argo-helm#argo-cd-10.7.1
            checksum: 95a3fa777be00431dca5b6cce279a51a75dfe724
            path: ${source.dir}/helm-charts
            uid: 0
            gid: 0
      pipeline:
        - name: prepare chart
          uses: helm/rudder@v1
          work-dir: ${source.dir}/helm-charts/charts/argo-cd
          with:
            chart:
              appRef: argocd
              dependencies:
                - alias: redis-ha
                  condition: redis-ha.enabled
                  name: redis-ha
                  ref: dhi/redis-chart:23.0.7@sha256:d501c11ac409c38cbfd233c974acd09f53145f5ce55b957f1f39d2744b178a06
                - alias: haproxy
                  condition: haproxy.enabled
                  name: haproxy
                  ref: dhi/haproxy-chart:1.30.1@sha256:17db795cf832dfe73df8bbf246c4d63e91ad56794ddaf32bcef46657f9eac944
              description: Docker Hardened Images Helm chart for Argo CD
              images:
                - name: argocd
                  ref: dhi/argocd:3.5.2-debian13@sha256:1197a5e0de35ddfc71587c87f8b21a0d5df6c9b5c49d54c2a45f064c6b0b763f
                - name: dex
                  ref: dhi/dex:2.45.1-debian13@sha256:c9b924f34ad18a5ff77e3506e9abaa7d122482b3ea9c57e8988c17f9835d1cdf
                - name: redis
                  ref: dhi/redis:8.10.1-debian13-compat@sha256:a238154a9719d18887c235cd00212c588f58598dcc97b0190a49e6c1cf42cc57
                - name: redis-exporter
                  ref: dhi/redis-exporter:1.90.0-debian13@sha256:9dc8588f25cd171f20488b46cdb1689fa15de6147f3a2a740a68205946b707dd
              name: argocd-chart
              notes: ${source.dir}/config/NOTES.txt
              sourceUrl: https://github.com/argoproj/argo-helm
            cmd: prepare
            registry: dhi.io
        - name: relocate chart
          uses: helm/rudder@v1
          work-dir: ${source.dir}/helm-charts/charts/argo-cd
          with:
            cmd: patch
            patches:
              from: ${source.dir}/config
            registry: dhi.io
        - name: update values
          uses: yq/patch@v1
          work-dir: ${source.dir}/helm-charts/charts
          with:
            file: argo-cd/values.yaml
            patches:
              - del(.redis-ha.image)
              - del(.redis-ha.exporter.image)
              - del(.redis-ha.exporter.tag)
              - del(.redis-ha.haproxy.image.repository)
              - del(.redis-ha.haproxy)
              - del(.redis-ha.redis.masterGroupName)
              - del(.redis-ha.redis.config)
              - del(.redis-ha.hardAntiAffinity)
              - del(.redis-ha.additionalAffinities)
              - del(.redis-ha.affinity)
              - del(.redis-ha.tolerations)
              - del(.redis-ha.topologySpreadConstraints)
              - del(.redis-ha.containerSecurityContext)
        - name: Patch templates
          work-dir: ${source.dir}/helm-charts/charts/argo-cd/templates
          runs: |
            set -eux -o pipefail

            sed -i 's/$redisHa.haproxy.enabled/.Values.haproxy.enabled/' _helpers.tpl
            # HAProxy is a sibling subchart (dhi/haproxy-chart); its Service name is haproxy.fullname, not
            # "{redis-ha fullname}-haproxy" as in the upstream embedded redis-ha chart.
            sed -i 's#        {{- printf "%s-haproxy" (include "redis-ha.fullname" $redisHaContext) | trunc 63 | trimSuffix "-" -}}#        {{- include "haproxy.fullname" (dict "Chart" (dict "Name" "haproxy") "Release" .Release "Values" .Values.haproxy) | trunc 63 | trimSuffix "-" -}}#' _helpers.tpl
            cat "${source.dir}/config/_helpers.redis-ha.append.tpl" >> _helpers.tpl
        - name: helm login
          uses: helm/login@v1
          with:
            registry: dhi.io
        - name: update dependencies
          uses: helm/cmd@v1
          work-dir: ${source.dir}/helm-charts/charts
          privileged: true
          with:
            chart: argo-cd
            cmd: dependency update
        - name: lint
          uses: helm/cmd@v1
          work-dir: ${source.dir}/helm-charts/charts
          with:
            chart: argo-cd
            cmd: lint .
        - name: package
          uses: helm/package@v1
          work-dir: ${source.dir}/helm-charts/charts
          with:
            chart: argo-cd
      paths:
        - type: directory
          path: ${source.dir}/config
          uid: 0
          gid: 0
          mode: "0644"
          source: chart/argocd/config
