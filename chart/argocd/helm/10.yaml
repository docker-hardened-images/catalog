# syntax=dhi.io/build:2-helm3

name: Argo CD Helm chart 10.x
image: dhi.io/argocd-chart
variant: helm
tags:
  - 10.3.3
platforms:
  - linux/amd64
vars:
  ARGOCD_REFERENCE: dhi/argocd:3.5.1-debian13@sha256:0760464604f6869986d674879cd8d87f738a80c16ccf666a7841d6dec899802d
  CHART_COMMIT_SHA: 535b7f9eaede50254d3bc4a6d7b12abfd06b0d51
  CHART_HELM_NAME: argocd-chart
  DEX_REFERENCE: dhi/dex:2.45.1-debian13@sha256:ff1aa39d5c314a7c428839006f99fe3b71d77339cedee66a2457145cf29f4c0c
  DHI_NAMESPACE: dhi
  DHI_PREFIX: ""
  DHI_REGISTRY: dhi.io
  DHI_SKIP_CONTEXT_COPY: "true"
  HAPROXY_CHART_REFERENCE: dhi/haproxy-chart:1.29.0@sha256:57538993f681a06c9d78445d4c07cb374ebf6193a3efe3ef1756d9d0787bc6f3
  HELM_VERSION: 4.1.4-2
  REDIS_CHART_REFERENCE: dhi/redis-chart:23.0.7@sha256:6a21bb860e5daca603a7ee5acf688e1469227105b3919a3697f5a15fa30fd6a5
  REDIS_EXPORTER_REFERENCE: dhi/redis-exporter:1.89.0-debian13@sha256:0d389d206807ef827ca701d44161d5ecce0fc2b132ce99cfc237cd17fd06d6de
  REDIS_REFERENCE: dhi/redis:8.10.0-debian13-compat@sha256:41555229472b6676fd47ff6a80313bd52d067800a9e3dc67416051cbe66305b0
  SEMVER_MAJOR_MINOR_VERSION: "10.3"
  SEMVER_MAJOR_VERSION: "10"
  SEMVER_VERSION: 10.3.3
  VERSION: 10.3.3
contents:
  repositories:
    - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
  keyring:
    - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
  builds:
    - name: argocd
      contents:
        packages:
          - bash
          - ca-certificates
          - coreutils
          - sed
          - yq-go
          - helm=4.1.4-2
        files:
          - url: git+https://github.com/argoproj/argo-helm#argo-cd-10.3.3
            checksum: 535b7f9eaede50254d3bc4a6d7b12abfd06b0d51
            path: ${source.dir}/helm-charts
            uid: 0
            gid: 0
      pipeline:
        - name: prepare chart
          uses: helm/rudder@v1
          work-dir: ${source.dir}/helm-charts/charts/argo-cd
          with:
            chart:
              appRef: argocd
              dependencies:
                - alias: redis-ha
                  condition: redis-ha.enabled
                  name: redis-ha
                  ref: dhi/redis-chart:23.0.7@sha256:6a21bb860e5daca603a7ee5acf688e1469227105b3919a3697f5a15fa30fd6a5
                - alias: haproxy
                  condition: haproxy.enabled
                  name: haproxy
                  ref: dhi/haproxy-chart:1.29.0@sha256:57538993f681a06c9d78445d4c07cb374ebf6193a3efe3ef1756d9d0787bc6f3
              description: Docker Hardened Images Helm chart for Argo CD
              images:
                - name: argocd
                  ref: dhi/argocd:3.5.1-debian13@sha256:0760464604f6869986d674879cd8d87f738a80c16ccf666a7841d6dec899802d
                - name: dex
                  ref: dhi/dex:2.45.1-debian13@sha256:ff1aa39d5c314a7c428839006f99fe3b71d77339cedee66a2457145cf29f4c0c
                - name: redis
                  ref: dhi/redis:8.10.0-debian13-compat@sha256:41555229472b6676fd47ff6a80313bd52d067800a9e3dc67416051cbe66305b0
                - name: redis-exporter
                  ref: dhi/redis-exporter:1.89.0-debian13@sha256:0d389d206807ef827ca701d44161d5ecce0fc2b132ce99cfc237cd17fd06d6de
              name: argocd-chart
              notes: ${source.dir}/config/NOTES.txt
              sourceUrl: https://github.com/argoproj/argo-helm
            cmd: prepare
            registry: dhi.io
        - name: relocate chart
          uses: helm/rudder@v1
          work-dir: ${source.dir}/helm-charts/charts/argo-cd
          with:
            cmd: patch
            patches:
              from: ${source.dir}/config
            registry: dhi.io
        - name: update values
          uses: yq/patch@v1
          work-dir: ${source.dir}/helm-charts/charts
          with:
            file: argo-cd/values.yaml
            patches:
              - del(.redis-ha.image)
              - del(.redis-ha.exporter.image)
              - del(.redis-ha.exporter.tag)
              - del(.redis-ha.haproxy.image.repository)
              - del(.redis-ha.haproxy)
              - del(.redis-ha.redis.masterGroupName)
              - del(.redis-ha.redis.config)
              - del(.redis-ha.hardAntiAffinity)
              - del(.redis-ha.additionalAffinities)
              - del(.redis-ha.affinity)
              - del(.redis-ha.tolerations)
              - del(.redis-ha.topologySpreadConstraints)
              - del(.redis-ha.containerSecurityContext)
        - name: Patch templates
          work-dir: ${source.dir}/helm-charts/charts/argo-cd/templates
          runs: |
            set -eux -o pipefail

            sed -i 's/$redisHa.haproxy.enabled/.Values.haproxy.enabled/' _helpers.tpl
            # HAProxy is a sibling subchart (dhi/haproxy-chart); its Service name is haproxy.fullname, not
            # "{redis-ha fullname}-haproxy" as in the upstream embedded redis-ha chart.
            sed -i 's#        {{- printf "%s-haproxy" (include "redis-ha.fullname" $redisHaContext) | trunc 63 | trimSuffix "-" -}}#        {{- include "haproxy.fullname" (dict "Chart" (dict "Name" "haproxy") "Release" .Release "Values" .Values.haproxy) | trunc 63 | trimSuffix "-" -}}#' _helpers.tpl
            cat "${source.dir}/config/_helpers.redis-ha.append.tpl" >> _helpers.tpl
        - name: helm login
          uses: helm/login@v1
          with:
            registry: dhi.io
        - name: update dependencies
          uses: helm/cmd@v1
          work-dir: ${source.dir}/helm-charts/charts
          privileged: true
          with:
            chart: argo-cd
            cmd: dependency update
        - name: lint
          uses: helm/cmd@v1
          work-dir: ${source.dir}/helm-charts/charts
          with:
            chart: argo-cd
            cmd: lint .
        - name: package
          uses: helm/package@v1
          work-dir: ${source.dir}/helm-charts/charts
          with:
            chart: argo-cd
      paths:
        - type: directory
          path: ${source.dir}/config
          uid: 0
          gid: 0
          mode: "0644"
          source: chart/argocd/config
