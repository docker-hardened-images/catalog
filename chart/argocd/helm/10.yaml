# syntax=dhi.io/build:2-helm3

name: Argo CD Helm chart 10.x
image: dhi.io/argocd-chart
variant: helm
tags:
  - 10.17.1
platforms:
  - linux/amd64
vars:
  ARGOCD_REFERENCE: dhi/argocd:3.5.7-debian13@sha256:073c530227dbd89f7d1ce036cdf854bb72d464f42c69c6d4f6cdfb10f28149ef
  CHART_COMMIT_SHA: 02570c9c013c2ad40947af75bb35d9ac2bef7b84
  CHART_HELM_NAME: argocd-chart
  DEX_REFERENCE: dhi/dex:2.46.1-debian13@sha256:11603b483f920e90aa34b8c48636fdbf426bc21e6931d617676005c7f514a45d
  DHI_NAMESPACE: dhi
  DHI_PREFIX: ""
  DHI_REGISTRY: dhi.io
  DHI_SKIP_CONTEXT_COPY: "true"
  HAPROXY_CHART_REFERENCE: dhi/haproxy-chart:1.30.2@sha256:d2e3988a3502c324bd203d0e76a4c2d9cb1325791eb1ed5ea3a50b2a9c1a2faa
  HELM_VERSION: 4.1.4-2
  REDIS_CHART_REFERENCE: dhi/redis-chart:23.0.7@sha256:167d2ff99ab627506129b281fd1e8f5358143acb20aa35ce1bb53b2b3b3f3e50
  REDIS_EXPORTER_REFERENCE: dhi/redis-exporter:1.97.0-debian13@sha256:79d77110814ab2cf8349756a74e5c8f6aa9c54350faba69c0ac18bae14dea79f
  REDIS_REFERENCE: dhi/redis:8.10.3-debian13-compat@sha256:c58e073a534d7ed4c7ef96c087c03fe8bb56adad4e3629cdaac910c3bb072ffc
  SEMVER_MAJOR_MINOR_VERSION: "10.17"
  SEMVER_MAJOR_VERSION: "10"
  SEMVER_VERSION: 10.17.1
  VERSION: 10.17.1
contents:
  repositories:
    - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
  keyring:
    - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
  builds:
    - name: argocd
      contents:
        packages:
          - bash
          - ca-certificates
          - coreutils
          - sed
          - yq-go
          - helm=4.1.4-2
        files:
          - url: git+https://github.com/argoproj/argo-helm#argo-cd-10.17.1
            checksum: 02570c9c013c2ad40947af75bb35d9ac2bef7b84
            path: ${source.dir}/helm-charts
            uid: 0
            gid: 0
      pipeline:
        - name: prepare chart
          uses: helm/rudder@v1
          work-dir: ${source.dir}/helm-charts/charts/argo-cd
          with:
            chart:
              appRef: argocd
              dependencies:
                - alias: redis-ha
                  condition: redis-ha.enabled
                  name: redis-ha
                  ref: dhi/redis-chart:23.0.7@sha256:167d2ff99ab627506129b281fd1e8f5358143acb20aa35ce1bb53b2b3b3f3e50
                - alias: haproxy
                  condition: haproxy.enabled
                  name: haproxy
                  ref: dhi/haproxy-chart:1.30.2@sha256:d2e3988a3502c324bd203d0e76a4c2d9cb1325791eb1ed5ea3a50b2a9c1a2faa
              description: Docker Hardened Images Helm chart for Argo CD
              images:
                - name: argocd
                  ref: dhi/argocd:3.5.7-debian13@sha256:073c530227dbd89f7d1ce036cdf854bb72d464f42c69c6d4f6cdfb10f28149ef
                - name: dex
                  ref: dhi/dex:2.46.1-debian13@sha256:11603b483f920e90aa34b8c48636fdbf426bc21e6931d617676005c7f514a45d
                - name: redis
                  ref: dhi/redis:8.10.3-debian13-compat@sha256:c58e073a534d7ed4c7ef96c087c03fe8bb56adad4e3629cdaac910c3bb072ffc
                - name: redis-exporter
                  ref: dhi/redis-exporter:1.97.0-debian13@sha256:79d77110814ab2cf8349756a74e5c8f6aa9c54350faba69c0ac18bae14dea79f
              name: argocd-chart
              notes: ${source.dir}/config/NOTES.txt
              sourceUrl: https://github.com/argoproj/argo-helm
            cmd: prepare
            registry: dhi.io
        - name: relocate chart
          uses: helm/rudder@v1
          work-dir: ${source.dir}/helm-charts/charts/argo-cd
          with:
            cmd: patch
            patches:
              from: ${source.dir}/config
            registry: dhi.io
        - name: update values
          uses: yq/patch@v1
          work-dir: ${source.dir}/helm-charts/charts
          with:
            file: argo-cd/values.yaml
            patches:
              - del(.redis-ha.image)
              - del(.redis-ha.exporter.image)
              - del(.redis-ha.exporter.tag)
              - del(.redis-ha.haproxy.image.repository)
              - del(.redis-ha.haproxy)
              - del(.redis-ha.redis.masterGroupName)
              - del(.redis-ha.redis.config)
              - del(.redis-ha.hardAntiAffinity)
              - del(.redis-ha.additionalAffinities)
              - del(.redis-ha.affinity)
              - del(.redis-ha.tolerations)
              - del(.redis-ha.topologySpreadConstraints)
              - del(.redis-ha.containerSecurityContext)
        - name: Patch templates
          work-dir: ${source.dir}/helm-charts/charts/argo-cd/templates
          runs: |
            set -eux -o pipefail

            sed -i 's/$redisHa.haproxy.enabled/.Values.haproxy.enabled/' _helpers.tpl
            # HAProxy is a sibling subchart (dhi/haproxy-chart); its Service name is haproxy.fullname, not
            # "{redis-ha fullname}-haproxy" as in the upstream embedded redis-ha chart.
            sed -i 's#        {{- printf "%s-haproxy" (include "redis-ha.fullname" $redisHaContext) | trunc 63 | trimSuffix "-" -}}#        {{- include "haproxy.fullname" (dict "Chart" (dict "Name" "haproxy") "Release" .Release "Values" .Values.haproxy) | trunc 63 | trimSuffix "-" -}}#' _helpers.tpl
            # redis-ha.fullname only exists in the upstream redis-ha chart; redis-chart does not define it.
            # Remaining upstream calls pass a redis-ha-scoped context; use the appended helper with root context.
            sed -i 's#include "redis-ha.fullname" \$redisHaContext#include "argo-cd.redis-ha.fullname" .#' _helpers.tpl
            # redis-chart has no top-level authKey (upstream redis-ha value); the password key lives in auth.existingSecretPasswordKey.
            sed -i 's#key: {{ \$redisHa.authKey }}#key: {{ $redisHa.auth.existingSecretPasswordKey | default "auth" }}#' _helpers.tpl
            cat "${source.dir}/config/_helpers.redis-ha.append.tpl" >> _helpers.tpl
        - name: helm login
          uses: helm/login@v1
          with:
            registry: dhi.io
        - name: update dependencies
          uses: helm/cmd@v1
          work-dir: ${source.dir}/helm-charts/charts
          privileged: true
          with:
            chart: argo-cd
            cmd: dependency update
        - name: lint
          uses: helm/cmd@v1
          work-dir: ${source.dir}/helm-charts/charts
          with:
            chart: argo-cd
            cmd: lint .
        - name: package
          uses: helm/package@v1
          work-dir: ${source.dir}/helm-charts/charts
          with:
            chart: argo-cd
      paths:
        - type: directory
          path: ${source.dir}/config
          uid: 0
          gid: 0
          mode: "0644"
          source: chart/argocd/config
