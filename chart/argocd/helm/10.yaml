# syntax=dhi.io/build:2-helm3

name: Argo CD Helm chart 10.x
image: dhi.io/argocd-chart
variant: helm
tags:
  - 10.9.6
platforms:
  - linux/amd64
vars:
  ARGOCD_REFERENCE: dhi/argocd:3.5.3-debian13@sha256:cde413742f55fa09bcb94b29a35e27bca0ec4982bf07b1208c0fbb0f6d5197a5
  CHART_COMMIT_SHA: 43a7c762903b0faa345c1e78bc561bb30f7db4b8
  CHART_HELM_NAME: argocd-chart
  DEX_REFERENCE: dhi/dex:2.45.1-debian13@sha256:c6b6277fdb511c1ddee5b2610b84d074a3b73028e2855859cc48406a255169d3
  DHI_NAMESPACE: dhi
  DHI_PREFIX: ""
  DHI_REGISTRY: dhi.io
  DHI_SKIP_CONTEXT_COPY: "true"
  HAPROXY_CHART_REFERENCE: dhi/haproxy-chart:1.30.2@sha256:0067c4e9c3d0df612ba22003d26c663c51aa8f13d386bcc749c94d1734743d58
  HELM_VERSION: 4.1.4-2
  REDIS_CHART_REFERENCE: dhi/redis-chart:23.0.7@sha256:fcb076810e224d6a7669bb6d727462d1ecf8c221aa3d7bff38f2feca094337c4
  REDIS_EXPORTER_REFERENCE: dhi/redis-exporter:1.93.0-debian13@sha256:cb2d3fa094cc990a6397bc9f946c800ffd1ac017f1788c9331593e5e24326bfc
  REDIS_REFERENCE: dhi/redis:8.10.2-debian13-compat@sha256:8477e3456e63d1777b0df44658d8bb93b40ca0d0442df89222bd0ca4612b662f
  SEMVER_MAJOR_MINOR_VERSION: "10.9"
  SEMVER_MAJOR_VERSION: "10"
  SEMVER_VERSION: 10.9.6
  VERSION: 10.9.6
contents:
  repositories:
    - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
  keyring:
    - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
  builds:
    - name: argocd
      contents:
        packages:
          - bash
          - ca-certificates
          - coreutils
          - sed
          - yq-go
          - helm=4.1.4-2
        files:
          - url: git+https://github.com/argoproj/argo-helm#argo-cd-10.9.6
            checksum: 43a7c762903b0faa345c1e78bc561bb30f7db4b8
            path: ${source.dir}/helm-charts
            uid: 0
            gid: 0
      pipeline:
        - name: prepare chart
          uses: helm/rudder@v1
          work-dir: ${source.dir}/helm-charts/charts/argo-cd
          with:
            chart:
              appRef: argocd
              dependencies:
                - alias: redis-ha
                  condition: redis-ha.enabled
                  name: redis-ha
                  ref: dhi/redis-chart:23.0.7@sha256:fcb076810e224d6a7669bb6d727462d1ecf8c221aa3d7bff38f2feca094337c4
                - alias: haproxy
                  condition: haproxy.enabled
                  name: haproxy
                  ref: dhi/haproxy-chart:1.30.2@sha256:0067c4e9c3d0df612ba22003d26c663c51aa8f13d386bcc749c94d1734743d58
              description: Docker Hardened Images Helm chart for Argo CD
              images:
                - name: argocd
                  ref: dhi/argocd:3.5.3-debian13@sha256:cde413742f55fa09bcb94b29a35e27bca0ec4982bf07b1208c0fbb0f6d5197a5
                - name: dex
                  ref: dhi/dex:2.45.1-debian13@sha256:c6b6277fdb511c1ddee5b2610b84d074a3b73028e2855859cc48406a255169d3
                - name: redis
                  ref: dhi/redis:8.10.2-debian13-compat@sha256:8477e3456e63d1777b0df44658d8bb93b40ca0d0442df89222bd0ca4612b662f
                - name: redis-exporter
                  ref: dhi/redis-exporter:1.93.0-debian13@sha256:cb2d3fa094cc990a6397bc9f946c800ffd1ac017f1788c9331593e5e24326bfc
              name: argocd-chart
              notes: ${source.dir}/config/NOTES.txt
              sourceUrl: https://github.com/argoproj/argo-helm
            cmd: prepare
            registry: dhi.io
        - name: relocate chart
          uses: helm/rudder@v1
          work-dir: ${source.dir}/helm-charts/charts/argo-cd
          with:
            cmd: patch
            patches:
              from: ${source.dir}/config
            registry: dhi.io
        - name: update values
          uses: yq/patch@v1
          work-dir: ${source.dir}/helm-charts/charts
          with:
            file: argo-cd/values.yaml
            patches:
              - del(.redis-ha.image)
              - del(.redis-ha.exporter.image)
              - del(.redis-ha.exporter.tag)
              - del(.redis-ha.haproxy.image.repository)
              - del(.redis-ha.haproxy)
              - del(.redis-ha.redis.masterGroupName)
              - del(.redis-ha.redis.config)
              - del(.redis-ha.hardAntiAffinity)
              - del(.redis-ha.additionalAffinities)
              - del(.redis-ha.affinity)
              - del(.redis-ha.tolerations)
              - del(.redis-ha.topologySpreadConstraints)
              - del(.redis-ha.containerSecurityContext)
        - name: Patch templates
          work-dir: ${source.dir}/helm-charts/charts/argo-cd/templates
          runs: |
            set -eux -o pipefail

            sed -i 's/$redisHa.haproxy.enabled/.Values.haproxy.enabled/' _helpers.tpl
            # HAProxy is a sibling subchart (dhi/haproxy-chart); its Service name is haproxy.fullname, not
            # "{redis-ha fullname}-haproxy" as in the upstream embedded redis-ha chart.
            sed -i 's#        {{- printf "%s-haproxy" (include "redis-ha.fullname" $redisHaContext) | trunc 63 | trimSuffix "-" -}}#        {{- include "haproxy.fullname" (dict "Chart" (dict "Name" "haproxy") "Release" .Release "Values" .Values.haproxy) | trunc 63 | trimSuffix "-" -}}#' _helpers.tpl
            # redis-ha.fullname only exists in the upstream redis-ha chart; redis-chart does not define it.
            # Remaining upstream calls pass a redis-ha-scoped context; use the appended helper with root context.
            sed -i 's#include "redis-ha.fullname" \$redisHaContext#include "argo-cd.redis-ha.fullname" .#' _helpers.tpl
            # redis-chart has no top-level authKey (upstream redis-ha value); the password key lives in auth.existingSecretPasswordKey.
            sed -i 's#key: {{ \$redisHa.authKey }}#key: {{ $redisHa.auth.existingSecretPasswordKey | default "auth" }}#' _helpers.tpl
            cat "${source.dir}/config/_helpers.redis-ha.append.tpl" >> _helpers.tpl
        - name: helm login
          uses: helm/login@v1
          with:
            registry: dhi.io
        - name: update dependencies
          uses: helm/cmd@v1
          work-dir: ${source.dir}/helm-charts/charts
          privileged: true
          with:
            chart: argo-cd
            cmd: dependency update
        - name: lint
          uses: helm/cmd@v1
          work-dir: ${source.dir}/helm-charts/charts
          with:
            chart: argo-cd
            cmd: lint .
        - name: package
          uses: helm/package@v1
          work-dir: ${source.dir}/helm-charts/charts
          with:
            chart: argo-cd
      paths:
        - type: directory
          path: ${source.dir}/config
          uid: 0
          gid: 0
          mode: "0644"
          source: chart/argocd/config
