# syntax=dhi.io/build:2-helm3

name: Argo CD Helm chart 10.x
image: dhi.io/argocd-chart
variant: helm
tags:
  - 10.4.0
platforms:
  - linux/amd64
vars:
  ARGOCD_REFERENCE: dhi/argocd:3.5.1-debian13@sha256:c25488988d6070db243c9016d1ef3add749da3d3bae46f5fd2356223136c514f
  CHART_COMMIT_SHA: 50bc2fc864fe63eebc523c46f8baf33bf1e64882
  CHART_HELM_NAME: argocd-chart
  DEX_REFERENCE: dhi/dex:2.45.1-debian13@sha256:9ac631929b212cea9ec6a5fe324057454c87e828e976e0d0f169a2324306ff2b
  DHI_NAMESPACE: dhi
  DHI_PREFIX: ""
  DHI_REGISTRY: dhi.io
  DHI_SKIP_CONTEXT_COPY: "true"
  HAPROXY_CHART_REFERENCE: dhi/haproxy-chart:1.30.1@sha256:7862794264fcfc3189f4c04fdf1e912b7d6d8604a59f0584ecdf83b29ab3cbbc
  HELM_VERSION: 4.1.4-2
  REDIS_CHART_REFERENCE: dhi/redis-chart:23.0.7@sha256:c055e080e273708cb25cf86c55c4d7ee78a353c33b3eafaa99f950bcd8b5c541
  REDIS_EXPORTER_REFERENCE: dhi/redis-exporter:1.89.0-debian13@sha256:c988c05139a3a5a1c1cf6ab66c4f78230a1c1b927374dc6f777bff660d50478f
  REDIS_REFERENCE: dhi/redis:8.10.1-debian13-compat@sha256:5eb0ef8ed4b282f8d4725b748c24fa72ca54abcda9de58dd71ba1e8517be36d4
  SEMVER_MAJOR_MINOR_VERSION: "10.4"
  SEMVER_MAJOR_VERSION: "10"
  SEMVER_VERSION: 10.4.0
  VERSION: 10.4.0
contents:
  repositories:
    - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
  keyring:
    - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
  builds:
    - name: argocd
      contents:
        packages:
          - bash
          - ca-certificates
          - coreutils
          - sed
          - yq-go
          - helm=4.1.4-2
        files:
          - url: git+https://github.com/argoproj/argo-helm#argo-cd-10.4.0
            checksum: 50bc2fc864fe63eebc523c46f8baf33bf1e64882
            path: ${source.dir}/helm-charts
            uid: 0
            gid: 0
      pipeline:
        - name: prepare chart
          uses: helm/rudder@v1
          work-dir: ${source.dir}/helm-charts/charts/argo-cd
          with:
            chart:
              appRef: argocd
              dependencies:
                - alias: redis-ha
                  condition: redis-ha.enabled
                  name: redis-ha
                  ref: dhi/redis-chart:23.0.7@sha256:c055e080e273708cb25cf86c55c4d7ee78a353c33b3eafaa99f950bcd8b5c541
                - alias: haproxy
                  condition: haproxy.enabled
                  name: haproxy
                  ref: dhi/haproxy-chart:1.30.1@sha256:7862794264fcfc3189f4c04fdf1e912b7d6d8604a59f0584ecdf83b29ab3cbbc
              description: Docker Hardened Images Helm chart for Argo CD
              images:
                - name: argocd
                  ref: dhi/argocd:3.5.1-debian13@sha256:c25488988d6070db243c9016d1ef3add749da3d3bae46f5fd2356223136c514f
                - name: dex
                  ref: dhi/dex:2.45.1-debian13@sha256:9ac631929b212cea9ec6a5fe324057454c87e828e976e0d0f169a2324306ff2b
                - name: redis
                  ref: dhi/redis:8.10.1-debian13-compat@sha256:5eb0ef8ed4b282f8d4725b748c24fa72ca54abcda9de58dd71ba1e8517be36d4
                - name: redis-exporter
                  ref: dhi/redis-exporter:1.89.0-debian13@sha256:c988c05139a3a5a1c1cf6ab66c4f78230a1c1b927374dc6f777bff660d50478f
              name: argocd-chart
              notes: ${source.dir}/config/NOTES.txt
              sourceUrl: https://github.com/argoproj/argo-helm
            cmd: prepare
            registry: dhi.io
        - name: relocate chart
          uses: helm/rudder@v1
          work-dir: ${source.dir}/helm-charts/charts/argo-cd
          with:
            cmd: patch
            patches:
              from: ${source.dir}/config
            registry: dhi.io
        - name: update values
          uses: yq/patch@v1
          work-dir: ${source.dir}/helm-charts/charts
          with:
            file: argo-cd/values.yaml
            patches:
              - del(.redis-ha.image)
              - del(.redis-ha.exporter.image)
              - del(.redis-ha.exporter.tag)
              - del(.redis-ha.haproxy.image.repository)
              - del(.redis-ha.haproxy)
              - del(.redis-ha.redis.masterGroupName)
              - del(.redis-ha.redis.config)
              - del(.redis-ha.hardAntiAffinity)
              - del(.redis-ha.additionalAffinities)
              - del(.redis-ha.affinity)
              - del(.redis-ha.tolerations)
              - del(.redis-ha.topologySpreadConstraints)
              - del(.redis-ha.containerSecurityContext)
        - name: Patch templates
          work-dir: ${source.dir}/helm-charts/charts/argo-cd/templates
          runs: |
            set -eux -o pipefail

            sed -i 's/$redisHa.haproxy.enabled/.Values.haproxy.enabled/' _helpers.tpl
            # HAProxy is a sibling subchart (dhi/haproxy-chart); its Service name is haproxy.fullname, not
            # "{redis-ha fullname}-haproxy" as in the upstream embedded redis-ha chart.
            sed -i 's#        {{- printf "%s-haproxy" (include "redis-ha.fullname" $redisHaContext) | trunc 63 | trimSuffix "-" -}}#        {{- include "haproxy.fullname" (dict "Chart" (dict "Name" "haproxy") "Release" .Release "Values" .Values.haproxy) | trunc 63 | trimSuffix "-" -}}#' _helpers.tpl
            cat "${source.dir}/config/_helpers.redis-ha.append.tpl" >> _helpers.tpl
        - name: helm login
          uses: helm/login@v1
          with:
            registry: dhi.io
        - name: update dependencies
          uses: helm/cmd@v1
          work-dir: ${source.dir}/helm-charts/charts
          privileged: true
          with:
            chart: argo-cd
            cmd: dependency update
        - name: lint
          uses: helm/cmd@v1
          work-dir: ${source.dir}/helm-charts/charts
          with:
            chart: argo-cd
            cmd: lint .
        - name: package
          uses: helm/package@v1
          work-dir: ${source.dir}/helm-charts/charts
          with:
            chart: argo-cd
      paths:
        - type: directory
          path: ${source.dir}/config
          uid: 0
          gid: 0
          mode: "0644"
          source: chart/argocd/config
