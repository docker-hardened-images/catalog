# syntax=dhi.io/build:2-helm3

name: Argo CD Helm chart 10.x
image: dhi.io/argocd-chart
variant: helm
tags:
  - 10.18.0
platforms:
  - linux/amd64
vars:
  ARGOCD_REFERENCE: dhi/argocd:3.6.1-debian13@sha256:f14fd2ed73e234b6d77b955b8f5f55054367fab47c4a0abb8563c723dc19f8b2
  CHART_COMMIT_SHA: 9348ef01b9d92d181ee7775abf5bc9c5870a93c7
  CHART_HELM_NAME: argocd-chart
  DEX_REFERENCE: dhi/dex:2.46.1-debian13@sha256:b4093f3798bc3886b2af985ae901c9f3a2f9fdc6eb86801b2e2de6a3d71b04b4
  DHI_NAMESPACE: dhi
  DHI_PREFIX: ""
  DHI_REGISTRY: dhi.io
  DHI_SKIP_CONTEXT_COPY: "true"
  HAPROXY_CHART_REFERENCE: dhi/haproxy-chart:1.30.4@sha256:c8e503b24a6b8b193ca47ab078a2c6b2a4e61813cc279e74c263b13ae6c885c0
  HELM_VERSION: 4.1.4-2
  REDIS_CHART_REFERENCE: dhi/redis-chart:23.0.7@sha256:167d2ff99ab627506129b281fd1e8f5358143acb20aa35ce1bb53b2b3b3f3e50
  REDIS_EXPORTER_REFERENCE: dhi/redis-exporter:1.97.0-debian13@sha256:f1db09d6f8463f2089a193e75bb3e4e2233d5aaae92e984a72b8db52522837f8
  REDIS_REFERENCE: dhi/redis:8.10.3-debian13-compat@sha256:a4dcf842229e2036bd27a772928cd223a369de356a4f74171d770c5c6dc0b8e0
  SEMVER_MAJOR_MINOR_VERSION: "10.18"
  SEMVER_MAJOR_VERSION: "10"
  SEMVER_VERSION: 10.18.0
  VERSION: 10.18.0
contents:
  repositories:
    - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
  keyring:
    - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
  builds:
    - name: argocd
      contents:
        packages:
          - bash
          - ca-certificates
          - coreutils
          - sed
          - yq-go
          - helm=4.1.4-2
        files:
          - url: git+https://github.com/argoproj/argo-helm#argo-cd-10.18.0
            checksum: 9348ef01b9d92d181ee7775abf5bc9c5870a93c7
            path: ${source.dir}/helm-charts
            uid: 0
            gid: 0
      pipeline:
        - name: prepare chart
          uses: helm/rudder@v1
          work-dir: ${source.dir}/helm-charts/charts/argo-cd
          with:
            chart:
              appRef: argocd
              dependencies:
                - alias: redis-ha
                  condition: redis-ha.enabled
                  name: redis-ha
                  ref: dhi/redis-chart:23.0.7@sha256:167d2ff99ab627506129b281fd1e8f5358143acb20aa35ce1bb53b2b3b3f3e50
                - alias: haproxy
                  condition: haproxy.enabled
                  name: haproxy
                  ref: dhi/haproxy-chart:1.30.4@sha256:c8e503b24a6b8b193ca47ab078a2c6b2a4e61813cc279e74c263b13ae6c885c0
              description: Docker Hardened Images Helm chart for Argo CD
              images:
                - name: argocd
                  ref: dhi/argocd:3.6.1-debian13@sha256:f14fd2ed73e234b6d77b955b8f5f55054367fab47c4a0abb8563c723dc19f8b2
                - name: dex
                  ref: dhi/dex:2.46.1-debian13@sha256:b4093f3798bc3886b2af985ae901c9f3a2f9fdc6eb86801b2e2de6a3d71b04b4
                - name: redis
                  ref: dhi/redis:8.10.3-debian13-compat@sha256:a4dcf842229e2036bd27a772928cd223a369de356a4f74171d770c5c6dc0b8e0
                - name: redis-exporter
                  ref: dhi/redis-exporter:1.97.0-debian13@sha256:f1db09d6f8463f2089a193e75bb3e4e2233d5aaae92e984a72b8db52522837f8
              name: argocd-chart
              notes: ${source.dir}/config/NOTES.txt
              sourceUrl: https://github.com/argoproj/argo-helm
            cmd: prepare
            registry: dhi.io
        - name: relocate chart
          uses: helm/rudder@v1
          work-dir: ${source.dir}/helm-charts/charts/argo-cd
          with:
            cmd: patch
            patches:
              from: ${source.dir}/config
            registry: dhi.io
        - name: update values
          uses: yq/patch@v1
          work-dir: ${source.dir}/helm-charts/charts
          with:
            file: argo-cd/values.yaml
            patches:
              - del(.redis-ha.image)
              - del(.redis-ha.exporter.image)
              - del(.redis-ha.exporter.tag)
              - del(.redis-ha.haproxy.image.repository)
              - del(.redis-ha.haproxy)
              - del(.redis-ha.redis.masterGroupName)
              - del(.redis-ha.redis.config)
              - del(.redis-ha.hardAntiAffinity)
              - del(.redis-ha.additionalAffinities)
              - del(.redis-ha.affinity)
              - del(.redis-ha.tolerations)
              - del(.redis-ha.topologySpreadConstraints)
              - del(.redis-ha.containerSecurityContext)
        - name: Patch templates
          work-dir: ${source.dir}/helm-charts/charts/argo-cd/templates
          runs: |
            set -eux -o pipefail

            sed -i 's/$redisHa.haproxy.enabled/.Values.haproxy.enabled/' _helpers.tpl
            # HAProxy is a sibling subchart (dhi/haproxy-chart); its Service name is haproxy.fullname, not
            # "{redis-ha fullname}-haproxy" as in the upstream embedded redis-ha chart.
            sed -i 's#        {{- printf "%s-haproxy" (include "redis-ha.fullname" $redisHaContext) | trunc 63 | trimSuffix "-" -}}#        {{- include "haproxy.fullname" (dict "Chart" (dict "Name" "haproxy") "Release" .Release "Values" .Values.haproxy) | trunc 63 | trimSuffix "-" -}}#' _helpers.tpl
            # redis-ha.fullname only exists in the upstream redis-ha chart; redis-chart does not define it.
            # Remaining upstream calls pass a redis-ha-scoped context; use the appended helper with root context.
            sed -i 's#include "redis-ha.fullname" \$redisHaContext#include "argo-cd.redis-ha.fullname" .#' _helpers.tpl
            # redis-chart has no top-level authKey (upstream redis-ha value); the password key lives in auth.existingSecretPasswordKey.
            sed -i 's#key: {{ \$redisHa.authKey }}#key: {{ $redisHa.auth.existingSecretPasswordKey | default "auth" }}#' _helpers.tpl
            cat "${source.dir}/config/_helpers.redis-ha.append.tpl" >> _helpers.tpl
        - name: helm login
          uses: helm/login@v1
          with:
            registry: dhi.io
        - name: update dependencies
          uses: helm/cmd@v1
          work-dir: ${source.dir}/helm-charts/charts
          privileged: true
          with:
            chart: argo-cd
            cmd: dependency update
        - name: lint
          uses: helm/cmd@v1
          work-dir: ${source.dir}/helm-charts/charts
          with:
            chart: argo-cd
            cmd: lint .
        - name: package
          uses: helm/package@v1
          work-dir: ${source.dir}/helm-charts/charts
          with:
            chart: argo-cd
      paths:
        - type: directory
          path: ${source.dir}/config
          uid: 0
          gid: 0
          mode: "0644"
          source: chart/argocd/config
