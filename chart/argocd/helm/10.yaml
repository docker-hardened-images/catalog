# syntax=dhi.io/build:2-helm3

name: Argo CD Helm chart 10.x
image: dhi.io/argocd-chart
variant: helm
tags:
  - 10.7.2
platforms:
  - linux/amd64
vars:
  ARGOCD_REFERENCE: dhi/argocd:3.5.2-debian13@sha256:91d530e986f0a04c30459e74accbcd36c83b3c51619133fac26dec575c0e6d78
  CHART_COMMIT_SHA: 28b48d5b67bf14574b7f37c05de3f9333e85b2fd
  CHART_HELM_NAME: argocd-chart
  DEX_REFERENCE: dhi/dex:2.45.1-debian13@sha256:e2d0a5a47ed742e8ec0c255509939149686c59ca152f30364978bbf32822adf3
  DHI_NAMESPACE: dhi
  DHI_PREFIX: ""
  DHI_REGISTRY: dhi.io
  DHI_SKIP_CONTEXT_COPY: "true"
  HAPROXY_CHART_REFERENCE: dhi/haproxy-chart:1.30.1@sha256:17db795cf832dfe73df8bbf246c4d63e91ad56794ddaf32bcef46657f9eac944
  HELM_VERSION: 4.1.4-2
  REDIS_CHART_REFERENCE: dhi/redis-chart:23.0.7@sha256:9d6504d67330ad00c76a0d1f8e994b0b7d72855e710490506f96a2ba7e762b41
  REDIS_EXPORTER_REFERENCE: dhi/redis-exporter:1.90.0-debian13@sha256:27e3e86232601f4b5fb66c4f21ca13565be6dc91d62aad62013a7e98d249f8fc
  REDIS_REFERENCE: dhi/redis:8.10.1-debian13-compat@sha256:a238154a9719d18887c235cd00212c588f58598dcc97b0190a49e6c1cf42cc57
  SEMVER_MAJOR_MINOR_VERSION: "10.7"
  SEMVER_MAJOR_VERSION: "10"
  SEMVER_VERSION: 10.7.2
  VERSION: 10.7.2
contents:
  repositories:
    - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
  keyring:
    - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
  builds:
    - name: argocd
      contents:
        packages:
          - bash
          - ca-certificates
          - coreutils
          - sed
          - yq-go
          - helm=4.1.4-2
        files:
          - url: git+https://github.com/argoproj/argo-helm#argo-cd-10.7.2
            checksum: 28b48d5b67bf14574b7f37c05de3f9333e85b2fd
            path: ${source.dir}/helm-charts
            uid: 0
            gid: 0
      pipeline:
        - name: prepare chart
          uses: helm/rudder@v1
          work-dir: ${source.dir}/helm-charts/charts/argo-cd
          with:
            chart:
              appRef: argocd
              dependencies:
                - alias: redis-ha
                  condition: redis-ha.enabled
                  name: redis-ha
                  ref: dhi/redis-chart:23.0.7@sha256:9d6504d67330ad00c76a0d1f8e994b0b7d72855e710490506f96a2ba7e762b41
                - alias: haproxy
                  condition: haproxy.enabled
                  name: haproxy
                  ref: dhi/haproxy-chart:1.30.1@sha256:17db795cf832dfe73df8bbf246c4d63e91ad56794ddaf32bcef46657f9eac944
              description: Docker Hardened Images Helm chart for Argo CD
              images:
                - name: argocd
                  ref: dhi/argocd:3.5.2-debian13@sha256:91d530e986f0a04c30459e74accbcd36c83b3c51619133fac26dec575c0e6d78
                - name: dex
                  ref: dhi/dex:2.45.1-debian13@sha256:e2d0a5a47ed742e8ec0c255509939149686c59ca152f30364978bbf32822adf3
                - name: redis
                  ref: dhi/redis:8.10.1-debian13-compat@sha256:a238154a9719d18887c235cd00212c588f58598dcc97b0190a49e6c1cf42cc57
                - name: redis-exporter
                  ref: dhi/redis-exporter:1.90.0-debian13@sha256:27e3e86232601f4b5fb66c4f21ca13565be6dc91d62aad62013a7e98d249f8fc
              name: argocd-chart
              notes: ${source.dir}/config/NOTES.txt
              sourceUrl: https://github.com/argoproj/argo-helm
            cmd: prepare
            registry: dhi.io
        - name: relocate chart
          uses: helm/rudder@v1
          work-dir: ${source.dir}/helm-charts/charts/argo-cd
          with:
            cmd: patch
            patches:
              from: ${source.dir}/config
            registry: dhi.io
        - name: update values
          uses: yq/patch@v1
          work-dir: ${source.dir}/helm-charts/charts
          with:
            file: argo-cd/values.yaml
            patches:
              - del(.redis-ha.image)
              - del(.redis-ha.exporter.image)
              - del(.redis-ha.exporter.tag)
              - del(.redis-ha.haproxy.image.repository)
              - del(.redis-ha.haproxy)
              - del(.redis-ha.redis.masterGroupName)
              - del(.redis-ha.redis.config)
              - del(.redis-ha.hardAntiAffinity)
              - del(.redis-ha.additionalAffinities)
              - del(.redis-ha.affinity)
              - del(.redis-ha.tolerations)
              - del(.redis-ha.topologySpreadConstraints)
              - del(.redis-ha.containerSecurityContext)
        - name: Patch templates
          work-dir: ${source.dir}/helm-charts/charts/argo-cd/templates
          runs: |
            set -eux -o pipefail

            sed -i 's/$redisHa.haproxy.enabled/.Values.haproxy.enabled/' _helpers.tpl
            # HAProxy is a sibling subchart (dhi/haproxy-chart); its Service name is haproxy.fullname, not
            # "{redis-ha fullname}-haproxy" as in the upstream embedded redis-ha chart.
            sed -i 's#        {{- printf "%s-haproxy" (include "redis-ha.fullname" $redisHaContext) | trunc 63 | trimSuffix "-" -}}#        {{- include "haproxy.fullname" (dict "Chart" (dict "Name" "haproxy") "Release" .Release "Values" .Values.haproxy) | trunc 63 | trimSuffix "-" -}}#' _helpers.tpl
            cat "${source.dir}/config/_helpers.redis-ha.append.tpl" >> _helpers.tpl
        - name: helm login
          uses: helm/login@v1
          with:
            registry: dhi.io
        - name: update dependencies
          uses: helm/cmd@v1
          work-dir: ${source.dir}/helm-charts/charts
          privileged: true
          with:
            chart: argo-cd
            cmd: dependency update
        - name: lint
          uses: helm/cmd@v1
          work-dir: ${source.dir}/helm-charts/charts
          with:
            chart: argo-cd
            cmd: lint .
        - name: package
          uses: helm/package@v1
          work-dir: ${source.dir}/helm-charts/charts
          with:
            chart: argo-cd
      paths:
        - type: directory
          path: ${source.dir}/config
          uid: 0
          gid: 0
          mode: "0644"
          source: chart/argocd/config
