image:
  repository: ${mimir.registry}/${mimir.repository}
  tag: ${mimir.tag}@${mimir.digest}

# Applies to every Mimir component, and to the gateway, which have no pod security context of their own.
rbac:
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 65532
    runAsGroup: 65532
    fsGroup: 65532

memcached:
  image:
    repository: ${memcached.registry}/${memcached.repository}
    tag: ${memcached.tag}@${memcached.digest}
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 11211
    runAsGroup: 11211
    fsGroup: 11211

memcachedExporter:
  image:
    repository: ${memcached-exporter.registry}/${memcached-exporter.repository}
    tag: ${memcached-exporter.tag}@${memcached-exporter.digest}

gateway:
  nginx:
    image:
      registry: ${nginx.registry}
      repository: ${nginx.repository}
      tag: ${nginx.tag}@${nginx.digest}

kafka:
  image:
    registry: ${kafka.registry}
    repository: ${kafka.repository}
    tag: ${kafka.tag}@${kafka.digest}
  securityContext:
    runAsNonRoot: true
    runAsUser: 65532
    runAsGroup: 65532
    fsGroup: 65532

rollout_operator:
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 65532
    runAsGroup: 65532
    fsGroup: 65532

# The bundled MinIO subchart is not part of this chart. Object storage must be configured with mimir.structuredConfig.
# THIS IMAGE IS NOT IN THE DHI CATALOG YET, PLEASE CONTACT THE DOCKER TEAM IF NEEDED
minio:
  enabled: false
  image:
    repository: ""
    tag: ""
  mcImage:
    repository: ""
    tag: ""
