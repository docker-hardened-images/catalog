contents:
  repositories:
    - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
  keyring:
    - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
  builds:
    - name: mimir-distributed
      work-dir: ${source.dir}/helm-charts/operations/helm/charts/mimir-distributed
      contents:
        packages:
          - bash
          - ca-certificates
          - coreutils
          - helm=4.1.4-2
          - yq-go
        files:
          - url: git+https://github.com/grafana/mimir.git#mimir-distributed-6.2.2
            checksum: 7966f863acabfaba112f257fcb5d6841fe712ad2
            path: ${source.dir}/helm-charts
            uid: 0
            gid: 0
      pipeline:
        - name: prepare chart
          uses: helm/rudder@v1
          with:
            chart:
              appRef: mimir
              dependencies:
                - alias: rollout_operator
                  condition: rollout_operator.enabled
                  name: rollout-operator
                  ref: dhi/grafana-rollout-operator-chart:0.50.1@sha256:ed959e3ce3d066209bad636129b5ca9c37998bc8390c1f766f7c62096a6aaf88
              description: Docker Hardened Images Helm chart for Grafana Mimir
              images:
                - name: mimir
                  ref: dhi/mimir:3.2.5-debian13@sha256:6ec64f2289d7cdf67b9cecd5f3ae9ceed8d79b4329dd3e70e2ee3658f8b84b40
                - name: kafka
                  ref: dhi/kafka:4.1.2-debian13-native@sha256:0d39b380762b9e438fabe613e17e39b817e138f2ea9905d3e390c124e1dc3e30
                - name: nginx
                  ref: dhi/nginx:1.31.8-debian13@sha256:d6698212a5858b86cd1b102f62ffac59358148e779b1bed23d0eff53c29ee062
                - name: memcached
