  VERSION: 6.2.2
contents:
  repositories:
    - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
  keyring:
    - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
  builds:
    - name: mimir-distributed
      work-dir: ${source.dir}/helm-charts/operations/helm/charts/mimir-distributed
      contents:
        packages:
          - bash
          - ca-certificates
          - coreutils
          - helm=4.1.4-2
          - yq-go
        files:
          - url: git+https://github.com/grafana/mimir.git#mimir-distributed-6.2.2
            checksum: 7966f863acabfaba112f257fcb5d6841fe712ad2
            path: ${source.dir}/helm-charts
            uid: 0
            gid: 0
      pipeline:
        - name: prepare chart
          uses: helm/rudder@v1
          with:
            chart:
              appRef: mimir
              dependencies:
                - alias: rollout_operator
                  condition: rollout_operator.enabled
                  name: rollout-operator
                  ref: dhi/grafana-rollout-operator-chart:0.50.1@sha256:ed959e3ce3d066209bad636129b5ca9c37998bc8390c1f766f7c62096a6aaf88
              description: Docker Hardened Images Helm chart for Grafana Mimir
              images:
                - name: mimir
                  ref: dhi/mimir:3.2.6-debian13@sha256:c46080d9123fcba653886a98375b2a3c0ff155cea5fbd7f785f2852e668562df
                - name: kafka
                  ref: dhi/kafka:4.1.2-debian13-native@sha256:371c36f03cfd907463b9dbf24f932057710a824903e6d31433554e5364aae9d9
                - name: nginx
                  ref: dhi/nginx:1.31.10-debian13@sha256:b14296e656f6ac46a491b92d0646cbb07b1ca32272775ed38cc668637d0c6c66
                - name: memcached
                  ref: dhi/memcached:1.6.45-debian13@sha256:47349fd78381c3e8241e6742b16db2aa091e422b6b2c12cb2553c4edbce3e8f7
                - name: memcached-exporter
                  ref: dhi/memcached-exporter:0.18.0-debian13@sha256:dc3518dd21994beba367b8f80bed4c34623625c5003ae64f427e165e3eeee38a
              name: mimir-distributed-chart
              notes: ${source.dir}/config/NOTES.txt
              sourceUrl: https://github.com/grafana/mimir
            cmd: prepare
            registry: dhi.io
        - name: relocate chart
          uses: helm/rudder@v1
          with:
            cmd: patch
            patches:
              from: ${source.dir}/config
            registry: dhi.io
        - name: remove minio dependency
          uses: yq/patch@v1
          with:
            file: Chart.yaml
            patches:
              - del(.dependencies[] | select(.name == "minio"))
        - name: remove grafana-agent-operator dependency
          uses: yq/patch@v1
          with:
            file: Chart.yaml
            patches:
              - del(.dependencies[] | select(.name == "grafana-agent-operator"))
        - name: helm login
          uses: helm/login@v1
          with:
            registry: dhi.io
        - name: update dependencies
          uses: helm/cmd@v1
          privileged: true
          with:
            chart: .
            cmd: dependency update
        - name: lint
          uses: helm/cmd@v1
          with:
            chart: .
            cmd: lint .
        - name: package
          uses: helm/package@v1
          with:
            chart: .
      paths:
        - type: directory
          path: ${source.dir}/config
          uid: 0
          gid: 0
          mode: "0644"
          source: chart/mimir-distributed/config
