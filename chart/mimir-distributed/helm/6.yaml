                - name: memcached-exporter
                  ref: dhi/memcached-exporter:0.18.0-debian13@sha256:07d42bd57f5dd95bead1a94f6fcae4ea4b9c6486d284eecc34a59af59aa83dff
              name: mimir-distributed-chart
              notes: ${source.dir}/config/NOTES.txt
              sourceUrl: https://github.com/grafana/mimir
            cmd: prepare
            registry: dhi.io
        - name: relocate chart
          uses: helm/rudder@v1
          with:
            cmd: patch
            patches:
              from: ${source.dir}/config
            registry: dhi.io
        - name: remove minio dependency
          uses: yq/patch@v1
          with:
            file: Chart.yaml
            patches:
              - del(.dependencies[] | select(.name == "minio"))
        - name: remove grafana-agent-operator dependency
          uses: yq/patch@v1
          with:
            file: Chart.yaml
            patches:
              - del(.dependencies[] | select(.name == "grafana-agent-operator"))
        - name: helm login
          uses: helm/login@v1
          with:
            registry: dhi.io
        - name: update dependencies
          uses: helm/cmd@v1
          privileged: true
          with:
            chart: .
            cmd: dependency update
        - name: lint
          uses: helm/cmd@v1
          with:
            chart: .
            cmd: lint .
        - name: package
          uses: helm/package@v1
          with:
            chart: .
      paths:
        - type: directory
          path: ${source.dir}/config
          uid: 0
          gid: 0
          mode: "0644"
          source: chart/mimir-distributed/config
