deployment:
  image_name: "${kiali.registry}/${kiali.repository}"
  image_version: "${kiali.tag}@${kiali.digest}"
  version_label: "${kiali.tag}"

  security_context:
    allowPrivilegeEscalation: false
    privileged: false
    readOnlyRootFilesystem: true
    runAsNonRoot: true
    runAsUser: 1000
    runAsGroup: 1000
    seccompProfile:
      type: RuntimeDefault
    capabilities:
      drop:
        - ALL
