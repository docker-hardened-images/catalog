image:
  registry: ${valkey.registry}
  repository: ${valkey.repository}
  tag: ${valkey.tag}@${valkey.digest}

haproxy:
  image:
    registry: ${haproxy.registry}
    repository: ${haproxy.repository}
    tag: ${haproxy.tag}@${haproxy.digest}

metrics:
  exporter:
    image:
      registry: ${redis-exporter.registry}
      repository: ${redis-exporter.repository}
      tag: ${redis-exporter.tag}@${redis-exporter.digest}
