# Docker Hardened Images configuration for Calico (tigera-operator chart).
#
# Upstream uses tigeraOperator.{registry,image,version} composed via the
# tigera-operator.image template helper as "<registry>/<image>:<version>".
# We override these to point at the DHI tigera-operator image; <version>
# carries "<tag>@<digest>" so the resolved reference includes the digest.
tigeraOperator:
  registry: ${tigera-operator.registry}
  image: ${tigera-operator.repository}
  version: ${tigera-operator.tag}@${tigera-operator.digest}

calicoctl:
  image: ${calico-ctl.registry}/${calico-ctl.repository}
  tag: v${calico-ctl.tag}@${calico-ctl.digest}

# Calico component images (node, webhooks, whisker, goldmane, etc.) are deployed by
# the operator using installation.{registry,imagePath,imagePrefix}. Public DHI images are flat
# on dhi.io (dhi.io/calico-<component>:<tag>). imagePath must be "." so the operator does not
# insert the upstream default path segment "calico/". When mirroring to Docker Hub, set
# imagePath to your namespace (for example myorg).
installation:
  registry: dhi.io/
  imagePath: .
  imagePrefix: calico-
