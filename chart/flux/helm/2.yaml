                - name: fluxcd-notification-controller
                  ref: dhi/fluxcd-notification-controller:1.10.1-debian13@sha256:ba60d562464e12fe0cf03938e8533926ce08401f3e0be7e293d3257538abd7af
                - name: fluxcd-source-controller
                  ref: dhi/fluxcd-source-controller:1.10.2-debian13@sha256:d946b7d7e5bf5d95242100b107f5a20a3b9b5aa38741f394963223fe72e3b98d
                - name: fluxcd-source-watcher
