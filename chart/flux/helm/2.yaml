                  ref: dhi/flux-cli:2.10.0-debian13@sha256:249d6d897028f878e3eb988ef88b9a8aaf461c79f98e4a6a26f07880ee2c7fc6
                - name: fluxcd-helm-controller
                  ref: dhi/fluxcd-helm-controller:1.7.1-debian13@sha256:9d710926458526aa849cb7d234fb0fca31e6c6f59df52a01aad76209757d1d2d
