                - name: fluxcd-image-reflector-controller
                  ref: dhi/fluxcd-image-reflector-controller:1.3.0-debian13@sha256:15e5d62a7632a18f208aca23a9526878e468c3c7e06a53f88cd2d3c20000e3b2
                - name: fluxcd-kustomize-controller
