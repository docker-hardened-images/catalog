  FLUXCD_SOURCE_WATCHER_REFERENCE: dhi/fluxcd-source-watcher:2.3.1-debian13@sha256:c529801746c9f9d82595fec7b719f1b41e6cebd1eff20577e7c9a0aed5886aa3
  HELM_VERSION: 4.1.4-2
