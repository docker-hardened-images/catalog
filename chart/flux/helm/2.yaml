                  ref: dhi/fluxcd-image-automation-controller:1.3.0-debian13@sha256:6804c440b331f92c23fd4caeb3ba5a5e3f3522999173d7cb4800045163b7e32d
                - name: fluxcd-image-reflector-controller
                  ref: dhi/fluxcd-image-reflector-controller:1.3.0-debian13@sha256:a1382fb032a4d7f1dfbd3302ef7e36f8c50b44ba4a3f2ab3467cf9a9fa8c5ea3
                - name: fluxcd-kustomize-controller
                  ref: dhi/fluxcd-kustomize-controller:1.10.1-debian13@sha256:98677e3a6b0fa542d6c96edf1b796367357d5b327b2b30dc58a68ebcbb027c13
                - name: fluxcd-notification-controller
                  ref: dhi/fluxcd-notification-controller:1.10.0-debian13@sha256:6917d2b4dbc3f28712e0e72cb82c72f710bfdc618f500bd70606e3f3f2b672a7
                - name: fluxcd-source-controller
                  ref: dhi/fluxcd-source-controller:1.10.1-debian13@sha256:5c1517d9de20e07ebd0ba91c765299a944a00cdd2851e7ce77f6a1a6d5ed7f95
                - name: fluxcd-source-watcher
                  ref: dhi/fluxcd-source-watcher:2.3.1-debian13@sha256:f89bf31563749831a9cf8cb16d1763ff1e29fe234a8dbbd1222c95a63f13b10f
              name: flux-chart
              notes: ${source.dir}/config/NOTES.txt
              sourceUrl: https://github.com/fluxcd/flux2
            cmd: prepare
            registry: dhi.io
        - name: relocate chart
          uses: helm/rudder@v1
          with:
            cmd: patch
            patches:
              from: ${source.dir}/config
            registry: dhi.io
        - name: lint
          uses: helm/cmd@v1
          with:
            chart: .
            cmd: lint .
        - name: package
          uses: helm/package@v1
          with:
            chart: .
      paths:
        - type: directory
          path: ${source.dir}/config
          uid: 0
          gid: 0
          mode: "0644"
          source: chart/flux/config
