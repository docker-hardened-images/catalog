                - name: fluxcd-image-reflector-controller
                  ref: dhi/fluxcd-image-reflector-controller:1.3.0-debian13@sha256:ae7e3fd49a62671cfb7de494d703bd24442f9c332f8ac487b2352e2de7707367
                - name: fluxcd-kustomize-controller
                  ref: dhi/fluxcd-kustomize-controller:1.10.1-debian13@sha256:9098a3b13cca727d9a3a3726c6763f37afd9694f3b4d66042826b9def94f6c91
                - name: fluxcd-notification-controller
                  ref: dhi/fluxcd-notification-controller:1.10.0-debian13@sha256:6917d2b4dbc3f28712e0e72cb82c72f710bfdc618f500bd70606e3f3f2b672a7
                - name: fluxcd-source-controller
                  ref: dhi/fluxcd-source-controller:1.10.1-debian13@sha256:3fd7357a98554352155b4d92482eb34dd6c7c0fc9c9288e1e448eef4ba147b04
                - name: fluxcd-source-watcher
                  ref: dhi/fluxcd-source-watcher:2.3.1-debian13@sha256:ba711639cabbac91e91570d7c99f9c560bac1e68fad3a8b98d22ad0bf912bd8d
              name: flux-chart
              notes: ${source.dir}/config/NOTES.txt
              sourceUrl: https://github.com/fluxcd/flux2
            cmd: prepare
            registry: dhi.io
        - name: relocate chart
          uses: helm/rudder@v1
          with:
            cmd: patch
            patches:
              from: ${source.dir}/config
            registry: dhi.io
        - name: lint
          uses: helm/cmd@v1
          with:
            chart: .
            cmd: lint .
        - name: package
          uses: helm/package@v1
          with:
            chart: .
      paths:
        - type: directory
          path: ${source.dir}/config
          uid: 0
          gid: 0
          mode: "0644"
          source: chart/flux/config
