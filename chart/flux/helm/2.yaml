  SEMVER_VERSION: 2.20.0
  VERSION: 2.20.0
contents:
  repositories:
    - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
  keyring:
    - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
  builds:
    - name: flux-chart
      work-dir: ${source.dir}/helm-charts/charts/flux2
      contents:
        packages:
          - bash
          - ca-certificates
          - coreutils
          - helm=4.1.4-2
        files:
          - url: git+https://github.com/fluxcd-community/helm-charts.git#flux2-2.20.0
            checksum: 4b265918fda46ff6695268295d7309c4d53c4f84
            path: ${source.dir}/helm-charts
            uid: 0
            gid: 0
      pipeline:
        - name: prepare chart
          uses: helm/rudder@v1
          with:
            chart:
              appRef: flux-cli
              description: Docker Hardened Images Helm chart for Flux
              images:
                - name: flux-cli
                  ref: dhi/flux-cli:2.10.0-debian13@sha256:9932fb963704171522206ae4dfc271a5df25ab5a2a2051580257624dc57c949f
                - name: fluxcd-helm-controller
                  ref: dhi/fluxcd-helm-controller:1.7.2-debian13@sha256:e10d99f1c9fc1692b32c29934b6078f3d673f1a5ceb1b76cd958e3d8612dc8b1
                - name: fluxcd-image-automation-controller
                  ref: dhi/fluxcd-image-automation-controller:1.3.0-debian13@sha256:11cfa73de9c752c8de2dabd30a07b64d0f7c2ecaef464e642e1b8d262ea8dbac
                - name: fluxcd-image-reflector-controller
                  ref: dhi/fluxcd-image-reflector-controller:1.3.0-debian13@sha256:150afd410b32845baf41b4250f513ac35d087bd25525de358aab2d04f3d7e993
                - name: fluxcd-kustomize-controller
                  ref: dhi/fluxcd-kustomize-controller:1.10.1-debian13@sha256:f82ff3dac35db0f10a439e51fae18f1ab95a6974ccfe5dd4405a4cbc95461798
                - name: fluxcd-notification-controller
                  ref: dhi/fluxcd-notification-controller:1.10.0-debian13@sha256:da50e1b2c3c9ce12a620d962684bc19db3651ba39ffd648a116b4f262d1c4888
                - name: fluxcd-source-controller
                  ref: dhi/fluxcd-source-controller:1.10.2-debian13@sha256:d946b7d7e5bf5d95242100b107f5a20a3b9b5aa38741f394963223fe72e3b98d
                - name: fluxcd-source-watcher
                  ref: dhi/fluxcd-source-watcher:2.3.1-debian13@sha256:c529801746c9f9d82595fec7b719f1b41e6cebd1eff20577e7c9a0aed5886aa3
              name: flux-chart
              notes: ${source.dir}/config/NOTES.txt
              sourceUrl: https://github.com/fluxcd/flux2
            cmd: prepare
            registry: dhi.io
        - name: relocate chart
          uses: helm/rudder@v1
          with:
            cmd: patch
            patches:
              from: ${source.dir}/config
            registry: dhi.io
        - name: lint
          uses: helm/cmd@v1
          with:
            chart: .
            cmd: lint .
        - name: package
          uses: helm/package@v1
          with:
            chart: .
      paths:
        - type: directory
          path: ${source.dir}/config
          uid: 0
          gid: 0
          mode: "0644"
          source: chart/flux/config
