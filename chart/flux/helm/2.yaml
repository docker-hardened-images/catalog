                  ref: dhi/flux-cli:2.10.0-debian13@sha256:79e5029ec4c1556400aeb0a4223eb39754061db33b8738334d0c11a582663316
                - name: fluxcd-helm-controller
                  ref: dhi/fluxcd-helm-controller:1.7.1-debian13@sha256:414883fd4208b15a560e4173bfc9adb1a80e41f273a34eefcfb360d2f5882253
