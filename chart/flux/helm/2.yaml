contents:
  repositories:
    - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
  keyring:
    - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
  builds:
    - name: flux-chart
      work-dir: ${source.dir}/helm-charts/charts/flux2
      contents:
        packages:
          - bash
          - ca-certificates
          - coreutils
          - helm=4.1.4-2
        files:
          - url: git+https://github.com/fluxcd-community/helm-charts.git#flux2-2.20.0
            checksum: 4b265918fda46ff6695268295d7309c4d53c4f84
            path: ${source.dir}/helm-charts
            uid: 0
            gid: 0
      pipeline:
        - name: prepare chart
          uses: helm/rudder@v1
          with:
            chart:
              appRef: flux-cli
              description: Docker Hardened Images Helm chart for Flux
              images:
                - name: flux-cli
                  ref: dhi/flux-cli:2.10.0-debian13@sha256:a422afc2154dcc4753b0749bb55c1d002ac9a6872a6b2ac03757d6bbcca3c09c
                - name: fluxcd-helm-controller
                  ref: dhi/fluxcd-helm-controller:1.7.1-debian13@sha256:e324392438b714f07da51424792bb10d7df949d1a14a9096bd00adda64c47d27
