                  ref: dhi/flux-cli:2.9.4-debian13@sha256:82e77fdf60dbfa3ee8cc84b2b8f31238786d406b2dc3e949358949af36ab87b2
                - name: fluxcd-helm-controller
                  ref: dhi/fluxcd-helm-controller:1.6.3-debian13@sha256:b0711ab8115c6ecebd52958c71dc50c8bac05c9efe51b6add3c72cebbd7bd213
