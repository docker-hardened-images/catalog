                - name: fluxcd-notification-controller
                  ref: dhi/fluxcd-notification-controller:1.10.0-debian13@sha256:cfa22d8fd75ea93eb93b969a476364bf1d4325835f75d1a0b75b7b589ea608c1
                - name: fluxcd-source-controller
                  ref: dhi/fluxcd-source-controller:1.10.1-debian13@sha256:d28d53232ed157c1ee7297fbdd7fc1addaf276651180090a5c486de07a78100c
                - name: fluxcd-source-watcher
                  ref: dhi/fluxcd-source-watcher:2.3.1-debian13@sha256:86c824647c7b25f909a91c61bb204a95389e76f92324dd9724350182e96d611e
