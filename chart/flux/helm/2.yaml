                - name: fluxcd-notification-controller
                  ref: dhi/fluxcd-notification-controller:1.10.0-debian13@sha256:cfa22d8fd75ea93eb93b969a476364bf1d4325835f75d1a0b75b7b589ea608c1
                - name: fluxcd-source-controller
                  ref: dhi/fluxcd-source-controller:1.10.1-debian13@sha256:aa2e7aebbc89c36426ceb19669ad6ce515b62b7f5c87161d7ec68f17aa5f79ff
                - name: fluxcd-source-watcher
                  ref: dhi/fluxcd-source-watcher:2.3.1-debian13@sha256:b5925e7b875a3332f47a61152497efb0185a54754f5f348554b3ca84f242c197
