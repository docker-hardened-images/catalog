                - name: fluxcd-notification-controller
                  ref: dhi/fluxcd-notification-controller:1.9.3-debian13@sha256:52917efe7ada5ebd2e3a132ccab10ea09dd0d23f287976c84756febcab2bb65c
                - name: fluxcd-source-controller
                  ref: dhi/fluxcd-source-controller:1.9.4-debian13@sha256:8cedc926f2b2bbfd38deb900981cba9cd3fe2cbfe70fd964a10087db272b6cf6
                - name: fluxcd-source-watcher
                  ref: dhi/fluxcd-source-watcher:2.2.3-debian13@sha256:59455d2f6010a3a5b72f3b6ed90d8b2e98c45379a48830d261628bb775c6e0eb
              name: flux-chart
              notes: ${source.dir}/config/NOTES.txt
              sourceUrl: https://github.com/fluxcd/flux2
            cmd: prepare
            registry: dhi.io
        - name: relocate chart
          uses: helm/rudder@v1
          with:
            cmd: patch
            patches:
              from: ${source.dir}/config
            registry: dhi.io
        - name: lint
          uses: helm/cmd@v1
          with:
            chart: .
            cmd: lint .
        - name: package
          uses: helm/package@v1
          with:
            chart: .
      paths:
        - type: directory
          path: ${source.dir}/config
          uid: 0
          gid: 0
          mode: "0644"
          source: chart/flux/config
