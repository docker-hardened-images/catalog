                - name: fluxcd-notification-controller
                  ref: dhi/fluxcd-notification-controller:1.10.0-debian13@sha256:6917d2b4dbc3f28712e0e72cb82c72f710bfdc618f500bd70606e3f3f2b672a7
                - name: fluxcd-source-controller
                  ref: dhi/fluxcd-source-controller:1.10.1-debian13@sha256:37c64618258aa7485a1e638ff6c9b760b7cd279e6ae38d1e34bded8e834e1251
                - name: fluxcd-source-watcher
                  ref: dhi/fluxcd-source-watcher:2.3.1-debian13@sha256:ba711639cabbac91e91570d7c99f9c560bac1e68fad3a8b98d22ad0bf912bd8d
              name: flux-chart
              notes: ${source.dir}/config/NOTES.txt
              sourceUrl: https://github.com/fluxcd/flux2
            cmd: prepare
            registry: dhi.io
        - name: relocate chart
          uses: helm/rudder@v1
          with:
            cmd: patch
            patches:
              from: ${source.dir}/config
            registry: dhi.io
        - name: lint
          uses: helm/cmd@v1
          with:
            chart: .
            cmd: lint .
        - name: package
          uses: helm/package@v1
          with:
            chart: .
      paths:
        - type: directory
          path: ${source.dir}/config
          uid: 0
          gid: 0
          mode: "0644"
          source: chart/flux/config
