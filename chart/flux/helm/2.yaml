                  ref: dhi/fluxcd-image-reflector-controller:1.3.0-debian13@sha256:78f3d459bec6cdb7e19c7cf1df7b84e2230cf03f082f1967ba10617fc458991c
                - name: fluxcd-kustomize-controller
