                - name: fluxcd-notification-controller
                  ref: dhi/fluxcd-notification-controller:1.10.0-debian13@sha256:68270c88bd93caf43d5cc81f05ca4711cef29b97619507866d0ca046d1f2ec2f
                - name: fluxcd-source-controller
                  ref: dhi/fluxcd-source-controller:1.10.1-debian13@sha256:34403245772d5b64bbce983ea02eba55cd60844cc3b9f9f3331d325b99e8ebe3
                - name: fluxcd-source-watcher
