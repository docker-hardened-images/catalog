                - name: fluxcd-notification-controller
                  ref: dhi/fluxcd-notification-controller:1.9.3-debian13@sha256:895c74b23a92aefcfb5c580ab3883e905f339a61e41959899ba888b08364c04d
                - name: fluxcd-source-controller
                  ref: dhi/fluxcd-source-controller:1.9.4-debian13@sha256:37f1c7147087a26417a8a809969b03348cfb15d6038704600e76143257fdb63a
                - name: fluxcd-source-watcher
