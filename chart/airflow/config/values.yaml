postgresql:
  enabled: false

defaultAirflowRepository: ${airflow.registry}/${airflow.repository}
defaultAirflowTag: ${airflow.tag}@${airflow.digest}

images:
  statsd:
    repository: ${prometheus-statsd-exporter.registry}/${prometheus-statsd-exporter.repository}
    tag: ${prometheus-statsd-exporter.tag}@${prometheus-statsd-exporter.digest}
    pullPolicy: IfNotPresent
  pgbouncer:
    repository: ${pgbouncer.registry}/${pgbouncer.repository}
    tag: ${pgbouncer.tag}@${pgbouncer.digest}
    pullPolicy: IfNotPresent
  pgbouncerExporter:
    repository: ${airflow-pgbouncer-exporter.registry}/${airflow-pgbouncer-exporter.repository}
    tag: ${airflow-pgbouncer-exporter.tag}@${airflow-pgbouncer-exporter.digest}
    pullPolicy: IfNotPresent
  gitSync:
    repository: ${git-sync.registry}/${git-sync.repository}
    tag: ${git-sync.tag}@${git-sync.digest}
    pullPolicy: IfNotPresent
  redis:
    repository: ${redis.registry}/${redis.repository}
    tag: ${redis.tag}@${redis.digest}
    pullPolicy: IfNotPresent
  otelCollector:
    repository: ${opentelemetry-collector.registry}/${opentelemetry-collector.repository}
    tag: ${opentelemetry-collector.tag}@${opentelemetry-collector.digest}
    pullPolicy: IfNotPresent

uid: 50000
gid: 50000

securityContexts:
  pod:
    runAsUser: 50000
    runAsGroup: 50000
    fsGroup: 50000
    runAsNonRoot: true
  container:
    allowPrivilegeEscalation: false
    capabilities:
      drop:
        - ALL

pgbouncer:
  securityContexts:
    pod:
      runAsNonRoot: true
      runAsUser: 65532
      runAsGroup: 65532
      fsGroup: 65532
    container:
      allowPrivilegeEscalation: false
      capabilities:
        drop:
          - ALL
  metricsExporterSidecar:
    securityContexts:
      container:
        allowPrivilegeEscalation: false
        capabilities:
          drop:
            - ALL
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532

statsd:
  securityContexts:
    pod:
      runAsNonRoot: true
      runAsUser: 65532
      runAsGroup: 65532
      fsGroup: 65532
    container:
      allowPrivilegeEscalation: false
      capabilities:
        drop:
          - ALL

redis:
  securityContexts:
    pod:
      runAsNonRoot: true
      runAsUser: 65532
      runAsGroup: 65532
      fsGroup: 65532
    container:
      allowPrivilegeEscalation: false
      capabilities:
        drop:
          - ALL

otelCollector:
  securityContexts:
    pod:
      runAsNonRoot: true
      runAsUser: 65532
      runAsGroup: 65532
      fsGroup: 65532
    container:
      allowPrivilegeEscalation: false
      capabilities:
        drop:
          - ALL
  # The upstream chart defaults to the deprecated `logging` exporter. Override with `debug`,
  # which is its replacement in OpenTelemetry Collector >= 0.86.
  config: |
    extensions:
      health_check:
        endpoint: 0.0.0.0:13133

    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: 0.0.0.0:{{ .Values.ports.otelCollectorOtlpGrpc }}
          http:
            endpoint: 0.0.0.0:{{ .Values.ports.otelCollectorOtlpHttp }}

    processors:
      batch: {}

    exporters:
      debug:
        verbosity: basic

    service:
      extensions: [health_check]
      pipelines:
        traces:
          receivers: [otlp]
          processors: [batch]
          exporters: [debug]
        metrics:
          receivers: [otlp]
          processors: [batch]
          exporters: [debug]

dags:
  gitSync:
    securityContexts:
      container:
        allowPrivilegeEscalation: false
        capabilities:
          drop:
            - ALL
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
