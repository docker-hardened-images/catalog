# syntax=dhi.io/build:2-helm3

name: Apache Airflow Helm chart 2.x
image: dhi.io/airflow-chart
variant: helm
tags:
  - 2.0.0
platforms:
  - linux/amd64
vars:
  AIRFLOW_REFERENCE: dhi/airflow:3.4.0-python3.13-debian13-compat@sha256:4519defa4627e886be498a9e20a6ee03d8a8b3ad114a035478ef30964f41fd62
  APPVERSION: 3.4.0
  APPVERSION_MATCH: 3.4.0
  CHART_COMMIT_SHA: 619a787ac81e8b7c8a9102fc78e3f0b00625d04e
  CHART_HELM_NAME: airflow-chart
  DHI_NAMESPACE: dhi
  DHI_PREFIX: ""
  DHI_REGISTRY: dhi.io
  DHI_SKIP_CONTEXT_COPY: "true"
  GIT_SYNC_REFERENCE: dhi/git-sync:4.8.1-debian13@sha256:b912ed594283a59ebc50515db26cc1fb37cd44f86a4c942f2bfee2316b37b36a
  HELM_VERSION: 4.1.4-2
  OPENTELEMETRY_COLLECTOR_REFERENCE: dhi/opentelemetry-collector:0.166.0-debian13-contrib@sha256:5e5039724885f63af4e01b92fbf9523e4dcb4f48e7cf1e6d98f766972020a773
  PGBOUNCER_EXPORTER_REFERENCE: dhi/airflow-pgbouncer-exporter:0.22.0-debian13@sha256:dc47f9b5e7fa120bc3d6d3ec3dc3110ab73bcc1f718d382c496c1975658260c7
  PGBOUNCER_REFERENCE: dhi/pgbouncer:1.25.2-debian13@sha256:69321e67651f363f64012032d1cf965fb82499fbc38c2d7e0d4463baa99ca353
  PROMETHEUS_STATSD_EXPORTER_REFERENCE: dhi/prometheus-statsd-exporter:0.31.0-debian13@sha256:bc82d9b149f667f22c9556f2f1b53ffe1b42c63f6ca4a2e21d17a64746d7dd48
  REDIS_REFERENCE: dhi/redis:8.10.3-debian13-compat@sha256:3cce99055b326c4edf337673361e09d3f8c985a76d1cd739dd961bc791804a0c
  SEMVER_MAJOR_MINOR_VERSION: "2.0"
  SEMVER_MAJOR_VERSION: "2"
  SEMVER_VERSION: 2.0.0
  VERSION: 2.0.0
contents:
  repositories:
    - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
  keyring:
    - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
  builds:
    - name: airflow
      work-dir: ${source.dir}/helm-charts/chart
      contents:
        packages:
          - bash
          - ca-certificates
          - coreutils
          - yq-go
          - helm=4.1.4-2
        files:
          - url: git+https://github.com/apache/airflow.git#3.4.0
            checksum: 619a787ac81e8b7c8a9102fc78e3f0b00625d04e
            path: ${source.dir}/helm-charts
            uid: 0
            gid: 0
      pipeline:
        - name: update chart dependencies
          uses: yq/patch@v1
          with:
            file: Chart.yaml
            patches:
              - del(.dependencies[] | select(.name == "postgresql"))
        - name: prepare chart
          uses: helm/rudder@v1
          with:
            chart:
              appRef: airflow
              dependencies: null
              description: Docker Hardened Images Helm chart for Apache Airflow
              images:
                - name: airflow
                  ref: dhi/airflow:3.4.0-python3.13-debian13-compat@sha256:4519defa4627e886be498a9e20a6ee03d8a8b3ad114a035478ef30964f41fd62
                - name: prometheus-statsd-exporter
                  ref: dhi/prometheus-statsd-exporter:0.31.0-debian13@sha256:bc82d9b149f667f22c9556f2f1b53ffe1b42c63f6ca4a2e21d17a64746d7dd48
                - name: pgbouncer
                  ref: dhi/pgbouncer:1.25.2-debian13@sha256:69321e67651f363f64012032d1cf965fb82499fbc38c2d7e0d4463baa99ca353
                - name: airflow-pgbouncer-exporter
                  ref: dhi/airflow-pgbouncer-exporter:0.22.0-debian13@sha256:dc47f9b5e7fa120bc3d6d3ec3dc3110ab73bcc1f718d382c496c1975658260c7
                - name: git-sync
                  ref: dhi/git-sync:4.8.1-debian13@sha256:b912ed594283a59ebc50515db26cc1fb37cd44f86a4c942f2bfee2316b37b36a
                - name: redis
                  ref: dhi/redis:8.10.3-debian13-compat@sha256:3cce99055b326c4edf337673361e09d3f8c985a76d1cd739dd961bc791804a0c
                - name: opentelemetry-collector
                  ref: dhi/opentelemetry-collector:0.166.0-debian13-contrib@sha256:5e5039724885f63af4e01b92fbf9523e4dcb4f48e7cf1e6d98f766972020a773
              name: airflow-chart
              notes: ${source.dir}/config/NOTES.txt
              sourceUrl: https://github.com/apache/airflow
              updateDependencies: true
            cmd: prepare
            registry: dhi.io
        - name: relocate chart
          uses: helm/rudder@v1
          with:
            cmd: patch
            patches:
              from: ${source.dir}/config
            registry: dhi.io
        - name: patch pgbouncer command
          runs: |
            set -eux -o pipefail

            yq -i '.pgbouncer.command = ["pgbouncer", "/etc/pgbouncer/pgbouncer.ini"]' values.yaml
        - name: lint
          uses: helm/cmd@v1
          with:
            chart: .
            cmd: lint .
        - name: package
          uses: helm/package@v1
          with:
            chart: .
      paths:
        - type: directory
          path: ${source.dir}/config
          uid: 0
          gid: 0
          mode: "0644"
          source: chart/airflow/config
