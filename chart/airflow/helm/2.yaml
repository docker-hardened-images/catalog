# syntax=dhi.io/build:2-helm3

name: Apache Airflow Helm chart 2.x
image: dhi.io/airflow-chart
variant: helm
tags:
  - 2.0.0
platforms:
  - linux/amd64
vars:
  AIRFLOW_REFERENCE: dhi/airflow:3.4.0-python3.13-debian13-compat@sha256:494f81b588b1772de0f956be4cfd73ffa72cb8be8a214ed55dd9ec320ff34b8b
  APPVERSION: 3.4.0
  APPVERSION_MATCH: 3.4.0
  CHART_COMMIT_SHA: 619a787ac81e8b7c8a9102fc78e3f0b00625d04e
  CHART_HELM_NAME: airflow-chart
  DHI_NAMESPACE: dhi
  DHI_PREFIX: ""
  DHI_REGISTRY: dhi.io
  DHI_SKIP_CONTEXT_COPY: "true"
  GIT_SYNC_REFERENCE: dhi/git-sync:4.8.0-debian13@sha256:b221824a5b2f445a00fef53580f6f4d0baebd9b7cda88b67c529b1972aa93ae8
  HELM_VERSION: 4.1.4-2
  OPENTELEMETRY_COLLECTOR_REFERENCE: dhi/opentelemetry-collector:0.165.0-debian13-contrib@sha256:8ecab6774570e7a152e5b01c21830c6286c283a55fc3ba75eb12eeeed3fff318
  PGBOUNCER_EXPORTER_REFERENCE: dhi/airflow-pgbouncer-exporter:0.22.0-debian13@sha256:dc47f9b5e7fa120bc3d6d3ec3dc3110ab73bcc1f718d382c496c1975658260c7
  PGBOUNCER_REFERENCE: dhi/pgbouncer:1.25.2-debian13@sha256:ad5d2a8eda22514616263b9e6ef0d84c5ddff9df0f2d203d3ca2f43d74bd303d
  PROMETHEUS_STATSD_EXPORTER_REFERENCE: dhi/prometheus-statsd-exporter:0.31.0-debian13@sha256:bc82d9b149f667f22c9556f2f1b53ffe1b42c63f6ca4a2e21d17a64746d7dd48
  REDIS_REFERENCE: dhi/redis:8.10.3-debian13-compat@sha256:0251d5c7eb73c18d47b9986a8fcd003286c368bced064466cb1c751d9e93da10
  SEMVER_MAJOR_MINOR_VERSION: "2.0"
  SEMVER_MAJOR_VERSION: "2"
  SEMVER_VERSION: 2.0.0
  VERSION: 2.0.0
contents:
  repositories:
    - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
  keyring:
    - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
  builds:
    - name: airflow
      work-dir: ${source.dir}/helm-charts/chart
      contents:
        packages:
          - bash
          - ca-certificates
          - coreutils
          - yq-go
          - helm=4.1.4-2
        files:
          - url: git+https://github.com/apache/airflow.git#3.4.0
            checksum: 619a787ac81e8b7c8a9102fc78e3f0b00625d04e
            path: ${source.dir}/helm-charts
            uid: 0
            gid: 0
      pipeline:
        - name: update chart dependencies
          uses: yq/patch@v1
          with:
            file: Chart.yaml
            patches:
              - del(.dependencies[] | select(.name == "postgresql"))
        - name: prepare chart
          uses: helm/rudder@v1
          with:
            chart:
              appRef: airflow
              dependencies: null
              description: Docker Hardened Images Helm chart for Apache Airflow
              images:
                - name: airflow
                  ref: dhi/airflow:3.4.0-python3.13-debian13-compat@sha256:494f81b588b1772de0f956be4cfd73ffa72cb8be8a214ed55dd9ec320ff34b8b
                - name: prometheus-statsd-exporter
                  ref: dhi/prometheus-statsd-exporter:0.31.0-debian13@sha256:bc82d9b149f667f22c9556f2f1b53ffe1b42c63f6ca4a2e21d17a64746d7dd48
                - name: pgbouncer
                  ref: dhi/pgbouncer:1.25.2-debian13@sha256:ad5d2a8eda22514616263b9e6ef0d84c5ddff9df0f2d203d3ca2f43d74bd303d
                - name: airflow-pgbouncer-exporter
                  ref: dhi/airflow-pgbouncer-exporter:0.22.0-debian13@sha256:dc47f9b5e7fa120bc3d6d3ec3dc3110ab73bcc1f718d382c496c1975658260c7
                - name: git-sync
                  ref: dhi/git-sync:4.8.0-debian13@sha256:b221824a5b2f445a00fef53580f6f4d0baebd9b7cda88b67c529b1972aa93ae8
                - name: redis
                  ref: dhi/redis:8.10.3-debian13-compat@sha256:0251d5c7eb73c18d47b9986a8fcd003286c368bced064466cb1c751d9e93da10
                - name: opentelemetry-collector
                  ref: dhi/opentelemetry-collector:0.165.0-debian13-contrib@sha256:8ecab6774570e7a152e5b01c21830c6286c283a55fc3ba75eb12eeeed3fff318
              name: airflow-chart
              notes: ${source.dir}/config/NOTES.txt
              sourceUrl: https://github.com/apache/airflow
              updateDependencies: true
            cmd: prepare
            registry: dhi.io
        - name: relocate chart
          uses: helm/rudder@v1
          with:
            cmd: patch
            patches:
              from: ${source.dir}/config
            registry: dhi.io
        - name: patch pgbouncer command
          runs: |
            set -eux -o pipefail

            yq -i '.pgbouncer.command = ["pgbouncer", "/etc/pgbouncer/pgbouncer.ini"]' values.yaml
        - name: lint
          uses: helm/cmd@v1
          with:
            chart: .
            cmd: lint .
        - name: package
          uses: helm/package@v1
          with:
            chart: .
      paths:
        - type: directory
          path: ${source.dir}/config
          uid: 0
          gid: 0
          mode: "0644"
          source: chart/airflow/config
