# syntax=dhi.io/build:2-helm3

name: Apache Airflow Helm chart 2.x
image: dhi.io/airflow-chart
variant: helm
tags:
  - 2.0.0
platforms:
  - linux/amd64
vars:
  AIRFLOW_REFERENCE: dhi/airflow:3.4.0-python3.13-debian13-compat@sha256:af540f71bbf9269cdd7830a8fddde53f1ea5e30ef32740f25bca9f8551cc3924
  APPVERSION: 3.4.0
  APPVERSION_MATCH: 3.4.0
  CHART_COMMIT_SHA: 619a787ac81e8b7c8a9102fc78e3f0b00625d04e
  CHART_HELM_NAME: airflow-chart
  DHI_NAMESPACE: dhi
  DHI_PREFIX: ""
  DHI_REGISTRY: dhi.io
  DHI_SKIP_CONTEXT_COPY: "true"
  GIT_SYNC_REFERENCE: dhi/git-sync:4.8.0-debian13@sha256:41d3a1819added2eb921763887cdb704d654c3dcaea9c5ce31fc0ce84ba67135
  HELM_VERSION: 4.1.4-2
  OPENTELEMETRY_COLLECTOR_REFERENCE: dhi/opentelemetry-collector:0.165.0-debian13-contrib@sha256:68cb7396243e1f4cf7bf1769ae6e7af8f7d7d1ed97cd533f7b5de83155084ba0
  PGBOUNCER_EXPORTER_REFERENCE: dhi/airflow-pgbouncer-exporter:0.21.0-debian13@sha256:1b565401c9291068877630aa5b0f09cfe58ecb0113d7b44a3add520673fb408e
  PGBOUNCER_REFERENCE: dhi/pgbouncer:1.25.2-debian13@sha256:dab4c4ccc1cdb3318e0a6aee77ab75a658c20b0b7c2b1bc83d15991c8806904f
  PROMETHEUS_STATSD_EXPORTER_REFERENCE: dhi/prometheus-statsd-exporter:0.31.0-debian13@sha256:c72b33c5c6d94cf59e0bf9f4bdd8c2bd727848cc460ed7f46029ed55f7de36be
  REDIS_REFERENCE: dhi/redis:8.10.3-debian13-compat@sha256:a4dcf842229e2036bd27a772928cd223a369de356a4f74171d770c5c6dc0b8e0
  SEMVER_MAJOR_MINOR_VERSION: "2.0"
  SEMVER_MAJOR_VERSION: "2"
  SEMVER_VERSION: 2.0.0
  VERSION: 2.0.0
contents:
  repositories:
    - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
  keyring:
    - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
  builds:
    - name: airflow
      work-dir: ${source.dir}/helm-charts/chart
      contents:
        packages:
          - bash
          - ca-certificates
          - coreutils
          - yq-go
          - helm=4.1.4-2
        files:
          - url: git+https://github.com/apache/airflow.git#3.4.0
            checksum: 619a787ac81e8b7c8a9102fc78e3f0b00625d04e
            path: ${source.dir}/helm-charts
            uid: 0
            gid: 0
      pipeline:
        - name: update chart dependencies
          uses: yq/patch@v1
          with:
            file: Chart.yaml
            patches:
              - del(.dependencies[] | select(.name == "postgresql"))
        - name: prepare chart
          uses: helm/rudder@v1
          with:
            chart:
              appRef: airflow
              dependencies: null
              description: Docker Hardened Images Helm chart for Apache Airflow
              images:
                - name: airflow
                  ref: dhi/airflow:3.4.0-python3.13-debian13-compat@sha256:af540f71bbf9269cdd7830a8fddde53f1ea5e30ef32740f25bca9f8551cc3924
                - name: prometheus-statsd-exporter
                  ref: dhi/prometheus-statsd-exporter:0.31.0-debian13@sha256:c72b33c5c6d94cf59e0bf9f4bdd8c2bd727848cc460ed7f46029ed55f7de36be
                - name: pgbouncer
                  ref: dhi/pgbouncer:1.25.2-debian13@sha256:dab4c4ccc1cdb3318e0a6aee77ab75a658c20b0b7c2b1bc83d15991c8806904f
                - name: airflow-pgbouncer-exporter
                  ref: dhi/airflow-pgbouncer-exporter:0.21.0-debian13@sha256:1b565401c9291068877630aa5b0f09cfe58ecb0113d7b44a3add520673fb408e
                - name: git-sync
                  ref: dhi/git-sync:4.8.0-debian13@sha256:41d3a1819added2eb921763887cdb704d654c3dcaea9c5ce31fc0ce84ba67135
                - name: redis
                  ref: dhi/redis:8.10.3-debian13-compat@sha256:a4dcf842229e2036bd27a772928cd223a369de356a4f74171d770c5c6dc0b8e0
                - name: opentelemetry-collector
                  ref: dhi/opentelemetry-collector:0.165.0-debian13-contrib@sha256:68cb7396243e1f4cf7bf1769ae6e7af8f7d7d1ed97cd533f7b5de83155084ba0
              name: airflow-chart
              notes: ${source.dir}/config/NOTES.txt
              sourceUrl: https://github.com/apache/airflow
              updateDependencies: true
            cmd: prepare
            registry: dhi.io
        - name: relocate chart
          uses: helm/rudder@v1
          with:
            cmd: patch
            patches:
              from: ${source.dir}/config
            registry: dhi.io
        - name: patch pgbouncer command
          runs: |
            set -eux -o pipefail

            yq -i '.pgbouncer.command = ["pgbouncer", "/etc/pgbouncer/pgbouncer.ini"]' values.yaml
        - name: lint
          uses: helm/cmd@v1
          with:
            chart: .
            cmd: lint .
        - name: package
          uses: helm/package@v1
          with:
            chart: .
      paths:
        - type: directory
          path: ${source.dir}/config
          uid: 0
          gid: 0
          mode: "0644"
          source: chart/airflow/config
