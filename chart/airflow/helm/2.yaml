# syntax=dhi.io/build:2-helm3

name: Apache Airflow Helm chart 2.x
image: dhi.io/airflow-chart
variant: helm
tags:
  - 2.0.0
platforms:
  - linux/amd64
vars:
  AIRFLOW_REFERENCE: dhi/airflow:3.3.2-python3.13-debian13-compat@sha256:43eb0266dbac93fc41cc14c9e7302d973c451a4a73b4d028ab0b93a0a012752f
  APPVERSION: 3.3.2
  APPVERSION_MATCH: 3.3.2
  CHART_COMMIT_SHA: aa19d2dbb9ed187ec01957a92848d9b005e9ba9d
  CHART_HELM_NAME: airflow-chart
  DHI_NAMESPACE: dhi
  DHI_PREFIX: ""
  DHI_REGISTRY: dhi.io
  DHI_SKIP_CONTEXT_COPY: "true"
  GIT_SYNC_REFERENCE: dhi/git-sync:4.8.0-debian13@sha256:d5126ae8cafed5d9c052342d93ae75cdc5a26ff3a2924d2ab55d90031e72164a
  HELM_VERSION: 4.1.4-2
  OPENTELEMETRY_COLLECTOR_REFERENCE: dhi/opentelemetry-collector:0.164.0-debian13-contrib@sha256:42dab482caba50114d7da0d45801c5f2e5df2f14564c0e541c8699427743144d
  PGBOUNCER_EXPORTER_REFERENCE: dhi/airflow-pgbouncer-exporter:0.21.0-debian13@sha256:ba4b11bc498e662138d4b6c17dfcd55885bc8ef0d823e203e068b7dc8476fe0e
  PGBOUNCER_REFERENCE: dhi/pgbouncer:1.25.2-debian13@sha256:d1d6f571866c32ee7e5327de3fbc491df351b69e675c513582d90e12f79f46ea
  PROMETHEUS_STATSD_EXPORTER_REFERENCE: dhi/prometheus-statsd-exporter:0.31.0-debian13@sha256:4bb805c83a583ac2059fb5e89a29df45e39b69941f65457064b9ed0657a4c2cb
  REDIS_REFERENCE: dhi/redis:8.10.3-debian13-compat@sha256:747a033b5ac9f8b1a9c3644c58c68668c6fa184c9d8ab156f825ac5be4b83ba5
  SEMVER_MAJOR_MINOR_VERSION: "2.0"
  SEMVER_MAJOR_VERSION: "2"
  SEMVER_VERSION: 2.0.0
  VERSION: 2.0.0
contents:
  repositories:
    - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
  keyring:
    - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
  builds:
    - name: airflow
      work-dir: ${source.dir}/helm-charts/chart
      contents:
        packages:
          - bash
          - ca-certificates
          - coreutils
          - yq-go
          - helm=4.1.4-2
        files:
          - url: git+https://github.com/apache/airflow.git#3.3.2
            checksum: aa19d2dbb9ed187ec01957a92848d9b005e9ba9d
            path: ${source.dir}/helm-charts
            uid: 0
            gid: 0
      pipeline:
        - name: update chart dependencies
          uses: yq/patch@v1
          with:
            file: Chart.yaml
            patches:
              - del(.dependencies[] | select(.name == "postgresql"))
        - name: prepare chart
          uses: helm/rudder@v1
          with:
            chart:
              appRef: airflow
              dependencies: null
              description: Docker Hardened Images Helm chart for Apache Airflow
              images:
                - name: airflow
                  ref: dhi/airflow:3.3.2-python3.13-debian13-compat@sha256:43eb0266dbac93fc41cc14c9e7302d973c451a4a73b4d028ab0b93a0a012752f
                - name: prometheus-statsd-exporter
                  ref: dhi/prometheus-statsd-exporter:0.31.0-debian13@sha256:4bb805c83a583ac2059fb5e89a29df45e39b69941f65457064b9ed0657a4c2cb
                - name: pgbouncer
                  ref: dhi/pgbouncer:1.25.2-debian13@sha256:d1d6f571866c32ee7e5327de3fbc491df351b69e675c513582d90e12f79f46ea
                - name: airflow-pgbouncer-exporter
                  ref: dhi/airflow-pgbouncer-exporter:0.21.0-debian13@sha256:ba4b11bc498e662138d4b6c17dfcd55885bc8ef0d823e203e068b7dc8476fe0e
                - name: git-sync
                  ref: dhi/git-sync:4.8.0-debian13@sha256:d5126ae8cafed5d9c052342d93ae75cdc5a26ff3a2924d2ab55d90031e72164a
                - name: redis
                  ref: dhi/redis:8.10.3-debian13-compat@sha256:747a033b5ac9f8b1a9c3644c58c68668c6fa184c9d8ab156f825ac5be4b83ba5
                - name: opentelemetry-collector
                  ref: dhi/opentelemetry-collector:0.164.0-debian13-contrib@sha256:42dab482caba50114d7da0d45801c5f2e5df2f14564c0e541c8699427743144d
              name: airflow-chart
              notes: ${source.dir}/config/NOTES.txt
              sourceUrl: https://github.com/apache/airflow
              updateDependencies: true
            cmd: prepare
            registry: dhi.io
        - name: relocate chart
          uses: helm/rudder@v1
          with:
            cmd: patch
            patches:
              from: ${source.dir}/config
            registry: dhi.io
        - name: patch pgbouncer command
          runs: |
            set -eux -o pipefail

            yq -i '.pgbouncer.command = ["pgbouncer", "/etc/pgbouncer/pgbouncer.ini"]' values.yaml
        - name: lint
          uses: helm/cmd@v1
          with:
            chart: .
            cmd: lint .
        - name: package
          uses: helm/package@v1
          with:
            chart: .
      paths:
        - type: directory
          path: ${source.dir}/config
          uid: 0
          gid: 0
          mode: "0644"
          source: chart/airflow/config
