# syntax=dhi.io/build:2-helm3

name: Apache Airflow Helm chart 2.x
image: dhi.io/airflow-chart
variant: helm
tags:
  - 2.0.0
platforms:
  - linux/amd64
vars:
  AIRFLOW_REFERENCE: dhi/airflow:3.3.2-python3.13-debian13-compat@sha256:69137eed09ab1b2726242c5a5c2304466aa3c2428ca0c27bb38b4dfda8189130
  APPVERSION: 3.3.2
  APPVERSION_MATCH: 3.3.2
  CHART_COMMIT_SHA: aa19d2dbb9ed187ec01957a92848d9b005e9ba9d
  CHART_HELM_NAME: airflow-chart
  DHI_NAMESPACE: dhi
  DHI_PREFIX: ""
  DHI_REGISTRY: dhi.io
  DHI_SKIP_CONTEXT_COPY: "true"
  GIT_SYNC_REFERENCE: dhi/git-sync:4.7.1-debian13@sha256:f12a87691894fb5295f12bed0acbbf91786fb1c51128dfb89fb399cc383e4037
  HELM_VERSION: 4.1.4-2
  OPENTELEMETRY_COLLECTOR_REFERENCE: dhi/opentelemetry-collector:0.162.0-debian13-contrib@sha256:58fe1e57abf3eb03807e4f8d2ccf1838d6cc561154594db482948cbd07207c2f
  PGBOUNCER_EXPORTER_REFERENCE: dhi/airflow-pgbouncer-exporter:0.21.0-debian13@sha256:e1ee8cf4f19c248fdf1ecf2fed65bc3d61fc51ffc762f46dd0904f098e3b0620
  PGBOUNCER_REFERENCE: dhi/pgbouncer:1.25.2-debian13@sha256:f87295a30831984b1bd4bbf356e833fde61af6de1e7a58975511ad381630d5f9
  PROMETHEUS_STATSD_EXPORTER_REFERENCE: dhi/prometheus-statsd-exporter:0.31.0-debian13@sha256:64f56123818ba49230e36d4908cb69c65bbd5d4952aa5c35c4f20d118c42cdab
  REDIS_REFERENCE: dhi/redis:8.10.2-debian13-compat@sha256:596c6b9c9a190bfc51893c2a0e8c10d987d1d080ed9a2ac6137d7d909ccfd0a7
  SEMVER_MAJOR_MINOR_VERSION: "2.0"
  SEMVER_MAJOR_VERSION: "2"
  SEMVER_VERSION: 2.0.0
  VERSION: 2.0.0
contents:
  repositories:
    - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
  keyring:
    - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
  builds:
    - name: airflow
      work-dir: ${source.dir}/helm-charts/chart
      contents:
        packages:
          - bash
          - ca-certificates
          - coreutils
          - yq-go
          - helm=4.1.4-2
        files:
          - url: git+https://github.com/apache/airflow.git#3.3.2
            checksum: aa19d2dbb9ed187ec01957a92848d9b005e9ba9d
            path: ${source.dir}/helm-charts
            uid: 0
            gid: 0
      pipeline:
        - name: update chart dependencies
          uses: yq/patch@v1
          with:
            file: Chart.yaml
            patches:
              - del(.dependencies[] | select(.name == "postgresql"))
        - name: prepare chart
          uses: helm/rudder@v1
          with:
            chart:
              appRef: airflow
              dependencies: null
              description: Docker Hardened Images Helm chart for Apache Airflow
              images:
                - name: airflow
                  ref: dhi/airflow:3.3.2-python3.13-debian13-compat@sha256:69137eed09ab1b2726242c5a5c2304466aa3c2428ca0c27bb38b4dfda8189130
                - name: prometheus-statsd-exporter
                  ref: dhi/prometheus-statsd-exporter:0.31.0-debian13@sha256:64f56123818ba49230e36d4908cb69c65bbd5d4952aa5c35c4f20d118c42cdab
                - name: pgbouncer
                  ref: dhi/pgbouncer:1.25.2-debian13@sha256:f87295a30831984b1bd4bbf356e833fde61af6de1e7a58975511ad381630d5f9
                - name: airflow-pgbouncer-exporter
                  ref: dhi/airflow-pgbouncer-exporter:0.21.0-debian13@sha256:e1ee8cf4f19c248fdf1ecf2fed65bc3d61fc51ffc762f46dd0904f098e3b0620
                - name: git-sync
                  ref: dhi/git-sync:4.7.1-debian13@sha256:f12a87691894fb5295f12bed0acbbf91786fb1c51128dfb89fb399cc383e4037
                - name: redis
                  ref: dhi/redis:8.10.2-debian13-compat@sha256:596c6b9c9a190bfc51893c2a0e8c10d987d1d080ed9a2ac6137d7d909ccfd0a7
                - name: opentelemetry-collector
                  ref: dhi/opentelemetry-collector:0.162.0-debian13-contrib@sha256:58fe1e57abf3eb03807e4f8d2ccf1838d6cc561154594db482948cbd07207c2f
              name: airflow-chart
              notes: ${source.dir}/config/NOTES.txt
              sourceUrl: https://github.com/apache/airflow
              updateDependencies: true
            cmd: prepare
            registry: dhi.io
        - name: relocate chart
          uses: helm/rudder@v1
          with:
            cmd: patch
            patches:
              from: ${source.dir}/config
            registry: dhi.io
        - name: patch pgbouncer command
          runs: |
            set -eux -o pipefail

            yq -i '.pgbouncer.command = ["pgbouncer", "/etc/pgbouncer/pgbouncer.ini"]' values.yaml
        - name: lint
          uses: helm/cmd@v1
          with:
            chart: .
            cmd: lint .
        - name: package
          uses: helm/package@v1
          with:
            chart: .
      paths:
        - type: directory
          path: ${source.dir}/config
          uid: 0
          gid: 0
          mode: "0644"
          source: chart/airflow/config
