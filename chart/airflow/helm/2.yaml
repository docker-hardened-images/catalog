# syntax=dhi.io/build:2-helm3

name: Apache Airflow Helm chart 2.x
image: dhi.io/airflow-chart
variant: helm
tags:
  - 2.0.0
platforms:
  - linux/amd64
vars:
  AIRFLOW_REFERENCE: dhi/airflow:3.3.2-python3.13-debian13-compat@sha256:9caff9efea23c7e0654e9e733d55a4832598b8ec52378ec5e6ccf08c3bbdbed0
  APPVERSION: 3.3.2
  APPVERSION_MATCH: 3.3.2
  CHART_COMMIT_SHA: aa19d2dbb9ed187ec01957a92848d9b005e9ba9d
  CHART_HELM_NAME: airflow-chart
  DHI_NAMESPACE: dhi
  DHI_PREFIX: ""
  DHI_REGISTRY: dhi.io
  DHI_SKIP_CONTEXT_COPY: "true"
  GIT_SYNC_REFERENCE: dhi/git-sync:4.7.1-debian13@sha256:2a3ae0808e59ae9c742e9533b9d8e7329757181c614fa6b49c1d0574f52de6e9
  HELM_VERSION: 4.1.4-2
  OPENTELEMETRY_COLLECTOR_REFERENCE: dhi/opentelemetry-collector:0.162.0-debian13-contrib@sha256:a65e3c84c9edf1d56fdf3e827288006e8f951974d55168da02337acb88588b9c
  PGBOUNCER_EXPORTER_REFERENCE: dhi/airflow-pgbouncer-exporter:0.21.0-debian13@sha256:0d15dd3ea4182ab809f90423964b653b8b19b8b4cde0d272fb5158f2cbfa6f97
  PGBOUNCER_REFERENCE: dhi/pgbouncer:1.25.2-debian13@sha256:39a136f73bc1587ef719c1ea59024a7c54ded91efc5e0991826bb5369994a622
  PROMETHEUS_STATSD_EXPORTER_REFERENCE: dhi/prometheus-statsd-exporter:0.31.0-debian13@sha256:eaf3356ef31b713d5408b3460e5a7e8ad2916c387daaee7c12a2df736107580e
  REDIS_REFERENCE: dhi/redis:8.10.2-debian13-compat@sha256:8477e3456e63d1777b0df44658d8bb93b40ca0d0442df89222bd0ca4612b662f
  SEMVER_MAJOR_MINOR_VERSION: "2.0"
  SEMVER_MAJOR_VERSION: "2"
  SEMVER_VERSION: 2.0.0
  VERSION: 2.0.0
contents:
  repositories:
    - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
  keyring:
    - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
  builds:
    - name: airflow
      work-dir: ${source.dir}/helm-charts/chart
      contents:
        packages:
          - bash
          - ca-certificates
          - coreutils
          - yq-go
          - helm=4.1.4-2
        files:
          - url: git+https://github.com/apache/airflow.git#3.3.2
            checksum: aa19d2dbb9ed187ec01957a92848d9b005e9ba9d
            path: ${source.dir}/helm-charts
            uid: 0
            gid: 0
      pipeline:
        - name: update chart dependencies
          uses: yq/patch@v1
          with:
            file: Chart.yaml
            patches:
              - del(.dependencies[] | select(.name == "postgresql"))
        - name: prepare chart
          uses: helm/rudder@v1
          with:
            chart:
              appRef: airflow
              dependencies: null
              description: Docker Hardened Images Helm chart for Apache Airflow
              images:
                - name: airflow
                  ref: dhi/airflow:3.3.2-python3.13-debian13-compat@sha256:9caff9efea23c7e0654e9e733d55a4832598b8ec52378ec5e6ccf08c3bbdbed0
                - name: prometheus-statsd-exporter
                  ref: dhi/prometheus-statsd-exporter:0.31.0-debian13@sha256:eaf3356ef31b713d5408b3460e5a7e8ad2916c387daaee7c12a2df736107580e
                - name: pgbouncer
                  ref: dhi/pgbouncer:1.25.2-debian13@sha256:39a136f73bc1587ef719c1ea59024a7c54ded91efc5e0991826bb5369994a622
                - name: airflow-pgbouncer-exporter
                  ref: dhi/airflow-pgbouncer-exporter:0.21.0-debian13@sha256:0d15dd3ea4182ab809f90423964b653b8b19b8b4cde0d272fb5158f2cbfa6f97
                - name: git-sync
                  ref: dhi/git-sync:4.7.1-debian13@sha256:2a3ae0808e59ae9c742e9533b9d8e7329757181c614fa6b49c1d0574f52de6e9
                - name: redis
                  ref: dhi/redis:8.10.2-debian13-compat@sha256:8477e3456e63d1777b0df44658d8bb93b40ca0d0442df89222bd0ca4612b662f
                - name: opentelemetry-collector
                  ref: dhi/opentelemetry-collector:0.162.0-debian13-contrib@sha256:a65e3c84c9edf1d56fdf3e827288006e8f951974d55168da02337acb88588b9c
              name: airflow-chart
              notes: ${source.dir}/config/NOTES.txt
              sourceUrl: https://github.com/apache/airflow
              updateDependencies: true
            cmd: prepare
            registry: dhi.io
        - name: relocate chart
          uses: helm/rudder@v1
          with:
            cmd: patch
            patches:
              from: ${source.dir}/config
            registry: dhi.io
        - name: patch pgbouncer command
          runs: |
            set -eux -o pipefail

            yq -i '.pgbouncer.command = ["pgbouncer", "/etc/pgbouncer/pgbouncer.ini"]' values.yaml
        - name: lint
          uses: helm/cmd@v1
          with:
            chart: .
            cmd: lint .
        - name: package
          uses: helm/package@v1
          with:
            chart: .
      paths:
        - type: directory
          path: ${source.dir}/config
          uid: 0
          gid: 0
          mode: "0644"
          source: chart/airflow/config
