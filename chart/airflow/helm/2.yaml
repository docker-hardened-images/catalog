# syntax=dhi.io/build:2-helm3

name: Apache Airflow Helm chart 2.x
image: dhi.io/airflow-chart
variant: helm
tags:
  - 2.0.0
platforms:
  - linux/amd64
vars:
  AIRFLOW_REFERENCE: dhi/airflow:3.3.1-python3.13-debian13-compat@sha256:3d4dbe94aede813f013179d2d6483fe3954d15b068bf6f930d822c726744e630
  APPVERSION: 3.3.1
  APPVERSION_MATCH: 3.3.1
  CHART_COMMIT_SHA: 3adbbe1c58e4532df1964cb7794805e763816ee8
  CHART_HELM_NAME: airflow-chart
  DHI_NAMESPACE: dhi
  DHI_PREFIX: ""
  DHI_REGISTRY: dhi.io
  DHI_SKIP_CONTEXT_COPY: "true"
  GIT_SYNC_REFERENCE: dhi/git-sync:4.7.1-debian13@sha256:34c5ff251729d1fd75594a21d2e373551861921f31f7c820f70325a5095a2429
  HELM_VERSION: 4.1.4-2
  OPENTELEMETRY_COLLECTOR_REFERENCE: dhi/opentelemetry-collector:0.160.0-debian13-contrib@sha256:c3ce3613bdd2f995e45ab701a9bb8832191ada3cefd5d20d177d19570fdd3b38
  PGBOUNCER_EXPORTER_REFERENCE: dhi/airflow-pgbouncer-exporter:0.20.0-debian13@sha256:9bde400bfcf02f1cc75b72fb5a98c85aec6f39faafab547d57a4038165a5fe8d
  PGBOUNCER_REFERENCE: dhi/pgbouncer:1.25.2-debian13@sha256:a0ce9df851183e3a045fe2be584adaba1a09a8d0acefda277d2891b255360311
  PROMETHEUS_STATSD_EXPORTER_REFERENCE: dhi/prometheus-statsd-exporter:0.31.0-debian13@sha256:64f56123818ba49230e36d4908cb69c65bbd5d4952aa5c35c4f20d118c42cdab
  REDIS_REFERENCE: dhi/redis:8.10.2-debian13-compat@sha256:5f27df371654299c280c523fcb16d17c54e6df3c1bb0a139679afe524205d72f
  SEMVER_MAJOR_MINOR_VERSION: "2.0"
  SEMVER_MAJOR_VERSION: "2"
  SEMVER_VERSION: 2.0.0
  VERSION: 2.0.0
contents:
  repositories:
    - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
  keyring:
    - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
  builds:
    - name: airflow
      work-dir: ${source.dir}/helm-charts/chart
      contents:
        packages:
          - bash
          - ca-certificates
          - coreutils
          - yq-go
          - helm=4.1.4-2
        files:
          - url: git+https://github.com/apache/airflow.git#3.3.1
            checksum: 3adbbe1c58e4532df1964cb7794805e763816ee8
            path: ${source.dir}/helm-charts
            uid: 0
            gid: 0
      pipeline:
        - name: update chart dependencies
          uses: yq/patch@v1
          with:
            file: Chart.yaml
            patches:
              - del(.dependencies[] | select(.name == "postgresql"))
        - name: prepare chart
          uses: helm/rudder@v1
          with:
            chart:
              appRef: airflow
              dependencies: null
              description: Docker Hardened Images Helm chart for Apache Airflow
              images:
                - name: airflow
                  ref: dhi/airflow:3.3.1-python3.13-debian13-compat@sha256:3d4dbe94aede813f013179d2d6483fe3954d15b068bf6f930d822c726744e630
                - name: prometheus-statsd-exporter
                  ref: dhi/prometheus-statsd-exporter:0.31.0-debian13@sha256:64f56123818ba49230e36d4908cb69c65bbd5d4952aa5c35c4f20d118c42cdab
                - name: pgbouncer
                  ref: dhi/pgbouncer:1.25.2-debian13@sha256:a0ce9df851183e3a045fe2be584adaba1a09a8d0acefda277d2891b255360311
                - name: airflow-pgbouncer-exporter
                  ref: dhi/airflow-pgbouncer-exporter:0.20.0-debian13@sha256:9bde400bfcf02f1cc75b72fb5a98c85aec6f39faafab547d57a4038165a5fe8d
                - name: git-sync
                  ref: dhi/git-sync:4.7.1-debian13@sha256:34c5ff251729d1fd75594a21d2e373551861921f31f7c820f70325a5095a2429
                - name: redis
                  ref: dhi/redis:8.10.2-debian13-compat@sha256:5f27df371654299c280c523fcb16d17c54e6df3c1bb0a139679afe524205d72f
                - name: opentelemetry-collector
                  ref: dhi/opentelemetry-collector:0.160.0-debian13-contrib@sha256:c3ce3613bdd2f995e45ab701a9bb8832191ada3cefd5d20d177d19570fdd3b38
              name: airflow-chart
              notes: ${source.dir}/config/NOTES.txt
              sourceUrl: https://github.com/apache/airflow
              updateDependencies: true
            cmd: prepare
            registry: dhi.io
        - name: relocate chart
          uses: helm/rudder@v1
          with:
            cmd: patch
            patches:
              from: ${source.dir}/config
            registry: dhi.io
        - name: patch pgbouncer command
          runs: |
            set -eux -o pipefail

            yq -i '.pgbouncer.command = ["pgbouncer", "/etc/pgbouncer/pgbouncer.ini"]' values.yaml
        - name: lint
          uses: helm/cmd@v1
          with:
            chart: .
            cmd: lint .
        - name: package
          uses: helm/package@v1
          with:
            chart: .
      paths:
        - type: directory
          path: ${source.dir}/config
          uid: 0
          gid: 0
          mode: "0644"
          source: chart/airflow/config
