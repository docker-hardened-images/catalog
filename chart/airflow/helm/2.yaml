# syntax=dhi.io/build:2-helm3

name: Apache Airflow Helm chart 2.x
image: dhi.io/airflow-chart
variant: helm
tags:
  - 2.0.0
platforms:
  - linux/amd64
vars:
  AIRFLOW_REFERENCE: dhi/airflow:3.4.0-python3.13-debian13-compat@sha256:def64aed1daeede2b28155cb35a438197f8a98e20e38fc6a257199595ba8468d
  APPVERSION: 3.4.0
  APPVERSION_MATCH: 3.4.0
  CHART_COMMIT_SHA: 619a787ac81e8b7c8a9102fc78e3f0b00625d04e
  CHART_HELM_NAME: airflow-chart
  DHI_NAMESPACE: dhi
  DHI_PREFIX: ""
  DHI_REGISTRY: dhi.io
  DHI_SKIP_CONTEXT_COPY: "true"
  GIT_SYNC_REFERENCE: dhi/git-sync:4.8.0-debian13@sha256:902e6d6692148baa4b0e07370f85d5ae7018f9ff62af6457d3853319ce6cb495
  HELM_VERSION: 4.1.4-2
  OPENTELEMETRY_COLLECTOR_REFERENCE: dhi/opentelemetry-collector:0.165.0-debian13-contrib@sha256:9e27e83ec63035a515401e6d028cad9428efb92591f2b97c41e959847c32e34e
  PGBOUNCER_EXPORTER_REFERENCE: dhi/airflow-pgbouncer-exporter:0.21.0-debian13@sha256:19a2764dacee5d4c1a993a83b896769c1b8182d86fec79890bc56f030beefec2
  PGBOUNCER_REFERENCE: dhi/pgbouncer:1.25.2-debian13@sha256:cf5c976298549e336cd8affe3abff987572304e189d43586c36289ca115aa139
  PROMETHEUS_STATSD_EXPORTER_REFERENCE: dhi/prometheus-statsd-exporter:0.31.0-debian13@sha256:45980f2b6838f0053dc2b7bc61c1bcc1dbaef241ccff02f4a1adf38c3ae94d38
  REDIS_REFERENCE: dhi/redis:8.10.3-debian13-compat@sha256:fba5bf91d31ed99b8b8da893e6039ec1c163561c1a2add03a264f1a02dcb4be9
  SEMVER_MAJOR_MINOR_VERSION: "2.0"
  SEMVER_MAJOR_VERSION: "2"
  SEMVER_VERSION: 2.0.0
  VERSION: 2.0.0
contents:
  repositories:
    - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
  keyring:
    - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
  builds:
    - name: airflow
      work-dir: ${source.dir}/helm-charts/chart
      contents:
        packages:
          - bash
          - ca-certificates
          - coreutils
          - yq-go
          - helm=4.1.4-2
        files:
          - url: git+https://github.com/apache/airflow.git#3.4.0
            checksum: 619a787ac81e8b7c8a9102fc78e3f0b00625d04e
            path: ${source.dir}/helm-charts
            uid: 0
            gid: 0
      pipeline:
        - name: update chart dependencies
          uses: yq/patch@v1
          with:
            file: Chart.yaml
            patches:
              - del(.dependencies[] | select(.name == "postgresql"))
        - name: prepare chart
          uses: helm/rudder@v1
          with:
            chart:
              appRef: airflow
              dependencies: null
              description: Docker Hardened Images Helm chart for Apache Airflow
              images:
                - name: airflow
                  ref: dhi/airflow:3.4.0-python3.13-debian13-compat@sha256:def64aed1daeede2b28155cb35a438197f8a98e20e38fc6a257199595ba8468d
                - name: prometheus-statsd-exporter
                  ref: dhi/prometheus-statsd-exporter:0.31.0-debian13@sha256:45980f2b6838f0053dc2b7bc61c1bcc1dbaef241ccff02f4a1adf38c3ae94d38
                - name: pgbouncer
                  ref: dhi/pgbouncer:1.25.2-debian13@sha256:cf5c976298549e336cd8affe3abff987572304e189d43586c36289ca115aa139
                - name: airflow-pgbouncer-exporter
                  ref: dhi/airflow-pgbouncer-exporter:0.21.0-debian13@sha256:19a2764dacee5d4c1a993a83b896769c1b8182d86fec79890bc56f030beefec2
                - name: git-sync
                  ref: dhi/git-sync:4.8.0-debian13@sha256:902e6d6692148baa4b0e07370f85d5ae7018f9ff62af6457d3853319ce6cb495
                - name: redis
                  ref: dhi/redis:8.10.3-debian13-compat@sha256:fba5bf91d31ed99b8b8da893e6039ec1c163561c1a2add03a264f1a02dcb4be9
                - name: opentelemetry-collector
                  ref: dhi/opentelemetry-collector:0.165.0-debian13-contrib@sha256:9e27e83ec63035a515401e6d028cad9428efb92591f2b97c41e959847c32e34e
              name: airflow-chart
              notes: ${source.dir}/config/NOTES.txt
              sourceUrl: https://github.com/apache/airflow
              updateDependencies: true
            cmd: prepare
            registry: dhi.io
        - name: relocate chart
          uses: helm/rudder@v1
          with:
            cmd: patch
            patches:
              from: ${source.dir}/config
            registry: dhi.io
        - name: patch pgbouncer command
          runs: |
            set -eux -o pipefail

            yq -i '.pgbouncer.command = ["pgbouncer", "/etc/pgbouncer/pgbouncer.ini"]' values.yaml
        - name: lint
          uses: helm/cmd@v1
          with:
            chart: .
            cmd: lint .
        - name: package
          uses: helm/package@v1
          with:
            chart: .
      paths:
        - type: directory
          path: ${source.dir}/config
          uid: 0
          gid: 0
          mode: "0644"
          source: chart/airflow/config
