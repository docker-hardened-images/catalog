# syntax=dhi.io/build:2-helm3

name: Apache Airflow Helm chart 2.x
image: dhi.io/airflow-chart
variant: helm
tags:
  - 2.0.0
platforms:
  - linux/amd64
vars:
  AIRFLOW_REFERENCE: dhi/airflow:3.3.1-python3.13-debian13-compat@sha256:395eebf36a261cad2f1edf03fc8da3333b62d80402cb2d591bb0824e187f8311
  APPVERSION: 3.3.1
  APPVERSION_MATCH: 3.3.1
  CHART_COMMIT_SHA: 3adbbe1c58e4532df1964cb7794805e763816ee8
  CHART_HELM_NAME: airflow-chart
  DHI_NAMESPACE: dhi
  DHI_PREFIX: ""
  DHI_REGISTRY: dhi.io
  DHI_SKIP_CONTEXT_COPY: "true"
  GIT_SYNC_REFERENCE: dhi/git-sync:4.7.1-debian13@sha256:f595b2b063e48ab933a9fd532ac3b974955081731f7f051c15def47ffb95f94d
  HELM_VERSION: 4.1.4-2
  OPENTELEMETRY_COLLECTOR_REFERENCE: dhi/opentelemetry-collector:0.159.0-debian13-contrib@sha256:3b8f9d354d9024b8166b089fa0765fe116ad3f0024e3a221324781a9ae74b633
  PGBOUNCER_EXPORTER_REFERENCE: dhi/airflow-pgbouncer-exporter:0.20.0-debian13@sha256:003a2737b55c678ba40dd9df59314acf9e8fd875536cd031ec8193e4e0922c92
  PGBOUNCER_REFERENCE: dhi/pgbouncer:1.25.2-debian13@sha256:6d47b640d7900a28baa1a906356b3e1ed82f22cd22c237ec3255dcacbfae8bd5
  PROMETHEUS_STATSD_EXPORTER_REFERENCE: dhi/prometheus-statsd-exporter:0.31.0-debian13@sha256:dd732c2cae7a9164f2199f75911e1f72998ae7e6fa809ad9b18e3bcb5828695f
  REDIS_REFERENCE: dhi/redis:8.10.1-debian13-compat@sha256:a238154a9719d18887c235cd00212c588f58598dcc97b0190a49e6c1cf42cc57
  SEMVER_MAJOR_MINOR_VERSION: "2.0"
  SEMVER_MAJOR_VERSION: "2"
  SEMVER_VERSION: 2.0.0
  VERSION: 2.0.0
contents:
  repositories:
    - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
  keyring:
    - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
  builds:
    - name: airflow
      work-dir: ${source.dir}/helm-charts/chart
      contents:
        packages:
          - bash
          - ca-certificates
          - coreutils
          - yq-go
          - helm=4.1.4-2
        files:
          - url: git+https://github.com/apache/airflow.git#3.3.1
            checksum: 3adbbe1c58e4532df1964cb7794805e763816ee8
            path: ${source.dir}/helm-charts
            uid: 0
            gid: 0
      pipeline:
        - name: update chart dependencies
          uses: yq/patch@v1
          with:
            file: Chart.yaml
            patches:
              - del(.dependencies[] | select(.name == "postgresql"))
        - name: prepare chart
          uses: helm/rudder@v1
          with:
            chart:
              appRef: airflow
              dependencies: null
              description: Docker Hardened Images Helm chart for Apache Airflow
              images:
                - name: airflow
                  ref: dhi/airflow:3.3.1-python3.13-debian13-compat@sha256:395eebf36a261cad2f1edf03fc8da3333b62d80402cb2d591bb0824e187f8311
                - name: prometheus-statsd-exporter
                  ref: dhi/prometheus-statsd-exporter:0.31.0-debian13@sha256:dd732c2cae7a9164f2199f75911e1f72998ae7e6fa809ad9b18e3bcb5828695f
                - name: pgbouncer
                  ref: dhi/pgbouncer:1.25.2-debian13@sha256:6d47b640d7900a28baa1a906356b3e1ed82f22cd22c237ec3255dcacbfae8bd5
                - name: airflow-pgbouncer-exporter
                  ref: dhi/airflow-pgbouncer-exporter:0.20.0-debian13@sha256:003a2737b55c678ba40dd9df59314acf9e8fd875536cd031ec8193e4e0922c92
                - name: git-sync
                  ref: dhi/git-sync:4.7.1-debian13@sha256:f595b2b063e48ab933a9fd532ac3b974955081731f7f051c15def47ffb95f94d
                - name: redis
                  ref: dhi/redis:8.10.1-debian13-compat@sha256:a238154a9719d18887c235cd00212c588f58598dcc97b0190a49e6c1cf42cc57
                - name: opentelemetry-collector
                  ref: dhi/opentelemetry-collector:0.159.0-debian13-contrib@sha256:3b8f9d354d9024b8166b089fa0765fe116ad3f0024e3a221324781a9ae74b633
              name: airflow-chart
              notes: ${source.dir}/config/NOTES.txt
              sourceUrl: https://github.com/apache/airflow
              updateDependencies: true
            cmd: prepare
            registry: dhi.io
        - name: relocate chart
          uses: helm/rudder@v1
          with:
            cmd: patch
            patches:
              from: ${source.dir}/config
            registry: dhi.io
        - name: patch pgbouncer command
          runs: |
            set -eux -o pipefail

            yq -i '.pgbouncer.command = ["pgbouncer", "/etc/pgbouncer/pgbouncer.ini"]' values.yaml
        - name: lint
          uses: helm/cmd@v1
          with:
            chart: .
            cmd: lint .
        - name: package
          uses: helm/package@v1
          with:
            chart: .
      paths:
        - type: directory
          path: ${source.dir}/config
          uid: 0
          gid: 0
          mode: "0644"
          source: chart/airflow/config
