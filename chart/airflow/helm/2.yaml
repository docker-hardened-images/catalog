# syntax=dhi.io/build:2-helm3

name: Apache Airflow Helm chart 2.x
image: dhi.io/airflow-chart
variant: helm
tags:
  - 2.0.0
platforms:
  - linux/amd64
vars:
  AIRFLOW_REFERENCE: dhi/airflow:3.3.2-python3.13-debian13-compat@sha256:8d3451d19263b36b16e4cf3963d83b27f6ab594d95dbe25b27572eadddbda6ba
  APPVERSION: 3.3.2
  APPVERSION_MATCH: 3.3.2
  CHART_COMMIT_SHA: aa19d2dbb9ed187ec01957a92848d9b005e9ba9d
  CHART_HELM_NAME: airflow-chart
  DHI_NAMESPACE: dhi
  DHI_PREFIX: ""
  DHI_REGISTRY: dhi.io
  DHI_SKIP_CONTEXT_COPY: "true"
  GIT_SYNC_REFERENCE: dhi/git-sync:4.7.1-debian13@sha256:6ab2860ab5eca2cca232b0fdbc683e30c37f13b8902125e1179bf05d4bb92b74
  HELM_VERSION: 4.1.4-2
  OPENTELEMETRY_COLLECTOR_REFERENCE: dhi/opentelemetry-collector:0.164.0-debian13-contrib@sha256:79de5a3a0319b189dfb428d3fa36a39b8d83ee6605e106089ce78153f7f5ac6e
  PGBOUNCER_EXPORTER_REFERENCE: dhi/airflow-pgbouncer-exporter:0.21.0-debian13@sha256:bc9678f6fab25534c769ca702be887ae402eebc8e776c0b926e767e80fa1df93
  PGBOUNCER_REFERENCE: dhi/pgbouncer:1.25.2-debian13@sha256:7dd86b9d5afa89a732aa0af6ba37660b3b34b009d9c74aea03595365e01e5470
  PROMETHEUS_STATSD_EXPORTER_REFERENCE: dhi/prometheus-statsd-exporter:0.31.0-debian13@sha256:1900ac82ec07eb520e2fec4acde7bc2794141e88b2e249394c436bb40309588a
  REDIS_REFERENCE: dhi/redis:8.10.3-debian13-compat@sha256:196871bf0c938059493b127623d3a8e7277340f571407c05c10230c5dd056b78
  SEMVER_MAJOR_MINOR_VERSION: "2.0"
  SEMVER_MAJOR_VERSION: "2"
  SEMVER_VERSION: 2.0.0
  VERSION: 2.0.0
contents:
  repositories:
    - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
  keyring:
    - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
  builds:
    - name: airflow
      work-dir: ${source.dir}/helm-charts/chart
      contents:
        packages:
          - bash
          - ca-certificates
          - coreutils
          - yq-go
          - helm=4.1.4-2
        files:
          - url: git+https://github.com/apache/airflow.git#3.3.2
            checksum: aa19d2dbb9ed187ec01957a92848d9b005e9ba9d
            path: ${source.dir}/helm-charts
            uid: 0
            gid: 0
      pipeline:
        - name: update chart dependencies
          uses: yq/patch@v1
          with:
            file: Chart.yaml
            patches:
              - del(.dependencies[] | select(.name == "postgresql"))
        - name: prepare chart
          uses: helm/rudder@v1
          with:
            chart:
              appRef: airflow
              dependencies: null
              description: Docker Hardened Images Helm chart for Apache Airflow
              images:
                - name: airflow
                  ref: dhi/airflow:3.3.2-python3.13-debian13-compat@sha256:8d3451d19263b36b16e4cf3963d83b27f6ab594d95dbe25b27572eadddbda6ba
                - name: prometheus-statsd-exporter
                  ref: dhi/prometheus-statsd-exporter:0.31.0-debian13@sha256:1900ac82ec07eb520e2fec4acde7bc2794141e88b2e249394c436bb40309588a
                - name: pgbouncer
                  ref: dhi/pgbouncer:1.25.2-debian13@sha256:7dd86b9d5afa89a732aa0af6ba37660b3b34b009d9c74aea03595365e01e5470
                - name: airflow-pgbouncer-exporter
                  ref: dhi/airflow-pgbouncer-exporter:0.21.0-debian13@sha256:bc9678f6fab25534c769ca702be887ae402eebc8e776c0b926e767e80fa1df93
                - name: git-sync
                  ref: dhi/git-sync:4.7.1-debian13@sha256:6ab2860ab5eca2cca232b0fdbc683e30c37f13b8902125e1179bf05d4bb92b74
                - name: redis
                  ref: dhi/redis:8.10.3-debian13-compat@sha256:196871bf0c938059493b127623d3a8e7277340f571407c05c10230c5dd056b78
                - name: opentelemetry-collector
                  ref: dhi/opentelemetry-collector:0.164.0-debian13-contrib@sha256:79de5a3a0319b189dfb428d3fa36a39b8d83ee6605e106089ce78153f7f5ac6e
              name: airflow-chart
              notes: ${source.dir}/config/NOTES.txt
              sourceUrl: https://github.com/apache/airflow
              updateDependencies: true
            cmd: prepare
            registry: dhi.io
        - name: relocate chart
          uses: helm/rudder@v1
          with:
            cmd: patch
            patches:
              from: ${source.dir}/config
            registry: dhi.io
        - name: patch pgbouncer command
          runs: |
            set -eux -o pipefail

            yq -i '.pgbouncer.command = ["pgbouncer", "/etc/pgbouncer/pgbouncer.ini"]' values.yaml
        - name: lint
          uses: helm/cmd@v1
          with:
            chart: .
            cmd: lint .
        - name: package
          uses: helm/package@v1
          with:
            chart: .
      paths:
        - type: directory
          path: ${source.dir}/config
          uid: 0
          gid: 0
          mode: "0644"
          source: chart/airflow/config
