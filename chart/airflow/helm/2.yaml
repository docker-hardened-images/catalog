# syntax=dhi.io/build:2-helm3

name: Apache Airflow Helm chart 2.x
image: dhi.io/airflow-chart
variant: helm
tags:
  - 2.0.0
platforms:
  - linux/amd64
vars:
  AIRFLOW_REFERENCE: dhi/airflow:3.4.0-python3.13-debian13-compat@sha256:baa717a69e676cf56c5b0246403fc75cbb1d8490f7a3abbedd4221bd4a707f7a
  APPVERSION: 3.4.0
  APPVERSION_MATCH: 3.4.0
  CHART_COMMIT_SHA: 619a787ac81e8b7c8a9102fc78e3f0b00625d04e
  CHART_HELM_NAME: airflow-chart
  DHI_NAMESPACE: dhi
  DHI_PREFIX: ""
  DHI_REGISTRY: dhi.io
  DHI_SKIP_CONTEXT_COPY: "true"
  GIT_SYNC_REFERENCE: dhi/git-sync:4.8.0-debian13@sha256:11d199d01db7e5aab7774271367b295480d640bf4cdf5b17828102fdc779ad55
  HELM_VERSION: 4.1.4-2
  OPENTELEMETRY_COLLECTOR_REFERENCE: dhi/opentelemetry-collector:0.165.0-debian13-contrib@sha256:631c603ff296ceb532ae48426deb29a182a970c944eac2e80c062fc08fab0d33
  PGBOUNCER_EXPORTER_REFERENCE: dhi/airflow-pgbouncer-exporter:0.21.0-debian13@sha256:ba4b11bc498e662138d4b6c17dfcd55885bc8ef0d823e203e068b7dc8476fe0e
  PGBOUNCER_REFERENCE: dhi/pgbouncer:1.25.2-debian13@sha256:5f334042eb6f51b8b308455c32d52b5d2c591f392134f232df009fd3721fecbf
  PROMETHEUS_STATSD_EXPORTER_REFERENCE: dhi/prometheus-statsd-exporter:0.31.0-debian13@sha256:4bb805c83a583ac2059fb5e89a29df45e39b69941f65457064b9ed0657a4c2cb
  REDIS_REFERENCE: dhi/redis:8.10.3-debian13-compat@sha256:c58e073a534d7ed4c7ef96c087c03fe8bb56adad4e3629cdaac910c3bb072ffc
  SEMVER_MAJOR_MINOR_VERSION: "2.0"
  SEMVER_MAJOR_VERSION: "2"
  SEMVER_VERSION: 2.0.0
  VERSION: 2.0.0
contents:
  repositories:
    - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
  keyring:
    - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
  builds:
    - name: airflow
      work-dir: ${source.dir}/helm-charts/chart
      contents:
        packages:
          - bash
          - ca-certificates
          - coreutils
          - yq-go
          - helm=4.1.4-2
        files:
          - url: git+https://github.com/apache/airflow.git#3.4.0
            checksum: 619a787ac81e8b7c8a9102fc78e3f0b00625d04e
            path: ${source.dir}/helm-charts
            uid: 0
            gid: 0
      pipeline:
        - name: update chart dependencies
          uses: yq/patch@v1
          with:
            file: Chart.yaml
            patches:
              - del(.dependencies[] | select(.name == "postgresql"))
        - name: prepare chart
          uses: helm/rudder@v1
          with:
            chart:
              appRef: airflow
              dependencies: null
              description: Docker Hardened Images Helm chart for Apache Airflow
              images:
                - name: airflow
                  ref: dhi/airflow:3.4.0-python3.13-debian13-compat@sha256:baa717a69e676cf56c5b0246403fc75cbb1d8490f7a3abbedd4221bd4a707f7a
                - name: prometheus-statsd-exporter
                  ref: dhi/prometheus-statsd-exporter:0.31.0-debian13@sha256:4bb805c83a583ac2059fb5e89a29df45e39b69941f65457064b9ed0657a4c2cb
                - name: pgbouncer
                  ref: dhi/pgbouncer:1.25.2-debian13@sha256:5f334042eb6f51b8b308455c32d52b5d2c591f392134f232df009fd3721fecbf
                - name: airflow-pgbouncer-exporter
                  ref: dhi/airflow-pgbouncer-exporter:0.21.0-debian13@sha256:ba4b11bc498e662138d4b6c17dfcd55885bc8ef0d823e203e068b7dc8476fe0e
                - name: git-sync
                  ref: dhi/git-sync:4.8.0-debian13@sha256:11d199d01db7e5aab7774271367b295480d640bf4cdf5b17828102fdc779ad55
                - name: redis
                  ref: dhi/redis:8.10.3-debian13-compat@sha256:c58e073a534d7ed4c7ef96c087c03fe8bb56adad4e3629cdaac910c3bb072ffc
                - name: opentelemetry-collector
                  ref: dhi/opentelemetry-collector:0.165.0-debian13-contrib@sha256:631c603ff296ceb532ae48426deb29a182a970c944eac2e80c062fc08fab0d33
              name: airflow-chart
              notes: ${source.dir}/config/NOTES.txt
              sourceUrl: https://github.com/apache/airflow
              updateDependencies: true
            cmd: prepare
            registry: dhi.io
        - name: relocate chart
          uses: helm/rudder@v1
          with:
            cmd: patch
            patches:
              from: ${source.dir}/config
            registry: dhi.io
        - name: patch pgbouncer command
          runs: |
            set -eux -o pipefail

            yq -i '.pgbouncer.command = ["pgbouncer", "/etc/pgbouncer/pgbouncer.ini"]' values.yaml
        - name: lint
          uses: helm/cmd@v1
          with:
            chart: .
            cmd: lint .
        - name: package
          uses: helm/package@v1
          with:
            chart: .
      paths:
        - type: directory
          path: ${source.dir}/config
          uid: 0
          gid: 0
          mode: "0644"
          source: chart/airflow/config
