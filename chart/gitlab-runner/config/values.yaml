image:
  registry: ${gitlab-runner.registry}
  image: ${gitlab-runner.repository}
  tag: ${gitlab-runner.tag}@${gitlab-runner.digest}

# The hardened runner image runs as uid/gid 65532 (upstream alpine runs as 100/65533).
podSecurityContext:
  runAsUser: 65532
  fsGroup: 65532

# Pin the job-pod images the runner pulls at job time to hardened images: the helper
# defaults to registry.gitlab.com otherwise, and the default job image to docker.io alpine.
runners:
  config: |
    [[runners]]
      [runners.kubernetes]
        namespace = "{{ default .Release.Namespace .Values.runners.jobNamespace }}"
        image = "${busybox.registry}/${busybox.repository}:${busybox.tag}@${busybox.digest}"
        helper_image = "${gitlab-runner-helper.registry}/${gitlab-runner-helper.repository}:${gitlab-runner-helper.tag}@${gitlab-runner-helper.digest}"
