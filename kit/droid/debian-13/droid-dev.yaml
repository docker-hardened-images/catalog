schemaVersion: '3'
displayName: Droid
description: Droid CLI by Factory, an agentic coding CLI.
kind: workload
version: ${{ kit.args.version }}
args:
  version:
    required: true
    pattern: ^[0-9]+\.[0-9]+\.[0-9]+$
    description: Factory Droid release carried by the image
    buildArg: VERSION
provides:
  - droid@${{ kit.args.version }}
providesFrom:
  bash: /usr/bin/bash
  curl: /usr/bin/curl
  wget: /usr/bin/wget
  git: /usr/bin/git
  jq: /usr/bin/jq
  make: /usr/bin/make
  unzip: /usr/bin/unzip
  ssh: /usr/bin/ssh
  gpg: /usr/bin/gpg
  ripgrep: /usr/bin/rg
  docker: /usr/bin/docker
  docker-engine: /usr/bin/dockerd
  docker-compose: /usr/libexec/docker/cli-plugins/docker-compose
  docker-buildx: /usr/libexec/docker/cli-plugins/docker-buildx
capabilities:
  - type: com.docker.sandbox/sbx@1
  - type: com.docker.sandbox/network-policy@1
    config:
      runtime:
        allow:
          - api.factory.ai:443
          - app.factory.ai:443
          - relay.factory.ai:443
          - api.workos.com:443
          - downloads.factory.ai:443
          - deb.debian.org:80
          - dhi.io:80
  - type: com.docker.sandbox/credential@1
    description: Factory API access for Droid (API key or WorkOS OAuth)
    config:
      service: droid
      phase: runtime
      apiKey:
        name: FACTORY_API_KEY
        inject:
          - domain: api.factory.ai
            header: Authorization
            format: Bearer %s
          - domain: app.factory.ai
            header: Authorization
            format: Bearer %s
          - domain: relay.factory.ai
            header: Authorization
            format: Bearer %s
        proxyManaged: true
      oauth:
        tokenEndpoint:
          host: api.workos.com
          path: /user_management/authenticate
        sentinels:
          accessToken: droid-oat-proxy-managed
          refreshToken: droid-ort-proxy-managed
    optional: true
  - type: com.docker.sandbox/lifecycle@1
    config:
      install:
        - command: mkdir -p /home/agent/.factory && chown agent:agent /home/agent/.factory
          user: '0'
          description: Ensure .factory is owned by agent before bind mounts run
  - type: com.docker.sandbox/agent-context@1
    config:
      filename: AGENTS.md
      content: |
        Factory Droid is installed as `droid`. Authentication and network access follow this Kit's capability declarations.
    optional: true
  - type: com.docker.sandbox/agent-context@2
    config:
      filename: AGENTS.md
      content: |
        Factory Droid is installed as `droid`. Authentication and network access follow this Kit's capability declarations.
    optional: true
  - type: com.docker.sandbox/agent-sessions@1
    optional: true
    config:
      prompt:
        - exec
        - --skip-permissions-unsafe
        - --
        - '{{.Prompt}}'
  - type: com.docker.sandbox/agent-interactive-sessions@1
    optional: true
    config:
      prompt:
        - --
        - '{{.Prompt}}'
      continue:
        - --resume
        - --last
      resume:
        - --resume
        - '{{.SessionID}}'
      sessionPicker:
        - --resume
  - type: com.docker.sandbox/acp@1
    optional: true
    config:
      agent: droid
      command:
        - droid
        - exec
        - --output-format
        - acp
licenses:
  - LicenseRef-Proprietary
