schemaVersion: '3'
displayName: Kiro
description: Kiro CLI by AWS. Run kiro-cli login before starting chat.
kind: workload
version: ${{ kit.args.version }}
provides:
  - kiro@${{ kit.args.version }}
providesFrom:
  bash: /usr/bin/bash
  curl: /usr/bin/curl
  wget: /usr/bin/wget
  git: /usr/bin/git
  jq: /usr/bin/jq
  make: /usr/bin/make
  unzip: /usr/bin/unzip
  ssh: /usr/bin/ssh
  gpg: /usr/bin/gpg
  ripgrep: /usr/bin/rg
  docker: /usr/bin/docker
  docker-engine: /usr/bin/dockerd
  docker-compose: /usr/libexec/docker/cli-plugins/docker-compose
  docker-buildx: /usr/libexec/docker/cli-plugins/docker-buildx
capabilities:
  - type: com.docker.sandbox/sbx@1
  - type: com.docker.sandbox/network-policy@1
    config:
      runtime:
        allow:
          - cli.kiro.dev:443
          - prod.download.cli.kiro.dev:443
          - kiro.dev:443
          - client-telemetry.us-east-1.amazonaws.com:443
          - cognito-identity.us-east-1.amazonaws.com:443
          - desktop-release.q.us-east-1.amazonaws.com:443
          - management.us-east-1.kiro.dev:443
          - oidc.us-east-1.amazonaws.com:443
          - prod.us-east-1.auth.desktop.kiro.dev:443
          - prod.us-east-1.telemetry-v2.kiro.dev:443
          - runtime.us-east-1.kiro.dev:443
          - q.us-east-1.amazonaws.com:443
          - view.awsapps.com:443
          - deb.debian.org:80
          - dhi.io:80
  - type: com.docker.sandbox/lifecycle@1
    config:
      install:
        - command: kiro-cli settings list > /dev/null
          user: agent
          description: Create Kiro CLI's state database
      startup:
        - command:
            - sh
            - -c
            - |
              set -e
              [ -n "$MCP_GATEWAY_URL" ] || exit 0
              mkdir -p "$HOME/.kiro/settings"
              cat > "$HOME/.kiro/settings/mcp.json" <<EOF
              {
                "mcpServers": {
                  "mcp-gateway": {
                    "url": "$MCP_GATEWAY_URL",
                    "headers": {
                      "Authorization": "Bearer $MCP_SENTINEL_TOKEN_NAME"
                    }
                  }
                }
              }
              EOF
          user: agent
          env:
            - MCP_GATEWAY_URL
            - MCP_SENTINEL_TOKEN_NAME
          description: Register the sandbox MCP gateway in ~/.kiro/settings/mcp.json
  - type: com.docker.sandbox/agent-context@1
    config:
      filename: KIRO.md
      content: |
        Kiro CLI is installed as `kiro-cli`. Authentication and network access follow this Kit's capability declarations.
    optional: true
  - type: com.docker.sandbox/agent-context@2
    config:
      filename: KIRO.md
      content: |
        Kiro CLI is installed as `kiro-cli`. Authentication and network access follow this Kit's capability declarations.
    optional: true
  - type: com.docker.sandbox/acp@1
    optional: true
    config:
      agent: kiro
      command:
        - kiro-cli
        - acp
licenses:
  - LicenseRef-Proprietary
args:
  version:
    required: true
    pattern: ^[0-9]+\.[0-9]+\.[0-9]+$
    description: Kiro CLI release carried by the image
    buildArg: VERSION
