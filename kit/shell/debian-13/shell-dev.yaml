schemaVersion: "3"
displayName: Shell
description: >-
  A plain shell sandbox on DHI: bash, git, apt, a Docker engine with compose and buildx that sbx starts automatically, plus common CLI tooling (curl, gh, jq, make) and Python with pip and uv. The base workload agent mixins layer onto; it ships no agent and declares no credentials.
licenses: [Apache-2.0]
kind: workload
version: "1.1.0"
capabilities:
  - type: com.docker.sandbox/sbx@1
  - type: com.docker.sandbox/agent-context@1
    optional: true
    config: &agent-context
      filename: AGENTS.md
      content: |
        This is a plain shell sandbox on DHI: bash, git, apt, a Docker
        engine (compose/buildx) that sbx starts for you, curl, gh, jq,
        make, and Python 3 with pip and uv. This kit ships no network
        policy of its own: outbound access, including the apt sources
        (deb.debian.org, dhi.io), is whatever the sandbox policy and
        composed kits allow. Install more with apt where that permits;
        composed kits list their own capabilities below.
  - type: com.docker.sandbox/agent-context@2
    optional: true
    config: *agent-context
