schemaVersion: '3'
displayName: Docker Agent
description: Docker Agent coding workload with proxy-managed provider credentials and scoped egress.
sourceUrl: https://github.com/docker/docker-agent
version: ${{ kit.args.version }}
kind: workload
provides:
  - docker-agent@${{ kit.args.version }}
providesFrom:
  bash: /usr/bin/bash
  curl: /usr/bin/curl
  wget: /usr/bin/wget
  git: /usr/bin/git
  jq: /usr/bin/jq
  make: /usr/bin/make
  unzip: /usr/bin/unzip
  ssh: /usr/bin/ssh
  gpg: /usr/bin/gpg
  ripgrep: /usr/bin/rg
  docker: /usr/bin/docker
  docker-engine: /usr/bin/dockerd
  docker-compose: /usr/libexec/docker/cli-plugins/docker-compose
  docker-buildx: /usr/libexec/docker/cli-plugins/docker-buildx
capabilities:
  - type: com.docker.sandbox/sbx@1
  - type: com.docker.sandbox/network-policy@1
    config:
      runtime:
        allow:
          - api.anthropic.com:443
          - claude.ai:443
          - console.anthropic.com:443
          - api.business.githubcopilot.com:443
          - api.enterprise.githubcopilot.com:443
          - api.github.com:443
          - api.githubcopilot.com:443
          - api.individual.githubcopilot.com:443
          - copilot.github.com:443
          - github.com:443
          - raw.githubusercontent.com:443
          - aiplatform.googleapis.com:443
          - generativelanguage.googleapis.com:443
          - oauth2.googleapis.com:443
          - vertexai.googleapis.com:443
          - api.mistral.ai:443
          - api.studio.nebius.com:443
          - api.openai.com:443
          - openrouter.ai:443
          - api.x.ai:443
          - deb.debian.org:80
          - dhi.io:80
          - objects.githubusercontent.com:443
          - models.dev:443
  - type: com.docker.sandbox/credential@1
    optional: true
    description: Anthropic API access
    config:
      service: anthropic
      phase: runtime
      apiKey:
        name: ANTHROPIC_API_KEY
        proxyManaged: true
        inject:
          - domain: api.anthropic.com
            header: x-api-key
            format: '%s'
          - domain: claude.ai
            header: x-api-key
            format: '%s'
          - domain: console.anthropic.com
            header: x-api-key
            format: '%s'
  - type: com.docker.sandbox/credential@1
    optional: true
    description: GitHub and Copilot access
    config:
      service: github
      phase: runtime
      apiKey:
        name: GITHUB_TOKEN
        proxyManaged: true
        inject:
          - domain: api.business.githubcopilot.com
            header: Authorization
            format: Bearer %s
          - domain: api.enterprise.githubcopilot.com
            header: Authorization
            format: Bearer %s
          - domain: api.github.com
            header: Authorization
            format: Bearer %s
          - domain: api.githubcopilot.com
            header: Authorization
            format: Bearer %s
          - domain: api.individual.githubcopilot.com
            header: Authorization
            format: Bearer %s
          - domain: copilot.github.com
            header: Authorization
            format: Bearer %s
          - domain: github.com
            header: Authorization
            format: Bearer %s
          - domain: raw.githubusercontent.com
            header: Authorization
            format: Bearer %s
  - type: com.docker.sandbox/credential@1
    optional: true
    description: Google AI API access
    config:
      service: google
      phase: runtime
      apiKey:
        name: GOOGLE_API_KEY
        proxyManaged: true
        inject:
          - domain: aiplatform.googleapis.com
            header: x-goog-api-key
            format: '%s'
          - domain: generativelanguage.googleapis.com
            header: x-goog-api-key
            format: '%s'
          - domain: oauth2.googleapis.com
            header: x-goog-api-key
            format: '%s'
          - domain: vertexai.googleapis.com
            header: x-goog-api-key
            format: '%s'
  - type: com.docker.sandbox/credential@1
    optional: true
    description: Mistral API access
    config:
      service: mistral
      phase: runtime
      apiKey:
        name: MISTRAL_API_KEY
        proxyManaged: true
        inject:
          - domain: api.mistral.ai
            header: Authorization
            format: Bearer %s
  - type: com.docker.sandbox/credential@1
    optional: true
    description: Nebius API access
    config:
      service: nebius
      phase: runtime
      apiKey:
        name: NEBIUS_API_KEY
        proxyManaged: true
        inject:
          - domain: api.studio.nebius.com
            header: Authorization
            format: Bearer %s
  - type: com.docker.sandbox/credential@1
    optional: true
    description: OpenAI API access
    config:
      service: openai
      phase: runtime
      apiKey:
        name: OPENAI_API_KEY
        proxyManaged: true
        inject:
          - domain: api.openai.com
            header: Authorization
            format: Bearer %s
  - type: com.docker.sandbox/credential@1
    optional: true
    description: OpenRouter API access
    config:
      service: openrouter
      phase: runtime
      apiKey:
        name: OPENROUTER_API_KEY
        proxyManaged: true
        inject:
          - domain: openrouter.ai
            header: Authorization
            format: Bearer %s
  - type: com.docker.sandbox/credential@1
    optional: true
    description: xAI API access
    config:
      service: xai
      phase: runtime
      apiKey:
        name: XAI_API_KEY
        proxyManaged: true
        inject:
          - domain: api.x.ai
            header: Authorization
            format: Bearer %s
  - type: com.docker.sandbox/agent-context@1
    optional: true
    config:
      filename: AGENTS.md
      directory: /home/agent
      content: |
        # Docker Agent

        This sandbox runs Docker Agent, a multi-provider coding agent. Every
        provider key is proxy-managed: the values in the environment are
        sentinels the egress proxy swaps at each provider's endpoints.
  - type: com.docker.sandbox/agent-context@2
    optional: true
    config:
      filename: AGENTS.md
      directory: /home/agent
      content: |
        # Docker Agent

        This sandbox runs Docker Agent, a multi-provider coding agent. Every
        provider key is proxy-managed: the values in the environment are
        sentinels the egress proxy swaps at each provider's endpoints.
  - type: com.docker.sandbox/agent-sessions@1
    optional: true
    config:
      prompt:
        - --exec
        - default
        - '{{.Prompt}}'
  - type: com.docker.sandbox/agent-interactive-sessions@1
    optional: true
    config:
      newSession:
        - --agent-picker
      resume:
        - --session
        - '{{.SessionID}}'
      continue:
        - --session
        - '-1'
  - type: com.docker.sandbox/lifecycle@1
    config:
      interactive:
        - --agent-picker
  - type: com.docker.sandbox/dockerd@1
    optional: true
  - type: com.docker.sandbox/acp@1
    optional: true
    config:
      agent: docker-agent
      command:
        - docker-agent
        - serve
        - acp
        - default
licenses:
  - Apache-2.0
args:
  version:
    required: true
    pattern: ^[0-9]+\.[0-9]+\.[0-9]+$
    description: Docker Agent release the image carries
    buildArg: VERSION
